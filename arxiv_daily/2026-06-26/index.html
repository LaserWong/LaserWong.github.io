ponse.", "url": "https://arxiv.org/abs/2606.27241", "type": "理论", "summary": "1. 该工作研究了闵氏时空上SO(1,3)约化杨-米尔斯理论中光锥奇异性对应的自洽源，通过光锥完成构造获得守恒且无迹的源。\n2. 其卖点在于发现位移奇异支撑到双曲面无法同时保持守恒与无迹，而光锥上的匹配条件将补充固定为单一参数χ，该参数具有未来与过去光锥相对权重的因果解释。\n3. 这一完成源在正则等时片上总四动量为零，其物理内容表现为残余因果荷，对理解时空对称性与规范理论中奇点构建的因果内涵提供了思路。", "summary_source": "deepseek", "authors": [{"name": "Kaushlendra Kumar"}], "featured_authors": [{"name": "Kaushlendra Kumar"}], "author_count": 1}, {"id": "2606.27308", "category": "hep-th", "title": "Universal Lichnerowicz Lifting of Near-Horizon Soft Modes", "abstract": "A remarkable universality appears in the low-temperature quantum thermodynamics of near-extremal black holes, where distinct parent geometries often lead to the same logarithmic temperature dependence at one loop. In this work, we study the Lichnerowicz spectral origin of this infrared universality and understand why the relevant spectral data become insensitive to the details of the parent geometry. For extremal near-horizon geometries containing a two-dimensional maximally symmetric throat, we construct the normalizable transverse-traceless tensor zero modes associated with near-horizon reparametrizations. Turning on a small temperature lifts these zero modes through the first-order deformation of the Lichnerowicz operator. Although the local matrix element depends on detailed parent-geometry data, these data cancel after projection onto normalized tensor modes, leaving the universal result. For static spherically symmetric backgrounds, the eigenvalue shift is universally proportional to the Fourier mode number and temperature, and the same structure persists for rotating backgrounds, where angular warp factors only modify the overall projection factor. We further show that this lifted bulk spectrum is the Lichnerowicz realization of the Schwarzian soft sector. Thus, the universal first-order result is traced to an infrared bulk-boundary matching between near-horizon tensor zero modes and boundary reparametrization dynamics.", "url": "https://arxiv.org/abs/2606.27308", "type": "理论", "summary": "1. 该工作研究了近极端黑洞近地平线软模的Lichnerowicz提升，揭示了低温柔普适性的谱起源。\n2. 其卖点在于构造横无迹张量零模并经投影消除局域几何细节，得到与温度及傅里叶模数成正比的普适本征值移动。\n3. 这为理解近极端黑洞热力学中Schwarzian软扇区的红外体-边匹配机制提供了明确启发。", "summary_source": "deepseek", "authors": [{"name": "Peng Cheng"}, {"name": "Yu-Qi Liu"}], "featured_authors": [{"name": "Peng Cheng"}, {"name": "Yu-Qi Liu"}], "author_count": 2}, {"id": "2606.27309", "category": "hep-th", "title": "Laplace Space for Cosmological Correlators", "abstract": "Deep inside the horizon, every cosmological mode oscillates as a flat-space plane wave. A Laplace transform turns this fact into a general method: it resolves each curved-space mode into a superposition of plane waves dressed by a kernel that encodes the spacetime geometry, field content and dynamics, collapsing the time integrals onto flat-space ones. This provides simple diagrammatic rules that turn cosmological correlator diagrams into their flat-space counterparts integrated against Laplace-space kernels. On the paradigmatic massive single exchange, this integral representation makes the energy singularities manifest and evaluates in closed form as a single, rapidly convergent series valid throughout the kinematic domain, with no patching of separate expansions. The Laplace approach sheds conceptual and computational light on cosmological correlators in virtually any theory of the early universe.", "url": "https://arxiv.org/abs/2606.27309", "type": "理论", "summary": "1. 该工作提出拉普拉斯空间方法，将宇宙学关联函数映射为平空间平面波叠加。\n2. 其卖点在于积分表示使能量奇点显式化，并给出全域收敛的单一闭式级数。\n3. 这为早期宇宙理论中关联函数的计算提供了概念性和计算性新框架。", "summary_source": "deepseek", "authors": [{"name": "Nathan Belrhali"}, {"name": "Arthur Poisson"}, {"name": "Sébastien Renaux-Petel"}], "featured_authors": [{"name": "Nathan Belrhali"}, {"name": "Arthur Poisson"}, {"name": "Sébastien Renaux-Petel"}], "author_count": 3}, {"id": "2606.27311", "category": "hep-th", "title": "Massive Cosmological Correlators from Flat Space: a Laplace-Space Approach", "abstract": "We develop a new approach to cosmological correlators, built on a simple physical fact: deep inside the Hubble radius every mode oscillates as a flat-space plane wave, the curvature of spacetime making itself felt only as the mode is stretched towards the horizon. A Laplace transform turns this observation into a computational tool, resolving each curved-space mode function into a continuous superposition of plane waves labelled by a dual variable and dressed by a kernel that encodes the spacetime geometry, field content and dynamics. Every time integral then reduces to an elementary flat-space one, yielding simple diagrammatic rules for cosmological correlators. We illustrate the construction on the massive single-exchange correlator. The Laplace representation makes its total- and partial-energy singularities transparent ''from flat space'', and yields a single closed-form, rapidly convergent series valid throughout the entire kinematic domain. Although developed for conformally coupled fields exchanging massive scalars in de Sitter, the approach carries over essentially unchanged to virtually all situations of interest in primordial cosmology.", "url": "https://arxiv.org/abs/2606.27311", "type": "理论", "summary": "1. 该工作发展了一种基于拉普拉斯变换的宇宙学关联函数新方法，将哈勃半径内的模式函数分解为平空间平面波的连续叠加。\n2. 其卖点在于通过核函数编码时空几何与场动力学，使所有时间积分简化为初等平空间积分，并以闭式快速收敛级数揭示质量单交换关联函数的能量奇点结构。\n3. 这为从平空间物理直接理解弯曲时空关联函数提供了自洽框架，并可直接推广至原初宇宙学中的绝大多数实际场景。", "summary_source": "deepseek", "authors": [{"name": "Nathan Belrhali"}, {"name": "Arthur Poisson"}, {"name": "Sébastien Renaux-Petel"}], "featured_authors": [{"name": "Nathan Belrhali"}, {"name": "Arthur Poisson"}, {"name": "Sébastien Renaux-Petel"}], "author_count": 3}, {"id": "2606.27333", "category": "hep-th", "title": "The IKKT renormalization group flow is IIB: toward zero-d holography", "abstract": "Supergravity solutions describing stacks of D$p$-branes with $p\\neq 3$ feature a non-constant dilaton profile, which is holographically mapped to the running of the SYM coupling in $(p+1)$ dimensions. For D-instantons ($p=-1$), the lack of space and time in the IKKT matrix model makes such an interpretation difficult at first. In this letter, we propose a method to achieve this based on two closely related concepts: the IKKT method of integrating out heavy strings in a Coulomb branch vacuum and the matrix RG flow of Brézin and Zinn-Justin (BZJ). The notable difference between the two is that the BZJ RG flow also integrates over the Coulomb branch position. We first apply the Coulomb branch method and by relating the coefficient of the leading correction to the IKKT action with the string coupling, we can compute its dependence on the Coulomb branch position, finding a match between matrix theory and supergravity. Next, we apply the BZJ-flow to the IKKT partition function, which leads to a running of the coupling constant $g$ with the rank $N$ of the matrix model, reproducing the $N$-dependence of the axio-dilaton field in supergravity.", "url": "https://arxiv.org/abs/2606.27333", "type": "理论", "summary": "1. 该工作利用库仑分支积分与Brézin-Zinn-Justin重整化群流，建立IKKT矩阵模型与零维全息对偶间的联系。\n2. 其卖点在于通过矩阵模型中耦合常数随秩N的运行再现超重力中axio-dilaton场的N依赖行为，并实现两者定量匹配。\n3. 这为从矩阵模型出发构建零维全息对偶及理解非临界弦理论提供了明确路径。", "summary_source": "deepseek", "authors": [{"name": "Xiangwen Guan"}, {"name": "Joel Karlsson"}, {"name": "Sébastien Reymond"}, {"name": "Thomas Van Riet"}], "featured_authors": [{"name": "Xiangwen Guan"}, {"name": "Joel Karlsson"}, {"name": "Sébastien Reymond"}, {"name": "Thomas Van Riet"}], "author_count": 4}, {"id": "2606.27360", "category": "hep-th", "title": "Probing Probability Geometry with Schwinger--Dyson Identities: Score Mismatch, Fisher Information, and Configurational Temperature", "abstract": "We develop a geometric interpretation of Schwinger--Dyson identities by showing that their violations are controlled by a single score-mismatch field $\\delta s$. For an arbitrary sampled probability distribution $Q$ and equilibrium measure $P_{\\rm eq}$, every Schwinger--Dyson violation is determined by $\\delta s = \\nabla \\log (Q / P_{\\rm eq})$, which characterizes the departure from equilibrium. Each Schwinger--Dyson identity measures a projection of this field onto a probe direction in configuration space. The relative Fisher information is its squared norm. This gives a universal bound relating Fisher information to the complete Schwinger--Dyson hierarchy, thus implying that convergence in Fisher information restores all Schwinger--Dyson identities. We further obtain a variational characterization of the relative Fisher information in terms of Schwinger--Dyson violations, leading to a natural tomographic interpretation in which increasingly rich families of probe fields encode progressively more information about the underlying probability distortion. The configurational temperature, within this framework, emerges as a distinguished Schwinger--Dyson probe. The Stein operators and score-function methods arise naturally from the same probability-geometric structure. The score-mismatch field, therefore, provides a unified geometric language for understanding Schwinger--Dyson identities, configurational temperature, Fisher information, and non-equilibrium sampling in stochastic processes.", "url": "https://arxiv.org/abs/2606.27360", "type": "理论", "summary": "1. 该工作通过引入得分失配场δs，建立了Schwinger-Dyson恒等式的概率几何诠释。\n2. 核心在于揭示了所有恒等式违反均由δs控制，相对Fisher信息为其模方，并给出了其与完整恒等式层级间的普适界。\n3. 这为构型温度、非平衡采样及变分性质提供了统一的几何语言和探测框架。", "summary_source": "deepseek", "authors": [{"name": "Anosh Joseph"}], "featured_authors": [{"name": "Anosh Joseph"}], "author_count": 1}, {"id": "2606.26149", "category": "math-ph", "title": "On Support Cardinality for Discrete Schrödinger Equation", "abstract": "How sparse can a nontrivial solution of a discrete Schrödinger equation be? In this note we study Dirichlet solutions on a finite $d$-dimensional lattice box, allowing an arbitrary real potential, and measure sparsity by the number of lattice sites at which the solution is nonzero (assuming it is nonzero at the origin). Our main result is a dimension-reduction principle: the minimal possible support size cannot decrease when the dimension increases. Consequently, any lower bound proved in dimension $d-1$ automatically yields the same lower bound in dimension $d$. As an application, we obtain a nearly sharp lower bound in four dimensions, matching the best-known two-dimensional constructions up to a logarithmic factor.", "url": "https://arxiv.org/abs/2606.26149", "type": "理论", "summary": "1. 该工作研究离散薛定谔方程在有限d维晶格盒上非平凡狄利克雷解的最小支持基数，并以原点非零为条件。\n2. 核心发现是维度缩减原理：最小可能支持大小不随维数增加而降低，使低维下界自动拓展至高维。\n3. 由此在四维获得近乎尖锐的下界（仅差对数因子），为解稀疏性约束及安德森局域化研究提供新思路。", "summary_source": "deepseek", "authors": [{"name": "Linjun Li"}], "featured_authors": [{"name": "Linjun Li"}], "author_count": 1}, {"id": "2606.26256", "category": "math-ph", "title": "The Colored Hofstadter Butterfly as a Many-Body Quantum Hall Phase Diagram", "abstract": "We prove that the colored Hofstadter butterfly has a many-body interpretation for a broad class of weakly interacting lattice fermion systems. Starting from a spectral gap of a Hofstadter-like one-particle Hamiltonian at arbitrary magnetic flux $b$, we construct an open region in the three-dimensional parameter space $(b,\\mu,\\lambda)$ of magnetic field, chemical potential, and interaction strength on which the infinite-volume interacting system has locally unique gapped ground states. The construction combines quasi-adiabatic continuation in the interaction strength with denominator-independent magnetic perturbation estimates, and therefore covers both commensurate and incommensurate fluxes, where no finite magnetic unit cell exists. On connected uniformly gapped regions meeting the non-interacting plane $\\lambda=0$, we prove a many-body gap-labeling theorem: the Hall conductivity appearing in the macroscopic Ohm's law is constant and quantized, satisfying $2\\pi\\sigma^{\\mathrm{H}}\\in\\mathbb{Z}$. Thus the integer colors of the non-interacting Hofstadter butterfly persist as Hall-conductivity labels of interacting quantum Hall phases.", "url": "https://arxiv.org/abs/2606.26256", "type": "理论", "summary": "1. 该工作证明了弱相互作用格点费米子体系中彩色Hofstadter蝴蝶图具有多体量子霍尔相图解释。\n2. 其技术关键在于结合准绝热延拓与分母无关磁扰动估计，在任意通量（含不可公度通量）下构造出均匀有隙区域。\n3. 这为相互作用下霍尔电导的量子化与整数填充偏移律提供了严格证明，并将非相互作用蝴蝶图推广为多体相标识。", "summary_source": "deepseek", "authors": [{"name": "Giovanna Marcelli"}, {"name": "Tadahiro Miyao"}, {"name": "Domenico Monaco"}, {"name": "Stefan Teufel"}, {"name": "Marius Wesle"}], "featured_authors": [{"name": "Giovanna Marcelli"}, {"name": "Tadahiro Miyao"}, {"name": "Domenico Monaco"}, {"name": "Stefan Teufel"}, {"name": "Marius Wesle"}], "author_count": 5}, {"id": "2606.26388", "category": "math-ph", "title": "A new formulation of metriplectic dynamics with an application to quasigeostrophic ocean modeling with advected quantities", "abstract": "A general formulation of metriplectic dynamics is presented, where the metriplectic four-bracket is constructed by multiplying two skew-symmetric brackets. The new formulation is then used to introduce irreversibility in a generalized two-dimensional (2D) quasigeostrophic (QG) upper-ocean model involving advected quantities, with the thermal QG model as a special case. By construction, the resulting dynamics ensure the conservation of internal energy and the generation of entropy, in accordance with the first and second laws of thermodynamics. Our metriplectic dynamics formulation allows for a flexible specification of irreversibility, ranging from a type that results in nearly material conservation of potential vorticity to the representation of realistic forcing and dissipation in 2D QG ocean modeling with advected quantities.", "url": "https://arxiv.org/abs/2606.26388", "type": "理论", "summary": "1. 该工作提出通过两个反对称括号相乘构造度量‑辛四括号的新公式，并将其用于含平流量的二维准地转海洋模型中引入不可逆性。\n2. 其核心优势在于新公式使系统严格遵守第一、第二定律，且能灵活调控耗散形式，从位势涡度近物质守恒至真实强迫与耗散。\n3. 这为含平流量的准地转海洋建模提供了一种保证热力学一致性的通用不可逆框架，并可推广至其他需守恒与熵增并存的连续系统。", "summary_source": "deepseek", "authors": [{"name": "Francisco J. Beron-Vera"}, {"name": "Erwin Luesink"}], "featured_authors": [{"name": "Francisco J. Beron-Vera"}, {"name": "Erwin Luesink"}], "author_count": 2}, {"id": "2606.26637", "category": "math-ph", "title": "Weak-Strong Resurgence Duality", "abstract": "We show that there is an explicit resurgent duality between weak and strong coupling expansions when one of the expansions has zero radius of convergence and the other has infinite radius of convergence. This complements the situation where the convergent expansion has finite radius of convergence, or when both expansions have zero radius of convergence. We illustrate this phenomenon for the Airy and Pearcey catastrophe integrals, and we apply it to two physical examples: the weak and strong coupling expansions of Dyson-Schwinger equations in zero-dimensional scalar $\\phi^4$ theories, and the short and long time expansions of the heat kernel trace for the fluctuation operator of the kink-antikink crystal saddle configuration in the Gross-Neveu model.", "url": "https://arxiv.org/abs/2606.26637", "type": "理论", "summary": "1. 本文证明了当弱耦合展开收敛半径为零而强耦合展开收敛半径为无穷大（或反之）时，两者之间存在显式的重整化对偶关系，并通过Airy与Pearcey尖点积分阐明了这一结构。\n2. 其核心卖点在于揭示了零收敛半径与无穷大收敛半径展开间的精确对应规律，并具体适用于零维φ⁴理论Dyson-Schwinger方程的弱-强耦合级数以及Gross-Neveu模型中热核迹的短-长时间展开。\n3. 该对偶性为处理发散级数与收敛级数间的解析延拓提供了系统框架，有望启发量子场论中更多实例的强-弱耦合对偶关系的严格构建。", "summary_source": "deepseek", "authors": [{"name": "Gerald V. Dunne"}, {"name": "Ayssar I. Farah"}], "featured_authors": [{"name": "Gerald V. Dunne"}, {"name": "Ayssar I. Farah"}], "author_count": 2}, {"id": "2606.26915", "category": "math-ph", "title": "Wave-Particle Decomposition for Kinetic Equations I: Theory and Numerics", "abstract": "This paper presents a wave-particle decomposition (WPD) for kinetic relaxation equations, formulated around a local evolution timescale and its associated kinetic horizon. By leveraging the characteristic integral solution, we decompose the distribution function into an analytically accumulated wave component and a purely kinetic particle component. The latter is defined by the collisionless transport that survives beyond a prescribed local domain of influence, termed the horizon. This continuous formulation yields a unified wave-particle system valid across the entire Knudsen spectrum, comprising a source-free total conservation law, a wave equation, and a particle equation. The wave operator admits a Chapman--Enskog expansion, whose moments yield Euler and Navier--Stokes fluxes with horizon-dependent coefficients, while the particle equation governs the remaining non-equilibrium kinetic transport. At the algorithmic level, this system is discretized by a conservative macro-micro method. The total conservative variables are advanced by a finite-volume update using the sum of a Navier--Stokes gas-kinetic wave flux and a particle flux computed by either a deterministic discrete-ordinate $(S_N)$ method or a Monte Carlo representation. Unlike the global time-step splitting in the unified gas-kinetic wave-particle (UGKWP) method, the present partition is defined at the PDE level and governed by the local ratio of evolution timescale to relaxation time. The particle component is therefore a fractional kinetic population generated by the collisionless factor of the integral solution. Formal analysis establishes the asymptotic-preserving continuum limit, rarefied-regime consistency, and regime-adaptive scaling of active kinetic degrees of freedom. Numerical tests in one, two, and three dimensions validate the accuracy, multiscale capability, and efficiency of the framework.", "url": "https://arxiv.org/abs/2606.26915", "type": "理论", "summary": "1. 本文提出一种波粒分解方法，将动理学松弛方程的分布函数划分为由特性积分解析累积的波分量与碰撞输运超出局部视界的粒子分量。\n2. 该分解在PDE层面由演化时间尺度与弛豫时间的比率定义，导出统一波粒系统，其波动算子经Chapman–Enskog展开得到含视界系数的Euler与Navier–Stokes通量。\n3. 基于保守宏观-微观离散，该方法兼具渐近保持连续极限与稀薄区一致性，并实现动理学自由度的自适应缩放，为多尺度模拟提供高效框架。", "summary_source": "deepseek", "authors": [{"name": "Chang Liu"}, {"name": "Kun Xu"}], "featured_authors": [{"name": "Chang Liu"}, {"name": "Kun Xu"}], "author_count": 2}, {"id": "2606.26962", "category": "math-ph", "title": "Asymptotic solutions: glancing trajectories, Lagrangian singularities, and Bessel cylinders", "abstract": "We find a normal form for the simplest Lagrangian singularity appearing as the projection onto the space-energy of a solution to the Hamilton-Jacobi equation. Using this normal form we approximate asymptotic solutions of an equation $(\\widehat{H}-E_0) \\, u_h = f_h$ with a semiclassical distribution $f_h$ microlocalized on a Lagrangian manifold $\\Lambda_0$ when $E_0$ is a critical value of the restriction $H|_{\\Lambda_0}$.", "url": "https://arxiv.org/abs/2606.26962", "type": "理论", "summary": "1. 该工作为哈密顿-雅可比方程解投影到空间-能量时出现的最简单拉格朗日奇点建立了正规形式。\n2. 通过该正规形式，近似了半经典分布微局部化于拉格朗日流形上的方程在临界能量处的渐近解。\n3. 这为处理含切向轨迹与贝塞尔柱结构的同类奇点提供了统一的半经典分析方法。", "summary_source": "deepseek", "authors": [{"name": "Ilya Bogaevskii"}, {"name": "Michel Rouleux"}], "featured_authors": [{"name": "Ilya Bogaevskii"}, {"name": "Michel Rouleux"}], "author_count": 2}, {"id": "2606.27125", "category": "math-ph", "title": "The Ising Model Coupled to 2D Gravity: Critical Partition Function", "abstract": "We prove that the differential of the log of the partition function for the $2$-matrix model with quartic interactions converges in a certain double-scaling regime to the differential of the $\\boldsymbol{\\tau}$-function for the $(3,4)$ string equation. This confirms the convergence of the critical Ising model on random surfaces to the $(3,4)$ topological minimal model, which was stated in the works of Douglas and Shenker, Brézin and Kazakov, and Gross and Migdal. Our analysis is based on a steepest-descent analysis of a Riemann-Hilbert problem associated to a family of biorthogonal polynomials. New features in the matching problem in the construction of local parametrices appear.", "url": "https://arxiv.org/abs/2606.27125", "type": "理论", "summary": "1. 该工作严格证明具有四次交互的两矩阵模型配分函数对数微分在双标度极限下收敛至(3,4)弦方程τ函数微分，确认了随机曲面上临界Ising模型与(3,4)拓扑极小模型的一致。\n2. 技术核心在于对双正交多项式族关联的Riemann-Hilbert问题实施最速下降分析，并处理了局部参量构造函数匹配过程中出现的新特征。\n3. 此结果为精确求解随机曲面上的临界现象提供了严格数学基础，并有望推广至其他离散重力模型与共形场论的对应分析。", "summary_source": "deepseek", "authors": [{"name": "Maurice Duits"}, {"name": "Nathan Hayford"}, {"name": "Seung-Yeop Lee"}], "featured_authors": [{"name": "Maurice Duits"}, {"name": "Nathan Hayford"}, {"name": "Seung-Yeop Lee"}], "author_count": 3}, {"id": "2606.27318", "category": "math-ph", "title": "Geometric bulk-edge correspondence for $\\mathbb{Z}_2$-topological insulators", "abstract": "Fermionic time-reversal-invariant insulators in two dimensions--class AII in the Kitaev table--come in two topological phases. These phases are characterized by a $\\mathbb{Z}_2$-valued invariant, the Fu-Kane-Mele index. We prove a geometric bulk-edge correspondence for curved interfaces: if two such insulators occupy complementary regions separated by a curved boundary, then the $\\mathbb{Z}_2$ edge index of the interface system is the product, modulo two, of the difference of the two bulk $\\mathbb{Z}_2$ indices and a geometric intersection number associated with the boundary and the measurement region. The argument is a $\\mathbb{Z}_2$ analogue of the curved-interface connection formula proved for Hall insulators in \\cite{DZ24}.", "url": "https://arxiv.org/abs/2606.27318", "type": "理论", "summary": "1. 该工作证明了二维类AII时间反演不变绝缘体在弯曲界面下的Z2几何体边对应关系。\n2. 其核心卖点在于将界面系统Z2边缘指标表达为体Z2指数差与边界几何交点数模2的乘积，推广了Hall绝缘体的弯曲界面连接公式。\n3. 这为理解拓扑绝缘体中弯曲边界与测量区域几何对边缘态贡献的本质提供了严格的拓扑框架。", "summary_source": "deepseek", "authors": [{"name": "Alexis Drouot"}, {"name": "Jacob Shapiro"}, {"name": "Xiaowen Zhu"}], "featured_authors": [{"name": "Alexis Drouot"}, {"name": "Jacob Shapiro"}, {"name": "Xiaowen Zhu"}], "author_count": 3}, {"id": "2606.27366", "category": "math-ph", "title": "$\\mathrm{W}^*$-algebraic Integration Theory", "abstract": "Given a pair of $\\mathrm{W}^*$-algebras $(\\mathcal{M}_\\mathcal{S},\\mathcal{M}_\\mathcal{R})$ with $(\\mathcal{M}_\\mathcal{S})_*$ separable, a measurable space $(\\Sigma, \\mathcal{F})$ and a POVM $\\mathsf{E}: \\mathcal{F} \\to \\mathcal{E}(\\mathcal{M}_\\mathcal{R})$, the integral of a function $f: \\Sigma \\to \\mathcal{M}_\\mathcal{S}$ is defined as an element of the spatial tensor product $\\int f \\otimes d\\mathsf{E} \\in \\mathcal{M}_\\mathcal{S} \\bar{\\otimes} \\mathcal{M}_\\mathcal{R}$. The space $B_b(\\Sigma,\\mathcal{F},\\mathcal{M}_\\mathcal{S})$ of uniformly bounded ultraweakly measurable functions is the universal domain of integration; once $\\mathsf{E}$ is fixed it refines to the quotient $L^\\infty_\\mathsf{E}(\\Sigma,\\mathcal{M}_\\mathcal{S}) = B_b(\\Sigma,\\mathcal{F},\\mathcal{M}_\\mathcal{S})/\\mathcal{N}_\\mathsf{E}$ by $\\mathsf{E}$-null functions. When $(\\mathcal{M}_\\mathcal{R})_*$ is also separable, $L^\\infty_\\mathsf{E}(\\Sigma,\\mathcal{M}_\\mathcal{S}) \\cong \\mathcal{M}_\\mathcal{S} \\bar{\\otimes} L^\\infty_\\mathsf{E}(\\Sigma)$ is a $\\mathrm{W}^*$-algebra. The integration map is a faithful normal unital completely positive (CP) map, a $*$-homomorphism for PVMs and an isometry for localizable POVMs. It can be identified with the spatial tensor product $\\boldsymbol{1}_{\\mathcal{M}_\\mathcal{S}} \\hat{\\otimes} \\Phi_\\mathsf{E}$ where $\\Phi_\\mathsf{E}: L^\\infty_\\mathsf{E}(\\Sigma) \\to \\mathcal{M}_\\mathcal{R}$ is the faithful normal positive map corresponding to $\\mathsf{E}$. Complete positivity of integration maps is derived from Stinespring factorization through Naimark dilation. We establish an operator-valued Leibniz rule and Fubini theorem.", "url": "https://arxiv.org/abs/2606.27366", "type": "理论", "summary": "1. 本文针对一对W*-代数，定义了以POVM为测度的算子值积分，并构造了积分映射的通用定义域与商空间。\n2. 核心在于揭示积分映射是忠实正规单位完全正映射，其完全正性源于Naimark扩张的Stinespring分解，且对PVM为*-同态、对局部化POVM为等距。\n3. 该工作为算子代数积分理论提供了统一框架，其算子值莱布尼茨法则与Fubini定理可望在量子信息与非交换概率中产生应用。", "summary_source": "deepseek", "authors": [{"name": "Jan Głowacki"}, {"name": "Yui Kuramochi"}], "featured_authors": [{"name": "Jan Głowacki"}, {"name": "Yui Kuramochi"}], "author_count": 2}, {"id": "2606.26167", "category": "quant-ph", "title": "Criterion for qubit-assisted quantum metrology approaching Heisenberg scaling", "abstract": "We study in this work the metrology precision of a probe system coupled to an ancillary qubit. Restricting the probe-qubit coupling along only one or two directions is found to be a sufficient criterion for the effective dynamical generator to achieve the Heisenberg limit in precision. Under the criterion, the quantum Fisher information (QFI) about the to-be-estimated parameter becomes the expectation value of mean square of the effective generator with respect to the initial state of the composite system. Our criterion is justified in two distinct systems. For a bosonic probe, QFI about the displacement estimation is found to be proportional to the mean excitation number of probe. It renders a counterintuitive result that quantum metrology sensitivity can be enhanced by increasing the temperature of the probe system. For a spin-ensemble probe, QFI about both rotation-phase and magnetic-field estimation exhibit a quadratic dependence on the probe-spin number. It is found that even when the spin-ensemble is prepared as a finite-temperature state, faraway from the so-called resource states, e.g., the squeezed state or the Greenberger-Horne-Zeilinger state, QFI can still manifest a Heisenberg scaling behavior.", "url": "https://arxiv.org/abs/2606.26167", "type": "理论", "summary": "1. 该工作给出了探针系统耦合辅助量子比特实现海森堡标度精度的充分判据，即限制探针-量子比特耦合方向不超过两个。\n2. 关键卖点在于揭示了在该判据下量子费希尔信息简化为有效生成器均方期望值，并发现玻色子探针中温度升高可增强计量灵敏度，自旋系综中有限温度态仍可实现海森堡标度。\n3. 这一结果为量子计量实验设计提供了新的资源判据，表明热态也可作为有效计量资源，拓展了海森堡极限的适用范围。", "summary_source": "deepseek", "authors": [{"name": "Peng Chen"}, {"name": "Jun Jing"}], "featured_authors": [{"name": "Peng Chen"}, {"name": "Jun Jing"}], "author_count": 2}, {"id": "2606.26235", "category": "quant-ph", "title": "Measures of Chirality in Mixed-State Topological Phases", "abstract": "What does it mean for a mixed-state topological phase to be chiral? Mathematically, chirality can be sharply characterized through the symmetry algebra of the mixed state. Physically, however, the question is far more subtle. In pure states, chirality in topological phase is tied to a web of familiar diagnostics, involving bulk-boundary correspondence, a gapless entanglement spectrum, a nontrivial modular commutator, and a quantized thermal Hall response. We show that none of these diagnostics remain reliable in mixed states. Instead, for decohered topological phases with a known error-free parent state, we propose two relative-entropy-based measures that can diagnose chirality, with one of them further extracting the chiral central charge. Our results emphasize how mixed-state topology demands intrinsically new diagnostics beyond direct analogues of pure-state probes.", "url": "https://arxiv.org/abs/2606.26235", "type": "理论", "summary": "1. 该工作研究了混合态拓扑相中手性的表征问题，指出纯态中体边对应、纠缠谱等传统手性判据在混合态中均不可靠。\n2. 其核心在于提出两种基于相对熵的手性度量，其中一种能进一步定量提取混合态的手性中心荷，从而绕过纯态诊断的直接类比局限。\n3. 这揭示了混合态拓扑序需要内禀的新诊断范式，为理解退相干下拓扑相的结构以及发展实验可测的手性探针提供了明确方向。", "summary_source": "deepseek", "authors": [{"name": "Shijun Sun"}, {"name": "Bader Aldossari"}, {"name": "Rasmit Devkota"}, {"name": "Zhu-Xi Luo"}], "featured_authors": [{"name": "Shijun Sun"}, {"name": "Bader Aldossari"}, {"name": "Rasmit Devkota"}, {"name": "Zhu-Xi Luo"}], "author_count": 4}, {"id": "2606.26477", "category": "quant-ph", "title": "Algebraic structures of the Lindblad equation", "abstract": "We investigate the algebraic structure underlying the Lindblad equation for finite-dimensional open quantum systems. By introducing a suitable operator representation of the Liouville superoperator, we show that the dynamics can be formulated in terms of a closed algebra of Hermitian operators that is independent of the particular physical model. This formulation reveals that dissipative dynamics requires a substantially richer algebraic structure than purely unitary evolution, thereby providing a clear characterization of the additional complexity introduced by the Lindbladian. The resulting framework naturally leads to parametrizations of the dynamical map and to differential equations governing its evolution. We further derive recursion relations that enable the efficient construction of the algebra for systems of increasing dimension. Because the algebraic basis is universal, while all model-dependent information enters through a single set of coefficients, the proposed approach significantly reduces the computational cost of constructing the Liouville superoperator compared with direct methods. To facilitate the implementation of the method, we provide a Mathematica notebook containing a one-qubit example that can be systematically extended to an arbitrary number of qubits. The proposed framework therefore provides both a general mathematical description of finite-dimensional Lindblad dynamics and a practical foundation for efficient analytical and numerical implementations.", "url": "https://arxiv.org/abs/2606.26477", "type": "理论+数值", "summary": "1. 该工作研究了有限维开放量子系统Lindblad方程的代数结构，通过引入Liouville超算符的合适算子表示揭示了其动力学。\n2. 其核心在于指出耗散动力学需要比幺正演化更丰富的代数结构，且代数基具有普适性，模型信息仅通过一组系数输入，显著降低了Liouville超算符的构建成本。\n3. 这为有限维Lindblad动力学的数学描述和高效数值实现提供了统一框架，可推广至多量子比特系统的分析。", "summary_source": "deepseek", "authors": [{"name": "Leonel Bixano"}, {"name": "Guillermo López-Alvarez"}, {"name": "Victor Alberto Cruz-Barriguete"}, {"name": "V. G. Ibarra-Sierra"}, {"name": "José Luis Cardoso"}, {"name": "Juan Carlos Sandoval-Santana"}, {"name": "Alejandro Kunold"}], "featured_authors": [{"name": "Leonel Bixano"}, {"name": "Guillermo López-Alvarez"}, {"name": "Victor Alberto Cruz-Barriguete"}, {"name": "José Luis Cardoso"}, {"name": "Juan Carlos Sandoval-Santana"}, {"name": "Alejandro Kunold"}], "author_count": 7}, {"id": "2606.26480", "category": "quant-ph", "title": "Non-Hermitian Bloch Oscillations", "abstract": "We establish a general framework for non-Hermitian Bloch oscillations by investigating the wave-packet dynamics in one-dimensional non-Hermitian lattices driven by a dc force. The equations of motion for the momentum, center of mass, and group velocity of a wave packet are derived, where an anomalous group velocity due to the non-Hermiticity is identified. We show that nonreciprocal non-smooth Bloch oscillations, characterized by periodic jumps in group velocity, can emerge, and we analyze the role of finite-size effects. In non-Hermitian lattices with unidirectional hopping under open boundary conditions, we further uncover the emergence of periodic temporal Goos--Hänchen shifts together with an anomalous wave propagation along the direction of vanishing hopping.", "url": "https://arxiv.org/abs/2606.26480", "type": "理论", "summary": "1. 该工作建立了非厄米布洛赫振荡的一般理论框架，导出了直流场驱动下一维非厄米晶格中波包的动量、质心和群速度运动方程。\n2. 其核心物理卖点在于揭示了非厄米性导致的异常群速度，以及由此产生的非互易非平滑布洛赫振荡和周期性时间古斯–汉欣位移。\n3. 这为深入理解非厄米系统中拓扑输运与非经典波包动力学，以及有限尺寸效应下的波传播行为提供了明确的理论指导与实验启发。", "summary_source": "deepseek", "authors": [{"name": "Yanyan He"}, {"name": "Tomoki Ozawa"}], "featured_authors": [{"name": "Yanyan He"}, {"name": "Tomoki Ozawa"}], "author_count": 2}, {"id": "2606.26542", "category": "quant-ph", "title": "Scattering theory for cavity-assisted spin-motion-photon interactions", "abstract": "Cavity-assisted photon scattering (CAPS) is a powerful mechanism for realizing strong interactions between the internal states of stationary qubits and flying photons, underpinning a broad range of hybrid atom-photon protocols including remote entanglement generation and heralded atom-photon gates. Recently, the motional quantum state has emerged as an important building block for quantum information processing with atomic qubits, both as a coherently controllable degree of freedom and as a fundamental error channel through undesired spin-motion coupling. For the resonant-coupling regime of cavity quantum electrodynamics relevant to CAPS operations, however, the analytical formulation of spin-motion-photon coupling has so far remained elusive. Here, we develop a complete analytical framework for CAPS that incorporates the coherent interaction between atomic motion and a reflected photon by extending scattering theory to include the motional degree of freedom. The resulting compact operator-based input-output relation applies uniformly across various cavity geometries, spin-dependent trapping potentials, and nonidentical multiple spins. As an exemplary application, we use the framework to elucidate how atomic motion affects CAPS-based atom-photon gates, identifying the parameter regimes that suppress motion-induced errors. Our framework provides a theoretical foundation both for mitigating motional errors in CAPS operations and for deliberately exploiting motion-photon interaction at the atom-photon interface.", "url": "https://arxiv.org/abs/2606.26542", "type": "理论", "summary": "1. 该工作将一维量子散射理论扩展至包含原子运动自由度，首次建立了腔辅助自旋-运动-光子相互作用的完整解析框架，攻克了共振耦合区长期缺乏解析描述的难题。\n2. 其核心在于导出紧凑的算符化输入输出关系，该关系统一适用于任意腔几何、自旋依赖陷阱势及非全同多自旋体系，并据此定量揭示了原子运动导致原子-光子门退相干的机制，明确了抑制运动诱导误差的耦合强度与失谐窗口。\n3. 该理论既为远程纠缠生成与预示性门操作中运动噪声的精准控制提供了工具，也为有意利用运动-光子非线性设计新型混合量子接口奠定了理论基础。", "summary_source": "deepseek", "authors": [{"name": "Seigo Kikura"}, {"name": "Aruku Senoo"}, {"name": "Akihisa Goban"}, {"name": "Shinichi Sunami"}], "featured_authors": [{"name": "Seigo Kikura"}, {"name": "Aruku Senoo"}, {"name": "Akihisa Goban"}, {"name": "Shinichi Sunami"}], "author_count": 4}, {"id": "2606.26558", "category": "quant-ph", "title": "Graph Structures for Local Distinguishability of Quantum Product States", "abstract": "We consider the problem of distinguishing sets of quantum product states with local operations and classical communication (LOCC). Recent work has used graph theory to identify sets of product states distinguishable with one-way LOCC. We extend these efforts to full two-way LOCC, with the first significant analysis of the set of graphs corresponding to bipartite product states that can be distinguished with two-way protocols after finitely many steps. We derive basic closure properties of the set of distinguishable graphs and identify some classes of graphs that guarantee local distinguishability and some graphs that do not. We also include several examples and forward-looking comments.", "url": "https://arxiv.org/abs/2606.26558", "type": "理论", "summary": "1. 该工作利用图论框架系统分析了在完全双向LOCC协议下有限步可区分的双部分量子乘积态对应的图结构，并推导了可区分图集的封闭性性质。\n2. 主要进展在于首次深入研究双向LOCC下乘积态可区分性对应的图特征，识别了保证局域可区分性的图类以及反例，揭示了图结构与区分性之间的直接关联。\n3. 该图论方法为量子态局域区分性提供了结构化分类工具，启发后续可扩展至多部分乘积态或混合态，并指导实际量子通信协议中可区分态集的设计。", "summary_source": "deepseek", "authors": [{"name": "Sooyeong Kim"}, {"name": "David W. Kribs"}, {"name": "Michael Nathanson"}, {"name": "Rajesh Pereira"}, {"name": "Sarah Plosker"}], "featured_authors": [{"name": "Sooyeong Kim"}, {"name": "David W. Kribs"}, {"name": "Michael Nathanson"}, {"name": "Rajesh Pereira"}, {"name": "Sarah Plosker"}], "author_count": 5}, {"id": "2606.26584", "category": "quant-ph", "title": "Quantum Fast-Forwarding Beyond Reversibility: The $α$-Perturbed $n$-Cycle", "abstract": "Quantum fast-forwarding (QFF) is usually formulated for reversible Markov chains, where the projected quantum walk evolution is exactly governed by Chebyshev polynomials of a Hermitian discriminant matrix. We study whether this framework can be extended to nonreversible dynamics for an $\\alpha$-perturbed $n$-cycle Markov chain, which preserves circulant structure while introducing controlled irreversibility. We show that the nonreversible case has a fundamental obstruction: for $\\alpha \\neq 0$, the eigenvalues of $P_\\alpha$ leave the interval $[-1,1]$, so $T_m(P_\\alpha)$ is not uniformly bounded and cannot arise as an exact unitary compression for all times. Thus, exact Chebyshev-based QFF does not extend directly beyond reversibility. Nevertheless, we obtain a finite-time approximation result using truncated Chebyshev and LCU techniques. The evolution $P_\\alpha^t$ can be approximated with degree $\\tau=O\\left(|\\alpha|t+\\sqrt{t\\log(t/\\eta)}\\right),$ which recovers the reversible $O(\\sqrt t)$ behavior only in the perturbative regime $|\\alpha|=O(t^{-1/2})$. This identifies a nearly reversible regime where QFF survives perturbatively and quantifies how irreversibility degrades the speedup.", "url": "https://arxiv.org/abs/2606.26584", "type": "理论", "summary": "1. 该工作考察将量子快进（QFF）从可逆马尔可夫链拓展至α-扰动n-圈的循环非可逆动力学，并识别其根本障碍。\n2. 核心发现在于非可逆时P_α特征值偏离[-1,1]使切比雪夫精确酉压缩失效，进而借助截断多项式与LCU获得有限时间近似，截断阶数τ=O(|α|t+√(t log(t/η)))。\n3. 这精确界定了QFF仅在扰动|α|=O(t^{-1/2})的近可逆区域存活，并定量刻画了不可逆性对量子加速的退化，为非厄米量子游走的极限提供了理论锚点。", "summary_source": "deepseek", "authors": [{"name": "Avah Banerjee"}, {"name": "Asim Sharma"}, {"name": "Sooraj Sooman"}], "featured_authors": [{"name": "Avah Banerjee"}, {"name": "Asim Sharma"}, {"name": "Sooraj Sooman"}], "author_count": 3}, {"id": "2606.26770", "category": "quant-ph", "title": "Non-Hermiticity of an anomalous superradiant phase", "abstract": "We counterintuitively present a Hermitian squeezing-Dicke model as a minimal setting for non-Hermitian physics in many-body light-matter systems. It enables the realization of a non-Hermitian Hamiltonian of interest using a Hermitian quadratic bosonic system. Unlike previous dissipation-driven non-Hermitian mechanisms, effective parity-time ($\\mathcal{PT}$) symmetry arises purely from squeezing and exchanges gainy and lossy eigenmodes. We identify non-Hermiticity of an anomalous superradiant phase for strong spins squeezing, exhibiting spontaneous breaking of the unique $\\mathcal{PT}$ symmetry beyond $Z_2$ symmetries. Such exotic phase exhibits a complex excitation spectrum and undergoes a dynamical phase transition to a conventional superradiant phase at an exceptional point. An artificial magnetic field combined with the broken Hermiticity yields nonreciprocal dynamics with striking quantum amplification, exhibiting unidirectional enhanced transmission. Our Hermitian light-matter system offers an alternative pathway to exotic non-Hermitian physics and nonreciprocal quantum amplification.", "url": "https://arxiv.org/abs/2606.26770", "type": "理论", "summary": "1. 该工作提出一个压缩-Dicke模型，在厄米光-物质系统中实现了非厄米哈密顿量与异常超辐射相。\n2. 其核心在于利用纯压缩效应产生有效PT对称性，并使超辐射相自发破缺该对称性，同时通过非厄米性及人工磁场实现单向增强的非互易量子放大。\n3. 这为在可控光-物质体系中探索非厄米物理与拓扑量子放大开辟了新途径。", "summary_source": "deepseek", "authors": [{"name": "Jun-Ling Wang"}, {"name": "You-Qi Lu"}, {"name": "Qing-Hu Chen"}, {"name": "Yu-Yu Zhang"}], "featured_authors": [{"name": "Jun-Ling Wang"}, {"name": "You-Qi Lu"}, {"name": "Qing-Hu Chen"}, {"name": "Yu-Yu Zhang"}], "author_count": 4}, {"id": "2606.26798", "category": "quant-ph", "title": "Nonadiabatic Holonomic Single-Qubit Gates in Non-Hermitian Systems", "abstract": "Holonomic quantum computation offers a promising route to robust quantum gates, but decoherence remains a central obstacle in realistic implementations. Here we develop a nonadiabatic holonomic scheme for a driven three-level system in the no-jump regime described by an effective non-Hermitian Hamiltonian. Within a biorthogonal framework, tailored complex pulses enforce exact closure of the computational-subspace evolution at the final time despite the underlying nonunitary dynamics, enabling arbitrary single-qubit holonomic gates without requiring cyclic evolution in its orthogonal complement. In contrast to existing non-Hermitian treatments, which either neglect the overall exponential prefactor or, in adiabatic settings, include dissipation only on the auxiliary excited level, our scheme incorporates decay and dephasing of all bare eigenstates directly into the pulse design, so that dissipation does not reduce the no-jump gate fidelity.", "url": "https://arxiv.org/abs/2606.26798", "type": "理论", "summary": "1. 该工作针对无跳跃区间的非厄米三能级系统，提出了非绝热全息单量子比特门方案。\n2. 其核心在于利用双正交框架与定制复数脉冲，在非酉演化下实现计算子空间末态的精确闭合，并将所有本征态的衰减与退相干纳入脉冲设计，从而抑制耗散致保真度下降。\n3. 这为在开放量子系统中构建抗退相干的全息量子门提供了新的设计思路，并可直接推广至其他耗散平台。", "summary_source": "deepseek", "authors": [{"name": "Wei Li"}, {"name": "Yue Zhang"}, {"name": "Yu Kun Chen"}, {"name": "Jia Yao Liang"}], "featured_authors": [{"name": "Wei Li"}, {"name": "Yue Zhang"}, {"name": "Yu Kun Chen"}, {"name": "Jia Yao Liang"}], "author_count": 4}, {"id": "2606.26870", "category": "quant-ph", "title": "Dissipation-Induced Deviations from Kibble-Zurek Scaling in Non-Hermitian Quantum Annealing", "abstract": "We revisit the quantum annealing problem in the non-Hermitian transverse-field Ising model. We determine, both analytically and numerically, the intrinsic transition probabilities and the resulting defect density. Our results reveal that, unlike the Hermitian case where defect production is dominated by modes near the gap-closing point, the non-Hermitian dynamics involve significant contributions from broad momentum sectors. We find that, depending on the dissipation strength, the defect density exhibits standard Kibble-Zurek scaling, anti-Kibble-Zurek behavior, and a suppression faster than the Kibble-Zurek prediction. We demonstrate that these deviations from the standard Kibble-Zurek scaling can be understood in terms of the underlying excitation probabilities. Specifically, the fast decay of the defect density originates from a vanishing excitation probability spanning a range of annealing times across all allowed modes, even at the gap-closing points. In contrast, the anti-Kibble-Zurek behavior arises from supplementary excitations facilitated by dissipation over a broad range of allowed modes, particularly those situated away from the gap-closing region.", "url": "https://arxiv.org/abs/2606.26870", "type": "理论+数值", "summary": "1. 该工作通过解析与数值方法重新审视非厄米横场伊辛模型中的量子退火问题，确定了内在跃迁概率及由此产生的缺陷密度。\n2. 其核心发现是，非厄米动力学引入宽动量区间的显著贡献，使缺陷密度随耗散强度呈现标准Kibble-Zurek标度、反Kibble-Zurek行为及快于KZ预测的抑制，这些偏离可由激发概率的耗散依赖精确解释。\n3. 这揭示了耗散调控下非厄米相变动力学中缺陷产生的丰富标度行为，为理解开放量子系统的退火机制及优化缺陷控制提供了理论基础。", "summary_source": "deepseek", "authors": [{"name": "H. Najafzadeh"}, {"name": "S. Sadeghizade"}, {"name": "R. Jafari"}, {"name": "A. Langari"}], "featured_authors": [{"name": "H. Najafzadeh"}, {"name": "S. Sadeghizade"}, {"name": "R. Jafari"}, {"name": "A. Langari"}], "author_count": 4}, {"id": "2606.26873", "category": "quant-ph", "title": "Scalable Message-Passing Quantum Graph Neural Networks in the Weisfeiler-Leman Hierarchy", "abstract": "Graphs provide a natural language for relational data in chemistry, biology and optimisation. Graph neural networks (GNNs) have driven much of the recent progress in learning from such data through message passing, a single primitive that generalises convolution and attention. Quantum counterparts have been proposed, but with limited connection to message passing and few guarantees on performance or scalability. More broadly, the trainability of variational quantum circuits is a recognised bottleneck for their wide applicability, and pre-training has emerged as one way to address it. Yet for a quantum model to be useful, it must offer expressivity guarantees along with demonstrable scalability. Here we show how a quantum graph neural network can be built to perform message passing, to be permutation equivariant, and to sit at a chosen level of the Weisfeiler-Leman hierarchy, the standard measure of how finely a model can tell graphs apart. We show that, as for classical GNNs, the training can be done first on small graph instances, allowing for a pre-training that can mitigate usual training issues, and its output can be read out at a cost that stays low as the graph grows. We validate the framework in large-scale simulations of up to 56 qubits across three datasets, on synthetic graphs that ordinary message passing cannot separate, on molecular property prediction, and on the travelling salesperson problem. Our framework opens a path for near-term quantum algorithms with theoretical guarantees and practical scalability, bringing the principles of graph learning into quantum circuit design.", "url": "https://arxiv.org/abs/2606.26873", "type": "理论+数值", "summary": "1. 该工作构建了在Weisfeiler-Leman层次中可进行消息传递且置换等变的量子图神经网络。\n2. 其技术关键在于通过小图预训练缓解训练问题，且读出成本随图规模增长保持低水平。\n3. 这为近期量子算法在分子性质预测与组合优化中实现理论保证与可扩展性开辟了路径。", "summary_source": "deepseek", "authors": [{"name": "Snehal Raj"}, {"name": "Brian Coyle"}, {"name": "Léo Monbroussou"}, {"name": "André J. Ferreira-Martins"}, {"name": "Renato M. S. Farias"}, {"name": "Elham Kashefi"}], "featured_authors": [{"name": "Snehal Raj"}, {"name": "Brian Coyle"}, {"name": "Léo Monbroussou"}, {"name": "André J. Ferreira-Martins"}, {"name": "Renato M. S. Farias"}, {"name": "Elham Kashefi"}], "author_count": 6}, {"id": "2606.26882", "category": "quant-ph", "title": "Shallow Quantum Circuits for Deep Chemistry via Valence Bond Embeddings", "abstract": "Quantum chemistry is one of the major potential applications in quantum computation. Currently there is a considerable focus on relatively small active spaces as a consequence of hardware noise and exponential bottlenecks in simulations. In the long run, there will be an increasing demand in reliable approximations for larger systems -- both, as initial states for projective algorithms like the quantum phase estimation or for the evaluation of dynamical properties. While numerous approaches to select active spaces and extrapolate basis set accuracy exist, there is currently no consistent approach that results in a single quantum circuit for the total system. In this work, we combine hybrid Fermionic-Bosonic encodings with the structured approach of Quantum Valence Bond Theory to directly construct quantum circuits for comparably large molecular systems. With this approach we are able to push simulability barrier of variational quantum eigensolvers towards chemically relevant systems and demonstrate circuit designs that outperform active space counterparts and achieve good approximations with respect to the exact solutions.", "url": "https://arxiv.org/abs/2606.26882", "type": "理论+数值", "summary": "1. 该工作结合混合费米-玻色编码与价键嵌入理论，直接为大分子系统构造浅层量子电路。\n2. 其核心创新在于无需活性空间截断，即可在变分量子本征求解器中逼近精确解并显著扩展可模拟体系规模。\n3. 这为量子化学中投影算法提供可扩展的初始态构造方案，有望推动动态性质评估与相位估计的应用。", "summary_source": "deepseek", "authors": [{"name": "Francisco Javier del Arco Santos"}, {"name": "Jakob S. Kottmann"}], "featured_authors": [{"name": "Francisco Javier del Arco Santos"}, {"name": "Jakob S. Kottmann"}], "author_count": 2}, {"id": "2606.26946", "category": "quant-ph", "title": "On the simple derivation of the Casimir effect", "abstract": "The Casimir effect in its simplest form describes the attraction of two parallel conducting plates at close distance due to the vacuum fluctuation of the electromagnetic field. Its derivation can be found in many introductory works on quantum optics. Here we return to the original paper by Casimir and find subtle nuances in his derivation that are worth discussing to give a complete picture of a mathematically sound derivation of the effect.", "url": "https://arxiv.org/abs/2606.26946", "type": "理论", "summary": "1. 该工作重新审视Casimir效应的原始推导，指出其中从零点能到力的步骤隐含需严格化的数学细节。\n2. 卖点在于通过引入正则化与边界条件精细处理，澄清了发散零点能与有限可观测力之间的逻辑桥梁。\n3. 这为真空涨落在微纳力学系统中的精确计算提供了更有数学保障的基础，并凸显了经典边值条件在量子理论中的地位。", "summary_source": "deepseek", "authors": [{"name": "Hai-Chau Nguyen"}, {"name": "Matthias Kleinmann"}], "featured_authors": [{"name": "Hai-Chau Nguyen"}, {"name": "Matthias Kleinmann"}], "author_count": 2}, {"id": "2606.27119", "category": "quant-ph", "title": "Efficient foundation decoders for fault-tolerant quantum computing", "abstract": "Foundation decoders, a class of high-capacity neural decoders, are leading candidates for fault-tolerant quantum computing, with accurate and efficient decoding at large code distances. However, their construction often faces a steep scaling barrier, as larger code distances rapidly amplify the cost of syndrome generation and neural optimization. To address this bottleneck, here we devise neural transfer unification (NTU), a unified framework for efficient foundation decoders. A central feature of NTU is its ability to align decoding tasks across code distances via algebraic structures shared by scalable code families, which enables knowledge learned on smaller codes to accelerate large-scale decoder training. We instantiate NTU as NTU-Transformer, a transformer-based neural decoder tailored for planar surface codes and bivariate bicycle codes. For planar surface codes under circuit-level noise, NTU-Transformer outperforms correlation-aware matching on the $[\\![361,1,19]\\!]$ code and further scales to the $[\\![625,1,25]\\!]$ code, where it exceeds standard matching through transfer adaptation. For the bivariate bicycle code with $[\\![72,12,6]\\!]$, it surpasses Relay-BP in the low-physical-error regime. These results establish our proposal as a scalable route to amortized cross-distance training of foundation decoders for fault-tolerant quantum processors.", "url": "https://arxiv.org/abs/2606.27119", "type": "数值", "summary": "1. 该工作提出神经转移统一框架，实现面向容错量子计算的高效基础解码器跨距离训练。\n2. 其核心在于利用可扩展码族共享的代数结构对齐不同码距解码任务，使小码知识加速大码解码器优化。\n3. 这为表面码和二元自行车码等量子纠错码提供可扩展的解码方案，推动容错量子处理器基础解码器的实用化。", "summary_source": "deepseek", "authors": [{"name": "Ge Yan"}, {"name": "Shanchuan Li"}, {"name": "Shiyi Xiao"}, {"name": "Pengyue Ma"}, {"name": "Hanyan Cao"}, {"name": "Feng Pan"}, {"name": "Yuxuan Du"}], "featured_authors": [{"name": "Ge Yan"}, {"name": "Shanchuan Li"}, {"name": "Shiyi Xiao"}, {"name": "Hanyan Cao"}, {"name": "Feng Pan"}, {"name": "Yuxuan Du"}], "author_count": 7}, {"id": "2606.27158", "category": "quant-ph", "title": "Loss-aware pulse sequence optimization for generating photonic Fock states", "abstract": "We investigate the preparation of frequency-tunable photonic Fock states in a hybrid cavity system consisting of a nonlinear medium and a two-level system. Employing a gradient-based optimization approach, we construct multipulse driving protocols that control the system dynamics through pulse amplitudes, phases, and inter-pulse delays. Assuming unitary dynamics, the optimized sequences enable near-deterministic preparation of low-photon-number Fock states. We extend the optimization framework to open-system dynamics by modeling atomic decay and photon loss within the Lindblad master equation. This allows us to identify pulse sequences that exhibit enhanced robustness against dissipation compared to those optimized under idealized assumptions. Furthermore, we find that optimal pulse sequences obey strict constraints on relative phases, which are limited to values of 0 or $\\pi$. These phase restrictions are supported by an analytical study that investigates a simple two-pulse sequence treating the second pulse perturbatively.", "url": "https://arxiv.org/abs/2606.27158", "type": "理论+数值", "summary": "1. 本文通过梯度优化方法在包含非线性介质和二能级系统的混合腔中构造多脉冲驱动序列，实现近确定性的低光子数Fock态制备。\n2. 该工作的技术关键在于将优化扩展至Lindblad主方程描述的开放系统，考虑原子衰变和光子损耗，从而识别出对耗散更鲁棒的脉冲序列，并发现最优序列的相对相位严格限制为0或π。\n3. 这一相位约束经解析分析（对第二个脉冲的微扰处理）支持，为实验中实现高保真、频率可调谐的光子Fock态提供了实用的优化框架和设计准则。", "summary_source": "deepseek", "authors": [{"name": "Benjamin Stodd"}, {"name": "Priyanshu Tiwari"}, {"name": "René Sondenheimer"}, {"name": "Sina Saravi"}, {"name": "Martin Gärttner"}], "featured_authors": [{"name": "Benjamin Stodd"}, {"name": "Priyanshu Tiwari"}, {"name": "René Sondenheimer"}, {"name": "Sina Saravi"}, {"name": "Martin Gärttner"}], "author_count": 5}, {"id": "2606.27183", "category": "quant-ph", "title": "From Approximate Floquet Engineering to Full Floquet Theory: Coherent Control of Chiral Spin Systems in Spintronics", "abstract": "Coherent control of interacting spin systems under time-periodic driving is a central challenge in spin-based quantum technologies. Here we demonstrate the applicability of a full Floquet-space formalism, adapted from Nuclear Magnetic Resonance (NMR) methodologies, to model the dynamics of driven coupled electron spins in the presence of a static magnetic field B0 and a transverse oscillating field B1. The framework explicitly includes isotropic exchange coupling J and the chiral Dzyaloshinskii-Moriya antisymmetric exchange interaction (DMI), and its numerical convergence is systematically validated with respect to Fourier-space truncation. In the non-interacting limit, the expected driven-spin dynamics is recovered, with the oscillation periodicity governed by B1. Exchange coupling alone does not modify the collective spin expectation values under the chosen initial condition, consistent with symmetry considerations. In contrast, increasing DMI generates a finite expectation value of Sy, suppresses the expectation value of Sz, and produces tilted, elliptical Bloch-sphere trajectories, reflecting the emergence of chiral spin-spin correlations. These effects are pronounced for open boundary conditions, while remaining nearly negligible in the periodic boundary case. When exchange coupling and DMI coexist, the dynamics becomes strongly perturbed and multi-frequency in nature. Together, these results demonstrate that full Floquet-space modeling provides a robust and predictive framework for analyzing and engineering coherent dynamics in driven interacting spin systems beyond simple coherent-rotation regimes.", "url": "https://arxiv.org/abs/2606.27183", "type": "理论+数值", "summary": "1. 该工作采用源自核磁共振的完整Floquet空间形式主义，模拟含各向同性交换J与手性DMI的驱动耦合电子自旋动力学，并系统验证了傅里叶截断的数值收敛性。\n2. 其物理核心在于精确刻画DMI单独作用时如何诱导有限Sy期望值、抑制Sz并产生倾斜椭圆Bloch轨迹，而J与DMI共存时引发多频动力学，且开放边界条件显著放大手性效应。\n3. 该框架为超越简单旋转近似的受驱相互作用自旋系统提供鲁棒预测性建模，对手性自旋电子学中的相干控制与量子技术实验设计具有直接指导意义。", "summary_source": "deepseek", "authors": [{"name": "Andrea Simion"}, {"name": "Claudiu Filip"}, {"name": "Coriolan Tiusan"}], "featured_authors": [{"name": "Andrea Simion"}, {"name": "Claudiu Filip"}, {"name": "Coriolan Tiusan"}], "author_count": 3}, {"id": "2606.27211", "category": "quant-ph", "title": "Quantum group codes for non-Clifford logic: enhanced decoding, addressability and parallelizability", "abstract": "We introduce a framework based on classical quasi group codes to define a class of quantum CSS codes, called quantum group codes, supporting transversal multi-control-$Z$ gates which are both addressable and parallelizable, thus allowing to efficiently implement circuits composed of non-Clifford gates at the logical level. Building on this, we use a lifting procedure of classical AG codes established from class field theory to construct good quantum group codes with improved decoding complexity and logical multi-control-$Z$ gate parallelizability. More precisely, on input a good quantum AG code over the alphabet $\\mathbb F_q$ with transversal $\\mathsf{C}^m\\mathsf Z$ gate, we apply this lifting procedure to its underlying classical AG code and obtain a quantum group code over the alphabet $\\mathbb F_{q^2}$ supporting a transversal $\\mathsf{C}^m\\mathsf Z$ gate as well as addressable and parallelizable $\\mathsf{C}^{m-1}\\mathsf Z$ gates. In addition, this quantum code admits a quasi-quadratic time decoder with a linear decoding radius. This is to be compared with the previous quantum AG codes which have a cubic-time decoder. Hence, our work implies a decrease of the time complexity of state-of-the-art magic-state distillation protocols by an almost linear factor.", "url": "https://arxiv.org/abs/2606.27211", "type": "理论", "summary": "1. 该工作引入基于经典拟群码的量子CSS码框架，支持可寻址且可并行的横向多控Z门，实现非克利福德逻辑门的有效实现。\n2. 通过类域论提升经典AG码，构造出基于F_{q^2}字母表的量子群码，支持横向C^mZ门及可寻址可并行的C^{m-1}Z门，并具备准二次时间解码器与线性解码半径。\n3. 这一结果将魔态蒸馏协议的时间复杂度从三次降至准二次，为容错量子计算中的非克利福德门实现提供了更高效的编码方案。", "summary_source": "deepseek", "authors": [{"name": "Jean Gasnier"}, {"name": "Virgile Guémard"}], "featured_authors": [{"name": "Jean Gasnier"}, {"name": "Virgile Guémard"}], "author_count": 2}, {"id": "2606.27224", "category": "quant-ph", "title": "A 0.651-approximation to quantum Max Cut via Rydberg atoms", "abstract": "Quantum Max Cut, also known as the anti-ferromagnetic Heisenberg Hamiltonian, is a QMA-complete problem which serves as a benchmark for approximation algorithms in quantum physics. Here we develop a hybrid approximation algorithm to quantum Max Cut, which uses the natural quantum dynamics of Rydberg atom systems in combination with semidefinite programming and randomized rounding. It achieves a conditional approximation ratio of $0.651$, compared to the best-known ratio of $0.614$ that relies on semidefinite programming alone. The algorithm is robust in the sense that the advantage persists even if the annealing procedure of the Rydberg atom system obtains a state whose energy is only $89\\%$ of its true ground state energy. Our approach opens a new route for hybrid quantum-classical algorithms that combine quantum with classical optimization methods.", "url": "https://arxiv.org/abs/2606.27224", "type": "理论+数值", "summary": "1. 该工作针对量子Max Cut问题，即反铁磁海森堡哈密顿量这一QMA-完全问题，提出了基于里德伯原子系统的混合近似算法。\n2. 其核心在于结合半正定规划与随机舍入，利用里德伯原子的自然量子动力学，将近似比从纯经典方法的0.614提升至0.651，且即使退火仅获得89%真实基态能量时优势依然保持。\n3. 这为量子-经典混合优化算法提供了切实的新范式，有望推广至其他量子多体基态逼近问题。", "summary_source": "deepseek", "authors": [{"name": "Tomás Crosta"}, {"name": "Matthieu Saubanere"}, {"name": "Felix Huber"}], "featured_authors": [{"name": "Tomás Crosta"}, {"name": "Matthieu Saubanere"}, {"name": "Felix Huber"}], "author_count": 3}, {"id": "2606.27254", "category": "quant-ph", "title": "Particle-preserving fermionic shadows with mode-independent sample complexity", "abstract": "We consider the problem of learning expectation values of particle-preserving operators with respect to an unknown $\\eta$-particle $n$-mode fermionic state via classical shadows. Our main application is to estimating overlaps with arbitrary Slater determinant states: While it is known that such overlaps can, in the average case, be learnt to a fixed additive precision with a constant number of samples, the best-known worst case bound is $\\mathcal{O}(\\sqrt n \\log n)$; here we improve this to $\\mathcal{O}(\\eta\\log\\eta)$, achieving a mode-independent sample cost. Our procedure is also computationally efficient, requiring only classical post-processing which for a generic dense orbital runs in time $\\mathcal{O}(n\\eta^2)$. For the task of estimating the expectation value of a general particle-preserving quadratic fermionic observable $h$, we prove a sample complexity bound of $\\mathcal{O}(\\eta \\|h_0\\|_2^2)$, where $h_0$ is the traceless component of $h$; the associated classical post-processing scales as $\\mathcal{O}(n^2\\eta )$. Finally, we discuss implementation of the required randomization: in a first-quantized encoding, approximate unitary designs give circuit depths polylogarithmic in the number of modes, contrasting with linear-depth requirements for nearest-neighbor second-quantized matchgate implementations. On the technical side, our proof reduces the extremal shadow variance to harmonic analysis on the AIII symmetric space $U(n)/(U(\\eta)\\times U(n-\\eta))$ and evaluates the resulting integral using techniques from the theories of Jacobi ensembles and orthogonal polynomials, in a calculation which may be of independent interest.", "url": "https://arxiv.org/abs/2606.27254", "type": "理论+数值", "summary": "1. 该工作针对未知η粒子n模费米子态，通过经典影子方法学习粒子数守恒算符期望值，重点应用于估计与任意Slater行列式态的重叠。\n2. 其技术卖点是将最坏情况样本复杂度从O(√n log n)降至O(η log η)，实现模式无关样本开销，且经典后处理高效。\n3. 该结果在一阶量子化编码下可由深度对数级近似酉设计实现，其样本复杂度证明基于AIII对称空间调和分析与雅可比系综积分，具有独立方法价值。", "summary_source": "deepseek", "authors": [{"name": "Maxwell West"}, {"name": "M. Cerezo"}, {"name": "Martin Larocca"}], "featured_authors": [{"name": "Maxwell West"}, {"name": "M. Cerezo"}, {"name": "Martin Larocca"}], "author_count": 3}, {"id": "2606.27299", "category": "quant-ph", "title": "Self-Sifting quantum key distribution", "abstract": "In this paper, we introduce a novel two-way quantum key distribution (QKD) protocol in which the sender (Alice) and receiver (Bob) employ one qubit of a maximally entangled Bell state as the quantum channel for key exchange. The protocol incorporates a new security mechanism based on a scrambling operator. Unlike conventional two-way QKD protocols, all sifting operations and eavesdropper detection procedures are postponed until the completion of the quantum communication stage and are performed exclusively by Bob. Since the control mode is never publicly announced, attacks that rely on mode-dependent adaptations or attempt to remain hidden within the control mode are inherently prevented. Furthermore, the traveling qubit does not directly encode key information, substantially limiting the information that can be extracted from attacks targeting the quantum channel alone. An additional distinctive feature of the protocol is that rounds that would ordinarily be discarded can instead be utilized to detect the presence of an eavesdropper. We analyze a broad class of ancilla-based attacks, in which an eavesdropper couples an ancillary system to the transmitted qubit in an attempt to gain information about the key, and show that such attacks are detectable in their most general form.", "url": "https://arxiv.org/abs/2606.27299", "type": "理论", "summary": "1. 该工作提出一种自筛选双向量子密钥分发协议，利用最大纠缠Bell态的单量子比特作为量子信道，并引入扰乱算子实现安全机制。\n2. 其核心卖点在于所有筛选与窃听检测操作延迟至量子通信结束后由Bob单方执行，且控制模式永不公开，从而从根本上阻止依赖模式的自适应攻击。\n3. 这为量子密钥分发提供了一种无需公开筛选环节即可检测通用辅助系统攻击的新范式，并可将常规丢弃轮次转化为窃听检测资源。", "summary_source": "deepseek", "authors": [{"name": "Saman Sarshar"}, {"name": "Mostafa Annabestani"}], "featured_authors": [{"name": "Saman Sarshar"}, {"name": "Mostafa Annabestani"}], "author_count": 2}, {"id": "2606.27358", "category": "quant-ph", "title": "Cultivating logical catalysts for fault-tolerant dyadic phase rotations", "abstract": "We introduce a surface-code cultivation protocol for reusable logical catalyst states that implement exact fine dyadic phase gates $Z^{2^{-b}}$ by phase kickback. The catalyst is an eigenstate of a high-period Clifford circuit $U$, with a direct construction supported on $O(2^b)$ logical qubits. Once cultivated, each invocation implements the target phase through a controlled-$U$ gadget, removing Clifford+$T$ synthesis approximation error from the online gate and making the online non-Clifford depth independent of the target logical accuracy. As a concrete demonstration, we construct a catalyst for $\\sqrt{T}=Z^{1/8}$, where $U$ is a nine-qubit brickwork Clifford circuit and controlled-$U$ consists of eight controlled-CNOTs. Starting from nine distance-three rotated-surface-code blocks, we cultivate the catalyst through logical-$U$ checks, syndrome extraction and postselection, code growth, and complementary-gap decoding. Due to the intrinsic fault tolerance of the phase read-out, a \\emph{single} verification round already reaches the leading error-corrected scaling, in contrast to the repeated logical checks required when cultivating single-qubit magic states. A hybrid tensor-network and stabilizer simulation shows that, at physical error rate $p=10^{-3}$, the postselected catalyst can be grown to distance-seven rotated-surface-code blocks with logical leakage rate $\\sim 10^{-6}$ using around seven expected attempts, and can be suppressed further with stronger postselection. Compared with existing protocols, our approach trades offline, phase-specific catalyst cultivation for exactness, reusability, and constant-depth online implementation of fixed fine dyadic phases in codes with restricted transversal gate sets.", "url": "https://arxiv.org/abs/2606.27358", "type": "理论+数值", "summary": "1. 该工作提出一种表面码培养协议，通过可重用逻辑催化剂态实现精确细二元相位门Z^{2^{-b}}的反冲操作。\n2. 催化剂为高周期Clifford电路本征态，在线受控-U门消除Clifford+T合成误差，且单轮验证即达领先纠错缩放，无需重复逻辑检查。\n3. 此方法以离线相位特异培养换取在线恒定深度与精确性，适用于横向门受限编码，并有望通过后选择进一步抑制逻辑泄漏。", "summary_source": "deepseek", "authors": [{"name": "Yichen Xu"}, {"name": "Xiao Wang"}], "featured_authors": [{"name": "Yichen Xu"}, {"name": "Xiao Wang"}], "author_count": 2}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>${paper.summary_source === "deepseek" ? "DeepSeek three-sentence PRL summary" : (paper.summary_source === "local-fallback" ? "Local three-sentence fallback" : (paper.summary_source === "translation" ? "Chinese abstract translation" : "Chinese placeholder fallback"))}</span><a href="${safeUrl}" target="_blank" rel="noreferrer">Open arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
</body>
</html>
