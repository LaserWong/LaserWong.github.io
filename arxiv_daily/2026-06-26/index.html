<head>

  <title>arXiv 2026-06-26 · Daily ArXiv Selection</title>
  <style>
    :root {
      --bg: #f6f1e8;
      --panel: rgba(255, 252, 246, 0.92);
      --text: #2d241d;
      --muted: #6d5d50;
      --line: rgba(69, 49, 32, 0.14);
      --accent: #8f3d2e;
      --accent-2: #1d5f6b;
      --theory: #7c3a2a;
      --numeric: #255b6a;
      --both: #5d4a99;
      --experimental: #2f6b39;
      --shadow: 0 18px 40px rgba(54, 32, 16, 0.12);
      --radius: 22px;
      --ui-font: "Aptos", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --title-font: "Palatino Linotype", "Noto Serif SC", Georgia, serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--ui-font);
      color: var(--text);
      background: radial-gradient(circle at top left, rgba(255,255,255,0.78), transparent 32%), radial-gradient(circle at 88% 12%, rgba(29,95,107,0.14), transparent 20%), linear-gradient(180deg, #fbf7f0 0%, var(--bg) 42%, #f2e8dc 100%);
      min-height: 100vh;
    }
    .shell { width: min(1220px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 64px; }
    .hero {
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(255,255,255,0.84), rgba(255,248,238,0.72)), linear-gradient(135deg, rgba(143,61,46,0.08), rgba(29,95,107,0.08));
      box-shadow: var(--shadow);
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.82); border: 1px solid var(--line); color: var(--muted); font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase;
    }
    h1 { margin: 18px 0 10px; font-family: var(--title-font); font-size: clamp(32px, 5vw, 54px); line-height: 1.04; letter-spacing: -0.03em; }
    .hero p { max-width: 880px; color: var(--muted); font-size: 16px; line-height: 1.7; margin: 0; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-top: 26px; }
    .stat { padding: 16px 18px; background: rgba(255,255,255,0.76); border: 1px solid var(--line); border-radius: 18px; }
    .stat .label { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
    .stat .value { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
    .controls { position: sticky; top: 12px; z-index: 3; margin-top: 22px; padding: 18px; border: 1px solid var(--line); border-radius: 24px; background: rgba(250,244,236,0.9); backdrop-filter: blur(16px); box-shadow: 0 10px 24px rgba(54,32,16,0.08); }
    .control-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 16px; }
    .field { display: flex; flex-direction: column; gap: 10px; }
    .field label { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
    .search { width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line); background: rgba(255,255,255,0.92); font: inherit; color: var(--text); }
    .chip-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .chip { border: 1px solid var(--line); background: rgba(255,255,255,0.82); color: var(--text); padding: 10px 14px; border-radius: 999px; font: inherit; cursor: pointer; }
    .chip.active { border-color: rgba(143,61,46,0.35); background: rgba(143,61,46,0.12); color: #5b2419; }
    .chip[data-type="数值"].active { border-color: rgba(37,91,106,0.35); background: rgba(37,91,106,0.12); color: #173f49; }
    .chip[data-type="理论+数值"].active { border-color: rgba(93,74,153,0.35); background: rgba(93,74,153,0.12); color: #46337d; }
    .chip[data-type="实验"].active { border-color: rgba(47,107,57,0.35); background: rgba(47,107,57,0.12); color: #214c29; }
    .meta-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 14px; color: var(--muted); font-size: 14px; }
    .paper-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 18px; margin-top: 22px; }
    .paper { display: flex; flex-direction: column; gap: 14px; padding: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 10px 24px rgba(54,32,16,0.06); }
    .paper-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .tag { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid transparent; }
    .tag.category { background: rgba(45,36,29,0.08); color: var(--text); }
    .tag.type-theory { background: rgba(124,58,42,0.1); color: var(--theory); border-color: rgba(124,58,42,0.16); }
    .tag.type-numeric { background: rgba(37,91,106,0.1); color: var(--numeric); border-color: rgba(37,91,106,0.16); }
    .tag.type-both { background: rgba(93,74,153,0.1); color: var(--both); border-color: rgba(93,74,153,0.16); }
    .tag.type-experimental { background: rgba(47,107,57,0.1); color: var(--experimental); border-color: rgba(47,107,57,0.16); }
    .paper h2 { margin: 0; font-family: var(--title-font); font-size: 22px; line-height: 1.25; letter-spacing: -0.02em; }
    .paper h2 a { color: inherit; text-decoration: none; }
    .paper h2 a:hover { color: var(--accent); }
    .paper .id { color: var(--muted); font-size: 13px; }
    .author-block { display: grid; gap: 10px; padding: 14px 16px; border-radius: 18px; background: rgba(255,255,255,0.64); border: 1px solid var(--line); }
    .author-label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .author-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .author-item { display: grid; gap: 4px; }
    .author-item strong { font-size: 14px; }
    .author-item span { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .author-note { color: var(--muted); font-size: 12px; }
    .paper .summary { margin: 0; font-size: 15px; line-height: 1.75; white-space: pre-line; }
    details { border-top: 1px solid var(--line); padding-top: 12px; }
    details summary { cursor: pointer; color: var(--accent-2); font-weight: 700; list-style: none; }
    details summary::-webkit-details-marker { display: none; }
    details p { margin: 10px 0 0; color: var(--muted); line-height: 1.72; font-size: 14px; white-space: pre-line; }
    .paper footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 6px; color: var(--muted); font-size: 13px; }
    .paper footer a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .empty { display: none; margin-top: 24px; padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 22px; background: rgba(255,255,255,0.7); }
    @media (max-width: 980px) { .control-grid { grid-template-columns: 1fr; } .controls { position: static; } }
  </style>

  <script>
    const papers = [{"id": "2606.26222", "category": "cond-mat", "title": "The fate of odd-parity magnetism in one dimension", "abstract": "We consider a one-dimensional model for a $p$-wave magnet within the bosonization framework. The model consists of itinerant electrons described by an extended Hubbard model coupled to a chain of localized moments through the Kondo exchange. The classical ground state of the local-moment system captures the salient features of an odd-parity magnet. By bosonizing the coupled system, a description in terms of coupled Luttinger liquids follows, giving rise to a rich weak-coupling phase diagram. It is shown that the spin chain develops quasi long-range order consistent with the combined time-reversal and translation symmetry defining the $p$-wave magnet. We highlight the peculiar role played by this order in establishing a commensurability condition on the electronic filling under which additional interactions appear in the bosonic field theory. It is demonstrated that these interactions endow the electron spectral function with a pronounced $p$-wave character. Away from commensurate filling, these interactions are rendered irrelevant and the ensuing $p$-wave character is lost.", "url": "https://arxiv.org/abs/2606.26222", "type": "理论+数值", "summary": "1. 该工作通过玻色化方法研究由扩展Hubbard电子链与Kondo耦合局域矩构成的一维p波磁体模型，刻画了其弱耦合相图并分析了奇宇称磁序的量子行为。\n2. 其核心发现是局域矩的经典奇宇称磁序在量子涨落下转化为自旋链的准长程有序（时间反演与平移对称性联合界定），且在电子填充满足相称条件时附加相互作用使电子谱函数呈现显著p波特征，否则该特征丧失。\n3. 这揭示了一维系统中奇宇称磁序与电子填充间的相称性锁定机制，为低维关联材料中p波磁性的理论分析提供了基准，并启发在准一维体系中探索填充调控的p波关联效应与拓扑相。", "summary_source": "deepseek", "authors": [{"name": "Kasper Rettedal Eikeland"}, {"name": "Sondre Duna Lundemo"}, {"name": "Asle Sudbø"}], "featured_authors": [{"name": "Kasper Rettedal Eikeland"}, {"name": "Sondre Duna Lundemo"}, {"name": "Asle Sudbø"}], "author_count": 3}, {"id": "2606.26225", "category": "cond-mat", "title": "The odd fermion at the edge: odd-even staggering in the trapped, unitary Fermi gas", "abstract": "We investigate the odd-even staggering in the harmonically-trapped unitary Fermi gas at large particle-number charge $Q$. Using both a large-$N$ BdG description and a complementary large-charge EFT method, we show that for odd particle number the extra fermion forms an edge-localized quasiparticle near the Thomas-Fermi surface rather than a bulk excitation. In the edge limit, the microscopic BdG problem reduces to a universal coupled Airy system whose lowest positive eigenvalue fixes the leading odd-even splitting energy, $\\chi\\,\\xi^{1/6}(24Q)^{1/9}\\,\\hbar\\omega + \\cdots$ where $\\xi$ is the Bertsch parameter, and $\\chi$ is a universal edge coefficient. The associated EFT describes a fermionic mode confined to the boundary and coupled to the superfluid Goldstone field, reproducing the same $Q$ scaling while introducing a dependence on two low-energy constants. Finally, we numerically compute the spectrum and confirm the predicted scaling and localization properties.", "url": "https://arxiv.org/abs/2606.26225", "type": "理论+数值", "summary": "1. 该工作研究了谐振势阱中大粒子数幺正费米气体的奇偶交错现象。\n2. 其技术核心在于通过大N Bogoliubov-de Gennes描述与大电荷有效场论互补分析，揭示奇数粒子额外费米子形成边缘局域准粒子，且奇偶分裂能由普适边缘系数与Bertsch参数决定。\n3. 这为强相互作用费米系统中边缘态与超流关联的普适标度行为提供了定量理解，并启发冷原子实验中奇偶效应的观测与边缘物理的探索。", "summary_source": "deepseek", "authors": [{"name": "Silas R. Beane"}, {"name": "Domenico Orlando"}, {"name": "Susanne Reffert"}], "featured_authors": [{"name": "Silas R. Beane"}, {"name": "Domenico Orlando"}, {"name": "Susanne Reffert"}], "author_count": 3}, {"id": "2606.26238", "category": "cond-mat", "title": "Odd Diffusion in Three-Dimensional Isotropic Media", "abstract": "Odd diffusion is a hallmark of chiral active matter, generating currents transverse to density gradients. Existing theories rely on a linear antisymmetric transport coefficient that exists only in two dimensions, raising the question of whether odd diffusion can occur in isotropic three-dimensional systems. Here we show that such transport is possible through a nonlinear constitutive law. Symmetry considerations reveal that the three-dimensional Levi-Civita tensor permits a leading order isotropic odd current at second order in the density gradient expansion and only in multicomponent systems. The resulting transport generates boundary-driven rotational currents, finite vorticity, and enstrophy despite the absence of external torques or preferred directions. We show how such a constitutive law derives from a microscopic model of particles interacting through nonreciprocal three-body forces using the Dean--Kawasaki coarse-graining procedure. These results establish a minimal framework for odd transport in isotropic three dimensions.", "url": "https://arxiv.org/abs/2606.26238", "type": "理论", "summary": "1. 该工作证明各向同性三维介质中可存在奇扩散，由非线性本构关系产生，仅适用于多组分系统。\n2. 其核心在于利用三维列维-奇维塔张量在密度梯度二阶展开中构造各向同性奇电流，并导出边界驱动的涡旋流场。\n3. 这为不含外扭矩或择优方向的三维手征活性物质输运建立了最小理论框架，并提供了非互易三体力的微观推导途径。", "summary_source": "deepseek", "authors": [{"name": "Viola Zixin Zhao"}, {"name": "Andres Franco Valiente"}, {"name": "David T. Limmer"}], "featured_authors": [{"name": "Viola Zixin Zhao"}, {"name": "Andres Franco Valiente"}, {"name": "David T. Limmer"}], "author_count": 3}, {"id": "2606.26261", "category": "cond-mat", "title": "Fluctuation-Induced Magnetoelectric Effect in Noncentrosymmetric Superconductors", "abstract": "We study the effect of superconducting fluctuations on the spin susceptibility and NMR relaxation rate in noncentrosymmetric two-dimensional materials above the superconducting transition temperature, considering arbitrary strength of impurity scattering. Employing a microscopic model with linear Rashba spin-orbit coupling, we show that superconducting fluctuations give rise to a direct contribution to the spin susceptibility through fluctuation-induced Cooper pairs. This fluctuation-driven magnetoelectric effect is possible even for purely $s$-wave singlet pairing, a mechanism that is forbidden in centrosymmetric systems. It competes with the reduction of the susceptibility below the Pauli value arising from the combined effects of the suppression of the density of states and quantum-interference localization processes. In contrast, superconducting fluctuations enhance the NMR relaxation rate above its normal-state Korringa value, with spin-orbit coupling providing an additional amplification of this effect.", "url": "https://arxiv.org/abs/2606.26261", "type": "理论", "summary": "1. 该工作研究了非中心对称二维超导体中，超导涨落在转变温度以上对自旋磁化率和NMR弛豫率的直接影响。\n2. 其核心发现是，即使纯s波单重配对，涨落诱导的库珀对也能产生磁电效应，这在中心对称系统中被禁止，且与态密度抑制及量子干涉局域化过程竞争。\n3. 这揭示了自旋轨道耦合对NMR弛豫率的额外放大机制，为理解非中心对称超导体的自旋响应提供了新物理图像。", "summary_source": "deepseek", "authors": [{"name": "Jaglul Hasan"}, {"name": "Daniel Shaffer"}, {"name": "Maxim Dzero"}, {"name": "Alex Levchenko"}], "featured_authors": [{"name": "Jaglul Hasan"}, {"name": "Daniel Shaffer"}, {"name": "Maxim Dzero"}, {"name": "Alex Levchenko"}], "author_count": 4}, {"id": "2606.26269", "category": "cond-mat", "title": "Challenging the $p$-type Paradigm: Intrinsic $n$-type Mobility in Antiferromagnetic Cr$_2$O$_3$", "abstract": "Chromium oxide (Cr$_2$O$_3$) is widely considered a $p$-type transparent conducting oxide despite ongoing debate regarding its intrinsic transport character. Here, we resolve this question by computing phonon-limited electron and hole mobilities using the ab initio Boltzmann transport equation. We find that electron mobility systematically exceeds hole mobility over a wide temperature range, demonstrating that Cr$_2$O$_3$ is intrinsically $n$-type. Analysis of scattering mechanisms reveals that scattering with phonons affects electrons and holes similarly, and that the mobility asymmetry originates from the electronic structure, namely the larger effective mass and multi-valley character of the valence band. The intrinsic $n$-type character, combined with moderate hole mobility, enables bipolar transport and revises the role of Cr$_2$O$_3$ in transparent electronics. Additionally, our results on mobility complement previous studies on defect formation indicating that the commonly observed $p$-type behavior is extrinsic. These insights provide a complete chemical-transport paradigm for Cr$_2$O$_3$, re-evaluating its role in functional transparent electronic and magneto-optoelectronic applications", "url": "https://arxiv.org/abs/2606.26269", "type": "理论+数值", "summary": "1. 该工作通过第一性原理玻尔兹曼输运方程计算，确定了反铁磁Cr₂O₃中声子限制的电子与空穴迁移率，解决了其本征输运类型的长久争议。\n2. 其核心发现是电子迁移率在宽温区内系统性高于空穴迁移率，且该不对称性源自价带更大的有效质量与多谷能带结构，而非散射机制的差异。\n3. 这一本征n型特性结合中等空穴迁移率，表明Cr₂O₃可实现双极输运，并修正了其常见p型行为为外禀的认知，为透明电子学与磁光电子学提供了完整的化学-输运范式。", "summary_source": "deepseek", "authors": [{"name": "Á. A. Carrasco Álvarez"}, {"name": "S. Poncé"}], "featured_authors": [{"name": "Á. A. Carrasco Álvarez"}, {"name": "S. Poncé"}], "author_count": 2}, {"id": "2606.26548", "category": "cond-mat", "title": "Topological phase transition driven by in-plane spin rotation", "abstract": "The intrinsic coupling between magnetism and nontrivial band topology in magnetic topological insulators makes external magnetic fields a powerful tool for manipulating topological states. However, conventional magnetic control mechanisms, such as driving magnetic phase transitions or fully reversing magnetization, typically demand large magnetic fields and lack continuous tunability. Here, we establish a symmetry framework for the reversible switching of topological states via continuous in-plane spin rotation, governed by magnetic point group constraints on the Berry curvature distribution. Using a two-dimensional kagome ferromagnetic Chern insulator as a prototype, we demonstrate that a 60°in-plane magnetization rotation reverses the sign of the Chern number, transitioning through a topologically trivial state. Crucially, micromagnetic simulations confirm that this spin-reorientation-driven switching operates under exceptionally small magnetic fields and on ultrafast timescales. This work provides a highly efficient, low-energy paradigm for the manipulation of topological states.", "url": "https://arxiv.org/abs/2606.26548", "type": "理论+数值", "summary": "1. 该工作建立了通过连续面内自旋旋转驱动拓扑相变的理论框架，并以二维kagome铁磁陈绝缘体为原型展示了陈数符号反转。\n2. 其核心机制是利用磁点群对称性对贝里曲率分布的限制，实现仅需60°面内磁化旋转即可导致拓扑相变，且微磁模拟证实所需磁场极小、时间极快。\n3. 这为拓扑态的高效低能耗操控提供了新范式，有望在超快自旋电子器件中实现拓扑态的可逆调控。", "summary_source": "deepseek", "authors": [{"name": "Xinyue Zhu"}, {"name": "Yu Xie"}, {"name": "Yifei Hao"}, {"name": "Fei Gao"}, {"name": "Yue Li"}, {"name": "Junting Zhang"}], "featured_authors": [{"name": "Xinyue Zhu"}, {"name": "Yu Xie"}, {"name": "Yifei Hao"}, {"name": "Fei Gao"}, {"name": "Yue Li"}, {"name": "Junting Zhang"}], "author_count": 6}, {"id": "2606.26646", "category": "cond-mat", "title": "Dynamic heterogeneity in sodium silicate melts via machine-learning potential", "abstract": "We present a comprehensive characterisation of dynamic heterogeneity in sodium silicate melts using molecular dynamics simulation with machine-learning potentials. By studying sodium disilicate, tetrasilicate, and hexasilicate melts across a range of temperatures, mean squared displacement and a time-correlation function computed up to the nanosecond timescale provide a detailed account of how spatial mobility disparities emerge in a realistic multicomponent oxide glass. Within these timescales, the self-part of the van Hove function for sodium displays a bimodality, demonstrating that alkali transport is mediated by discrete displacement events consistent with a hopping mechanism. This distinct hopping allows sodium ions to decouple from the sluggish relaxation of the silicate matrix. Furthermore, evaluation of the non-Gaussian parameter reveals that, although all constituent species exhibit dynamic heterogeneity, the non-Gaussian behaviour is most pronounced for oxygen atoms. This trend reflects the intermittency of structural rearrangements, where framework atoms undergo rare and stochastic events compared to the frequent displacements of mobile ions. Our findings elucidate the microscopic mechanism of ion transport and its connection to dynamic heterogeneity in silicate melts, offering a new avenue to study fundamental glassy physics in realistic vitreous materials.", "url": "https://arxiv.org/abs/2606.26646", "type": "数值", "summary": "1. 该工作利用机器学习势分子动力学模拟，系统表征了不同组分硅酸钠熔体在纳秒时间尺度上的动态异质性。\n2. 其核心发现是钠离子的范霍夫函数自部出现双峰性，表明其传输通过离散跳跃事件实现，并与硅酸盐基质的慢弛豫解耦。\n3. 这揭示了碱金属离子输运与动态异质性的微观机制，为现实玻璃材料中的玻璃态物理研究开辟了新途径。", "summary_source": "deepseek", "authors": [{"name": "Kumpei Shiraishi"}, {"name": "Rikuta Nozawa"}, {"name": "Emi Minamitani"}], "featured_authors": [{"name": "Kumpei Shiraishi"}, {"name": "Rikuta Nozawa"}, {"name": "Emi Minamitani"}], "author_count": 3}, {"id": "2606.26693", "category": "cond-mat", "title": "Preconditioning Magnetic Systems in Kohn-Sham Density Functional Theory", "abstract": "The convergence of the self-consistent field iterations in Kohn-Sham density functional theory can be significantly hindered by the presence of small eigenvalues in the dielectric matrix, which are often associated with electronic phase transitions in magnetic systems. In this work, we study this type of convergence issues and propose a new preconditioning scheme to mitigate them. Our preconditioning scheme is inspired by the Stoner model and based on a non-interacting susceptibility that neglects orbital variations. We demonstrate the effectiveness of our approach on a range of ferromagnetic systems, showing that it can significantly reduce the number of iterations required to achieve convergence in the vicinity of magnetic phase transitions.", "url": "https://arxiv.org/abs/2606.26693", "type": "理论+数值", "summary": "1. 该工作针对Kohn-Sham密度泛函理论中因介电矩阵小特征值导致的磁性系统自洽场收敛困难，提出了基于Stoner模型的预处理方案。\n2. 其技术核心在于利用忽略轨道变化的非相互作用磁化率构造预处理子，显著加速了磁相变附近的自洽迭代收敛过程。\n3. 这为高效处理磁性电子结构计算中的复杂收敛问题提供了可靠策略，并可能推广至其他涉及相变的密度泛函理论应用。", "summary_source": "deepseek", "authors": [{"name": "Clémentine Barat"}, {"name": "Antoine Levitt"}, {"name": "Marc Torrent"}], "featured_authors": [{"name": "Clémentine Barat"}, {"name": "Antoine Levitt"}, {"name": "Marc Torrent"}], "author_count": 3}, {"id": "2606.26909", "category": "cond-mat", "title": "Quasiclassical theory of nonlinear response in d-wave superconductors", "abstract": "We use a self-consistent Keldysh--Nambu quasiclassical theory to study two related nonlinear phenomena in clean d-wave superconductors: the photo-induced static correction to the order parameter -- the Eliashberg effect -- and third-harmonic generation. Both follow from a systematic perturbative solution of the out-of-equilibrium Eilenberger equation for the Keldysh propagator. For the steady-state correction to the pairing amplitude we find that at temperatures close to the critical temperature and to leading order in the gap magnitude $\\Delta$, the photo-induced change of the order parameter is zero at all drive frequencies: in contrast to s-wave superconductors, a clean d-wave superconductor exhibits no Eliashberg enhancement at this order. The gap-enhancing quasiparticle-redistribution channel that drives the effect in the s-wave case is suppressed by an additional power of $\\Delta$ in the d-wave case. For third-harmonic generation we find that the charge-density-fluctuation (particle--hole) channel significantly dominates the Schmid--Higgs amplitude-mode contribution over a broad frequency range, the two becoming comparable only in a narrow window near the resonance frequency $\\omega\\approx 2\\sqrt{2}\\,\\Delta$ if one neglects the diamagnetic part of the current in the normal state. We trace this to the nonequilibrium dynamics of nodal quasiparticles, which must be retained explicitly and which also makes the response sensitive to the orientation of the driving field.", "url": "https://arxiv.org/abs/2606.26909", "type": "理论", "summary": "1. 该工作基于自洽Keldysh-Nambu准经典理论，解析求解了非平衡Eilenberger方程，研究了清洁d波超导体中的Eliashberg效应与三次谐波产生两类非线性响应。\n2. 卖点在于发现d波超导体中Eliashberg增强效应在领先阶完全消失，归因于节点准粒子重分布通道被额外的能隙幂次压制；同时三次谐波中电荷密度涨落通道在宽频域内主导Schmid-Higgs振幅模式贡献，仅共振频率附近两者可比且响应依赖于驱动场取向。\n3. 这揭示了节点准粒子非平衡动力学与配对对称性对非线性超导响应的决定性影响，为实验区分d波超导体的光致静态修正及高阶谐波谱提供了理论基准。", "summary_source": "deepseek", "authors": [{"name": "Aidan Steineman"}, {"name": "Samuel Awelewa"}, {"name": "Maxim Dzero"}], "featured_authors": [{"name": "Aidan Steineman"}, {"name": "Samuel Awelewa"}, {"name": "Maxim Dzero"}], "author_count": 3}, {"id": "2606.26989", "category": "cond-mat", "title": "Physical Neural Networks Need Nonlinearity, Amplification, and Suppression for Learning", "abstract": "The exponential growth in energy consumption of artificial intelligence systems has spurred interest in physical computing paradigms that exploit the relaxation of physical systems toward steady states. However, many existing physical networks are fundamentally linear and incapable of performing nonlinear operations crucial for meaningful machine learning tasks. Here we use simulations to show that nonlinearity alone is insufficient; physical learning systems must also support signal amplification and suppression to perform nontrivial computations. We present physically plausible circuit designs that incorporate these essential features, enabling effective nonlinear information processing. Our findings clarify the limitations of linear physical networks and provide guidance for developing energy-efficient physical learning architectures capable of general machine learning tasks.", "url": "https://arxiv.org/abs/2606.26989", "type": "数值", "summary": "1. 该工作通过电路仿真表明，物理神经网络必须同时具备非线性、信号放大和抑制能力才能执行有意义的机器学习任务。\n2. 其核心在于揭示线性弛豫物理系统无法完成非线性信息处理，并提出了集成这三类特性的物理可行电路设计。\n3. 这为构建能实现通用机器学习任务的节能型物理学习架构提供了关键指导与设计原则。", "summary_source": "deepseek", "authors": [{"name": "Nex Chiaki Xijana Stuhlmüller"}, {"name": "Marjolein Dijkstra"}], "featured_authors": [{"name": "Nex Chiaki Xijana Stuhlmüller"}, {"name": "Marjolein Dijkstra"}], "author_count": 2}, {"id": "2606.27012", "category": "cond-mat", "title": "Odd transport in a two-temperature Brownian dimer", "abstract": "We investigate a two-temperature Brownian dimer with odd mobility, characterized by antisymmetric transport coefficients, as a controlled paradigm for odd nonequilibrium dynamics. The system is made of two harmonically confined particles coupled by an elastic spring and connected to reservoirs at different temperatures. Odd mobility converts conservative forces into transverse motion, linking heat exchange to circulating probability currents without requiring external torques, spatial anisotropy, or nonconservative driving. Our exact solution shows that odd mobility creates handed correlations between the two particles while leaving the individual particle distributions isotropic. These correlations arise only when temperature imbalance, elastic coupling, and odd mobility act together, and their handedness reverses when the odd response is reversed. The steady probability current contains two distinct parts: the ordinary irreversible current of a two-temperature dimer and an additional handed contribution generated by odd mobility. When projected onto the motion of each particle, this handed contribution becomes a pair of counter-rotating circulating currents inside the traps. Based on the currents we compute the heat transfer and entropy production analytically. We show that odd mobility enhances thermal conductance between the reservoirs, while the net heat current and total dissipation remain unchanged under reversal of the odd handedness.", "url": "https://arxiv.org/abs/2606.27012", "type": "理论", "summary": "1. 该工作精确求解了一个具有奇偶迁移率的两温布朗二聚体模型，作为受控奇非平衡动力学范例。\n2. 其卖点在于揭示奇偶迁移率、温度失衡与弹性耦合三者协同产生粒子间手性关联，并在各粒子囚禁势内诱导反向旋转的环流概率流。\n3. 这为理解非平衡系统中热导增强与手性响应的内在关联提供了理论框架，并启发无需空间各向异性或非保守驱动的定向操控机制。", "summary_source": "deepseek", "authors": [{"name": "Iman Abdoli"}, {"name": "Hartmut Löwen"}], "featured_authors": [{"name": "Iman Abdoli"}, {"name": "Hartmut Löwen"}], "author_count": 2}, {"id": "2606.27102", "category": "cond-mat", "title": "Low-energy model for doped graphene nanoribbons", "abstract": "We analyse in this article the many-body behavior of free-standing doped graphene nanoribbons where the chemical potential lies inside the bulk single-particle bands. We perform an exact mapping from both an extended and an on-site Hubbard model of the ribbons to a Kanamori model, which includes ferromagnetic exchange and pair-hopping interactions. We determine the resulting Coulomb matrix elements analytically, and identify their scaling behavior as a function of ribbon width and length. We propose a low-energy version of the Kanamori Hamiltonian to address the response of the ribbons to external fields, with a view to their use as transport channels in nanoelectronics. We find that the model and the proposed ribbon parameters can produce open-shell, high-spin many-body states that can lead to shell- and spin-blockade responses.", "url": "https://arxiv.org/abs/2606.27102", "type": "理论", "summary": "1. 该工作将掺杂石墨烯纳米带的多体问题从扩展及原位Hubbard模型精确映射到Kanamori模型，并解析出库仑矩阵元随带状宽度与长度的标度行为。\n2. 其核心在于铁磁交换与配对跳跃相互作用主导的低能Kanamori哈密顿量，可描述开壳层高自旋多体态导致的壳阻与自旋阻塞响应。\n3. 该模型为掺杂纳米带作为纳米电子学传输通道的外场响应研究提供了可解析的低能理论框架。", "summary_source": "deepseek", "authors": [{"name": "J. Ferrer"}, {"name": "A. García-Fuente"}, {"name": "Y. Yang"}, {"name": "S. Volosheniuk"}, {"name": "H.S.J. van der Zant"}], "featured_authors": [{"name": "J. Ferrer"}, {"name": "A. García-Fuente"}, {"name": "Y. Yang"}, {"name": "S. Volosheniuk"}, {"name": "H.S.J. van der Zant"}], "author_count": 5}, {"id": "2606.27132", "category": "cond-mat", "title": "Connection between the GKSL master equation and the Landauer formula", "abstract": "We derive a current formula within the Gorini-Kossakowski-Sudarshan-Lindblad (GKSL) master equation formalism for a non-interacting system, and identify the conditions under which it reduces to the Landauer formula.", "url": "https://arxiv.org/abs/2606.27132", "type": "理论", "summary": "1. 该工作在非相互作用体系的GKSL主方程框架内导出电流表达式，并明确其约化为Landauer公式的严格条件。\n2. 其核心贡献在于桥接了主方程方法与Landauer输运理论，揭示了两者在弱耦合与马可夫极限下的等价性。\n3. 此结果为从开放量子系统角度统一描述量子输运提供了理论基础，并可推广至相互作用体系或非平衡多体效应。", "summary_source": "deepseek", "authors": [{"name": "Misa Nozaki"}, {"name": "Takatoshi Fujita"}], "featured_authors": [{"name": "Misa Nozaki"}, {"name": "Takatoshi Fujita"}], "author_count": 2}, {"id": "2606.27133", "category": "cond-mat", "title": "Unraveling Internal Friction in a Coarse-Grained Protein Model", "abstract": "Understanding the dynamic behavior of complex biomolecules requires simplified models that not only make computations feasible but also reveal fundamental mechanisms. Coarse-graining (CG) achieves this by grouping atoms into beads, whose stochastic dynamics can be derived using the Mori-Zwanzig formalism, capturing both reversible and irreversible interactions. In liquid, the dissipative bead-bead interactions have so far been restricted to hydrodynamic couplings. However, friction does not only arises from the solvent but notably, from the internal degrees of freedom missing in the CG beads. This leads to an additional ''internal friction'' whose relevance is studied in this contribution. By comparing with all-atom molecular dynamics (MD), we neatly show that in order to accurately reproduce the dynamics of a globular protein in water using a coarse-grained (CG) model, not only a precise determination of elastic couplings and the Stokesian self-friction of each bead is required. Critically, the inclusion of internal friction between beads is also necessary for a faithful representation of protein dynamics. We propose to optimize the parameters of the CG model through a self-averaging method that integrates the CG dynamics with an evolution equation for the CG parameters. This approach ensures that selected quantities, such as the radial distribution function and the time correlation of bead velocities, match the corresponding MD values.", "url": "https://arxiv.org/abs/2606.27133", "type": "理论+数值", "summary": "1. 该工作通过系统比较全原子分子动力学模拟，论证了在基于Mori-Zwanzig形式导出的粗粒化球蛋白模型中，珠间内部摩擦——源自粗粒化过程中缺失的自由度——是准确重现蛋白质水溶液动力学的关键要素。\n2. 其核心卖点在于采用自平均优化方法，通过将粗粒化动力学与参数演化方程耦合，使径向分布函数和速度时间关联函数精确匹配全原子模拟，从而同时确定弹性、自摩擦和内部摩擦参数。\n3. 这为构建兼具计算效率与动力学校准能力的粗粒化生物分子模型提供了系统框架，并深化了对蛋白质内禀摩擦机制及其在构象动力学中作用的理解。", "summary_source": "deepseek", "authors": [{"name": "Carlos Monago"}, {"name": "J. A. de la Torre"}, {"name": "Rafael Delgado-Buscalioni"}, {"name": "Pep Español"}], "featured_authors": [{"name": "Carlos Monago"}, {"name": "J. A. de la Torre"}, {"name": "Rafael Delgado-Buscalioni"}, {"name": "Pep Español"}], "author_count": 4}, {"id": "2606.27186", "category": "cond-mat", "title": "An integrable approach to macroscopic fluctuation theory for the multispecies SSEP", "abstract": "We study the macroscopic fluctuation theory (MFT) of a multispecies generalization of the symmetric simple exclusion process (mSSEP) on the infinite line, in which particles of $N+1$ species -- including, possibly, a vacancy species -- exchange positions at unit rate. Working with the full, redundant set of coarse-grained densities $\\bfrho=\\{\\rho_0,\\dots,\\rho_N\\}$ keeps the relabelling symmetry of the model manifest throughout. We first extend the argument of Derrida and Gerschenfeld to the multispecies setting, showing that the cumulant generating function of the multispecies current between two regions of an arbitrary graph depends on the boundary densities $ \\bfrho_L,\\bfrho_R$ and on the fugacities $\\bflambda$ only through a single scalar variable $\\omega$. We then formulate the MFT saddle-point equations for the mSSEP on the infinite line and show that they define an integrable system: they are of Landau--Lifshitz type, and a Zakharov--Takhtajan gauge transformation recasts them in AKNS form. Solving the resulting linear scattering problem by the inverse scattering method, we recover the cumulant generating function $F(\\omega)$ for the multispecies current, as well as the initial and final density profiles conditioned on a prescribed current fluctuation. In particular, we show that $F(\\omega)$ coincides with the function obtained by Derrida and Gerschenfeld for the single-species SSEP, now derived for an arbitrary number of species directly from the integrable structure of the multispecies MFT equations.", "url": "https://arxiv.org/abs/2606.27186", "type": "理论", "summary": "1. 该工作针对无限长直线上的多物种对称简单排斥过程(mSSEP)，构建了其宏观涨落理论(MFT)的可积性表述。\n2. 其技术核心在于将MFT鞍点方程化归为Landau-Lifshitz型可积系统，通过Zakharov–Takhtajan规范变换转化为AKNS形式，并利用逆散射方法精确求解。\n3. 这为计算任意物种数下多物种电流的累积生成函数及条件密度分布提供了解析框架，并揭示了其与单物种SSEP在可积结构上的内在统一性。", "summary_source": "deepseek", "authors": [{"name": "Luigi Cantini"}], "featured_authors": [{"name": "Luigi Cantini"}], "author_count": 1}, {"id": "2606.27204", "category": "cond-mat", "title": "Finite temperature precursors of Mottness in the Fermi Hubbard model", "abstract": "We investigate finite-temperature precursors of Mottness in the repulsive Hubbard model above the spin-ordering temperature, using numerically exact determinant quantum Monte Carlo. We show that the finite-temperature crossover is accompanied by a pronounced suppression of charge fluctuations, despite the presence of a gapless single-particle spectra, demonstrating that Mottness first emerges via two-particle response in an anomalous metallic regime, before appearing in single-particle spectral functions. We further show that a gap formation in the density of states occurs through momentum-resolved redistribution of spectral weight across the Brillouin zone, that begins at the onset of anomalous metallic regime, rather than through gap formation in single-particle spectral functions at individual momenta. Upon doping, the anomalous-metallic regime generates transport and spectroscopic signatures characteristic of doped Mott insulators. This shows that the transport and spectroscopic anomalies of the doped Hubbard model do not require the presence of a fully formed Mott insulator at half-filling, but instead originate from the strong charge-response renormalization and spectral-weight redistribution that develop within the precursor anomalous metallic regime at half-filling.", "url": "https://arxiv.org/abs/2606.27204", "type": "理论+数值", "summary": "1. 该工作利用数值精确的行列式量子蒙特卡洛方法，系统研究了费米-哈伯德模型中自旋序温度以上的有限温度Mott前驱现象。\n2. 核心物理发现是：在单粒子谱仍为无能隙的情况下，两粒子响应中的电荷涨落已显著受抑，且动量分辨的谱权重重新分布驱动了态密度能隙的形成。\n3. 这揭示了掺杂哈伯德模型的异常输运与谱学特征并非源自半满时的完全Mott绝缘体，而是源于前驱异常金属态中电荷响应强重整化与谱权重再分布。", "summary_source": "deepseek", "authors": [{"name": "Sayantan Roy"}, {"name": "Abhisek Samanta"}, {"name": "Nandini Trivedi"}], "featured_authors": [{"name": "Sayantan Roy"}, {"name": "Abhisek Samanta"}, {"name": "Nandini Trivedi"}], "author_count": 3}, {"id": "2606.27263", "category": "cond-mat", "title": "Field theories for Laplacian Growth", "abstract": "Loop-erased random walks (LERW), the $O(n)$-model at ${n=-2}$ and Laplacian random walks (LRW) are three realizations of the same random process. While this equivalence holds on any graph, renormalization is possible only via the $O(-2)$-model. To generalize LRWs to $b$-LRWs or to Diffusion Limited Aggregation (DLA), a field theory directly on the Laplacian growth process is necessary. Here we construct an exact lattice action for LRWs and show that its perturbative expansion equals that of LERWs. We then generalize this approach to $b$-LRWs and DLA.", "url": "https://arxiv.org/abs/2606.27263", "type": "理论", "summary": "1. 该工作为拉普拉斯随机游走构建了精确晶格作用量，并证明其微扰展开与擦除随机游走等价。\n2. 其核心在于直接建立了拉普拉斯增长过程的场论，从而可将方法推广到b-LRW与扩散限制聚集。\n3. 这为随机聚集与界面生长过程的场论描述提供了统一的晶格框架和微扰分析途径。", "summary_source": "deepseek", "authors": [{"name": "Paolo Pisapia"}, {"name": "Assaf Shapira"}, {"name": "Kay Joerg Wiese"}], "featured_authors": [{"name": "Paolo Pisapia"}, {"name": "Assaf Shapira"}, {"name": "Kay Joerg Wiese"}], "author_count": 3}, {"id": "2606.27279", "category": "cond-mat", "title": "Strong coupling between propagating spin wave and microwave photons in a superconducting resonator", "abstract": "We demonstrate strong coupling between propagating spin wave modes and microwave photons in superconducting resonator-magnetic thin film hybrid circuits. By fabricating the resonator directly on yttrium iron garnet thin films grown on rare-earth-free Y$_3$Sc$_2$Ga$_3$O$_{12}$ substrates, we achieve strong coupling of both Damon-Eshbach and backward-volume spin wave modes to the resonator, with coupling strengths exceeding both the magnon and photon damping rates. Furthermore, we observe nonreciprocal spin wave radiation of the hybrid magnonic mode in the Damon-Eshbach configuration, highlighting the potential for incorporating intrinsic spin-wave nonreciprocity into hybrid magnonic systems. These results open new avenues for integrating spin-wave magnonics with cavity magnonics, and for harnessing spin waves for potential applications in quantum information science.", "url": "https://arxiv.org/abs/2606.27279", "type": "理论", "summary": "1. 该工作演示了超导谐振器中传播自旋波模式与微波光子之间的强耦合。\n2. 其技术要点在于直接在钇铁石榴石薄膜上制备谐振器，实现了Damon-Eshbach与后向体积自旋波模式的强耦合，耦合强度超过磁子与光子阻尼率，并观察到Damon-Eshbach构型下混合磁子模式的非互易自旋波辐射。\n3. 这为整合自旋波磁子学与腔体磁子学，以及利用自旋波的非互易性于量子信息科学提供了新途径。", "summary_source": "deepseek", "authors": [{"name": "Yi Li"}, {"name": "Jinho Lim"}, {"name": "Xingzhi Wang"}, {"name": "Tomas Polakovic"}, {"name": "Carissa Kiehl"}, {"name": "Moojune Song"}, {"name": "Phuoc Cao Van"}, {"name": "Ralu Divan"}, {"name": "Ulrich Welp"}, {"name": "Charudatta Phatak"}, {"name": "Jong-Ryul Jeong"}, {"name": "Kab-Jin Kim"}, {"name": "Jian-Min Zuo"}, {"name": "Axel Hoffmann"}, {"name": "Valentine Novosad"}], "featured_authors": [{"name": "Yi Li"}, {"name": "Jinho Lim"}, {"name": "Xingzhi Wang"}, {"name": "Jian-Min Zuo"}, {"name": "Axel Hoffmann"}, {"name": "Valentine Novosad"}], "author_count": 15}, {"id": "2606.27296", "category": "cond-mat", "title": "Weak-Flow Induced Dielectric Axes Rotation in Dipolar Suspensions", "abstract": "Conventional rheodielectric studies of dipolar suspensions primarily examine flow-induced variations in the principal permittivity components. In contrast, an asymptotic solution of the perturbed Fokker--Planck equation for orientable Brownian dipoles under weak flow predicts the emergence of off-diagonal permittivity components that are linear in the relative flow strength. For planar shear flow, these terms exceed the corresponding higher-order diagonal corrections, leading to a rotation of the principal dielectric axes. This previously unrecognized rheodielectric response suggests new possibilities for flow-controlled dielectric and electro-optical functionalities.", "url": "https://arxiv.org/abs/2606.27296", "type": "理论", "summary": "1. 该工作通过求解弱流扰动下的可取向布朗偶极子Fokker-Planck方程，预言了悬浮液中非对角介电分量的涌现。\n2. 其物理卖点是弱剪切流下非对角项超过对角高阶修正，首次揭示出流致介电主轴旋转的新机制。\n3. 这为基于流场调控的介电与电光功能器件设计提供了可检验的理论新途径。", "summary_source": "deepseek", "authors": [{"name": "Pramodt Srinivasula"}], "featured_authors": [{"name": "Pramodt Srinivasula"}], "author_count": 1}, {"id": "2606.27310", "category": "cond-mat", "title": "Proactivity and pinning in the non-reciprocal XY model with vision anisotropy", "abstract": "We study a non-reciprocal XY model on a square lattice, in which spins interact with their nearest neighbors through vision-induced anisotropic interaction. Such anisotropy breaks rotational symmetry and leads to the pinning of the spin orientation along preferred lattice directions. We systematically characterize this phenomenon for different interaction kernels, including modulated, sinusoidal, von Mises, and hard vision-cone couplings, and for two classes of microscopic update rules: Glauber and Langevin dynamics. A central result of this work is the identification and detailed analysis of two distinct contributions that naturally arise in the Langevin formulation, which we refer to as the reactive and the proactive term. We derive the corresponding equations governing both local fluctuations and the global orientation, and use them to characterize the mechanisms responsible for directional pinning. We show that both reactive and proactive contributions can generate global pinning, whereas their role in determining local pinning depends on the specific interaction kernel and may differ qualitatively. Our analysis clarifies the distinction between local and global pinning, explains the emergence of preferred lattice directions in the different models considered, and reconciles apparent discrepancies reported in previous studies. More generally, it provides a microscopic framework for understanding lattice-induced orientational selection in non-reciprocal XY models.", "url": "https://arxiv.org/abs/2606.27310", "type": "理论", "summary": "1. 该工作研究了正方晶格上具有视觉各向异性相互作用的非互易XY模型，系统刻画了不同相互作用核（包括调制、正弦、von Mises和硬视锥耦合）及两种微观更新规则（Glauber和Langevin动力学）中自旋取向沿晶格方向的钉扎现象。\n2. 其核心在于在Langevin表述中识别出反应项与主动项两类自然出现的贡献，并推导出描述局部涨落和全局取向的方程，揭示了二者在产生全局钉扎中的共同作用，以及它们在局部钉扎上随相互作用核而异的定性差异。\n3. 这为理解非互易XY模型中晶格诱导的取向选择提供了微观框架，澄清了局部与全局钉扎的区别，并调和了以往研究中的明显矛盾，对相关非互易集体行为的研究具有启发意义。", "summary_source": "deepseek", "authors": [{"name": "Gabriele Bandini"}, {"name": "Asja Jelic"}, {"name": "Andrea Gambassi"}], "featured_authors": [{"name": "Gabriele Bandini"}, {"name": "Asja Jelic"}, {"name": "Andrea Gambassi"}], "author_count": 3}, {"id": "2606.27337", "category": "cond-mat", "title": "Exact subsystem dynamics in the deterministic Floquet-PXP model", "abstract": "The dynamics of local subsystems in a thermodynamically large quantum many-body system can be understood as effectively open as the system produces its own effective bath. The action of this bath can be characterised in terms of the so-called influence matrices. In generic situations, the complexity of these objects grows unfavourably with time, however, there exist solvable cases where influence matrices can be characterised exactly even in the presence of non-trivial interactions. Here we show that Rule 201, a deterministic version of the Floquet-PXP model, is one of these solvable instances. Indeed, it admits influence matrices given by a finite-dimensional matrix-product operator (MPO) that solves a finite set of algebraic conditions. We provide the solution, and characterise multi-time autocorrelation functions.", "url": "https://arxiv.org/abs/2606.27337", "type": "理论", "summary": "1. 该工作证明确定性Floquet-PXP模型（Rule 201）的子系统影响矩阵可由有限维矩阵乘积算符精确描述。\n2. 其核心在于模型满足有限代数条件，使影响矩阵复杂性不随时间增长，从而直接获得多时间自关联函数的解析解。\n3. 这为在其他强关联量子多体系统中发现类似精确可解的影响矩阵结构提供了明确范例。", "summary_source": "deepseek", "authors": [{"name": "Katja Klobas"}], "featured_authors": [{"name": "Katja Klobas"}], "author_count": 1}, {"id": "2606.27351", "category": "cond-mat", "title": "Specific absorption rate of uniaxial single-domain nanomagnets: stochastic spin dynamics versus linear response theory", "abstract": "We compute the specific absorption rate of a uniaxial single-domain nanomagnet driven by an alternating magnetic field by two methods: i) direct numerical integration of the stochastic (Langevin) Landau--Lifshitz--Gilbert equation (the LLL approach), and ii) linear response theory (LRT) based on the Debye susceptibility with the Néel relaxation time $\\tau_\\mathrm{N}$. We first analytically show that both methods are equivalent for small magnetic field amplitude, and then compute their deviation $\\Lambda\\equiv \\mathrm{SAR}_{\\mathrm{LLL}}/\\mathrm{SAR}_{\\mathrm{LRT}}-1$ as a function of the magnetic field amplitude for two temperatures chosen on opposite sides of the Debye resonance. One of the main results is that the sign and magnitude of $\\Lambda$ are governed by the dimensionless product $\\omega\\tau_\\mathrm{N}$, in addition to the linearity parameter $\\xi=\\mu_{s}B_{0}/k_{B}T$ for the easy-axis geometry considered here. Indeed, below resonance ($\\omega\\tau_\\mathrm{N}<1$), linear response theory overestimates the specific absorption rate. In contrast, above resonance ($\\omega\\tau_\\mathrm{N}>1$, the regime typical of blocked nanoparticles), linear response theory can underestimate the specific absorption rate by up to $\\sim70\\%$ at $\\xi\\sim2$. We expect this work to provide quantitative guidance for the use of linear response theory in magnetic hyperthermia and related nanoscale heat-transport problems, and to serve as a single-particle benchmark for extensions to many-spin and interacting systems.", "url": "https://arxiv.org/abs/2606.27351", "type": "理论+数值", "summary": "1. 该工作通过随机Landau-Lifshitz-Gilbert方程数值积分与基于德拜磁化率的线性响应理论两种方法，计算了单轴单畴纳米磁体在交变磁场下的比吸收率。\n2. 其核心发现是两种方法在弱场下等效，偏差Λ由无量纲参数ωτ_N与线性参数ξ共同决定：低于共振时线性响应高估比吸收率，高于共振时则最高低估约70%。\n3. 这为磁热疗及纳米尺度热输运问题中线性响应理论的适用范围提供了定量判据，并可作为多自旋与相互作用体系拓展的单粒子基准。", "summary_source": "deepseek", "authors": [{"name": "H. Kachkachi"}], "featured_authors": [{"name": "H. Kachkachi"}], "author_count": 1}, {"id": "2606.26163", "category": "hep-th", "title": "Large-$N$ Carrollian Thermodynamics from AdS Black-Hole Phase-Space Contractions", "abstract": "We develop the boundary and celestial interpretation of finite Carrollian black-hole thermodynamics. The bulk input is the phase-space contraction of the time generator and Newton constant for which the extended AdS first law has a finite Carrollian limit. We show that this finite first-law line has a holographic interpretation as a double-scaled low-temperature, large-$N$ ensemble: the Carrollian temperature decreases while the effective number of boundary degrees of freedom grows, leaving the thermodynamic products in the first law finite. The large-$N$ dictionary is anchored by the standard $\\mathrm{AdS}_5/\\mathrm{CFT}_4$ normalization of adjoint degrees of freedom and by the Brown--Henneaux central charge in $\\mathrm{AdS}_3/\\mathrm{CFT}_2$. We construct the finite Carrollian Brown--York stress tensor on the contracted AdS boundary and show that its global energy charge is the finite bulk Hamiltonian. We then derive the boundary form of the first law in terms of the spatial volume and the holographic degree-of-freedom normalization. This identifies the Hawking--Page locus with the zero of the chemical potential conjugate to the count of degrees of freedom. The same charge is the global Carrollian supertranslation charge, so the finite first law is the thermal zero-mode sector of the Carrollian Ward identity. Finally, we construct the celestial conformal-primary representation of thermal Carrollian correlators. The finite celestial-basis correlators are rescaled double-scaled correlators obtained by combining the Fourier--Mellin transform with the rescaled thermal frequency window.", "url": "https://arxiv.org/abs/2606.26163", "type": "理论", "summary": "1. 该工作从AdS黑洞相空间收缩出发，建立了有限Carrollian黑洞热力学的边界与天球解释，并论证其对应双重标度低温大N系综。\n2. 其核心在于通过扩展AdS第一定律的有限Carrollian极限，结合Brown-Henneaux中心荷等标准归一化，构造有限Carrollian Brown-York应力张量，并揭示Hawking-Page locus为自由度化学势零点。\n3. 这为Carrollian全息对偶及天球全息中的热力学零模扇区与关联函数提供了统一框架，有望推动黑洞物理与边界场论交叉研究。", "summary_source": "deepseek", "authors": [{"name": "Yingnan Xu"}, {"name": "Shuangshuang Chu"}], "featured_authors": [{"name": "Yingnan Xu"}, {"name": "Shuangshuang Chu"}], "author_count": 2}, {"id": "2606.26221", "category": "hep-th", "title": "De Sitter Representations", "abstract": "We review the representations of so(1,D), the algebra of isometries of D dimensional de Sitter space. We cover the representations in all D, including mixed symmetry representations and fermionic representations, and connect them to the various types of fields that can propagate on de Sitter space. The presentation is from a physics point of view, favoring concrete constructions over abstract considerations.", "url": "https://arxiv.org/abs/2606.26221", "type": "理论", "summary": "1. 该工作系统回顾了D维de Sitter空间等距代数so(1,D)的表示理论，覆盖所有维度、混合对称表示及费米子表示。\n2. 其技术特点是从物理视角将表示与de Sitter空间上传播的各类场直接关联，侧重具体构造而非抽象处理。\n3. 这为de Sitter空间中的场论与量子引力研究提供了统一的表示论框架和明确启发。", "summary_source": "deepseek", "authors": [{"name": "Kurt Hinterbichler"}], "featured_authors": [{"name": "Kurt Hinterbichler"}], "author_count": 1}, {"id": "2606.26224", "category": "hep-th", "title": "Conserved charges and $L_\\infty$ algebras", "abstract": "We give a formula for conserved charges in an arbitrary Lagrangian field theory expressed in the framework of $L_\\infty$ algebras. The formula is expressed in terms of the theory's $L_\\infty$ data alone, without reference to the derivative structure of the Lagrangian. Therefore conserved charges can be computed in nonlocal models, such as string field theory, where conventional methods break down. We also show that the formula correctly expresses the surface charge of general relativity in terms of the Brown-York stress tensor. Related computations in Yang-Mills theory suggest that spatial boundaries are dealt with in a natural fashion.", "url": "https://arxiv.org/abs/2606.26224", "type": "理论", "summary": "1. 该工作给出了任意拉格朗日场论中守恒荷的L∞代数公式，统一表达于理论的正反演代数结构。\n2. 其核心在于公式仅依赖L∞代数数据，无需拉格朗日的导数结构，从而适用于弦场论等非局域模型。\n3. 这为广义相对论表面荷与Brown-York应力张量的关联提供了方法，并自然处理杨-米尔斯理论的空间边界。", "summary_source": "deepseek", "authors": [{"name": "Vinícius Bernardes"}, {"name": "Theodore Erler"}, {"name": "Atakan Hilmi Fırat"}], "featured_authors": [{"name": "Vinícius Bernardes"}, {"name": "Theodore Erler"}, {"name": "Atakan Hilmi Fırat"}], "author_count": 3}, {"id": "2606.26241", "category": "hep-th", "title": "An observer's quantization of 3d de Sitter", "abstract": "What is the density of states of the de Sitter static patch? We propose a definition and calculation of such a density in 3d dS. Our proposal involves a sum over an SL(2,$\\mathbb{Z}$) set of Euclidean no-boundary Kerr-lens spacetimes sourced by a line-defect with given energy and spin - which in Lorentzian time represents an observer's worldline at the center of the dS static patch. We develop an exact quantum computation of the spectral density using a holographic duality between dS$_3$ gravity and two copies of $\\mathbb{C}$LS, the complex Liouville string. The SL(2,$\\mathbb{Z}$) Kerr-lens spacetimes map under the duality to an SL(2,$\\mathbb{Z}$) family of generalized crosscap geometries. We compute the $\\mathbb{C}$LS $\\otimes$ $\\mathbb{C}$LS crosscap amplitudes and show that they match the semi-classical gravity prediction. For the simplest non-trivial Kerr-lens space, the $\\mathbb{C}$LS $\\otimes$ $\\mathbb{C}$LS description is, in turn, dual to two copies of the $G\\Sigma$ effective field theory of the double scaled SYK model. The $G\\Sigma\\otimes G\\Sigma$ theory lives on an observer's worldline in the static patch, setting the stage for developing a microscopic worldline hologram of 3d de Sitter.", "url": "https://arxiv.org/abs/2606.26241", "type": "理论", "summary": "1. 该工作提出并计算了三维de Sitter静态片中包含观察者世界线的态密度，通过对SL(2,Z)族欧几里得无边界Kerr-lens时空求和实现。\n2. 其技术核心在于利用dS₃引力与复Liouville弦的精确全息对偶，将谱密度转化为CLS⊗CLS交叉盖振幅，并在最简单情形下进一步对偶至双重缩并SYK模型的GΣ有效场论。\n3. 这为在静态片观察者世界线上构建微观世界线全息图奠定基础，有望揭示de Sitter量子引力的微观自由度。", "summary_source": "deepseek", "authors": [{"name": "Andreas Blommaert"}, {"name": "Damiano Tietto"}, {"name": "Herman Verlinde"}], "featured_authors": [{"name": "Andreas Blommaert"}, {"name": "Damiano Tietto"}, {"name": "Herman Verlinde"}], "author_count": 3}, {"id": "2606.26263", "category": "hep-th", "title": "Charged and rotating near-horizon geometries in five dimensions", "abstract": "We present new charged and rotating near-horizon geometries in five-dimensional Einstein-Maxwell theory in closed analytic form. The solutions can be parametrised by the charge and two independent angular momenta. We also generalise these near-horizon geometries to theories with an additional Chern-Simons term in the action multiplied by an arbitrary coupling constant. The new solutions have the same entropy relations as expected for charged versions of extremal Myers-Perry black holes and for rotating versions of extremal Reissner-Nordström-Tangherlini black holes, but they do not reduce to the Myers-Perry horizon in the vacuum limit. The horizon cross-sections are spherical and carry a Sasakian structure. We exploit this structure to prove a characterisation of our solutions: without any symmetry assumptions, they are the most general rotating extremal horizons for which the co-rotating electric field is a (non-zero) constant. We further extend this construction to higher dimensions, where we show that any Sasaki-Einstein manifold generates a two-parameter family of charged and rotating horizons.", "url": "https://arxiv.org/abs/2606.26263", "type": "理论", "summary": "1. 本文给出了五维爱因斯坦-麦克斯韦理论中带电荷与双角动量的近视界几何的闭式解析解，并推广至含任意耦合常数的Chern-Simons项。\n2. 其核心在于解具有Sasakian结构，且被证明是共转电场为非零常数条件下最一般的旋转极端视界，无需对称性假设。\n3. 该构造可推广至高维，表明任意Sasaki-Einstein流形均可生成两参数电荷旋转视界，为极端黑洞熵的几何起源提供新线索。", "summary_source": "deepseek", "authors": [{"name": "Alex Colling"}, {"name": "Jun Liu"}], "featured_authors": [{"name": "Alex Colling"}, {"name": "Jun Liu"}], "author_count": 2}, {"id": "2606.26280", "category": "hep-th", "title": "A Circle That Won't Return: The Fate of RR Fluxes and D-branes in Type 0A Tachyon Condensation", "abstract": "We study the closed-string tachyon and doubled Ramond-Ramond sector of type 0A in light of the proposed M-theory description on $S^1\\vee S^1$-the wedge of two circles joined at a point. In this picture the two RR copies are associated with the two circle components, which we call branches, and tachyon condensation corresponds to shrinking one branch to the type IIA endpoint. From the type 0A equations of motion, we derive the branch-balance condition for a tachyon stationary point and identify the branch-odd RR fluctuation that sources the tachyon around a symmetric background. We then analyze the fate of the collapsing branch RR data as one branch of the wedge collapses to the type IIA endpoint. For an isolated unscreened collapsing-branch $D_p^-$ source, a Gauss-law estimate shows that the long-range RR field-energy cost scales inversely with the shrinking circle and thus becoming infinitely costly, generalizing the $D0^-$-brane decoupling in the original wedge picture. We describe the infrared screening of the relative RR field through an effective higher-form Stückelberg mechanism and distinguish this from a possible discharge of localized relative charge. Finally, using standard Wess-Zumino couplings of D-branes, we identify an effective relative-charge carrier and derive a parametric thin-wall criterion for when such a discharge channel $D_p^- \\to D_p^+$ can be energetically favored.", "url": "https://arxiv.org/abs/2606.26280", "type": "理论", "summary": "1. 该工作基于M理论在S¹∨S¹上的描述，研究了类型0A中闭弦快子凝聚下双倍Ramond-Ramond扇区与D膜的命运。\n2. 其核心在于推导出分支平衡条件并识别出快子的分支奇RR涨落源，发现孤立收缩分支D_p⁻源的长程RR场能量成本随收缩圆反比发散，从而推广了D0⁻退耦。\n3. 这为理解快子凝聚中RR通量的红外屏蔽（通过高阶Stückelberg机制）及相对电荷放电的薄壁判据提供了关键启发，深化了弦论中几何与动力学耦合的图景。", "summary_source": "deepseek", "authors": [{"name": "Ahmed Rakin Kamal"}], "featured_authors": [{"name": "Ahmed Rakin Kamal"}], "author_count": 1}, {"id": "2606.26302", "category": "hep-th", "title": "Dirichlet, Neumann, Mixed and self-dual holography: (self-dual) Yang--Mills theory II", "abstract": "We consider Yang--Mills, Chalmers--Siegel and self-dual Yang--Mills (SDYM) theories within AdS/CFT correspondence. Bulk-to-bulk and boundary-to-bulk propagators are derived in various gauges and for Dirichlet, Neumann, mixed and self-dual boundary conditions. Three- and four-point holographic correlators are computed in the three theories to establish the relation between the observables thereof. This is a companion paper to [ arXiv:2602.21658 ].", "url": "https://arxiv.org/abs/2606.26302", "type": "理论", "summary": "1. 该工作在AdS/CFT对应框架下，对杨-米尔斯、Chalmers-Siegel与自对偶杨-米尔斯理论，推导了多种规范与边界条件下的体-体及边界-体传播子。\n2. 其卖点在于通过三点和四点全息关联函数的计算，建立了三种理论中可观测量之间的精确对应关系。\n3. 这为深入理解全息对偶中自对偶性、边界条件选择与体理论可观测量的联系提供了明确的技术路径。", "summary_source": "deepseek", "authors": [{"name": "Evgeny Skvortsov"}, {"name": "Richard Van Dongen"}], "featured_authors": [{"name": "Evgeny Skvortsov"}, {"name": "Richard Van Dongen"}], "author_count": 2}, {"id": "2606.26357", "category": "hep-th", "title": "Deformed BTZ Radiance and Single Trace $T\\bar{T}$ Holography", "abstract": "We generalize the \"holar wind\" mechanism proposed in arXiv:2303.00234 to the case of rotating $\\lambda$-deformed BTZ black holes. These backgrounds, which interpolate between $AdS_3$ in the infrared and a linear dilaton spacetime in the ultraviolet, are realized as an exact $\\frac{SL(2,\\mathbb{R})_k\\times U(1)}{U(1)}$ gauged-WZW worldsheet theory. The long string sector of the theory provides a holographic dual to single-trace $T\\overline{T}$ deformed symmetric product $\\mathcal{M}^p/S_p$ $CFT_2$ with a seed $\\mathcal{M}$ carrying a central charge $c=6k$. By analyzing the geodesics and tunneling rates of probe particles and winding long strings, we show that the emission probabilities for both positive and negative deformation couplings are universally governed by the change in the Bekenstein-Hawking entropy, $\\Delta S_{BH}$. A central result of our analysis is that the consistency of long string emission within the grand canonical ensemble dictates a unique value for the background B-field at the origin. We demonstrate that this thermodynamically fixed value matches precisely the prediction required for the string excitation spectrum to agree with the $\\mathbb{Z}_w$ twisted sector of a single-trace $T\\overline{T}$ deformed symmetric product orbifold. Finally, we sketch the extension of these results to a broader class of black holes whose long string sector is dual to single-trace $T\\overline{T} + J\\overline{T} + T\\overline{J}$ deformed theories.", "url": "https://arxiv.org/abs/2606.26357", "type": "理论", "summary": "1. 该工作将“holar wind”机制推广至旋转λ形变BTZ黑洞，通过精确SL(2,R)_k×U(1)/U(1)规范WZW模型实现，其长弦扇区对偶于单迹T\\bar{T}形变对称积CFT_2。\n2. 核心在于探针粒子与绕行长弦的测地线与隧穿率分析，证明正负形变耦合下的发射概率普遍由贝肯斯坦-霍金熵变ΔS_BH决定，且巨正则系综下长弦发射一致性唯一固定了原点处B场，该热力学值精确匹配单迹T\\bar{T}形变对称积轨道折叠的Z_w扭转扇区预言。\n3. 这为将结果推广至长弦扇区对偶于单迹T\\bar{T}+J\\overline{T}+T\\overline{J}形变理论的一类更广泛黑洞提供了明确路径。", "summary_source": "deepseek", "authors": [{"name": "Daniel Vainshtein"}], "featured_authors": [{"name": "Daniel Vainshtein"}], "author_count": 1}, {"id": "2606.26504", "category": "hep-th", "title": "Duality-covariant particles and exotic branes", "abstract": "In this paper we construct duality-covariant worldvolume dynamics of particles and branes. We extend known actions and phase space formulations to include the hidden $E_8$ symmetry of 11D supergravity, analogous to the Ehlers symmetry of 4D gravity. Making the worldvolume theory manifestly duality-covariant requires the ancillary structure of $E_8$ exceptional field theory to be taken into account. For zero-branes, we propose an enlarged worldline model with a coadjoint orbit term to encode this. More generally, we propose worldvolume theories for arbitrary exotic branes in a way that generalises the known gauged sigma model of the Kaluza-Klein monopole. These are natural in the duality-covariant Hamiltonian formulation employed here. We discuss the case of zero-branes in eleven dimensions as an illustrative example.", "url": "https://arxiv.org/abs/2606.26504", "type": "理论", "summary": "1. 该工作构建了粒子和膜的规范协变世界体积动力学，扩展至包含1维超引力隐藏E8对称性。\n2. 其技术核心在于借助E8例外场论结构，通过世界线模型中的共伴轨道项实现零膜对偶协变性，并推广了异类膜的背景规范模型。\n3. 这为统一描述超引力中的隐藏对称性及任意异类膜的动力学提供了哈密顿框架，并在1维零膜实例中验证了其可行性。", "summary_source": "deepseek", "authors": [{"name": "Josh O'Connor"}, {"name": "David Osten"}], "featured_authors": [{"name": "Josh O'Connor"}, {"name": "David Osten"}], "author_count": 2}, {"id": "2606.26546", "category": "hep-th", "title": "Holographic $s$- and $p$-wave superconductors from the $4D$ regularization of Einstein-Lovelock theory", "abstract": "We investigate holographically dual descriptions of $(2+1)$-dimensional s-wave and p-wave superconductors in the framework of regularized four-dimensional Einstein-Lovelock gravity theories, incorporating higher curvature corrections beyond the Gauss-Bonnet sector. We first implement the 4D regularization of Einstein-Lovelock gravity with finely tuned coupling constants to include corrections up to any $K$th order in curvature. The bulk geometry is constructed from exact black-brane solutions characterized by the fine-tuned Lovelock coupling $\\alpha$ and the highest power of curvature in the Lagrangian K. We then analyze the condensation of scalar and vector operators dual to minimally coupled matter fields, focusing on two bulk-field mass prescriptions, which significantly affect the superconducting phase. Our results demonstrate that higher curvature terms significantly modify the phase structure of both s-wave and p-wave systems and enhance the sensitivity of the condensates and critical temperatures to the gravitational couplings. In both cases, the critical temperature generally increases with the maximal curvature order K, leading to higher-$T_c$ phases compared to Einstein gravity, particularly for negative $\\alpha$. The coupling $\\alpha$ effectively governs the strength of higher curvature interactions in the bulk: positive $\\alpha$ suppresses condensation and lowers $T_c$, whereas negative $\\alpha$ enhances superconducting order and promotes higher-$T_c$ phases relative to Einstein gravity. We further study the optical conductivity and find that both the gap frequency and the ratio $\\omega_g/T_c$ exhibit a strong dependence on $\\alpha$ and $K$, deviating from the universal Einstein-gravity result. Higher curvature effects enhance the superconducting gap scale. Notably, the p-wave system shows a stronger sensitivity to the mass-fixing prescription compared to the s-wave case.", "url": "https://arxiv.org/abs/2606.26546", "type": "理论", "summary": "1. 该工作利用四维爱因斯坦-洛弗洛克引力正则化方案构造含高阶曲率修正的黑膜背景，研究了(2+1)维s波和p波全息超导体的凝聚与输运性质。\n2. 物理核心在于精细调谐耦合常数α和曲率阶数K使高阶修正项显著调控相结构：负α增大临界温度T_c，正α抑制凝聚，且p波系统对场质量方案更为敏感。\n3. 该结果表明高阶曲率效应可增强超导能隙并偏离爱因斯坦引力普适结果，为在引力全息框架中探索强关联高温超导机制提供了可控的理论扩展方向。", "summary_source": "deepseek", "authors": [{"name": "Soodeh Zarepour"}, {"name": "Ali Dehghani"}], "featured_authors": [{"name": "Soodeh Zarepour"}, {"name": "Ali Dehghani"}], "author_count": 2}, {"id": "2606.26623", "category": "hep-th", "title": "Central charges $C_J$ and $C_T$ in QED$_d$-GNY model and scalar QED$_d$", "abstract": "We compute the leading-order $1/N$ corrections to the central charges $C_J$ and $C_T$ in the conformal QED$_d$-Gross-Neveu-Yukawa (GNY) model and the scalar QED$_d$ in $d$ dimensions. The scaling dimensions of the lowest adjoint bilinear scalars are obtained to order $O(1/N)$ for general $d$. In $d=3$, the $U(1)$ Abelian gauge theory possesses a topological $U(1)$ global symmetry, and we evaluate the central charge $C_J^{\\text{top}}$ of the topological symmetry current to subleading order in the $1/N$ expansion. Our interest in these theories is primarily motivated by their potential connection to the $SO(5)$ symmetric deconfined quantum critical point (DQCP). We compare the large $N$ results for the central charges $C_J$ and $C_T$ with the conformal data of the $SO(5)$ DQCP obtained from fuzzy sphere and conformal bootstrap. The large $N$ predictions of the QED$_3$-GNY model are found to be in reasonable agreement with the nonperturbative estimates for the $SO(5)$ DQCP.", "url": "https://arxiv.org/abs/2606.26623", "type": "理论", "summary": "1. 该工作计算了共形QED_d-格罗斯-内维-尤卡瓦模型和标量QED_d中中心荷C_J和C_T在1/N展开下的领头阶修正，并得到三维拓扑U(1)对称流中心荷的次领头阶贡献。\n2. 其技术要点在于获得一般维度下最低伴随双线性标量算符的标度维数至O(1/N)，并将大N预言与SO(5)解禁量子临界点的模糊球及共形自举非微扰估计进行定量比较。\n3. 这显示QED_3-格罗斯-内维-尤卡瓦模型的大N结果与非微扰数据合理一致，为微扰视角理解解禁量子临界点提供了可检验的参考框架。", "summary_source": "deepseek", "authors": [{"name": "Yongwei Guo"}, {"name": "Zhijin Li"}], "featured_authors": [{"name": "Yongwei Guo"}, {"name": "Zhijin Li"}], "author_count": 2}, {"id": "2606.26660", "category": "hep-th", "title": "Generating Special Triangulations with Transformers", "abstract": "Triangulations, i.e., well-structured decompositions of geometric objects into triangle-like pieces, are central objects in many domains of mathematics and physics. In particular, fine, regular, and star triangulations (FRSTs) of 4D reflexive polytopes give rise to smooth Calabi-Yau threefolds, which are of significant interest in string theory. However, the high dimensionality and combinatorial complexity of triangulations make them particularly challenging to model with classical numerical methods or machine learning. In this work, we show that transformers, equipped with an appropriate encoding scheme, can be effectively trained to representatively generate new FRSTs across a range of polytope sizes. Moreover, these models can also self-improve through retraining on their own output. This opens the door to both concrete applications to the classification of Calabi-Yau manifolds and further research in physics, combinatorics and algebraic geometry.", "url": "https://arxiv.org/abs/2606.26660", "type": "理论", "summary": "1. 该工作证明配备适当编码方案的transformer可被有效训练，以代表性生成不同尺度4D自反多面体的精细正则星形三角剖分（FRST），从而获得相应的光滑Calabi-Yau三维流形。\n2. 其核心卖点在于模型可通过重新训练自身输出实现自改进，从而突破高维组合复杂性对经典数值或机器学习方法的限制。\n3. 这为Calabi-Yau流形的系统分类及弦论、组合学与代数几何中的相关研究开辟了新的生成与探索路径。", "summary_source": "deepseek", "authors": [{"name": "Charles Arnal"}, {"name": "Jacky H. T. Yip"}, {"name": "François Charton"}, {"name": "Gary Shiu"}], "featured_authors": [{"name": "Charles Arnal"}, {"name": "Jacky H. T. Yip"}, {"name": "François Charton"}, {"name": "Gary Shiu"}], "author_count": 4}, {"id": "2606.26892", "category": "hep-th", "title": "The Sharp Edges of Calabi-Yau Manifolds: Designing Symmetric Models for Ricci-flat Metrics", "abstract": "Computing Ricci-flat metrics on Calabi-Yau manifolds is challenging since no closed-form solutions are known. However, these computations are needed in order to make physical predictions in heterotic string theory, such as the masses of quarks and Yukawa couplings. In this manuscript, we present an overview of relevant literature for learning about Calabi-Yau manifolds, as ML researchers often face a steep learning curve when entering the field. Furthermore, we survey the impact of the manifold's symmetries on machine learning approximations to these flat metrics. We also characterise the isometries of Ricci-flat metrics, a result frequently omitted or used without proof. Then, we address symmetry breaking in point sampling and introduce a novel formula for computing volume ratios on general CICY manifolds. We conclude by presenting a new symmetry-aware model built using graph neural networks that avoids pathological behaviour witnessed in some other models.", "url": "https://arxiv.org/abs/2606.26892", "type": "理论", "summary": "1. 该工作综述了Calabi-Yau流形上Ricci平坦度量的机器学习近似，聚焦流形对称性如何影响模型精度并提出了对称性感知的图神经网络架构。\n2. 其核心卖点在于严格刻画了Ricci平坦度量的等距群，并引入一般CICY流形上体积比的新解析公式以应对点采样中的对称性破缺挑战。\n3. 这为异质弦理论中夸克质量与Yukawa耦合的精确计算提供了对称性约束下的高保真数值框架，并启发几何与机器学习交叉的进一步严格分析。", "summary_source": "deepseek", "authors": [{"name": "Viktor Mirjanić"}, {"name": "Challenger Mishra"}], "featured_authors": [{"name": "Viktor Mirjanić"}, {"name": "Challenger Mishra"}], "author_count": 2}, {"id": "2606.27022", "category": "hep-th", "title": "Dyeing form factors as amplitudes", "abstract": "The double copy of form factors has revealed a striking feature: poles that are spurious from the gauge-theory perspective become physical propagators in gravity. At the same time, form factors obey hidden factorization relations on the kinematics of these poles. We explain both phenomena by introducing a dyeing procedure, which promotes the color-singlet operator, or the Higgs particle representing it, to an adjoint massive state. The original form factor is recovered by the inverse bleaching operation, realized as a $U(1)$ decoupling of the dyed leg. In the dyed theory, these apparent spurious poles turn into ordinary physical propagators of colored amplitudes, and the hidden factorization relations follow from standard BCJ relations. Applying this framework to multiple operator insertions gives a systematic double-copy construction for multi-Higgs amplitudes and, as a byproduct, reveals scalar-ordering sectors. We also discuss higher-length scalar operators and fermionic operators, including the dyed vector construction for $\\bar{\\psi}\\gamma^{\\mu}\\psi$, as well as a loop-level example.", "url": "https://arxiv.org/abs/2606.27022", "type": "理论", "summary": "1. 该工作提出染色程序，将色单态算符提升为伴随有质量态，使形式因子转化为有色振幅，原虚假极点变为物理传播子。\n2. 卖点在于通过逆漂白操作和标准BCJ关系，统一解释规范理论中的隐藏因式分解及双拷贝下引力传播子的物理起源。\n3. 该方法系统推广至多希格斯振幅、高阶算符和费米子流，为量子场论中算符与振幅的对应及圈级构造提供新框架。", "summary_source": "deepseek", "authors": [{"name": "Xinyue Li"}, {"name": "Gang Yang"}, {"name": "Guorui Zhu"}], "featured_authors": [{"name": "Xinyue Li"}, {"name": "Gang Yang"}, {"name": "Guorui Zhu"}], "author_count": 3}, {"id": "2606.27054", "category": "hep-th", "title": "Non-topological solitons in biadjoint scalar field theory", "abstract": "Biadjoint scalar theory has been widely studied, due to its being closely related to the double copy correspondence linking gauge, gravity and related theories. In this paper, we continue a programme of work in elucidating non-linear solutions of this theory, and find a family of new solutions that are richer and more complex than previous cases. Using an ansatz that can be embedded in any choice of non-abelian colour groups, we demonstrate the existence of non-topological solitons, whose existence is protected by carrying a U(1) charge associated with certain rotations in colour space. The solutions are time-dependent, and closely related to the well-known Q-ball solutions in other scalar field theories. We also show explicitly that our solution set contains those that are stable under small perturbations within a consistent truncation of the theory, and have finite energy in addition to being localised.", "url": "https://arxiv.org/abs/2606.27054", "type": "理论", "summary": "1. 该工作通过可嵌入任意非阿贝尔色群的ansatz，在双伴随标量场理论中发现了一族时间依赖的非拓扑孤子解，其存在由色空间旋转对应的U(1)荷保护。\n2. 这些与Q-ball密切相关的孤子在理论的一致截断下对小扰动稳定，且具有有限能量与空间局域性，揭示了色对称性对非线性激发的保护机制。\n3. 这一发现拓展了双副本对应框架下非线性标量解的类型，为在规范与引力理论中寻找类似非拓扑孤子结构提供了新思路。", "summary_source": "deepseek", "authors": [{"name": "Kymani Armstrong-Williams"}, {"name": "Chris D. White"}], "featured_authors": [{"name": "Kymani Armstrong-Williams"}, {"name": "Chris D. White"}], "author_count": 2}, {"id": "2606.27093", "category": "hep-th", "title": "Index saddle for the D1-D5-P black string and its decoupling limit", "abstract": "Boruch, Emparan, Iliesiu, and Murthy recently discussed index saddles for 5d black strings, showing that the black string saddle admits a decoupling limit to a complex, finite-temperature BTZ \\times S^2 saddle that computes the index of the dual CFT. In this paper, we pursue an analogous construction for the D1-D5-P black string. We construct a four-charge index saddle in the four-dimensional STU model as the BPS limit of the non-extremal four-charge black hole, and show that it exhibits the new form of attraction. We then uplift it successively to five and six dimensions, via the 4D-5D connection and a chain of string dualities, to obtain the gravitational index saddle for the D1-D5-P black string. We take a systematic decoupling limit of this index saddle and obtain the BTZ \\times S^3 saddle that computes the index of the D1-D5 CFT.", "url": "https://arxiv.org/abs/2606.27093", "type": "理论", "summary": "1. 该工作为D1-D5-P黑弦构造了引力指标鞍点，并通过系统退耦得到用于计算D1-D5 CFT指标的BTZ × S^3鞍点。\n2. 其技术核心在于从四维STU模型的非极值四电荷黑洞BPS极限出发，利用4D-5D连接与弦对偶链逐维提升，揭示鞍点的新形式吸引子机制。\n3. 这为从引力路径积分直接推导超共形场论指标提供了明确构造，并有望推广至更一般黑弦系统的微态计数。", "summary_source": "deepseek", "authors": [{"name": "Kanhu Kishore Nanda"}, {"name": "P Shanmugapriya"}, {"name": "Amitabh Virmani"}], "featured_authors": [{"name": "Kanhu Kishore Nanda"}, {"name": "P Shanmugapriya"}, {"name": "Amitabh Virmani"}], "author_count": 3}, {"id": "2606.27101", "category": "hep-th", "title": "Approximating Feynman integrals using complete monotonicity and Stieltjes properties", "abstract": "We present two novel approaches for the numerical evaluation of Feynman integrals based on their universal analytic properties related to positivity, namely complete monotonicity (CM) and Stieltjes properties. Building on recent results, we exploit the fact that scalar Feynman integrals in the Euclidean region are completely monotonic functions, meaning that all their derivatives have a fixed sign. Building on this observation, the CM bootstrap allows one to reconstruct integrals from differential equations without explicit boundary data, yielding rigorous bounds. The second method is based on a refinement of CM. We prove that Feynman integrals, within a certain range of parameters, are not only CM but in fact Stieltjes functions. This enables the use of Padé approximants with provable convergence properties in the cut complex plane, providing an efficient method for analytic continuation and fast numerical evaluation. We illustrate the method with simple examples such as the massive bubble integral and discuss applications to multi-loop integrals, including the 20-loop banana integral. Finally, we comment on a number of extensions of these novel avenues for computing Feynman integrals.", "url": "https://arxiv.org/abs/2606.27101", "type": "理论", "summary": "1. 该工作基于费曼积分在欧几里得区域完全单调性（所有导数符号固定）的理论进展，并进一步证明其Stieltjes函数性质，提出了两种数值逼近方案：CM自举与Padé逼近法。\n2. CM自举利用完全单调性从微分方程重构积分，无需边界数据即可直接获得严格误差界；Padé逼近法凭借Stieltjes函数性质在切割复平面内具有可证明的收敛性，实现高效可靠的解析延拓与数值计算。\n3. 该方法已成功应用于质量气泡积分和20圈香蕉积分等算例，其严格数学保障与计算效率为多圈费曼积分的高精度评估提供了新方向，并具备向更广阔积分族推广的潜力。", "summary_source": "deepseek", "authors": [{"name": "Sara Ditsch"}, {"name": "Johannes M. Henn"}, {"name": "Prashanth Raman"}], "featured_authors": [{"name": "Sara Ditsch"}, {"name": "Johannes M. Henn"}, {"name": "Prashanth Raman"}], "author_count": 3}, {"id": "2606.27213", "category": "hep-th", "title": "The gauge invariance of non-perturbative vertex prescriptions", "abstract": "We study the gauge invariance of different continuum methods to include non-perturbative effects in gauge theories. We work with three dimensional quantum electrodynamics and implement vertices using two different methods: a set of coupled Schwinger-Dyson (SD) integral equations, and the self-consistent equations obtained from the 3-particle irreducible (3PI) effective action. We work in Landau gauge and assess the extent to which results are gauge invariant by checking how well the Ward identity is satisfied. Our results show that there is a fairly significant violation of the Ward identity at large coupling, although the 3PI effective theory is slightly better than the SD vertex. We also compare the results of both calculations with the commonly used Ball-Chiu ansatz and show that the agreement of the ansatz with both non-perturbative vertices is fairly good at small coupling but deviates more significantly at large coupling. We compare results for the two point functions of the theory and discuss the possible implications for phase transitions.", "url": "https://arxiv.org/abs/2606.27213", "type": "理论", "summary": "1. 该工作通过比较Schwinger-Dyson方程与3PI有效作用量两种非微扰顶点方案，系统评估了三维QED中Ward恒等式的满足程度。\n2. 其技术核心在于定量揭示大耦合下两种方案均显著违反Ward恒等式，且3PI方法违反程度略轻，而Ball-Chiu ansatz仅在小耦合下近似适用。\n3. 这表明非微扰顶点方案的规范不变性在强耦合区严重受限，对理解规范理论的相变行为及改进顶点波函数构建具有直接启示。", "summary_source": "deepseek", "authors": [{"name": "M.E. Carrington"}, {"name": "A.R. Frey"}, {"name": "B.A. Meggison"}], "featured_authors": [{"name": "M.E. Carrington"}, {"name": "A.R. Frey"}, {"name": "B.A. Meggison"}], "author_count": 3}, {"id": "2606.27222", "category": "hep-th", "title": "Causality and the Equivalence Principle for Higher Energy Scattering", "abstract": "Recently, it was proposed that the leading high-energy behavior of scattering amplitudes is universal, independent of charge, thereby extending the equivalence principle beyond the graviton pole. In this Letter, we derive a sharper causality constraint on such behavior by studying the Regge limit of colored scattering. Parameterizing a trajectory by $s^{\\alpha(t)}$ with $\\alpha(0)=2-\\delta$, we analyze the Shapiro/Wigner--Smith time-delays in the irreducible scattering channels. We show that any non-singlet trajectory with $\\delta< 1/2$ produces a growing sign-indefinite time-delay (with $\\delta=1/2$ a marginal, dimension-dependent case), which becomes dominant in the Regge diffusion region in the weak-gravity regime. The essential point is that, while the eikonal phase is naturally organized in $t$-channel irreducible representations, the physical time-delays are its eigenvalues in the $s$-channel. A non-singlet exchange therefore recouples into the physical channels with both signs, inevitably producing a negative time-delay in at least one channel.", "url": "https://arxiv.org/abs/2606.27222", "type": "理论", "summary": "1. 该文从因果性出发，对高能散射行为普遍性所隐含的等效原理推广提出了更严格的时延约束，超越了传统引力极点分析。\n2. 其技术卖点在于分析带色散射的Regge极限，利用Shapiro/Wigner-Smith时延在不可约散射道中的行为，通过轨迹参数化s^{α(t)}且α(0)=2-δ，严格证明非单态道中δ<1/2在弱引力区的Regge扩散区域产生增长且符号不定的时间延迟，δ=1/2为边缘情况且依赖维度。\n3. 核心物理洞察在于eikonal相在t道不可约表示中的自然组织与s道物理道本征时延之间的本质矛盾，非单态交换必然导致某些道出现负时延，为高能散射的因果性与等效原理一致性提供了关键判据。", "summary_source": "deepseek", "authors": [{"name": "Yu-tin Huang"}, {"name": "Lukas W. Lindwasser"}], "featured_authors": [{"name": "Yu-tin Huang"}, {"name": "Lukas W. Lindwasser"}], "author_count": 2}, {"id": "2606.27241", "category": "hep-th", "title": "Characteristic Lightcone Sources in SO(1,3) Yang-Mills Theory", "abstract": "The SO(1,3)-symmetric reduction of Yang-Mills theory on Minkowski space yields a stress-energy tensor that is smooth on the timelike and spacelike Lorentz orbits but diverges on the lightcone that separates the two regions. We ask what consistent source this singularity represents. A natural cure is a real shift of the singular denominator. This does not regularize the source but instead moves the singular support onto a hyperboloid off the cone, where the corresponding source cannot remain both conserved and traceless. Our analysis shows that the displaced support cannot retain both properties, whereas a completion on the lightcone can. The matching condition fixes this completion up to one parameter $\\chi$, which has a causal interpretation as the relative weight of the future and past cones. On regular constant-time slices, the completed source carries zero total four-momentum, so its physical content is a residual causal charge inferred from its curvature res
