  <title>arXiv 2026-06-10 · Daily ArXiv Selection</title>
  <style>
    :root {
      --bg: #f6f1e8;
      --panel: rgba(255, 252, 246, 0.92);
      --text: #2d241d;
      --muted: #6d5d50;
      --line: rgba(69, 49, 32, 0.14);
      --accent: #8f3d2e;
      --accent-2: #1d5f6b;
      --theory: #7c3a2a;
      --numeric: #255b6a;
      --both: #5d4a99;
      --experimental: #2f6b39;
      --shadow: 0 18px 40px rgba(54, 32, 16, 0.12);
      --radius: 22px;
      --ui-font: "Aptos", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --title-font: "Palatino Linotype", "Noto Serif SC", Georgia, serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--ui-font);
      color: var(--text);
      background: radial-gradient(circle at top left, rgba(255,255,255,0.78), transparent 32%), radial-gradient(circle at 88% 12%, rgba(29,95,107,0.14), transparent 20%), linear-gradient(180deg, #fbf7f0 0%, var(--bg) 42%, #f2e8dc 100%);
      min-height: 100vh;
    }
    .shell { width: min(1220px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 64px; }
    .hero {
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(255,255,255,0.84), rgba(255,248,238,0.72)), linear-gradient(135deg, rgba(143,61,46,0.08), rgba(29,95,107,0.08));
      box-shadow: var(--shadow);
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.82); border: 1px solid var(--line); color: var(--muted); font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase;
    }
    h1 { margin: 18px 0 10px; font-family: var(--title-font); font-size: clamp(32px, 5vw, 54px); line-height: 1.04; letter-spacing: -0.03em; }
    .hero p { max-width: 880px; color: var(--muted); font-size: 16px; line-height: 1.7; margin: 0; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-top: 26px; }
    .stat { padding: 16px 18px; background: rgba(255,255,255,0.76); border: 1px solid var(--line); border-radius: 18px; }
    .stat .label { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
    .stat .value { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
    .controls { position: sticky; top: 12px; z-index: 3; margin-top: 22px; padding: 18px; border: 1px solid var(--line); border-radius: 24px; background: rgba(250,244,236,0.9); backdrop-filter: blur(16px); box-shadow: 0 10px 24px rgba(54,32,16,0.08); }
    .control-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 16px; }
    .field { display: flex; flex-direction: column; gap: 10px; }
    .field label { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
    .search { width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line); background: rgba(255,255,255,0.92); font: inherit; color: var(--text); }
    .chip-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .chip { border: 1px solid var(--line); background: rgba(255,255,255,0.82); color: var(--text); padding: 10px 14px; border-radius: 999px; font: inherit; cursor: pointer; }
    .chip.active { border-color: rgba(143,61,46,0.35); background: rgba(143,61,46,0.12); color: #5b2419; }
    .chip[data-type="数值"].active { border-color: rgba(37,91,106,0.35); background: rgba(37,91,106,0.12); color: #173f49; }
    .chip[data-type="理论+数值"].active { border-color: rgba(93,74,153,0.35); background: rgba(93,74,153,0.12); color: #46337d; }
    .chip[data-type="实验"].active { border-color: rgba(47,107,57,0.35); background: rgba(47,107,57,0.12); color: #214c29; }
    .meta-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 14px; color: var(--muted); font-size: 14px; }
    .paper-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 18px; margin-top: 22px; }
    .paper { display: flex; flex-direction: column; gap: 14px; padding: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 10px 24px rgba(54,32,16,0.06); }
    .paper-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .tag { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid transparent; }
    .tag.category { background: rgba(45,36,29,0.08); color: var(--text); }
    .tag.type-theory { background: rgba(124,58,42,0.1); color: var(--theory); border-color: rgba(124,58,42,0.16); }
    .tag.type-numeric { background: rgba(37,91,106,0.1); color: var(--numeric); border-color: rgba(37,91,106,0.16); }
    .tag.type-both { background: rgba(93,74,153,0.1); color: var(--both); border-color: rgba(93,74,153,0.16); }
    .tag.type-experimental { background: rgba(47,107,57,0.1); color: var(--experimental); border-color: rgba(47,107,57,0.16); }
    .paper h2 { margin: 0; font-family: var(--title-font); font-size: 22px; line-height: 1.25; letter-spacing: -0.02em; }
    .paper h2 a { color: inherit; text-decoration: none; }
    .paper h2 a:hover { color: var(--accent); }
    .paper .id { color: var(--muted); font-size: 13px; }
    .author-block { display: grid; gap: 10px; padding: 14px 16px; border-radius: 18px; background: rgba(255,255,255,0.64); border: 1px solid var(--line); }
    .author-label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .author-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .author-item { display: grid; gap: 4px; }
    .author-item strong { font-size: 14px; }
    .author-item span { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .author-note { color: var(--muted); font-size: 12px; }
    .paper .summary { margin: 0; font-size: 15px; line-height: 1.75; white-space: pre-line; }
    details { border-top: 1px solid var(--line); padding-top: 12px; }
    details summary { cursor: pointer; color: var(--accent-2); font-weight: 700; list-style: none; }
    details summary::-webkit-details-marker { display: none; }
    details p { margin: 10px 0 0; color: var(--muted); line-height: 1.72; font-size: 14px; white-space: pre-line; }
    .paper footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 6px; color: var(--muted); font-size: 13px; }
    .paper footer a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .empty { display: none; margin-top: 24px; padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 22px; background: rgba(255,255,255,0.7); }
    @media (max-width: 980px) { .control-grid { grid-template-columns: 1fr; } .controls { position: static; } }
  </style>

  <script>
    const papers = [{"id": "2606.09911", "category": "cond-mat", "title": "Quantum Otto and Carnot Cycles via Skew Ising Model", "abstract": "We investigate the thermodynamic performance of quantum heat engines and refrigerators based on a two-spin system subject to a skew magnetic field. The working substance is described by an interacting spin model that incorporates both spin--spin coupling and anisotropy induced by a tilted magnetic field. We analyze and compare quantum Carnot and Otto cycles, showing that the Carnot cycle exhibits a universal, entropy-driven behavior with smooth phase boundaries, while the Otto cycle displays a much richer structure governed by the interplay between the energy spectrum and nonequilibrium population differences. In particular, we identify a crossover in both efficiency and coefficient of performance as a function of the interaction strength, which arises from the competition between the interaction energy scale and the magnetic field. We further demonstrate that the skew angle induces state hybridization, modifying both the energy levels and occupation probabilities. Our results highlight that interactions and anisotropy, when properly tuned, can enhance thermodynamic performance, and emphasize the importance of multi-level effects in the design of quantum thermal machines.", "url": "https://arxiv.org/abs/2606.09911", "type": "理论", "summary": "1. 该工作基于倾斜伊辛模型，分析了双自旋系统作为工质的量子卡诺与奥托循环的热力学性能及制冷性能。\n2. 其关键发现是，卡诺循环呈现熵驱动普适行为，而奥托循环因能谱与非平衡占据的竞争导致效率与性能系数出现交叉，且倾斜角引起的态杂化修饰能级与占据概率。\n3. 这提示通过调控自旋相互作用和磁场各向异性可优化量子热机性能，并凸显多能级效应在量子热力学设计中的核心作用。", "summary_source": "deepseek", "authors": [{"name": "Neda Valizadeh"}, {"name": "Nayyere Einali Saghavaz"}, {"name": "Zahra Ebadi"}, {"name": "Hosein Mohammadzadeh"}], "featured_authors": [{"name": "Neda Valizadeh"}, {"name": "Nayyere Einali Saghavaz"}, {"name": "Zahra Ebadi"}, {"name": "Hosein Mohammadzadeh"}], "author_count": 4}, {"id": "2606.09921", "category": "cond-mat", "title": "Computing phase diagrams using a convex hull algorithm", "abstract": "We present a simple universal computational algorithm for computing compositional phase diagrams of rocks and their melts at given temperature and pressure. It makes use of the mathematical concept of the convex hull of a set of points in the space spanned by the composition and the Gibbs free energy. All the complexities of determining the stability or separation of phases, the localization and orientation of tie lines, as well as the determination of characteristic points, curves and surfaces such as the solidus, liquidus, solvus, and the eutectic/peritectic points etc, are taken care of by the algorithm that computes the convex hull, supplemented with an algorithm to physically classify the resulting simplices. For the convex hull computation, the publicly available Qhull package can be used, which is available in SciPy. This makes this method accessible and intuitive for a broad set of scientific and educational applications. Although the method is not practical for systems of a large number of components, it is remarkably stable and efficient for systems of up to four. We present our implementation of the method as a publicly available Python package.", "url": "https://arxiv.org/abs/2606.09921", "type": "数值", "summary": "1. 该工作提出了一种基于凸包算法的通用计算方法，用于计算给定温压下岩石及其熔体的成分相图。\n2. 其技术核心在于利用组成-吉布斯自由能空间中的凸包自动处理相稳定性、tie lines及各类特征点、曲线和曲面，并借助Qhull实现高效计算。\n3. 虽不适用于多组分系统，但对最多四组分系统稳定高效，其公开Python包为地球科学及相关领域提供了直观易用的相图计算工具。", "summary_source": "deepseek", "authors": [{"name": "C. P. Dullemond"}, {"name": "E. D. Young"}], "featured_authors": [{"name": "C. P. Dullemond"}, {"name": "E. D. Young"}], "author_count": 2}, {"id": "2606.09948", "category": "cond-mat", "title": "Anatomy of fast current-induced skyrmion motion in synthetic antiferromagnets", "abstract": "The high mobility of current-driven skyrmions in synthetic antiferromagnets (SAFs) is widely explained by the macroscopic suppression of the skyrmion Hall effect through gyrotropic force compensation. This established view, however, overlooks a concurrent and significant reduction in the Gilbert damping parameter {\\alpha}, a key factor in the Thiele equation governing skyrmion velocity. Here, we show that this damping attenuation originates from a reconfigured magnon-electron scattering landscape. Using a microscopic s-d model, we demonstrate that the strong antiferromagnetic interlayer Ruderman-Kittel-Kasuya-Yosida (RKKY) exchange coupling in SAFs increases the magnonic gap of skyrmion collective modes, thereby suppressing the thermal magnon population and, consequently, the magnon-electron scattering rate that dominates damping in metallic ferromagnets. Our work establishes a dual-mechanism framework to fully explain the superior kinetics of SAF skyrmions: the macroscopic topological effect rectifies the motion direction, while the microscopic dissipation mechanism reduces the drag. This synergy enables high-speed and efficient motion, providing a fundamental elucidation of the enhanced mobility reported in recent studies such as the work by Pham et al. [Science 384, 307-312 (2024)].", "url": "https://arxiv.org/abs/2606.09948", "type": "理论", "summary": "1. 该工作从微观s-d模型出发，揭示了合成反铁磁中电流驱动斯格明子高速运动的阻尼衰减机制。\n2. 其核心创新在于指出强层间RKKY交换耦合增大了斯格明子集体模的磁振子带隙，从而抑制热磁振子-电子散射，显著降低Gilbert阻尼常数。\n3. 这建立了宏观拓扑效应修正运动方向与微观耗散机制减小拖曳的双重框架，为高性能自旋电子器件中斯格明子动力学设计提供了基础物理依据。", "summary_source": "deepseek", "authors": [{"name": "W. C. Chen"}, {"name": "H. X. Yang"}, {"name": "X. F. Zhang"}], "featured_authors": [{"name": "W. C. Chen"}, {"name": "H. X. Yang"}, {"name": "X. F. Zhang"}], "author_count": 3}, {"id": "2606.09989", "category": "cond-mat", "title": "Quantum-geometric origin of superfluid weight in quasicrystals with critical states", "abstract": "A distinctive feature of many quasiperiodic systems is the presence of critical states that are neither extended nor exponentially localized. We investigate the geometric effect on the superfluid weight in quasiperiodic systems with critical states at zero temperature. We employ both real-space and momentum-space approaches to superfluid weight in quasicrystals, which allows us to separate the conventional and quantum geometric contributions. We find that the superfluid weight is dominated by the geometric contribution in quasiperiodic systems with critical states. This finding reveals a fundamental interplay between superconductivity and critical states in quasicrystals.", "url": "https://arxiv.org/abs/2606.09989", "type": "理论", "summary": "1. 该工作通过实空间与动量空间方法，研究了准周期系统中临界态对超流重量的量子几何效应。\n2. 其核心发现是超流重量由量子几何贡献主导，而非常规动能项，揭示了临界态独特的超导响应机制。\n3. 这为理解准晶及其他具有临界态的多体系统中的超导现象提供了基础性见解，启发了相关理论与实验探索。", "summary_source": "deepseek", "authors": [{"name": "Kazuma Saito"}, {"name": "Ryo Okugawa"}, {"name": "Yusuke Kato"}, {"name": "Takami Tohyama"}], "featured_authors": [{"name": "Kazuma Saito"}, {"name": "Ryo Okugawa"}, {"name": "Yusuke Kato"}, {"name": "Takami Tohyama"}], "author_count": 4}, {"id": "2606.10003", "category": "cond-mat", "title": "Exactly solvable non-planar $\\mathbb{Z}_{2}$ dimer liquids on checkerboard and ruby lattices", "abstract": "We generalize an influential framework for exactly solvable quantum dimer models with dual Ising gauge theory descriptions realizing the $\\mathbb{Z}_{2}$ topological phase from trivalent to tetravalent parent lattices. The resulting quantum dimer models live on crossed-medial lattices and possess the remarkable feature of having crossed plaquettes, leading to transition graphs with generically intersecting loops. This non-planar structure runs counter to established templates for analytically tractable dimer liquids. As the simplest realization of the construction, we introduce an exactly solvable quantum dimer model on the checkerboard lattice that allows an exact mapping to the toric code, thus providing a particularly direct connection between the latter and Anderson's short range resonating valence bond paradigm. We further show that a corresponding crossed ruby lattice construction, dual to an Ising gauge theory on the kagome lattice, naturally falls within the same framework. More generally, the construction gives rise to a broad class of exactly solvable crossed-medial quantum dimer models and admits natural iteration, generating cascades of solvable $\\mathbb{Z}_{2}$ topological dimer liquids beyond the standard planar setting. We furthermore extend Kasteleyn methods to the relevant non-planar graphs, enabling controlled wave-function deformations away from the commuting-projector points while retaining efficient evaluation of correlation functions.", "url": "https://arxiv.org/abs/2606.10003", "type": "理论", "summary": "1. 该工作将精确可解量子二聚体模型从三价母格推广至四价母格，在棋盘和红宝石晶格上构建了具有非平面交叉-中间结构的Z₂拓扑二聚体液体。\n2. 其核心在于非平面过渡图包含交叉格点导致相交环，且棋盘模型严格映射到环面码，同时将Kasteleyn方法扩展至非平面图以实现可控波函数变形。\n3. 该构造支持自然迭代生成级联拓扑二聚体液体，为超越标准平面框架的共振价键物理与关联函数计算开辟了新途径。", "summary_source": "deepseek", "authors": [{"name": "Julia Wildeboer"}, {"name": "Zohar Nussinov"}, {"name": "Thomas Iadecola"}, {"name": "Alexander Seidel"}], "featured_authors": [{"name": "Julia Wildeboer"}, {"name": "Zohar Nussinov"}, {"name": "Thomas Iadecola"}, {"name": "Alexander Seidel"}], "author_count": 4}, {"id": "2606.10043", "category": "cond-mat", "title": "Distribution of Majorana modes in the extended-range Kitaev chain", "abstract": "The topological properties of the Kitaev chain model with extended-range interactions are investigated, focusing on cases where the topological winding number is preserved. We assume that the pairing and hopping terms decay algebraically in space with exponents $\\alpha$ and $\\beta$, respectively. We show that in the truncated-range scenario, there are as many distinct topological phases as the number of coupled neighboring sites. In addition, an explicit analytical formulation is provided to evaluate the topological invariant and the phase transitions that emerge in these systems. Besides the analytical description, we introduce a new physical insight into the topological excitations of the ground-state by measuring the spatial distribution of the edge modes with the Majorana average position. Taking the next-nearest neighbor Kitaev chains as a probe, various numerical calculations of Majorana edge states were performed in finite-size clusters to determine the sensitivity of the topological zero energy modes to the parameters of interest. The occupation of edge-to-edge non-local fermion states is computed and defined as an effective parity. Such an effective parity exhibits new interesting features beyond the energetic exchange from the ground-state fermion parity switches, which are related to the distribution of the respective edge modes. Our calculations show a direct correlation between the ground-state fermion parity and the edge occupation numbers, which are translated into localization and delocalization of the Majorana average position.", "url": "https://arxiv.org/abs/2606.10043", "type": "理论+数值", "summary": "1. 该工作解析研究了配对与跳跃项呈代数衰减的扩展范围Kitaev链中Majorana模的分布，并求解了拓扑不变量与相变。\n2. 其核心在于引入Majorana平均位置测量边缘模空间分布，并发现有效奇偶性直接关联边缘占据数，揭示零能模的局域与退局域化。\n3. 这为长程相互作用拓扑超导系统中Majorana模的操控与探测提供了可解析计算的新物理观测量。", "summary_source": "deepseek", "authors": [{"name": "Pedro B. Widniczck"}, {"name": "Gerardo Martínez"}], "featured_authors": [{"name": "Pedro B. Widniczck"}, {"name": "Gerardo Martínez"}], "author_count": 2}, {"id": "2606.10139", "category": "cond-mat", "title": "Predicting Defect States: A Quick Screening Protocol for Substitutional Point Defect Engineering", "abstract": "Point defects in crystalline materials play a central role in determining electronic, optical, and magnetic properties. However, systematic exploration of defect configurations remains computationally expensive because large supercell calculations are required to approximate isolated defects under periodic boundary conditions. We present a unit-cell-based tight-binding protocol that enables rapid pre-screening of substitutional defects. The protocol extracts Wannier tight-binding Hamiltonians from small, fully relaxed unit cells of the host and defect-like systems, replicates the host Hamiltonian to construct a supercell model, and introduces the defect by modifying only the on-site energies at the substitution site while leaving the hopping parameters unchanged. We validate the protocol across three diverse systems: isostructural substitutional defects in transition-metal dichalcogenides (M$_\\mathrm{Mo}$ MoS$_2$, M = Ce, Zr, Nb, Tc, and Ru), symmetry-breaking carbon substitutions in hexagonal boron nitride (C$_\\mathrm{B}$C$_\\mathrm{N}$ h-BN), and nitrogen-vacancy (NV$^-$) centers in diamond. These case studies span two-dimensional and three-dimensional hosts, simple substitutions, and substitution-vacancy complexes. In all cases, the protocol successfully captures the number of in-gap states, their degeneracies, and their shallow or deep character relative to host band edges, despite some quantitative deviations in absolute energy positions. We further identify limitations for vacancies of highly electronegative atoms and for charge-state or spin-polarization effects, both of which involve self-consistent charge redistribution not captured by the protocol.", "url": "https://arxiv.org/abs/2606.10139", "type": "理论+数值", "summary": "1. 该工作提出基于单胞紧束缚的快速预筛选协议，用于替代点缺陷的能级预测与工程筛选。\n2. 其核心卖点在于仅修改替代位点格点能而不改变跃迁参数，即可定性捕获带隙态的数量、简并度及深浅特征。\n3. 该协议为高通量缺陷设计提供了有效工具，但需引入电荷自洽以处理高电负性空位及自旋极化效应。", "summary_source": "deepseek", "authors": [{"name": "Hyosik Kang"}, {"name": "Lukas Muechler"}], "featured_authors": [{"name": "Hyosik Kang"}, {"name": "Lukas Muechler"}], "author_count": 2}, {"id": "2606.10145", "category": "cond-mat", "title": "Beyond the Markovian limit: Exact solutions for active motion in a power-law viscoelastic bath", "abstract": "Active particles from bacteria to synthetic microswimmers often navigate viscoelastic media with complex relaxation dynamics. The classical active Brownian model that assumes instantaneous friction is clearly not applicable to describe such motility, while the non-Markovian processes combined with viscoelasticity are relatively unexplored. Here, we develop an analytical theory for an active particle in a power-law viscoelastic medium by solving coupled non-Markovian generalized Langevin equations for translational and rotational degrees of freedom. The viscoelastic memory results in novel phenomena such as fractional short-time transport, enhanced long-time persistence, and de-correlation of the instantaneous force and the swimmer orientation. We demonstrate that the memory kernel controls the anomalous scaling exponents, while the activity determines the crossover between sub-diffusive, ballistic and diffusive regimes. Our work provides a framework for theoretical description of biological and synthetic micro swimmers in complex biological and polymeric environments.", "url": "https://arxiv.org/abs/2606.10145", "type": "理论", "summary": "1. 该工作超越经典活性布朗模型的马尔可夫假设，通过精确求解平移与旋转自由度耦合的非马尔可夫广义朗之万方程，建立了幂律粘弹性浴中活性粒子运动的完整解析理论。\n2. 其关键物理卖点在于揭示粘弹性记忆效应导致分数短时反常输运、增强长时持续运动及瞬时力与取向去相关，并证明记忆核控制反常标度指数而活性决定亚扩散、弹道与扩散区域交叉的机制。\n3. 该框架为定量描述细菌与合成微游动者在生物及聚合物复杂介质中的动力学提供了可解析处理的基准模型，并对理解非马尔可夫活性系统普适行为及实验验证具有重要启发。", "summary_source": "deepseek", "authors": [{"name": "Mintu Karmakar"}, {"name": "Jure Dobnikar"}, {"name": "Ignacio Pagonabarraga"}], "featured_authors": [{"name": "Mintu Karmakar"}, {"name": "Jure Dobnikar"}, {"name": "Ignacio Pagonabarraga"}], "author_count": 3}, {"id": "2606.10178", "category": "cond-mat", "title": "Pressure-Driven Structural Phase Competition and Functional Response in Layered LiInP2S6", "abstract": "Understanding how hydrostatic pressure modifies interlayer interactions and competing ionic configurations is essential for controlling the emergent functional properties of layered quantum materials. Here, using first-principles density-functional theory calculations, we investigate the pressure-dependent structural, mechanical, electronic, and optical properties of three competing LiInP2S6 polymorphs: the monoclinic C2/c phase and the trigonal P-31c phase in both in-layer and in-gap configurations. Our results reveal a pressure-induced structural phase transition from the monoclinic ground-state C2/c phase to a trigonal P-31c in-layer phase at ~0.38 GPa, driven by enhanced interlayer coupling and anisotropic lattice compression. In contrast, the trigonal P-31c in-gap phase remains energetically unfavorable due to its stronger interlayer ionic interactions and reduced compressibility. All phases remain mechanically stable under compression (0-26 GPa) and exhibit enhanced mechanical rigidity, elastic wave velocities, and Debye temperatures with increasing pressure. Remarkably, the electronic and optical properties within each phase remain highly robust under pressure, with only moderate changes in the band gap and optical absorption edge (UV-Visible range) under pressure; however, substantial modifications emerge across the pressure-induced structural phase transition. These findings establish LiInP2S6 as a pressure sensitive ionic-vdW material in which subtle changes in interlayer interactions govern structural stability and functional properties.", "url": "https://arxiv.org/abs/2606.10178", "type": "理论+数值", "summary": "1. 该工作通过第一性原理计算，系统研究了静水压力下三种LiInP2S6多晶型（单斜C2/c相、三方P-31c层内相与层间相）的结构、力学、电子及光学性质演变。\n2. 其核心发现是压力增强层间耦合与各向异性压缩驱动了从单斜基态到三方层内相的结构相变（~0.38 GPa），而三方层间相因更强层间离子作用与较低压缩性保持亚稳。\n3. 这揭示了LiInP2S6作为压力敏感离子-范德华材料的特性，表明通过压力精细调控层间相互作用即可切换结构相并重塑功能响应，为设计响应型量子层状材料提供了机制依据。", "summary_source": "deepseek", "authors": [{"name": "Xiaochi Xie"}, {"name": "Pegah Mohammadi"}, {"name": "Sobhit Singh"}], "featured_authors": [{"name": "Xiaochi Xie"}, {"name": "Pegah Mohammadi"}, {"name": "Sobhit Singh"}], "author_count": 3}, {"id": "2606.10349", "category": "cond-mat", "title": "Magnetic HIP-NN for spin dynamics in disordered itinerant magnets", "abstract": "We present a magnetic extension of the Hierarchically Interacting Particle Neural Network (HIP-NN) that enables large-scale simulations of electron-mediated spin dynamics in disordered itinerant magnets. The resulting magnetic HIP-NN (mHIP-NN) incorporates rotationally invariant spin correlations directly into hierarchical message-passing layers, enabling the network to learn emergent magnetic energy landscapes and effective local fields from coupled geometric-spin environments while preserving spin-rotation symmetry. As a benchmark application, we consider structurally disordered itinerant $s$-$d$ exchange models in which the effective magnetic forces arise dynamically from the instantaneous electronic structure and are computationally prohibitive to evaluate using conventional exact-diagonalization-based approaches. We show that mHIP-NN accurately reproduces the local torques governing Landau-Lifshitz-Gilbert dynamics and faithfully captures the nonequilibrium evolution of spatial spin correlations following thermal quenches. Our results establish symmetry-aware hierarchical message-passing networks as an efficient and scalable framework for large-scale simulations of frustrated itinerant spin systems and nonequilibrium magnetic dynamics. More broadly, because the learned energy functional remains fully differentiable with respect to both atomic coordinates and spin variables, the framework also provides a natural foundation for spin-dependent interatomic potentials and coupled atom-spin dynamics.", "url": "https://arxiv.org/abs/2606.10349", "type": "理论+数值", "summary": "1. 该工作提出了磁性层级交互粒子神经网络（mHIP-NN），用于模拟无序巡游磁体中电子介导的自旋动力学。\n2. 通过将旋转不变自旋关联融入层级消息传递层并保持自旋旋转对称性，该网络可学习有效局域场与磁能量景观，高效计算原本昂贵的自旋力矩。\n3. 该框架为大规模阻挫巡游自旋系统和非平衡磁动力学模拟提供了可扩展手段，并为自旋依赖原子间势与耦合原子-自旋动力学奠定基础。", "summary_source": "deepseek", "authors": [{"name": "Supriyo Ghosh"}, {"name": "Yunhao Fan"}, {"name": "Sheng Zhang"}, {"name": "Kipton Barros"}, {"name": "Gia-Wei Chern"}], "featured_authors": [{"name": "Supriyo Ghosh"}, {"name": "Yunhao Fan"}, {"name": "Sheng Zhang"}, {"name": "Kipton Barros"}, {"name": "Gia-Wei Chern"}], "author_count": 5}, {"id": "2606.10352", "category": "cond-mat", "title": "Neural electron backscatter diffraction", "abstract": "In a polycrystalline microstructure, orientation and dislocation content vary smoothly within grains, and the grain boundaries between them are continuous curves. Electron backscatter diffraction (EBSD) records this continuum on a discrete grid with every subsequent analysis (from indexing to advanced pattern processing) confined to that grid. We introduce neural EBSD, which treats an EBSD scan as a continuous, differentiable four-dimensional field of Kikuchi diffraction intensity (in specimen--detector domain) and then represents it with a coordinate-based neural network. We develop and compare two formulations: a joint formulation that maps all four coordinates to intensity, and a factorized formulation that combines continuous specimen-domain coefficient fields with learned detector-domain basis patterns. Tested on recrystallized and additively manufactured Inconel 718, the factorized formulation shows better accuracy in reconstructing Kikuchi patterns that have map-averaged errors below 1% of the maximum intensity. Beyond reconstruction, it provides full-pattern super-resolution in the specimen frame, continuous querying along arbitrary off-grid paths, as well as spatially continuous boundary and heterogeneity localization from analytical spatial derivatives. Storing the network weights and learned bases in place of the raw patterns in a large dataset offers a 700-fold compression while preserving on-demand access to the full patterns for downstream analyses.", "url": "https://arxiv.org/abs/2606.10352", "type": "理论", "summary": "1. 该工作提出神经电子背散射衍射方法，用坐标神经网络将扫描数据表示为样品-探测器域内连续可微的四维菊池衍射强度场。\n2. 其卖点在于分解公式联合连续样品域系数与学习探测器域基函数，实现全图案超分辨率、任意路径连续查询及基于解析梯度的晶界定位，同时达到700倍压缩比。\n3. 这为多晶微结构的连续表征、高效存储与下游分析提供了新范式，并有望推广至其他基于网格的衍射成像技术。", "summary_source": "deepseek", "authors": [{"name": "I-Tzu Huang"}, {"name": "Marat I. Latypov"}], "featured_authors": [{"name": "I-Tzu Huang"}, {"name": "Marat I. Latypov"}], "author_count": 2}, {"id": "2606.10418", "category": "cond-mat", "title": "Higher-winding phases in one-dimensional non-Hermitian topological superconductors", "abstract": "Non-Hermitian topological superconductors provide a setting in which point-gap topology, non-Hermitian skin effects, and Majorana zero modes are strongly intertwined. In this work, we adopt a coefficient-based approach for computing winding numbers and deriving analytical expressions for phase boundaries in one-dimensional non-Hermitian topological superconductors characterized by point-gap topology with $\\mathbb{Z}$ invariants. We apply this approach to two non-Hermitian topological superconducting lattice models, with and without sublattice degrees of freedom, including longer-range hoppings, thereby accessing a much broader parameter space. These extensions generate higher-order polynomials and support phases with higher winding numbers, reflecting the underlying $\\mathbb{Z}$ topology. We further clarify how a weak perturbation suppresses the non-Hermitian skin effect while preserving the sublattice-symmetry-protected invariant associated with Majorana zero modes. The predicted winding numbers are verified by open-boundary spectra, where one or multiple pairs of zero-energy boundary modes appear consistently with the bulk invariant. We also examine the stability of these modes against onsite disorder through the inverse participation ratio. Our results provide a systematic and efficient route to constructing topological phase diagrams for higher-winding non-Hermitian topological superconductors.", "url": "https://arxiv.org/abs/2606.10418", "type": "理论+数值", "summary": "1. 该工作采用基于系数的缠绕数计算方法，解析推导一维非厄米拓扑超导体的相边界，并将模型扩展至含子格自由度和长程跳跃，从而得到更高缠绕数的拓扑相。\n2. 其技术要点在于通过高阶多项式求解实现Z拓扑分类，并阐明弱扰动可抑制非厄米皮肤效应而保持子格对称性保护的马约拉纳零模不变量的稳定性。\n3. 这为系统构造高缠绕非厄米拓扑超导体的相图提供了高效解析途径，并启发对边界模在无序下鲁棒性的进一步理解。", "summary_source": "deepseek", "authors": [{"name": "Yung-Yeh Chang"}, {"name": "Xiang-Yu Li"}, {"name": "Ken Shiozaki"}, {"name": "Chen-Hsuan Hsu"}], "featured_authors": [{"name": "Yung-Yeh Chang"}, {"name": "Xiang-Yu Li"}, {"name": "Ken Shiozaki"}, {"name": "Chen-Hsuan Hsu"}], "author_count": 4}, {"id": "2606.10420", "category": "cond-mat", "title": "Superheating field of clean superconductors near the type-I--type-II boundary: the low-temperature Meissner stability limit of niobium", "abstract": "We calculate the low-temperature superheating field $B_{\\rm sh}$ of clean superconductors near the boundary between type-I and type-II superconductivity, with particular emphasis on Nb. The calculation is based on the self-consistent nonlinear nonlocal Eilenberger theory and the linear stability analysis of the Meissner state. For a Nb-like material with $\\kappa_{\\rm GL}=0.7$, we obtain $B_{\\rm sh}\\simeq 290\\,{\\rm mT}$ at $T/T_c=0.2$, using $B_{c0}\\simeq 200\\,{\\rm mT}$. This value is substantially higher than the value obtained by naively extrapolating the Ginzburg--Landau result near $T_c$ to $T\\ll T_c$. For a TESLA-shaped Nb accelerator cavity, it corresponds to an intrinsic Meissner-stability limit of about $67\\,{\\rm MV/m}$.", "url": "https://arxiv.org/abs/2606.10420", "type": "理论+数值", "summary": "1. 该工作基于自洽非线性非局域Eilenberger理论和线性稳定性分析，计算了I型-II型超导边界附近干净超导体的低温超热场，并以铌为重点。\n2. 对于κ_GL=0.7的类铌材料，在T/T_c=0.2时得到超热场约290 mT（B_c0≈200 mT），显著高于将Ginzburg-Landau结果从T_c附近外推至低温的数值。\n3. 该结果将TESLA形铌加速腔的Meissner稳定性极限约束在约67 MV/m，为高梯度超导腔的极限性能提供了严格定量基准。", "summary_source": "deepseek", "authors": [{"name": "Takayuki Kubo"}], "featured_authors": [{"name": "Takayuki Kubo"}], "author_count": 1}, {"id": "2606.10424", "category": "cond-mat", "title": "Edge slip stabilizes confined active vortices by suppressing localized instabilities", "abstract": "Confined active systems can sustain persistent vortical flows whose stability is strongly influenced by boundary conditions. At the individual level, active units generate internal stresses that drive spontaneous flows, which in turn advect and reorient the particles. This nonlinear coupling between active flow and orientational order is significantly mediated by the system's boundaries, where the specific slip condition governs how these internal stresses generate active flow then rearrange the local orientations. However, a quantitative understanding of how boundary slip dictates their dynamical stability remains lacking. Here, we study how the slip boundary condition controls the stability of a steady vortex state in a circularly confined active nematic system. Using a continuum model in a flow-dominated regime, we perform a linear stability analysis and derive an explicit criterion incorporating the slip velocity and flow-alignment coupling. We find that increasing slip velocity suppresses localized linear instabilities, thereby promoting the persistence of the steady vortex state. This reveals a relaxing the boundary friction actually stabilizes the macroscopic coherent structure by depressing flow induced reorientation that typically destroys single-vortex states. Our findings establish boundary slip as a nontrivial hydrodynamic control parameter for engineering stable active flows.", "url": "https://arxiv.org/abs/2606.10424", "type": "理论", "summary": "1. 该工作通过连续模型和线性稳定性分析，定量研究了边界滑移条件对圆形受限活性向列系统中稳态涡旋稳定性的调控机制。\n2. 其技术核心在于推导出包含滑移速度与流动-取向耦合的显式稳定性判据，并揭示增大边界滑移可抑制流动诱导的局域再取向不稳定性。\n3. 这为将边界滑移作为主动流体稳定性水动力学调控参数提供了理论依据，并启发了通过降低边界摩擦来稳定宏观相干涡旋结构的实验设计。", "summary_source": "deepseek", "authors": [{"name": "Zhihan Ye"}, {"name": "Tianyu Ren"}, {"name": "Hao Luo"}, {"name": "Yanan Liu"}, {"name": "Guangyin Jing"}], "featured_authors": [{"name": "Zhihan Ye"}, {"name": "Tianyu Ren"}, {"name": "Hao Luo"}, {"name": "Yanan Liu"}, {"name": "Guangyin Jing"}], "author_count": 5}, {"id": "2606.10427", "category": "cond-mat", "title": "Energetics of Nucleation in Finitely Deformed, Phase-Transforming Soft Solids", "abstract": "Classical nucleation theory describes the rate at which stable nuclei form within a metastable parent phase by crossing a free-energy barrier set by competing bulk and interfacial energies. In an elastic material, a pre-existing stress state modifies this barrier through an elastic contribution to the bulk driving force. This contribution is well characterized for linear elastic materials, but the corresponding finite-deformation result for soft solids remains less developed. The gap is computationally significant: in simulations that sample candidate nuclei throughout a stressed body, direct evaluation of the elastic contribution to free-energy change would require solving a new nonlinear elasticity boundary-value problem for each possible nucleus. Here, we derive an asymptotic expansion of the equilibrium elastic potential energy change for a hyperelastic body before and after formation of a small transformed region. The expansion is with respect to the amplitude of an isotropic transformation strain, while the pre-existing deformation and stress may be finite. At leading order, the elastic contribution to the formation energy is determined entirely by the known untransformed equilibrium fields, with additional terms accounting for stiffness contrast between the parent and transformed phases. Incorporating this into classical nucleation theory yields the stress-shifted transformation temperature, critical radius, and nucleation barrier. Representative results are shown for a compressible neo-Hookean solid under hydrostatic, uniaxial, and equibiaxial loading; tensile stresses promote nucleation and compressive stresses suppress it when transformation strain is expansive. Comparison with the corresponding linear-elastic result shows that finite-deformation effects can substantially change the predicted energy barrier at moderate stretches.", "url": "https://arxiv.org/abs/2606.10427", "type": "理论+数值", "summary": "1. 本文推导了超弹性体在有限预变形下形成小转变区域时平衡弹性势能变化的渐近展开，并将之纳入经典成核理论。\n2. 主导阶弹性贡献完全由已知未转变平衡场决定，并显式计入母相与转变相刚度对比；中等拉伸下有限变形效应可显著改变预测的成核势垒。\n3. 该工作为软固体应力诱导相变的成核能垒计算提供了定量框架，启发进一步的非线性弹性效应研究与实验检验。", "summary_source": "deepseek", "authors": [{"name": "Mrityunjay Kothari"}], "featured_authors": [{"name": "Mrityunjay Kothari"}], "author_count": 1}, {"id": "2606.10474", "category": "cond-mat", "title": "Finite-Time Orientational Relaxation Restructures Collective Motion in Polar Active Matter", "abstract": "We introduce a Langevin formulation of Vicsek-like active particles in which orientations evolve through finite-rate relaxation toward the local mean direction, with alignment strength $J$ and rotational diffusivity $D_r$, thereby combining Vicsek-type local consensus with XY-like orientational dynamics. Using large-scale numerical simulations, we determine the nonequilibrium phase diagram as a function of activity and alignment rate. Increasing the alignment rate drives a sequence of transitions from a homogeneous isotropic state to polar bands, a cross-sea phase of intersecting bands, a homogeneous polar state, and ultimately a micro-clustered regime. The isotropic-to-polar transition is strongly first order, as evidenced by Binder cumulants and bimodal distributions of local polarization and density, indicating coexistence of gas-like and liquid-like regions. Near the onset of collective motion, band size increases with activity but depends non-monotonically on alignment rate. Further increasing the alignment rate drives the system through the cross-sea and homogeneous polar phases before enhanced density fluctuations lead to micro-clustering. Our results demonstrate that finite-time orientational relaxation acts as a control parameter that qualitatively restructures collective behavior in polar active matter.", "url": "https://arxiv.org/abs/2606.10474", "type": "理论+数值", "summary": "1. 该工作引入取向以有限速率弛豫至局部平均方向的Langevin模型，通过大规模数值模拟确定了极性活性物质的非平衡相图。\n2. 其卖点在于揭示取向弛豫率作为控制参数，驱动从各向同性到极性带、交叉海相、均匀极性和微簇的多重相变，且各向同性-极性转变呈现强一级特征。\n3. 这为理解活性物质中有限时间取向动力学如何定性重构集体行为提供了新视角，并启发利用弛豫率调控非平衡相变与自组织。", "summary_source": "deepseek", "authors": [{"name": "Rajneesh Kumar"}, {"name": "Subhransu Sekhar Mishra"}, {"name": "Debasish Chaudhuri"}], "featured_authors": [{"name": "Rajneesh Kumar"}, {"name": "Subhransu Sekhar Mishra"}, {"name": "Debasish Chaudhuri"}], "author_count": 3}, {"id": "2606.10486", "category": "cond-mat", "title": "Virial stress in systems of active Brownian particles in the presence of translational and rotational inertia", "abstract": "We elucidate the stress in a system of active Brownian particles augmented with translational and rotational inertia (ABP+TRI). Stress tensors are derived for periodic systems as well as systems confined between walls by employing Lagrange's equations of motion of the first kind for the rotational motion. Using Langevin simulations of an ideal active gas in two dimensions, we confirm the existence of an equation of state for periodic systems that depends on translational and rotational inertia in general. Confinement implies a strong polarization of the propulsion direction near a wall and an enhanced density, both of which increase with increasing rotational inertia. This affects the local stress tensor normal to the confining walls, leading to a breakdown of the equation of state. Yet the local stress in the bulk part of the confined systems is identical with that of the periodic system. Importantly, for both kinds of boundary conditions, the so-called swim stress is not included in the local stress tensor; thus, in general, the swim stress is not representative of the stress in systems of ABP+TRIs.", "url": "https://arxiv.org/abs/2606.10486", "type": "理论+数值", "summary": "1. 该工作解析推导了包含平动与转动惯性的活性布朗粒子体系在周期及受限边界下的应力张量，并借助拉格朗日第一类方程处理转动运动。\n2. 其核心发现是转动惯性增强近壁推进方向极化与密度，破坏状态方程有效性；但受限系统体相局部应力与周期系统一致，且泳应力不包含于局部应力张量中。\n3. 这为惯性活性体系中应力的正确定义及状态方程适用性提供了关键约束，对今后活性物质连续理论和模拟的应力分析具有指导意义。", "summary_source": "deepseek", "authors": [{"name": "Chandranshu Tiwari"}, {"name": "Sunil P. Singh"}, {"name": "Roland G. Winkler"}], "featured_authors": [{"name": "Chandranshu Tiwari"}, {"name": "Sunil P. Singh"}, {"name": "Roland G. Winkler"}], "author_count": 3}, {"id": "2606.10516", "category": "cond-mat", "title": "SANS and magnetometry study of the magnetic phase diagram of the B20 helimagnet FeRhSi", "abstract": "This manuscript reports the first direct neutron-scattering evidence for long-period helimagnetism in the newly identified 4d-substituted B20 compound Fe0.5Rh0.5Si. By combining SANS with low-field magnetometry, we establish the magnetic modulation, construct a field-temperature phase diagram, and identify a candidate A-phase region supported by an independent structural signature. The work is important beyond this single compound because it expands the family of chiral B20 helimagnets into Rh-substituted materials, where spin-orbit coupling, disorder, and Dzyaloshinskii-Moriya interactions can be tuned. It will interest researchers in chiral magnetism, topological spin textures, magnetic neutron scattering, and quantum materials, and provides a foundation for future studies of emergent magnetic phases and topology-driven phenomena in chemically tuned chiral magnets.", "url": "https://arxiv.org/abs/2606.10516", "type": "理论+数值", "summary": "1. 该工作结合小角中子散射与低场磁测量，首次直接证实了B20化合物Fe₀.₅Rh₀.₅Si中的长周期螺旋磁性，并构建了其磁场-温度相图。\n2. 主要技术点在于识别出候选A相区域并由独立结构特征支持，同时将手性B20螺旋磁体家族扩展至可调控自旋轨道耦合与Dzyaloshinskii-Moriya相互作用的Rh取代材料。\n3. 这为后续化学调控手性磁体中涌现磁相与拓扑驱动现象的实验与理论研究提供了明确基础。", "summary_source": "deepseek", "authors": [{"name": "E. V. Altynbaev"}, {"name": "A. V. Guseva"}, {"name": "D. O. Skanchenko"}, {"name": "V. N. Krasnorussky"}, {"name": "A. V. Bokov"}, {"name": "D. A. Salamatin"}, {"name": "V. A. Sidorov"}, {"name": "A. V. Tsvyashchenko"}], "featured_authors": [{"name": "E. V. Altynbaev"}, {"name": "A. V. Guseva"}, {"name": "D. O. Skanchenko"}, {"name": "D. A. Salamatin"}, {"name": "V. A. Sidorov"}, {"name": "A. V. Tsvyashchenko"}], "author_count": 8}, {"id": "2606.10548", "category": "cond-mat", "title": "Interaction-driven dynamics in graphene flakes as a benchmark for quantum simulation", "abstract": "We study interaction-driven ultrafast dynamics in finite graphene flakes following an optical pump quench in an interacting tight-binding model. By comparing exact real-time evolution with simulations restricted to particle-hole excitation subspaces, we assess when relaxation can be captured by low-order many-body processes and when this is not sufficient. The single-particle orbital entropy provides a compact diagnostic for dynamic correlation growth. For the systems studied here, periodic graphene flakes are well described by low-order excitations, whereas confined geometries require substantial higher-order contributions even for relatively small interaction strengths. The quench protocol combines simple initial-state preparation with strongly correlated dynamics, identifying a promising benchmark problem for future quantum-computing simulations.", "url": "https://arxiv.org/abs/2606.10548", "type": "理论+数值", "summary": "1. 该工作通过光学泵浦淬火在相互作用紧束缚模型中系统研究了有限石墨烯薄片内的相互作用驱动超快弛豫动力学过程。\n2. 其技术要点在于引入单粒子轨道熵作为动态关联增长的紧凑诊断，并通过与精确实时演化及受限子空间模拟的对比，阐明了低阶多体过程在不同几何中描述弛豫的充分性条件。\n3. 该淬火方案兼具初态制备简单和动力学强关联特性，且揭示了周期性与非周期性构型间关联发展行为的本质差异，为量子计算模拟提供了定量可比的基准测试。", "summary_source": "deepseek", "authors": [{"name": "Fabian Eickhoff"}, {"name": "Satoshi Ejima"}, {"name": "Lukas Windgätter"}, {"name": "Florian G. Eich"}, {"name": "Hannah Rittich"}, {"name": "Sebastian Zanker"}, {"name": "Peter Schmitteckert"}], "featured_authors": [{"name": "Fabian Eickhoff"}, {"name": "Satoshi Ejima"}, {"name": "Lukas Windgätter"}, {"name": "Hannah Rittich"}, {"name": "Sebastian Zanker"}, {"name": "Peter Schmitteckert"}], "author_count": 7}, {"id": "2606.10549", "category": "cond-mat", "title": "Optical-like interference control polar-phonons dispersions in 2D materials", "abstract": "It has been argued that the polar phonon modes of two-dimensional (2D) materials should show a linear dependence close to the Brillouin zone center due to the reduced problem dimensionality compared to a three-dimensional crystal, leading to a vanishing LO-TO splitting. Revisiting this question using a mirror-charge framework derived from classical electrostatics, we show that it is not always true: with perfectly-reflective dielectric interfaces, it is possible to recover a LO-TO splitting, or an equivalent phenomenon for the out-of-plane modes. Effectively, the dispersion of polar phonon modes is governed by optical-like constructive and destructive interferences of the source potential with its reflection at the dielectric interfaces. This work highlights the critical role of dielectric boundary conditions to understand phonon-related properties in 2D materials.", "url": "https://arxiv.org/abs/2606.10549", "type": "理论", "summary": "1. 该工作采用经典静电镜像电荷框架，重新审视二维材料极性声子模在布里渊区中心的色散行为。\n2. 其核心物理在于揭示介电界面的完美反射可诱导源势与其反射的光学类相长与相消干涉，从而恢复本应消失的LO-TO分裂。\n3. 这凸显了介电边界条件对二维材料声子色散的决定性作用，为调节极性声子性质提供了明确途径。", "summary_source": "deepseek", "authors": [{"name": "Benoit Van Troeye"}, {"name": "Geoffrey Pourtois"}], "featured_authors": [{"name": "Benoit Van Troeye"}, {"name": "Geoffrey Pourtois"}], "author_count": 2}, {"id": "2606.10564", "category": "cond-mat", "title": "Dichotomous electronic system in a bilayer Ni$^{1+}$ nickelate", "abstract": "``Infinite layer'' nickelates (ILNs) ${\\cal R}$NiO$_2$ (${\\cal R}$=rare earth elements), having empty apical O sites, become superconducting upon hole doping. They display a secondary electron Fermi surface (FS), giving hole doping, arising not from atomic orbitals but from a band based on interstitial density. Newly reported La$_3$Ni$_2$O$_5$F, formally Ni$^{1+}$, provides an unexpected example of ILN with essentially ideal two dimensional character. A partially occupied single band $E^*$, based on interstitial density, has distinct properties, as its strongly anisotropic shape extends over the three ``apical'' layers and leads to a cylindrical electron FS giving self-doping. This interstitial density is associated with a {\\it network of valence bands}, including a Ni $d_{xz},d_{yz}$ pair that partners with $E^*$ to provide an incipient non-analytic Dirac point, leading to an unusual type of interstitial density--$d$ band coupling. The $E^*$ electron band and the conventional Ni $dp\\sigma$ band will display a dichotomy of hole and electron quasiparticle behavior in normal state transport and far-IR properties, and likely resulting in unconventional superconducting state properties even for nickelates.", "url": "https://arxiv.org/abs/2606.10564", "type": "理论", "summary": "1. 该工作报道了一种Ni^{1+}双层镍酸盐La_3Ni_2O_5F，揭示了其基于间隙密度的部分占据E^*带和圆柱形电子费米面，实现自掺杂。\n2. 技术核心在于E^*带与Ni d_{xz},d_{yz}带耦合形成非解析狄拉克点，导致间隙密度与d带间的非常规耦合机制。\n3. 该体系呈现空穴与电子准粒子行为的二分性，为常规镍酸盐中非常规超导态的实现提供了新的物理平台。", "summary_source": "deepseek", "authors": [{"name": "Young-Joon Song"}, {"name": "W. E. Pickett"}, {"name": "K.-W. Lee"}], "featured_authors": [{"name": "Young-Joon Song"}, {"name": "W. E. Pickett"}, {"name": "K.-W. Lee"}], "author_count": 3}, {"id": "2606.10604", "category": "cond-mat", "title": "Propagation and localization of spin excitations at altermagnetic domain walls", "abstract": "Altermagnets (A$\\ell$Ms) are spin-compensated materials in which opposite-spin sublattices are connected by a symmetry that causes a spin splitting in their elementary excitations. As there is a strong effect of altermagnetism on domain wall properties, it is quite natural to also expect an enrichment of the physics of magnetic excitations at A$\\ell$M domain walls. Here, we consider the propagation of spin eigen-excitations along domain walls in easy-axial $d$-wave A$\\ell$Ms. Investigating the presence of bound states localized on a domain wall, we find that the effect of the A$\\ell$M on the bound states strongly depends on the orientation of the domain wall relative to the crystallographic directions. If the domain wall is oriented along a nodal direction [100] or [010], A$\\ell$M does not change the number of bound states; however, it leads to a nonlinear dispersion and a tilt of the wavefront. The effect of A$\\ell$M is strongest when the domain wall is oriented along the directions [110] or [$\\bar{1}$10], i.e., along the directions of the strongest A$\\ell$M splitting in the magnon spectrum. In this case, (i) the additional gapped bound states appear, (ii) degeneracy of the eigenstates with respect to their polarization (right-handed or left-handed precession of the N{é}el vector) is removed, and (iii) the localization area of the bound states strongly depends on the eigenfrequency. The latter may lead to strong localization of the bound state at the domain wall. We further consider the influence of a static magnetic field that is applied along the easy axis, and find that the magnetic field induces an asymmetry between the localization regions on opposite sides of the domain wall and sets an upper limit on the absolute value of the propagating eigenstate's wave vector.", "url": "https://arxiv.org/abs/2606.10604", "type": "理论", "summary": "1. 该工作研究了d波交变磁体中沿畴壁传播的自旋本征激发，分析了束缚态的出现及其局域化特征。\n2. 其关键在于发现畴壁取向强烈影响交变磁效应：当畴壁沿[110]方向时，出现额外有隙束缚态，简并消除，且局域化区域显著依赖于本征频率。\n3. 外加轴向磁场可在畴壁两侧引入不对称局域化并限制传播波矢，这为通过取向与磁场调控交变磁畴壁自旋波提供了理论指导。", "summary_source": "deepseek", "authors": [{"name": "Oksana Peschanska"}, {"name": "Jeroen van den Brink"}, {"name": "Volodymyr P. Kravchuk"}], "featured_authors": [{"name": "Oksana Peschanska"}, {"name": "Jeroen van den Brink"}, {"name": "Volodymyr P. Kravchuk"}], "author_count": 3}, {"id": "2606.10731", "category": "cond-mat", "title": "The Two Dimensional Dynamical Bulk Boundary Correspondence: Beyond Two Band Models", "abstract": "A dynamical equivalent of the bulk-boundary correspondence has been suggested to occur in one and two dimensional topological models following sudden quenches. Depending on the topological invariant of the time evolving and initial phases involved large boundary contributions to a dynamical free energy occur. Moreover they occur periodically between the critical times at which this dynamical free energy becomes non-analytic, \\emph{i.e.}~at dynamical quantum phase transitions. At these critical times the eigenvalue spectrum of the Loschmidt matrix which underlies the dynamical free energy closes its gap. The boundary contributions are understood to be due to zero-modes or in-gap bands of this matrix, forming a close analogy with equilibrium topological models and their edge modes. The exact cause of this phenomena and its generality remain unknown. In this article we test the dynamical bulk-boundary correspondence for a complicated two dimensional topological superconductor with a rich phase diagram, allowing quenches between many different Chern numbers. We show that there is no straightforward correspondence between the equilibrium phases quenched between and the dynamical bulk boundary correspondence. Furthermore the correspondence can depend on the orientation of the edges, suggesting a possible weak topological variant.", "url": "https://arxiv.org/abs/2606.10731", "type": "理论+数值", "summary": "1. 该文在一具有丰富相图的二维拓扑超导体中检验了动力学体边对应，探索了不同陈数间的淬火过程。\n2. 其核心发现是动力学体边对应与淬火平衡相之间无简单直接联系，且该对应依赖于边缘取向，暗示弱拓扑变体的可能性。\n3. 这一结果揭示了动力学拓扑现象需超越双带模型框架，为理解非平衡体系中体边对应的普适性与局限性提供了关键线索。", "summary_source": "deepseek", "authors": [{"name": "Tomasz Masłowski"}, {"name": "Nicholas Sedlmayr"}], "featured_authors": [{"name": "Tomasz Masłowski"}, {"name": "Nicholas Sedlmayr"}], "author_count": 2}, {"id": "2606.10757", "category": "cond-mat", "title": "Dynamical Partition Functions of Stochastic Dynamics via Variational Flows", "abstract": "Nonequilibrium thermodynamics is governed by the dynamical partition function, and its computation in high-dimensional continuous-state dynamics is a longstanding challenge. The Feynman-Kac formalism provides a rigorous representation for generating functions of arbitrary path observables; however, practical evaluation beyond low dimensions or the weak-noise limit is hindered by the curse of dimensionality and the exponentially growing replica demands of trajectory-based methods. Here we develop a mesh-free neural variational framework that realizes the Feynman-Kac theorem with generative flow models, recasting tilted stochastic evolution as a time-dependent optimization problem. This approach enables the direct computation of both finite-time and asymptotic trajectory thermodynamics in a unified manner. The method applies to general observables, enabling the evaluation of work, entropy production, and current fluctuations. We demonstrate the accuracy and scalability of this method in various nonequilibrium systems including high-dimensional cases.", "url": "https://arxiv.org/abs/2606.10757", "type": "理论+数值", "summary": "1. 该工作提出了一个无网格神经变分框架，利用生成流模型实现Feynman-Kac定理，直接计算高维连续状态随机动力学中有限时间和渐近的动力学配分函数。\n2. 其核心在于将倾斜随机演化重构为时间依赖优化问题，从而避免路径方法中的维度诅咒和指数增长的副本需求，适用于任意路径可观测量。\n3. 这为统一评估做功、熵产和电流涨落等非平衡轨迹热力学可观测量，以及向更高维复杂系统的扩展提供了可扩展的数值方案。", "summary_source": "deepseek", "authors": [{"name": "Zequn Lin"}, {"name": "Ying Tang"}], "featured_authors": [{"name": "Zequn Lin"}, {"name": "Ying Tang"}], "author_count": 2}, {"id": "2606.10773", "category": "cond-mat", "title": "Nonequilibrium Green Functions Simulations for Large Correlated Systems", "abstract": "Correlated real-time dynamics in large, spatially inhomogeneous quantum systems remain difficult to access with nonequilibrium many-body methods. Two-time nonequilibrium Green functions (NEGF) retain dynamical correlations but their computational runtime grows cubically with the number of time steps $N_\\mathrm{t}$. This scaling bottleneck could recently be overcome by introducing the G1--G2 scheme that is linear in $N_\\mathrm{t}$, but requires propagation of a two-particle correlation function and may suffer from numerical instabilities. This has restricted simulations to small systems with $N_\\mathrm{b} \\sim 10^2$ basis states. Here we introduce a quantum-fluctuation formulation of nonequilibrium Green functions, denoted $\\delta$NEGF, that represents dynamical two-particle correlations through fluctuations of field-operator products, $\\delta \\hat G$. This guarantees stable dynamics by preserving the positivity of the reduced density matrices, avoids the explicit storage of the two-particle Green function, and reduces the propagation to a finite ensemble of Hartree-Fock-like trajectories. Combined with a stochastic low-rank decomposition of the correlation functions, the method retains time-linear scaling while extending dynamical $GW$ and particle-particle and particle-hole $T$-matrix simulations to basis sizes of order $N_\\mathrm{b}\\sim 10^4$. We benchmark $\\delta$NEGF against exact and HF-GKBA results for lattice systems, finding stable correlated dynamics also at strong coupling. We further demonstrate large-scale simulations of diffusion in two-dimensional Hubbard lattices and ultrafast relaxation in graphene nanoribbon heterostructures with long-range Coulomb interactions. These results establish $\\delta$NEGF as a scalable route to dynamical self-energy simulations of large, spatially inhomogeneous correlated quantum systems beyond the reach of existing NEGF implementations.", "url": "https://arxiv.org/abs/2606.10773", "type": "数值", "summary": "1. 该工作提出δNEGF量子涨落表述，实现对大型空间非均匀关联系统的非平衡实时动力学模拟。\n2. 其核心卖点是利用场算符乘积涨落替代双粒子格林函数传播，结合随机低秩分解突破时间步长三次方瓶颈并保持数值稳定性。\n3. 这为将动力学GW与T矩阵模拟扩展至10^4基态以上系统提供了可扩展途径，尤其适用于强关联晶格扩散与纳米异质结超快弛豫问题。", "summary_source": "deepseek", "authors": [{"name": "Erik Schroedter"}, {"name": "Michael Bonitz"}, {"name": "Jan-Philip Joost"}], "featured_authors": [{"name": "Erik Schroedter"}, {"name": "Michael Bonitz"}, {"name": "Jan-Philip Joost"}], "author_count": 3}, {"id": "2606.10779", "category": "cond-mat", "title": "NANOG assembles into self-limiting aging micelles that drive a sol-gel transition and modulate DNA dynamics", "abstract": "Proteins and nucleic acids form non-Newtonian liquids with complex rheological properties that contribute to their function in vivo. Here we investigate the rheology of the transcription factor NANOG, a key protein to maintain embryonic stem cell pluripotency. We find that at high concentrations, NANOG forms macroscopic aging gels that are dependent on its intrinsically disordered domain. By combining molecular dynamics simulations, mass photometry and Cryo-EM, we also discover that -- in contrast with unbounded condensates formed by other intrinsically disordered proteins -- NANOG forms self-limiting micelles with exposed DNA-binding domains. We show that these micelles can stabilize DNA entanglements and in turn modulate DNA dynamics. Based on our findings, we conjecture that NANOG may contribute to regulate gene expression by creating local gel-like environments that restrict genome dynamics and that its aging may ingrain mechanical memory in gene regulatory networks.", "url": "https://arxiv.org/abs/2606.10779", "type": "理论+数值", "summary": "1. 该工作通过分子动力学模拟、质谱与冷冻电镜，揭示了转录因子NANOG在高浓度下经其内在无序区驱动形成自限制老化胶束，并引发溶胶-凝胶转变。\n2. 其核心在于NANOG胶束具有暴露DNA结合域且尺寸自限，不同于典型无界凝聚体，并能稳定DNA缠结以调控其动力学行为。\n3. 这暗示NANOG可能通过创建局部凝胶微环境限制基因组动力学，其老化过程或将机械记忆引入基因调控网络，为理解转录因子力学调控基因表达提供新视角。", "summary_source": "deepseek", "authors": [{"name": "Amandine Hong-Minh"}, {"name": "Yair Augusto Gutierrez Fosado"}, {"name": "Abbie Guild"}, {"name": "Nicholas Mullin"}, {"name": "Laura Spagnolo"}, {"name": "Ian Chambers"}, {"name": "Davide Michieletto"}], "featured_authors": [{"name": "Amandine Hong-Minh"}, {"name": "Yair Augusto Gutierrez Fosado"}, {"name": "Abbie Guild"}, {"name": "Laura Spagnolo"}, {"name": "Ian Chambers"}, {"name": "Davide Michieletto"}], "author_count": 7}, {"id": "2606.10812", "category": "cond-mat", "title": "Majorana fermions at self-generated interfaces", "abstract": "The Kitaev model describing a one-dimensional topological superconducting chain is known to support two Majorana fermions localized at the systems endpoints when the parameters are tuned to the topological phase. In this work, we investigate the possibility that Majorana fermions may also emerge away from the physical boundaries of the chain. To this purpose, we generalize the Kitaev model by incorporating a local coupling between the electronic density and a classical elastic (lattice) field. This electron-lattice interaction can induce phase separation between superconducting regions characterized by distinct topological invariants, thereby generating internal interfaces that host Majorana bound states. Under these conditions, a dilute gas of Majorana fermions can be realized in the bulk of the system.", "url": "https://arxiv.org/abs/2606.10812", "type": "理论", "summary": "1. 该工作推广Kitaev链模型，引入电子密度与经典弹性场的局域耦合，研究自生成内部界面处Majorana费米子的出现。\n2. 其物理核心在于电子-晶格相互作用诱导超导区域拓扑相分离，使不同拓扑不变量区域的界面绑定Majorana束缚态。\n3. 这为在系统体相中实现稀薄Majorana费米子气体提供了新机制，对拓扑量子比特的设计具有启发性。", "summary_source": "deepseek", "authors": [{"name": "Nikola Prodanov"}, {"name": "Sergio Ciuchi"}, {"name": "Sergio Caprara"}], "featured_authors": [{"name": "Nikola Prodanov"}, {"name": "Sergio Ciuchi"}, {"name": "Sergio Caprara"}], "author_count": 3}, {"id": "2606.10814", "category": "cond-mat", "title": "Fractional shot noise of an SU(N) Kondo system", "abstract": "We consider transport through a multi-level interacting quantum dot (N-QD) in Kondo regime. Using the Kotliar-Ruckentein slave boson approach (SBMFA) for N-level Anderson model we define effectively noninteracting quasiparticles of the SU(N) Kondo system ($N=2,3,4,5,6$). Kondo resonance transmission coefficients determine linear noise describing quasiparticle partitioning. To discuss nonlinear conductance, susceptibilities and shot noise in the strong coupling regime, we apply Fermi liquid theory with parameters expressed by susceptibilities of pseudofermions determined within SBMFA. Nonlinear shot noise is dominated by two-quasiparticle scattering. However, we demonstrate that for occupation regions distant from the electron-hole symmetry point, the role of three-body correlations must be revealed.", "url": "https://arxiv.org/abs/2606.10814", "type": "理论", "summary": "1. 本文利用Kotliar-Ruckenstein辅助玻色子方法和费米液体理论，研究了SU(N)近藤系统中多能级量子点的输运性质与散粒噪声。\n2. 核心卖点是揭示了在强耦合条件下，非线性散粒噪声由两准粒子散射主导，并发现远离电子-空穴对称点时三体关联效应不可忽略。\n3. 这为深入理解SU(N)近藤系统中准粒子分数化及多体关联对噪声的贡献提供了明确理论框架。", "summary_source": "deepseek", "authors": [{"name": "Damian Krychowski"}, {"name": "Stanisław Lipiński"}], "featured_authors": [{"name": "Damian Krychowski"}, {"name": "Stanisław Lipiński"}], "author_count": 2}, {"id": "2606.10821", "category": "cond-mat", "title": "Continuous and discontinuous transitions in the Ising-Heisenberg model on the extended Lieb lattice in a magnetic field", "abstract": "The spin-1/2 Ising-Heisenberg model on the extended Lieb lattice in a magnetic field is exactly mapped onto an effective spin-1/2 Ising model on the square lattice. The ground-state phase diagram comprises the quantum antiferromagnetic (QAF), quantum monomer-dimer (MD), classical ferrimagnetic (FRI), and classical ferromagnetic phase. The MD-FRI ground-state phase boundary extends to finite temperatures as a dome-shaped surface of discontinuous thermal transitions bounded by a line of Ising critical points. The QAF phase is enclosed by a surface of continuous thermal transitions evolving from the QAF-MD and QAF-FRI ground-state phase boundaries. Monte Carlo simulations fully confirm the existence and nature of both continuous and discontinuous thermal phase transitions obtained by exact and approximate analytical calculations.", "url": "https://arxiv.org/abs/2606.10821", "type": "理论+数值", "summary": "1. 该工作通过精确映射将扩展Lieb晶格上自旋-1/2 Ising-Heisenberg模型转化为方格上等效Ising模型，并结合解析方法与蒙特卡洛模拟完整刻画了其基态与有限温度相图。\n2. 核心卖点在于揭示了基态MD-FRI相边界在有限温度下演化为由Ising临界点线界定的穹顶状不连续转变表面，而QAF相则被连续转变表面包围，且蒙特卡洛模拟精确验证了这两类转变的存在与性质。\n3. 这为理解量子自旋体系中竞争相互作用如何产生连续与不连续转变共存的结构提供了精确可解范例，启发对类似晶格几何中相变拓扑与临界行为的进一步研究。", "summary_source": "deepseek", "authors": [{"name": "David Sivy"}, {"name": "Jozef Strecka"}], "featured_authors": [{"name": "David Sivy"}, {"name": "Jozef Strecka"}], "author_count": 2}, {"id": "2606.10854", "category": "cond-mat", "title": "Magnetism and Topology from Circularly Polarized Phonon Floquet Engineering", "abstract": "We theoretically show that circularly polarized phonons induce electronic magnetization and drive a topological phase transition via phonon Floquet engineering. Considering the electronic states modulated by circularly polarized phonons on a honeycomb lattice, we show that such lattice dynamics generates an effective next-nearest-neighbor electron hopping, leading to a Haldane-type mass term. Circularly polarized phonon breaks time-reversal symmetry (TRS) and opens a gap at valley points, undergoing phase transition from a trivial insulator to a Chern insulator. Moreover, the orbital and spin magnetizations emerge due to the breaking of TRS. Our results show that circularly polarized phonons serve as an effective magnetic field to engineer magnetism and topology, offering new opportunities for phonon Floquet approaches.", "url": "https://arxiv.org/abs/2606.10854", "type": "理论", "summary": "1. 该工作理论上证明圆极化声子通过Floquet工程在蜂窝晶格中诱导电子磁化并驱动拓扑相变。\n2. 其核心在于圆极化声子破坏时间反演对称性，产生有效次近邻跳跃和Haldane质量项，实现从平庸绝缘体到陈绝缘体的相变并导致轨道与自旋磁化。\n3. 这为利用声子Floquet方法作为有效磁场来工程化磁性与拓扑态提供了新途径。", "summary_source": "deepseek", "authors": [{"name": "Dapeng Yao"}, {"name": "Tiantian Zhang"}, {"name": "Takashi Oka"}, {"name": "Takehito Yokoyama"}], "featured_authors": [{"name": "Dapeng Yao"}, {"name": "Tiantian Zhang"}, {"name": "Takashi Oka"}, {"name": "Takehito Yokoyama"}], "author_count": 4}, {"id": "2606.10858", "category": "cond-mat", "title": "Thermodynamic Approach to Momentum Transport in Dense Fluids", "abstract": "We present a new framework for extending Chapman-Enskog theory beyond the hard-sphere fluid model. Rather than relying on effective hard sphere diameters, the approach makes use of on an exchange function which can be related to the thermodynamic properties of the system. We show that two existing extensions, including modified Enskog theory (MET), fit into this new framework. Based on our approach, we propose an alternative to MET that takes into account the potential interaction energy associated with the inter-particle interactions in the fluid. The proposed expression is applied to predicting the shear viscosity of several different simulated fluid models across a wide set of densities $0.05 \\leq \\rho^* \\leq 0.8$ and temperatures $1.5 \\leq T^* \\leq 4.0$ in Lennard-Jones units. The fluid models considered include both the Weeks-Chandler-Anderson (WCA) fluid and the Lennard-Jones (LJ) fluid. At low and intermediate density, here taken to be $\\rho^* \\leq 0.3$, we report mean relative prediction errors between $2\\%$ and $4\\%$ for both these. Across all densities considered, the largest mean relative errors reported are $4.4\\%$ and $8.1\\%$ for the WCA fluid and LJ fluid respectively. We also investigate other interaction models, including a diatomic molecular model, in order to better understand the limitations of our approach.", "url": "https://arxiv.org/abs/2606.10858", "type": "理论", "summary": "1. 该工作提出一个基于热力学交换函数而非有效硬球直径的稠密流体动量输运理论框架，将Chapman-Enskog方法推广至硬球模型之外。\n2. 其核心卖点在于通过引入与体系热力学性质直接关联的交换函数，并纳入相互作用势能修正，在0.05至0.8密度范围内对WCA与LJ流体的剪切粘度预测误差分别低于4.4%与8.1%。\n3. 这为从热力学数据出发统一描述非硬球稠密流体的输运系数提供了可行途径，并可拓展至分子流体等更复杂体系的输运行为研究。", "summary_source": "deepseek", "authors": [{"name": "Christopher Devik Fjeldstad"}, {"name": "Jonas Bueie"}, {"name": "Astrid S. de Wijn"}], "featured_authors": [{"name": "Christopher Devik Fjeldstad"}, {"name": "Jonas Bueie"}, {"name": "Astrid S. de Wijn"}], "author_count": 3}, {"id": "2606.10915", "category": "cond-mat", "title": "Local density of states distribution and multifractal eigenvectors of weighted random networks via the cavity approach", "abstract": "We study the local density of states (LDoS) distribution of a general class of weighted Erdős-Rényi graphs. Using the cavity method, we obtain a good approximation to the full LDoS distribution and compact expressions for its power-law tails, which we show to have exponent $3$ in the extended phase. We deduce that the eigenvectors in the continuous part of the spectrum are extended but (weakly) multifractal, and we extract expressions for the associated fractal dimensions and the singularity spectrum. We also demonstrate that the inverse participation ratio in this multifractal phase exhibits an unusual logarithmic scaling with system size, which is neither fully-extended nor localised by the usual definitions. Finally, we verify that some symmetry properties (derived from the non-linear sigma model), which have been shown to hold for many systems exhibiting multifractality, also hold in our case, both for the LDoS distribution and the singularity spectrum.", "url": "https://arxiv.org/abs/2606.10915", "type": "理论", "summary": "1. 运用空穴方法，该工作解析了加权Erdős-Rényi随机网络上局域态密度(LDoS)的完整分布及其幂律尾行为，并揭示了连续谱本征向量的弱多分形性质。\n2. 主要技术突破在于获取了LDoS分布幂律尾的简洁解析式（指数3），并导出扩展相中本征向量的分形维数与奇异性谱，同时发现逆参与比呈现非常规的对数标度。\n3. 该工作建立的解析框架不仅阐明了多分形相与非线性格林函数模型对称性的一致性，也为研究无序复杂网络中的临界态与局部化转变提供了可验证的途径。", "summary_source": "deepseek", "authors": [{"name": "Joseph W. Baron"}, {"name": "Tim Rogers"}], "featured_authors": [{"name": "Joseph W. Baron"}, {"name": "Tim Rogers"}], "author_count": 2}, {"id": "2606.11031", "category": "cond-mat", "title": "Influence of CeO$_2$MnO$_x$ heterostructure on Hydrogen Peroxide Electrogeneration on Carbon-Based Catalysts", "abstract": "The sustainable electrogeneration of hydrogen peroxide (H2O2) via the two-electron oxygen reduction reaction (2e$^-$ ORR) represents a promising alternative to conventional production methods. In this study, CeO2 and CeO2MnOx nanoparticles were synthesized and supported on Vulcan XC-72 carbon at varying loadings (1, 3, and 5%), aiming to assess the lowest metal loading and high H2O2 electrosynthesis. Physicochemical characterizations confirmed the successful formation of CeO2 nanowires and the effectiveness of the MnOx surface modification. XRD, TEM, XPS, EPR, and contact angle analyses revealed that CeO2 loading increased surface hydrophilicity through the presence of oxygenated functional groups, thereby favoring electrochemical activity. On the other hand, all CeO2MnOx loadings were statistically equivalent to Vulcan XC-72 in terms of contact angle. Electrochemical evaluations using a rotating ring-disk electrode (RRDE) demonstrated enhanced ORR activity and high H2O2 selectivity for the 1% CeO2MnOx/C and 3% CeO2/C catalysts, achieving up to 90% selectivity and elevated ring currents. The results suggest that low metal loading and surface modification via MnOx improve the balance between active site exposure, oxygen adsorption, and intermediate stabilization, thus favoring the selective 2e$^-$ pathway. These findings support the development of cost-effective, non-noble-metal catalysts for green H2O2 production via electrosynthesis.", "url": "https://arxiv.org/abs/2606.11031", "type": "理论", "summary": "1. 该工作研究了CeO₂及CeO₂-MnOₓ异质结构修饰碳载催化剂对两电子氧还原电合成过氧化氢性能的影响。\n2. 其核心卖点是低金属负载（1% CeO₂-MnOₓ/C和3% CeO₂/C）实现高达90%的H₂O₂选择性，归因于MnOₓ表面修饰优化了亲水性、活性位点暴露与氧吸附中间体稳定化。\n3. 这为设计低成本非贵金属催化剂以推动绿色H₂O₂电合成提供了明确方向。", "summary_source": "deepseek", "authors": [{"name": "Caroline de O. Carrilho"}, {"name": "Juliana M. S. de Jesus"}, {"name": "João Paulo C. Moura"}, {"name": "Dara Silva Santos"}, {"name": "Aline B. Trench"}, {"name": "Caio Machado Fernandes"}, {"name": "Aila O. Santos"}, {"name": "Odivaldo C. Alves"}, {"name": "Júlio C. M. Silva"}, {"name": "Mauro C. dos Santos"}], "featured_authors": [{"name": "Caroline de O. Carrilho"}, {"name": "Juliana M. S. de Jesus"}, {"name": "João Paulo C. Moura"}, {"name": "Odivaldo C. Alves"}, {"name": "Júlio C. M. Silva"}, {"name": "Mauro C. dos Santos"}], "author_count": 10}, {"id": "2606.11056", "category": "cond-mat", "title": "On pseudogap phase as precursor to a superconducting dome in high-Tc cuprates: Non-analytic T* as a function of doping", "abstract": "We generalize the condition under which a quantum material exhibiting a pseudogap phase is a precursor to a superconducting (SC) dome. The result reveals the non-analytic T* as a function of doping. A well-known example is the high-Tc cuprates. Essentially, the SC dome is generated under two conditions: (1) that the pseudogap T* is a decreasing function of doping, due to the decrease in size of extended pairing of doped holes with doping, and most importantly, (2) that the rate of configurational-ordering parameter is an increasing function of doping as a result of the decrease in extended length of the disordered pairs. These two conditions are provided by the new entanglement and confinement pairing mechanism of high-Tc cuprates. This is a theory that has recently been discussed in the literature by Buot et al. It hinges on a novel strong entanglement and confinement hole pairing (ECHP) mechanism that unravels the microscopic features of the entire phase diagram of both electron and hole-doped high-Tc cuprates.", "url": "https://arxiv.org/abs/2606.11056", "type": "理论+数值", "summary": "1. 该工作推广了赝能隙相作为高温超导圆顶前驱体的条件，揭示了特征温度T*随掺杂呈现非解析行为。\n2. 其核心在于基于纠缠与束缚空穴配对机制，给出两个必要条件：赝能隙T*随掺杂递减，以及构型有序参数速率随掺杂递增。\n3. 这为统一理解电子型和空穴型高温超导铜氧化物的完整相图提供了微观理论框架。", "summary_source": "deepseek", "authors": [{"name": "Felix A. Buot"}], "featured_authors": [{"name": "Felix A. Buot"}], "author_count": 1}, {"id": "2606.11060", "category": "cond-mat", "title": "Interplay between photon condensation and electron-electron interactions in molecular systems", "abstract": "We investigate a minimal molecular model consisting of square planar plaquettes hosting multiple electrons, whose dynamics is governed by a tight-binding Hamiltonian supplemented by on-site Hubbard repulsion. By coupling this system to a spatially nonuniform cavity mode, we analyze the emergence of a magnetostatic instability, namely photon condensation, originating from the paramagnetic Van Vleck mechanism. The global behavior of the system is analyzed for different electronic filling factors, and we find that, except for the special cases of half-filling and single electron, where the transition, if it occurs, is necessarily a second order phase transition, the global system may also undergo a first order transition because of the action of the electron-electron interaction. The polaritonic excitation energies are analyzed, providing clear spectroscopic signatures of the magnetostatic instability and of its order.", "url": "https://arxiv.org/abs/2606.11060", "type": "理论", "summary": "1. 该工作通过将方形平面晶格上的多电子系统与空间非均匀腔模耦合，研究了顺磁Van Vleck机制引发的光子凝聚（磁静力不稳定性）与电子-电子相互作用的相互影响。\n2. 其核心发现在于，除半填充和单电子情形必然为二级相变外，电子-电子相互作用可驱动系统发生一级相变，并给出极化激元激发谱作为不稳定性及其级次的清晰光谱特征。\n3. 这为在分子腔系统中通过光谱学手段鉴别光子凝聚的相变级次及电子关联效应提供了可检验的理论指引。", "summary_source": "deepseek", "authors": [{"name": "Matteo Parisi"}, {"name": "Elisabetta Paladino"}, {"name": "Giuseppe A. Falci"}, {"name": "Gian Marcello Andolina"}, {"name": "Salvatore Savasta"}, {"name": "Marco Polini"}, {"name": "Francesco M. D. Pellegrino"}], "featured_authors": [{"name": "Matteo Parisi"}, {"name": "Elisabetta Paladino"}, {"name": "Giuseppe A. Falci"}, {"name": "Salvatore Savasta"}, {"name": "Marco Polini"}, {"name": "Francesco M. D. Pellegrino"}], "author_count": 7}, {"id": "2606.11095", "category": "cond-mat", "title": "Hybrid Hamiltonian-diagrammatic quantum impurity solver", "abstract": "Quantum impurity models, which describe the coupling between interacting orbitals and a non-interacting bath, play a central role in the physics of strongly correlated electron systems. Solving a quantum impurity model in general requires the use of non-perturbative numerical methods. Hamiltonian-based approaches, which rely on an explicit bath discretization, are typically limited to a small number of bath sites or small entanglement, and diagrammatic methods suffer from sign problems, slow convergence, or diagram truncation approximations. Here we show that these two classes of methods can be combined: augmenting diagrammatic methods with a small auxiliary bath can reduce the residual problem to a regime where low-order perturbation theory is highly accurate and rapidly converging. In a simple benchmark, the precision of the hybrid approach surpasses bold-line calculations by several orders of magnitude; for a strongly interacting two-orbital model with a severe sign problem, convergence is achieved at three orders of magnitude lower computational cost than competing methods; and convergence to the unknown exact result is rapidly accelerated in a difficult realistic problem. Our results establish a practical route to high-precision quantum impurity solutions in correlated quantum systems.", "url": "https://arxiv.org/abs/2606.11095", "type": "理论+数值", "summary": "1. 该工作提出一种混合哈密顿量-图解方法，通过将图解方法与辅助小浴池结合来求解量子杂质模型。\n2. 其核心在于利用辅助浴池将剩余问题降至低阶微扰论高度精确且快速收敛的参数区域，显著提升精度与效率。\n3. 这为强关联电子系统中高精度量子杂质求解提供了一条实用路径，尤其适用于符号问题严重或收敛困难的体系。", "summary_source": "deepseek", "authors": [{"name": "Yang Yu"}, {"name": "Gaurav Harsha"}, {"name": "Lei Zhang"}, {"name": "Agnieszka Jażdżewska"}, {"name": "Dominika Zgid"}, {"name": "Xinyang Dong"}, {"name": "Emanuel Gull"}], "featured_authors": [{"name": "Yang Yu"}, {"name": "Gaurav Harsha"}, {"name": "Lei Zhang"}, {"name": "Dominika Zgid"}, {"name": "Xinyang Dong"}, {"name": "Emanuel Gull"}], "author_count": 7}, {"id": "2606.11128", "category": "cond-mat", "title": "Roughness-robust surface altermagnetism in $PT$ antiferromagnets", "abstract": "Surface altermagnetism extends spin splitting beyond bulk altermagnets through symmetry reduction at surfaces and interfaces. An existing classification applies to the local symmetry of atomically flat surface terraces. The present paper addresses the symmetry of macroscopic spin-momentum correlations that survive averaging over compensated rough surfaces. These correlations are governed by the surface antisymmetry Laue point group. Rough-surface altermagnetism is forbidden at any surface of a magnet whose antisymmetry space group contains antitranslations, and the classification therefore reduces to $PT$-symmetric antiferromagnets. By restoring all symmetries leaving the surface normal invariant, roughness can generate compensated surface altermagnets from uncompensated flat terminations, increase the surface symmetry, or suppress spin splitting. By combining bulk switchability with altermagnetic surface transport properties, roughness-robust surface altermagnetism in $PT$-symmetric antiferromagnets provides a route toward spintronic functionality.", "url": "https://arxiv.org/abs/2606.11128", "type": "理论", "summary": "1. 本文建立了粗糙表面交变磁性的对称性分类理论，揭示其由表面反称劳厄点群支配，并限定于PT对称反铁磁体。\n2. 关键发现是：粗糙度可补偿平坦端面的非补偿态、提升表面对称性或抑制自旋劈裂，从而产生粗糙鲁棒的表面交变磁性。\n3. 该工作将体块可切换性与表面输运结合，为在粗糙实际器件中实现鲁棒自旋电子学功能提供了具体物理途径。", "summary_source": "deepseek", "authors": [{"name": "K. D. Belashchenko"}], "featured_authors": [{"name": "K. D. Belashchenko"}], "author_count": 1}, {"id": "2606.09969", "category": "hep-th", "title": "Calling the Brane Next Door: The Kaluza-Klein Tower as a Gravitational Information Channel", "abstract": "Could two worlds localised on neighbouring branes communicate through gravity alone? We investigate this question in a minimal higher-dimensional framework in which Standard Model fields are confined to our brane while gravity propagates through the bulk. From the brane-to-brane graviton propagator we derive the retarded transfer kernel of the inter-brane link and identify the transition from evanescent to propagating Kaluza-Klein modes. The central idea is to give the Kaluza-Klein tower a new role: not only as a spectrum of massive gravitational states, but as a set of communication carriers. Below the first KK threshold the channel is effectively four-dimensional and is mediated only by the massless graviton. Above threshold, massive KK modes open as additional propagating subchannels, and information may be encoded in their occupation pattern, relative phases, and arrival-time structure as well as in o
