ics as the intersection of the commutants of the group action and synchronization operator.", "url": "https://arxiv.org/abs/2604.18448", "type": "理论", "summary": "1. 该工作研究了有限维希尔伯特空间张量积中同步子空间的保持与稳定性，针对由局部自伴算子定义的同步子空间，建立了两个主要理论结果。\n2. 首先，对于满足与同步算子对易上界的ε兼容动力学，证明了初始同步态的偏离速率存在由ε决定的线性上界，并构造了达到该界限的示例；其次，在有限群对称性下，揭示了同步子空间与对角等变分量的一致性，并完整刻画了保持同步的动力学代数结构。\n3. 这一理论框架为在存在对称性和近似动力学条件下，精确分析与控制量子多体系统中的同步行为，以及设计对称性保护的同步协议提供了坚实的数学基础。", "summary_source": "deepseek", "authors": [{"name": "Nicholas R. Allgood"}], "featured_authors": [{"name": "Nicholas R. Allgood"}], "author_count": 1}, {"id": "2604.18517", "category": "math-ph", "title": "Low-noise Pauli-consistent ensemble Monte Carlo for graphene with electron-electron scattering", "abstract": "We investigate Pauli-consistent ensemble Monte Carlo simulations of graphene with explicit intraband electron-electron scattering. To reduce the cost of electron-electron proposal-rate evaluation, we introduce a sampled-partner approximation that replaces the full partner-cell sum by uniform sampling from the instantaneous ensemble, while leaving the event-level collision step unchanged. Comparison with the full-sum reference shows close agreement together with a substantial reduction in computational cost, enabling large-ensemble low-noise simulations. In this regime, systematic oscillatory components become clearly resolved in ensemble-averaged time traces. We show that these oscillations are numerical and originate from deterministic drift on the discretized momentum-space grid. We also discuss a procedure for reducing their impact in recorded observables without modifying the underlying Monte Carlo dynamics.", "url": "https://arxiv.org/abs/2604.18517", "type": "理论", "summary": "1. 该工作研究了石墨烯中考虑泡利不相容原理的系综蒙特卡洛模拟，并显式引入了带内电子-电子散射过程。\n2. 其技术核心是提出了采样伙伴近似方法，通过瞬时系综均匀采样替代全求和，在保持碰撞步骤不变的前提下大幅降低了计算成本。\n3. 这为开展大规模低噪声模拟提供了可行方案，同时所揭示的离散动量空间网格确定性漂移机制，为改善观测量的数值精度指明了具体方向。", "summary_source": "deepseek", "authors": [{"name": "Tigran Zalinyan"}, {"name": "Giovanni Nastasi"}], "featured_authors": [{"name": "Tigran Zalinyan"}, {"name": "Giovanni Nastasi"}], "author_count": 2}, {"id": "2604.16616", "category": "quant-ph", "title": "Entropy Moduli and BKM Coercivity for Rank-Deficient Non-Commutative Markov Semigroups", "abstract": "We study entropy-based certification for non-commutative Markov semigroups with rank-deficient stationary states. We introduce a boundary-activation functional that quantifies deviation from the support of the stationary state and prove a logarithmic lower bound on relative entropy in terms of this quantity, based on a BKM coercivity argument and an exact block-decomposition identity. Combining this estimate with dynamical bounds for Davies semigroups under a modified logarithmic Sobolev inequality, we show that, under explicit local conditions, entropy-based certification of convergence can exhibit a slowdown near the boundary regime, with a rate of order e^{-alpha t}/sqrt(alpha t). The mechanism is identified as a coherence-population effect and disappears for incoherent initial states, where classical Pinsker-type bounds are recovered.", "url": "https://arxiv.org/abs/2604.16616", "type": "理论", "summary": "1. 本文研究了具有秩亏缺稳态的非对易马尔可夫半群的熵基验证方法，引入了量化偏离稳态支集的边界激活泛函，并基于BKM强制性论证与精确块分解恒等式，证明了相对熵的对数下界。\n2. 核心进展在于结合修正对数索博列夫不等式下的戴维斯半群动力学界限，揭示了在显式局域条件下，边界区域附近熵基收敛验证会出现阶为e^{-αt}/√(αt)的减速现象。\n3. 该机制被明确识别为相干性-布居效应，为理解开放量子系统中相干性对熵收敛动力学的影响提供了理论框架，并恢复了非相干初态下的经典Pinsker型界限。", "summary_source": "deepseek", "authors": [{"name": "Hassan Nasreddine"}], "featured_authors": [{"name": "Hassan Nasreddine"}], "author_count": 1}, {"id": "2604.16626", "category": "quant-ph", "title": "Non-Associativity Induced Modifications of Open-System Quantum Dynamics: General Master Equation and a Two-Qubit Ising Case Study", "abstract": "Nonassociative deformations of phase-space structures arise naturally in the presence of magnetic charge, where the Jacobi identity for momentum components fails and the corresponding Moyal product becomes nonassociative. While such structures are well understood at the level of single-particle kinematics, their implications for open-system quantum dynamics remain largely unexplored. Here we derive a Born-Markov master equation for a system coupled to a bath when the underlying operator product is weakly nonassociative. The deformation enters through associators appearing in the second-order kernel, while pairwise operator products and dissipators retain their standard form. The resulting correction is dispersive and modifies the Liouville-von Neumann part of the generator without introducing additional dissipative channels. We then embed this structure into a two-qubit transverse-field Ising model using a Stratonovich-Weyl representation and an Ising-aligned twisted Poisson structure. In the zero-temperature limit, the nonassociative terms produce a nonlinear correction in which the instantaneous population imbalance of each qubit feeds back into the dynamics as a state-dependent longitudinal field. Numerical simulations in the weak-coupling regime, where the Born-Markov derivation is quantitatively controlled, show that increasing the nonassociativity parameter suppresses steady-state entanglement by up to 59%, reduces purity, and increases entropy, while leaving the relaxation timescale set by the dissipative rates unchanged. These results demonstrate that weak nonassociativity manifests as a coherent, population-dependent deformation of open-system dynamics rather than an additional dissipative mechanism.", "url": "https://arxiv.org/abs/2604.16626", "type": "理论+数值", "summary": "1. 本文推导了弱非结合算子乘积情形下系统与环境耦合的玻恩-马尔可夫主方程，并以横场伊辛模型中的双量子比特体系为具体案例进行了研究。\n2. 非结合性变形通过二阶核中的结合子引入，产生纯粹的色散修正，仅改变动力学生成元的刘维尔-冯诺依曼部分，而未引入额外的耗散通道。\n3. 这为非结合相位空间结构在开放量子动力学中的表现形式提供了明确范式，为未来在磁单极子平台或其他非结合系统中研究退相干与稳态操控提供了理论依据。", "summary_source": "deepseek", "authors": [{"name": "Ekin Sıla Yörük"}, {"name": "Özgür E. Müstecaplıoğlu"}, {"name": "Zafer Gedik"}], "featured_authors": [{"name": "Ekin Sıla Yörük"}, {"name": "Özgür E. Müstecaplıoğlu"}, {"name": "Zafer Gedik"}], "author_count": 3}, {"id": "2604.16701", "category": "quant-ph", "title": "Enabling Lie-Algebraic Classical Simulation beyond Free Fermions", "abstract": "Efficient classical simulation has matured to a critical component of the quantum computing stack, driving hardware validation, algorithm design, and the study of structured quantum dynamics. Lie-algebraic simulation ($\\mathfrak{g}$-sim) is a compelling approach: it replaces exponentially large Hilbert-space evolution by dynamics in a reduced adjoint space whose dimension is set by the dynamical Lie algebra (DLA) of the circuit, enabling efficient simulation whenever the DLA grows only polynomially with system size. In practice, however, existing applications of $\\mathfrak{g}$-sim have been confined to free-fermionic (matchgate) regimes, and it has been unclear how to extend the paradigm to other structured circuits whose generators may have large Pauli expansions. Here we enable Lie-algebraic classical simulation beyond free fermions by identifying additional non-trivial families of polynomial-dimensional DLAs and introducing symmetry-adapted basis representations that make the adjoint space mapping tractable. In particular, we develop an explicit Pauli orbit basis for permutation-equivariant dynamics, supporting cubic-dimensional algebras despite exponential Pauli support, and a subspace-adapted (modified) generalized Gell-Mann basis for bounded Hamming-weight ($U(1)$-equivariant) dynamics, yielding polynomial costs on fixed excitation sectors. Together with streamlined routines for free-fermionic Pauli algebras and translation-invariant variants thereof, these constructions significantly broaden the practical scope of $\\mathfrak{g}$-sim as a unifying simulation tool for structured quantum dynamics. Numerical benchmarks confirm favorable preprocessing scaling and validate large-scale proof-of-concept simulations.", "url": "https://arxiv.org/abs/2604.16701", "type": "理论+数值", "summary": "1. 该工作将李代数经典模拟（$\\mathfrak{g}$-sim）的适用范围拓展到自由费米子体系之外，识别了具有多项式维数动力学李代数（DLA）的非平凡电路族，并构建了相应的对称适配基矢表示。\n2. 其技术核心在于针对置换等变动力学设计了显式的Pauli轨道基，以及针对有界汉明权重（U(1)等变）动力学提出了子空间适配的修正广义Gell-Mann基，从而在生成元具有指数多Pauli项的情况下仍实现多项式复杂度的伴随空间映射。\n3. 这为近中等规模量子电路的高效验证、结构化量子动力学的系统研究，以及基于对称性的更广泛经典模拟算法设计提供了实用的理论框架和工具。", "summary_source": "deepseek", "authors": [{"name": "Adelina Bärligea"}, {"name": "Matthew L. Sims-Goh"}, {"name": "Jakob S. Kottmann"}], "featured_authors": [{"name": "Adelina Bärligea"}, {"name": "Matthew L. Sims-Goh"}, {"name": "Jakob S. Kottmann"}], "author_count": 3}, {"id": "2604.16711", "category": "quant-ph", "title": "Adversarial quantum teleportation", "abstract": "Claims of successful quantum teleportation are backed up by showing that fidelity exceeds some specified threshold, but whether fidelity is the performance metric and what the threshold should be has been a subject of vigorous debate. We construct adversarial models for quantum teleportation, i.e., involving cheating parties, and show that fidelity thresholds can be justified in the context of the type of adversary trying to prove unsuccessful quantum teleportation has been successful. In particular we show how previously established average-fidelity thresholds of 1/2 and 2/3 arise from our adversarial approach. Mathematically, we describe adversarial quantum teleportation as a multi-partite protocol with explicit quantum-logic circuits in both honest and cheating settings, and our methods are relevant beyond quantum teleportation to other quantum-information gadgets.", "url": "https://arxiv.org/abs/2604.16711", "type": "理论", "summary": "1. 该工作构建了涉及作弊方的对抗性量子隐形传态多方协议模型，并论证了保真度阈值的合理性。\n2. 其技术亮点在于通过对抗方法解释了平均保真度阈值1/2和2/3的起源。\n3. 该方法具有普适性，可推广至其他量子信息器件的研究。", "summary_source": "deepseek", "authors": [{"name": "Nehad AttaElmanan AbdElrahim Mabrouk"}, {"name": "Barry C Sanders"}], "featured_authors": [{"name": "Nehad AttaElmanan AbdElrahim Mabrouk"}, {"name": "Barry C Sanders"}], "author_count": 2}, {"id": "2604.16766", "category": "quant-ph", "title": "Complex Quaternionic Formulations of Dirac, Electrodynamic, and Electroweak Fields and Interactions", "abstract": "A simple translation between a standard representation of $\\mathfrak{sl}_2\\mathbb{C}$ and the complex-quaternions ($\\mathbb{H}\\otimes_\\mathbb{R}\\mathbb{C}$) is established and exploited to construct a novel hyper-complex description of the Dirac theory, electrodynamics, and ultimately the electroweak sector of the standard model. We find that coupling the constructed Dirac spinors to electromagnetism yields the correct magnetic moment for charged spin-1/2 particles. Extending electrodynamics to electroweak theory necessitates an algebraic distinction between the structures of the leptonic and Higgs fields not present in the standard model. The conditions of spontaneous symmetry breaking are explored using an alternative representation of weak isospin and hypercharge equivalent to an irreducible representation of $\\mathfrak{su}(2)\\oplus\\mathfrak{u}(1)$ on $\\mathbb{C}^4$. This alternative representation disagrees with the standard model on the overall signs of weak neutral currents.", "url": "https://arxiv.org/abs/2604.16766", "type": "理论", "summary": "1. 该工作建立了标准sl(2,C)代数表示与复四元数之间的转换关系，并利用此框架构建了狄拉克理论、电动力学及标准模型电弱部分的新颖超复表述。\n2. 其技术核心在于，该表述能自然导出带电自旋1/2粒子的正确磁矩，并将轻子场与希格斯场的代数结构差异形式化，这是标准模型所不具备的。\n3. 这为在替代的弱同位旋与超荷表示下探索对称性破缺提供了新视角，其所揭示的弱中性流整体符号差异，可能暗示着对电弱相互作用基本代数结构的重新审视。", "summary_source": "deepseek", "authors": [{"name": "James Henry Atwater"}, {"name": "David Lambert"}, {"name": "Yuri Rostovtsev"}], "featured_authors": [{"name": "James Henry Atwater"}, {"name": "David Lambert"}, {"name": "Yuri Rostovtsev"}], "author_count": 3}, {"id": "2604.16779", "category": "quant-ph", "title": "Q-SINDy: Quantum-Kernel Sparse Identification of Nonlinear Dynamics with Provable Coefficient Debiasing", "abstract": "Quantum feature maps offer expressive embeddings for classical learning tasks, and augmenting sparse identification of nonlinear dynamics (SINDy) with such features is a natural but unexplored direction. We introduce Q-SINDy, a quantum-kernel-augmented SINDy framework, and identify a specific failure mode that arises: coefficient cannibalization, in which quantum features absorb coefficient mass that rightfully belongs to the polynomial basis, corrupting equation recovery. We derive the exact cannibalization-bias formula Delta xi_P = (P^T P)^{-1} P^T Q xi_Q and prove that orthogonalizing quantum features against the polynomial column space at fit time eliminates this bias exactly. The claim is verified numerically to machine precision (<10^-12) on multiple systems. Empirically, across six canonical dynamical systems (Duffing, Van der Pol, Lorenz, Lotka-Volterra, cubic oscillator, Rossler) and three quantum feature map architectures (ZZ-angle encoding, IQP, data re-uploading), orthogonalized Q-SINDy consistently matches vanilla SINDy's structural recovery while uncorrected augmentation degrades true-positive rates by up to 100%. A refined dynamics-aware diagnostic, R^2_Q for X-dot, predicts cannibalization severity with statistical significance (Pearson r=0.70, p=0.023). An RBF classical-kernel control across 20 hyperparameter configurations fails more severely than any quantum variant, ruling out feature count as the cause. Orthogonalization remains robust under depolarizing hardware noise up to 2% per gate, and the framework extends without modification to Burgers' equation.", "url": "https://arxiv.org/abs/2604.16779", "type": "理论+数值", "summary": "1. 本文提出量子核增强的稀疏非线性动力学辨识框架Q-SINDy，并系统揭示了量子特征嵌入导致的系数吞噬问题及其精确修正方案。\n2. 通过严格推导系数偏差公式 Δξ_P = (P^T P)^{-1} P^T Q ξ_Q，证明在拟合阶段将量子特征正交化于多项式列空间可完全消除偏差，数值验证误差低于10^-12。\n3. 该框架在2%每门退极化噪声下保持稳健，且可直接推广至Burgers方程等偏微分系统，为量子-经典混合动力学建模建立了可靠基础。", "summary_source": "deepseek", "authors": [{"name": "Samrendra Roy"}, {"name": "Syed Bahauddin Alam"}], "featured_authors": [{"name": "Samrendra Roy"}, {"name": "Syed Bahauddin Alam"}], "author_count": 2}, {"id": "2604.16814", "category": "quant-ph", "title": "Entanglement Dynamics with a Stochastic Non-Hermitian Hamiltonian away from Exceptional Points", "abstract": "Although non-Hermitian dynamics near exceptional points (EPs) provide a route to accelerated entanglement generation, entanglement can also be generated far from EPs at comparable or even higher rates. However, the behavior of such entanglement in open systems remains largely unexplored, rendering it highly susceptible to environmental noise. Here, we study entanglement dynamics in two coupled qubits described by a non-Hermitian Hamiltonian, where the dissipative rates are subject to stochastic noise. We focus on the regime away from EPs. Our approach demonstrates that, even in the presence of classical noise, rich dynamical control can be achieved, enabling highly efficient entanglement generation with a timescale that is significantly shorter than that of both Hermitian systems and EP-based non-Hermitian protocols. Additionally, the timescale is independent of the number of qubits, highlighting favorable scalability for multipartite entanglement generation and facilitating integration into future photonic quantum processors.", "url": "https://arxiv.org/abs/2604.16814", "type": "理论", "summary": "1. 该工作研究了由随机噪声调制耗散系数的非厄米哈密顿量所描述的两个耦合量子比特在远离例外点区域的纠缠动力学。\n2. 即使存在经典噪声，该系统仍能实现高度高效的纠缠生成，其时间尺度显著短于厄米系统及基于例外点的非厄米方案，且与量子比特数无关。\n3. 这一结果为多体纠缠生成提供了有利的可扩展性路径，并有望促进其在未来光子量子处理器中的集成应用。", "summary_source": "deepseek", "authors": [{"name": "Hamid Sakhouf"}, {"name": "Peng Xue"}], "featured_authors": [{"name": "Hamid Sakhouf"}, {"name": "Peng Xue"}], "author_count": 2}, {"id": "2604.16869", "category": "quant-ph", "title": "Nonnormality and Dissipation in Markovian Quantum Dynamics: Implications for Quantum Simulation", "abstract": "Understanding the structure and stability of open quantum dynamics is increasingly important for both fundamental studies of nonequilibrium quantum systems and the development of quantum simulation algorithms. In this work, we introduce a structural framework for Markovian open quantum systems that characterizes Lindbladian generators in terms of two scalar quantities: the dissipative strength and the nonnormality. We show that normal generators admit an exact decoupling between dissipative and norm-preserving dynamics, leading to purely exponential behavior governed by the dissipative scale. In contrast, nonnormality is an intrinsically dissipative feature: it vanishes in the absence of dissipation but is not implied by it. Moreover, it is structurally constrained by the interplay between the Hermitian and anti-Hermitian components of the generator. For generic Markovian open quantum systems, we identify parametric regimes controlled by a dimensionless ratio between nonnormality and dissipative strength, governing the onset of transient amplification. These structural features have direct implications for quantum simulation. While Hamiltonian and normal dissipative dynamics exhibit stable evolution with standard scaling behavior, nonnormal generators can induce transient growth that amplifies numerical errors and increases simulation cost. Our results provide a unified generator-level perspective on irreversibility, stability, and quantum simulation of open quantum systems.", "url": "https://arxiv.org/abs/2604.16869", "type": "理论+数值", "summary": "1. 本文为马尔可夫开放量子系统引入了一个结构框架，通过耗散强度与非正规性两个标量来刻画林德布拉德生成元。\n2. 其核心在于揭示了非正规性作为一种内禀耗散特征，虽在无耗散时消失却不由耗散本身决定，并由生成元的厄米与反厄米分量间的相互制约所结构性地约束。\n3. 这为理解开放量子系统的不可逆性、稳定性及量子模拟中瞬态增长导致的误差放大与计算成本上升提供了统一的生成元层次视角。", "summary_source": "deepseek", "authors": [{"name": "Shakib Daryanoosh"}], "featured_authors": [{"name": "Shakib Daryanoosh"}], "author_count": 1}, {"id": "2604.16951", "category": "quant-ph", "title": "Anomalous nonlocality of information masked in quantum correlations", "abstract": "Although information, strictly speaking, is not a physical entity, it generally requires physical entities as its carriers, e.g., writing it down on paper, encoding it with quantum particles, or transmitting it using electro-magnetic fields. And it seems natural that these carriers cannot travel faster than light. Here we reveal that if we use quantum correlations as the carrier of information (either quantum or classical), then it can display a kind of nonlocality, which bears both similarities to and distinctions from the nonlocality of physical particles. Notably, though superluminal signaling is still not allowed so that the special relativity is not violated, it is possible to select at our will whether to decode the information at one location, or to dispatch it to another location far away (i.e., to give up the chance of decoding the information and let it be decodable in somewhere else only) without needing the assistance of classical information, so that it occurs instantaneously without being limited by the speed of light. This phenomenon differs sharply from the nonlocality of physical particles that we once knew, where whether a particle can be detected in one location or another is governed by quantum uncertainty, which cannot be chosen freely.", "url": "https://arxiv.org/abs/2604.16951", "type": "理论", "summary": "1. 该工作揭示了利用量子关联作为信息载体时，信息会呈现一种既区别于又类似于物理粒子非定域性的反常非定域特性。\n2. 其核心物理卖点在于，信息接收者可在无需经典信息辅助的情况下，瞬时自由选择在本地解码信息或将其调度至远方解码，且不违反超光速通信禁令。\n3. 这一发现为理解与刻画量子信息载体本身的性质提供了新维度，并对构建基于关联的量子信息理论模型提出了新的约束与启示。", "summary_source": "deepseek", "authors": [{"name": "Guang Ping He"}], "featured_authors": [{"name": "Guang Ping He"}], "author_count": 1}, {"id": "2604.16961", "category": "quant-ph", "title": "Fundamental Limits of Eavesdropper Detection and Localization in Optical Fiber via Stimulated Brillouin Scattering", "abstract": "Recent work investigated the use of Stimulated Brillouin Scattering (SBS) to measure changes in fiber parameters, thereby enhancing the security of a Quantum Key Distribution(QKD) system. In this work, we cast the problem into a binary hypothesis testing scenario, with the goal of comparing the state of the art with potential future quantum technology-based detection methods. We derive an effective input-output model for the Stimulated Brillouin Scattering (SBS) interaction, and utilize it to compare three detection methods: First, the established state of the art. Second, a photon-counting based method which will likely be available in the near future. Finally, we compare to the ultimate quantum limit, which is given by the quantum error exponent of asymmetric hypothesis testing.", "url": "https://arxiv.org/abs/2604.16961", "type": "理论", "summary": "1. 该工作建立了基于受激布里渊散射的光纤窃听检测二元假设检验框架，系统比较了现有技术、近未来光子计数方案及终极量子极限的性能。\n2. 其核心在于推导了SBS相互作用的有效输入输出模型，并利用非对称假设检验的量子错误指数严格刻画了量子物理所允许的检测极限。\n3. 这为评估和开发下一代光纤量子密钥分发系统的物理层安全技术提供了明确的理论基准与设计指导。", "summary_source": "deepseek", "authors": [{"name": "Kiran Adhikari"}, {"name": "Janis Nötzel"}], "featured_authors": [{"name": "Kiran Adhikari"}, {"name": "Janis Nötzel"}], "author_count": 2}, {"id": "2604.17058", "category": "quant-ph", "title": "Causality from Projection and Hardy-Space Analyticity of Non-Markovian Memory Kernels", "abstract": "The Kramers-Kronig (KK) dispersion relations connect the real and imaginary parts of a causal response function through a Hilbert transform. While standard for linear-response theory, their validity for non-Markovian memory kernels -- the central object governing reduced dynamics in open quantum systems -- has not been rigorously established. We prove that the Nakajima-Zwanzig memory kernel belongs to the vector-valued Hardy space H+p(B) for every p>1, provided the initial system-bath state is factorized and the bath has a continuous spectral density. This membership yields rigorous KK reconstruction formulas. We establish three new results, including (i) a CP-Hardy obstruction theorem showing that upper-half-plane poles in approximate kernels imply non-physical (non-CPTP) dynamics; (ii) a passivity-analyticity theorem connecting dissipative kernels to the Herglotz-Nevanlinna class, realizing Gavassino's stability-causality chain for open quantum systems; and (iii) a moment-based Carleman criterion guaranteeing that Pade-reconstructed kernels from Memory Kernel Coupling Theory automatically satisfy KK. We validate the framework on solvable models and construct a counterexample demonstrating that correlated initial states break the Hardy property -- the quantum analogue of Gavassino's mechanism for how acausal macroscopic equations emerge from causal microscopic dynamics.", "url": "https://arxiv.org/abs/2604.17058", "type": "理论", "summary": "1. 该工作证明了在系统-浴初始态可分离且浴谱密度连续的条件下，Nakajima-Zwanzig非马尔可夫记忆核属于向量值Hardy空间H+^p(B) (p>1)，从而严格建立了其Kramers-Kronig重构公式。\n2. 研究提出了三个核心成果：CP-Hardy阻碍定理揭示了近似核上半平面极点会导致非物理动力学；被动性-解析性定理将耗散核与Herglotz-Nevanlinna类关联，实现了开放量子系统中的稳定性-因果链；基于矩的Carleman准则保证了Padé重构核自动满足KK关系。\n3. 该框架在可解模型上得到验证，并通过构建反例表明相关初始态会破坏Hardy性质，这为理解微观因果动力学如何涌现出宏观非因果方程提供了确切的量子类比。", "summary_source": "deepseek", "authors": [{"name": "Kejun Liu"}], "featured_authors": [{"name": "Kejun Liu"}], "author_count": 1}, {"id": "2604.17086", "category": "quant-ph", "title": "Time evolution of quantum gates and the necessity of complex numbers", "abstract": "As physical systems, qubits must evolve from input to output state. We describe a simple scheme in which the effect of a quantum gate is described by the action of an effective Hamiltonian acting for some characteristic time. This model shows that the action of common unary gates is to induce Bloch sphere trajectories along lines of latitude relative to an eigenvector of the gate. Such trajectories would immediately move a `rebit', initially confined to a line of latitude, off this line and acquire a complex phase. The role of the complex phase in bringing about the entanglement of two qubits is also highlighted. It is then asked whether such dynamics could be modelled using real QM. It is shown that the continuous evolution required for such dynamics can only be provided by members of the special orthogonal group of the vector space. Since the matrices representing many quantum gates of interest have determinant -1, no real special orthogonal operators can model their evolution if the dimension of the real vector space is the same as that of the complex space. Next we look at the mapping from a complex vector space of dimension $N$ to a real space of dimension $2N$ that is often used to construct `real' QM. It is shown that this is just an isomorphic mapping from the scalar representation of complex numbers to their $2\\times2$ matrix equivalents, so that the resulting matrices are actually represent complex matrices. Finally, we investigate the endomorphism of real vector spaces of dimension $N = 2^{n}$, where $n \\in \\mathbb{Z}^{+}$, suitable for the modelling of $n-1$ qubits. We confirm that the mapping from $\\mathbb{C}^{2^{n-1}} \\to \\mathbb{R}^{2^{n}}$ only maps elements of $\\mathrm{End}(\\mathbb{C}^{2^{n-1}})$ to a restricted subspace of $\\mathrm{End}(\\mathbb{R}^{2^{n}})$ that reproduces the `real' representation of complex matrices.", "url": "https://arxiv.org/abs/2604.17086", "type": "理论", "summary": "1. 该工作通过有效哈密顿量模型描述量子门的时间演化，并系统检验其实数量子力学表述的可行性。\n2. 核心发现在于，将N维复向量空间映射到2N维实空间的常见方法，仅是复数到其2×2矩阵等价的同构映射，无法规避复数本质。\n3. 这从根本上阐明了复数在量子门操作与纠缠产生中的不可还原性，为量子计算理论与实数模拟方案的局限性提供了明确界定。", "summary_source": "deepseek", "authors": [{"name": "M.P. Vaughan"}], "featured_authors": [{"name": "M.P. Vaughan"}], "author_count": 1}, {"id": "2604.17152", "category": "quant-ph", "title": "Thermodynamics of Coherence-Selective Quantum Reset Protocols", "abstract": "We develop an exact theory of coherence-selective stroboscopic resetting for quadratic open quantum systems within the single-particle density-matrix formalism. We focus on the survival of coherences and the associated thermodynamic cost at the stroboscopic fixed point. To this end, we introduce a one-parameter family of reset channels that continuously interpolates between complete coherence erasure and complete coherence preservation. This unifies the reset-map description, the repeated-interaction and evolving-correlation endpoint channels, and the thermodynamic cost of environmental reinitialization. For a single fermionic level coupled to a structured semi-infinite tight-binding bath, we derive the exact affine stroboscopic map, solve for its unique fixed point, and compute the retained coherence spectrum, the post-reset occupation, and the reset heat current. We find that retained coherence increases monotonically with the retention parameter, whereas the reset heat current is generically nonmonotonic and is maximized at an intermediate operating point. Thus the protocol that stores the most coherence is not the one that dissipates the most heat. Exact operating diagrams further show that coherence-optimal and coherence-per-cost-optimal protocols are both driven toward the coherence-preserving endpoint, while the heat-optimal protocol depends strongly on the reset interval. We also show that this coherence-cost geometry survives at nonzero chemical potential as a filling-biased deformation of the same fixed-point tradeoff, rather than as an independent particle-current optimization problem. These results establish coherence-selective resetting as a distinct control principle for structured-bath open quantum systems and provide an exactly solvable benchmark for memory engineering and thermodynamic optimization under repeated environmental reinitialization.", "url": "https://arxiv.org/abs/2604.17152", "type": "理论+数值", "summary": "1. 该工作建立了相干选择性量子重置协议的精确理论，并解析求解了单能级费米子系统耦合至结构半无限紧束缚库的模型。\n2. 其核心发现是相干保留度随参数单调增加，而重置热流具有非单调性，使得最大相干存储与最大热耗散不对应。\n3. 这为结构库开放量子系统的记忆工程与热力学优化提供了一个精确可解的基准。", "summary_source": "deepseek", "authors": [{"name": "Jishad Kumar"}, {"name": "Achilleas Lazarides"}, {"name": "Tapio Ala-Nissila"}], "featured_authors": [{"name": "Jishad Kumar"}, {"name": "Achilleas Lazarides"}, {"name": "Tapio Ala-Nissila"}], "author_count": 3}, {"id": "2604.17171", "category": "quant-ph", "title": "Entanglement and Quantum Coherence in Coupled Double Quantum Dots under Markovian and Non-Markovian Noisy Channels", "abstract": "Quantum dots are nanometer-scale semiconductor particles that exhibit size-dependent quantum mechanical properties. In this work, we investigate the dynamics of quantum correlations, quantified by the concurrence and the quantum coherence, in a bipartite system of coupled double quantum dots. The analysis is carried out within both Markovian and non-Markovian regimes, and further extended to different noisy quantum channels, including amplitude damping, phase flip, and phase damping. Our results show that environmental memory plays a crucial role in the preservation of quantum correlations, leading to oscillatory behavior and partial revivals in the non-Markovian regime, in contrast to the monotonic decay observed under Markovian dynamics. Moreover, distinct decoherence mechanisms induce qualitatively different effects: dissipative channels rapidly suppress correlations, while phase-based channels lead to either redistribution or gradual degradation. A key finding is that quantum coherence exhibits a higher robustness compared to entanglement under all considered conditions, highlighting its relevance as a reliable quantum resource in noisy environments. These results provide valuable insights into the control and protection of quantum correlations in realistic solid-state systems.", "url": "https://arxiv.org/abs/2604.17171", "type": "理论", "summary": "1. 该工作研究了耦合双量子点中量子纠缠与相干性在马尔可夫与非马尔可夫噪声信道下的动力学。\n2. 非马尔可夫环境的记忆效应导致量子关联出现振荡与部分恢复，且量子相干性比纠缠展现出更强的鲁棒性。\n3. 这为固态系统中基于相干性的量子资源保护及噪声信道下的操控策略提供了重要依据。", "summary_source": "deepseek", "authors": [{"name": "Omar Bachain"}, {"name": "Mohamed Amazioug"}, {"name": "Nawal K. Almaymoni"}, {"name": "Rachid Ahl Laamara"}, {"name": "Naif S. Alharthi"}, {"name": "Abdel-Haleem Abdel-Aty"}], "featured_authors": [{"name": "Omar Bachain"}, {"name": "Mohamed Amazioug"}, {"name": "Nawal K. Almaymoni"}, {"name": "Rachid Ahl Laamara"}, {"name": "Naif S. Alharthi"}, {"name": "Abdel-Haleem Abdel-Aty"}], "author_count": 6}, {"id": "2604.17185", "category": "quant-ph", "title": "Map-Dependent Quantum Characteristic Functions and CP-Divisibility in Non-Markovian Quantum Dynamics", "abstract": "We introduce map-dependent quantum characteristic functions constructed from the normalized Choi operator of quantum dynamical maps. We prove a Bochner--Choi positivity theorem establishing that the positive-type condition of the associated Gram matrix is equivalent to complete positivity of the underlying quantum channel. Applying the construction to intermediate dynamical maps, we obtain a characterization of CP-divisibility in terms of positivity of two-time characteristic functions. Numerical examples for amplitude damping and pure dephasing models demonstrate that negativity of the Gram matrix coincides with the breakdown of CP-divisibility and the emergence of information backflow. The proposed framework provides a new bridge between characteristic-function methods in quantum statistics and structural properties of quantum dynamical maps.", "url": "https://arxiv.org/abs/2604.17185", "type": "理论+数值", "summary": "1. 该工作构建了基于归一化Choi算子的映射依赖量子特征函数，并将其应用于中间动力学映射，从而刻画了非马尔可夫量子动力学中的CP可分性。\n2. 通过证明Bochner-Choi正性定理，建立了关联Gram矩阵的正定型条件与量子通道完全正性之间的等价关系，并以振幅阻尼和纯退相模型证实Gram矩阵负性对应CP可分性破坏及信息回流。\n3. 此框架为量子统计学中的特征函数方法与量子动力学映射的结构特性研究建立了新的理论桥梁，有望推广至更复杂的非马尔可夫过程分析。", "summary_source": "deepseek", "authors": [{"name": "Koichi Nakagawa"}], "featured_authors": [{"name": "Koichi Nakagawa"}], "author_count": 1}, {"id": "2604.17202", "category": "quant-ph", "title": "Double Descent in Quantum Kernel Ridge Regression", "abstract": "Various classical machine learning models, including linear regression, kernel methods, and deep neural networks, exhibit double descent, in which the test risk peaks near the interpolation threshold and then decreases in the overparameterized regime. However, this phenomenon has received less attention in the quantum setting. In this work, we investigate the double descent phenomenon in quantum kernel ridge regression (QKRR). By applying deterministic equivalents from random matrix theory (RMT), we derive an asymptotic expression for the test risk of QKRR in the high-dimensional limit. Our analysis rigorously characterizes the interpolation peak and reveals how explicit regularization can effectively suppress it. We corroborate our theoretical results with numerical simulations, demonstrating close agreement even for finite-size quantum systems.", "url": "https://arxiv.org/abs/2604.17202", "type": "理论+数值", "summary": "1. 该工作通过应用随机矩阵理论中的确定性等效技术，研究了量子核岭回归中的双下降现象。\n2. 其核心在于导出了高维极限下测试风险的渐近表达式，揭示了显式正则化能有效抑制插值峰值的机制。\n3. 这为分析量子噪声、电路深度等实际约束对量子机器学习泛化性能的影响提供了理论框架。", "summary_source": "deepseek", "authors": [{"name": "Kensuke Kamisoyama"}, {"name": "Lento Nagano"}, {"name": "Koji Terashi"}], "featured_authors": [{"name": "Kensuke Kamisoyama"}, {"name": "Lento Nagano"}, {"name": "Koji Terashi"}], "author_count": 3}, {"id": "2604.17317", "category": "quant-ph", "title": "Unified adiabatic and diabatic excited-state description via the ensemble-variational quantum eigensolver", "abstract": "Within the present noisy intermediate-scale quantum-computing era, hybrid quantum-classical-processor algorithms have emerged as promising avenues for tackling electronic-structure eigenproblems. Among them, the so-called ensemble-variational quantum eigensolver has been designed to treat ground and excited states on an equal footing and proven effective in capturing features such as conical intersections and avoided crossings between two electronic states, as we recently demonstrated for formaldimine. We also showed on that example how the underlying ensemble-variational principle was prone to provide a quasi-diabatic representation \"for free\". To date, this method has been limited to computing only two eigenstates of a Hamiltonian. The aim of the present paper is to show how and under what conditions this can be generalized to models that involve three coupled electronic states or more. Our approach relies on designing a parameterized basis transformation that can directly be implemented on a quantum computer for further post-treatment. This nontrivial step is accompanied by the development of quantum circuits specifically adapted to the several states of interest. An algebraic optimization strategy for the parameters of the basis transformation is formulated to obtain the target eigenstates as well as the optimally diabatic states under various objective flavors of the ensemble-variational principle. Our approach was tested for addressing the first three coupled electronic states of the H$_4^+$ molecular ion as a proof of principle, with three electrons in four spatial orbitals, along various geometries.", "url": "https://arxiv.org/abs/2604.17317", "type": "理论+数值", "summary": "1. 该工作将系综变分量子本征求解器扩展至处理三个或更多耦合电子态的本征问题。\n2. 其核心在于设计可直接在量子计算机上实现的参数化基变换，并配套开发了相应的量子线路。\n3. 这为在量子处理器上研究涉及多个电子态的非绝热动力学提供了可行的理论计算框架。", "summary_source": "deepseek", "authors": [{"name": "Christophe Soule"}, {"name": "Bruno Senjean"}, {"name": "Benjamin Lasorne"}], "featured_authors": [{"name": "Christophe Soule"}, {"name": "Bruno Senjean"}, {"name": "Benjamin Lasorne"}], "author_count": 3}, {"id": "2604.17369", "category": "quant-ph", "title": "Quantum channel tomography: optimal bounds and a Heisenberg-to-classical phase transition", "abstract": "How many black-box queries to a quantum channel are needed to learn its full classical description? This question lies at the heart of quantum channel tomography (also known as quantum process tomography), a fundamental task in the characterization and validation of quantum hardware. Despite extensive prior work, the optimal query complexity for quantum channel tomography is far from fully understood. In this paper, we study tomography of an unknown quantum channel with input dimension $d_1$, output dimension $d_2$, and Kraus rank at most $r$, to within error $\\varepsilon$. We identify the dilation rate $\\tau = r d_2 / d_1$ (which always satisfies $\\tau\\geq 1$ due to the trace preservation of quantum channels) as a key parameter, and establish that the optimal query complexity of channel tomography exhibits distinct scaling laws across three regimes of $\\tau$. - In the boundary regime ($\\tau = 1$): we show that the query complexity is $\\Theta(r d_1 d_2/\\varepsilon)$ for Choi trace norm error $\\varepsilon$, and is upper bounded by $O(\\min\\{r d_1^{1.5} d_2/\\varepsilon, r d_1 d_2/\\varepsilon^2\\})$ and lower bounded by $\\Omega(r d_1 d_2/\\varepsilon)$ for diamond norm error $\\varepsilon$. - In the away-from-boundary regime ($\\tau \\geq 1+\\Omega(1)$): we show that the query complexity is $\\Theta(r d_1 d_2/\\varepsilon^2)$ for both Choi trace norm and diamond norm errors $\\varepsilon$. Our results uncover a sharp Heisenberg-to-classical phase transition in the query complexity of quantum channel tomography: at $\\tau=1$, the optimal query complexity exhibits Heisenberg scaling $1/\\varepsilon$, whereas for $\\tau\\geq 1+\\Omega(1)$, it exhibits classical scaling $1/\\varepsilon^2$. In addition, we show that in the near-boundary regime ($1< \\tau < 1+o(1)$), the query complexity exhibits a mixture of Heisenberg and classical scaling behaviors.", "url": "https://arxiv.org/abs/2604.17369", "type": "理论", "summary": "1. 该论文以膨胀率τ = r d₂ / d₁为核心参数，系统研究了未知量子信道在Choi迹范数和钻石范数误差ε下的最优查询复杂度，并给出了不同τ区域的精确上下界。\n2. 其关键物理发现是揭示了查询复杂度在τ=1时呈海森堡标度(∝1/ε)，而在τ≥1+Ω(1)时呈经典标度(∝1/ε²)，展现了一个急剧的相变行为。\n3. 这为量子硬件表征中的层析策略提供了理论基础，并对近边界区域(1<τ<1+o(1))的混合标度行为及更广泛量子学习任务指明了后续研究方向。", "summary_source": "deepseek", "authors": [{"name": "Kean Chen"}, {"name": "Filippo Girardi"}, {"name": "Aadil Oufkir"}, {"name": "Nengkun Yu"}, {"name": "Zhicheng Zhang"}], "featured_authors": [{"name": "Kean Chen"}, {"name": "Filippo Girardi"}, {"name": "Aadil Oufkir"}, {"name": "Nengkun Yu"}, {"name": "Zhicheng Zhang"}], "author_count": 5}, {"id": "2604.17412", "category": "quant-ph", "title": "Theory of Quantum Imaginary-Time Mpemba Effect", "abstract": "Quantum imaginary-time evolution (QITE) is a fundamental framework for preparing ground and thermal states, yet its computational cost scales significantly with the evolution duration $\\tau$. Reducing this duration is critical for practical quantum advantage. Here, we establish a unified theoretical framework for the Mpemba effect in QITE -- a counterintuitive phenomenon where a state initially farther from the ground state relaxes to it faster than one initially closer. We derive a remarkably simple necessary and sufficient condition for the occurrence of this effect, showing it is uniquely determined by the population ratios of excited states to the ground state. For practical state preparation, we introduce a rigorous sufficient condition for the finite-time Mpemba effect, ensuring the crossing occurs before reaching a prescribed proximity threshold. Furthermore, we unveil unique dynamical features, including a multiple-crossing phenomenon in multi-level systems and simultaneous intersections for collinear initial states. Our results provide criteria for identifying favorable initial states in QITE and offer deep insights into the speed limit of quantum state preparation.", "url": "https://arxiv.org/abs/2604.17412", "type": "理论", "summary": "1. 该工作为量子虚时演化（QITE）中的姆潘巴效应建立了一个统一的理论框架，并推导了该效应发生的充要条件。\n2. 其核心物理发现是，该效应是否出现唯一地由初始态各激发态与基态的布居比决定，这一条件形式简洁而深刻。\n3. 这为在QITE中识别具有更快弛豫速度的有利初始态提供了明确判据，并深化了对量子态制备速度极限的理解。", "summary_source": "deepseek", "authors": [{"name": "Yumeng Zeng"}, {"name": "Jeongrak Son"}, {"name": "Mile Gu"}, {"name": "Xiao Yuan"}], "featured_authors": [{"name": "Yumeng Zeng"}, {"name": "Jeongrak Son"}, {"name": "Mile Gu"}, {"name": "Xiao Yuan"}], "author_count": 4}, {"id": "2604.17537", "category": "quant-ph", "title": "Surpassing thermal-state limit in thermometry via non-completely positive quantum encoding", "abstract": "Conventional quantum thermometry assumes completely positive (CP) encoding maps, where the probe is initially uncorrelated with the environment. We consider realistic scenarios with initial probe-environment correlations leading to physically realizable non-completely positive (NCP) encoding, and show how such encodings can significantly impact temperature estimation of the environment. We first consider pure entangled probe-environment initial states (Type-I NCP encoding) and analytically show that for probes and environments of equal but arbitrary dimension, the maximum achievable precision matches the thermal-state bound, as in the CP case. However, upon relaxing the constraint of pure probe-environment states and considering general correlated initial states (Type-II NCP encoding), we demonstrate that the estimation precision can surpass the thermal-state limit. This establishes a clear advantage of NCP encoding in enhancing thermometric performance. We illustrate the results using qubit probes interacting with qubit environments via XY interactions.", "url": "https://arxiv.org/abs/2604.17537", "type": "理论", "summary": "1. 本工作研究了初始探针-环境关联导致的非完全正编码对量子测温精度的影响。\n2. 关键发现是，虽然纯纠缠初态下的I型NCP编码无法突破热态极限，但放宽初态纯度约束的II型NCP编码可使测温精度超越该极限。\n3. 这为利用初始关联超越标准量子计量学界限开辟了途径，并对量子热力学与信息论的交叉研究具有启示意义。", "summary_source": "deepseek", "authors": [{"name": "Anindita Sarkar"}, {"name": "Paranjoy Chaki"}, {"name": "Debarupa Saha"}, {"name": "Ujjwal Sen"}], "featured_authors": [{"name": "Anindita Sarkar"}, {"name": "Paranjoy Chaki"}, {"name": "Debarupa Saha"}, {"name": "Ujjwal Sen"}], "author_count": 4}, {"id": "2604.17630", "category": "quant-ph", "title": "Randomized Subsystem Descent for Fermion-to-Qubit Mapping", "abstract": "We propose a versatile and efficient algorithmic framework for optimizing fermion-to-qubit mappings by generalizing the idea of randomized block coordinate descent. Our greedy approach, termed Randomized Subsystem Descent, iteratively samples a tractable subsystem from the full Hamiltonian, performs optimization within the subsystem under a given metric, and then reintegrates the updated subsystem into the global operator. Restricting the optimization to a subsystem at each iteration ensures computational efficiency, bypassing the dimensional bottlenecks that usually hinder global search heuristics. We benchmark our algorithm on one- and two-dimensional lattice hopping models, the Hubbard model with up to $16 \\times 16$ sites, alongside a collection of molecular electronic-structure Hamiltonians with up to 54 modes and more than 180,000 Pauli strings. Across all benchmarks, our method consistently provides appreciable reduction in (weighted) Pauli weight, suggesting that Randomized Subsystem Descent is a practical and scalable framework for lowering the resource overhead of finding hardware-efficient Hamiltonian encodings.", "url": "https://arxiv.org/abs/2604.17630", "type": "理论+数值", "summary": "1. 该工作提出了一种称为随机子系统下降的贪心算法框架，用于高效优化费米子到量子比特的映射问题。\n2. 其技术优势在于通过迭代采样子系统并执行局部优化，避免了全局搜索中的维度瓶颈，从而确保了计算效率与可扩展性。\n3. 在一维、二维晶格模型、Hubbard模型及分子哈密顿量上的基准测试均显示（加权）泡利权重显著降低，这为降低量子模拟资源开销提供了实用且可扩展的路径。", "summary_source": "deepseek", "authors": [{"name": "Gengzhi Yang"}, {"name": "Di Wu"}, {"name": "Haizhao Yang"}, {"name": "Xiaodi Wu"}, {"name": "Ji Liu"}], "featured_authors": [{"name": "Gengzhi Yang"}, {"name": "Di Wu"}, {"name": "Haizhao Yang"}, {"name": "Xiaodi Wu"}, {"name": "Ji Liu"}], "author_count": 5}, {"id": "2604.17719", "category": "quant-ph", "title": "Repeated weak measurements: watching quantum correlations evolve", "abstract": "Experimental access to many-body quantum systems is often limited by measurement backaction, and key dynamical properties are typically obtained by perturbing a system and measuring its response. Here we replace this active paradigm with a minimally invasive protocol based on a pair of weak quantum measurements that leverages measurement backaction as a strength. By correlating time-separated measurements with the first detecting fluctuations -- of any sort -- and the second tracking their time evolution, our method directly measures dynamical correlation functions without external perturbation. We demonstrate this technique in an atomic Bose-Einstein condensate using phase-contrast imaging to obtain the two-time density-density correlation function known as the Van Hove function and, through its Fourier transform, the dynamical structure factor. Due to the role of spatial correlations in scattering, these quantities underpin neutron and X-ray scattering and atomic Bragg spectroscopy. This approach is broadly applicable, providing access to correlation functions between any pair of observables amenable to weak measurement, thereby going beyond the capabilities of conventional strong measurements. We further isolate the role of quantum backaction through Aharonov's post-selection-based quantum weak values.", "url": "https://arxiv.org/abs/2604.17719", "type": "实验", "summary": "1. 该工作提出了一种基于成对弱量子测量的最小侵入式协议，直接测量动态关联函数，并在原子玻色-爱因斯坦凝聚体中通过相位对比成像实验获得了Van Hove函数和动态结构因子。\n2. 其技术核心在于将测量反作用转化为优势，通过关联时间分离的弱测量来获取两时间密度-密度关联函数，无需外部扰动即可揭示量子关联演化。\n3. 该方法广泛适用于任何可弱测量的可观测量对，超越了传统强测量的局限，为散射光谱学提供了新途径，并通过阿哈罗诺夫量子弱值进一步阐明了量子反作用机制。", "summary_source": "deepseek", "authors": [{"name": "Emine Altuntas"}, {"name": "Ian B. Spielman"}], "featured_authors": [{"name": "Emine Altuntas"}, {"name": "Ian B. Spielman"}], "author_count": 2}, {"id": "2604.17767", "category": "quant-ph", "title": "Measurement-defined control of single-particle interference", "abstract": "Interference is conventionally attributed to path-accumulated phase differences, with measurement treated as a passive readout. Here we demonstrate that single-particle interference is governed by the relative phase between the prepared quantum state and the detector-defined measurement basis -- a joint quantity that is operationally inaccessible in any conventional interferometer. Using coherently seeded entangled nonlinear biphoton sources, we show that independently scanning the pump phase difference, the seed phase difference, or the signal interferometric phase each produces identical sinusoidal fringes ($V\\approx0.99$) -- a three-scan equivalence impossible in any two-mode interferometer. The fringe visibility is continuously controlled through the idler-state overlap, directly encoding quantum distinguishability without idler detection. The same measurement-defined interference law persists from the single-photon to the high-flux regime. The bright-dark collective-state structure demonstrated here unifies coherent population trapping and electromagnetically induced transparency in atomic $\\Lambda$-systems, discrete photonic interference, and single-slit diffraction within a common framework differing only in dark-subspace dimensionality, establishing measurement-defined photonic modes as a fundamental resource for quantum photonics.", "url": "https://arxiv.org/abs/2604.17767", "type": "实验", "summary": "1. 本研究通过相干播种纠缠非线性双光子源实验，建立了由测量定义的单粒子干涉控制框架。\n2. 其核心在于证明了泵浦相位、种子相位与信号干涉相位的独立扫描均产生完全相同的干涉条纹，实现了传统双模干涉仪无法实现的三扫描等价性。\n3. 这一原理将原子Λ系统中的相干囚禁、电磁诱导透明及离散光子干涉等现象统一于仅暗态子空间维度不同的共同框架，为量子光子学奠定了新的基础。", "summary_source": "deepseek", "authors": [{"name": "Tai Hyun Yoon"}], "featured_authors": [{"name": "Tai Hyun Yoon"}], "author_count": 1}, {"id": "2604.17867", "category": "quant-ph", "title": "Tight Trade-off Between Internal, Assisted, and External Entanglement", "abstract": "We derive a tight and saturable monogamy relation for three-qubit pure states that bounds the sum of concurrence and concurrence of assistance by the entanglement with an external qubit. The bound decreases strictly with increasing external entanglement, establishing a precise trade-off between internal and environment-induced entanglement. Equivalent formulations in terms of negativity and its convex-roof extensions follow. Our result provides a unified and quantitative constraint on entanglement distribution in open multipartite quantum systems.", "url": "https://arxiv.org/abs/2604.17867", "type": "理论", "summary": "1. 该工作推导了纯态三量子比特系统中内禀纠缠、辅助纠缠与外部纠缠之间紧致且可达到的单配关系。\n2. 其核心在于建立了内禀与辅助纠缠之和受外部纠缠严格压制的定量界限，并给出了基于负性及其凸包扩展的等价表述。\n3. 这为开放多体量子系统中纠缠资源的分配提供了统一的定量约束框架。", "summary_source": "deepseek", "authors": [{"name": "Limin Gao"}, {"name": "Chenxiao Wang"}], "featured_authors": [{"name": "Limin Gao"}, {"name": "Chenxiao Wang"}], "author_count": 2}, {"id": "2604.17900", "category": "quant-ph", "title": "Bound entanglement detection in $4 \\otimes 4$ systems via generalized Choi maps", "abstract": "We construct a family of positive but not completely positive linear maps acting on four dimensional space. We employ these maps to detect bound entanglement in high dimensional quantum systems.", "url": "https://arxiv.org/abs/2604.17900", "type": "理论", "summary": "1. 该工作构建了四维空间上的正但非完全正线性映射家族，并用于检测高维量子系统中的束缚纠缠。\n2. 其技术卖点在于通过广义Choi映射有效识别了4⊗4系统中的束缚纠缠态。\n3. 这为高维量子纠缠的检测和分类提供了新的理论工具与实验方向。", "summary_source": "deepseek", "authors": [{"name": "Mazhar Ali"}], "featured_authors": [{"name": "Mazhar Ali"}], "author_count": 1}, {"id": "2604.17925", "category": "quant-ph", "title": "State-Averaged Quantum Algorithms for Multiconfigurational Surface Chemistry: A Benchmark on Rh@TiO2(110)", "abstract": "Accurate modeling of surface catalytic processes often requires methods capable of describing strong correlation, charge transfer, and multiple closely lying electronic states. While density functional theory remains widely used, its limitations for localized electronic states motivate the use of wavefunction-based approaches and, more recently, quantum computing algorithms. However, the performance of quantum ansätze in chemically motivated, multistate settings remains largely unexplored. Here, we benchmark state-averaged factorized unitary coupled cluster with singles and doubles (SA-fUCCSD) and the adaptive, problem-tailored ansatz (SA-ADAPT) using an embedded cluster model of NO adsorption on Rh-doped TiO2(110). The system exhibits pronounced multiconfigurational character and multiple state crossings, providing a stringent test. State-averaged CASSCF serves as a reference, and the quantum ansätze are evaluated as solvers for the corresponding CASCI problem within a fixed orbital basis. We find that SA-fUCCSD improves with increasing circuit depth but requires many parameters and shows sensitivity to initialization. In contrast, SA-ADAPT achieves near-CASSCF accuracy with significantly fewer operators. A modified operator selection scheme, incorporating multiple operators per iteration, substantially accelerates convergence. Our results demonstrate the efficiency of adaptive ansätze for multistate problems and establish a controlled benchmark for quantum algorithms in chemically motivated systems beyond minimal models.", "url": "https://arxiv.org/abs/2604.17925", "type": "理论+数值", "summary": "1. 该工作以Rh掺杂TiO2(110)表面吸附NO的嵌入簇模型为基准体系，评估了状态平均的因子化幺正耦合簇(SA-fUCCSD)和自适应拟设(SA-ADAPT)两种量子算法。\n2. 核心发现是SA-ADAPT算法通过每轮迭代纳入多个算符的改进方案，能以显著更少的算符达到接近CASSCF的精度，在收敛效率上优于对初值敏感且参数繁多的SA-fUCCSD。\n3. 这一结果为多态、强关联的表面化学体系建立了超越最小模型的受控基准，为量子算法应用于更复杂的实际化学问题提供了明确的技术路径和评估标准。", "summary_source": "deepseek", "authors": [{"name": "Ernst Dennis Lægteskov Binau Larsson"}, {"name": "Erik Kjellgren"}, {"name": "Peter Reinholdt"}, {"name": "Jacob Kongsted"}], "featured_authors": [{"name": "Ernst Dennis Lægteskov Binau Larsson"}, {"name": "Erik Kjellgren"}, {"name": "Peter Reinholdt"}, {"name": "Jacob Kongsted"}], "author_count": 4}, {"id": "2604.18036", "category": "quant-ph", "title": "Decoherence in Waveguide Quantum Electrodynamics using Matrix Product States", "abstract": "We present a matrix product state (MPS) method for including decoherence processes in calculations involving waveguide quantum electrodynamics (waveguide QED) using density matrices. The approach is based on collision quantum optics, where the many-body state of the waveguide is represented as discrete time bins, which are efficiently represented using an MPS chain. Our method is a generalization of previous MPS methods, and we demonstrate how one can efficiently expand to density matrices, allowing for the inclusion of various loss processes in the form of Lindblad terms in the Liouvillian superoperator responsible for the relevant dissipation dynamics. As an application of the theory, we study various waveguide QED systems and the influence of emitter pure dephasing (which is one of the most important processes in real systems) on the light-matter interactions, including a two-level system (TLS) in a semi-infinite waveguide with time-delayed feedback, two spatially separated TLSs with finite delays, and finally the scattering of few-photon Fock pulses on a TLS. In addition to emitter pure dephasing, we also show how to include off-chip radiative decay, and show how it differs qualitatively from pure dephasing.", "url": "https://arxiv.org/abs/2604.18036", "type": "理论+数值", "summary": "1. 该工作开发了一种基于矩阵乘积态和密度矩阵的数值方法，用于在波导量子电动力学中纳入退相干过程，推广了先前的矩阵乘积态技术。\n2. 其核心创新在于采用碰撞量子光学框架，将波导多体态离散为时间仓并用矩阵乘积态链高效表示，从而能处理林德布拉德超算符描述的纯退相和辐射衰变等耗散动力学。\n3. 通过应用于半无限波导延迟反馈、空间分离二能级系统及少光子福克脉冲散射等案例，该方法为理解真实系统中不同退相干机制的定性差异及复杂量子光学现象提供了新途径。", "summary_source": "deepseek", "authors": [{"name": "Matias Bundgaard-Nielsen"}, {"name": "Matthew Kozma"}, {"name": "Sofia Arranz Regidor"}, {"name": "Stephen Hughes"}], "featured_authors": [{"name": "Matias Bundgaard-Nielsen"}, {"name": "Matthew Kozma"}, {"name": "Sofia Arranz Regidor"}, {"name": "Stephen Hughes"}], "author_count": 4}, {"id": "2604.18081", "category": "quant-ph", "title": "Shannon and Rényi entropies of molecular densities: insights into extensivity and the incomplete description of electron correlation", "abstract": "In this work, we investigate the reliability of information-theoretic measures based on the electron-density and shape-function, specifically Shannon and Rényi entropies, as descriptors of electronic correlation. By establishing a rigorous decomposition of these entropic measures into additive and nonadditive contributions, supported on a Mulliken-like atomic partition of molecules, we systematically analyze the asymptotic behavior of the entropies at the infinite-internuclear-distance limit to assess the problem of static correlation and extensivity. Our algebraic and numerical analysis reveals several flaws in the use of these density-based descriptors. We demonstrate that for minimal-basis and different theoretical levels, the Shannon and Rényi entropies fail to encode the amount of static correlation conveyed by the underlying wavefunction. Conversely, shape-function Shannon entropies and Rényi entropies (for $\\alpha \\neq 1$) violate extensivity. In larger basis sets, uncorrelated Hartree-Fock densities consistently overestimate entropy compared to sufficiently correlated (e.g., full-valence-CAS) densities. Moreover, the entropies for insufficiently correlated methods violate extensivity. These findings indicate that electron-density-based measures are insufficient for capturing static correlation, suggesting that robust entropic descriptors should be constructed from higher-dimensional Hilbert-space objects.", "url": "https://arxiv.org/abs/2604.18081", "type": "数值", "summary": "1. 该工作基于穆利肯式原子划分对电子密度与形状函数的香农熵与雷尼熵进行加性与非加性分解，并通过无限核间距极限的渐近行为系统评估其描述电子关联的可靠性。\n2. 其卖点在于揭示了这些熵在最小基组及不同理论层次下无法编码波函数传递的静态关联，而形状函数香农熵及α≠1的雷尼熵违反广延性，且在较大基组中未关联哈特里-福克密度高估熵值。\n3. 这些发现表明电子密度基熵度量不足以捕捉静态关联，为从高维希尔伯特空间对象构建更稳健的关联描述符提供了明确理论启示。", "summary_source": "deepseek", "authors": [{"name": "Diogo J. L. Rodrigues"}, {"name": "Evelio Francisco"}, {"name": "Ángel Martín Pendás"}], "featured_authors": [{"name": "Diogo J. L. Rodrigues"}, {"name": "Evelio Francisco"}, {"name": "Ángel Martín Pendás"}], "author_count": 3}, {"id": "2604.18276", "category": "quant-ph", "title": "Block-encodings as programming abstractions: The Eclipse Qrisp BlockEncoding Interface", "abstract": "Block-encoding is a foundational technique in modern quantum algorithms, enabling the implementation of non-unitary operations by embedding them into larger unitary matrices. While theoretically powerful and essential for advanced protocols like Quantum Singular Value Transformation (QSVT) and Quantum Signal Processing (QSP), the generation of compilable implementations of block-encodings poses a formidable challenge. This work presents the BlockEncoding interface within the Eclipse Qrisp framework, establishing block-encodings as a high-level programming abstraction accessible to a broad scientific audience. Serving as both a technical framework introduction and a hands-on tutorial, this paper explicitly details key underlying concepts abstracted away by the interface, such as block-encoding construction and qubitization, and their practical integration into methods like the Childs-Kothari-Somma (CKS) algorithm. We outline the interface's software architecture, encompassing constructors, core utilities, arithmetic composition, and algorithmic applications such as matrix inversion, polynomial filtering, and Hamiltonian simulation. Through code examples, we demonstrate how this interface simplifies both the practical realization of advanced quantum algorithms and their associated resource estimation.", "url": "https://arxiv.org/abs/2604.18276", "type": "理论+数值", "summary": "1. 本研究在Eclipse Qrisp框架中引入了BlockEncoding接口，将块编码确立为一种面向广泛科学用户的高级量子编程抽象。\n2. 其核心在于通过封装块编码构造、量子比特化等底层概念，并集成CKS等算法，实现了对QSVT等高级协议中非酉操作的可编译化实践与资源估算简化。\n3. 这为量子算法开发提供了标准化、可组合的软件模块，有望降低哈密顿模拟、矩阵求逆等复杂量子例程的实际实现门槛。", "summary_source": "deepseek", "authors": [{"name": "Matic Petrič"}, {"name": "René Zander"}], "featured_authors": [{"name": "Matic Petrič"}, {"name": "René Zander"}], "author_count": 2}, {"id": "2604.18456", "category": "quant-ph", "title": "Disorder-induced non-Gaussian states in large ensembles of cavity-coupled molecules", "abstract": "We analyze vibrational dynamics in a toy model for polaritonic chemistry under collective electronic strong coupling. In a Holstein-Tavis-Cummings model, incoherently excited by a photon, we show that disorder leads to non-Gaussian states of vibrational modes on short time scales at the single-molecule level. Using exact matrix product state simulations, we demonstrate that this effect can remain robust for larger molecule numbers, implying that nuclear wave packets cannot be effectively described by thermal states. Furthermore, we compare simulations of the exact quantum dynamics with semiclassical approximations. We find that the Ehrenfest approximation can only well reproduce ensemble-averaged observables for very large system sizes. Also simulations in the truncated Wigner approximation fail to capture the non-Gaussian effects. Our work highlights the importance of disorder and genuine quantum effects in cavity-modified nuclear dynamics in polaritonic chemistry.", "url": "https://arxiv.org/abs/2604.18456", "type": "理论+数值", "summary": "1. 该工作通过精确矩阵乘积态模拟，分析了集体电子强耦合下极化子化学玩具模型中的振动动力学。\n2. 研究发现无序会导致单分子尺度上振动模式出现非高斯态，且该效应在大分子数体系中依然稳健，而Ehrenfest和截断Wigner近似均无法捕捉此非高斯特性。\n3. 这强调了无序和真实量子效应在腔修饰核动力学中的关键作用，为超越半经典近似研究极化子化学提供了明确方向。", "summary_source": "deepseek", "authors": [{"name": "R. Schwengelbeck"}, {"name": "M. Pandini"}, {"name": "R. Daraban"}, {"name": "J. Schachenmayer"}], "featured_authors": [{"name": "R. Schwengelbeck"}, {"name": "M. Pandini"}, {"name": "R. Daraban"}, {"name": "J. Schachenmayer"}], "author_count": 4}, {"id": "2604.18495", "category": "quant-ph", "title": "Scaling of Quantum Resources for Simulating a Long-Range System", "abstract": "We simulate a long-range extended Ising model in one dimension using a hybrid quantum algorithm, namely Variational Quantum Eigensolver (VQE). In this quantum simulation, we investigate how quantum resources scale with system size and interaction strength. Three structure-aware ansatze incorporating nearest-neighbor (NN), next-nearest-neighbor (NNN), and next-next-nearest-neighbor (NNNN) entangling blocks are constructed by mimicking the string operators in the Hamiltonian. We show that energy fidelity alone is not a good indicator for finding the ground state of our model. To overcome this problem, we introduce an additional criterion based on pairwise logarithmic negativity as a more reliable way to find the actual ground state by the VQE. We find that the interaction range parameter alpha primarily governs the minimum number of ansatz layers required, rather than proximity to the quantum critical point. In particular, we show that in the non-local regime (alpha <= 1), the NNN and NNNN ansatze reduce the layer scaling rate by factors of 2.5x and 3.8x relative to NN in all phases, including the critical point. The total number of two-qubit gates required for reliable simulation grows quadratically with system size for all three ansatze. This is consistent with the theoretical prediction, as the number of non-local terms in the Hamiltonian also grows quadratically with the system size. In the local regime, however, the number of required two-qubit gates grows linearly with system size. In contrast, in the quasi-local regime, the required number of two-qubit gates for the quantum simulation is more subtle and depends on the phase of the Hamiltonian.", "url": "https://arxiv.org/abs/2604.18495", "type": "理论+数值", "summary": "1. 该工作利用变分量子本征求解器模拟一维长程扩展伊辛模型，研究了量子资源随系统尺寸和相互作用强度的标度行为。\n2. 通过引入基于两体对数负性的新判据，研究揭示了在非局域区（α ≤ 1）下，采用次近邻及次次近邻纠缠块构建的拟设，能显著降低所需电路层数的标度率。\n3. 此发现阐明了相互作用范围参数α主导量子电路资源标度的物理机制，为其他长程相互作用量子系统的模拟提供了明确的资源估计方法和算法优化思路。", "summary_source": "deepseek", "authors": [{"name": "Tanya Keshari"}, {"name": "Debasis Sadhukhan"}], "featured_authors": [{"name": "Tanya Keshari"}, {"name": "Debasis Sadhukhan"}], "author_count": 2}, {"id": "2604.18506", "category": "quant-ph", "title": "Physics-Informed Neural Networks for Maximizing Quantum Fisher Information in Time-Dependent Many-Body Systems", "abstract": "Quantum Fisher Information (QFI) sets the ultimate precision limit for parameter estimation and is therefore a central quantity in quantum metrology. In time-dependent many-body systems, however, maximizing QFI is a highly non-trivial task due to the combined effects of non-commutativity, control complexity, and the exponential growth of the Hilbert space. In this work, we present a physics-informed neural network (PINN) framework to address this problem through the learning of counter-diabatic quantum dynamics. Our approach combines a variational PINN formulation with a Magnus-expansion treatment of time-ordered evolution, enabling the adiabatic gauge potential and the scheduling function to be inferred directly from the underlying physics while enforcing the Euler-Lagrange structure of the protocol. The method is applied to several families of driven spin Hamiltonians, including nearest-neighbor, dipolar, and trapped-ion-inspired interactions, for systems of up to six qubits. The numerical results show that the proposed framework systematically improves over reference solutions based only on the Euler-Lagrange condition, yielding high normalized QFI together with favorable fidelity and extremal-balance metrics while preserving small phsical residuals. The analysis further shows that learning the scheduling function provides a clear performance advantage in most cases, and reveals non-trivial finite-size effects, with $q=3$ emerging as a particularly challenging regime. Although scalability remains limited by the exponential growth of the operator space and by automatic-differentiation costs, the results demonstrate that PINNs constitute a viable and physically grounded route for learning metrologically optimal control strategies in interacting quantum systems.", "url": "https://arxiv.org/abs/2604.18506", "type": "理论+数值", "summary": "1. 该工作提出了一个基于物理信息神经网络（PINN）的框架，通过反绝热驱动在相互作用量子系统中寻找最优计量方案。\n2. 其核心是将变分PINN与Magnus展开相结合，直接推断绝热规范势与调度函数，同时强制协议满足欧拉-拉格朗日结构。\n3. 尽管可扩展性受算子空间指数增长与自动微分成本限制，该方法为学习相互作用量子系统中的计量最优控制策略提供了物理基础扎实的可行路径。", "summary_source": "deepseek", "authors": [{"name": "Antonio Ferrer-Sánchez"}, {"name": "Yolanda Vives-Gilabert"}, {"name": "Yue Ban"}, {"name": "Xi Chen"}, {"name": "José D. Martín-Guerrero"}], "featured_authors": [{"name": "Antonio Ferrer-Sánchez"}, {"name": "Yolanda Vives-Gilabert"}, {"name": "Yue Ban"}, {"name": "Xi Chen"}, {"name": "José D. Martín-Guerrero"}], "author_count": 5}, {"id": "2604.18533", "category": "quant-ph", "title": "Hamiltonian dynamics from pure dissipation", "abstract": "The fundamental difference between closed and open quantum dynamics lies in their environmental interaction: closed systems are perfectly isolated and evolve reversibly under unitary Hamiltonian dynamics, whereas open systems continuously couple to an external bath, resulting in irreversible dissipation and information loss. In this work, we show internal Hamiltonian dynamics can be \"faked`` via external pure dissipation, i.e., Lindbladians without a coherent Hamiltonian part. More concretely, we show that, in a GKSL representation with zero explicit Hamiltonian term but nontraceless jump operators, bounded-norm dissipative generators can approximate Hamiltonian dynamics within $\\epsilon$ error in diamond norm using $\\mathcal{O}(t^2/\\epsilon)$ evolution time. We further prove that for time-independent dynamics this $\\mathcal{O}(t^2/\\epsilon)$ scaling is in the worst case, necessary and optimal from a geometric perspective, which captures the fundamental decoherence cost for catching up with the speed of Hamiltonian dynamics. Our construction leads to various implications, including the BQP-completeness of purely dissipative dynamics even before reaching approximate equilibrium, a Zeno-adjacent state-independent freezing effect, the no super-quadratic fast-forwarding theorem of a class of purely dissipative dynamics, and reducing Lindbladian simulation cost via gauge changing.", "url": "https://arxiv.org/abs/2604.18533", "type": "理论+数值", "summary": "1. 该工作证明无显式哈密顿项的纯耗散林德布拉德动力学可在金刚石范数意义下以$\\mathcal{O}(t^2/\\epsilon)$的演化时间精度模拟哈密顿动力学。\n2. 核心在于利用非迹零跳跃算符的GKSL表示，并严格证明该时间开销在几何视角下对于不含时情形是最优且必要的，揭示了追赶哈密顿速度所需的基本退相干代价。\n3. 这一构造暗示纯耗散过程在抵达近似平衡前即具BQP完全性，并为通过规范变换降低林德布拉德模拟成本提供了理论依据。", "summary_source": "deepseek", "authors": [{"name": "Zhong-Xia Shang"}, {"name": "Daniel Stilck França"}], "featured_authors": [{"name": "Zhong-Xia Shang"}, {"name": "Daniel Stilck França"}], "author_count": 2}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>${paper.summary_source === "deepseek" ? "DeepSeek three-sentence PRL summary" : (paper.summary_source === "local-fallback" ? "Local three-sentence fallback" : (paper.summary_source === "translation" ? "Chinese abstract translation" : "Chinese placeholder fallback"))}</span><a href="${safeUrl}" target="_blank" rel="noreferrer">Open arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
</body>
