  <style>
    :root {
      --bg: #f6f1e8;
      --panel: rgba(255, 252, 246, 0.92);
      --text: #2d241d;
      --muted: #6d5d50;
      --line: rgba(69, 49, 32, 0.14);
      --accent: #8f3d2e;
      --accent-2: #1d5f6b;
      --theory: #7c3a2a;
      --numeric: #255b6a;
      --both: #5d4a99;
      --experimental: #2f6b39;
      --shadow: 0 18px 40px rgba(54, 32, 16, 0.12);
      --radius: 22px;

      --title-font: "Palatino Linotype", "Noto Serif SC", Georgia, serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--ui-font);
      color: var(--text);
      background: radial-gradient(circle at top left, rgba(255,255,255,0.78), transparent 32%), radial-gradient(circle at 88% 12%, rgba(29,95,107,0.14), transparent 20%), linear-gradient(180deg, #fbf7f0 0%, var(--bg) 42%, #f2e8dc 100%);
      min-height: 100vh;
    }
    .shell { width: min(1220px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 64px; }
    .hero {
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(255,255,255,0.84), rgba(255,248,238,0.72)), linear-gradient(135deg, rgba(143,61,46,0.08), rgba(29,95,107,0.08));
      box-shadow: var(--shadow);
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.82); border: 1px solid var(--line); color: var(--muted); font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase;
    }
    h1 { margin: 18px 0 10px; font-family: var(--title-font); font-size: clamp(32px, 5vw, 54px); line-height: 1.04; letter-spacing: -0.03em; }
    .hero p { max-width: 880px; color: var(--muted); font-size: 16px; line-height: 1.7; margin: 0; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-top: 26px; }
    .stat { padding: 16px 18px; background: rgba(255,255,255,0.76); border: 1px solid var(--line); border-radius: 18px; }
    .stat .label { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
    .stat .value { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
    .controls { position: sticky; top: 12px; z-index: 3; margin-top: 22px; padding: 18px; border: 1px solid var(--line); border-radius: 24px; background: rgba(250,244,236,0.9); backdrop-filter: blur(16px); box-shadow: 0 10px 24px rgba(54,32,16,0.08); }
    .control-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 16px; }
    .field { display: flex; flex-direction: column; gap: 10px; }
    .field label { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
    .search { width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line); background: rgba(255,255,255,0.92); font: inherit; color: var(--text); }
    .chip-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .chip { border: 1px solid var(--line); background: rgba(255,255,255,0.82); color: var(--text); padding: 10px 14px; border-radius: 999px; font: inherit; cursor: pointer; }
    .chip.active { border-color: rgba(143,61,46,0.35); background: rgba(143,61,46,0.12); color: #5b2419; }
    .chip[data-type="数值"].active { border-color: rgba(37,91,106,0.35); background: rgba(37,91,106,0.12); color: #173f49; }
    .chip[data-type="理论+数值"].active { border-color: rgba(93,74,153,0.35); background: rgba(93,74,153,0.12); color: #46337d; }
    .chip[data-type="实验"].active { border-color: rgba(47,107,57,0.35); background: rgba(47,107,57,0.12); color: #214c29; }
    .meta-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 14px; color: var(--muted); font-size: 14px; }
    .paper-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 18px; margin-top: 22px; }
    .paper { display: flex; flex-direction: column; gap: 14px; padding: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 10px 24px rgba(54,32,16,0.06); }
    .paper-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

    .tag.category { background: rgba(45,36,29,0.08); color: var(--text); }
    .tag.type-theory { background: rgba(124,58,42,0.1); color: var(--theory); border-color: rgba(124,58,42,0.16); }
    .tag.type-numeric { background: rgba(37,91,106,0.1); color: var(--numeric); border-color: rgba(37,91,106,0.16); }
    .tag.type-both { background: rgba(93,74,153,0.1); color: var(--both); border-color: rgba(93,74,153,0.16); }
    .tag.type-experimental { background: rgba(47,107,57,0.1); color: var(--experimental); border-color: rgba(47,107,57,0.16); }
    .paper h2 { margin: 0; font-family: var(--title-font); font-size: 22px; line-height: 1.25; letter-spacing: -0.02em; }
    .paper h2 a { color: inherit; text-decoration: none; }
    .paper h2 a:hover { color: var(--accent); }
    .paper .id { color: var(--muted); font-size: 13px; }
    .author-block { display: grid; gap: 10px; padding: 14px 16px; border-radius: 18px; background: rgba(255,255,255,0.64); border: 1px solid var(--line); }
    .author-label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .author-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .author-item { display: grid; gap: 4px; }
    .author-item strong { font-size: 14px; }
    .author-item span { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .author-note { color: var(--muted); font-size: 12px; }
    .paper .summary { margin: 0; font-size: 15px; line-height: 1.75; white-space: pre-line; }
    details { border-top: 1px solid var(--line); padding-top: 12px; }
    details summary { cursor: pointer; color: var(--accent-2); font-weight: 700; list-style: none; }
    details summary::-webkit-details-marker { display: none; }
    details p { margin: 10px 0 0; color: var(--muted); line-height: 1.72; font-size: 14px; white-space: pre-line; }
    .paper footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 6px; color: var(--muted); font-size: 13px; }
    .paper footer a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .empty { display: none; margin-top: 24px; padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 22px; background: rgba(255,255,255,0.7); }
    @media (max-width: 980px) { .control-grid { grid-template-columns: 1fr; } .controls { position: static; } }
  </style>

  <script>
    const papers = [{"id": "2604.16433", "category": "cond-mat", "title": "Signature of Unconventional Superconductivity in the High Temperature Normal State Resistivity", "abstract": "Unconventional superconductivity remains one of the central unsolved problems in quantum materials, and revealing its connection to the normal state is widely believed to be key to uncovering the pairing mechanism. Previous efforts have largely focused on the temperature range immediately above the superconducting transition, where specific scattering channels-such as strange-metal transport-have been identified as sharing a possible microscopic origin with superconductivity. Here, using machine learning, we demonstrate a strong correlation between normal-state resistivity and superconductivity in Fe-based superconductors. Remarkably, the predictive information reside in a wide window of 150-300 K, far above $T_c$ of this family. We further show that the signatures of superconductivity are distributed across multiple scattering channels, which requires further theoretical investigation.", "url": "https://arxiv.org/abs/2604.16433", "type": "数值", "summary": "1. 本研究利用机器学习方法，揭示了铁基超导体正常态电阻率与超导特性之间的强关联性。\n2. 其关键发现在于，超导的预测信息存在于远高于该体系转变温度的150-300 K宽温区内，且特征分布于多个散射通道。\n3. 这为超越传统近邻涨落图像、从正常态多通道散射机制理解非常规超导配对起源提供了新的理论探索方向。", "summary_source": "deepseek", "authors": [{"name": "Yuchen Wu"}, {"name": "Yiwen Liu"}, {"name": "Wanyue Lin"}, {"name": "Zohar Nussinov"}, {"name": "Sheng Ran"}], "featured_authors": [{"name": "Yuchen Wu"}, {"name": "Yiwen Liu"}, {"name": "Wanyue Lin"}, {"name": "Zohar Nussinov"}, {"name": "Sheng Ran"}], "author_count": 5}, {"id": "2604.16439", "category": "cond-mat", "title": "Comment on \"Extension of the adiabatic theorem\"", "abstract": "Phys. Rev. B 113, 165102 (2026) proposed the conjecture that, for quantum quenches within the same phase, the overlap between the initial ground state and postquench eigenstates is maximal for the postquench ground state. We show that this conjecture is not valid in general. An explicit local, translationally invariant, gapped free-fermion counterexample exists even though the pre- and postquench Hamiltonians are connected by a symmetry-preserving gapped path and the thermodynamic-limit spectrum is continuous.", "url": "https://arxiv.org/abs/2604.16439", "type": "理论", "summary": "1. 该工作构造了一个局域、平移不变且能隙的自由费米子反例，以此反驳了关于量子淬火后初态与末态本征态最大交叠的猜想。\n2. 其核心在于证明了即使淬火前后哈密顿量通过对称性保持的能隙路径相连且热力学极限下谱连续，该猜想仍不普遍成立。\n3. 这明确否定了原猜想的普适性，并强调了对非平衡动力学中绝热行为成立条件需进行更精细的理论验证。", "summary_source": "deepseek", "authors": [{"name": "Jie Gu"}], "featured_authors": [{"name": "Jie Gu"}], "author_count": 1}, {"id": "2604.16460", "category": "cond-mat", "title": "Quantum Tunnelling and Room-Temperature Superconductivity of Hydride from Size Effects", "abstract": "Superconductivity of a micron-sized hydride sample measured between metal probes under extreme pressure could be considered as a macroscopic quantum tunnelling phenomenon through metal-hydride-metal. The energy barrier height of hydride is regulated by pressure. The energy barrier width between tips of the metal probes should be minimized to limit the chance of exponential decay in electron tunnelling. There is also a thickness effect since thinner hydride samples around 1 micron are favoured for achieving higher superconductive temperatures. Hence, reduction in both barrier width and sample thickness is recommended to ensure optimum quantum tunnelling for realization of the room temperature superconductivity.", "url": "https://arxiv.org/abs/2604.16460", "type": "理论", "summary": "1. 该工作研究了极端压力下氢化物样品中量子隧穿与尺寸效应对实现室温超导的影响。\n2. 其卖点在于揭示了通过最小化势垒宽度和样品厚度来优化量子隧穿以提升超导温度。\n3. 这为实现室温超导的实验设计和材料优化提供了基于尺寸调控的明确策略。", "summary_source": "deepseek", "authors": [{"name": "Xiaozhi Hu"}], "featured_authors": [{"name": "Xiaozhi Hu"}], "author_count": 1}, {"id": "2604.16473", "category": "cond-mat", "title": "Spectral origin of conformal invariance in active nematic turbulence", "abstract": "Zero-vorticity contours in the collective flows of living cells obey Schramm-Loewner evolution with diffusivity $\\kappa = 6$ and thus fall in the universality class of critical percolation. This observation is surprising because the underlying vorticity field has long-range correlations that, according to the Weinrib-Halperin criterion, should alter the universality class. Here we propose a spectral explanation for this apparent paradox in two-dimensional active nematic turbulence. The universal energy spectrum $E(q) \\sim q^{-1}$ implies sign-field correlations whose decay exponent $a = 3/2$ matches the Weinrib-Halperin marginal threshold $2/\\nu_0 = 3/2$ for two-dimensional percolation. At this marginal point the long-range correlations are irrelevant under renormalization, so the system flows to the uncorrelated percolation fixed point. Gaussian surrogate fields with the same spectrum confirm $a = 3/2$ to three significant figures, and left-passage analysis of their zero-vorticity interfaces yields $\\kappa = 5.98 \\pm 0.08$, consistent with SLE_6.", "url": "https://arxiv.org/abs/2604.16473", "type": "理论", "summary": "1. 本文针对二维活性向列湍流中零涡度轮廓遵循临界渗流普适类的现象，提出了谱解释以解决其与长程关联的悖论。\n2. 关键发现在于系统的普适能谱 $E(q) \\sim q^{-1}$ 导致符号场关联衰减指数 $a=3/2$，恰好达到二维渗流 Weinrib-Halperin 判据的边际点，使得长程关联在重整化下无关。\n3. 这为解决活性物质及其他具有长程关联系统中涌现的临界行为提供了普适的谱判据框架，并可通过高斯代理场进行定量验证。", "summary_source": "deepseek", "authors": [{"name": "Rithvik Redrouthu"}], "featured_authors": [{"name": "Rithvik Redrouthu"}], "author_count": 1}, {"id": "2604.16497", "category": "cond-mat", "title": "Concentration-dependent shear response of multi-chain amphiphilic block copolymer self-assemblies", "abstract": "Amphiphilic block copolymers self-assemble into diverse nanoscale morphologies with significant implications for drug delivery. This work presents systematic Brownian dynamics simulations of multi-chain diblock and triblock copolymers across dilute and semi-dilute unentangled regimes, hydrophobic fractions, f of 0-1, and shear rates of 0-0.1 1/ns. In the dilute regime, quiescent conditions yield spherical micelles evolving to cigar-like structures at shear rate ~0.01 1/ns and fragmenting at higher shear; varying f produces dispersed chains (f=0), cigar-like (f=0.25), short cylindrical (f=0.5), and gnarled or worm-like (f=0.75) micelles, culminating in sheet-like phase-separated structures (f=1). While, in the semi-dilute regime, shear drives collective reorganisation toward sheet-like morphologies at moderate rates before fragmentation; the f-dependent progression yields cigar-like (f=0.25), sheet-like (f=0.5), and necklace micelles (f=0.75), with larger phase-separated domains at f=1. Rheological characterisation reveals a universal architectural inversion between equilibrium and flow conditions: diblocks show higher equilibrium viscosity while triblocks maintain superior viscosity under flow via bridging networks. Aggregation number scaling exponents of alpha=0.833 in dilute, consistent with star-to-crew-cut bounds of 0.8 to 1.0, and alpha=1.07 in semi-dilute confirm the concentration-driven transition between regimes. Viscoelastic analysis establishes universal non-terminal power-law scaling across all conditions, governed by micellar relaxation dynamics independent of concentration or topology. These findings provide valuable insights into tailoring the injectability and flow behaviour of block copolymers in drug delivery formulations.", "url": "https://arxiv.org/abs/2604.16497", "type": "理论+数值", "summary": "1. 该研究通过布朗动力学模拟，系统考察了双嵌段与三嵌段共聚物在稀溶液和半稀非缠结浓度区间的多链自组装体在不同剪切速率（0–0.1 1/ns）与疏水分数（f=0–1）下的结构与流变行为。\n2. 其核心发现是揭示了一种普适的“结构反转”现象：双嵌段在平衡时具有更高粘度，而三嵌段在流动中通过桥连网络维持更优的粘度；且体系在所有条件下均服从由胶束松弛动力学主导的非终端幂律标度。\n3. 这些结果阐明了浓度与剪切驱动下的形态演变与流变标度律，为在药物递送制剂中理性设计嵌段共聚物的可注射性与流动行为提供了关键理论依据。", "summary_source": "deepseek", "authors": [{"name": "Ehsan Kamali Ahangar"}, {"name": "Dominic Robe"}, {"name": "Elnaz Hajizadeh"}], "featured_authors": [{"name": "Ehsan Kamali Ahangar"}, {"name": "Dominic Robe"}, {"name": "Elnaz Hajizadeh"}], "author_count": 3}, {"id": "2604.16525", "category": "cond-mat", "title": "Unveiling Topological Fusion in Quantum Hall Systems from Microscopic Principles", "abstract": "Establishing the fusion rules of anyonic quasiparticles in fractional quantum Hall fluids is essential for understanding their underlying topological order. Building on the conjecture that key topological properties are encoded in the \"DNA\" of candidate many-body wave functions - that is, the pattern of dominant orbital occupations restricted to a finite number of lowest Landau levels - we propose a combinatorial framework that derives these fusion rules directly from microscopic data. By extending Schrieffer's counting argument and introducing classes of topological excitations, our framework provides a unified route to the fusion rules for both Abelian and non-Abelian excitations. This approach elucidates the emergence of topological features from first principles in both fermionic and bosonic systems.", "url": "https://arxiv.org/abs/2604.16525", "type": "理论", "summary": "1. 本工作提出了一种从微观数据直接推导分数量子霍尔任意子融合规则的组合框架。\n2. 其核心是扩展Schrieffer计数论证并引入拓扑激发分类，从而统一处理阿贝尔与非阿贝尔激发的融合规则。\n3. 这从第一性原理阐明了费米和玻色系统中拓扑特征的涌现，为理解拓扑序的微观起源提供了基础。", "summary_source": "deepseek", "authors": [{"name": "Arkadiusz Bochniak"}, {"name": "Shinsei Ryu"}, {"name": "Jürgen Fuchs"}, {"name": "Gerardo Ortiz"}], "featured_authors": [{"name": "Arkadiusz Bochniak"}, {"name": "Shinsei Ryu"}, {"name": "Jürgen Fuchs"}, {"name": "Gerardo Ortiz"}], "author_count": 4}, {"id": "2604.16720", "category": "cond-mat", "title": "Quantum many-body operator cascade as a route to chaos", "abstract": "Dynamical properties of classical chaotic systems, for instance relaxation, can be understood as emerging from the time evolution of initially smooth long-wavelength densities to ever finer short-wavelength densities with fractal structure. Whether there is any analogous fractality by which one could characterize quantum many-body chaos is not known. By studying the spectral properties of the truncated operator propagator, we provide such structures. Namely, we show that the slowest-decaying operators, i.e., the leading Ruelle-Pollicott eigenvectors, have a nontrivial fractal dimension quantifying their non-locality, visible also in the divergence of their condition numbers. Furthermore, we find that unitarity imposes a constraint, i.e., an (approximate) equality, between the temporal decay rate of local correlations and this spatial operator fractal dimension. With this insight, a scenario for many-body quantum chaos becomes clear: over time, local operators evolve towards increasingly non-local ones with a quantifiable fractal structure, thereby naturally leading to effective non-unitary relaxation on the subspace of local operators - a kind of many-body Kolmogorov cascade in the space of operators. Our predictions are demonstrated in various quantum circuits: the kicked Ising model, brickwall circuits with a random 2-qubit gate, and dual-unitary circuits, where our results are exact.", "url": "https://arxiv.org/abs/2604.16720", "type": "理论", "summary": "1. 该工作通过分析截断算符传播子的谱特性，揭示了量子多体混沌中算符演化呈现分形结构的途径。\n2. 其核心在于发现最慢衰减算符具有非平凡分形维数，且幺正性约束了局域关联衰减率与算符分形维度的关系。\n3. 这为理解量子多体系统如何通过算符级联实现有效非幺正弛豫提供了新范式，可推广至各类量子电路模型。", "summary_source": "deepseek", "authors": [{"name": "Urban Duh"}, {"name": "Marko Žnidarič"}], "featured_authors": [{"name": "Urban Duh"}, {"name": "Marko Žnidarič"}], "author_count": 2}, {"id": "2604.16732", "category": "cond-mat", "title": "Dynamics of spinor Bose-Einstein condensates close to spin-spatial resonances", "abstract": "We develop a coupled-channel framework to describe the dynamics of spinor Bose-Einstein condensates (BECs), with particular emphasis on the behavior near resonances between spin dynamics and spatial excitations. Taking advantage of the disparity between the spin-dependent and spin-independent scattering lengths in typical spinor BECs, the Bogoliubov modes of the spin-independent part of the full system Hamiltonian provide an efficient set of basis functions for describing the system dynamics in a coupled-channel framework. For quadratic Zeeman shifts far from any resonance, the system can be described by a single spatial wavefunction during the spin dynamics, i.e., the so-called single-mode approximation holds. By tuning the quadratic Zeeman shift, we find resonant excitations of the Bogoliubov modes, which can be classified into two categories: those with particle-hole correlations and those without particle-hole correlations. We show that the beyond-quadratic-order terms that are neglected in standard Bogoliubov theories become increasingly important for capturing the long-time dynamics of the system near resonances. The coupled-channel framework is benchmarked against results from 1D Gross-Pitaevskii equation simulations. The framework developed in this work not only provides a numerically efficient tool for describing spinor BEC dynamics governed by different length scales, but also provides a clean physical interpretation of resonance phenomena in spinor BECs. Applications of this approach to other systems and extensions to the beyond-mean-field regime are also discussed.", "url": "https://arxiv.org/abs/2604.16732", "type": "理论+数值", "summary": "1. 本文发展了一个耦合通道理论框架，用以描述自旋玻色-爱因斯坦凝聚体在自旋动力学与空间激发共振附近的行为。\n2. 其关键是通过利用自旋相关与非相关散射长度的差异，以自旋无关部分的Bogoliubov模作为基函数，从而高效捕获共振附近由超越二次项主导的长时动力学。\n3. 该框架不仅为理解自旋BEC中的共振现象提供了清晰的物理图像，其方法也可推广至其他多尺度动力学系统并延伸至超越平均场区域。", "summary_source": "deepseek", "authors": [{"name": "W. Wills"}, {"name": "D. Blume"}, {"name": "Q. Guan"}], "featured_authors": [{"name": "W. Wills"}, {"name": "D. Blume"}, {"name": "Q. Guan"}], "author_count": 3}, {"id": "2604.16740", "category": "cond-mat", "title": "Intrinsic grain-size gradients upon grain growth near a free surface", "abstract": "Grain growth fundamentally shapes the microstructure of crystalline materials upon annealing, affecting their overall mechanical and functional properties. Recently, it has been rationalized that grain growth in polycrystals does not result solely from weighted curvature flow, but elastic effects (intrinsic stress) arised from shear coupling also need to be taken into account. We characterize and examine the effect of free surfaces on grain growth kinetics of high-purity, bulk polycrystalline nickel. By analyzing the microstructural evolution on cross sections of 1 mm thick specimens from the surface to the interior, as well as through in-plane investigations on specimens with varying thickness (1 mm, 40 $\\mu$m, and 10 $\\mu$m), an intrinsic grain-size gradient was identified, characterized by a gradual increase in grain size towards the interior. Interestingly, this grading was not restricted to the very surface but continued to depths of five to ten layers of grains, where effects from thermal grooves are considered negligible. We demonstrate that this behavior is significantly affected by elastic relaxation at the free surface, which alters the internal stress fields generated by shear-coupled grain boundary migration. These findings emphasize the relevance of free surfaces to the microstructural evolution of polycrystal.", "url": "https://arxiv.org/abs/2604.16740", "type": "理论", "summary": "1. 该工作表征了自由表面对高纯度块体多晶镍晶粒生长动力学的影响，并识别出从表面向内部逐渐增大的本征晶粒尺寸梯度。\n2. 其卖点在于揭示了自由表面弹性弛豫通过改变剪切耦合晶界迁移产生的内应力场，从而显著影响晶粒生长行为。\n3. 这强调了自由表面在多晶体微观结构演化中的关键作用，为涉及表面或界面的材料设计与性能调控提供新视角。", "summary_source": "deepseek", "authors": [{"name": "Jing Tang"}, {"name": "Runlu Yan"}, {"name": "Donglan Zhang"}, {"name": "Ronald Schnitzer"}, {"name": "Lorenz Romaner"}, {"name": "Marlene Kapp"}, {"name": "Marco Salvalaglio"}, {"name": "Oliver Renk"}], "featured_authors": [{"name": "Jing Tang"}, {"name": "Runlu Yan"}, {"name": "Donglan Zhang"}, {"name": "Marlene Kapp"}, {"name": "Marco Salvalaglio"}, {"name": "Oliver Renk"}], "author_count": 8}, {"id": "2604.16782", "category": "cond-mat", "title": "Reevaluating Quantum Geometric Criteria for Itinerant Magnetic Instabilities", "abstract": "The interplay between quantum geometry and electron correlation has emerged as a compelling paradigm in quantum many-body physics. Recent studies have highlighted the diagnostic utility of quantum geometry in identifying magnetic instabilities within itinerant electron systems. In the present work, we critically re-examine these theoretical proposals. Using the Ginzburg-Landau framework within the Hartree-Fock mean-field approximation and accounting for multiple channels of magnetic ordering, we formulate a rigorous matrix-based instability criterion in the channel representation for generic two-orbital systems. Our results demonstrate that magnetic phase transitions are intricately governed by the interplay between the bare susceptibility tensor and the spin interaction matrix. Consequently, prior assertions that instabilities can be predicted solely from the quantum geometric structure of a single-channel susceptibility are valid only under complete channel decoupling in both the interaction and susceptibility matrices. By adopting the channel representation, our formulation achieves greater physical transparency and computational tractability compared to the conventional orbital-space approach, thereby furnishing a promising alternative for advancing theoretical studies of complex multi-orbital systems.", "url": "https://arxiv.org/abs/2604.16782", "type": "理论+数值", "summary": "1. 本研究在 Hartree-Fock 平均场近似下，利用 Ginzburg-Landau 框架并考虑多个磁有序通道，针对一般双轨道巡游电子系统重新评估了量子几何准则对磁不稳定的诊断作用。\n2. 其核心在于建立了通道表示下严格的矩阵不稳定性判据，揭示磁相变由裸磁化率张量与自旋相互作用矩阵的复杂耦合所主导，而非单一的几何结构。\n3. 这表明先前关于仅从单通道磁化率的量子几何即可预测不稳定性的论断，仅在相互作用与磁化率矩阵完全通道解耦时才成立，而本文的通道表示框架为研究复杂多轨道系统提供了更清晰且易于计算的替代方案。", "summary_source": "deepseek", "authors": [{"name": "Min-Fong Yang"}], "featured_authors": [{"name": "Min-Fong Yang"}], "author_count": 1}, {"id": "2604.16938", "category": "cond-mat", "title": "On the Energy Dissipation in the Landau-Lifshitz-Gilbert Equation", "abstract": "The dynamics of magnetization near a stable equilibrium in ferromagnetic nanomagnets are examined within the Landau--Lifshitz--Gilbert (LLG) framework. For a small angle precession, the dependence of ferromagnetic resonance (FMR) frequency, the damping constant and the resulting quality factor $Q$ of the resonance on the local curvature around the free-energy minimum is systematically analyzed. Special attention is devoted to the behavior of the FMR decay time in the vicinity of bifurcation points, where the number of metastable energy minima changes and the commonly used approximation for the quality factor $Q\\simeq 1/2\\alpha$ (where $\\alpha$ denotes the Gilbert damping) fails.", "url": "https://arxiv.org/abs/2604.16938", "type": "理论", "summary": "1. 该工作基于Landau-Lifshitz-Gilbert框架，系统分析了铁磁纳米磁体在稳定平衡点附近小角度进动时，铁磁共振频率、阻尼常数及品质因子Q对自由能最小值局部曲率的依赖关系。\n2. 研究重点揭示了在分岔点（亚稳态能量极值数目发生变化）附近，共振衰减时间的特殊行为，并指出此时常用的品质因子近似公式Q≈1/(2α)不再成立。\n3. 这为精确描述纳米磁体在非平衡临界区域的能量耗散动力学提供了关键理论修正，对相关自旋电子学器件与实验的建模具有重要指导意义。", "summary_source": "deepseek", "authors": [{"name": "Kutay Kulbak"}, {"name": "Mohamed Iyad Boualem"}, {"name": "Charlie Masse"}, {"name": "Mariana Delalibera de Toledo"}, {"name": "Vasily V. Temnov"}], "featured_authors": [{"name": "Kutay Kulbak"}, {"name": "Mohamed Iyad Boualem"}, {"name": "Charlie Masse"}, {"name": "Mariana Delalibera de Toledo"}, {"name": "Vasily V. Temnov"}], "author_count": 5}, {"id": "2604.16939", "category": "cond-mat", "title": "Hierarchical spectral inhomogeneity in photoluminescence of a twisted MoSe2/WSe2 heterobilayer moiré superlattice revealed by hyperspectral mapping", "abstract": "Low-temperature photoluminescence from MoSe2/WSe2 moiré superlattice often consists of a broad interlayer emission background with dense, narrow peaks, making microscopic line-by-line assignment difficult. Here, we use hyperspectral photoluminescence mapping and peak-decomposition-free spectral analyses to determine how this spectral complexity is organized in space. A 20 x 20 map acquired with a 400 nm pitch reveals three dominant spectral families that form contiguous real-space domains. Feature-wise spatial correlation analysis and whole-spectrum similarity yield a characteristic micron-scale length of 1.27-2.05 um, all exceeding the 0.85 um optical spot size. At the same time, individual pixels retain a dense, multi-peak structure, implying an unresolved local spectral manifold below optical resolution. Correlations among centroid, dominant energy, asymmetry, width, entropy, sharp fraction, and roughness indicate that the micron-scale energy landscape and local manifold complexity can be statistically separated, while remaining correlated across the map, consistent with a hierarchical organization of the emission spectrum. These results establish hierarchical inhomogeneity as an organizing principle of MoSe2/WSe2 moiré superlattice photoluminescence.", "url": "https://arxiv.org/abs/2604.16939", "type": "理论+数值", "summary": "1. 本研究通过高空间分辨率超光谱光致发光映射与免峰分解光谱分析，揭示了扭转MoSe₂/WSe₂异质双层莫尔超晶格中光致发光光谱的空间组织方式。\n2. 发现了由三个主导光谱族构成的连续实空间微米尺度畴（特征长度1.27-2.05 μm），同时每个像素内存在光学分辨率未解析的局域光谱流形，二者通过统计相关性形成层次化非均匀性。\n3. 这确立了层次化非均匀性作为莫尔超晶格光发射谱的组织原则，为理解二维异质结构中的激子行为及设计莫尔量子材料提供了新范式。", "summary_source": "deepseek", "authors": [{"name": "Nurul Fariha Ahmad"}, {"name": "Yuto Urano"}, {"name": "Kenji Watanabe"}, {"name": "Takashi Taniguchi"}, {"name": "Daichi Kozawa"}, {"name": "Ryo Kitaura"}], "featured_authors": [{"name": "Nurul Fariha Ahmad"}, {"name": "Yuto Urano"}, {"name": "Kenji Watanabe"}, {"name": "Takashi Taniguchi"}, {"name": "Daichi Kozawa"}, {"name": "Ryo Kitaura"}], "author_count": 6}, {"id": "2604.16992", "category": "cond-mat", "title": "Solution of the Ising model with Brascamp-Kunz boundary conditions by the transfer matrix method", "abstract": "The square lattice Ising model under the Brascamp-Kunz boundary conditions is a well-known exactly solvable lattice model. The exact solution of this system has been derived within the framework of Pfaffian-type method. In this paper we provide a derivation for the solution by the Schultz-Mattis-Lieb method in the transfer matrix formalism. We set special interactions on the boundaries and take certain limit of these interactions, so that the system under the Brascamp-Kunz boundary conditions is transformed into another system under the toroidal boundary conditions. The Schultz-Mattis-Lieb method is applied to the mapping system and the partition function is exactly solved in the fermionic representation. The Fisher zeros are analytically calculated and the physical critical point is identified. We also discuss the difference between the transfer matrix approaches to the Brascamp-Kunz and to the toroidal boundary conditions. Our work introduces a member to the family of transfer-matrix-based studies for Ising model under various boundary conditions.", "url": "https://arxiv.org/abs/2604.16992", "type": "理论+数值", "summary": "1. 本文采用转移矩阵形式下的Schultz-Mattis-Lieb方法，为Brascamp-Kunz边界条件下的方形晶格Ising模型提供了新的精确解推导，替代了传统的Pfaffian型方法。\n2. 其技术核心在于通过设置特殊边界相互作用并取极限，将系统映射至环面边界条件，进而在费米子表示中解析求解配分函数、精确计算Fisher零点并确定物理临界点。\n3. 该工作扩展了Ising模型在转移矩阵框架下不同边界条件的精确解家族，并通过系统比较Brascamp-Kunz与环面边界条件的处理方法，为相关理论发展提供了明确基础。", "summary_source": "deepseek", "authors": [{"name": "De-Zhang Li"}, {"name": "Xin Wang"}], "featured_authors": [{"name": "De-Zhang Li"}, {"name": "Xin Wang"}], "author_count": 2}, {"id": "2604.16994", "category": "cond-mat", "title": "Motility and interfacial instability of confined chemically active droplets", "abstract": "Microorganisms navigating through narrow spaces encounter significant hydrodynamic challenges. To overcome these constraints and sustain efficient motion, they employ adaptive strategies, including adaptive oscillatory body deformations. While artificial microdroplets can traverse channels narrower than their diameter, studies of their locomotion have thus far been largely restricted to steady-shape regimes. In this work, we demonstrate a transition from steady shape to dynamic interfacial undulations in 5CB (4'-pentyl-4-cyanobiphenyl) droplets within aqueous trimethylammonium bromide (TTAB) solutions. We show that while droplets in dilute, additive-free solutions maintain a steady shape, the introduction of solutes or higher surfactant concentrations triggers pronounced interfacial undulations. Notably, both steady and undulating droplets exhibit a comparable velocity dependence on the confinement ratio, characterized by an initial deceleration followed by saturation, governed by the competition between hydrodynamic resistance and phoretic flow within the lubrication film. Furthermore, we find that increased surfactant concentration increases the capillary number, resulting in a thicker lubrication layer that facilitates a symmetry-breaking transition. Upon varying confinement, the droplet interface shifts from bilateral undulations to a mode localized on one side, forming a traveling-wave pattern strongly coupled to flow field fluctuations at the droplet's anterior. Linear stability analysis identifies the Yih-Marangoni instability as the underlying mechanism for these oscillations, revealing a previously unrecognized mode of adaptive locomotion in confined active matter.", "url": "https://arxiv.org/abs/2604.16994", "type": "理论", "summary": "1. 本文通过实验研究了受限化学活性液滴在表面活性剂溶液中从稳态形状到动态界面波动的转变。\n2. 研究通过线性稳定性分析，揭示了Yih-Marangoni不稳定性是驱动界面振荡并形成行波模式的关键物理机制。\n3. 这一发现为理解受限活性物质系统如何通过自发界面失稳实现自适应运动策略提供了新的视角。", "summary_source": "deepseek", "authors": [{"name": "Pawan Kumar"}, {"name": "Sobiya Ashraf"}, {"name": "Naveen Tiwari"}, {"name": "Dipin Pillai"}, {"name": "Rahul Mangal"}], "featured_authors": [{"name": "Pawan Kumar"}, {"name": "Sobiya Ashraf"}, {"name": "Naveen Tiwari"}, {"name": "Dipin Pillai"}, {"name": "Rahul Mangal"}], "author_count": 5}, {"id": "2604.17035", "category": "cond-mat", "title": "Fundamental temperature in the superstatistical description of non-equilibrium steady states", "abstract": "Among the statistical mechanical frameworks able to describe systems in non-equilibrium steady states such as collisionless plasmas, self-gravitating systems and other complex systems, superstatistics have gained recent attention. Superstatistics postulates a superposition of canonical systems with inverse temperatures $\\beta$ described by a probability distribution depending on the external conditions. Unfortunately, the uncertainty about $\\beta$ cannot be attributed to fluctuations of a phase space function, and this suggests that the distribution of $\\beta$ is purely of statistical nature and must be inferred rather than measured. This lack of direct observability of the superstatistical temperature then becomes a conceptual issue in need of resolution. In this work we address this issue, showing that a mapping exists between functions of the superstatistical temperature and functions of the recently proposed fundamental temperature, a model-dependent function of the energy, in such a way that their expectation values coincide. We illustrate the use of this mapping by computing the conditional distribution of inverse temperature given energy for the $q$-canonical ensemble, as well as the full inverse temperature distribution, without the use of Laplace inversion.", "url": "https://arxiv.org/abs/2604.17035", "type": "理论", "summary": "1. 本研究通过建立超统计温度与基本温度之间的映射关系，解决了非平衡稳态系统中超统计温度缺乏直接可观测性的概念问题。\n2. 该映射的核心在于使两者函数的期望值一致，从而无需拉普拉斯反演即可直接计算q正则系综中给定能量下的逆温度条件分布及完整分布。\n3. 这一理论进展为超统计框架提供了更坚实的物理基础，使其从纯粹的统计推断工具转变为可与具体系统能量函数相联系的可操作理论。", "summary_source": "deepseek", "authors": [{"name": "Sergio Davis"}], "featured_authors": [{"name": "Sergio Davis"}], "author_count": 1}, {"id": "2604.17181", "category": "cond-mat", "title": "Pairing Mechanism in Bilayer Nickelate La$_3$Ni$_2$O$_7$ Superconductors", "abstract": "The recent discovery of superconductivity with $T_c \\approx 80$~K in bilayer nickelate La$_3$Ni$_2$O$_7$ provides a new setting in which to test the organizing principles of unconventional high-temperature superconductivity. We show that the gene principle and the collaborative Fermi-surface rule which were previously proposed to unify unconventional high temperature superconductors, extend naturally to this bilayer, multi-orbital system. We identify that there are two antiferromagnetic exchange channels that can provide the dominant pairing force: an interlayer intra-orbital nearest-neighbour exchange $J_\\perp$ between $d_{z^2}$ orbitals mediated by the inner apical oxygen, and an intralayer inter-orbital nearest-neighbour exchange $J_{xz}$ between $d_{z^2}$ and $d_{x^2-y^2}$ orbitals mediated by the in-plane oxygen. Owing to the bilayer bonding--antibonding splitting and the $B_{1g}$ symmetry of the $d_{x^2-y^2}$ orbital, these two channels cooperate to produce a robust $s^\\pm$ superconducting state with an internal sign reversal between mirror-even and mirror-odd Fermi-surface pockets in momentum space. Both pairing channels maximize the superconducting gap on the $\\beta$ pocket with a form factor $(cosk_x-cosk_y)^2$ in momentum space. The result places La$_3$Ni$_2$O$_7$ within a unified framework for unconventional superconductivity while revealing a distinct electronic environment for high-$T_c$ pairing.", "url": "https://arxiv.org/abs/2604.17181", "type": "理论", "summary": "1. 该工作将统一非常规高温超导体的基因原理与协作费米面规则，扩展至双层镍酸盐La3Ni2O7体系，并识别出两个主导的反铁磁交换配对通道。\n2. 其核心在于阐明了由双层键-反键劈裂与轨道对称性导致的两通道协作机制，从而在动量空间产生镜像偶/奇费米口袋间符号反转的s±超导态。\n3. 这既将该材料纳入非常规超导的统一框架，又揭示了其实现高Tc配对的独特电子环境，为相关材料探索提供了新思路。", "summary_source": "deepseek", "authors": [{"name": "Xianxin Wu"}, {"name": "Tao Xiang"}, {"name": "Jiangping Hu"}], "featured_authors": [{"name": "Xianxin Wu"}, {"name": "Tao Xiang"}, {"name": "Jiangping Hu"}], "author_count": 3}, {"id": "2604.17246", "category": "cond-mat", "title": "Polarized light Raman scattering by an atom near an ultrathin periodically aligned carbon nanotube film", "abstract": "We present a systematic theoretical study of the Raman scattering effect for a two-level atomic system in near proximity of an ultrathin dielectric film with an embedded parallel array of periodically aligned single-wall semiconducting carbon nanotubes. More generally, our model provides a unified description of the quantum near-field medium-assisted enhancement effects for in-plane anisotropic metasurfaces, of which ultrathin periodically aligned carbon nanotube films are the representative example. Particular attention is given to incoming photon parameters of the external light radiation such as polarization and incidence plane orientation relative to the main anisotropy axis (nanotube alignment axis). By explicitly deriving the Raman scattering cross-section, we establish that for the two-level atomic system in the near-field zone of the carbon nanotube metasurface the effect can be enhanced by a factor of up to 10^4, not only for p-polarized but for s-polarized light as well.", "url": "https://arxiv.org/abs/2604.17246", "type": "理论", "summary": "1. 本文针对嵌有周期性排列单壁半导体碳纳米管的超薄介电薄膜，理论研究了其近场中二能级原子系统的拉曼散射，系统分析了入射光偏振和入射面取向的影响。\n2. 通过显式推导拉曼散射截面，本工作发现该各向异性超表面近场可对p光和s光拉曼散射实现高达10^4的增强，并提供了量子近场介质辅助增强效应的统一描述。\n3. 这一模型拓展了对各向异性超表面量子光学性质的理解，为基于碳纳米管薄膜的增强光谱探测和量子器件设计提供了新的理论框架。", "summary_source": "deepseek", "authors": [{"name": "SK Firoz Islam"}, {"name": "Michael Dean Pugh"}, {"name": "Igor V. Bondarev"}], "featured_authors": [{"name": "SK Firoz Islam"}, {"name": "Michael Dean Pugh"}, {"name": "Igor V. Bondarev"}], "author_count": 3}, {"id": "2604.17349", "category": "cond-mat", "title": "From Flow to Form: Emergence of the Cytokinetic Ring via Active Cortical Dynamics", "abstract": "During cell division active flows occur in the cortex, a thin layer of gel like network of acto myosin filaments, beneath the cell surface. The cortical flow and the associated stresses bring about change in the cell shape, in particular a sharp invagination at the mid cell. Using 3D phase field simulation of an active deformable shell, which captures coupled dynamics of cortical velocity and nematic order, we show how a nematic like actomyosin ring spontaneously emerge at the equator and drive sharp invagination. We further demonstrate how different cortical flow patterns, including counter rotating flows emerge near the division furrow. We show that these flow patterns, often attributed to intrinsic chirality of actomyosin filaments can instead arise from bias in the initial nematic alignment, revealing a memory effect in the system. By analyzing a simpler model of activity gradient driven compressive flow on a flat interface we decipher the main ingredients for surface instability leading to invagination and counter moving flows.", "url": "https://arxiv.org/abs/2604.17349", "type": "理论+数值", "summary": "1. 该工作利用三维相场模型对可变形活性皮层进行模拟，揭示了皮层流动与向列序耦合动力学如何自发形成赤道处的类向列态肌动球蛋白环，并驱动细胞膜急剧内陷。\n2. 其核心发现是分裂沟附近的反向旋转流等皮层流动模式可源于初始向列排列的偏置，而非肌动蛋白丝固有手性，从而揭示了系统的记忆效应。\n3. 这通过分析活性梯度驱动压缩流的简化模型，阐明了导致膜内陷和反向流动的表面失稳机制，为后续实验验证皮层流与细胞形态发生的因果关系提供了理论基础。", "summary_source": "deepseek", "authors": [{"name": "Sabyasachi Mukherjee"}, {"name": "Anirban Sain"}], "featured_authors": [{"name": "Sabyasachi Mukherjee"}, {"name": "Anirban Sain"}], "author_count": 2}, {"id": "2604.17386", "category": "cond-mat", "title": "Designer metal-free altermagnetism in honeycomb two-dimensional frameworks", "abstract": "Altermagnetism combines momentum-dependent spin splitting of opposite-spin channels with zero net magnetization, enabling electric-field control of spin transport that is robust against external magnetic fields. Although widely explored in inorganic systems, metal-free altermagnets with pi-spin splitting, particularly in two-dimensional organic frameworks, have remained elusive. Here, we introduce a molecular design strategy that achieves designer metal-free altermagnetism in honeycomb 2D crystals. By reducing the monomer point-group symmetry from D3h to C2v in triangulene-derived radicals, inversion symmetry is selectively broken while the bipartite lattice is preserved. Spin-polarized density-functional-theory calculations reveal strong antiferromagnetic couplings of -130 meV, d-wave spin splitting of 17 meV at the M point, and Mott-Hubbard gaps of 1.26 eV, all fully consistent with Lieb's theorem. A minimal tight-binding model shows that anisotropic nearest-neighbor hopping arising from direction-dependent pi-orbital overlap is the microscopic origin of spin splitting and altermagnetism. Biaxial compressive strain further enhances the spin splitting to 27 meV. These results establish a general approach to room-temperature organic altermagnets and open a pathway toward carbon-based altermagnetism via engineered inversion-symmetry breaking.", "url": "https://arxiv.org/abs/2604.17386", "type": "理论+数值", "summary": "1. 该研究提出了一种分子设计策略，在三角烯衍生物自由基构成的蜂窝状二维晶体中实现了设计的无金属交变磁性。\n2. 其核心在于通过将单体点群对称性从D3h降低至C2v，选择性破坏反演对称性，理论计算揭示了-130 meV的反铁磁耦合、M点处17 meV的d波自旋分裂及各向异性近邻跳跃的微观起源。\n3. 这为通过工程化的对称性破缺，在室温下实现碳基有机交变磁性材料提供了一条明确的途径。", "summary_source": "deepseek", "authors": [{"name": "Hongde Yu"}, {"name": "Thomas Brumme"}, {"name": "Thomas Heine"}], "featured_authors": [{"name": "Hongde Yu"}, {"name": "Thomas Brumme"}, {"name": "Thomas Heine"}], "author_count": 3}, {"id": "2604.17479", "category": "cond-mat", "title": "Quantum higher-spin Hall insulators", "abstract": "We develop a theory of quantum spin Hall insulators with arbitrary spin $J$. Our analysis demonstrates that such systems support $J+\\tfrac{1}{2}$ pairs of helical edge modes protected by nontrivial mirror Chern numbers. We establish that the corresponding edge theory is described by a generalized Dirac fermion with higher-order dispersion. These modes produce unique transport responses that are non-linear with voltage. An in-plane magnetic field opens a mass gap in the edge spectrum, and magnetic domain walls host $(J+\\tfrac{1}{2})$-fold degenerate bound states characterized by nontrivial winding numbers. Our results extend quantum spin Hall physics to higher-spin systems and suggest possible realizations in ultracold atomic gases.", "url": "https://arxiv.org/abs/2604.17479", "type": "理论", "summary": "1. 该工作建立了任意自旋J的量子自旋霍尔绝缘体理论。\n2. 理论预言了由非平庸镜像陈数保护的J+1/2对螺旋边界模，其高阶色散导致独特的非线性输运响应。\n3. 这将量子自旋霍尔物理推广至高自旋系统，为超冷原子气体等平台实现提供了理论依据。", "summary_source": "deepseek", "authors": [{"name": "Takuto Kawakami"}, {"name": "Igor Kuzmenko"}, {"name": "Yshai Avishai"}, {"name": "Yigal Meir"}, {"name": "Masatoshi Sato"}], "featured_authors": [{"name": "Takuto Kawakami"}, {"name": "Igor Kuzmenko"}, {"name": "Yshai Avishai"}, {"name": "Yigal Meir"}, {"name": "Masatoshi Sato"}], "author_count": 5}, {"id": "2604.17539", "category": "cond-mat", "title": "Hydrodynamic theory of chemically active emulsions", "abstract": "We present a systematic theory of chemically active emulsions in the hydrodynamic limit by constructing a thermodynamically consistent framework in which the equilibrium is broken by chemo-stating of fuel molecules. For ternary solutions with active chemical reactions, we obtain an effective dynamics of the conserved field dynamics at long length and time scales. The effective dynamics takes into account the broken time reversal symmetry that manifests itself by the emergence of gradient terms akin to those of Active Model B+, which is a generic theory of active phase separation. In addition to the active coefficients modifying the interfacial energy coefficient, the theory contains higher order terms in the gradient expansion that are necessary to correctly describe the dynamics of chemically active emulsions, extending thus Active Model B+. We study numerically a Flory-Huggins model with active chemical reactions. Our theory predicts the formation of microphases when the effective interfacial energy coefficient becomes negative. Moreover, including noise, we show the existence of bubbly phase separation. We also identify a new type of phase behavior, a dynamic active filament phase. Finally, we discuss the steady state entropy production rate in the system resulting from the active chemical reactions. We observe that the total entropy production rate increases with the driving chemical potential and exhibits a kink-like singularity at the transition to the dynamic active filament phase. Our work shows that the generic behaviors of active phase separation can emerge in chemically active emulsions.", "url": "https://arxiv.org/abs/2604.17539", "type": "理论+数值", "summary": "1. 本文为化学活性乳液构建了热力学一致的水动力学理论框架，并通过数值研究揭示了其相分离动力学与新颖相行为。\n2. 理论将活性化学反应纳入三元溶液长时标有效动力学，拓展了Active Model B+模型，并预测了负界面能系数导致的微相分离与动态活性丝状相等非平衡相。\n3. 研究揭示了熵产率在动态活性丝状相变处存在类奇点行为，为活性软物质体系的非平衡统计物理描述提供了普适性范例。", "summary_source": "deepseek", "authors": [{"name": "Efe Ilker"}, {"name": "Kathrin Laxhuber"}, {"name": "Jean-Francois Joanny"}, {"name": "Frank Jülicher"}], "featured_authors": [{"name": "Efe Ilker"}, {"name": "Kathrin Laxhuber"}, {"name": "Jean-Francois Joanny"}, {"name": "Frank Jülicher"}], "author_count": 4}, {"id": "2604.17600", "category": "cond-mat", "title": "Activation and Avalanche Length Scales in the Finite-Temperature Creep of an Elastic Interface", "abstract": "We investigate the creep dynamics of a driven elastic line at finite temperature, well below the depinning threshold. We show that creep is governed by two distinct length scales. The first, $\\ell_{\\mathrm{opt}}$, corresponds to the optimal activated rearrangements that control the dynamics' bottleneck and remains essentially temperature-independent. The second, $\\ell_{\\mathrm{av}}$, characterizes the spatial extent of thermally activated avalanches and grows as temperature decreases. By combining structural and dynamical observables, we show that $\\ell_{\\mathrm{av}}$ governs both the crossover in the structure factor and the growth of the four-point dynamical susceptibility, while the relaxation time remains controlled by activation over large barriers associated with $\\ell_{\\mathrm{opt}}$. We find that the avalanche scale follows $\\ell_{\\mathrm{av}}(T)\\sim T^{-\\nu_{\\mathrm{dep}}}$, thereby selecting a unique scenario among competing theoretical predictions. These results establish a unified picture of finite-temperature creep in which activation controls temporal scales while depinning criticality governs spatial correlations.", "url": "https://arxiv.org/abs/2604.17600", "type": "理论", "summary": "1. 该工作研究了弹性界面在有限温度下、远低于去钉扎阈值的蠕变动力学，系统区分并量化了控制该过程的两个关键长度尺度ℓ_opt和ℓ_av。\n2. 其物理卖点在于揭示了ℓ_opt主导最优激活重排且基本温度无关，而ℓ_av随温度降低增长并支配结构因子交叉与四点动力学磁化率，同时弛豫时间由ℓ_opt相关势垒的激活控制。\n3. 这些结果建立了激活控制时间尺度、去钉扎临界性控制空间相关性的统一蠕变图像，为检验相关理论预测及玻璃态等系统的有限温度动力学研究提供了明确框架。", "summary_source": "deepseek", "authors": [{"name": "Giovanni Russo"}, {"name": "Ezequiel E. Ferrero"}, {"name": "Alejandro B. Kolton"}, {"name": "Alberto Rosso"}, {"name": "Damien Vandembroucq"}], "featured_authors": [{"name": "Giovanni Russo"}, {"name": "Ezequiel E. Ferrero"}, {"name": "Alejandro B. Kolton"}, {"name": "Alberto Rosso"}, {"name": "Damien Vandembroucq"}], "author_count": 5}, {"id": "2604.17641", "category": "cond-mat", "title": "Chiral Magnetism and Quantum Anomalous Hall Effect in a Low-energy Kondo Model on the Triangular Lattice", "abstract": "We study an effective low-energy Kondo model on the triangular lattice in which itinerant electrons occupy a valence pocket at $\\Gamma$ and three conduction pockets at the $M$ points of the Brillouin zone. This construction has a Fermi-surface nesting structure that favors triple-$Q$ magnetic order while only assuming the low-energy band-structure. Treating the local moments as classical spins on a four-sublattice magnetic unit cell, we find extended regions of non-coplanar order, including tetrahedral and related canted tetrahedral states, in addition to ferromagnetic and coplanar phases. The chiral phases remain stable over a broad range of inter-pocket Kondo couplings and persist in the presence of an external magnetic field. For certain chiral orders, the electronic bands can become gapped and host a quantum anomalous Hall state with $\\sigma_{xy}=4\\,e^2/h$. These results show that chiral magnetism and a quantized anomalous Hall effect on the triangular lattice do not rely on a specific tight-binding band structure, but can arise more generally from low-energy nested pockets at $\\Gamma$ and $M$.", "url": "https://arxiv.org/abs/2604.17641", "type": "理论", "summary": "1. 该工作研究了三角形晶格上一个低能量Kondo模型，其中Γ和M点电子口袋的Fermi表面嵌套诱导三重Q磁有序，并系统分析了包括非共面手性相在内的磁性相图。\n2. 其卖点在于通过四子格经典自旋处理，揭示了在广泛袋间耦合和外部磁场下稳定的手性相，并发现某些相中电子带隙化可实现霍尔电导为4e²/h的量子反常霍尔态。\n3. 这表明三角形晶格中手性磁性和量子反常霍尔效应源于低能量口袋嵌套的普适机制，而非特定带结构，为相关材料平台的设计与探索提供了理论依据。", "summary_source": "deepseek", "authors": [{"name": "Kai Vylet"}, {"name": "Xingkai Huang"}, {"name": "Leon Balents"}], "featured_authors": [{"name": "Kai Vylet"}, {"name": "Xingkai Huang"}, {"name": "Leon Balents"}], "author_count": 3}, {"id": "2604.17646", "category": "cond-mat", "title": "Crystallography, Lorentz violation, and the Standard-Model Extension", "abstract": "The motivation behind the present work is to adopt methodology from field theory and high-energy physics to crystallography. In particular, we establish a relationship between the electromagnetic sector of the Standard-Model Extension (SME) for Lorentz invariance violation and optical media. At an effective level, electromagnetic properties associated with different crystal structures are demonstrated to be parametrized in the SME. Crystallographic and magnetic point groups provide the mathematical tools to show this correspondence. Birefringent and magnetoelectric media merit a dedicated study. Intriguing effects, which have not been described systematically in the modern literature, are rediscovered for the latter and expressed in SME language. With the setting developed at our disposal, materials with specific symmetries such as birefringent or multiferroic crystals serve as condensed-matter analogs for SME effects. It enables us to propose materials with unusual optical properties, which have not been thoroughly looked at in recent times.", "url": "https://arxiv.org/abs/2604.17646", "type": "理论", "summary": "1. 该工作将标准模型扩展的洛伦兹破缺电磁场理论与晶体光学介质建立对应，实现了高能物理框架向凝聚态物质系统的移植。\n2. 其核心在于利用结晶学与磁点群对称性，将双折射、磁电等晶体电磁响应系统地参数化为标准模型扩展中的洛伦兹破缺算符。\n3. 这为在受控的凝聚态实验中模拟与探索洛伦兹破缺效应，以及设计具有非常规光学响应的新型晶体材料提供了明确理论途径。", "summary_source": "deepseek", "authors": [{"name": "Marco Schreck"}, {"name": "Rogeres A. da Silva Magalhães"}], "featured_authors": [{"name": "Marco Schreck"}, {"name": "Rogeres A. da Silva Magalhães"}], "author_count": 2}, {"id": "2604.17672", "category": "cond-mat", "title": "Magnetoresistance from decoherence", "abstract": "Microscopic theories of magnetoresistance have traditionally focused on momentum relaxation and the plasma frequency of itinerant electrons. Here, we uncover a distinct mechanism in which magnetoresistance originates from quantum decoherence throughout the whole Fermi sea, specifically the decay of the off-diagonal components of the density matrix. The resulting conductivity, parameterized by two complex decoherence times, scales linearly with impurity density-markedly contrasting the conventional Drude picture, where conductivity is governed by momentum relaxation of Ferm-surface quasiparticles and is inversely proportional to impurity density. This unconventional scaling provides a direct electrical probe of quantum decoherence, a quantity central to both fundamental studies and emerging nanoscale technologies. Furthermore, the interplay between the external magnetic field and the exchange field gives rise to rich magnetotransport phenomena, including temperature-drive crossover from positive to negative magnetoresistance and a nonmonotonic temperature dependence with a conductivity maximum reminiscent of the Kondo effect. Our results establish quantum decoherence as a key ingredient in magnetoresistance and our findings should have an unprecedented impact on advancing research and applications involving magnetoresistance.", "url": "https://arxiv.org/abs/2604.17672", "type": "理论", "summary": "1. 本工作提出了一种由量子退相干驱动的磁阻新机制，揭示了其在全费米海而非仅费米面准粒子中的作用。\n2. 其核心物理在于电导率随杂质密度线性变化，与由动量弛豫主导的传统德鲁德图像形成鲜明对比，并由两个复退相干时间参数化。\n3. 这一机制为直接电学探测量子退相干提供了新途径，并对理解磁性与电荷输运的相互作用以及相关纳米技术应用具有启示意义。", "summary_source": "deepseek", "authors": [{"name": "Xian-Peng Zhang"}, {"name": "Yan-Qing Feng"}, {"name": "Haiwen Liu"}, {"name": "Yugui Yao"}], "featured_authors": [{"name": "Xian-Peng Zhang"}, {"name": "Yan-Qing Feng"}, {"name": "Haiwen Liu"}, {"name": "Yugui Yao"}], "author_count": 4}, {"id": "2604.17700", "category": "cond-mat", "title": "Dynamical spin-nematic order in a transverse field Ising chain with non-Hermitian Gamma interaction", "abstract": "We investigate the effect of non-Hermitian Gamma interaction on the phase transitions and magnetic correlations for the transverse field Ising chain. We demonstrate that apart from the gapped ferromagnetic and paramagnetic phases, there is a gapless phase, where the system exhibits long-range spin-nematic order induced by parity-time symmetry breaking. Furthermore, we reveal that the parity-time symmetry breaking leads to the emergence of dynamical spin-nematic order, which also suggests a way of characterizing the spin-nematic phase diagram through non-equilibrium dynamics. Our findings show rich quantum phases stem from the competition among the Ising interaction, transverse field and non-Hermitian Gamma interaction, as well as providing a scheme for generating spin-nematic order in the spin chain.", "url": "https://arxiv.org/abs/2604.17700", "type": "理论+数值", "summary": "1. 该研究在引入非厄米Gamma相互作用的横场伊辛链中，分析了其相变与磁关联。\n2. 核心发现是宇称时间对称性破缺诱导出无能隙相中的长程自旋向列序，并揭示该序参量具有动力学特征。\n3. 这一结果为通过非平衡动力学刻画自旋向列相图提供了方案，并为在自旋链中生成此类序开辟了新途径。", "summary_source": "deepseek", "authors": [{"name": "Yu-Hong Yan"}, {"name": "Ran Wang"}, {"name": "Kun-Liang Zhang"}], "featured_authors": [{"name": "Yu-Hong Yan"}, {"name": "Ran Wang"}, {"name": "Kun-Liang Zhang"}], "author_count": 3}, {"id": "2604.17712", "category": "cond-mat", "title": "Metal Atom (Dis)Order and Superconductivity in YCaH$_{n}$ ($n=8-20$) High-Pressure Superhydrides", "abstract": "High-pressure superhydrides have attracted much attention due to their high superconducting critical temperatures ($T_\\text{c}$s). Herein, density functional theory (DFT) calculations are used to study the structures and properties, including potential for metal atom disorder and doping-enhanced $T_\\text{c}$, within Y-Ca superhydrides with YCaH$_{n}$ ($n=8-20$) compositions. For YCaH$_8$ numerous phases that differed in the arrangement of the metal atoms were found to be nearly isoenthalpic, suggesting the importance of configurational entropy on stability. The equimolar ratio of the two metal atoms brought the Fermi level to a peak in the density of states, enhancing $T_\\text{c}$ to 149~K and 170~K for $P4/mmm$ and $Cmmm$ YCaH$_{8}$, respectively, at 180~GPa within the isotropic Eliashberg formalism. YCaH$_{12}$ was also predicted to be disordered, however the $T_\\text{c}$s of the ordered variants spanned a wide range from 105-253~K at 200~GPa, showing that doping could either mildly enhance or drastically reduce $T_\\text{c}$ from that of the parent compounds. For YCaH$_{18}$ and YCaH$_{20}$, only a single dynamically stable superhydride was predicted, which we attribute to the differences in the structures of the stable binary parents.", "url": "https://arxiv.org/abs/2604.17712", "type": "理论+数值", "summary": "1. 本研究采用密度泛函理论计算，系统研究了YCaHn (n=8-20)高压超氢化物的结构、金属原子无序性及其对超导转变温度的影响。\n2. 计算发现YCaH8存在多种金属原子排列近简并的相，表明构型熵对稳定性重要，且等摩尔金属比使费米能级位于态密度峰值，从而将Tc提升至149-170 K。\n3. 结果表明掺杂对Tc的影响具有双重性，既可温和增强亦可大幅抑制，这为通过调控金属原子有序性来优化超氢化物超导性能提供了明确思路。", "summary_source": "deepseek", "authors": [{"name": "Masashi W. Kimura"}, {"name": "Seong Won Jang"}, {"name": "Nisha Geng"}, {"name": "Eva Zurek"}], "featured_authors": [{"name": "Masashi W. Kimura"}, {"name": "Seong Won Jang"}, {"name": "Nisha Geng"}, {"name": "Eva Zurek"}], "author_count": 4}, {"id": "2604.17812", "category": "cond-mat", "title": "Pairing properties of correlated three-leg ladders with strong interchain couplings near 1/3 filling", "abstract": "We investigate the ground-state properties of correlated three-leg ladders near 1/3 filling. We apply the density-matrix renormalization group method to the three-leg t-J ladder with strong interchain couplings and evaluate its pairing nature. When holes are doped into the spin-gapped state at 1/3 filling, we find that pair correlations develop with power-law decays while spin correlations decay exponentially. On the other hand, doping of electrons into the 1/3-filled state does not give rise to substantial pair correlations. We also discuss the hole-doped state in the three-leg Hubbard model to compare it with the pairing state in the t-J model. Our numerical demonstrations provide insights into the electronic properties of trilayer nickelate superconductors.", "url": "https://arxiv.org/abs/2604.17812", "type": "理论+数值", "summary": "1. 本工作采用密度矩阵重正化群方法，研究了近1/3填充下强链间耦合的三腿t-J梯型模型及哈伯德模型的基态配对性质。\n2. 核心发现是，在1/3填充的自旋能隙态中掺杂空穴能诱导出具有幂律衰减特性的配对关联，而自旋关联则呈指数衰减；相比之下，电子掺杂未能引发显著的配对关联。\n3. 这一结果为理解三层镍酸盐超导体等关联电子体系中的超导机理提供了重要的数值依据与对比视角。", "summary_source": "deepseek", "authors": [{"name": "Yushi Yamada"}, {"name": "Tatsuya Kaneko"}, {"name": "Masataka Kakoi"}, {"name": "Ryota Ueda"}, {"name": "Kazuhiko Kuroki"}], "featured_authors": [{"name": "Yushi Yamada"}, {"name": "Tatsuya Kaneko"}, {"name": "Masataka Kakoi"}, {"name": "Ryota Ueda"}, {"name": "Kazuhiko Kuroki"}], "author_count": 5}, {"id": "2604.17932", "category": "cond-mat", "title": "Implosive Dynamics from Topological Quenches in Bose-Einstein Condensates", "abstract": "We show numerically that a repulsive Bose-Einstein condensate can be driven into implosive dynamics by a direct topological quench. We first realize giant vortices by quasi-adiabatic phase imprinting, and then perform a sudden anti-imprint that cancels the accumulated winding in a single step, abruptly switching the condensate from a highly charged vortex state to the trivial sector. The resulting phase-density mismatch launches a rapid inward radial flow and produces a strong central density buildup, despite the repulsive interactions. We find a clear threshold in the initial winding for the onset of this focusing. After the first implosion, the dynamics evolves into circular nonlinear wave fronts that subsequently undergo breaking of azimuthal symmetry (axisymmetry) down to a polygonal one, whose shape is determined by the way the giant vortex is built. These results establish topological engineering as a new tool for studying implosive dynamics and symmetry-breaking instabilities in quantum fluids.", "url": "https://arxiv.org/abs/2604.17932", "type": "理论+数值", "summary": "1. 该工作通过数值模拟展示了通过直接拓扑淬火驱动排斥型玻色-爱因斯坦凝聚体产生内爆动力学。\n2. 其核心在于通过突然反相位印刻一次性抵消累积的拓扑绕数，使相密度失配产生向心径向流，并在排斥相互作用下实现强中心密度聚集。\n3. 这为利用拓扑工程研究量子流体中的对称性破缺不稳定性及非线性波前演化提供了新途径。", "summary_source": "deepseek", "authors": [{"name": "Marios Kokmotos"}, {"name": "Dimitri M. Gangardt"}, {"name": "Giovanni Barontini"}], "featured_authors": [{"name": "Marios Kokmotos"}, {"name": "Dimitri M. Gangardt"}, {"name": "Giovanni Barontini"}], "author_count": 3}, {"id": "2604.17936", "category": "cond-mat", "title": "Replica Theory of Spherical Boltzmann Machine Ensembles", "abstract": "Training in machine learning generally consists in finding one model, whose parameters minimize a data-dependent loss. Yet, empirical work shows that ensemble learning, an approach in which multiple models are sampled, can improve performance. Here, we provide an analytical framework to understand these observations in the case of Boltzmann machines, exploiting a duality between ensemble learning and large deviations of the free energy in spin-glass models. Replica calculations allow us to fully solve the case of spherical Boltzmann machine ensembles, and clarify when ensemble learning improves over standard loss minimization. Our findings are corroborated by numerical simulations on deep networks. Special care is brought to the case of nearly finite-dimensional data, for which we show that replica predictions are valid for arbitrarily large number of data points compared to the (large) embedding dimension.", "url": "https://arxiv.org/abs/2604.17936", "type": "理论+数值", "summary": "1. 本文构建了一个基于复本理论的解析框架，用于研究玻尔兹曼机集成学习的性能。\n2. 核心在于揭示了集成学习与自旋玻璃模型中自由能大偏差的对应关系，并通过复本计算完整求解了球面玻尔兹曼机集成。\n3. 该理论证明，在数据维度较高且样本量相对较大的近有限维情形下，复本预测保持有效，为理解深度网络的集成效应提供了理论基础。", "summary_source": "deepseek", "authors": [{"name": "Thomas Tulinski"}, {"name": "Jorge Fernandez-De-Cossio-Diaz"}, {"name": "Simona Cocco"}, {"name": "Rémi Monasson"}], "featured_authors": [{"name": "Thomas Tulinski"}, {"name": "Jorge Fernandez-De-Cossio-Diaz"}, {"name": "Simona Cocco"}, {"name": "Rémi Monasson"}], "author_count": 4}, {"id": "2604.17939", "category": "cond-mat", "title": "Monte Carlo Study of the Phase Transition of the $XY$ Model on a Diamond Lattice", "abstract": "We study the phase transition of the classical $XY$ model on a diamond lattice by Monte Carlo simulations using the Wolff cluster algorithm. Finite-size scaling (FSS) analysis of the Binder cumulant and the second-moment correlation length ratio $\\xi_{2\\rm nd}/L$ yields $T_c = 1.30036(1)$ and $\\nu = 0.671(6)$. Data collapse of both quantities confirms the three-dimensional $XY$ universality class.", "url": "https://arxiv.org/abs/2604.17939", "type": "理论+数值", "summary": "1. 该工作利用Wolff团簇算法的蒙特卡洛模拟，结合有限尺寸标度分析，研究了金刚石晶格上经典XY模型的相变。\n2. 其技术要点在于通过Binder累积量和二阶关联长度比ξ_{2nd}/L的标度分析，精确确定了临界温度T_c=1.30036(1)和临界指数ν=0.671(6)。\n3. 两组观测量数据的共线标度行为证实了该模型相变属于三维XY普适类，这为理解复杂晶格上连续相变的普适性提供了明确例证。", "summary_source": "deepseek", "authors": [{"name": "Sena Watanabe"}, {"name": "Yukitoshi Motome"}, {"name": "Haruki Watanabe"}], "featured_authors": [{"name": "Sena Watanabe"}, {"name": "Yukitoshi Motome"}, {"name": "Haruki Watanabe"}], "author_count": 3}, {"id": "2604.17987", "category": "cond-mat", "title": "Enhanced Anomalous Nernst Effect in the Ferromagnetic Kondo Lattice CeCo2As2", "abstract": "The anomalous Nernst effect (ANE), generating a voltage perpendicular to a temperature gradient due to magnetization, is closely linked to the Berry curvature (BC) near the Fermi energy in topological magnets. We report an enhanced spontaneous ANE in the ferromagnetic Kondo lattice CeCo2As2, which features Kondo-screened cerium-based 4f moments embedded in a ferromagnetic d-electron framework. The observed large anomalous Nernst coefficient, greater than the Seebeck coefficient, is attributed to the strong BC present in the f-orbital-dominated flat bands. The enhanced ANE in CeCo2As2 serves as a signature of the Fermi energy pinning within the topological flat band, highlighting the correlation-driven topology in the Kondo lattice.", "url": "https://arxiv.org/abs/2604.17987", "type": "理论", "summary": "1. 该工作报道了铁磁近藤晶格CeCo2As2中增强的自发反常能斯特效应。\n2. 其物理根源在于f轨道主导的平带中存在的强贝里曲率，导致反常能斯特系数超越塞贝克系数。\n3. 这表明费米能级钉扎于拓扑平带，为近藤体系中关联驱动的拓扑物态研究提供了新范例。", "summary_source": "deepseek", "authors": [{"name": "Shuyue Guan"}, {"name": "Weian Guo"}, {"name": "Pengyu Zheng"}, {"name": "Xinxuan Lin"}, {"name": "Yuqing Huang"}, {"name": "Jiawei Li"}, {"name": "Xiao-Bin Qiang"}, {"name": "Longfei Li"}, {"name": "Weiwei Xie"}, {"name": "Hai-Zhou Lu"}, {"name": "Zhiping Yin"}, {"name": "Shuang Jia"}], "featured_authors": [{"name": "Shuyue Guan"}, {"name": "Weian Guo"}, {"name": "Pengyu Zheng"}, {"name": "Hai-Zhou Lu"}, {"name": "Zhiping Yin"}, {"name": "Shuang Jia"}], "author_count": 12}, {"id": "2604.17992", "category": "cond-mat", "title": "Propagation, generation, and utilization of topologically trivial magnetic solitons in magnetic nanowires", "abstract": "Magnetic solitons are nonlinear, local excitations in magnetic systems. In this study, we theoretically and numerically investigate the properties and generation of one-dimensional (1D) topologically trivial magnetic solitons in ferromagnetic nanowires. An approximate analytical soliton solution described by two free parameters is validated by comparing with the micromagnetic simulation. Across an interface between two media of different anisotropy, the reflection and refraction of a soliton are highly nonlinear that are different from the linear spin waves. A pair of magnetic solitons that propagate in opposite directions can be generated by alternately applying magnetic field or spin-polarized current pulses of opposite directions to at least two successive regions. Each soliton falls into a soliton solution that can be controlled by the generation process. These magnetic solitons can be used to drive domain wall motion over a certain distance determined by the soliton magnitude, allowing for discrete manipulation of domain walls compatible with the digital nature of information technology. Our findings pave the way for the application of topologically trivial solitons in spintronics.", "url": "https://arxiv.org/abs/2604.17992", "type": "理论+数值", "summary": "1. 该工作通过理论与微磁模拟研究了铁磁纳米线中拓扑平庸磁孤子的传播、生成与利用。\n2. 其核心在于揭示了孤子在异质界面处的非线性反射折射行为，并提出了交替磁场或电流脉冲的可控生成方法。\n3. 这为基于孤子驱动畴壁离散运动的数字型自旋电子器件提供了明确设计思路。", "summary_source": "deepseek", "authors": [{"name": "Kai-Tao Huang"}, {"name": "X.S. Wang"}], "featured_authors": [{"name": "Kai-Tao Huang"}, {"name": "X.S. Wang"}], "author_count": 2}, {"id": "2604.17994", "category": "cond-mat", "title": "SWORD: Symmetry and Wyckoff-sequence of Ordered and Disordered crystals", "abstract": "Novelty in materials discovery requires candidates to be distinct, non-redundant, and thermodynamically plausible. While crystallographic databases continue to expand in both size and complexity, making efficient and reliable novelty assessment has become increasingly difficult. This becomes particularly acute when crystallographic disorder is involved, as partial occupancies greatly enlarge the structure-composition space and obscure the identification of genuinely distinct structures. Here, we introduce SWORD, a symmetry-aware, Wyckoff-based string representation compatible with both ordered and disordered crystals. SWORD provides (i) standardization of symmetry-equivalent structural descriptions into a consistent label, (ii) explicitly represents co-occupying species on partially occupied sites, and (iii) quantifies complex disorder through a degree of mixing descriptor that captures continuous variation in site stoichiometry. These features enable efficient structure grouping, duplicate identification, and finer refinement of disordered structures. Benchmarking against existing fingerprint and structure-matching methods shows that SWORD remains invariant under identity-preserving transformations while retaining interpretable sensitivity to structural perturbations. In addition, SWORD shows competitive performance in associating unrelaxed and intermediate configurations with their final relaxed states along relaxation trajectories. This feature could enable more reliable novelty assessment directly from partially relaxed or even unrelaxed generated structures. Finally, SWORD was used to showcase its capability of disorder-aware database-scale deduplication and curation for the Inorganic Crystal Structure Database (ICSD). The curated ICSD would serve as the basis for the materials informatics and data-driven materials design in the era of artificial intelligence.", "url": "https://arxiv.org/abs/2604.17994", "type": "理论", "summary": "1. 该工作开发了适用于有序与无序晶体的对称性Wyckoff序列字符串表示方法SWORD。\n2. 其技术优势在于通过标准化对称等价描述、显式表示部分占据位点物种及混合度描述符来处理复杂无序。\n3. 这为基于未完全弛豫结构的高效去重与数据库构建提供了可靠工具，支撑材料信息学发展。", "summary_source": "deepseek", "authors": [{"name": "Yuyao Huang"}, {"name": "Wei Nong"}, {"name": "Shuya Yamazaki"}, {"name": "Martin Hoffmann Petersen"}, {"name": "Jianghai Wang"}, {"name": "Ruiming Zhu"}, {"name": "Kedar Hippalgaonkar"}], "featured_authors": [{"name": "Yuyao Huang"}, {"name": "Wei Nong"}, {"name": "Shuya Yamazaki"}, {"name": "Jianghai Wang"}, {"name": "Ruiming Zhu"}, {"name": "Kedar Hippalgaonkar"}], "author_count": 7}, {"id": "2604.17997", "category": "cond-mat", "title": "A unified framework for grain boundary distributions in textured materials", "abstract": "Grain boundary plane distributions are widely used to infer the mechanisms governing grain boundary formation in polycrystalline materials. We show that such interpretations are inherently ambiguous. Using a unified eight-parameter boundary distribution framework, we derive both the grain boundary character distribution (GBCD) and the grain boundary normal distribution (GBND) and identify two limiting cases of boundary network formation. We show that in macroscopically driven networks, the crystal-frame GBND is given by a convolution of the specimen GBND with the orientation distribution function (ODF), whereas in crystallographically driven networks the specimen GBND is obtained by convolution of the crystal GBND with the ODF. This duality implies that anisotropy in the GBND may arise from macroscopic alignment effects rather than intrinsic crystallographic selection. Conversely, this relationship may be used to identify the dominant formation process in the measured mcirostructures. Evaluation of a wide variety of simulated microstructures confirm the theoretically predicted relationships between texture, GBND and GBCD. In particular, our examples confirm that the GBND or GBCD alone are not sufficient for identifying grain boundary formation mechanisms.", "url": "https://arxiv.org/abs/2604.17997", "type": "理论", "summary": "1. 该工作提出一个统一的八参数晶界分布框架，推导了晶界特征分布与晶界法向分布，并识别出边界网络形成的两种极限情形。\n2. 其核心在于揭示了宏观驱动与晶体学驱动网络中，试样与晶体坐标系下晶界法向分布通过取向分布函数相互卷积的二元关系。\n3. 该框架为通过测量微结构中的织构、晶界法向与特征分布的关系来判定主导形成机制提供了理论工具。", "summary_source": "deepseek", "authors": [{"name": "Ralf Hielscher"}, {"name": "Rüdiger Kilian"}, {"name": "Erik Wünsche"}, {"name": "Katharina Tinka Marquardt"}], "featured_authors": [{"name": "Ralf Hielscher"}, {"name": "Rüdiger Kilian"}, {"name": "Erik Wünsche"}, {"name": "Katharina Tinka Marquardt"}], "author_count": 4}, {"id": "2604.18015", "category": "cond-mat", "title": "Intrinsic Neuro-Synaptic Spiking Dynamics and Resonance in Memristive Networks", "abstract": "Self-organizing memristive networks are physical circuits that dynamically reconfigure their circuitry in response to external input signals. Their adaptive behavior arises from intrinsic neuro-synaptic dynamics combined with a heterogeneous network topology. In this work, we demonstrate that such networks naturally generate neuronal population spiking dynamics similar to those observed in biological neuronal systems. This study investigates the intrinsic and emergent dynamics of memristive networks mathematically and numerically for both DC and AC input signals. Nonlinear spike-like features are maximized when the frequency of the input driving signal matches the network's intrinsic dynamical timescale, where nonlinear resonance is observed. Furthermore, the optimal frequency for computation is found to be the maximal frequency before the onset of resonance.", "url": "https://arxiv.org/abs/2604.18015", "type": "数值", "summary": "1. 该工作通过数学建模与数值模拟，研究了自组织忆阻网络在直流与交流输入信号下的内在与涌现神经动力学。\n2. 研究揭示了当输入驱动信号的频率与网络固有动力学时间尺度匹配时，系统会呈现非线性共振，并最大化其类神经元脉冲发放特征。\n3. 发现共振发生前的最优计算频率，这为基于物理机制的神经形态计算设计与优化提供了关键指导。", "summary_source": "deepseek", "authors": [{"name": "Yinhao Xu"}, {"name": "Georg A. Gottwald"}, {"name": "Zdenka Kuncic"}], "featured_authors": [{"name": "Yinhao Xu"}, {"name": "Georg A. Gottwald"}, {"name": "Zdenka Kuncic"}], "author_count": 3}, {"id": "2604.18063", "category": "cond-mat", "title": "Influence of near-field effect on magnetic hysteresis in magneto-active elastomers", "abstract": "Magneto-active elastomers (MAEs) are polymer composites consisting of magnetic microparticles embedded in an elastomeric matrix. These materials exhibit strong magneto-mechanical coupling under external magnetic fields, resulting in tunable stiffness, reversible shape changes, and nonlinear magnetic responses. This study presents a multiscale theoretical framework to investigate the origin of magnetic hysteresis in MAEs, with emphasis on the evolution of the internal microstructure during magnetization and demagnetization. The total energy of the system is formulated as the sum of magnetic and micromechanical contributions, while macroscopic deformation of a cylindrical MAE sample is fully constrained. Particle interactions are modeled first via pure dipole-dipole interactions and then extended to include higher-order near-field effects at close particle separations. The results show that hysteresis in MAEs with magnetically soft particles primarily arises from trapped microstructural rearrangements, leading to distinct particle configurations under increasing and decreasing magnetic fields. Parametric studies demonstrate that particle volume fraction, sample aspect ratio, and matrix stiffness strongly influence the microstructure evolution and the width of resulting hysteresis loops. The proposed framework provides a solid foundation for modeling magnetic hysteresis, which is essential for the design and optimization of MAEs in practical applications.", "url": "https://arxiv.org/abs/2604.18063", "type": "理论+数值", "summary": "1. 本研究建立了一个多尺度理论框架，以探究磁活性弹性体中磁滞现象的微观起源，重点关注磁化与退磁过程中内部微观结构的演化。\n2. 其技术核心在于，在偶极-偶极相互作用模型基础上，引入了粒子间距较近时的高阶近场效应，从而揭示了磁滞主要源于被捕获的微观结构重排。\n3. 该框架为定量理解并预测粒子体积分数、样品长径比及基体刚度等参数对磁滞回线的影响提供了坚实基础，对优化磁活性弹性器件的设计具有指导意义。", "summary_source": "deepseek", "authors": [{"name": "Pawan Patel"}, {"name": "Dirk Romeis"}, {"name": "Marina Saphiannikova"}], "featured_authors": [{"name": "Pawan Patel"}, {"name": "Dirk Romeis"}, {"name": "Marina Saphiannikova"}], "author_count": 3}, {"id": "2604.18068", "category": "cond-mat", "title": "Self-averaging parameter estimation for coarse-grained particle models", "abstract": "We introduce a parameter estimation method that utilizes microscopic data, specifically averages and correlations of selected microscopic observables, to determine the parameters of a stochastic differential equation governing coarse-grained degrees of freedom. The method is not limited to static parameters found in the reversible part of the coarse-grained dynamics, such as those in the free energy function or potential of mean force, but also extends to dynamic parameters, including friction coefficients. The method couples the stochastic differential equation with free parameters to dynamic equations for the parameters. The coupled system self-averages, according to Anosov-Kifer's theorem, in such a way that the final state of the parameters gives coincidence between the microscopic and mesoscopic averages and correlations of selected observables. The method is validated in two examples: a Brownian particle in a harmonic potential, and a set of Brownian particles interacting hydrodynamically with the Rotne-Prager-Yamakawa mobility tensor. This latter case illustrates how the method can be used not only to determine coefficients but also state dependent transport properties - in this case, the position dependent form of the mobility tensor. The parameter estimation for these two models yields excellent results. Subsequently we use the methodology to study a bimodal-mass Lennard-Jones fluid for which we infer both the potential of mean force between the heavy particles and its hydrodynamic mobility tensor.", "url": "https://arxiv.org/abs/2604.18068", "type": "理论", "summary": "1. 该工作提出了一种基于微观数据的参数估计方法，用于确定描述粗粒度自由度的随机微分方程中的静态与动态参数。\n2. 其核心技术在于将含待估参数的随机微分方程与参数的动力学方程耦合，依据Anosov-Kifer定理实现自平均，最终使所选观测量在微观与介观层次的统计量一致。\n3. 该方法不仅能确定系数，还能推断如位置依赖的迁移率张量等状态依赖的输运性质，为复杂流体等体系的粗粒度研究提供了新框架。", "summary_source": "deepseek", "authors": [{"name": "Carlos Monago"}, {"name": "J. A. de la Torre"}, {"name": "Pep Español"}], "featured_authors": [{"name": "Carlos Monago"}, {"name": "J. A. de la Torre"}, {"name": "Pep Español"}], "author_count": 3}, {"id": "2604.18079", "category": "cond-mat", "title": "Generic skyrmion phase diagram in ferrimagnetic films", "abstract": "Ferrimagnetic skyrmions offer enhanced tunability due to antiferromagnetically coupled sublattices and reduced net magnetization. In chiral magnetic films at zero magnetic field, skyrmion stability is commonly characterized by a dimensionless parameter $\\kappa$, yet its applicability to ferrimagnetic systems remains unclear, as most studies assume a fixed, strong inter-sublattice exchange coupling $J$. Here we investigate how variations in $J$ govern relaxed stable and metastable ferrimagnetic skyrmion configurations and introduce a dimensionless parameter $\\zeta_{eff}$ to characterize the crossover between strong and weak inter-sublattice locking. In the strong-coupling regime, inter-sublattice locking enables stabilization of skyrmion in a sublattice where intrinsic Dzyaloshinskii-Moriya interaction is absent while the other sublattice has finite DMI, yielding a sublattice with DMI-free ferrimagnetic skyrmions. As $J$ decreases, this locking breaks down, leading to independent sublattice behavior and the failure of an effective $\\kappa$-based description. Our results establish a unified framework linking inter-sublattice exchange and skyrmion phase stability in ferrimagnetic systems.", "url": "https://arxiv.org/abs/2604.18079", "type": "数值", "summary": "1. 本研究建立了铁磁薄膜中斯格明子的统一相图框架，揭示了层间交换耦合强度J如何调控其稳定构型，并引入无量纲参数ζ_eff描述强-弱耦合转变。\n2. 强耦合区域中层间锁定效应允许在无内禀Dzyaloshinskii-Moriya相互作用的子晶格中稳定斯格明子，而弱耦合下子晶格行为解耦导致传统κ参数描述失效。\n3. 该框架为理解反铁磁耦合多子晶格体系中拓扑孤子的稳定机制提供了普适描述，可拓展至其他具有竞争相互作用的非共线磁序系统。", "summary_source": "deepseek", "authors": [{"name": "M. V. Wijethunga"}, {"name": "X. R. Wang"}], "featured_authors": [{"name": "M. V. Wijethunga"}, {"name": "X. R. Wang"}], "author_count": 2}, {"id": "2604.18093", "category": "cond-mat", "title": "Polarization Engineering of the Orbital Hall Conductivity in Two-dimensional Ferroelectric Higher-Order Topological Insulator Tl$_2$S and SnS", "abstract": "Ferroelectric higher-order topological insulators (HOTIs) exhibit tunable physical properties arising from the interplay between ferroelectric polarization and band topology. This work investigates the topological origin
