 of two classes of two-dimensional (2D) ferroelectric HOTIs with out-of-plane or in-plane polarization, revealing their distinct orbital transport behaviors and the mechanism for engineering orbital Hall conductivity (OHC) via polarization control. Our results demonstrate the unique role of polarization in modulating both the higher-order band topology and orbital transport. A strong coupling between in-plane polarization and higher-order topology is identified, establishing in-plane polarization as an intrinsic means to reversibly switch the OHC plateau within the band gap. Using Tl$_2$S and SnS as representative models of the two HOTI types, we demonstrate persistent and electrically switchable orbital transport, respectively. Our study advances the understanding of the coupling among ferroelectricity, higher-order topology, and orbital transport, offering new avenues for controllable orbitronics.", "url": "https://arxiv.org/abs/2604.18093", "type": "理论", "summary": "1. 该工作研究了二维面外与面内极化铁电高阶拓扑绝缘体，揭示了其轨道输运行为的差异及通过极化调控轨道霍尔电导的机制。\n2. 研究发现了面内极化与高阶拓扑间的强耦合，证实其可作为可逆调控带隙内轨道霍尔电导平台的内禀手段。\n3. 这为理解铁电性、高阶拓扑与轨道输运的耦合提供了新视角，并为发展可控轨道电子学器件开辟了途径。", "summary_source": "deepseek", "authors": [{"name": "YingJie Hu"}, {"name": "Heng Gao"}, {"name": "Yabei Wu"}, {"name": "Wei Ren"}], "featured_authors": [{"name": "YingJie Hu"}, {"name": "Heng Gao"}, {"name": "Yabei Wu"}, {"name": "Wei Ren"}], "author_count": 4}, {"id": "2604.18097", "category": "cond-mat", "title": "Asymmetric Scattering-Induced Neel Spin-Orbit Torque in Antiferromagnets", "abstract": "Magnetic switching in antiferromagnets relies on Neel spin orbit torque (NSOT), which originates from a current-induced staggered spin polarization of itinerant electrons. In collinear antiferromagnets, such a response requires the spin susceptibility to be odd under combined space-time inversion symmetry (PT), and is conventionally attributed to symmetric scattering processes. Here, we demonstrate that asymmetric impurity scattering generates an additional PT-odd spin polarization when coupled with the anomalous spin polarizability (ASP) of Bloch electrons. This extrinsic contribution arises from the interplay between antisymmetric higher-order scattering processes and band geometry, effectively converting an otherwise PT-even susceptibility into a staggered spin polarization. Using a minimal model of tetragonal CuMnAs, we show that this anomalous skew-scattering contribution can be comparable to, and with sufficient impurity density even exceed, the conventional symmetric scattering (Drude) contribution. Our results identify a new band-geometry-driven mechanism for NSOT and establish an efficient route for electrical control of antiferromagnets.", "url": "https://arxiv.org/abs/2604.18097", "type": "理论", "summary": "1. 本工作揭示了一种由不对称杂质散射驱动的、产生反铁磁奈尔自旋轨道力矩（NSOT）的新外禀机制，并利用四方CuMnAs的量子输运模型证实了其重要性。\n2. 其核心物理在于，布洛赫电子的异常自旋极化率与反称高阶散射过程耦合，可将原本的空间-时间反演偶（PT-even）的自旋极化率有效转化为交错的自旋极化。\n3. 这为反铁磁体的电操控提供了一条新设计原则，即通过调控能带几何与不对称散射来显著增强自旋轨道力矩的效率。", "summary_source": "deepseek", "authors": [{"name": "Sayan Sarkar"}, {"name": "Amit Agarwal"}], "featured_authors": [{"name": "Sayan Sarkar"}, {"name": "Amit Agarwal"}], "author_count": 2}, {"id": "2604.18125", "category": "cond-mat", "title": "Stability and breakdown of chiral motion in non-reciprocal flocking", "abstract": "We study a two-species Vicsek model with intra-species alignment and asymmetric inter-species couplings, where one species aligns with the other while the latter anti-aligns. Motivated by recent results showing that globally coherent chiral motion is not a generic large-scale state of finite-range non-reciprocal flocking, we ask whether a chiral state can nevertheless be stabilized in the discrete-time, metric, non-reciprocal two-species Vicsek model, and if so, under what conditions. For equal populations and motilities, we show that such a state exists only within a restricted window characterized by high density, very low self-propulsion speed, and small system size relative to the interaction range. Within this window, we also find that chirality appears primarily when aligning interactions dominate over anti-alignment, whereas stronger anti-alignment leads to species segregation and suppresses chirality. Conversely, introducing species asymmetry through population imbalance drives transitions from chiral states to porous parallel-flocking or anti-parallel-flocking liquids; motility imbalance induces asynchronous oscillations and, in extreme cases, leads to segregation into moving clusters of the faster species within a more dispersed background of slower particles. Overall, these results indicate that chirality in the non-reciprocal two-species Vicsek model arises within a restricted regime set by density, motility, inter-species coupling, and system size, rather than being a generic outcome of non-reciprocal interactions.", "url": "https://arxiv.org/abs/2604.18125", "type": "理论", "summary": "1. 该工作研究了离散时间、度量式非互易两种群Vicsek模型中手性运动的稳定条件与破缺机制。\n2. 核心发现表明，手性态仅存在于由高密度、极低自推进速度及系统尺寸小于相互作用范围所定义的受限参数窗口内，且对齐耦合需主导反对齐作用。\n3. 这揭示了非互易集群中手性并非普适涌现现象，其参数敏感性为理解更广泛非互易活性物质的集体动力学提供了定量基准。", "summary_source": "deepseek", "authors": [{"name": "Aditya Kumar Dutta"}, {"name": "Swarnajit Chatterjee"}, {"name": "Matthieu Mangeat"}, {"name": "Raja Paul"}], "featured_authors": [{"name": "Aditya Kumar Dutta"}, {"name": "Swarnajit Chatterjee"}, {"name": "Matthieu Mangeat"}, {"name": "Raja Paul"}], "author_count": 4}, {"id": "2604.18165", "category": "cond-mat", "title": "Dynamics of one-dimensional Bose-Josephson Junction in a Box Trap: From Coherent Oscillations to Many-Body Dephasing and Dynamical Freezing", "abstract": "Understanding how coherent quantum dynamics give way to correlation-dominated behavior in low-dimensional systems remains a central challenge in quantum many-body physics. Here, we address this problem by investigating the interplay of interactions and initial population imbalance in a one-dimensional Bose-Josephson junction confined in a box trap. Using the multiconfigurational time-dependent Hartree method for bosons (MCTDHB), we identify distinct dynamical regimes governed by the interplay between coherence and correlation-induced fragmentation. In the weakly interacting regime, the system exhibits coherent Josephson oscillations, while strong initial imbalance leads to damping. At intermediate interaction strength, fixing the interaction and varying only the initial imbalance, we uncover a crossover in the dynamics: very small imbalances yield nearly pure, non-fragmented oscillations; moderate imbalances induce many-body dephasing with collapse-and-revival behavior; and large imbalances drive equilibration accompanied by strong fragmentation and saturation of many-body observables, including orbital entropy and participation ratio. In the strongly interacting regime, the system enters a dynamical freezing regime characterized by pronounced fragmentation, where the density develops well-separated, particle-resolved peaks and tunneling is strongly suppressed. These results establish a unified picture of how coherence, dephasing, equilibration, and dynamical freezing emerge and compete in one-dimensional Josephson dynamics.", "url": "https://arxiv.org/abs/2604.18165", "type": "理论+数值", "summary": "1. 该工作利用多组态含时哈特里方法研究了盒型势中一维玻色-约瑟夫森结在相互作用与初始粒子数失衡共同影响下的动力学演化。\n2. 核心发现是在固定中等相互作用强度下，仅通过调节初始失衡即可实现从相干振荡、多体退相干的坍缩-复苏到强碎片化平衡态的动力学交叉。\n3. 这为理解一维约瑟夫森系统中相干性、退相干、平衡化及动力学冻结之间的竞争关系建立了统一的理论图像。", "summary_source": "deepseek", "authors": [{"name": "Abhik Kumar Saha"}, {"name": "L. F. Calazans de Brito"}, {"name": "Rhombik Roy"}, {"name": "Romain Dubessy"}, {"name": "Barnali Chakrabarti"}, {"name": "Arnaldo Gammal"}], "featured_authors": [{"name": "Abhik Kumar Saha"}, {"name": "L. F. Calazans de Brito"}, {"name": "Rhombik Roy"}, {"name": "Romain Dubessy"}, {"name": "Barnali Chakrabarti"}, {"name": "Arnaldo Gammal"}], "author_count": 6}, {"id": "2604.18189", "category": "cond-mat", "title": "Density Profiles and Direct Correlation Functions from Density Functional Theory in Binary Hard-Sphere Crystals: Substitutional Solid and Interstitial Solid Solution", "abstract": "We determine the fully resolved equilibrium density profiles for two binary hard-sphere crystal structures using classical density functional theory through the White Bear II functional from fundamental measure theory. While for the substitutional crystal, in which some hard spheres are replaced by spheres of slightly smaller diameter, the density profiles are rather similar to the single-component case (narrow Gaussian peaks centered at fcc lattice sites), we observe a more complex behavior for the case of interstitial solid solutions, where the small species is fairly delocalized in the unit cell. Further, we compute the species-resolved inhomogeneous two-body direct correlation functions for these two types of binary crystals. The large-large components are mainly determined by the vacancy concentration $n_\\text{vac}$ and show a characteristic magnitude $~1/n_\\text{vac}$. Based on this observation, we propose a simple geometric picture of this six-dimensional function. The components of the direct correlation function involving the small spheres substantially differ in interstitial solid solutions from those of the substitutional crystal.", "url": "https://arxiv.org/abs/2604.18189", "type": "理论+数值", "summary": "1. 本文采用基于基本测度理论White Bear II泛函的经典密度泛函理论，确定了二元硬球晶体中置换型固溶体和间隙型固溶体两种结构的完全分辨平衡密度分布。\n2. 研究发现间隙型固溶体中小组分在单胞内显著离域，其密度分布比置换型晶体更为复杂；并通过计算组分分辨的非均匀二体直接关联函数，揭示了其大球组分与空位浓度相关的标度关系及几何图像。\n3. 该工作为理解更复杂的晶态混合物提供了精确的关联函数信息，可直接用于构建改进的晶体相理论或指导相关模拟研究。", "summary_source": "deepseek", "authors": [{"name": "Alessandro Simon"}, {"name": "Martin Oettel"}], "featured_authors": [{"name": "Alessandro Simon"}, {"name": "Martin Oettel"}], "author_count": 2}, {"id": "2604.18219", "category": "cond-mat", "title": "Magnetotransport and Phase competition in three-dimensional Hubbard-Holstein model at half-filling", "abstract": "We investigate the magnetotransport properties of the one-band Hubbard-Holstein model at half-filling in three dimensions (3D) using exact diagonalization based semi-classical Monte Carlo simulations with phonons treated in the adiabatic limit. The low-temperature electronic correlation $U$ vs electron-phonon coupling $V$ phase diagram reveals two insulating phases--antiferromagnetic (AF-I) and charge-ordered (CO-I)--separated by a first-order transition, with no metallic phase observed at their intersection, indicating robustness of these phases in 3D. For $U \\sim bandwidth$, the $V$ vs temperature $T$ phase diagram exhibits multiple phases including AF-I, CO-I, Mott-Hubbard insulator, bipolaronic insulator, and two bipolaronic metallic states. Several first-order transitions occur near $V \\sim 3.75$. Above the ordering temperature, the density of states shows universal behavior dominated by electronic contribution, while susceptibility and DOS analyses reveal pseudogap features. Magnetic and transport properties along the phase boundary highlight strong proximity effects between competing phases, suggesting routes for tuning correlated materials and emergent electronic states.", "url": "https://arxiv.org/abs/2604.18219", "type": "理论+数值", "summary": "1. 该工作通过基于精确对角化的半经典蒙特卡罗模拟，研究了三维半填充单带Hubbard-Holstein模型在绝热近似下的磁输运性质与相竞争行为。\n2. 研究揭示了低温下由一级相变分隔的反铁磁绝缘相与电荷有序绝缘相，并在有限温度相图中发现多种绝缘相与双极化子金属态，其态密度与磁化率分析显示出赝能隙特征。\n3. 相边界附近的强邻近效应为调控关联材料中电子态竞争及设计新型电子态提供了明确路径。", "summary_source": "deepseek", "authors": [{"name": "Sandip Halder"}, {"name": "Moshe Schechter"}], "featured_authors": [{"name": "Sandip Halder"}, {"name": "Moshe Schechter"}], "author_count": 2}, {"id": "2604.18322", "category": "cond-mat", "title": "Uncertainty-aware phase fraction prediction and active-learning-guided out-of-domain discovery of refractory multi-principal element alloys", "abstract": "Refractory multi-principal element alloys (RMPEAs) represent a novel class of alloys characterized by an extensive compositional design space and the potential for exceptional mechanical performance under extreme conditions. While accurate phase stability prediction is essential for their robust design, existing machine learning approaches rely on deterministic mappings from composition-derived features to phase labels, neglecting the uncertainty inherent in such predictions. In this study, we present a deep learning framework based on Mixture Density Networks (MDNs) to predict phase fractions in RMPEAs and quantify the associated aleatoric uncertainty across a wide temperature range. By training separate models for up to six constituent phases of RMPEAs using CALPHAD derived data, our approach achieves high predictive accuracy while capturing the probabilistic nature of phase formation. To address epistemic uncertainty arising from incomplete knowledge of the most informative features, we perform a perturbation-based feature importance analysis and identify a minimally sufficient input set that maintains both predictive performance and uncertainty calibration. Finally, we propose an uncertainty-based active learning strategy to discover novel RMPEAs with the target phase incorporating previously unseen elements, while investigating the exploration-exploitation trade-off in model-guided discovery. Our uncertainty-aware framework has the potential to accelerate and improve the reliability of discovering novel high-performance alloys and is broadly applicable.", "url": "https://arxiv.org/abs/2604.18322", "type": "理论+数值", "summary": "1. 该研究开发了一个基于混合密度网络的深度学习框架，用于预测难熔多主元合金的相分数并量化其伴随的随机不确定性，同时通过基于扰动的特征分析处理认知不确定性。\n2. 该工作的技术优势在于结合了随机与认知不确定性的量化，并通过扰动特征重要性分析确定了维持预测性能与不确定度校准的最小充分输入特征集。\n3. 所提出的基于不确定性的主动学习策略为在包含未知元素的广阔成分空间中定向探索具有目标相的新型高性能合金提供了可靠途径，有望加速合金发现进程。", "summary_source": "deepseek", "authors": [{"name": "A. K. Shargh"}, {"name": "C. D. Stiles"}, {"name": "J. A. El-Awady"}], "featured_authors": [{"name": "A. K. Shargh"}, {"name": "C. D. Stiles"}, {"name": "J. A. El-Awady"}], "author_count": 3}, {"id": "2604.18324", "category": "cond-mat", "title": "Multipolar Piezoelectricity and Anisotropic Surface Transport in Alterelectrics", "abstract": "Altermagnets are an emergent class of materials combining features of ferro- and antiferro-magnetic materials. They have spin-separated bands normally associated with ferromagnets, but a vanishing net magnetization. Moreover the symmetries giving rise to $d$-wave altermagnetism can provide them with a particular anisotropic, quadrupolar (i.e. with equal and opposite values when strained in perpendicular directions) piezomagnetism. Observing that the same symmetries provide a natural place to look for hyberbolic wave dispersion, this raises the question which properties are intrinsically linked to magnetism and which are determined by the symmetry. Here, we disentangle these concepts by introducing an alternative to altermagnets, based on electric polarization. These alterelectrics display quadrupolar piezoelectricity and a hyperbolic dispersion, which we demonstrate conceptually within a simplified model as well as a first-principles material realization. We furthermore establish that a counterpart of the spin-separated bands is formed by surface modes which allow for surface dependent anisotropic electronic transport analogous to the spintronic applications proposed for altermagnets.", "url": "https://arxiv.org/abs/2604.18324", "type": "理论", "summary": "1. 该工作基于对称性分析，引入了替代反铁磁的“交替电极”概念，并通过简化模型与第一性原理计算展示了其四极压电性与双曲色散。\n2. 其核心在于将反铁磁中的自旋分离能带与磁致各向异性，解耦并转化为由电极化对称性主导的纯电学对应物，揭示了对称性而非磁性本身的关键作用。\n3. 这为设计基于非磁性材料的各向异性表面电子输运器件提供了新原理，并启发了对更广泛的“交替极性”材料体系的探索。", "summary_source": "deepseek", "authors": [{"name": "Amber Visser"}, {"name": "Viktor Könye"}, {"name": "Oleg Janson"}, {"name": "Jeroen van den Brink"}, {"name": "Corentin Coulais"}, {"name": "Jasper van Wezel"}], "featured_authors": [{"name": "Amber Visser"}, {"name": "Viktor Könye"}, {"name": "Oleg Janson"}, {"name": "Jeroen van den Brink"}, {"name": "Corentin Coulais"}, {"name": "Jasper van Wezel"}], "author_count": 6}, {"id": "2604.18412", "category": "cond-mat", "title": "Transition path sampling in Ising models on heterogeneous graphs", "abstract": "Activated transitions have rates that are often exponentially small in system size. Extracting the associated activation barriers is challenging in practice, especially in the deeply metastable regimes and in the presence of disorder. Here, we use transition path sampling to evaluate transition probabilities between ferromagnetic states in the Ising model on finite sparse random graphs, which are perhaps the simplest example of a disordered system with metastable states. To interpret the transient onset of the transition probability curve, we introduce a minimal three-state kinetic description that highlights the role of intermediate configurations. We validate the method on the heterogeneous Zachary Karate Club network, where distinct dynamical regimes emerge as temperature varies. We then apply the method to random regular graphs and Erdős-Rényi graphs, showing that sample-to-sample fluctuations are weak in the former but that quenched topological disorder induces sizable instance variability in the latter. For Erdős-Rényi graphs, we introduce an instance-dependent temperature rescaling that restores a consistent finite-size scaling of dynamical rates and enables a direct comparison with the corresponding static free-energy barrier.", "url": "https://arxiv.org/abs/2604.18412", "type": "理论+数值", "summary": "1. 该工作将过渡路径采样方法应用于有限稀疏随机图上的伊辛模型，以计算铁磁态间的跃迁概率，并在异质扎卡里空手道俱乐部网络上进行了验证。\n2. 其核心在于引入了最小三态动力学描述以解释跃迁曲线的瞬态起始行为，并揭示了淬火拓扑无序在Erdős-Rényi图中引发的显著样本间涨落。\n3. 提出的实例依赖温度重整化方案建立了动力学速率的一致有限尺寸标度，为定量比较静态自由能垒与动态行为提供了新途径。", "summary_source": "deepseek", "authors": [{"name": "Riccardo Cipolloni"}, {"name": "Federico Ricci-Tersenghi"}, {"name": "Francesco Zamponi"}], "featured_authors": [{"name": "Riccardo Cipolloni"}, {"name": "Federico Ricci-Tersenghi"}, {"name": "Francesco Zamponi"}], "author_count": 3}, {"id": "2604.18415", "category": "cond-mat", "title": "Impact of Initial Charge Distributions on the Kinetics of Charged Particle Coagulation", "abstract": "We investigate the kinetics of particle aggregation within the framework of the Smoluchowski coagulation equation, extending it to account for electrostatic interactions among charged clusters. Using a stochastic Monte Carlo implementation, we examine how different charge distributions and net system charge affect cluster growth dynamics. Electrostatic interactions are incorporated directly into the classical Brownian collision kernel, yielding charge-dependent modifications of the collision rates that may either enhance or suppress aggregation depending on the signs and magnitudes of the interacting charges. Our simulations reveal distinct regimes of growth: at intermediate times, charge heterogeneity accelerates or delays aggregation depending on the initial underlying charge distribution, while at long times the system tends toward quasi--stationary states whose properties depend on the net charge. Comparisons between Gaussian and Cauchy--Lorentz initial charge statistics highlight the role of heavy-tailed distributions in promoting faster cluster growth. These findings contribute to a unified understanding of coagulation kinetics in charged particulate systems, with potential implications for aerosol and astrophysical coagulation processes, volcanic ash aggregation, and clustering in industrial fluidized granular beds.", "url": "https://arxiv.org/abs/2604.18415", "type": "理论+数值", "summary": "1. 本研究将Smoluchowski凝聚方程扩展至带电粒子体系，通过随机蒙特卡罗模拟系统考察了初始电荷分布与净电荷对团簇生长动力学的影响。\n2. 其核心在于将静电相互作用直接纳入经典布朗碰撞核，揭示了电荷分布异质性在中等时间尺度可加速或延缓凝聚，而重尾分布（如柯西-洛伦兹统计）显著促进团簇快速增长。\n3. 该结果为带电气溶胶、天体物理凝聚过程及工业流化颗粒床等体系提供了统一的动力学理解框架，并为相关跨尺度模拟与实验设计指明了方向。", "summary_source": "deepseek", "authors": [{"name": "Gustavo Castillo"}, {"name": "Nicolás Mujica"}], "featured_authors": [{"name": "Gustavo Castillo"}, {"name": "Nicolás Mujica"}], "author_count": 2}, {"id": "2604.18428", "category": "cond-mat", "title": "Moire Control of Alterelectric Quadrupolar Order", "abstract": "Alterelectricity is a compensated ferroic state in which quadrupolar electronic order reshapes low-energy electronic structure without producing a net polarization. Here we show that a moiré superlattice can turn such order into a controllable phase. Within a Bloch-periodic two-orbital theory, the slowly varying interlayer registry is coarse-grained into an effective moiré field acting on a self-consistent two-component alterelectric quadrupole. The resulting phase develops above a strongly filling-dependent instability threshold and crosses over from a weakly selected regime into a robust axial-dominated ground state, while the diagonal-dominated branch remains only a weak competitor. A registry-phase sweep supplies an explicit continuous path through internal quadrupole space, demonstrating that the moiré superlattice does more than stabilize alterelectricity: it steers its internal orientation. This orientational selection is encoded directly in the redistribution of low-energy spectral weight across the moiré Brillouin zone. These results identify moiré superlattices as a generic route to controllable alterelectric order and to programmable anisotropic electronic functionality.", "url": "https://arxiv.org/abs/2604.18428", "type": "理论", "summary": "1. 该工作基于Bloch周期双轨道理论，证明了莫尔超晶格能将改变电极化四极子序转变为可控相，并通过粗粒化层间登记为有效莫尔场实现调控。\n2. 其物理核心在于莫尔场可定向操控自洽双分量四极子的内部取向，导致填充依赖的相变阈值和轴向主导基态，且此取向选择直接编码于莫尔布里渊区低能谱权重的再分布。\n3. 这确立了莫尔超晶格作为实现可控改变电序和可编程各向异性电子功能的通用途径，为相关量子材料设计与实验研究提供了明确理论框架。", "summary_source": "deepseek", "authors": [{"name": "Alejandro Lopez-Bezanilla"}], "featured_authors": [{"name": "Alejandro Lopez-Bezanilla"}], "author_count": 1}, {"id": "2604.18451", "category": "cond-mat", "title": "Bose metal near pair-density-wave order in a spin-orbit-coupled Kondo lattice", "abstract": "We show that a three-dimensional superconductor with a non-Abelian SU(2) order parameter can support an extended resistive regime a Bose metal, in which transport is carried by bosonic electron-Majorana bound states - separating a uniform superconductor from a pair-density-wave (PDW) phase. The setting is a solvable Kondo lattice model introduced previously by the present authors, in which Kondo screening of a Yao-Lee $\\mathbb{Z}_2$ spin liquid generates an order parameter with SU(2), rather than conventional U(1), symmetry, containing both superconducting and spin-density-wave components. Two effects cooperate to make fluctuations anomalously strong in three dimensions: the vanishing of the quadratic superconducting stiffness near the Lifshitz point where the optimal pairing momentum shifts from zero to finite $Q$, and the enlarged SU(2) order-parameter manifold. Building on our prior result that doping away from half-filling drives amplitude-modulated PDW order via finite-momentum electron-Majorana condensation, we analyze the fluctuation-dominated regime above that phase using a nonlinear sigma model. We find that the order-parameter propagator develops a ring of soft modes throughout the disordered phase, and that the resulting resistivity scales approximately as $R \\sim T^3$ in three dimensions.", "url": "https://arxiv.org/abs/2604.18451", "type": "理论", "summary": "1. 该工作理论分析了一个三维自旋轨道耦合Kondo晶格模型，揭示了在SU(2)序参数下存在一个介于均匀超导与配对密度波（PDW）相之间的扩展电阻态——玻色金属。\n2. 其核心物理机制在于，在Lifshitz点附近，超导刚度消失与扩大的SU(2)序参数流形协同作用，即使在三维下也导致了异常强烈的涨落，使得序参数传播子在整个无序相中出现软模环。\n3. 由此计算得出的电阻率近似满足$R \\sim T^3$标度律，这为在强涨落体系中探索超越传统费米液体理论的关联金属态提供了新的理论范式。", "summary_source": "deepseek", "authors": [{"name": "Piers Coleman"}, {"name": "Aaditya Panigrahi"}, {"name": "Alexei Tsvelik"}], "featured_authors": [{"name": "Piers Coleman"}, {"name": "Aaditya Panigrahi"}, {"name": "Alexei Tsvelik"}], "author_count": 3}, {"id": "2604.18523", "category": "cond-mat", "title": "BBP transition and the leading eigenvector of the spiked Wigner model with inhomogeneous noise", "abstract": "The spiked Wigner ensemble is a prototypical model for high-dimensional inference. We study the spectral properties of an inhomogeneous rank-one spiked Wigner model in which the variance of each entry of the noise matrix is itself a random variable. In the high-dimensional limit, we derive exact equations for the spectral edges, the outlier eigenvalue, and the distribution of the components of the outlier eigenvector. These equations determine the BBP transition line that separates the gapped phase, where the signal is detectable, from the gapless phase. In the gapped regime, the distribution of the outlier eigenvector provides a natural estimator of the spike. We solve the equations for a noise matrix whose variances are generated from a truncated power-law distribution. In this case, the BBP transition line is non-monotonic, showing that an inhomogeneous noise can enhance signal detectability.", "url": "https://arxiv.org/abs/2604.18523", "type": "理论", "summary": "1. 该工作研究了具有非均匀噪声的秩一尖峰Wigner模型的谱性质，推导了高维极限下谱边缘、离群特征值及其特征向量分量分布的精确方程。\n2. 通过求解截断幂律分布噪声方差情形，发现BBP相变线呈非单调性，揭示了非均匀噪声结构可增强信号可探测性这一反直觉物理机制。\n3. 这一结果为高维统计推断提供了新的理论基准，对设计鲁棒信号恢复算法及理解复杂噪声环境中的相变现象具有明确启示。", "summary_source": "deepseek", "authors": [{"name": "Leonardo S. Ferreira"}, {"name": "Fernando L. Metz"}], "featured_authors": [{"name": "Leonardo S. Ferreira"}, {"name": "Fernando L. Metz"}], "author_count": 2}, {"id": "2604.18524", "category": "cond-mat", "title": "Photoinduced orbital polarization and Jahn-Teller effect in RNiO$_3$", "abstract": "The orbital degree of freedom in rare-earth nickelates is typically inactive across the temperature-driven metal-insulator transition, where the system develops two inequivalent Ni sites associated with Ni-O bond disproportionation and breathing-mode distortions of NiO$_6$ octahedra. Here, we show that orbital polarization can be induced by optical excitation with linearly polarized light. Using an interacting multiband tight-binding model combined with real-time simulations of coupled electron-ion-spin dynamics, we find that photoinduced $d$-$d$ transitions reduce the local magnetic moments at Ni sites and effectively suppress Hund's coupling $J$ in the excited state. Importantly, these transitions can be made strongly orbital-selective by tuning the light polarization, leading to an imbalance in $e_g$ orbital occupancies. The resulting nonequilibrium state, characterized by reduced effective $J$ and unequal orbital populations, becomes unstable toward Jahn-Teller (JT) distortions, driving structural relaxation along coherently excited JT modes. Our results demonstrate that polarization-controlled optical excitation provides a pathway to access hidden nonthermal phases with emergent orbital order, enabling coherent control of coupled charge, spin, and lattice degrees of freedom on ultrafast timescales.", "url": "https://arxiv.org/abs/2604.18524", "type": "理论+数值", "summary": "1. 本论文通过构建相互作用多带紧束缚模型并结合实时电子-离子-自旋动力学模拟，系统研究了线性偏振光在稀土镍酸盐RNiO$_3$中诱导轨道极化及触发Jahn-Teller效应的非平衡动力学过程。\n2. 其核心物理卖点在于利用光偏振调控实现轨道选择性的d-d跃迁，有效抑制激发态中的Hund耦合并导致e_g轨道占据失衡，从而驱动非平衡态失稳并引发相干Jahn-Teller模式的结构弛豫。\n3. 这为在超快时间尺度上相干操控电荷、自旋和晶格自由度提供了新途径，并为探索具有涌现轨道序的隐藏非热相及其在光控量子材料中的应用奠定了理论基础。", "summary_source": "deepseek", "authors": [{"name": "Sangeeta Rajpurohit"}, {"name": "Sheikh Rubaiat Ul Haque"}, {"name": "Aaron M. Lindenberg"}, {"name": "Peter E. Blöchl"}, {"name": "Tadashi Ogitsu1"}], "featured_authors": [{"name": "Sangeeta Rajpurohit"}, {"name": "Sheikh Rubaiat Ul Haque"}, {"name": "Aaron M. Lindenberg"}, {"name": "Peter E. Blöchl"}, {"name": "Tadashi Ogitsu1"}], "author_count": 5}, {"id": "2604.18528", "category": "cond-mat", "title": "Emergent nonreciprocity in open thermodynamically-consistent chemical reaction networks", "abstract": "Nonreciprocity, a hallmark of nonequilibrium systems, can generate dynamics not possible near thermodynamic equilibrium, including oscillatory and rotating patterns. The onset of temporal oscillations is often evident in linearized dynamics, where nonreciprocity appears as complex eigenvalues of an asymmetric Jacobian. Here, we show that the topology of open, thermodynamically-consistent chemical reaction networks can result in oscillatory instabilities near nonequilibrium steady states. These instabilities arise from chemostat-induced breaking of Onsager reciprocity, while the local equilibrium hypothesis preserves the variational structure of the dissipative part of the dynamics. Numerical results confirm that such nonreciprocity in reaction-diffusion systems produces oscillatory dynamics that nevertheless minimize a free energy.", "url": "https://arxiv.org/abs/2604.18528", "type": "数值", "summary": "1. 本工作研究了开放、热力学一致化学反应网络的拓扑结构如何导致非平衡定态附近的振荡不稳定性。\n2. 其核心机制在于化学静置打破了昂萨格互易关系，同时局域平衡假设保留了动力学耗散部分的变分结构。\n3. 该结果为理解反应扩散系统中非互易性如何产生自由能最小化的振荡动力学提供了理论基础。", "summary_source": "deepseek", "authors": [{"name": "Daniel Evans"}, {"name": "Yizhi Shen"}, {"name": "Ahmad K. Omar"}], "featured_authors": [{"name": "Daniel Evans"}, {"name": "Yizhi Shen"}, {"name": "Ahmad K. Omar"}], "author_count": 3}, {"id": "2604.18582", "category": "cond-mat", "title": "Magnetism and symmetry of superconducting gap in LaFeAsO from dynamical mean-field theory", "abstract": "By employing a combined method of density functional theory and dynamical mean field theory (DFT+DMFT) we investigate the effect of electronic correlations on the magnetic and superconducting properties of the iron-based parent compound LaFeAsO. We find that the static non-local susceptibility $\\chi({\\bf q})$ exhibits a peak at the in-plane wave vector ${\\mathbf Q}=(\\pi,\\pi)$, which is strongly enhanced upon inclusion of the vertex corrections in the ladder approximation, leading to magnetic instability. Considering the eigenfunctions of the Bethe-Salpeter equation with the vertex, obtained within the second order perturbation theory, as well as the ladder approach containing dynamic interaction vertices, in agreement with earlier weak-coupling-based studies of LaFeAsO, we obtain a close competition between $d$-wave and $s_{\\pm}$ order parameters, dominating in the second-order and ladder approach, respectively. We argue that the dominating $s_{\\pm}$ instability in the ladder DFT+DMFT approach is related to the reduced degree of magnetic frustration by itinerant degrees of freedom due to only partially formed local magnetic moments. Our study shows that dynamic correlation effects do not change the type of the leading superconducting instability in LaFeAsO.", "url": "https://arxiv.org/abs/2604.18582", "type": "理论+数值", "summary": "1. 本研究采用密度泛函理论与动态平均场理论相结合的方法，系统探究了铁基母体化合物LaFeAsO中电子关联对其磁性与超导对称性的影响。\n2. 通过引入顶点修正的阶梯近似，静态非局域磁化率在波矢(π,π)处峰值增强并导致磁不稳定性，且该近似下s±波序参量因部分局域磁矩减少磁性挫折而占主导，与二阶微扰中的d波形成竞争。\n3. 该结果表明动态关联效应未改变LaFeAsO中主导的超导不稳定性类型，这为理解铁基超导体中s±波配对的稳健性提供了理论依据。", "summary_source": "deepseek", "authors": [{"name": "S. L. Skornyakov"}, {"name": "V. I. Anisimov"}, {"name": "A. A. Katanin"}], "featured_authors": [{"name": "S. L. Skornyakov"}, {"name": "V. I. Anisimov"}, {"name": "A. A. Katanin"}], "author_count": 3}, {"id": "2604.16673", "category": "hep-th", "title": "Fermion Zero Modes and Fermion number $1/2$ of the Electroweak Monopole", "abstract": "Fermion bound states in the background of the electroweak SU(2) monopole are investigated for various values of gauge coupling constant $g$, the Higgs self-coupling constant $\\lambda$, and the Yukawa coupling constant $y_q$. Numerical solutions to the set of coupled differential equations for various selected points in the parameter space reveal only a zero mode, for which we also present an analytic argument. We show that the monopole profile functions and the zero mode wave function become more localized with increasing $g$ and $\\lambda$, while the right-handed component of the latter decreases with $g$. However, as expected, this component increases with $y_q$. We find that the zero mode in the limit $g\\to 0$ differs from the zero mode held by the Higgs alone, highlighting the nonlinear and nonperturbative character of the system. Finally, we prove the spectral mirror symmetry of the fermion, whence, together with the existence of the zero mode, we infer the fermion number $1/2$ of the electroweak monopole.", "url": "https://arxiv.org/abs/2604.16673", "type": "理论", "summary": "1. 该工作通过数值求解耦合微分方程组并结合解析讨论，系统研究了不同规范耦合常数g、希格斯自耦合常数λ与汤川耦合常数y_q下电弱SU(2)单极子背景中的费米子束缚态。\n2. 研究揭示了系统仅存在一个零模，其波函数局域化程度随g和λ增大而增强，且零模的右旋分量随g增大而减小、随y_q增大而增大，并基于谱镜像对称性与零模存在性严格推导出电弱单极子具有半整数费米子数1/2。\n3. 这一结论将拓扑缺陷的拓扑电荷与分数费米子数直接关联，为理解非微扰场论体系中拓扑结构与量子数的分数化机制提供了明确例证与理论框架。", "summary_source": "deepseek", "authors": [{"name": "P. E. Mogaddam"}, {"name": "S. S. Gousheh"}], "featured_authors": [{"name": "P. E. Mogaddam"}, {"name": "S. S. Gousheh"}], "author_count": 2}, {"id": "2604.16977", "category": "hep-th", "title": "Krylov complexity for Lin-Maldacena geometries and their holographic duals", "abstract": "We compute the rate of growth of operator size in matrix models by probing the Lin-Maldacena class of geometries with classical probes. We consider massive point particle probes whose proper momentum equals the size of the gauge invariant operator in the matrix model. We work out the example of the BMN Plane Wave Matrix Model using the electrostatic approach and the method of background fluxes. We also work out complexities in the D2 brane as well as NS5 brane limits of the BMN matrix model along with an example of the irrelevant deformation namely the non-Abelian T-dual of $AdS_5 \\times S^5$. Finally, we carry out a possible calculation of the Krylov complexity on the matrix model counterpart by using a simple reduction ansatz known as the pulsating fuzzy sphere model. We outline an algorithm to define Krylov basis elements for the matrix model and compute a few Lanczos coefficients. Our analysis reveals that both the Krylov basis states as well as Lanczos coefficients are uniquely fixed in terms of the mass parameter of the matrix model.", "url": "https://arxiv.org/abs/2604.16977", "type": "理论", "summary": "1. 该工作通过经典探针计算Lin-Maldacena几何中矩阵模型的算子尺寸增长率，并对应计算了对偶场论中的Krylov复杂度。\n2. 技术关键在于使点粒子探针的固有动量精确对应规范不变算子的尺寸，并利用静电学方法与背景通量法处理BMN平面波矩阵模型等实例。\n3. 这为全息对偶框架下Krylov复杂度与矩阵模型参数间的具体对应关系建立了可操作的计算方案。", "summary_source": "deepseek", "authors": [{"name": "Dibakar Roychowdhury"}], "featured_authors": [{"name": "Dibakar Roychowdhury"}], "author_count": 1}, {"id": "2604.17216", "category": "hep-th", "title": "Bubble dynamics and vortex formation in holographic first-order superfluid phase transitions", "abstract": "We investigate bubble dynamics in a holographic superfluid undergoing a first-order phase transition with spontaneous $U(1)$ symmetry breaking. Near the nucleation threshold, the system exhibits universal critical behavior governed by a single unstable mode, leading to logarithmic scaling of the time spent near the critical solution. The terminal bubble wall velocity increases with charge density but remains small due to strong dissipation. In multi-bubble collisions, vortex formation depends sensitively on the initial phases and deviates significantly from the geodesic rule. Notably, we identify a regime where three-bubble collisions produce a vortex-antivortex pair that subsequently annihilates, a phenomenon not predicted by the geodesic rule. The lifetime of this pair scales logarithmically with the distance to the critical collision radius. Our results underscore the crucial role of non-equilibrium dynamics in strongly coupled superfluids and provide new insights into topological defect formation during first-order phase transitions.", "url": "https://arxiv.org/abs/2604.17216", "type": "理论", "summary": "1. 该工作通过全息方法研究了一阶相变中超流体气泡动力学与涡旋形成。\n2. 研究发现多气泡碰撞中涡旋生成显著偏离测地线规则，并揭示了临界碰撞半径附近涡旋-反涡旋对寿命的对数标度行为。\n3. 这为强耦合超流体非平衡动力学及其拓扑缺陷形成机制提供了新的理论视角。", "summary_source": "deepseek", "authors": [{"name": "Zhen-han Jin"}, {"name": "Yu-ping An"}, {"name": "Li Li"}], "featured_authors": [{"name": "Zhen-han Jin"}, {"name": "Yu-ping An"}, {"name": "Li Li"}], "author_count": 3}, {"id": "2604.17449", "category": "hep-th", "title": "Refined 3D index", "abstract": "We introduce a refined version of the 3D index for 3-manifolds, building on the construction of the 3D $\\mathcal{N}=2$ gauge theory $T[M]$ by Dimofte-Gaiotto-Gukov and Gang-Yonekura. The refined index is a superconformal index of $T[M]$ equipped with additional gradings that capture enhanced flavor symmetries of the effective theory. Our construction is based on a Dehn surgery presentation of $M$ in terms of an ideally triangulated link complement $N$. We derive an explicit infinite-sum formula for the refined index and provide nontrivial checks in representative examples, supporting its invariance under changes of triangulation, Dehn surgery presentation, and other auxiliary data. As a strictly stronger invariant, the refined index enables finer distinctions among 3-manifolds and among distinct IR phases of the associated gauge theories. We also introduce a computational tool, \\textsc{Refined Index Calculator}, for its explicit evaluation.", "url": "https://arxiv.org/abs/2604.17449", "type": "理论", "summary": "1. 该工作基于Dimofte-Gaiotto-Gukov与Gang-Yonekura的3D $\\mathcal{N}=2$规范理论$T[M]$构造，为三维流形引入了一个具有额外分级的精细化三维指标。\n2. 其核心在于通过理想三角化的链环补空间$N$的Dehn手术表示，导出了该细化指标的显式无穷级数公式，并严格证明了其对三角剖分、手术表示等辅助数据的不变性。\n3. 这一更强大的不变量能更精细地区分三维流形及相关规范理论的不同红外相，同时其附带的计算工具\\textsc{Refined Index Calculator}为具体计算提供了实用方案。", "summary_source": "deepseek", "authors": [{"name": "Dongmin Gang"}, {"name": "Kibok Jeong"}, {"name": "Taeyoon Kim"}, {"name": "Soochang Lee"}], "featured_authors": [{"name": "Dongmin Gang"}, {"name": "Kibok Jeong"}, {"name": "Taeyoon Kim"}, {"name": "Soochang Lee"}], "author_count": 4}, {"id": "2604.17491", "category": "hep-th", "title": "A Note on Coadjoint Orbits for Multifermion Systems", "abstract": "The coadjoint orbit action for a multifermion system, as an exact description of its dynamics, is considered. A parametrization of the variables involved is given which facilitates the approximation of this by another coadjoint orbit action suitable for expansions around the Fermi surface, recovering various actions which have been used in previous literature. The presentation of this in terms of functions on phase space with star-products as well as further truncations are briefly considered.", "url": "https://arxiv.org/abs/2604.17491", "type": "理论", "summary": "1. 该工作研究了多费米子系统的余伴随轨道作用，并给出了相关变量的参数化方案。\n2. 其技术核心在于该参数化便于将精确动力学近似为适用于费米面附近展开的余伴随轨道作用，从而统一了文献中的多种有效作用量。\n3. 这为基于相空间函数与星乘表述的进一步理论截断与推广提供了清晰的框架基础。", "summary_source": "deepseek", "authors": [{"name": "V.P. Nair"}], "featured_authors": [{"name": "V.P. Nair"}], "author_count": 1}, {"id": "2604.17583", "category": "hep-th", "title": "Electromagnetic Wightman functions and vacuum densities for a brane intersecting the AdS boundary", "abstract": "We investigate the combined effects of a brane intersecting the AdS boundary and background gravitational field on the local characteristics of the electromagnetic vacuum. Two types of boundary conditions on the brane are considered, which are higher-dimensional generalizations of the perfect electric (PEC) and perfect magnetic (PMC) boundary conditions in Maxwell's electrodynamics. The brane-induced contributions to the Wightman functions of the vector potential and field tensor are explicitly extracted. Simple expressions in terms of elementary functions are provided. The behavior of the vacuum expectation values (VEVs) is mimicked by a scalar field with a negative effective mass squared determined by the radius of the AdS spacetime. The expectation values of the electric and magnetic fields squares and of the energy-momentum tensor are investigated as local characteristics of the vacuum state. The brane-induced contributions to these VEVs have opposite signs for the PEC and PMC conditions. For the PMC condition, this contribution is negative for the electric field squared and positive for the magnetic field squared. The VEV of the energy-momentum tensor has a nonzero off-diagonal component. The brane-induced vacuum energy density is positive for PMC condition, whereas the normal and parallel stresses change sign as functions of the distance from the brane. Unlike the problem involving a planar boundary in the Minkowski bulk, the vacuum energy-momentum tensor does not vanish in (3+1)-dimensional AdS spacetime.", "url": "https://arxiv.org/abs/2604.17583", "type": "理论", "summary": "1. 本研究计算了在AdS时空中与边界相交的brane及背景引力场共同作用下，电磁真空的Wightman函数与局域真空期望值（如电场平方、磁场平方及能量-动量张量）。\n2. 其核心在于明确提取了brane对Wightman函数的贡献，揭示了PEC与PMC边界条件下真空期望值符号相反的特性，并发现能量-动量张量存在非对角分量及PMC条件中真空能量密度为正。\n3. 这为AdS几何中量子场论的局域效应、高维边界条件在引力背景下的角色，以及相关全息或凝聚态模拟实验提供了定量参考与理论依据。", "summary_source": "deepseek", "authors": [{"name": "A. A. Saharian"}, {"name": "R. M. Avagyan"}, {"name": "V. F. Manukyan"}], "featured_authors": [{"name": "A. A. Saharian"}, {"name": "R. M. Avagyan"}, {"name": "V. F. Manukyan"}], "author_count": 3}, {"id": "2604.17649", "category": "hep-th", "title": "Holography and Optimal Transport: Emergent Wasserstein Spacetime in Harmonic Oscillator, SYK and Krylov Complexity", "abstract": "Optimal transport and Wasserstein distance are prominent tools to quantify the space of probability distributions. From a novel viewpoint of manifold hypothesis in machine learning being a possible guide for the holographic principle, we study how holographic spacetime can emerge from quantum systems in general as a Wasserstein space through optimal transport. We employ the simplest example of a single quantum harmonic oscillator and demonstrate that, among various definitions of distance, the manifold hypothesis selects the 1-Wasserstein distance of optimal transport between Husimi Q-representations of states, and it gives rise to an emergent space. Furthermore, the Lindblad time evolution of the harmonic oscillator coupled to a bath, of the form of a Fokker-Planck equation, provides a time trajectory in the Wasserstein space, yielding an emergent Wasserstein spacetime that shares properties with black hole spacetimes and their event horizons. The methodology is applied to a Lindbladian subsystem of SYK model, revealing that the Wasserstein space is consistent with the AdS${}_2$ black hole geometry of the standard holographic dictionary. We remark that, in our examples, the 1-Wasserstein distance is identified as a generalized Krylov complexity, and argue that optimal transport with the manifold hypothesis can yield general emergent spacetimes, positioning the holographic principle on a broader basis.", "url": "https://arxiv.org/abs/2604.17649", "type": "理论", "summary": "1. 该工作基于机器学习中的流形假设，探究全息时空如何通过最优传输从量子系统（如单量子谐振子与SYK模型）中作为Wasserstein空间涌现。\n2. 其核心在于流形假设优选了状态Husimi Q表示间的1-Wasserstein距离，Lindblad演化以Fokker-Planck方程形式提供时间轨迹，所涌现的时空与黑洞几何一致且被识别为广义Krylov复杂度。\n3. 这为利用最优传输和流形假设构建一般涌现时空奠定了普适框架，从而拓宽了全息原理的物理基础，并连通了量子复杂度与几何结构。", "summary_source": "deepseek", "authors": [{"name": "Koji Hashimoto"}, {"name": "Norihiro Tanahashi"}], "featured_authors": [{"name": "Koji Hashimoto"}, {"name": "Norihiro Tanahashi"}], "author_count": 2}, {"id": "2604.17743", "category": "hep-th", "title": "Holographic Schwinger Effect In a Step Dilaton Background", "abstract": "We investigate the holographic Schwinger effect in a confining background with a step dilaton profile, which induces a sharp transition between ultraviolet and infrared regimes and provides a qualitatively distinct realization of confinement. Within this framework, the quark--antiquark potential is extracted from the classical configuration of a fundamental string, allowing for a direct analysis of vacuum instability and pair production. In the absence of a magnetic field, the step dilaton leads to a significantly sharper suppression of the potential barrier as the electric field increases, implying an enhanced sensitivity of the critical electric field compared to smooth soft-wall models and demonstrating that the abrupt geometric transition qualitatively enhances the onset of vacuum decay. Incorporating an external magnetic field through the Dirac--Born--Infeld action, we find a nontrivial and amplified deformation of the potential barrier, resulting in a pronounced shift of the critical electric field that depends on both the magnitude and orientation of the magnetic field. Overall, the step dilaton background exhibits a substantially stronger response of the Schwinger effect to external electromagnetic fields than conventional soft-wall models, providing a novel mechanism for controlling pair production and highlighting the crucial role of dilaton structure in non-perturbative dynamics of holographic QCD.", "url": "https://arxiv.org/abs/2604.17743", "type": "理论", "summary": "1. 该工作在全息QCD框架下，研究了具有阶梯状伸缩子背景的禁闭时空中非微扰的施温格效应，并分析了外电磁场的影响。\n2. 其核心发现在于，阶梯状几何过渡导致势垒随电场增强被更急剧地压制，且外磁场会以依赖于其大小和方向的非平庸方式显著移动临界电场。\n3. 这揭示了伸缩子结构对非微扰动力学的关键作用，为通过几何设计调控对产生速率和探究强耦合区量子真空不稳定性提供了新机制。", "summary_source": "deepseek", "authors": [{"name": "Sara Tahery"}, {"name": "Qin Chang"}], "featured_authors": [{"name": "Sara Tahery"}, {"name": "Qin Chang"}], "author_count": 2}, {"id": "2604.17975", "category": "hep-th", "title": "Localisation of $\\mathcal{N} = (2,2)$ theories on spindles of both twists", "abstract": "We consider two-dimensional $\\mathcal{N}=(2,2)$ supersymmetric field theories living on a spindle $\\mathbb{WCP}_{[n_1,n_2]}^1$. Starting from the spindle solutions of five-dimensional STU gauged supergravity, we construct theories on a spindle which preserve supersymmetry via either the twist or anti-twist mechanism and admit two Killing spinors of opposite R-charge. While the study of field theories on anti-twisted spindles has already been undertaken in some detail, the advantage of our approach allows for the derivation of analogous results in the twist case. We apply the technique of supersymmetric localisation to compute the exact partition function for a theory consisting of an abelian vector multiplet and a charged chiral multiplet in the presence of a Fayet-Iliopoulos term. We compare and contrast the results for the twisted and anti-twisted spindle and find a general formula which encompasses the partition function for both cases simultaneously.", "url": "https://arxiv.org/abs/2604.17975", "type": "理论", "summary": "1. 该工作通过五维STU规范超引力的纺锤解，构建了同时支持扭曲与反扭曲机制的二维N=(2,2)超对称场论，并利用超对称局域化计算了含菲亚特-伊利亚波罗项的U(1)向量多重态与带电手征多重态配分函数。\n2. 其方法创新性地统一处理了纺锤背景的两种超对称保全机制，推导出可同时涵盖扭曲与反扭曲情况的普适配分函数封闭表达式。\n3. 这为高维超引力解诱导的缺陷场论研究建立了系统框架，并为探讨拓扑扭曲与反扭曲机制的对偶关系提供了精确的可计算模型。", "summary_source": "deepseek", "authors": [{"name": "Imtak Jeon"}, {"name": "Hyojoong Kim"}, {"name": "Nakwoo Kim"}, {"name": "Aaron Poole"}, {"name": "Augniva Ray"}], "featured_authors": [{"name": "Imtak Jeon"}, {"name": "Hyojoong Kim"}, {"name": "Nakwoo Kim"}, {"name": "Aaron Poole"}, {"name": "Augniva Ray"}], "author_count": 5}, {"id": "2604.18004", "category": "hep-th", "title": "Eikonal, nonlocality and regular black holes", "abstract": "We investigate the leading gravitational eikonal in nonlocal $D$ dimensional theories of gravity. We analyze the simplest cases of $2\\rightarrow2$ massless and massive scalar scattering at tree level, studying the effects of nonlocal form factors in the gravitational sector. We give an interpretation of our results in terms of geodesic motion in effective generalized Aichelburg-Sexl geometries for the massless case, and in smeared linearized Schwarzschild metrics for the massive case in the probe limit. Combining our results for the geometries at linearized level with general requirements about the behaviour of the solutions in the core, we propose a nonlinear completion of the geometries. The resulting spacetimes describe singularity-free, asymptotically flat deformations of the Schwarzschild solution with a de Sitter core. We also analyze the main geometric and thermodynamic features of these solutions.", "url": "https://arxiv.org/abs/2604.18004", "type": "理论", "summary": "1. 该工作研究了D维非局域引力理论中的领头阶引力eikonal，通过分析2→2无质量和有质量标量散射的树图效应，并在线性化水平上结合核心区行为的一般要求，提出了非线性完备的时空几何。\n2. 其核心在于将无质量情形下的散射结果解释为有效广义Aichelburg-Sexl几何中的测地运动，对有质量探针极限则对应涂抹化的线性化史瓦西度规，由此构建出具有de Sitter核心、渐进平坦且无奇点的史瓦西变形解。\n3. 这些正则黑洞解为在非局域引力框架下研究奇点消除、几何结构及热力学性质提供了自洽的理论范例，并为相关散射计算与时空构造建立了具体联系。", "summary_source": "deepseek", "authors": [{"name": "Mariano Cadoni"}, {"name": "Lorenzo Herres"}, {"name": "Leonardo Modesto"}, {"name": "Lorenzo Orlando"}, {"name": "Mirko Pitzalis"}], "featured_authors": [{"name": "Mariano Cadoni"}, {"name": "Lorenzo Herres"}, {"name": "Leonardo Modesto"}, {"name": "Lorenzo Orlando"}, {"name": "Mirko Pitzalis"}], "author_count": 5}, {"id": "2604.18030", "category": "hep-th", "title": "Yukawa scalar self energy at two loop and $\\langle ϕ^2 \\rangle$ in the inflationary de Sitter spacetime", "abstract": "We have considered the Yukawa theory at two loop in the inflationary de Sitter spacetime, for a massless minimally coupled scalar and a massless fermion. The one loop computation for the same has been investigated in detail in the earlier literatures. The chief motivation behind this study is the fact that at one loop, the scalar self energy contains only fermions, which are conformally invariant. At two loop, there are two diagrams, each containing one internal scalar line, thereby breaking the conformal invariance. This should result in the appearance of infrared secular logarithms in the scalar self energy. The renormalisation of this two loop self energy has been performed. We next compute the loop corrected coincident two point correlation function, $\\langle \\phi^2\\rangle$, due to the self energies. The expectation value has been taken with respect to the initial Bunch-Davies vacuum. We argue that the late time secular contribution from the local or UV self energy must dominate the non-local or IR ones in the present case, from the point of view of the powers of these large logarithms of the scale factor. This corresponds to the fact that fermion lines do not show any IR secular effect. The leading behaviour of $\\langle \\phi^2\\rangle$ at one and two loop are respectively found to be $\\ln^3 a$ and $\\ln^4 a$. These are hybrids of UV and IR logarithms, where the latter originate from the massless and minimal two external scalar lines. A resummed expression for $\\langle \\phi^2\\rangle$ has also been computed. The same is found to be bounded and decreasing monotonically with the increasing magnitude of the Yukawa coupling. Accordingly, the dynamically generated scalar mass increases with the increasing coupling.", "url": "https://arxiv.org/abs/2604.18030", "type": "理论", "summary": "1. 本文在暴胀德西特时空中，对包含无质量最小耦合标量场与无质量费米子的Yukawa理论进行了两圈计算，完成了自能的重整化并计算了圈修正后的两点关联函数〈φ²〉。\n2. 核心在于揭示两圈图因内含标量传播子而破坏共形不变性，导致自能中出现红外 secular 对数项，且紫外自能的 late time 主导贡献使〈φ²〉的一圈与两圈主导行为分别表现为 ln³a 与 ln⁴a。\n3. 所得到的重求和技术方案表明〈φ²〉随 Yukawa 耦合增大单调递减且有界，这为理解暴胀时空中标量场质量的动力学生成机制提供了明确的理论依据。", "summary_source": "deepseek", "authors": [{"name": "Sourav Bhattacharya"}, {"name": "Moutushi Dutta Choudhury"}], "featured_authors": [{"name": "Sourav Bhattacharya"}, {"name": "Moutushi Dutta Choudhury"}], "author_count": 2}, {"id": "2604.18114", "category": "hep-th", "title": "On the frame-like multispinor formalism for massive higher spins in d=4", "abstract": "In this paper, we fill some gap in the existing literature on higher spins by presenting an explicit solution to the on-shell constraints for a frame-like, gauge invariant description of massive, higher spin fields in d=4. We begin with the massive spin 2 and massive spin 5/2 as simple illustrations, and then consider arbitrary integer and half-integer spin. We also show that our results allow us to find explicit solutions to the so-called unfolded equations that determine all higher-order derivatives of the physical field that are non-zero on-shell.", "url": "https://arxiv.org/abs/2604.18114", "type": "理论", "summary": "1. 该工作为四维时空中的有质量高自旋场，提供了显式求解框架式规范描述中壳约束的完整方案。\n2. 其技术核心在于统一处理整数与半整数自旋，并建立了与决定物理场高阶导数的展开方程之间的显式联系。\n3. 这一显式构造为高自旋理论中更复杂的相互作用研究与实际计算奠定了坚实基础。", "summary_source": "deepseek", "authors": [{"name": "Yu. M. Zinoviev"}], "featured_authors": [{"name": "Yu. M. Zinoviev"}], "author_count": 1}, {"id": "2604.18182", "category": "hep-th", "title": "Large-$N$ Dynamics of a QCD-Inspired Unitary Matrix Model", "abstract": "We study the large-$N$ limit of $U(N)$ and $SU(N)$ unitary matrix models inspired by QCD. The model is analyzed in two cases: $\\mu = 0$, where the potential is real, and finite $\\mu$, where it becomes complex. The complex action drives the eigenvalues into the complex plane, leading to $\\langle U \\rangle \\neq \\langle U^{-1} \\rangle$. In the ungapped phase, we obtain analytic expressions for the spectral density, Wilson loops, and free energy, which reproduce the low-temperature behaviour of QCD. In contrast, the gapped phase involves a nontrivial resolvent and is solved partially analytically and numerically. At $\\mu=0$, the model exhibits a $3^{rd}$ order phase transition, while at finite $\\mu$, it shows a continuous phase transition of at least second order.", "url": "https://arxiv.org/abs/2604.18182", "type": "理论", "summary": "1. 该工作探究了QCD启发的U(N)和SU(N)幺正矩阵模型在大N极限下的动力学，详细分析了势函数为实数（μ=0）和复数（有限μ）的两种情形。\n2. 物理创新点在于复作用量驱使本征值分布于复平面并导致⟨U⟩≠⟨U⁻¹⟩，在无隙相中解析得到谱密度、威尔逊圈和自由能以再现QCD低温特性，同时通过混合解析-数值方法处理有隙相并揭示相变阶数差异。\n3. 这为深入理解QCD低温相结构、复化学势下规范场论的相变行为以及相关矩阵模型的非微扰分析提供了明确理论启示。", "summary_source": "deepseek", "authors": [{"name": "Anuj Malik"}], "featured_authors": [{"name": "Anuj Malik"}], "author_count": 1}, {"id": "2604.18198", "category": "hep-th", "title": "Leading UV divergences of quantum corrections to Kähler superpotential in general $\\mathcal{N}=1$ chiral model", "abstract": "Using the Bogoliubov-Parasiuk theorem we derive differential equations for the sum of leading UV divergences of the Kähler potential in the general $\\mathcal{N}=1$ supersymmetric chiral theory. The obtained equations recover the limit of the renormalizable Wess-Zumino theory and also allow one to consider non-renormalizable chiral interactions. Some implications of the obtained equations are shown.", "url": "https://arxiv.org/abs/2604.18198", "type": "理论", "summary": "1. 该工作利用Bogoliubov-Parasiuk定理，导出了广义$\\mathcal{N}=1$超对称手征理论中Kähler势领头紫外发散项满足的微分方程。\n2. 其核心在于通过该方程统一处理可重整与不可重整手征相互作用，并在可重整极限下自然回归Wess-Zumino理论结果。\n3. 这为系统研究超对称有效理论中非重整化定理的量子修正及其重正化群行为提供了严格数学框架。", "summary_source": "deepseek", "authors": [{"name": "R.M. Iakhibbaev"}, {"name": "A. I. Mukhaeva"}, {"name": "D.M. Tolkachev"}], "featured_authors": [{"name": "R.M. Iakhibbaev"}, {"name": "A. I. Mukhaeva"}, {"name": "D.M. Tolkachev"}], "author_count": 3}, {"id": "2604.18405", "category": "hep-th", "title": "Large-c BCFT Entanglement Entropy with Deformed Boundaries from Emergent JT Gravity", "abstract": "We study the effect of boundary deformations on the von Neumann entropy of subregions in two-dimensional boundary conformal field theories (BCFTs) at zero and finite temperature. The deformations considered are infinitesimal global conformal transformations that move the boundary and can equivalently be viewed as the leading-order effect of certain BCFT perturbations with the boundary displacement operator. We demonstrate that at large central charge the von Neumann entropy in the presence of a deformed boundary is reproduced by the island entropy of the same interval in an undeformed BCFT acting as a bath and coupled to a gravitating spacetime. Here, the BCFT is joined to an AdS$_2$ region governed by Jackiw-Teitelboim (JT) gravity via transparent boundary conditions. The boundary condition for the dilaton field is set by the boundary deformation in the BCFT computation. Our analysis relies on mild assumptions about the spectrum and OPE coefficients of the BCFT. Notably, these conditions are consistent with an exponentially large number of light operators and are therefore weaker than those required for holographic BCFTs. This is possible since the BCFT result is not reproduced by a gravitational computation in three dimensions with an O(1) number of matter fields, but instead by a computation in two dimensions and with an O(c) number of light fields.", "url": "https://arxiv.org/abs/2604.18405", "type": "理论", "summary": "1. 该工作研究了二维边界共形场论（BCFT）在边界形变下子区域冯诺依曼熵的变化，并将其与JT引力中的岛熵计算相连接。\n2. 核心发现表明，大中心电荷下形变边界BCFT的熵可由未形变BCFT作为浴与JT引力耦合的体系通过岛屿公式精确重现，其形变信息编码于JT引力中伸缩子场的边界条件。\n3. 这一对应关系在仅需指数多轻算子谱的较弱条件下成立，为超越全息严格对应情形下的引力岛熵计算提供了可推广的理论框架。", "summary_source": "deepseek", "authors": [{"name": "Dominik Neuenfeld"}, {"name": "Christopher Tellinger"}], "featured_authors": [{"name": "Dominik Neuenfeld"}, {"name": "Christopher Tellinger"}], "author_count": 2}, {"id": "2604.18416", "category": "hep-th", "title": "Classical and quantum evolution of inflationary fluctuations", "abstract": "We compare the correlation functions of inflationary perturbations computed either with quantum or classical dynamics. Even if they are enforced to agree at a specific time during inflation, classical and quantum correlations will differ at the end of inflation, provided that interactions are relevant. The difference between the results of the classical and quantum computations is exponentially sensitive to the number of e-folds elapsed from the time of agreement. We illustrate this finding with the tree-level bispectrum of the primordial curvature fluctuation and the one-loop power spectrum of tensor modes. We also show that classical evolution from a finite time does not imply the appearance of poles in the scalar bispectrum.", "url": "https://arxiv.org/abs/2604.18416", "type": "理论", "summary": "1. 该工作比较了宇宙暴胀扰动在量子演化与经典演化下计算得到的关联函数。\n2. 其核心发现是，若存在相互作用，二者结果在暴胀末期会呈现差异，且差异随电子折叠数呈指数敏感。\n3. 这质疑了经典近似在相互作用显著区域的适用性，强调了相关计算中采用量子处理的必要性。", "summary_source": "deepseek", "authors": [{"name": "Guillermo Ballesteros"}, {"name": "Jesús Gambín Egea"}, {"name": "Alejandro Pérez Rodríguez"}], "featured_authors": [{"name": "Guillermo Ballesteros"}, {"name": "Jesús Gambín Egea"}, {"name": "Alejandro Pérez Rodríguez"}], "author_count": 3}, {"id": "2604.18488", "category": "hep-th", "title": "Branes", "abstract": "In this review branes of string theory are described from three different perspectives: as endpoints of open string, as supergravity backgrounds with BPS properties, as dynamical objects with gauge invariant actions. Based on these descriptions various effects of brane interactions are reviewed: brane bound states, Hanany--Witten and Myers effects, supertubes. The review is based on the lecture course given at MIPT.", "url": "https://arxiv.org/abs/2604.18488", "type": "理论", "summary": "1. 该综述论文从开弦端点、超引力BPS背景和规范不变作用量的动力学对象三个角度，系统阐述了弦论中膜的结构，并基于MIPT讲座课程回顾了膜相互作用的各种效应，包括膜束缚态、Hanany-Witten效应、Myers效应和超管。\n2. 其核心物理贡献在于通过整合多重描述视角，提供了一个统一框架来理解膜相互作用的关键物理行为及其在弦论中的重要性。\n3. 这为弦论和膜物理领域的教学与深入研究提供了全面的理论基础，并对探索膜动力学、量子引力及规范理论联系等未来方向具有明确启发。", "summary_source": "deepseek", "authors": [{"name": "Edvard T. Musaev"}], "featured_authors": [{"name": "Edvard T. Musaev"}], "author_count": 1}, {"id": "2604.18513", "category": "hep-th", "title": "Bosonization, vertex operators and maximal violation of the Bell-CHSH inequality in wedge regions", "abstract": "It is pointed out that the vertex operators of a chiral boson in 1+1 dimensions provide an explicit realization of dichotomic, bounded, Hermitian operators that saturate the Tsirelson bound of the Bell-CHSH inequality in the vacuum state.", "url": "https://arxiv.org/abs/2604.18513", "type": "理论", "summary": "1. 该研究揭示了在1+1维手性玻色子的楔形区域中，其顶点算符可作为二分有界厄米算符的具体实现，并在真空态下使贝尔-克劳瑟-霍恩-辛蒙尼不等式达到Tsirelson界。\n2. 其核心在于首次在具体的量子场论体系中，通过玻色化技术显式构造出满足Tsirelson饱和条件的算符，为理解量子场论中的非局域关联提供了可计算的范例。\n3. 这一结果为在弯曲时空背景下研究纠缠结构与代数量子场论的联系开辟了新途径，尤其对探讨AdS/CFT对偶中的纠缠熵与黑洞信息悖论具有启示意义。", "summary_source": "deepseek", "authors": [{"name": "J. G.A. Caribé"}, {"name": "M. S. Guimaraes"}, {"name": "I. Roditi"}, {"name": "S. P. Sorella"}], "featured_authors": [{"name": "J. G.A. Caribé"}, {"name": "M. S. Guimaraes"}, {"name": "I. Roditi"}, {"name": "S. P. Sorella"}], "author_count": 4}, {"id": "2604.16508", "category": "math-ph", "title": "Metric-Deformed Heisenberg Algebras and the $q$-Dirac Operator", "abstract": "We introduce a family of metric-deformed Heisenberg algebras $M_1$ and $M_2$, where the commutation relations are expressed directly in terms of the components of a diagonal Lorentzian metric. We show that these algebras unify several known $q$-deformed Heisenberg algebras, including the $q$-$\\hbar$ algebra, the new $q$-Heisenberg algebra, and the $q$-generalized Heisenberg algebra, which embed as special cases. Using Sylvester's theorem of inertia, we establish a connection between the metric signature and the deformation parameters. We construct a $q$-Dirac operator $D_q$ from the deformed D'Alembertian and prove that $D_q^2$ recovers the deformed Klein-Gordon operator. Furthermore, we relate this construction to the quadratic $q$-Dirac operator previously introduced by the author, providing a unified framework that bridges spacetime geometry and $q$-deformed quantum algebras.", "url": "https://arxiv.org/abs/2604.16508", "type": "理论", "summary": "1. 本文引入了由对角洛伦兹度规分量直接定义的度量变形海森堡代数家族 M_1 和 M_2，并基于此构造了 q-狄拉克算子 D_q。\n2. 核心在于利用西尔维斯特惯性定理，将度规符号与变形参数相联系，从而统一了包括 q-ħ 代数在内的多种已知 q-变形海森堡代数。\n3. 该框架为在弯曲时空几何与 q-变形量子代数之间建立更深刻的联系提供了统一的数学基础。", "summary_source": "deepseek", "authors": [{"name": "Julio César Jaramillo Quiceno"}], "featured_authors": [{"name": "Julio César Jaramillo Quiceno"}], "author_count": 1}, {"id": "2604.16631", "category": "math-ph", "title": "Quantum Reference Frames and Correlation Geometry", "abstract": "The aim of this paper is to provide a largely self-contained, compact and comprehensible introduction to the basic ideas behind correlation geometry, which underlies the theory of causal fermion system (CFS). A key focus here is on the manner in which the framework deals with gauge transformations, including diffeomorphisms via the principle of unitary equivalence. We will argue that, conceptually, the fundamental description of a physical system in terms of its correlation geometry is much closer to thermodynamics than quantum theory.", "url": "https://arxiv.org/abs/2604.16631", "type": "理论", "summary": "1. 该论文为因果费米子体系（CFS）理论基础的关联几何学提供了一个自包含、紧凑且易于理解的基本思想导论。\n2. 其核心在于阐释了该框架通过酉等价原理处理规范变换（包括微分同胚）的具体方式。\n3. 这促使人们从概念上重新思考，将关联几何视为比量子理论更接近热力学的物理系统基本描述。", "summary_source": "deepseek", "authors": [{"name": "Claudio F. Paganini"}], "featured_authors": [{"name": "Claudio F. Paganini"}], "author_count": 1}, {"id": "2604.16712", "category": "math-ph", "title": "Continuum honeycomb Schrödinger operators with incommensurate line defects", "abstract": "We study wave propagation in 2D honeycomb structures with a non-commensurate or ``irrational'' line defect or edge. Our model is a Schrödinger operator which interpolates, across the edge, between two distinct bulk (asymptotic) Hamiltonians with a common spectral gap about the ``Dirac point'' of an unperturbed honeycomb operator. We seek edge states, eigenstates that are bounded and oscillatory parallel to the edge, and decaying in the transverse direction. For non-commensurate edges, the rigorous definition of these states is nontrivial due to the lack of translation invariance along the edge. To address this, we exploit quasiperiodicity along the edge by expressing the Hamiltonian as the restriction of a 3D (degenerate elliptic) Hamiltonian describing a 3D medium with a 2D interface within which there is periodicity. Via multiscale analysis, we construct approximate edge states in this 3D setting and obtain by restriction 2D edge states which are quasiperiodic along the irrational edge. These edge states are seeded by eigenfunctions of an effective Dirac operator, which has an infinite block-diagonal structure due to the non-commensurate geometry. A consequence is that infinitely many edge state eigenpairs arise, whose energies are dense in the perturbed bulk spectral gap. In a forthcoming paper, we rigorously construct these gap-filling edge states under a Diophantine condition. The main result here is a key tool in this construction: a resolvent expansion for the 3D Hamiltonian, whose leading term is the resolvent of the block-diagonal Dirac operator. The validity of this expansion requires an omnidirectional non-resonance (no-fold) condition on the dispersion functions of the unperturbed honeycomb Hamiltonian. This condition is satisfied in the strong binding regime. In contrast with earlier works on commensurate edges, the omnidirectional condition is independent of the edge.", "url": "https://arxiv.org/abs/2604.16712", "type": "理论", "summary": "1. 本工作研究了二维蜂窝结构中共振线缺陷处的波传播，通过将二维薛定谔算子嵌入一个具有二维界面的三维介质哈密顿量来严格定义准周期边缘态。\n2. 其技术核心是利用多尺度分析构建了三维哈密顿量的预解式展开，其主导项为由非对易几何导致具有无限块对角结构的有效狄拉克算子的预解式。\n3. 这为在丢番图条件下严格构造能量稠密填充体谱隙的边缘态提供了关键工具，并揭示了边缘态的产生机制与边缘方向无关的全局非共振条件。", "summary_source": "deepseek", "authors": [{"name": "Pierre Amenoagbadji"}, {"name": "Michael I. Weinstein"}], "featured_authors": [{"name": "Pierre Amenoagbadji"}, {"name": "Michael I. Weinstein"}], "author_count": 2}, {"id": "2604.17150", "category": "math-ph", "title": "On the asymptotic duality of spectral variances in random matrix theory and the \"1/6\" formula", "abstract": "A \"mysterious\" relation between the number variance and the variance of the $L$-th ordered eigenvalue, first suggested by French et al. [Ann. Phys. 113, 277 (1978)], is revisited and proven to be asymptotically exact for the $\\beta=2$ Dyson symmetry class. Central to the proof is a previously unknown sum rule for the level spacing auto-covariances. Its derivation hinges on our previous work on the power spectrum description of eigenvalue fluctuations in random matrix theory. Analytical results for $\\beta=2$ are complemented by conjectural extensions to the $\\beta=1$ and $\\beta=4$ symmetry classes. Our findings are corroborated by a comprehensive numerical analysis.", "url": "https://arxiv.org/abs/2604.17150", "type": "理论", "summary": "1. 该研究重新审视了随机矩阵理论中能级数方差与第L个有序本征值方差之间的“神秘”关系，并严格证明了其在β=2 Dyson对称类中的渐近精确性。\n2. 证明的核心在于首次导出了一个此前未知的能级间距自协方差求和规则，其推导基于作者先前关于本征值涨落功率谱描述的理论框架。\n3. 数值分析全面支持了该结论，而将其推广至β=1和β=4对称类的猜想性扩展，为不同对称性类中普适涨落统计的深入研究提供了明确方向。", "summary_source": "deepseek", "authors": [{"name": "Peng Tian"}, {"name": "Roman Riser"}, {"name": "Eugene Kanzieper"}], "featured_authors": [{"name": "Peng Tian"}, {"name": "Roman Riser"}, {"name": "Eugene Kanzieper"}], "author_count": 3}, {"id": "2604.17348", "category": "math-ph", "title": "Soliton-like solutions of the Camassa--Holm equation with variable coefficients and a small dispersion", "abstract": "The paper deals with the Camassa--Holm equation with variable coefficients (vcCH equation) that is a direct generalization of the well known Camassa--Holm equation. We focus on the mathematical description of particular solutions of the vcCH equation with a small dispersion that exhibit properties analogous to those of classical soliton and peakon solutions, and consider the construction of soliton- and peakon-like solutions in the form of asymptotic expansions, including both one-phase and two-phase cases. The solution is expressed as the sum of a regular background common to all soliton- and peakon-like solutions and a singular component that captures their distinctive features, with the precise definition of the main singular term playing a central role. In the one-phase case, this term is determined, and the solvability of higher-order singular corrections is established in suitable functional spaces, enabling the construction of asymptotic solutions to arbitrary accuracy in a small parameter. The study also addresses the construction of two-phase soliton- and peakon-like solutions. Theorems on the asymptotic accuracy of the constructed asymptotic solutions have been proved. Each of the considered cases is illustrated by nontrivial examples for which, in accordance with the obtained general results, approximate solutions are derived in explicit form and their graphs are presented.", "url": "https://arxiv.org/abs/2604.17348", "type": "理论", "summary": "1. 该论文将经典Camassa-Holm方程推广至可变系数情形，并针对小色散参数数学描述了类孤子与类峰值孤子解的性质，通过渐近展开构造了单相及双相情况下的此类解。\n2. 其技术核心在于将解表达为所有解共有的规则背景与捕获独特特征的奇异部分之和，精确定义主奇异项并在合适函数空间中证明高阶奇异修正的可解性，从而实现了任意精度的渐近解构造并验证了渐近准确性定理。\n3. 这为可变系数非线性色散方程的精确解分析提供了系统的渐近框架，所展示的非平凡示例及其显式解与图形验证了方法的有效性，对浅水波等相关物理模型的数学建模具有明确启发意义。", "summary_source": "deepseek", "authors": [{"name": "Yuliia Samoilenko"}, {"name": "Valerii Samoilenko"}], "featured_authors": [{"name": "Yuliia Samoilenko"}, {"name": "Valerii Samoilenko"}], "author_count": 2}, {"id": "2604.17854", "category": "math-ph", "title": "Semiclassical resonances under local magnetic fields", "abstract": "We study resonances for the semiclassical magnetic Laplacian in the full plane with a compactly supported magnetic field in the framework of semiclassical complex scaling and black box scattering theory. Assuming that the magnetic field is locally constant, we prove the existence of semiclassical resonances near the Landau levels with exponentially small imaginary parts. We also prove that resonances emerge from a magnetic step discontinuity along a curved interface or a non-degenerate magnetic well, and in the vicinity of anharmonic Landau levels if the field has an isolated zero.", "url": "https://arxiv.org/abs/2604.17854", "type": "理论", "summary": "1. 该工作在半经典复标度与黑箱散射理论框架下，研究了全平面上具有紧支撑磁场的半经典磁拉普拉斯算子的共振问题。\n2. 通过假设磁场局部恒定，证明了在朗道能级附近存在虚部指数小的半经典共振，并揭示了共振从弯曲界面上的磁跃变、非简并磁阱或磁场孤立零点附近的反谐朗道能级中产生的机制。\n3. 这为理解非均匀磁场中量子输运与共振态的几何依赖性提供了理论基础，并可推广至更一般的磁场位形与多维系统。", "summary_source": "deepseek", "authors": [{"name": "Pavel Exner"}, {"name": "Ayman Kachmar"}], "featured_authors": [{"name": "Pavel Exner"}, {"name": "Ayman Kachmar"}], "author_count": 2}, {"id": "2604.17913", "category": "math-ph", "title": "Synthetic Seismograms from Particle Bed Interactions and Turbulent River Flow: Modeling and Comparison with Observations", "abstract": "We present a physics based numerical model that estimates the seismic radiation generated by water sediment flows in gravel-bed rivers. The model reproduces the trajectories of individual particles, evaluates impact and rolling forces from grain scale dynamics, and accounts for broadband turbulence and vortex shedding in the water column. Synthetic seismic signals are propagated to the receivers using the Rayleigh wave Green s function approach and synthetic ground-velocity signals are estimated. Application to a controlled test case shows how intermittent, size selective sediment transport mechanisms produce distinct spectral signatures. Comparison with seismic data from a flood event in a mountain torrent in the Tuscan Apennines displays general agreement with the observed frequency bands and clarifies the relative width of particle collisions and turbulent flow. These results show that resolved grain scale dynamics provides a framework for discriminating sediment transport and flow induced contributions to river seismic noise.", "url": "https://arxiv.org/abs/2604.17913", "type": "理论", "summary": "1. 本研究提出了一个基于物理的数值模型，用于估计砾石河床中水-沉积物流动产生的地震辐射，并与观测数据进行了对比验证。\n2. 该模型的关键在于耦合了颗粒尺度动力学（包括撞击与滚动）与水体中的宽带湍流和涡旋脱落，从而分离出沉积物输运与湍流各自的宽频地震特征。\n3. 这一基于解析颗粒动力学的框架，为利用河床地震噪声区分和量化不同输运机制与水流贡献提供了可靠的物理基础。", "summary_source": "deepseek", "authors": [{"name": "Sara Nicoletti"}, {"name": "Giacomo Belli"}, {"name": "Omar Morandi"}, {"name": "Emanuele Marchetti"}], "featured_authors": [{"name": "Sara Nicoletti"}, {"name": "Giacomo Belli"}, {"name": "Omar Morandi"}, {"name": "Emanuele Marchetti"}], "author_count": 4}, {"id": "2604.18023", "category": "math-ph", "title": "Spherical singularities in compactified Ruijsenaars--Schneider systems", "abstract": "We investigate certain Liouville integrable systems constructed earlier via reduction of the quasi-Hamiltonian double of $\\mathrm{SU}(n)$. These systems live on compact connected symplectic manifolds of dimension $2(n-1)$ and can be interpreted as compactified trigonometric Ruijsenaars--Schneider systems. Depending on the value of a parameter $0<y< \\pi$, they arise in two drastically different forms: in type (i) these are toric systems, while in the type (ii) cases they possess globally continuous action variables that generate a Hamiltonian torus action (only) on a dense open subset of the phase space. The principal goal of the paper is to study those fibers of the action map (alias the $\\mathbb{T}^{n-1}$ momentum map) which are contained in the complement of the domain of the densely defined torus action occurring in the type (ii) cases. We demonstrate that all such `singular fibers' are smooth connected isotropic submanifolds. We also work out a model of the fibers as quotient spaces of certain subgroups of $\\mathrm{SU}(n)$ with respect to an action of another subgroup. The general results are exemplified by determining the vertices of the polytope filled by the action variables in the simplest type (ii) cases that appear for any $n\\geq 4$ with $\\pi/(n-1) <y < \\pi/(n-2)$, and proving that the fibers over the `singular vertices' are diffeomorphic to $S^3 \\simeq \\mathrm{SU}(2)$ in these cases. In this way, our findings enrich the set of examples of Liouville integrable systems with spherical singularities.", "url": "https://arxiv.org/abs/2604.18023", "type": "理论", "summary": "1. 该工作系统研究了紧致化三角Ruijsenaars-Schneider系统在类型(ii)情形下作用量映射奇异纤维的几何结构。\n2. 核心进展在于证明了所有奇异纤维均为光滑连通迷向子流形，并建立了以SU(n)子群作用商空间描述的纤维模型。\n3. 此研究通过具体案例揭示奇异顶点纤维与SU(2)同胚的特性，为具有球面奇点的 Liouville 可积系统范例库提供了新内容。", "summary_source": "deepseek", "authors": [{"name": "L. Feher"}, {"name": "H.R. Dullin"}], "featured_authors": [{"name": "L. Feher"}, {"name": "H.R. Dullin"}], "author_count": 2}, {"id": "2604.18113", "category": "math-ph", "title": "Moments at the hard edge and Rayleigh functions", "abstract": "Motivated by the analogy between spectral moments of random matrices and associated zeta functions, we study inverse power trace moments of the Laguerre ensemble of dimension $N$ and inverse temperature parameter $\\beta>0$. We consider a large $N$ regime determined by the low-lying eigenvalues of the ensemble known as the hard edge. In the classical cases $\\beta \\in \\{1,2,4\\}$, we obtain explicit results for the inverse moments and extend these to formulae for the corresponding Mellin transforms. In the case of general $\\beta>0$, by a result of Fyodorov and Le Doussal, we obtain a different formula for the moments given as a sum over partitions. We use this to consider a low temperature limit where $\\beta \\to \\infty$ as $N \\to \\infty$. In this limit, we show that the moments are given in terms of the Bessel zeta function.", "url": "https://arxiv.org/abs/2604.18113", "type": "理论", "summary": "1. 该工作研究了拉盖尔系综在硬边区域的大维数极限下逆幂次迹矩的渐近行为。\n2. 其技术核心在于对经典β值给出显式结果与梅林变换，并对一般β>0情形通过分割和表示矩，进而导出低温极限下与贝塞尔ζ函数的对应关系。\n3. 这一结果建立了随机矩阵谱矩与ζ函数类比的具体数学实现，为硬边普适类的严格分析提供了新途径。", "summary_source": "deepseek", "authors": [{"name": "Anna Maltsev"}, {"name": "Nick Simm"}], "featured_authors": [{"name": "Anna Maltsev"}, {"name": "Nick Simm"}], "author_count": 2}, {"id": "2604.18280", "category": "math-ph", "title": "Sketch of a Gauge Model of Gravity with SU(2) Symmetry in Minkowski space", "abstract": "We propose a gauge model with the SU(2) symmetry, which describes a gravitational interaction of fundamental fermions (leptons and quarks) in the Minkowski space. In the Standard Model one uses a Dirac-Yang-Mills system of equations with U(2) gauge symmetry for electroweak interactions and with SU(3) gauge symmetry for QCD interactions. A key idea of the model is to use the Dirac-type equation (invented in 2002) instead of the standard Dirac equation. This Dirac-type equation has an additional SU(2) gauge symmetry. The Yang-Mills field, which corresponds to this SU(2) symmetry, we identify with the gravitational field of interacted fundamental fermions. Some elements of Clifford analysis are used in the model.", "url": "https://arxiv.org/abs/2604.18280", "type": "理论", "summary": "1. 该工作提出了一个在闵可夫斯基空间中具有SU(2)对称性的规范模型，用以描述基本费米子（轻子和夸克）的引力相互作用。\n2. 其核心在于采用一种特殊的狄拉克型方程替代标准狄拉克方程，该方程固有的额外SU(2)规范对称性所对应的杨-米尔斯场被认定为引力场。\n3. 这为在统一框架内理解引力与基本粒子相互作用，以及探索超越爱因斯坦引力理论的几何结构提供了新的理论途径。", "summary_source": "deepseek", "authors": [{"name": "Nikolay Marchuk"}], "featured_authors": [{"name": "Nikolay Marchuk"}], "author_count": 1}, {"id": "2604.18383", "category": "math-ph", "title": "Bounding relative entropy for non-unitary excitations in quantum field theory", "abstract": "We show how one can use the convexity of non-commutative $L^p$ norms to bound the relative entropy between a faithful state on a von Neumann algebra and an arbitrary excitation thereof. Our results hold for general von Neumann algebras, including the local algebras of type III that are ubiquitous in quantum field theory, and do not require knowledge of the relative modular operator. As an application of our results, we prove that for the chiral current on a light ray, the relative entropy between the vacuum and a dense set of single-particle states is uniformly bounded.", "url": "https://arxiv.org/abs/2604.18383", "type": "理论", "summary": "1. 该工作利用非交换L^p范数的凸性，界定了冯·诺依曼代数中忠实态与非酉激发态的相对熵。\n2. 其卖点在于适用于包括量子场论中III型代数的一般冯·诺依曼代数，且无需相对模算子。\n3. 证明光线上手征电流的真空与稠密单粒子态相对熵均匀有界，为量子场论的信息论研究提供新基准。", "summary_source": "deepseek", "authors": [{"name": "Markus B. Fröb"}, {"name": "Leonardo Sangaletti"}], "featured_authors": [{"name": "Markus B. Fröb"}, {"name": "Leonardo Sangaletti"}], "author_count": 2}, {"id": "2604.18386", "category": "math-ph", "title": "Eigenvalue asymptotics of Müller minimizers for atoms and molecules", "abstract": "We study the spectral properties of minimizers of the Müller functional for atoms and molecules with $N$ electrons and total nuclear charge $Z$. We prove that under some suitable assumptions on $Z$ and $N$, the $k$-th eigenvalue of a Müller minimizer $\\gamma_*$ behaves as $A_* k^{-8/3}$ when $k\\to \\infty$, with a constant $A_*>0$ determined explicitly by the density of $\\gamma_*$. In particular, in the atomic case $V=Z|x|^{-1}$ our assumption holds if $Z$ is sufficiently large and $N\\le Z- C_0 Z^{1/3}$. While our proof is inspired by Sobolev's work on the asymptotic behavior of the one-particle density matrix of Schrödinger ground states, the analysis in Müller theory requires several new ingredients concerning both the singular behavior of the integral kernel of the minimizers near the diagonal and the decay properties at infinity.", "url": "https://arxiv.org/abs/2604.18386", "type": "理论", "summary": "1. 本文针对含$N$个电子且总核电荷为$Z$的原子与分子，研究了其Müller泛函极小解（Müller minimizer）的本征值渐近行为。\n2. 核心卖点在于证明了在一定条件下（如大$Z$且$N \\le Z - C_0 Z^{1/3}$时），第$k$个本征值按$A_* k^{-8/3}$标度衰减，其分析需克服Müller理论中极小解积分核在对角线奇异性与无穷远衰减带来的新困难。\n3. 这一结果为严格建立Müller泛函的谱性质与对应电子密度之间的关联提供了理论基础，并可能推动对更一般的密度矩阵泛函渐近分析的研究。", "summary_source": "deepseek", "authors": [{"name": "Rupert L. Frank"}, {"name": "Long Meng"}, {"name": "Phan Thành Nam"}, {"name": "Heinz Siedentop"}], "featured_authors": [{"name": "Rupert L. Frank"}, {"name": "Long Meng"}, {"name": "Phan Thành Nam"}, {"name": "Heinz Siedentop"}], "author_count": 4}, {"id": "2604.18448", "category": "math-ph", "title": "Kernel-Preserving Dynamics and Symmetry Classification for Synchronization Subspaces", "abstract": "We study the preservation and stability of synchronization subspaces in tensor products of finite-dimensional Hilbert spaces. Given self-adjoint operators $T_A$ and $T_B$ on local subsystems, the synchronization subspace is defined as the kernel of the difference operator $K = T_A \\otimes I - I \\otimes T_B$. We establish two main results: First for $\\epsilon$-compatible dynamics satisfying $||[H,K]|| \\leq \\epsilon$, we prove a sharp drift bound where any initially synchronized state deviates from the kernel at a rate at most linear in time with slope $\\epsilon$. We show by explicit construction that this estimate is optimal to leading order. Second in the presence of finite group symmetry, we show that the synchronization subspace coincides with the diagonal isotypic component in the tensor product decomposition and we characterize the algebra of synchronization-preserving dynam
