artick Paul"}, {"name": "Rahul V"}, {"name": "S. Aravinda"}, {"name": "Reetesh K. Gangwar"}], "author_count": 4}, {"id": "2608.23191", "category": "quant-ph", "title": "Quantum observables as Fréchet sensitivity kernels", "abstract": "We present a variational--adjoint interpretation of quantum mechanics in which the interaction between forward and adjoint wavefunctions defines a general sensitivity kernel of the system. This Fréchet interaction density quantifies how perturbations in the wavefunction (or system parameters) influence a chosen observable. The familiar Born probability density appears as a special case when the adjoint wavefunction is chosen as the complex conjugate of the forward wavefunction, for which the interaction density becomes real and non-negative. Within this framework, probability is a particular positive-definite form of sensitivity described by the Fréchet interaction density. In general, the variational--adjoint interpretation also produces Fréchet sensitivity kernels associated with other quantum observables, including momentum, energy, and spin. This suggests that the Born probability density belongs to a broader class of Fréchet sensitivity kernels associated with quantum observables. The proposed interpretation also provides a connection with time-symmetric interpretations of quantum mechanics and possible future applications in quantum control and quantum metrology.", "url": "https://arxiv.org/abs/2608.23191", "type": "数值", "summary": "1. 该工作提出量子力学的变分–伴随诠释，将正向与伴随波函数间的相互作用密度定义为可观测量对波函数或参数扰动的Fréchet敏感核。\n2. 其卖点在于，当伴随波函数取正向波函数的复共轭时，该核退化为实且非负的Born概率密度，从而将概率视为一种正定敏感形式，并推广至动量、能量与自旋等可观测量。\n3. 这为量子力学的时间对称诠释提供了联系，并有望在量子控制与量子计量中用于敏感性分析和最优调控。", "summary_source": "deepseek", "authors": [{"name": "Rafael Abreu"}], "featured_authors": [{"name": "Rafael Abreu"}], "author_count": 1}, {"id": "2608.23232", "category": "quant-ph", "title": "Non-Hermitian Generalization of Bloch Sphere in Spacetime Algebra", "abstract": "We establish a geometric generalization of the Bloch sphere for two-level quantum systems with non-Hermitian Hamiltonians using the Spacetime Algebra (STA) formulation. By lifting the state density operator from the even subalgebra to the full STA, we show that the state space expands from the unit 2-sphere to a future light cone. The non-unitary time evolution generated by a general non-Hermitian Hamiltonian corresponds to proper orthochronous Lorentz transformations on the null vectors. We classify the Hamiltonian dynamics into four distinct geometric classes: spatial rotations (corresponding to $\\mathcal{PT}$-symmetric systems), pure boosts (anti-$\\mathcal{PT}$-symmetric systems), null rotations (exceptional points), and general mixtures. We also use this formulation to study several results from PT-symmetric quantum mechanics, including the topological features of the exceptional points.", "url": "https://arxiv.org/abs/2608.23232", "type": "理论", "summary": "1. 该工作利用时空代数将布洛赫球几何推广至非厄米二能级系统，通过把密度算符从偶子代数提升到完整时空代数，使态空间由单位二球面扩展为未来光锥。\n2. 其技术卖点在于非幺正时间演化被实现为固有正时洛伦兹变换作用于类光矢量，且哈密顿量动力学被分类为空间转动、纯洛伦兹推动、零转动与一般混合，分别对应PT对称、反PT对称、例外点及一般情形。\n3. 该形式为PT对称量子力学中的例外点拓扑提供几何解释，也为非厄米系统的量子模拟与几何相位研究提供了新视角。", "summary_source": "deepseek", "authors": [{"name": "Chih-Wei Wang"}], "featured_authors": [{"name": "Chih-Wei Wang"}], "author_count": 1}, {"id": "2608.23316", "category": "quant-ph", "title": "Exact Quasiprobability Hierarchy of the Double-Morse Oscillator: From Potential Geometry to Operator Ordering", "abstract": "Phase-space and quasiprobability methods play key roles across quantum technologies, characterizing localization, non-Gaussianity, nonclassical resources, and coarse-graining. We present a representation-consistent analysis of the lowest quasi-exact ground state of the symmetric double-Morse oscillator. The parameter $A$ changes the potential geometry and physical state, whereas the Cahill--Glauber ordering parameter $s$ changes only the representation and phase-space resolution of a fixed density operator. Although the potential is double-welled for $0<A<1$, the exact ground-state amplitude is single-peaked at the origin and lies above the internal barrier; as $A$ approaches unity, the merged well remains locally quartic rather than harmonic. We obtain closed expressions for the Wigner function and Weyl characteristic function. The Wigner function shows the $A$-dependent exchange between position and momentum localization and retains negative regions, certifying nonclassicality and, for this pure state, non-Gaussianity. The Weyl function gives the Fourier-dual description, generates symmetrically ordered moments and cumulants, and yields the full $s$-ordered hierarchy. For $s<0$, isotropic Gaussian smoothing suppresses fine sign-changing structure while preserving the large-scale localization envelope. The Husimi endpoint is nonnegative without implying classicality, whereas the Glauber--Sudarshan $P$ representation remains distributional and does not define a regular positive coherent-state mixture. Thus, the reduced visual extent of Wigner-negative regions as $A$ increases is not classicalization: $A$ controls the physical geometry, while $s$ controls how the same non-Gaussian, nonclassical structure appears across complementary representations. This separation provides an exact benchmark for nonlinear phase-space methods. theory.", "url": "https://arxiv.org/abs/2608.23316", "type": "理论", "summary": "1. 该工作对对称双Morse振子的最低准精确基态给出表示自洽的相空间分析，并导出Wigner函数与Weyl特征函数的闭式表达式。\n2. 其技术要点是严格区分势能几何参数A与Cahill–Glauber排序参数s：A改变势阱形状与物理态，s仅改变同一密度算符的表示与分辨率，且负Wigner区随A增大缩减并非经典化。\n3. 这为非线性相空间方法提供了精确基准，并说明非高斯非经典结构在不同准概率表示中的分层显现及其与Husimi非负性的关系。", "summary_source": "deepseek", "authors": [{"name": "F. Chogle"}, {"name": "B. Teklu"}, {"name": "M. F. Pereira"}], "featured_authors": [{"name": "F. Chogle"}, {"name": "B. Teklu"}, {"name": "M. F. Pereira"}], "author_count": 3}, {"id": "2608.23399", "category": "quant-ph", "title": "Quantifying the dimensionality of multiparticle entanglement via partition rank", "abstract": "The usefulness of entanglement as a resource in quantum technologies increases for larger systems, that is, if more particles or higher-dimensional quantum systems are considered. Yet, the interplay between dimensionality and multiparticle entanglement is not well understood. Only for two-particle systems an unambiguous and coherent notion of entanglement dimensionality, based on the Schmidt decomposition, is known. We introduce a concept to characterize the entanglement dimensionality of multiparticle states based on decompositions of pure states into superpositions of states without genuine multiparticle entanglement. We provide constructive methods to characterize the resulting partition rank for pure and mixed states. This allows the identification of novel maximally correlated states as well as a discrete classification of quantum states under stochastic local operations and classical communication. From a mathematical perspective, our approach can be formulated in terms of the slice rank and partition rank of tensors and our results allow to characterize these by connecting them to a generalized injective tensor norm.", "url": "https://arxiv.org/abs/2608.23399", "type": "理论", "summary": "1. 该工作提出利用划分秩来量化多体纠缠维度，将纯态按不含真正多体纠缠的态之叠加进行分解，并给出纯态与混合态相应的构造性刻画方法。\n2. 其核心卖点在于把划分秩与张量的切片秩及广义内射张量范数联系起来，从而在随机局域操作与经典通信下获得量子态的离散分类，并识别出新型最大关联态。\n3. 该数学刻画为多体纠缠维度提供了可计算的离散不变量，有望推动纠缠资源理论、多体量子信息及张量网络方法的进一步发展。", "summary_source": "deepseek", "authors": [{"name": "Sophia Denker"}, {"name": "Ismaël Septembre"}, {"name": "Robin Krebs"}, {"name": "Otfried Gühne"}], "featured_authors": [{"name": "Sophia Denker"}, {"name": "Ismaël Septembre"}, {"name": "Robin Krebs"}, {"name": "Otfried Gühne"}], "author_count": 4}, {"id": "2608.23460", "category": "quant-ph", "title": "Satisfying Quantum Codes: Physics-Informed and Hardware-Aware Code Design with SAT Solvers", "abstract": "Although quantum error correction is widely believed to be necessary for impactful applications of quantum computers, the design of quantum error correction codes is largely done by hand, without respect to problem or hardware constraints. In this work, we present a highly general and flexible framework for the computational design of both physics-inspired and hardware-aware quantum codes. To do so, we formulate code design as a Boolean satisfiability (SAT) problem and show how to incorporate all required error correction criteria. We prove that code design is NP-complete, ruling out any efficient algorithm for designing codes in general. Nonetheless, we show that state-of-the-art SAT solvers are able to effectively find solutions for many practical problems. Notably, we are able to design physics-inspired codes with up to 100 physical qubits in minutes, and we design new hardware-aware codes for biased noise which have a lower logical error rate than state-of-the-art surface codes.", "url": "https://arxiv.org/abs/2608.23460", "type": "数值", "summary": "1. 该工作提出一个通用灵活的框架,将量子纠错码设计编码为布尔可满足性问题,并证明一般码设计是NP完全的。\n2. 其核心卖点在于统一纳入纠错判据与硬件约束,借助现成SAT求解器在数分钟内设计出至多100物理比特的物理启发码,并针对偏置噪声得到逻辑错误率优于表面码的新型硬件感知码。\n3. 这为计算驱动、按问题与硬件定制的量子码自动设计开辟路径,同时说明尽管问题一般性困难,实际可行规模仍可被高效求解。", "summary_source": "deepseek", "authors": [{"name": "Ben DalFavero"}, {"name": "William M. Watkins"}, {"name": "Margarite L. LaBorde"}, {"name": "Vincent Russo"}, {"name": "Ethan Egger"}, {"name": "Gregory Quiroz"}, {"name": "Ryan LaRose"}], "featured_authors": [{"name": "Ben DalFavero"}, {"name": "William M. Watkins"}, {"name": "Margarite L. LaBorde"}, {"name": "Ethan Egger"}, {"name": "Gregory Quiroz"}, {"name": "Ryan LaRose"}], "author_count": 7}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>${paper.summary_source === "deepseek" ? "DeepSeek three-sentence PRL summary" : (paper.summary_source === "local-fallback" ? "Local three-sentence fallback" : (paper.summary_source === "translation" ? "Chinese abstract translation" : "Chinese placeholder fallback"))}</span><a href="${safeUrl}" target="_blank" rel="noreferrer">Open arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
