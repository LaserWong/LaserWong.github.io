y along the $T_{*}/T$-fixed line, whereas a nontrivial extension of the Landau theory is required for a more general description of the critical phenomena along arbitrary paths.", "url": "https://arxiv.org/abs/2608.23378", "type": "理论", "summary": "1. 该工作在全息D3/D7模型中研究电流驱动三重临界点处手征对称破缺的临界指数γ与ν。\n2. 发现临界指数依赖趋近路径，但当有效温度与热浴温度之比T*/T固定时与朗道理论一致。\n3. 表明沿T*/T固定线可用朗道理论描述，而任意路径需非平凡推广的朗道理论。", "summary_source": "deepseek", "authors": [{"name": "Motohiro Kanazawa"}, {"name": "Masataka Matsumoto"}, {"name": "Shin Nakamura"}], "featured_authors": [{"name": "Motohiro Kanazawa"}, {"name": "Masataka Matsumoto"}, {"name": "Shin Nakamura"}], "author_count": 3}, {"id": "2608.23517", "category": "hep-th", "title": "Energy of toroidal M2 brane in flat 11d background", "abstract": "The supermembrane action is non-linear and a priori non-renormalizable. Still, some quantities in this theory may be free of log UV divergences and thus defined unambiguously. To explore this possibility we compute the energy of an M2 brane wrapped on a 2-torus in flat 11d space to two loops in the inverse-tension expansion. The result is free of logarithmic divergences and the same should hold also at higher loop orders. For fermions periodic around both circles the quantum corrections cancel, consistent with the BPS nature of the wrapped M2 brane state. For fermions antiperiodic around one or both circles the energy is a non-trivial function of the radii given by infinite sums of modified Bessel functions. We also compute 3-loop correction to the energy of the bosonic membrane on $\\mathbb R^2\\times S^1$. In contrast to the string case, it contains, besides powers of the 1-loop $\\zeta(3)$ coefficient, a new term proportional to $\\zeta(9)$. Summing contributions of all-loop bubble graphs leads to a simple cubic equation for the membrane energy. The analogous resummation in the Nambu or GS string t case reproduces the familiar exact square-root expression ${\\mathcal E}=\\sqrt{(2\\pi R\\,T_1)^2+m_0^2}$. We find that the bubble-graph part of the membrane energy does not vanish for any value of the radius $R_{11}$. If contributions of other non-trivial diagrams in the supermembrane case do not qualitatively change this conclusion, this would disfavour the conjectured relation between 11d theory on an antiperiodic circle and the strong-coupling limit of type 0A string theory.", "url": "https://arxiv.org/abs/2608.23517", "type": "理论", "summary": "1. 该工作在平直11维背景下计算环面卷绕M2膜能量的两圈修正，并额外给出玻色膜三圈修正，结果表明对数紫外发散消失。\n2. 其要点是在逆张力展开下结合全阶泡泡图重求和；周期费米子的量子修正抵消体现BPS性质，反周期情形能量由修正贝塞尔函数无穷和给出，三圈项出现zeta(9)新贡献。\n3. 这一结果对11维理论在反周期圆上的强耦合极限与0A型弦论之间的猜想关系提出质疑，除非其他非平凡图的贡献从根本上改变泡泡图部分的定性结论。", "summary_source": "deepseek", "authors": [{"name": "Arkady A. Tseytlin"}, {"name": "Zihan Wang"}], "featured_authors": [{"name": "Arkady A. Tseytlin"}, {"name": "Zihan Wang"}], "author_count": 2}, {"id": "2608.21642", "category": "math-ph", "title": "How Much Geometry Does Newtonian Dynamics Fix?", "abstract": "Newtonian mechanics is usually written on a spacetime of fixed geometry. Here we build that geometry, introducing a propagator and a bilinear form only as the description demands. Within this reconstruction the Principle of Inertia emerges as a theorem rather than an independent postulate. Inertial motion is blind to the scale of the form and to the torsion the propagator defines, and that blindness is a geometric precursor of the \\emph{universality of free fall}, before gravity enters. Newton's Second Law is a compatibility between two derivatives along a curve. The force exceeds the mass times the lowered acceleration by an exact term, and the law survives arbitrary torsion. Requiring force-free motion to be inertial along curves parametrised by arc length restricts the torsion to be totally antisymmetric. The remaining torsion is a three-form which we postulate the particle carries along its worldline. Its contraction with the velocity annihilates that velocity, so the supplementary condition of spinning-particle mechanics holds identically, and we propose that contraction as a classical spin. The algebra is familiar from relativistic spin hydrodynamics; the assignment, to the best of our knowledge, has not been proposed elsewhere. Since inertial motion resolves neither the mass nor the spin, the predictive content lies in the transport law we postulate, which turns the spin against a parallel-transported frame at a rate fixed by the acceleration alone and by no coupling constant. That rate becomes a laboratory number only once the arc-length parameter is identified with a clock, which we leave open. The dynamics asks non-degeneracy of the form, so this spacetime is not Newton--Cartan's Galilean one, and gravitation lies outside the construction. We prove every mathematical result, make three constitutive postulates and one physical conjecture.", "url": "https://arxiv.org/abs/2608.21642", "type": "理论", "summary": "1. 该工作从传播子和双线性形式出发重构牛顿力学所需的时空几何，证明惯性原理从独立假设变为定理，并给出三个构成性假设与一个物理猜想。\n2. 卖点在于第二定律是曲线上两导数间的相容性，自由落体普适性是惯性运动对尺度与挠率盲区的几何前兆；采用全反对称挠率的三形式与速度缩并给出经典自旋，其进动率仅由加速度决定。\n3. 这一重构要求双线性形式非退化，因此并非牛顿-嘉当时空，但为无引力的几何动力学提供了可检验输运定律的新框架；时间参数与时钟的对应仍留待解决。", "summary_source": "deepseek", "authors": [{"name": "C S López-Monsalvo"}], "featured_authors": [{"name": "C S López-Monsalvo"}], "author_count": 1}, {"id": "2608.21802", "category": "math-ph", "title": "Finite-term recurrences in a generalized Bochner--Krall family", "abstract": "We classify the differential operators \\(T=z^j\\partial_z^j+z^m\\partial_z^\\ell\\), where \\(0\\le m<\\ell\\) and \\(1\\le j<\\ell\\), whose monic eigenpolynomials satisfy a finite-term recurrence relation. Writing \\(k=\\ell-m\\), such a recurrence exists if and only if \\(j=1\\) and \\(k\\mid\\ell\\). In that case we determine all recurrence coefficients in closed form and prove that the associated difference operator has order \\(\\ell\\). We also give an explicit factorization showing that every admissible operator is of Type~(2) in Conjecture~1.10 of Horozov--Shapiro--Tater; the equality of the differential and difference orders is the conclusion predicted by their Conjecture~1.9.", "url": "https://arxiv.org/abs/2608.21802", "type": "理论", "summary": "1. 该工作对广义Bochner–Krall族中形如 \\(T=z^j\\partial_z^j+z^m\\partial_z^\\ell\\)（\\(0\\le m<\\ell\\)，\\(1\\le j<\\ell\\)）的微分算子，完全分类了其首一特征多项式满足有限项递推关系的条件。\n2. 核心结论是有限项递推存在当且仅当 \\(j=1\\) 且 \\(k=\\ell-m\\) 整除 \\(\\ell\\)；此时以闭式给出全部递推系数，并证明相应差分算子阶数为 \\(\\ell\\)。\n3. 该文还给出显式因子分解，将所有容许算子归入Horozov–Shapiro–Tater猜想1.10的Type (2)，从而证实其猜想1.9关于微分阶与差分阶相等的预测，为Bochner–Krall理论的结构分类提供了坚实依据。", "summary_source": "deepseek", "authors": [{"name": "L.M. Anguas"}, {"name": "D. Barrios Rolanía"}, {"name": "B. Shapiro"}, {"name": "M. Tater"}], "featured_authors": [{"name": "L.M. Anguas"}, {"name": "D. Barrios Rolanía"}, {"name": "B. Shapiro"}, {"name": "M. Tater"}], "author_count": 4}, {"id": "2608.21999", "category": "math-ph", "title": "TENSKEL: A Combinatorial Observable Tensor for Structured Measurement and Reconstruction", "abstract": "Many imaging problems seek to reconstruct underlying configurations from partial observable measurements. While reconstruction algorithms operate on these measurements, the observable organization induced by the measurement process is rarely represented explicitly. We introduce TENSKEL, a combinatorial observable framework for structured measurement and reconstruction based on tensor representations defined over discrete domains. Starting from a binary latent ensemble, the framework constructs a hierarchy of tensors coupling measurement contexts to a latent Pascal organization through successive aggregation and folding operations. Each measurement context induces an observable partition of the same latent ensemble, and the resulting tensor formulation makes explicit the associated combinatorial multiplicities, shell organization, degeneracies, and induced reconstruction geometry. Rather than introducing a new reconstruction algorithm, this framework provides a mathematical representation of how latent configurations become organized under observation. The induced tensor kernel characterizes similarities between latent coordinates through their measurement-context responses, while regularized inversion provides a structured reconstruction of the latent representation from observable measurements. The binary construction further admits a natural multinomial extension to discrete simplex-supported latent representations. Connections to Pascal cellular automata and structured discrete color mappings illustrate respectively compressed and multinomial realizations of the framework. More generally, TENSKEL provides a combinatorial basis for reasoning about the organization induced by observation, with potential relevance to computational imaging, inverse problems, structured sensing, and quantum-inspired measurement formulations.", "url": "https://arxiv.org/abs/2608.21999", "type": "理论", "summary": "1. 该工作提出TENSKEL，一个基于离散域张量表示的组合可观测量框架，用于结构化测量与重建。\n2. 其核心在于通过聚合与折叠构造耦合测量情境与潜在Pascal结构的张量层级，显式刻画组合重数、壳层组织、简并性及重建几何，并支持二值与多项扩展。\n3. 该框架为观测诱导组织的数学化描述提供了组合基础，对计算成像、逆问题、结构化感知及量子启发测量具有潜在价值。", "summary_source": "deepseek", "authors": [{"name": "Yvan Richard"}], "featured_authors": [{"name": "Yvan Richard"}], "author_count": 1}, {"id": "2608.22362", "category": "math-ph", "title": "Interacting Lattice Bosons on the Concrete Buchholz Algebra -- All-Temperature Equilibrium States from Functional-Integral Local-Number Bounds", "abstract": "Interacting Bose--Hubbard dynamics is formulated on the concrete Buchholz algebra in Fock space. Under repulsive finite-range interactions and a low-activity gap, a discrete functional integral gives volume-uniform exponential local-number bounds at all temperatures. These bounds remove the local-moment hypothesis and yield finite-volume approximation and KMS accumulation states in arXiv:2505.13170 .", "url": "https://arxiv.org/abs/2608.22362", "type": "理论", "summary": "1. 该工作在Fock空间的具象Buchholz代数上构造了相互作用的Bose–Hubbard动力学，并在排斥有限程相互作用和低活度能隙下给出全温度平衡态描述。\n2. 其技术核心是利用离散泛函积分导出体积一致的指数局部粒子数界，从而在无需局部矩假设的前提下建立有限体积近似与KMS极限态。\n3. 这一结果将晶格玻色子系统平衡态存在性推广至所有温度，并为后续非平衡动力学或高阶关联的严格泛函积分研究提供了基础。", "summary_source": "deepseek", "authors": [{"name": "Yoshitsugu Sekine"}], "featured_authors": [{"name": "Yoshitsugu Sekine"}], "author_count": 1}, {"id": "2608.22365", "category": "math-ph", "title": "On the gauge invariant boundary condition in open XXZ chains: SoV bases, elementary blocks and overlaps", "abstract": "We consider the open XXZ spin chain with unparallel boundary fields, in the special case in which the Vertex-IRF transform of the K-matrix labelling the boundary field at site 1 is diagonal and invariant under the value of the gauge parameters, the other K-matrix being arbitrary. We discuss here several properties related to this special gauge invariant boundary condition. Such a model can be solved in the Vertex-IRF framework with arbitrary gauge parameters: we can diagonalise the transfer matrix by means of generalised Sklyanin's Separation of Variable (SoV) approach in a family of SoV bases that depend on two arbitrary gauge parameters $\\alpha$ and $\\beta$, $\\beta$ being the so-called dynamical parameter and $\\alpha$ an arbitrary shift of the spectral parameter. We show here that such SoV bases depend actually on $\\alpha$ and $\\beta$ through the difference $\\alpha-\\beta$ only. Considering the ungauged limit in which $\\alpha-\\beta$ tends to infinity, we show how to compute all elementary building blocks for the correlation functions of this model. We finally show how to compute overlaps between eigenstates of this model and eigenstates of a spin chain sharing the same boundary condition at site $N$ and in which the gauge invariant boundary condition at site 1 has been changed to a more general one.", "url": "https://arxiv.org/abs/2608.22365", "type": "理论", "summary": "1. 该工作研究具有非平行边界场的开放XXZ自旋链，特别关注站点1处边界K矩阵经Vertex-IRF变换后为对角且不依赖规范参数的规范不变边界条件，并允许另一侧K矩阵任意。\n2. 其核心卖点是证明广义Sklyanin分离变量方法给出的SoV基仅依赖规范参数之差α−β，并利用α−β趋于无穷的未规范极限精确计算所有关联函数初等构建块。\n3. 此外还建立本模型本征态与N端边界相同但站点1改为更一般边界条件的链本征态之间的重叠计算，这为推广到更一般的量子可积边界问题提供了明确路径。", "summary_source": "deepseek", "authors": [{"name": "G. Niccoli"}, {"name": "V. Terras"}], "featured_authors": [{"name": "G. Niccoli"}, {"name": "V. Terras"}], "author_count": 2}, {"id": "2608.22543", "category": "math-ph", "title": "Quantitative Furstenberg Theory for Large Random Matrices", "abstract": "We consider the $2W\\times 2W$ transfer matrices associated to the block Anderson model with GOE potential blocks. We make the classical Lyapunov exponent theory quantitative in two ways. First, we prove a quantitative limit theorem for the top Lyapunov exponent. Second, we prove every gap between Lyapunov exponents is at least $c/W$. As a corollary, this implies the localization length of this $1$d block Anderson model is at most $CW^2$. The proof uses Furstenberg type formulas for the Lyapunov exponents, and Malliavin calculus style arguments in the symplectic group to show the product of sufficiently many transfer matrices has a sufficiently smooth density. The main technical input for the latter is a least singular value estimate for a structured random matrix.", "url": "https://arxiv.org/abs/2608.22543", "type": "理论", "summary": "1. 该工作针对具GOE势块的块体Anderson模型，系统研究了其2W×2W转移矩阵的Lyapunov谱，并将经典Lyapunov指数理论转化为定量结论。\n2. 其技术核心在于结合Furstenberg公式与辛群上的Malliavin型论证，证明足够多转移矩阵的乘积具有光滑密度，并以结构随机矩阵的最小奇异值估计导出指数间隙下界c/W。\n3. 由此推论一维块体Anderson模型的局域化长度至多CW²，为有限能区输运标律及大随机矩阵谱统计提供了明确可检验的定量框架。", "summary_source": "deepseek", "authors": [{"name": "Reuben Drogin"}], "featured_authors": [{"name": "Reuben Drogin"}], "author_count": 1}, {"id": "2608.22547", "category": "math-ph", "title": "Fractality of the Schrödinger Density for Rough Data", "abstract": "The observable of the Talbot effect is the intensity behind the grating: the density of the evolving field, not the field itself. Its fractality was previously known only for step data with rational jumps. We prove the general case. For arbitrary real data of bounded variation with at least one jump, the density of the free Schrödinger evolution on the torus is fractal at almost every time, with graph of upper box dimension exactly three halves. Its critical Sobolev mass diverges logarithmically, at a rate given in closed form by Wiener's jump statistic of the datum and independent of the positions and phases of the jumps. The same rate is halved along time traces and doubled for the Airy flow, so the critical mass probes the dispersion relation. Transported by the rank calculus of derangetropy operators, the theory equips every probability law with a quantum carpet: Gauss-sum revivals on quantile cells at rational times, a universal fractal at almost every other. The spectral growth rate of a single measured intensity profile returns the jump content of the grating, a prediction open to test in optical and matter-wave interferometry.", "url": "https://arxiv.org/abs/2608.22547", "type": "理论", "summary": "1. 该工作证明自由薛定谔流在环面上的密度在任意有界变差且至少含一个跳跃的实初值下，于几乎所有时刻为分形，上盒维数恰为3/2。\n2. 核心结果给出临界Sobolev质量的对数发散闭合速率，由Wiener跳跃统计量决定而独立于跳跃位置与相位；该速率沿时间迹减半、对Airy流加倍，从而探测色散关系。\n3. 该理论为每个概率律配备量子地毯，并预言单条强度谱的谱增长率可直接反演光栅跳跃含量，为光学与物质波干涉实验提供可检验前景。", "summary_source": "deepseek", "authors": [{"name": "Masoud Ataei"}], "featured_authors": [{"name": "Masoud Ataei"}], "author_count": 1}, {"id": "2608.23177", "category": "math-ph", "title": "Correlation inequalities for transversal field models with application to quantum glasses", "abstract": "We study the class of transversal field models with pair interactions, including the quantum Curie-Weiss and the transversal field Ising model, as well as quantum spin glasses based on the Sherrington-Kirkpatrick (SK) and Edwards-Anderson models. Our main result is a general correlation inequality based on a Gaussian convolution estimate, which is derived from an extension of the Ding-Song-Sun inequality and an application of Brascamp-Lieb convexity techniques. The results apply for sufficiently strong transversal fields and, for quantum spin glasses, yield a high-field regime without replica order. Combined with the previously established low-field replica-symmetry-breaking regime, this gives distinct low- and high-field overlap phases. As a corollary of the logarithmic Sobolev inequalities for the underlying functional integrals derived here, we show the concentration of the self- and replica-overlap, and determine the high-field asymptotics of the pressure in the quantum SK model.", "url": "https://arxiv.org/abs/2608.23177", "type": "理论", "summary": "1. 该工作研究了含对相互作用的横场模型，包括量子Curie-Weiss、横场Ising以及SK和EA量子自旋玻璃，并证明了普适关联不等式。\n2. 其技术要点是通过推广Ding-Song-Sun不等式并运用Brascamp-Lieb凸性得到高斯卷积估计，从而在强横场区排除复制对称性破缺，并借助对数Sobolev不等式证明重叠浓度及SK模型压强的强场渐近。\n3. 结合先前低场复制对称破缺结果，该工作确立了低场与高场重叠相的分立图景，为量子玻璃及其他横场无序模型的严格分析开辟了方向。", "summary_source": "deepseek", "authors": [{"name": "Chokri Manai"}, {"name": "Simone Warzel"}], "featured_authors": [{"name": "Chokri Manai"}, {"name": "Simone Warzel"}], "author_count": 2}, {"id": "2608.23201", "category": "math-ph", "title": "Universality of the conformal anomaly", "abstract": "We prove a universal property of local real one-dimensional modular functors, which may be thought of as central extensions of the sewing operation on the (infinite-dimensional) Segal moduli spaces. Such modular functors are characterized by one real parameter: their central charge: Our result is an analogue of ``Mumford's theorem,'' that appeared in Segal's monograph [Seg88, Seg04] in the complex case. Algebraically, the modular functors are characterized by real-valued cocycles on pairs of surfaces under sewing. We identify the disk-disk cocycle as the universal Liouville action, also known as loop Loewner energy. The guiding example is the real determinant line bundle encoding the trace anomaly of conformal field theories (CFT) and the restriction function of Schramm-Loewner evolution (SLE) loop measures. Our result thus gives a mathematical explanation for the appearance of the central charge in CFT and SLE, and proves the conjectured uniqueness of Brownian loop measureas the canonical restriction function for SLE.", "url": "https://arxiv.org/abs/2608.23201", "type": "理论", "summary": "1. 该工作证明实一维局部模函子的一个普适性质，即此类由缝补操作定义的模函子仅由一个实参数——中心荷——刻画。\n2. 其核心在于将圆盘-圆盘上同调类等同于普适Liouville作用量（即圈Loewner能量），从而把共形场论迹反常与SLE圈测度纳入同一数学框架。\n3. 这为Brownian圈测度作为SLE典范限制函数的唯一性提供了证明，并解释了中心荷在CFT与SLE中出现的几何根源。", "summary_source": "deepseek", "authors": [{"name": "Sid Maibach"}, {"name": "Eveliina Peltola"}], "featured_authors": [{"name": "Sid Maibach"}, {"name": "Eveliina Peltola"}], "author_count": 2}, {"id": "2608.23266", "category": "math-ph", "title": "Elements of Topology, Differential Geometry and General Relativity for Physicists: A Mathematica-based Tutorial Approach", "abstract": "This book is a self-contained, tutorial introduction to topology, differential geometry, and general relativity for students and researchers in physics. Its distinguishing feature is a Mathematica-based approach that makes abstract constructions concrete through explicit, runnable notebooks and worked examples. A key contribution is a large collection of original Mathematica notebooks, written by the authors themselves, that let readers run, verify, and extend every demonstration. The first part covers point-set topology, topological spaces, continuity of maps, homotopy, and the fundamental group with applications that highlight the role of topology in modern physics. The second and largest part develops differential geometry from the ground up: manifolds, tangent and dual spaces, vector fields, pullbacks and pushforwards, Lie brackets and Lie algebras, local flows, and the Lie derivative. It then treats tensors, differential forms, the exterior derivative, volume forms, the metric tensor, and Hodge duality, emphasizing coordinate-free formulations and their computational realization. These tools are applied to Maxwell's equations in the language of forms and the generalized Stokes theorem, while Lie groups, fiber bundles, connections, and curvature bridge geometry and gauge-theoretic physics. The final part uses this framework to present general relativity, computing curvature tensors and field equations for standard spacetimes with dedicated Mathematica packages. Throughout, the book balances mathematical rigor with hands-on computation, enabling readers both to understand the theory and to reproduce every result themselves.", "url": "https://arxiv.org/abs/2608.23266", "type": "理论", "summary": "1. 该教程面向物理学者系统讲授点集拓扑、微分几何与广义相对论，并以可运行的Mathematica笔记本贯穿全部推导。\n2. 其特色在于通过自编原创笔记本将纤维丛、联络、曲率及场方程等抽象构造转化为可验证的计算实例，兼顾坐标无关形式化与显式计算。\n3. 这为理论物理教学中几何语言与符号计算的深度融合，以及读者自主复现并扩展标准时空计算提供了可迁移的范式。", "summary_source": "deepseek", "authors": [{"name": "Balasubramanian Ananthanarayan"}, {"name": "Souvik Bera"}, {"name": "Subhasish Chakrabarty"}, {"name": "Souradeep Das"}, {"name": "Amitabha Lahiri"}, {"name": "Suhas Sheikh"}, {"name": "Sarthak Talukdar"}], "featured_authors": [{"name": "Balasubramanian Ananthanarayan"}, {"name": "Souvik Bera"}, {"name": "Subhasish Chakrabarty"}, {"name": "Amitabha Lahiri"}, {"name": "Suhas Sheikh"}, {"name": "Sarthak Talukdar"}], "author_count": 7}, {"id": "2608.23342", "category": "math-ph", "title": "Instantons in a Double-Well are Poisson Distributed", "abstract": "We give a rigorous realization of the dilute instanton picture for a semiclassical Schrödinger operator with a symmetric double-well potential on $\\mathbb{R}^n$. Using a localized Feynman--Kac representation, we decompose the heat-kernel trace according to the number of passages made by a Brownian bridge between shrinking neighborhoods of the two wells. We identify the weight of one passage with a hopping coefficient $\\rho_\\lambda$, $\\displaystyle \\rho_\\lambda = \\int_{\\partial\\Omega} \\left( \\nabla\\overline{\\varphi_{\\lambda,0}^{\\Omega}}\\, \\varphi_{\\lambda,0}^{-\\Omega} - \\overline{\\varphi_{\\lambda,0}^{\\Omega}}\\, \\nabla\\varphi_{\\lambda,0}^{-\\Omega} \\right)\\cdot\\nu. $ On the exponentially long time scale $\\beta=N/\\lvert\\rho_\\lambda\\rvert$, the number of passages converges, for every fixed $N>0$, to a Poisson random variable of mean $N$. We identify $-\\frac{1}{\\lambda}\\log\\lvert\\rho_\\lambda\\rvert\\to S(d,-d)$ and obtain $\\displaystyle E_1(\\lambda)-E_0(\\lambda) = 2\\lvert\\rho_\\lambda\\rvert\\left(1+o(1)\\right). $ Thus the familiar instanton expansion of the double-well eigenvalue splitting emerges directly from a factorization of the heat-kernel trace.", "url": "https://arxiv.org/abs/2608.23342", "type": "理论", "summary": "1. 该工作对R^n上对称双阱半经典Schrödinger算子给出了稀薄瞬子图像的严格实现。\n2. 借助局部Feynman-Kac表示，热核迹按Brown桥在两阱邻域间穿越次数分解，单次穿越权重为跳跃系数ρλ；在指数长时标β=N/|ρλ|上，穿越次数对任意固定N收敛到均值为N的Poisson随机变量。\n3. 由此直接得到本征值劈裂E1-E0=2|ρλ|(1+o(1))，使双阱瞬子展开从热核迹分解中自然涌现。", "summary_source": "deepseek", "authors": [{"name": "Jacob Shapiro"}], "featured_authors": [{"name": "Jacob Shapiro"}], "author_count": 1}, {"id": "2608.23535", "category": "math-ph", "title": "Bound States in Exactly Solvable Polaritonic Models", "abstract": "We study a one-dimensional scalar model for an effective-mass quasiparticle field coupled to a continuum of two-level atoms with at most one excitation present. We prove a general theorem on the existence of bound states under sign-definite spatially localized perturbations of constant atomic density and analyze the bound states for several exactly solvable examples.", "url": "https://arxiv.org/abs/2608.23535", "type": "理论", "summary": "1. 该工作构建了一个一维可解极化子模型：有效质量准粒子场与双能级原子连续体耦合，限制至多一个激发，并在此框架下证明束缚态存在的一般定理。\n2. 主要技术卖点是把束缚态存在条件严格归结为常数原子密度上的符号确定、空间局域微扰，并利用多个精确可解例子给出束缚态波函数与能量本征值的闭合形式。\n3. 这一解析结果对低维光与物质耦合体系中束缚态的调控与探测具有直接参考价值，也为向高维、多激发或非均匀密度情形的严格推广提供了清晰起点。", "summary_source": "deepseek", "authors": [{"name": "Sam Johar"}, {"name": "Ryogo Katahira"}, {"name": "Joseph Kraisler"}], "featured_authors": [{"name": "Sam Johar"}, {"name": "Ryogo Katahira"}, {"name": "Joseph Kraisler"}], "author_count": 3}, {"id": "2608.21434", "category": "quant-ph", "title": "Maximal-Rank Squeezing from Rank-One Quenches: An Exact Spectral-Reachability Theorem for Gaussian Bosonic Systems", "abstract": "We prove an exact spectral-reachability theorem for multimode squeezing generated by finite-rank quadratic quenches in Gaussian bosonic systems. For a stable sign-definite stiffness quench $\\Omega^2 \\to \\Omega^2+\\varepsilon U U^T$, the kernel, range, and rank of the anomalous Bogoliubov block are determined exactly by the block-Krylov subspace generated by $\\Omega$ and $U$. In particular, $\\operatorname{rank}(\\beta_\\varepsilon)=\\sum_a \\operatorname{rank}(P_a U)$, where $P_a$ projects onto each distinct free-frequency eigenspace. Consequently, the microscopic rank of a perturbation does not bound the number of squeezing channels it can activate: for a simple spectrum, a single rank-one element with nonzero overlap with every mode produces a full-rank anomalous Bogoliubov response at every nonzero stable coupling. A signed Lyapunov-Gramian path shows that spectrally reachable directions cannot disappear through finite-coupling cancellation. The theorem also gives exact dark sectors, degeneracy bottlenecks, and actuator-position rules without computing the full Bogoliubov transformation. These results provide a direct hardware-screening principle for multimode Gaussian systems: one or a few physical elements can provide simultaneous support across many canonical squeezing channels, although algebraic rank alone does not imply strong squeezing or independent tunability.", "url": "https://arxiv.org/abs/2608.21434", "type": "理论", "summary": "1. 该工作证明了一个针对高斯玻色系统的精确谱可达性定理，刻画稳定符号定刚度淬火所产生多模压缩的核、值域与秩。\n2. 其核心卖点是用块-Krylov子空间给出反常Bogoliubov块的精确秩公式，并证明单个秩一扰动在简单频谱下即可激活满秩压缩通道，且有限耦合不会消除谱可达方向。\n3. 这为多模高斯系统提供了直接硬件筛选判据，即少数物理元件可同时支撑多个压缩通道，但代数秩本身并不保证强压缩或独立可调性。", "summary_source": "deepseek", "authors": [{"name": "Kamran Ansari"}], "featured_authors": [{"name": "Kamran Ansari"}], "author_count": 1}, {"id": "2608.21508", "category": "quant-ph", "title": "Anomalous Local Heat Capacity and Bipartite Entanglement", "abstract": "The heat capacity of a system quantifies how it energetically responds to changes in temperature at equilibrium. Whilst this quantity is positive and even additive for non-interacting systems, self-gravitating systems such as stars or subsystems of strongly interacting quantum systems are known to have negative or anomalous specific heat capacities. In this work, we investigate how the presence of entanglement at equilibrium can influence how an interacting system responds energetically to changes in temperature. We examine the local heat capacity of interacting quantum systems providing an analytical understanding for when anomalies occur. Most interestingly, we find a connection between local heat capacity anomalies and entanglement by deriving a separability bound based on the fluctuations of local and interaction energies. We illustrate our results with two examples (i) a nearest neighbour spin-1/2 chain and (ii) two coupled quantum harmonic oscillators. Lastly, we provide an information-theoretic formula connecting mutual information and athermality to the non-additivity of the heat capacity. Our results provide model-independent thermodynamic entanglement detection bounds and insight into the relationship between quantum correlations and the heat capacity of quantum systems.", "url": "https://arxiv.org/abs/2608.21508", "type": "理论", "summary": "1. 该工作解析研究平衡态相互作用量子系统的局域热容，给出局域热容异常出现的条件，并辅以最近邻自旋-1/2链与两个耦合谐振子示例加以验证。\n2. 核心在于用局域能与相互作用能的涨落推导可分性上界，并给出联系互信息、非热性与热容非可加性的信息论公式，建立模型无关的热力学纠缠探测判据。\n3. 这为借助热容测量直接甄别多体量子关联提供了模型无关的理论基础，也可能启发人们对自引力系统等负热容现象的量子信息根源做进一步探索。", "summary_source": "deepseek", "authors": [{"name": "Jake Xuereb"}, {"name": "A. de Oliveira Junior"}], "featured_authors": [{"name": "Jake Xuereb"}, {"name": "A. de Oliveira Junior"}], "author_count": 2}, {"id": "2608.21700", "category": "quant-ph", "title": "Scalable quantum simulation of continuous-time generative models via tensor networks", "abstract": "Continuous-time flow and diffusion models are widely used across many application domains, from large-scale deployment in computer vision and protein folding to emerging adoption for modeling language, time series, and quantum states. After training, inferring statistical properties from continuous-time models is costly. Wavefunction flows target this cost by recasting learned transport as unitary evolution, whose final Born distribution approximates the target distribution. This prepares a coherent amplitude encoding (a qsample) that can be post-processed by quantum algorithms offering a quadratic advantage over Monte Carlo sampling. We present the first numerical study of these flows, in which we represent time-dependent potentials and states as tensor networks. At spatial dimension $d=8$, storage falls by $\\sim 10^7\\times$ relative to the dense grid of $N^d$ points, and evolution wall-clock time falls by $\\gtrsim 10^3\\times$ against a baseline extrapolated from the measured $d\\le 5$ scaling. We validate our pipeline by reproducing the $O(1/\\sqrt{p_{\\rm rare}})$ scaling of rare-event sampling.", "url": "https://arxiv.org/abs/2608.21700", "type": "理论+数值", "summary": "1. 该工作利用张量网络首次数值实现了波函数流，将连续时间生成模型的输运过程映射为可扩展的幺正演化量子模拟。\n2. 其核心是以张量网络表示含时势与量子态，在空间维度 d=8 时存储量较 N^d 稠密网格降低约 10^7 倍，演化墙钟时间较外推基线降低逾 10^3 倍，并复现稀有事件采样的 O(1/√p_rare) 标度。\n3. 这为量子算法后处理相干振幅编码、实现超越蒙特卡洛采样的二次加速提供了可扩展的数值平台与明确研究方向。", "summary_source": "deepseek", "authors": [{"name": "Nathan X. Kodama"}, {"name": "L. Andrew Wray"}, {"name": "Sam Cochran"}, {"name": "Chad Rigetti"}, {"name": "Shravan Veerapaneni"}, {"name": "Michael J. Keiser"}], "featured_authors": [{"name": "Nathan X. Kodama"}, {"name": "L. Andrew Wray"}, {"name": "Sam Cochran"}, {"name": "Chad Rigetti"}, {"name": "Shravan Veerapaneni"}, {"name": "Michael J. Keiser"}], "author_count": 6}, {"id": "2608.21765", "category": "quant-ph", "title": "Markov Constraints Enhance Identifiability in Quantum Shadow Inversion", "abstract": "We study quantum shadow inversion under Markovian locality constraints for four-partite systems arranged along the chain $A$--$B$--$C$--$D$. The goal is to reproduce the expectation value of a fixed endpoint observable $O_{AD}$ after an unknown global unitary, without requiring full unitary inversion. We formulate the task using Markov-admissible supermaps and introduce the Markov-implementable centralizer to describe the remaining endpoint gauge freedom. We show that unrestricted endpoint post-processing is too broad, and impose an endpoint-local refinement. Under this condition, every implementable endpoint unitary must factorize across $A|D$, so the Markov constraint strictly reduces the centralizer-induced shadow ambiguity whenever the full centralizer contains non-product unitaries. This provides a structural mechanism by which Markov locality enhances identifiability in quantum shadow inversion.", "url": "https://arxiv.org/abs/2608.21765", "type": "理论", "summary": "1. 该工作研究四体链A-B-C-D上量子阴影反演在马尔可夫局域约束下的可辨识性，目标是在未知全局酉变换下仅恢复端点可观测量O_AD的期望值。\n2. 其核心在于引入马尔可夫可允超映射与马尔可夫可实现中心化子，证明端点局域细化要求可实现端点酉按A|D因子分解，从而在完整中心化子含非乘积酉时严格缩减阴影歧义。\n3. 这一机制将马尔可夫局域性确立为增强量子阴影反演可辨识性的结构条件，为多体几何中态识别与验证协议的设计提供了一般性指导。", "summary_source": "deepseek", "authors": [{"name": "Zhixing Chen"}, {"name": "Lin Chen"}], "featured_authors": [{"name": "Zhixing Chen"}, {"name": "Lin Chen"}], "author_count": 2}, {"id": "2608.21842", "category": "quant-ph", "title": "Noise-Symmetry Optimization of Quantum Error-Corrected Metrology", "abstract": "Quantum error correction (QEC) codes have emerged as a powerful tool to protect quantum-enhanced metrology against noise. However, the ability to correct errors alone does not guarantee high metrological sensitivity, as the encoded states may become insensitive to the parameter of interest. Here we show that this limitation can be overcome by exploiting an intrinsic freedom of QEC codes: for a fixed set of correctable errors, the Knill-Laflamme conditions admit an equivalence class of encodings. When the correctable noise possesses unitary symmetries, these symmetries generate continuous transformations within this class, allowing systematic optimization of the encoding to increase the quantum Fisher information while preserving the correctable set of noise. Based on this observation, we develop a symmetry-based optimization approach and derive criteria identifying when such optimization can enhance metrological sensitivity. In particular, for stabilizer-sum Hamiltonians, symmetry optimization can convert a code with vanishing QFI into one achieving the standard quantum limit in general or even Heisenberg scaling in specific cases, illustrating the power of symmetry optimization for QEC-assisted quantum metrology.", "url": "https://arxiv.org/abs/2608.21842", "type": "理论+数值", "summary": "1. 该工作提出一种利用噪声对称性优化量子纠错码编码的方法，以在保持可纠错噪声集合不变的前提下提升计量灵敏度。\n2. 其核心在于借助Knill-Laflamme条件允许的编码等价类，以及可纠错噪声的幺正对称性生成连续优化，并给出可优化性判据；对 stabilizer-sum 哈密顿量，能将量子Fisher信息为零的编码提升至标准量子极限甚至海森堡标度。\n3. 这为量子纠错辅助计量提供了一条不增加资源、仅利用编码内在对称性即可增强灵敏度的通用途径，并可望推广至更一般的噪声模型与参数估计问题。", "summary_source": "deepseek", "authors": [{"name": "Shuyun Su"}, {"name": "Shengshi Pang"}], "featured_authors": [{"name": "Shuyun Su"}, {"name": "Shengshi Pang"}], "author_count": 2}, {"id": "2608.21902", "category": "quant-ph", "title": "Belief Propagation-based Disentanglers for Tensor Network State Preparation", "abstract": "We develop a quantum circuit synthesis method for preparing a class of tensor network states. The scheme applies to states tractable with belief propagation (BP), a tensor network gauging scheme which recently allowed for classical simulations at large scales. The problem is reduced to independent, strictly local, classical variational optimizations: each nearest-neighbor two-qubit \"disentangler\" gate minimizes the entropy defined on an edge. Disentanglers drive the state to a product state and their Hermitian conjugate prepares the target. Each disentangling layer has depth at most $z+1$ (with $z$ the maximal number of nearest neighbors per site), the optimization has no barren plateaus, and the bond dimension stays bounded. As a demonstration, with only $3$-$5$ disentangling layers we prepare a $102$-qubit tree tensor network encoding a $17$-dimensional normal distribution and the transverse-field Ising model ground states on a $64$- to $127$-qubit heavy-hex lattice with fidelities of order $0.9-0.999$. The method opens new possibilities for quantum applications by transferring classical tensor network states onto hardware.", "url": "https://arxiv.org/abs/2608.21902", "type": "理论+数值", "summary": "1. 该工作提出一种基于信念传播的张量网络态量子电路制备方法，目标态由局域解纠缠门逐层构造。\n2. 其核心是将制备问题化为独立局域熵极小化，电路深度至多z+1，无贫瘠高原且键维数有界。\n3. 这为将经典张量网络态高效载入量子硬件提供了新途径，有望推动近期量子应用。", "summary_source": "deepseek", "authors": [{"name": "Tomasz Szołdra"}, {"name": "Peter Schmelcher"}], "featured_authors": [{"name": "Tomasz Szołdra"}, {"name": "Peter Schmelcher"}], "author_count": 2}, {"id": "2608.21904", "category": "quant-ph", "title": "How Far Can You Do Nothing On a Quantum Computer?", "abstract": "We present a route-resolved comparative assessment of Rigetti's Cepheus-1-108Q and IBM Heron-r2 processors using the established 'do-nothing' state-transfer protocol. Rather than proposing a new protocol, we use this deterministic, low-complexity task as a high-resolution spatial probe. For each evaluated initial qubit, we report two complementary quantities: the largest tested radius within which every evaluated shortest route satisfies the operational success rule, and the longest successful route identified within the evaluated route family. To achieve this, we address a deceptively simple yet foundational question: ``How far can you do-nothing on a quantum computer?'' Operationally, this do-nothing protocol serves as a fundamental state transfer protocol: we prepare an initial quantum state, route it across the physical qubits using SWAP gates, and measure the final state fidelity against the well-established classical fidelity limit for single-qubit state transfer. While this trivial state-transfer protocol serves as the most intuitive baseline, actively preserving a quantum state across a physical lattice proves to be a non-trivial task that exposes the information to cumulative relaxation, dephasing, and environmental cross-talk. In the highlighted IBM QPU case, we identify an isotropic radius of 10 and a successful path of swap distance 27, whereas the highlighted Rigetti Cepheus case exhibits an isotropic radius of 1 but selected above-threshold routes reaching swap distance 8. These results reveal a sharp distinction between uniform spatial reliability and best-route performance. The presented quantities are empirical and conditional on the evaluated route families, finite-shot decision rule, calibration state, and execution time; they are not architecture-wide constants.", "url": "https://arxiv.org/abs/2608.21904", "type": "数值", "summary": "1. 该工作采用“什么都不做”的态转移协议，对Rigetti Cepheus-1-108Q与IBM Heron-r2处理器进行了按路径解析的对比评估。\n2. 其技术要点是把这一低复杂度确定性任务当作高分辨空间探针，分别提取各起始比特的各向同性可靠半径与最长成功交换距离，揭示均匀空间可靠性与最优路径性能之间的显著差异。\n3. 这提示量子处理器基准测试应同时关注保真度的空间一致性与路由峰值能力，为硬件选型及容错映射策略提供经验依据。", "summary_source": "deepseek", "authors": [{"name": "Nitay Mayo"}, {"name": "Tal Mor"}, {"name": "Aryeh Lev Zabokritskiy"}], "featured_authors": [{"name": "Nitay Mayo"}, {"name": "Tal Mor"}, {"name": "Aryeh Lev Zabokritskiy"}], "author_count": 3}, {"id": "2608.22001", "category": "quant-ph", "title": "Finite-Resolution Limits on Quantum Uniqueness", "abstract": "The Stone-von Neumann theorem makes canonical quantization unique only after one imposes strong continuity of the Weyl translation groups. We show that this continuity assumption cannot be certified by any finite-resolution interrogation of the Weyl relations. A finite protocol probes only finitely many phase-space displacements and bounded expectation values, thereby determining a protocol algebra \\(C_S\\) generated by a finitely generated subgroup of Weyl translations, but not the regularity of an extension to the full Weyl algebra. Using the polymer representation as a canonical non-regular representation, we prove that for every regular Weyl representation, every normal state, and every finite family of bounded protocol observables, a polymer state reproduces the same expectation values to arbitrary prescribed accuracy. Thus finite agreement with Schrödinger quantum mechanics does not operationally certify the regularity hypothesis entering uniqueness. The result does not assert physical equivalence between regular and polymer quantizations, it identifies where additional input, such as Hamiltonian dynamics, energy regularity, semiclassicality, or a continuum limit, is required to distinguish or select representations. In this precise sense, non-regular polymer kinematics are not excluded by finite Weyl data alone, a point of direct relevance to quantum-gravity motivated quantizations.", "url": "https://arxiv.org/abs/2608.22001", "type": "理论", "summary": "1. 该工作证明有限分辨率的外尔关系检验无法认证正则量子化唯一性所需的连续正则性条件，即强连续性不能由任何有限协议确证。\n2. 作者利用聚合物表示构造非正则态，证明对任意正则表示、任意正规态和有限个有界可观测量，都能以任意预定精度复现相同期望值，从而说明有限外尔数据无法在操作上认证正则性假设。\n3. 因此仅凭有限外尔数据不能排除非正则聚合物运动学，须引入哈密顿动力学、能量正则性或半经典极限等额外输入来区分表示；这对量子引力启发的量子化方案具有直接意义。", "summary_source": "deepseek", "authors": [{"name": "Seramika Ariwahjoedi"}, {"name": "Sameer Ahmad Mir"}, {"name": "Mir Faizal"}], "featured_authors": [{"name": "Seramika Ariwahjoedi"}, {"name": "Sameer Ahmad Mir"}, {"name": "Mir Faizal"}], "author_count": 3}, {"id": "2608.22017", "category": "quant-ph", "title": "Quantifying Nonstabilizerness of Codeword-Stabilized Codes", "abstract": "Fault-tolerant quantum computation requires non-Clifford gates, which stabilizer codes cannot supply transversally. Non-stabilizer codes are the natural place to look for them, yet no quantitative theory of the nonstabilizerness (or magic) carried by such a code has existed. We develop one for codeword-stabilized (CWS) codes and show that the key quantity is classical: a code's nonstabilizerness is fixed by how its codewords collide under translation, a question that belongs to additive combinatorics. We show that the most magical codes are exactly the Sidon sets whenever a Sidon set of the required size exists, whose pairwise differences are all distinct. No code carries more than twice its number of logical qubits of nonstabilizerness however large it is physically. Furthermore, the same reduction gives structural and operational results. Nonstabilizerness is unchanged by coset closure, which yields non-stabilizer codes with arbitrarily many logical qubits and constant nonstabilizerness as the number of logical qubits grows. A diagonal transversal gate with $k$ logic qubits that is non-Clifford on $t$ coordinates forces the code's nonstabilizerness to be at most $2(k-t)$; thus the nonstabilizerness also bounds the non-Clifford gates needed to build the code and the cost of classically simulating it. Finally, entire families become exactly computable, and we obtain closed-form values for the Kerdock codes. Together these results turn the search for magic-rich codes and transversal non-Clifford gates into classical counting problems, which can be approached with standard tools from additive combinatorics.", "url": "https://arxiv.org/abs/2608.22017", "type": "理论", "summary": "1. 该工作为CWS码建立非稳定化能力(魔术)的定量理论，将其化为码字平移碰撞的加性组合学问题。\n2. 核心结果是：若所需大小的Sidon集存在，最魔的码正是Sidon集；任意码魔术不超过其逻辑量子位数量的两倍，且陪集闭包可给出任意多逻辑量子比特而魔术恒定的非稳定化码。\n3. 该约化还给出含k个逻辑比特、t个非Clifford坐标的对角横向门的魔术上界2(k-t)，使Kerdock码等可闭式求解，并将高魔术码搜索化为经典计数问题。", "summary_source": "deepseek", "authors": [{"name": "Yuan Liu"}, {"name": "Ke-Mi Xu"}], "featured_authors": [{"name": "Yuan Liu"}, {"name": "Ke-Mi Xu"}], "author_count": 2}, {"id": "2608.22168", "category": "quant-ph", "title": "Deterministic preparation of entangled Dicke states", "abstract": "Dicke states $|J=N/2,m\\rangle$ of a collection of $N$ atoms were central to Dicke's theory of superradiance. Except for the fully polarized end states, they are entangled many-body states; in particular, the single-excitation Dicke state is the W state well known in quantum information science. However, deterministic preparation of Dicke states with a prescribed spin projection remains challenging, especially without relying on postselection or heralding. Here we present a detuning-programmed Hamiltonian protocol using atoms or qubits in a dispersive cavity subject to a coherent transverse drive. In the absence of the drive, the off-resonant cavity produces an effective collective-spin interaction. By combining this cavity-mediated interaction with the coherent drive, tuning the atom--drive detuning enables the protocol, in principle, to target any allowed Dicke state along the symmetric Dicke ladder. Starting from the transverse-drive ground state, adiabatic ground-state interpolation prepares the selected Dicke state by ramping down the drive strength while ramping up the cavity-mediated interaction. After preparation, tuning the cavity into resonance with the atoms or qubits provides a direct way to probe the collective-emission response of the prepared Dicke state. We discuss implementation with superconducting circuit QED and show that the prepared states, especially the central Dicke state with $m=0$, provide resources for quantum sensing with Heisenberg-limited scaling.", "url": "https://arxiv.org/abs/2608.22168", "type": "理论", "summary": "1. 该工作提出一种基于色散腔中原子或量子比特与相干横向驱动相结合的失谐编程哈密顿量协议，原理上可确定性制备对称Dicke阶梯上任意允许自旋投影的纠缠Dicke态。\n2. 其技术卖点在于通过调节原子-驱动失谐并联合腔诱导的集体自旋相互作用，从横向驱动基态绝热插值到目标态，无需后选择或预报；制备后调腔至共振可直接探测其集体辐射响应。\n3. 该方案在电路QED中可行，且所制备态、尤其是m=0的中心Dicke态，可作为海森堡极限标度量子传感的资源，为确定性多体纠缠制备与量子计量提供清晰路径。", "summary_source": "deepseek", "authors": [{"name": "Hui Wang"}, {"name": "Marlan O. Scully"}, {"name": "Girish S. Agarwal"}], "featured_authors": [{"name": "Hui Wang"}, {"name": "Marlan O. Scully"}, {"name": "Girish S. Agarwal"}], "author_count": 3}, {"id": "2608.22199", "category": "quant-ph", "title": "Bloch states of an infinite one-dimensional lattice under transverse electric field", "abstract": "We consider an effectively one-dimensional periodic atomic chain subjected to a weak static electric field transverse to the chain axis. The intrinsic lattice is represented in reciprocal space by a harmonically weighted periodic pseudopotential, while the transverse field produces a weak elastic and polarizable response whose minimum-energy distribution is approximated by a periodically repeated catenary profile. Bloch reduction places both contributions in a common reciprocal-space Hamiltonian. The intrinsic lattice produces a \\ (|r-s|^ {-1} \\) hierarchy, whereas the catenary contribution is a symmetric Toeplitz correction with coefficients proportional to \\((1+\\pi^2(r-2) ^ {-1} \\) and therefore asymptotically to \\ (|r-s|^ {-2} \\). The complete nonzero reciprocal weight of the catenary contribution is absolutely convergent and sums to \\ (|V_ {\\rm c} |/e \\). At the unit-cell level, the lowest intrinsic harmonic together with the catenary term gives a Mathieu equation containing both cosine and hyperbolic-cosine modulations. A first-Brillouin-zone reduction then yields the field-dependent band energies and the corresponding hierarchy of Bragg gaps. The model isolates a simple mechanism by which a transverse electric field can reorganize the Bloch spectrum of a low-dimensional periodic system. Keywords: Bloch theory; transverse electric field; catenary potential; Mathieu equation; Brillouin zone; band structure.", "url": "https://arxiv.org/abs/2608.22199", "type": "理论", "summary": "1. 该工作构建了无限一维周期链在横向静电场中的布洛赫理论，将本征晶格与横向场引起的悬链线响应统一纳入倒空间哈密顿量。\n2. 其技术要点在于揭示本征晶格与悬链线贡献分别形成|r-s|^{-1}与渐近|r-s|^{-2}的Toeplitz结构，并在原胞层次导出含余弦和双曲余弦调制的Mathieu方程，从而给出场依赖的能带与布拉格隙层次。\n3. 该模型为研究横向电场重整低维周期系统布洛赫谱提供了一种最小机制，可启发相关凝聚态或超冷原子平台中的能带调控实验。", "summary_source": "deepseek", "authors": [{"name": "Anand Aruna Kumar"}], "featured_authors": [{"name": "Anand Aruna Kumar"}], "author_count": 1}, {"id": "2608.22357", "category": "quant-ph", "title": "Spinning giant optomechanical cavity with nonreciprocal self-interference", "abstract": "We study a spinning optomechanical cavity that is coupled to a meandering waveguide at multiple spatially separated points, forming a giant-cavity configuration. The resulting self-interference makes the effective optical driving, linewidth, and frequency shift strongly dependent on the propagation phase in the waveguide, while the rotation-induced Sagnac-Fizeau shift causes the clockwise (CW) and counterclockwise (CCW) cavity modes to experience distinct interference phases. Under single-tone driving, this mechanism enables phase-controlled phonon cooling and, in the presence of cavity rotation, nonreciprocal cooling, with one propagation direction approaching the mechanical ground-state regime while the opposite direction remains less efficiently cooled. Under two-tone driving, the same interference mechanism engineers a squeezed reservoir for the mechanical mode, producing steady-state squeezing that likewise becomes nonreciprocal under cavity rotation. These results establish multi-point self-interference as a versatile mechanism for phase-controlled optomechanical reservoir engineering and show that, when combined with cavity rotation, it provides a route to nonreciprocal quantum effects.", "url": "https://arxiv.org/abs/2608.22357", "type": "理论", "summary": "1. 该工作研究了与蜿蜒波导多点耦合的旋转巨型光机腔，证明自干涉使有效驱动、线宽和频移随波导传播相位强烈变化。\n2. 其核心是利用旋转诱导的萨尼亚克-菲佐位移令顺/逆时针腔模获得不同干涉相位，进而在单频驱动下实现一方向近机械基态的非互易冷却，并在双频驱动下形成非互易稳态压缩库。\n3. 这表明多点自干涉是相控光机库工程的通用机制，与腔旋转结合为非互易量子效应和手征量子态操控提供了可行途径。", "summary_source": "deepseek", "authors": [{"name": "Yao-Tong Chen"}], "featured_authors": [{"name": "Yao-Tong Chen"}], "author_count": 1}, {"id": "2608.22384", "category": "quant-ph", "title": "Laughlin quasihole geometry from a single snapshot ensemble", "abstract": "Can a probability distribution measured in one basis determine complex quantum geometry? The answer is affirmative for a lattice Laughlin quasihole. The exact occupation law at one generic reference position, together with the known analytic quasihole factor, fixes the complete complex Gram kernel. A finite snapshot ensemble estimates this kernel without preparing another member of the family, and thereby determines finite-distance overlaps, Bargmann phases, the quantum metric, and the Berry curvature. The same analytic structure confines the family to an exact projective subspace whose dimension grows at most linearly with particle number. Exact enumeration of a Nielsen-Cirac-Sierra state demonstrates finite-shot reconstruction of both the metric and a geometric phase. Moreover, a Rényi-2 divergence sets the statistical range of the reconstruction while, at nondegenerate points, occupation readout also attains the local single-copy multiparameter information bound.", "url": "https://arxiv.org/abs/2608.22384", "type": "理论", "summary": "1. 该工作证明单基概率分布可确定格点Laughlin准空穴的完整量子几何。\n2. 利用一个参考位置的精确占据数及已知解析因子重构复Gram核，从而获得量子度规与Berry曲率，并将该族限制在维数随粒子数线性增长的投影子空间内。\n3. 在Nielsen-Cirac-Sierra态上的有限快照重构同时涵盖度规与几何相，Rényi-2散度刻画统计范围，且占据读取达到单拷贝多参数信息界。", "summary_source": "deepseek", "authors": [{"name": "Kaushlendra Kumar"}], "featured_authors": [{"name": "Kaushlendra Kumar"}], "author_count": 1}, {"id": "2608.22393", "category": "quant-ph", "title": "Inclusion-Minimal local indistinguishability: a weak form of nonlocality", "abstract": "Local discrimination of quantum states is a fundamental task in distributed quantum information processing and underlies applications such as quantum communication, data hiding, and secret sharing. Here we investigate a weak form of local indistinguishability by asking how easily it can disappear when the candidate set is reduced or an additional copy of the unknown state is supplied. We introduce inclusion-minimal locally indistinguishable sets, namely, locally indistinguishable sets for which every proper subset is perfectly distinguishable by local operations and classical communication (LOCC), and show that every finite locally indistinguishable set contains such a subset. We further find that any inclusion-minimal locally indistinguishable sets becomes perfectly distinguishable by LOCC when two identical copies are available, although a single copy is insufficient. Fininally, We construct explicit inclusion-minimal locally indistinguishable product-state sets in $(\\mathbb C^d)^{\\otimes n}$ for every odd $d=2k+1$ and $n\\ge2$. These results show that local indistinguishability can be nontrivial at the single-copy level yet fragile under either the removal of candidate states or a modest increase in copy resources, providing a complementary perspective on the structure of quantum nonlocality.", "url": "https://arxiv.org/abs/2608.22393", "type": "理论", "summary": "1. 该工作提出包含极小局部不可区分集合的概念，即每个真子集都可由LOCC完美区分的局部不可区分集合，并证明任何有限局部不可区分集合必含此类子集。\n2. 其关键发现在于这类集合在单拷贝下不可区分，但一旦提供两份相同拷贝即可被LOCC完全区分，同时该工作对所有奇维d=2k+1和n≥2构造了(C^d)^{⊗n}中的显式积态实例。\n3. 这显示局部不可区分性既可在单拷贝层面非平凡，又会因候选态集收缩或拷贝资源适度增加而消失，为量子非局域性的结构研究提供了资源依赖的互补视角。", "summary_source": "deepseek", "authors": [{"name": "Mao-Sheng Li"}, {"name": "Zong-Xing Xiong"}, {"name": "Zhu-Jun Zheng"}, {"name": "Yan-Ling Wang"}], "featured_authors": [{"name": "Mao-Sheng Li"}, {"name": "Zong-Xing Xiong"}, {"name": "Zhu-Jun Zheng"}, {"name": "Yan-Ling Wang"}], "author_count": 4}, {"id": "2608.22404", "category": "quant-ph", "title": "Error Propagation Theory for Variational Non-Markovian Open Quantum Dynamics", "abstract": "Variational approaches based on neural quantum states and physics-informed neural networks provide powerful paradigms for simulating non-Markovian open quantum dynamics. However, extending these methods into the strongly non-Markovian regime reveals a critical bottleneck: even minute errors in the time evolution can translate into substantial deviations in physical observables. The fundamental origin of this stringent precision requirement, as well as how non-Markovianity governs it, remains an open question. Here, we develop a theoretical framework that systematically characterizes error propagation in variational non-Markovian dynamics. By combining analytical derivations with numerical verification, we present the first quantitative description of variational error evolution over time. Our analysis uncovers an intrinsic error-backflow mechanism driven by long-lived environmental memory. This mechanism establishes a fundamental precision barrier and provides concrete guidance for designing robust variational algorithms for strongly non-Markovian quantum systems.", "url": "https://arxiv.org/abs/2608.22404", "type": "理论+数值", "summary": "1. 该工作建立了变分非马尔可夫开放量子动力学中误差传播的理论框架，并结合解析推导与数值验证刻画了误差随时间的演化。\n2. 其核心发现在于揭示由长寿命环境记忆驱动的内在误差回流机制，该机制定量解释了强非马尔可夫区对精度的严苛要求并确立了基本精度壁垒。\n3. 这一认识为设计面向强非马尔可夫量子系统的稳健变分算法提供了具体指导，并对神经量子态与物理信息神经网络类方法的适用范围给出了明确启示。", "summary_source": "deepseek", "authors": [{"name": "Long Cao"}, {"name": "Daochi Zhang"}, {"name": "Yao Wang"}, {"name": "Liwei Ge"}, {"name": "Rui-Xue Xu"}, {"name": "YiJing Yan"}, {"name": "Xiao Zheng"}], "featured_authors": [{"name": "Long Cao"}, {"name": "Daochi Zhang"}, {"name": "Yao Wang"}, {"name": "Rui-Xue Xu"}, {"name": "YiJing Yan"}, {"name": "Xiao Zheng"}], "author_count": 7}, {"id": "2608.22656", "category": "quant-ph", "title": "Sharp State-Independent Uncertainty Relations for Multipartite systems", "abstract": "Uncertainty relations constrain the fluctuations of incompatible observables, but most familiar bounds depend on the quantum state. State-independent uncertainty relations instead ask how much fluctuation remains unavoidable for every quantum state. For observables generated by a continuous symmetry, sharp state-independent bounds are known when the symmetry representation is irreducible. Multipartite collective systems, however, generally appear as reducible tensor-product representations of a symmetry algebra, which raises the question of how to determine their total uncertainty. We resolve this problem for multipartite quantum systems with a compact semisimple symmetry algebra $\\mathfrak g$. Exploiting the symmetry structure, we formulate a general framework for state-independent uncertainty based on representation theory. The total variance admits an exact decomposition into intrinsic fluctuations within irreducible sectors and a nonnegative dispersion between sectors. This yields the sharp state-independent bound for the total variance $\\Delta_\\rho^2(\\mathfrak g)$ on the multipartite Hilbert space $\\mathcal H$ \\[ \\min_{\\rho}\\Delta_\\rho^2(\\mathfrak g) = \\min_{\\lambda\\in\\Lambda(\\mathcal H)} 2\\langle\\lambda,\\delta\\rangle, \\] where $\\rho$ is any density operator on $\\mathcal H$, $\\Lambda(\\mathcal H)$ is the set of highest weights $\\lambda$ labeling those sectors, and $\\delta$ is the Weyl vector. This demonstrates that the ultimate uncertainty is completely controlled by its intrinsic symmetry structure. As a special example, this result confirms our previous conjecture that the total uncertainty floor of collective spin-$1/2$ systems depends only on the parity of the particle number. We further illustrate the framework for multipartite spin-$1$ systems, demonstrating that the same symmetry-sector mechanism persists beyond spin-$1/2$.", "url": "https://arxiv.org/abs/2608.22656", "type": "理论", "summary": "1. 该工作针对具有紧致半单李代数对称性的多体量子系统，提出了基于表示论的状态无关不确定性关系的一般框架。\n2. 其核心在于将总方差精确分解为不可约表示内的固有涨落与扇区间的非负色散，从而得到由最高权与Weyl向量决定的总方差尖锐下界。\n3. 该结果证实了集体自旋-1/2系统的不确定性地板仅取决于粒子数奇偶性的猜想，并将其推广至自旋-1系统，表明该对称扇区机制具有普适性。", "summary_source": "deepseek", "authors": [{"name": "Yiling Wang"}, {"name": "Naihuan Jing"}], "featured_authors": [{"name": "Yiling Wang"}, {"name": "Naihuan Jing"}], "author_count": 2}, {"id": "2608.22664", "category": "quant-ph", "title": "Time-Resolved Edge Flux on the SU(3) Triangle: A Cooperative-Decay Graph Framework with Exact Bateman Solutions", "abstract": "Cooperative emission from three-level ensembles is conventionally diagnosed through the radiated intensity alone, which cannot say which channels carry the photons at each instant. We promote every transition of the cooperative-decay graph into a time-dependent edge flux and show that node-wise conservation of this flux is an exact restatement of the Pauli master equation. Suppose the graph carries a depth function that decreases by one along every edge. Then the total cooperative rate is the descent speed of the mean graph depth, and its energy-weighted form gives the radiated intensity as $I(t)=-\\dd\\langle E\\rangle/\\dd t$ for arbitrary level spacings. The same ordering triangularizes the generator. This delivers the relaxation spectrum from the state exit rates, together with a generalized Bateman closed form for every population on an arbitrary finite directed acyclic graph, in which all exit-rate degeneracies are absorbed into a polynomial-times-exponential recursion.", "url": "https://arxiv.org/abs/2608.22664", "type": "理论+数值", "summary": "1. 该工作提出一个合作衰变图框架，将SU(3)三角上三能级系综的每个跃迁通道表示为含时边通量，从而分辨各时刻携带光子的具体通道。\n2. 其技术要点是证明边通量的节点守恒精确等价于Pauli主方程，并利用沿边深度递减的排序使生成元三角化，从态退出率得到弛豫谱及I(t)=-d⟨E⟩/dt。\n3. 该框架对任意有限有向无环图给出所有布居的广义Bateman闭式解，将退出率简并吸收为多项式乘指数递归，为多通道合作发射的瞬态诊断提供可解析途径。", "summary_source": "deepseek", "authors": [{"name": "Gombojav O Ariunbold"}, {"name": "Vaidyanathan Sivaraman"}], "featured_authors": [{"name": "Gombojav O Ariunbold"}, {"name": "Vaidyanathan Sivaraman"}], "author_count": 2}, {"id": "2608.22684", "category": "quant-ph", "title": "Quantifying Multipartite Entanglement Based on unified entropy", "abstract": "In this paper, we investigate the characterization of multipartite entanglement based on the unified $(q,s)$-entropy framework. For bipartite quantum states, we propose an entanglement measure $E_{q,s}^{A|B}(\\rho)$ based on unified entropy and derive several analytical lower bounds for it using local orthonormal observables. We demonstrate with concrete examples that our lower bounds provide tighter estimates of quantum entanglement than several existing analytical bounds. For multipartite quantum states, based on unified entropy, we propose two measures $A^k_{q,s}(\\rho)$ and $G^k_{q,s}(\\rho)$ for quantifying $k$-nonseparability, and prove that these measures satisfy several desirable properties, such as faithfulness, local unitary invariance, and convexity. Moreover, we rigorously prove that when the parameters $q$ and $s$ are in certain ranges, $A^k_{q,s}(\\rho)$ and $G^k_{q,s}(\\rho)$ also satisfy monotonicity and strong monotonicity. Furthermore, we establish the order relations of the measures $A^k_{q,s}(\\rho)$ and $G^k_{q,s}(\\rho)$ with respect to the parameters $q$ and $s$ for fixed quantum states. In addition, for fixed $q$ and $s$, we also give their order relations for any two pure states.", "url": "https://arxiv.org/abs/2608.22684", "type": "理论", "summary": "1. 该工作基于统一(q,s)-熵框架，提出两体纠缠度量 E_{q,s}^{A|B}，并推广出多体 k-不可分度量 A^k_{q,s} 与 G^k_{q,s}。\n2. 其技术卖点在于利用局域正交可观测量导出更紧的解析下界，并证明这些多体度量满足忠实性、局域酉不变性、凸性，且在特定参数区间内满足单调性与强单调性。\n3. 这为统一熵框架下多体纠缠的资源化描述、参数依赖的纠缠排序，以及量子信息实验中的纠缠探测提供了新思路。", "summary_source": "deepseek", "authors": [{"name": "Yan Hong"}, {"name": "Tongtong Xu"}, {"name": "Limin Gao"}], "featured_authors": [{"name": "Yan Hong"}, {"name": "Tongtong Xu"}, {"name": "Limin Gao"}], "author_count": 3}, {"id": "2608.22769", "category": "quant-ph", "title": "Classical and quantum spectral density estimation under local graph access", "abstract": "We study spectral density estimation for the normalized adjacency matrix of an unweighted graph under local access model. Previously, Cohen-Steiner et al. [KDD 2018] proposed an algorithm for $\\varepsilon$-approximate spectral density estimation in the Wasserstein-1 distance, using $2^{O(1/\\varepsilon)}$ local queries to the graph. In this paper, we prove that every constant-success estimator with Wasserstein--$1$ error at most $\\eps$ requires $2^{\\Omega(1/\\eps)}$ queries, showing that the Cohen-Steiner algorithm is optimal up to constant in the exponent. This resolves the open problem left by previous researches Jin et al. [COLT 2023] and Peng et al. [COLT 2026]. We then turn to quantum local access model. We give an $\\widetilde O(\\eps^{-3})$-query algorithm estimating the spectral density with Wasserstein-1 error at most $\\eps$. Finally, we prove a $\\widetilde\\Omega(\\eps^{-4/3})$ quantum lower bound when the graph is sufficiently large. As a result, quantum local access model changes the dependence on $\\eps$ from exponential to polynomial.", "url": "https://arxiv.org/abs/2608.22769", "type": "理论+数值", "summary": "1. 该工作研究了局部图访问模型下归一化邻接矩阵谱密度的经典与量子估计，证明了经典常数成功概率ε近似估计的Wasserstein-1查询下界为2^{Ω(1/ε)}，与已知算法匹配并解决了此前开放问题。\n2. 其核心贡献在于给出量子局部访问下~O(ε^{-3})查询的估计算法，并证明大图上的~Ω(ε^{-4/3})量子下界，从而展示量子访问将ε依赖由指数改善为多项式。\n3. 这一结果为谱密度估计的量子优势提供了严格刻画，并为局部图访问模型中进一步探索量子-经典分离及精化量子复杂度下界提供了明确方向。", "summary_source": "deepseek", "authors": [{"name": "Rong-Hua Li"}, {"name": "Meihao Liao"}, {"name": "Yichun Yang"}], "featured_authors": [{"name": "Rong-Hua Li"}, {"name": "Meihao Liao"}, {"name": "Yichun Yang"}], "author_count": 3}, {"id": "2608.22801", "category": "quant-ph", "title": "An Exactness Barrier for ZX-Calculus Optimization of Synthesized Clifford+T Circuits", "abstract": "Gate synthesis and circuit optimization are usually studied separately, and evidence on their interaction is contradictory: ZX-calculus rewriting removes a stable fraction of Solovay-Kitaev circuits, yet almost nothing from number-theoretically synthesized circuits. We show both behaviours follow from a single bound. For any optimizer that preserves the implemented element exactly--including all sound ZX rewriting with extraction--the achievable T-count is bounded below by the denominator exponent of the synthesized ring element. This exactness barrier is computable per instance and separates exact post-processing from approximation-aware resynthesis by a certified factor reaching 101x at recursion depth five. The two behaviours are then the barrier operating at different distances from the floor. For Solovay-Kitaev circuits we prove that the local ZX simplification layer (spider fusion and identity removal) computes exactly the free-product normal form of Z_2 * Z_8, giving exact per-instance compression and, under a calibrated ergodicity hypothesis, a depth-independent limit law confirmed on two independently constructed nets. For number-theoretically synthesized circuits the floor is already saturated: on single-qubit words automated ZX simplification attains it exactly, via a closed-form formula for minimal T-count in terms of phase linkage through the Z-axis normalizer. At two qubits and beyond the same valuation yields unconditional rigidity certificates, which on the quantum-Shannon-decomposition plus gridsynth pipeline certify 99.4-99.9% of the synthesized T-count as incompressible, with rigidity strengthening as accuracy tightens. This explains, and predicts the size of, the near-null optimization recently reported for that pipeline.", "url": "https://arxiv.org/abs/2608.22801", "type": "理论+数值", "summary": "1. 该文针对 Clifford+T 电路综合后的 ZX 重写，证明了由合成环元分母指数给出的精确 T 计数下界。\n2. 该下界统一解释了 Solovay-Kitaev 可压缩与数论综合近零优化，并给出可达 101 倍的精确后处理可证分离。\n3. 由此可预先判定并证明量子 Shannon 分解等流水线中 99.4%–99.9% T 计数不可压缩，为优化适用性提供刚性判据。", "summary_source": "deepseek", "authors": [{"name": "Chon-Fai Kam"}, {"name": "Anuradha Mahasinghe"}, {"name": "Kaushika De Silva"}, {"name": "Frédéric Cadet"}, {"name": "Jingbo Wang"}], "featured_authors": [{"name": "Chon-Fai Kam"}, {"name": "Anuradha Mahasinghe"}, {"name": "Kaushika De Silva"}, {"name": "Frédéric Cadet"}, {"name": "Jingbo Wang"}], "author_count": 5}, {"id": "2608.22850", "category": "quant-ph", "title": "Implementation of nonlocal multi-photon interference by mode swapping", "abstract": "Multi-photon interference can be observed using independently generated photons as input. In the most simple case, these photons meet up at a beam splitter, resulting in quantum interference between transmission and reflection of the photons. Here, we show that non-local multi-photon interference can be implemented by using a mode swap operation to generate entanglement between the photons detected in the outputs of two spatially separated interferometers. The spatial separation of the output photons makes this implementation of multi-photon interference particularly suitable for quantum protocols that distribute quantum information to different parties.", "url": "https://arxiv.org/abs/2608.22850", "type": "理论", "summary": "1. 该工作提出利用模式交换操作实现非局域多光子干涉的方案，使独立光子无需在同一分束器会合即可产生干涉。\n2. 其核心在于模式交换在两个空间分离干涉仪的输出光子间建立纠缠，从而将传统局域干涉转化为跨空间非局域关联。\n3. 这一机制为涉及多方量子信息分发的协议提供了更适配的干涉实现途径，有望促进多光子纠缠分发与量子网络应用。", "summary_source": "deepseek", "authors": [{"name": "Holger F. Hofmann"}, {"name": "Yuki Kodama"}, {"name": "Jonte R. Hance"}], "featured_authors": [{"name": "Holger F. Hofmann"}, {"name": "Yuki Kodama"}, {"name": "Jonte R. Hance"}], "author_count": 3}, {"id": "2608.22892", "category": "quant-ph", "title": "Deterministic Preparation of Arbitrary Spin Eigenfunctions", "abstract": "Quantum states with conserved total spins, or spin eigenfunctions, are important for studying quantum chemistry and quantum manybody physics problems. A typical class of spin eigenfunctions are Dicke states, which attain maximal spins. While we already have many efficient quantum algorithms to prepare Dicke states, it is not yet clear if we could do so for arbitrary spin eigenfunctions deterministically. Generalizing Bärtschi and Eidenbenz's elegant algorithms for Dicke state preparation, we successfully prepare arbitrary spin eigenfunctions characterized by branching paths and binary spin trees. As a byproduct, we also develop the corresponding classical algorithms to reconstruct all these spin states.", "url": "https://arxiv.org/abs/2608.22892", "type": "数值", "summary": "1. 该工作将Dicke态制备算法推广，提出任意自旋本征函数（由分支路径与二元自旋树刻画）的确定性量子制备方案。\n2. 技术卖点在于针对任意总自旋守恒态统一构造确定性量子线路，并附带相应经典算法以重构这些自旋态。\n3. 这为量子化学与多体问题中非最大自旋守恒态的制备提供了通用工具，并可能启发更广泛对称约束态的确定性合成。", "summary_source": "deepseek", "authors": [{"name": "Wenxuan Tao"}, {"name": "Jianan Wang"}, {"name": "Fen Zuo"}], "featured_authors": [{"name": "Wenxuan Tao"}, {"name": "Jianan Wang"}, {"name": "Fen Zuo"}], "author_count": 3}, {"id": "2608.22919", "category": "quant-ph", "title": "Geometric Phases of a Driven Qubit: Comparing Berry and Uhlmann Holonomies", "abstract": "The Berry phase arises naturally from the adiabatic dynamics of a pure quantum state, whereas the Uhlmann phase is usually formulated kinematically for a prescribed path of mixed states. For a qubit subject to a uniformly gapped conical drive, we obtain the Uhlmann connection and holonomy in closed form for the equilibrium Gibbs cycle. We then solve the corresponding Lindblad equation exactly in the rotating frame and show that its steady state forms a nonequilibrium limit cycle that lags the instantaneous Gibbs cycle. As the driving becomes slow, the Uhlmann phase approaches the equilibrium Uhlmann phase, which cooling then reduces to the Berry phase: in the joint adiabatic and low-temperature limit, the dynamical Uhlmann phase therefore converges to the Berry phase. This grounds the Uhlmann--Berry correspondence in the physical dynamics of an open system. We also characterize the finite-driving corrections, together with the discontinuous $\\pi$ jump that the Uhlmann phase undergoes on the equatorial cycle as the temperature is varied. Finally, we examine an isolated transversal gap closing, where this zero-temperature correspondence can break down: the pure-state path becomes open, its closure is ambiguous, and gap-opening regularizations close it along a geodesic set by the direction of the bias field, splitting the Berry phase into a one-parameter family of values. The Gibbs path instead closes smoothly through the maximally mixed state, so the Uhlmann holonomy requires no regularization and remains unique and continuous at every finite temperature. In the low-temperature limit the Uhlmann phase selects a single member of the Berry family---the geodesic closure in the osculating plane, fixed by the velocity and acceleration of the driving field. The Uhlmann--Berry correspondence of the gapped regime thus survives the gap closing as a geodesic selection rule.", "url": "https://arxiv.org/abs/2608.22919", "type": "理论", "summary": "1. 该工作对均匀能隙锥形驱动的单量子比特系统，求得平衡 Gibbs 循环上 Uhlmann 联络与和乐的闭式解，并在旋转坐标架中精确求解 Lindblad 方程。\n2. 其核心在于证明稳态非平衡极限环迟滞于瞬时 Gibbs 循环，并在联合绝热与低温极限下使动力学 Uhlmann 相位收敛至 Berry 相位，且刻画有限驱动修正及赤道循环上的 π 跃变。\n3. 这为 Uhlmann–Berry 对应提供了开放系统动力学基础，并表明在孤立的横向能隙闭合时 Uhlmann 相位以测地选择规则唯一选出 Berry 相位族中的一支，为耗散几何相位研究提供了启发。", "summary_source": "deepseek", "authors": [{"name": "Hyeonseok Yang"}, {"name": "Changsuk Noh"}], "featured_authors": [{"name": "Hyeonseok Yang"}, {"name": "Changsuk Noh"}], "author_count": 2}, {"id": "2608.22939", "category": "quant-ph", "title": "Universal equilibrium magic in quantum many-body systems", "abstract": "Thermalization conventionally describes local properties of isolated many-body systems at equilibrium. Magic, or nonstabilizerness $\\unicode{x2013}$ the resource enabling universal quantum computation $\\unicode{x2013}$ is by contrast encoded in the global structure of the many-body wavefunction. We show that, despite its global nature, the magic of equilibrium pure states of chaotic many-body systems, including late-time evolved states and energy eigenstates, is universal: it is captured by the thermal Scrooge ensemble, the minimally informative ensemble of pure states consistent with the Gibbs state at the same effective temperature. Therefore, for systems with no conserved quantities other than the total energy, equilibrium magic is a function of temperature alone, independent of the initial state and other microscopic features of the equilibrium state. This yields concrete universal predictions for the stabilizer Rényi entropies (SREs). At infinite temperature, the SRE is set by Haar-like fluctuations of the Pauli spectrum, while at finite temperature energy conservation induces a volume-law thermodynamic correction controlled by the thermal Pauli spectrum. We support these predictions with analytical arguments and extensive numerical simulations. We further show that chaotic many-body systems at high temperatures possess long-range magic and entanglement that cannot be removed by finite-depth local quantum circuits. Our results establish magic as a thermodynamic property of chaotic many-body systems and suggest that Scrooge ensembles may provide a unified framework for quantum many-body resources.", "url": "https://arxiv.org/abs/2608.22939", "type": "理论+数值", "summary": "1. 该工作证明混沌多体系统平衡纯态（含晚期演化态与能量本征态）的魔利具有普适性，可由热Scrooge系综统一捕获。\n2. 其核心在于给出稳定子Rényi熵的定量预言：无穷温度下由Pauli谱的Haar类涨落主导，有限温度下能量守恒导致体积律热力学修正，且与初态及微观细节无关。\n3. 该结果确立魔利作为混沌系统热力学性质的地位，并表明Scrooge系综或可为量子多体资源提供统一框架，同时支撑高温长程魔利不可被有限深度线路消除的结论。", "summary_source": "deepseek", "authors": [{"name": "Soumyadeep Sarma"}, {"name": "Tobias Haug"}, {"name": "John Preskill"}, {"name": "Wai-Keong Mok"}], "featured_authors": [{"name": "Soumyadeep Sarma"}, {"name": "Tobias Haug"}, {"name": "John Preskill"}, {"name": "Wai-Keong Mok"}], "author_count": 4}, {"id": "2608.22977", "category": "quant-ph", "title": "`It from Bit': is there a second law of quantum complexity?", "abstract": "At a deeper level the principle of least action is interpreted as the law of least entropy increase consistent with Prigogine's principle of minimum entropy production, and the implications of quasistatic information quantization rule (Proc. R. Soc. A 480: 20240024), are explored for the conjectured second law of quantum complexity. It is thus shown that the conjectured second law of complexity is derivable from the information quantization rule such that long after heat-death the quantum state complexity evolves as $C(t)=C_{\\rm max}\\exp(-1/t)$, increasing with time to a saturation value $C_{\\rm max}$ that is exponential in the equilibrium entropy $S_{\\rm max}$. For the out-of-equilibrium circumstances, however, the quantum complexity can decrease with the time, asymptotically tending to a minimum determined by the distance from equilibrium.", "url": "https://arxiv.org/abs/2608.22977", "type": "理论", "summary": "1. 该工作从准静态信息量子化规则推导量子复杂性第二定律，并讨论热寂后与远离平衡条件下的复杂性演化。\n2. 其物理卖点在于将最小作用量原理重构为最小熵产生原理，从而得到热寂后复杂性按 \\(C(t)=C_{\\max}\\exp(-1/t)\\) 增长并饱和于与平衡熵成指数关系的上界，而远离平衡时复杂性可随时间下降至由距平衡距离决定的最小值。\n3. 这为检验量子复杂性是否具有类热力学单调性，以及从“It from Bit”角度理解信息与量子引力之间的联系提供了新的理论视角。", "summary_source": "deepseek", "authors": [{"name": "S. Davatolhagh"}, {"name": "A. Sheykhi"}, {"name": "M.H. Zarei"}], "featured_authors": [{"name": "S. Davatolhagh"}, {"name": "A. Sheykhi"}, {"name": "M.H. Zarei"}], "author_count": 3}, {"id": "2608.23002", "category": "quant-ph", "title": "Exact and Optimal Recursive Quantum Search via Hilbert-Space Decomposition", "abstract": "Current approaches to quantum search fail to deeply exploit extant structure in the underlying Hilbert space. Decomposing the search by this structure empowers new strategies and formulations for quantum search and algorithm design. We present a new decomposition technique acting directly on this structure by recursively decomposing the Hilbert space and constructing the search operator from reflections over the resulting partition. When initial and target states factorise over this partition, dynamics reduce to a single rotation in a two-dimensional plane at each level, with angle given by a scalar recurrence. This recurrence avoids error accumulation from separately bounding success probabilities at each level, yielding an exact state description enabling treatment of the recursion as a whole. We obtain the target state deterministically and derive oracle and non-oracle costs independently of the search setting. For unstructured search, our approach attains the simultaneously optimal $\\Theta(\\sqrt{N})$ oracle and non-oracle gate counts. For spatial search on $d$-dimension grids, it recovers the $O(\\sqrt{N})$ time for $d\\geq3$ and the $O\\bigl(\\sqrt{N}(\\log N)^{3/2}\\bigr)$ bound of Aaronson and Ambainis for $d=2$. The exact description of the recursion extends over our decomposition to new subdivision structures and provides a new approach for applying and analysing recursion in quantum algorithm design.", "url": "https://arxiv.org/abs/2608.23002", "type": "理论+数值", "summary": "1. 该工作提出一种基于希尔伯特空间递归分解的量子搜索方法，将搜索算符由所得划分上的反射构造。\n2. 其核心在于初态与目标态在划分下分解时动力学化为二维旋转且角度满足标量递推，从而避免逐级成功概率误差累积并给出精确态描述，实现确定性目标获取及无结构搜索中同时最优的Θ(√N)预言机与非预言机门数。\n3. 该精确递推描述可拓展至新的细分结构，为量子算法设计中递归的构造与分析提供了一般性途径。", "summary_source": "deepseek", "authors": [{"name": "John Burke"}, {"name": "Ciaran McGoldrick"}], "featured_authors": [{"name": "John Burke"}, {"name": "Ciaran McGoldrick"}], "author_count": 2}, {"id": "2608.23093", "category": "quant-ph", "title": "Partial-Moment PINNs for Caldeira--Leggett Parameter Learning in Quantum Brownian Motion", "abstract": "We study parameter recovery in the Caldeira--Leggett (quantum Brownian) oscillator from partial moment traces. Our model is a moment-level PINN that predicts the five first/second moments and enforces the linear CL/HPZ ODEs by automatic differentiation. Physical structure is imposed through a PSD (Cholesky) covariance head, high-temperature CL assumptions with $D_{xp}\\approx0$, and fluctuation--dissipation ties between $D_{pp}$ and $\\gamma$. On synthetic CL data with channels ${\\mu_x,\\sigma_{xx},\\sigma_{xp}}$, the constrained variant recovers $(\\omega,\\gamma)$ accurately, stabilizes $D_{pp}$, and achieves low rollout error compared to finite differences and Kalman--EM (expectation--maximization) with exact Van Loan discretization. Fisher-style checks confirm that diffusion needs at least one variance observable, and sparse $\\sigma_{pp}$ ``anchors'' restore conditioning. We also show that the same PINN can learn time-varying HPZ coefficients.", "url": "https://arxiv.org/abs/2608.23093", "type": "理论", "summary": "1. 该工作提出偏矩物理信息神经网络，从部分矩迹中学习卡尔代拉-莱格特量子布朗运动振子的参数。\n2. 模型预测五个一、二阶矩，并用自动微分强制线性CL/HPZ常微分方程，再通过Cholesky协方差头、高温Dxp≈0及涨落-耗散关系引入物理结构，稳定恢复(ω,γ)与Dpp，滚动误差低于有限差分和Kalman-EM。\n3. 费希尔式检验显示扩散估计至少需要一个方差观测量，稀疏σpp锚点能恢复条件数；同一网络还可学习时变HPZ系数，提示向一般开放量子系统参数辨识推广。", "summary_source": "deepseek", "authors": [{"name": "Krishna Bhatia"}], "featured_authors": [{"name": "Krishna Bhatia"}], "author_count": 1}, {"id": "2608.23119", "category": "quant-ph", "title": "Quantum Reservoir Computing with Physics-Informed Correction for Reduced-Order PDE Forecasting", "abstract": "We study a hybrid proposal--correction architecture for reduced-order PDE forecasting in which a pure-state quantum reservoir computer (QRC) predicts latent coefficient dynamics and a PINN-based physics-informed corrector (PIC) refines local rollout windows. The method is evaluated on Burgers and Kuramoto--Sivashinsky (KS), with KS as the primary chaotic benchmark. On KS, QRC+PIC consistently improves over QRC alone in RMSE, NRMSE, and PDE residual, while Burgers highlights a regime in which simple baselines remain strong. These results suggest that QRC proposals with local physics-informed correction are a viable benchmark-dependent reduced-order forecasting strategy.", "url": "https://arxiv.org/abs/2608.23119", "type": "理论+数值", "summary": "1. 该工作提出一种混合“预测–校正”降阶偏微分方程预报架构，用纯态量子储备池预测潜变量系数，并用基于物理信息的神经网络校正器修正局部滚动窗口。\n2. 其技术要点在于将量子储备池的潜空间时间序列预测与局部物理残差约束结合，在Kuramoto–Sivashinsky混沌基准上显著降低RMSE、NRMSE与PDE残差。\n3. 这启示量子机器学习与物理约束校正器的组合可成为依赖基准的降阶预报策略，但需注意简单基线在Burgers等情形下仍具竞争力。", "summary_source": "deepseek", "authors": [{"name": "Krishna Bhatia"}, {"name": "Harsh"}, {"name": "Shalini Devendrababu"}], "featured_authors": [{"name": "Krishna Bhatia"}, {"name": "Harsh"}, {"name": "Shalini Devendrababu"}], "author_count": 3}, {"id": "2608.23127", "category": "quant-ph", "title": "Efficient Quantum Simulation of Linearized Vlasov--Poisson Dynamics Using Trotter and THRIFT Hamiltonian Simulation Methods", "abstract": "The Vlasov--Poisson system provides the fundamental kinetic description of plasma and plays a central role in understanding collective phenomena such as Landau damping and wave--particle interactions. Efficient numerical simulation of these dynamics remains challenging because of the high dimensionality of phase space. In this work, we studied magnetized and non-magnetized plasma using a quantum simulation framework for the linearized Vlasov-Poisson equation by reformulating the discretized system as a Hermitian Hamiltonian suitable for gate-based quantum computation. The time evolution is implemented using first, second and fourth-order Trotter--Suzuki product formulas and the recently proposed Time-Resolved Interaction Framework (THRIFT). The performance of the different simulation methods is systematically evaluated through electric field evolution, state fidelity, convergence behavior, energy conservation, entanglement entropy and quantum resource requirements, including circuit depth and two-qubit gate complexity, for both magnetized and non-magnetized plasma models. To further reduce finite time step errors without increasing circuit depth, Richardson extrapolation is incorporated as a error-mitigation technique. The results provide a comprehensive comparison of Trotter and THRIFT approaches and establish practical guidelines for accurate and resource-efficient quantum simulation of plasma dynamics on gate-based quantum computers.", "url": "https://arxiv.org/abs/2608.23127", "type": "理论+数值", "summary": "1. 该工作将线性化Vlasov-Poisson方程离散为厄米哈密顿量，并在门控量子计算框架下对磁化和非磁化等离子体进行了量子模拟。\n2. 其卖点在于系统比较了一、二和四阶Trotter-Suzuki格式与THRIFT算法，以电场演化、保真度、收敛性、能量守恒、纠缠熵以及电路深度和双比特门复杂度为指标评估性能，并结合Richardson外推在不加深电路的前提下降低有限步长误差。\n3. 这为面向近期量子硬件的高效、资源可控等离子体动力学模拟提供了实用的算法选择依据和误差抑制方案。", "summary_source": "deepseek", "authors": [{"name": "Kartick Paul"}, {"name": "Rahul V"}, {"name": "S. Aravinda"}, {"name": "Reetesh K. Gangwar"}], "featured_authors": [{"name": "K
