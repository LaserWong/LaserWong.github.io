e with twice the driving efficiency of a visible pump. Ab initio calculations decompose the force into competing multiband contributions, inaccessible to optical excitation, whose balance shifts as carriers relax. Tunable extreme-ultraviolet and X-ray pulses thus open a regime in which the displacive response is set by band-dependent coupling to the lattice, not by the number and temperature of the photocarriers alone.", "url": "https://arxiv.org/abs/2608.23080", "type": "数值", "summary": "1. 该工作利用自由电子激光将碲的N4,5核壳层共振激发，观测到相干声子的移位激发晶格动力学。\n2. 其核心在于将移位激发模型推广至核共振，实现比可见光泵浦高一倍的驱动力，并用第一性原理揭示多带贡献随载流子弛豫的竞争。\n3. 这预示着通过调谐极紫外与X射线脉冲，可使晶格响应由能带分辨的电子-声子耦合主导，而非仅由光生载流子数目与温度决定。", "summary_source": "deepseek", "authors": [{"name": "Oleg Dogadov"}, {"name": "Remi Claude"}, {"name": "Christoph Emeis"}, {"name": "Giovanni Batignani"}, {"name": "Giuseppe Fumero"}, {"name": "Roberto Costantini"}, {"name": "Agata Azzolin"}, {"name": "Sabine Rockenstein"}, {"name": "Paolo Cattaneo"}, {"name": "Rebeca Gomez Castillo"}, {"name": "Matteo Manzi"}, {"name": "Angelo Giglia"}, {"name": "Dario De Angelis"}, {"name": "Ettore Paltanin"}, {"name": "Zeinab Ebrahimpour"}, {"name": "Marija Krstulovic"}, {"name": "Gabor Kurdi"}, {"name": "Miltcho Danailov"}, {"name": "Luca Giannessi"}, {"name": "Riccardo Mincigrucci"}, {"name": "Emiliano Principi"}, {"name": "Alberto Crepaldi"}, {"name": "Giulio Cerullo"}, {"name": "Giovanni De Ninno"}, {"name": "Claudio Masciovecchio"}, {"name": "Laura Foglia"}, {"name": "Tullio Scopigno"}, {"name": "Fabrizio Carbone"}, {"name": "Francesca Calegari"}, {"name": "Fabio Caruso"}, {"name": "Michele Puppin"}, {"name": "Oliviero Cannelli"}], "featured_authors": [{"name": "Oleg Dogadov"}, {"name": "Remi Claude"}, {"name": "Christoph Emeis"}, {"name": "Fabio Caruso"}, {"name": "Michele Puppin"}, {"name": "Oliviero Cannelli"}], "author_count": 32}, {"id": "2608.23083", "category": "cond-mat", "title": "Three-dimensional Ising superconductors designed via inversion-symmetry breaking in intercalated NbSe$_2$ and NbTe$_2$", "abstract": "Ising superconductors exhibit in-plane upper critical fields far exceeding the Pauli paramagnetic limit, a hallmark first established in two-dimensional (2D) monolayer transition-metal dichalcogenides (TMDs). This field resilience requires the coexistence of strong spin-orbit coupling (SOC) and broken inversion symmetry, yet three-dimensional (3D) bulk realizations remain scarce because equilibrium stacking typically restores inversion symmetry. Here we demonstrate that intercalation provides a practical route to break this symmetry, systematically designing 16 NbSe$_2$- and NbTe$_2$-based compounds from four intercalants (In, Sn, Pb, Bi) across two polytypes: non-centrosymmetric $P\\bar{6}m2$ and centrosymmetric $P6_3/mmc$. Four compounds in the $P\\bar{6}m2$ phase, InNbSe$_2$, SnNbSe$_2$, PbNbSe$_2$, and PbNbTe$_2$, emerge as promising 3D Ising superconductors. They exhibit SOC splittings of 80-100 meV near the Fermi level, dominant out-of-plane spin polarization, and anisotropic superconductivity with $T_c=2.6$-$5.4$ K. Notably, spin-texture analysis reveals that the efficiency of Ising protection is governed not by the magnitude of SOC splitting alone but by the out-of-plane spin purity on the Fermi surface. Bogoliubov-de Gennes (BdG) calculations predict in-plane upper critical fields reaching 4-7 times the Pauli limit. These findings establish intercalation as a promising symmetry-engineering strategy for realizing 3D Ising superconductors in TMDs.", "url": "https://arxiv.org/abs/2608.23083", "type": "理论+数值", "summary": "1. 该工作提出以插层方式打破反演对称性，在NbSe2与NbTe2中系统设计16种化合物，并筛选出四种具有三维伊辛超导潜力的体系。\n2. 其核心物理在于指出伊辛保护效率并非取决于自旋轨道耦合劈裂大小，而由费米面上面外自旋纯度决定，BdG计算预言面内上临界场可达Pauli极限的4至7倍。\n3. 这为通过插层对称性工程在块体过渡金属硫族化合物中实现三维伊辛超导提供了明确设计路线，并拓展了超导场增强调控的材料平台。", "summary_source": "deepseek", "authors": [{"name": "Wenqian Tu"}, {"name": "Run Lv"}, {"name": "Xiaoying Li"}, {"name": "Li'e Liu"}, {"name": "Dingfu Shao"}, {"name": "Yuping Sun"}, {"name": "Wenjian Lu"}], "featured_authors": [{"name": "Wenqian Tu"}, {"name": "Run Lv"}, {"name": "Xiaoying Li"}, {"name": "Dingfu Shao"}, {"name": "Yuping Sun"}, {"name": "Wenjian Lu"}], "author_count": 7}, {"id": "2608.23112", "category": "cond-mat", "title": "Z1 oscillations and charge state in electronic stopping power from first principles", "abstract": "The energy transfer rate from a projectile nucleus to the electrons of the matter it traverses depends on the charge of that projectile, Q= e Z1. At low projectile velocities the friction coefficient is known to oscillate with atomic number Z1, since core electrons travel with the projectile screening its charge. The effective charge increases with velocity and oscillations disappear. That effect is studied here calculating electronic stopping power from first principles for O and Mg projectiles shooting through bulk Al, using real-time time-dependent density-functional theory. Both projectiles represent maximum and minimum of the first Z1 oscillation, respectively. The oscillation is found to be very sensitive to the direction of propagation, in spite of Al being quite an ideal metal for many purposes. The critical velocity for the oscillation disappearance ranges between below 0.1 a.u. and beyond 1 a.u. for the explored trajectories. The charge state is independently quantified with Hirshfeld and Voronoi analyses, offering remarkably consistent results in spite of their very different partition methods, as well as with an effective definition based on the stopping power itself. They display a gradual undressing of the projectile's core electrons with increasing velocity in qualitative accordance with expectations. However, electron density plots in real space present a richer picture in which the undressing is partly due to the electrons trailing behind the projectile, suggesting possible phenomenological descriptions correcting for the deformation of the density in terms of multipoles beyond the net charge. The plots also offer insights into dissipation by core electrons.", "url": "https://arxiv.org/abs/2608.23112", "type": "理论+数值", "summary": "1. 该工作利用实时含时密度泛函理论，从第一性原理计算了O和Mg弹丸穿越体相Al时的电子阻止本领，针对低速Z1振荡及其电荷态展开研究。\n2. 主要发现是低速度下摩擦系数随Z1的振荡强烈依赖于弹丸传播方向，且临界速度可在0.1 a.u.以下到1 a.u.以上变化；Hirshfeld与Voronoi分析及基于阻止本领的有效定义一致展示了芯电子随速度增大而逐步剥离。\n3. 实空间电子密度图揭示“剥离”部分源于电子在弹丸后方拖尾，提示可用净电荷之外的多极形变修正唯象描述，并为理解芯电子耗散提供微观图像。", "summary_source": "deepseek", "authors": [{"name": "Noor Ul Ain"}, {"name": "Emilio Artacho"}], "featured_authors": [{"name": "Noor Ul Ain"}, {"name": "Emilio Artacho"}], "author_count": 2}, {"id": "2608.23130", "category": "cond-mat", "title": "Multiscale Quasiparticle Electronic Structure and Excitonic Properties of CdSe Nanoclusters", "abstract": "Quantum confinement in stoichiometric $\\mathrm{Cd}_n\\mathrm{Se}_n$ nanoclusters dramatically attenuates electronic screening, driving a delicate, size-dependent competition between quasiparticle self-energy corrections ($\\Delta_{\\mathrm{QP}}$) and exciton binding energies ($E_b$). Here, we present a $GW$/BSE study across a representative size series ($n = 3, 6, 13, 33$) and leverage it to validate a scalable atomistic tight-binding (TB) framework derived from first principles. Our results demonstrate that 1-2 eV spectral blueshifts previously reported in the literature arise from single-particle $GW$ convergence artifacts rather than deficiencies in the electron--hole kernels. We show that the near-perfect cancellation between $\\Delta_{\\mathrm{QP}}$ and $E_b$ breaks down as cluster volume increases, driven by the rapid onset of dielectric screening attenuating $E_b$ faster than $\\Delta_{\\mathrm{QP}}$ and leading to a pronounced divergence from mean-field predictions. Spatial inverse participation ratio analysis of the electronic structure reveals that optical suppression of fundamental pre-peaks stems from a severe spatial mismatch between localized valence orbitals and delocalized conduction states. Finally, we demonstrate that the confinement-induced scaling of the quasiparticle gap and the optical onset is accurately reproduced by a scissor-corrected, DFT-parameterized TB model. As such, this work provides a quantitative multiscale roadmap for embedding effective many-body effects kernels into computationally efficient models, enabling reliable optical predictions for realistic semiconducting nanostructures containing up to thousands of atoms.", "url": "https://arxiv.org/abs/2608.23130", "type": "理论+数值", "summary": "1. 该工作对化学计量比Cd_nSe_n团簇的代表性尺寸系列(n=3,6,13,33)开展GW/BSE计算，系统研究了多尺度准粒子电子结构与激子性质。\n2. 其核心卖点在于证明文献中1–2 eV光谱蓝移源于单粒子GW收敛伪影，并揭示随团簇体积增大介电屏蔽使E_b衰减快于Δ_QP，导致二者近完美抵消关系破裂。\n3. 结合空间逆参与比分析和剪刀修正的DFT参数化紧束缚模型，该工作为将多体效应嵌入高效模型并预测数千原子半导体纳米结构光学性质提供了定量路线。", "summary_source": "deepseek", "authors": [{"name": "Surender Kumar"}, {"name": "Martin Thümmler"}, {"name": "Alexander Croy"}, {"name": "Stefanie Gräfe"}, {"name": "Caterina Cocchi"}], "featured_authors": [{"name": "Surender Kumar"}, {"name": "Martin Thümmler"}, {"name": "Alexander Croy"}, {"name": "Stefanie Gräfe"}, {"name": "Caterina Cocchi"}], "author_count": 5}, {"id": "2608.23151", "category": "cond-mat", "title": "Impact of Carbon Contamination on the Low-Temperature Electric Conduction of the Spark-Plasma Sintered Barium Titanate Ceramics", "abstract": "The dielectric and electric conduction properties of BaTiO3 samples fabricated by the spark plasma sintering with additional contamination by different content of carbon have been investigated in the temperature range from 77 through 408 K in small non-heating electric fields and in the range of 77 - 200K under strong electric fields up to 20 kV/cm. The effective dielectric permittivity of the samples with additional carbon achieves colossal values at low frequency, up to several units per 106 at 393 K. In the low temperature range, it remains very high magnitude, 10^4 -10^5 at low frequency and is strongly dependent on the carbon content. The electric conduction in the range of 77 - 200 K bears the hopping conduction and obeys the Mott law. We also studied electric conduction and effective dielectric permittivity vs electric field strength in the range of 77 - 200 K. The results are explained within the frames of hopping conduction theory and suggestion on different constituents in polarization processes and electric conduction.", "url": "https://arxiv.org/abs/2608.23151", "type": "理论", "summary": "1. 测量了不同碳含量放电等离子烧结钛酸钡在77-408K的电导与介电性能，并考察强电场下的行为。\n2. 核心发现在于附加碳使低频有效介电常数达10^6量级，且低温电导符合Mott跳跃导电机制。\n3. 这为理解碳杂质对钙钛矿陶瓷极化与输运耦合的调控作用提供了实验依据。", "summary_source": "deepseek", "authors": [{"name": "Oleksandr S. Pylypchuk"}, {"name": "Taisiia O. Kuzmenko"}, {"name": "Denis O. Stetsenko"}, {"name": "Oleksyi V. Bereznykov"}, {"name": "Serhii E. Ivanchenko"}, {"name": "Ihor M. Danylenko"}, {"name": "Anna N. Morozovska"}, {"name": "Vladimir N. Poroshin"}, {"name": "Victor V. Vainberg"}], "featured_authors": [{"name": "Oleksandr S. Pylypchuk"}, {"name": "Taisiia O. Kuzmenko"}, {"name": "Denis O. Stetsenko"}, {"name": "Anna N. Morozovska"}, {"name": "Vladimir N. Poroshin"}, {"name": "Victor V. Vainberg"}], "author_count": 9}, {"id": "2608.23157", "category": "cond-mat", "title": "First-Principles Spin-Lattice Coupling from Downfolded Electron-Phonon Interaction", "abstract": "We present a method to calculate spin-phonon coupling parameters from first-principles perturbation theory by downfolding the electron-phonon coupling (EPC). We exploit the localized nature of magnetic moments and atomic displacements by working in the Wannier representation of the electronic Hamiltonian and the EPC matrix. The spin system is mapped to a classical Heisenberg Hamiltonian, whose parameters are obtained by treating local spin rotations as a perturbation within a Green's-function formalism. The spin and phonon perturbations are connected through the EPC parameters, which enter as lattice-induced perturbations to the tight-binding Hamiltonian. By combining these lattice perturbations with local spin rotations, we obtain real-space derivatives of magnetic exchange parameters without performing displaced magnetic supercell calculations. We illustrate the method on SrMnO$_3$ and show that it can be integrated directly into standard workflows.", "url": "https://arxiv.org/abs/2608.23157", "type": "理论+数值", "summary": "1. 该工作提出一种基于第一性原理微扰论由下折叠电子-声子耦合计算自旋-声子耦合参数的方法，适用于局域磁矩体系。\n2. 其技术核心是在万尼尔表象中将自旋旋转与晶格扰动统一为紧束缚哈密顿量的微扰，通过在格林函数形式中联立两者，直接得到磁交换参数的实空间位移导数，无需位移超胞计算。\n3. 该方法已用SrMnO3验证并可集成至标准工作流，为磁性材料中自旋-晶格相互作用的定量研究提供了可扩展的第一性原理途径。", "summary_source": "deepseek", "authors": [{"name": "Xu He"}, {"name": "Álvaro Adrián Carrasco Álvarez"}, {"name": "Gian-Marco Rignanese"}, {"name": "Eric Bousquet"}, {"name": "Samuel Poncé"}, {"name": "Matthieu J. Verstraete"}], "featured_authors": [{"name": "Xu He"}, {"name": "Álvaro Adrián Carrasco Álvarez"}, {"name": "Gian-Marco Rignanese"}, {"name": "Eric Bousquet"}, {"name": "Samuel Poncé"}, {"name": "Matthieu J. Verstraete"}], "author_count": 6}, {"id": "2608.23160", "category": "cond-mat", "title": "Quantics tensor cross interpolation for high-order strong-coupling expansions", "abstract": "Real-time impurity solvers enable the study of transport phenomena and the description of nonequilibrium lattice systems within the framework of dynamical mean-field theory (DMFT). They also provide direct access to the spectral functions of both equilibrium and nonequilibrium systems. A widely used approach is the self-consistent strong-coupling expansion, whose lowest-order implementation corresponds to the non-crossing approximation. Higher-order implementations, however, are computationally demanding because the number of diagram topologies grows factorially with expansion order, while the evaluation of self-energies and Green's functions requires increasingly high-dimensional integrations. Here, we demonstrate that the latter challenge can be mitigated by employing quantics tensor cross interpolation in a variable-separated framework. Compared with the previously used scale-separated approach, the new scheme yields substantially lower bond dimensions and capacitates self-consistent steady-state DMFT calculations up to fourth order. We illustrate its performance with representative results for both equilibrium and photo-doped systems. In addition, we analyze the convergence of the strong-coupling expansion in the challenging noninteracting limit by computing diagrams up to sixth order. At this order, the onset of the asymptotic regime of the strong-coupling expansion becomes apparent, which allows the application of extrapolation techniques.", "url": "https://arxiv.org/abs/2608.23160", "type": "理论+数值", "summary": "1. 该工作面向实时动力学平均场杂质求解器，提出用量子张量交叉插值实现变数分离，以缓解释放型强耦合展开中因图拓扑阶乘增长导致的高维积分困难。\n2. 新方案相较尺度分离方法显著降低键维数，将自洽稳态动力学平均场计算推进到四阶，并在非相互作用极限下计算至六阶从而辨识渐近区并适用外推。\n3. 这为平衡与非平衡谱函数、光掺杂系统的实时模拟，以及高阶强耦合展开的收敛分析和外推技术提供了可行路径。", "summary_source": "deepseek", "authors": [{"name": "Kanghyeon Kim"}, {"name": "Lei Geng"}, {"name": "Philipp Werner"}, {"name": "Aaram J. Kim"}], "featured_authors": [{"name": "Kanghyeon Kim"}, {"name": "Lei Geng"}, {"name": "Philipp Werner"}, {"name": "Aaram J. Kim"}], "author_count": 4}, {"id": "2608.23246", "category": "cond-mat", "title": "Enhanced intrinsic spin-orbit driving of a Loss-DiVincenzo qubit near the spin-valley hotspot in Si/SiGe", "abstract": "In most Si/SiGe-based spin qubit implementations, high-fidelity single-qubit gates are achieved using micromagnets, which enable the use of electric spin dipole resonance via synthetic spin-orbit coupling (s-SOC). In contrast, intrinsic spin-orbit coupling (i-SOC) in silicon is generally considered to be weak. However, in Si/SiGe heterostructures, theory predicts a substantial enhancement when the Zeeman splitting approaches the valley splitting if symmetry is reduced by an imperfect interface. Here, we demonstrate a Si/SiGe Loss-DiVincenzo qubit driven by i-SOC close to this so-called spin-valley hotspot. In particular, we characterize the Rabi frequency as a function of the energy detuning from the hotspot by sweeping both the magnetic field and quantum dot position. We observe the predicted enhancement of the Rabi frequency near the hotspot, but also find an asymmetry that deviates from existing theoretical models as well as distortions of the Chevron patterns near the hotspot. While we achieve an average single-qubit Clifford fidelity of 98.6 %, the strong variability of the valley splitting may impede the use of i-SOC-based control as a scalable operational strategy; understanding its effect is nevertheless important for reproducible high-fidelity control. Our results provide an empirical basis for refining current theoretical models of spin-valley physics in Si/SiGe heterostructures.", "url": "https://arxiv.org/abs/2608.23246", "type": "理论", "summary": "1. 该工作在Si/SiGe异质结中实验演示了由本征自旋轨道耦合驱动的Loss-DiVincenzo量子比特，并在自旋-谷热点附近观测到拉比频率的预期增强。\n2. 其核心在于通过同时扫描磁场与量子点位置刻画拉比频率对热点失谐的依赖，并揭示出偏离现有模型的不对称性与Chevron图样畸变。\n3. 虽然平均单比特Clifford保真度达98.6%，但谷劈裂的强变异性可能阻碍该方案的可扩展应用；此结果为修正Si/SiGe自旋-谷物理理论提供了直接经验依据。", "summary_source": "deepseek", "authors": [{"name": "Alexander Willmes"}, {"name": "Max Oberländer"}, {"name": "Max Beer"}, {"name": "Denny Dütz"}, {"name": "Jhih-Sian Tu"}, {"name": "Stefan Trellenkamp"}, {"name": "Marco Lisker"}, {"name": "Felix Reichmann"}, {"name": "Lars R. Schreiber"}, {"name": "Hendrik Bluhm"}], "featured_authors": [{"name": "Alexander Willmes"}, {"name": "Max Oberländer"}, {"name": "Max Beer"}, {"name": "Felix Reichmann"}, {"name": "Lars R. Schreiber"}, {"name": "Hendrik Bluhm"}], "author_count": 10}, {"id": "2608.23381", "category": "cond-mat", "title": "FUCrIMODo: structure recovery from atomistic descriptors via multi-stage genetic algorithms", "abstract": "Data-driven approaches to materials discovery rely on numerical representations of atomic structures as input for machine learning models. Inverting these descriptors - recovering atomic structures from their representations - is essential for most generative material design pipelines, yet it remains challenging, particularly for periodic systems. Existing inversion methods are either tailored to specific invertible descriptors or require candidate structures with similar atomic arrangements and compositions, limiting the exploration of novel regions in chemical and configurational space. Here, we propose a generalizable, similarity-driven sampling approach, powered by a novel stage-wise optimization strategy, to recover atom types, atomic positions, and unit cell shapes directly from a descriptor. Our approach requires only descriptor features and parameters as input without any prior structural knowledge. The capability of our method is demonstrated by the averaged Smooth Overlap of Atomic Positions (SOAP) descriptor.", "url": "https://arxiv.org/abs/2608.23381", "type": "理论+数值", "summary": "1. 该工作提出一个通用逆向框架，采用多阶段遗传算法从原子描述符直接恢复周期体系的原子类型、原子位置与晶胞形状，且无需任何候选结构先验。\n2. 其核心卖点在于将相似性驱动的采样与分阶段优化结合，使非可逆描述符的倒置成为可能，并以平均SOAP描述符系统验证了方法的普适性。\n3. 这为从描述符出发的材料生成设计开辟了通用路径，尤其支持在无相似构型先验条件下探索新化学与构型空间；后续可拓展至其他描述符或多描述符联合倒置。", "summary_source": "deepseek", "authors": [{"name": "Louis Boehm"}, {"name": "Martin Kuban"}, {"name": "Claudia Draxl"}], "featured_authors": [{"name": "Louis Boehm"}, {"name": "Martin Kuban"}, {"name": "Claudia Draxl"}], "author_count": 3}, {"id": "2608.23403", "category": "cond-mat", "title": "The principle of detailed balance between electrons and phonons in presence of excitonic effects", "abstract": "Based on a many-body formulation, we derive an electron-phonon coupling including excitonic effects that preserves thermodynamic detailed balance between electronic and phononic scattering processes. We start from the microscopic electron-nucleus Hamiltonian, expand around the Born-Oppenheimer equilibrium geometry, and construct an effective action for the electronic and phononic propagators. From the same effective action, we derive both electronic and phononic self-energies in terms of a nonlocal vertex $\\mathcal G^{\\textrm{s}}$ including excitonic effects, which generalizes the usual local interaction vertex $g^{\\textrm{s}}$. When electrons and phonons are well-defined quasiparticles in the screened-exchange approximation and $\\mathcal G^{\\textrm{s}}$ is taken in its static limit, both self-energies reduce to Fermi-golden-rule expressions containing the same $\\mathcal G^{\\textrm{s}}$, thereby ensuring detailed balance. As an application, we compute electronic and phononic linewidths in graphene and illustrate this common-vertex construction. We analyze the competition between the reduced scattering phase space induced by the screened-exchange band structure and the enhancement of the electron-phonon vertex due to excitonic effects, finding that the vertex enhancement can compensate for and overcome the phase-space reduction in both electronic and phononic linewidths.", "url": "https://arxiv.org/abs/2608.23403", "type": "理论", "summary": "1. 该工作从微观电子-原子核哈密顿量出发，推导了含激子效应的电子-声子耦合，并证明其满足电子与声子散射之间的细致平衡。\n2. 其核心在于用非局域顶角 G^s 统一构造电子和声子自能，在静态屏蔽交换近似下两者均化为含同一顶角的费米黄金规则形式。\n3. 应用于石墨烯展示了共同顶角构造，并指出激子效应对顶角的增强可抵消并超过屏蔽交换带结构造成的相空间缩减。", "summary_source": "deepseek", "authors": [{"name": "Alberto Guandalini"}, {"name": "Giovanni Caldarelli"}, {"name": "Francesco Mauri"}, {"name": "Francesco Macheda"}], "featured_authors": [{"name": "Alberto Guandalini"}, {"name": "Giovanni Caldarelli"}, {"name": "Francesco Mauri"}, {"name": "Francesco Macheda"}], "author_count": 4}, {"id": "2608.23442", "category": "cond-mat", "title": "Interaction-mediated Co-existence of Altermagnetism and Topology", "abstract": "We study an extended Hubbard model on Lieb lattice at electron filling 2 and 4, and demonstrate that the interactions lead to the simultaneous emergence of altermagnetic order and a topological gap. Using unrestricted Hartree-Fock theory, we evaluate both the altermagnetic and topological order parameters and show that they co-exist with an associated quantum spin Hall effect in a large region of the phase diagram, which we further support using exact diagonalization. Moreover, we demonstrate that inversion-symmetry breaking terms can also mediate second-order topological phases with associated corner modes.", "url": "https://arxiv.org/abs/2608.23442", "type": "理论+数值", "summary": "1. 该工作研究了Lieb晶格上扩展Hubbard模型在电子填充数2和4时的相互作用效应，证明相互作用可导致交替磁有序与拓扑能隙同时出现。\n2. 运用无约束Hartree-Fock方法并结合精确对角化验证，发现交替磁有序与量子自旋霍尔效应在相图的大片区域共存，且反演对称破缺项还能诱导带角态的二阶拓扑相。\n3. 这一结果为关联驱动交替磁性与拓扑态共存确立了具体机制，并为在巡游电子晶格中探索高阶拓扑物态提供了可检验的模型平台。", "summary_source": "deepseek", "authors": [{"name": "Jasmin Bedow"}, {"name": "Nitin Kaushal"}, {"name": "Marcel Franz"}], "featured_authors": [{"name": "Jasmin Bedow"}, {"name": "Nitin Kaushal"}, {"name": "Marcel Franz"}], "author_count": 3}, {"id": "2608.23455", "category": "cond-mat", "title": "Cramer-Rao Inequality Generalizes the Equilibrium Energy Fluctuation-Response Relation to Nonequilibrium Steady States", "abstract": "Equilibrium steady states are fully characterized by the Boltzmann distribution, which depends only on the energy and the temperature. In contrast, nonequilibrium steady states, which describe a wide range of physical and biological phenomena, are generically much more complex, and their stationary distributions can depend on a zoo of kinetic parameters. A central challenge of nonequilibrium statistical mechanics is the identification of universal relations that hold for nonequilibrium steady states despite this complexity. We show here that a form of the Cramer-Rao inequality applies to arbitrary nonequilibrium steady-state distributions and contains no explicit dependence on kinetic parameters. A main original feature in our observation is that this inequality becomes a well-known fluctuation-response relation in equilibrium. The inequality involves three well-defined quantities: the fluctuations of the energy, the response given by the derivative of the average energy with respect to the inverse temperature, and the Fisher information with respect to the inverse temperature. We illustrate this inequality using three representative models: an active particle in a harmonic potential, a simple scheme for kinetic proofreading, and a one-dimensional model for heat conduction between two baths.", "url": "https://arxiv.org/abs/2608.23455", "type": "理论", "summary": "1. 该工作证明任意非平衡稳态分布均满足一种 Cramér-Rao 不等式，且其对动力学参数无显式依赖。\n2. 其核心在于该不等式将能量涨落、平均能量对逆温度的响应以及逆温度 Fisher 信息联系起来，并在平衡态退化为标准涨落-响应关系。\n3. 这为复杂非平衡稳态提供了一条不依赖具体动力学参数的普适约束，或可启发热传导、主动粒子及动力学校对等系统的定量研究。", "summary_source": "deepseek", "authors": [{"name": "Shaofan Liu"}, {"name": "Raphael Chetrite"}, {"name": "Andre C. Barato"}], "featured_authors": [{"name": "Shaofan Liu"}, {"name": "Raphael Chetrite"}, {"name": "Andre C. Barato"}], "author_count": 3}, {"id": "2608.23510", "category": "cond-mat", "title": "Large Jahn-Teller shifts and splittings observed in halide perovskite CsPbBr3", "abstract": "Despite the fundamental role of Jahn-Teller effects of first and second order in shaping structural and electronic properties, there is hardly any observation in angle-resolved photoemission of solids. In oxide and halide perovskites, band structure replicas have occasionally been reported as fingerprints of Jahn-Teller effects, but no accompanying energy shifts or splittings that would allow a conclusion about their origin. In CsPbBr3, we uncover both key signatures: Upon cooling, orthorhombic replica bands emerge which had eluded earlier studies. This includes an extra valence band maximum at {\\Gamma} which can even be distinguished at room temperature. Most importantly, band narrowing along {\\Gamma}-M, a splitting at {\\Gamma}, and the lifting of degeneracy between nonequivalent M points, all of several 100 meV, become apparent. Temperature-dependent x-ray diffraction, used as input for band structure calculations, links these effects directly to tilts and rotations of the PbBr6 octahedra. Our results uncover a strong electron-lattice interaction which is at the heart of so-far unresolved questions concerning polaronic transport, dynamic disorder, and exciton trapping in halide perovskites.", "url": "https://arxiv.org/abs/2608.23510", "type": "理论+数值", "summary": "1. 该工作通过角分辨光电子能谱在卤化物钙钛矿CsPbBr3中观测到正交相复带，并检测到数百毫电子伏量级的能带窄化、Γ点劈裂及不等价M点简并解除。\n2. 其核心在于结合变温X射线衍射与能带计算，将上述能谱特征直接归因于PbBr6八面体的倾斜与转动，从而为第一、二阶Jahn-Teller效应提供了明确的光电子能谱证据。\n3. 该强电子-晶格相互作用的直接观测，为理解卤化物钙钛矿中极化子输运、动态无序和激子俘获等长期未解问题奠定了微观基础。", "summary_source": "deepseek", "authors": [{"name": "Maryam Sajedi"}, {"name": "Maxim Krivenkov"}, {"name": "Dmitry Marchenko"}, {"name": "Saleem Ayaz Khan"}, {"name": "Andrei Varykhalov"}, {"name": "Jaime Sánchez-Barriga"}, {"name": "Daniel M. Többens"}, {"name": "Thomas Unold"}, {"name": "Ján Minár"}, {"name": "Oliver Rader"}], "featured_authors": [{"name": "Maryam Sajedi"}, {"name": "Maxim Krivenkov"}, {"name": "Dmitry Marchenko"}, {"name": "Thomas Unold"}, {"name": "Ján Minár"}, {"name": "Oliver Rader"}], "author_count": 10}, {"id": "2608.23519", "category": "cond-mat", "title": "Run-and-tumble particles with preferred reorientation", "abstract": "Run-and-tumble particles (RTPs) are canonically modeled with uniform reorientation probabilities, an assumption that breaks down for many biological microswimmers. In this work, we investigate the dynamics of RTPs with arbitrary non-uniform tumble distributions. By deriving an exact Doi-Peliti field theory, we explicitly calculate a wide array of spatial and orientational observables. Notably, we demonstrate that the spatial dynamics exhibit an effective persistence and chirality governed entirely by the first Fourier modes of the tumble distribution, establishing a formal mapping to the dynamics of chiral active Brownian particles. Furthermore, our field-theoretic framework provides a systematic method to compute spatial moments to arbitrary order, allowing for the complete characterization and identification of complex tumbling dynamics. We illustrate the framework with wrapped Gaussian and bimodal Gaussian distributions, demonstrating explicit control over persistence and chirality. We further extend the field theory to $d$ dimensions, recovering the mean squared displacement in terms of a single effective tumble rate. Our results establish a direct link between the shape of the tumble distribution and the emergent dynamics, and provide a foundation for the study of interacting RTPs with non-uniform reorientation.", "url": "https://arxiv.org/abs/2608.23519", "type": "理论", "summary": "1. 本文研究重取向概率任意非均匀的run-and-tumble粒子，建立精确Doi-Peliti场论并计算空间与取向可观测量。\n2. 其核心卖点在于证明空间动力学仅由tumble分布的首阶Fourier模决定，等效于手性活性布朗粒子，并可系统计算任意阶空间矩。\n3. 该框架将tumble分布形状与涌现动力学直接关联，并为非均匀重取向的相互作用粒子体系及复杂tumbling动力学分类奠定基础。", "summary_source": "deepseek", "authors": [{"name": "Callum Britton"}, {"name": "Ziluo Zhang"}, {"name": "Seongjun Han"}, {"name": "Thibault Bertrand"}], "featured_authors": [{"name": "Callum Britton"}, {"name": "Ziluo Zhang"}, {"name": "Seongjun Han"}, {"name": "Thibault Bertrand"}], "author_count": 4}, {"id": "2608.23533", "category": "cond-mat", "title": "Non-Abelian Spin Counting of Ordered Stochastic Trajectories: Reentrant Finite-Time Chern Numbers", "abstract": "Conventional full counting statistics assigns commuting phases to integrated stochastic currents and therefore resolves net transport but not, in general, the temporal ordering of events associated with different cycles. We introduce a non-Abelian counting construction in which crossings of two fundamental cycles rotate an auxiliary spin about different axes. The resulting ordered trajectory statistic has an exact finite-dimensional evolution equation for its first moment. The two rotation angles form a counting torus, and whenever the mean spin is nonzero its normalized direction defines a map $\\mathbb T^2\\to\\mathbb S^2$, equivalently a complex eigenline bundle with a Chern number. Our main analytical result is a Chern--parity correspondence. Reflection symmetry equips this eigenline with a real structure and expresses $C_T\\bmod2$ through first Stiefel--Whitney classes on the circles fixed by reflection. When the transverse polarization has no additional zeros along the reflection-fixed circles, these classes reduce to ordinary current-parity statistics at the four high-symmetry counting points. For a five-state nonequilibrium figure-eight network, varying only the observation time produces four polarization-gap closings and the reentrant sequence $C_T=0\\to-1\\to0\\to-1\\to0$. Every transition occurs at $(\\pi,\\pi)$ and coincides with a sign reversal of $\\mathbb E[(-1)^{Q_1+Q_2}]$, while the full integer Chern number is obtained independently from the two-dimensional spin texture. Finite observation time can therefore organize a fixed stochastic process into distinct topological sectors of its ordered path ensemble.", "url": "https://arxiv.org/abs/2608.23533", "type": "理论", "summary": "1. 该工作为随机轨迹的时序有序性引入非阿贝尔自旋计数构造，将两个基本环的穿越映射为辅助自旋绕不同轴转动，并建立其第一矩的精确有限维演化方程。\n2. 其核心结果是陈数-宇称对应：在反射对称下，有限时间陈数模二由反射固定圆上的第一Stiefel-Whitney类决定；五态非平衡八字网络中仅改变观测时间即产生0→-1→0→-1→0的重入序列，每次转变都发生在(π,π)并与宇称期望符号反转一致。\n3. 这表明有限观测时间可使固定随机过程的序化路径系综划分出不同拓扑扇区，为输运统计、量子度量或更一般轨迹序的拓扑分类提供可检验框架。", "summary_source": "deepseek", "authors": [{"name": "Yangyang Du"}], "featured_authors": [{"name": "Yangyang Du"}], "author_count": 1}, {"id": "2608.23556", "category": "cond-mat", "title": "Quaternionic Hermitian Band Geometry in Four Dimensions: Realization on $S^4$ and Obstruction on $T^4$", "abstract": "We establish a realization-obstruction dichotomy for quaternionic Hermitian band geometry in four-dimensional parameter spaces: the minimal-charge lowest Landau level on $S^{4}$ provides a global realization, whereas an everywhere nondegenerate saturated realization induced by a single occupied quaternionic band is obstructed on $T^{4}$. An antiunitary symmetry $\\mathcal{J}$ satisfying $\\mathcal{J}^{2}=-1$ makes the occupied doublet a quaternionic band. Within this setting, we formulate the quaternionic Wirtinger inequality as a band-geometric bound involving the quantum metric and the second Chern density. At every nondegenerate saturation point, the canonical geometry of the quaternionic projective space pulls back to a compatible quaternionic structure on the parameter space; if these conditions hold everywhere, the parameter space acquires quaternionic Hermitian band geometry. On $S^{4}$, we express the minimal-charge states as quaternionic Perelomov coherent states and establish everywhere nondegenerate saturation, thereby realizing quaternionic Hermitian band geometry. On $T^{4}$, by contrast, a minimal four-band system saturates the inequality everywhere, but topology forces the quantum metric to become degenerate somewhere, obstructing a globally induced quaternionic structure. An explicit lattice Dirac Hamiltonian exhibits this obstruction. Adding unoccupied bands cannot remove this obstruction when the inequality is saturated everywhere, since the image of any nondegenerate saturated projector remains confined to a fixed $\\mathbb{H}P^{1}$. These results provide a symmetry-aware framework for non-Abelian band geometry and show how parameter-space topology constrains the global realization of quaternionic Hermitian band geometry.", "url": "https://arxiv.org/abs/2608.23556", "type": "理论", "summary": "1. 该工作建立了四维参数空间中四元数厄米能带几何的实现-阻碍二分法，指出S^4上可实现而T^4上受拓扑阻碍。\n2. 其核心是利用满足J^2=-1的反幺正对称性将占据双重态视为四元数能带，并借助四元数Wirtinger不等式联系量子度规与第二陈密度，揭示饱和点处的四元数投影空间结构。\n3. 该对称感知框架表明参数空间拓扑约束四元数厄米能带几何的全局实现，为非阿贝尔能带几何与人工维度平台提供了明确理论判据。", "summary_source": "deepseek", "authors": [{"name": "Dongju Hwang"}, {"name": "Minjae Yu"}, {"name": "Gil Young Cho"}], "featured_authors": [{"name": "Dongju Hwang"}, {"name": "Minjae Yu"}, {"name": "Gil Young Cho"}], "author_count": 3}, {"id": "2608.23560", "category": "cond-mat", "title": "Spinor condensate persistent currents in an atomtronic Josephson necklace", "abstract": "The investigation of superflow in multi-junction Josephson circuits is currently a leading frontier of physics research, probing the fundamental manifestations of macroscopic phase coherence and enabling applications to quantum simulation, metrology and computing. In this work, we extensively investigate the stability and dynamics of persistent currents of a spinor atomic Bose-Einstein condensate on a ring with multiple Josephson junctions. Specifically, we examine the effects of positive and negative interspecies interactions, co- and counter-rotation, population and Manakov asymmetry, as well as Rabi coupling on the persistent currents carried by the two components. Our analysis reveals that the presence of a second species offers multiple mechanisms for unprecedented manipulation of supercurrents on the ring, including phase-slip engineering, stability control, current-inversion switching and supercurrent pumping. Our study provides a roadmap for the engineering of persistent currents in binary ring condensates in necklace potentials, with significant implications for atomtronics, matter-wave interferometry and sensing using atomic Bose gases.", "url": "https://arxiv.org/abs/2608.23560", "type": "理论+数值", "summary": "1. 该工作系统研究了自旋化玻色-爱因斯坦凝聚体在多约瑟夫森结环上的持久流，考察了正负种间相互作用、同向与反向旋转、粒子数及马纳科夫不对称性、拉比耦合等因素的影响。\n2. 其核心卖点在于揭示第二组分可为环上超流提供相滑移工程、稳定性控制、流反向开关与超流泵浦等多种前所未有的操控机制。\n3. 这为在项链势阱中的二元环状凝聚体实现持久流工程化提供了路线图，对原子芯片技术、物质波干涉测量及原子气体量子传感具有重要启示。", "summary_source": "deepseek", "authors": [{"name": "Sayan Chatterjee"}, {"name": "Nalinikanta Pradhan"}, {"name": "Rina Kanamoto"}, {"name": "M. Bhattacharya"}, {"name": "Pankaj Kumar Mishra"}], "featured_authors": [{"name": "Sayan Chatterjee"}, {"name": "Nalinikanta Pradhan"}, {"name": "Rina Kanamoto"}, {"name": "M. Bhattacharya"}, {"name": "Pankaj Kumar Mishra"}], "author_count": 5}, {"id": "2608.21511", "category": "hep-th", "title": "String stars, small black holes, and the supersymmetric index", "abstract": "We discuss aspects of the black hole-string transition as the angular velocity approaches the supersymmetric index $\\beta \\Omega = 2\\pi i$. In this limit, the high-temperature Atick-Witten effective description breaks down. For Heterotic string theory, a new high-temperature description emerges near the index in terms of a Higgsed $SU(2)_L\\times U(1)_R$ supergravity with a magnetic field profile. The Hagedorn instability manifests in the theory as Ambjorn-Olesen W boson condensation, due to the background magnetic field. For type II, a tower of winding strings becomes light near the index, which opens up a new dimension in the T-dual picture. In both cases, a string star solution is found, similar to the Horowitz-Polchinski solution, but decouples at the index $\\beta \\Omega = 2\\pi i$. Considering charged solutions, the string star appears to interpolate between charged black holes and the free string phase. At the index, both the charged black hole and the charged string star phases decouple. This suggests a tension between a smooth black hole-string transition and the existence of a stringy BPS two-charge black hole.", "url": "https://arxiv.org/abs/2608.21511", "type": "理论", "summary": "1. 该文研究角速度趋近超对称指标βΩ=2πi时的黑洞-弦转变，并构造异质与II型弦论中的弦星解。\n2. 其核心揭示高温Atick-Witten描述在指标处崩溃：异质弦中出现磁场诱导的Ambjorn-Olesen W玻色子凝聚，II型弦则因缠绕弦变轻而在T对偶中开启新维度。\n3. 带电弦星在指标处与带电黑洞一同退耦，暗示光滑黑洞-弦转变与弦性BPS两电荷黑洞存在张力，为相关微观态研究提供约束。", "summary_source": "deepseek", "authors": [{"name": "Erez Y. Urbach"}], "featured_authors": [{"name": "Erez Y. Urbach"}], "author_count": 1}, {"id": "2608.21518", "category": "hep-th", "title": "On flat space limits of $AdS_4$ black holes", "abstract": "With a view towards understanding flat space holography, we study the flat space limit of asymptotically $AdS_4$ black holes in gauged $\\mathcal{N}=2$ supergravity. Using holographic renormalisation, we carefully analyse the flat space limit of the on-shell action of various black holes in this setting and make explicit the states that contribute to the partition function in this limit. We find several features: large black holes lead to a divergence in the partition function which can be understood as a thermodynamic volume divergence. Meanwhile, semiclassically, small black holes reproduce the partition function of their flat space counterparts, and we clarify the mapping between BPS, (near-)extremal or non-extremal black holes on both sides for charged and rotating solutions. Finally, by studying a suitable flat limit of the BPS Kerr-Newman-$AdS_4$ black hole in M-theory, we obtain a charged BPS solution in flat space. On the dual side, we determine a Carrollian-like limit on the known ABJM partition function on $S^1\\times S^2$ at large $N$, and show that it reproduces the correct entropy of the BPS charged black hole in asymptotically flat space.", "url": "https://arxiv.org/abs/2608.21518", "type": "理论", "summary": "1. 该工作通过全息重整化仔细分析渐近AdS4黑洞在规范N=2超引力中的平直时空极限，并明确了该极限下配分函数的贡献态。\n2. 其要点在于揭示大黑洞配分函数发散源于热力学体积，而小黑洞半经典地复现平直时空对应体，并厘清BPS、近极端与非极端荷转解在两侧的映射。\n3. 这为平直时空全息提供了具体途径：对偶ABJM配分函数的类Carrollian大N极限可重现渐近平直带电BPS黑洞熵，可直接用于检验相关量子引力框架。", "summary_source": "deepseek", "authors": [{"name": "Pedro Vicente Marto"}, {"name": "Shradha Ramakrishnan"}, {"name": "Stefan Vandoren"}], "featured_authors": [{"name": "Pedro Vicente Marto"}, {"name": "Shradha Ramakrishnan"}, {"name": "Stefan Vandoren"}], "author_count": 3}, {"id": "2608.21523", "category": "hep-th", "title": "What Neural Network Field Theory Can and Cannot Realise on a Computer", "abstract": "One aim of neural network field theory is to put a quantum or effective field theory on a computer, with the network ensemble itself as the theory. We ask how far that aim can be pushed for a function class regular enough to be computed with. Our main result is a no-go theorem with assumptions that hold for standard network architectures. We use it to separate four versions of neural network field theory, according to whether the defining object is the finite width ensemble or its infinite width limit, and whether the target we want to compute is a quantum or an effective field theory. Neither finite width interpretation is straightforwardly consistent. For finite width ensembles with finite variance at each point, the QFT interpretation fails reflection positivity, while the EFT interpretation establishes no scale separation by which the positivity violation can be placed outside its domain of validity. Of the two limit versions, one can be simulated in full and the other only in part, as only its smeared correlators are computable with a controlled error. As such, at the level of a controlled numerical computation, the QFT and EFT versions cannot be distinguished. One dimension escapes the obstruction, yet reflection positivity is shown to still fail there at every finite width for the cosine network. Two escapes from the theorem remain, giving up either finite variance at a point or exact rotation invariance, and we discuss both of these possibilities.", "url": "https://arxiv.org/abs/2608.21523", "type": "理论", "summary": "1. 该工作证明了神经网络场论在计算机可实现性上的一个否定性定理，界定了可作为计算对象的正则函数类。\n2. 其核心是区分有限宽度系综与其无穷宽极限、量子场论与有效场论四种情形：前者破坏反射正定性或缺乏尺度分离，后者仅一种可完整模拟，另一种只能受控计算涂抹关联函数，使两类理论在数值上难以区分。\n3. 这一结果为以网络系综作为数值场论工具的方案划定适用边界，并提示通过放弃有限方差或精确旋转不变性才可能绕开此障碍。", "summary_source": "deepseek", "authors": [{"name": "Thomas R. Harvey"}], "featured_authors": [{"name": "Thomas R. Harvey"}], "author_count": 1}, {"id": "2608.21588", "category": "hep-th", "title": "Neural Network Field Theory at Finite Width", "abstract": "Under mild assumptions, any quantum mechanical (QM) model or quantum field theory (QFT) admits a representation in terms of an ensemble of neural networks with countably many random parameters. We investigate the features of NN-QM and NN-FT models with finitely many parameters, such as a feedforward network of width $N < \\infty$. We find that, generically, such models must violate one of the properties of conventional Euclidean QFTs, such as reflection positivity or cluster decomposition. We present several complementary ways of understanding which features can and cannot be preserved at finite $N$, both in QM and in QFT.", "url": "https://arxiv.org/abs/2608.21588", "type": "理论", "summary": "1. 该工作提出，在温和假设下任何量子力学或量子场论均可由含可数随机参数的神经网络系综表示，并考察固定有限宽度（N<∞）前馈网络的模型性质。\n2. 核心卖点在于证明此类有限宽度模型一般无法同时满足反射正定性与集团分解，并给出量子力学与量子场论中能保留或丧失哪些特征的互补分析。\n3. 这为判断有限宽度神经表示在何种意义上逼近局域量子场论提供了判据，也为构造保持欧氏公理的新型参数化方案提供了启示。", "summary_source": "deepseek", "authors": [{"name": "Christian Ferko"}, {"name": "Aaron Mutchler"}], "featured_authors": [{"name": "Christian Ferko"}, {"name": "Aaron Mutchler"}], "author_count": 2}, {"id": "2608.21613", "category": "hep-th", "title": "One-Loop Quantum Correction to the Kink Mass in a Lorentz-Violating Scalar Field Theory", "abstract": "We study the radiative correction to the mass of the $(1+1)$-dimensional $\\lambda\\phi^4$ kink in the presence of an irreducible, spacelike Lorentz-violating interaction. The Lorentz-violating operator is chosen as $-\\frac12 c\\phi^2(u\\!\\cdot\\!\\partial\\phi)^2$ with $u^\\mu=(0,1)$, which is the lowest-order single-scalar operator considered in this class of models that produces effects that cannot be removed by a linear redefinition of coordinates or the field. We perform the one-loop renormalization of the underlying quantum field theory. In contrast with Lorentz-invariant $\\lambda\\phi^4$ theory in two dimensions, the Lorentz-violating theory requires, at this order, both a modified mass counterterm and a nonzero field-strength counterterm. The corrected stability problem contains modified bound and continuum modes, while the continuum phase shift remains unchanged at $O(c)$ with the boundary-condition prescription adopted here. Finally, using the vacuum-subtracted zero-point energy and the counterterm Hamiltonian, we obtain the one-loop kink mass through first order in $c$. We give the finite coefficient in the subtraction prescription implemented in the accompanying thesis calculation, for which the Lorentz-violating contribution is numerically negative.", "url": "https://arxiv.org/abs/2608.21613", "type": "理论", "summary": "1. 该工作针对 (1+1) 维 λφ^4 模型，计算了由不可约类空洛伦兹破缺相互作用 -1/2 c φ^2(u·∂φ)^2 诱导的扭结质量的单圈量子修正。\n2. 其技术要点在于该破缺理论在单圈需要同时引入质量抵消项与场强抵消项，修正后的稳定性方程改变束缚态和连续模，但选择特定边界条件后相位移动在 O(c) 保持不变，从而可提取有限的真空扣除零点能。\n3. 这一处理为在洛伦兹破缺场论框架下进一步计算孤子有效作用量、高阶量子修正以及推广到多孤子或高维情形提供了可参照的方案。", "summary_source": "deepseek", "authors": [{"name": "Reza Moazzemi"}], "featured_authors": [{"name": "Reza Moazzemi"}], "author_count": 1}, {"id": "2608.21798", "category": "hep-th", "title": "Heterotic string couplings at order $α'^3$ in NS-NS sector", "abstract": "We utilize the standard T-duality procedure to derive the classical effective action of heterotic string theory at the eight-derivative order within the NS-NS sector, which comprises the metric, the \\(B\\)-field, and the dilaton. Starting from the minimal basis at this order, consisting of 872 even-parity and 477 odd-parity couplings, we perform a dimensional reduction on a circle and impose invariance under T-duality transformations, specifically the Buscher rules supplemented by higher-derivative corrections. This invariance uniquely fixes a subset of the couplings to match those of type II theory up to an overall factor, while the remaining couplings are determined in terms of the coefficients at order \\(\\alpha'\\). For these latter couplings, we adopt both the Metsaev-Tseytlin and Meissner schemes. Subsequently, through field redefinitions, we recast the action into a canonical form in which the dilaton appears solely through the overall factor \\(e^{-2\\Phi}\\). In the Meissner scheme, the pure gravity sector precisely reproduces the known S-matrix results. In both schemes, the pure gravity terms can be expressed as the double trace \\((\\Tr(R^2))^2\\), and when combined with the corresponding Yang-Mills terms \\((\\Tr(F^2))^2\\), they take the unified form \\((\\Tr(R^2-F^2))^2\\), as anticipated in the literature.", "url": "https://arxiv.org/abs/2608.21798", "type": "理论", "summary": "1. 该工作利用标准T-duality程序推导了异质弦论在NS-NS扇区八导数阶的经典有效作用量。\n2. 其技术要点是从含872个偶宇称和477个奇宇称耦合的最小基底出发，通过圆紧致化及带高阶修正的Buscher规则固定耦合，并在Metsaev-Tseytlin和Meissner两种方案下用α'系数确定其余项。\n3. 经场重定义后，纯引力部分在Meissner方案精确复现S矩阵，并与Yang-Mills项合并为统一的(Tr(R^2-F^2))^2形式，为弦论耦合结构提供了有力佐证。", "summary_source": "deepseek", "authors": [{"name": "Alireza Pahlavan"}, {"name": "Mehdi Ameri"}, {"name": "Mohammad R. Garousi"}], "featured_authors": [{"name": "Alireza Pahlavan"}, {"name": "Mehdi Ameri"}, {"name": "Mohammad R. Garousi"}], "author_count": 3}, {"id": "2608.21865", "category": "hep-th", "title": "Characteristic-cone running from on-shell residues: Identifiability on the physical EFT quotient", "abstract": "We formulate a data-completeness test for extracting low-energy characteristic-cone running from flat-space on-shell renormalization-group residues. In four-dimensional, parity-even Einstein--scalar--Maxwell effective field theory through four derivatives and four external fields, Wilson directions are first placed on the physical EFT quotient and background propagation is represented by a traceless response on the full massless root sector. The response is identifiable from chosen amplitude coordinates precisely when the amplitude kernel lies in the response kernel. For the published opposite-helicity vector--scalar residue we find $\\beta_\\mu C_{\\gamma\\phi}^{(2)}=-55/(96\\pi^2)$ and, after an order-reduced frame translation, the contribution $\\beta_\\mu(r_T-r_\\gamma)=-55/(48\\pi^2M_{\\rm P}^4)$. A finite operator registry gives explicit rank-two incompleteness tests: independent $F^4$ directions split photon polarizations on a magnetic background, while $\\mathcal CFF$ produces an analytic splitting along a principal Weyl axis on a Petrov-I Einstein--scalar background. For the isolated scalar--photon contact, direct Schur reduction finds nonzero raw mixing but no first-order physical off-diagonal entry, by the Maxwell Ward identity. Thus the residue fixes one diagonal cone contribution but does not determine the term-complete characteristic response over the declared admissible coefficient domain.", "url": "https://arxiv.org/abs/2608.21865", "type": "理论", "summary": "1. 该工作针对四维宇称偶爱因斯坦-标量-麦克斯韦有效场论，提出从平空间壳重整化群留数提取低能特征锥运行的数据完备性检验，并在物理EFT商空间上考察其可辨识性。\n2. 其核心在于将背景传播表示为无迹响应，证明响应可从振幅坐标辨识当且仅当振幅核落在响应核中；结合有限算子注册表给出秩二不完备性判据，且标量-光子接触项经Schur约化与Maxwell Ward恒等式无一级物理非对角元。\n3. 这严格界定了壳留数只能确定单一对角锥贡献，提示需借助项完备响应或额外可辨识性条件才能完整固定特征锥运行，为EFT商空间中的Wilson系数重构提供了判据与路径。", "summary_source": "deepseek", "authors": [{"name": "Renat Gafarov"}], "featured_authors": [{"name": "Renat Gafarov"}], "author_count": 1}, {"id": "2608.21947", "category": "hep-th", "title": "Perturbative Reconstruction of Self-Adjoint Generators from Bosonic Canonical Commutation Relations: Application to the Null-Surface Formulation", "abstract": "We study the inverse adjoint problem for a perturbative bosonic outgoing map. Within the polynomial bosonic canonical-commutation-relation (CCR) algebra, we prove a constructive integrability theorem: order-by-order preservation of the CCRs is sufficient to reconstruct recursively a formal self-adjoint generator whose exponential implements the outgoing map by adjoint conjugation. At each order, the Baker--Campbell--Hausdorff contribution determined by previously reconstructed generators is subtracted from the outgoing coefficient, and the remaining homogeneous CCR conditions determine the next generator explicitly. We apply the construction to graviton scattering in the null-surface formulation (NSF), specialized to the flat solution-space sector with Minkowski metric, null generators, affine parameter, and cone measure. The NSF outgoing map preserves the Ashtekar radiative CCRs through (\\delta a_3), corresponding to order (\\varepsilon^2). At this order, the scalar CCR sector uniquely selects the symmetric ordering (c=1) for the nontrivial interacting kernel. The associated linear contraction, generated by the same cubic kernel, cancels the double-contraction contribution from ([\\delta a_2,\\delta a_2^\\dagger]). The theorem then reconstructs the self-adjoint generators (\\delta T_1) and (\\delta T_2), providing a formal perturbative unitary implementation. The resulting canonical organization also separates the direct (2\\to2) contribution into irreducible-loop, one-particle-reducible, and factorized sectors.", "url": "https://arxiv.org/abs/2608.21947", "type": "理论", "summary": "1. 该工作研究玻色子多项式CCR代数中微扰出射映射的逆伴随问题，证明逐阶保持CCR足以递归重构形式自伴生成元。\n2. 其技术核心是每阶从出射系数扣除先前生成元决定的BCH贡献，并由剩余齐次CCR条件显式确定下一阶生成元。\n3. 应用于零曲面表述中的引力子散射，在ε²阶唯一选定对称序c=1并重构δT₁、δT₂，提供形式微扰酉实现且区分2→2贡献的圈结构。", "summary_source": "deepseek", "authors": [{"name": "C. N. Kozameh"}], "featured_authors": [{"name": "C. N. Kozameh"}], "author_count": 1}, {"id": "2608.22013", "category": "hep-th", "title": "Holographic SU(3) color superconductivity at finite baryon chemical potential", "abstract": "We present a holographic model of SU(3) color superconductivity (CSC) where a global color symmetry is spontaneously broken by a diquark condensate at finite baryon chemical potential. At $\\mu_b=0$, a systematic stability analysis over all SU(3) channels recovers the known SU(2) s+p competition. Based on that, the finite $\\mu_b$ further generalizes the s-wave order to an S1+iS2 structure. We find that $\\mu_b$ enhances the critical temperature of the S1+iS2 phase while suppressing the p-wave -- the latter vanishes beyond a certain $\\mu_b$ when backreaction is included. This opposite trend reshapes the phase diagram: with increasing $\\mu_b$, the balanced S+ phase (S1=S2) takes over the entire color-superconducting region. Our non-Abelian framework provides a concrete holographic description of global SU(3) symmetry breaking, relevant for understanding color-superconducting phases in dense QCD and may offer new insights into the physics of neutron-star interiors.", "url": "https://arxiv.org/abs/2608.22013", "type": "理论", "summary": "1. 论文构建了有限重子化学势下具有全局SU(3)颜色对称性的全息超导模型，由双夸克凝聚实现自发对称破缺。\n2. 其技术核心是对所有SU(3)通道作稳定性分析并推广出S1+iS2序参量，发现重子化学势增强S1+S2平衡相而压制p波。\n3. 该非阿贝尔全息框架为致密QCD及中子星内部的颜色超导相提供了新描述，或有助于理解星体物态方程。", "summary_source": "deepseek", "authors": [{"name": "Xin Zhao"}, {"name": "Zhang-Yu Nie"}, {"name": "Ya-Peng Hu"}], "featured_authors": [{"name": "Xin Zhao"}, {"name": "Zhang-Yu Nie"}, {"name": "Ya-Peng Hu"}], "author_count": 3}, {"id": "2608.22469", "category": "hep-th", "title": "Thermal propagator of the bosons and fermions fields", "abstract": "In a thermodynamic environment, thermal field theory (TFT) describes a large ensemble of interacting particles. This may appear to be the same as in classical statistical mechanics. Therefore, we study the scalar propagator and fermion propagator by considering an arbitrary parameter $\\sigma$ that allows for a path integral description in real-time formalism (RTF). We constructed those propagators which allowed us to know how particles moved from one point to another point in momentum space as well as in mixed space, at finite temperature without a chemical potential.", "url": "https://arxiv.org/abs/2608.22469", "type": "理论", "summary": "1. 该工作在未引入化学势的有限温度热环境中，基于实时热场论的路径积分描述，构造了标量玻色子场与费米子场的热传播子。\n2. 其核心卖点在于引入任意参数 σ 统一处理路径积分，并在动量空间和混合空间中给出传播子的显式解析形式，从而说明粒子在有限温度下从一点到另一点的传播规律。\n3. 这些解析传播子可直接用于实时热场论中的具体计算，并为推广至含化学势、非平衡或相互作用情形提供了清晰的研究方向。", "summary_source": "deepseek", "authors": [{"name": "M. A. A. Ahmed"}, {"name": "H. Zainuddin"}, {"name": "N. M. Shah"}], "featured_authors": [{"name": "M. A. A. Ahmed"}, {"name": "H. Zainuddin"}, {"name": "N. M. Shah"}], "author_count": 3}, {"id": "2608.22509", "category": "hep-th", "title": "A second rotational Killing field on gauged D=5 vector multiplet horizons", "abstract": "We study supersymmetric near-horizon geometries of gauged D=5 supergravity coupled to vector multiplets, on the branch where the canonical rotational Killing vector $\\tilde V$ of the horizon section $\\mathcal{S}$ is non-vanishing. No rotational symmetry is assumed. On a compact, connected $\\mathcal{S}$ without boundary, a second rotational Killing field, independent of $\\tilde V$, always exists on the open set where $Z$ and $W$ are linearly independent, and extends to an isometry of all of $\\mathcal{S}$, unconditionally if the moduli are constant and under a checkable extension hypothesis otherwise. With $K=Q_{IJ}C^IC^J$ vanishing exactly in the minimal theory, $K\\equiv0$ recovers the known result of Grover, Gutowski, Papadopoulos and Sabra. When $K>0$, $P=Z+W$ vanishes at every critical point of $\\|\\eta_-\\|^2$, and two sub-branches occur, both realised. On the first, $P\\equiv0$, the moduli are constant and the isometry follows by homogeneity, recovering Kunduri and Lucietti local geometries as a consequence of supersymmetry and compactness rather than an ansatz. On the second, $P\\not\\equiv0$, the moduli genuinely vary; closure of the first-order system ($dP=0$) turns the Killing equation for a vector orthogonal to $P$ into a flat rank-two system transported along $P$, solved explicitly by $U=\\|\\eta_-\\|^2(h_YN-h_NY)$. Both sub-branches are non-empty on compact $\\mathcal{S}$: known $U(1)^3$ black holes populate the first, and an explicit compact horizon from the non-static Kunduri-Lucietti family, with $P$ vanishing at two points, populates the second and verifies the extension hypothesis numerically. We also prove $K$ is identically zero or everywhere positive, exclude a hidden Killing-tensor symmetry, and leave the $S^1\\times S^2$ black-ring window $\\tfrac13\\Phi^2<\\chi^2K\\leq\\tfrac43\\Phi^2$ unexcluded on either sub-branch.", "url": "https://arxiv.org/abs/2608.22509", "type": "理论", "summary": "1. 该工作研究规范D=5超引力耦合矢量多重态的超对称近地平线几何，在不预设旋转对称的条件下，证明了在紧致连通无边截面S上存在与典范旋转Killing场独立的第二旋转Killing场。\n2. 其核心在于按K=Q_{IJ}C^IC^J的符号区分两支，并由dP=0将Killing方程化为沿P的平坦秩二系统，显式给出U=||η_-||^2(h_YN-h_NY)，从而从超对称与紧致性而非ansatz恢复Kunduri-Lucietti几何。\n3. 该结果排除了隐藏Killing张量对称性，证明K恒为零或处处为正，并留下S^1×S^2黑环窗口未被排除，为超对称近地平线几何的完全分类与黑环存在性提供了可检验约束。", "summary_source": "deepseek", "authors": [{"name": "Usman Kayani"}], "featured_authors": [{"name": "Usman Kayani"}], "author_count": 1}, {"id": "2608.22609", "category": "hep-th", "title": "Genus-Two Contributions to Late-Time Correlators in JT Gravity", "abstract": "In this work, we analyze the late-time two-point correlation function in Jackiw--Teitelboim gravity, focusing on the genus-two ($g=2$) contribution associated with two baby universes. Extending the analysis of the single-baby-universe ($g=1$) case, we formulate an amplitude describing the emission and absorption of two baby universes during the evolution of the Hartle--Hawking state. This formulation reduces the problem to a moduli-space integral involving the Weil--Petersson volume $V_{0,3}$. To evaluate this integral, we decompose $V_{0,3}$ into contributions from Kontsevich graphs and extend the no-shortcut condition to the relevant genus-two strip geometries. Combined with the strip approximation, this decomposition reorganizes the moduli-space integral into a finite sum of contributions associated with distinct geometric configurations. We then explicitly evaluate the strip-geometry contributions corresponding to the emission of two baby universes and determine their contribution to the genus-two late-time two-point correlation function. Our results suggest that the strip approximation, together with the no-shortcut condition, provides a useful analytic framework for studying higher-genus geometries containing multiple wormholes.", "url": "https://arxiv.org/abs/2608.22609", "type": "理论", "summary": "1. 该工作计算了JT引力中双婴儿宇宙对应的亏格二贡献对晚期两点关联函数的影响。\n2. 其技术核心是将V_{0,3}按Kontsevich图分解，并把无捷径条件推广至亏格二窄条几何，从而将模空间积分化为有限项并显式求值。\n3. 这为包含多个虫洞的高亏格几何提供了基于窄条近似与无捷径条件的解析框架，可用于后续晚期关联函数研究。", "summary_source": "deepseek", "authors": [{"name": "Masayoshi Sato"}], "featured_authors": [{"name": "Masayoshi Sato"}], "author_count": 1}, {"id": "2608.22625", "category": "hep-th", "title": "Higher-spin charges and the $L_Λ w_{1 + \\infty}$ algebra in (A)dS$_4$", "abstract": "We consider $(3+1)$-dimensional asymptotically locally (anti-)de Sitter ((A)dS$_4$) spacetimes with boundary conditions allowing for gravitational flux. We construct an infinite tower of higher-spin charges as perturbative solutions in the cosmological constant $\\Lambda$ to a hierarchy of evolution equations resulting from an asymptotic expansion of the Einstein equations. We show that these charges canonically realize the $\\Lambda$-deformed $w_{1+\\infty}$ algebra ($L_{\\Lambda} w_{1+\\infty}$) on a restricted gravitational phase space, thereby extending the higher-spin symmetry structure of asymptotically flat spacetimes to asymptotically (A)dS spacetimes. We further construct the curved-space counterparts of conformally soft gravitons directly in terms of spacetime data. We show that they are primaries with respect to an $\\mathfrak{sl}(2,\\mathbb{R})$ subalgebra of the (A)dS$_4$ isometry algebra and that their Poisson brackets with the quadratic higher-spin charges reproduce the $\\Lambda$-deformed celestial operator product expansion proposed by Taylor and Zhu. Our results establish the bulk gravitational origin of the $L_{\\Lambda}w_{1+\\infty}$ symmetry and extend the celestial bulk-boundary dictionary to asymptotically (A)dS$_4$ gravity.", "url": "https://arxiv.org/abs/2608.22625", "type": "理论", "summary": "1. 该工作在允许引力通量的(A)dS₄渐近局部时空构造了随宇宙学常数微扰展开的无穷高自旋荷塔。\n2. 其核心在于由爱因斯坦方程渐近展开导出荷的演化层级，证明荷在约化相空间实现L_Λ w_{1+∞}代数，并用时空数据直接构造共形软引力子的弯曲时空对应。\n3. 该结果确立了L_Λ w_{1+∞}对称性的体引力起源，并借由对Λ变形天球OPE的复现，将天体全息体边词典推广至渐近(A)dS₄引力。", "summary_source": "deepseek", "authors": [{"name": "Lorenzo Di Giacomo"}, {"name": "Maitá Micol"}, {"name": "Daniele Pranzetti"}, {"name": "Ana-Maria Raclariu"}], "featured_authors": [{"name": "Lorenzo Di Giacomo"}, {"name": "Maitá Micol"}, {"name": "Daniele Pranzetti"}, {"name": "Ana-Maria Raclariu"}], "author_count": 4}, {"id": "2608.22669", "category": "hep-th", "title": "Towards Perturbative Unimodular Poincaré Gauge Theories with Propagating Torsion", "abstract": "We study the one-loop relation between an effective-field-theory extension of Poincaré gauge theories of gravity with propagating torsion and its unimodular counterpart. In the Einstein representation, we consider two representative quadratic torsion subsectors, namely totally antisymmetric (axial) torsion and the vector component of hook-antisymmetric torsion. On maximally symmetric metric backgrounds with vanishing background torsion, the diffeomorphism-invariant and genuine unimodular theories yield identical one-loop determinants in both sectors, reproducing the same local logarithmic divergences. We further examine flat backgrounds with homogeneous axial or vector torsion, where metric-torsion mixing is present. In each case, the torsion-dependent one-loop effective action in unimodular gauge and in the genuine unimodular formulation is controlled by the same physical determinant. Thus, for the actions and backgrounds considered, the unimodular constraint does not modify local one-loop torsion dynamics. We also delineate the limitations of this equivalence and the extensions needed for generic torsionful curved backgrounds.", "url": "https://arxiv.org/abs/2608.22669", "type": "理论", "summary": "1. 该文在单圈层次比较了带传播挠率的庞加莱规范引力有效场论与其幺模版本。\n2. 在爱因斯坦表示中，对轴挠率与钩反对称挠率的矢量分量两类二次挠率子扇区，证明在最大对称无挠背景及具有均匀挠率的平背景上，两种表述由相同物理行列式控制，局部对数发散与挠率依赖有效作用不变。\n3. 这表明幺模约束在考虑的背景和扇区中不改变局部挠率单圈动力学，并为推广到一般带挠弯曲背景指明所需扩展。", "summary_source": "deepseek", "authors": [{"name": "Arthur F. Vieira"}, {"name": "Antonio D. Pereira"}, {"name": "Reinhard Alkofer"}], "featured_authors": [{"name": "Arthur F. Vieira"}, {"name": "Antonio D. Pereira"}, {"name": "Reinhard Alkofer"}], "author_count": 3}, {"id": "2608.22855", "category": "hep-th", "title": "Bouncing shellworld embedded in charged AdS spacetime", "abstract": "We investigate the cosmological evolution of a spherical brane within the shellworld (dark bubble) scenario embedded in a five-dimensional charged AdS bulk spacetime. For zero or small value of the brane cosmological constant, the shellworld universe has a nonsingular bouncing and cyclic nature with the bounce induced by the charge parameter of the bulk spacetime. On large value of the brane cosmological constant, the shellworld undergoes a nonsingular bounce and expands eternally. Under certain conditions, the brane bounces outside the bulk horizons, leading to a geometrical resolution of the Cauchy horizon instability present in standard braneworld models. Furthermore, analysis of linear scalar perturbations reveals that test scalar field modes remain regular and non-divergent across the bounce. Finally, we incorporate uniformly distributed long strings in the bulk and demonstrate that the bounce still persists while avoiding the horizon instability.", "url": "https://arxiv.org/abs/2608.22855", "type": "理论", "summary": "1. 该工作研究了嵌入五维带电AdS体时空的壳世界（暗气泡）球面膜的宇宙学演化，分析了零/小膜宇宙常数下的无奇点循环反弹与大膜宇宙常数下的永恒膨胀反弹。\n2. 其主要物理卖点是体时空电荷参数诱导反弹，并在满足条件时使膜于体视界外反弹，从而以几何方式规避标准膜世界中柯西视界的不稳定性。\n3. 线性标量扰动在反弹过程中保持正则不发散，加入均匀分布长弦后反弹依然成立且仍避开视界不稳定，为构建奇点自由的循环膜宇宙模型提供了具体可行方案。", "summary_source": "deepseek", "authors": [{"name": "Karma P. Sherpa"}, {"name": "Rishi Pokhrel"}, {"name": "Indra K. P. Chettri"}, {"name": "Tanay K. Dey"}], "featured_authors": [{"name": "Karma P. Sherpa"}, {"name": "Rishi Pokhrel"}, {"name": "Indra K. P. Chettri"}, {"name": "Tanay K. Dey"}], "author_count": 4}, {"id": "2608.22952", "category": "hep-th", "title": "A pedagogical introduction to invariant theory and finite-$N$ holography", "abstract": "These lectures provide a pedagogical introduction to the study of finite-$N$ physics of the AdS/CFT correspondence. More specifically we develop the consequences of the trace relations for the space of gauge invariant operators, using powerful methods from invariant theory. Our key conclusions are \\begin{itemize} \\item that the complete set of trace relations can be solved, leaving a non-redundant set of gauge invariant operators, \\item that this non-redundant set can be generated using two types of generators, called primary and secondary invariants, and \\item that the primary invariants acquire a natural interpretation as perturbative gravitational degrees of freedom, while the secondary algebra encodes non-perturbative effects of the dual gravitational theory. \\end{itemize}", "url": "https://arxiv.org/abs/2608.22952", "type": "理论", "summary": "1. 该讲义以不变量理论为教学主线，对 AdS/CFT 对偶中的有限 N 物理作系统阐述，具体分析规范不变算符空间中全部迹关系的代数后果。\n2. 其核心卖点在于完整求解所有迹关系，获得由初级与次级不变量生成的非冗余基，并将初级不变量解释为引力微扰自由度，次级代数解释为非微扰效应。\n3. 这为理解有限 N 全息对偶中的非微扰结构提供了严格代数图像和教学入口，可作为相关量子引力与规范场论研究的概念基础。", "summary_source": "deepseek", "authors": [{"name": "Robert de Mello Koch"}, {"name": "Minkyoo Kim"}, {"name": "Augustine Larweh Mahu"}, {"name": "Anik Rudra"}], "featured_authors": [{"name": "Robert de Mello Koch"}, {"name": "Minkyoo Kim"}, {"name": "Augustine Larweh Mahu"}, {"name": "Anik Rudra"}], "author_count": 4}, {"id": "2608.23008", "category": "hep-th", "title": "A Combinatorial Origin of Locality", "abstract": "Locality and unitarity are fundamental principles of quantum field theory. For tree-level scattering amplitudes, locality determines which propagator poles may occur together, while unitarity fixes their residues through factorization. Previous uniqueness theorems have repeatedly shown that unitarity can emerge from locality combined with other physical principles. In this Letter we give the first complete all-multiplicity proof for the emergence of locality in this setting. We focus on Tr($\\phi^3$) theory and phrase locality as a problem in geometric combinatorics. Planar propagators are chords of a polygon, and a denominator is local exactly when its chords triangulate the polygon, and non-local otherwise. We show that hidden zeros---regular kinematic conditions on which the amplitude vanishes---enforce pole compatibility and therefore imply a local singularity structure. The proof rests on two ingredients: a graphical \\emph{star test} determines when a chosen zero eliminates a pole product, and a \\emph{smoothing} procedure finds such a zero. Thus, once the planar pole alphabet and denominator bound are specified, locality and unitarity emerge together from a single on-shell principle: hidden zeros. Equivalently, our proof provides a novel characterization of a familiar concept: polygon triangulations are precisely the chord configurations that evade every star test.", "url": "https://arxiv.org/abs/2608.23008", "type": "理论", "summary": "1. 该工作给出Tr(φ^3)理论树级散射振幅中局域性涌现的首个全多重数证明，将传播子极点相容性问题转化为多边形弦图的组合学。\n2. 其核心是星形检验与平滑操作：隐藏零点逐一剔除非局域极点乘积，而局域分母恰为躲避所有星形检验的三角剖分弦组，从而由单一在壳原理同时推出局域性与幺正性。\n3. 该结果将多边形三角剖分刻画为零点约束下唯一幸存的弦结构，为在其他振幅理论中借助隐藏零点统一导出局域性提供了可推广的范本。", "summary_source": "deepseek", "authors": [{"name": "Laurentiu Rodina"}, {"name": "Giuseppe Sellaroli"}, {"name": "Jonathan Valenzuela"}], "featured_authors": [{"name": "Laurentiu Rodina"}, {"name": "Giuseppe Sellaroli"}, {"name": "Jonathan Valenzuela"}], "author_count": 3}, {"id": "2608.23069", "category": "hep-th", "title": "Renormalization, cutoff, and gluing for a quartic model with boundary", "abstract": "In this paper, we study the renormalization of a three-dimensional quartic model on a compact connected Riemannian manifold with a boundary. We show that, in addition to the standard shift of the mass parameter, it is necessary to take into account boundary contributions involving singular coefficients. This indicates the need to extend the classical action within the framework of standard renormalization theory. The requirements of consistency regarding the gluing of manifolds lead to renormalization of an operator on the boundary.", "url": "https://arxiv.org/abs/2608.23069", "type": "理论", "summary": "1. 该文研究带边界紧致连通黎曼流形上三维四次标量模型的重整化，并分析截断与边界效应对有效作用量的影响。\n2. 其核心在于证明除质量参数平移外，边界会引入含奇异系数的贡献，因而需扩展经典作用量，且流形拼接相容性要求对边界算子进行重整化。\n3. 这为带边界量子场论的重整化方案提供了统一框架，并约束了拓扑拼接构造中边界自由度的物理处理方式。", "summary_source": "deepseek", "authors": [{"name": "A. V. Ivanov"}], "featured_authors": [{"name": "A. V. Ivanov"}], "author_count": 1}, {"id": "2608.23077", "category": "hep-th", "title": "Love at the String Scale: Tidal Deformability Across the Black Hole-String Transition", "abstract": "Tidal deformability provides a sensitive probe of the structure of compact objects, and black holes are exceptional in having vanishing static Love numbers in four-dimensional Einstein gravity. We ask what happens to this fine-tuned rigidity across the black hole-string transition, where the same states are expected to admit a weakly coupled description as a self-gravitating highly excited string, or \"string star\". We compute the static tidal Love numbers of the Horowitz-Polchinski (HP) string star for multipoles $\\ell=2,3,4$ in $D=4,5,6$. The response is non-zero in all cases, as in the available $\\alpha'$-corrected black hole results, so the zero-Love structure of four-dimensional Einstein gravity does not survive on either side of the transition. On the string side, however, the response has a distinctive multipolar structure: the Love numbers grow rapidly with $\\ell$, and we show analytically that this growth originates from the competition between the multipolar weight of the tidal field and the exponential tail of the winding condensate, with the result that the radial scale probed by the deformability grows linearly with $\\ell$ at large multipole number. This provides a direct tidal signature of the extended, surface-less nature of the string star. We discuss the comparison with $\\alpha'$-corrected black holes and the limitations of the currently available perturbative results at large $\\ell$.", "url": "https://arxiv.org/abs/2608.23077", "type": "理论", "summary": "1. 该工作跨黑洞-弦转变研究致密天体潮汐形变，计算Horowitz-Polchinski弦星在D=4,5,6及多极l=2,3,4下的静态Love数，发现四维Einstein引力零Love结构在转变两侧均不成立。\n2. 其技术卖点在于解析揭示弦星Love数随l快速增长的机制：潮汐场的多极权重与缠绕凝聚指数尾部的竞争，使形变探测到的径向尺度在大l下随l线性增大，直接反映弦星扩展且无表面的本质。\n3. 该结果可作为弦态特有的潮汐特征预言，并为与alpha'修正黑洞结果的对比及大l下更可靠微扰计算提供明确方向。", "summary_source": "deepseek", "authors": [{"name": "Roberto Emparan"}, {"name": "Luis Lehner"}, {"name": "Stefano Trezzi"}], "featured_authors": [{"name": "Roberto Emparan"}, {"name": "Luis Lehner"}, {"name": "Stefano Trezzi"}], "author_count": 3}, {"id": "2608.23111", "category": "hep-th", "title": "A Third-Quantized Description of Spacetime Wormholes in AdS/CFT", "abstract": "We propose an extension of AdS/CFT in which quantum gravitational wavefunctions of connected bulk geometries are assembled into a Fock space of universes. Splitting and joining interactions in a third-quantized Hamiltonian then provide a quantum description of changes in bulk connectivity and topology. Reduced phase-space quantization supplies the physical one-universe Hilbert space and a radial Schrödinger evolution with respect to which the topology-changing interactions are ordered. We develop the construction concretely in AdS$_3$ gravity with a torus boundary, where these ingredients can be described explicitly. The light spectrum is treated as fixed, non-normalizable background data, whereas the normalizable states above the black-hole threshold are quantized as dynamical modes. A conventional boundary theory is selected by choosing a coherent state whose universe-field expectation value, together with the fixed background contribution, yields consistent CFT data at the asymptotic boundary. Generic one-universe wavefunctions need not admit such an interpretation. This raises the possibility that CFT-realizable wavefunctions are nongeneric in the gravitational state space and are not closed under arbitrary superpositions of gravitational states. The known two-torus spacetime-wormhole amplitude, which lies at the heart of the factorization problem, provides concrete input for the topology-changing interactions of the third-quantized theory. A complementary cutting-and-gluing description yields an effective ensemble interpretation when the resulting gravitational sectors admit consistent boundary-theory interpretations, without assuming a fundamental ensemble of boundary theories. We also discuss replica wormholes and baby-universe processes within the same framework.", "url": "https://arxiv.org/abs/2608.23111", "type": "理论", "summary": "1. 该工作提出AdS/CFT的三次量子化推广，将连通体几何的量子引力波函数组装成多宇宙Fock空间，并在AdS3环面边界情形下具体构造。\n2. 其核心在于用约化相空间量子化给出单宇宙希尔伯特空间与径向薛定谔演化，使体拓扑改变由分裂/融合哈密顿量描述，并以两环面虫洞振幅约束相互作用。\n3. 这暗示可由CFT实现的波函数在引力态空间中并不普遍，且不一定对任意叠加封闭，为无需基本系综的系综解释及复制虫洞研究提供了新框架。", "summary_source": "deepseek", "authors": [{"name": "Shinji Hirano"}], "featured_authors": [{"name": "Shinji Hirano"}], "author_count": 1}, {"id": "2608.23220", "category": "hep-th", "title": "Conformal and Noncommutative Gravity from Gauge Symmetry Breaking and SO(2,16) Unification", "abstract": "Motivated by the old idea of treating gravity as a gauge theory, we review the gauge-theoretic construction of Conformal Gravity and of Noncommutative (Fuzzy) Gravity. We then outline how these gauge formulations of gravity can be unified with internal interactions described by an SO(10) Grand Unified Theory, based on the critical observation that the dimension of the tangent-space symmetry group of a curved manifold need not coincide with the spacetime dimension.", "url": "https://arxiv.org/abs/2608.23220", "type": "理论", "summary": "1. 该工作系统回顾了将共形引力与非交换（模糊）引力作为规范理论进行构造的方案，并概述其与SO(10)大统一理论统一的可能路径。\n2. 其核心卖点在于关键观察：弯曲时空切空间对称群维数不必等于时空维数，由此通过SO(2,16)规范对称性破缺将两类引力与内部相互作用纳入同一框架。\n3. 这为从规范对称性破缺出发推导引力和统一规范相互作用提供了具体方向，或可启发后续量子引力与时空涌现问题的研究。", "summary_source": "deepseek", "authors": [{"name": "Stelios Stefas"}, {"name": "George Zoupanos"}], "featured_authors": [{"name": "Stelios Stefas"}, {"name": "George Zoupanos"}], "author_count": 2}, {"id": "2608.23243", "category": "hep-th", "title": "Analytical Cosmological Collider at Strong Mixing in Laplace Space", "abstract": "Primordial non-Gaussianities are at their largest when the curvature perturbation is coupled to a massive field by a mixing too strong to be treated perturbatively. We show that this regime, naturally reached in multifield inflation, is solved analytically by the Laplace-space representation we recently introduced, in which every mode becomes a superposition of plane waves weighted by a single kernel. The bispectrum then follows as a rapidly convergent series of elementary functions, in perfect agreement with independent numerical results. We find that the cosmological collider signal at strong mixing is larger than widely believed, with only half of the usual Boltzmann suppression. Its amplitude further grows with the number of time derivatives of the curvature perturbation in the interaction, singling out the most promising observational targets.", "url": "https://arxiv.org/abs/2608.23243", "type": "理论", "summary": "1. 该工作利用作者近期引入的拉普拉斯空间表示，解析求解了多重暴胀中曲率扰动与重场间强到不可微扰的混合所产生的最强原初非高斯性。\n2. 其卖点在于每个模式都成为单一核加权的平面波叠加，从而将强混合下的双谱化为初等函数的快速收敛级数，并与独立数值结果完全一致，且信号只受一半玻尔兹曼抑制。\n3. 这显著上调了宇宙学对撞机信号的预期幅度，并表明含更多曲率扰动时间导数的相互作用是未来原初非高斯性观测的首选目标。", "summary_source": "deepseek", "authors": [{"name": "Nathan Belrhali"}, {"name": "Arthur Poisson"}, {"name": "Sébastien Renaux-Petel"}], "featured_authors": [{"name": "Nathan Belrhali"}, {"name": "Arthur Poisson"}, {"name": "Sébastien Renaux-Petel"}], "author_count": 3}, {"id": "2608.23298", "category": "hep-th", "title": "The ETH matrix model for DSSYK: non-perturbative corrections and intersection theory", "abstract": "At leading order in the genus expansion the ETH matrix model for DSSYK reproduces its correlators by construction, while its higher-genus corrections are conjectured to capture higher-topology contributions in the dual sine-dilaton gravity -- a correspondence established so far only for the disk and the wormhole. At fixed genus the correlators are built from discrete volumes $N_{g,n}$, polynomial in $q$-deformed zeta values $\\zeta_q(2k)$ with $q=e^{-\\lambda}$, $\\lambda$ being the DSSYK coupling. These lie in the ring of quasimodular forms generated by the Eisenstein series $E_2,E_4,E_6$, whose $S$-duality yields an exact closed form for the leading non-perturbative correction as $\\lambda\\to0$, controlled by $\\widetilde q=e^{-4\\pi^2/\\lambda}$. Known at disk level, this scale is shown here to govern the fixed-genus, higher-boundary amplitudes as well. We show that the term linear in $\\widetilde q$, at leading order in $\\lambda$, is captured entirely by the $q$-deformed Weil--Petersson volumes, and reduces to a finite sum of intersection numbers of $\\kappa$-classes on the moduli space $\\overline{\\mathcal M}_{g,n}$ of stable curves, computable without repeating the topological recursion that produced the $N_{g,n}$. We tabulate it for every $(g,n)$ whose $q$-deformed volume is known in closed form, and extend it to $(3,1),(3,2),(4,1)$, where none is available. The construction is not restricted to leading order: we work out $O(\\widetilde q^2)$ for the same cases.", "url": "https://arxiv.org/abs/2608.23298", "type": "理论", "summary": "1. 该工作证明ETH矩阵模型对DSSYK的固定亏格振幅中，领头非微扰修正由~q=e^{-4π²/λ}控制并归结为κ类交点数之和。\n2. 其技术核心是借助Eisenstein级数模环的S对偶，将O(~q)项化为q形变Weil-Petersson体积的有限交点数，避开拓扑递归并覆盖(3,1),(3,2),(4,1)等新情形。\n3. 这为DSSYK/sine-dilaton引力对偶中非微扰效应与模空间几何的关联提供显式检验，也为更高阶~q修正给出可推广框架。", "summary_source": "deepseek", "authors": [{"name": "Eleonora Alfinito"}, {"name": "Matteo Beccaria"}], "featured_authors": [{"name": "Eleonora Alfinito"}, {"name": "Matteo Beccaria"}], "author_count": 2}, {"id": "2608.23326", "category": "hep-th", "title": "Perturbative Anomaly Inflow on Orbifolds", "abstract": "We study perturbative anomaly inflow for effective theories supported on orbifold fixed loci of the internal geometry. Donnelly's equivariant APS theorem gives a fixed-point density, whose degree-\\((d+2)\\) component is identified as the anomaly polynomial of the \\(d\\)-dimensional effective theory. We apply the construction to six-dimensional A-type orbi-instanton theories engineered by \\(N\\) M5-branes probing a transverse \\(\\mathbb{C}^2/\\mathbb{Z}_k\\) singularity at an end-of-the-world M9-brane. For a flat \\(E_8\\) connection specified by \\(\\rho:\\mathbb{Z}_k\\to E_8\\), we compute the non-identity ALE fixed-point class on the M9 wall. Its degree-eight component agrees with the complete Kac-label-dependent remainder conjectured in \\cite{MOTZ}, including the \\(SU(2)_R\\) and tangent-bundle curvatures. Together with the known M5/Hořava--Witten and ALE/Hořava--Witten terms, this reproduces the unflavored tensor-branch anomaly polynomial. This local equality further suggests a complete M-theory corner-inflow interpretation. The same prescription also be extended to include flavor symmetries as the centralizer of \\(E_8\\).", "url": "https://arxiv.org/abs/2608.23326", "type": "理论", "summary": "1. 该工作利用Donnelly等变APS定理研究轨道流形固定点上有效理论的微扰反常流入，并将度(d+2)分量识别为d维理论的反常多项式。\n2. 对M5膜探测C^2/Z_k奇点并终止于M9墙的六维A型orbi-instanton，计算出M9墙上非平凡ALE固定点类的度八分量，其与含SU(2)_R及切丛曲率的Kac标号依赖余项完全一致。\n3. 该局部等式给出完整M理论角点流入解释，并可推广至E_8中心化子对应的味对称，为无味张量分支反常多项式提供了统一推导。", "summary_source": "deepseek", "authors": [{"name": "Hao Y. Zhang"}], "featured_authors": [{"name": "Hao Y. Zhang"}], "author_count": 1}, {"id": "2608.23378", "category": "hep-th", "title": "Landau theory, effective temperature, and tricritical phenomena in a holographic nonequilibrium steady state", "abstract": "We investigate the critical exponents $(\\gamma,\\nu)$ at the current-driven tricritical point (TCP) associated with chiral symmetry breaking in a nonequilibrium steady state described by the D3/D7 model. In the symmetry-broken phase, we find that, unlike in the conventional Landau theory, both $\\gamma$ and $\\nu$ can take values different from those predicted by the Landau theory and depend on the path along which the TCP is approached in the phase diagram. However, when the TCP is approached with the ratio of the effective temperature to the heat bath temperature, $T_{*}/T$, held fixed, the critical exponents agree with those of the Landau theory. These results suggest that the critical phenomena at the current-driven TCP may be described by the Landau theor
