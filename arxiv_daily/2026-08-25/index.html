  <title>arXiv 2026-08-25 · Daily ArXiv Selection</title>
  <style>
    :root {
      --bg: #f6f1e8;
      --panel: rgba(255, 252, 246, 0.92);
      --text: #2d241d;
      --muted: #6d5d50;
      --line: rgba(69, 49, 32, 0.14);
      --accent: #8f3d2e;
      --accent-2: #1d5f6b;
      --theory: #7c3a2a;
      --numeric: #255b6a;
      --both: #5d4a99;
      --experimental: #2f6b39;
      --shadow: 0 18px 40px rgba(54, 32, 16, 0.12);
      --radius: 22px;
      --ui-font: "Aptos", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --title-font: "Palatino Linotype", "Noto Serif SC", Georgia, serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--ui-font);
      color: var(--text);
      background: radial-gradient(circle at top left, rgba(255,255,255,0.78), transparent 32%), radial-gradient(circle at 88% 12%, rgba(29,95,107,0.14), transparent 20%), linear-gradient(180deg, #fbf7f0 0%, var(--bg) 42%, #f2e8dc 100%);
      min-height: 100vh;
    }
    .shell { width: min(1220px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 64px; }
    .hero {
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(255,255,255,0.84), rgba(255,248,238,0.72)), linear-gradient(135deg, rgba(143,61,46,0.08), rgba(29,95,107,0.08));
      box-shadow: var(--shadow);
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.82); border: 1px solid var(--line); color: var(--muted); font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase;
    }
    h1 { margin: 18px 0 10px; font-family: var(--title-font); font-size: clamp(32px, 5vw, 54px); line-height: 1.04; letter-spacing: -0.03em; }
    .hero p { max-width: 880px; color: var(--muted); font-size: 16px; line-height: 1.7; margin: 0; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-top: 26px; }
    .stat { padding: 16px 18px; background: rgba(255,255,255,0.76); border: 1px solid var(--line); border-radius: 18px; }
    .stat .label { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
    .stat .value { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
    .controls { position: sticky; top: 12px; z-index: 3; margin-top: 22px; padding: 18px; border: 1px solid var(--line); border-radius: 24px; background: rgba(250,244,236,0.9); backdrop-filter: blur(16px); box-shadow: 0 10px 24px rgba(54,32,16,0.08); }
    .control-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 16px; }
    .field { display: flex; flex-direction: column; gap: 10px; }
    .field label { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
    .search { width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line); background: rgba(255,255,255,0.92); font: inherit; color: var(--text); }
    .chip-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .chip { border: 1px solid var(--line); background: rgba(255,255,255,0.82); color: var(--text); padding: 10px 14px; border-radius: 999px; font: inherit; cursor: pointer; }
    .chip.active { border-color: rgba(143,61,46,0.35); background: rgba(143,61,46,0.12); color: #5b2419; }
    .chip[data-type="数值"].active { border-color: rgba(37,91,106,0.35); background: rgba(37,91,106,0.12); color: #173f49; }
    .chip[data-type="理论+数值"].active { border-color: rgba(93,74,153,0.35); background: rgba(93,74,153,0.12); color: #46337d; }
    .chip[data-type="实验"].active { border-color: rgba(47,107,57,0.35); background: rgba(47,107,57,0.12); color: #214c29; }
    .meta-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 14px; color: var(--muted); font-size: 14px; }
    .paper-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 18px; margin-top: 22px; }
    .paper { display: flex; flex-direction: column; gap: 14px; padding: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 10px 24px rgba(54,32,16,0.06); }
    .paper-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .tag { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid transparent; }
    .tag.category { background: rgba(45,36,29,0.08); color: var(--text); }
    .tag.type-theory { background: rgba(124,58,42,0.1); color: var(--theory); border-color: rgba(124,58,42,0.16); }
    .tag.type-numeric { background: rgba(37,91,106,0.1); color: var(--numeric); border-color: rgba(37,91,106,0.16); }
    .tag.type-both { background: rgba(93,74,153,0.1); color: var(--both); border-color: rgba(93,74,153,0.16); }
    .tag.type-experimental { background: rgba(47,107,57,0.1); color: var(--experimental); border-color: rgba(47,107,57,0.16); }
    .paper h2 { margin: 0; font-family: var(--title-font); font-size: 22px; line-height: 1.25; letter-spacing: -0.02em; }
    .paper h2 a { color: inherit; text-decoration: none; }
    .paper h2 a:hover { color: var(--accent); }
    .paper .id { color: var(--muted); font-size: 13px; }
    .author-block { display: grid; gap: 10px; padding: 14px 16px; border-radius: 18px; background: rgba(255,255,255,0.64); border: 1px solid var(--line); }
    .author-label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .author-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .author-item { display: grid; gap: 4px; }
    .author-item strong { font-size: 14px; }
    .author-item span { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .author-note { color: var(--muted); font-size: 12px; }
    .paper .summary { margin: 0; font-size: 15px; line-height: 1.75; white-space: pre-line; }
    details { border-top: 1px solid var(--line); padding-top: 12px; }
    details summary { cursor: pointer; color: var(--accent-2); font-weight: 700; list-style: none; }
    details summary::-webkit-details-marker { display: none; }
    details p { margin: 10px 0 0; color: var(--muted); line-height: 1.72; font-size: 14px; white-space: pre-line; }
    .paper footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 6px; color: var(--muted); font-size: 13px; }
    .paper footer a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .empty { display: none; margin-top: 24px; padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 22px; background: rgba(255,255,255,0.7); }
    @media (max-width: 980px) { .control-grid { grid-template-columns: 1fr; } .controls { position: static; } }
  </style>

  <script>
    const papers = [{"id": "2608.21451", "category": "cond-mat", "title": "Power Series for the Quantum Statistical Mechanics Probability with Results for the Second Virial Coefficient of Helium", "abstract": "A power series for the Wigner-Kirkwood pair commutation function for quantum statistical mechanics in classical phase space is given with terms automatically generated by recursion. The calculated second virial coefficient agrees with the measured values of helium for temperatures greater than 65 K. Prospects for a general quantum Monte Carlo algorithm are discussed.", "url": "https://arxiv.org/abs/2608.21451", "type": "数值", "summary": "1. 该工作给出了经典相空间中以Wigner-Kirkwood对易函数为核心的量子统计力学概率的幂级数展开，其各阶系数可由递归关系自动生成而无需逐阶人工推导。\n2. 主要技术卖点在于递归构造高阶量子修正项，使计算所得氦气第二维里系数在温度高于65 K时与实验测量值定量吻合。\n3. 这一可扩展的级数格式为发展普适量子蒙特卡罗算法提供了明确基础，有望将半经典量子统计方法推广至更复杂的真实量子多体体系。", "summary_source": "deepseek", "authors": [{"name": "Phil Attard"}], "featured_authors": [{"name": "Phil Attard"}], "author_count": 1}, {"id": "2608.21490", "category": "cond-mat", "title": "Electrostatic lens of a charged vortex", "abstract": "We study the local electrostatic response of a charged superfluid in the presence of a cylindrically symmetric vortex, allowing both the particle density and the thermodynamic compressibility to vary with the radial coordinate. Starting from the electrostatic charge response obtained from the phase-only Popov action, we introduce a local-density extension and derive the regular near-axis expansion of the scalar potential. The constant, quadratic, and quartic coefficients are obtained explicitly in terms of the local screening response and of the leading nonuniform contribution to the vortex density profile. For a three-dimensional unitary Fermi equation of state, the density dependence of the compressibility generates a definite thermodynamic contribution to the quartic coefficient. The resulting decomposition separates this equation-of-state contribution from the ordinary constant-screening and charge-source terms that occur at the same order. This provides a compact analytical connection between vortex-core thermodynamics and the local electrostatic profile of a charged superfluid.", "url": "https://arxiv.org/abs/2608.21490", "type": "理论", "summary": "1. 该工作研究了带电超流体中柱对称涡旋的局域静电响应，允许粒子密度与热力学压缩率随径向坐标变化，并推导了标势在近轴区域的正则展开。\n2. 其技术卖点在于基于相位型Popov作用构造局域密度扩展，显式给出常数、二次和四次展开系数，并利用三维幺正费米气体的状态方程分离出压缩率密度依赖所产生的确定热力学贡献。\n3. 这一分解建立了涡核热力学与局域静电剖面之间的紧凑解析联系，为通过静电成像探测涡旋核心物态方程及相关非均匀超流体系提供了明确理论工具。", "summary_source": "deepseek", "authors": [{"name": "Iogann Tolbatov"}, {"name": "Luca Salasnich"}], "featured_authors": [{"name": "Iogann Tolbatov"}, {"name": "Luca Salasnich"}], "author_count": 2}, {"id": "2608.21540", "category": "cond-mat", "title": "Automated Analysis to Reveal Grain Boundary Phase Microstructures", "abstract": "We develop a method for analyzing grain boundary (GB) microstructures that identifies distinct interfacial phases and the dislocation line defects separating them. Similar to bulk materials, GBs can adopt multiple distinct interfacial phases and undergo first-order phase transitions. When these phases coexist, their spatial arrangement and phase junctions constitute a GB microstructure, characterized by variations in excess properties and line defects with associated dislocation content. Despite this intrinsic heterogeneity, our ability to quantitatively characterize GB microstructures remains limited, as it requires identification of individual GB phases, phase-resolved excess properties, and the Burgers content of phase junctions, capabilities not available in existing automated methods. Here, we present an automated tool that performs interfacial microstructure mapping for planar coincidence site lattice GBs. The method identifies the spatial distribution of GB phases, quantifies phase-specific excess properties, and estimates the Burgers content of GB phase junctions. We demonstrate the approach using three representative cases: (i) quantification of mass transport during diffusion-limited GB phase transformations; (ii) identification of structurally indistinguishable phases formed by vacancy and interstitial loops; and (iii) characterization of GB microstructures containing phase nuclei. More broadly, this framework enables quantitative studies of GB evolution processes, including spinodal decomposition and coarsening with direct implications for GB deformation, creep, and migration.", "url": "https://arxiv.org/abs/2608.21540", "type": "理论+数值", "summary": "1. 该工作发展了晶界相微结构的自动分析方法，用于识别不同界面相及分隔这些相的位错线缺陷。\n2. 其技术卖点是对平面重合位置点阵晶界实施界面微结构映射，同时给出相的空间分布、分相过剩性质及相结的伯格斯矢量含量。\n3. 该框架为定量研究晶界相变、失稳分解及粗化等演化过程提供支撑，并有助于揭示晶界变形、蠕变与迁移的微观机制。", "summary_source": "deepseek", "authors": [{"name": "R. Daniel Moore"}, {"name": "Ian S. Winter"}, {"name": "Robert E. Rudd"}, {"name": "Fadi Abdeljawad"}, {"name": "Timofey Frolov"}], "featured_authors": [{"name": "R. Daniel Moore"}, {"name": "Ian S. Winter"}, {"name": "Robert E. Rudd"}, {"name": "Fadi Abdeljawad"}, {"name": "Timofey Frolov"}], "author_count": 5}, {"id": "2608.21617", "category": "cond-mat", "title": "Electrostatic Persistence Length Revisited. I. Theory", "abstract": "The problem of single-chain conformations of polyelectrolytes in salt-added dilute solutions, and the associated concept of the electrostatic persistence length $\\textbf{l}_\\mathrm{e}$, has remained unresolved for decades. To address this challenge, we develop a comprehensive scaling theory and corroborate it with simulations. A unified scaling diagram is constructed that encompasses both flexible and intrinsically semiflexible/stiff polyelectrolytes. Nine distinct scaling regimes are identified, each characterized by different conformational statistics. The concept of the Gaussian electrostatic blob $\\xi_\\mathrm{e}$ used in the description of flexible polyelectrolytes is extended to the semiflexible case, and the new characteristic length $\\xi_\\mathrm{e}^{|}$ referred to as the rodlike electrostatic blob is introduced. This enables delineating the important crossovers and showcasing an analogy between semiflexible and flexible chains. The concept of electrostatic excluded volume is also reconsidered and generalized. Upon increasing the salt concentration, i.e., decreasing the Debye length $r_\\mathrm{D}$, chain conformations evolve from (i) rodlike stretches to (ii) Gaussian and then (iii) swollen coils with local electrostatic stiffening characterized by $\\textbf{l}_\\mathrm{e}$, followed by (iv) swollen coils without stiffening but with electrostatic exclude volume, and finally to (v) quasi-neutral Gaussian coils. In regimes of type (ii) and (iii), the electrostatic persistence length scales quadratically with $r_\\mathrm{D}$, in agreement with the OSF and KK predictions for semiflexible and flexible chains, respectively: $\\textbf{l}_\\mathrm{\\mathrm{OSF}} \\simeq r_\\mathrm{D}^{2}/\\xi_\\mathrm{e}^{|}$ and $\\textbf{l}_\\mathrm{\\mathrm{KK}} \\simeq r_\\mathrm{D}^{2}/\\xi_\\mathrm{e}$. These asymptotic scalings are confirmed by coarse-grained simulations presented in the accompanying article.", "url": "https://arxiv.org/abs/2608.21617", "type": "理论+数值", "summary": "1. 该工作针对含盐稀溶液中聚电解质单链构象的静电持久长度问题，建立了统一标度理论，并辅以模拟构建了涵盖柔性与半柔性链的标度相图。\n2. 其要点是将高斯静电blob推广为杆状静电blob，重新定义静电排除体积，识别出九个不同构象统计区，并给出盐浓度升高时从杆状到高斯再到溶胀链的演化序列。\n3. 该理论预言在两类高斯区中静电持久长度按德拜长度平方标度，分别与OSF和KK结果一致，为后续模拟和实验提供了可检验的判据。", "summary_source": "deepseek", "authors": [{"name": "Artem M. Rumyantsev"}, {"name": "Alexey A. Gavrilov"}, {"name": "Albert Johner"}], "featured_authors": [{"name": "Artem M. Rumyantsev"}, {"name": "Alexey A. Gavrilov"}, {"name": "Albert Johner"}], "author_count": 3}, {"id": "2608.21624", "category": "cond-mat", "title": "Vibrational, structural, and chemical fingerprints of ion diffusion in crystalline solids", "abstract": "Predicting mobile-ion self-diffusivity $D^*$ from molecular dynamics (MD) simulations is essential for identifying promising solid-state electrolytes, but directly simulating ion diffusion is computationally expensive, particularly with high-accuracy machine learning interatomic potentials (MLIPs). Diffusion is a slow, emergent process that requires long trajectories to converge. Thermodynamic properties, by contrast, converge much faster: the enthalpy $h$, vibrational entropy $s_{vib}$, and 2-body, excess configurational entropy $s^{ex}_{2,config}$ can be extracted from comparatively short MD trajectories, and they encode rich information about the free energy landscape from which transport properties like self-diffusivity ultimately arise. Intuitive correlations are discussed between these thermodynamic properties and ion diffusion, motivating a data-driven approach to exploit this link. A simple neural network was trained to predict diffusivity from features computed over short MD trajectories: a vibrational fingerprint (the vibrational density of states, VDOS) and a structural fingerprint (the radial distribution function, RDF), conditioned on chemistry information encoded in the MLIP embedding. This combination allows the model to predict the converged $\\log_{10} D^*$ (cm$^2$/s) \\textemdash\\ normally obtained from significantly longer MD simulations \\textemdash\\ with a mean absolute error of 0.398 and a Spearman's rank correlation $\\rho$ of 0.844.", "url": "https://arxiv.org/abs/2608.21624", "type": "理论+数值", "summary": "1. 该工作训练一个神经网络，从短时分子动力学轨迹中提取热力学、振动与结构指纹，以预测晶体中移动离子的自扩散系数。\n2. 其核心在于用振动态密度和径向分布函数作为特征，并利用机器学习势的嵌入编码化学信息，从而以0.398的平均绝对误差和0.844的斯皮尔曼秩相关预测原本需长轨迹收敛的log10 D*。\n3. 该思路为使用昂贵高精度机器学习势时克服扩散模拟的时间尺度瓶颈、实现固态电解质的高通量筛选提供了直接可行路径。", "summary_source": "deepseek", "authors": [{"name": "Gavin Winter"}, {"name": "Juno Nam"}, {"name": "Rafael Gómez-Bombarelli"}], "featured_authors": [{"name": "Gavin Winter"}, {"name": "Juno Nam"}, {"name": "Rafael Gómez-Bombarelli"}], "author_count": 3}, {"id": "2608.21633", "category": "cond-mat", "title": "A high-entropy form of $R$Mn$_6$Sn$_6$ with distinct magnetotransport regimes correlated to different magnetic structures", "abstract": "The kagome $R$Mn$_6$Sn$_6$ material family has attracted significant attention as high-temperature metallic magnets with a host of different magnetic orderings and anisotropy. Theoretical studies point to the rare-earth ($R$) as the determining factor for both the direction of magnetic anisotropy and the type of magnetic ordering in a given compound. This motivates studying high-entropy forms of $R$Mn$_6$Sn$_6$ to examine how the interplay of several rare-earth elements leads to different magnetic states in a single crystal. Here, we present a rare-earth mix of Tb, Dy, Ho, Er, Tm, and Lu that produces phase transitions from a paramagnet to an easy-plane ferrimagnet (FiM) below $T_{\\text{C}}$ = 380 K, then to a FiM easy-axis state at $T_{\\text{SR1}}$ = 207 K, to a canted FiM ground state below $T_{\\text{SR2}}$ = 79 K. This behavior is consistent with previously reported high-entropy $R$Mn$_6$Sn$_6$ compounds; however, uniquely, the rare-earth mix studied here exhibits a broad transition from easy-plane to easy-axis anisotropy from 270 K to 170 K, and reveals a nonmonotonic magnetoresistance. Using neutron scattering data, we found that both observations correlate with an incommensurate modulated contribution to the spin state due to competing rare-earth interactions. This magnetoresistive behavior and the correlated spin structures underscore the potential for rare-earth engineering of magnetism.", "url": "https://arxiv.org/abs/2608.21633", "type": "理论", "summary": "1. 该工作制备了含Tb、Dy、Ho、Er、Tm与Lu的高熵RMn6Sn6单晶，并表征其磁结构与磁输运。\n2. 其要点是发现易面到易轴宽转变及非单调磁电阻，并关联到稀土竞争引起的非公度调制自旋分量。\n3. 这显示通过稀土混合可工程化磁性，为设计具有可调磁有序与输运行为的相关材料提供思路。", "summary_source": "deepseek", "authors": [{"name": "Kyle W. Fruhling"}, {"name": "Jonathan Gaudet"}, {"name": "William D. Ratcliff"}, {"name": "Jonathan S. White"}, {"name": "Siddharth Nandanwar"}, {"name": "Noah J. Fau"}, {"name": "Gregory T. McCandless"}, {"name": "Enrique O. González Delgado"}, {"name": "Julia Y. Chan"}, {"name": "Oksana Zaharko"}, {"name": "Michael A. Susner"}, {"name": "Fazel Tafti"}], "featured_authors": [{"name": "Kyle W. Fruhling"}, {"name": "Jonathan Gaudet"}, {"name": "William D. Ratcliff"}, {"name": "Oksana Zaharko"}, {"name": "Michael A. Susner"}, {"name": "Fazel Tafti"}], "author_count": 12}, {"id": "2608.21644", "category": "cond-mat", "title": "Charge Transport Framework for Crystalline pi-Conjugated Materials", "abstract": "Quantitative charge-transport modelling in crystalline pi-conjugated polymers requires an electronic representation that captures extended conjugation and material-specific electron-phonon interactions on equal footing. We present a Wannier-orbital-based formulation of the transient-polaron-localization (TPL) framework for quantitative charge-transport simulations in crystalline pi-conjugated polymers. By expressing all interactions directly in a Wannier representation derived from first-principles calculations, the approach avoids artificial fragmentation of polymer backbones and enables a consistent, material-specific description of electronic couplings and electron-phonon interactions. Low- and high-frequency vibrational modes are incorporated within a mode-resolved TPL formalism, yielding an effective electronic Hamiltonian that captures both dynamic disorder and polaronic renormalization. The methodology is demonstrated for the ambipolar crystalline naphthalenediimide-bithiophene copolymer, enabling a direct comparison of electron and hole transport along the polymer backbone and pi-stacking directions. The simulations reproduce key transport features, including pronounced anisotropy and higher electron than hole mobility. Additional studies on single- and bi-chain systems reveal the essential role of inter-chain coherence in supporting efficient transport along the polymer backbone. Beyond this specific system, the Wannier-orbital-based TPL framework provides a transferable route to disentangle intrinsic charge-transport mechanisms in crystalline pi-conjugated materials and establishes a foundation for future work.", "url": "https://arxiv.org/abs/2608.21644", "type": "理论+数值", "summary": "1. 该工作提出基于Wannier轨道的瞬态极化子局域化框架，从第一性原理出发对晶体pi共轭聚合物的电荷输运进行定量模拟。\n2. 其核心卖点在于直接在Wannier表示中统一处理扩展共轭电子结构与材料特定的电子-声子耦合，借助模分辨形式纳入低、高频振动，兼顾动力学无序和极化子重整化效应。\n3. 应用于双极性萘二酰亚胺-联噻吩共聚物，模拟重现了输运各向异性及电子迁移率高于空穴的特征，并揭示链间相干对骨架方向高效输运的关键作用，为同类晶态材料的机制解析提供了可迁移的理论路径。", "summary_source": "deepseek", "authors": [{"name": "Nisarg Trivedi"}, {"name": "Maximilian F.X. Dorfner"}, {"name": "Michel Panhans"}, {"name": "Frank Ortmann"}], "featured_authors": [{"name": "Nisarg Trivedi"}, {"name": "Maximilian F.X. Dorfner"}, {"name": "Michel Panhans"}, {"name": "Frank Ortmann"}], "author_count": 4}, {"id": "2608.21698", "category": "cond-mat", "title": "Non-uniform swelling of polyelectrolyte hydrogels: effects of charge regulation", "abstract": "We investigate the impact of charge regulation (CR) on the non-uniform swelling behavior of polyelectrolyte hydrogels. The Poisson-Boltzmann theory with electro-elastic coupling between the local polymer density and elastic deformation is considered. We investigate the spatial distributions of the elastic displacement and polymer density under different salt concentrations and compare charge-regulated gels with fixed-charge (non-CR) gels of the same net charge. Our results show that the CR induces spatially varying charge fractions, which strengthen the electro-elastic response and lead to stronger non-uniform swelling compared with non-CR gels. These findings provide a theoretical basis for understanding and controlling non-uniform swelling in responsive polyelectrolyte hydrogels.", "url": "https://arxiv.org/abs/2608.21698", "type": "理论", "summary": "1. 该工作采用含电-弹耦合的泊松-玻尔兹曼理论，考察电荷调节对聚电解质水凝胶非均匀溶胀行为的影响，并计算不同盐浓度下弹性位移与聚合物密度的空间分布。\n2. 其核心物理在于电荷调节诱导空间非均匀的电荷分数，相比净电荷相同的固定电荷凝胶，这种非均匀电荷分布增强了电-弹响应，使溶胀不均匀性更加显著。\n3. 该结果揭示了电荷调节作为控制非均匀溶胀的关键因素，为响应性聚电解质水凝胶在盐浓度变化下的变形预测与功能调控提供了理论基础。", "summary_source": "deepseek", "authors": [{"name": "Du Chen"}, {"name": "Rudolph Podgornik"}, {"name": "David Andelman"}, {"name": "Xianghong Wang"}, {"name": "Linli He"}, {"name": "Shigeyuki Komura"}, {"name": "Bin Zheng"}], "featured_authors": [{"name": "Du Chen"}, {"name": "Rudolph Podgornik"}, {"name": "David Andelman"}, {"name": "Linli He"}, {"name": "Shigeyuki Komura"}, {"name": "Bin Zheng"}], "author_count": 7}, {"id": "2608.21753", "category": "cond-mat", "title": "High-Efficiency Ising Machine with Time-Dimensional Exchange Coupling", "abstract": "Conventional probabilistic Ising machines often suffer from inefficient exploration of configuration space, while replica-based quantum Monte Carlo methods reduce sampling bottlenecks at the cost of large hardware overhead. Here we propose a time-dimensional exchange coupling (TEC) that replaces spatial replica coupling with a temporal exchange interaction between successive spin configurations of a single p-bit network. This TEC improves sampling efficiency without duplicating replica hardware. At low temperatures, antiferromagnetic TEC expands sampling range; at high temperatures, ferromagnetic TEC stabilizes the optimal state. For MaxCut problems with up to 2000 vertices, TEC significantly accelerates convergence speed. SPICE simulations confirm hardware feasibility. TEC offers a scalable, hardware-efficient strategy to enhance combinatorial optimization on existing Ising machines.", "url": "https://arxiv.org/abs/2608.21753", "type": "数值", "summary": "1. 该工作为解决传统概率Ising机构型空间探索低效及副本复制硬件开销大的问题，提出时间维交换耦合，在单个p-bit网络中令相邻自旋构型进行时序交换。\n2. 其核心卖点在于以时间维交换替代空间副本耦合：低温下反铁磁耦合扩大采样范围，高温下铁磁耦合稳定最优态，从而在不复制硬件的前提下将2000顶点MaxCut问题的收敛速度大幅提升。\n3. 该策略为现有Ising机提供了一条可扩展、硬件高效益的组合优化增强路线，SPICE仿真证实其硬件可行性，对大规模优化求解器设计具有明确启示。", "summary_source": "deepseek", "authors": [{"name": "Zhengyu Du"}, {"name": "Haijie Xu"}, {"name": "Kaiming Cai"}, {"name": "Zhe Yuan"}, {"name": "Yue Zhang"}], "featured_authors": [{"name": "Zhengyu Du"}, {"name": "Haijie Xu"}, {"name": "Kaiming Cai"}, {"name": "Zhe Yuan"}, {"name": "Yue Zhang"}], "author_count": 5}, {"id": "2608.21759", "category": "cond-mat", "title": "Dynamic Magnetic Pair-Density Function of a One-Dimensional Ferromagnet", "abstract": "The dynamic magnetic pair-density function (DymPDF) $D_{\\rm M}(r, E)$ is derived by extending the static magnetic pair distribution function (mPDF) to finite energy transfer. The analytical DymPDF of a one-dimensional Heisenberg ferromagnet is obtained from the magnon dispersion and compared with simulations performed using {\\textsc SpinW}. Excellent agreement is achieved for energy dependence of the nearest-neighbor spin-pair correlation, demonstrating that the DymPDF changes sign at the magnon-mode transition occurring at one-half of the maximum magnon energy. The real-space DymPDF at low energy is also reproduced with a model including finite instrumental resolution, magnetic correlation length, and Fourier-termination effects. These results establish the theoretical foundation of DymPDF analysis for investigating local spin dynamics in magnetic materials.", "url": "https://arxiv.org/abs/2608.21759", "type": "理论+数值", "summary": "1. 该工作把静态磁对分布函数推广到有限能量转移，推导出一维海森堡铁磁体动态磁对分布函数(DymPDF)的解析表达式，并用SpinW模拟加以对比验证。\n2. 其物理卖点在于最近邻自旋对关联的能量依赖在最大磁振子能量一半处出现符号反转，而低能实空间谱的再现还必须计入仪器分辨、有限磁关联长度与傅里叶截断效应。\n3. 这为利用DymPDF分析磁性材料局域自旋动力学提供了理论基础，并可直接指导后续非弹性散射实验的建模与解释。", "summary_source": "deepseek", "authors": [{"name": "Shin-ichi Shamoto"}], "featured_authors": [{"name": "Shin-ichi Shamoto"}], "author_count": 1}, {"id": "2608.21768", "category": "cond-mat", "title": "Breakdown of Aharonov-Bohm cage in Rydberg synthetic lattices: the roles of inhomogeneity and long-range exchange", "abstract": "While the interaction-induced breakdown of Aharonov-Bohm (AB) cage is typically attributed to uniform bound-pair transport, systems with inhomogeneous exchange interactions realized with Rydberg synthetic lattices exhibit more complex dynamics. Employing the evolution-path symmetry (EPS) framework developed recently, we analyze the two-particle dynamics via path interference in Fock space. We find that a homogeneous nearest-neighbor exchange interaction cannot break the AB cage, regardless of whether the long-range exchange interaction is present or not. In contrast, we demonstrate that inhomogeneous nearest-neighbor exchange interaction breaks the destructive-interference EPS, and lifts the degeneracy of many-body compact localized states, thereby generating non-local dispersive eigenstates. Consequently, the initial state gains a non-zero overlap with these dispersive states, enabling delocalized transport. Furthermore, while long-range exchange interaction alone preserves the AB cage, its coupling with nearest-neighbor inhomogeneous exchange interaction opens non-canceling pathways that alter the diffusion profile. Our work connects microscopic path interference with macroscopic spectral reorganization, offering an analytical understanding of the mechanism underlying exchange-interaction-induced transport in Rydberg synthetic lattices.", "url": "https://arxiv.org/abs/2608.21768", "type": "理论", "summary": "1. 该工作采用演化路径对称性框架，解析了里德伯合成晶格中非均匀交换与长程交换共同作用下的阿哈罗诺夫-玻姆笼破坏机制。\n2. 研究发现，均匀最近邻交换无论有无长程交换均保持笼禁，长程交换单独也不破笼；而非均匀最近邻交换破坏相消干涉并提升多体紧致局域态简并，诱导非局域色散态与退局域输运，并与长程交换耦合改变扩散行为。\n3. 这为将微观路径干涉与宏观谱重构联系起来、解析交换诱导输运提供了分析工具，也启示了基于里德伯晶格的输运调控。", "summary_source": "deepseek", "authors": [{"name": "Li Pan"}, {"name": "Xinlu Chen"}, {"name": "Hong Zhang"}, {"name": "Jian-Song Pan"}], "featured_authors": [{"name": "Li Pan"}, {"name": "Xinlu Chen"}, {"name": "Hong Zhang"}, {"name": "Jian-Song Pan"}], "author_count": 4}, {"id": "2608.21781", "category": "cond-mat", "title": "Nonequilibrium statistics of harmonically trapped run-and-tumble particles: An exact convolution approach", "abstract": "We study one-dimensional run-and-tumble particles confined by a harmonic potential and coupled to an equilibrium thermal bath. Exploiting the coupling of active and thermal degrees of freedom through the Ornstein-Uhlenbeck propagator, we show that the position distribution factorizes, as a convolution, into the Ornstein-Uhlenbeck distribution and the distribution of the athermal run-and-tumble problem. This yields closed-form results, correcting expressions from earlier treatments by identifying the Ornstein-Uhlenbeck propagator, rather than the free-diffusion one, as the correct kernel. Results are confirmed both in Fourier space and by direct Langevin simulation. We further focus our analysis on the stationary regime, characterized by two dimensionless parameters--the ratio of trapping to persistence length, and the ratio of thermal to active diffusion--which control the crossover from a non-Gaussian, boundary-peaked distribution to the Gaussian, equilibrium-like limit. Energy fluctuations and the Kullback-Leibler divergence from the equilibrium distribution quantify the resulting non-equilibrium character of the confined active particle.", "url": "https://arxiv.org/abs/2608.21781", "type": "理论+数值", "summary": "1. 该工作用精确卷积方法求解谐波势阱中一维游走-翻滚粒子的非平衡稳态分布。\n2. 其要点在于以Ornstein-Uhlenbeck传播子为核获得闭合解，修正了此前自由扩散核的处理。\n3. 所得两参数相图刻画了从边界峰化非高斯分布到高斯平衡极限的交叉及非平衡强度。", "summary_source": "deepseek", "authors": [{"name": "Francisco J. Sevilla"}, {"name": "Jair A. Meléndez Mora"}], "featured_authors": [{"name": "Francisco J. Sevilla"}, {"name": "Jair A. Meléndez Mora"}], "author_count": 2}, {"id": "2608.21835", "category": "cond-mat", "title": "Monitored free fermions under periodic driving", "abstract": "We investigate analytically and numerically a one-dimensional periodically driven free-fermionic system subjected to monitoring of the local particle density. Based on the analytical approach that describes the long-wavelength physics of the time-dependent Hamiltonian in the field-theoretical language using the nonlinear sigma-model (NLSM), we reveal that driving does not alter the universality class of the problem. As a consequence, the system retains the area-law behavior in the thermodynamic limit, with an intermediate diffusive regime giving rise to logarithmic growth of entanglement entropy for a small monitoring rate. At the same time, driving leads to a renormalization of the bare coupling constant of the NLSM, which controls the space-time ``conductivity'' in the diffusive regime. We derive the analytic form of this renormalization, which becomes particularly strong in the case of a ``maximally symmetric'' drive and sufficiently short driving period. In addition, we employ the Wiener-Hopf method to investigate the ballistic-diffusive crossover. These analytical predictions are corroborated by numerical simulations of the von-Neumann entanglement entropy and the density correlation function. Our numerical results clearly demonstrate that, with an increase in the system size, there are successive crossovers from ballistic to diffusive behavior and ultimately to localization. Furthermore, in the diffusive regime, we observe weak-localization corrections that are in agreement with the analytical predictions of the NLSM. Overall, our results provide a unified analytical and numerical framework for understanding the effects of monitoring in time-modulated fermionic systems, paving a way for broader investigations of driven quantum matter.", "url": "https://arxiv.org/abs/2608.21835", "type": "理论+数值", "summary": "1. 该工作使用非线性sigma模型及数值模拟，研究了一维周期驱动自由费米子在局域密度监测下的纠缠熵与密度关联，覆盖从弹道到扩散再到局域化的全过程。\n2. 其核心结论是驱动不改变面积律普适类，只对控制扩散区时空电导率的裸耦合常数产生可解析表达的重整化，该效应在最大对称驱动和短周期时尤为强烈。\n3. 借助Wiener-Hopf方法刻画弹道-扩散转变并验证弱局域化修正，为时间调制费米系统中监测导致的量子纠缠与输运行为提供了统一理论框架。", "summary_source": "deepseek", "authors": [{"name": "Aditi Chakrabarty"}, {"name": "Alexander D. Mirlin"}, {"name": "Igor Poboiko"}], "featured_authors": [{"name": "Aditi Chakrabarty"}, {"name": "Alexander D. Mirlin"}, {"name": "Igor Poboiko"}], "author_count": 3}, {"id": "2608.21870", "category": "cond-mat", "title": "Pair Filters in an Extended Hubbard Model at Resonance", "abstract": "We investigate the dynamics of bound pairs in an extended Hubbard model at resonance. We show that a single fermion and a singlet bound pair possess identical dispersion relations and scatter off each other. In contrast, a neighboring doublon pair is dynamically pinned in the strong-interaction regime. Remarkably, a single fermion and a singlet bound pair exhibit fundamentally different scattering behaviors when encountering a pinned doublon pair acting as a scattering center. While the singlet bound pair undergoes perfect transmission, the single fermion is completely reflected. These results demonstrate that a neighboring doublon pair functions as an efficient filter that separates bound pairs from single particles. Numerical simulations fully support the analytical predictions. Our findings provide a dynamical mechanism for generating and manipulating bound-pair states.", "url": "https://arxiv.org/abs/2608.21870", "type": "理论+数值", "summary": "1. 该工作研究了共振扩展Hubbard模型中束缚对与单粒子在钉扎双占据对散射中心附近的动力学，并给出解析与数值结果。\n2. 其核心发现是单费米子与单重态束缚对色散相同且彼此散射，但遭遇钉扎双占据对时前者全反射而后者完全透射，从而形成高效配对过滤器。\n3. 这为强关联体系中束缚对态的产生与操控提供了动力学机制，并为量子模拟与相关输运实验提供了清晰指引。", "summary_source": "deepseek", "authors": [{"name": "Ensuo Ma"}, {"name": "Zhi Song"}], "featured_authors": [{"name": "Ensuo Ma"}, {"name": "Zhi Song"}], "author_count": 2}, {"id": "2608.21900", "category": "cond-mat", "title": "Extrinsic nonlinear spin currents in spin-orbit coupled systems: A Boltzmann transport study", "abstract": "We develop a semiclassical Boltzmann framework for second-order extrinsic spin transport in the presence of skew scattering. The conventional relaxation-time approximation reduces the full collision integral to a single phenomenological timescale and thereby neglects the angular structure of impurity scattering. While the transport relaxation time primarily characterizes the leading angular harmonic of the nonequilibrium distribution, nonlinear response is sensitive to its higher angular harmonics, which are governed by distinct components of the collision operator. We therefore retain the angular and band dependence of the scattering kernel and decompose both the collision integral and the distribution function into Fourier harmonics. The resulting coupled algebraic equations allow the symmetric and skew-scattering corrections to the distribution function to be obtained recursively order by order in the electric field. We apply this formalism to the gapped surface states of a topological insulator with spin-dependent impurity scattering and evaluate the corresponding second-order extrinsic spin-current response. Our results show that higher angular harmonics of the nonequilibrium distribution and scattering between distinct constant-energy contours play an essential role in extrinsic nonlinear spin transport beyond the single-relaxation-time approximation.", "url": "https://arxiv.org/abs/2608.21900", "type": "理论+数值", "summary": "1. 该工作建立了一个半经典玻尔兹曼输运框架，研究自旋轨道耦合体系中由斜散射导致的二阶外禀非线性自旋电流响应。\n2. 其核心在于放弃单弛豫时间近似，将碰撞积分与分布函数按角谐波分解并递推求解，从而保留高次角谐波及能带依赖的散射核作用。\n3. 应用于拓扑绝缘体表面态的自旋相关杂质散射表明，高次角谐波与不同等能面间的散射对非线性外禀自旋输运至关重要，为超越弛豫时间近似的输运研究提供了清晰范例。", "summary_source": "deepseek", "authors": [{"name": "Jiwei Tian"}, {"name": "Huaqing Huang"}], "featured_authors": [{"name": "Jiwei Tian"}, {"name": "Huaqing Huang"}], "author_count": 2}, {"id": "2608.21990", "category": "cond-mat", "title": "Beyond second-long trajectory of the Trp-cage peptide generated using a Kinetic Monte Carlo model derived from molecular dynamics", "abstract": "We present a kinetic Monte Carlo (KMC) modeling approach to describe the stochastic dynamics of a peptide molecule spanning nanosecond to second timescales. The dynamics of protein conformational changes is interpreted at a local level in terms of dihedral transitions. Taking Trp-cage miniprotein as an example, the KMC model \"learns\" about the transitions from multiple MD trajectories. Training is based on local divide-and-conquer strategy that identifies the discretized backbone dihedral states as building blocks for the conformational space, along with associated transition rates of dihedral flips to describe the conformational state-to-state dynamics. A key feature in our approach is the incorporation of backbone correlations, such that rates are conditioned on the local environment and steric coupling. We show that with the correlations built-in, the KMC model closely matches MD. Such an approach is shown to reach second timescales in a few CPU hours on a standard desktop computer, and can easily yield multiple stochastic realizations of the conformational dynamics. Our KMC model construction scheme should be generally applicable to a wide range of proteins, and can be used for bridging local flexibility to protein-wide dynamics.", "url": "https://arxiv.org/abs/2608.21990", "type": "理论+数值", "summary": "1. 该工作提出一种从分子动力学轨迹学习的动力学蒙特卡洛模型，以二面角跃迁描述肽链构象随机动力学，并生成超过秒级时长的Trp-cage肽轨迹。\n2. 其核心特色是采用局部化分治策略将骨架二面角态作为构象空间基元，且令跃迁速率依赖于局域环境与位阻耦合，从而在纳入关联后与分子动力学结果定量吻合。\n3. 该方法在普通台式机上仅需数CPU小时即可获取多条秒级随机轨迹，且构建流程对广泛蛋白质适用，为连接局部柔性与全蛋白动力学提供可行桥梁。", "summary_source": "deepseek", "authors": [{"name": "Abhijit Chatterjee"}, {"name": "Rishav Deb"}, {"name": "Gauri Thapa"}, {"name": "Swati Bhattacharya"}], "featured_authors": [{"name": "Abhijit Chatterjee"}, {"name": "Rishav Deb"}, {"name": "Gauri Thapa"}, {"name": "Swati Bhattacharya"}], "author_count": 4}, {"id": "2608.22006", "category": "cond-mat", "title": "Physics-Constrained Neural Flow Maps for Long-Horizon Prediction of Spin Dynamics", "abstract": "Conventional simulation of current-driven magnetization relies on fine-step integration of the spin-transfer-torque Landau--Lifshitz--Gilbert equation, creating a computational bottleneck in parameter sweeps and control searches. In this work, we propose a physics-constrained neural flow map that learns finite-time dynamics directly on the unit sphere. The model maps the current magnetization, spin-torque strength, and requested time span to a future state in a single forward pass. Tangent-space projection and spherical retraction preserve unit magnetization during recursive, composition-consistent rollout. We validate the framework on single-spin trajectories under in-domain torques and previously unseen but stronger drive. Beyond the training horizon, it achieves an in-domain root mean square error of $0.00425$ with norm drift at the $10^{-7}$ level. The flow outperforms an adapted Long Short-Term Memory (LSTM) in in-domain accuracy and geometric stability, although the LSTM retains slightly lower out-of-distribution state error. The resulting geometry-preserving propagator reduces reliance on fine-step integration and enables physically admissible long-horizon prediction.", "url": "https://arxiv.org/abs/2608.22006", "type": "理论+数值", "summary": "1. 该工作提出一种物理约束神经流映射，直接从单位球面上的有限时间动力学预测电流驱动自旋的长期演化。\n2. 其核心是通过切空间投影与球面收缩保持磁矩模长，并利用递归、组合一致的滚动方式以单次前向传播完成多步预测。\n3. 该几何保持传播子有望替代细步积分，为参数扫描与控制搜索提供高效且物理允许的长时程模拟工具。", "summary_source": "deepseek", "authors": [{"name": "Haoen Feng"}, {"name": "Shenglan Yuan"}, {"name": "Shirong Lin"}], "featured_authors": [{"name": "Haoen Feng"}, {"name": "Shenglan Yuan"}, {"name": "Shirong Lin"}], "author_count": 3}, {"id": "2608.22074", "category": "cond-mat", "title": "Cross-Temperature Defect Identification in Atomistic Simulations via Multi-Level Domain Alignment", "abstract": "Identifying atomic defects at elevated temperature is difficult because thermal fluctuations blur the local symmetry that both geometric heuristics and supervised classifiers rely on: trustworthy labels exist in low-temperature reference configurations, while the high-temperature regime where robust analysis matters most is effectively unlabeled. We cast this as a cross-temperature domain-shift problem and align the two domains at three levels: an equivariant denoiser at the input level, cross-temperature contrastive learning at the representation level, and a morphology-aware regularizer that steers predictions toward the compact geometry of physical defect structures. Because no atom-wise truth exists at temperature, we further introduce a label-free evaluation suite that scores predicted defect structures along five spatial and physics-based axes, enabling model assessment and selection without high-temperature labels. Near the melting point, the framework identifies vacancies and self-interstitial atoms across face-centered-cubic, body-centered-cubic, and hexagonal-close-packed iron systems with every interstitial localized and zero false detections in every vacancy system against Wigner-Seitz ground truth, with no high-temperature labels used in training. It sustains this fidelity on a million-atom, 2.5 ns trajectory, resolving single vacancy hops and complete Frenkel-pair recombination, and captures grain-boundary phase transformations in aluminum bicrystals, distinguishing two nucleation modes. Multi-level domain alignment thus offers a practical, label-efficient route to temperature-robust structural analysis of large-scale molecular dynamics.", "url": "https://arxiv.org/abs/2608.22074", "type": "理论+数值", "summary": "1. 该工作提出跨温度域对齐框架，用于高温原子模拟中缺陷的无监督识别。\n2. 其核心是等变降噪、跨温度对比学习及形貌正则化三层次对齐，并辅以无标签评估套件。\n3. 该框架在近熔点时对铁、铝体系实现零误检与缺陷演化捕捉，可推广至大规模分子动力学分析。", "summary_source": "deepseek", "authors": [{"name": "Yating Fang"}, {"name": "Jungmin Kim"}, {"name": "Qian Qian Zhao"}, {"name": "Pallavi Biswas"}, {"name": "Joshua M. Gonjon"}, {"name": "Ryan B. Sills"}, {"name": "Ahmed Aziz Ezzat"}], "featured_authors": [{"name": "Yating Fang"}, {"name": "Jungmin Kim"}, {"name": "Qian Qian Zhao"}, {"name": "Joshua M. Gonjon"}, {"name": "Ryan B. Sills"}, {"name": "Ahmed Aziz Ezzat"}], "author_count": 7}, {"id": "2608.22091", "category": "cond-mat", "title": "Insight into the molecular dynamics of barocaloric molecular crystals using quasi-elastic neutron scattering", "abstract": "Barocaloric (BC) molecular crystals exhibit order-disorder phase transitions that o9er a promising basis for solid-state heating and cooling. However, rational design of these next-generation materials requires microscopic understanding of the molecular dynamics that drive the transitional entropy change. Quasi-elastic neutron scattering (QENS) techniques including inelastic fixed-window scans (IFWSs) enable the direct probing of such molecular motions throughout thermodynamic phase transitions. Here we present a QENS-IFWS global fitting methodology for systematically investigating the molecular dynamics underpinning BC performance in molecular crystals. We demonstrate this methodology on neopentyl glycol (NPG) and three derivatives spanning chemically distinct routes to dynamical perturbation. By fixing attempt frequencies across samples, we observe measurable differences in the relative activation energies and mobile fractions of hydroxymethyl and full-molecular rotations. The largest observed e9ect is on the hydroxymethyl rotation activation energies, which is closely related to hydrogen bond network stability, ranging from -3.6% to +11.1% in the derivatives compared to pure NPG. The capability of this global fitting strategy to extract subtle variations in molecular rotations highlights QENS as a versatile design tool for guiding BC molecular crystal design.", "url": "https://arxiv.org/abs/2608.22091", "type": "理论+数值", "summary": "1. 该工作提出并演示了一种基于准弹性中子散射与非弹性固定窗口扫描数据的全局拟合方法，用于系统研究压热分子晶体中驱动相变熵变的分子转动动力学。\n2. 其核心在于跨样品固定尝试频率，定量比较羟甲基与完整分子旋转的活化能和可动分数，发现羟甲基旋转活化能变化最显著，较纯新戊二醇为-3.6%至+11.1%，并与氢键网络稳定性密切相关。\n3. 这确立了准弹性中子散射作为压热分子晶体理性设计工具的潜力，为通过动态扰动调控固态制冷材料性能提供了可推广的分析途径。", "summary_source": "deepseek", "authors": [{"name": "Frederic Rendell-Bhatti"}, {"name": "David Boldrin"}, {"name": "Markus Appel"}, {"name": "Donald A. MacLaren"}], "featured_authors": [{"name": "Frederic Rendell-Bhatti"}, {"name": "David Boldrin"}, {"name": "Markus Appel"}, {"name": "Donald A. MacLaren"}], "author_count": 4}, {"id": "2608.22121", "category": "cond-mat", "title": "Voltage dynamics of spherical membranes from single ion channel currents", "abstract": "Ion channels and pumps drive ion-selective currents through cell membranes at localized sites, yet a cell's electrical state is routinely summarized by a single transmembrane voltage. Combining theory and numerical simulations, we resolve the spatiotemporal dynamics of charge reorganization driven by a localized current on a spherical membrane vesicle. At early times, the response is insensitive to membrane geometry: as in the case of a flat membrane ( arXiv:2407.11947 ; arXiv:2508.14001 ), the transmembrane voltage decays in a monopolar fashion, varying inversely with distance from the source, and crosses over to a dipolar tail that scales as the inverse cube of distance. Under sustained current, this monopolar response spreads outward from the source. Because the vesicle is closed, this response cannot persist indefinitely; once the monopolar front traverses the entire vesicle, the subsequent charging dynamics is dominated by a spatially uniform mode corresponding to capacitive charging of the membrane. We further decompose the bulk potentials into an electrostatic image-charge component that generates the bulk electric fields and a spatially uniform capacitive mode that can be represented as an equivalent circuit. We also derive a nonlocal cable equation governing the transmembrane voltage dynamics and show that the uniform mode is its long-time solution. This work provides a first-principles basis for the electrophysiological simplification of an electrotonically compact cell.", "url": "https://arxiv.org/abs/2608.22121", "type": "理论+数值", "summary": "1. 该工作结合理论分析与数值模拟，研究了球形膜囊泡上局部离子流驱动的跨膜电压时空动力学。\n2. 其要点在于：早期电压呈与平面膜一致的单极1/r衰减并过渡到偶极1/r^3尾巴；持续电流下，单极前沿扫过闭合囊泡后，充电动力学由空间均匀的电容模式主导，且体电势可分解为镜像电荷与等效电路两部分。\n3. 这为从单通道电流出发推导非局域电缆方程、并为电紧张紧凑细胞的单变量等效电路近似奠定了第一性原理基础。", "summary_source": "deepseek", "authors": [{"name": "Sirui Ning"}, {"name": "Joshua B. Fernandes"}, {"name": "Karthik Shekhar"}, {"name": "Kranthi K. Mandadapu"}], "featured_authors": [{"name": "Sirui Ning"}, {"name": "Joshua B. Fernandes"}, {"name": "Karthik Shekhar"}, {"name": "Kranthi K. Mandadapu"}], "author_count": 4}, {"id": "2608.22136", "category": "cond-mat", "title": "Even-harmonic generation from topological edge states in generalized Su-Schrieffer-Heeger models", "abstract": "High-order harmonic generation (HHG) in solids has emerged as a powerful probe of symmetry and topological properties in quantum materials. In this work, we investigate the HHG response in one-dimensional solids with edge or midgap states under global and local illumination. We numerically compute the HHG spectrum for the Su-Schrieffer-Heeger (SSH) model with next-nearest-opposite sublattice hopping, dubbed the extended SSH (ESSH) model, and the Rice-Mele model, a one-dimensional system with broken inversion symmetry introduced via staggered on-site potentials. By contrasting the spectral features of the ESSH and Rice-Mele models under global illumination, our analysis reveals that although midgap states provide additional pathways for transitions, the resulting interference is destructive, leading to spectral features distinct from those of edge states. Furthermore, when a single boundary of the topological insulator is locally illuminated, the HHG spectrum of the edge states exhibits vanishing odd harmonics, leaving even harmonics dominant in the spectrum. We identify this even-harmonic selection rule as a consequence of the zero-energy character of the edge states and the particle-hole symmetry of the system, which enforces even field parity of the zero-mode response. These findings reveal that the spatial location of the laser illumination offers a route to control the symmetry of the system, thereby selectively suppressing or enhancing even- and odd-order harmonics in low-dimensional nanostructures.", "url": "https://arxiv.org/abs/2608.22136", "type": "理论+数值", "summary": "1. 该工作数值研究一维固体中边缘态与隙间态的高次谐波产生，采用含最近邻相反子格跳跃的扩展SSH模型及带交错势的Rice-Mele模型，并比较全局与局域光照响应。\n2. 结果显示，隙间态虽提供额外跃迁通道但干涉相消；而局域照射单个拓扑边界时，零能边缘态与粒子-空穴对称性迫使响应具有偶场宇称，使奇次谐波消失、偶次谐波占主导。\n3. 这一偶次谐波选择定则表明，改变激光照射的空间位置可等效调控体系对称性，为在低维纳米结构中选择性抑制或增强谐波阶次提供了明确思路。", "summary_source": "deepseek", "authors": [{"name": "Chi-Ting Liu"}, {"name": "J-S You"}, {"name": "Hsiu-Chuan Hsu"}], "featured_authors": [{"name": "Chi-Ting Liu"}, {"name": "J-S You"}, {"name": "Hsiu-Chuan Hsu"}], "author_count": 3}, {"id": "2608.22206", "category": "cond-mat", "title": "Unified Bonding Entropy Model for Kekulé Graphene Nanoflakes", "abstract": "The open-shell character of Kekulé graphene nanoflakes (GNFs) is conventionally rationalized by the gain of Clar aromatic $\\pi$-sextets upon electron unpairing. While this rule successfully explains many quinoidal diradicaloids, it treats only the maximum number of sextets and neglects the multiplicity and spatial distribution of resonance configurations that realize the same Clar count. Here, we identify a second route to open-shell stabilization in which the maximum Clar-sextet number remains unchanged while the number of accessible Clar resonators increases substantially. We term this mechanism \\emph{Clar-number-invariant resonance-space expansion}. By enumerating closed-shell and open-shell Clar resonators and combining this analysis with a bonding entropy model (BEM), we show that electron unpairing can release closed-shell pairing constraints, enlarge the resonance manifold, and redistribute C--C bond occupancies away from localized single- and double-bond limits. The BEM-predicted number and spatial distribution of unpaired electrons correlate strongly with density-functional-theory diradical character, local magnetic moments, optimized C--C bond lengths, and relative energies across a broad set of GNFs. The resulting framework offers a graph-based and physically transparent route for screening open-shell carbon nanostructures and for designing tunable molecular spins without requiring an increase in the maximum Clar number.", "url": "https://arxiv.org/abs/2608.22206", "type": "理论+数值", "summary": "1. 该工作针对Kekulé石墨烯纳米片，提出统一的键合熵模型来刻画电子解配对导致的开壳层稳定化。\n2. 其核心机制是Clar数不变的共振空间膨胀：最大芳香六元环数虽不增加，但闭壳层配对约束被释放，共振结构数目显著增大，C–C键占据数从局域单/双键极限重新分布，且BEM预测与DFT双自由基特征、局域磁矩、键长及相对能量强相关。\n3. 该图论框架可在不提高最大Clar数的条件下预判开壳层特性及未配对电子的数目和空间分布，为筛选开壳层碳纳米结构和设计可调分子自旋提供了物理透明的实用途径。", "summary_source": "deepseek", "authors": [{"name": "Chang-Chun He"}, {"name": "Yu-Jun Zhao"}, {"name": "Xiao-Bao Yang"}], "featured_authors": [{"name": "Chang-Chun He"}, {"name": "Yu-Jun Zhao"}, {"name": "Xiao-Bao Yang"}], "author_count": 3}, {"id": "2608.22239", "category": "cond-mat", "title": "Oxygen stoichiometry directs rutile-anatase phase selection through kinetic control of nucleation", "abstract": "Synthesis of a target polymorph remains more empirical than predictive because crystallization often selects the most accessible nucleation pathway rather than the thermodynamically most stable phase. Here, we show that oxygen stoichiometry converts this empirical synthesis variable into a kinetic control parameter for anatase-rutile selection in TiO$_{2-x}$. Enhanced-sampling simulations reveal that oxygen content alters the nucleation-barrier landscape, switching the relative accessibility of anatase and rutile, even while rutile remains thermodynamically favored. Molecular dynamics simulations show the presence of a diffuse intermediate shell around the nucleus, where oxygen deficiency alters Ti-O coordination and connectivity and drives shell-local motif evolution from anatase-like toward rutile-like environments. A coupled-flux model that integrates barrier competition with shell-mediated attachment/exchange yields a relative nucleation-rate map consistent with reported oxygen-dependent synthesis trends. These results establish stoichiometry-controlled intermediate-shell motif evolution as a kinetic origin of polymorph selection and provide a framework for predicting target phases in composition-coupled crystallization.", "url": "https://arxiv.org/abs/2608.22239", "type": "理论+数值", "summary": "1. 该工作结合增强采样与分子动力学模拟，揭示氧化学计量比通过调控成核动力学而非热力学稳定性来选择TiO2-x的金红石或锐钛矿相。\n2. 其核心在于氧缺位改变成核势垒景观，并在核周围弥散中间壳层内驱动Ti-O配位与局域结构从类锐钛矿向类金红石演化。\n3. 所建立的耦合通量成核率图可解释氧依赖的合成趋势，为成分耦合结晶中目标物相的按需预测提供了动力学框架。", "summary_source": "deepseek", "authors": [{"name": "Han Uk Lee"}, {"name": "Hyeon Woo Kim"}, {"name": "Ji Min Kim"}, {"name": "Dong Won Jeon"}, {"name": "Rohan Mishra"}, {"name": "Sung Beom Cho"}], "featured_authors": [{"name": "Han Uk Lee"}, {"name": "Hyeon Woo Kim"}, {"name": "Ji Min Kim"}, {"name": "Dong Won Jeon"}, {"name": "Rohan Mishra"}, {"name": "Sung Beom Cho"}], "author_count": 6}, {"id": "2608.22256", "category": "cond-mat", "title": "Coordinate transformations and matter waves cloaking", "abstract": "Transformation method provides an efficient tool to control wave propagation inside the materials. Using the coordinate transformation approach, we study invisibility cloaks with sphere, cylinder and ellipsoid structures for electronic waves propagation. The underlying physics behind this investigation is the fact that the Schrödinger equation with position-dependent mass tensor and potentials has a covariant form that follows the coordinate transformation. Using this technique we obtain the exact spatial form of the mass tensor and potentials for a variety of cloaks with different shapes.", "url": "https://arxiv.org/abs/2608.22256", "type": "理论", "summary": "1. 该工作利用坐标变换方法，研究电子物质波在介质中传播时球、圆柱与椭球结构所构成的不可见隐身斗篷。\n2. 其核心在于揭示含位置依赖质量张量与势的薛定谔方程具有随坐标变换而保持的协变形式，由此严格给出不同形状斗篷所需的质量张量与势场的空间分布。\n3. 这一方法为量子尺度下物质波的定向隐身与波前调控提供了精确解析工具，也可为有效质量可调的人工结构与材料设计提供直接启发。", "summary_source": "deepseek", "authors": [{"name": "Reza G. Mohammadi"}, {"name": "Ali G. Moghaddam"}, {"name": "Ramin Mohammadkhani"}], "featured_authors": [{"name": "Reza G. Mohammadi"}, {"name": "Ali G. Moghaddam"}, {"name": "Ramin Mohammadkhani"}], "author_count": 3}, {"id": "2608.22282", "category": "cond-mat", "title": "Machine-learning-guided molecular dynamics simulations of point defect evolution in beta-Ga2O3 during ion implantation and annealing", "abstract": "In beta-gallium oxide (beta-Ga2O3), Ga-ion implantation and annealing induce abundant point defects. To overcome conventional Wigner-Seitz (WS) defect analysis limitations, a defect identification algorithm based on similarity matching and DBSCAN clustering is developed for beta-Ga2O3. It distinguishes lattice atoms from defects at high concentrations and identifies eight Ga interstitial configurations (Gaia to Gaih). Comparing SRIM and MD data highlights electronic stopping effects: neglecting them overestimates ion range and defect concentration. Across five fluences (1 to 5 x 10^14 cm-2), 1373 K is the optimal recovery temperature. Multiscale analyses using hydrostatic stress, PRDF, and defect concentration reveal defect evolution. Ga interstitials (Gai) occupy tetrahedral and octahedral sites, driving a defect-mediated phase transition from beta- to gamma-Ga2O3. Increasing fluences reduce beta-phase recovery and increase gamma-phase transformation irreversibly. Oxygen interstitial (Oi) migration is sensitive to annealing temperature, which enhances O-sublattice recrystallization.", "url": "https://arxiv.org/abs/2608.22282", "type": "理论+数值", "summary": "1. 该工作采用机器学习引导的分子动力学模拟，刻画β-Ga2O3在离子注入与退火中各类点缺陷的演化行为。\n2. 核心卖点是针对β-Ga2O3建立基于相似性匹配与DBSCAN聚类的缺陷识别算法，在高浓度下区分晶格原子并鉴别八种Ga间隙构型，还发现忽略电子阻止会高估离子射程与缺陷浓度，并确定1373 K为最佳恢复温度。\n3. 多尺度分析显示Ga间隙占据四面体与八面体位点驱动β→γ相变，注入通量增加使相变不可逆，而O间隙迁移显著影响氧亚晶格再结晶，为辐照退火工艺与相稳定性设计提供参考。", "summary_source": "deepseek", "authors": [{"name": "Huawen Li"}, {"name": "Mengzhi Yan"}, {"name": "Zongwei Xu"}, {"name": "Junlei Zhao"}, {"name": "Jiale Wang"}], "featured_authors": [{"name": "Huawen Li"}, {"name": "Mengzhi Yan"}, {"name": "Zongwei Xu"}, {"name": "Junlei Zhao"}, {"name": "Jiale Wang"}], "author_count": 5}, {"id": "2608.22400", "category": "cond-mat", "title": "Diagnosing and narrowing the simulation-to-real gap in powder X-ray diffraction with a wet-dry agentic loop", "abstract": "Powder X-ray diffraction (PXRD) is the routine probe of crystalline matter, yet its analysis is the rate-limiting step as laboratories automate acquisition. Deep-learning analyzers excel on simulated patterns and degrade on measured ones. This simulation-to-real gap is structural, not additive: synthetic denoising gives no measurable lift on real spectra, whereas correcting a small peak-position drift more than doubles median retrieval correlation. Real-spectrum fine-tuning, peak-aligned reranking, and recalibration narrow what remains and restore the coverage synthetic anchors lose. Xtalyst integrates these in an agent-orchestrated system spanning phase identification, refinement, and calibrated property prediction. On a frozen held-out partition (n=534) each module measured on both splits reproduces its development finding -- including the synthetic-anchor under-coverage, whose magnitude differs between the two pools -- while held-out refinement converges and preserves symmetry without reaching profile-quality fits, and on a diffractometer its wet-dry recommend-rescan-reanalyze loop flips a blinded silicon standard to a gated PASS and changes which minor phase is resolved on a multi-metal alloy.", "url": "https://arxiv.org/abs/2608.22400", "type": "理论+数值", "summary": "1. 该工作针对粉末X射线衍射深度分析中的仿真到实测差距，提出集成相位识别、精修与性质预测的智能体系统Xtalyst，并用湿-干推荐-重扫-再分析闭环加以诊断与收窄。\n2. 其核心发现是差距主要源于峰位漂移而非加性噪声，校正小峰位漂移可使中位检索相关翻倍以上，配合实测微调与峰对齐重排可恢复合成锚点丢失的覆盖。\n3. 在冻结留出集与真实衍射仪上复现各模块结论，湿-干闭环可将盲测硅标准转为条件通过并改变多金属合金中次生相的判定，为自动衍射分析提供可检验范式。", "summary_source": "deepseek", "authors": [{"name": "Shaoguang Wang"}, {"name": "Weiyu Guo"}, {"name": "Ben Fei"}, {"name": "Xiaohong Shao"}, {"name": "Zhihui Wang"}, {"name": "Wanli Ouyang"}], "featured_authors": [{"name": "Shaoguang Wang"}, {"name": "Weiyu Guo"}, {"name": "Ben Fei"}, {"name": "Xiaohong Shao"}, {"name": "Zhihui Wang"}, {"name": "Wanli Ouyang"}], "author_count": 6}, {"id": "2608.22441", "category": "cond-mat", "title": "Flexo-Strain Engineering of Phonons and Ferrons in Thin Films of Van der Waals Ferrielectrics", "abstract": "The influence of the flexoelectric coupling on the fluctuations of electric polarization and elastic strains can lead to the principal changes of the dispersion law of soft optical and acoustic phonons and ferrons in a bulk van der Waals ferrielectrics. Since the size, gradient and strain effects determine phase diagrams and polarization behavior in thin films, it is reasonable to assume that the flexocoupling and mismatch strains should have a strong influence on the dispersion of phonons and ferrons in thin films of van der Waals ferroelectrics. Using the Landau-Ginzburg-Devonshire approach, in this work we reveal that the dispersion of soft phonons and ferrons is strongly dependent on the sign and magnitude of elastic strains, which originate from the lattice constants mismatch in thin strained films of van der Waals ferrielectric CuInP2S6. In particular, the frequency of acoustic phonons and ferrons tends to zero at nonzero wavevectors k>k_cr, where the critical value of the wavevector k_cr is determined by the mismatch strain, flexoelectric coupling strength and temperature. Zeroing of the acoustic phonon frequency, that appears with increase of tensile strains, indicates a possible emergence of a spatially modulated incommensurate polar phase induced by the flexo-strain effects. Analytical results, derived in this work, open the way for flexo-strain engineering of soft phonon and ferron dispersion in thin films of van der Waals ferrielectrics.", "url": "https://arxiv.org/abs/2608.22441", "type": "理论+数值", "summary": "1. 该工作基于Landau-Ginzburg-Devonshire方法，研究范德瓦尔斯铁电薄膜CuInP2S6中挠曲电耦合与晶格失配应变对软声子和ferron色散的联合影响。\n2. 其核心发现在于，拉伸失配应变可使声学声子与ferron频率在有限波矢k>k_cr处趋于零，且临界波矢由失配应变、挠曲电耦合强度及温度共同决定，预示挠曲-应变诱导的非公度极化相的出现。\n3. 该解析结果为实现范德瓦尔斯铁电薄膜中软声子与ferron色散的挠曲-应变工程提供了直接途径，并为相关相变与物性调控研究提供了明确启发与方向。", "summary_source": "deepseek", "authors": [{"name": "Anna N. Morozovska"}, {"name": "Eugene A. Eliseev"}, {"name": "Yujie Zhu"}, {"name": "Mykola Yelisieiev"}, {"name": "Hanna V. Shevliakova"}, {"name": "Yulian M. Vysochanskii"}, {"name": "Venkatraman Gopalan"}, {"name": "Long-Qing Chen"}, {"name": "Jia-Mian Hu"}], "featured_authors": [{"name": "Anna N. Morozovska"}, {"name": "Eugene A. Eliseev"}, {"name": "Yujie Zhu"}, {"name": "Venkatraman Gopalan"}, {"name": "Long-Qing Chen"}, {"name": "Jia-Mian Hu"}], "author_count": 9}, {"id": "2608.22489", "category": "cond-mat", "title": "Time reversal of complex evolution on a quantum computer", "abstract": "The Boltzmann-Loschmidt dispute in 1876-1877 discussed the problem of time reversal of ther- malization from time reversible classical equations of motion. Here, 150 years later, we highlight this problem in the frame of quantum computing. A quantum protocol is proposed that allows to perform a time reversal of complex evolution in the regime of many-body quantum chaos with many qubits. The system represents an evolution of qubits on a square lattice with inter-qubit next-nearest static couplings with a driven pulsed magnetic field. The system entropy grows rapidly to maximal values but returns to initial small values after time reversal. This time reversal is shown to be stable with respect to quantum gate imperfections. However, similar to the Lorenz butterfly effect, there is the butterfly effect of qubit when inversion of only one qubit breaks time reversibility of the whole system. It is argued that this protocol is accessible to nowadays quantum computers and annealers with hundreds of qubits.", "url": "https://arxiv.org/abs/2608.22489", "type": "理论", "summary": "1. 该工作提出一种可在量子计算机上实现的多体量子混沌复杂演化时间反演协议，将玻尔兹曼-洛施密特争议引入当前量子计算框架。\n2. 其卖点在于方晶格量子比特含近邻与次近邻耦合及脉冲磁场驱动，系统熵快速增至最大后经时间反演恢复初始小值，并对量子门误差具有稳定性，但单比特翻转可破坏整体可逆性。\n3. 该协议为当今数百量子比特的量子计算机与退火器验证时间反演及多体热化动力学提供了可行途径，并揭示量子蝴蝶效应对可逆性边界的限制。", "summary_source": "deepseek", "authors": [{"name": "Mahdi Kourehpaz"}, {"name": "Dima L. Shepelyansky"}], "featured_authors": [{"name": "Mahdi Kourehpaz"}, {"name": "Dima L. Shepelyansky"}], "author_count": 2}, {"id": "2608.22517", "category": "cond-mat", "title": "Anomalous dynamical energy flows via nonlinear phononics in spin-Peierls chains", "abstract": "We investigate the nonequilibrium spin-phonon dynamics and energy cascades in a strongly dimerized spin-Peierls chain using a multi-tiered nonlinear phononics architecture. To bypass linear selection rules prohibiting the direct excitation of the Raman-active dimerization mode, a terahertz laser drives an infrared mode that nonlinearly couples to the Raman lattice displacement, subsequently modulating the magnetic exchange. Employing a bond-operator formalism with a second-order cumulant expansion of the Lindblad master equation, we show that maximum energy transfer into the magnetic sector is governed by a dynamical impedance-matching condition rather than the unperturbed triplon density of states. We find that the sustained energy input of continuous-wave driving builds high excitation densities that severely back-act on the lattice, overdamping the primary phonon and smearing magnetic features via power broadening. Conversely, the small time-integrated energy of a pulse keeps the response perturbative, terminating before back-action accumulates and preserving sharp Fano-like quantum interferences. These insights establish limits for controlling dynamic magnetic states without quenching the driving lattice modes.", "url": "https://arxiv.org/abs/2608.22517", "type": "理论", "summary": "1. 该工作运用键算符形式与Lindblad主方程二阶累积展开，研究强二聚化自旋-派尔斯链中太赫兹红外驱动经非线性声子学激发拉曼晶格模、进而调控磁交换的非平衡自旋-声子动力学与能量级联。\n2. 其核心发现是磁扇区最大能量转移由动态阻抗匹配条件决定，而非无扰三子态密度；连续波驱动导致持续反作用于晶格并过阻尼主声子，脉冲驱动则维持微扰并保留尖锐的Fano型量子干涉。\n3. 这为在不淬灭驱动晶格模的前提下调控动态磁态确立了边界，并为非线性声子学驱动的实验方案设计提供了明确指导。", "summary_source": "deepseek", "authors": [{"name": "Jakob Dolgner"}, {"name": "Dirk Manske"}, {"name": "James K. Freericks"}, {"name": "Mohsen Yarmohammadi"}], "featured_authors": [{"name": "Jakob Dolgner"}, {"name": "Dirk Manske"}, {"name": "James K. Freericks"}, {"name": "Mohsen Yarmohammadi"}], "author_count": 4}, {"id": "2608.22567", "category": "cond-mat", "title": "Shapes, forces, and torques of compressed elastic fluid interfaces: beyond axisymmetric configurations", "abstract": "Inspired by the classical Plateau-Douglas problem for soap films bounded by two closed curves, we solve an analogous problem for fluid interfaces with fixed surface area and resistance to out-of-plane bending. The boundaries are planar but need not be symmetric or concentric. The equilibrium surfaces minimize the Willmore bending energy and generalize minimal surfaces such as the catenoid while also exhibiting characteristic features of confined elastic interfaces such as buckling. We systematically classify all possible buckling modes and solution branches by performing a weakly nonlinear analysis and developing a fully nonlinear spectral solver. Our mathematical framework provides insight into the forces and torques required to stabilize cellular membranes and other soft materials and shows that physically relevant asymmetric states can arise even in symmetric systems.", "url": "https://arxiv.org/abs/2608.22567", "type": "理论+数值", "summary": "1. 该工作将Plateau-Douglas问题推广至具有固定面积与抗弯曲刚度的流体界面，求解平面非对称边界下的平衡构型。\n2. 其核心在于结合弱非线性分析与全非线性谱方法，系统分类屈曲模式和解分支，并阐明对称系统中非对称态的力与力矩条件。\n3. 这为理解细胞膜等受限软物质界面的稳定机制，以及设计可控形貌的弹性界面系统提供了理论工具。", "summary_source": "deepseek", "authors": [{"name": "Xinyi Liu"}, {"name": "Neelesh A. Patankar"}, {"name": "Leroy L. Jia"}], "featured_authors": [{"name": "Xinyi Liu"}, {"name": "Neelesh A. Patankar"}, {"name": "Leroy L. Jia"}], "author_count": 3}, {"id": "2608.22831", "category": "cond-mat", "title": "Antidot superlattices in two-dimensional topological insulators", "abstract": "We investigate the electronic properties of a two-dimensional topological insulator patterned with an array of circular holes. The band structures of the topological insulator superlattices are calculated using the Bernevig-Hughes-Zhang model, discretized with the finite element method. The band topology is studied using the Fukui-Hatsugai-Suzuki method, exploiting the fact that topological charge is conserved when a band gap closes and reopens. We find that when the holes are close to each other and the edge states overlap significantly, the material loses its topological character and becomes a trivial insulator. The results show that patterning topological insulators changes their properties, and this can be achieved with a feature size compatible with current lithographic techniques. This shows the potential to incorporate patterned topological insulators in future electronics.", "url": "https://arxiv.org/abs/2608.22831", "type": "理论", "summary": "1. 该工作基于Bernevig-Hughes-Zhang模型与有限元离散，系统计算了二维拓扑绝缘体周期排列圆形孔洞构成的反点阵超晶格的能带结构。\n2. 其主要技术亮点是借助Fukui-Hatsugai-Suzuki方法，依据带隙闭合再打开时的拓扑荷守恒判定拓扑性质，发现孔洞间距缩小致使边缘态重叠时体系丧失拓扑特性而成为平庸绝缘体。\n3. 这显示采用现有光刻工艺的特征尺寸即可通过图形化调控拓扑绝缘体的物性，为将图案化拓扑绝缘体集成于未来电子学器件提供了具体可行的途径。", "summary_source": "deepseek", "authors": [{"name": "Haolin Huang"}, {"name": "Jackson S. Smith"}, {"name": "Fabio Taddei"}, {"name": "Michele Governale"}, {"name": "Jared H. Cole"}], "featured_authors": [{"name": "Haolin Huang"}, {"name": "Jackson S. Smith"}, {"name": "Fabio Taddei"}, {"name": "Michele Governale"}, {"name": "Jared H. Cole"}], "author_count": 5}, {"id": "2608.22867", "category": "cond-mat", "title": "Note on Boltzmann's H-Theorem and Detailed Balance Dynamics", "abstract": "The Boltzmann H-theorem states that entropy of an ensemble of thermodynamic states increases until all states become equally probable. The evolution randomly picks one of the states in the ensemble and brings every other state to have the same probability as the selected state. Different realizations of evolution yield a distribution of selected states. We study this distribution numerically and discuss its relevance for equilibrium fluctuations in thermal as well as non thermal systems.", "url": "https://arxiv.org/abs/2608.22867", "type": "数值", "summary": "1. 该工作针对玻尔兹曼H定理所描述的系综演化，在细致平衡动力学框架下数值研究了每次随机选中一个状态后其余状态趋于等概率所形成的一系列被选态分布。\n2. 其主要物理与技术卖点在于通过大量独立演化实现统计被选态的涨落，并与热平衡及非热平衡系统的平衡涨落行为建立联系。\n3. 这为理解热力学熵增过程在有限时间与有限尺度下的统计性质提供了数值证据，也为进一步探讨H定理在远离平衡体系中的适用范围给出了明确方向。", "summary_source": "deepseek", "authors": [{"name": "Prabodh Shukla"}], "featured_authors": [{"name": "Prabodh Shukla"}], "author_count": 1}, {"id": "2608.22875", "category": "cond-mat", "title": "Fidelity susceptibility of Su-Schrieffer-Heeger model with further neighbour hopping term", "abstract": "In this study, topological phase transition in Su-Schrieffer-Heeger (SSH) model with a further neighbour hopping term has been studied in terms of fidelity susceptibility. Topological phase transition point in the standard SSH model has been identified before by noting the divergence of fidelity susceptibility. The same approach has been employed here where fidelity susceptibility is found to diverge at the phase transition points. Additionally, effect of staggered potential on the fidelity susceptibility has been explored. Analytic expression for fidelity susceptibility has been obtained along with its numerical estimation on finite chains by exact diagonalization. Fidelity susceptibility exhibits sharp peaks at the phase transition points in both approaches. Scaling exponent of this divergence has been obtained numerically which is found to agree to that of the standard SSH model without further neighbour terms.", "url": "https://arxiv.org/abs/2608.22875", "type": "理论+数值", "summary": "1. 该工作通过保真度磁化率研究含次近邻跳跃项的Su-Schrieffer-Heeger模型的拓扑相变。\n2. 解析推导了保真度磁化率并用精确对角化验证其在相变点发散，标度指数与标准SSH模型一致。\n3. 该结果将保真度磁化率推广至含次近邻跳跃体系，为实验探测拓扑临界提供不依赖序参量的标度工具。", "summary_source": "deepseek", "authors": [{"name": "Surajit Mandal"}, {"name": "Asim Kumar Ghosh"}], "featured_authors": [{"name": "Surajit Mandal"}, {"name": "Asim Kumar Ghosh"}], "author_count": 2}, {"id": "2608.22878", "category": "cond-mat", "title": "Spontaneous currents determine capillary rise in active matter", "abstract": "The capillary rise of simple passive fluids in a tube is controlled by the force balance between surface tension and gravity --Jurin's law of capillary action. For fluids composed of active particles interacting via pairwise forces, mechanical surface tension is negative, but a capillary rise was nevertheless reported and remains unexplained. We establish the active form of Jurin's law from the microscopic dynamics. It includes a drag emerging from particle currents that we find responsible for capillary rise. These active currents, alongside negative surface tension, lead to complex and counterintuitive capillary action phenomena that are impossible in equilibrium. In particular the capillary rise of active fluids depends on the shape of the tube, not solely on the tube diameter.", "url": "https://arxiv.org/abs/2608.22878", "type": "理论", "summary": "1. 该工作从活性粒子的微观动力学出发，建立了活性流体毛细上升的修正Jurin定律，定量解释了机械表面张力为负却仍可上升的活性粒子体系行为。\n2. 其要点在于识别出上升由活性粒子自发电流产生的有效曳力决定，该电流与负表面张力耦合，产生偏离平衡态且不可由管径唯一刻画的复杂毛细现象。\n3. 这一活性Jurin定律表明毛细上升依赖于管截面形状而非仅直径，为活性流驱动的微流控输运与非平衡界面动力学研究提供了理论框架。", "summary_source": "deepseek", "authors": [{"name": "Xinyi Dong"}, {"name": "Yongfeng Zhao"}], "featured_authors": [{"name": "Xinyi Dong"}, {"name": "Yongfeng Zhao"}], "author_count": 2}, {"id": "2608.22902", "category": "cond-mat", "title": "Revised symmetry rule and intrinsically time-reversal symmetry breaking pairing in multi-orbital superconductors", "abstract": "We investigate the basic symmetry rule for the particle permutation in superconducting (SC) pairing states by examining the numerical solution of the linearized Eliashberg equation for Sr$_2$RuO$_4$. We find that the general multi-band, frequency-dependent SC gap function does not simply transform to itself up to the minus sign with either orbital ($\\hat{O}$) or frequency ($\\hat{T}$) exchange between two pairing electrons, contradicting the common assumption which has been used without verification. It originates from the fact that paring interactions are not invariant under the $\\hat{O}$ or $\\hat{T}$ operation, and is demonstrated to be essential to correctly interpret and understand multi-band SC states. One of unique properties implied by our newly found symmetry rule is the possibility of the complex eigenvalue in the linearized gap equation where the corresponding gap functions $\\Delta$ always have real and imaginary components both non-zero in real frequencies, inherently breaking the time-reversal symmetry. Our numerical results suggest the possibility of this unique pairing in a real material, Sr$_2$RuO$_4$, for which the Hundness of the material is found to play a key role. The revised symmetry rule not only leads us to more comprehensive understanding of the known SC states, but also opens new possibilities into exotic and unique states.", "url": "https://arxiv.org/abs/2608.22902", "type": "理论+数值", "summary": "1. 该工作通过数值求解Sr2RuO4的线性化Eliashberg方程，重新考察了多轨道超导配对态中粒子交换的基本对称规则。\n2. 其核心发现在于多带且频率依赖的间隙函数在轨道或频率交换下不再简单变为自身反号，由此可产生复本征值，对应实频下实部与虚部均非零、内禀破坏时间反演对称的配对态。\n3. 这为理解已知超导态提供了更完整框架，并暗示Hund耦合等材料特性可诱发此类非常规配对，拓展了多轨道超导体中新奇态的可能空间。", "summary_source": "deepseek", "authors": [{"name": "Chang-Youn Moon"}], "featured_authors": [{"name": "Chang-Youn Moon"}], "author_count": 1}, {"id": "2608.22934", "category": "cond-mat", "title": "Coarse-grained kinetic scale tightens thermodynamic spectral bounds of Markov cycles", "abstract": "Thermodynamic bounds on the spectrum of a Markov cycle depend on the cycle affinity and maximum escape rate, but they ignore how the local transition rates are distributed around the cycle. In this work, we show that a single additional cycle-wide kinetic quantity, the geometric means of forward and backward rates, yields a strictly stronger bound for every nonuniform cycle. By comparing each winding sector of the eigenmode with a product-matched uniform cycle, we bound oscillation frequencies, tighten the admissible spectral region, and show that only uniform cycles can saturate the Uhl-Seifert boundary. Our results show that retaining a coarse-grained kinetic scale can sharpen thermodynamic spectral bounds without requiring knowledge of the full generator. Our method also provides a complex-analytic framework which unifies generator-specific kinetic information with established affinity-winding bounds.", "url": "https://arxiv.org/abs/2608.22934", "type": "理论", "summary": "1. 该工作证明，在马尔可夫循环的谱热力学界中引入一个跨循环的粗粒化动力学量——正向与反向转移速率的几何平均——即可使每类非均匀循环获得严格强于传统亲和力与最大逃逸率所给边界的约束。\n2. 其技术要点是将本征模的每个绕数扇区与积匹配的均匀循环进行比较，从而收紧可允许谱区域并压缩振荡频率，同时证明只有均匀循环才能饱和Uhl-Seifert边界。\n3. 该方法以复分析框架统一生成元局域动力学信息与既有亲和-绕数不等式，且无需完整转移矩阵，可为有限态随机网络的动力学普适界研究提供更精细的工具。", "summary_source": "deepseek", "authors": [{"name": "Rongxing Xu"}, {"name": "Cuiling Meng"}], "featured_authors": [{"name": "Rongxing Xu"}, {"name": "Cuiling Meng"}], "author_count": 2}, {"id": "2608.23003", "category": "cond-mat", "title": "Displacement-field-driven reconstruction of low energy transport in few-layer PtSe2", "abstract": "In layered semiconductors, a perpendicular displacement field generates an interlayer potential difference that competes with interlayer hybridization, modifying both the band gap and the finite-density electronic states that carry current. Resolving this interplay requires a material lying close to the semiconductor-to-semimetal transition, where moderate electric fields can strongly reshape the low-energy electronic structure. Here, we investigate displacement-field-driven transport in dual-gated semiconducting PtSe2, whose pronounced thickness-dependent electronic structure provides access to this low-band-gap regime. Unlike thinner layers, the displacement-field response is strong in six-layer PtSe2, which lies at the verge of the semiconductor-to-semimetal crossover with only a small residual transport gap. Even weak displacement fields rapidly suppress this residual gap near charge neutrality, driving the system toward a band-overlap regime. At the same time, the conductivity decreases in the heavily hole-doped regime, demonstrating that the displacement field modifies not only the gap but also the conducting valence-band states. Fixed-relaxation-time Wannier transport calculations reproduce both responses, showing that they originate from field-induced band overlap together with reconstruction of the valence-band dispersion. These results establish finite-density transport as a sensitive probe of displacement-field-driven electronic structure reconstruction and extend electrical control beyond conventional band-gap engineering.", "url": "https://arxiv.org/abs/2608.23003", "type": "理论+数值", "summary": "1. 该工作实验研究了位移场对六层PtSe2低能输运的重构，该体系处于半导体—半金属转变边缘且残余输运隙很小。\n2. 其核心发现是弱位移场即会抑制残余隙并诱导能带交叠，同时重构价带色散导致重空穴掺杂区电导下降，固定弛豫时间Wannier输运计算定量复现了这两类响应。\n3. 这确立了有限密度输运作为位移场驱动电子结构重构敏感探针的可行性，并将电学调控拓展至传统能隙工程之外。", "summary_source": "deepseek", "authors": [{"name": "Xiao Liu"}, {"name": "Yaroslav Zhumagulov"}, {"name": "Yuang Jie"}, {"name": "Ahmet Enes Bozcali"}, {"name": "Johan Felisaz"}, {"name": "Qi Zhang"}, {"name": "Oldvrich Cicvarek"}, {"name": "Kenji Watanabe"}, {"name": "Takashi Taniguchi"}, {"name": "Zdeněk Sofer"}, {"name": "Oleg V. Yazyev"}, {"name": "Ahmet Avsar"}], "featured_authors": [{"name": "Xiao Liu"}, {"name": "Yaroslav Zhumagulov"}, {"name": "Yuang Jie"}, {"name": "Zdeněk Sofer"}, {"name": "Oleg V. Yazyev"}, {"name": "Ahmet Avsar"}], "author_count": 12}, {"id": "2608.23080", "category": "cond-mat", "title": "X-ray driven displacive excitation of coherent phonons", "abstract": "Modulating electron-phonon coupling offers a route to control structural displacements and tune material functionality. Valence-to-conduction band transitions, however, provide limited leverage over the driving force. Here, we demonstrate coherent lattice dynamics in trigonal tellurium using free-electron laser pulses tuned to the Te N4,5-edge. Over a broad fluence range, the oscillation amplitude obeys the displacive excitation of coherent phonons framework, extended to core resonanc
