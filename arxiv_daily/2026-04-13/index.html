  <title>arXiv 2026-04-13 · Daily ArXiv Selection</title>
  <style>
    :root {
      --bg: #f6f1e8;
      --panel: rgba(255, 252, 246, 0.92);
      --text: #2d241d;
      --muted: #6d5d50;
      --line: rgba(69, 49, 32, 0.14);
      --accent: #8f3d2e;
      --accent-2: #1d5f6b;
      --theory: #7c3a2a;
      --numeric: #255b6a;
      --both: #5d4a99;
      --experimental: #2f6b39;
      --shadow: 0 18px 40px rgba(54, 32, 16, 0.12);
      --radius: 22px;
      --ui-font: "Aptos", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --title-font: "Palatino Linotype", "Noto Serif SC", Georgia, serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--ui-font);
      color: var(--text);
      background: radial-gradient(circle at top left, rgba(255,255,255,0.78), transparent 32%), radial-gradient(circle at 88% 12%, rgba(29,95,107,0.14), transparent 20%), linear-gradient(180deg, #fbf7f0 0%, var(--bg) 42%, #f2e8dc 100%);
      min-height: 100vh;
    }
    .shell { width: min(1220px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 64px; }
    .hero {
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(255,255,255,0.84), rgba(255,248,238,0.72)), linear-gradient(135deg, rgba(143,61,46,0.08), rgba(29,95,107,0.08));
      box-shadow: var(--shadow);
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.82); border: 1px solid var(--line); color: var(--muted); font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase;
    }
    h1 { margin: 18px 0 10px; font-family: var(--title-font); font-size: clamp(32px, 5vw, 54px); line-height: 1.04; letter-spacing: -0.03em; }
    .hero p { max-width: 880px; color: var(--muted); font-size: 16px; line-height: 1.7; margin: 0; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-top: 26px; }
    .stat { padding: 16px 18px; background: rgba(255,255,255,0.76); border: 1px solid var(--line); border-radius: 18px; }
    .stat .label { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
    .stat .value { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
    .controls { position: sticky; top: 12px; z-index: 3; margin-top: 22px; padding: 18px; border: 1px solid var(--line); border-radius: 24px; background: rgba(250,244,236,0.9); backdrop-filter: blur(16px); box-shadow: 0 10px 24px rgba(54,32,16,0.08); }
    .control-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 16px; }
    .field { display: flex; flex-direction: column; gap: 10px; }
    .field label { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
    .search { width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line); background: rgba(255,255,255,0.92); font: inherit; color: var(--text); }
    .chip-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .chip { border: 1px solid var(--line); background: rgba(255,255,255,0.82); color: var(--text); padding: 10px 14px; border-radius: 999px; font: inherit; cursor: pointer; }
    .chip.active { border-color: rgba(143,61,46,0.35); background: rgba(143,61,46,0.12); color: #5b2419; }
    .chip[data-type="数值"].active { border-color: rgba(37,91,106,0.35); background: rgba(37,91,106,0.12); color: #173f49; }
    .chip[data-type="理论+数值"].active { border-color: rgba(93,74,153,0.35); background: rgba(93,74,153,0.12); color: #46337d; }
    .chip[data-type="实验"].active { border-color: rgba(47,107,57,0.35); background: rgba(47,107,57,0.12); color: #214c29; }
    .meta-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 14px; color: var(--muted); font-size: 14px; }
    .paper-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 18px; margin-top: 22px; }
    .paper { display: flex; flex-direction: column; gap: 14px; padding: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 10px 24px rgba(54,32,16,0.06); }
    .paper-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .tag { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid transparent; }
    .tag.category { background: rgba(45,36,29,0.08); color: var(--text); }
    .tag.type-theory { background: rgba(124,58,42,0.1); color: var(--theory); border-color: rgba(124,58,42,0.16); }
    .tag.type-numeric { background: rgba(37,91,106,0.1); color: var(--numeric); border-color: rgba(37,91,106,0.16); }
    .tag.type-both { background: rgba(93,74,153,0.1); color: var(--both); border-color: rgba(93,74,153,0.16); }
    .tag.type-experimental { background: rgba(47,107,57,0.1); color: var(--experimental); border-color: rgba(47,107,57,0.16); }
    .paper h2 { margin: 0; font-family: var(--title-font); font-size: 22px; line-height: 1.25; letter-spacing: -0.02em; }
    .paper h2 a { color: inherit; text-decoration: none; }
    .paper h2 a:hover { color: var(--accent); }
    .paper .id { color: var(--muted); font-size: 13px; }
    .author-block { display: grid; gap: 10px; padding: 14px 16px; border-radius: 18px; background: rgba(255,255,255,0.64); border: 1px solid var(--line); }
    .author-label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .author-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .author-item { display: grid; gap: 4px; }
    .author-item strong { font-size: 14px; }
    .author-item span { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .author-note { color: var(--muted); font-size: 12px; }
    .paper .summary { margin: 0; font-size: 15px; line-height: 1.75; white-space: pre-line; }
    details { border-top: 1px solid var(--line); padding-top: 12px; }
    details summary { cursor: pointer; color: var(--accent-2); font-weight: 700; list-style: none; }
    details summary::-webkit-details-marker { display: none; }
    details p { margin: 10px 0 0; color: var(--muted); line-height: 1.72; font-size: 14px; white-space: pre-line; }
    .paper footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 6px; color: var(--muted); font-size: 13px; }
    .paper footer a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .empty { display: none; margin-top: 24px; padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 22px; background: rgba(255,255,255,0.7); }
    @media (max-width: 980px) { .control-grid { grid-template-columns: 1fr; } .controls { position: static; } }
  </style>

  <script>
    const papers = [{"id": "2604.08635", "category": "cond-mat", "title": "Floquet Engineering of a Quasiequilibrium Superradiant Phase Transition in Landau Polaritons", "abstract": "Superradiant phase transitions (SRPTs), characterized by photon condensation and macroscopic matter polarization, are forbidden in equilibrium for homogeneous fields by no-go theorems. Here, we show that Floquet driving can circumvent this constraint in a Landau polariton system consisting of a two-dimensional electron gas coupled to a terahertz cavity in a DC magnetic field. An off-resonant AC magnetic field modulates the cyclotron frequency and light--matter coupling strength while leaving the diamagnetic term unchanged, generating an additional DC coupling contribution. This drives the system across a critical threshold into a superradiant phase, characterized by photon condensation and Landau-level polarization in the ground state of the Floquet Hamiltonian. This quasiequilibrium approach offers a route to SRPTs distinct from driven-dissipative schemes.", "url": "https://arxiv.org/abs/2604.08635", "type": "理论", "summary": "1. 该研究在直流磁场下的二维电子气与太赫兹腔耦合的Landau极化激元系统中，通过Floquet驱动实现了准平衡超辐射相变。\n2. 其关键机制在于利用非共振交流磁场调制回旋频率与光-物质耦合强度，同时保持抗磁项不变，从而产生额外的直流耦合项并驱动系统跨越临界阈值。\n3. 这一准平衡方案为超越传统no-go定理限制的超辐射相变研究提供了与驱动-耗散路径不同的新途径，可用于探索凝聚态与腔量子电动力学交叉领域的新奇量子相。", "summary_source": "deepseek", "authors": [{"name": "Wen-Hua Wu"}, {"name": "Fuyang Tay"}, {"name": "Mengqian Che"}, {"name": "Andrey Baydin"}, {"name": "Junichiro Kono"}, {"name": "David Hagenmüller"}], "featured_authors": [{"name": "Wen-Hua Wu"}, {"name": "Fuyang Tay"}, {"name": "Mengqian Che"}, {"name": "Andrey Baydin"}, {"name": "Junichiro Kono"}, {"name": "David Hagenmüller"}], "author_count": 6}, {"id": "2604.08675", "category": "cond-mat", "title": "Bulk-dissociated topological bands without spin-orbit coupling in hetero-dimensional superconducting metamaterials", "abstract": "Topological superconductors (TSCs) in superconducting hybrid heterostructures, which integrate superconducting and non-superconducting materials, have been intensely investigated with the hope of discovering exotic non-Abelian anyons for fault-tolerant quantum computing. In this effort, a challenge for hybrid superconducting systems is controlling hybridization, which is often a balance between enhancing the superconducting proximity effect at the cost of suppressing desirable electronic properties such as strong spin-orbit interactions. Hence, discovering hybrid superconducting systems with topological properties controlled and enhanced by material geometry design without spin-orbit interactions would be intriguing to explore. In this work, we theoretically study a square superconducting network decorated with spin-polarized magnetic adatoms. We find that localized Yu-Shiba-Rusinov bound states at magnetic adatom sites collectively form a weak topological superconducting phase despite the absence of spin-orbit interactions. We then demonstrate that by tuning the Fermi energy of the network, the system can transition from a weak TSC phase to a bulk-dissociated TSC phase where the edge state bands separate from the bulk, giving rise to unexpected features such as nodal lines and co-existing bulk-dissociated edge and corner modes. Moreover, our findings highlight how hetero-dimensional superconducting metamaterials can serve as a useful template for controlling the coupling and dissociation between electronic degrees of freedom of different dimensionalities.", "url": "https://arxiv.org/abs/2604.08675", "type": "理论", "summary": "1. 本工作从理论上研究了由自旋极化磁性原子修饰的方形超导网络，发现其在不依赖自旋轨道耦合的条件下可形成弱拓扑超导相。\n2. 其核心物理机制在于通过调节网络费米能，系统可过渡到体态解离的拓扑超导相，边缘态能带与体态分离并涌现出节点线和共存的边缘/角模式。\n3. 这突显了异维超导超材料可作为控制不同维度电子自由度耦合与解耦的有效模板，为不依赖自旋轨道相互作用的拓扑系统设计提供了新思路。", "summary_source": "deepseek", "authors": [{"name": "Joseph J. Cuozzo"}, {"name": "Sayed A.A. Ghorashi"}, {"name": "Dale Huber"}, {"name": "Wei Pan"}, {"name": "François Léonard"}], "featured_authors": [{"name": "Joseph J. Cuozzo"}, {"name": "Sayed A.A. Ghorashi"}, {"name": "Dale Huber"}, {"name": "Wei Pan"}, {"name": "François Léonard"}], "author_count": 5}, {"id": "2604.08702", "category": "cond-mat", "title": "Topological invariant of periodic many body wavefunction from charge pumping simulation", "abstract": "Many-body topological quantum states host exotic quantum phenomena and lie at the forefront of developing next-generation quantum technologies. Recently emerged neural network wavefunction methods have established themselves as a powerful computational framework for accessing these states, enabling the variational machine learning calculation of the system's ground state wavefunction. However, reliable computation of topological invariants remains an open challenge when the whole deterministic energy spectrum is not available. In this work, we introduce a robust approach to determining topological invariant based on simulating the charge pumping process, by monitoring the response of polarization upon flux insertion. By applying this method, we accurately extract the Chern numbers for Abelian fractional Chern insulators. Our approach also enables the first neural-network-wavefunction-based identification of anomalous composite Fermi liquid states. Our work resolves a key bottleneck in applying neural network wavefunctions to correlated topological matter, and the method proposed is also generally applicable to other many-body approaches, thereby opening up new avenues for future research in this field.", "url": "https://arxiv.org/abs/2604.08702", "type": "理论+数值", "summary": "1. 该工作提出了一种基于电荷泵浦模拟的稳健方法，用于从周期多体波函数中提取拓扑不变量。\n2. 其技术核心在于通过监测通量插入下电极化的响应来模拟电荷泵浦过程，从而在无法获得完整确定性能谱的情况下可靠计算陈数。\n3. 该方法不仅解决了神经网络波函数应用于关联拓扑物质的关键瓶颈，其普适性也为其他多体计算方法开辟了新的研究途径。", "summary_source": "deepseek", "authors": [{"name": "Haoxiang Chen"}, {"name": "Yubing Qian"}, {"name": "Weiluo Ren"}, {"name": "Xiang Li"}, {"name": "Ji Chen"}], "featured_authors": [{"name": "Haoxiang Chen"}, {"name": "Yubing Qian"}, {"name": "Weiluo Ren"}, {"name": "Xiang Li"}, {"name": "Ji Chen"}], "author_count": 5}, {"id": "2604.08714", "category": "cond-mat", "title": "Immiscible to miscible quenching instabilities in two-dimensional binary Bose-Einstein condensates", "abstract": "Immiscible to miscible quenching transitions (IMQT) in homogeneous Bose-Einstein condensate are investigated, considering rubidium isotopes $^{85}$Rb and $^{87}$Rb confined in a two-dimensional (2D) circular box, under two different initial configurations. These IMQT instabilities, triggered by sudden reductions in the two-body interspecies scattering length $a_{12}$, are explored under two distinct initialconditions, highlighting the critical role of nonlinear dynamics in their evolution. The numerical simulations indicate that the instability dynamics are primarily driven by the production of large vortices and the propagation of sound waves (phonons), with sound wave excitations prevailing in the long-term evolution. The compressible and incompressible parts of the kinetic energy spectra, in terms of the wave number $k$, are confronted with the classical Kolmogorov scaling, $k^{-5/3}$ for turbulence, which is observed in the onset of instabilities. Before reaching the ultraviolet dissipation region at small scales, the IMQT spectra exhibit a bottleneck effect, indicating a clear departure from classical scaling behavior. In the time asymptotic miscible regime, it is observed that the vorticity and sound-wave production remain practically stable. In this regime, for both cases investigated, a linear relation is also recognized between the miscibility parameter and the initial IMQT configuration.", "url": "https://arxiv.org/abs/2604.08714", "type": "理论+数值", "summary": "1. 该工作通过数值模拟研究了二维均匀二元玻色-爱因斯坦凝聚体中由突然减小种间散射长度触发的非混溶-混溶淬火转变不稳定性。\n2. 研究揭示了不稳定性演化由大尺度涡旋产生和声波传播主导，其动能谱在失稳初期偏离经典的科尔莫戈罗夫湍流标度律并呈现瓶颈效应。\n3. 在渐近混溶区观测到的涡度和声波产生稳定性，以及混溶参数与初始淬火构型间的线性关系，为后续调控二元凝聚体的相分离动力学提供了新线索。", "summary_source": "deepseek", "authors": [{"name": "Lauro Tomio"}, {"name": "S. Sabari"}, {"name": "Arnaldo Gammal"}, {"name": "R. K. Kumar"}], "featured_authors": [{"name": "Lauro Tomio"}, {"name": "S. Sabari"}, {"name": "Arnaldo Gammal"}, {"name": "R. K. Kumar"}], "author_count": 4}, {"id": "2604.08770", "category": "cond-mat", "title": "Pressure-stabilized dual-BCC polymorphism in a rhenium-based high-entropy alloy", "abstract": "Accessing metastable structural states in high-entropy alloys offers a promising route to tailor material properties, yet the use of high pressure to engineer such states remains underexplored. Here, we report the pressure-driven synthesis of a unique metastable dual-BCC microstructure in a near-equimolar ReNbTiZrHf alloy. Starting from an ambient two-phase mixture of hexagonal (C14-derived) and body-centered cubic (BCC) phases, compression induces a selective, diffusionless transformation of the hexagonal constituent into a second, crystallographically distinct BCC polymorph, while the original BCC phase remains stable. Upon decompression, the pressure-induced BCC phase is kinetically trapped, yielding a dual-BCC state that is inaccessible via conventional thermal processing. The pressure-stabilized BCC polymorph is Re-enriched and inherits the exceptional stiffness of its hexagonal parent (bulk modulus ~290 GPa), creating a composite microstructure with pronounced elastic and mechanical contrast relative to the softer original BCC matrix (~180 GPa). These findings demonstrate that pressure can effectively navigate the flat free-energy landscapes of chemically complex alloys, establishing a robust pathway for polymorph engineering and metastable phase design in refractory HEAs.", "url": "https://arxiv.org/abs/2604.08770", "type": "理论", "summary": "1. 本研究在近等摩尔ReNbTiZrHf高熵合金中通过高压合成了亚稳态双BCC多形体。\n2. 关键发现是高压诱导六方相无扩散转变为富Re、高刚度的第二BCC相，形成弹性对比微结构。\n3. 这证明高压可操控复杂合金的自由能景观，为多形体工程开辟了新方向。", "summary_source": "deepseek", "authors": [{"name": "Raimundas Sereika"}, {"name": "Andrew D. Pope"}, {"name": "Hunter Kantelis"}, {"name": "Caleb M. Knight"}, {"name": "Kallol Chakrabarty"}, {"name": "Yogesh K. Vohra"}], "featured_authors": [{"name": "Raimundas Sereika"}, {"name": "Andrew D. Pope"}, {"name": "Hunter Kantelis"}, {"name": "Caleb M. Knight"}, {"name": "Kallol Chakrabarty"}, {"name": "Yogesh K. Vohra"}], "author_count": 6}, {"id": "2604.08777", "category": "cond-mat", "title": "Including sample shape in micromagnetics with 3D periodic boundary conditions", "abstract": "Periodic boundary conditions (PBCs) for computing magnetic fields in repeating magnetic structures, e.g. in micromagnetic simulations, are typically imposed using the quasi periodic macrogeometry approach, where many copies of the simulated domain are introduced. This can be computationally problematic, especially if the simulated domain is incommensurate with the desired sample shape. In this work, we present a formal proof that for sufficiently large magnetic samples, only the average magnetisation gives non-negligible shape effects. Using this insight, we develop a simple, computationally efficient modification of existing implementations which incorporates shape effects in PBC methods.", "url": "https://arxiv.org/abs/2604.08777", "type": "理论+数值", "summary": "1. 该工作通过严格证明平均磁化主导大样品形状效应，发展了一种在周期性边界条件微磁模拟中高效纳入样品形状的修正方法。\n2. 其核心突破在于基于上述物理洞察，仅需对现有实现进行简单修改，即可在保持计算效率的同时显著提升形状不匹配情形的模拟精度。\n3. 这为处理复杂几何或非周期磁结构的微磁模拟提供了更精确且实用的计算框架，有望推广至其他场-物质耦合的周期系统。", "summary_source": "deepseek", "authors": [{"name": "Frederik Laust Durhuus"}, {"name": "Andrea Roberto Insinga"}, {"name": "Rasmus Bjørk"}], "featured_authors": [{"name": "Frederik Laust Durhuus"}, {"name": "Andrea Roberto Insinga"}, {"name": "Rasmus Bjørk"}], "author_count": 3}, {"id": "2604.08784", "category": "cond-mat", "title": "Path-Integral Formulation of Unavoidable Canonical Nonlinearity: Dynamic Discretization Cost over Variable Supports", "abstract": "In the statistical thermodynamics of classical discrete systems, the map from microscopic interactions to thermodynamic equilibrium configurations generally exhibits complex nonlinearity, known as \"canonical nonlinearity\" (CN). While conventionally characterized by the Kullback-Leibler (KL) divergence, this approach inevitably misses intrinsic nonlinearities arising from the discretization of continuous Gaussian families themselves. This intrinsic effect of unavoidable CN (UCN), has recently been quantified within a transport-information-geometric framework. However, the UCN is fundamentally limited to evaluating the discretization-induced cost for a single continuous distribution. It therefore does not capture the information-geometric cost between a continuous Gaussian reference and an actual discrete distribution, nor between states with fundamentally different supports, making it conceptually unclear how to decompose the overall CN. To address this limitation, we propose the Path-Integral UCN (PUCN) quantifying the cumulative information-geometric cost between distinct distributions. The PUCN adopts a path by (i) retaining the canonical distribution as an exponential family via the $e$-mixture (geometric mean) of the base measure, leading to an arithmetic mixture of the Fisher metric as the CN standard, and (ii) enforcing covariant changes in the discretization cell through the harmonic mixture of its second-moment matrix $M$, reflecting the uncertainty in parameter variations on the statistical manifold. The resulting PUCN provides a flexible measure of the geometric cost between arbitrary states, including those with essentially different supports. This formulation enables an explicit quantification of CN between different CDOS systems and a natural decomposition of the total CN into the UCN and a residual contribution, which has not been clearly separated in existing approaches.", "url": "https://arxiv.org/abs/2604.08784", "type": "理论", "summary": "1. 本文提出了路径积分不可避开正则非线性（PUCN）框架，以量化具有不同支撑集的分布之间的累积信息几何代价。\n2. 其核心在于通过基测度的e-混合保持指数族形式，并借助离散化单元二阶矩矩阵的调和混合强制执行协变变化，从而统一描述连续与离散分布间的几何成本。\n3. 这首次实现了不同CDOS系统间正则非线性的显式量化，并将总非线性分解为固有部分与残余贡献，为统计热力学中离散化效应的系统分析提供了新途径。", "summary_source": "deepseek", "authors": [{"name": "Koretaka Yuge"}], "featured_authors": [{"name": "Koretaka Yuge"}], "author_count": 1}, {"id": "2604.08845", "category": "cond-mat", "title": "Antitopological magnetic textures in an antiferromagnetically coupled bilayer with frustration", "abstract": "The bilayer skyrmion composed of upper and lower tightly coupled skyrmions on two layers with completely compensated topological charges (called as anti-topology here), has become one feasible improvement of conventional skyrmion to realize straight motion without skyrmion Hall effect, which has aroused great interest in practical applications. The present work investigates a general model (without external magnetic field) for the frustration-induced anti-topological bilayer magnetic textures with rich morphologies, and discusses the modulations of key parameters on the energy barrier and the current-driven dynamics. It is revealed that the interlayer coupling plays a key role in preventing distortion, and thus helps to reach a faster velocity. This model can be realized in various frustrated magnetic materials with antiferromagnetically coupled bilayer, providing a helpful guidance for the material design and application of topological magnetic textures.", "url": "https://arxiv.org/abs/2604.08845", "type": "理论", "summary": "1. 该工作建立了一个无外部磁场的通用理论模型，系统研究了反铁磁耦合双层受挫体系中反拓扑磁纹理（如拓扑电荷补偿的双层斯格明子）的稳定存在、形态多样性及其电流驱动动力学，并分析了关键参数对能量势垒的调制作用。\n2. 模型的核心物理机制在于揭示了层间反铁磁耦合能有效维持结构完整性，防止电流诱导的扭曲，从而消除斯格明子霍尔效应，实现更高的直线运动速度。\n3. 这一模型为在多种受挫磁性材料中设计与调控反拓扑纹理提供了理论基础，对开发基于高速、低功耗拓扑自旋纹理的自旋电子器件具有重要指导意义。", "summary_source": "deepseek", "authors": [{"name": "Lewei Zhou"}, {"name": "Jun Chen"}, {"name": "Zhong Shen"}, {"name": "Shuai Dong"}, {"name": "Xiaoyan Yao"}], "featured_authors": [{"name": "Lewei Zhou"}, {"name": "Jun Chen"}, {"name": "Zhong Shen"}, {"name": "Shuai Dong"}, {"name": "Xiaoyan Yao"}], "author_count": 5}, {"id": "2604.08864", "category": "cond-mat", "title": "Self-similar Dynamics in Percolation and Sandpile", "abstract": "Spatial self-similarity is a hallmark of critical phenomena. We study the dynamic process of percolation, in which bonds are incrementally added to an initially empty lattice until the system becomes fully occupied. By tracking the gap -- the size increment of clusters upon bond addition -- and the corresponding merged cluster, we identify scale-invariant temporal patterns in both quantities throughout a large portion of the process. This reveals a form of temporal self-similarity that has not been reported before. We further establish quantitative relations between the dynamic scaling exponents and the conventional static critical exponents, which enable the determination of critical behavior without prior knowledge of the critical point. The same self-similar dynamics is observed in both bond and site percolation on lattices and networks, and extends to other systems such as explosive and rigidity percolation. Moreover, similar temporal scaling is found in the initial nonequilibrium evolution of the Bak-Tang-Wiesenfeld sandpile model, suggesting a dynamic critical behavior distinct from its equilibrium state. These results provide a unified framework for understanding critical dynamics and may find applications in a broad range of complex systems.", "url": "https://arxiv.org/abs/2604.08864", "type": "理论", "summary": "1. 该工作通过追踪渗流过程中的间隙和合并簇，揭示了时间自相似性，并推广至沙堆模型。\n2. 其卖点在于建立了动态与静态临界指数的定量关系，使得无需预知临界点即可探测临界行为。\n3. 这为理解临界动力学提供了统一框架，有望应用于多种复杂系统。", "summary_source": "deepseek", "authors": [{"name": "Mingzhong Lu"}, {"name": "Ming Li"}, {"name": "Youjin Deng"}], "featured_authors": [{"name": "Mingzhong Lu"}, {"name": "Ming Li"}, {"name": "Youjin Deng"}], "author_count": 3}, {"id": "2604.08901", "category": "cond-mat", "title": "Activation of Inner-Shell 4p-Orbital Electrons of Rubidium Driven by Asymmetric Coordination at High Pressure", "abstract": "While the high oxidation states in heavy alkali fluorides (Cs, Ba, Ra) have been attributed to a pressure-driven upshift of energy level of inner p states, this route is largely ineffective for Rb because its smaller ionic radius suppresses the required level rise even under strong compression. Here, we predict a high-pressure layered ternary phase, RbBF5, in which 12-fold truncated-cube-like F coordination around Rb breaks local symmetry and activates the Rb 4p inner shell. The resulting orbital splitting selectively elevates the in-plane Rb 4px,y levels toward the F 2p manifold, enabling inner-shell participation and stabilizing Rb-F bonding under compression. More broadly, this symmetry-lowering coordination motif may provide a general mechanism for activating inner-shell p states in other alkali metals (e.g., K and Cs inner p states). These findings extend inner-shell chemistry to lighter main-group elements and establish a design principle for accessing unconventional bonding and oxidation states at high pressure.", "url": "https://arxiv.org/abs/2604.08901", "type": "理论", "summary": "1. 本研究通过第一性原理计算预测了高压下稳定的层状三元相RbBF5，其中铷原子被12个氟原子以截断立方体形式配位，这种不对称配位环境打破局域对称性，从而激活了铷的内层4p轨道电子。\n2. 关键物理机制在于不对称配位引起轨道分裂，选择性地将面内Rb 4px和4py能级提升至氟配体2p能带附近，使内层电子参与化学键合，并在高压压缩下稳定Rb-F键。\n3. 这一对称性降低的配位构型为激活钾、铯等其他碱金属内层p态提供了通用机制，将内层化学拓展至更轻主族元素，并为高压下设计非常规键合与氧化态确立了新原则。", "summary_source": "deepseek", "authors": [{"name": "Shuran Ma"}, {"name": "Xue Cong"}, {"name": "Yanchang Wang"}, {"name": "Yuanzheng Chen"}, {"name": "Zhen Liu"}], "featured_authors": [{"name": "Shuran Ma"}, {"name": "Xue Cong"}, {"name": "Yanchang Wang"}, {"name": "Yuanzheng Chen"}, {"name": "Zhen Liu"}], "author_count": 5}, {"id": "2604.08937", "category": "cond-mat", "title": "Superconductivity and competing orders in honeycomb $t$-$J$ model: interplay of lattice geometry and next-nearest-neighbor hopping", "abstract": "We investigate the extended $t$-$J$ model on honeycomb lattices with next-nearest-neighbor (NNN) electron hopping $t'$ and superexchange coupling $J'=(t'/t)^2 J$ using large-scale density-matrix renormalization group (DMRG) simulations and slave-boson mean-field theory (SBMFT). By systematically varying $t'$ and cylinder geometries, our DMRG results reveal several competing phases with distinct charge and superconducting (SC) properties. On YC4-0 cylinders possessing bonds lying along $\\vec{e}_y$ direction, the ground state of doped models exhibits pronounced quasi-long-range $d$-wave SC with coexisting armchair-oriented stripes (a-stripe) across a broad range of $t'$. Notably, the SC Luttinger exponent has a non-monotonic dependence on $t'$, showing an optimal $t'_{op}\\sim0.4$ for dominant SC. Conversely, XC cylinders host a competing long-range zigzag stripes phase without SC for $t'>0.5$, highlighting the role of boundary geometry in stabilizing distinct competing phases in DMRG. To elucidate the stability of all these competing phases in 2D limit, we employ SBMFT and identify the a-stripe as the stable configuration across most of phase diagram, with a transition to uniform nematic $d$-wave SC at large $t'$ for $\\delta=1/8$. The combined results from two complementary approaches suggest a robust $t'$-induced SC phase that might remain stable in doped extended $t$-$J$ model on the honeycomb lattice.", "url": "https://arxiv.org/abs/2604.08937", "type": "理论+数值", "summary": "1. 该工作通过密度矩阵重正化群与玻色平均场理论，系统研究了蜂窝晶格扩展t-J模型中次近邻跃迁对超导与竞争序的影响。\n2. 核心发现揭示了超导鲁丁格指数对t'的非单调依赖性存在最优值，且边界几何条件能稳定截然不同的竞争相（如条纹相）。\n3. 这为理解二维极限下条纹序与d波超导的竞争关系提供了关键线索，表明几何效应可能在蜂窝结构高温超导材料中起重要作用。", "summary_source": "deepseek", "authors": [{"name": "Zhi Xu"}, {"name": "Hong-Chen Jiang"}, {"name": "Yi-Fan Jiang"}], "featured_authors": [{"name": "Zhi Xu"}, {"name": "Hong-Chen Jiang"}, {"name": "Yi-Fan Jiang"}], "author_count": 3}, {"id": "2604.08942", "category": "cond-mat", "title": "Post-Jamming Mechanics of Feedback-Regulated Budding-Cell Packings", "abstract": "Budding-cell packings jam before all buds are mechanically constrained. The post-jamming state is therefore set by both the pressure $P$ and the fraction $u$ of buds that remain unconstrained. We develop a mean-field theory for this regime. A modified Maxwell count gives the post-jamming coordination, a depletion law for the unconstrained buds predicts the crossover density $\\phi_2$ at which that reservoir is exhausted, and a flux-partition argument explains why strong growth feedback can markedly increase rigidity while generating little internal pressure.", "url": "https://arxiv.org/abs/2604.08942", "type": "理论", "summary": "1. 该工作针对反馈调节的出芽细胞堆积，发展了卡顿后力学的平均场理论。\n2. 理论通过修改麦克斯韦计数、耗尽定律和通量分配，揭示了协调性、交叉密度及反馈调控刚性/压力的机制。\n3. 这为生长调控的生物物理堆积及其他软物质体系的理论与实验研究提供了新视角。", "summary_source": "deepseek", "authors": [{"name": "Pawel Gniewek"}], "featured_authors": [{"name": "Pawel Gniewek"}], "author_count": 1}, {"id": "2604.08961", "category": "cond-mat", "title": "Grain Growth Kinetics in (Cr,Mo,Ta,V,W)C1-δ High-Entropy Carbide Ceramics", "abstract": "Understanding grain-boundary mobility during spark plasma sintering can enable microstructure control in high-entropy carbides, yet quantitative grain-growth kinetics remain scarce. In this work, grain growth kinetics and densification behavior were investigated for single-phase fully dense (Cr,Mo,Ta,V,W)C1-{\\delta} high-entropy carbide ceramics. Specimens were densified by spark plasma sintering for a constant dwell time of 10 min at temperatures between 1750 °C and 1950 °C to isolate the role of temperature on microstructural evolution. Increasing sintering temperature produced grain growth and increased lattice parameter, while maintaining a single-phase rock salt structure. Elemental mapping showed a progressive reduction of Ta segregation with increasing sintering temperature, suggesting enhanced chemical homogenization at elevated temperatures. Grain growth kinetics were analyzed using a normal grain growth model with an assumed growth exponent of n=3, physically reasonable for grain-boundary-controlled growth influenced by solute and vacancy pinning. Arrhenius analysis of the growth factor yielded an apparent activation energy of approximately 620 kJ mol-1, comparable to diffusion-controlled processes in refractory transition-metal carbides. Densification curves revealed rapid consolidation prior to reaching the peak temperature followed by temperature-dominated grain coarsening. These results establish quantitative relationships between densification temperature, grain growth, and diffusion kinetics in a carbide system, providing insight into the microstructural stability of high-entropy, ultra-high-temperature carbide ceramics.", "url": "https://arxiv.org/abs/2604.08961", "type": "理论", "summary": "1. 该工作通过在不同温度下对单相致密(Cr,Mo,Ta,V,W)C1-δ高熵碳化物进行放电等离子烧结，实验量化了其晶粒生长动力学与致密化行为。\n2. 研究基于晶界控制生长模型（n=3）分析了溶质与空位钉扎效应，并通过阿伦尼乌斯分析获得了约620 kJ mol⁻¹的表观活化能，揭示了与难熔碳化物中扩散控制过程相当的动力学机制。\n3. 这些结果建立了碳化物体系中致密化温度、晶粒生长与扩散动力学之间的定量关系，为理解高熵超高温陶瓷在极端环境下的微观结构稳定性提供了关键依据。", "summary_source": "deepseek", "authors": [{"name": "Ali Sarikhani"}, {"name": "Gregory E. Hilmas"}, {"name": "David W. Lipke"}, {"name": "Douglas E. Wolfe"}, {"name": "Stefano Curtarolo"}, {"name": "Shen J. Dillon"}, {"name": "Ahmad Mirzaei"}, {"name": "William G. Fahrenholtz"}], "featured_authors": [{"name": "Ali Sarikhani"}, {"name": "Gregory E. Hilmas"}, {"name": "David W. Lipke"}, {"name": "Shen J. Dillon"}, {"name": "Ahmad Mirzaei"}, {"name": "William G. Fahrenholtz"}], "author_count": 8}, {"id": "2604.09007", "category": "cond-mat", "title": "Metadynamics for Vacancy Dynamics in Crystals", "abstract": "We propose a metadynamics-based (MetaD-based) approach for constructing the free energy surface (FES) of vacancy dynamics in crystals. In this approach, the vacancy FES can be constructed without explicitly defining a unique vacancy coordinate or introducing a set of parameters that strongly govern the FES topology, enabled by parallel bias MetaD with partitioned families (PB MetaDPF). In addition, the proposed approach is made more efficient and effective through a multi-hill strategy that exploits crystallographic symmetry. We demonstrate the validity of the proposed approach through applications to self-diffusion and impurity diffusion via monovacancies and divacancies in metallic and ionic crystals.", "url": "https://arxiv.org/abs/2604.09007", "type": "理论", "summary": "1. 该研究提出了一种基于元动力学的晶体空位动力学自由能面构建方法。\n2. 其技术优势在于采用分区族并行偏置元动力学和多峰策略，避免了空位坐标的明确定义并利用晶体对称性提升效率。\n3. 通过应用于金属和离子晶体中的自扩散与杂质扩散，该方法验证了有效性，并为晶体缺陷研究提供了新思路。", "summary_source": "deepseek", "authors": [{"name": "Kazuaki Toyoura"}, {"name": "Shunya Yamada"}], "featured_authors": [{"name": "Kazuaki Toyoura"}, {"name": "Shunya Yamada"}], "author_count": 2}, {"id": "2604.09084", "category": "cond-mat", "title": "Force Field-Agnostic Phase Classification of Zeolitic Imidazolate Framework Polymorphs", "abstract": "Zeolitic Imidazolate Frameworks (ZIFs) are a family of metal--organic frameworks that feature metal centers tetrahedrally linked to imidazole-based ligands and adopt zeolite-like topologies. ZIFs formed by Zinc cations and imidazolate linkers exhibit a remarkable degree of polymorphism, which can be modulated by varying synthesis parameters or thermodynamic conditions (i.e., temperature and pressure). Computer simulations provide a unique way of studying these materials and their phase transitions from the microscopic standpoint, revealing their underlying molecular mechanisms. However, studying these mechanisms requires to be able to classify the phase of each molecular entity in an agnostic and automatic fashion, which is particularly challenging when the two phases involved are structurally very similar. In this work, we systematically study neural network classifiers to classify ZIF phases on-the-fly during molecular dynamics simulations. We test a variety of input features, differing both in the dimensionality and nature of the descriptors and in the kind of force field used for building the training/testing database. We reveal that even with low-dimensional descriptors the classification is highly accurate, while the use of high-dimensional descriptors leads to an even better performance. Training the classifier with configurations coming from different force fields we can remove force field bias and enhance the classifier performance and general applicability. Finally, we apply our classifiers to reveal mechanistic details of the ZIF-4-cp $\\xrightarrow{}$ ZIF-4-cp-II phase transition.", "url": "https://arxiv.org/abs/2604.09084", "type": "理论+数值", "summary": "1. 本工作系统研究了基于神经网络的分类器，以在分子动力学模拟中实时分类沸石咪唑酯框架(ZIF)的晶相。\n2. 该方法利用低维描述符即可实现高精度分类，并通过融合不同力场训练数据消除了力场偏差，提升了分类器的普适性。\n3. 该力场无关的自动分类策略成功揭示了ZIF-4-cp到ZIF-4-cp-II的相变微观机制，为研究其他复杂体系的结构相变提供了可靠工具。", "summary_source": "deepseek", "authors": [{"name": "Emilio Méndez"}, {"name": "Léna Triestram"}, {"name": "Dune André"}, {"name": "François-Xavier Coudert"}, {"name": "Rocio Semino"}], "featured_authors": [{"name": "Emilio Méndez"}, {"name": "Léna Triestram"}, {"name": "Dune André"}, {"name": "François-Xavier Coudert"}, {"name": "Rocio Semino"}], "author_count": 5}, {"id": "2604.09180", "category": "cond-mat", "title": "Eigenstate entanglement entropy in Bose-Hubbard models", "abstract": "While the eigenstate entanglement entropy has been extensively studied for fermionic systems, much less is known about bosonic systems. Here, we study the entanglement entropy of mid-spectrum eigenstates of Bose-Hubbard models, focusing on weakly disordered models with and without particle-number conservation, and contrasting them with the translationally-invariant model. We analyze the volume-law and O(1) contributions to the entanglement entropy via the averages over mid-spectrum eigenstates and the corresponding distributions. We derive the volume-law coefficient of the entanglement entropy by generalizing the mean-field approach from [Phys. Rev. Lett. 119, 220603 (2017)] to many-body systems with a tunable local bosonic cutoff, which agrees with previous analytical and numerical results from [Phys. Rev. B 110, 235154 (2024)]. We show that the volume-law contribution to the entanglement entropy does not change upon breaking translational invariance via on-site disorder. We then numerically study the role of the subleading O(1) contribution to the entanglement entropy. We find that, in the particle-number conserving case, it exhibits a nontrivial dependence on the particle-number density and the local bosonic cutoff, while without particle-number conservation, results suggest the emergence of a universal O(1) contribution beyond the random pure state predictions.", "url": "https://arxiv.org/abs/2604.09180", "type": "理论+数值", "summary": "1. 该工作系统研究了Bose-Hubbard模型本征态的纠缠熵，重点对比了无序与平移不变系统、有与无粒子数守恒的情形。\n2. 其核心在于将平均场方法推广至可调局域截断的多体玻色系统，并揭示无序不改变体积律系数，而次领头项则呈现非平庸的密度与截断依赖关系。\n3. 这为理解玻色多体系统的热化行为、探索超越随机纯态预测的普适次领头项提供了新视角与理论基础。", "summary_source": "deepseek", "authors": [{"name": "G. Medoš"}, {"name": "L. Vidmar"}], "featured_authors": [{"name": "G. Medoš"}, {"name": "L. Vidmar"}], "author_count": 2}, {"id": "2604.09217", "category": "cond-mat", "title": "Linking Calendar and Cycle Ageing in Lithium-Ion Batteries through Consistent Parameterisation of an Electrochemical-Thermal-Degradation Model", "abstract": "Parameterisation of coupled degradation mechanisms in lithium-ion batteries is a major challenge. Interactions between the mechanisms depend on usage conditions: C-rate, rest state-of-charge (SoC), depth-of-discharge (DoD) and temperature. This work presents a framework to consistently parameterise key degradation modes--solid-electrolyte interphase (SEI) growth, lithium plating, and active material loss in both electrodes--using insights derived from degradation mode analysis data. The work predicts capacity fade trajectories of a NMC-based lithium-ion cell under both calendar and combined calendar-cyclic ageing, using a P2D electrochemical-thermal-degradation model. The work predicts state-of-health (SoH), remaining-useful-life (RUL) and internal degradation modes of the cell--under 81 combinations of temperature (10$^o$C, 25$^o$C, 40$^o$C), C-rate (0.1 C, 0.3 C and 1.0 C), rest SoC (10%, 60%, and 100%) and DoD (50%, 70%, and 90%)--using PyBaMM. The predicted cycle-life varies between 0.8 to 14 years to reach 75% of SoH. The work provides mechanistic insights into competing effects between calendar and cyclic ageing, during cycling. The model demonstrates sub-linear, linear, and sup-linear/accelerated capacity fade based on the usage conditions. The simulated dataset for all the cases is made available.", "url": "https://arxiv.org/abs/2604.09217", "type": "理论", "summary": "1. 本研究建立了一个电化学-热-衰退耦合模型框架，统一参数化了NMC锂离子电池的关键衰退模式（SEI生长、锂沉积和正负极活性材料损失），并预测了日历老化与循环老化共同作用下的容量衰减轨迹。\n2. 其核心在于通过衰退模式分析数据实现了一致性参数标定，揭示了不同使用条件（温度、倍率、静置SOC、DOD）下日历老化与循环老化之间的竞争机制，并演示了容量衰减从亚线性到加速的多种行为。\n3. 所公开的全工况模拟数据集为电池模型的进一步验证、寿命预测算法的开发以及针对特定应用场景的电池设计与优化提供了关键基础。", "summary_source": "deepseek", "authors": [{"name": "Ganesh Madabattula"}], "featured_authors": [{"name": "Ganesh Madabattula"}], "author_count": 1}, {"id": "2604.09224", "category": "cond-mat", "title": "Many-body dynamical localization in Fock space", "abstract": "We investigate the emergence of many-body dynamical localization (MBDL) in the Fock space of an interacting two-mode bosonic system subject to periodic driving. Using a mapping to the paradigmatic kicked-top model, we analyze the interplay between classical chaotic diffusion and quantum interference effects. While the mean-field (classical) dynamics exhibits bounded ergodic diffusion along the population imbalance axis, the quantum dynamics reveals strong suppression of transport in Fock space, in close analogy with Anderson localization in disordered lattices. We characterize the localization length, its scaling with particle number and driving parameters, and reveal the spectral crossover from random-matrix to Poisson statistics as the many-body ensemble localizes. We highlight the connection between MBDL and discrete time crystals. Our findings offer a promising avenue to study the Anderson transition in Fock space.", "url": "https://arxiv.org/abs/2604.09224", "type": "理论", "summary": "1. 本文研究了周期性驱动下相互作用两模玻色系统在福克空间中涌现的多体动力学局域化现象。\n2. 通过映射至 kicked-top 模型，揭示了经典混沌扩散与量子干涉相互竞争导致福克空间输运强烈抑制的物理机制，其局域化行为与无序晶格中的安德森局域化高度类比。\n3. 该工作为在福克空间中探索多体安德森相变以及关联的离散时间晶体行为提供了清晰的理论途径和验证平台。", "summary_source": "deepseek", "authors": [{"name": "Nathan Dupont"}, {"name": "Bruno Peaudecerf"}, {"name": "David Guéry-Odelin"}, {"name": "Gabriel Lemarié"}, {"name": "Bertrand Georgeot"}, {"name": "Christian Miniatura"}, {"name": "Nathan Goldman"}], "featured_authors": [{"name": "Nathan Dupont"}, {"name": "Bruno Peaudecerf"}, {"name": "David Guéry-Odelin"}, {"name": "Bertrand Georgeot"}, {"name": "Christian Miniatura"}, {"name": "Nathan Goldman"}], "author_count": 7}, {"id": "2604.09226", "category": "cond-mat", "title": "Balancing Thermodynamics, Kinetics, and Reversibility in Ti-Doped MgB2H8: A First-Principles Assessment of a Practical Solid-State Hydrogen Storage Material", "abstract": "Hydrogen storage remains a key challenge for the development of a sustainable hydrogen energy system, where materials must satisfy requirements on storage capacity, thermodynamics, kinetics, and reversibility. Complex borohydrides are attractive due to their high hydrogen density, but their practical use is limited by slow hydrogen diffusion and unfavorable desorption thermodynamics. In this work, we present a first-principles study of pristine and Ti-doped MgB2H8 as a solid-state hydrogen storage material. Density functional theory calculations show that pristine MgB2H8 has a high gravimetric hydrogen capacity of about 14.9 wt percent, but also a relatively high hydrogen desorption enthalpy of about 42 kJ per mol H2 and diffusion barriers around 0.5 eV, which limit its performance at moderate temperatures. Substitutional doping with Ti at the Mg site improves these properties while maintaining structural stability. The doped system retains a high hydrogen capacity of about 10.4 wt percent and shows a reduced desorption enthalpy of about 36 kJ per mol H2, placing it within a favorable thermodynamic range for hydrogen release. Nudged elastic band calculations show a reduction in hydrogen migration barriers to about 0.38 eV, indicating improved diffusion kinetics. Phonon and elastic analyses confirm that Ti doping preserves stability. Electronic structure analysis shows that Ti 3d states near the Fermi level weaken B-H bonding and stabilize intermediate hydrogen configurations, explaining the improved behavior. These results identify Ti-doped MgB2H8 as a promising hydrogen storage material.", "url": "https://arxiv.org/abs/2604.09226", "type": "理论+数值", "summary": "1. 该工作通过第一性原理计算评估了Ti掺杂MgB2H8作为固态储氢材料的性能。\n2. 研究发现，Ti在Mg位点的掺杂将脱附焓降至约36 kJ/mol H₂、氢迁移势垒降至约0.38 eV，同时维持约10.4 wt%的高储氢容量与结构稳定性。\n3. 此研究为通过金属掺杂协同优化复杂硼氢化物的热力学与动力学性能提供了明确的设计思路。", "summary_source": "deepseek", "authors": [{"name": "Sikander Azam"}, {"name": "Wilayat Khan"}], "featured_authors": [{"name": "Sikander Azam"}, {"name": "Wilayat Khan"}], "author_count": 2}, {"id": "2604.09373", "category": "cond-mat", "title": "Physical Properties of Dextran Solutions as Model Crowding Media", "abstract": "The role of macromolecular crowding in living systems is widely appreciated, but artificial crowders used to model these effects in vitro are often inadequately characterized. In this work, we examine density, viscosity, polymer self-diffusion and water diffusion in crowded dextran systems. Dextran viscosity and self-diffusion follow size-dependent trends, collectively described by universal functions of the overlap concentration corresponding to a Flory exponent of 0.44, characteristic of branched polymers. Viscosity increases with concentration as a power law, with a crossover from dilute to semi-dilute behaviors. Dextran self-diffusion decays exponentially: this can be interpreted in light of Rosenfeld's excess entropy scaling hypothesis. Water self-diffusivity and specific volume decrease with concentration, but show no dependence on polymer size. We show how these results can be used to construct the true volume fraction of crowders, which takes into account bound water. Overall, our findings showcase the power of polymer physics concepts in macromolecular crowding studies in vitro.", "url": "https://arxiv.org/abs/2604.09373", "type": "理论", "summary": "1. 该工作测量了葡聚糖拥挤溶液的密度、粘度、聚合物自扩散和水扩散等物理性质。\n2. 其卖点在于粘度和自扩散数据可由重叠浓度的普适函数描述，对应分枝聚合物的弗洛里指数0.44。\n3. 这为构建考虑结合水的真实拥挤体积分数提供了方法，并展示了聚合物物理在体外拥挤研究中的潜力。", "summary_source": "deepseek", "authors": [{"name": "Giuliano Migliorini"}, {"name": "Josipa Cecic Vidos"}, {"name": "Josef Hamacek"}, {"name": "Anand Yethiraj"}, {"name": "Francesco Piazza"}], "featured_authors": [{"name": "Giuliano Migliorini"}, {"name": "Josipa Cecic Vidos"}, {"name": "Josef Hamacek"}, {"name": "Anand Yethiraj"}, {"name": "Francesco Piazza"}], "author_count": 5}, {"id": "2604.09390", "category": "cond-mat", "title": "Steady-state phonon heat currents and differential thermal conductance across a junction of two harmonic phonon reservoirs", "abstract": "We study phonon transport in junctions of two harmonic reservoirs coupled together by a spring. The exact steady-state heat currents and thermal conductance are calculated using nonequilibrium Green's functions. We find that the heat currents follow Fourier's law and the thermal conductance has a peak whenever the phonon spectra match. At lower temperatures, however, the thermal conductance maximum may not coincide with the spectra-matching peak due to the exclusion of higher-frequency phonons, whose spectra may match, from participating in the transport. Furthermore, we find that increasing the coupling spring constant increases the thermal conductance. Lastly, the magnitude of the steady-state heat currents and thermal conductance are the same whether the direction of phonon flow is from left to right or vice versa, even with mass and spring constant asymmetry. The properties of this basic model can serve as a reference for more complicated setups of phonon transport in molecular junctions.", "url": "https://arxiv.org/abs/2604.09390", "type": "理论", "summary": "1. 该工作通过非平衡格林函数方法精确计算了两个谐振声子库通过弹簧耦合结中的稳态热流与微分热导。\n2. 研究发现热导在声子谱匹配时出现峰值，但低温下高频声子被排除导致峰值偏移，且热导随耦合弹簧常数增大而单调增加。\n3. 这一简单模型所揭示的谱匹配机制与昂萨格互易关系的普适性，为分子结等更复杂声子输运体系提供了基准参考。", "summary_source": "deepseek", "authors": [{"name": "Eduardo C. Cuansing"}, {"name": "Juan Rafael K. Bautista"}], "featured_authors": [{"name": "Eduardo C. Cuansing"}, {"name": "Juan Rafael K. Bautista"}], "author_count": 2}, {"id": "2604.09398", "category": "cond-mat", "title": "Complex paths for real stochastic processes", "abstract": "The calculation of the decay rate of a metastable state in the path-integral formulation of stochastic processes is revisited. Previous derivations of this rate were achieved at the cost of a step that is difficult to justify mathematically. We show that this difficulty can be resolved by working with an extremal solution that arises naturally in the Ito formulation of the path integral. To make the analysis as transparent as possible, we choose a simple potential for which the extremal solution can be written in terms of elementary functions. The mechanism identified here, however, is not restricted to this example and holds more generally.", "url": "https://arxiv.org/abs/2604.09398", "type": "数值", "summary": "1. 该工作重新审视了随机过程路径积分框架中亚稳态衰变速率的计算方法。\n2. 其卖点在于通过伊藤公式自然导出的极值解，严谨地解决了以往推导中数学证明的困难，并展示了该机制的普适性。\n3. 这为更广泛的随机过程理论中路径积分技术的数学严格化与应用提供了明确路径。", "summary_source": "deepseek", "authors": [{"name": "D. A. Baldwin"}, {"name": "A.J. McKane"}, {"name": "S.P. Fitzgerald"}], "featured_authors": [{"name": "D. A. Baldwin"}, {"name": "A.J. McKane"}, {"name": "S.P. Fitzgerald"}], "author_count": 3}, {"id": "2604.09447", "category": "cond-mat", "title": "Unifying hydrodynamic theory for motility-regulated active matter: from single particles to interacting polymers", "abstract": "Understanding how microscopic motility shapes emergent collective behaviors is a challenging task in active matter, especially when self-propulsion is regulated by external cues or via quorum-sensing interactions. To address this problem, we derive a closed hydrodynamics for scalar active matter with spatially-regulated motility, under general hypotheses for the microscopic dynamics of the particles' orientations. We show that, at large scales, the contribution of the latter is entirely captured by the autocorrelation tensor of the orientations. This allows us to establish a macroscopic equivalence within a broad class of motility-regulated active systems, from single particles to active polymers. Our formalism allows us to reveal a new form of motility-induced phase separation for quorum-sensing active polymers, which we term anti-MIPS, where dense phases exhibit enhanced activity relative to dilute regions. Our theory shows that anti-MIPS generically arises for motility-regulated agents with internal structure, uncovering the existence of several distinct transition pathways.", "url": "https://arxiv.org/abs/2604.09447", "type": "理论", "summary": "1. 本文推导了空间调控运动性的标量活性物质在粒子取向微观动力学一般假设下的封闭流体力学理论。\n2. 其核心在于证明取向的贡献在大尺度上完全由其自相关张量描述，从而建立了从单粒子到活性聚合物等广泛运动调控活性系统的宏观等效性。\n3. 该理论揭示了一种在群体感应活性聚合物中出现的、稠密相活性反而增强的新型运动诱导相分离，并阐明其对具有内部结构的运动调控体系具有普适性。", "summary_source": "deepseek", "authors": [{"name": "Alberto Dinelli"}, {"name": "Pietro Luigi Muzzeddu"}], "featured_authors": [{"name": "Alberto Dinelli"}, {"name": "Pietro Luigi Muzzeddu"}], "author_count": 2}, {"id": "2604.09453", "category": "cond-mat", "title": "Multiscale perturbative approach to active matter with motility regulation", "abstract": "We present a coarse-graining method applicable to dry scalar active matter with motility regulation. Our approach, based on a multiscale perturbative expansion of the backward Kolmogorov equation, does not rely on any specific microscopic dynamics for the particles' orientations. Its generality allows us to address different forms of motility regulation, from space-dependent self-propulsion speed to taxis, and to extend the analysis to a class of non-Markovian orientational dynamics. Furthermore, we identify general conditions on the microscopic dynamics that ensure the existence of an effective large-scale equilibrium regime. When the latter are violated, our theoretical framework is able to quantitatively capture the emergence of large-scale particle currents. We directly apply our coarse-grained theory to several models of self-propelled agents, ranging from single particles to active polymers, and test our analytical predictions with numerical simulations. Finally, we show that our theory naturally extends to active matter with density-mediated interactions, such as quorum sensing, with potential applications to self-organizing soft materials.", "url": "https://arxiv.org/abs/2604.09453", "type": "理论+数值", "summary": "1. 本研究提出了一种适用于具有运动调节的干性标量活性物质的粗粒化理论框架。\n2. 其核心是通过对后向柯尔莫哥洛夫方程进行多尺度微扰展开，无需依赖粒子取向的具体微观动力学，从而能统一处理从空间依赖自推进速度到趋性等多种调节形式。\n3. 该框架可自然扩展至具有密度介导相互作用的活性物质系统，为研究自组织软材料提供了新的理论工具。", "summary_source": "deepseek", "authors": [{"name": "Alberto Dinelli"}, {"name": "Pietro Luigi Muzzeddu"}], "featured_authors": [{"name": "Alberto Dinelli"}, {"name": "Pietro Luigi Muzzeddu"}], "author_count": 2}, {"id": "2604.09475", "category": "cond-mat", "title": "Probing Electrostatic Disorder via g-Tensor Geometry", "abstract": "Low-frequency charge noise induced by fluctuating electrostatic disorder is a major limitation for semiconductor hole spin qubits. Here, we analyze the quasistatic response of a hole spin qubit to individual two-level fluctuators (TLFs). We show that, due to the anisotropy of the g-tensor, the qubit response depends on the geometry of the fluctuator-induced dipolar perturbation. We then propose a readout protocol that isolates selected g-tensor components through an accumulated Berry phase and estimate, within our readout model, an order-unity signal-to-noise ratio with a total protocol time in the tens of microseconds. Finally, using microscopic simulations, we compute the quantum Fisher information (QFI) to identify magnetic field directions and confinement regimes in which the qubit is most sensitive to disorder-induced variations of selected g-tensor components.", "url": "https://arxiv.org/abs/2604.09475", "type": "理论+数值", "summary": "1. 该工作通过分析空穴自旋量子比特对局域双能级涨落源的准静态响应，并设计基于贝里相位累积的读出协议，实现了对特定g张量分量的选择性提取。\n2. 其核心在于利用g张量的各向异性，将涨落源产生的偶极扰动几何与量子比特响应关联，在数十微秒级协议时间内获得接近1的信噪比。\n3. 基于量子费希尔信息的微观模拟指明了磁场方向和限域区间的最优组合，为增强量子比特对静电无序的探测灵敏度提供了明确的优化路径。", "summary_source": "deepseek", "authors": [{"name": "Edmondo Valvo"}, {"name": "Christian Ventura-Meinersen"}, {"name": "Michele Jakob"}, {"name": "Stefano Bosco"}, {"name": "Tereza Vakhtel"}, {"name": "Maximilian Rimbach-Russ"}], "featured_authors": [{"name": "Edmondo Valvo"}, {"name": "Christian Ventura-Meinersen"}, {"name": "Michele Jakob"}, {"name": "Stefano Bosco"}, {"name": "Tereza Vakhtel"}, {"name": "Maximilian Rimbach-Russ"}], "author_count": 6}, {"id": "2604.09486", "category": "cond-mat", "title": "A three-dimensional morphoelastic model for self-oscillations in polyelectrolyte hydrogel filaments", "abstract": "We introduce a three-dimensional model for polyelectrolyte hydrogel filaments operating in a fluid environment under an electric field. The formulation builds on a morphoelastic framework for inextensible and unshearable rods, such that the filament's activity is encoded in electric-field-induced spontaneous curvatures, while hydrodynamic interactions are captured via a local approximation of Stokes flows. We employ this framework to investigate the prototypical case of a filament with elliptic cross-section clamped at its base. Under a constant and uniform electric field aligned with its axis, the filament undergoes flutter instability beyond a critical field strength, as revealed by a linear stability analysis. Depending on the model parameters, the instability is characterized by either two- or three-dimensional self-sustained oscillations. We further examine this behaviour through numerical simulations in the post-critical regime, showing that flutter may develop into large amplitude planar oscillations or more complex three-dimensional motions, through a secondary bifurcation. Although the study represents a first step towards extending state-of-the-art models for polyelectrolyte hydrogel filaments to three dimensions, the richness of the resulting dynamics achievable under time-independent forcing underscores the potential of the proposed actuation mechanism for the design of biomimetic cilia and soft robotic systems.", "url": "https://arxiv.org/abs/2604.09486", "type": "理论+数值", "summary": "1. 该工作以椭圆截面、底部固定的聚电解质水凝胶细丝为对象，建立了其在流体环境与轴向恒定电场下的三维形态弹性模型，并通过线性稳定性分析和数值模拟研究了自振荡动力学。\n2. 其技术核心在于将电场诱导的自发曲率编码到不可拉伸、不可剪切杆的形态弹性框架中，并采用局部斯托克斯流近似捕获流体相互作用，从而揭示了超越临界场强后细丝发生二维或三维自持振荡的颤动失稳机制。\n3. 这为将聚电解质水凝胶细丝模型扩展到三维提供了初步基础，所展现的时间无关外力下丰富动力学（包括通过二次分岔的大振幅平面或复杂三维运动）为仿生纤毛和软体机器人系统的驱动设计提供了新启示。", "summary_source": "deepseek", "authors": [{"name": "Ariel Surya Boiardi"}, {"name": "Roberto Marchello"}, {"name": "Pietro Maria Santucci"}, {"name": "Davide Riccobelli"}, {"name": "Giovanni Noselli"}], "featured_authors": [{"name": "Ariel Surya Boiardi"}, {"name": "Roberto Marchello"}, {"name": "Pietro Maria Santucci"}, {"name": "Davide Riccobelli"}, {"name": "Giovanni Noselli"}], "author_count": 5}, {"id": "2604.09506", "category": "cond-mat", "title": "Field-mediated active dynamical bonds", "abstract": "Active matter systems typically exhibit a trade-off between structural robustness and dynamical freedom, limiting independent control over structure and motion. Here, we show that encoding interactions in a shared field overcomes this constraint, enabling continuous tuning between stable architectures and dynamically active states. Using droplets on a vibrated fluid bath as a minimal realization, we demonstrate that individually unstable units can collectively self-stabilize through field-mediated dynamical bonds. Arising from wavefield interference, these bonds form persistent, self-healing connections that preserve architecture while sustaining motion. Droplet size sets the symmetry of the interactions, with identical droplets forming rigid $\\sigma$-like frameworks that enforce triangular packing, while smaller droplets enable $\\pi$-like coordination that supports higher-order symmetries. The resulting assemblies exhibit both stability and sustained collective dynamics, including spontaneous rotation and controlled migration. This work establishes a general route to programmable active matter in which shared fields reconcile structural robustness with dynamical freedom.", "url": "https://arxiv.org/abs/2604.09506", "type": "理论", "summary": "1. 该工作通过振动流体浴上的液滴实验，证明了利用共享场编码相互作用可克服活性物质中结构稳健性与动力学自由度的权衡，实现稳定架构与动态状态之间的连续调谐。\n2. 其物理核心在于由波场干涉产生的场介导动态键具有自愈合和持久性，液滴尺寸设定相互作用对称性，从而形成σ型三角堆积刚性框架或π型支持高阶对称的协调结构。\n3. 这为可编程活性物质设计提供了一条通用路径，其中共享场协调了结构稳定性与持续集体动力学（如自发旋转和受控迁移），启发了后续实验与理论探索。", "summary_source": "deepseek", "authors": [{"name": "Yuanmei Li"}, {"name": "Rahil Valani"}], "featured_authors": [{"name": "Yuanmei Li"}, {"name": "Rahil Valani"}], "author_count": 2}, {"id": "2604.09542", "category": "cond-mat", "title": "$\\mathrm{U}(2)$ Chern-Simons-Ginzburg-Landau Theory of Fractional Quantum Hall Hierarchies", "abstract": "We construct effective $\\mathrm{U}(2)$ Chern-Simons-Ginzburg-Landau theories for Abelian and non-Abelian fractional quantum Hall hierarchies for those which had previously been described only through categorical data or trial wavefunctions. Our framework captures both Abelian hierarchy states built on half-filled Pfaffian-type parents and non-Abelian hierarchies emerging from Abelian states. It reproduces all filling fractions obtained from wavefunction and categorical constructions and, moreover, uniquely determines the corresponding topological orders. We also identify an intriguing particle-hole symmetry relating two hierarchy sequences, one built on a trivial insulator and the other on the $\\nu=1$ integer quantum Hall state, which respectively generate the Read-Rezayi sequences and their particle-hole conjugates under the same hierarchy construction.", "url": "https://arxiv.org/abs/2604.09542", "type": "理论", "summary": "1. 该工作为先前仅通过范畴数据或尝试波函数描述的阿贝尔及非阿贝尔分数量子霍尔能级构造了有效的 U(2) Chern-Simons-Ginzburg-Landau 理论。\n2. 理论框架统一描述了基于半填充Pfaffian型母态的阿贝尔能级与从阿贝尔态衍生的非阿贝尔能级，完整复现了波函数与范畴构造给出的所有填充因子并唯一确定了对应的拓扑序。\n3. 所揭示的构建于平凡绝缘体与ν=1整数量子霍尔态的两类能级序列间的粒子-空穴对称性，为理解Read-Rezayi序列及其粒子-空穴共轭提供了新的理论视角。", "summary_source": "deepseek", "authors": [{"name": "Taegon Lee"}, {"name": "Gil Young Cho"}, {"name": "Donghae Seo"}], "featured_authors": [{"name": "Taegon Lee"}, {"name": "Gil Young Cho"}, {"name": "Donghae Seo"}], "author_count": 3}, {"id": "2604.08656", "category": "hep-th", "title": "Equivariant localization for higher derivative supergravity", "abstract": "Conformal supergravity provides an effective off-shell formalism to study higher derivative actions. We show that the $D=4$, $\\mathcal{N}=2$ theory admits equivariantly closed forms. These may be used to compute closed-form expressions for supersymmetric observables in a general class of supergravity theories with higher derivative couplings, without any need to solve equations of motion. We discuss applications to holography, presenting results for on-shell actions that are conjecturally valid to all orders in the perturbative $1/N$ expansion.", "url": "https://arxiv.org/abs/2604.08656", "type": "理论", "summary": "1. 该工作证明了四维N=2共形超引力理论中存在等变闭形式，并用于计算高阶导数耦合超引力理论中超对称可观测量。\n2. 其方法无需求解运动方程即可获得闭式表达式，且在应用于全息对偶时，可给出在微扰1/N展开中任意阶有效的边界作用量结果。\n3. 这为高阶导数超引力理论的全息计算提供了系统框架，并有望推广至更广泛的超对称引力系统及其对偶场论的研究。", "summary_source": "deepseek", "authors": [{"name": "Pietro Benetti Genolini"}, {"name": "Florian Gaar"}, {"name": "Jerome P. Gauntlett"}, {"name": "James Sparks"}], "featured_authors": [{"name": "Pietro Benetti Genolini"}, {"name": "Florian Gaar"}, {"name": "Jerome P. Gauntlett"}, {"name": "James Sparks"}], "author_count": 4}, {"id": "2604.08658", "category": "hep-th", "title": "Differential Equations for Massive Correlators", "abstract": "We uncover a combinatorial structure governing the differential equations satisfied by wavefunction coefficients of scalar fields with generic masses in de Sitter space. Using an integral representation of the massive mode functions, we express the Feynman integrals underlying cosmological correlators as twisted integrals of rational functions. In this formulation, the integrals belong to a finite set of master integrals obeying a first-order system of differential equations, which can be derived efficiently in the time-integral representation. We show that these equations admit a simple graphical description in terms of graph tubings, which encode the couplings among basis functions and the evolution of singularities. This structure provides an efficient algorithm to derive the differential equations, and a boundary-centric perspective on massive cosmological correlators in which their analytic structure emerges from underlying combinatorial data. As an illustration, we solve the system in the limits of small and large masses.", "url": "https://arxiv.org/abs/2604.08658", "type": "理论", "summary": "1. 本文为德西特时空中任意质量标量场的波函数系数所满足的微分方程，揭示了一种支配性的组合结构，并发展了一套高效的求解方法。\n2. 关键突破在于利用图管状结构，为描述基函数耦合与奇异性演化的一阶微分方程组提供了简洁的图形化表述。\n3. 这一边界中心视角阐明了宇宙学关联函数的解析结构如何从组合数据中涌现，为系统性的解析研究奠定了基础。", "summary_source": "deepseek", "authors": [{"name": "Daniel Baumann"}, {"name": "Austin Joyce"}, {"name": "Hayden Lee"}, {"name": "Kamran Salehi Vaziri"}], "featured_authors": [{"name": "Daniel Baumann"}, {"name": "Austin Joyce"}, {"name": "Hayden Lee"}, {"name": "Kamran Salehi Vaziri"}], "author_count": 4}, {"id": "2604.08659", "category": "hep-th", "title": "A Lapse in the Cosmological Constant Problem", "abstract": "We present a new mechanism for addressing the cosmological constant problem based on global constraints arising from a lapse function in a higher-dimensional gravitational theory. Inspired by Horava-Lifshitz gravity, we consider a 5d spacetime with anisotropic scaling along a compact extra dimension, while preserving Lorentz invariance in four dimensions. In the deep infrared limit, variation with respect to the lapse generates a global constraint on the 4d geometry, closely analogous to that of vacuum energy sequestering. Although the resulting effective gravitational equations differ from standard sequestering, radiative contributions to the Standard Model vacuum energy are nevertheless cancelled at all orders.", "url": "https://arxiv.org/abs/2604.08659", "type": "理论", "summary": "1. 该工作提出了一种解决宇宙学常数问题的新机制，基于受Horava-Lifshitz引力启发的五维时空模型中流逝函数所诱导的全局约束。\n2. 其物理核心在于，在保持四维洛伦兹不变性的同时，通过紧致额外维上的各向异性标度，使深红外极限下流逝函数变分产生类似真空能量隔离的全局条件，从而全阶抵消标准模型真空能量的量子修正。\n3. 这一机制虽与标准隔离方案方程形式不同，但为宇宙学常数问题的非传统解决途径提供了理论框架，可能推动更高维引力与量子场论结合的研究。", "summary_source": "deepseek", "authors": [{"name": "Justin Khoury"}, {"name": "Benjamin Muntz"}, {"name": "Antonio Padilla"}], "featured_authors": [{"name": "Justin Khoury"}, {"name": "Benjamin Muntz"}, {"name": "Antonio Padilla"}], "author_count": 3}, {"id": "2604.08660", "category": "hep-th", "title": "On quantum tunnelling in the presence of Noether charges", "abstract": "We provide a complete first-principles based discussion of quantum tunnelling out of initial states carrying a conserved Noether charge. Our main result is a simple, unambiguous Euclidean-time prescription for the calculation of tunnelling rates out of such states. By relying on a combination of the direct approach and the steadyon framework for the evaluation of real-time path integrals, our derivation offers full transparency of its underlying assumptions, and is independent of any ad-hoc generalisations. This strategy also offers a simple explanation for the emergence of complex saddle points for such systems, justifying techniques postulated by earlier works. Our analysis furthermore offers the first results for initial states with both a conserved Noether charge and a non-trivial energy. We first illustrate the main conceptual points of our analysis for the simple example of a point particle in two spatial dimensions carrying a conserved angular momentum. Then, we generalise our results to the case of multiple dimensions and an arbitrary conserved Noether charge, providing an easy-to-implement prescription for the calculation of the tunnelling rate. We furthermore apply our results to the example of a complex scalar field subject to a global U(1)-symmetry with associated charge. These results provide a reliable foundation for the calculation of tunnelling rates in applications in finite-density and charge-asymmetric systems.", "url": "https://arxiv.org/abs/2604.08660", "type": "理论", "summary": "1. 该论文基于第一性原理完整阐述了从携带守恒Noether荷初始态进行量子隧穿的物理机制，并建立了计算此类隧穿率的明确欧几里得时间处方。\n2. 其技术核心在于融合直接方法与steadyon框架以处理实时间路径积分，确保了推导假设的完全透明性、无需特设推广，并首次给出了既有守恒Noether荷又有非平凡能量初始态的结果。\n3. 这为有限密度、电荷不对称系统等实际应用中的隧穿率计算提供了可靠理论基础，推动了相关量子多体理论与模拟研究的深入发展。", "summary_source": "deepseek", "authors": [{"name": "Giulio Barni"}, {"name": "Thomas Steingasser"}], "featured_authors": [{"name": "Giulio Barni"}, {"name": "Thomas Steingasser"}], "author_count": 2}, {"id": "2604.08670", "category": "hep-th", "title": "Effective strings and particles interacting in 3D: the Ising model", "abstract": "We study how a fluctuating domain wall in three dimensions modifies bulk observables in a gapped phase. We introduce an effective interaction between the wall and the lightest bulk massive mode, and identify the regime in which this description is controlled: nearly on-shell bulk exchange with small momentum along the wall. In this regime, several observables are controlled by a renormalized dimensionless coupling $\\lambda$, including the large-$L_z$ correction to the wall free energy and the large-$|x_\\perp|$ tail of two-point functions in the presence of the wall. Other observables, such as one-point functions and two-point functions in the nearby-regime, retain non-universal dependence on operator data and on the bulk spectral density. We test the universal kinematic consequences of wall fluctuations, and find good agreement with the predicted rough-wall broadening and nearby Gaussian behavior in Monte Carlo simulations of the 3D Ising model with anti-periodic boundary conditions.", "url": "https://arxiv.org/abs/2604.08670", "type": "理论", "summary": "1. 该工作通过引入畴壁与最轻体质量模的有效相互作用，研究了三维伊辛模型能隙相中涨落畴壁对体观测量的修正，并利用反周期边界条件的蒙特卡洛模拟进行检验。\n2. 其卖点在于确定了近壳层体交换与小壁面动量的可控区域，使得自由能的大Lz修正和两点函数大|x⊥|尾端由重整化无量纲耦合λ主导，且模拟结果与预言的粗糙壁展宽及近域高斯行为吻合。\n3. 这为理解能隙相中畴壁与体模耦合的普适运动学提供了理论框架，对有效弦描述及其他格点模型的后续研究具有启发意义。", "summary_source": "deepseek", "authors": [{"name": "J. M. Viana Parente Lopes"}, {"name": "José Matos"}, {"name": "Joao Penedones"}], "featured_authors": [{"name": "J. M. Viana Parente Lopes"}, {"name": "José Matos"}, {"name": "Joao Penedones"}], "author_count": 3}, {"id": "2604.08673", "category": "hep-th", "title": "Reduced superblocks at next-to-next-to-extremality for all half-maximally supersymmetric CFTs", "abstract": "We consider mixed four-point correlators of 1/2-BPS operators $\\phi_{k}$ in SCFTs with eight real Poincaré supercharges, namely the 3d $\\mathcal{N}=4$, 4d $\\mathcal{N}=2$, 5d $\\mathcal{N}=1$, and 6d $\\mathcal{N}=(1,0)$ theories. Using the basis of solutions to the superconformal Ward identity introduced in arXiv:hep-th/0405180 , we demonstrate that the dynamical data in mixed correlators of extremality $\\mathcal{E}=2$ is encoded in certain simpler ``reduced correlator\" functions that admit a block expansion, in close analogy to the recent result for maximally supersymmetric CFTs in arXiv:2601.15407 . These reduced blocks similarly involve ordinary blocks with shifted kinematics and reproduce what is known in 4d, generalize a known example in 6d, and offer novel results in 3d and 5d.", "url": "https://arxiv.org/abs/2604.08673", "type": "理论", "summary": "1. 该工作研究了具有八个实庞加莱超荷的各类半极大超对称共形场论中，1/2-BPS算子混合四点关联函数的超共形块展开问题。\n2. 其核心在于证明了当超对称极值度$\\mathcal{E}=2$时，混合关联函数的全部动力学数据可由一类更简单的“简化关联函数”完全编码，这些简化块涉及具有移动运动学的普通共形块。\n3. 这一结果为在3d、5d等维度系统研究1/2-BPS算子的非微扰动力学提供了统一的解析工具框架，并推广了4d和6d中的已知构造。", "summary_source": "deepseek", "authors": [{"name": "Mitchell Woolley"}], "featured_authors": [{"name": "Mitchell Woolley"}], "author_count": 1}, {"id": "2604.08725", "category": "hep-th", "title": "Harmonic Analysis of the Instanton Prepotential", "abstract": "Discrete symmetries of Calabi-Yau moduli spaces, generated by isomorphic flops, constrain the instanton expansion of the 4D $\\mathcal{N}=2$ Type~IIA prepotential. We show that the Coxeter-invariant functions into which the prepotential organizes are eigenfunctions of a Laplace-Beltrami operator built from the Coxeter-invariant symmetric bilinear form on the moduli space. This means that the Gromov-Witten expansion can be interpreted as a superposition of waves propagating on the Coxeter quotient of the moduli space, and its resummation is the corresponding spectral decomposition. For the dihedral Coxeter groups, separation of variables in the eigenvalue equation explains from first principles why special modified Bessel functions, ordinary Bessel functions and Jacobi theta functions appear as the natural building blocks of the prepotential, depending on whether the Coxeter rotation acts hyperbolically, elliptically, or parabolically. The resulting spectral representations converge efficiently in the interior of the moduli space, complementing the standard large-volume instanton expansion.", "url": "https://arxiv.org/abs/2604.08725", "type": "理论", "summary": "1. 该论文证明了四维N=2型IIA理论预势的瞬子展开所组织的Coxeter不变函数，是由模空间上Coxeter不变对称双线性形式构造的Laplace-Beltrami算符的本征函数。\n2. 核心物理图像在于Gromov-Witten展开可诠释为在模空间的Coxeter商空间上传播的波叠加，其重求和即对应谱分解，这为不同Coxeter旋转作用（双曲、椭圆、抛物）下特殊函数（修正贝塞尔、普通贝塞尔、雅可比theta函数）的自然出现提供了第一性原理解释。\n3. 由此建立的谱表示在模空间内部区域高效收敛，有效补充了传统大体积瞬子展开，为处理模空间全域的预势计算提供了新工具。", "summary_source": "deepseek", "authors": [{"name": "Rafael Álvarez-García"}, {"name": "Fabian Ruehle"}], "featured_authors": [{"name": "Rafael Álvarez-García"}, {"name": "Fabian Ruehle"}], "author_count": 2}, {"id": "2604.09126", "category": "hep-th", "title": "Lattice Realizations of Flat Gauging and T-duality Defects at Any Radius", "abstract": "We analyze non-invertible topological interfaces and defects in the two-dimensional compact boson, focusing on the more exotic ones obtained by gauging continuous symmetries with flat connections on a half-space. These include interfaces between mutually irrational radii and T-duality symmetries at arbitrary boson radius. Using the modified Villain discretization on both a Euclidean two-dimensional square lattice and a quantum one-dimensional chain, we show that all these topological interfaces survive discretization and give rise to non-compact edge modes localized at the defect sites. Such non-compact edge modes imply a continuous defect spectrum and an infinite quantum dimension. In the special case of rational radii, we show how the defect action or Hamiltonian can be modified in order to compactify the edge modes and produce more standard defects with finite quantum dimension.", "url": "https://arxiv.org/abs/2604.09126", "type": "理论", "summary": "1. 该工作利用改进的Villain离散化方法，在二维方格与一维量子链上实现了任意半径下二维紧致玻色子的平坦规范对称性与T-对偶缺陷的格点模型。\n2. 核心物理在于揭示了这些拓扑界面在离散化后依然存在，并导致局域于缺陷的非紧致边缘模，从而产生连续的缺陷能谱与无限的量子维度。\n3. 这为在更广泛的格点模型与对称性框架中，通过调控缺陷作用量来设计具有特定量子维度的拓扑缺陷提供了明确的实现方案与理论依据。", "summary_source": "deepseek", "authors": [{"name": "Riccardo Argurio"}, {"name": "Giovanni Galati"}, {"name": "Nathan Godechal"}], "featured_authors": [{"name": "Riccardo Argurio"}, {"name": "Giovanni Galati"}, {"name": "Nathan Godechal"}], "author_count": 3}, {"id": "2604.09137", "category": "hep-th", "title": "Consistent Truncations from Duality Symmetries and Desingularization of Orbifold Uplifts", "abstract": "This paper is an extension of the results presented in \\cite{Guarino:2024gke}. We study $ G_S$-invariant subsectors of maximal gauged supergravities and show that such models can provide consistent truncations even when $G_S$ is not a symmetry of the original supergravity. We show that this construction is key to building pure supergravities around a supersymmetric AdS$_D$ solution. We illustrate this construction by building a consistent $\\mathcal{N}=4$ subsector of the $D=4$ $\\mathcal{N}=8$ $[\\mathrm{SO}(6)\\times \\mathrm{SO}(1,1)]\\ltimes \\mathbb{R}^{12}$ gauged supergravity. We use this result to build the uplift of the multicharge spindle solutions in type IIB and we define a simple criterion for assessing the regularity of the uplift. We show that the type IIB uplift of the spindle is always non-regular, admitting eight codimension-six orbifold singularities. We apply the same criterion to other spindle uplifts, recovering known results and making predictions on the regularity of spindles on (quasi-)regular SE$_7$ manifolds.", "url": "https://arxiv.org/abs/2604.09137", "type": "理论", "summary": "1. 本文通过研究最大规范超引力中 $G_S$ 不变子扇区，构建了非对称性下的自洽截断，并以此实现了类型IIB理论中多荷纺锤体解的提升。\n2. 其核心在于证明 $G_S$ 即使非原理论对称性也能产生自洽截断，并提出了一个判定升维解正则性的简明几何准则。\n3. 该准则不仅解释了纺锤体升维必然产生八个余维六轨形奇点，还可推广至（拟）正则Sasaki-Einstein七维流形上的纺锤体正则性分析。", "summary_source": "deepseek", "authors": [{"name": "Anik Rudra"}, {"name": "Colin Sterckx"}, {"name": "Mario Trigiante"}], "featured_authors": [{"name": "Anik Rudra"}, {"name": "Colin Sterckx"}, {"name": "Mario Trigiante"}], "author_count": 3}, {"id": "2604.09170", "category": "hep-th", "title": "Covariant scalar-tensor theories beyond second derivatives", "abstract": "We propose a covariant, gauge-independent construction of foliation-based scalar-tensor theories, yielding diffeomorphism-invariant operators involving only gradients on the hypersurfaces where the scalar field is constant, assumed to be spacelike. This defines a basis of independent invariants up to four derivatives of $\\phi$, including the first nontrivial parity-odd pseudoscalar at this order, with a straightforward extension to higher derivatives. Our framework goes beyond degenerate higher-order scalar-tensor (DHOST) theories and provides a nonlinear extension of U-DHOST (where $\\nabla_\\mu\\phi$ is supposed to be timelike) directly in covariant form, without using unitary gauge as a starting point or imposing degeneracy a priori. After minimal coupling to gravity, we analyze the theory through its Hamiltonian constraint structure and linear cosmological perturbations about an FLRW background, and show that it propagates three physical degrees of freedom.", "url": "https://arxiv.org/abs/2604.09170", "type": "理论", "summary": "1. 本文提出了一种超越二阶导数的协变标量-张量理论构造，该构造基于标量场等值面的叶状结构，并以协变、规范独立的方式实现。\n2. 其核心创新在于不依赖幺正规范或预先引入简并条件，直接给出了包含四阶导数及首个非平凡宇称奇赝标量的非线性协变形式，从而推广了DHOST与U-DHOST理论框架。\n3. 该理论在FLRW背景的线性宇宙学扰动中展现出三个物理自由度，为研究高阶导数标量-张量引力及其宇宙学应用提供了系统且可扩展的协变基础。", "summary_source": "deepseek", "authors": [{"name": "Mohammad Ali Gorji"}, {"name": "Pavel Petrov"}, {"name": "Karim Noui"}], "featured_authors": [{"name": "Mohammad Ali Gorji"}, {"name": "Pavel Petrov"}, {"name": "Karim Noui"}], "author_count": 3}, {"id": "2604.09275", "category": "hep-th", "title": "Aspects of Non-Relativistic Supersymmetric Theories", "abstract": "Over the last decade, non-relativistic theories have attracted considerable attention. In general, such theories can be obtained by contracting relativistic parent theories. In this work, we discuss features of non-relativistic supersymmetric field theories from both the Galilean and Carrollian points of view that may be useful for constructing electric and magnetic non-relativistic theories.", "url": "https://arxiv.org/abs/2604.09275", "type": "理论", "summary": "1. 本文从伽利略与卡罗尔两种极限视角，系统研究了非相对论超对称场论的结构特征。\n2. 其核心在于阐明了这两种对偶性框架如何分别导向构建电型与磁型非相对论理论的关键对应关系。\n3. 这为系统探索更广泛的非相对论超对称结构及其在凝聚态与量子引力中的潜在应用提供了新途径。", "summary_source": "deepseek", "authors": [{"name": "Osman Ergec"}], "featured_authors": [{"name": "Osman Ergec"}], "author_count": 1}, {"id": "2604.09381", "category": "hep-th", "title": "Fermionic Casimir effect in an axial Lorentz-violating background", "abstract": "We investigate the fermionic Casimir effect for a Dirac field confined between two parallel plates with MIT bag boundary conditions in the presence of CPT-odd Lorentz-symmetry violation described by a constant axial background vector $b_{\\mu}$. The exact mode quantization is derived from the modified Dirac equation in the planar geometry, and the vacuum energy is formulated through a phase-shift representation. For spacelike backgrounds we show that the components parallel to the plates can be absorbed into a shift of the transverse momenta and therefore do not affect the renormalized Casimir energy, while the component normal to the plates modifies the longitudinal spectrum and produces a genuine Lorentz-violating correction. Both the timelike component $b_{0}$ and the normal spacelike component $b_{z}$ can thus be treated within a unified framework characterized by a single effective spectral parameter. A closed logarithmic integral representation for the Casimir energy is obtained and its behavior is analyzed in the Lorentz-symmetric, weak-background, and strong-background regimes.", "url": "https://arxiv.org/abs/2604.09381", "type": "理论", "summary": "1. 该工作研究了在恒定轴向背景矢量b_μ描述的CPT破缺洛伦兹对称性破坏下，具有MIT袋边界条件的狄拉克场在平行板间的费米子卡西米尔效应。\n2. 其核心发现在于：平行于板的分量可吸收为横向动量平移而不影响重整化能量，而垂直于板的分量会修正纵向能谱并产生真正的洛伦兹破坏修正，时间分量b_0与法向空间分量b_z可通过单一有效谱参数统一处理。\n3. 所获得的卡西米尔能量闭合对数积分表达式及其在洛伦兹对称、弱背景和强背景区间的行为分析，为洛伦兹破坏理论中的量子场论修正提供了可拓展的计算框架。", "summary_source": "deepseek", "authors": [{"name": "A. Martín-Ruiz"}, {"name": "M. B. Cruz"}, {"name": "E. R. Bezerra de Mello"}], "featured_authors": [{"name": "A. Martín-Ruiz"}, {"name": "M. B. Cruz"}, {"name": "E. R. Bezerra de Mello"}], "author_count": 3}, {"id": "2604.09396", "category": "hep-th", "title": "The many facets of a hyperbolic tetrahedron: open and closed triangulations of 3d
