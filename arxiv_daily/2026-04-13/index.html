gravity", "abstract": "We study a model of 3d gravity relevant to the open sector of a CFT ensemble. The quantum theory is the open Virasoro TQFT, obtained by restricting the full open-closed Virasoro TQFT to a subclass of admissible manifolds. We show that it computes gravitational path integrals on compact regions with fixed-length boundary conditions for states above the black hole threshold, and fixed-angle boundary conditions for states below the threshold. Focusing on a special class of manifolds involving only boundary Wilson loops, we further show that the relation between Conformal Turaev-Viro theory and the diagonal sector of two copies of Virasoro TQFT arises naturally from an open-closed duality.", "url": "https://arxiv.org/abs/2604.09396", "type": "理论", "summary": "1. 该工作研究了与共形场论系综开放扇区相关的三维引力模型，利用开放Virasoro拓扑量子场论计算了具有特定边界条件的紧致区域上的引力路径积分。\n2. 其技术要点在于阐明了黑洞阈值以上态采用固定长度边界条件、阈值以下态采用固定角度边界条件，并通过开放-闭合对偶自然导出共形Turaev-Viro理论与两个Virasoro拓扑量子场论副本对角部分的关系。\n3. 这为理解三维量子引力中边界条件与内部几何的对应关系提供了严格框架，并为相关共形场论系综的微观状态计算奠定了理论基础。", "summary_source": "deepseek", "authors": [{"name": "Daniel L. Jafferis"}, {"name": "Diandian Wang"}], "featured_authors": [{"name": "Daniel L. Jafferis"}, {"name": "Diandian Wang"}], "author_count": 2}, {"id": "2604.09400", "category": "hep-th", "title": "Space- vs Time-dependence in taming the infrared instability of projectable Ho\\v rava Gravity", "abstract": "Minkowski spacetime exhibits infrared instability in projectable Ho\\v rava gravity in (3+1) dimensions. To be phenomenologically viable, the instability should be either hidden by other time-dependent processes such as the Hubble expansion of the universe and the Jeans instability, or evolve into another static solution with low average curvature. While the former scenario leads to a phenomenological constraint on the infrared properties of the renormalization group flow, this paper explores the latter possibility. We study if the presence of higher derivative terms in the action can lead to existence of static, inhomogeneous (quasi-) periodic solutions with planar symmetry, similar to modulated phases in magnetic materials. We find that such solutions do not exist. In doing so, we classify all static homogeneous and isotropic solutions and solutions with planar symmetry. We provide arguments that none of them can serve as an endpoint for the evolution of the Minkowski instability. This motivates further study of the scenario where the instability is concealed by time evolution.", "url": "https://arxiv.org/abs/2604.09400", "type": "理论", "summary": "1. 本文研究了投影型Hořava引力中Minkowski时空红外不稳定性演化为静态非均匀解的可能性。\n2. 通过分析含高阶导数项的作用量，证明具有平面对称性的静态准周期解不存在，并完整分类了所有静态齐次各向同性解与平面对称解。\n3. 这一否定结果强化了对时间依赖过程（如宇宙膨胀或Jeans不稳定性）掩盖该红外不稳定性的研究动机。", "summary_source": "deepseek", "authors": [{"name": "Shinji Mukohyama"}, {"name": "Jury Radkovski"}, {"name": "Sergey Sibiryakov"}], "featured_authors": [{"name": "Shinji Mukohyama"}, {"name": "Jury Radkovski"}, {"name": "Sergey Sibiryakov"}], "author_count": 3}, {"id": "2604.09428", "category": "hep-th", "title": "D2-brane probes of non-toric cDV threefolds via monopole superpotentials", "abstract": "We develop a framework to construct worldvolume gauge theories on D2-branes probing compound Du Val (cDV) Calabi-Yau threefold singularities. By viewing these singularities as ADE surface fibrations over the complex $w$-plane, we encode their geometry in a Higgs field $\\Phi(w)$. A D2-brane probe perceives $\\Phi(w)$ as an $\\mathcal{N}=2$ deformation of its 3d $\\mathcal{N}=4$ affine Dynkin quiver gauge theory via polynomial and monopole superpotential terms. By exploiting 3d mirror symmetry, we obtain an effective theory that correctly reproduces the quiver-collapsing mechanism known in the mathematical literature. We present several examples, including non-toric and non-resolvable cases.", "url": "https://arxiv.org/abs/2604.09428", "type": "理论", "summary": "1. 本研究构建了探索复合Du Val（cDV）卡拉比-丘三维奇点的D2膜世界体规范理论框架。\n2. 通过将奇点视为复w平面上的ADE曲面纤维化，并将其几何编码为希格斯场Φ(w)，该工作利用三维镜像对称获得了有效理论，准确再现了数学文献中的箭图坍缩机制。\n3. 此方法将已知的环形奇点研究方法推广至非环形及不可分解情形，为研究更广泛的奇异几何与规范理论对偶提供了新途径。", "summary_source": "deepseek", "authors": [{"name": "Andrés Collinucci"}, {"name": "Marina Moleti"}, {"name": "Roberto Valandro"}], "featured_authors": [{"name": "Andrés Collinucci"}, {"name": "Marina Moleti"}, {"name": "Roberto Valandro"}], "author_count": 3}, {"id": "2604.09456", "category": "hep-th", "title": "Relativistic single-electron wavepacket in quantum electromagnetic fields II: Quantum radiation emitted by a uniformly accelerated electron", "abstract": "We compute the quantum radiation emitted by wavepackets of relativistic single electrons, both at rest and undergoing uniform acceleration in the Minkowski vacuum of the electromagnetic field. We find that the cubic terms in the original nonlinear action of electrodynamics should be considered in obtaining the quantum radiation to the leading order. We show that the quantum radiation from a single-electron wavepacket at rest vanishes exactly. For a uniformly accelerated electron, the quantum radiated power has secular growth in the long-time regime. We demonstrate that this secular growth has a classical interpretation, and argue that the resummed quantum radiation at late times would not diverge. Regarding experimental proposals for the detection of the Unruh effect from the quantum radiation in the `blind spots' of classical radiation we ascertain that quantum corrections in the two blind spots are fully contributed by the transverse deviation correlators, where the dominant contributions are irrelevant to the Unruh effect in electron microscopes.", "url": "https://arxiv.org/abs/2604.09456", "type": "理论", "summary": "1. 该工作计算了相对论性单电子波包（包括静止与匀加速情形）在电磁场闵氏真空中发射的量子辐射。\n2. 关键发现是：为得到领头阶量子辐射必须考虑电动力学原始非线性作用量中的三次项，且匀加速电子的量子辐射功率在长时间区域呈现具有经典解释的长期增长。\n3. 这澄清了在经典辐射“盲点”探测安鲁效应的实验提案中，横向偏差关联子主导的量子修正实际上与电子显微镜中的安鲁效应无关。", "summary_source": "deepseek", "authors": [{"name": "Shih-Yuin Lin"}, {"name": "Bei-Lok Hu"}], "featured_authors": [{"name": "Shih-Yuin Lin"}, {"name": "Bei-Lok Hu"}], "author_count": 2}, {"id": "2604.09490", "category": "hep-th", "title": "The superconformal index and localizing higher derivative supergravity", "abstract": "We show how equivariant localization can be used to compute the on-shell action for supersymmetric $D=5$ $AdS$ rotating, charged black holes in theories of supergravity with higher derivatives. An exact match with a dual field theory computation of the superconformal index in a Cardy-like limit is achieved.", "url": "https://arxiv.org/abs/2604.09490", "type": "理论", "summary": "1. 该工作运用等变化局域化方法，计算了含有高阶导数项的D=5超引力理论中旋转带电AdS黑洞的壳上作用量。\n2. 其核心成果在于超引力计算结果与对偶场论在类Cardy极限下的超共形指数精确匹配，验证了全息对偶的微观机制。\n3. 这为在高阶导数超引力乃至更一般的引力理论框架下，精确检验全息对偶与微观态计数开辟了系统化途径。", "summary_source": "deepseek", "authors": [{"name": "Florian Gaar"}, {"name": "Jerome P. Gauntlett"}, {"name": "Jaeha Park"}, {"name": "James Sparks"}], "featured_authors": [{"name": "Florian Gaar"}, {"name": "Jerome P. Gauntlett"}, {"name": "Jaeha Park"}, {"name": "James Sparks"}], "author_count": 4}, {"id": "2604.09500", "category": "hep-th", "title": "Conservation laws in Lie-Poisson classical field theories", "abstract": "Lie-Poisson classical field theory is a field-theoretical model embedded in a non-commutative structure related to the framework of Poisson electrodynamics. In this paper, we follow the recently developed action principle for Lie-Poisson electrodynamics to derive the conservation laws of the theory. The energy-momentum tensor is obtained, along with the conserved electric charge and the momentum operator. We consider non-interacting examples for real and complex scalar fields, as well as the Dirac field, within the $\\kappa$-Minkowski spacetime framework. In the latter case, we show that the non-relativistic limit for the $\\kappa$-Minkowski Dirac equation introduces an orbital Zeeman coupling term for the fermionic fields, and the energy shift in the first excited state depends exclusively on the $\\kappa$-parameter.", "url": "https://arxiv.org/abs/2604.09500", "type": "理论", "summary": "1. 该工作基于李-泊松电动力学的近期作用量原理，推导了该经典场论框架下的守恒定律，包括能量-动量张量、守恒电荷及动量算符。\n2. 通过κ-闵可夫斯基时空中的狄拉克场非相对论极限，揭示了轨道塞曼耦合项的出现，且第一激发态能移仅依赖于κ参数。\n3. 这为研究κ变形非对易几何中的能级结构及其对量子场论可能产生的普适性修正提供了具体线索。", "summary_source": "deepseek", "authors": [{"name": "O. Abla"}, {"name": "M. J. Neves"}], "featured_authors": [{"name": "O. Abla"}, {"name": "M. J. Neves"}], "author_count": 2}, {"id": "2604.09503", "category": "hep-th", "title": "Classification of 2D Fermionic Systems with a $\\mathbb Z_2$ Flavor Symmetry", "abstract": "We classify superfusion categories describing two-dimensional fermionic systems equipped with the universal fermion-parity symmetry, implemented by a topological defect line (TDL) $Z$, and an additional $\\mathbb{Z}_2$ flavor symmetry generated by a $W$ TDL. Depending on whether $W$ is m-type or q-type, its fusion rules lead to three distinct classes, and solving the super-pentagon equations yields 16 consistent superfusion categories. These are labeled by invariants $(\\nu_W,\\nu_Z,\\nu_{WZ})$, which determine the $\\mathbb{Z}_8$ anomaly classes of the symmetries generated by $W$, $Z$, and $WZ$. We also provide explicit realizations using multiple Majorana fermions and comment on implications for fermionic CFTs and gapped phases.", "url": "https://arxiv.org/abs/2604.09503", "type": "理论", "summary": "1. 该工作对配备普适费米子宇称对称性（由拓扑缺陷线Z实现）及额外Z2味对称性（由拓扑缺陷线W生成）的二维费米子系统进行了超融合范畴分类。\n2. 核心在于通过求解超五边形方程得到16个一致的超融合范畴，并由不变量(ν_W,ν_Z,ν_{WZ)完全刻画W、Z和WZ生成对称性的Z8反常类。\n3. 这为基于多重马约拉纳费米子的具体实现提供了框架，并对费米子共形场论及有能隙相的研究具有明确启示。", "summary_source": "deepseek", "authors": [{"name": "Chi-Ming Chang"}, {"name": "Jin Chen"}, {"name": "Fengjun Xu"}], "featured_authors": [{"name": "Chi-Ming Chang"}, {"name": "Jin Chen"}, {"name": "Fengjun Xu"}], "author_count": 3}, {"id": "2604.09422", "category": "math-ph", "title": "Periodicity in Ergodic Quantum Processes", "abstract": "We study the periodic properties of sequences of quantum channels sampled from an ergodic stochastic process satisfying a natural irreducibility condition. We relate these periodic properties to certain global spectral data defined by the sequence of quantum channels, proving a general Perron-Frobenius-type theorem. We give examples to motivate the theory and conclude with some open problems and conjectures.", "url": "https://arxiv.org/abs/2604.09422", "type": "理论", "summary": "1. 该工作研究了满足自然不可约条件的遍历随机过程中量子信道序列的周期性性质。\n2. 其卖点在于将周期性关联于全局谱数据，并证明了一个广义的Perron-Frobenius型定理。\n3. 这通过示例和开放问题为量子过程周期性的理论探索提供了明确启示。", "summary_source": "deepseek", "authors": [{"name": "Owen Ekblad"}, {"name": "Jeffrey Schenker"}], "featured_authors": [{"name": "Owen Ekblad"}, {"name": "Jeffrey Schenker"}], "author_count": 2}, {"id": "2604.09432", "category": "math-ph", "title": "Heat and thermal travelling wave solutions of a nonlinear Maxwell-Cattaneo-Vernotte equation", "abstract": "The propagation of heat and thermal signals in the form of travelling waves is investigated for a nonlinear Maxwell-Cattaneo-Vernotte equation. The exact wave solutions are derived by expressing the thermal conductivity and the relaxation time as polynomial functions of the temperature. This approach enables the identification of suitable degrees of nonlinearity that give rise to soliton solutions. Finally, exact solutions are shown through plots for the values of the selected parameters.", "url": "https://arxiv.org/abs/2604.09432", "type": "理论", "summary": "1. 该工作研究了非线性Maxwell-Cattaneo-Vernotte方程中热与热信号以行波形式的传播问题，并导出了精确的行波解。\n2. 其核心方法是将热导率和弛豫时间表达为温度的多项式函数，从而识别出能够产生孤子解的合适非线性度。\n3. 这为分析非线性非傅里叶热传导中的热波现象提供了精确的解析框架和参数选择依据。", "summary_source": "deepseek", "authors": [{"name": "Munafò Carmelo Filippo"}, {"name": "Rogolino Patrizia"}, {"name": "Sciacca Michele"}], "featured_authors": [{"name": "Munafò Carmelo Filippo"}, {"name": "Rogolino Patrizia"}, {"name": "Sciacca Michele"}], "author_count": 3}, {"id": "2604.08661", "category": "quant-ph", "title": "Geometry-Induced Long-Range Correlations in Recurrent Neural Network Quantum States", "abstract": "Neural Quantum States based on autoregressive recurrent neural network (RNN) wave functions enable efficient sampling without Markov-chain autocorrelation, but standard RNN architectures are biased toward finite-length correlations and can fail on states with long-range dependencies. A common response is to adopt transformer-style self-attention, but this typically comes with substantially higher computational and memory overhead. Here we introduce dilated RNN wave functions, where recurrent units access distant sites through dilated connections, injecting an explicit long-range inductive bias while retaining a favorable $\\mathcal{O}(N \\log N)$ forward pass scaling. We show analytically that dilation changes the correlation geometry and can induce power-law correlation scaling in a simplified linearized and perturbative setting. Numerically, for the critical 1D transverse-field Ising model, dilated RNNs reproduce the expected power-law connected two-point correlations in contrast to the exponential decay typical of conventional RNN ansätze. We further show that the dilated RNN accurately approximates the one-dimensional Cluster state, a paradigmatic example with long-range conditional correlations that has previously been reported to be challenging for RNN-based wave functions. These results highlight dilation as a simple geometric mechanism for building correlation-aware autoregressive neural quantum states.", "url": "https://arxiv.org/abs/2604.08661", "type": "理论+数值", "summary": "1. 该工作提出了基于膨胀循环神经网络（RNN）的扩张RNN波函数，用以增强自回归神经量子态的长程关联表达能力。\n2. 其技术核心在于通过引入膨胀连接改变关联几何结构，在保持计算复杂度优势的同时，理论上可实现幂律关联，并在横场伊辛模型和簇态中得到数值验证。\n3. 这为构建具有明确关联偏置的自回归神经量子态提供了一种简洁的几何机制，有望应用于其他具有长程依赖的量子多体系统模拟。", "summary_source": "deepseek", "authors": [{"name": "Asif Bin Ayub"}, {"name": "Amine Mohamed Aboussalah"}, {"name": "Mohamed Hibat-Allah"}], "featured_authors": [{"name": "Asif Bin Ayub"}, {"name": "Amine Mohamed Aboussalah"}, {"name": "Mohamed Hibat-Allah"}], "author_count": 3}, {"id": "2604.08672", "category": "quant-ph", "title": "Hardware-Efficient Erasure Qubits With Superconducting Transmon Qutrits", "abstract": "Quantum error correction using erasure qubits offers higher fault-tolerant thresholds and improved scaling by converting dominant physical errors into detectable erasures. In superconducting circuits, erasure qubits can be constructed using the dual-rail approach, which, however, requires additional qubit-count overhead and tailored coupling elements. Here, we demonstrate a hardware-efficient scheme that operates transmon qutrits as erasure qubits, which is compatible with standard superconducting circuit-QED hardware. The logical states $\\ket{0_\\text{L}}$ and $\\ket{1_\\text{L}}$ are represented by the ground and second excited states, while the dominant relaxation errors can be detected via an ancilla qubit using a microwave-activated two-qutrit SWAP gate. We demonstrate a logical qubit $T_1$ lifetime exceeding $500\\,\\mu\\mathrm{s}$, post-selected with repeated mid-circuit erasure detection, which is ten times longer than the $T_1$ time of the transmon physical qubit. Coherence times beyond $300\\,\\mu\\mathrm{s}$ are achieved using dynamical decoupling. Single-qubit gate operations reach average Clifford gate infidelity on the order of $10^{-4}$. We further demonstrate dual-purposing an ancilla qubit for both erasure detection and parity checking, showing heralded generation of Bell states between erasure qubits. These results suggest that mainstream architectures of transmon qubit arrays may already be capable of implementing erasure-based QEC strategies for hardware-efficient fault-tolerant quantum computing.", "url": "https://arxiv.org/abs/2604.08672", "type": "理论", "summary": "1. 该工作演示了利用超导transmon三能级系统作为擦除量子比特的硬件高效方案。\n2. 其技术核心在于以基态与第二激发态编码逻辑态，并通过微波激活的双三能级SWAP门实现辅量子比特辅助的弛豫错误检测。\n3. 这表明主流的transmon量子比特阵列架构已具备实现基于擦除错误的硬件高效容错量子计算的潜力。", "summary_source": "deepseek", "authors": [{"name": "Bao-Jie Liu"}, {"name": "Ying-Ying Wang"}, {"name": "Yu-Xin Wang"}, {"name": "Manthan Badbaria"}, {"name": "Shruti Puri"}, {"name": "Chen Wang"}], "featured_authors": [{"name": "Bao-Jie Liu"}, {"name": "Ying-Ying Wang"}, {"name": "Yu-Xin Wang"}, {"name": "Manthan Badbaria"}, {"name": "Shruti Puri"}, {"name": "Chen Wang"}], "author_count": 6}, {"id": "2604.08674", "category": "quant-ph", "title": "The MQT Compiler Collection: A Blueprint for a Future-Proof Quantum-Classical Compilation Framework", "abstract": "As the capabilities of quantum computing hardware continue to rise, algorithms that exploit them are becoming increasingly complex. These developments increase the need for sophisticated compilation frameworks that translate high-level algorithms into executable code. In the past, most solutions were built with a quantum-first approach and handled mostly pure quantum programs without classical elements such as structured control flow. However, developments in quantum algorithms, error correction, and optimization, as well as the integration into high-performance computing (HPC) environments, depend on such classical elements. As quantum-first approaches increasingly struggle to handle these concepts, classical-first approaches are becoming a promising alternative. In this work, we present the MQT Compiler Collection, a blueprint for a future-proof quantum-classical compilation framework built on the Multi-Level Intermediate Representation (MLIR). After years of experience with the quantum-first approach and its shortcomings, we propose a framework that embraces core MLIR concepts to support the full compilation pipeline from high-level algorithms to hardware-specific instructions. The proposed architecture is designed from the ground up to support complex optimizations beyond, e.g., simple gate cancellation. It is publicly available at this https URL .", "url": "https://arxiv.org/abs/2604.08674", "type": "理论+数值", "summary": "1. 该工作提出了基于多级中间表示（MLIR）的MQT编译集合，作为一个面向未来的量子-经典混合编译框架蓝图。\n2. 其核心在于从“量子优先”转向“经典优先”的设计范式，利用MLIR原生支持包含结构化控制流的混合程序的全流程编译与复杂优化。\n3. 这一架构为应对量子算法、纠错及与高性能计算环境集成等长远挑战提供了可扩展的基础，推动了编译工具链的范式演进。", "summary_source": "deepseek", "authors": [{"name": "Lukas Burgholzer"}, {"name": "Daniel Haag"}, {"name": "Yannick Stade"}, {"name": "Damian Rovara"}, {"name": "Patrick Hopf"}, {"name": "Robert Wille"}], "featured_authors": [{"name": "Lukas Burgholzer"}, {"name": "Daniel Haag"}, {"name": "Yannick Stade"}, {"name": "Damian Rovara"}, {"name": "Patrick Hopf"}, {"name": "Robert Wille"}], "author_count": 6}, {"id": "2604.08692", "category": "quant-ph", "title": "Arqon: A suite of control applications enabling a reliable quantum network", "abstract": "A quantum network's purpose is to enable users to execute applications on end nodes. This requires the network to provide the service of creating entangled links between those nodes. Users of mature networks, such as the internet or the telephone network expect accepted service demands to be met reliably. We first define reliability requirements that extend classical computer network concepts to quantum network service delivery. We then introduce Arqon, a suite of control applications designed to deliver reliable service in centrally controlled quantum networks. We demonstrate through both analytic and numerical evaluation that Arqon satisfies all reliability requirements for accepted demands. These evaluations consider static network topologies. We provide a complete Python implementation and perform complexity analysis showing that admission control scales as $O(k^3)$ in the number of incoming demands $k$ and schedule computation scales as ${O(N^3)}$ in the number of accepted demands to schedule $N$.", "url": "https://arxiv.org/abs/2604.08692", "type": "数值", "summary": "1. 该工作设计了Arqon控制应用程序套件，用于在中心化量子网络中保障端节点间纠缠链路建立服务的可靠性。\n2. 其技术核心在于将经典网络可靠性要求扩展至量子服务交付，并通过可扩展的准入控制与调度算法实现理论验证。\n3. 这为动态拓扑量子网络的可靠控制及与特定硬件平台的集成提供了明确的技术框架与发展方向。", "summary_source": "deepseek", "authors": [{"name": "Scarlett Gauthier"}, {"name": "Thomas R. Beauchamp"}, {"name": "Stephanie Wehner"}], "featured_authors": [{"name": "Scarlett Gauthier"}, {"name": "Thomas R. Beauchamp"}, {"name": "Stephanie Wehner"}], "author_count": 3}, {"id": "2604.08763", "category": "quant-ph", "title": "Weak Adversarial Neural Pushforward Method for the Wigner Transport Equation", "abstract": "We extend the Weak Adversarial Neural Pushforward Method to the Wigner transport equation governing the phase-space dynamics of quantum systems. The central contribution is a structural observation: integrating the nonlocal pseudo-differential potential operator against plane-wave test functions produces a Dirac delta that exactly inverts the Fourier transform defining the Wigner potential kernel, reducing the operator to a pointwise finite difference of the potential at two shifted arguments. This holds in arbitrary dimension, requires no truncation of the Moyal series, and treats the potential as a black-box function oracle with no derivative information. To handle the negativity of the Wigner quasi-probability distribution, we introduce a signed pushforward architecture that decomposes the solution into two non-negative phase-space distributions mixed with a learnable weight. The resulting method inherits the mesh-free, Jacobian-free, and scalable properties of the original framework while extending it to the quantum setting.", "url": "https://arxiv.org/abs/2604.08763", "type": "理论", "summary": "1. 该工作将弱对抗神经推送方法拓展至描述量子系统相空间动力学的维格纳输运方程。\n2. 其核心在于通过平面波测试函数与非局域伪微分势算符的作用，将后者简化为两点有限差分，并设计了带符号的推送架构以处理准概率分布的负值性。\n3. 这一方法保留了原框架无网格、无需雅可比矩阵及可扩展的特性，为高维量子系统的数值模拟提供了一条新途径。", "summary_source": "deepseek", "authors": [{"name": "Andrew Qing He"}, {"name": "Wei Cai"}, {"name": "Sihong Shao"}], "featured_authors": [{"name": "Andrew Qing He"}, {"name": "Wei Cai"}, {"name": "Sihong Shao"}], "author_count": 3}, {"id": "2604.08852", "category": "quant-ph", "title": "Comparison of the standard and dressed-picture master equations for the quantum Rabi model in the ultrastrong coupling regime", "abstract": "The goal of this chapter is to investigate the effects of relaxation and dephasing on the quantum Rabi model in the ultrastrong coupling regime, and to provide explicit formulas to implement and numerically solve the resulting nonunitary dynamics from first principles. The quantum Rabi model constitutes the most fundamental description of light-matter interaction, describing a single two-level system coupled to a single mode of a quantized cavity field. The ultrastrong coupling regime is typically defined by $g \\gtrsim 0.1\\omega$, where $\\omega$ denotes the cavity-mode frequency. In this regime, the standard master equation of quantum optics -- commonly referred to as the Gorini-Kossakowski-Sudarshan-Lindblad (GKSL) master equation -- becomes inaccurate. The reason is that strong light-matter interaction hybridizes the bare atom and field states, so that dissipation cannot be consistently described in the uncoupled basis. A consistent treatment must therefore incorporate this hybridization directly into the dissipative terms. One such approach is the dressed-picture Markovian master equation derived by Beaudoin, Gambetta, and Blais, in which the qubit-field interaction is explicitly included in the construction of the system-bath coupling operators. In this chapter, we numerically solve both the GKSL master equation and the dressed master equation (DME) for various initial field states, including coherent, odd Schrödinger cat, squeezed vacuum, squeezed coherent, and thermal states. We also examine photon generation from the vacuum induced by external time-dependent modulation of the qubit parameters, as well as multiphoton Rabi oscillations for an initially excited qubit. Two reservoir spectral densities are considered: white and Ohmic noise. The differences between the two approaches are illustrated through numerical results for several physical observables.", "url": "https://arxiv.org/abs/2604.08852", "type": "理论+数值", "summary": "1. 该工作数值求解了标准GKSL主方程与基于缀饰态的Markov主方程，比较了它们在超强耦合量子Rabi模型中描述弛豫和退相干效应的差异。\n2. 关键物理在于标准主方程在耦合强度g≳0.1ω时失效，因未考虑光-物质杂交态；而缀饰主方程通过系统-浴耦合算符的严格构建，确保了耗散描述的自洽性。\n3. 这为超强耦合电路QED等平台的精确动力学模拟提供了必要方法，其预测的真空光子生成等效应需在实验中重新检验。", "summary_source": "deepseek", "authors": [{"name": "Alexandre P. Costa"}, {"name": "Hebert S. Rego de Oliveira"}, {"name": "Alexandre Dodonov"}], "featured_authors": [{"name": "Alexandre P. Costa"}, {"name": "Hebert S. Rego de Oliveira"}, {"name": "Alexandre Dodonov"}], "author_count": 3}, {"id": "2604.08955", "category": "quant-ph", "title": "Impact of Pump Phase-Noise on Josephson Traveling-Wave Parametric Amplifiers", "abstract": "Superconducting traveling-wave parametric amplifiers (TWPAs) are essential elements for enhancing the signal-to-noise ratio (SNR) and thus the read-out fidelity of superconducting qubits because of their high gain and near quantum-limited noise. However, the impact of the pump source, e.g., phase noise on these amplifiers, has not yet been studied. In this work, we show that among the two amplification processes in JTWPAs, the three-wave mixing (3WM) process is more sensitive to the pump phase noise than the four-wave mixing (4WM) process. We show that the even-order nonlinearity of 4th order and above in three-wave mixing is responsible for more than 10 dB increase of phase noise at high frequency offsets within the phase noise mask as the power of the pump increases. A polynomial model of the amplifier and cyclo-stationary property of phase noise also corroborate with the simulations. The Harmonic Balance (HB) periodic noise analysis tool and Leeson phase noise model in Keysight Advanced Design System (ADS) simulator were used in this study.", "url": "https://arxiv.org/abs/2604.08955", "type": "理论+数值", "summary": "1. 该工作首次系统研究了泵浦相位噪声对约瑟夫森行波参量放大器（JTWPA）的影响，并比较了其中三波混频与四波混频过程对噪声的敏感性差异。\n2. 其核心发现是，在三波混频过程中，四阶及以上偶次非线性项导致高频偏移处的相位噪声随泵浦功率增加而显著提升超过10 dB，该机制通过多项式模型与循环平稳噪声特性得到验证。\n3. 这一结果为优化量子比特读出链中泵浦源的设计以及选择更低相位噪声敏感性的放大器拓扑结构提供了关键理论依据。", "summary_source": "deepseek", "authors": [{"name": "Daryoush Shiri"}, {"name": "Likai Yang"}, {"name": "Saesun Kim"}, {"name": "Mohamed A. Hassan"}, {"name": "Philip Krantz"}, {"name": "Eric T. Holland"}], "featured_authors": [{"name": "Daryoush Shiri"}, {"name": "Likai Yang"}, {"name": "Saesun Kim"}, {"name": "Mohamed A. Hassan"}, {"name": "Philip Krantz"}, {"name": "Eric T. Holland"}], "author_count": 6}, {"id": "2604.09040", "category": "quant-ph", "title": "Galilean One-Particle Kinematics from a Smooth Family of Reference States", "abstract": "Giannelli and Chiribella derived an observable-generator duality for energy from a collision model of informational nonequilibrium. We study a continuous-variable version aimed at the Galilean one-particle sector. A smooth family of reference states around an isotropic equilibrium supplies time, translation, rotation, and boost directions. The local observable-generator correspondence is obtained by differentiating a smooth extension of the single-state duality map, and the norm-one property of localization is obtained from a fiducial focusing assumption together with covariance. Combined with the standard smearing form of covariant localization observables, this yields sharp localization. With local inertial composition, the spin-cover action of rotations, and a central boost-translation holonomy, every irreducible sector is unitarily equivalent to the Hilbert space L2(R3) tensored with a (2s+1)-dimensional spin space. In that representation translations are generated by the canonical momentum, the holonomy is a scalar mass m > 0, boosts at t = 0 are generated by m times the position observable, the Hamiltonian is the free-particle kinetic term plus a constant E0, and the total angular momentum is orbital plus spin.", "url": "https://arxiv.org/abs/2604.09040", "type": "理论", "summary": "1. 该工作将信息非平衡碰撞模型中的可观测量-生成子对偶推广至伽利略单粒子扇区，通过光滑参考态族构建运动学框架，并导出局部对应关系与锐化局部化。\n2. 其物理核心在于结合协变性、基准聚焦假设及标准涂抹形式，实现范数-1局部化，并具体给出平移、旋转、提升的生成子表示。\n3. 这为不可约扇区酉等价于L2(R3)张量自旋空间的表示奠定基础，其中质量、动量、位置等物理量呈现自由粒子形式，启发了量子力学对称性及相关模型的严格研究。", "summary_source": "deepseek", "authors": [{"name": "Jianshuo Gao"}], "featured_authors": [{"name": "Jianshuo Gao"}], "author_count": 1}, {"id": "2604.09192", "category": "quant-ph", "title": "Order structure and signalling in higher order quantum maps", "abstract": "We study the signalling structure of higher order quantum maps from an order-theoretic perspective, building on the combinatorial characterization of higher order types by Bisio and Perinotti. We have shown in a previous work arXiv:2411.09256 that types are represented by boolean functions called type functions, and that each such function is characterized by a related structure poset. We characterize the distributive lattice generated by all type functions with fixed indices of input and output systems - whose elements we call regular subtypes - by a monotonicity condition. Unlike the set of type functions, the lattice of regular subtypes is closed under the one-way signalling product, moreover, it is generated by a specific family of causally ordered types. We then study signalling relations for maps belonging to a regular subtype, showing that the no-signalling conditions between an input and an output system are determined by a single evaluation of the corresponding function. For higher order types specifically, we show that all signalling relations can be read off directly from the structure poset via a rank parity condition. Finally, we study relations between the structure poset of a type and its normal forms, that is, expressions of the type in terms of causally ordered types. We illustrate construction of normal forms on some examples, demonstrating the possibility that the normal form can be systematically derived from maximal chains of the poset and signalling relations between them.", "url": "https://arxiv.org/abs/2604.09192", "type": "理论", "summary": "1. 本研究从序理论视角系统分析了高阶量子映射的信号结构，基于类型函数的组合表征，构建了正则子类型的分配格并探讨了其信号关系。\n2. 核心在于证明了正则子类型格对单向信号积封闭，且映射的信号条件可由单次函数评估确定；高阶类型的全部信号关系可直接从其结构偏序集通过秩奇偶性条件读取。\n3. 这为从偏序集的最大链及其间信号关系系统推导类型的正规形式提供了可能，为复杂量子过程与因果结构的规范描述与操作提供了新工具。", "summary_source": "deepseek", "authors": [{"name": "Anna Jenčová"}], "featured_authors": [{"name": "Anna Jenčová"}], "author_count": 1}, {"id": "2604.09219", "category": "quant-ph", "title": "Thermodynamical aspects of optically pumped dense atomic medium", "abstract": "Optically Pumped Magnetometers use light to drive an atomic vapor into a Non-Equilibrium Steady State for sensing. This kind of state is achieved when spin-exchange collisions, together with optical pumping, dominate the relaxation dynamics, redistributing the atomic populations and thereby shaping the steady-state configuration. Despite the rapid advancement of atomic magnetometer technology, a comprehensive thermodynamic analysis of the state preparation is largely unexplored. We apply a thermodynamic framework to alkali atoms in a vapor cell, modeling their interactions with the pump laser and their relaxation via spin-exchange and spin-destruction collisions. We analyze how the pump rate and light polarization determine the non-equilibrium steady state, quantifying irreversibility via entropy production, assessing useful energy via ergotropy, and defining the spin-polarization efficiency. Finally, we establish a connection between metrological performance and the Quantum Fisher Information (QFI), demonstrating that a higher thermodynamic efficiency directly translates into an improved fundamental bound on magnetometer sensitivity. These results provide insights for optimizing state preparation in quantum sensors.", "url": "https://arxiv.org/abs/2604.09219", "type": "理论+数值", "summary": "1. 该工作为光泵原子磁力计中的非平衡稳态制备建立了热力学理论框架。\n2. 其核心在于通过熵产生、可用能（做功能力）和自旋极化效率定量刻画了泵浦速率与光偏振对非平衡稳态的决定性作用。\n3. 这揭示了热力学效率与量子Fisher信息的内在联系，为从热力学角度优化量子传感器的态制备提供了明确指导。", "summary_source": "deepseek", "authors": [{"name": "A. F. Sousa"}, {"name": "C. H. S. Vieira"}, {"name": "H. M. Florez"}], "featured_authors": [{"name": "A. F. Sousa"}, {"name": "C. H. S. Vieira"}, {"name": "H. M. Florez"}], "author_count": 3}, {"id": "2604.09284", "category": "quant-ph", "title": "Wave packet motion in a quantized electromagnetic field: Analytic results", "abstract": "We investigate the dynamics of a charged particle interacting with a multimode quantized electromagnetic field and obtain an analytic solution for the full electron--field system. This framework enables the calculation of position expectation values and uncertainties for arbitrary wave packets and field states, allowing us to identify quantum corrections to the corresponding classical motion. While the corrections to the position expectation value are weak and largely insensitive to the quantum state of the field, the wave packet broadening exhibits a pronounced dependence on the field state. In particular, the quantum uncertainty of the radiation is directly imprinted onto the spatial uncertainty of the particle. We illustrate these effects for Gaussian wave packets interacting with coherent, Fock, and squeezed states, including bright squeezed vacuum. The interaction with a finite-duration laser pulse is also analyzed as a multimode example. Our results provide a transparent analytic route toward understanding how quantum fluctuations of light influence electron dynamics in strong-field settings.", "url": "https://arxiv.org/abs/2604.09284", "type": "数值", "summary": "1. 该工作研究了带电粒子与多模量子化电磁场相互作用的动力学，获得了电子-场全系统的解析解。\n2. 其核心在于揭示了辐射场的量子不确定性会直接印刻到粒子的空间展宽上，而位置期望值的量子修正较弱且对场态不敏感。\n3. 这为理解强场环境中光的量子涨落如何影响电子动力学提供了一条清晰的解析途径。", "summary_source": "deepseek", "authors": [{"name": "Szabolcs Hack"}, {"name": "Béla Gábor Pusztai"}, {"name": "Krisztina Joós"}, {"name": "Sándor Varró"}, {"name": "Attila Czirják"}, {"name": "Péter Földi"}], "featured_authors": [{"name": "Szabolcs Hack"}, {"name": "Béla Gábor Pusztai"}, {"name": "Krisztina Joós"}, {"name": "Sándor Varró"}, {"name": "Attila Czirják"}, {"name": "Péter Földi"}], "author_count": 6}, {"id": "2604.09295", "category": "quant-ph", "title": "Dyadic-Order Quantum Fractional Transforms: Circuit Constructions and Applications to Hartley and Cosine Transform Families", "abstract": "This paper presents a generalized circuit framework for constructing Shih-type fractionalizations of unitary operators of dyadic order, i.e., operators $U$ satisfying $U^{2^n}=I$. Building upon the architecture of the quantum fractional Fourier transform (QFrFT), we show that fractionalization can be implemented coherently as a weighted superposition of integer powers, $\\sum_k c_k(\\alpha)U^k$, where the coefficients are generated through an ancilla-domain quantum Fourier transform and a diagonal phase modulation. Under the assumption that controlled implementations of the required powers of $U$ are available, the resulting circuit yields a parameterized family of operators that interpolates the integer powers of $U$ and satisfies the additive property of fractional transforms. As concrete applications, we derive explicit quantum circuit realizations of the quantum fractional Hartley transform (QFrHT) and of the fractional cosine-transform families associated with Types~I and~IV. These constructions demonstrate the versatility of the proposed dyadic-order fractionalization framework for structured operators arising in quantum signal processing.", "url": "https://arxiv.org/abs/2604.09295", "type": "理论", "summary": "1. 该工作提出了一个构造二元阶酉算子分数化形式的通用量子电路框架，并以量子分数哈特利变换和分数余弦变换家族为具体应用案例。\n2. 其技术核心在于通过辅助量子比特域上的量子傅里叶变换与对角相位调制，将分数化算子实现为整数幂的相干加权叠加 $\\sum_k c_k(\\alpha)U^k$。\n3. 这一框架为量子信号处理中出现的各类结构化算子的参数化分数变换实现提供了明确路径，并展示了其应用于更广泛变换家族的潜力。", "summary_source": "deepseek", "authors": [{"name": "Matheus J. A. Oliveira"}, {"name": "Israel F. Araujo"}, {"name": "José R. de Oliveira Neto"}, {"name": "Juliano B. Lima"}], "featured_authors": [{"name": "Matheus J. A. Oliveira"}, {"name": "Israel F. Araujo"}, {"name": "José R. de Oliveira Neto"}, {"name": "Juliano B. Lima"}], "author_count": 4}, {"id": "2604.09314", "category": "quant-ph", "title": "Convergence to semiclassicality in the quantum Rabi model", "abstract": "We investigate the emergence of semiclassical dynamics in the quantum Rabi model using a recently developed limiting procedure that formally establishes correspondence with the semiclassical Rabi Hamiltonian [E. K. Twyeffort Irish and A. D. Armour, Phys. Rev. Lett. 129, 183603 (2022)]. While the limit itself is defined at the Hamiltonian level, how it is reached depends on the choice of quantum states. Defining a set of quantitative measures that capture the differences between quantum and semiclassical dynamics, we examine convergence to the semiclassical limit when the field is prepared in a displaced number state. These states, which interpolate to Fock states for zero displacement, are more general than the set of coherent states usually employed when considering the emergence of semiclassical behavior. Numerical computations of these measures consistently demonstrate the progressive emergence of semiclassical behavior as the joint limit of vanishing coupling and infinite displacement is approached. Complementing the numerical results, analytical approximations are developed that reproduce the behavior in the vicinity of the semiclassical limit with a high degree of fidelity and allow scaling relations to be derived. Although any initial displaced number state will eventually converge to the corresponding semiclassical dynamics as the limit is taken, the rate of convergence depends on the Fock number $n$ of the state. States with larger values of $n$, which behave less classically than coherent states, converge more slowly to the limit.", "url": "https://arxiv.org/abs/2604.09314", "type": "理论+数值", "summary": "1. 本研究通过特定极限程序，探讨了量子拉比模型中量子动力学向半经典行为收敛的过程，并针对位移数态这一比相干态更一般的初始场态进行了数值与解析分析。\n2. 其核心在于揭示了收敛速率与态中福克数n的依赖关系：n越大的态（其行为越偏离经典相干态）向半经典极限收敛的速度越慢。\n3. 这一发现明确了初始量子态的非经典特性对半经典近似有效性的影响，为量子光学模型中半经典对应关系的更精细刻画提供了理论依据。", "summary_source": "deepseek", "authors": [{"name": "H. F. A. Coleman"}, {"name": "R. A. Morrison"}, {"name": "A. D. Armour"}, {"name": "E. K. Twyeffort"}], "featured_authors": [{"name": "H. F. A. Coleman"}, {"name": "R. A. Morrison"}, {"name": "A. D. Armour"}, {"name": "E. K. Twyeffort"}], "author_count": 4}, {"id": "2604.09337", "category": "quant-ph", "title": "Tailoring tensor network techniques to the quantics representation for highly inhomogeneous problems and few body problems", "abstract": "Tensor network techniques are becoming increasingly popular tools to solve partial differential equations within the so-called quantics representation. Their popularity stems from the fact that their spatial resolution depends only logarithmically on the number of grid points, making them very tempting approaches in situations where two or more characteristic length scales are vastly different. A first generation of technique used ``out-of-the-box'' algorithms of the tensor network toolkit (e.g. the celebrated Density Matrix Product State (DMRG) algorithm) to solve these problems. These techniques were designed for situations (e.g. quantum magnetism) where the different degrees of freedom (e.g. spins) play equivalent roles. In the quantics representation, however, the different degrees of freedom correspond to the physics at different scales and therefore play inequivalent role. Here we show that by tailoring the tensor network algorithms to this particular case, in the spirit of the multigrid approach, we obtain faster and more robust convergence of the algorithms. We showcase the approach on linear (Poisson equation) and eigenvalue (Schrödinger equation) problems in two, three and four dimensions. Our simulations involve up to $2^{80}$ grid points and would represent, we argue, a very strong challenge for conventional approaches.", "url": "https://arxiv.org/abs/2604.09337", "type": "理论+数值", "summary": "1. 该工作将张量网络算法定制化适配于量子化表示，以求解高度非均匀问题和少体问题。\n2. 其核心在于借鉴多重网格思想，针对不同尺度自由度不等价的特性，实现了更快速稳健的算法收敛。\n3. 该方法在二至四维问题中演示了对高达2^80网格点的模拟能力，为突破传统数值方法瓶颈提供了新途径。", "summary_source": "deepseek", "authors": [{"name": "Jheng-Wei Li"}, {"name": "Nicolas Jolly"}, {"name": "Xavier Waintal"}], "featured_authors": [{"name": "Jheng-Wei Li"}, {"name": "Nicolas Jolly"}, {"name": "Xavier Waintal"}], "author_count": 3}, {"id": "2604.09341", "category": "quant-ph", "title": "Algebraic structure of Fock-state lattices", "abstract": "We analyze Fock-state lattices (FSLs) from an algebraic viewpoint. Starting from a Lie algebra, we associate a FSL constructed from the action of its generators: diagonal (Cartan) generators define the lattice sites, while off-diagonal (root) generators determine the lattice bonds. This construction reveals that identifying an underlying algebraic structure provides direct physical insight into FSLs, including their dimensionality, connectivity, symmetry constraints, and possible transport and revival phenomena. By examining several common Lie algebras, we identify not only their associated FSLs but also the corresponding Lie phase spaces, thereby establishing a systematic connection between FSL dynamics and phase-space geometry. In many cases, both the phase space and the FSL exhibit nontrivial curvature, opening possibilities for exploring quantum dynamics in curved synthetic spaces. We further address whether every integrable Hamiltonian admits an underlying Lie algebra that reproduces the same FSL structure. We show that this is not generally the case, particularly for Hamiltonians that are nonlinear in the generators, and that for systems combining different types of degrees of freedom the appropriate underlying structure may instead be a Lie superalgebra.", "url": "https://arxiv.org/abs/2604.09341", "type": "理论", "summary": "1. 该工作从李代数出发构造Fock态晶格，系统分析了其代数结构。\n2. 其核心在于揭示代数结构如何直接决定晶格维度、连通性、对称性及动力学与相空间几何的联系。\n3. 这表明非所有可积哈密顿量都对应李代数，混合系统需李超代数，为弯曲合成空间量子动力学研究提供了新方向。", "summary_source": "deepseek", "authors": [{"name": "Piergiorgio Ferraro"}, {"name": "Caio B. Naves"}, {"name": "Jonas Larson"}], "featured_authors": [{"name": "Piergiorgio Ferraro"}, {"name": "Caio B. Naves"}, {"name": "Jonas Larson"}], "author_count": 3}, {"id": "2604.09357", "category": "quant-ph", "title": "Discrete-time quantum walks in synthetic dimensions", "abstract": "In this work we introduce discrete-time quantum walks in state space, more precisely on Fock-state lattices. Fock-state lattices provide a natural and clean setting for implementing lattice models, particularly in quantum optical systems. Thus, contrary to the common setting where the walker resides in real space or phase space, here the walk takes place in a synthetic space. We present a general formalism based on Lie algebras and their properties. For each Lie algebra one can associate both a phase space and a Fock-state lattice, and by understanding how these spaces are related, together with the action of generalized displacement operators, we construct the discrete unitary operator that generates the walk. In this framework the displacement operators replace the usual nearest-neighbor shifts and lead to state-dependent tunneling on the lattice. By considering several examples we demonstrate ballistic spreading and other characteristic features of discrete-time quantum walks, such as coin-walker entanglement and symmetry-induced interference patterns. We also show that different algebraic structures can give rise to qualitatively different dynamics, including anomalous behavior such as super-ballistic spreading as well as localization effects.", "url": "https://arxiv.org/abs/2604.09357", "type": "理论", "summary": "1. 该工作基于李代数构建了Fock态晶格这一合成维度上离散时间量子行走的普适形式理论。\n2. 其核心在于用广义位移算子替代最近邻跃迁，实现状态相关的晶格隧穿，并揭示不同代数结构可导致从弹道扩散、超弹道扩散到局域化等定性相异的动力学。\n3. 这为在量子光学等平台中利用合成维度模拟丰富晶格模型及探索非平庸量子行走行为提供了系统框架。", "summary_source": "deepseek", "authors": [{"name": "Piergiorgio Ferraro"}, {"name": "Caio B. Naves"}, {"name": "Jonas Larson"}], "featured_authors": [{"name": "Piergiorgio Ferraro"}, {"name": "Caio B. Naves"}, {"name": "Jonas Larson"}], "author_count": 3}, {"id": "2604.09410", "category": "quant-ph", "title": "Symmetry-driven thermalization via finite de Finetti theorems", "abstract": "Thermal behavior in subsystems of closed quantum systems is commonly attributed to dynamical chaos, quantum ergodicity, canonical typicality, or the eigenstate thermalization hypothesis, suggesting a fundamentally statistical origin of thermalization. Here, we propose a potential alternative mechanism in which thermal structures emerge deterministically from symmetry considerations alone, without recourse to statistical arguments. We prove a finite de Finetti-type theorem for quantum states invariant under energy-preserving unitaries, establishing that the reduced marginals of any such invariant $N$-qudit state are close (both in trace distance and relative entropy) to convex mixtures of thermal product states, with explicit error bounds vanishing as $N \\to \\infty$. We further present an example of energy-conserving Lindblad dynamics whose long-time limit is invariant under energy-preserving unitaries, providing a dynamical realization of the desired symmetry class. These results imply that invariance under energy-preserving unitaries suffices as a sole fundamental, deterministic principle to enforce thermal structures.", "url": "https://arxiv.org/abs/2604.09410", "type": "理论", "summary": "1. 本文提出了一种基于对称性的热化机制，并证明了能量守恒酉对称下的有限de Finetti定理，指出此类对称性足以确定性产生热结构。\n2. 其核心在于不依赖统计论证，仅通过对称性即能严格证明多体量子态的约化密度矩阵以可控误差逼近热态混合，误差界随系统增大而消失。\n3. 这为理解非平衡量子系统中的热化提供了新的确定性原理，并可通过能量守恒Lindblad动力学实现，启发了对称性在量子热力学中的基础作用。", "summary_source": "deepseek", "authors": [{"name": "Uttam Singh"}, {"name": "Nicolas J. Cerf"}], "featured_authors": [{"name": "Uttam Singh"}, {"name": "Nicolas J. Cerf"}], "author_count": 2}, {"id": "2604.09538", "category": "quant-ph", "title": "Explicit Block Encoding of Difference-of-Gaussian Operators on a Periodic Grid", "abstract": "The Difference-of-Gaussian (DoG) is a widely used operator across applications, including image processing (feature and edge detection), quantum machine learning, and finite-difference methods (approximations of the Laplacian-of-Gaussian). In this paper, we construct an explicit quantum block encoding of the DoG operator on a periodic grid, exploiting its natural probabilistic structure. The central observation is that the DoG admits a natural decomposition to two normalized Gaussian distributions, each preparable by explicit and efficient circuits, with the negation encoded using a single Pauli-$Z$ gate on a branch-indicator qubit. This enables the operator's block encoding to be directly mapped to the Linear Combination of Unitaries framework without requiring signed amplitude loading, quantum random-access memory, or any other black-box oracles. The proposed method achieves a constant subnormalization factor $\\lambda = 2$ independent of the grid size $N$, the spatial dimension $D$, and the stencil width. Additionally, we show that the DoG operator is diagonalized by the discrete Fourier basis, which allows us to derive an exact closed-form expression for the block-encoding success probability in terms of the input signal's power spectrum, weighted by the operator's transfer function. Finally, we prove that the expression reduces to $O(h^4)$ scaling with respect to grid spacing $h$ as the periodic grid becomes finer. This implementation provides an explicit construction method for a tunable, wide-stencil bandpass filter whose frequency response is controlled by two Gaussian scale parameters.", "url": "https://arxiv.org/abs/2604.09538", "type": "数值", "summary": "1. 本工作为周期网格上的高斯差分算子设计了一种显式的量子块编码方案。\n2. 该方案的卖点在于通过归一化高斯分布的可逆分解，避免了符号幅度加载等黑盒操作，实现了与网格尺寸无关的恒定子归一化因子。\n3. 该显式构造方法为量子信号处理中可调谐带通滤波器的实现及其成功概率的精确谱分析提供了理论依据。", "summary_source": "deepseek", "authors": [{"name": "Jishnu Mahmud"}, {"name": "John Winship"}, {"name": "Tom Lash"}, {"name": "James Ostrowski"}, {"name": "Rebekah Herrman"}], "featured_authors": [{"name": "Jishnu Mahmud"}, {"name": "John Winship"}, {"name": "Tom Lash"}, {"name": "James Ostrowski"}, {"name": "Rebekah Herrman"}], "author_count": 5}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>${paper.summary_source === "deepseek" ? "DeepSeek three-sentence PRL summary" : (paper.summary_source === "local-fallback" ? "Local three-sentence fallback" : (paper.summary_source === "translation" ? "Chinese abstract translation" : "Chinese placeholder fallback"))}</span><a href="${safeUrl}" target="_blank" rel="noreferrer">Open arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
</body>
