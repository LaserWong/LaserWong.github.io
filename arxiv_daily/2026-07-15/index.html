ors": [{"name": "Elisama E.M. Lima"}, {"name": "Dionisio Bazeia"}], "author_count": 2}, {"id": "2607.12133", "category": "hep-th", "title": "Superconductive or superfluid condensation in curved spacetime", "abstract": "We provide a proof of unitarity for quantum field theory in a general spacetime. Our argument expresses the Bogoliubov transformations in terms of a unitary squeezing operator relating the initial and final Hilbert spaces. The $S$-matrix in curved spacetime is thus the product of the squeezing operator and the $S$-matrix in the out-Hilbert space (typically Minkowski). Since both factors are unitary, their product is unitary. It follows that the Bogoliubov in-vacuum is described by a BCS-like state (Bardeen--Cooper--Schrieffer): (i) for fermions, it is exactly the BCS state, but with electrons and positrons in place of electrons with opposite spin; (ii) for bosons, it is the Bose--Einstein condensate (BEC) superfluid ground state. Thus, gravity, or an accelerating force, creates from the vacuum a many-particle system unstable towards forming a new ground state of Cooper pairs. Technically, gravity converts the vacuum into an electron-positron condensate, with respect to which quantum field theory evolves unitarily. By reverse engineering, we reconstruct the effective Hamiltonian of QFT in a black hole (or Rindler) background, together with a simple formula for the mass gap function, which grows approximately linearly with the temperature. Hence, electrons and positrons condense into a superconducting state at increasingly higher temperatures as the black hole mass decreases. Unitarity and the particle interpretation are preserved at every stage of evaporation. The Hawking state is exactly a BCS state. Finally, we compute the entanglement entropy and derive the area law.", "url": "https://arxiv.org/abs/2607.12133", "type": "理论", "summary": "1. 该工作证明了弯曲时空中量子场论的单位性，并将Bogoliubov变换用压缩算符表示，揭示引力真空对应BCS或BEC凝聚态。\n2. 其核心卖点在于通过压缩算符统一描述Bogoliubov变换，导出黑洞背景下有效哈密顿量与质量间隙函数，且霍金态即为BCS态。\n3. 这为黑洞信息悖论、弯曲时空量子场论中的凝聚现象，以及超导超流与引力系统间的深层类比提供了新视角。", "summary_source": "deepseek", "authors": [{"name": "Leonardo Modesto"}], "featured_authors": [{"name": "Leonardo Modesto"}], "author_count": 1}, {"id": "2607.12142", "category": "hep-th", "title": "Computational homological methods for integrable field theories", "abstract": "We develop explicit computational tools for the recent homological approach to the construction of $2$-dimensional integrable field theories on $\\Sigma$ from $4$-dimensional semi-holomorphic Chern-Simons theory on $\\Sigma \\times C$. In this framework, the operation of integrating out the spectral curve $C$ is realized by homotopy transfer of a cyclic $L_\\infty$-algebra associated with the $4$-dimensional theory with prescribed singularities and boundary conditions. We construct explicit strong deformation retracts for divisor-twisted Dolbeault complexes on $C=\\mathbb{C}P^1$ and use them to make the transferred $L_\\infty$-structure computationally accessible. As an application, we study the choice of meromorphic $1$-form corresponding to the principal chiral model with a Wess-Zumino term. We compute the transferred Maurer-Cartan action and the associated Lax connection, showing that the former resums to the standard principal chiral model action with a Wess-Zumino term and that the latter reproduces the usual Lax connection.", "url": "https://arxiv.org/abs/2607.12142", "type": "理论", "summary": "1. 该工作为二维可积场论的同调构造方法开发了显式计算工具，基于四维半全纯陈-西蒙斯理论中的循环L∞-代数同伦转移。\n2. 其技术核心在于构造了C=ℂP¹上除子扭曲Dolbeault复形的强形变收缩，使转移后的L∞-结构具备可计算性。\n3. 这为从谱曲线积分系统地导出主手征模型及Wess-Zumino项的作用量与Lax联络提供了可行方案。", "summary_source": "deepseek", "authors": [{"name": "Marco Benini"}, {"name": "Ryan A. Cullinan"}, {"name": "Alexander Schenkel"}, {"name": "Benoit Vicedo"}], "featured_authors": [{"name": "Marco Benini"}, {"name": "Ryan A. Cullinan"}, {"name": "Alexander Schenkel"}, {"name": "Benoit Vicedo"}], "author_count": 4}, {"id": "2607.12366", "category": "hep-th", "title": "Non-Abelian $A_4$ vortices in $SO(3)$ gauge theory and non-invertible symmetries", "abstract": "We construct finite-tension non-Abelian vortex solutions in a renormalizable $(3+1)$-dimensional $SO(3)$ gauge theory Higgsed to the tetrahedral group $A_4$ by a Higgs field in the spin-3 representation. Since the vacuum manifold is $SO(3)/A_4$, the vortices are characterized by the non-Abelian fundamental group $\\pi_1(SO(3)/A_4)\\simeq \\widetilde{A}_4$, the binary tetrahedral group. We obtain explicit axisymmetric vortex solutions carrying holonomies corresponding to the order-two and order-three conjugacy classes of $A_4$, determine their tensions numerically, and show that they exhibit type-I, type-II, and Bogomol'nyi--Prasad--Sommerfield-like behavior depending on the Higgs and gauge boson mass ratios. The vortices are classified by conjugacy classes of $\\widetilde{A}_4$, while their infrared descriptions are labeled by conjugacy classes of $A_4$. We further demonstrate that the smooth finite-tension vortices reduce in the infrared to Gukov--Witten surface operators of the $A_4$ discrete gauge theory, thereby establishing a finite-energy ultraviolet completion of non-invertible defects in a renormalizable gauge-Higgs theory.", "url": "https://arxiv.org/abs/2607.12366", "type": "理论", "summary": "1. 该工作在(3+1)维SO(3)规范理论中，通过自旋3表示希格斯场破缺至四面体群A4，构建了有限张力的非阿贝尔涡旋解。\n2. 其卖点在于涡旋由二进制四面体群分类，且光滑有限张力涡旋在红外退化为A4离散规范理论的Gukov-Witten面算子，为非可逆缺陷提供了紫外完备化。\n3. 这为在可重整规范-希格斯理论中实现非可逆对称性提供了具体构造，并启发了对非阿贝尔涡旋红外描述与分类的进一步研究。", "summary_source": "deepseek", "authors": [{"name": "Yoshihiko Abe"}, {"name": "Tetsutaro Higaki"}, {"name": "Kazuya Murakami"}, {"name": "Muneto Nitta"}, {"name": "Ryo Yokokura"}], "featured_authors": [{"name": "Yoshihiko Abe"}, {"name": "Tetsutaro Higaki"}, {"name": "Kazuya Murakami"}, {"name": "Muneto Nitta"}, {"name": "Ryo Yokokura"}], "author_count": 5}, {"id": "2607.12566", "category": "hep-th", "title": "Conformal line defects from matter-coupled 5D N=4 gauged supergravity", "abstract": "We study a number of holographic solutions describing conformal line defects within $N=2$ SCFTs from matter-coupled $N=4$ gauged supergravity in five dimensions. For $SO(2)_D\\times SO(3)$ gauge group, the gauged supergravity admits two supersymmetric $AdS_5$ vacua with $N=4$ and $N=2$ unbroken supersymmetries. It turns out that only solutions that are asymptotic to the $N=4$ vacuum are possible leading to line defects within the dual $N=2$ SCFT. In gauged supergravity with $SO(2)\\times ISO(3)$ gauge group, we find similar solutions with the $N=2$ SCFT appearing in the IR while the UV field theories correspond to six-dimensional $N=(0,2)$ field theories arising from M5-branes wrapped on a hyperbolic space $H^2$. The solution with $SO(2)\\times SO(3)$ symmetry is also uplifted to eleven dimensions via a consistent truncation on $H^2\\times S^4$. Finally, for gauged supergravity with $SO(2)\\times SO(3)\\times SO(3)$ gauge group that admits two $N=4$ supersymmetric $AdS_5$ vacua, we find a solution describing a line defect that interpolates between these two vacua as well as a solution with only one asymptotic $AdS_5$ geometry.", "url": "https://arxiv.org/abs/2607.12566", "type": "理论", "summary": "1. 该工作利用物质耦合五维N=4规范超引力，系统构造了描述边界N=2 SCFT中共形线缺陷的全息解，涉及SO(2)_D×SO(3)、SO(2)×ISO(3)及SO(2)×SO(3)×SO(3)等规范群。\n2. 其关键物理在于：构造了渐近于N=4或N=2 AdS_5真空的线缺陷解，包括插值两个N=4真空的解，以及连接紫外六维N=(0,2)场论（源于M5膜绕曲H^2）与红外N=2 SCFT的缺陷流，且SO(2)×SO(3)对称解可经H^2×S^4一致截断上提至十一维。\n3. 这些全息线缺陷为统一理解不同真空之间、不同维度场论之间的共形缺陷，以及M5-branes的全息描述和规范超引力降维提供了具体框架。", "summary_source": "deepseek", "authors": [{"name": "Parinya Karndumri"}], "featured_authors": [{"name": "Parinya Karndumri"}], "author_count": 1}, {"id": "2607.12644", "category": "hep-th", "title": "Off-shell equivalence in quantum field theory and gravity", "abstract": "Field redefinitions connect many formulations of the same physics, but the standard equivalence theorem is an on-shell result and cannot be used to decide when two quantum descriptions are equivalent off shell. This paper develops an operational criterion for that problem in terms of the Vilkovisky--DeWitt effective action. The central idea is that equivalence should be tested on scalar observables built by pairing configuration-space tensors with admissible probes. This makes the criterion sensitive to the observable class under consideration and separates the usual on-shell notion of equivalence from the stronger off-shell notions needed in gravity, cosmology and non-equilibrium quantum field theory. Metric $f(R)$ gravity and a scalar field theory example serve as prototypes, showing how the formal criterion distinguishes local, branchwise and genuinely global equivalence. In particular, we show that metric $f(R)$ gravity and its auxiliary-field reformulation yield the same quantum theory when the auxiliary constraint is enforced in the path integral. This is distinct from quantizing the corresponding scalar--tensor action with the metric and scalar treated as independent integration variables, which defines a different quantum theory. Apparent quantum inequivalences can then be traced to comparisons between different quantum objects, rather than to a failure of actual equivalences. This leads to general and precise notions of local and global equivalence under both field redefinitions and auxiliary-variable extensions.", "url": "https://arxiv.org/abs/2607.12644", "type": "理论", "summary": "1. 该工作基于Vilkovisky–DeWitt有效作用量，提出了判断量子场论与引力理论离壳等价性的操作判据。\n2. 其核心在于通过可观测标量检验等价性，区分局域、分支与全局等价，并揭示f(R)引力及其辅助场重构的量子等价条件。\n3. 这为引力、宇宙学及非平衡量子场论中强离壳等价性的严格定义与理论辨析提供了明确启发。", "summary_source": "deepseek", "authors": [{"name": "Iberê Kuntz"}, {"name": "Stefano Liberati"}], "featured_authors": [{"name": "Iberê Kuntz"}, {"name": "Stefano Liberati"}], "author_count": 2}, {"id": "2607.12772", "category": "hep-th", "title": "Quantum States Prepared by Wormholes: Long-Wavelength Deviations from Bunch-Davies", "abstract": "Wineglass wormholes mediate the nucleation of baby universes out of an asymptotically Anti-de Sitter or flat spacetime. Upon materialization, the new universe naturally undergoes an inflationary phase. Here we study the quantum state of tensor and probe scalar field fluctuations that these wormhole geometries prepare, finding that they reproduce the Bunch-Davies vacuum for short-wavelength modes but lead to deviations from Bunch-Davies on large scales. These deviations, which depend on the charge of the wormhole, cause a small shift as well as oscillations in the angular power spectrum generated by an ensuing inflationary phase, and thus provide a distinctive cosmological observable. The wormholes are supported by either axionic or magnetic charges. In the limit of vanishing charge, they undergo a topological transition after which they contain no-boundary instantons. We find that the small-charge limit suppresses deviations from the Bunch-Davies state for both scalar and tensor fluctuations, indicating that the topological transition is smooth.", "url": "https://arxiv.org/abs/2607.12772", "type": "理论", "summary": "1. 该工作研究了由酒盅虫洞成核的婴儿宇宙在暴胀阶段产生的张量与标量场涨落的量子态，发现长波长模式偏离BD真空。\n2. 卖点在于这些偏离依赖于虫洞的轴子或磁荷，导致角功率谱产生偏移和振荡，提供可观测的宇宙学特征。\n3. 零电荷极限下虫洞拓扑转变为无边界瞬子，且小电荷时偏离被抑制，暗示拓扑转变过程的平滑性，为早期宇宙量子起源提供新检验。", "summary_source": "deepseek", "authors": [{"name": "George Lavrelashvili"}, {"name": "Jean-Luc Lehners"}], "featured_authors": [{"name": "George Lavrelashvili"}, {"name": "Jean-Luc Lehners"}], "author_count": 2}, {"id": "2607.12798", "category": "hep-th", "title": "On interacting non-Abelian antisymmetric tensor field models", "abstract": "We study the gauge structure of interacting antisymmetric tensor field models obtained by the dimensional reduction on a group manifold. In such models a dimensionful parameter related to the size of the compact manifold plays the role of a coupling constant. We focus on open issues of reducibility of the gauge transformations in these theories and show that stages of reducibility of the interacting models coincide with ones of corresponding free counterparts.", "url": "https://arxiv.org/abs/2607.12798", "type": "理论", "summary": "1. 本研究通过群流形降维构造了相互作用的非阿贝尔反对称张量场模型，并系统分析了其规范变换的可约性结构。\n2. 关键发现是，尽管降维引入的维度参数作为耦合常数改变了场论形式，但相互作用模型与自由模型的可约性阶段完全一致。\n3. 这一结果揭示了降维方法在保留规范对称性代数结构方面的普适性，为构建一致的非阿贝尔张量场理论提供了明确的指导。", "summary_source": "deepseek", "authors": [{"name": "I. Buchbinder"}, {"name": "N. Kozyrev"}], "featured_authors": [{"name": "I. Buchbinder"}, {"name": "N. Kozyrev"}], "author_count": 2}, {"id": "2607.12834", "category": "hep-th", "title": "Timelike Entanglement First Law and Linearized Field Equations in Higher Curvature Gravity", "abstract": "We investigate the timelike entanglement first law in holographic conformal field theories whose bulk dual is Lovelock gravity. Using the double Wick rotation formulation of timelike entanglement entropy together with the Jacobson-Myers entropy functional, we compute the linear variation of holographic timelike entanglement entropy for hyperbolic subregions. For cubic Lovelock gravity, we explicitly show that a single, universal multiplicative renormalization factor governs how higher curvature interactions enter the variations of both the entropy and the modular Hamiltonian, leading to $\\Delta S=\\Delta\\langle H\\rangle$ for low-energy thermal excitations. We then extend the analysis to Lovelock gravity of arbitrary order around the anti-de Sitter spacetime in the Fefferman-Graham gauge. For normalizable perturbations, the variation of the Jacobson-Myers functional reduces to the Einstein gravity's result multiplied by the same coupling-dependent factor that renormalizes the effective Newtonian constant in the linearized field equations of Lovelock gravity. We further show that the boundary contribution vanishes in the conformal limit for the class of perturbations considered. Consequently, the timelike entanglement first law is equivalent to the linearized field equations of Lovelock gravity about the maximally symmetric background, within the hyperbolic and perturbative regime considered in the present paper.", "url": "https://arxiv.org/abs/2607.12834", "type": "理论", "summary": "1. 该工作在全息对偶框架下，研究了Lovelock引力体理论对应的类时纠缠第一定律。\n2. 关键发现是，Jacobson-Myers熵泛函的线性化变分与爱因斯坦引力结果相差一个耦合依赖因子，该因子重整了线性化场方程的有效牛顿常数，使得类时纠缠第一定律等价于Lovelock引力的线性化场方程。\n3. 这一等价关系揭示了高阶曲率引力中纠缠熵与场方程动力学之间具有普适性联系，为在全息框架下通过纠缠第一定律约束修改引力理论提供了明确途径。", "summary_source": "deepseek", "authors": [{"name": "Mei-Hui Xiao"}, {"name": "Guo-Ying Li"}, {"name": "Song He"}, {"name": "Jia-Rui Sun"}], "featured_authors": [{"name": "Mei-Hui Xiao"}, {"name": "Guo-Ying Li"}, {"name": "Song He"}, {"name": "Jia-Rui Sun"}], "author_count": 4}, {"id": "2607.12906", "category": "hep-th", "title": "Thermodynamic scaling and string dynamics in rotating holographic QCD", "abstract": "We investigate the effect of finite angular velocity on the phase structure and Schwinger pair production in a holographic QCD model based on the Einstein--Maxwell--dilaton framework. Rotation is introduced through a boost construction that generates a stationary rotating geometry from the corresponding static background. We first study the thermodynamic phase diagram using the grand potential together with several response functions and show that all thermodynamic phase boundaries satisfy an exact scaling relation under rotation, implying that the rotating thermodynamic sector is completely determined by the corresponding static solution through a simple boost transformation. We then investigate confinement through the effective string tension and find that, consistent with the thermodynamic observables, rotation decreases the string confinement--deconfinement transition temperature and chemical potential. The corresponding phase boundary, however, no longer obeys the thermodynamic scaling relation. Consequently, the region in the phase diagram that is thermodynamically confined but string deconfined grows with angular velocity. We further study the Schwinger effect using the potential analysis approach. Rotation lowers both the confining and catastrophic critical electric fields and suppresses the height and width of the potential barrier, thereby enhancing pair production in both confined and deconfined phases. In the deconfined phase, rotation also generates a worldsheet horizon that limits the radial extent of connected string solutions and reduces both the maximum quark--antiquark separation and the deepest turning point of the energetically favored string. These results demonstrate that, while rotation acts trivially in the thermodynamic sector through an exact scaling law, it produces genuinely new effects in the string sector.", "url": "https://arxiv.org/abs/2607.12906", "type": "理论", "summary": "1. 该工作基于爱因斯坦-麦克斯韦-伸缩子全息QCD模型，研究有限角速度对相结构与Schwinger对产生的影响。\n2. 旋转通过Boost变换引入，热力学相边界满足精确标度关系，但弦的禁闭-退禁闭相变不服从该标度，且旋转降低禁闭与临界电场并增强粒子产生。\n3. 这揭示旋转在热力学部分行为平凡，而在弦动力学中产生不可约新效应，为旋转系统中的禁闭与对产生机制提供全息理解。", "summary_source": "deepseek", "authors": [{"name": "Leila Shahkarami"}, {"name": "Farid Charmchi"}], "featured_authors": [{"name": "Leila Shahkarami"}, {"name": "Farid Charmchi"}], "author_count": 2}, {"id": "2607.12923", "category": "hep-th", "title": "Holography from number theory: Emergent holographic AdS$_2$ space-time from exact BPS black hole microstate counting", "abstract": "In this note, starting from the exact counting formulae for 4D BPS black hole degeneracies in the cases of 1/2 BPS $\\mathcal{N}=4$ and 1/8 BPS $\\mathcal{N}=8$ solutions, expressed as Rademacher expansions for coefficients of modular and Jacobi forms respectively, we explicitly show how the number theoretic data in each Rademacher summand is encoded by a Segal-Bargmann heat kernel calculation in the de Alfaro-Fubini-Furlan (DFF) model of conformal quantum mechanics, thus demonstrating the holographic origin of the BPS Bekenstein-Hawking entropy, and all logarithmic and power law suppressed corrections to it. We then derive the 2D holographically dual bulk space-time for this CQM and show that it is an AdS$_2$ space-time with radial length scale correlated to the energy scale of the DFF model. We further show how the Bekenstein-Hawking entropy emerges from an entanglement entropy computation in this bulk space-time. Hence, for the two classes of 4D BPS black holes under consideration, we have inferred the holographic CQM relevant for microscopic state counting from the exact number-theoretic degeneracy formulae and demonstrated the emergence of the near-horizon AdS$_2$ attractor geometry that is holographically dual to it.", "url": "https://arxiv.org/abs/2607.12923", "type": "理论", "summary": "1. 该工作从四维BPS黑洞精确退化计数的Rademacher展开出发，展示了模形式或Jacobi形式的系数如何通过DFF共形量子力学中的Segal-Bargmann热核计算编码数论数据，从而揭示了BPS贝肯斯坦-霍金熵及其所有对数与幂律修正的全息起源。\n2. 其核心卖点在于从该共形量子力学推导出全息对偶的二维AdS₂时空，其径向尺度与DFF模型能标相关联，并进一步证明贝肯斯坦-霍金熵由该时空中的纠缠熵计算涌现。\n3. 这为从精确数论公式直接推断微观态计数的全息共形场论提供了明确范例，并表明AdS₂吸引子几何的涌现可推广至更一般黑洞的全息描述。", "summary_source": "deepseek", "authors": [{"name": "Gabriel Lopes Cardoso"}, {"name": "Suresh Nampuri"}], "featured_authors": [{"name": "Gabriel Lopes Cardoso"}, {"name": "Suresh Nampuri"}], "author_count": 2}, {"id": "2607.12973", "category": "hep-th", "title": "Recursion Relations for Classical Gravity", "abstract": "We derive a set of recursion relations for the perturbative evaluation of the scattering of two black holes in Einstein gravity. To illustrate, we solve the equations up to third post-Minkowskian order in the gravitational coupling constant G, recovering the correct result, including the back-reaction from gravitational radiation.", "url": "https://arxiv.org/abs/2607.12973", "type": "理论", "summary": "1. 该工作为爱因斯坦引力中两个黑洞散射的微扰计算导出了一组递归关系。\n2. 其技术核心在于将方程解至三阶后闵可夫斯基近似，并完整包含引力辐射的反作用效应。\n3. 这为经典广义相对论中高后闵可夫斯基阶散射振幅的系统计算提供了直接可用的递归框架。", "summary_source": "deepseek", "authors": [{"name": "Poul H. Damgaard"}, {"name": "Kwangeon Kim"}, {"name": "Kanghoon Lee"}], "featured_authors": [{"name": "Poul H. Damgaard"}, {"name": "Kwangeon Kim"}, {"name": "Kanghoon Lee"}], "author_count": 3}, {"id": "2607.12976", "category": "hep-th", "title": "Causality and realizability of local operations in quantum field theory", "abstract": "In 1993, Sorkin noted, in the context of quantum field theory (QFT), that identifying the operations accessible to an observer acting in some spacetime region with quantum instruments whose Kraus operators are localizable therein leads to superluminal communication. This so-called Sorkin paradox can be resolved by further constraining the set of allowed local operations in QFT. In this spirit, Jubb and Oeckl identified the minimal conditions that QFT instruments must satisfy to be compatible with Einstein's causality. Independently, Fewster and Verch proposed a framework for local QFT operations that generalizes non-relativistic quantum measurement theory; remarkably, such FV-realizable instruments were shown to be causal. In this work, we study both approaches in the quantum field theory of the free scalar field. In this regard, we prove that there exist causal channels that cannot be arbitrarily well approximated through FV schemes. Moreover, deciding whether a given instrument is implementable or far away from being implementable by composing several FV operations is an uncomputable problem. On a more optimistic note, we show that a very wide class of causal instruments is FV-realizable: namely, those whose measurement channels are random displacements of the field operators. As we show, those suffice to implement any Positive Operator Valued Measure over a set of field quadratures in a non-demolition way (i.e., without perturbing any other commuting quadratures). Similarly, they allow approximating arbitrary QFT operations, causal or not, in a heralded, probabilistic way.", "url": "https://arxiv.org/abs/2607.12976", "type": "理论", "summary": "1. 本文在自由标量场量子场论中系统研究了局域操作的因果性与可实现性，并考察了FV框架与Jubb-Oeckl条件的一致性。\n2. 核心发现是存在因果通道无法通过FV方案任意逼近，且判定FV可实现性为不可计算问题；但随机位移测量类仪器构成一大类可实现的因果操作，可无损实现任意场正交POVM。\n3. 该工作揭示了局域量子场论操作在因果性与可实现性之间的根本张力，并为非破坏性场测量和概率性逼近任意QFT操作提供了可行途径。", "summary_source": "deepseek", "authors": [{"name": "Jan Mandrysch"}, {"name": "Robin Simmons"}, {"name": "Miguel Navascues"}], "featured_authors": [{"name": "Jan Mandrysch"}, {"name": "Robin Simmons"}, {"name": "Miguel Navascues"}], "author_count": 3}, {"id": "2607.12989", "category": "hep-th", "title": "Enhanced Correlations in Hawking Radiation from Near-Extremal Collapse", "abstract": "We consider the formation of a near-extremal Reissner-Nordstrom black hole by collapse, and show how to compute correlations in the outgoing Hawking radiation due to enhanced gravitational backreaction effects in the near-horizon region. This is done by reducing to the s-wave and employing the Hamiltonian formulation of Einstein-Maxwell theory coupled to a scalar field. Solving the constraints yields an action for the scalar field that incorporates gravitational backreaction effects at the quantum level, governed by an effective coupling g = G/(\\pi r_0^3 T_H) that grows at low temperature, as in recent Schwarzian-based analyses. This action produces corrections to the free field Hawking state which are imprinted on correlation functions of the Hawking radiation measured at null infinity. As part of our analysis, we show that this action evaluated in the AdS_2 region is equivalent, at the level of all tree-level boundary correlators, to the standard JT/Schwarzian description coupled to dressed bilocal operators. We also reproduce some one-loop results. In our approach, metric fluctuations are included quantum mechanically through the reduced scalar action, rather than through a semiclassical expectation value, and our computation of the radiation manifestly reduces to Hawking's original treatment when metric fluctuations are neglected.", "url": "https://arxiv.org/abs/2607.12989", "type": "理论", "summary": "1. 该工作采用约化s波哈密顿方法处理近极端R-N黑洞坍缩，计算了霍金辐射中因近视界引力反作用增强而产生的关联效应。\n2. 其卖点在于导出有效耦合g ∝ 1/T_H的约化标量场作用量，量子力学地包含度量涨落，得到对自由场霍金态的修正，并体现在辐射关联函数中。\n3. 该作用量与AdS_2区域JT/Schwarzian描述等价，为研究近极端黑洞量子辐射的关联结构提供了统一框架，并支持推广至单圈及更一般的坍缩场景。", "summary_source": "deepseek", "authors": [{"name": "Suzanne Bintanja"}, {"name": "Seolhwa Kim"}, {"name": "Per Kraus"}], "featured_authors": [{"name": "Suzanne Bintanja"}, {"name": "Seolhwa Kim"}, {"name": "Per Kraus"}], "author_count": 3}, {"id": "2607.13001", "category": "hep-th", "title": "The Infraparticle Edge", "abstract": "I derive the charged-particle spectral edge from the quantum instrument of soft QED. I use two projections of that instrument. Tracing over unresolved photons gives the reduced hard-sector channel. Pushing the outcomes to total energy gives the inclusive energy distribution. Its Laplace exponent is fixed by the diagonal soft intensity. For ${\\rm d} N_h(\\omega)=\\eta_h{\\rm d}\\omega/\\omega+{\\rm d} N_{h,\\mathrm{reg}}(\\omega)$, I obtain $\\rho_{\\mathrm{inc}}(s)\\sim C\\theta(s-m^2)(s-m^2)^{-1+\\eta_h}$. I retain the coherence kernel and derive hard-sector dephasing and the spectral edge from two contractions of one soft environment. The diagonal coefficient $\\kappa_{aa}$ fixes the endpoint exponent, while $\\frac12(\\kappa_{aa}+\\kappa_{bb}-2\\operatorname{Re}\\kappa_{ba})$ fixes the dephasing exponent between hard alternatives. I then classify infrared energy marginals, derive the finite-resolution residue $Z(\\mu)=(\\mu/\\Lambda)^{\\eta_h}$, prove stability under infrared-integrable perturbations, and separate the bath exponent from a hard threshold exponent. For the one-electron spectral measure, the hard threshold factor is regular. The resulting edge has the local power law of a gapped unparticle spectrum, while its exponent remains a response coefficient of the unresolved photon sector.", "url": "https://arxiv.org/abs/2607.13001", "type": "理论", "summary": "1. 该工作从软QED量子仪器出发，推导出带电粒子包含能量分布，并获得了谱边缘的局域幂律行为。\n2. 其卖点在于通过软环境的两个收缩分别确定端点指数与消相干指数，证明了谱边缘的局部幂律等价于有能隙未粒子谱。\n3. 这为理解红外边缘对可积扰动的稳定性及响应系数在谱功能中的角色提供了清晰理论框架。", "summary_source": "deepseek", "authors": [{"name": "Soo-Jong Rey"}], "featured_authors": [{"name": "Soo-Jong Rey"}], "author_count": 1}, {"id": "2607.12003", "category": "math-ph", "title": "Expansion of the planetary Hamiltonian for small eccentricities and inclinations: a vector formalism", "abstract": "We revisit the classical expansion of the planetary Hamiltonian for small eccentricities and mutual inclinations of the orbits, presenting a derivation based entirely on vector formalism. We demonstrate that the secular part of the disturbing function, as well as any other Fourier harmonic, can be expressed in terms of scalar products of vectors lying in the system's invariant plane. Furthermore, we show how to express any such term using the angular momentum and eccentricity vectors of the orbits.", "url": "https://arxiv.org/abs/2607.12003", "type": "理论", "summary": "1. 该工作基于矢量形式重新推导了行星哈密顿量在小偏心率和小相互倾角下的经典展开。\n2. 其卖点在于将摄动函数的长期部分及所有傅里叶谐波统一表达为系统不变平面内矢量标量积，并进一步用角动量和偏心率矢量显式表示。\n3. 这为行星系统长期动力学解析模型提供了更紧凑的框架，可推广至高阶谐波分析及多体相互作用研究。", "summary_source": "deepseek", "authors": [{"name": "Federico Mogavero"}], "featured_authors": [{"name": "Federico Mogavero"}], "author_count": 1}, {"id": "2607.12157", "category": "math-ph", "title": "CORTET: Robust generation of simulation-ready cortical meshes", "abstract": "Every human brain folds differently, and such natural variation confounds the search for imaging biomarkers of neurodevelopmental disorders. Physics-based simulation can help determine the causal mechanisms that underpin this variability. Yet every simulation must be initiated from a solid tetrahedral mesh of the brain's interior, and it is the worst element in that mesh, not the average, that decides whether the simulation runs at all. Building that mesh from fetal MRI currently requires labour-intensive manual intervention. We therefore present CORTET (CORtical TETrahedral meshing): a fully automated pipeline that converts a triangulated cortical surface into a solver-ready tetrahedral mesh whose worst-element quality meets a strict stability target with no manual repair. By benchmarking against a general-purpose tetrahedral mesher on the same input surfaces, we isolate the pipeline's contribution from that of the input geometry, and we validate quality across a cohort of nearly 200 fetal subjects spanning the folding period. A mesh taken straight from the pipeline sustains a numerically stable morphoelastic folding simulation of a real fetal subject.", "url": "https://arxiv.org/abs/2607.12157", "type": "理论", "summary": "1. 该工作提出全自动管线CORTET，将胎儿皮层三角化表面转换为求解器就绪的四面体网格且无需手动修复。\n2. 其技术核心在于严格优化最差单元质量以满足数值稳定阈值，并在近200例胎儿数据上验证其相较于通用网格生成器的优势。\n3. 这为基于形态弹性折叠模拟揭示人类大脑褶皱变异的因果机制提供了标准化网格生成方案，有望推动神经发育障碍生物标志物研究。", "summary_source": "deepseek", "authors": [{"name": "Davood Shahsavari"}, {"name": "Irina Grigorescu"}, {"name": "Jiaxin Xiao"}, {"name": "Nashira Baena"}, {"name": "Aakash Saboo"}, {"name": "Vanessa Kyriakopoulou"}, {"name": "Alena Uus"}, {"name": "Martin J. Bishop"}, {"name": "Katherine R. Long"}, {"name": "Emma C. Robinson"}], "featured_authors": [{"name": "Davood Shahsavari"}, {"name": "Irina Grigorescu"}, {"name": "Jiaxin Xiao"}, {"name": "Martin J. Bishop"}, {"name": "Katherine R. Long"}, {"name": "Emma C. Robinson"}], "author_count": 10}, {"id": "2607.12289", "category": "math-ph", "title": "Asymptotic forms of the Ursell edge waves on a gently sloping beach", "abstract": "It is shown that the asymptotics of the Ursell trapping modes on a sloping beach of small slope angle alpha coincide with the inverse Fourier transform of standard WKB exponentials, i.e., the Maslov canonical operator, as alpha tends to 0.", "url": "https://arxiv.org/abs/2607.12289", "type": "理论", "summary": "1. 该工作推导了缓坡海滩（坡角 α→0）上 Ursell 俘获模的渐近形式。\n2. 其核心在于证明该渐近与标准 WKB 指数的逆傅里叶变换（即 Maslov 正则算子）严格一致。\n3. 这为缓坡海岸边缘波理论提供了严格的渐近解析框架，并推广了经典 WKB 方法在非齐次介质中的应用。", "summary_source": "deepseek", "authors": [{"name": "P. Zhevandrov"}, {"name": "A. Merzon"}, {"name": "M. I. Romero Rodríguez"}], "featured_authors": [{"name": "P. Zhevandrov"}, {"name": "A. Merzon"}, {"name": "M. I. Romero Rodríguez"}], "author_count": 3}, {"id": "2607.12534", "category": "math-ph", "title": "A canonical two-scale Sonine fractional calculus induced by the Tricomi function", "abstract": "We introduce a Tricomi-type generalized fractional calculus in the Sonine kernel framework. The key result is that the Tricomi branch is a Stieltjes function in the admissible parameter range, so its reciprocal is a complete Bernstein function. This fact induces a Sonine fractional calculus together with the canonical Tricomi integral and the associated Riemann--Liouville-type and Caputo-type derivatives. We also prove that, within the Kummer class, the Tricomi branch is the unique Stieltjes representative, once the natural asymptotic normalization is fixed, and we derive the corresponding Lévy--Khintchine representation, Volterra formulation, and scalar Cauchy problem. A distinctive feature of the resulting operators is the emergence of two independent asymptotic orders.", "url": "https://arxiv.org/abs/2607.12534", "type": "理论", "summary": "1. 该工作引入了一种基于Tricomi函数的Sonine核框架广义分数阶微积分，并定义了相应的Riemann-Liouville型和Caputo型导数。\n2. 其核心卖点是证明Tricomi支路在容许参数范围内是Stieltjes函数，其倒数为完全Bernstein函数，从而导出具有两个独立渐近阶的规范分数阶算子。\n3. 这为分数阶微积分中多尺度动力学建模及Lévy过程表示提供了精确解析工具，并启发了相关Cauchy问题与Volterra方程的统一处理。", "summary_source": "deepseek", "authors": [{"name": "Ivano Colombaro"}, {"name": "Marc Tudela-Pi"}], "featured_authors": [{"name": "Ivano Colombaro"}, {"name": "Marc Tudela-Pi"}], "author_count": 2}, {"id": "2607.12852", "category": "math-ph", "title": "A maximal Hohenberg-Kohn theorem for non-interacting systems via potential theory", "abstract": "In this paper, we show that for Schrödinger operators with weakly correlated ground states, the Hohenberg-Kohn theorem holds within the maximal class of form-bounded external potentials if and only if the single-particle density is positive quasi-everywhere. Furthermore, we show that these conditions are satisfied for the ground state of non-interacting Schrödinger operators with a discrete ground state energy. Consequently, we establish the Hohenberg-Kohn theorem for non-interacting systems, and therefore the uniqueness of the Kohn-Sham potential, within the maximal class of Laplace form-bounded potentials. The key ingredient to establish these results is a characterization of weakly correlated regular states, whose proof relies on classical potential theory. Moreover, our proof reveals that, in the continuum setting, the fundamental mechanism underlying the Hohenberg-Kohn theorem is the (quasi)-unique continuation of the density rather than of the many-body wavefunction.", "url": "https://arxiv.org/abs/2607.12852", "type": "理论", "summary": "1. 该工作运用经典势理论，在最大类Laplace形式有界外势中，对具有离散基态能量的非相互作用系统建立了Hohenberg-Kohn定理与Kohn-Sham势的唯一性。\n2. 其技术核心在于通过弱关联正则态的表征，将定理成立条件归结为单粒子密度拟处处为正，并揭示机制为密度而非多体波函数的拟唯一延拓。\n3. 这为密度泛函理论在弱关联连续体系中的严格化提供了充分必要条件，并界定了可允许外势的最大函数类。", "summary_source": "deepseek", "authors": [{"name": "Thiago Carvalho Corso"}], "featured_authors": [{"name": "Thiago Carvalho Corso"}], "author_count": 1}, {"id": "2607.12860", "category": "math-ph", "title": "Spending Operators and Weak Power-Port Decompositions for Path-Dependent Entropic Lagrangians", "abstract": "History-dependent entropic formulations require a precise meaning for channelwise terminal variation and a spatial power split that remains valid for weak diffusion fields. This paper establishes both structures and places them in a single Path-Dependent Entropic Lagrangian construction. Endpoint calibration and cocycle additivity uniquely determine the oriented spending increment, while a channelwise extension of a decomposed power port yields explicit terminal differentials for scalar dissipation and potential-weighted fluxes. The diffusion split is formulated at Sobolev, finite-energy distributional, and bounded-variation/divergence-measure regularity. A natural-dual-space counterexample proves that chemical-potential-weighted residuals do not imply conservation, and an independent multiplier restores the unweighted balance. These ingredients are assembled in one augmented thermo-diffusion PDEL functional on a synchronized product space. Its admissible directional stationarity produces energetic and thermal conjugacy, species balance, flux closure, entropy production, and the two terminal power-routing channels. The same construction admits a finite-energy weak form and specializes to the Cahn--Hilliard equation.", "url": "https://arxiv.org/abs/2607.12860", "type": "理论", "summary": "1. 该工作构建了一个路径依赖熵拉格朗日框架，统一了历史依赖熵公式中的通道变分与弱扩散场下的空间功率分配。\n2. 核心技术在于通过端点校准与余循环可加性确定有向花费增量，并基于分解功率端口的通道扩展导出标量耗散与势加权通量的终端微分。\n3. 该框架在同步乘积空间上建立了增广热扩散PDEL泛函，其方向驻留性自然给出能量热共轭、物种平衡及熵产生，并可特化为Cahn-Hilliard方程。", "summary_source": "deepseek", "authors": [{"name": "Huilong Ren"}], "featured_authors": [{"name": "Huilong Ren"}], "author_count": 1}, {"id": "2607.11907", "category": "quant-ph", "title": "A Non-Commutative Voronovskaya Theorem for Quantum Neural Network Operators", "abstract": "We prove a complete asymptotic expansion for quantum neural network operators when they approximate arbitrary quantum channels. This is the non-commutative analogue of the classical Voronovskaya theorem. The expansion reveals that the approximation error splits into three fundamentally different parts: integer powers of \\(1/n\\) involving ordinary Fréchet derivatives; fractional powers governed by Marchaud fractional derivatives, which capture the Hölder smoothness of the channel; and purely quantum commutator terms that have no classical counterpart. The remainder is bounded sharply by an explicit constant: \\[ \\norm{R_{m,n}(\\Phi,\\bullet)}_\\diamond \\le C_{m,\\gamma,d} \\|\\Phi\\|_{\\cC^{m,\\gamma}} \\, n^{-(m+\\gamma)} (\\log n)^{3m/2}. \\] We present a numerical test for a classical analogue that confirms the predicted convergence rate and the logarithmic correction, directly validating the asymptotic theory. Based on this expansion, we obtain three major advances: a quantum central limit theorem for the fluctuations of quantum neural network operators, a method to construct optimal interpolation geodesics between quantum channels via Kubo-Ando means, and a systematic understanding of how fractional smoothness limits the acceleration of quantum neural network approximations. The numerical test further demonstrates that the theoretical rates are sharp and that logarithmic enhancements are unavoidable. Altogether, our work builds a rigorous bridge between classical approximation theory, fractional calculus, and quantum machine learning, offering both theoretical insight and practical tools for designing and analyzing quantum neural networks in finite dimensions.", "url": "https://arxiv.org/abs/2607.11907", "type": "理论+数值", "summary": "1. 该工作证明了量子神经网络算子在逼近任意量子信道时的完全渐近展开，即经典Voronovskaya定理的非交换推广。\n2. 展开揭示了近似误差分裂为整数幂Fréchet导数项、由Marchaud分数导数刻画Hölder光滑度的分数幂项，以及无经典对应的量子交换子项，且余项界含对数修正。\n3. 由此导出量子中心极限定理、基于Kubo-Ando平均的最优插值测地线构造，并阐明了分数光滑度对加速极限的制约，为近似理论、分数微积分与量子机器学习建立了严谨桥梁。", "summary_source": "deepseek", "authors": [{"name": "Rômulo Damasclin Chaves dos Santos"}, {"name": "Delvonei Alves de Andrade"}], "featured_authors": [{"name": "Rômulo Damasclin Chaves dos Santos"}, {"name": "Delvonei Alves de Andrade"}], "author_count": 2}, {"id": "2607.11909", "category": "quant-ph", "title": "What It Is Like To Be A Quantum Computer: A Closed Quantum Global Workspace -- Conscious Access and Integration as Correlation Dynamics in Hilbert Space", "abstract": "Motivated by speculative artistic inquiry into quantum-only forms of experience in relation to representation and embodiment, this paper develops a translation of the Global Neuronal Workspace (GNW) theory for closed quantum systems. The work treats classical GNW as an architectural reference and asks how conscious access and memory change under unitary dynamics. We reference a quantum Hopfield-style Hamiltonian that mirrors key organisational features of GNW, such as a distributed workspace and tunable large-scale integration. Within this framework, global availability of information is realised through coherence-preserving correlation distributions and memory is a persistent internal correlation structure. Likewise, ignition becomes a transition in global entanglement as opposed to convergence towards a stable attractor. Reductions of the Hopfield-style Hamiltonian lead to a tractable toy model and GHZ-type entanglement, explicitly showing how relative phase is globally accessible through joint internal operations yet absent from all local subsystems. This closed quantum system approach clarifies which aspects of workspace theories are contingent on classical assumptions. Our model highlights a non-representational regime in which access and memory are entirely relational rather than copies or records. Beyond its scientific contribution, the paper proposes a mode of art-science collaboration where speculative artistic inquiry is pursued through theoretical models rather than illustration or data.", "url": "https://arxiv.org/abs/2607.11909", "type": "理论", "summary": "1. 该工作将全局神经元工作空间理论翻译至封闭量子系统，建立量子Hopfield哈密顿量模型以模拟经典架构中的分布式工作空间与可调整合。\n2. 核心卖点在于通过相干保持的关联分布实现信息全局可用性，并以从局域子系统可访问的相对相位到GHZ型纠缠的全局转变刻画点火过程。\n3. 这揭示了信息访问与记忆可纯粹是希尔伯特空间中的关联结构而非副本记录，为意识量子理论提供了非表征性框架。", "summary_source": "deepseek", "authors": [{"name": "Libby Heaney"}], "featured_authors": [{"name": "Libby Heaney"}], "author_count": 1}, {"id": "2607.11912", "category": "quant-ph", "title": "Comment on Statistical mechanics from quantum envariance and exchange symmetry", "abstract": "Ojha, Sardana, and Ghosh [Phys. Rev. A 113, 042221 (2026)] propose that tracing environmental records of particle permutations produces an entropy kB ln N!, thereby explaining the Gibbs factor, and use the same construction to multiply the Saha equilibrium relation by 1/(Ne!Np!). We show that these conclusions do not follow. The reduced density matrix printed in their Eq. (32) is not a partial trace, and even under the natural corrected interpretation the entropy equals kB ln N! only when the system branch states are mutually orthogonal. That condition is not generally satisfied and, when imposed on labeled permutation branches, does not by itself restrict the particle state to one bosonic or fermionic symmetry sector. A two-particle calculation makes the contradiction explicit. Their Gibbs-paradox calculation also starts from a distinguishable-particle entropy while calling it the Sackur-Tetrode entropy. In the Saha section, the state in Eq. (52), as written, factorizes and has zero system-environment entanglement. The proposed factorial does not approach unity in the claimed dilute-gas limit, does not yield a finite nonzero intensive thermodynamic limit, and counts indistinguishability twice. We give the corrected canonical and fugacity-based formulations and identify which standard results of the paper remain unaffected.", "url": "https://arxiv.org/abs/2607.11912", "type": "理论+数值", "summary": "1. 该评论指正了Ojha等人提出的从量子环境不变性和交换对称性导出吉布斯因子与Saha平衡关系乘性因子的论证中存在的关键错误。\n2. 其技术核心在于揭露其约化密度矩阵并非偏迹运算，且其熵增结果仅在系统分支态相互正交时成立，而该条件在标记置换分支下不能自动将粒子态限制为玻色或费米对称性扇区。\n3. 这提醒在量子统计力学中处理不可区分粒子时需严格区分可区分粒子熵与正确熵，避免在配分函数和化学反应平衡中双重计数，为后续相关推导提供了正确框架。", "summary_source": "deepseek", "authors": [{"name": "Ridha Horchani"}], "featured_authors": [{"name": "Ridha Horchani"}], "author_count": 1}, {"id": "2607.11968", "category": "quant-ph", "title": "Double Covariance Model for Entangled Quantum States: Gaussian Reduction to Second Order Covariances", "abstract": "We propose a novel approach to the problem of interconnecting the probabilistic formalisms of classical and quantum physics, focusing on its most challenging aspect: the classical probabilistic generation of entangled states. We show that the statistics encoded in the density operators of composite quantum systems correspond to fourth-order classical statistics. Specifically, to generate a density operator, one must consider the covariance of a random covariance operator. We term this framework the Double Covariance Model (DCM). This double covariance possesses a non-trivial internal structure that arises from the interplay between two distinct time scales, combining temporal and statistical covariances. In this article, we exploit a well-known property of Gaussian processes: the second-order moment determines the moments of higher orders, specifically the fourth-order moment. This Gaussian reduction simplifies the DCM by reducing it to second-order statistics. Utilizing (circular) Gaussian processes simplifies and generalizes the DCM construction for entangled states, rendering it mathematically rigorous. Furthermore, it clarifies the classical probabilistic meaning of concurrence, a foundational quantitative measure of entanglement.", "url": "https://arxiv.org/abs/2607.11968", "type": "理论", "summary": "1. 该工作提出双协方差模型（DCM），将复合量子系统密度算符统计对应为四阶经典统计，即随机协方差算符的协方差。\n2. 其核心卖点是利用高斯过程二阶矩决定四阶矩的特性，将DCM约化为严格且普适的二阶统计，并给出 concurrence 的经典概率解释。\n3. 这为从经典概率视角理解纠缠态生成及纠缠度量提供了严谨框架，可启发量子-经典对应与量子信息基础研究。", "summary_source": "deepseek", "authors": [{"name": "Andrei Khrennikov"}], "featured_authors": [{"name": "Andrei Khrennikov"}], "author_count": 1}, {"id": "2607.11985", "category": "quant-ph", "title": "VQCSim: When Does Compile-Once Statevector Simulation Beat Generic Quantum Frameworks?", "abstract": "Hybrid quantum-classical machine learning workflows repeatedly evaluate many small parametrized circuits during training and model exploration. In this regime, framework dispatch and orchestration overhead often dominate runtime. Prior simulators accelerate execution but leave open the question of when compile-once specialization is the right choice for static variational circuits. We answer this question with VQCSim, a compile-once, PyTorch-native statevector execution path with native autograd. In a systematic MQT Bench study, VQCSim compiles all tested static circuits and provides 87.7% end-to-end semantic validation. Across a five-GPU evaluation set, VQCSim delivers pooled median speedups of 4.49x for native inference and 26.78x for native training, while retaining a 3.31x advantage under matched finite-difference training. Ablation identifies native autograd as the dominant source of acceleration (27.6x), with compile-once caching and batch vectorization contributing additional gains. The speedup trades higher GPU memory (VQCSim is memory-limited at the high end) for lower runtime. We derive a hardware-aware regime map and release vqcsim-oracle, an open-source backend selector with 91.1%-97.7% top-1 agreement (including cross-GPU transfers), enabling automatic simulator selection in QML design loops.", "url": "https://arxiv.org/abs/2607.11985", "type": "理论+数值", "summary": "1. 该工作提出了VQCSim，一种编译一次的态矢量模拟路径，专为混合量子-经典机器学习中静态变分电路的高效执行设计。\n2. 其技术核心是以原生自动微分提供27.6倍加速，结合编译缓存与批向量化，在训练任务上实现26.78倍中位数加速比并导出硬件感知的映射图。\n3. 提供的开源后端选择器vqcsim-oracle以91.1%-97.7%的top-1一致性自动选优模拟器，为量子机器学习设计循环的自动化加速指明方向。", "summary_source": "deepseek", "authors": [{"name": "Anton Firc"}, {"name": "Martin Perešíni"}, {"name": "Vojtěch Mrázek"}, {"name": "Kamil Malinka"}, {"name": "Vojtěch Staněk"}, {"name": "Zbyněk Lička"}, {"name": "Nouhaila Innan"}, {"name": "Walid El Maouaki"}, {"name": "Alberto Marchisio"}, {"name": "Muhammad Shafique"}], "featured_authors": [{"name": "Anton Firc"}, {"name": "Martin Perešíni"}, {"name": "Vojtěch Mrázek"}, {"name": "Walid El Maouaki"}, {"name": "Alberto Marchisio"}, {"name": "Muhammad Shafique"}], "author_count": 10}, {"id": "2607.12053", "category": "quant-ph", "title": "Entangling Power and Symmetries in the Quantum Rabi Model", "abstract": "The quantum Rabi model is a standard effective Hamiltonian in studies of light-matter interaction, capturing the simplest nontrivial setting in which a qubit couples to a single harmonic oscillator. Within the broader Rabi family, we focus on two special cases: the Jaynes-Cummings (JC) model, which carries an explicit $U(1)$ symmetry, and the asymmetric quantum Rabi model (AQRM), which possesses a parameter-dependent \"hidden'' symmetry that appears only at integer bias, $\\varepsilon/\\omega\\in\\mathbb{Z}$, and is not manifest in the Hamiltonian. We use the time-averaged entangling power as an operator-level diagnostic of these symmetry structures. Since the oscillator Hilbert space is infinite-dimensional, we compare two finite input ensembles: a Haar average after Fock-space truncation and a coherent-state average at fixed mean occupation $\\bar{n}$. Both diagnostics show peaks at the integer-bias points of the AQRM, where the hidden symmetry resides. In contrast, the manifest $U(1)$ symmetry at the JC point instead gives a weak dip. Thus, the time-averaged entangling power responds to both the hidden symmetry and the $U(1)$ symmetry in the Rabi family, with the sign of the response indicating how the symmetry reorganizes the spectral expansion. These results demonstrate that the entangling power can serve as an operator diagnostic to reveal the presence and properties of hidden and manifest symmetries in light-matter systems.", "url": "https://arxiv.org/abs/2607.12053", "type": "理论", "summary": "1. 该工作以量子拉比族中的Jaynes-Cummings模型与不对称量子拉比模型为例，采用时间平均纠缠功率作为算符级诊断工具，研究显式U(1)对称性及仅在整数偏置ε/ω∈Z出现的隐藏对称性。\n2. 其技术核心在于通过截断Fock空间Haar平均与固定平均光子数相干态平均两种有限输入系综，发现纠缠功率在隐藏对称性参数点呈尖锐峰值，在显式对称性点呈弱凹陷，响应符号直接反映对称性对谱展开重组方式的差异。\n3. 这表明时间平均纠缠功率可作为不依赖具体哈密顿量形式的普适探针，用于揭示光-物质系统中隐藏对称性的存在与性质，并有望推广至更一般的量子多体系统对称性诊断。", "summary_source": "deepseek", "authors": [{"name": "Ian Low"}, {"name": "Jens Koch"}, {"name": "Sahel Ashhab"}], "featured_authors": [{"name": "Ian Low"}, {"name": "Jens Koch"}, {"name": "Sahel Ashhab"}], "author_count": 3}, {"id": "2607.12100", "category": "quant-ph", "title": "Defeating Barren Plateaus with Task-Aligned Symmetry", "abstract": "Barren plateaus -- the exponential vanishing of gradients -- are a fundamental obstacle to training scalable quantum neural networks. Whether they arise in quantum recurrent neural networks (QRNNs), a natural architecture for sequential data, remains a pressing question. Here we show that the decisive ingredient for trainability in QRNNs is not the recurrent circuit topology per se, but enforcing time-translation symmetry through parameter sharing across time steps. We prove that, without parameter sharing, QRNNs suffer from barren plateaus, with gradient variance decaying exponentially with sequence length. Imposing parameter sharing across time steps fundamentally alters this scaling, transforming it into a polynomial dependence and thereby suppressing the barren plateau. Numerical simulations corroborate these analytical predictions. By rigorously showing how time-translation symmetry suppresses barren plateaus and enhances learning capability in QRNNs, our work establishes task-aligned symmetry as a constructive resolution to the expressivity-trainability tension in quantum neural networks.", "url": "https://arxiv.org/abs/2607.12100", "type": "理论+数值", "summary": "1. 该工作证明量子递归神经网络中的可训练性关键取决于是否通过跨时间步参数共享实现时间平移对称性，而非其循环拓扑。\n2. 技术上揭示参数共享将梯度方差从随序列长度指数衰减转变为多项式衰减，从而从根本上抑制贫瘠高原。\n3. 这建立了任务对齐对称性作为解决量子神经网络表达性与可训练性之间紧张关系的建设性方案。", "summary_source": "deepseek", "authors": [{"name": "Ruipeng Xing"}, {"name": "Yanan Li"}, {"name": "Zhen Shang"}, {"name": "Shengbin Wang"}, {"name": "Yongjian Gu"}, {"name": "Zhimin Wang"}], "featured_authors": [{"name": "Ruipeng Xing"}, {"name": "Yanan Li"}, {"name": "Zhen Shang"}, {"name": "Shengbin Wang"}, {"name": "Yongjian Gu"}, {"name": "Zhimin Wang"}], "author_count": 6}, {"id": "2607.12128", "category": "quant-ph", "title": "Categorical Tensor-Graph Semantics for Quantum Algorithms", "abstract": "This paper systematically investigates quantum computing protocols from the intuitive perspective of categorical tensor-graph semantics within the category FHilb. While conventional Hilbert-space formalisms conceal the structural nature of quantum algorithms behind high-dimensional matrix operations, the topological framework developed herein directly encodes algorithmic functionalities to their graphical skeletons. We provide a comprehensive topological reinterpretation of the Bernstein-Vazirani and the Simon algorithms, demonstrating how topological transformations distill their core mathematical essence and clarify the operational mechanism of oracles. Going beyond standard qubit models, we formalize the qutrit-adapted generalized Deutsch-Jozsa algorithm as well as the generalized single-shot Grover algorithm, explicitly laying out their graphical representations. We further implement CNOT gates via complementary Frobenius structures, trace the diagrammatic genesis of quantum entanglement including Bell and GHZ states, and present a diagrammatic simplification for W-state preparation protocol. By bridging tensor category theory with practical quantum algorithmic design, this work furnishes composable, scalable diagrammatic toolkit essential for automated circuit optimization across the evolving quantum hardware ecosystem.", "url": "https://arxiv.org/abs/2607.12128", "type": "理论+数值", "summary": "1. 该工作从FHilb范畴的张量图语义出发，将量子算法的功能直接编码为拓扑图骨架，并重新诠释了Bernstein-Vazirani、Simon等经典算法。\n2. 其技术核心在于利用图变换揭示算法的数学本质与操作机制，并通过互补Frobenius结构实现CNOT门，统一图解贝尔态、GHZ态及W态制备。\n3. 这为跨量子硬件生态的自动化电路优化提供了可组合、可扩展的图论工具箱，有望推动算法设计与范畴论的深度融合。", "summary_source": "deepseek", "authors": [{"name": "Naihong Hu"}, {"name": "Ruining Li"}, {"name": "Futao Wang"}], "featured_authors": [{"name": "Naihong Hu"}, {"name": "Ruining Li"}, {"name": "Futao Wang"}], "author_count": 3}, {"id": "2607.12163", "category": "quant-ph", "title": "Witnessing the Quantum Mpemba Effect with a Single Observable", "abstract": "The Mpemba effect, in which a system farther from equilibrium relaxes faster than one closer to it, defies the intuition of nonequilibrium statistical mechanics. Here, we introduce a general framework to unambiguously witness this phenomenon based on a single observable defined for Markovian open quantum systems. The Mpemba observable bypasses full state tomography, offering utility for state preparation and thermal task optimization. We illustrate our method using local magnetization as a Mpemba signature, applying it to a qubit under generalized amplitude damping.", "url": "https://arxiv.org/abs/2607.12163", "type": "理论+数值", "summary": "1. 本文针对马尔可夫开放量子系统，引入基于单个可观测量的通用框架，明确见证了量子Mpemba效应。\n2. 其核心在于定义Mpemba可观测量，绕过完整态层析，仅凭局域磁化等单一信号即可检测远离平衡系统的弛豫加速。\n3. 该框架直接服务于量子态制备与热任务优化，并在广义振幅阻尼量子比特中验证，为量子非平衡动力学的实验观测提供实用工具。", "summary_source": "deepseek", "authors": [{"name": "J. M. Z. Choquehuanca"}, {"name": "P. A. C. Obando"}, {"name": "M. S. Sarandy"}, {"name": "F. M. de Paula"}], "featured_authors": [{"name": "J. M. Z. Choquehuanca"}, {"name": "P. A. C. Obando"}, {"name": "M. S. Sarandy"}, {"name": "F. M. de Paula"}], "author_count": 4}, {"id": "2607.12164", "category": "quant-ph", "title": "Axion like particles multi-parameter sensing", "abstract": "The search for the axion like particles (APLs)-one of the deepest puzzles in modern cosmology-may hold the key to understanding dark matter and dark energy. In this work, we introduce a setup taking advantage of the quantum metrology techniques to constrain the hypothetical mass and coupling constants of APLs by employing exotic pseudoscalar spin-spin interactions between fermions mediated by ALPs. A key advantage of our approach is the exploitation of position-dependent spin sensor results to the high sensitivity of the probe. To simultaneously investigate the axion mass and coupling constants, we invoke a multi-probe detection strategy. Through this strategy, we circumvent the singularity of the quantum Fisher information matrix as an ultimate upper bound on the sensitivity of any probe. For the axion masses in the range of $m_a {\\le} 10^{-3} \\text{eV}$, this setup can exclude values of axion coupling constants $g^e_pg^n_p$ down to $10^{-7}$.", "url": "https://arxiv.org/abs/2607.12164", "type": "理论", "summary": "1. 该工作提出一种基于量子计量技术的多探针传感方案，用于同时约束类轴子粒子的质量与耦合常数。\n2. 其核心优势在于利用位置依赖的自旋传感器结果，通过多探针检测策略规避量子Fisher信息矩阵的奇异性。\n3. 这为在亚电子伏特质量范围内将类轴子耦合常数灵敏度推至10^{-7}量级提供了可行路线。", "summary_source": "deepseek", "authors": [{"name": "Hassan Manshouri"}, {"name": "Moslem Zarei"}, {"name": "Mehdi Abdi"}], "featured_authors": [{"name": "Hassan Manshouri"}, {"name": "Moslem Zarei"}, {"name": "Mehdi Abdi"}], "author_count": 3}, {"id": "2607.12174", "category": "quant-ph", "title": "Anticipating Decoder Side-channel Attacks in Fault-tolerant Quantum Computers", "abstract": "As quantum computing emerges as an applied technology, there is a growing need to protect quantum computers against information security attacks. This work identifies a new class of side-channel attacks against fault-tolerant quantum computers, in which the syndrome data that is sent to the decoder system is used to infer which computation (logical circuit) is taking place on the quantum computer. Our work introduces the concept of gate fingerprints, which describes those patterns present in syndrome data that indicate which logical operation took place on the quantum computer. We show different effects by which logical operations produce gate fingerprints by focusing on Clifford+T computation in the surface code. We then explore how gate fingerprint information can be used to make inferences about the circuits or algorithms run on a quantum computer. Our findings indicate that decoder systems can be a vector for side-channel attacks and thus to prevent this, decoder systems should either be secured or built by a trusted party.", "url": "https://arxiv.org/abs/2607.12174", "type": "数值", "summary": "1. 该工作识别出一类针对容错量子计算机解码器系统的侧信道攻击，利用发送至解码器的综合征数据推断量子计算机上正在执行的逻辑电路。\n2. 其核心技术贡献是引入“门指纹”概念，揭示表面码Clifford+T计算中不同逻辑操作在综合征数据上留下的特征模式及其推断机制。\n3. 这指出解码器系统可作为侧信道攻击的潜在向量，表明需将其安全化或由可信方构建，为量子计算机信息安全设计提供明确警示。", "summary_source": "deepseek", "authors": [{"name": "Shashvat Shukla"}, {"name": "Dan E. Browne"}, {"name": "Shin Nishio"}], "featured_authors": [{"name": "Shashvat Shukla"}, {"name": "Dan E. Browne"}, {"name": "Shin Nishio"}], "author_count": 3}, {"id": "2607.12190", "category": "quant-ph", "title": "Nearly optimal polynomial approximations for the quantum singular value transform", "abstract": "We introduce polynomial approximations of the even and odd step functions on the interval $[-1,1]$ with simple Chebyshev coefficients, making their numerical implementation straightforward. We derive rigorous error bounds and demonstrate that these polynomials are nearly optimal in the sense that their error deviates from the theoretically optimal error by a multiplicative factor that grows logarithmically with the polynomial order. From these polynomials, we derive related nearly optimal polynomial approximations that can be used to perform quantum phase estimation, linear amplitude amplification, eigenvalue thresholding, and other quantum algorithms using the quantum singular value transform.", "url": "https://arxiv.org/abs/2607.12190", "type": "理论+数值", "summary": "1. 该工作针对量子奇异值变换构造了偶/奇阶跃函数的几乎最优多项式近似，其切比雪夫系数形式简洁。\n2. 核心卖点在于多项式误差与理论最优值的比值仅随阶数对数增长，且配有严格误差界，数值实现简便。\n3. 这为量子相位估计、线性振幅放大、特征值阈值等基于量子奇异值变换的算法提供了可直接采用的实用近似工具。", "summary_source": "deepseek", "authors": [{"name": "Evan Rule"}], "featured_authors": [{"name": "Evan Rule"}], "author_count": 1}, {"id": "2607.12225", "category": "quant-ph", "title": "Constant-Depth Multi-Product Formula for Trotter Error Mitigation in Near-Term Digital Quantum Simulation", "abstract": "Digital quantum simulation of many-body dynamics faces a tension between algorithmic Trotter error and physical noise that accumulates with circuit depth. Typical higher-order product formulas mitigate the algorithmic error at the cost of deeper circuits. Our benchmark shows that, within the limited physical error budget, the feasible advantage is confined to absolute errors well below the $10^{-2}$ scale, which vanishes under noise levels of current quantum hardware. In sharp contrast to the previous Trotter error mitigation methods, we introduce a constant-depth multi-product formula (cd-MPF) that suppresses the Trotter error by combining multiple circuits at fixed circuit depth. We identify an auxiliary parameter $\\alpha$, which reshapes the Trotter error terms while leaving the target evolution invariant. The classical linear combination of the measured expectation values cancels the leading $(\\Delta t)^{2}$ algorithmic contribution and steepens the Trotter-error scaling with the two-qubit circuit depth $d$ from $d^{-2}$ to $d^{-4}$. Combined with physical-noise mitigation, our method can serve as a key ingredient for realizing long-time quantum dynamics simulation on near-term hardware.", "url": "https://arxiv.org/abs/2607.12225", "type": "理论+数值", "summary": "1. 该工作提出了恒定深度的多乘积公式(cd-MPF)，用于近期的数字量子模拟中抑制Trotter误差。\n2. 其卖点在于通过经典线性组合固定深度的多个电路，消除领先阶(Δt)²误差，并将标度从d⁻²提升至d⁻⁴。\n3. 这为在近期含噪硬件上实现长时间量子动力学模拟提供了实际可行的方案。", "summary_source": "deepseek", "authors": [{"name": "Chan Bin Bark"}, {"name": "Sangjin Lee"}, {"name": "Kwang Jun Ahn"}, {"name": "Sangmo Cheon"}, {"name": "Moon Jip Park"}, {"name": "Youngseok Kim"}], "featured_authors": [{"name": "Chan Bin Bark"}, {"name": "Sangjin Lee"}, {"name": "Kwang Jun Ahn"}, {"name": "Sangmo Cheon"}, {"name": "Moon Jip Park"}, {"name": "Youngseok Kim"}], "author_count": 6}, {"id": "2607.12317", "category": "quant-ph", "title": "Demonstration of tripartite cat states in two distinct classes of entanglement", "abstract": "Entanglement is a cornerstone of quantum mechanics and an essential resource for quantum computation, communication, and metrology. While bipartite entanglement is extensively studied, genuine multipartite entangled states remain largely inaccessible in the macroscopic continuous-variable domain. Here, we experimentally realize macroscopic tripartite entangled cat states of the two distinct classes with fundamentally inequivalent properties, namely GHZ-cat and W-cat states, encoded across three microwave resonators coupled to an ancillary superconducting transmon. We develop one-to-all conditional controls on the three oscillators by fully utilizing three energy levels of the transmon to generate these states in a single piece of hardware and employ an efficient subspace tomography protocol for state reconstruction. We obtain GHZ-cat and W-cat states with fidelities $0.83\\pm0.02$ and $0.70\\pm0.02$, respectively, certifying genuine multipartite entanglement among the three oscillators. We further validate the distinct entanglement classes by experimentally demonstrating that pairwise entanglement is present in the W-cat state but absent in the GHZ-cat state. Our technique for the on-demand generation and characterization of inequivalent classes of tripartite continuous-variable entanglement provides a valuable testbed for future studies of macroscopic many-body entanglement and fault-tolerant quantum information processing with multipartite bosonic codes.", "url": "https://arxiv.org/abs/2607.12317", "type": "实验", "summary": "1. 该实验在三个微波谐振器上实现了两类不可互化的宏观三体纠缠猫态，即GHZ-cat和W-cat态。\n2. 其技术核心在于利用超导transmon的三个能级实现一键式条件控制，并采用高效子空间层析成像重构状态，保真度分别达0.83和0.70。\n3. 这为研究连续变量多体纠缠的类别区分、宏观纠缠探测以及基于多模玻色码的容错量子信息处理提供了可控实验平台。", "summary_source": "deepseek", "authors": [{"name": "May Chee Loke"}, {"name": "Jonathan Schwinger"}, {"name": "Kehui Yu"}, {"name": "Yingshan Zhang"}, {"name": "Amon M. Kasper"}, {"name": "Tanjung Krisnanda"}, {"name": "Yvonne Y. Gao"}], "featured_authors": [{"name": "May Chee Loke"}, {"name": "Jonathan Schwinger"}, {"name": "Kehui Yu"}, {"name": "Amon M. Kasper"}, {"name": "Tanjung Krisnanda"}, {"name": "Yvonne Y. Gao"}], "author_count": 7}, {"id": "2607.12344", "category": "quant-ph", "title": "Parallel Hadamard Test", "abstract": "The Hadamard test is a fundamental building block widely used in many quantum computing algorithms. It estimates the real or imaginary part of $\\langle \\psi \\vert U \\vert \\psi \\rangle$, where $\\vert \\psi \\rangle$ is a quantum state and $U$ is a unitary operator. In many algorithms, however, many such quantities must be estimated, leading to a large number of distinct circuit types, long computational times, and high financial costs. In this work, we propose the parallel Hadamard test, which combines multiple Hadamard tests into a single circuit type. We demonstrate how the parallel Hadamard test applies to three structural classes of workloads: arbitrary sets of unitary operators, prefix-product arrays, and Gram-matrix elements. For each class, we compare the cost of the parallel Hadamard test with that of the conventional one. Our unified approach significantly reduces the number of distinct circuit types, and can lower both computational time and financial costs in regimes where fixed per-circuit overheads dominate the total cost. In Gram-matrix workloads, it can also reduce the total number of shots when typical off-diagonal overlaps are small.", "url": "https://arxiv.org/abs/2607.12344", "type": "理论+数值", "summary": "1. 该工作提出并行Hadamard测试，将多个Hadamard测试合并为单一电路类型，适用于任意酉算子集、前缀乘积数组和Gram矩阵元素三类结构负载。\n2. 其核心卖点在于通过统一电路显著减少不同电路类型数量，在固定单电路开销主导时可降低计算时间与成本，并在Gram矩阵非对角重叠较小时减少总采样数。\n3. 这一统一框架为多期望值估计的量子算法提供了成本优化的通用方案，尤其利于近中期含噪量子处理器上大规模运算的经济性实现。", "summary_source": "deepseek", "authors": [{"name": "Soichiro Imamura"}, {"name": "Synge Todo"}], "featured_authors": [{"name": "Soichiro Imamura"}, {"name": "Synge Todo"}], "author_count": 2}, {"id": "2607.12470", "category": "quant-ph", "title": "Sparse anisotropic positive maps for qutrit entanglement: exact indecomposability and PPT geometry", "abstract": "Positive but not completely positive maps provide one of the most direct ways to detect entanglement beyond the positive-partial-transpose (PPT) criterion. We introduce and analyze an exactly solvable two-parameter family of sparse bistochastic positive maps on qutrits, in which two coherence channels are independently tuned by parameters $w$ and $z$. The sparse structure makes the full phase diagram analytic: positivity holds exactly on the square $0\\le w,z\\le2/3$, complete positivity on the smaller square $0\\le w,z\\le1/3$, and decomposability is lost precisely outside a quarter circle in the corner $w,z\\ge1/3$. The indecomposable region is certified by explicit PPT entangled state adapted to the same witness geometry. At the endpoint $W_*=W(2/3,2/3)$ we construct a four-parameter family of PPT edge states of rank type $(5,5)$, derive their analytic detection region, and show that the corresponding rays are exposed faces of the PPT cone. Finally, although $W_*$ is not optimal, we give an explicit optimal refinement whose detection region on this family is strictly larger. The result is an analytically tractable qutrit setting in which positivity, indecomposability, PPT entanglement, optimality, and exposed convex geometry can be studied in a single framework.", "url": "https://arxiv.org/abs/2607.12470", "type": "理论+数值", "summary": "1. 该工作引入并解析求解了qutrit上的一族稀疏双随机正映射，通过两参数w和z独立调控相干通道，完整刻画了正性、完全正性与不可分解性的解析相图。\n2. 其核心在于精确界定了不可分解区域，并在端点W*处构造了秩型(5,5)的四参数PPT纠缠边态族，证明对应射线为PPT锥的暴露面，同时给出了严格更优的检测区域。\n3. 这为在单一解析框架内统一研究qutrit正映射的不可分解性、PPT纠缠几何以及最优性条件提供了可操作的模型与明确启发。", "summary_source": "deepseek", "authors": [{"name": "Massimiliano F. Sacchi"}], "featured_authors": [{"name": "Massimiliano F. Sacchi"}], "author_count": 1}, {"id": "2607.12559", "category": "quant-ph", "title": "The Infinitesimal Structure of Quantum Information", "abstract": "This paper establishes a rigorous, unified geometric framework for quantum state spaces by constructing smooth, regular embeddings into higher-order dual number algebras $\\mathcal{Q}_N \\equiv \\mathbb{R}[\\varepsilon]/(\\varepsilon^{N^2-1})$, wherein every quantum state is faithfully represented as a non-reduced scheme-theoretic point. We show that under this unified family of truncated rings, the non-linear matrix commutators governing the Liouville-von Neumann dynamics map globally onto flat, linear, and rigid algebraic flows, establishing nilpotent dual algebras as a pristine geometric landscape for higher-dimensional quantum kinematics.", "url": "https://arxiv.org/abs/2607.12559", "type": "理论", "summary": "1. 本文通过将量子态空间光滑、正则地嵌入高阶对偶数代数，建立了量子信息结构的严格统一几何框架。\n2. 其核心技术在于证明非线性Liouville-von Neumann对易子在此框架下全局映射为平坦线性的刚性代数流。\n3. 该工作为高维量子运动学提供了幂零对偶数代数这一纯净几何图景，启发后续动力学与信息几何研究。", "summary_source": "deepseek", "authors": [{"name": "Luca Barbieri-Viale"}], "featured_authors": [{"name": "Luca Barbieri-Viale"}], "author_count": 1}, {"id": "2607.12560", "category": "quant-ph", "title": "The Quantum Polariton Hamiltonian that Reproduces the Same High-Harmonic Generation Spectra as the Classical Hamiltonian in Strong Laser Fields", "abstract": "This manuscript investigates the possibility of defining a quantum Hamiltonian that leads to the same high-harmonic generation (HHG) spectra as those predicted by Floquet theory in the regime where the number of infrared (IR) pump photons is much larger than the number of emitted UV photons. The key assumption underlying our derivation is that the intensity of the emitted high harmonics is many orders of magnitude smaller than that of the IR laser, and that the emission of the Nnt harmonic results from the absorption of N IR photons.", "url": "https://arxiv.org/abs/2607.12560", "type": "理论", "summary": "1. 该工作定义了量子极化激元哈密顿量，使其在红外泵浦光子数远大于发射紫外光子数的强场条件下，复现出经典哈密顿量通过Floquet理论得到的高次谐波产生谱。\n2. 其核心在于利用谐波强度远低于激光强度的关键假设，将第N次谐波描述为N个红外光子的量子吸收过程，从而建立了量子与经典描述在特定参数区间的严格等价性。\n3. 这为在非微扰量子电动力学框架下定量研究强场高次谐波提供了可解析的基准模型，并可能推广至其他多光子非线性光学过程的量子-经典对应分析。", "summary_source": "deepseek", "authors": [{"name": "Nimrod Moiseyev"}], "featured_authors": [{"name": "Nimrod Moiseyev"}], "author_count": 1}, {"id": "2607.12603", "category": "quant-ph", "title": "Constructing mode-resolved quantum optical models for emitters in photonic crystals", "abstract": "Recent advances are enabling quantum emitters to interact with photonic crystals, whose electromagnetic modes exhibit complex dispersion relations, spatial mode structure, and polarization textures. However, modeling light-matter behavior in these systems faces a persistent trade-off: electromagnetic approaches based on Maxwell-equation solvers provide realistic vectorial descriptions but are difficult to integrate with quantum many-body and non-perturbative methods, whereas simplified quantum-optical lattice models are tractable but typically rely on scalar and spatially independent light-matter couplings that miss essential features of these structured photonic environments. Here, we introduce a constructive framework to derive quantum-optical lattice descriptions that overcome this trade-off. Combining symmetry-constrained tight-binding constructions with numerically computed photonic band structures and field profiles, our method yields minimal, symmetry-enforced lattice Hamiltonians that reproduce the target photonic dispersion while retaining the mode-resolved (position- and polarization-dependent) structure of the light-matter coupling. We show that these models recover Green's-function-based emitter dynamics in the perturbative regime, while providing access to non-perturbative quantum dynamical simulations beyond emitter-only descriptions. As a proof of principle, we apply the framework to a two-dimensional photonic crystal and show that it captures polarization-dependent directional emission inaccessible to scalar models, while enabling the analysis of non-Markovian light-matter dynamics and entanglement. Our results provide a practical bridge between classical electromagnetic simulation tools and quantum-optical many-body and non-Markovian modeling in photonic crystal settings.", "url": "https://arxiv.org/abs/2607.12603", "type": "理论+数值", "summary": "1. 该工作提出一个构建框架，从经典电磁模拟导出模式分辨的量子光学晶格模型，用于描述光子晶体中的发射器。\n2. 其技术核心是结合对称约束紧束缚构造与数值能带及场分布，获得最小晶格哈密顿量，同时保留光-物质耦合的位置与偏振依赖结构。\n3. 这为桥接经典电磁模拟与量子非马尔可夫多体动力学提供了实用途径，并揭示了标量模型无法捕获的偏振定向发射等关键效应。", "summary_source": "deepseek", "authors": [{"name": "Antonio Morales-Pérez"}, {"name": "Iñaki García-Elcano"}, {"name": "Chiara Devescovi"}, {"name": "Maia G. Vergniory"}, {"name": "Aitzol García-Etxarri"}, {"name": "Alejandro González-Tudela"}], "featured_authors": [{"name": "Antonio Morales-Pérez"}, {"name": "Iñaki García-Elcano"}, {"name": "Chiara Devescovi"}, {"name": "Maia G. Vergniory"}, {"name": "Aitzol García-Etxarri"}, {"name": "Alejandro González-Tudela"}], "author_count": 6}, {"id": "2607.12710", "category": "quant-ph", "title": "Thermally Activated Long-Range Entanglement from Non-Abelian Conservation Laws", "abstract": "Thermal noise ordinarily suppresses quantum entanglement. We show that a strong non-Abelian conservation law can convert local thermal fluctuations into an unbounded operational resource. For a broad class of finite-range $SU(2)$-invariant spin chains restricted to the global-singlet sector, an explicit representation-space protocol yields $Y_N=\\frac12\\log_2 N+O_\\beta(1)$, and hence $E_{\\mathrm{D}}\\geq Y_N$, throughout a finite high-temperature interval. Local thermal fluctuations produce subsystem spins $j\\sim\\sqrt N$, whose globally locked irreducible representations contain $\\log_2(2j+1)\\sim\\frac12\\log_2N$ ebits. An exactly solvable dimer chain exhibits a sharper effect: its zero-temperature state is unentangled across the cut, whereas every fixed $T>0$ produces $E_{\\mathrm{D}}=\\frac{1}{2}\\log_2 N+C(T)+o(1)$, with crossover scale $T_*(N)\\sim\\Delta/\\ln N$. Exact diagonalization of a nonintegrable chain is consistent with the predicted scaling. Thus heating can activate system-size-diverging distillable entanglement across a macroscopic bipartition when thermalization is confined by a non-Abelian conservation law.", "url": "https://arxiv.org/abs/2607.12710", "type": "理论+数值", "summary": "1. 本文证明非阿贝尔守恒律可将局域热涨落转化为系统尺寸对数发散的可蒸馏纠缠，在有限高温区间内实现长程纠缠。\n2. 其核心机制是SU(2)不变自旋链全局单态扇区中，热诱导的子系统自旋j~√N通过全局锁定不可约表示产生log₂(2j+1)~½log₂N个纠缠比特。\n3. 该结果为受非阿贝尔守恒律限制的热化系统中利用加热产生可扩展纠缠资源提供了可检验的理论框架，并启发在量子信息处理中探索热纠缠的有序相。", "summary_source": "deepseek", "authors": [{"name": "Shuai Zeng"}], "featured_authors": [{"name": "Shuai Zeng"}], "author_count": 1}, {"id": "2607.12780", "category": "quant-ph", "title": "When Close Enough Is Not Enough: Autoregressive Drift in Quantum Circuit Synthesis", "abstract": "Quantum circuit optimization for fault-tolerant computing requires exact functional equivalence while minimizing expensive non-Clifford resources such as T gates. We study this problem using a compact 44.8M-parameter encoder-decoder transformer with structured circuit tokenization, evaluating on parameterized circuits (2-6 qubits) and Clifford+T circuits (3-6 qubits). On parameterized circuits, a hybrid approach -- structure from the transformer, angles from classical optimization -- achieves median fidelity 1.000 on 3-6 qubit circuits. On Clifford+T circuits, where all gates are discrete and no post-processing is possible, the model learns valid syntax and accurate T-Count statistics, yet exact equivalence degrades sharply with target length -- from 88% on circuits with <=9 gates to near zero beyond 26 gates. We trace this failure to autoregressive drift: early-token divergence cascading irrecoverably through left-to-right decoding. Two levers partially mitigate the drift: inference-time strategies that generate multiple candidates and select via equivalence verification raise exact-match rates from 7% to 22.5%, while scaling training data by 2.5x pushes them to 39.5%. Yet the degradation with target length persists -- even with more data, exact equivalence drops from 94% on short circuits to under 4% beyond 26 gates. The contrast between settings is our central finding: when approximate outputs can be rescued by post-processing, the transformer succeeds; when exact discrete correctness is required, autoregressive drift limits reliability, with both inference-time search and data scaling as effective levers while training-side fine-tuning and model-level diversification are not.", "url": "https://arxiv.org/abs/2607.12780", "type": "理论+数值", "summary": "1. 该工作使用一个4448万参数的编码器-解码器Transformer，系统研究了量子电路精确合成中自回归生成随电路长度急剧退化的问题。\n2. 其主要发现是早期标记发散通过自回归级联导致精确等价性从短电路的88%降至长电路的近乎为零，并揭示了推理时多候选搜索与数据缩放可部分缓解漂移。\n3. 这表明在无需后处理的离散门合成中，自回归生成存在根本可靠性限制，未来需发展非因果或迭代校正的生成范式。", "summary_source": "deepseek", "authors": [{"name": "Mehdi Saeedi"}, {"name": "Eddie Richter"}, {"name": "Paul Hartke"}], "featured_authors": [{"name": "Mehdi Saeedi"}, {"name": "Eddie Richter"}, {"name": "Paul Hartke"}], "author_count": 3}, {"id": "2607.12821", "category": "quant-ph", "title": "A Quantum Computing Approach to Track Reconstruction in Strip-Type Detectors", "abstract": "This study investigates the use of quantum annealing for particle track reconstruction in strip-type gaseous detectors. In such detectors, ghost hits and multiple hit combinations can turn pattern recognition into a combinatorial optimization problem. We formulate two reconstruction subproblems as quadratic unconstrained binary optimization problems. The first subproblem selects detector hits associated with a single photon track inside a localized candidate region. The second subproblem selects cluster triplets from different detector layers so that multiple track candidates can be handled within a single quantum processing unit(QPU) submission. The proposed formulations are tested using simulated DAMSA detector events. For the single track hit selection task, the QPU based reconstruction gives position and angular resolutions close to those obtained with a Kalman based reconstruction. In the simultaneous association task, valid cluster triplets are first extracted from the QPU samples and then connected using an association rule based on graph connectivity to construct track candidates. The DAMSA event topology studied here has low pileup and is dominated by the two photon signal from axion-like particle(ALP) decay. In this setting, the results show that the QUBO formulations can reproduce local reconstruction decisions. This provides a practical basis for further studies of reconstruction methods that combine quantum and classical computing in more complex tracking environments.", "url": "https://arxiv.org/abs/2607.12821", "type": "数值", "summary": "1. 本研究将条形气体探测器中的粒子径迹重建转化为两个二次无约束二元优化子问题，并利用量子退火处理器求解。\n2. 其技术核心在于分别优化单光子径迹内击中点选择与多层探测器簇三重态关联，在低堆积DAMSA模拟事件中达到接近卡尔曼重建的位置与角度分辨率。\n3. 这为在更复杂径迹环境中融合量子与经典计算的重建方法提供了可扩展的实证基础。", "summary_source": "deepseek", "authors": [{"name": "Seungyeob Jwa"}, {"name": "Hyunyong Kim"}, {"name": "Jangho Kim"}, {"name": "Minseok Oh"}], "featured_authors": [{"name": "Seungyeob Jwa"}, {"name": "Hyunyong Kim"}, {"name": "Jangho Kim"}, {"name": "Minseok Oh"}], "author_count": 4}, {"id": "2607.12822", "category": "quant-ph", "title": "The Resolution of the Identity as a Generator of Exact Integral Identities: A Coherent-State Approach", "abstract": "The resolution of the identity is typically utilized as a passive representation tool in standard quantum mechanics textbooks. In this paper, we reinterpret this traditional perspective by introducing the resolution of the identity associated with Glauber coherent states as a direct generator of exact complex Gaussian integral identities. By systematically projecting the continuous coherent-state completeness relation onto the discrete Fock basis, highly generalized Gaussian integral relations emerge naturally as a direct consequence of state preservation, rather than being introduced as independent mathematical postulates. We demonstrate that this overarching formal structure simultaneously dictates both discrete (Kronecker delta) and continuous (Dirac delta) localization kernels under appropriate basis projections, providing a sharp conceptual contrast between the structural features of overcomplete and strictly orthogonal representations. Crucially, we highlight an intriguing non-commuting behavior in the parameter limits of the master identity. Requiring only the elementary properties of coherent states and the Dirac formalism, this approach offers a transparent and visually intuitive illustration of how Hilbert-space completeness inherently encodes vast libraries of exact, solvable mathematical relations -- providing a unifying perspective suitable for advanced undergraduate and graduate instruction.", "url": "https://arxiv.org/abs/2607.12822", "type": "理论", "summary": "1. 该文重新诠释Glauber相干态的单位分解，将其作为生成精确复高斯积分恒等式的直接源头。\n2. 通过将连续相干态完备性关系投影到离散Fock基，自然导出高度泛化的高斯积分，并揭示过完备与正交表示在局域化核上的结构对比。\n3. 仅需相干态基本性质与Dirac形式，即表明Hilbert空间完备性内嵌大量精确可解数学恒等式，为高等量子力学教学提供统一直观框架。", "summary_source": "deepseek", "authors": [{"name": "Ghasem Asadi Cordshooli"}, {"name": "Mehdi Mirzaee"}], "featured_authors": [{"name": "Ghasem Asadi Cordshooli"}, {"name": "Mehdi Mirzaee"}], "author_count": 2}, {"id": "2607.12838", "category": "quant-ph", "title": "Thermal Suppression of Dynamical Quantum Phase Transitions in Finite-Dimensional Systems A Quasi-Hermitian Framework", "abstract": "We investigate dynamical quantum phase transitions (DQPTs) in finite-dimensional systems prepared in thermal equilibrium states and subjected to a sudden quench. A mixed-state Loschmidt amplitude is constructed from first principles within a metric-stationary pseudo-Hermitian framework, providing a self-contained derivation of the finite-temperature quench dynamics. Applying this framework to an $N$-level model consisting of a two-level sector coupled to $N-2$ spectator states, we find that temperature controls the DQPTs through the redistribution of thermal weights among the eigenstates. This mechanism leads to a dimensionality-dependent threshold temperature that becomes finite when the Hilbert-space dimension reaches five, above which the Loschmidt amplitude loses all real zeros and the DQPTs are fully suppressed. The thermal suppression mechanism suggests a general principle for controlling dynamical criticality through thermal occupation, while the quasi-Hermitian framework provides the self-consistent foundation for its rigorous derivation.", "url": "https://arxiv.o
