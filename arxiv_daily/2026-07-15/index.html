  <style>
    :root {
      --bg: #f6f1e8;

      --accent-2: #1d5f6b;

      min-height: 100vh;
    }
    .shell { width: min(1220px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 64px; }
    .hero {
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(255,255,255,0.84), rgba(255,248,238,0.72)), linear-gradient(135deg, rgba(143,61,46,0.08), rgba(29,95,107,0.08));
      box-shadow: var(--shadow);
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.82); border: 1px solid var(--line); color: var(--muted); font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase;
    }

    .stat .value { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
    .controls { position: sticky; top: 12px; z-index: 3; margin-top: 22px; padding: 18px; border: 1px solid var(--line); border-radius: 24px; background: rgba(250,244,236,0.9); backdrop-filter: blur(16px); box-shadow: 0 10px 24px rgba(54,32,16,0.08); }
    .control-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 16px; }

    .field label { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
    .search { width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line); background: rgba(255,255,255,0.92); font: inherit; color: var(--text); }

    .chip[data-type="实验"].active { border-color: rgba(47,107,57,0.35); background: rgba(47,107,57,0.12); color: #214c29; }

    .paper-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 18px; margin-top: 22px; }
    .paper { display: flex; flex-direction: column; gap: 14px; padding: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 10px 24px rgba(54,32,16,0.06); }

    .author-block { display: grid; gap: 10px; padding: 14px 16px; border-radius: 18px; background: rgba(255,255,255,0.64); border: 1px solid var(--line); }
    .author-label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .author-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .author-item { display: grid; gap: 4px; }
    .author-item strong { font-size: 14px; }
    .author-item span { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .author-note { color: var(--muted); font-size: 12px; }
    .paper .summary { margin: 0; font-size: 15px; line-height: 1.75; white-space: pre-line; }
    details { border-top: 1px solid var(--line); padding-top: 12px; }
    details summary { cursor: pointer; color: var(--accent-2); font-weight: 700; list-style: none; }

    .paper footer a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .empty { display: none; margin-top: 24px; padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 22px; background: rgba(255,255,255,0.7); }
    @media (max-width: 980px) { .control-grid { grid-template-columns: 1fr; } .controls { position: static; } }
  </style>

  <script>
    const papers = [{"id": "2607.11988", "category": "cond-mat", "title": "Density evolution at fluid-fluid interfaces: A generalized Gibbs-Duhem theory", "abstract": "The classical Gibbs-Duhem relation applies to quasi-static processes and neglects kinetic effects, leaving a fundamental gap between Gibbs thermodynamics and Newtonian mechanics. Here, we derive a generalized Gibbs-Duhem framework that incorporates kinetic contributions, thereby establishing a unified connection between classical thermodynamics and Newtonian mechanics. Based on this framework, we propose an alternative evolution equation governing density dynamics at fluid-fluid interfaces. In appropriate limiting cases, the resulting density evolution equation naturally recovers the definition of the speed of sound, Bernoulli's law, and the van der Waals equation of state (EOS).", "url": "https://arxiv.org/abs/2607.11988", "type": "理论", "summary": "1. 该工作从经典Gibbs-Duhem关系与牛顿力学间的缺口出发，推导了包含动力学贡献的广义Gibbs-Duhem理论。\n2. 其核心在于提出了流体-流体界面处密度演化的替代方程，并在极限情形下自然恢复声速定义、伯努利定律及范德瓦尔斯状态方程。\n3. 这为统一热力学与牛顿力学描述非平衡界面过程提供了自洽框架，启发后续针对动力学效应下的界面状态方程研究。", "summary_source": "deepseek", "authors": [{"name": "Fei Wang"}], "featured_authors": [{"name": "Fei Wang"}], "author_count": 1}, {"id": "2607.11996", "category": "cond-mat", "title": "Coordination-Resolved Surrogate Models for Thermodynamic Stability, Band Gaps, and Magnetic Moments of Spinel Oxides, Sulfides, and Selenides", "abstract": "We curated 320 cubic ($Fd\\bar{3}m$) spinel entries from the Materials Project-nitrides, oxides, sulfides, and selenides, including single-cation mixed-valence $A_3X_4$ compounds-and trained tree-ensemble surrogates for the formation energy, energy above the convex hull, band gap, total magnetization, and metallicity. Cations were assigned to tetrahedral-like and octahedral-like groups from CrystalNN coordination numbers rather than from element identity, and the evaluation was group-aware throughout: splits were grouped by reduced formula, every transform was fit on training folds only, and champion models were selected on cross-validated scores before the holdout was examined. Over twenty repeated grouped holdouts (single-seed refits that reuse the tuned hyperparameters, and are therefore mildly optimistic) the champions reach mean absolute errors of $0.121\\pm0.030$ eV/atom for the formation energy, $0.048\\pm0.013$ eV/atom for the hull distance, and $1.27\\pm0.19$~\\muBfu{} for the magnetization, with a metallicity accuracy of $0.85\\pm0.06$. Band-gap regression does not beat a trivial baseline on the 19-member non-metal holdout under paired bootstrap testing, we report this negative result and trace it to sample scarcity and to the semi-local DFT labels. On the identical grouped split, the tabular champion is more accurate than an untuned MEGNet trained from scratch (0.087 versus 0.209 eV/atom formation-energy MAE on the primary holdout), a comparison that bounds, rather than settles, the descriptor-versus-graph question at this data scale. SHAP attribution ties the magnetization model to octahedral $d$-occupancy and the formation-energy and band-gap models to electronegativity descriptors, and grouped conformal intervals, permutation nulls, and leave-one-chemistry-out tests bound a domain of applicability that is uneven across anions and cations.", "url": "https://arxiv.org/abs/2607.11996", "type": "理论+数值", "summary": "1. 该工作收集320个立方尖晶石（氧化物、硫化物、硒化物及A3X4）的Materials Project数据，训练树集成代理模型预测形成能、凸包能量、带隙、磁矩与金属性。\n2. 核心卖点是以CrystalNN配位数而非元素身份对阳离子进行四面体/八面体分组，结合组感知交叉验证与SHAP归因，揭示磁化模型与八面体d轨道占据、形成能和带隙模型与电负性描述符的物理关联。\n3. 该框架在20次重复组保留测试中达较高精度，但带隙回归因样本稀缺与半局域DFT标签失效，为小数据场景下描述符与图神经网络之争提供了经验上界，并借助分组共形区间与留一化学式测试限定了模型在阴离子和阳离子空间上的非均匀适用域。", "summary_source": "deepseek", "authors": [{"name": "Keltoum Khallouq"}, {"name": "Ayoub El Maazouzi"}, {"name": "Rachid Masrour"}], "featured_authors": [{"name": "Keltoum Khallouq"}, {"name": "Ayoub El Maazouzi"}, {"name": "Rachid Masrour"}], "author_count": 3}, {"id": "2607.12023", "category": "cond-mat", "title": "Symmetry-Twisted Multi-Entropies: Order Parameters for 2D SPT Phases", "abstract": "Although symmetry-protected topological phases (SPTs) can be distinguished by their entanglement properties, it has been unclear how to extract this information directly from expectation values beyond the 1D case. Here, we close this gap and propose a pair of nonlocal order parameters that can detect and distinguish all bosonic SPTs in 2D protected by internal discrete, Abelian unitary symmetries. The desired topological invariants are extracted by these quantities by effectively simulating the SPT path integral on topologically non-trivial spacetime manifolds. Our order parameters are defined in terms of expectation values of partial symmetry and permutation operations acting on fixed numbers of replicas of the system in finite spatial regions. These expectation values correspond to symmetry-twisted versions of multipartite entanglement quantities known as multi-entropies. We show explicitly that our two order parameters detect symmetry-protected four-party and six-party entanglement, respectively, and we constrain possible \"spurious\" contributions. We analytically test our proposal in fixed-point lattice models. Our results suggest multipartite entanglement to be a defining feature of SPTs; indeed, we expect our methods to generalize to fermionic and higher-dimensional systems.", "url": "https://arxiv.org/abs/2607.12023", "type": "理论", "summary": "1. 该工作提出了一对非局域序参量，用于检测和区分受内部离散阿贝尔酉对称性保护的二维玻色子SPT相。\n2. 其核心在于通过有限空间区域上多副本系统的部分对称性与置换操作期望值，实现对称性扭转的多部分纠缠熵，提取拓扑不变量。\n3. 这揭示了多部分纠缠是SPT的定义特征，并预期该方法可推广至费米子及高维系统。", "summary_source": "deepseek", "authors": [{"name": "Ramanjit Sohal"}, {"name": "Michael Levin"}, {"name": "Ruben Verresen"}], "featured_authors": [{"name": "Ramanjit Sohal"}, {"name": "Michael Levin"}, {"name": "Ruben Verresen"}], "author_count": 3}, {"id": "2607.12027", "category": "cond-mat", "title": "Mapping vortices to anyons in toric code phases of generalized Kitaev models", "abstract": "We present a comprehensive theory of mapping flux excitations, or vortices, to electric and magnetic particles in the toric code phases of generalizations of the Kitaev honeycomb model in two spatial dimensions. Our method, which is formulated with the Majorana fermion representation, utilizes the fusion rule of the Abelian anyons and the physical constraint on the fermion parity, and applies to generic model parameters including any perturbative limit. Not only are we able to reproduce the known mapping scheme in the dimer limit, we also derive the conditions for the invariance of anyon species of individual vortices. We prove that the mapping of anyons is left unchanged by any continuous evolution of model parameters that does not close the fermion gap in both the vortex-free and two-vortex sectors, which enables precise demarcations between multiple regimes associated with different maps within a single phase characterized by a trivial Chern number. We illustrate our theory via extensive computations for a number of selected models, in particular those defined on the square-octagon lattice and the honeycomb lattice with a Kekulé structure. We also demonstrate that distinct mappings of anyons can nevertheless exhibit the same weak symmetry breaking, and further argue that they belong to the same symmetry-enriched topological order.", "url": "https://arxiv.org/abs/2607.12027", "type": "理论", "summary": "1. 该工作提出了一套将广义Kitaev模型中通量激发映射为toric code相位内电性与磁性任意子的完整理论。\n2. 其核心在于利用Majorana费米子表示、阿贝尔任意子的融合规则以及费米子宇称约束，推导出任意子映射在连续参数演化下保持不变的严格条件。\n3. 这为不依赖陈数平庸相中不同映射区域的精确划分，以及对称性破缺相同但任意子映射不同的对称保护拓扑有序的归属判定提供了理论框架。", "summary_source": "deepseek", "authors": [{"name": "Li Ern Chern"}, {"name": "Roderich Moessner"}, {"name": "Claudio Castelnovo"}], "featured_authors": [{"name": "Li Ern Chern"}, {"name": "Roderich Moessner"}, {"name": "Claudio Castelnovo"}], "author_count": 3}, {"id": "2607.12029", "category": "cond-mat", "title": "Logarithmic corrections to bulk and surface criticality in a three-dimensional quantum Heisenberg antiferromagnet", "abstract": "At the bulk upper critical dimension, marginally irrelevant interactions generate multiplicative logarithmic corrections to mean-field scaling. While these corrections are well understood for bulk observables, their consequences for boundary criticality, particularly for finite-size scaling, remain much less explored. Here we combine large-scale quantum Monte Carlo simulations with boundary renormalization-group analysis to study a (3 + 1)D O(3) quantum critical point. After verifying the known logarithmically modified bulk finite-size scaling, including the correlation-length scaling governed by the logarithmic finite-size exponent \\hat{\\coppa}, we tune the surface coupling to identify ordinary, special, and extraordinary boundary regimes. For the ordinary and special transitions, we derive logarithmic correction exponents and \\hat{\\coppa}-dependent finite-size scaling forms for boundary correlations, including results that have not been systematically established before. These predictions are quantitatively supported by Monte Carlo data. In the extraordinary regime, we find long-range surface magnetic order and a logarithmically enhanced surface-bulk correlation.", "url": "https://arxiv.org/abs/2607.12029", "type": "理论+数值", "summary": "1. 该工作结合大尺度量子蒙特卡洛模拟与边界重整化群分析，研究了(3+1)维O(3)量子临界点处体态与表面临界性的对数修正。\n2. 其卖点在于系统推导了普通与特殊表面转变的对数修正指数以及依赖对数有限尺寸标度指数的边界关联标度形式，并得到数值验证。\n3. 这为理解上临界维度量子系统中边界临界性的普适类与对数增强表面-体态关联提供了新见解。", "summary_source": "deepseek", "authors": [{"name": "Xuyang Liang"}, {"name": "Xiao-Chuan Wu"}, {"name": "Zenan Liu"}, {"name": "Zhe Wang"}, {"name": "Zheng Yan"}, {"name": "Dao-Xin Yao"}], "featured_authors": [{"name": "Xuyang Liang"}, {"name": "Xiao-Chuan Wu"}, {"name": "Zenan Liu"}, {"name": "Zhe Wang"}, {"name": "Zheng Yan"}, {"name": "Dao-Xin Yao"}], "author_count": 6}, {"id": "2607.12093", "category": "cond-mat", "title": "Harvesting Reshapes Dynamical Populations", "abstract": "Harvesting -- the periodic removal of individuals above or below a threshold trait value -- reshapes heterogeneous populations without altering their underlying stochastic dynamics. We study how repeated harvesting events steer the evolution of probability densities for classes of stochastic processes exhibiting both normal and anomalous dynamics, as well as a prototypical predator-prey model. Removal of the upper portion of the density drives the system to a quasi-steady state when viewed at the ``harvesting clock''. This state depends only on the harvesting threshold and frequency but not on the initial conditions. Removal of the lower portion of the density fixes its shape while generating a constant effective drift that exceeds that of the unharvested mean. Our results suggest the possibility of manipulating the dynamics of stochastic populations through external selection interventions.", "url": "https://arxiv.org/abs/2607.12093", "type": "理论", "summary": "1. 该工作研究了重复收割事件对异质随机种群概率密度演化的影响，涵盖正常、异常动力学及捕食者-猎物模型。\n2. 其技术要点在于发现移除密度上部导致系统进入仅依赖阈值和频率的准稳态，移除下部则固定形状并产生超均值有效漂移。\n3. 这启示通过外部选择干预可操纵随机种群动力学，为调控复杂系统统计行为提供了理论依据。", "summary_source": "deepseek", "authors": [{"name": "R. K. Singh"}, {"name": "Michael Assaf"}, {"name": "Jason R. Green"}, {"name": "Erez Aghion"}], "featured_authors": [{"name": "R. K. Singh"}, {"name": "Michael Assaf"}, {"name": "Jason R. Green"}, {"name": "Erez Aghion"}], "author_count": 4}, {"id": "2607.12102", "category": "cond-mat", "title": "Analytical and numerical solutions to the non-diffusive Stefan problem", "abstract": "In this work, the Maxwell--Cattaneo--Vernotte (MCV) equation is used to model the one-dimensional hyperbolic Stefan problem in the limit of a small Stefan number (Ste $\\ll$ 1). The solutions are approximated with perturbation series expansions using a reformulation in which time is expressed as a function of the solid-liquid interface position. The first proposed solution is derived in a framework that considers diffusive heat transfer at the phase change interface, for analytic tractability. Two rectification strategies are proposed to address the asymptotic divergence present in this formulation: a rescaled inner solution which is then combined with the outer solution to yield a composite solution, and size-dependent thermo-physical system parameters for better capture of hyperbolic effects at the phase change interface. The resulting interface profiles exhibit a characteristic parabolic-like shape, consistent with diffusive Stefan problem findings, with pronounced early-time hyperbolic effects at larger thermal relaxation times. Parametric studies are done over three pertinent variables in the dimensionless system: the Stefan number ($\\mathrm{Ste}$), the dimensionless thermal relaxation time ($\\widetilde \\tau$), and the thermal diffusivity ($\\alpha$). The studies suggest that model error scales with the Stefan number in accordance with the theoretical truncation error of the perturbation expansion. Additionally, larger values of $\\widetilde \\tau$ amplify early-time hyperbolic effects, thereby increasing model error, while larger $\\alpha$ extends the relative temporal domain over which these hyperbolic effects remain significant, also corresponding to an increase in model error.", "url": "https://arxiv.org/abs/2607.12102", "type": "理论+数值", "summary": "1. 该工作基于MCV方程，在小Stefan数极限下对一维双曲Stefan问题给出解析与数值解，通过时间-界面位置变换导出摄动序列，并引入内尺度复合解及尺寸依赖参数两种方案修正渐近发散。\n2. 核心物理在于界面位置呈抛物线形演进，与大热弛豫时间放大的早期双曲效应相耦合，系统揭示了模型误差随Stefan数、热弛豫时间和热扩散率的定量标度律。\n3. 这为超越经典扩散假设的相变传热建模提供了可控的误差分析与高精度模拟框架，对快速凝固及微纳热管理等过程具有理论指导意义。", "summary_source": "deepseek", "authors": [{"name": "Matthew Van Ham"}, {"name": "Minghan Xu"}, {"name": "Samuel Huberman"}], "featured_authors": [{"name": "Matthew Van Ham"}, {"name": "Minghan Xu"}, {"name": "Samuel Huberman"}], "author_count": 3}, {"id": "2607.12307", "category": "cond-mat", "title": "Solvent Mixing Effect on Free-Energy Barrier and Stability for Molecular Recognition Driven by the Translational Motion of Solvent Molecules", "abstract": "We calculated the potentials of mean force (PMFs) between a ring-like host and a spherical guest in a solvent mixture. We adopted hard-body interactions between particles to discuss the effects of solvent-particle translational motion. The PMFs were obtained using the three-dimensional Ornstein-Zernike equation coupled with the modified hypernetted-chain closure (3D-MHNC-OZ theory). The entropic stabilization at the recognition site is confirmed, and a free-energy barrier wall is observed surrounding it. The free-energy barrier for the solvent mixture is much lower than that for the one-component solvent. Similar barrier reduction for the association of two spherical solute molecules has also been reported, and the mixing effect also reduced the dimerization stability. By contrast, the mixing effect does not significantly reduce recognition stability in the present study. In this respect, the behavior of the host-guest association is different from that of the association of two spherical solute molecules.", "url": "https://arxiv.org/abs/2607.12307", "type": "理论", "summary": "1. 该工作利用三维Ornstein-Zernike方程结合修正超网链闭包，计算了混合溶剂中环状宿主与球形客体的平均力势。\n2. 其卖点在于揭示混合溶剂通过平移运动效应显著降低识别位点周围自由能垒，却不显著削弱识别稳定性，区别于球形溶质二聚化。\n3. 这为理解多组分溶剂中分子识别热力学机制提供了新视角，并启发设计基于溶剂混合调控的分子识别与组装系统。", "summary_source": "deepseek", "authors": [{"name": "Mika Matsuo"}, {"name": "Ryo Akiyama"}], "featured_authors": [{"name": "Mika Matsuo"}, {"name": "Ryo Akiyama"}], "author_count": 2}, {"id": "2607.12320", "category": "cond-mat", "title": "Quantum anomalous Hall effect with tunable Chern numbers induced by d-wave sublattice-staggered altermagnetism", "abstract": "We construct a minimal spinful tight-binding model on a square lattice, where a $d$-wave sublattice-staggered altermagnetism drives the quantum anomalous Hall effect. Here the exchange field is staggered between the two sublattices, where it takes opposite signs on $A$ and $B$ described by the Pauli matrix $\\tau_z$. The resulting insulating phases host tunable Chern numbers $\\mathcal{C}=\\pm1$ and $\\mathcal{C}=\\pm2$, controlled by the staggered exchange strength and the sublattice-staggered potential. We determine the complete phase diagram, identify valley-resolved band inversions at the $X$ and $Y$ points in the Brillouin zone, and demonstrate chiral edge states together with quantized two-terminal conductance plateaus. Our work provides a simple route to realizing the quantum anomalous Hall effect in compensated magnets via a $d$-wave sublattice-staggered altermagnetism.", "url": "https://arxiv.org/abs/2607.12320", "type": "理论+数值", "summary": "1. 该工作构造了正方晶格上的自旋紧束缚模型，通过d波子晶格交错反铁磁序驱动出量子反常霍尔效应。\n2. 其核心在于交换场在子晶格间由泡利矩阵τ_z交错，可调陈数C=±1与±2由交错场强和子晶格势协同控制。\n3. 这为在补偿磁体中通过d波交错反铁磁实现量子反常霍尔效应及可调拓扑相提供了简约路径。", "summary_source": "deepseek", "authors": [{"name": "Lizhou Liu"}, {"name": "Qing-Feng Sun"}], "featured_authors": [{"name": "Lizhou Liu"}, {"name": "Qing-Feng Sun"}], "author_count": 2}, {"id": "2607.12323", "category": "cond-mat", "title": "Second-order topological insulator induced by compensated altermagnetism without bulk spin splitting", "abstract": "We theoretically demonstrate a second-order topological insulating phase induced by compensated altermagnetism, while keeping the bulk gap unchanged, in a two-dimensional topological insulator film. By introducing a layer-resolved out-of-plane $d$-wave altermagnetic term with opposite signs on the top and bottom layers, the system preserves $\\mathcal{PT}$ symmetry and maintains spin degeneracy in the bulk bands, while simultaneously gapping the helical edge states and generating localized corner states. The resulting higher-order phase is characterized by nonzero mirror-graded winding numbers, and an effective edge theory shows that the corner states arise from Dirac mass domain walls. We further determine the phase boundaries analytically and construct the corresponding topological phase diagram, establishing a robust route to higher-order topology without bulk spin splitting.", "url": "https://arxiv.org/abs/2607.12323", "type": "理论+数值", "summary": "1. 该工作理论证明在二维拓扑绝缘体薄膜中，由补偿性交变磁矩诱导出二阶拓扑绝缘相，且体带隙保持不变。\n2. 其核心在于引入层分辨d波交变磁矩，保持PT对称性与体带自旋简并的同时，使螺旋边缘态打开能隙并产生局域角态。\n3. 这为无体自旋分裂条件下实现高阶拓扑相提供了明确途径，并可通过镜像级数绕数解析确定相边界。", "summary_source": "deepseek", "authors": [{"name": "Lizhou Liu"}, {"name": "Qing-Feng Sun"}, {"name": "Ying-Tao Zhang"}], "featured_authors": [{"name": "Lizhou Liu"}, {"name": "Qing-Feng Sun"}, {"name": "Ying-Tao Zhang"}], "author_count": 3}, {"id": "2607.12355", "category": "cond-mat", "title": "From stable periodic orbits to many-body chaos: doubly tunable prethermalization via engineering of an emergent band structure", "abstract": "We uncover a family of many-body periodic orbits in a periodically driven (Floquet) spin system away from the high-frequency limit. While linear stability analysis predicts that perturbed many-body trajectories remain close to stable periodic orbits, thermodynamic principles dictate that Floquet heating will ultimately set in. Our work aims to resolve the tension between these two expectations. In particular, we show that perturbations away from the stable periodic orbits feature a description akin to a quasiparticle band structure. A long-lived prethermal regime appears when modes around the gapless point are slowly populated. The dispersion determines the prethermal lifetime, and we show how band engineering leads to a \"doubly tunable\" parametric dependence of the prethermal lifetime $R^{-W}$, with $R$ the width in momentum space of the quasiparticle distribution and $W$ the exponent of the dispersion around the gapless point. Our results not only establish a powerful route toward stabilizing non-equilibrium phases of matter in driven many-body systems but also establish a conceptual bridge between periodic orbits in 'low-dimensional' nonlinear systems and many-body chaos.", "url": "https://arxiv.org/abs/2607.12355", "type": "理论", "summary": "1. 该工作在周期性驱动的自旋系统中发现了远离高频极限时的稳定多体周期轨道，并通过扰动动力学揭示了其与准粒子能带结构的对应关系，解决了线性稳定与热力学加热预期之间的矛盾。\n2. 其核心在于通过调控准粒子色散的动量空间宽度和指数，实现了预热化寿命的双重可调参数依赖关系 \\(R^{-W}\\)，从而延长了非平衡态的寿命。\n3. 这一发现不仅为非平衡物相稳定化提供了新途径，而且架起了低维非线性周期轨道与多体混沌之间的概念桥梁，推动了驱动系统混沌动力学的理解。", "summary_source": "deepseek", "authors": [{"name": "Jianan Wang"}, {"name": "Yang Hou"}, {"name": "Andrea Pizzi"}, {"name": "Johannes Knolle"}, {"name": "Roderich Moessner"}, {"name": "Hongzheng Zhao"}], "featured_authors": [{"name": "Jianan Wang"}, {"name": "Yang Hou"}, {"name": "Andrea Pizzi"}, {"name": "Johannes Knolle"}, {"name": "Roderich Moessner"}, {"name": "Hongzheng Zhao"}], "author_count": 6}, {"id": "2607.12357", "category": "cond-mat", "title": "A Gaussian-Remainder Hierarchy for Sums of Random Variables with Big-Jump Statistics", "abstract": "We develop an exact Gaussian-remainder hierarchy for the probability density of the sum of $N$ independent, identically distributed random variables with broad, finite-variance distribution for the summands. The hierarchy separates the Gaussian fixed-point contribution from residual sectors that retain the original single-summand density. For subexponential densities, the first nontrivial truncation yields a simple finite-$N$ approximation that involves one convolution with a Gaussian background and a subtraction that removes Gaussian overcounting. This approximation captures the Gaussian center, the crossover region, and the big-jump tail within a single expression, as demonstrated numerically for stretched-exponential and finite-variance power-law examples. The same first-order approximation reproduces the known asymptotic anomalous rate function for sums of stretched-exponential random variables and also provides an accurate approximation to the corresponding finite-$N$ rate function.", "url": "https://arxiv.org/abs/2607.12357", "type": "理论+数值", "summary": "1. 该工作建立了一个精确的高斯余项层次结构，用于描述具有宽尾有限方差分布的独立同分布随机变量之和的概率密度。\n2. 其核心在于将高斯固定点贡献与保留原始单变量密度的余项扇区分离，通过一阶截断获得同时捕捉高斯中心、交叉区和大跳跃尾部的有限N近似。\n3. 该近似不仅再现了拉伸指数变量的渐近反常速率函数，也为有限N速率函数提供精确近似，启发对宽尾系统有限尺度行为的统一理解。", "summary_source": "deepseek", "authors": [{"name": "Stanislav Burov"}], "featured_authors": [{"name": "Stanislav Burov"}], "author_count": 1}, {"id": "2607.12401", "category": "cond-mat", "title": "Pokrovsky--Talapov and Berezinskii--Kosterlitz--Thouless Phase Transitions in Bilayer Superconducting Films under an In-Plane Magnetic Field", "abstract": "We study finite-temperature phase transitions in a Josephson-coupled bilayer superconducting film with compact layer phases under an in-plane magnetic field. At zero temperature, where thermally excited layer vortices are absent, the relative-phase sector undergoes a Pokrovsky--Talapov (PT) commensurate--incommensurate (C--IC) transition from a commensurate Fulde--Ferrell (C/FF) state to an incommensurate Bloch superconducting (IC/Bloch SC) state. At finite temperature, compactness separates two distinct defect mechanisms. The C--IC boundary remains a PT soliton-entry line: interlayer Josephson vortex--antivortex-pair solitons enter with the square-root onset $\\rho_{\\rm sol}\\propto [k_0-k_0^c(T)]^{1/2}$. Thermal melting is instead Berezinskii--Kosterlitz--Thouless (BKT)-like, with correlation exponent $\\eta=1/4$ at the boundary, but the active vortex channel changes across the phase diagram. Josephson locking suppresses elementary layer vortices in the C/FF state and selects a same-vorticity layer-pair BKT channel, whereas elementary layer vortices control melting of the IC/Bloch SC state.", "url": "https://arxiv.org/abs/2607.12401", "type": "理论+数值", "summary": "1. 该工作理论分析了面内磁场下约瑟夫森耦合双层超导薄膜的有限温度相变，明确了零温下相对相位从公度Fulde-Ferrell态到非公度Bloch超导态的Pokrovsky–Talapov过渡。\n2. 其核心物理在于紧凑相位导致的两种缺陷机制：公度-非公度边界为孤子进入线，孤子密度以平方根跃迁；热熔化则通过Berezinskii–Kosterlitz–Thouless机制发生，但活性涡旋通道在公度态（锁定同涡度层对）与非公度态（激活单层涡旋）间切换。\n3. 这为理解二维超导中拓扑相变与紧凑性约束的相互作用提供了清晰框架，对探索关联超导系统及设计相关实验具有指导意义。", "summary_source": "deepseek", "authors": [{"name": "Yicheng Zhong"}, {"name": "Yi Zhou"}], "featured_authors": [{"name": "Yicheng Zhong"}, {"name": "Yi Zhou"}], "author_count": 2}, {"id": "2607.12410", "category": "cond-mat", "title": "Fractionalized Fermi liquids with the ghost-Gutzwiller Ansatz", "abstract": "Fractionalized Fermi liquids ($\\mathrm{FL}^{\\!*}$), elusive metallic states characterized by fractionalized quasiparticles alongside conventional ones and defying Luttinger's theorem, are prime candidates for the pseudogap regime of underdoped cuprates. We show that a $\\mathrm{FL}^{\\!*}$ phase emerges in the single-band $t$-$J$ model through a simple ghost-Gutzwiller Ansatz, optimized at the cost of a mean-field calculation. The resulting temperature-doping phase diagram encompasses a low-doping $\\mathrm{FL}^{\\!*}$, a $d$-wave superconducting dome, and an overdoped conventional Fermi liquid, thereby reproducing key qualitative features of cuprate phenomenology.", "url": "https://arxiv.org/abs/2607.12410", "type": "理论+数值", "summary": "1. 该工作通过单带t-J模型中的简单鬼-古兹维勒拟设，以平均场优化代价展示了分数化费米液体（FL*）相的出现。\n2. 其核心卖点在于所获温度-掺杂相图同时包含低掺杂FL*、d波超导穹顶与过掺杂常规费米液体，再现了铜氧化物关键唯象特征。\n3. 这为赝能隙态中分数化准粒子与常规准粒子共存的微观机制提供了简洁理论框架，启发进一步关联电子系统的相关研究。", "summary_source": "deepseek", "authors": [{"name": "Ivan Pasqua"}, {"name": "Carlos Mejuto-Zaera"}, {"name": "Michele Fabrizio"}], "featured_authors": [{"name": "Ivan Pasqua"}, {"name": "Carlos Mejuto-Zaera"}, {"name": "Michele Fabrizio"}], "author_count": 3}, {"id": "2607.12484", "category": "cond-mat", "title": "Solitary waves of attracting SU(N) fermions", "abstract": "We study the formation, dynamics, and disorder robustness of bound states in attractively interacting SU(N) fermions on a one-dimensional ring lattice. Using exact diagonalization in fixed-momentum sectors and Bethe ansatz exact results as a guide, we resolve the many-body spectrum into bands related to the possible partitions of the particles into bound composites, and characterize their internal structure also through density-density and N-body correlations. A pinning quench protocol reveals a transition from dispersive spreading to dynamical localization as the attractive interaction increases relative to the single-particle hopping. We find that the bound state dynamics for one-particle per component occurs as a many-body quantum walk similar to that of a single particle with a re-normalized effective mass. Such a property, that is the quantum version of the shape-preserving motion of classical solitons, can provide the dynamical signature of the fermionic solitary waves. We probe the robustness of the fermionic bound-state dynamics under on-site disorder.", "url": "https://arxiv.org/abs/2607.12484", "type": "理论+数值", "summary": "1. 本研究通过精确对角化与Bethe ansatz，解析一维环上吸引SU(N)费米子多体谱为束缚复合体分区能带，并刻画其密度关联与N体关联。\n2. 核心在于发现每组分单粒子束缚态表现为具有重整化有效质量的多体量子行走，实现了经典孤立子保形运动的量子对应。\n3. 此工作为在超冷原子平台中通过动力学局域化转变及无序鲁棒性探测费米子孤立波提供了明确实验方案。", "summary_source": "deepseek", "authors": [{"name": "Aysha Alsubaihi"}, {"name": "Wayne J. Chetcuti"}, {"name": "Frederic Chevy"}, {"name": "Juan Polo"}, {"name": "Luigi Amico"}], "featured_authors": [{"name": "Aysha Alsubaihi"}, {"name": "Wayne J. Chetcuti"}, {"name": "Frederic Chevy"}, {"name": "Juan Polo"}, {"name": "Luigi Amico"}], "author_count": 5}, {"id": "2607.12572", "category": "cond-mat", "title": "Compatibility of Martensitic Microstructures in Polycrystals", "abstract": "The paper studies martensitic microstructures in polycrystals, focussing on their compatibility across grain boundaries. After a reduction to the case of a planar grain boundary, the case when the grain boundary separates two constant gradients of zero energy is considered. It is shown that for cubic-to tetragonal transformations such a configuration can occur when the relative grain rotation is not in the cubic group. Then the case when the grain boundary separates two simple laminates of zero energy is considered, it being shown using a computer-assisted symbolic calculation that in the cubic-to-tetragonal case compatibility is only possible for a closed set of measure zero in the manifold of grain boundary normals and relative grain rotations, and that a similar slightly weaker result holds for cubic-to-orthorhombic transformations. The results suggest why higher-order laminates are often observed for such transformations. The Taylor set of deformation gradients is defined and studied, this set having the property that any deformation whose gradient belongs to it corresponds to a zero-energy microstructure for the polycrystal independent of grain geometry and grain rotations. New upper bounds for the Taylor set are proved for cubic-to-tetragonal and cubic-to-orthorhombic transformations, generalizing those of Bhattacharya and Kohn using the geometrically linearized theory. The bounds imply in particular a result of Peigney characterizing the positive diagonal matrices in the quasiconvex hull of three tetragonal wells, and we give a simple independent proof of this result.", "url": "https://arxiv.org/abs/2607.12572", "type": "理论+数值", "summary": "1. 该工作研究多晶中马氏体微结构的晶界相容性，通过平面晶界分离零能常梯度或简单层状结构的简化，聚焦立方到四方与正交相变。\n2. 其技术核心是计算机辅助符号计算证明，立方到四方相变中两个简单层状结构仅在晶界法向与相对转动的测度零闭集上相容，立方到正交情形亦有类似稍弱结果，从而解释高阶层状结构常被观测。\n3. 定义Taylor集并证明新上界，推广了Bhattacharya与Kohn的线性化几何理论，独立证明Peigney关于三个四方阱拟凸包中正对角矩阵的结论，为多晶零能微结构普适存在提供框架。", "summary_source": "deepseek", "authors": [{"name": "John M. Ball"}, {"name": "Myrto Galanopoulou"}], "featured_authors": [{"name": "John M. Ball"}, {"name": "Myrto Galanopoulou"}], "author_count": 2}, {"id": "2607.12574", "category": "cond-mat", "title": "IceCAPA: patterning particles and microorganisms at a freezing front", "abstract": "The ability to precisely pattern micro- and nano-scale objects on surfaces is important for a range of different applications. For example, colloidal patterning has been used to create plasmonic surfaces, light-emitting diodes or authentication marks, while microbial cell patterning can be applied to screening antibiotic response and cellular interactions over larger populations at the single-cell level. However, we still lack versatile techniques that can pattern a wide range of synthetic and biological objects on a spectrum of different substrate types. Here, we present a robust patterning technique based on the directional freezing of a particle or bacterial suspension over a patterned substrate. Growing ice pushes the desired objects into traps in the substrate, while sweeping away non-trapped ones, leaving behind high-fidelity patterns. We show that this method works for a range of different materials (both synthetic particles and microbial cells), and is unaffected by substrate wettability. Furthermore, patterned bacterial cells retain excellent post-assembly viability, highlighting the gentle nature of the assembly technique. Beyond patterning applications, our results also give insights into processes involving the freezing of particulate suspensions. In particular, we demonstrate the importance of the temperature gradient as a key control which determines how particles interact with freezing fronts. Finally, we highlight a tight analogy between particles interacting with a freezing front and with air-water interfaces, suggesting that results from capillarity may shed light on freezing phenomena.", "url": "https://arxiv.org/abs/2607.12574", "type": "理论", "summary": "1. 本文提出一种基于定向冷冻的稳健图案化方法，可将合成颗粒与微生物细胞精确排列于不同基底。\n2. 该技术利用生长冰面推动待图案化物体进入基底陷阱并扫除多余对象，不受基底润湿性影响，且保持细菌活性。\n3. 揭示了温度梯度作为颗粒与冰冻锋面相互作用的关键控制，并建立冰冻现象与毛细作用的严格类比。", "summary_source": "deepseek", "authors": [{"name": "Isabelle M. Feller"}, {"name": "Jakob Paulsen"}, {"name": "Muriel Scherer"}, {"name": "Robert W. Style"}, {"name": "Lucio Isa"}], "featured_authors": [{"name": "Isabelle M. Feller"}, {"name": "Jakob Paulsen"}, {"name": "Muriel Scherer"}, {"name": "Robert W. Style"}, {"name": "Lucio Isa"}], "author_count": 5}, {"id": "2607.12585", "category": "cond-mat", "title": "From phase space to Krylov space, one shell at a time", "abstract": "In this work, we develop and study the classical Lanczos algorithm allowing us to define Krylov complexity using the symplectic structure of phase space: Poisson brackets take on the role of the quantum commutators and phase-space integrals furnish the inner product needed to define the Lanczos recursion. We show, using general methods of quantum mechanics in phase space, that the $\\hbar \\to 0$ limit of the usual quantum mechanical Krylov framework smoothly goes over into the classical one. In theories with well-defined semiclassical limits, we show that classical Krylov complexity accurately approximates quantum complexity at early enough times, and thus is a useful characteristic of early-time chaotic dynamics. We define a Krylov-Ehrenfest time, which quantifies the eventual divergence of classical and quantum complexities, corresponding to a characteristic depth of the Krylov chain, $n\\sim n_*(\\hbar)$, which in the time domain translates to the well-known scale, $t_*\\sim\\lambda_K^{-1}\\log(1/\\hbar)$, in generic chaotic systems. We additionally define microcanonical Krylov complexities, both in the classical and quantum setting, which allows one a fine-grained study of complexity, energy shell by energy shell. We apply this framework to the Lipkin-Meshkov-Glick (LMG) and Feingold-Peres (FP) models, which are collective spin systems known to classicalize in the thermodynamic limit. In particular, while the FP model features spectral chaos for some range of coupling values, the LMG model is known to exhibit early-time saddle-dominated scrambling. Our analysis shows that the instability in LMG is resolved by the microcanonical Krylov complexity, which is controlled by the integrable structure of the Hamiltonian in spectral windows away from the instability, both at early and late times.", "url": "https://arxiv.org/abs/2607.12585", "type": "理论+数值", "summary": "1. 该工作通过经典Lanczos算法，利用相空间的辛结构与泊松括号定义了经典Krylov复杂度，并证明其量子对应在ℏ→0极限下平滑过渡。\n2. 其核心在于引入Krylov-Ehrenfest时间量化经典与量子复杂度的偏离，对应混沌系统中深度n∼n_*(ℏ)与时间尺度t_*∼λ_K⁻¹log(1/ℏ)，并发展微正则Krylov复杂度实现能量壳层分辨分析。\n3. 这为研究半经典混沌动力学的早期行为提供精确工具，尤其适用于Lipkin-Meshkov-Glick与Feingold-Peres模型，可揭示鞍点主导的不稳定性如何在微正则系综中被可积结构抑制。", "summary_source": "deepseek", "authors": [{"name": "Nicolas De Ro"}, {"name": "Adrián Sánchez-Garrido"}, {"name": "Julian Sonner"}], "featured_authors": [{"name": "Nicolas De Ro"}, {"name": "Adrián Sánchez-Garrido"}, {"name": "Julian Sonner"}], "author_count": 3}, {"id": "2607.12727", "category": "cond-mat", "title": "Emergence of drifted diffusion in quantum walks with subspace restart", "abstract": "Restart of a quantum process is typically modeled as a global reinitialization that erases the system's entire history. Here we introduce subspace restart, a protocol that periodically resets only the internal degrees of freedom while preserving the spatial distribution, as a tunable knob for the quantum-to-classical crossover. Using the discrete-time quantum walk as an example, we show that this selective reset drives the walker into an engineered drifted-diffusion regime. This phenomenon can be understood by a Huygens-Fresnel mechanism, where each restart fragments the wave function into a set of independent secondary sources to screen long-range correlations and isolate a robust classical backbone, whose drift and diffusivity are set by the geometric orientation of the initial coin and the restart period. Residual quantum interference, confined to effective light cones, survives only as a short-range correction that renormalizes these coefficients and imprints periodic modulations on the cumulants. Our results establish subspace restart as a route to controlling the quantum-to-classical crossover in synthetic lattices.", "url": "https://arxiv.org/abs/2607.12727", "type": "理论", "summary": "1. 该工作提出了子空间重启协议，并证明其能将离散时间量子行走转变为可工程化的漂移扩散行为。\n2. 其核心卖点在于利用惠更斯-菲涅尔机制，通过周期性重置内禀自由度将波函数碎片化为独立次生源，隔离经典骨干并独立调控漂移与扩散系数。\n3. 这为在合成晶格中有目的地控制量子-经典转变提供了明确路径，残余量子干涉仅作为可编程的短程修正出现。", "summary_source": "deepseek", "authors": [{"name": "Liwei Qiao"}, {"name": "Ruoyu Yin"}, {"name": "Wei Zhang"}], "featured_authors": [{"name": "Liwei Qiao"}, {"name": "Ruoyu Yin"}, {"name": "Wei Zhang"}], "author_count": 3}, {"id": "2607.12737", "category": "cond-mat", "title": "Magnetic field-driven phase switching in the antiferromagnetic Mott insulator Ca$_3$(Ru$_{0.99}$Ti$_{0.01}$)$_2$O$_7$", "abstract": "A bandwidth-controlled antiferromagnetic Mott-insulating phase in Ca$_3$(Ru$_{1-x}$Ti$_x$)$_2$O$_7$ is realized through isovalent substitution at the Ru site. For a dilute substitution with only 1% Ti, the Mott insulator ground state remains nearly degenerate with the ground state of pristine Ca$_3$Ru$_2$O$_7$, where the Ru moments are ferromagnetically aligned within the metallic RuO$_2$ bilayers stacked in an antiferromagnetic fashion. The exceptionally shallow free energy landscape of this doped compound arises from intertwined electron-electron and electron-lattice interactions. This makes its magnetic and transport properties highly sensitive to external perturbations. We systematically investigated magnetic-field-induced phase switching in Ca$_3$(Ru$_{0.99}$Ti$_{0.01}$)$_2$O$_7$ to explore its magnetic $H$-$T$ phase diagram. With the field applied along the easy $b$-axis, parallel to the antiferromagnetic moments, the magnetization exhibits a first-order spin-flop transition at $\\approx $ 6 T, indicating reorientation of the Ru moments perpendicular to the field. The transition is accompanied by a decrease in the electrical resistance, but the spin-flop phase remains insulating. Above 10.5 T, all Ru moments align with the $b$-axis, resulting in a forced ferromagnetic metallic phase. In contrast, neither spin-flop nor forced-ferromagnetic phases are observed up to 14 T, when the field is applied along the $a$-axis. While the electronic kinetic energy and the electron-lattice coupling contribute to the free-energy balance of this system, the resulting $H$-$T$ phase diagram is remarkably simple and closely resembles that of a canonical anisotropic antiferromagnet, albeit with substantially renormalized critical fields.", "url": "https://arxiv.org/abs/2607.12737", "type": "理论+数值", "summary": "1. 本工作系统研究了1% Ti掺杂反铁磁Mott绝缘体Ca₃(Ru₀.₉₉Ti₀.₀₁)₂O₇中磁场驱动的相变，构建了完整的H-T相图。\n2. 其技术核心在于利用等价位掺杂实现基态近简并，磁场沿易b轴诱导一级自旋翻转转变（~6 T）与强迫铁磁金属相（>10.5 T），而沿a轴无类似行为。\n3. 该发现揭示了尽管电子动能与电子-晶格耦合复杂交织，体系却呈现出类似经典各向异性反铁磁体的简单相图，临界场显著重整化，为理解关联电子体系中多自由度竞争提供了新视角。", "summary_source": "deepseek", "authors": [{"name": "Ksenia S. Rabinovich"}, {"name": "Tim Priessnitz"}, {"name": "Nils Gross"}, {"name": "George Jackeli"}, {"name": "Maximilian J. Krautloher"}, {"name": "Pascal Reiss"}, {"name": "Eberhard J. Goering"}, {"name": "Jurgen H. Smet"}, {"name": "Bernhard Keimer"}, {"name": "Alexander V. Boris"}], "featured_authors": [{"name": "Ksenia S. Rabinovich"}, {"name": "Tim Priessnitz"}, {"name": "Nils Gross"}, {"name": "Jurgen H. Smet"}, {"name": "Bernhard Keimer"}, {"name": "Alexander V. Boris"}], "author_count": 10}, {"id": "2607.12740", "category": "cond-mat", "title": "Antiphase boundary-driven large exchange bias and negative magnetoresistance in NiCo2O4", "abstract": "Nickel-based spinel oxide has recently attracted significant attention due to its remarkable magneto-transport properties, promising various spintronic applications. In this study, we observe an exchange bias effect, where the magnetic hysteresis loop shifts both horizontally and vertically when single-phase nanocrystalline NiCo2O4 is cooled in the presence of an external magnetic field. The magnitude of the exchange bias field is approximately 375 Oe at 5 K, and this effect disappears around 300 K. Furthermore, NiCo2O4 shows semiconducting behaviour in longitudinal resistivity and demonstrates a substantial negative magnetoresistance of ~31.5% at 10 K. The magnetoresistance exhibits a butterfly-shaped behaviour at low magnetic fields and becomes almost linear at high magnetic fields. A detailed analysis of the negative magnetoresistance and exchange bias reveals that both phenomena originate from the formation of antiphase boundaries in the as-synthesized NiCo2O4 sample, as confirmed by the high-resolution transmission electron micrograph.", "url": "https://arxiv.org/abs/2607.12740", "type": "理论", "summary": "1. 该工作报道了单相纳米晶NiCo2O4中交换偏置效应（水平与垂直磁滞回线偏移，约375 Oe，5 K）及显著负磁电阻（~31.5%，10 K）的观测结果。\n2. 其核心物理机制在于反相界面的形成，通过高分辨透射电镜确证了该缺陷结构同时驱动交换偏置与磁电阻行为。\n3. 这揭示了反相界面工程可成为调控镍基尖晶石氧化物磁输运性质的关键途径，为自旋电子学器件设计提供了新的材料平台。", "summary_source": "deepseek", "authors": [{"name": "Biswanath Pramanik"}, {"name": "Pushpesh Pathak"}, {"name": "Binoy K. Hazra"}], "featured_authors": [{"name": "Biswanath Pramanik"}, {"name": "Pushpesh Pathak"}, {"name": "Binoy K. Hazra"}], "author_count": 3}, {"id": "2607.12741", "category": "cond-mat", "title": "Dynamical Generation of Rectified Electric Current", "abstract": "Rectification is a fundamental nonlinear transport process that converts an alternating drive into a direct current. In this work, we propose a general theoretical framework for electric current rectification triggered by a dynamical external drive that couples to an arbitrary well-defined operator of a periodic system, and which in the static limit forbids any steady current. In the dynamical regime, the finite frequency $\\Omega$ of the time-varying drive breaks time-translation invariance and injects energy into the system, enabling a second-order {\\it nonlinear rectified} current that has no static counterpart. This rectification process has two distinct origins: (i) an impurity-scattering-modified distribution function at finite frequency, and (ii) a time-domain anomalous velocity stemming from a dynamical mixed Berry curvature. Both contributions persist when the driving frequency lies well below the optical transition gap. Applying our general theory to a buckled magnetic system subject to an out-of-plane oscillating electric field, we characterize the generated current as a {\\it nonlinear magnetoelectric gyrotropic effect} and predict that the induced rectified current is sensitive to the magnetic order, thereby offering a feasible electrical probe of Néel order in non-coplanar antiferromagnets.", "url": "https://arxiv.org/abs/2607.12741", "type": "理论", "summary": "1. 该工作提出了一个通用理论框架，描述动态外部驱动（耦合到周期性系统任意算符）如何超过静态限制产生整流电流。\n2. 其核心在于揭示两种独立机制：有限频率下杂质散射修正的分布函数，以及源于动态混合Berry曲率的时间域反常速度，二者均存在于远低于光学跃迁能隙的频率。\n3. 这预言了弯曲磁性系统中的非线性磁电回旋效应，整流电流对磁序敏感，从而为电学探测非共面反铁磁体的Néel序提供了可行方案。", "summary_source": "deepseek", "authors": [{"name": "Jin-Xin Hu"}, {"name": "Congjun Wu"}], "featured_authors": [{"name": "Jin-Xin Hu"}, {"name": "Congjun Wu"}], "author_count": 2}, {"id": "2607.12766", "category": "cond-mat", "title": "Entropy-Driven Initiation and Cellular Uptake Mediated by Viscoelastic Cytoskeleton: A Kinetic Phase Diagram from Onsager Variational Principle", "abstract": "A fundamental question in receptor-mediated endocytosis remains unanswered: what initial driving force brings ligands and receptors into close proximity? While previous models assume pre-existing contact and overlook this initiation problem, we propose that entropic forces from nanoscale biomolecules in crowded cellular environments provide the essential driving mechanism. We develop a unified continuum model rooted in the Onsager variational principle, where engulfment depth serves as the generalized coordinate and the driving force derives from a free energy landscape of entropic, binding, membrane, and cytoskeleton contributions. The framework naturally incorporates: (i) entropy-driven adhesion as initiation; (ii) ligand-receptor binding as the sustaining force; (iii) membrane deformation via the Helfrich-Canham Hamiltonian; and (iv) cytoskeleton viscoelasticity through the elastic-viscoelastic correspondence principle. The kinetic phase diagram predicts a critical biomolecule concentration for initiation, a lower bound of ligand density for complete engulfment, a finite size window for engulfable particles, and an optimal virus radius of 30--60 nm that decreases with increasing binding energy. The Onsager solubility condition naturally yields the phase boundaries. The model exhibits asymptotic consistency with the classic Asakura-Oosawa result in the large-particle flat-surface limit. Stiffer cells lead to longer engulfment times and narrower size windows. Strikingly, the optimal size matches HIV-1 dimensions under physiologically realistic parameters. This work provides a variational foundation for cellular uptake with implications for virology, nanotechnology, and drug delivery.", "url": "https://arxiv.org/abs/2607.12766", "type": "理论+数值", "summary": "1. 该工作基于Onsager变分原理建立统一连续介质模型，以吞噬深度为广义坐标，从熵力、配体-受体结合、膜变形及细胞骨架粘弹性贡献的自由能景观导出驱动力，解析受体介导内吞的起始问题。\n2. 其卖点在于揭示熵驱动起始机制，并由动力学相图预测临界生物分子浓度、完全吞噬配体密度下界、可吞噬粒子尺寸窗口、以及最佳病毒半径约30–60 nm且随结合能增大而减小。\n3. 该框架为病毒入胞、纳米颗粒递送及药物输运提供变分理论基础，最佳尺寸与HIV-1相符，暗示生理条件下可优化内吞效率的设计原则。", "summary_source": "deepseek", "authors": [{"name": "Jinjie Liu"}, {"name": "Zhong-Can Ou-Yang"}, {"name": "Hao Wu"}], "featured_authors": [{"name": "Jinjie Liu"}, {"name": "Zhong-Can Ou-Yang"}, {"name": "Hao Wu"}], "author_count": 3}, {"id": "2607.12799", "category": "cond-mat", "title": "Strain-Tunable Shift Current and Magneto-Optical Kerr Effect in Multiferroic Altermagnet Fe2Mo3O8", "abstract": "Altermagnetism has recently emerged as a compelling frontier in spintronics, seamlessly merging the agile tunability of ferromagnets with the hallmark merits of antiferromagnets. As a prototypical polar multiferroic featuring distinctive altermagnetism, Fe2Mo3O8 hosts an ideal playground for exploring the intricate interplay among ferroelectric polarization, altermagnetic order, and spin-dependent responses. Here, employing first-principles calculations, we systematically investigate the coupling among polarization, spin splitting, shift current, and magneto-optical responses in Fe2Mo3O8. Our findings reveal that switching the ferroelectric polarization not only inverts the sign of the shift current but also comprehensively reshapes the momentum-space spin-splitting texture. Furthermore, the shift current and magneto-optical spectrum exhibits strong tunability under mechanical strain. Remarkably, the application of a-axis uniaxial strain breaks the crystalline symmetry, thereby activating a finite magneto-optical Kerr effect that is otherwise forbidden in the pristine phase.", "url": "https://arxiv.org/abs/2607.12799", "type": "理论+数值", "summary": "1. 该工作采用第一性原理计算，系统研究了多铁性交变磁体Fe₂Mo₃O₈中铁电极化、交变磁序、移位电流与磁光响应的耦合。\n2. 核心发现包括：铁电翻转可逆转移位电流符号并全面重塑动量空间自旋劈裂纹理，且a轴单轴应变因打破晶格对称性而激活原本禁戒的有限磁光克尔效应。\n3. 这为利用机械应变对交变磁体中自旋相关光电流及磁光响应进行定向调控，以及推动多铁性交变磁体在自旋光电子学中的应用提供了关键依据。", "summary_source": "deepseek", "authors": [{"name": "Shengqiao Wang"}, {"name": "Bo Zhao"}, {"name": "Harish K. Singh"}, {"name": "Jiahao Xie"}, {"name": "Fu Li"}, {"name": "Hongbin Zhang"}, {"name": "Yang Su"}, {"name": "Chen Shen"}, {"name": "Lijun Zhang"}], "featured_authors": [{"name": "Shengqiao Wang"}, {"name": "Bo Zhao"}, {"name": "Harish K. Singh"}, {"name": "Yang Su"}, {"name": "Chen Shen"}, {"name": "Lijun Zhang"}], "author_count": 9}, {"id": "2607.12806", "category": "cond-mat", "title": "Single-orbital tight-binding model for chiral one-dimensional hybrid organic-inorganic lead halide perovskites", "abstract": "We present a single-orbital tight-binding model for the low-energy electronic states of the chiral one-dimensional hybrid organic-inorganic lead halide perovskite $\\mathrm{(}R/S\\mathrm{-PEA)PbI}_3$. The model is constructed from a single effective orbital on each of the four symmetry-related sites in the primitive unit cell and incorporates layer, in-plane sublattice, and spin degrees of freedom. Using separate parameter sets for the conduction and valence bands, the effective Hamiltonian reproduces the overall band dispersions obtained from density-functional-theory calculations and quantitatively captures the spin splittings near the band edges. It also captures the leading spin-polarization patterns of the Bloch states, showing that the band-edge spin splitting and spin polarization are encoded in a small number of symmetry-adapted spin-dependent hopping terms. We further analyze the accidental degeneracies of the effective Hamiltonian using screw eigenvalues and antiunitary operators. This analysis separates accidental degeneracies originating from the restricted term content of the effective Hamiltonian from degeneracies enforced by nonsymmorphic screw symmetries and time-reversal symmetry. The present model provides a symmetry-transparent starting point for understanding the band-edge electronic structure of chiral lead halide perovskites and for analyzing optical, spin, and transport responses in this class of materials.", "url": "https://arxiv.org/abs/2607.12806", "type": "理论+数值", "summary": "1. 该工作提出了一个单轨道紧束缚模型，用于描述手性一维杂化有机-无机卤化铅钙钛矿的低能电子态。\n2. 其卖点在于通过少量对称性适配的自旋依赖跳跃项，定量复现了DFT能带及带边自旋分裂，并揭示了分裂与自旋极化的对称性起源。\n3. 这为理解该类材料带边电子结构以及解析光、自旋和输运响应提供了一个具对称性透明性的理论起点。", "summary_source": "deepseek", "authors": [{"name": "Yuya Ominato"}, {"name": "Tetsuya Furukawa"}, {"name": "Ayumi Ishii"}, {"name": "Tetsuaki Itou"}], "featured_authors": [{"name": "Yuya Ominato"}, {"name": "Tetsuya Furukawa"}, {"name": "Ayumi Ishii"}, {"name": "Tetsuaki Itou"}], "author_count": 4}, {"id": "2607.12925", "category": "cond-mat", "title": "Microscopic Spin-1 Parent Hamiltonians for Emergent Valence-Bond Loop Manifolds", "abstract": "We construct an exact spin-$1$ parent Hamiltonian for constrained valence-bond loop manifolds on the checkerboard and pyrochlore lattices. The Hamiltonian is local, SU(2)- and time-reversal-invariant, and built from positive-semidefinite projectors acting on triangular faces. Each projector removes only the maximally polarized state of a triangle, so the model is frustration-free. Its zero-energy states are generated by an AKLT-like construction in which each spin-$1$ moment is resolved into two virtual spin-$\\tfrac12$ degrees of freedom, singlets are formed inside every crossed plaquette or tetrahedron, and the physical spin-$1$ Hilbert space is recovered by projection. The resulting ground states are fully packed singlet-loop states on the corner-sharing lattice. Thus, a loop or dimer constraint, usually introduced as part of an effective Rokhsar--Kivelson description, appears here as the exact zero-energy manifold of a microscopic spin Hamiltonian. We analyze spin correlations within this manifold and show that, for a fixed loop covering, they are determined by loop connectivity. We also project symmetry-allowed perturbations into the ground-state manifold and derive the resulting low-energy pseudospin dynamics. The checkerboard and pyrochlore cases differ sharply. On the pyrochlore lattice, tetrahedral symmetry removes simple local bias terms, and the leading nontrivial next-nearest-neighbour Heisenberg perturbation gives an emergent spin-$\\tfrac12$ XY model on the diamond lattice of tetrahedron centers. These results give an exact spin-$1$ microscopic starting point for constrained valence-bond physics in two and three dimensions, and show how loop, dimer, and gauge-theoretic descriptions can be approached from a small-spin, SU(2)-invariant frustrated magnet.", "url": "https://arxiv.org/abs/2607.12925", "type": "理论+数值", "summary": "1. 本工作构造了方格和烧绿石晶格上精确的自旋-1母哈密顿量，其基态为完全填满的单重态环流形。\n2. 哈密顿量局域、SU(2)和TR不变且无挫败，通过AKLT型投影将环约束作为零能流形实现，环连通性直接决定自旋关联。\n3. 在烧绿石格点上，次近邻海森堡微扰导出钻石晶格上的自旋-1/2 XY模型，为约束价键物理提供了从微观自旋-1阻挫磁体出发的精确起点。", "summary_source": "deepseek", "authors": [{"name": "Hari Borutta"}, {"name": "Yasir Iqbal"}, {"name": "Kirill Shtengel"}], "featured_authors": [{"name": "Hari Borutta"}, {"name": "Yasir Iqbal"}, {"name": "Kirill Shtengel"}], "author_count": 3}, {"id": "2607.12955", "category": "cond-mat", "title": "Optimal preparation and reachable-state constraints in the Mpemba effect", "abstract": "The Mpemba effect, whereby an initially hotter system relaxes faster than a colder one towards a common final state, is often analysed within the kinetic framework by assuming non-stationary initial conditions that are selected a priori. Here, we revisit this viewpoint by explicitly incorporating the aging protocol used to prepare those states. Focusing on uniformly heated granular fluids, we formulate the preparation stage as an optimal-control problem in which the energy injection is tuned to generate the initial conditions that maximise or minimise the subsequent relaxation rate. Within the first Sonine approximation, this optimisation reduces to extremising the excess kurtosis of the velocity distribution function, the quantity controlling the cooling rate at fixed temperature. Applying Pontryagin's maximum principle, we show that the optimal preparation protocol is always a one-bang protocol and determine the corresponding extremal values of the excess kurtosis. Most importantly, we find that the stochastic thermostat imposes non-trivial reachable-state constraints: the accessible non-Gaussianities are bounded by those of the homogeneous cooling state, thereby limiting the relaxation-rate asymmetry and the maximum attainable Mpemba effect. These results demonstrate that the strength of the kinetic Mpemba effect cannot be disentangled from the accessibility of the underlying non-equilibrium states. More generally, our work establishes a connection between anomalous relaxation, optimal control, and state accessibility in non-equilibrium systems.", "url": "https://arxiv.org/abs/2607.12955", "type": "理论", "summary": "1. 该工作通过最优控制理论重新审视Mpemba效应中的制备阶段，以均匀加热颗粒流体为模型，将能量注入设计为优化问题以最大化或最小化后续弛豫速率。\n2. 主要卖点在于在首次Sonine近似下，应用庞特里亚金最大值原理证明最优制备始终为单bang协议，并揭示随机恒温器对可达非高斯性的根本约束——其界限由均匀冷却态决定，从而限制了弛豫速率不对称性。\n3. 这建立了反常弛豫、最优控制与非平衡状态可达性之间的内在联系，为理解非平衡系统中Mpemba效应的极限提供了定量框架。", "summary_source": "deepseek", "authors": [{"name": "C. Ríos-Monje"}, {"name": "A. Patrón-Castro"}, {"name": "C. A. Plata"}, {"name": "B. Sánchez-Rey"}, {"name": "A. Prados"}], "featured_authors": [{"name": "C. Ríos-Monje"}, {"name": "A. Patrón-Castro"}, {"name": "C. A. Plata"}, {"name": "B. Sánchez-Rey"}, {"name": "A. Prados"}], "author_count": 5}, {"id": "2607.12961", "category": "cond-mat", "title": "Active Quantum Nematics: The First Quantization", "abstract": "Nematic symmetry entails conserved quantized quantities such as number of topological defects and vorticity cells. Correspondingly, countless quantum analogies have been found in Active Nematics. We formalize Active Nematics and Liquid Crystal theory into the framework of Quantum Mechanics by introducing a complex valued Nematic Wavefunction to the Beris Edward equations, thus splitting spatiotemporally varying nematic systems into quantized states. We obtain the Planck's energy-frequency relationship for active micro-swimmers such as peristaltic worms and bacterium as a consequence of local complex phase-symmetry of the governing equations, similar to the gauge formulation of Electromagnetism. For organisms operating on diffusive chemotaxis, we obtain predator-prey dynamics that evolve to maximize/minimize pheromones field gradient overlap. Furthermore, when quantizing beating hearts, similar to the orbitals of hydrogen atoms, the state-function allows us to characterize hearts not only through the rhythm, but also the spaciotemporal distribution of contractile activity of various harmonics among healthy and unhealthy hearts.", "url": "https://arxiv.org/abs/2607.12961", "type": "理论", "summary": "1. 该工作通过引入复值向列波函数将活性向列相与液晶理论纳入量子力学框架，实现时空变化向列系统的首次量子化。\n2. 核心卖点在于从局部复相位对称性导出活性微游泳者的普朗克能量-频率关系，并揭示其与电磁规范理论的类比。\n3. 这为活性物质中拓扑缺陷与量子态对应关系提供新视角，并启发生物系统（如心跳）时空谐波分析的应用。", "summary_source": "deepseek", "authors": [{"name": "Ghansham Chandel"}, {"name": "Siddhartha Das"}], "featured_authors": [{"name": "Ghansham Chandel"}, {"name": "Siddhartha Das"}], "author_count": 2}, {"id": "2607.12997", "category": "cond-mat", "title": "Surface Phase-Field-Crystal-Helfrich model for out-of-plane deformations in thin crystalline sheets with lattice mismatch", "abstract": "Thin, flexible crystalline sheets exhibit unique elastic properties due to their ability to undergo out-of-plane deformations. Understanding this behavior requires a description that couples in-plane elasticity, out-of-plane deformation, and their coupling, taking the crystalline structure and its defects into account. We develop a multiscale description for these systems by extending the surface Phase-Field-Crystal-Helfrich model. The extension permits a spatially varying equilibrium lattice spacing, enabling the representation of localized lattice eigenstrain to mimic lattice mismatch in heterostructures. We validate the extended model against analytical predictions from classical Föppl-von Kármán equations for uniaxial compression and from Eshelby's inclusion problem. Using this validated framework, we then show how locally induced compressive stresses drive out-of-plane deformation in the sheets.", "url": "https://arxiv.org/abs/2607.12997", "type": "理论", "summary": "1. 该工作扩展了表面相场晶体-赫尔弗里希模型，使其能够描述具有晶格失配的薄晶体板的面外变形行为。\n2. 主要卖点在于引入空间变化的平衡晶格间距以表示局域晶格本征应变，从而耦合面内弹性与面外变形，并通过经典Föppl-von Kármán方程和Eshelby夹杂问题解析解完成验证。\n3. 这为理解异质结构中由局部压缩应力触发的面外失稳机制提供了跨尺度建模工具，并为人工超材料设计指明方向。", "summary_source": "deepseek", "authors": [{"name": "Emma Radice"}, {"name": "Ingo Nitschke"}, {"name": "Marco Salvalaglio"}, {"name": "Axel Voigt"}], "featured_authors": [{"name": "Emma Radice"}, {"name": "Ingo Nitschke"}, {"name": "Marco Salvalaglio"}, {"name": "Axel Voigt"}], "author_count": 4}, {"id": "2607.13016", "category": "cond-mat", "title": "Topological characterization of multifold band degeneracies in Altland-Zirnbauer symmetry classes", "abstract": "Topological band degeneracies are conventionally characterized by invariants defined on enclosing spheres over which the energy spectrum remains gapped. This program has been completed for minimal degeneracies in all ten Altland-Zirnbauer (AZ) symmetry classes, whereas higher-order degeneracies have been studied almost exclusively under crystalline-symmetry protection. In this work, we characterize generic n-fold band degeneracies whose stability derives solely from AZ symmetries acting locally in momentum space. We find that their codimension grows quadratically with n, placing such multifold nodes in parameter spaces that combine physical momenta with tuning parameters or synthetic dimensions. However, the enclosing sphere paradigm faces a fundamental obstruction: two (n-1)-fold degeneracy loci intersecting at the n-fold band node pierce every enclosing sphere, implying that no uniform spectral gap (and thus no standard homotopy classification) exists. Here, we turn this obstruction into the diagnostic itself. On the nodal manifolds where the two loci intersect the enclosing sphere, complementary spectral gaps are restored, allowing us to characterize each with conventional band invariants. This enables us to establish a two-way correspondence: (1)~the multifold node is topologically protected whenever the nodal manifolds are robustly linked on the enclosing sphere, and (2)~band invariants on cycles of one nodal manifold encode their linking numbers with cycles of the other. We carry out this characterization for minimal models of all ten AZ classes, computing the band invariants wherever an explicit parametrization is available. Our results recast multifold band topology as the topology of linked nodal manifolds in momentum space, while our methods provide the foundation for a general characterization of multifold band degeneracies in models with arbitrarily many bands.", "url": "https://arxiv.org/abs/2607.13016", "type": "理论", "summary": "1. 该工作针对Altland-Zirnbauer对称类中的多重带简并，建立了由动量空间局域对称性稳定的拓扑刻画方法。\n2. 其核心在于将封闭球面范式内两个简并轨迹相交导致的谱隙障碍转化为诊断工具，通过节点流形的鲁棒链接对应拓扑保护，并计算了十类最小模型的能带不变量。\n3. 这为多带模型中多重简并的通用分类提供了方法基础，并将问题等价为动量空间中链接节点流形的拓扑。", "summary_source": "deepseek", "authors": [{"name": "Askar Iliasov"}, {"name": "Zoltán Guba"}, {"name": "Tsuneya Yoshida"}, {"name": "Apoorv Tiwari"}, {"name": "Tomáš Bzdušek"}], "featured_authors": [{"name": "Askar Iliasov"}, {"name": "Zoltán Guba"}, {"name": "Tsuneya Yoshida"}, {"name": "Apoorv Tiwari"}, {"name": "Tomáš Bzdušek"}], "author_count": 5}, {"id": "2607.12014", "category": "hep-th", "title": "Group Theory and the CFT Distance Conjecture: $\\mathcal{N}=2$ Tensionless Strings Have No (Co)Weight", "abstract": "We perform a systematic survey of the Hagedorn behaviour at infinite-distance points in the conformal manifold of four-dimensional large-$N$ $\\mathcal{N}=2$ Superconformal Field Theories admitting a Lagrangian description. Many properties of these theories can be understood in terms of the Lie algebra encoding the shape of their quiver. We find that in the overall-free limit, the Hagedorn temperature is determined by the largest eigenvalue of an affine or finite Cartan adjacency matrix. This defines two types of universality classes of theories sharing the same high-energy exponential growth of states characteristic of string-like spectra. The first and largest is the affine case, corresponding to orbifold and orientifold projections of $\\mathcal{N}=4$ super-Yang-Mills, and all share the same temperature. The others fall into universality classes following an ADE classification with a temperature set by the dual Coxeter number, and can be obtained by deforming the affine case. Our results apply to all large-$N$ $\\mathcal{N}=2$ quivers with any classical gauge symmetry, including those with matter charged beyond bifundamental representations. We further discuss the string-theoretic construction of these theories and some of the holographic implications, as well as how our methods extend to broad families of theories with less supersymmetry. We also consider limits where only part of the theory becomes free, and find lower and upper bounds on the exponential rate predicted by the CFT Distance Conjecture. Both these bounds and the Hagedorn temperature are set by the same eigenvalue, and when the quiver has a single gauge node the lower bound is saturated, giving a natural explanation for the three universality classes recently found in the literature.", "url": "https://arxiv.org/abs/2607.12014", "type": "理论", "summary": "1. 该工作系统考察了四维大N N=2超共形场论在构形流形无穷远点的Hagedorn行为，揭示了其由李代数的仿射或有限Cartan邻接矩阵最大特征值控制。\n2. 核心卖点在于发现Hagedorn温度仅由该特征值决定，从而将理论划分为仿射类和ADE类两种普适类，且与CFT距离猜想给出的指数率上下界源自同一特征值。\n3. 这为弦理论中无张力弦的普适分类提供了明确判据，并自然解释了文献中三种普适类的起源，有望推广至低超对称理论。", "summary_source": "deepseek", "authors": [{"name": "Florent Baume"}, {"name": "Fabio Mantegazza"}], "featured_authors": [{"name": "Florent Baume"}, {"name": "Fabio Mantegazza"}], "author_count": 2}, {"id": "2607.12019", "category": "hep-th", "title": "The Hitchhiker's Guide to Tensionless String Limits in 4d SCFTs", "abstract": "We study the appearance of universality classes in overall weak-coupling infinite-distance limits in the conformal manifold of 4d ${\\cal N}=4,2,1$ superconformal gauge theories at large $N$ and their relation to the type of weakly-coupled emergent string in the AdS bulk dual using brane models. We focus on the complete set of theories with simple gauge group, and provide explicit Hanany-Witten constructions for each of them, including those that have non-Einstein bulk duals. This establishes that the three universality classes found in arXiv:2410.07309 are determined by the number of NS5-branes becoming coincident in a suitable double-scaling limit required to obtain the SCFT. Furthermore, all theories within a given universality class descend from the same parent theory by performing orbifold/orientifold projections (with possibly a small number of extra flavors), which are subleading effects at large $N$. This explains the origin of the universality classes from a CFT perspective. Moreover, we argue that theories in the same universality class share the same closed-string background -- generated by the double-scaled NS5-brane system -- in which the backreaction of D-branes is expected to generate the AdS throat holographically dual to the SCFT. We describe the corresponding worldsheet theories, and find that the three kinds of emergent tensionless strings correspond to the 10d type IIB string, a subcritical string previously studied in a related context, and a novel kind of string which we characterize in detail. Our tools are not limited to this set of SCFTs, but can be naturally applied to more general theories, and allow us to study interpolating models yielding a network of SCFTs related by partial weak-coupling limits. We explicitly discuss the generalization of our results to large classes of theories with more than one gauge factor and even to some quasi-conformal gauge theories.", "url": "https://arxiv.org/abs/2607.12019", "type": "理论", "summary": "1. 该工作系统研究了四维超共形规范理论在弱耦合无限距离极限下的普适类，并建立其与AdS对偶中无张力弦类型的对应关系。\n2. 通过完整构造简单规范群对应各理论的全套Hanany-Witten构型，揭示三个普适类由特定双标度极限下重合NS5-膜数目决定，且同属一类者源于同一母理论经轨道/定向影操作。\n3. 该分析框架可自然推广至多规范因子与准共形理论，为解析更一般超共形场论中无张力弦极限及全息对偶提供统一视角。", "summary_source": "deepseek", "authors": [{"name": "José Calderón-Infante"}, {"name": "Angel M. Uranga"}, {"name": "Irene Valenzuela"}], "featured_authors": [{"name": "José Calderón-Infante"}, {"name": "Angel M. Uranga"}, {"name": "Irene Valenzuela"}], "author_count": 3}, {"id": "2607.12020", "category": "hep-th", "title": "Strongly-coupled black holes (are not) at weak coupling", "abstract": "We prove sharp bounds on the moduli space excursion that is possible outside the event horizon of a spherically symmetric charged black hole. In regions where the black hole charge $Q (\\phi)$ is no less than its asymptotic value, we prove that the total moduli space excursion is less than $\\frac{\\pi}{2\\sqrt{k_N}}$ where $k_N$ is the rationalized Newton constant. We also show that the moduli space excursion in a specified direction in which $Q (\\phi)$ is non-decreasing satisfies the same bound. Applying our bound to electrically charged black holes, we rule out a potential loophole in a recent proof [ arXiv:2401.14449 ] of the Weak Gravity Conjecture in perturbative bosonic string theory.", "url": "https://arxiv.org/abs/2607.12020", "type": "理论", "summary": "1. 该工作证明球对称带电黑洞视界外模空间位移的严格上界，在电荷不小于渐近值的区域总位移小于π/(2√k_N)。\n2. 其技术核心在于利用电荷单调性导出与牛顿常数相关的统一界限，并排除微扰玻色弦理论中弱引力猜想证明的一个潜在漏洞。\n3. 这为强耦合黑洞的模空间行为提供了刚性约束，启示了引力有效理论中弱耦合与强耦合区域间的深层关联。", "summary_source": "deepseek", "authors": [{"name": "Ben Heidenreich"}, {"name": "Matteo Lotito"}], "featured_authors": [{"name": "Ben Heidenreich"}, {"name": "Matteo Lotito"}], "author_count": 2}, {"id": "2607.12022", "category": "hep-th", "title": "Strong-to-Weak Spontaneous Symmetry Breaking from Wormholes in Holography", "abstract": "We study strong-to-weak spontaneous symmetry breaking (SWSSB) at finite temperature and its implications in holography. SWSSB is a novel critical phenomenon that arises only in mixed states. We demonstrate SWSSB with the BTZ black hole and show that, in the bulk, it is realized through wormhole geometries connecting the two copies in the thermofield-double construction. We point out that SWSSB can be recast as an emergence of global symmetries under ensemble averaging. We further examine the interplay between SWSSB and the swampland program, and propose a new swampland conjecture for quantum-gravity theories involving ensemble averages.", "url": "https://arxiv.org/abs/2607.12022", "type": "理论", "summary": "1. 该工作在全息框架下研究了有限温度下强到弱自发对称性破缺（SWSSB），并通过BTZ黑洞与虫洞几何展示了其在热场双体构造中的实现机制。\n2. 其核心卖点在于指出SWSSB可重述为系综平均下全局对称性的涌现，并据此提出涉及量子引力系综平均的新沼泽地猜想。\n3. 这一发现为理解混合态中对称性破缺的临界现象以及全息虫洞物理与沼泽地纲领的交叉提供了关键启示。", "summary_source": "deepseek", "authors": [{"name": "Taishi Kawamoto"}, {"name": "Kenya Tasuki"}, {"name": "Masahito Yamazaki"}], "featured_authors": [{"name": "Taishi Kawamoto"}, {"name": "Kenya Tasuki"}, {"name": "Masahito Yamazaki"}], "author_count": 3}, {"id": "2607.12031", "category": "hep-th", "title": "A New Term in Type II Effective Action", "abstract": "We show that the one loop effective action of type IIA and IIB string theories in ten dimensions have terms proportional to the dilaton times the ten dimensional Euler density, in apparent violation of the soft dilaton theorem. This can be traced to the existence of the zero modes of the world-sheet superconformal ghost fields and resolves a puzzle that arose recently in the analysis of black hole index when we compactify these theories on Calabi-Yau manifolds of non-zero Euler number.", "url": "https://arxiv.org/abs/2607.12031", "type": "理论", "summary": "1. 该工作在十维IIA和IIB弦论的一圈有效作用量中发现了与欧拉密度乘以膨胀子成正比的项，表观上违反软膨胀子定理。\n2. 其卖点在于识别出此项源于世界面超共形鬼场零模的贡献，并解释了在非零欧拉数Calabi-Yau流形紧化时黑洞指数分析中的先前矛盾。\n3. 这为弦理论膨胀子耦合的量子修正提供了精确约束，并对从紧化几何理解黑洞熵的微观起源具有明确启示。", "summary_source": "deepseek", "authors": [{"name": "Ashoke Sen"}], "featured_authors": [{"name": "Ashoke Sen"}], "author_count": 1}, {"id": "2607.12064", "category": "hep-th", "title": "Low-Temperature Holographic Conductivity", "abstract": "We revisit holographic electrical conductivity in the regime of very low temperatures where quantum fluctuations in the throat of the near-extremal, asymptotically AdS$_4$ dual black brane are strongly coupled. We treat the fluctuations via an effective two-dimensional action capturing the effects of the Schwarzian modes at the scale $1/C$. Our main result is a non-monotonic temperature dependence: the quantum-corrected conductivity decreases as the temperature is lowered, reaches a minimum at $(CT_{\\mathrm{min}}\\simeq 0.023)$, and grows as $(1/\\sqrt{CT})$ for $(CT\\ll 1)$. We further estimate the one-loop contribution to the conductivity directly from the four-dimensional gravitational path integral and find qualitative agreement with the effective two-dimensional description in the regime $(CT\\gg 1)$. We find that quantum corrections substantially modify the low-temperature behavior of the holographic conductivity in both approaches.", "url": "https://arxiv.org/abs/2607.12064", "type": "理论", "summary": "1. 该工作利用二维有效作用量捕捉Schwarzian模式，重新审视了近极端AdS₄对偶黑膜喉部低温量子涨落对全息电导率的影响。\n2. 主要技术发现是量子修正导致电导率呈现非单调温度依赖：在CT_min≈0.023处出现最小值，之后在CT≪1区域按1/√(CT)增长。\n3. 从四维引力路径积分的单圈估计与二维描述定性吻合，表明量子涨落从根本上修正了极端黑膜的低能输运行为。", "summary_source": "deepseek", "authors": [{"name": "Sabyasachi Maulik"}, {"name": "Leopoldo A. Pando Zayas"}, {"name": "Jingchao Zhang"}], "featured_authors": [{"name": "Sabyasachi Maulik"}, {"name": "Leopoldo A. Pando Zayas"}, {"name": "Jingchao Zhang"}], "author_count": 3}, {"id": "2607.12066", "category": "hep-th", "title": "Low-temperature Quantum-corrected Holographic Transport with Momentum Relaxation", "abstract": "We determine the quantum corrections to transport arising from fluctuations of the near-AdS${}_2$ throat of near-extremal black branes in holographic models with momentum relaxation. By computing the shear viscosity and electrical conductivity at both zero and finite chemical potential, we uncover a universal low-temperature enhancement of transport generated by Schwarzian quantum fluctuations. Specifically, transport coefficients extracted from retarded Green's functions increase throughout the regime $C T \\ll 1$. For operators with Schwarzian scaling dimension $\\Delta >1$, this enhancement is preceded by a universal minimum at a characteristic temperature $T_{\\rm min} \\propto C^{-1}$, leading to a non-monotonic temperature dependence strikingly similar to that observed in many correlated materials. In contrast, for the case $\\Delta =1$, relevant for the electrical conductivity, the transport coefficient evolves monotonically toward a constant value. Our results identify universal signatures of near-horizon quantum gravity in the transport properties of holographic quantum matter.", "url": "https://arxiv.org/abs/2607.12066", "type": "理论", "summary": "1. 该工作通过在具有动量松弛的全息模型中计算近极端黑膜的近AdS₂喉部涨落，确定了剪切粘度和电导率的量子修正。\n2. 其核心发现是Schwarzian量子涨落导致输运系数在CT≪1区间出现普适低温增强，且对Δ>1的算符呈现先于特征温度极小值的非单调温度依赖，与关联材料行为吻合。\n3. 这为在强关联量子物质输运中识别近地平线量子引力普适特征提供了明确的理论预言。", "summary_source": "deepseek", "authors": [{"name": "Suman Das"}, {"name": "Sabyasachi Maulik"}, {"name": "Leopoldo A. Pando Zayas"}, {"name": "Jingchao Zhang"}], "featured_authors": [{"name": "Suman Das"}, {"name": "Sabyasachi Maulik"}, {"name": "Leopoldo A. Pando Zayas"}, {"name": "Jingchao Zhang"}], "author_count": 4}, {"id": "2607.12083", "category": "hep-th", "title": "Composite worldline instantons and the nonperturbative particle decay in constant external electric and magnetic fields", "abstract": "In this paper, we discuss the validity of the composite worldline instanton approach for the nonperturbative decay of charged particles in constant electric and magnetic fields. It is shown that the instanton results in the leading exponential approximation in the different limits agree with the ones obtained by the imaginary part of the self-energy in the external field and by overlap of the wave functions. We comment on the possible application of our results for the estimation of the decay rate of the proton in the external electric and magnetic field in the leading exponential approximation. The effects of entanglement of the particles in the final state are briefly mentioned.", "url": "https://arxiv.org/abs/2607.12083", "type": "理论", "summary": "1. 该工作验证了复合世界线瞬子方法在恒定电磁场中带电粒子非微扰衰变指数近似下的有效性。\n2. 其技术核心在于瞬子结果在不同极限下与自能虚部及波函数重叠方法所得衰变率一致，并给出了质子衰变速率的指数近似估计。\n3. 这为外场中质子衰变等过程的非微扰计算提供了可靠途径，并暗示未态粒子纠缠效应对衰变率的潜在修正。", "summary_source": "deepseek", "authors": [{"name": "Alexander Gorsky"}, {"name": "Ivan Poluboyarinov"}], "featured_authors": [{"name": "Alexander Gorsky"}, {"name": "Ivan Poluboyarinov"}], "author_count": 2}, {"id": "2607.12103", "category": "hep-th", "title": "Liouville strings in AdS$_3$: the worldsheet story", "abstract": "The worldsheet $\\sigma$-model of strings on AdS$_3$ with NS-NS fluxes can be equivalently described in terms of a Liouville field theory coupled to a timelike field with background charge, plus a marginal deformation. The operator that produces the deformation is non-normalizable and, from the string theory perspective, is associated to the spectral flow sector $\\omega =2$. Its role is to control the winding number violation in scattering amplitudes. In the semiclassical (large $k$) limit, the central charge of the Liouville factor tends to that of the dual CFT$_2$, namely $c\\simeq 6k$. This may appear very similar to what occurs in the Liouville-type description of the dual deformed orbifold CFT$_2$, where a twist-2 deformation operator dressed with a non-normalized field also appears. Indeed, there are some similarities to that; however, there are also significant differences, which we discuss.", "url": "https://arxiv.org/abs/2607.12103", "type": "理论", "summary": "1. 该工作将AdS₃带NS-NS通量弦的worldsheet σ-模型等效为Liouville场论与类时背景荷场耦合，并受非正规化边际变形算子微扰，该算子源自谱流扇区ω=2.。\n2. 技术核心在于此变形算子控制散射振幅中缠绕数违背，且在经典大k极限下Liouville因子中心荷c≈6k精确收敛于对偶CFT₂值.。\n3. 与对偶orbifold CFT₂中扭算符变形相比，本框架揭示两者在动力学与谱结构上的本质差异，为AdS/CFT对应中worldsheet量子机制提供直接洞见.。", "summary_source": "deepseek", "authors": [{"name": "Gaston Giribet"}, {"name": "Pedro Schmied"}], "featured_authors": [{"name": "Gaston Giribet"}, {"name": "Pedro Schmied"}], "author_count": 2}, {"id": "2607.12119", "category": "hep-th", "title": "Compact, long-range and vacuumless regimes controlled by scalar fields in two-dimensional flat and five-dimensional warped geometries", "abstract": "We investigate the presence of compact, long-range, and vacuumless regimes in models described by real scalar fields in 2D flat and 5D warped geometries. In the two-dimensional case, we study in detail several models that support localized solutions. When embedded into a warped $\\text{AdS}_5$ background, these fields generate distinct kinds of brane profiles.", "url": "https://arxiv.org/abs/2607.12119", "type": "理论", "summary": "1. 该工作系统研究了二维平坦与五维翘曲AdS₅几何中实标量场模型所支持的紧凑、长程及无真空等区间行为。\n2. 其核心在于通过详细分析多种二维局域解，并将场嵌入翘曲背景，揭示了标量场参数如何调控膜轮廓的形态与时空结构。\n3. 这为理解高维翘曲几何中的局域化现象及构建膜世界场景提供了明确的物理机制与模型指导。", "summary_source": "deepseek", "authors": [{"name": "Elisama E.M. Lima"}, {"name": "Dionisio Bazeia"}], "featured_auth
