rg/abs/2607.12838", "type": "理论", "summary": "1. 该工作在准厄米度规平稳框架下构造混合态Loschmidt振幅，自洽推导了由两能级与N-2个旁观态耦合的N能级模型在有限温度突然淬火后的动力学。\n2. 其物理核心在于揭示温度通过特征态热权重的重新分布控制动态相变，导致Hilbert空间维度达到五时出现有限阈值温度，且Loschmidt振幅所有实零点消失，动态量子相变被完全热抑制。\n3. 该抑制机制为通过热占据调控动态临界性提供了通用原理，所发展的准厄米框架则为严格推导有限温度非厄米动力学奠定了自洽基础。", "summary_source": "deepseek", "authors": [{"name": "Jia-Chen Tang"}, {"name": "Xu-Yang Hou"}, {"name": "Ming-Zhang Wang"}, {"name": "Hao Guo"}], "featured_authors": [{"name": "Jia-Chen Tang"}, {"name": "Xu-Yang Hou"}, {"name": "Ming-Zhang Wang"}, {"name": "Hao Guo"}], "author_count": 4}, {"id": "2607.12848", "category": "quant-ph", "title": "Time-independent counterdiabatic driving for emergent two-level subspaces in many-body systems", "abstract": "We show that geodesic motion in the Riemannian manifold of quantum states provides a direct route to time-independent counterdiabatic driving. Using the relation between the counterdiabatic Hamiltonian and the quantum metric tensor, we prove that a constant-speed geodesic makes the Hilbert-Schmidt norm of the counterdiabatic Hamiltonian constant. For effective two-level systems whose counterdiabatic correction has a fixed operator direction, this further implies that the full counterdiabatic Hamiltonian itself is time independent. We illustrate this result with the Landau-Zener model, three-level Stimulated Raman adiabatic passage and a collectively driven Rydberg ensemble in the blockade regime. Limitations of this approach in realistic many-body systems are discussed, where the two-level reduction is only emergent and leakage out of the effective subspace bounds the achievable speedup. In all cases, time-independent counterdiabatic driving achieves unit-fidelity state preparation on timescales substantially shorter than conventional adiabatic protocols while replacing temporally shaped auxiliary controls by fixed-amplitude fields.", "url": "https://arxiv.org/abs/2607.12848", "type": "理论", "summary": "1. 该工作提出利用量子态黎曼流形中的定速测地线运动实现时间无关反绝热驱动，并证明有效二能级子空间中反绝热哈密顿量时不变的充分条件。\n2. 其核心在于揭示量子度规张量与反绝热修正的关联，使辅助控制场从时间整形简化为固定振幅，在远短于绝热时间尺度上实现单位保真度态制备。\n3. 这为多体系统中规避能级泄漏限制、加速量子操控提供了通用方案，对超导量子比特和里德堡原子等平台具有直接指导意义。", "summary_source": "deepseek", "authors": [{"name": "S. Dengis"}, {"name": "P. Schlagheck"}], "featured_authors": [{"name": "S. Dengis"}, {"name": "P. Schlagheck"}], "author_count": 2}, {"id": "2607.12907", "category": "quant-ph", "title": "Unitary Synthesis with Near-Optimal T-Count for Near-Clifford Unitaries", "abstract": "We present an approach to unitary synthesis that implements an arbitrary $n$-qubit unitary operator $U$ by a Clifford+T circuit with T-count $\\widetilde{O}(2^n d_F^{\\mathcal{C}}(U))$, where $d_F^{\\mathcal{C}}(U)$ is the Frobenius norm distance of $U$ to the Clifford group. The T-count is shown to be near-optimal when $d_F^{\\mathcal{C}}(U)$ is a constant. Our approach improves the previous best upper bound $\\widetilde{O}(2^{4n/3})$ due to Tan (2025) for a large class of unitary operators $U$ as long as $d_F^{\\mathcal{C}}(U) \\ll 2^{n/3}$.", "url": "https://arxiv.org/abs/2607.12907", "type": "理论", "summary": "1. 该工作提出一种基于Clifford+T门集的酉合成方法，对于任意n量子比特酉算子U，给出T门数的上界Õ(2^n d_F^C(U))，其中d_F^C(U)为U到Clifford群的Frobenius范数距离。\n2. 技术关键在于当d_F^C(U)为常数时T计数达到信息论下界附近的近最优，且对于d_F^C(U)远小于2^{n/3}的U，该结果改进了Tan等人此前的最佳上界Õ(2^{4n/3})，实现了对近Clifford酉算子的高效编译。\n3. 该工作为容错量子计算中T门开销的优化提供了可证近优的实用方案，并启发了利用酉算子与Clifford群距离作为复杂度度量的新视角。", "summary_source": "deepseek", "authors": [{"name": "Wang Fang"}, {"name": "Chris Heunen"}, {"name": "Qisheng Wang"}], "featured_authors": [{"name": "Wang Fang"}, {"name": "Chris Heunen"}, {"name": "Qisheng Wang"}], "author_count": 3}, {"id": "2607.12948", "category": "quant-ph", "title": "Logical Entangling with Phantom Codes in Hypergraph Products", "abstract": "Logical entangling gates are a major source of physical spacetime overhead in fault-tolerant quantum computation. Phantom codes reduce this cost by implementing every ordered in-block logical CNOT through physical qubit permutations and Pauli-frame updates. Whether this mechanism can coexist with the low-weight stabilizer structure of qLDPC codes is a central question for low-overhead fault-tolerant architectures. We give a deterministic answer within binary CSS hypergraph product (HGP) codes. Up to natural equivalences, the simplex-repetition family is the unique HGP family satisfying the phantom condition. We then evaluate this family under circuit-level noise in logical GHZ-state preparation and Trotterized many-body quantum simulation. The codes retain low-weight stabilizer checks and yield concrete advantages over rotated surface-code baselines in both benchmarks. Reconfigurable neutral-atom arrays offer a natural setting for this approach, supporting nonlocal qLDPC operations while enabling in-block logical CNOTs without additional physical operations. Together, these results make precise how permutation-based logical entangling constrains code design within the HGP framework, demonstrate the circuit-level benefits of the unique family, and guide the search for phantom qLDPC families with better asymptotic parameters for low-overhead fault tolerance on neutral-atom hardware.", "url": "https://arxiv.org/abs/2607.12948", "type": "数值", "summary": "1. 该工作证明在二元CSS超图积码框架内，单纯形-重复族是唯一满足幻象条件的族，实现基于物理置换与Pauli帧更新的块内逻辑CNOT门。\n2. 其核心在于通过精确分类揭示幻象条件对码结构的约束，并展示该族在电路级噪声下逻辑GHZ态制备和Trotterized量子模拟中优于旋转表面码的具体优势。\n3. 这为在中性原子阵列上设计具有更好渐近参数的低开销幻象qLDPC码提供了明确指导，并确立了置换型逻辑纠缠与码设计之间的定量关系。", "summary_source": "deepseek", "authors": [{"name": "Keming He"}, {"name": "Ziao Tang"}, {"name": "Zetong Li"}, {"name": "Ge Bai"}, {"name": "Xin Wang"}], "featured_authors": [{"name": "Keming He"}, {"name": "Ziao Tang"}, {"name": "Zetong Li"}, {"name": "Ge Bai"}, {"name": "Xin Wang"}], "author_count": 5}, {"id": "2607.12966", "category": "quant-ph", "title": "Nonreciprocal Quantum Mpemba Effect", "abstract": "We demonstrate a nonreciprocal quantum Mpemba effect. Consider a broad class of open quantum systems, each coupled to two isomorphic reservoirs through symmetric ports. Interchanging the parameters of the two reservoirs -- a discrete operation we call the swap -- turns the quantum Mpemba effect on or off without changing the initial states. The swap modifies the Liouvillian, yet a structural symmetry pins the eigenvalues while rotating only the eigenvectors. The nonreciprocity therefore leaves no trace in the spectrum and is carried entirely by the eigenvectors. Concretely, the swap alters the far state's projection onto the slowest mode, switching whether it bypasses the slowest relaxation channel. At a Liouvillian exceptional point, the far state's relaxation switches from bypassing the slowest mode to avoiding the critical slowing, with the on--off contrast intact. There the spectrum-independent mechanism takes its purest form.", "url": "https://arxiv.org/abs/2607.12966", "type": "理论", "summary": "1. 该工作在一类通过对称端口耦合至两个同构库的开放量子系统中，演示了非互易量子Mpemba效应——交换两库参数可开关该效应而初始态不变。\n2. 其核心卖点是交换操作仅旋转Liouvillian特征向量而特征值不变，非互易性完全由特征向量承载，并在Liouvillian例外点处远态弛豫从绕过最慢模切换为避免临界减慢。\n3. 这一不依赖谱的机制为利用特征向量而非特征值调控弛豫通道提供新范式，有望启发非互易量子热力学效应及定向热输运系统的设计。", "summary_source": "deepseek", "authors": [{"name": "Wei-Bin Yan"}, {"name": "Ying-Jie Zhang"}, {"name": "Yun-Jie Xia"}, {"name": "Heng Fan"}, {"name": "Zhong-Xiao Man"}], "featured_authors": [{"name": "Wei-Bin Yan"}, {"name": "Ying-Jie Zhang"}, {"name": "Yun-Jie Xia"}, {"name": "Heng Fan"}, {"name": "Zhong-Xiao Man"}], "author_count": 5}, {"id": "2607.12968", "category": "quant-ph", "title": "Maximal Classicalization of Finite-Group Quantum Reference-Frame Noise", "abstract": "A finite quantum reference token with group-valued misalignment induces a random-unitary channel, but optimal degradation is generally an optimization over all quantum post-processings. For a unitary representation U of a finite group G, we prove that the following conditions are equivalent: U contains every irreducible type; one ancilla-assisted input has an orthonormal G-orbit; signed group measures embed isometrically into channels in diamond norm; and, for every pair of noise laws p,q, $\\inf_{\\Lambda\\in\\mathrm{CPTP}} \\frac{1}{2}\\|\\Phi_q^U-\\Lambda\\circ\\Phi_p^U\\|_\\diamond =\\min_{r\\in\\mathcal{P}(G)}\\frac{1}{2}\\|q-r*p\\|_1$. Thus representation completeness is the exact carrier condition for universal reduction of quantum post-processing to classical convolution. We determine the minimum ancilla dimensions for an orthogonal orbit and for an invariant calibration seed. For an incomplete carrier, with visible Plancherel dimension S(U), we derive the exact conditional-expectation distance $\\frac{1}{2}\\|\\operatorname{id}-\\Phi_u^U\\|_\\diamond=1-1/S(U)$ and an explicit quantum--classical deficiency gap. For irreducible carriers the deficiency is obtained in closed form; the faithful two-dimensional representation of $S_3$ yields an exact ten-percent reduction relative to classical convolution. We also characterize law identifiability through the conjugation representation, provide finite linear programs and decision witnesses, and establish both a finite-dimensional obstruction and stable visible-band reconstruction for infinite compact groups. Deterministic ancillary code reproduces the finite-group examples and numerical regression checks.", "url": "https://arxiv.org/abs/2607.12968", "type": "理论+数值", "summary": "1. 该工作证明了有限群酉表示包含所有不可约类型时，量子参考框架噪声的最优量子后处理可严格化为经典卷积，并给出了充要条件刻画。\n2. 其技术核心在于将表示完备性、正交G-轨道、群测度等距嵌入与钻石范数距离最小化四者等价，从而精确界定经典化发生的边界。\n3. 该结果为有限群及无限紧群上的量子参考框架噪声提供了可计算的判据与可观测的经典化缺口，对参考系对齐与量子信息处理有直接启发。", "summary_source": "deepseek", "authors": [{"name": "Maxim V. Churilov"}], "featured_authors": [{"name": "Maxim V. Churilov"}], "author_count": 1}, {"id": "2607.12981", "category": "quant-ph", "title": "An Agentic Formalization for Certified Quantum Neural Network Design", "abstract": "A central model in quantum machine learning is the quantum neural network (QNN), whose design requires balancing expressivity and trainability. Technically, expressivity is studied through circuit-function analysis, such as quantum signal processing, while trainability is analyzed using dynamical-Lie-algebra (DLA) methods. To support certified QNN design, we formalize these major components of QNN theory in a connected lean 4 development checked by a proof kernel, where every analytic input is either proved or exposed as a named hypothesis. On the expressivity side, we prove exact if-and-only-if characterizations of single-qubit QNNs, a resource-counted quantum phase processing theorem, and an overparameterization ceiling that bounds the quantum Fisher information rank by the DLA dimension. On the trainability side, we derive the direct-sum loss-variance law through a de-circularized second-moment interface. A parameterized Casimir-uniqueness engine discharges the required inputs for fully controllable, orthogonal, and matchgate circuit families, while single-qubit and product-Clifford ensembles close the two-design assumptions directly. A capstone theorem pairs the conditional variance law with exact loss reconstruction in DLA coordinates. The development record identifies eight corrections and clarifications that were not explicit in the informal arguments. We expect this work to provide a machine-checkable foundation for QNN theory and a step toward AI-assisted or automated design of quantum machine learning algorithms.", "url": "https://arxiv.org/abs/2607.12981", "type": "理论+数值", "summary": "1. 该工作形式化了量子神经网络（QNN）理论的核心组分，在Lean 4证明内核中实现了可机器验证的认证QNN设计框架。\n2. 其技术卖点在于证明了单比特QNN的充要表征、资源计数量子相位处理定理、量子Fisher信息秩的过参数化上界，以及通过解循环二阶矩界面导出的直接和损失方差律。\n3. 这为QNN理论提供了机器可检查的严格基础，并推动了向AI辅助或自动化量子机器学习算法设计的关键一步。", "summary_source": "deepseek", "authors": [{"name": "Mingrui Jing"}, {"name": "Lei Zhang"}, {"name": "Yusheng Zhao"}, {"name": "Hongshun Yao"}, {"name": "Xin Wang"}], "featured_authors": [{"name": "Mingrui Jing"}, {"name": "Lei Zhang"}, {"name": "Yusheng Zhao"}, {"name": "Hongshun Yao"}, {"name": "Xin Wang"}], "author_count": 5}, {"id": "2607.12994", "category": "quant-ph", "title": "Fixed-Boost Wigner Noise: Strict Trace-Distance Contraction without Quantum Degradability", "abstract": "A Lorentz boost acts on the canonical spin of a massive particle through a momentum-dependent Wigner rotation. We show that, for one fixed observer boost, reducing over an uncertain momentum can strictly contract every pairwise spin-state trace distance without producing a channel that is degradable from the less contracted one. For spin $1/2$, we first characterize the exact inversion-symmetric channel cone generated by a fixed Wigner angle and transverse momentum directions. Inside this cone lies the Pauli family $M_\\alpha=\\operatorname{diag}(1-\\alpha,1-\\alpha,1-2\\alpha)$, $0\\leq\\alpha<1/2$. For $0<\\alpha<\\beta<1/2$, all trace distances between distinct spin states are strictly smaller after $M_\\beta$ than after $M_\\alpha$, yet the unique linear post-processing factor has a negative normalized Choi eigenvalue. We solve the optimization over all physical converters exactly: $\\frac{1}{2}\\inf_{\\Lambda\\in\\mathrm{CPTP}}\\|\\Phi_\\beta-\\Lambda\\circ\\Phi_\\alpha\\|_\\diamond=\\frac{\\alpha(\\beta-\\alpha)}{2-3\\alpha}$, whereas the reverse deficiency is $\\beta-\\alpha$. Thus the identity dominates the family, while all positive-noise members are pairwise incomparable under CPTP post-processing. The ideal construction is realized as the narrow-packet limit of pure, normalizable five-component momentum states, and explicit perturbation and finite-shot tomography bounds certify an open set of examples. Separately, every nonidentity member fails embedding in a time-homogeneous Pauli-diagonal Lindblad semigroup. Hence ordering all unassisted spin distinguishabilities does not determine the quantum statistical post-processing order.", "url": "https://arxiv.org/abs/2607.12994", "type": "理论+数值", "summary": "1. 该工作研究固定洛伦兹boost下由动量不确定Wigner旋转引起的自旋态迹距离严格收缩现象，并证明该信道不具备量子退化的特性。\n2. 其核心在于精确刻画自旋1/2的反演对称信道锥，求解物理转换器优化问题，发现正噪声成员在CPTP后处理下两两不可比，且非恒等元无法嵌入时间均匀Pauli对角Lindblad半群。\n3. 这揭示了无辅助自旋分辨率的排序并不等价于量子统计后处理次序，为理解相对论量子信道在信息处理中的根本局限提供了明确框架。", "summary_source": "deepseek", "authors": [{"name": "Maxim V. Churilov"}], "featured_authors": [{"name": "Maxim V. Churilov"}], "author_count": 1}, {"id": "2607.12996", "category": "quant-ph", "title": "Expressibility and trainability of a two-dimensional pairwise quantum-circuit ansatz", "abstract": "Parameterized quantum circuits~(PQCs) constitute a central building block of variational quantum algorithms~(VQAs) and quantum machine learning~(QML) methods. Existing ansatz designs often adopt hardware-agnostic or simplified 1D chain/ring entanglement patterns. However, as quantum hardware continues to develop, native 2D connectivity patterns, such as planar superconducting-qubit architectures, are becoming increasingly important. Inspired by this hardware structure, we construct a native 2D pairwise ansatz and compare its expressibility and trainability with representative 1D ansatze at identical layer depths, despite their different circuit depths. For the fixed 16-qubit system, the 2D ansatz has the smallest KL divergence at $L=1$ and $2$, and its second-order frame potential approaches the theoretical lower bound more rapidly at shallow layer counts than the frame potentials of the three 1D ansatze. We also evaluate the gradient variance of the Pauli-$Z$-string expectation value $\\langle Z_0\\otimes\\cdots\\otimes Z_{15}\\rangle$ with respect to the first $R_y$ angle. For this Pauli-$Z$ string and fixed parameter, the gradient variance is smaller for the 2D circuit at $L=1$--$4$. The differences narrow at $L=5$, and the four ansatze yield statistically compatible variances at $L=6$.", "url": "https://arxiv.org/abs/2607.12996", "type": "理论+数值", "summary": "1. 该工作针对16量子比特系统比较了原生二维成对参数化量子电路与一维链/环ansatz的表达能力和可训练性。\n2. 其卖点在于二维ansatz在浅层深度下KL散度最小、二阶框架势更快逼近理论下界，且Pauli-Z-string期望值梯度方差更小。\n3. 这为变分量子算法和量子机器学习中采用硬件原生二维拓扑的ansatz设计提供了依据。", "summary_source": "deepseek", "authors": [{"name": "Shuai Zhang"}, {"name": "Wei Liu"}, {"name": "Ji-Chong Yang"}], "featured_authors": [{"name": "Shuai Zhang"}, {"name": "Wei Liu"}, {"name": "Ji-Chong Yang"}], "author_count": 3}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>${paper.summary_source === "deepseek" ? "DeepSeek three-sentence PRL summary" : (paper.summary_source === "local-fallback" ? "Local three-sentence fallback" : (paper.summary_source === "translation" ? "Chinese abstract translation" : "Chinese placeholder fallback"))}</span><a href="${safeUrl}" target="_blank" rel="noreferrer">Open arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
</body>
</html>
