  <title>arXiv 2026-08-11 · Daily ArXiv Selection</title>
  <style>
    :root {
      --bg: #f6f1e8;
      --panel: rgba(255, 252, 246, 0.92);
      --text: #2d241d;
      --muted: #6d5d50;
      --line: rgba(69, 49, 32, 0.14);
      --accent: #8f3d2e;
      --accent-2: #1d5f6b;
      --theory: #7c3a2a;
      --numeric: #255b6a;
      --both: #5d4a99;
      --experimental: #2f6b39;
      --shadow: 0 18px 40px rgba(54, 32, 16, 0.12);
      --radius: 22px;
      --ui-font: "Aptos", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --title-font: "Palatino Linotype", "Noto Serif SC", Georgia, serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--ui-font);
      color: var(--text);
      background: radial-gradient(circle at top left, rgba(255,255,255,0.78), transparent 32%), radial-gradient(circle at 88% 12%, rgba(29,95,107,0.14), transparent 20%), linear-gradient(180deg, #fbf7f0 0%, var(--bg) 42%, #f2e8dc 100%);
      min-height: 100vh;
    }
    .shell { width: min(1220px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 64px; }
    .hero {
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(255,255,255,0.84), rgba(255,248,238,0.72)), linear-gradient(135deg, rgba(143,61,46,0.08), rgba(29,95,107,0.08));
      box-shadow: var(--shadow);
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.82); border: 1px solid var(--line); color: var(--muted); font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase;
    }
    h1 { margin: 18px 0 10px; font-family: var(--title-font); font-size: clamp(32px, 5vw, 54px); line-height: 1.04; letter-spacing: -0.03em; }
    .hero p { max-width: 880px; color: var(--muted); font-size: 16px; line-height: 1.7; margin: 0; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-top: 26px; }
    .stat { padding: 16px 18px; background: rgba(255,255,255,0.76); border: 1px solid var(--line); border-radius: 18px; }
    .stat .label { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
    .stat .value { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
    .controls { position: sticky; top: 12px; z-index: 3; margin-top: 22px; padding: 18px; border: 1px solid var(--line); border-radius: 24px; background: rgba(250,244,236,0.9); backdrop-filter: blur(16px); box-shadow: 0 10px 24px rgba(54,32,16,0.08); }
    .control-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 16px; }
    .field { display: flex; flex-direction: column; gap: 10px; }
    .field label { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
    .search { width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line); background: rgba(255,255,255,0.92); font: inherit; color: var(--text); }
    .chip-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .chip { border: 1px solid var(--line); background: rgba(255,255,255,0.82); color: var(--text); padding: 10px 14px; border-radius: 999px; font: inherit; cursor: pointer; }
    .chip.active { border-color: rgba(143,61,46,0.35); background: rgba(143,61,46,0.12); color: #5b2419; }
    .chip[data-type="数值"].active { border-color: rgba(37,91,106,0.35); background: rgba(37,91,106,0.12); color: #173f49; }
    .chip[data-type="理论+数值"].active { border-color: rgba(93,74,153,0.35); background: rgba(93,74,153,0.12); color: #46337d; }
    .chip[data-type="实验"].active { border-color: rgba(47,107,57,0.35); background: rgba(47,107,57,0.12); color: #214c29; }
    .meta-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 14px; color: var(--muted); font-size: 14px; }
    .paper-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 18px; margin-top: 22px; }
    .paper { display: flex; flex-direction: column; gap: 14px; padding: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 10px 24px rgba(54,32,16,0.06); }
    .paper-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .tag { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid transparent; }
    .tag.category { background: rgba(45,36,29,0.08); color: var(--text); }
    .tag.type-theory { background: rgba(124,58,42,0.1); color: var(--theory); border-color: rgba(124,58,42,0.16); }
    .tag.type-numeric { background: rgba(37,91,106,0.1); color: var(--numeric); border-color: rgba(37,91,106,0.16); }
    .tag.type-both { background: rgba(93,74,153,0.1); color: var(--both); border-color: rgba(93,74,153,0.16); }
    .tag.type-experimental { background: rgba(47,107,57,0.1); color: var(--experimental); border-color: rgba(47,107,57,0.16); }
    .paper h2 { margin: 0; font-family: var(--title-font); font-size: 22px; line-height: 1.25; letter-spacing: -0.02em; }
    .paper h2 a { color: inherit; text-decoration: none; }
    .paper h2 a:hover { color: var(--accent); }
    .paper .id { color: var(--muted); font-size: 13px; }
    .author-block { display: grid; gap: 10px; padding: 14px 16px; border-radius: 18px; background: rgba(255,255,255,0.64); border: 1px solid var(--line); }
    .author-label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .author-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .author-item { display: grid; gap: 4px; }
    .author-item strong { font-size: 14px; }
    .author-item span { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .author-note { color: var(--muted); font-size: 12px; }
    .paper .summary { margin: 0; font-size: 15px; line-height: 1.75; white-space: pre-line; }
    details { border-top: 1px solid var(--line); padding-top: 12px; }
    details summary { cursor: pointer; color: var(--accent-2); font-weight: 700; list-style: none; }
    details summary::-webkit-details-marker { display: none; }
    details p { margin: 10px 0 0; color: var(--muted); line-height: 1.72; font-size: 14px; white-space: pre-line; }
    .paper footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 6px; color: var(--muted); font-size: 13px; }
    .paper footer a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .empty { display: none; margin-top: 24px; padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 22px; background: rgba(255,255,255,0.7); }
    @media (max-width: 980px) { .control-grid { grid-template-columns: 1fr; } .controls { position: static; } }
  </style>

  <script>
    const papers = [{"id": "2608.07595", "category": "cond-mat", "title": "Revisiting the Coupling of Thermodynamics and Electromagnetics", "abstract": "We revisit the coupling of continuum thermodynamics and electromagnetic theory for polarisable and magnetisable matter in motion. Two routes are followed and then compared. The first route is the axiomatic bulk theory of Dreyer, Guhlke and Müller, in which universal balance laws are closed by an entropy principle. We show that the source of the internal energy balance must be built with the non-convective electric current, that the polarisation current and the Lorentz magnetisation enter through one single identity, which Dreyer et al.\\ do not write down, and that this identity fixes both the admissible entropy variables and the signs of the bound-current ansatz. The second route is the statistical-mechanical one of Mazur, in which the macroscopic Maxwell equations are obtained by ensemble averaging over a system of atoms with internal charge carriers. Mazur stops before the conservation laws, so we derive them, and we estimate the size of the mass-correction terms that appear. The comparison shows that after a redefinition of polarisation and magnetisation the two sets of equations agree structurally. The only irreducible difference is a momentum contribution from microscopic field fluctuations, which can not be reproduced in a purely macroscopic theory. We further show that the electromotive intensity $\\mathcal{E}$ and the Lorentz magnetisation $\\mathcal{M}$ are not modelling choices but appear by themselves, and that the asymmetric look of the entropy function is a consequence of the chosen energy variable and not a defect of the theory.", "url": "https://arxiv.org/abs/2608.07595", "type": "理论", "summary": "1. 该工作重新审视运动极化与磁化物质中连续介质热力学与电磁学的耦合，系统比较公理化体理论与统计力学路线。\n2. 其技术核心在于证明内部能量源须由非对流电流构造，并借助单一恒等式同时固定熵变量和束缚电流符号，且重定义极化与磁化后两套方程结构一致。\n3. 这指明唯一不可约差异来自微观场涨落的动量贡献，无法被纯宏观理论涵盖，为修正热力学-电磁学耦合模型提供了启示。", "summary_source": "deepseek", "authors": [{"name": "Stefanie Braun"}, {"name": "Henning Struchtrup"}, {"name": "Manuel Torrilhon"}], "featured_authors": [{"name": "Stefanie Braun"}, {"name": "Henning Struchtrup"}, {"name": "Manuel Torrilhon"}], "author_count": 3}, {"id": "2608.07644", "category": "cond-mat", "title": "Reply to Smallenburg: Near-melting nucleation and the exponential growth of hard-sphere nucleation times", "abstract": "Smallenburg reports near-melting point simulations and observes a well-predicted spontaneous nucleation with mixed, finite-time morphology, in a Comment on our recent Perspective. The Comment's incorrect broader takeaway --- that equilibrium coexistence is \"readily achievable\" --- rests on an untested generalization from a single state point near the phase envelope, and misses entirely the intriguing role played by Frenkel's underlying mechanism. We reiterate the salient point missed by the Comment: the nucleation time grows astronomically with just tenths of a percent of volume fraction away from 53%. This phenomenology emerges from the entropy exchange mechanism Frenkel described, which predicts that spontaneous phase separation is dynamically accessible only down to about 53% volume fraction from the melting point, and astronomically long waiting times through most of the remaining phase envelope. We provide here calculations to address the potential misconception created by the Comment.", "url": "https://arxiv.org/abs/2608.07644", "type": "数值", "summary": "1. 该工作针对Smallenburg的评论给出回复，并通过计算阐明近熔点自发成核与硬球成核时间指数增长的关键事实。\n2. 其核心论点在于，从熔点向下仅偏离千分之一的体积分数，成核等待时间即呈天文数字增长，这源自Frenkel熵交换机制，使平衡共存并非轻易可达。\n3. 这为判断自发相分离的动力学可达性和硬球成核时间尺度提供了定量校准，并警示不应从单一状态点向整个相图过度推广。", "summary_source": "deepseek", "authors": [{"name": "Roseanna N. Zia"}], "featured_authors": [{"name": "Roseanna N. Zia"}], "author_count": 1}, {"id": "2608.07666", "category": "cond-mat", "title": "Defect-Controlled Multiferroicity via Stacking Control in Nonmagnetic van der Waals Bilayers", "abstract": "We present a general paradigm that directly couples vacancy-localized magnetism to interfacial sliding ferroelectricity in nonmagnetic van der Waals (vdWs) bilayers. Utilizing bilayer hexagonal boron nitride (hBN) as a prototypical vdWs host system, we use first-principles calculations to show that a single vacancy acts as a local registry sensor, lifting the degeneracy between polar sliding partners via a defect-centered polarization offset. For interlayer vacancy pairs, we discover a defect selectivity where the hosting sublattice fully dictates the interlayer exchange, stabilizing either ferrimagnetic or antiferromagnetic configurations. Applying an out-of-plane electric field selects the polar registry and drives an amplitude modulation of the compensated Néel order parameter. These findings establish a robust, sublattice-dependent engineering of multiferroic functionality via stacking control across a wide class of nonmagnetic 2D heterostructures.", "url": "https://arxiv.org/abs/2608.07666", "type": "数值", "summary": "1. 该工作基于第一性原理计算，在双层六方氮化硼等非磁性范德华双层中提出空位局域磁性与层间滑动铁电直接耦合的普适范式。\n2. 其技术关键是空位作为局域注册传感器，通过缺陷中心极化偏移解除滑动极化的简并，且层间空位对的耦合由宿主亚晶格决定，可稳定亚铁磁或反铁磁构型。\n3. 这预示外加垂直电场可选定极性注册并调制补偿奈尔序振幅，为实现不依赖磁性元素、由堆垛控制的二维多铁性工程提供了可行路线。", "summary_source": "deepseek", "authors": [{"name": "Bumseop Kim"}, {"name": "Sayed Ali Akbar Ghorashi"}, {"name": "Andrew M. Rappe"}], "featured_authors": [{"name": "Bumseop Kim"}, {"name": "Sayed Ali Akbar Ghorashi"}, {"name": "Andrew M. Rappe"}], "author_count": 3}, {"id": "2608.07714", "category": "cond-mat", "title": "Engineering correlated phases through manipulation of Van Hove singularities", "abstract": "Controlling the ordered phases of correlated electron systems remains a central challenge in quantum materials design. Divergences in the electronic density of states, known as Van Hove singularities (VHSs), are one obvious route to such control. It is clear from recent work that the exact functional form of these divergences can profoundly affect which phases are realized; a full picture, however, remains elusive. In this work, we use both the hot-spot parquet renormalization group and the truncated-unity functional renormalization group to theoretically study the emergent correlated states of a two-dimensional square-lattice Hubbard model with VHSs at or near the Fermi level. By varying a single hopping parameter, $t_3$, we are able to change the strength of the VHS divergence in the density of states from logarithmic (for $t_3 < t_{3c}$) to power-law (for $t_3 = t_{3c}$). Further increase of $t_3$ ($t_3 > t_{3c}$) causes each original Van Hove point to split into two, both of the conventional logarithmic type. We show that which of these regimes we are in strongly influences the predicted ordered states. We also study the dependence on doping, and find that the ferromagnetic state that occurs at Van Hove filling in these models is unstable to very small shifts in the Fermi level, often giving way to distinct ordered states depending on whether the model is electron- or hole-doped. These results highlight the importance of tuning VHS properties to control ordered states in correlated materials, and offer design rules to engineer these phases in novel systems.", "url": "https://arxiv.org/abs/2608.07714", "type": "理论", "summary": "1. 该工作利用热斑parquet重整化群和截断幺正泛函重整化群，理论研究了二维正方晶格Hubbard模型中费米能级附近范霍夫奇点对关联有序态的调控。\n2. 其卖点是通过单个跃迁参数t3将态密度奇点由对数型连续调至幂律型，进而使每个范霍夫点劈裂为两个，并揭示不同奇点函数形式及掺杂下铁磁态失稳后竞争相的选择规律。\n3. 这为以范霍夫奇点性质作为设计自由度来工程化关联材料中的有序相提供了具体规则，对未来平带或扭角体系的实验调控有直接启发。", "summary_source": "deepseek", "authors": [{"name": "Thomas P. Sheerin"}, {"name": "Maria Ramirez"}, {"name": "Chris A. Hooley"}, {"name": "Luke C. Rhodes"}], "featured_authors": [{"name": "Thomas P. Sheerin"}, {"name": "Maria Ramirez"}, {"name": "Chris A. Hooley"}, {"name": "Luke C. Rhodes"}], "author_count": 4}, {"id": "2608.07744", "category": "cond-mat", "title": "Dynamical quantum phase transitions in a hybrid quantum dot system with superconducting and ferromagnetic leads", "abstract": "We theoretically explore the non-equilibrium dynamics of a single quantum dot system coupled to both ferromagnetic and superconducting electrodes. To investigate its time evolution, we utilize the time-dependent numerical renormalization group technique, which captures the system's response to abrupt parameter changes in a fully non-perturbative manner. Our analysis focuses on dynamics following a sudden modification in the couplings to the leads or a shift of the orbital level. In particular, we calculate the time evolution of the induced local superconducting pairing correlations and magnetization. In this context, the relevant energy spectra are examined. Moreover, we study the behavior of the Loschmidt echo and the return function to shed light on the signatures of dynamical quantum phase transitions. The determined dependencies reveal non-trivial competition between relevant correlations, involving superconducting pairing and ferromagnetic-contacted induced exchange field, and deepen our understanding of nanoscale hybrid systems' dynamical behavior.", "url": "https://arxiv.org/abs/2608.07744", "type": "理论+数值", "summary": "1. 该工作利用含时数值重正化群方法，理论研究了同时耦合铁磁与超导电极的单量子点系统在耦合强度突变或轨道能级移动后的非平衡动力学演化与局域量子态重构。\n2. 其技术卖点在于以完全非微扰的方式计算诱导出的局域超导配对关联与磁化随时间的变化，并结合Loschmidt回波与返回函数的零值结构，刻画超导配对和铁磁接触感应交换场相互竞争所驱动的动力学量子相变。\n3. 该结果加深了对纳米尺度混合器件中多体关联实时竞争行为的理解，也为在超导-铁磁量子点平台上探测和调控非平衡量子相变提供了明确的理论指引。", "summary_source": "deepseek", "authors": [{"name": "Antoni Jankiewicz"}, {"name": "Kacper Wrześniewski"}, {"name": "Ireneusz Weymann"}], "featured_authors": [{"name": "Antoni Jankiewicz"}, {"name": "Kacper Wrześniewski"}, {"name": "Ireneusz Weymann"}], "author_count": 3}, {"id": "2608.07748", "category": "cond-mat", "title": "Probing intermittent polariton vortex dynamics with two-point correlations", "abstract": "Superconducting single-photon detectors with time resolution of 80 ps have been used to study the spatiotemporal dynamics of a trapped bosonic condensate of exciton-polaritons. Both second- and first-order correlation functions are found to exhibit pronounced oscillations in time governed by the dynamics of the polariton condensate in the trap. We have identified the intermittent regime of stochastic transitions between stationary and limit-cycle regimes near the Andronov-Hopf bifurcation manifested in asymmetric distortions of the correlation function. This rich interplay of deterministic and stochastic condensate dynamics is explained theoretically as a manifestation of mutually compensating self-repulsion and reservoir-mediated attraction.", "url": "https://arxiv.org/abs/2608.07748", "type": "理论", "summary": "1. 该工作用80皮秒时间分辨的超导单光子探测器，测量了囚禁激子极化激元凝聚体的二阶与一阶关联函数。\n2. 其卖点在于发现关联函数的不对称畸变，标识了安德罗诺夫-霍普夫分岔附近驻定与极限环之间的间歇性随机跃迁。\n3. 该机制归结为自排斥与激子库介导吸引的相互补偿，为探测非平衡凝聚体临界涨落提供了关联函数判据。", "summary_source": "deepseek", "authors": [{"name": "R. Cherbunin"}, {"name": "A. Liubomirov"}, {"name": "P. Kozhevin"}, {"name": "M. Chukeev"}, {"name": "M. Petrov"}, {"name": "S. Kavokina"}, {"name": "A. Nalitov"}, {"name": "A. Kavokin"}], "featured_authors": [{"name": "R. Cherbunin"}, {"name": "A. Liubomirov"}, {"name": "P. Kozhevin"}, {"name": "S. Kavokina"}, {"name": "A. Nalitov"}, {"name": "A. Kavokin"}], "author_count": 8}, {"id": "2608.07782", "category": "cond-mat", "title": "Understanding the Oxygen Reduction Reaction and Oxygen Evolution Reaction in Metal Intercalated Biphenylene Bilayers", "abstract": "We conducted an {\\it ab initio} study of the oxygen reduction reaction (ORR) and oxygen evolution reaction (OER) in metal-encapsulated biphenylene bilayers, B/M/B, with M = Ti, V, Cr, Mn, Fe, Co, Ni, Cu, Nb, Ru, W, Os and Pt. In most systems, the intercalated metal sits at the square carbon sites (C$^{468}$) of the biphenylene lattice. Using a computational hydrogen electrode approach, we evaluated the reaction energetics at these active sites. Several B/M/B systems show competitive ORR and OER performance. Among the investigated systems, Cu, Pt, Ru, and Mn exhibit the lowest ORR overpotentials of 0.42, 0.44, 0.50, and 0.56 V, respectively, while Fe is identified as the most active catalyst for OER with an overpotential of 0.44 V. To understand the catalytic trends, we looked at the electronic structure through the metal $d-$band centers, the C$^{468}$ $p_z-$band centers, and the corresponding orbital charge populations. The band centers did not give a simple polynomial dependence on the overpotentials, though they did point to favorable electronic ranges for the best catalysts. The $d-$orbital charge population of the encapsulated metal, however, correlated most clearly with activity-especially for OER-yielding volcano-type plots. From these, B/Fe/B emerges as the best OER catalyst, while B/Mn/B lies closest to the ORR optimum. The $p-$orbital population at the active carbon site also captures the main trends, albeit less strongly. Overall, these results show that straightforward electronic descriptors can predict catalytic behavior in metal-encapsulated biphenylene bilayers and guide the search for efficient catalysts where the carbon framework itself drives the reactivity.", "url": "https://arxiv.org/abs/2608.07782", "type": "数值", "summary": "1. 该工作利用计算氢电极方法从头研究了金属插层联苯烯双层B/M/B（M为多种过渡金属）上的氧还原与氧析出反应。\n2. 其核心发现是Cu、Pt、Ru、Mn具有较低ORR过电位，Fe具有最优OER过电位，且插层金属的d轨道电荷布居比d带中心更清晰地关联活性并形成火山型曲线。\n3. 这表明简单的电子结构描述符可有效预测该类碳骨架催化剂的活性趋势，为后续高效催化剂筛选提供直接依据。", "summary_source": "deepseek", "authors": [{"name": "Henri G. Mendonça"}, {"name": "Pedro H. Souza"}, {"name": "Walter Orellana"}, {"name": "Roberto H. Miwa"}], "featured_authors": [{"name": "Henri G. Mendonça"}, {"name": "Pedro H. Souza"}, {"name": "Walter Orellana"}, {"name": "Roberto H. Miwa"}], "author_count": 4}, {"id": "2608.07823", "category": "cond-mat", "title": "Sn-Doping in LPCVD-Grown (010) $β$-Ga$_2$O$_3$ Films", "abstract": "In this work, Sn-doped (010) $\\beta$-Ga$_2$O$_3$ homoepitaxial films were grown by low-pressure chemical vapor deposition (LPCVD), and the influence of Sn incorporation on their structural, morphological, and electrical properties was systematically investigated. Controlled room-temperature carrier concentrations ranging from $1.17 \\times 10^{17}$ to $3.06 \\times 10^{18}$ cm$^{-3}$ were achieved, with corresponding Hall mobilities decreasing from 113 to 63 cm$^2$ V$^{-1}$ s$^{-1}$. The films exhibited the monoclinic $\\beta$-Ga$_2$O$_3$ phase, near-stoichiometric composition, and well-defined step-flow morphology, with a minimum rocking-curve FWHM of 68.4 arcsec and an RMS roughness of 2.63 nm. Film thicknesses ranging from 1.66 to 11.3 $\\mu$m were obtained at growth rates of 6.4 to 16.6 $\\mu$m h$^{-1}$, demonstrating the ability of LPCVD to produce thick epitaxial layers. The sample with a room-temperature carrier concentration of $1.17 \\times 10^{17}$ cm$^{-3}$ exhibited room-temperature and low-temperature Hall mobilities of 113 cm$^2$ V$^{-1}$ s$^{-1}$ and 380 cm$^2$ V$^{-1}$ s$^{-1}$ at 84 K, respectively. Both represent the highest reported values for LPCVD-grown Sn-doped $\\beta$-Ga$_2$O$_3$. Transport modeling of the same sample yielded a shallow donor activation energy of 32.7 meV, a deeper donor level at 95 meV, and a low compensating acceptor concentration of $2.0 \\times 10^{16}$ cm$^{-3}$, indicating efficient donor activation and a low degree of compensation. These results demonstrate that LPCVD enables controlled Sn doping while maintaining excellent structural and electrical quality, providing a viable route for realizing thick $\\beta$-Ga$_2$O$_3$ epitaxial drift layers.", "url": "https://arxiv.org/abs/2608.07823", "type": "理论", "summary": "1. 该工作采用低压化学气相沉积在(010)β-Ga2O3衬底上生长Sn掺杂同质外延膜，系统研究了Sn掺入对结构、形貌及电学性质的影响。\n2. 其亮点是实现1.17×10^17至3.06×10^18 cm^-3的室温载流子浓度调控，并获得室温113与84 K下380 cm^2 V^-1 s^-1的最高霍尔迁移率，且浅施主激活能仅32.7 meV、补偿浓度低至2.0×10^16 cm^-3。\n3. 这为利用LPCVD制备厚层β-Ga2O3外延漂移层、推进高功率电子器件材料方案提供了明确可行路线。", "summary_source": "deepseek", "authors": [{"name": "Saleh Ahmed Khan"}, {"name": "Ahmed Ibreljic"}, {"name": "Sourav Sarker"}, {"name": "Anhar Bhuiyan"}], "featured_authors": [{"name": "Saleh Ahmed Khan"}, {"name": "Ahmed Ibreljic"}, {"name": "Sourav Sarker"}, {"name": "Anhar Bhuiyan"}], "author_count": 4}, {"id": "2608.07856", "category": "cond-mat", "title": "Spin selective non-van der Waal electride nature in manganese under ambient pressure", "abstract": "Electrides are an unusual class of ionic materials in which electrons localized in non-nuclear, interstitial regions act as anions within the crystal lattice. Here, we employ first-principles quantum mechanical calculations to investigate the structural, electronic, magnetic, and electride characteristics of elemental manganese (Mn) at an ambient pressure (0 GPa), focusing on its three crystalline phases: cubic ($\\alpha$)-Mn ($I\\bar{4}3m,no.217$), cubic ($\\beta$)-Mn ($P4_132, no.213$), and hexagonal ($hex$)-Mn ($P6_3/mmc, no.194$). Our calculations reveal pronounced interstitial-electron character in all three phases, accompanied by spin-selective electron localization function (ELF), establishing elemental Mn as a non-van der Waals electride system. Bader charge analysis indicates substantial electron redistribution from the Mn host framework toward the interstitial anionic-electron (IAE) regions, with an effective charge transfer of approximately $-1.645e$, $-1.477e$, and $-1.083e$ per interstitial basin in $\\alpha$-Mn, $\\beta$-Mn, and $hex$-Mn, respectively. The electride character is further supported by the electronic density of states, where the IAE-associated states exhibit finite contributions near the Fermi level ($E_F$) and coexist with Mn-derived states, demonstrating their direct participation in the low-energy electronic structure. The combined electron localization function (ELF), effective charge transfer, and electron population due to IAE at $E_F$ therefore provide consistent evidence for interstitial anionic electrons in elemental Mn. To the best of our knowledge, this work provides the first systematic identification of spin-selective electride character in elemental Mn at ambient pressure, highlighting the possibility of exploiting its interstitial-electron states for unconventional electronic and magnetic functionalities.", "url": "https://arxiv.org/abs/2608.07856", "type": "数值", "summary": "1. 该工作利用第一性原理计算，在常压下系统研究了元素锰三种晶相（α、β、六方）的电子结构，发现其间隙区域存在显著的局域电子，构成非范德瓦尔斯型电子化合物。\n2. 其核心在于揭示了自旋分辨的电子局域函数与Bader电荷转移（每间隙盆地约-1.08e至-1.65e），且间隙阴离子电子态在费米能级附近与Mn态共存并参与低能电子结构。\n3. 这一结果首次确立元素锰在常压下具有自旋选择性的电子化合物特性，为利用其间隙电子态发展非常规电子与磁性功能提供了可能。", "summary_source": "deepseek", "authors": [{"name": "Shishir Timilsena"}, {"name": "Dinesh Thapa"}, {"name": "David James Faller"}, {"name": "Prabesh Adhikari"}, {"name": "Nicholas Dimakis"}, {"name": "Svetlana Kilina"}], "featured_authors": [{"name": "Shishir Timilsena"}, {"name": "Dinesh Thapa"}, {"name": "David James Faller"}, {"name": "Prabesh Adhikari"}, {"name": "Nicholas Dimakis"}, {"name": "Svetlana Kilina"}], "author_count": 6}, {"id": "2608.07884", "category": "cond-mat", "title": "Metastability limit of pristine 2D noble metals with high-energy facet: dominance of the Bell-Evans-Polanyi principle", "abstract": "Using density functional theory, we predict that ultrathin (110) sheets of Rh, Pd, Ag, and Ir tend to transform into their (100) counterparts via lattice contraction. An approximately linear relationship between the transformation barrier and the energy difference between (110) and (100) sheets is revealed, demonstrating that the Bell-Evans-Polanyi (BEP) principle dominates. Furthermore, the critical thicknesses for these metals are also described by the BEP principle: below these thicknesses, the (110) sheets are no longer metastable and undergo spontaneous structural transformation.", "url": "https://arxiv.org/abs/2608.07884", "type": "理论+数值", "summary": "1. 该工作利用密度泛函理论预言Rh、Pd、Ag和Ir的超薄(110)二维贵金属片会通过晶格收缩转变为(100)结构。\n2. 其核心在于揭示转变势垒与(110)/(100)能量差之间近似线性关系，证明Bell-Evans-Polanyi原理主导该亚稳极限，并据此给出临界厚度判据。\n3. 这为二维高能面金属的亚稳性边界预测提供了可推广的BEP标度框架，启发实验上按临界厚度设计或避免自发结构相变。", "summary_source": "deepseek", "authors": [{"name": "Xiaoliang Zhong"}], "featured_authors": [{"name": "Xiaoliang Zhong"}], "author_count": 1}, {"id": "2608.07975", "category": "cond-mat", "title": "Turning angle analysis reveals hidden anisotropies in the anomalous diffusion of molecules in live cells", "abstract": "Molecular motion within living cells provides a window into the physical principles underlying intracellular organization and transport. Yet a fundamental limitation remains: measured trajectories are often short, noisy, and randomly oriented, rendering spatial anisotropies inaccessible to conventional analyses. We show that turning-angle statistics provide a robust approach for uncovering anisotropies in anomalous diffusion. Using a two-dimensional anisotropic fractional Brownian motion model with random orientations, we show theoretically and through simulations that turning-angle distributions preserve signatures of anisotropy. We apply this approach to single-particle tracking data, including quantum dots in the cytoplasm of HeLa cells and membrane proteins in hippocampal neurons. Turning angles reveal hidden anisotropies in the motion of quantum dots and Nav 1.6 channels, and in specific dynamical states of glycoprotein CD4. These results establish turning-angle analysis as a powerful strategy for detecting organization in complex environments and reveal that anisotropic anomalous diffusion is an overlooked feature of intracellular dynamics.", "url": "https://arxiv.org/abs/2608.07975", "type": "理论+数值", "summary": "1. 该工作提出基于转向角统计的分析方法，从短而随机取向的轨迹中揭示活细胞内反常扩散的隐藏各向异性。\n2. 理论推导与模拟表明，二维各向异性分数布朗运动的转向角分布可保留各向异性标志，并成功应用于细胞质量子点、神经元膜蛋白及CD4糖蛋白的单粒子追踪数据。\n3. 这为复杂环境中分子输运组织性的探测提供了稳健策略，并提示各向异性反常扩散是细胞内动力学中此前被忽视的普遍特征。", "summary_source": "deepseek", "authors": [{"name": "Michał Balcerek"}, {"name": "Adrian Pacheco-Pozo"}, {"name": "Agnieszka Wyłomańska"}, {"name": "Diego Krapf"}], "featured_authors": [{"name": "Michał Balcerek"}, {"name": "Adrian Pacheco-Pozo"}, {"name": "Agnieszka Wyłomańska"}, {"name": "Diego Krapf"}], "author_count": 4}, {"id": "2608.07997", "category": "cond-mat", "title": "Predicting large-supercell defect formation energies from machine-learning charge density models trained on small supercells", "abstract": "First-principles defect calculations are often limited by the cost of the large supercells required to suppress image interactions. Machine-learning interatomic potentials (MLIPs) provide another alternative, but training defect MLIPs typically requires thousands of structures and weeks of data generation. Since charge density is the key to density-functional-theory (DFT), we propose a machine-learning charge density (MLCD) route for predicting defect formation energies with higher data efficiency. We optimize the training set by integrating small supercells of varying sizes for better extrapolation, allocating their proportions based on spatial charge-density analysis. With only 96 supercells containing 16--96 atoms as the dataset, MLCD accurately predicts the formation energies of four intrinsic defects in 360-atom supercells, with defect-wise mean absolute error below 0.05 eV. In contrast, MLIPs trained on the same dataset can err by more than 1 eV. These results show that charge-density learning enables more robust cross-size transfer than direct energy-force fitting and that mixed-size data design can substantially reduce the cost of defect prediction.", "url": "https://arxiv.org/abs/2608.07997", "type": "理论+数值", "summary": "1. 该工作提出一种基于机器学习电荷密度的途径，仅用含16至96个原子的小超胞数据预测大超胞缺陷形成能。\n2. 其核心在于以电荷密度而非能量-力拟合为学习目标，并依据空间电荷密度分析混合配比不同尺寸小超胞，用96个结构将360原子超胞四种本征缺陷误差控制在0.05 eV以内。\n3. 这为克服第一性原理缺陷计算中图像相互作用与超胞成本瓶颈提供了数据高效方案，并启示电荷密度学习可推广至其他跨尺寸性质预测。", "summary_source": "deepseek", "authors": [{"name": "Junjie Zhou"}, {"name": "Menglin Huang"}, {"name": "Shiyou Chen"}], "featured_authors": [{"name": "Junjie Zhou"}, {"name": "Menglin Huang"}, {"name": "Shiyou Chen"}], "author_count": 3}, {"id": "2608.08000", "category": "cond-mat", "title": "Local coordination and migration-network topology shape Li-ion transport and delithiation in the low-energy $\\varepsilon$-LiMnO$_2$ polymorph", "abstract": "In rocksalt-derived oxide cathodes, the local Li-migration environment around an O4 tetrahedral intermediate is commonly classified by the number of face-sharing transition-metal (TM) neighbors. In LiMnO2, the TM species is Mn, and 0-TM denotes the absence of face-sharing Mn neighbors. However, migration and delithiation may also depend on higher-shell coordination and tetrahedral connectivity. Using the recently reported low-energy epsilon-LiMnO2 polymorph as a model, we examine these factors through bond-valence site-energy and bond-valence pathway analyses combined with first-principles calculations. The resulting migration maps and tetrahedral statistics reveal distinct topologies and dimensionalities across four LiMnO2 polymorphs. Although the epsilon phase and the lithiated-spinel phase Li2Mn2O4 (hereafter spinel) have identical tetrahedral-type fractions, their 0-TM motifs form quasi-one-dimensional chains and a three-dimensional network, respectively. Climbing-image nudged elastic band calculations further distinguish the two structures: epsilon-phase barriers are 0.35-0.36 eV, compared with 0.41-0.53 eV in spinel, a difference that may be associated with distinct next-nearest corner-sharing shells. Ab initio molecular dynamics yields an apparent activation energy of 0.32 eV, while direction-resolved mean-squared displacements show preferential Li migration along c, supporting low-barrier quasi-one-dimensional diffusion. Delithiation calculations show that differences in 0-TM connectivity and Li-Li separation between the epsilon phase and spinel are associated with Li-site evolution and calculated voltage steps, suggesting that motif connectivity may influence voltage response. These results link the local environments and spatial connectivity of 0-TM motifs to Li migration and delithiation, providing insights into the design of metastable cathode structures.", "url": "https://arxiv.org/abs/2608.08000", "type": "理论+数值", "summary": "1. 该工作以低能ε-LiMnO2多晶型为模型，结合键价位能/路径分析与第一性原理计算，研究局域配位和迁移网络拓扑对锂离子输运及脱锂行为的影响。\n2. 其核心发现是ε相与尖晶石Li2Mn2O4虽具相同四面体类型比例，但0-TM基序分别形成准一维链与三维网络，使ε相迁移势垒更低（0.35–0.36 eV对0.41–0.53 eV），且锂沿c轴择优扩散。\n3. 这表明0-TM基序的空间连通性可同时调控迁移动力学与电压响应，为亚稳态正极材料的拓扑设计提供明确指导。", "summary_source": "deepseek", "authors": [{"name": "Fukuan Wang"}, {"name": "Busheng Wang"}, {"name": "Yong Liu"}], "featured_authors": [{"name": "Fukuan Wang"}, {"name": "Busheng Wang"}, {"name": "Yong Liu"}], "author_count": 3}, {"id": "2608.08042", "category": "cond-mat", "title": "Quantum geometric localization length and localization criticality in an ideally flat Chern band", "abstract": "We propose that the localization length in an isolated, ideally flat Chern band is set by quantum geometry. We explore the corresponding localization transition and its critical scaling by applying transfer matrix calculations in the maximally localized hybrid Wannier basis, whose spatial spread is exactly characterized by a quantum geometric length. Remarkably, upon tuning the quantum metric of the Chern band, we observe a crossover from a universal regime controlled by the Dirac fixed point to a non-universal regime with continuously varying critical exponents. Within the universal regime, the localization length exhibits a pronounced linear dependence on the quantum geometric length, supporting its quantum geometric nature. These findings provide a novel quantum geometric perspective on the localization in quantum Hall systems such as twisted moiré superlattices, and shed new light on the long-standing controversy over the criticality of the integer quantum Hall transition.", "url": "https://arxiv.org/abs/2608.08042", "type": "理论+数值", "summary": "1. 该工作提出在孤立且理想平坦的Chern能带中，局域化长度由量子几何决定，并通过最局域混合Wannier基中的转移矩阵计算研究了局域化转变与临界标度。\n2. 其物理要点在于调节能带量子度规可观察到由Dirac不动点控制的普适区向临界指数连续变化的非普适区交叉，且普适区中局域化长度与量子几何长度呈显著线性关系。\n3. 这为扭曲莫尔超晶格等量子霍尔系统中的局域化现象提供了量子几何视角，并为整数量子霍尔转变临界性的长期争议带来新启示。", "summary_source": "deepseek", "authors": [{"name": "Xu-Cheng Wang"}, {"name": "Yang Qi"}], "featured_authors": [{"name": "Xu-Cheng Wang"}, {"name": "Yang Qi"}], "author_count": 2}, {"id": "2608.08074", "category": "cond-mat", "title": "Low-frequency output fluctuations in an open exclusion process with particle pausing", "abstract": "Slow internal states reshape both the mean throughput and the temporal organization of a driven lattice gas. Exit-counting statistics reveal this effect in a finite open totally asymmetric simple exclusion process whose particles reversibly switch between active and paused states. Increasing pausing lowers the mean current smoothly, whereas the long-window Fano factor is strongly nonmonotonic. At the reference boundary rates, the maximum remains near a measured mean paused population \\(N_p=L\\rho_{\\rm paused}\\simeq1.5\\)--\\(2\\) across lattice lengths L=50-500, while the corresponding pausing rate scales as \\(k_p^{\\rm max}\\propto L^{-1}\\). A minimal constant-birth, linear-death approximation translates an order-one collective crossover into this finite-size displacement and gives \\(N_p^\\star\\simeq1.50\\) in the independent-pause, strong-blocking limit. The simulations delimit this approximation: the pause number is overdispersed, and at fixed \\(N_p\\), slower unpausing increases both the correlation time and the noise amplitude. Residence-time and structural analyses further separate the relevant slow variables. The pause-free versus pause-containing residence-time scale tracks the fitted output-correlation time, whereas the noise amplitude follows fluctuations, rather than the mean size, of the largest particle cluster. Low-frequency output noise therefore identifies an intermittent finite-size regime shaped jointly by slow-defect kinetics and traffic-jam reorganization.", "url": "https://arxiv.org/abs/2608.08074", "type": "理论+数值", "summary": "1. 该工作通过出口计数统计研究含可逆暂停态粒子的有限开放TASEP中的低频输出涨落。\n2. 其物理要点在于暂停增强使平均流平滑下降而Fano因子强非单调，峰值对应暂停粒子数约1.5—2且暂停率按L^-1标度，独立暂停极限下近似给出N_p^*≈1.50。\n3. 这为利用低频噪声区分慢缺陷动力学与交通拥堵重组的有限尺寸间歇态提供了可检验的统计判据，并启发后续驱动晶格气体研究。", "summary_source": "deepseek", "authors": [{"name": "Quentin Thommen"}], "featured_authors": [{"name": "Quentin Thommen"}], "author_count": 1}, {"id": "2608.08105", "category": "cond-mat", "title": "Composite-State Localization Beyond the External Landscape in Non-Hermitian Quasicrystals", "abstract": "A composite excitation need not inherit the localization behavior of its constituents. We show that an interacting non-Hermitian quasiperiodic ladder realizes a controllable and reversible localization inversion between composite and unbound excitations, where internal configuration, rather than only the external potential, becomes a control parameter for localization. Opposite complex potentials on the two legs cancel at first order for a same-rung pair but act directly on separated particles, allowing extended composite states to persist while the unpaired sector becomes localized. A strong-coupling theory identifies the composite state as an emergent weakly modulated non-Hermitian quasicrystal generated by virtual unpaired configurations. Breaking the potential antisymmetry restores a direct modulation of the composite band and reverses the localization hierarchy. Engineering configuration-space pathways further stabilizes an extended composite band embedded within a localized continuum, the inverse of the conventional bound-state-in-the-continuum scenario. Our results establish internal configuration as a reversible control parameter for localization.", "url": "https://arxiv.org/abs/2608.08105", "type": "理论", "summary": "1. 该工作研究非厄米准周期梯子中相互作用复合激发，展示复合态与未束缚激发的局域化可逆反转。\n2. 其核心在于两腿反对称复势对同格点对一阶抵消而对分离粒子直接作用，使复合态扩展而单粒子局域化，并借助强耦合理论将复合态刻画为由虚未束缚组态产生的弱调制非厄米准晶。\n3. 通过破坏势反对称或设计组态空间路径可逆转局域化层级，并在局域连续谱中嵌入扩展复合带，从而确立内部组态作为局域化的可逆控制参量。", "summary_source": "deepseek", "authors": [{"name": "Tian Zhou"}, {"name": "Xue-Bin Wang"}, {"name": "Zhongmin Yang"}, {"name": "Tao Liu"}], "featured_authors": [{"name": "Tian Zhou"}, {"name": "Xue-Bin Wang"}, {"name": "Zhongmin Yang"}, {"name": "Tao Liu"}], "author_count": 4}, {"id": "2608.08137", "category": "cond-mat", "title": "Cubic-Equivariant Neural Density Functional Theory for Three-Dimensional Lattice Fluids", "abstract": "We construct a neural classical density functional that acts directly on unrestricted three-dimensional density profiles. As a computationally tractable test bed, we consider parallel hard cubes of side length three on a simple cubic lattice. A fully convolutional network learns the one-body direct-correlation functional $c^{(1)}[\\rho]$ from data obtained with grand-canonical Monte Carlo simulations in randomized external potentials. Complete profiles are used during both training and inference; a stochastic Bernoulli mask on the output sites makes full-profile training effective without explicitly extracting and storing overlapping local density windows. Averaging the first-layer kernels over all 48 rotations and reflections of the cubic point group additionally imposes exact cubic equivariance without data augmentation. We compare the learned functional with independent simulation data and with the lattice fundamental-measure functional of Lafuente and Cuesta. The neural functional markedly improves the homogeneous equation of state and the density profile at a planar hard wall. For the anisotropic pair distribution around a fixed particle, both functionals reproduce the principal packing shells, with their relative accuracy depending on crystallographic direction. These results demonstrate neural density-functional calculations on complete three-dimensional profiles while also identifying accurate full-dimensional training data, thermodynamic consistency, and structural correlations as the central challenges for extensions to continuum fluids.", "url": "https://arxiv.org/abs/2608.08137", "type": "理论+数值", "summary": "1. 该工作构建了直接作用于不受限三维密度分布的神经经典密度泛函，并以简单立方格点上边长三的平行硬立方体流体作为可计算检验体系。\n2. 其核心在于用全卷积网络从随机外势中的巨正则蒙特卡洛数据学习单体直接相关泛函，通过伯努利掩码实现全轮廓训练，并对首层卷积核做立方点群48个对称操作平均以实现严格立方等变性。\n3. 与独立模拟及Lafuente-Cuesta格点基本度量泛函对比，该神经泛函显著改进了均匀状态方程和平面硬墙密度轮廓，同时凸显完整三维训练数据、热力学一致性与结构关联对推广到连续流体的关键意义。", "summary_source": "deepseek", "authors": [{"name": "Jens Weimar"}, {"name": "Martin Oettel"}, {"name": "Alessandro Simon"}], "featured_authors": [{"name": "Jens Weimar"}, {"name": "Martin Oettel"}, {"name": "Alessandro Simon"}], "author_count": 3}, {"id": "2608.08152", "category": "cond-mat", "title": "Denoising Diffusion Monte Carlo Electron Densities with Physically Informed Variance Stabilization: From Fourier Filters to 3D UNETs", "abstract": "Obtaining accurate electron densities is important for the fundamental description of molecular and condensed matter systems, as well as for the development of next-generation density functionals. Diffusion Monte Carlo (DMC), in particular, is known to produce benchmark-quality data; however, the predicted real-space electron densities contain substantial amounts of statistical noise. In this work, we study denoising approaches for DMC densities, judged on the basis of the information-theoretic Jensen-Shannon divergence. The denoising is facilitated by an approximate heteroscedastic to homoscedastic transformation leveraging the density functional theory density as a physical prior. We systematically compare a range of denoising techniques-including Fourier transform, regression, and 3D UNETs-on materials showing a wide range of density variations: carbon diamond, blue phosphorus, and rutile VO2. Our results indicate that simple flattened machine learning models and 2D image-based models introduce line artifacts and struggle to capture the full spatial correlation. In contrast, when using variance stabilization, regression methods outperform all others in both the high and low- noise limits across all materials considered. The best denoisers reduce the required cost of density-generating DMC simulations by 10-100x, providing a promising route forward for application in noise-sensitive tasks such as DFT functional inversion.", "url": "https://arxiv.org/abs/2608.08152", "type": "理论+数值", "summary": "1. 该工作系统比较了傅里叶滤波、回归与三维UNET等去噪方法，用于消除扩散蒙特卡罗电子密度中的统计噪声，并以Jensen-Shannon散度作为评判指标。\n2. 核心卖点是以DFT密度为物理先验进行异方差到同方差的方差稳定化变换，使回归方法在高低噪声极限与多种材料中均优于其他方案，避免线条伪影并完整捕捉空间关联。\n3. 最佳去噪器可将密度生成型DMC模拟成本降低10至100倍，为DFT泛函反演等噪声敏感任务提供了可行途径。", "summary_source": "deepseek", "authors": [{"name": "Kenneth O. Berard"}, {"name": "Brenda Rubenstein"}, {"name": "Jaron T. Krogel"}], "featured_authors": [{"name": "Kenneth O. Berard"}, {"name": "Brenda Rubenstein"}, {"name": "Jaron T. Krogel"}], "author_count": 3}, {"id": "2608.08205", "category": "cond-mat", "title": "Out-of-equilibrium inhomogeneous XX chains: Exact results and the hydrodynamic limit", "abstract": "We study the out-of-equilibrium dynamics in the XX chain with step-like magnetic field, which maps to an inhomogeneous tight-binding chain after Jordan-Wigner transformation. We obtain exact analytic expressions for the fermionic two-point correlation function after a quantum quench from several initial product states, both homogeneous and inhomogeneous ones. This is achieved by using a combination of Fourier and Laplace transforms, which al low us to map the problem to a standard Riemann-Hilbert problem on the unit circle. For arbitrary positions and times the correlators are not expressed in terms of elementary functions. However, in the hydrodynamic limit $x,y,t\\to\\infty$ with fixed ratios, we provide explicit formulas that depend only on the effective transmission coefficient across the origin. We benchmark our analytic predictions against exact numerical simulations and find excellent agreement in the hydrodynamic limit, apart from finite-time corrections.", "url": "https://arxiv.org/abs/2608.08205", "type": "数值", "summary": "1. 该工作研究具有阶梯磁场的非均匀XX链在量子淬火后的非平衡动力学，通过Jordan-Wigner变换映射为非均匀紧束缚链，并导出费米子两点关联函数的精确解析表达式。\n2. 其技术核心是结合傅里叶与拉普拉斯变换，将关联函数计算化为单位圆上的Riemann-Hilbert问题，并在流体动力学极限下给出仅依赖原点有效透射系数的显式公式。\n3. 这一工作为非均匀可积模型远离平衡态的输运行为提供了精确理论基准，并为广义流体力学描述在该类系统中的适用性提供了明确验证与启发。", "summary_source": "deepseek", "authors": [{"name": "Vincenzo Alba"}, {"name": "Federico Rottoli"}], "featured_authors": [{"name": "Vincenzo Alba"}, {"name": "Federico Rottoli"}], "author_count": 2}, {"id": "2608.08324", "category": "cond-mat", "title": "Persistence probability based dynamics and phase diagrams in biased q-voter models", "abstract": "Persistence probability in opinion dynamics models estimates the tendency of the agents not to change their initial opinion till the present time. Here we consider two nonlinear q-voter models with binary opinions, where the dynamics are governed by a biased choice when the q panel is not unanimous. The models are studied for different parameter ranges corresponding to the known stationary states. Mean field theory and numerical simulations are used to compute the persistence probability for the two types of opinion separately. The long time behavior in general is either a saturation or a decay that can be approximated by an exponential form, depending on the chosen parameters. Based on this, phase diagrams in the parameter space are presented for both the models. The regions in the phase diagrams indicate a strong correlation with the behavior of fixed points in the corresponding models, which is non-trivial as far as the persistence probability is concerned.", "url": "https://arxiv.org/abs/2608.08324", "type": "理论+数值", "summary": "1. 该工作研究两个带偏置的非线性q-选民模型中两类观点的持续概率，结合平均场理论与数值模拟分析其长时行为并在参数空间绘制相图。\n2. 其核心在于发现两类观点的持续概率随参数呈饱和或近似指数衰减，且相图区域与对应模型不动点行为存在非平凡关联，为基于持续概率刻画动力学提供了依据。\n3. 这提示持续概率可作为有偏意见动力学中相变与不动点结构的诊断工具，并可能推广至更一般的非线性随机过程及社会物理学模型。", "summary_source": "deepseek", "authors": [{"name": "Amit Pradhan"}, {"name": "Pratik Mullick"}, {"name": "Parongama Sen"}], "featured_authors": [{"name": "Amit Pradhan"}, {"name": "Pratik Mullick"}, {"name": "Parongama Sen"}], "author_count": 3}, {"id": "2608.08353", "category": "cond-mat", "title": "Magnetoelastic coupling in stripe-domain states of yttrium iron garnet", "abstract": "We study magnetoelastic coupling in stripe-domain magnetic states of $3\\,\\mathrm{\\mu m}$-thick YIG thin films grown on a GGG substrate. Broadband ferromagnetic resonance reveals low-frequency stripe-domain magnon branches modulated by a field-independent phonon comb with a frequency spacing of $3.5\\,\\mathrm{MHz}$, matching the value predicted for confined thickness-shear modes of the GGG substrate. Analytical fitting yields coupling rates that vary between $0.33$--$0.54\\,\\mathrm{MHz}$ and cooperativities of order $10^{-1}$, indicating that the system is in the weak-coupling regime without resolvable avoided-crossing gaps. Magnon-phonon mode-overlap calculations using finite-element simulations show that the weak coupling arises from phase and domain-sign cancellation: the local magnetoelastic coupling is sizable, but more than $99\\%$ of the coherent overlap cancels across the stripe texture. Fully coupled simulations further demonstrate phonon-mediated excitation of a remote YIG layer and show that efficient propagating-phonon generation requires spatially asymmetric magnon modes, establishing magnetic texture as a control parameter for magnon--phonon coupling.", "url": "https://arxiv.org/abs/2608.08353", "type": "数值", "summary": "1. 该工作结合宽带铁磁共振与有限元模拟，研究了3微米厚YIG/GGG薄膜条状磁畴态中的磁弹性耦合。\n2. 其核心发现是，尽管局域磁弹性耦合可观，条状畴的相位与畴符号抵消使超过99%的相干重叠消失，耦合率仅0.33–0.54 MHz、协同度约0.1，弱耦合区无避让交叉，并伴随间隔3.5 MHz、对应GGG受限厚度剪切模的无磁场依赖声子梳。\n3. 模拟还显示磁织构可作为控制磁振子-声子耦合与传播声子产生的参量，可用于远程激发另一YIG层，为声子介导混合量子系统提供新思路。", "summary_source": "deepseek", "authors": [{"name": "Nimisha Arora"}, {"name": "Daniel Prestwood"}, {"name": "Takashi Kikkawa"}, {"name": "Eiji Saitoh"}, {"name": "Jack Gartside"}, {"name": "Will Branford"}, {"name": "Hidekazu Kurebayashi"}], "featured_authors": [{"name": "Nimisha Arora"}, {"name": "Daniel Prestwood"}, {"name": "Takashi Kikkawa"}, {"name": "Jack Gartside"}, {"name": "Will Branford"}, {"name": "Hidekazu Kurebayashi"}], "author_count": 7}, {"id": "2608.08415", "category": "cond-mat", "title": "Thermo-mechanical Characterization of 2D hexagonal Boron Phosphide (h-BP)", "abstract": "This study explores the thermo-mechanical properties of a two-dimensional (2D) monolayer hexagonal boron phosphide (h-BP). h-BP is predicted to possess a moderate band gap, high thermal stability, and excellent carrier mobility, making it suitable for advanced electronic, sensing, and energy applications. A classical molecular dynamics (MD) potential for h-BP was developed using density functional theory (DFT) calculations. The derived parameters were implemented in MD simulations to evaluate mechanical behavior under tensile loading along both zigzag and armchair directions at varying temperatures (300 K to 900 K). The results reveal significant anisotropy in mechanical performance, with higher tensile strength and elastic modulus in the zigzag direction across all temperatures. Increasing temperature reduces both tensile strength and stiffness due to thermal softening and increased atomic vibrations. The influence of structural defects was also investigated, revealing that Stone-Wales and vacancy defects reduce the tensile strength and failure strain of h-BP, with the two-atom vacancy producing the most pronounced mechanical degradation due to localized stress concentration and premature crack initiation. These findings provide a foundation for future research on the mechanical stability of h-BP in extreme environments.", "url": "https://arxiv.org/abs/2608.08415", "type": "理论+数值", "summary": "1. 该工作基于DFT拟合开发了单层六方磷化硼(h-BP)的经典分子动力学势，并系统表征其在拉伸加载下的热-力学行为。\n2. 其卖点在于揭示沿zigzag/armchair方向的显著力学各向异性、300–900 K下的温度软化效应，以及Stone-Wales与空位缺陷特别是双空位引起的强度退化与应力集中机制。\n3. 这为h-BP在电子、传感及能源器件中极端环境下的力学稳定性评估与缺陷工程提供了基础。", "summary_source": "deepseek", "authors": [{"name": "Zahabul Islam"}], "featured_authors": [{"name": "Zahabul Islam"}], "author_count": 1}, {"id": "2608.08457", "category": "cond-mat", "title": "Solving the Gibbs Paradox by Local Free Space and Collision Potential", "abstract": "This paper argues that the Gibbs paradox can be resolved without using the concept of identical particles in quantum mechanics. The molecules in different regions of the gas can be distinguished, so there is no need to introduce the N! factor. For each molecule, the volume of its free movement space is local at every instant. Moreover, collisions are the primary way of interaction between gas molecules and the fundamental driving force for reaching equilibrium. The potential energy during collisions cannot be ignored. Based on the local free space assumption and collision potential energy, this paper uses the canonical ensemble method to rederive the entropy increase formula for gas mixtures. It includes parameters such as molecular mass, effective radius, and collision characteristic time, which vary with the type of gas molecules. This solves the problem that the entropy increase of gas mixtures is independent of gas properties, that is, it truly resolves the Gibbs paradox instead of providing a new conceptual explanation.", "url": "https://arxiv.org/abs/2608.08457", "type": "数值", "summary": "1. 该工作在不借助量子力学全同粒子假设与N!因子的前提下，用局域自由空间与碰撞势能重新推导了气体混合熵增公式。\n2. 其核心在于把每个分子瞬时自由运动体积视为局域量，并计入碰撞势能，使熵增显式依赖分子质量、有效半径及碰撞特征时间等气体特性参数。\n3. 这为吉布斯佯谬提供了定量可检验的经典统计力学解决路径，而非仅概念性解释，也有助于修正混合熵教学中对气体性质无关性的表述。", "summary_source": "deepseek", "authors": [{"name": "Chuang Li"}], "featured_authors": [{"name": "Chuang Li"}], "author_count": 1}, {"id": "2608.08474", "category": "cond-mat", "title": "Unified open-boundary electrostatics in real-space density functional theory", "abstract": "We present an electrostatic formulation in real-space density functional theory that provides a systematic and unified treatment of the open-boundary electrostatics of isolated and partially periodic systems, including in the presence of an applied uniform electric field along the open (finite) directions. Specifically, we formulate a local electrostatic energy functional whose stationarity yields the Poisson equation for the electrostatic potential, subject to periodic and Dirichlet boundary conditions along the periodic and open directions, respectively. Using a Green's function approach, we derive analytical expressions for the Dirichlet values arising from the total charge density of the system. We also derive the expressions for the energy, atomic forces, and stress tensor. We implement the resulting expressions within the large-scale parallel real-space SPARC electronic structure code. Using representative examples, we verify the accuracy and efficiency of the framework, demonstrating exponential convergence of the computed quantities with vacuum size and excellent agreement with established plane-wave codes while requiring significantly less vacuum at comparable accuracy. Since no existing implementation provides the stresses for such systems, we instead verify them against numerical derivatives of the energy, finding close agreement. Finally, we apply the framework to compute static polarizabilities and piezoelectric coefficients, obtaining very good agreement with values reported in the literature.", "url": "https://arxiv.org/abs/2608.08474", "type": "理论+数值", "summary": "1. 该工作在实空间密度泛函理论中提出统一处理孤立与部分周期体系开放边界静电学的方案，并支持沿开放方向施加均匀电场。\n2. 其技术核心是通过局域静电能量泛函和格林函数解析推导Dirichlet边值，在SPARC中实现能量、原子力与应力张量，并证明所需真空远小于平面波方法且保持指数收敛。\n3. 该框架已用于计算静态极化率和压电系数，为低维材料在外电场下的响应模拟提供了高效且可扩展的实空间途径。", "summary_source": "deepseek", "authors": [{"name": "Rajat Kumar"}, {"name": "David Codony"}, {"name": "Phanish Suryanarayana"}, {"name": "Abhiraj Sharma"}], "featured_authors": [{"name": "Rajat Kumar"}, {"name": "David Codony"}, {"name": "Phanish Suryanarayana"}, {"name": "Abhiraj Sharma"}], "author_count": 4}, {"id": "2608.08480", "category": "cond-mat", "title": "Nonisospectral Integrability and Exact Current Fluctuations in the Two-Dimensional SSEP", "abstract": "We study annealed current fluctuations in the two-dimensional symmetric simple exclusion process across a circular passive counting boundary. The initial density is $\\rho_1$ inside a disk of radius $R$ and $\\rho_2$ outside, and the observable is the net decrease of the particle number in the disk over a finite time. Using convexity of the macroscopic fluctuation theory action and rotational averaging, we show that the minimizer of the full two-dimensional variational problem may be chosen radially symmetric. For the resulting radial problem, a suitable change of variables leads to a nonisospectral formulation on the half-line. Combining the associated scattering construction with a scalar factorization, we obtain a closed expression for the scaled cumulant generating function and hence the annealed large-deviation statistics of the current.", "url": "https://arxiv.org/abs/2608.08480", "type": "理论+数值", "summary": "1. 该工作研究二维对称简单排斥过程中跨圆形被动计数边界的退火电流涨落，针对盘内外初始密度分别取ρ1与ρ2的情形，推导有限时间内盘内粒子净减少量的精确大偏差统计。\n2. 核心卖点在于利用宏观涨落理论作用量的凸性与转动平均将二维变分问题约化为径向对称问题，再通过变量替换把径向方程化为半直线上的非等谱可积系统，借助散射构造与标量分解得到标度累积量生成函数的闭式表达式。\n3. 该结果为二维输运过程中涨落关联与可积结构的联系提供了新范例，亦为其他带旋转对称性的非平衡边界计数问题的大偏差分析提供了可资借鉴的路径。", "summary_source": "deepseek", "authors": [{"name": "Tingfei Li"}], "featured_authors": [{"name": "Tingfei Li"}], "author_count": 1}, {"id": "2608.08498", "category": "cond-mat", "title": "Excitron-Induced Pair Fluctuations Reveal Superconductivity in the Electron Gas", "abstract": "Understanding how superconductivity can emerge in dilute electronic systems remains a central challenge in condensed matter physics. By performing first-principles calculations of the electron self-energy \\Sigma(k,iw_n) in the low-density three-dimensional electron gas, we identify a sharp divergence at r_s ~ 8 and T ~ 10^{-4}E_ F, signaling a second-order phase transition. This critical behavior originates from one-dimensional superconducting fluctuations mediated by virtual excitations of an excitron---a quasi-1D electronic composite formed by an electron and longitudinal electron-hole pairs. Although the superconducting mechanism itself is plasmon-mediated, the excitron channel provides a unique window into its fluctuation dynamics. Near the transition, we observe a pseudogap and a linear-in-T inverse electron lifetime, reminiscent of phenomena in high-T_c materials. These results reveal an unexpected route by which plasmon-driven superconductivity manifests in the dilute 3D electron gas through quasi-1D excitron dynamics.", "url": "https://arxiv.org/abs/2608.08498", "type": "理论+数值", "summary": "1. 该工作通过第一性原理计算低密度三维电子气的电子自能，发现其在r_s约8、温度约10^-4费米能处出现尖锐发散，对应二级相变。\n2. 其核心在于揭示该临界行为源于激子（电子与纵向电子-空穴对组成的准一维复合体）虚激发中介的一维超导涨落，为等离激元介导的超导机制提供了独特探针。\n3. 这为理解稀薄电子体系中超导的出现，及其与赝能隙、线性温度依赖寿命等高Tc类现象的关联提供了新途径。", "summary_source": "deepseek", "authors": [{"name": "Yasutami Takada"}], "featured_authors": [{"name": "Yasutami Takada"}], "author_count": 1}, {"id": "2608.08568", "category": "cond-mat", "title": "Heat and mass transport in a three-dimensional mesoscale odd fluid", "abstract": "Fluids with nonvanishing antisymmetric components of the transport coefficient tensor are named odd fluids. In our previous works, we proposed a mesoscale simulation model for isotropic two-dimensional odd fluids and then extended it to the three-dimensional case to model an anisotropic odd fluid with cylindrical symmetry. The Navier-Stokes equation and the viscosity tensor of this three-dimensional mesoscale odd fluid were derived previously via a kinetic theory. Herein, we derive the heat conduction and self-diffusion equations, along with the corresponding thermal conductivity and self-diffusivity tensors. These theoretical results are validated by simulations. We further investigate heat and mass transport behaviors of three-dimensional odd fluids in a confined geometry through our mesoscale model. In striking contrast to normal isotropic fluids, the steady-state temperature and density distributions of confined odd fluids are significantly deformed by the odd transport coefficients.", "url": "https://arxiv.org/abs/2608.08568", "type": "理论+数值", "summary": "1. 该工作推导了三维介观奇流体在柱对称情形下的热传导与自扩散方程，并给出对应输运张量的解析形式。\n2. 其核心在于通过动力学理论得到热导率与自扩散系数张量，并以模拟验证，进而展示受限几何中奇输运系数会显著扭曲稳态温度与密度分布。\n3. 这为研究边界约束下奇流体的热质输运行为及相应介观模拟方法提供了明确的理论基础。", "summary_source": "deepseek", "authors": [{"name": "Yuxing Jiao"}, {"name": "Mingcheng Yang"}], "featured_authors": [{"name": "Yuxing Jiao"}, {"name": "Mingcheng Yang"}], "author_count": 2}, {"id": "2608.08572", "category": "cond-mat", "title": "Reliability-Safety Trade-off in AI Distillation: A Renormalization-Group Approach", "abstract": "Knowledge distillation transfers more than task competence: it also transmits response propensities, refusal policies, error boundaries, and latent safety biases. We formulate this behavioral inheritance as a coarse-graining model grounded in statistical mechanics, in which the student's answer and refusal decisions define two macrostates, while the teacher induces an effective field that reshapes the student's free-energy landscape. The model yields a reliability-safety trade-off relation controlled by a single parameter K, which we term the hazard discrimination capability. The predicted trade-off is consistent with refusal-token data [arXiv: 2412.06748 ]. In knowledge distillation, a teacher with strong hazard discrimination improves the student's attainable reliability and safety, whereas poor discrimination limits the attainable trade-off. Repeated distillation acts as an iterated renormalization-group-like transformation, under which K follows a flow across generations. The flow exhibits a tricritical structure separating regimes of K loss, stable transmission, and threshold-dependent inheritance, and yields testable scaling predictions for multigenerational distillation.", "url": "https://arxiv.org/abs/2608.08572", "type": "理论", "summary": "1. 该工作将知识蒸馏中的行为继承建模为统计力学粗粒化，以学生回答与拒答定义宏观态，并由教师诱导有效场重塑其自由能景观。\n2. 其核心卖点在于导出由危险判别能力 K 控制的可靠性与安全性权衡关系，并将多代蒸馏视为迭代重正化群变换，揭示 K 流的临界与三临界结构。\n3. 该框架给出可检验的多代蒸馏标度律，为理解大模型安全行为跨代传播与衰减提供了统计物理视角。", "summary_source": "deepseek", "authors": [{"name": "Y.M.Du"}, {"name": "Miao-Miao Yi"}, {"name": "Tan-Ji Zhou"}, {"name": "C.P.Sun"}], "featured_authors": [{"name": "Y.M.Du"}, {"name": "Miao-Miao Yi"}, {"name": "Tan-Ji Zhou"}, {"name": "C.P.Sun"}], "author_count": 4}, {"id": "2608.08625", "category": "cond-mat", "title": "Retained hidden excess generates memory in price-limited markets", "abstract": "The daily return of a stock is often restricted to an exchange-imposed band to curb extreme fluctuations. Any attempted price movement beyond this band is clipped, leaving an unobserved excess. We introduce a minimal stochastic latent-state model in which a fraction of this hidden excess is retained for the next day. This retention generates memory, even though the daily stochastic driving shocks are independent. For symmetric driving shocks with regularly varying tails, the stationary latent return preserves the tail index of the noise, but has an enhanced tail amplitude. In the wide-band limit, a close of the daily return at either limit of the band admits a single-dominant-shock description. We show that after such an event, the mean return on the following day has the same sign and grows proportionally to the band width, while the probability of reaching the same limit again approaches a finite value. Reaching the opposite band limit on the following day requires a second extreme shock of opposite sign and is power-law suppressed. Simulations support these analytical predictions. Empirical data from stocks subject to daily price limits are qualitatively consistent with the predicted same-sign response and its increase across wider price bands.", "url": "https://arxiv.org/abs/2608.08625", "type": "理论+数值", "summary": "1. 该工作提出一个最小隐态随机模型，用于刻画涨跌停板市场中因截断而保留的隐藏超额收益，并证明该保留机制可在日驱动冲击独立时产生价格记忆。\n2. 技术要点在于解析了规则变化尾部噪声下平稳潜在收益保留相同尾指数但放大尾幅，并指出宽涨跌停极限下触及限价后的次日平均收益与涨跌停宽度成正比且同号，而同侧再次触限概率有限、对侧触限受幂律抑制。\n3. 模拟与实证数据定性支持上述预言，这为理解价格限制市场的短期可预测性及极端波动后响应的统计规律提供了可检验的理论框架。", "summary_source": "deepseek", "authors": [{"name": "Debraj Das"}], "featured_authors": [{"name": "Debraj Das"}], "author_count": 1}, {"id": "2608.08666", "category": "cond-mat", "title": "A Systematic Comparison of q-Gaussian Fitting Methods across Complex Systems", "abstract": "Nature exhibits a wide variety of nonlinear phenomena characterized by strong fluctuations that push the system away from equilibrium. Recent studies have shown that non-extensive statistics are more suitable for analyzing these phenomena, as they can capture long-range correlations and heavy-tailed distributions that conventional Boltzmann-Gibbs statistics cannot represent. However, estimating the non-extensiveness parameter ($q$) is not trivial, and methods vary significantly across disciplines. This paper presents a systematic and interdisciplinary comparison of three fitting methods: direct nonlinear fitting of the probability distribution function (PDF), linearization using the q-logarithm function, and numerical fitting of the cumulative distribution function (CDF). We applied this analysis to various phenomena, from areas such as geophysics, space weather and economics, analyzing the critical impact of discretization. The results show that $q$ estimates are highly sensitive to histogram binning, while the CDF-based method provides a bin-free alternative that yields more stable estimates for the datasets analyzed here. This contribution provides relevant information for the search for a method that allows the correct determination of the parameters of heavy-tailed distributions in various disciplines.", "url": "https://arxiv.org/abs/2608.08666", "type": "理论+数值", "summary": "1. 该工作系统比较了直接拟合概率密度函数、q-对数线性化与数值拟合累积分布函数三种估计非广延参数q的方法，并将它们应用于地球物理、空间天气与经济学等复杂系统数据。\n2. 其核心发现是，基于直方图的密度拟合对离散化分箱高度敏感，而基于累积分布函数的无分箱方法在所述数据集上给出更稳定、更可靠的q值估计。\n3. 这为跨学科建立统一的重尾分布参数估计标准提供了依据，并启发后续研究在非平衡非线性现象中规范非广延统计的应用。", "summary_source": "deepseek", "authors": [{"name": "Facundo Máximo Abaca"}, {"name": "Darío Javier Zamora"}, {"name": "Bruno S. Zossi"}, {"name": "Ana G. Elias"}], "featured_authors": [{"name": "Facundo Máximo Abaca"}, {"name": "Darío Javier Zamora"}, {"name": "Bruno S. Zossi"}, {"name": "Ana G. Elias"}], "author_count": 4}, {"id": "2608.08735", "category": "cond-mat", "title": "Interface dynamics in tissue invasion", "abstract": "We rely on a hydrodynamic description of living tissues to describe the interface separating two of them with distinct constitutive properties. Using the difference in their homeostatic pressures as a control parameter, we show that the interface generates an emergent capillary surface tension that depends on the hydrodynamic scale, and that makes it very stable to large wavelengths perturbations. Using the difference of active forces the two tissues experience as a control parameter, we not only find that the front propagation mechanism shifts from the pushed wave to the Burgers wave, but we also find that the emergent surface tension is not sufficient to stabilize the interface at large enough drive and low enough viscosity.", "url": "https://arxiv.org/abs/2608.08735", "type": "理论", "summary": "1. 该工作采用活组织流体动力学描述两种本构性质不同组织的界面，并以稳态压强差与主动力差为控制参数。\n2. 其核心发现是界面涌现出依赖流体动力学尺度的毛细表面张力，使长波扰动稳定，并随驱动增强出现从推进行波向伯格斯波的转变。\n3. 这为组织侵袭前沿稳定性判据提供启发，并预示低黏度高驱动条件下可观测界面失稳。", "summary_source": "deepseek", "authors": [{"name": "Nino Despeignes"}, {"name": "Lila Sarfati"}, {"name": "Marc Durand"}, {"name": "Frédéric van Wijland"}], "featured_authors": [{"name": "Nino Despeignes"}, {"name": "Lila Sarfati"}, {"name": "Marc Durand"}, {"name": "Frédéric van Wijland"}], "author_count": 4}, {"id": "2608.08741", "category": "cond-mat", "title": "Microscopic Origin of Spin Splitting in Altermagnetic CrSb Thin Films", "abstract": "Altermagnets have recently emerged as promising materials for spintronic applications owing to their momentum-dependent spin splitting. Among them, metallic CrSb is particularly attractive owing to its giant spin splitting and high Néel temperature. However, the microscopic origin of the distinct spin-splitting behaviors in bulk and thin-film CrSb remains unresolved. Here, we systematically investigate the electronic structures of CrSb slabs with different surface orientations using first-principles calculations. Although all considered slabs preserve spin-group symmetries compatible with altermagnetism, they exhibit markedly different electronic structures: the (2$\\bar{1}\\bar{1}$0) slab retains pronounced altermagnetic spin splitting, whereas the (0001) and (10$\\bar{1}$0) slabs display nearly spin-degenerate bands. We demonstrate that dimensional reduction fundamentally changes the microscopic origin of altermagnetic spin splitting. Unlike bulk CrSb, altermagnetic spin splitting in thin films requires long-range inter-unit-cell coplanar Cr--Sb hopping, while Sb--Sb hopping provides an additional contribution. The preservation or suppression of these hopping pathways explains the strong surface dependence of the spin splitting. Our findings establish a microscopic mechanism for understanding altermagnetism in reduced dimensions and provide a general principle for engineering spin splitting in low-dimensional altermagnetic materials.", "url": "https://arxiv.org/abs/2608.08741", "type": "数值", "summary": "1. 该工作通过第一性原理计算，系统考察了不同表面取向的CrSb薄膜电子结构，发现各薄膜均保持与交变磁相容的自旋群对称性，但自旋劈裂表现出强烈的表面依赖。\n2. 其关键机制在于降维使交变磁自旋劈裂的微观起源发生根本改变：薄膜中需要长程跨晶胞的共面Cr-Sb跃迁，且Sb-Sb跃迁亦起附加作用，这些跃迁路径的存废解释了劈裂的显著差异。\n3. 该结论确立了低维交变磁体自旋劈裂的微观物理图像，为通过表面取向和层间耦合调控自旋劈裂提供了普适设计原则，对自旋电子学器件具有指导意义。", "summary_source": "deepseek", "authors": [{"name": "Dai Mingyang"}, {"name": "Song Hongquan"}, {"name": "Kang Zhuo"}, {"name": "Xu Yuanji"}, {"name": "Tian Fuyang"}], "featured_authors": [{"name": "Dai Mingyang"}, {"name": "Song Hongquan"}, {"name": "Kang Zhuo"}, {"name": "Xu Yuanji"}, {"name": "Tian Fuyang"}], "author_count": 5}, {"id": "2608.08843", "category": "cond-mat", "title": "Layer-Locked Chiral Topological Superconductivity", "abstract": "We uncover a universal mechanism for realizing layer-locked topological phases. Guided by it, we investigate the realization of layer-locked chiral topological superconductivity-the superconducting analogue of the quantum anomalous layer Hall effect-in a nonsymmorphic bilayer antiferromagnetic system with s-wave pairing. We identify three distinct gate-tunable topological phases and establish a direct correspondence between the nearly quantized layer-resolved Chern numbers and the layer-locking behavior of chiral Majorana edge states, vortex-core Majorana zero modes, and nearly quantized thermal Hall responses.", "url": "https://arxiv.org/abs/2608.08843", "type": "理论+数值", "summary": "1. 该工作揭示了实现层锁定拓扑相的一般机制，并在具有s波配对与非简单空间群对称性的双层反铁磁体系中提出层锁定手性拓扑超导，即量子反常层霍尔效应的超导类比。\n2. 其核心在于通过门电压调控识别出三种不同拓扑相，并建立近量子化的层分辨陈数与手性Majorana边界态、涡旋芯Majorana零模及近量子化热霍尔响应的层锁定行为之间的一一对应。\n3. 该机制为在磁性范德华异质结等人工平台中实现可门控的拓扑超导与Majorana零模，进而探索拓扑量子计算提供了具体途径。", "summary_source": "deepseek", "authors": [{"name": "Yijie Mo"}, {"name": "Zhongbo Yan"}], "featured_authors": [{"name": "Yijie Mo"}, {"name": "Zhongbo Yan"}], "author_count": 2}, {"id": "2608.08848", "category": "cond-mat", "title": "A Dataset of Equilibrium State Configurations of Adsorption in Zeolites", "abstract": "Zeolites are crystalline nanoporous materials widely used in adsorption, separation, and catalytic processes. Molecular simulations are commonly used to predict adsorption properties, but most high-throughput adsorption datasets report only ensemble-averaged quantities such as loadings or isotherms, rather than the molecular configurations from which these averages are obtained. Here, we present AdsZeo, a coordinate-resolved dataset of equilibrium methane adsorption configurations in aluminium-substituted, sodium-containing zeolite frameworks. The processed release contains 4,775 framework realisations derived from 191 zeolite topologies. Each framework realisation was simulated at 13 methane pressures between 0.1 and 100 bar at 298 K using grand canonical Monte Carlo simulations, giving 62,075 production simulations in total. In addition to scalar adsorption records, the dataset stores production-frame methane pseudo-atom coordinates, mobile Na$^+$ cation coordinates, framework atomic coordinates, per-frame loading and energy statistics, and simulation metadata in a processed DuckDB database. The release contains 12,415,000 saved production-frame records and 1,245,376,215 saved particle-coordinate records. AdsZeo provides coordinate-resolved adsorption data across variations in framework topology, aluminium content and distribution, sodium cation arrangement, pressure, and methane loading, enabling reuse for adsorption analysis, spatial statistics, density estimation, and machine-learning models for molecular configuration generation in charged zeolite pores.", "url": "https://arxiv.org/abs/2608.08848", "type": "理论+数值", "summary": "1. 该工作构建了沸石中甲烷吸附平衡构型的坐标级数据集AdsZeo，覆盖191种拓扑与4775个铝取代含钠框架。\n2. 其特色在于保存了巨正则蒙特卡洛模拟中甲烷、可动钠离子及骨架原子的逐帧坐标，共62,075次生产模拟与逾12亿条粒子坐标记录。\n3. 该资源可支撑吸附空间统计、密度估计及带电孔道内分子构型生成的机器学习模型开发与机理分析。", "summary_source": "deepseek", "authors": [{"name": "Marko Petković"}, {"name": "Rachna Ramesh"}, {"name": "Vlado Menkovski"}, {"name": "Sofía Calero"}], "featured_authors": [{"name": "Marko Petković"}, {"name": "Rachna Ramesh"}, {"name": "Vlado Menkovski"}, {"name": "Sofía Calero"}], "author_count": 4}, {"id": "2608.08917", "category": "cond-mat", "title": "Relaxation-driven flat bands and topology in moiré transition metal dichalcogenide heterobilayers", "abstract": "Moiré transition metal dichalcogenide (TMD) heterobilayers are commonly modeled by a continuum theory that yields topologically trivial bands, in contrast to their homobilayer counterparts which host topological bands and fractional Chern insulators (FCI). We show this conclusion is an artifact of neglecting the pseudomagnetic field generated by lattice relaxation, an effect intrinsic to every moiré material. We develop a continuum model that resolves relaxation into three channels: a modified moiré potential with higher Fourier harmonics, a pseudoelectric (scalar deformation) potential, and a pseudomagnetic (vector) potential. Using WSe$_2$/WS$_2$ as a prototype, we find that the pseudomagnetic field alone gaps the third and fourth valence bands with Chern numbers $\\pm 1$ over a broad range of twist angle and lattice mismatch, while the moiré potential correction and pseudoelectric potential narrow the bandwidth and enhance the bandgaps, which survive many-body interactions using neural-network variational Monte Carlo calculations. Relaxation also smoothens the Berry curvature and quantum metric relative to the rigid model, moving the band closer to the ideal Chern limit, beneficial for the quantum anomalous Hall effect, FCI states, and flat-band superconductivity when filled to higher bands. Our work establishes a new framework that connects first-principles calculations, through the continuum model, to many-body observables. Using this framework, we show moiré heterobilayers as a new class of topological materials whose topology is driven entirely by intrinsic lattice relaxation.", "url": "https://arxiv.org/abs/2608.08917", "type": "理论+数值", "summary": "1. 该工作为莫尔过渡金属硫族化合物异质双层建立包含晶格弛豫的连续模型，指出拓扑平庸的旧结论源于忽略弛豫产生的赝磁场。\n2. 技术要点是将弛豫分解为高次谐波莫尔势、赝电场和赝磁场三通道；以WSe2/WS2为例，赝磁场单独使第三、四价带打开陈数±1的能隙，而势与赝电场修正压窄带宽并增大能隙，且能隙在神经网络变分蒙特卡洛计算中依旧稳定。\n3. 该框架连接第一性原理与多体可观测量，揭示异质双层可成为由本征弛豫驱动的拓扑材料，为高阶带填充下的量子反常霍尔效应、分数量子霍尔态及平带超导提供新平台。", "summary_source": "deepseek", "authors": [{"name": "Mitchell Luskin"}, {"name": "Max Geier"}, {"name": "Liang Fu"}, {"name": "Ziyan Zhu"}], "featured_authors": [{"name": "Mitchell Luskin"}, {"name": "Max Geier"}, {"name": "Liang Fu"}, {"name": "Ziyan Zhu"}], "author_count": 4}, {"id": "2608.08922", "category": "cond-mat", "title": "Clustered Attractor Manifolds and Dynamical Condensation in Self-Attention", "abstract": "Transformer layers generate state-dependent interaction networks: token representations determine the attention matrix, which in turn updates the representations. We study this feedback in a minimal normalized self-attention dynamics and identify the overlap gap as the central quantity governing its attractor structure in the thermodynamic limit. When tokens form internally aligned clusters and their similarity to members of the same cluster exceeds that to every other cluster by a nonvanishing amount, inter-cluster attention is exponentially suppressed as the dimension increases. This mechanism produces a high-dimensional manifold of clustered fixed points, ranging from a few macroscopic clusters to extensive microscopic fragmentation, and also controls their stability against perturbations. Starting from an unstructured Gaussian state, we find that clustered states nucleate from the diffuse background only above a finite threshold in attention sharpness, giving rise to a dynamical attention-condensation transition.", "url": "https://arxiv.org/abs/2608.08922", "type": "理论", "summary": "1. 该工作研究最小归一化自注意力动力学，揭示Transformer层中表征与注意力矩阵反馈所决定的团簇吸引子流形结构。\n2. 其物理核心是将重叠间隙确立为热力学极限下的控制量：当同类令牌相似度超过异类且余量非零时，跨簇注意力随维度指数压低，从而生成从宏观簇到微观碎化的高维不动点流形并决定其稳定性。\n3. 该结果进一步表明，无结构高斯初态下团簇态须在注意力锐度超过有限阈值后成核，为注意力凝聚相变提供了可检验的理论图景。", "summary_source": "deepseek", "authors": [{"name": "Qucheng Gao"}, {"name": "Zuyi Yang"}, {"name": "Xiao Chen"}], "featured_authors": [{"name": "Qucheng Gao"}, {"name": "Zuyi Yang"}, {"name": "Xiao Chen"}], "author_count": 3}, {"id": "2608.08978", "category": "cond-mat", "title": "An Active Matter Pathway for Non-Equilibrium Liquid-Liquid Extractions", "abstract": "We report on a Marangoni flow-driven pathway for non-equilibrium transport of metal ions across an oil-water interface. Under specific conditions, we show that the adsorption of a metallic species onto the extractant-decorated oil-water interface creates interfacial tension gradients that give rise to Marangoni flows. Strikingly, we observe that these flows are accompanied by removal of metal from the aqueous phase and that the extraction kinetics follow a non-diffusive behavior. The extraction rates are significantly higher - at least a threefold increase - when Marangoni flows are present. We show that the strength of the interfacial instability is coupled to the lowering of the interfacial tension- which is metal-dependent and therefore can lead to rate-mediated selective extractions. Overall, our study shows a fundamentally different paradigm for liquid-liquid extractions opening up a range of new directions of inquiry and future technologies.", "url": "https://arxiv.org/abs/2608.08978", "type": "理论", "summary": "1. 该工作实验研究了特定条件下金属离子在装饰有萃取剂的油水界面上吸附所引发的马兰戈尼流，以及该流动伴随的水相金属去除与非平衡液液萃取过程。\n2. 其技术卖点在于揭示吸附降低界面张力并形成梯度，驱动界面失稳与对流，使萃取速率提高至少三倍且动力学呈非扩散特征，并表明失稳强度与界面张力降低及金属种类相耦合。\n3. 该机制支持速率介导的选择性萃取，为设计非平衡液液萃取体系及相关分离技术提供了新范式与后续研究方向。", "summary_source": "deepseek", "authors": [{"name": "Jude C. Obijiaku"}, {"name": "Oladipupo P. Ogolo"}, {"name": "Damilola E. Fadipe"}, {"name": "Angela Deneke"}, {"name": "Karthik Nayani"}], "featured_authors": [{"name": "Jude C. Obijiaku"}, {"name": "Oladipupo P. Ogolo"}, {"name": "Damilola E. Fadipe"}, {"name": "Angela Deneke"}, {"name": "Karthik Nayani"}], "author_count": 5}, {"id": "2608.09020", "category": "cond-mat", "title": "Prediction of BaBiO$_3$-like superconducting perovskites in K-doped SrAsO$_3$", "abstract": "Using first-principles calculations, we predict a new perovskite compound SrAsO$_3$ . The undoped cubic phase has pronounced soft-phonon instabilities, which are gradually suppressed upon K doping the Sr site. The cubic phase becomes dynamically stable for K-doping levels above approximately 60%, and the stabilized K-doped phases are metallic with predicted conventional phonon mediated superconductivity. Moreover, the inclusion of nonlocal exchang
