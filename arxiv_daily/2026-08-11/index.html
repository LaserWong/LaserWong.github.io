e interactions broadens the electronic bandwidth, enhances the electron-phonon coupling (EPC) strength, and increases the superconducting transition temperature ($T_c$) of these doped compounds. In particular, the HSE06 hybrid exchange-correlation functional corrected EPC constant $\\lambda$ reaches 1.41 for Sr$_{0.4}$K$_{0.6}$AsO$_3$, corresponding to a predicted $T_c$ of 44.3 K. These results suggest that SrAsO$_3$ is a BaBiO$_3$-like superconducting perovskite driven by strong electron-phonon coupling.", "url": "https://arxiv.org/abs/2608.09020", "type": "理论+数值", "summary": "1. 该工作通过第一性原理计算预测了一种新型钙钛矿 SrAsO3，并系统研究了 K 掺杂对其声子稳定性与超导电性的影响。\n2. 其核心发现是 K 掺杂可抑制立方相的软声子不稳定性并使其金属化，且采用 HSE06 杂化泛函计入非局域交换后，Sr0.4K0.6AsO3 的电子-声子耦合常数达 1.41，对应 Tc 约 44.3 K。\n3. 这一结果将 SrAsO3 确立为类似 BaBiO3 的强电子-声子耦合超导钙钛矿，为探索氧化物超导体提供了新的候选体系与掺杂调控思路。", "summary_source": "deepseek", "authors": [{"name": "Zhihong Yuan"}, {"name": "Rui Liu"}, {"name": "Pengyu Zheng"}, {"name": "Zhiping Yin"}], "featured_authors": [{"name": "Zhihong Yuan"}, {"name": "Rui Liu"}, {"name": "Pengyu Zheng"}, {"name": "Zhiping Yin"}], "author_count": 4}, {"id": "2608.09081", "category": "cond-mat", "title": "Scalene Yang--Baxter triples as a source of hidden symmetries beyond the ordinary Yang--Baxter equation", "abstract": "We study a nearest-neighbor non-Hermitian spin chain obtained from one member of an exact non-braided scalene Yang--Baxter triple. Its local Hamiltonian density violates both the difference-form Reshetikhin condition and its general non-difference counterpart, obstructing its realization by a differentiable homogeneous regular solution of the ordinary Yang--Baxter equation. The transfer matrices constructed from the regular member do not commute among themselves at distinct spectral parameters. Nevertheless, the scalene Yang--Baxter relation implies cross-commutativity with another transfer matrix constructed from the third member of the scalene triple. We evaluate the latter for arbitrary chain length and show that, on even periodic chains, it is a finite generating function of a non-obvious staggered nilpotent symmetry. The resulting conserved hierarchy belongs entirely to the algebra generated by this single symmetry and hence does not constitute an extensive family of algebraically independent charges. Nevertheless, this example demonstrates that scalene Yang--Baxter triples can act as an algebraic symmetry-discovery mechanism beyond the ordinary self-commuting transfer-matrix framework.", "url": "https://arxiv.org/abs/2608.09081", "type": "理论+数值", "summary": "1. 该工作研究由非辫化不等边Yang-Baxter三元组中正则元构造的近邻非厄米自旋链，并分析其转移矩阵与非平凡对称性。\n2. 其核心在于证明尽管正则元的转移矩阵在谱参数间不对易，不等边Yang-Baxter关系仍给出与第三元转移矩阵的交叉对易，且在偶数周期链上该矩阵生成交错幂零对称性的有限生成函数。\n3. 这显示不等边Yang-Baxter三元组可充当超越普通自对易转移矩阵框架的代数对称性发现机制，为构造可积或非可积系统中的隐藏对称提供新途径。", "summary_source": "deepseek", "authors": [{"name": "Pramod Padmanabhan"}, {"name": "Somnath Maity"}, {"name": "Vladimir Korepin"}], "featured_authors": [{"name": "Pramod Padmanabhan"}, {"name": "Somnath Maity"}, {"name": "Vladimir Korepin"}], "author_count": 3}, {"id": "2608.09116", "category": "cond-mat", "title": "Phonon-assisted transport and hole-phonon coupling in GaAs double quantum dots", "abstract": "Hole-phonon interactions play an important role in transport and decoherence processes in semiconductor quantum dots. Here we investigate hole-phonon coupling in a gate-defined GaAs double quantum dot integrated with a quantum point contact charge sensor. Under finite source-drain bias, pronounced oscillatory stripe patterns appear near specific charge transition regions in the charge stability diagram. We attribute these oscillations to phonon emission during inelastic interdot tunneling. A theoretical model including piezoelectric hole-phonon coupling reproduces the observed patterns. Furthermore, our analysis shows that the oscillations emerge only in particular charge configurations. Our results provide direct insight into phonon-assisted transport and coherent hole-phonon interactions in semiconductor quantum dots.", "url": "https://arxiv.org/abs/2608.09116", "type": "理论", "summary": "1. 该工作利用量子点接触电荷传感器，在门控GaAs双量子点中实验研究了空穴-声子耦合及声子辅助的输运过程。\n2. 其核心发现在于有限源漏偏压下电荷稳定图出现振荡条纹，并被归因于非弹性量子点间隧穿中的压电空穴-声子发射，理论模型可重现该图案。\n3. 这一结果揭示了特定电荷构型下相干空穴-声子相互作用的可观测特征，为理解半导体量子点中的退相干与声子辅助输运提供了直接参考。", "summary_source": "deepseek", "authors": [{"name": "Jin Leng"}, {"name": "Wei-Zhu Liao"}, {"name": "Hao-Tian Jiang"}, {"name": "Di Liu"}, {"name": "Bao-Chuan Wang"}, {"name": "Gang Cao"}, {"name": "Hai-Ou Li"}, {"name": "Guo-Ping Guo"}], "featured_authors": [{"name": "Jin Leng"}, {"name": "Wei-Zhu Liao"}, {"name": "Hao-Tian Jiang"}, {"name": "Gang Cao"}, {"name": "Hai-Ou Li"}, {"name": "Guo-Ping Guo"}], "author_count": 8}, {"id": "2608.09257", "category": "cond-mat", "title": "Machine-learning octet $AB$-type binary compounds across chemical space with domain knowledge of the interatomic bond", "abstract": "The prediction of the structural stability of octet $AB$-type binary compounds is a classical materials informatics problem. The challenge is to capture the relative stability of 4-fold coordinated atoms in zincblende ($\\beta$-ZnS) structure and 6-fold coordinated atoms in rocksalt (NaCl) structure, modulated by charge transfer and atomic-size differences. Previous structure maps and machine-learning approaches used atomic features such as valence-electron count, ionization potential and atomic radii, using either physical intuition or symbolic regression. Here, we demonstrate that explicitly incorporating the domain knowledge of the interatomic bonds can significantly and systematically improve the prediction of $\\beta$-ZnS/NaCl stability. We encode this bonding information through a coarse-grained representation of the local electronic structure obtained by a recursive solution of a tight-binding bond model. The underlying pairwise Hamiltonians are taken from downfolded eigenstates of density-functional theory calculations for diatomic molecules and thereby include domain knowledge of the bond between specific $A-B$ pairs. The benefit of this description is demonstrated with an ensemble of independently trained Kernel Ridge or symbolic regression models combined with sequential feature selection. The obtained models are compared to a previous symbolic-regression model using the same set of \\emph{ab initio} calculations for octet binaries as training data. We find a significant improvement in the prediction of the formation energy difference of $AB$ compounds as compared to previous works and demonstrate that an increasing amount of bond-informed recursion features improves the predictive accuracy.", "url": "https://arxiv.org/abs/2608.09257", "type": "理论+数值", "summary": "1. 该工作利用融入原子间成键领域知识的机器学习模型，预测八电子AB型二元化合物在闪锌矿与岩盐结构之间的相对稳定性。\n2. 其技术卖点在于从DFT双原子分子降维本征态得到成对哈密顿量，并以递归求解紧束缚键模型产生局域电子结构粗粒化特征，从而显著改进核岭回归与符号回归对形成能差的预测。\n3. 这为材料信息学中利用化学键领域知识改善小样本结构稳定性预测提供了可推广的表示策略。", "summary_source": "deepseek", "authors": [{"name": "Rohan Kumar"}, {"name": "Mariano D. Forti"}, {"name": "Aakash A. Naik"}, {"name": "Luca M. Ghiringhelli"}, {"name": "Thomas Hammerschmidt"}], "featured_authors": [{"name": "Rohan Kumar"}, {"name": "Mariano D. Forti"}, {"name": "Aakash A. Naik"}, {"name": "Luca M. Ghiringhelli"}, {"name": "Thomas Hammerschmidt"}], "author_count": 5}, {"id": "2608.09297", "category": "cond-mat", "title": "Pseudo-Distributions: Thermodynamic Geometry and an Empirical Application", "abstract": "We develop a consistent pseudo-analytic framework based on $g$-calculus for constructing deformed statistical distributions. By mapping standard algebraic operations through a monotone generator function, we systematically derive the associated pseudo-logarithmic and pseudo-exponential structures. Applying this formalism, we introduce a new family of pseudo-distributions that generalizes nonextensive statistical mechanics at both the probability density and cumulative distribution levels, recovering classical and standard nonextensive statistics as limiting cases. We investigate the thermodynamic geometry of the proposed models using the Ruppeiner metric on the equilibrium manifold. A perturbative analysis around the classical limit reveals that, to leading order, the thermodynamic scalar curvature is governed solely by the generator deformation parameter, while the nonextensivity parameter remains decoupled. To evaluate the empirical robustness of the framework, we apply the model to analyze the absolute deviations of daily West Texas Intermediate crude oil prices from their hundred-day moving average. Model comparison based on information criteria demonstrates that the proposed pseudo-distributions provide a superior description of these high-frequency financial fluctuations and their heavy-tailed characteristics compared to standard benchmarks. These results suggest that $g$-calculus offers a flexible and physically grounded mathematical tool for generating deformed statistics and analyzing their geometric properties.", "url": "https://arxiv.org/abs/2608.09297", "type": "理论+数值", "summary": "1. 该工作提出基于g-演算的一致伪解析方案，通过单调生成函数构造伪对数与伪指数结构，并导出推广非广延统计的伪分布族，覆盖概率密度与累积分布层面。\n2. 其技术核心是借助Ruppeiner度规研究平衡流形热力学几何，经典极限附近的微扰展开表明标量曲率仅由生成元形变参数主导，而非广延参数在领头阶解耦。\n3. 基于该模型对WTI原油日价绝对偏差的实证显示其优于标准基准描述重尾高频波动，说明g-演算为构造变形统计并研究其几何性质提供了物理上可扩展的工具。", "summary_source": "deepseek", "authors": [{"name": "Negin Bayrami"}, {"name": "Hosein Mohammadzadeh"}, {"name": "Hamzeh Agahi"}, {"name": "Hossein Mehri-Dehnavi"}, {"name": "Zahra Ebadi"}], "featured_authors": [{"name": "Negin Bayrami"}, {"name": "Hosein Mohammadzadeh"}, {"name": "Hamzeh Agahi"}, {"name": "Hossein Mehri-Dehnavi"}, {"name": "Zahra Ebadi"}], "author_count": 5}, {"id": "2608.09371", "category": "cond-mat", "title": "Magnetotransport evolution and nonlinear Hall effect in altermagnetic MnTe", "abstract": "Hexagonal MnTe is a prototypical semiconducting altermagnet whose properties are heavily influenced by intrinsic disorder, yet how the resulting diverse transport regimes shape its magnetotransport behavior remains to be clarified alongside the role of relativistic spin-orbit coupling (SOC). Here, we present a systematic study of the anisotropic magnetoresistance (AMR), planar Hall effect (PHE), and nonlinear transport in MnTe bulk single crystals. Below the Néel temperature (TN ~ 304 K), the emergence of high-order harmonics in AMR and PHE within the high-temperature metallic regime reveals the interplay of magnetic order, crystalline symmetry, and SOC. At relatively lower temperatures, the disappearance of higher-order symmetries coincides with a transport crossover into the hopping conduction regime, suggesting that carrier localization diminishes the transport sensitivity to the Fermi-surface topology. In addition, we detect distinct second-order nonlinear Hall signals, providing evidence for a macroscopic inversion-asymmetric response in altermagnetic MnTe. Extending the investigations into the localized regime provides key insights into the subtle role of disorder and SOC in macroscopic charge transport. Our work thus underscores the necessity of exploring magnetotransport across diverse conducting regimes to comprehensively understand altermagnetic properties.", "url": "https://arxiv.org/abs/2608.09371", "type": "理论", "summary": "1. 该工作系统研究了半导体性交变磁体MnTe单晶在尼尔温度以下从金属到跳迁导电区的各向异性磁电阻、平面霍尔效应与非线性输运演化。\n2. 其核心发现在于高温金属区高阶谐波的涌现揭示了磁序、晶格对称性与自旋轨道耦合的相互作用，而低温局域区高阶对称性消失则表明载流子局域化抑制了对费米面拓扑的敏感响应。\n3. 观测到的二阶非线性霍尔信号提供了宏观非中心对称响应的证据，凸显了跨越不同导电区研究磁输运对理解交变磁体与无序、自旋轨道耦合相互作用的重要价值。", "summary_source": "deepseek", "authors": [{"name": "Wei Zhou"}, {"name": "Zhifeng Xue"}, {"name": "Yunxing Li"}, {"name": "Nannan Tang"}, {"name": "Ye Tao"}, {"name": "Dingyong Zhong"}, {"name": "Jiawei Luo"}, {"name": "Donghui Guo"}, {"name": "Huichao Wang"}], "featured_authors": [{"name": "Wei Zhou"}, {"name": "Zhifeng Xue"}, {"name": "Yunxing Li"}, {"name": "Jiawei Luo"}, {"name": "Donghui Guo"}, {"name": "Huichao Wang"}], "author_count": 9}, {"id": "2608.09375", "category": "cond-mat", "title": "Effective one-body interactions due to the presence of a liquid-vapor interface", "abstract": "In this study we investigate the behavior of additive binary square-well mixtures within the framework of classical density functional theory. By leveraging on the geometrical structure of the square-well interaction, we propose a novel form of the perturbation theory contribution to the density functional in terms of weighted densities, inspired by fundamental measure theory. We apply this functional in order to study the effective one-body interaction due to the liquid-vapor interface of the solvent acting on a dilute component of dissolved nano particles. The effective one-body interaction attracts the nano particles strongly to the interface. We show that this effective interaction potential can be calculated either from the density profiles of the full mixture, at low but non-vanishing concentrations of the nano particles, or by employing the Widom insertion theorem in the dilute limit of vanishing density of nano particles. Both routes display excellent agreement.", "url": "https://arxiv.org/abs/2608.09375", "type": "理论+数值", "summary": "1. 该工作用经典密度泛函理论研究加性双组分方阱混合物，揭示溶剂液-气界面对稀溶质纳米颗粒产生强吸引的有效单体势。\n2. 其技术特色是借助方阱相互作用的几何结构，提出基于权重密度的新微扰泛函，并证明该势可由全混合物低浓度密度分布或Widom插入定理两种途径一致计算。\n3. 这一交叉验证为界面诱导有效相互作用的泛函理论计算提供了可推广的基准，亦启发将其用于更复杂溶剂或纳米颗粒体系。", "summary_source": "deepseek", "authors": [{"name": "Melih Gül"}, {"name": "Roland Roth"}], "featured_authors": [{"name": "Melih Gül"}, {"name": "Roland Roth"}], "author_count": 2}, {"id": "2608.09397", "category": "cond-mat", "title": "Ensemble-level loopy message passing with generalized-edge closure for percolation", "abstract": "Predicting the percolation threshold of highly clustered networks from local statistics remains difficult, because short loops break the independence assumption underlying tree-like message passing. Existing remedies address loopy connectivity either through prescribed local motifs in random-graph ensembles or through a single network's realized topology, leaving an ensemble-level treatment of arbitrary connectivity patterns absent. Here, we develop a loopy message-passing framework for random clustered graph ensembles based on generalized-edge statistics, which characterize overlap patterns among the neighborhoods of different nodes. This yields a progressively refined approximation scheme based on neighborhoods of increasing size around each node. The low-order approximations recover previous equations for random network ensembles, and the new result that yields refined threshold prediction is developed by the second-order approximation. We show that the effectiveness of this framework depends not only on short-cycle density but also on the internal consistency of generalized edges. To diagnose this effectiveness, we introduce the generalized-edge closure coefficient (GECC) to quantify this consistency. Because GECC is computed entirely from local statistics and does not rely on any percolation calculation, it serves as an a priori diagnostic for the reliability of the approximation. Using synthetic and real networks, the threshold is evaluated via the second-order and lower-order approximations. Comparisons with Monte Carlo simulations show that GECC captures key structural features that strongly affect the percolation threshold. These results establish ensemble-based loopy message passing as an efficient route for predicting the percolation threshold in large clustered networks.", "url": "https://arxiv.org/abs/2608.09397", "type": "理论+数值", "summary": "1. 该工作针对随机团簇网络系综提出系综级环消息传递框架，基于广义边统计刻画不同节点邻域的重叠模式，由局域统计预测渗流阈值。\n2. 其技术卖点在于二阶近似导出较已有方程更精确的阈值结果，并定义广义边闭合系数（GECC）量化广义边的内部一致性，作为无需渗流计算的先验诊断。\n3. 这一框架揭示了预测有效性取决于短环密度与广义边内部一致性，为大规模高聚类网络的渗流阈值预测及更一般局域关联近似提供了高效且可判定的路径。", "summary_source": "deepseek", "authors": [{"name": "L.-H. Wang"}, {"name": "Y.-M. Du"}], "featured_authors": [{"name": "L.-H. Wang"}, {"name": "Y.-M. Du"}], "author_count": 2}, {"id": "2608.09689", "category": "cond-mat", "title": "Robust spin pseudogap and spin-charge separation in the $σt$-$J$ model", "abstract": "The $\\sigma t$-$J$ model, obtained from the usual $t$-$J$ model by flipping the sign of the spin-down hopping term, has been proposed to eliminate the strong interference between doped holes and the spin background, known as the phase string effect. In this work, we investigate the finite-temperature properties of the $\\sigma t$-$J$ model using infinite projected entangled-pair state (iPEPS) algorithms, in comparison with the $t$-$J$ model and its easy-plane variants. We show that these models share similar spin-pseudogap thermodynamics, with a maximum in the spin susceptibility at $T^* \\sim J$ and a broad specific-heat peak. Tensor network renormalization (TNR) further provides strong evidences for a Berezinskii-Kosterlitz-Thouless (BKT) transition in the spin sector of the $\\sigma t$-$J$ model at a lower temperature $T_\\text{BKT} < T^*$ due to its reduced $\\mathrm{U}(1)$ spin-rotation symmetry. Crucially, in contrast to the $t$-$J$ model and to its easy-plane variants that also exhibit BKT transitions, these signatures remain robust upon doping: the doped holes preserve and even enhance the antiferromagnetic correlations in the $xy$ spin plane, leading to a weak doping dependence of both $T^*$ and $T_\\text{BKT}$. Finally, we develop a slave-fermion mean-field theory for the $\\sigma t$-$J$ model, whose projective symmetry group (PSG) is selected based on numerically determined hopping and pairing correlations, and show that it explains the robust spin pseudogap upon doping.", "url": "https://arxiv.org/abs/2608.09689", "type": "理论+数值", "summary": "1. 该工作利用无限投影纠缠对态算法研究σt-J模型的有限温度性质，并与t-J模型及易平面变体对照，同时发展奴隶费米子平均场理论。\n2. 其核心发现是自旋膜隙及自旋扇区的BKT转变在掺杂下保持稳健，掺杂空穴增强xy面内反铁磁关联，使T*与TBKT几乎不随掺杂变化。\n3. 这为理解掺杂量子磁体中自旋电荷分离与膜隙起源提供了可检验的理论图像，并展示了张量网络方法在该类问题中的数值优势。", "summary_source": "deepseek", "authors": [{"name": "Zheng-Yuan Yue"}, {"name": "Jia-Xin Zhang"}, {"name": "Zheng-Cheng Gu"}], "featured_authors": [{"name": "Zheng-Yuan Yue"}, {"name": "Jia-Xin Zhang"}, {"name": "Zheng-Cheng Gu"}], "author_count": 3}, {"id": "2608.09753", "category": "cond-mat", "title": "Probing crystal-field modulations with magnetic adatoms on the incipient charge-density-wave superconductor $2H$-NbS$_2$", "abstract": "The interplay between multiple quantum phases in layered materials may lead to incipient quantum behavior, where the material's ground state is close to a phase transition and sensitive to local disorder. The transition metal dichalcogenide material $2H$-NbS$_2$ exhibits incipient charge-density-wave behavior along with a well-developed superconducting state, creating a scenario where the local lattice instabilities play a crucial role. Here we present how an individual magnetic atom on $2H$-NbS$_2$ can be applied as a local sensor to reveal hidden crystal-field modulations. By manipulating the adatom across the surface with the tip of a scanning tunneling microscope, we measure variations in the Yu-Shiba-Rusinov (YSR) excitation spectra and map the local environment around an intrinsic point defect. We find that while the superconducting state is spatially uniform, the YSR excitation energy strongly depends on the position of the atom. We determine that the main contribution to this effect originates from variations in the local crystal-field environment. These results establish a new approach to investigate crystal-field modulations at the atomic scale and reveal how defects and lattice instabilities shape the atomic landscape of an incipient charge-density-wave material.", "url": "https://arxiv.org/abs/2608.09753", "type": "理论", "summary": "1. 该工作利用单个磁性吸附原子作为局域传感器，在初生电荷密度波超导体2H-NbS2表面通过扫描隧道显微镜操纵原子位置并测量Yu-Shiba-Rusinov谱，探测隐藏的晶场调制。\n2. 核心发现在于超导态在空间上保持均匀，而YSR激发能量强烈依赖吸附原子位置，且该效应主要源于局域晶场环境的变化，而非超导序参量的非均匀性。\n3. 这为原子尺度研究晶场调制提供了新途径，有助于理解缺陷与晶格不稳定性如何塑造初生电荷密度波材料的局域量子景观。", "summary_source": "deepseek", "authors": [{"name": "Werner M.J. van Weerdenburg"}, {"name": "Margarete Huisinga"}, {"name": "Constantin Flommersfeld"}, {"name": "Lisa M. Rütten"}, {"name": "Katharina J. Franke"}], "featured_authors": [{"name": "Werner M.J. van Weerdenburg"}, {"name": "Margarete Huisinga"}, {"name": "Constantin Flommersfeld"}, {"name": "Lisa M. Rütten"}, {"name": "Katharina J. Franke"}], "author_count": 5}, {"id": "2608.09758", "category": "cond-mat", "title": "Disorder-robust trivial Majorana-like states from smooth confinement in chiral superconducting nanowires", "abstract": "Near-zero-energy states in Majorana nanowires can arise from topologically trivial mechanisms such as smooth spatial inhomogeneity and disorder, making zero-energy pinning alone insufficient evidence of bulk topology. Here we identify a real-space mechanism governing their robustness to symmetry-preserving disorder. For a chiral-symmetric Bogoliubov-de Gennes Hamiltonian, we decompose a low-energy state into two normalized components of opposite chirality and show that disorder-induced splitting is bounded by their spatial overlap. We demonstrate this result in a finite Rashba nanowire with smooth chemical potential and pairing profiles. Below the bulk topological transition, smooth confinement produces partially separated chiral components with exponentially small overlap, yielding globally trivial Majorana-like Andreev bound states that remain near zero energy even under strong scalar, nonmagnetic disorder. The chiral overlap therefore provides a direct diagnostic of the protection of low-energy states against local perturbations, independent of the bulk topological invariant.", "url": "https://arxiv.org/abs/2608.09758", "type": "理论", "summary": "1. 该工作研究了手征超导纳米线中平滑约束产生的拓扑平庸类马约拉纳束缚态，揭示其在保持手征对称性的无序下保持鲁棒的实空间机制。\n2. 其技术要点是把BdG低能态分解为相反手征的两个归一化分量，证明无序诱导劈裂受空间重叠控制；在平滑化学势和配对分布的有限Rashba纳米线中，该重叠指数小，故全局平庸态在强非磁无序下仍近零能。\n3. 这提供了独立于体拓扑不变量的手征重叠诊断，可用于甄别零能模的拓扑来源并指导无磁无序环境中的鲁棒器件设计。", "summary_source": "deepseek", "authors": [{"name": "Eslam Ahmed"}, {"name": "Jorge Cayao"}, {"name": "Yukio Tanaka"}], "featured_authors": [{"name": "Eslam Ahmed"}, {"name": "Jorge Cayao"}, {"name": "Yukio Tanaka"}], "author_count": 3}, {"id": "2608.09883", "category": "cond-mat", "title": "Anomalous temperature dependence of polaron mobility in a nonlinear double-well potential: unbiased X-propagator approach", "abstract": "We develop an unbiased X-propagator method for calculating finite-temperature optical conductivity $\\sigma(\\omega)$ and dc mobility $\\mu$ for arbitrary nonlinear electron-phonon interaction. We apply it to a polaron coupled to a double-well lattice potential, a minimal model for strongly anharmonic polar materials. At moderate coupling, the mobility exhibits three temperature regimes associated with confinement within one well, thermal competition with the barrier, and barrier-insensitive high-temperature dynamics. This sequence produces a concave temperature dependence of the mobility that is absent in conventional linear-coupling polaron models. At strong coupling, the mobility becomes nonmonotonic, and its temperature evolution is reflected in a characteristic redistribution of optical spectral weight. For parameters relevant to SrTiO$_3$, our results qualitatively reproduce both the anomalous concave mobility and the onset of violation of the Mott-Ioffe-Regel limit, thereby supporting nonlinear coupling to a soft anharmonic lattice mode as a microscopic mechanism for anomalous transport in dilute polar metals.", "url": "https://arxiv.org/abs/2608.09883", "type": "理论", "summary": "1. 该工作提出无偏X传播子方法，计算非线性电子-声子耦合下的有限温光导与直流迁移率。\n2. 它揭示双阱势中极化子迁移率随温度呈凹形变化，强耦合下非单调且伴随谱权重转移。\n3. 对SrTiO3的定性符合支持软非谐声子模式作为稀薄极性金属反常输运的微观机制。", "summary_source": "deepseek", "authors": [{"name": "Stefano Ragni"}, {"name": "Osor S. Barišić"}, {"name": "Naoto Nagaosa"}, {"name": "Andrey S. Mishchenko"}], "featured_authors": [{"name": "Stefano Ragni"}, {"name": "Osor S. Barišić"}, {"name": "Naoto Nagaosa"}, {"name": "Andrey S. Mishchenko"}], "author_count": 4}, {"id": "2608.09932", "category": "cond-mat", "title": "Cell Natural Orbitals in Interacting Topological Bands", "abstract": "Topological bands exhibit obstruction to exponentially localized and symmetric Wannier functions, challenging the standard paradigm of representing projected interactions in terms of local orbitals with finite range. To faithfully capture the form factors and quantum geometry of topological bands we introduce a singular-value decomposition of the band-projected density form factors, enabling a geometry-based truncation scheme of the Hilbert space, exposing an intrinsic hierarchy on band-projected interactions that is determined by the underlying wavefunctions. This decomposition is most naturally described in terms of Cell Natural Orbitals (CNOs), as the eigenstates of the unit-cell reduced one-particle density matrix, whose occupation provide a measure of the minimal orbital complexity required to faithfully represent the band wavefunctions overlaps. The CNO decomposition identifies systematically the minimal number of local orbitals needed to reproduce short-ranged interactions while resolving the hierarchy of interaction strengths across CNO channels. Applied to magic-angle twisted bilayer graphene in the chiral limit, we find that the dominant CNO is centered at the AA site, resembling the $f$-fermion of the heavy-fermion model. The subdominant CNO channels carry progressively weaker interaction matrix elements, allowing them to be treated at the static mean-field level, while the dominant channel requires a dynamical self-energy. The formalism illustrates how variations of charge density within the unit cell generate momentum dependence in the CNO envelope function and, consequently, dispersion in the single-particle spectral function. More broadly, our results establish CNOs as a geometry-informed bridge between band topology and real-space correlations, providing a systematic framework for analyzing interactions and emergent phases in quantum materials.", "url": "https://arxiv.org/abs/2608.09932", "type": "理论", "summary": "1. 该工作提出胞内自然轨道（CNO）方法，通过能带投影密度形状因子的奇异值分解，对相互作用拓扑能带实施基于量子几何的希尔伯特空间截断，并刻画所需最小局域轨道复杂度。\n2. 其技术卖点在于揭露相互作用强度随CNO通道衰减的层级结构：手性极限下的魔角双层石墨烯中主导CNO位于AA位点且需动态自能，次主导通道只需静态平均场，同时CNO包络的动量依赖导致单粒子谱色散。\n3. 这为将带拓扑与实空间关联联系起来提供了系统性几何桥梁，对分析量子材料的相互作用与涌现相具有直接方法论启示。", "summary_source": "deepseek", "authors": [{"name": "Nishchhal Verma"}, {"name": "Harshitra Mahalingam"}, {"name": "Daniel Muñoz-Segovia"}, {"name": "Raquel Queiroz"}], "featured_authors": [{"name": "Nishchhal Verma"}, {"name": "Harshitra Mahalingam"}, {"name": "Daniel Muñoz-Segovia"}, {"name": "Raquel Queiroz"}], "author_count": 4}, {"id": "2608.07568", "category": "hep-th", "title": "Celestial Holography, A Hitchhiker's Guide to the Celestial Sphere", "abstract": "This primer offers an first introduction to Celestial Holography, a rapidly evolving framework aiming to describe quantum gravity in asymptotically flat spacetimes. We start from the established foundation of the AdS/CFT correspondence before venturing into the wilds of Minkowski space. The journey covers the essential Bondi-Sachs formalism and the geometry of null infinity ($\\mathscr{I}^\\pm$), the discovery of the infinite-dimensional BMS asymptotic symmetry group. We explain the core holographic map given by Mellin transform that recasts four-dimensional scattering amplitudes as correlation functions of a conjectured 2D Celestial Conformal Field Theory (CCFT) on the celestial sphere. The presentation is made intuitive but the mathematics is still precise (hopefully!). It is designed to equip newcomers with both the conceptual landscape and the technical vocabulary to explore this exciting frontier.", "url": "https://arxiv.org/abs/2608.07568", "type": "理论", "summary": "1. 该工作撰写了面向初学者的天体全息入门导引，旨在为渐近平坦时空中量子引力建立全息描述框架，并从AdS/CFT对应出发引出核心思想。\n2. 其主要技术卖点在于用Mellin变换将四维散射振幅映射为天球上二维天体共形场论的关联函数，并以Bondi-Sachs形式、零无穷远几何及无限维BMS对称群作为基础。\n3. 这为初学者提供了探索该前沿方向所需的概念图景与技术词汇，可望推动平坦时空全息及量子引力相关后续研究。", "summary_source": "deepseek", "authors": [{"name": "Faïçal Barzi"}], "featured_authors": [{"name": "Faïçal Barzi"}], "author_count": 1}, {"id": "2608.07634", "category": "hep-th", "title": "Three-loop onset of the wormhole length in DSSYK", "abstract": "The length of the Einstein-Rosen bridge in sine-dilaton gravity at disk level equals the Krylov spread complexity of the dual double-scaled SYK (DSSYK) model, with the double-scaling parameter $\\lambda$ controlling the semiclassical expansion. We compute the onset value, $L_{0}$, in the thermofield double state at $t=0$ and arbitrary inverse temperature $\\beta$, through three loops and in closed form, extending the known one-loop result. The quantity $L_{0}$ represents the preparation complexity of the initial thermal Hartle-Hawking state. In DSSYK, $L_{0}$ is $\\lambda$ times the average chord number of the thermal state, providing a microscopic, unambiguous determination of an additive constant otherwise fixed only by a choice of holographic renormalization scheme. The two-loop contribution follows from a saddle point evaluation of the DSSYK two-point function at coincident insertion points, where individually divergent contributions cancel only in their sum. At three loops, we bypass the saddle point analysis using an exact recursion relation that generates long high-temperature expansions at low cost, fixing and testing a proposed Ansatz against many independent data points. Finally, in the low-temperature regime each loop order contributes one further power of $\\beta$, reorganizing the semiclassical series into an expansion in the Schwarzian coupling $\\lambda\\beta$, whose leading coefficient we check against an independent one-loop Schwarzian computation. The same methods, applied to the length variance and third-order cumulant at $t=0$, give their semiclassical expansion through two loops.", "url": "https://arxiv.org/abs/2608.07634", "type": "理论", "summary": "1. 该工作计算了双标度SYK模型中热场双态在t=0时虫洞长度（即Krylov展开复杂度）的起始值L0，并给出其三圈闭式结果，推广了已有单圈结论。\n2. 其核心在于L0等于λ乘以热态平均弦数，从而微观且无歧义地确定了一个原本依赖全息重整化方案选择的相加常数；三圈计算则借助精确递推关系低成本生成高温展开，绕过了鞍点分析。\n3. 低温区下每圈贡献一个β幂次，使半经典级数重组为Schwarzian耦合λβ的展开，且同类方法可进一步用于长度方差及三阶累积量的两圈计算。", "summary_source": "deepseek", "authors": [{"name": "Eleonora Alfinito"}, {"name": "Matteo Beccaria"}], "featured_authors": [{"name": "Eleonora Alfinito"}, {"name": "Matteo Beccaria"}], "author_count": 2}, {"id": "2608.07658", "category": "hep-th", "title": "Towards a Holographic dual of Carrollian BCFT", "abstract": "In this work we aim to lay the foundation of flat version of AdS$_3$/BCFT$_2$ correspondence through Carrollian framework. We begin with discussing the recently discovered Boundary Carrollian Conformal Algebra (BCCA), the symmetry algebra of Carrollian BCFT. We identify this algebra at the null infinity of flat spacetime with appropriate choice of the end-of-the-world (EOW) brane. The properties of this EOW brane have been analysed both intrinsically and by taking flat limit from its AdS counterpart. We also find that the global as well as asymptotic symmetries of flat spacetime restricted by this EOW brane coincide exactly with the symmetries of BCCA.", "url": "https://arxiv.org/abs/2608.07658", "type": "理论", "summary": "1. 该工作旨在基于Carrollian框架建立AdS3/BCFT2对应的平直时空版本，为平直时空全息中的边界共形场论提供全息对偶基础。\n2. 其技术要点在于将边界Carrollian共形代数(BCCA)定位于平直时空的零无穷远，通过合适的end-of-the-world膜实现该代数，并分别从膜的内禀性质和AdS平直极限两方面加以验证。\n3. 文中进一步证明，该膜所限制的平直时空全局对称性与渐近对称性同BCCA完全一致，为平直时空全息中的Carrollian边界场论及相应EOW膜构造提供了明确的理论框架。", "summary_source": "deepseek", "authors": [{"name": "Pronoy Chakraborty"}, {"name": "Ritankar Chatterjee"}, {"name": "Priyadarshini Pandit"}], "featured_authors": [{"name": "Pronoy Chakraborty"}, {"name": "Ritankar Chatterjee"}, {"name": "Priyadarshini Pandit"}], "author_count": 3}, {"id": "2608.07660", "category": "hep-th", "title": "Superconformal indices and black hole saddles", "abstract": "The AdS/CFT correspondence implies that the superconformal index ${\\mathcal I}$ in ${\\mathcal N=4}$ SU(N) supersymmetric Yang-Mills theory can be computed using the dual bulk theory. In particular, in the limit of large $N$, the index should be given by a sum over appropriate saddles. However, ${\\mathcal I}$ depends on potentials $\\sigma, \\tau, \\vec \\Delta$ and, at large ${\\rm Im}\\, \\tau = {\\rm Im}\\, \\sigma$, the CFT index ${\\mathcal I}$ rapidly approaches $1$ at all values of $N$. As a result, black hole saddles associated with exponentially large contributions in $N$ cannot contribute in this limit. This in particular excludes saddles that were previously suggested to be relevant in such regimes. We thus consider an approach to the bulk path integral motivated by taking it to be defined as an integral over real Lorentz-signature spacetimes with codimension-2 singularities. This approach leads only to saddles that satisfy the above bound, and to the enforcement of this bound via Stokes phenomena. We also find similar results for bulk AdS$_4$ calculations of the ABJM superconformal index.", "url": "https://arxiv.org/abs/2608.07660", "type": "理论", "summary": "1. 该工作运用AdS/CFT对偶研究大N极限下N=4超对称杨-米尔斯理论与ABJM理论超共形指标的体鞍点计算，指出在大Im τ=Im σ区域指标趋近1，从而排除指数增长的黑洞鞍点贡献。\n2. 其技术要点是将体路径积分定义为带余维2奇点的实洛伦兹号差时空积分，使可贡献鞍点自动满足上述上界，并由Stokes现象强制实现这一约束。\n3. 这为超共形指标鞍点分类与黑洞简并度计数提供了更自洽的框架，并可能推广至其他维度的超对称指标计算。", "summary_source": "deepseek", "authors": [{"name": "Maciej Kolanowski"}, {"name": "Donald Marolf"}, {"name": "Zi-Yue Wang"}, {"name": "Wenwen Zheng"}], "featured_authors": [{"name": "Maciej Kolanowski"}, {"name": "Donald Marolf"}, {"name": "Zi-Yue Wang"}, {"name": "Wenwen Zheng"}], "author_count": 4}, {"id": "2608.07664", "category": "hep-th", "title": "R7-branes and AdS$_{\\text{9}}$ solutions in type IIB", "abstract": "We consider the recently found $\\mathrm{AdS}_9$ backgrounds in type IIB supergravity. We start by reviewing the solutions in a more convenient set of coordinates, which allows us to explicitly compute a few relevant observables, including the holographic central charge. Subsequently, we study non-supersymmetric 7-brane configurations sourced by the IIB axio-dilaton. We find explicit analytic 7-brane solutions that possess the above $\\mathrm{AdS}_9$ backgrounds as their near-horizon geometry. Finally, we discuss the relation of these 7-brane solutions to the R7 branes by imposing the reflection monodromy $\\tau \\rightarrow -\\bar \\tau$ in the transverse plane.", "url": "https://arxiv.org/abs/2608.07664", "type": "理论", "summary": "1. 该工作重新审视并系统研究了IIB型超引力中的AdS_9背景，并在更方便的坐标下计算了包括全息中心荷在内的若干可观测量。\n2. 其核心在于构造出以这些AdS_9为近地平几何的非超对称7-膜解析解，并通过横向面上的反射单值性τ→-τ̄将其与R7膜联系起来。\n3. 这一对应为理解高维AdS全息中非超对称膜背景、以及R7膜与轴-胀子源之间的关系提供了明确的理论基础与后续检验方向。", "summary_source": "deepseek", "authors": [{"name": "Giuseppe Dibitetto"}, {"name": "Cameron Gibson"}, {"name": "Nicolò Petri"}, {"name": "Colin Sterckx"}], "featured_authors": [{"name": "Giuseppe Dibitetto"}, {"name": "Cameron Gibson"}, {"name": "Nicolò Petri"}, {"name": "Colin Sterckx"}], "author_count": 4}, {"id": "2608.07694", "category": "hep-th", "title": "Updates on Calabi-Yau manifolds from pairs of non-compact Calabi-Yau manifolds", "abstract": "We discuss developments in the construction of Calabi--Yau manifolds by smoothing normal crossing unions of quasi-Fano manifolds, following the introduction of this method to the physics community in 2010. We describe constructions of Calabi--Yau threefolds with unbounded second Betti numbers and with very small Hodge numbers, as well as the first non-Kähler examples in dimensions greater than three. The role of Landau--Ginzburg models in mirror constructions is also explained.", "url": "https://arxiv.org/abs/2608.07694", "type": "理论", "summary": "1. 该工作综述了通过光滑化拟法诺流形正规交叉并来构造卡拉比–丘流形的最新进展，并联系了非紧卡拉比–丘流形对。\n2. 其核心成果包括构造出第二贝蒂数无界以及霍奇数极小的三维卡拉比–丘流形，并首次在高于三维时给出非凯勒例子。\n3. 文中还阐明了朗道–金兹堡模型在镜像构造中的作用，为几何与物理对应提供了新的构造途径和后续研究方向。", "summary_source": "deepseek", "authors": [{"name": "Nam-Hoon Lee"}], "featured_authors": [{"name": "Nam-Hoon Lee"}], "author_count": 1}, {"id": "2608.07699", "category": "hep-th", "title": "Supertranslations are Soft Dressings", "abstract": "Asymptotic states of massive particles in electrodynamics and gravity are not uniquely defined because of the absence of a mass gap. Working in the KMOC formalism, we study the classical implications of this freedom in the dressing of massive particle states. We show that coherent-state dressings modify observables by a large gauge/BMS transformation. The associated coherent-state displacement operator can be completed into a conserved charge, the BMS charge in the gravitational case, which implements large gauge transformations on scattering data. The parameter of our dressing is directly the large gauge/BMS transformation parameter, and we explain that observables do not depend on monopolar and dipolar parts of the transformation parameter to all orders. Our construction is driven by soft factorization rather than by an underlying local symmetry, and we illustrate this by exhibiting the same structure in a scalar theory with no gauge symmetry. We explore the action of large gauge transformations on two-particle states for scalar, abelian gauge and graviton mediators, obtaining a universal shift of the impact parameter and clarifying the frame dependence of the radiated angular momentum vis à vis the frame-independence of the total angular momentum. The transformation connecting the canonical BMS frame, in which the Schwarzschild metric takes the Kerr-Schild form, to the intrinsic frame, in which it takes the De Donder form, illustrates these effects concretely.", "url": "https://arxiv.org/abs/2608.07699", "type": "理论", "summary": "1. 该工作采用KMOC形式研究电动力学与引力中因无质量隙而出现的大质量粒子渐近态缀饰的经典含义，表明相干态缀饰由大规范/BMS变换实现。\n2. 其技术要点在于将相干态位移算子构造为守恒BMS荷，并证明可观测量在任意阶不依赖缀饰参数的单极与偶极部分，且该构造源于软因子分解而非局域对称性，在无规范对称性的标量理论中同样出现。\n3. 这得到双粒子态碰撞参数的普适平移，并厘清辐射角动量的参考系依赖与总角动量参考系无关，借Schwarzschild度规在正则BMS参考系与内禀参考系间Kerr-Schild/De Donder形式的变换具体展示，为软定理的经典可观测含义提供统一图景。", "summary_source": "deepseek", "authors": [{"name": "Asaad Elkhidir"}, {"name": "Donal O'Connell"}, {"name": "Radu Roiban"}], "featured_authors": [{"name": "Asaad Elkhidir"}, {"name": "Donal O'Connell"}, {"name": "Radu Roiban"}], "author_count": 3}, {"id": "2608.07736", "category": "hep-th", "title": "Bumpy horizons from non-linear sigma models", "abstract": "We show that black hole horizons with non-constant curvature can be constructed in any even dimension, when the source of the Einstein equations is given by the stress-energy tensor of a non-linear sigma model of a particular class", "url": "https://arxiv.org/abs/2608.07736", "type": "理论", "summary": "1. 该工作证明，在任意偶数维时空中，以某一类具有特殊靶流形几何的非线性西格玛模型的能动张量作为爱因斯坦方程源，能够构造出视界曲率非恒定的黑洞解。\n2. 其核心物理在于靶流形映照的方向性自由度使源项产生各向异性应力，从而在不引入奇异物质的情况下支撑“凹凸”视界几何，突破传统恒定曲率视界的限制。\n3. 这一构造为全息对偶与引力理论中低对称性黑洞背景提供了新模型，后续可系统分析其线性稳定性、热力学性质以及所需能量条件的参数约束。", "summary_source": "deepseek", "authors": [{"name": "Fabrizio Canfora"}, {"name": "Nicolás Grandi"}, {"name": "Carla Henr\\'ıquez-Báez"}, {"name": "Julio Oliva"}], "featured_authors": [{"name": "Fabrizio Canfora"}, {"name": "Nicolás Grandi"}, {"name": "Carla Henr\\'ıquez-Báez"}, {"name": "Julio Oliva"}], "author_count": 4}, {"id": "2608.07774", "category": "hep-th", "title": "Incidence Relations for Self-Dual Black Holes", "abstract": "In Penrose's nonlinear graviton construction, a self-dual spacetime arises as the moduli space of holomorphic twistor lines in curved twistor space, whose explicit parametrization is concretely given by the incidence relation. We demonstrate a concrete local construction of the incidence relations for self-dual black hole spacetimes in Kerr-Schild coordinates: Eguchi-Hanson, self-dual Taub-NUT, and self-dual Plebański-Demiański. This is facilitated by implementing the Dunajski-Mason recursion in the framework of Plebański's second heavenly equation, for which we explicitly find the Plebański scalar. Our results describe closed-form formulae. Notably, for the self-dual Taub-NUT solution, the exact incidence relation exhibits linear dependence on the gravitational coupling. The construction of zero-rest-mass fields on self-dual black hole backgrounds is briefly sketched as an application.", "url": "https://arxiv.org/abs/2608.07774", "type": "理论", "summary": "1. 该文在Kerr-Schild坐标下为Eguchi-Hanson、自对偶Taub-NUT及自对偶Plebański-Demiański等自对偶黑洞时空具体构造了弯曲扭量空间中全纯扭量线的显式关联关系。\n2. 其技术卖点在于利用Plebański第二heavenly方程框架实施Dunajski-Mason递推，显式求出Plebański标量并给出闭式公式；尤其自对偶Taub-NUT的关联关系对引力耦合呈线性依赖。\n3. 这为自对偶黑洞背景上零静质量场的构造以及扭量几何与引力微扰的进一步联系提供了明确切入点。", "summary_source": "deepseek", "authors": [{"name": "Joon-Hwi Kim"}], "featured_authors": [{"name": "Joon-Hwi Kim"}], "author_count": 1}, {"id": "2608.07907", "category": "hep-th", "title": "Four-Fermion Condensates in Curved Spacetimes: A Functional Approach", "abstract": "Four-fermion interactions appear in effective descriptions of particle physics, many-body systems, and gravitational theories with fermions. Although the same local operator may enter perturbative scattering, a vacuum Nambu-Jona-Lasinio (NJL) instability, or finite-density Bardeen-Cooper-Schrieffer (BCS) pairing, these regimes are distinguished by their interaction channels, quadratic kernels, and quantum states. We give a pedagogical functional account of these distinctions and compute the local one-loop contribution of a scalar-channel NJL mean field to the energy-momentum tensor in curved spacetime. We first display the state data in the in-out functional and construct the closed-time-path functional required for an in-in expectation value. For the NJL saddle, a Hubbard-Stratonovich field shifts the fermion mass, and the parity-even Dirac determinant generates local volume, curvature, and curvature-squared operators. We find the covariant quantum effective action before specializing to a spatially flat FLRW background and derive the corresponding energy density and pressure. The constant-condensate limit agrees with the direct flat-space mean-field calculation. We also explain which additional state and channel data are required for finite-density BCS pairing and comment on renormalization conditions in curved spacetimes.", "url": "https://arxiv.org/abs/2608.07907", "type": "理论", "summary": "1. 该工作用泛函方法统一刻画弯曲时空中四费米子凝聚的NJL与BCS通道区别。\n2. 其卖点是构造闭路泛函并计算标量通道平均场对能动张量的局域单圈贡献。\n3. 这为弯曲时空中的费米子凝聚、重整化条件及有限密度BCS配对提供清晰框架。", "summary_source": "deepseek", "authors": [{"name": "Stephon Alexander"}, {"name": "Heliudson Bernardo"}, {"name": "Jiatong Yan"}], "featured_authors": [{"name": "Stephon Alexander"}, {"name": "Heliudson Bernardo"}, {"name": "Jiatong Yan"}], "author_count": 3}, {"id": "2608.07919", "category": "hep-th", "title": "One gravity theory on the two-dimensional p-adic space and conjectures on $p$-adic AdS/CFT", "abstract": "By means of a higher-dimensional embedding approach, together with the study of distance, measure, and curvature, we construct a gravitational theory on the two-dimensional space over $p$-adic numbers. Before obtaining the final gravitational theory, we supplement some calculations based on existing literature and justify the reasonableness of the gravitational theory by comparison with the real-number case-for instance, the curvatures of de Sitter(dS), anti-de Sitter(AdS), and Euclidean spaces should be positive, negative, and zero, respectively. Finally, we put forward two conjectures: (1) $p$-adic AdS/CFT can be computed in arbitrary spaces, not only in $p$-adic AdS space($p$AdS), and the results are essentially the same; (2) $p$-adic CFT is essentially unique.", "url": "https://arxiv.org/abs/2608.07919", "type": "理论", "summary": "1. 该工作通过高维嵌入并结合距离、测度与曲率分析，在二维p进数空间上构造了引力理论。\n2. 其技术要点是以实数为参照检验曲率符号等几何性质，并据此提出p进AdS/CFT可在任意空间计算且结果本质相同、p进CFT本质唯一的猜想。\n3. 这为p进AdS/CFT对应在更一般p进几何背景下的成立条件及唯一性研究提供了可检验的理论框架与方向。", "summary_source": "deepseek", "authors": [{"name": "Feng Qu"}], "featured_authors": [{"name": "Feng Qu"}], "author_count": 1}, {"id": "2608.08062", "category": "hep-th", "title": "Gauge transformations in Z-space in (anti)holomorphic sector of HS theory", "abstract": "We consider a consistent deformation of the (anti)holomorphic generating system of [ arXiv:2209.01966 ], aiming to provide a map to the (anti)holomorphic truncation of the Vasiliev theory. In our new formulation, the previously rigidly defined master-field $\\Lambda$ can be shifted by $\\mathrm{d}_z$-exact projective one-forms. The class of projective one-forms is described comprehensively, and corresponding projective identities are proven. $\\mathrm{d}_z$-exact forms of the order $n$ in $C$ induce field redefinition of order $(n+1)$ and beyond. Explicit expression for the $(n+1)$-th order field redefinitions are provided. An analysis of the gauge transformation of the second order in $C$ in zero-forms is performed, identifying necessary and sufficient conditions for the part of the field redefinition of the second order that can be gauged away. The field redefinitions induced by the shift of $\\Lambda$ are proven to be nontrivial.", "url": "https://arxiv.org/abs/2608.08062", "type": "理论", "summary": "1. 该工作提出了（反）全纯产生系统的一致形变，目标是建立到Vasiliev理论（反）全纯截断的显式映射。\n2. 其技术核心是将原先固定的主场Λ推广为可被d_z恰当射影一次形式平移，并证明n阶C形变诱导(n+1)阶及更高阶场重定义，同时给出零形式中二阶可规范掉部分的充要条件。\n3. 这为高自旋理论中Z空间规范结构及不同全纯截断间的对应提供了新的研究路径。", "summary_source": "deepseek", "authors": [{"name": "D.A. Batyaev"}, {"name": "A.V. Korybut"}], "featured_authors": [{"name": "D.A. Batyaev"}, {"name": "A.V. Korybut"}], "author_count": 2}, {"id": "2608.08292", "category": "hep-th", "title": "Complex CFTs: Holography and Interfaces", "abstract": "We investigate complex conformal field theories and interfaces between such theories, using methods of holography and two dimensional CFT. We use holography to prove the Im-flip property of complex conjugate CFTs. We construct a complex Janus solution and calculate some holographic observables. Complex RG-flow interfaces are obtained numerically. On the CFT side, complex interfaces are constructed for free boson CFTs with and without background charge. Boundary states are constructed, and transmission and reflection coefficients are calculated in both cases.", "url": "https://arxiv.org/abs/2608.08292", "type": "理论", "summary": "1. 该工作结合全息与二维共形场论，对复共形场论及此类理论之间的界面进行了系统研究。\n2. 其技术核心是用全息证明复共轭CFT的Im-flip性质，构造复Janus解与数值复RG流界面，并在含或不含背景电荷的自由玻色子CFT中构造边界态及计算透射与反射系数。\n3. 这为复共形场论中的界面物理与全息对偶提供了具体范例，并为后续研究相关临界行为与解析构造指明了起点。", "summary_source": "deepseek", "authors": [{"name": "Luis Camargo-Carlos"}, {"name": "Michael Gutperle"}], "featured_authors": [{"name": "Luis Camargo-Carlos"}, {"name": "Michael Gutperle"}], "author_count": 2}, {"id": "2608.08384", "category": "hep-th", "title": "Carrollian Quantum Mechanics: Time-like, Space-like and Hybrid Sectors", "abstract": "We develop a comprehensive theoretical framework for Carrollian quantum mechanics by performing systematic ultra-relativistic contractions of the Klein--Gordon equation in the limit $c \\to 0$. This limiting process uncovers three distinct sectors---time-like, space-like, and hybrid---each governed by a Carroll-invariant wave equation and accompanied by a consistent probabilistic interpretation. The time-like sector exhibits a novel temporal tunneling phenomenon, characterized by the relation $|\\mathcal{T}|^2 = 1 + |\\mathcal{R}|^2$, which reflects the indefinite character of the Klein--Gordon norm. In the space-like sector, the presence of spatial propagation necessitates a tachyonic dispersion relation, which forces the density to vanish for energy eigenstates, yielding zero-norm (null) states that gain physical relevance within Carrollian physics due to the underlying null geometric structure. The hybrid sector combines features of both sectors and admits two distinct formulations, which may be either tachyonic or non-tachyonic, and can be interpreted as an inhomogeneous Klein--Gordon equation. For all three sectors, we derive the corresponding continuity equations, probability densities, and currents, and investigate canonical quantum systems---including the particle in a box and tunneling phenomena---within the Carrollian regime.", "url": "https://arxiv.org/abs/2608.08384", "type": "理论", "summary": "1. 该工作通过c→0极限对Klein-Gordon方程做超相对论收缩，建立了Carroll量子力学的统一框架，划分出类时、类空与混合三个扇区。\n2. 核心在于各扇区的Carroll不变波动方程及概率诠释：类时扇区出现由不定模导致的|T|²=1+|R|²时间隧穿，类空扇区因空间传播要求快子色散而给出零模空态。\n3. 推导了三个扇区的连续性方程、密度与流，并用于盒中粒子及隧穿等系统，为Carroll时空下的量子现象研究提供了可推广范例。", "summary_source": "deepseek", "authors": [{"name": "Mehdi Ahmadi-Jahmani"}], "featured_authors": [{"name": "Mehdi Ahmadi-Jahmani"}], "author_count": 1}, {"id": "2608.08428", "category": "hep-th", "title": "Organizing transitions and their cascades: Generalized symmetry enforcement in massless flows or Higgs transitions", "abstract": "We study the role of generalized symmetry in massless renormalization group flows or Higgs transitions. In particular, we revisit the massless renormalization group flows in unitary minimal models, $\\mathbf{M}(p,p+1) \\rightarrow \\overline{\\mathbf{M}(p-1,p)}$ preserving the fusion ring symmetry $\\text{FR} (SU(2)_{p-2})\\subset \\mathbf{M}(p,p+1)$ where $p$ is an integer satisfying $p>3$. In this series of flows, we demonstrate that the unbroken fusion ring symmetry $\\text{FR} (SU(2)_{p-2})$ eliminates all relevant perturbations in the $\\overline{\\mathbf{M}(p-1,p)}$ model. Hence, the infrared theory $\\overline{\\mathbf{M}(p-1,p)}$ is stable at the level of the scaling analysis and can be interpreted as a (weak-)symmetry-enforced gapless phase in contemporary theoretical physics. Phenomenologically, by the folding trick, the unbroken fusion ring symmetry corresponds to a (half-)integer spin nonsimple current, a variant of the Cooper pair involving nonabelian anyons generated from the coset or level-rank duality structures. Moreover, we demonstrate that the structure of (half-)integer spin nonsimple current plays a fundamental role in causing the resonance effect of relevant and dangerously irrelevant perturbations. This resonance effect may result in the cascade of phase transitions (or the system flows to unexplored fixed points), and the symmetry can be a stopper of such unconventional flows.", "url": "https://arxiv.org/abs/2608.08428", "type": "理论", "summary": "1. 该工作研究幺正极小模型质量流与Higgs跃迁中广义对称性对红外稳定性的约束，并重访特定融合环对称性保护的质量流系列。\n2. 其核心在于证明未破缺的融合环对称性FR(SU(2)_{p-2})消除所有相关微扰，使红外模型成为受对称性强制的无能隙相；折叠技巧下该对称对应半整数自旋非简单流，类似含非阿贝尔任意子的库珀对变体。\n3. 该机制可导致相关与危险无关微扰的共振效应，从而引发相变级联或流向未知不动点，而广义对称性能阻止此类非传统流动，为探索新物态提供线索。", "summary_source": "deepseek", "authors": [{"name": "Yoshiki Fukusumi"}, {"name": "Yuma Furuta"}], "featured_authors": [{"name": "Yoshiki Fukusumi"}, {"name": "Yuma Furuta"}], "author_count": 2}, {"id": "2608.08593", "category": "hep-th", "title": "Conformally mapping HKLL to flat space", "abstract": "We study two conformal images of the HKLL reconstruction problem for a conformally coupled scalar on AdS$_3$. The first mapping is to a Dirichlet problem on one half of the Einstein static universe. A further conformal transformation maps this half-ESU problem to a massless scalar in a region of $(2+1)$-dimensional Minkowski space bounded by an uniformly accelerated circular Dirichlet mirror. However, the global HKLL problem, the resulting flat-space problem is not a generic local mirror problem with arbitrary boundary data. Rather, the mirror response data must belong to a restricted spectral class inherited from normalizable global AdS modes. We formulate and solve this restricted mirror problem intrinsically in flat space. In the process, we find an example of a valid smearing function which itself does not satisfy the equations of motion. We further consider AdS-Rindler wedge reconstruction. By conformal mapping to an appropriate coordinate system in flat space, we find a simple way to see the blow-up of the smearing function.", "url": "https://arxiv.org/abs/2608.08593", "type": "理论", "summary": "1. 该工作通过共形映射将AdS3中共形耦合标量的HKLL重构问题转化为平坦时空中的受限镜像问题，并进一步处理了AdS-Rindler楔的重构。\n2. 其技术核心是在平坦空间中内蕴求解边界数据属于由整体AdS模式继承的受限谱类的镜像问题，并给出一个不满足运动方程但有效的smearing函数实例。\n3. 这为全息重构中smearing函数的奇性分析及非局域镜像问题的系统研究提供了可推广的范例。", "summary_source": "deepseek", "authors": [{"name": "Nirmalya Kajuri"}, {"name": "Rhitaparna Pal"}], "featured_authors": [{"name": "Nirmalya Kajuri"}, {"name": "Rhitaparna Pal"}], "author_count": 2}, {"id": "2608.08660", "category": "hep-th", "title": "Thermodynamic stability and geometric thermodynamics of charged black holes in Rastall-massive gravity under quintessence", "abstract": "In the present paper, we derive a new charged black hole solution embedded in a quintessence field within a framework combining the Rastall and massive gravity in an asymptotically flat spacetime. We interpret the integration constant associated with the structural properties of the quintessence field as a thermodynamical variable. In this context, several limiting cases have been explored with the aim to shed light on the role of the model parameters. Then, we analyse the thermodynamic properties and stability of the charged black holes in flat spacetime, where the quintessence field is characterized by the state parameter \\( \\omega_q = -2/3 \\). Detailed studies are perfomed to see how the various parameters affect phase transitions between small and large black holes. In particular, we establish a connection between the impact parameter and unstable circular photon orbits with the thermodynamic phase transitions. Our analysis suggest that the photon sphere observables could remarkably provide an indirect observational signature of black hole thermodynamic critical transitions. Generally, thanks to the effective contribution of the quintessence parameter, we found that the overall thermodynamic behavior basically resembles that of the charged RN--AdS black hole with thermal features analogous to of a Van der Waals fluid ones. Finally, we have checked these findings using thermodynamic geometry with the Quevedo metric. Our results showed that the critical behaviour derived from the standard thermodynamics is fully consistent with geothermodynamics description, where the phase structure and divergence points exactly coincide with those identified from heat capacity and Gibbs free energy analyses.", "url": "https://arxiv.org/abs/2608.08660", "type": "理论", "summary": "1. 该工作基于Rastall-大质量引力与精质场，在渐近平直时空中构建了带电荷黑洞的新解析解，并将精质场积分常数诠释为热力学变量。\n2. 核心卖点是结合热力学几何与Quevedo度规，系统验证了小-大黑洞相变、热容与吉布斯自由能的临界性质与几何热力学完全一致，并建立不稳定圆光子轨道与相变的关联。\n3. 其最有价值的启示是光子球可观测量的临界特征可充当黑洞热力学相变的间接天文探针，为在强引力观测中检验修改引力模型提供可行途径。", "summary_source": "deepseek", "authors": [{"name": "Mohamed Chabab"}, {"name": "Samir Iraoui"}, {"name": "Hicham Sriba"}], "featured_authors": [{"name": "Mohamed Chabab"}, {"name": "Samir Iraoui"}, {"name": "Hicham Sriba"}], "author_count": 3}, {"id": "2608.08669", "category": "hep-th", "title": "An explicit four-corner dictionary for (2,p) minimal Liouville gravity", "abstract": "(2,p) minimal Liouville gravity admits four algebraic descriptions interrelated by dualities. On the Frobenius manifold (FM) side the theory is built either on the $A_{1}$ manifold of $Q(y)=y^{2}+u_{1}$ ($y$-side) or on the $A_{p-1}$ manifold in the variable $x$ ($x$-side). On the spectral curve / topological recursion (SC) side the analogous choice is the Chebyshev curve and its $x \\leftrightarrow y$ swap. FM-$y$, SC-$y$ require a resonance transformation between the KdV times and the Liouville couplings, while the other two do not. We work out the explicit correspondence between the four approaches at the level of the dispersionless tau-function. The normalisation-independent three-point ratios agree with conformal field theory in all four formulations, and matching the full amplitudes fixes a single per-insertion factor reproducing the signed Verlinde matrices. The $x \\leftrightarrow y$ swap relating the two spectral curve descriptions, recently established in general by Dekinga, Shadrin and Verlinde, is realised at genus zero as a tree-level frame change of the generalised Kontsevich integral transform with potential $\\Phi^{p}/p$. The derivation is validated across (2,5)--(2,11) models.", "url": "https://arxiv.org/abs/2608.08669", "type": "理论", "summary": "1. 该工作为(2,p)极小刘维尔引力建立了四个代数描述在无色散τ函数层面的显式四角字典，涵盖Frobenius流形与谱曲线的各两种表述。\n2. 其核心在于厘清KdV时间与刘维尔耦合间共振变换的角色，并用单点插入因子复现带符号Verlinde矩阵，使x-y交换成为广义Kontsevich积分变换的树级换标架。\n3. 这为两类对偶关系的几何来源提供了可验证基准，并对更高亏格推广及其他极小模型研究具有直接借鉴意义。", "summary_source": "deepseek", "authors": [{"name": "A. Alexandrov"}, {"name": "V. Belavin"}], "featured_authors": [{"name": "A. Alexandrov"}, {"name": "V. Belavin"}], "author_count": 2}, {"id": "2608.08712", "category": "hep-th", "title": "The explicit Lorentz invariant QED pair production rates from superstrings", "abstract": "We present a new avenue to the usual Schwinger effect via the open string pair production for a system of two Dp branes with $1 \\le p \\le 6$ in Type II superstrings. The two Dp are placed parallel at a separation with one of them carrying the most general constant electromagnetic background allowed for the pair production. By taking the so-called field theory limit, we obtain systematically, from the open string pair production rate, the respective \\textit{explicit Lorentz invariant} QED pair production rate in diverse dimensions for a pair of charged/anti-charged massive particles, which can be scalars, spinors or vectors.", "url": "https://arxiv.org/abs/2608.08712", "type": "理论", "summary": "1. 该工作利用Type II超弦中两个平行Dp膜（1≤p≤6）的开弦对产生率，在取场论极限后得到各维度下显式洛伦兹不变的QED对产生率。\n2. 其物理卖点在于将最一般常电磁背景引至一对D膜之一，并系统给出标量、旋量与矢量荷电粒子的Schwinger效应结果。\n3. 该结果架起了弦论瞬子计算与QED强场对产生之间的桥梁，为多维度及不同自旋粒子的非微扰对产生研究提供可扩展的弦论起点。", "summary_source": "deepseek", "authors": [{"name": "J. X. Lu"}], "featured_authors": [{"name": "J. X. Lu"}], "author_count": 1}, {"id": "2608.08766", "category": "hep-th", "title": "Understanding Non-Split 2-Group Symmetry: (3+1)D SymTFT, Anomaly and Bordism", "abstract": "We present a systematic study of finite, non-split 2-group symmetries with a non-trivial Postnikov class, focusing on the simplest example with a $\\mathbb{Z}_2$ 0-form symmetry and a $\\mathbb{Z}_2$ 1-form symmetry, intertwined together by the non-trivial Postnikov class in $H^3(B\\mathbb{Z}_2;\\mathbb{Z}_2)\\cong\\mathbb{Z}_2$, denoted by $\\mathcal{G}$. We classify the anomalies of this 2-group symmetry for physical theories in $d$-dimensional spacetime, by computing the oriented bordism groups $\\Omega_{d+1}^{\\rm SO}(B\\mathcal{G})$ and the spin bordism groups $\\Omega_{d+1}^{\\rm Spin}(B\\mathcal{G})$ for $d\\leq 5$. For the case of $d=3$, we investigate the Symmetry TFT/TO of the 2-group symmetry $\\mathcal{G}$ using the language of fusion 2-categories, as well as (3+1)D TQFT actions, for the cases without or with the 2-group anomaly classified by $\\operatorname{Hom}\\left(\\widetilde{\\Omega}_4^{\\rm SO}(B\\mathcal{G}),U(1)\\right) \\cong H^4(B\\mathcal{G};U(1))\\cong\\mathbb{Z}_2$. We classify the minimal topological and physical boundary conditions of the Symmetry TFTs, and carry out the categorical Landau paradigm for such non-split finite 2-group.", "url": "https://arxiv.org/abs/2608.08766", "type": "理论", "summary": "1. 该工作系统研究了非平凡Postnikov类耦合的有限非分裂2-群对称性，以Z2 0-形式与Z2 1-形式对称性的具体模型为例，利用SO与Spin配边群对d≤5维反常进行分类。\n2. 其技术核心是在(3+1)维用融合2-范畴与TQFT作用构造该2-群对称性的对称拓扑场论，并分类最小拓扑与物理边界条件，完成范畴化朗道范式。\n3. 这为高维广义对称性及其反常与拓扑相的完整分类提供了可推广的配边与SymTFT框架，可直接启发后续理论与格点模型研究。", "summary_source": "deepseek", "authors": [{"name": "Zhenbang Gu"}, {"name": "Ran Luo"}, {"name": "Yi-Nan Wang"}, {"name": "Yi Zhang"}], "featured_authors": [{"name": "Zhenbang Gu"}, {"name": "Ran Luo"}, {"name": "Yi-Nan Wang"}, {"name": "Yi Zhang"}], "author_count": 4}, {"id": "2608.08780", "category": "hep-th", "title": "3d $\\mathcal N=4$ rank-zero mirror symmetry, TQFT interfaces, and Zagier duality of Nahm sums", "abstract": "Starting from the $(E_8,T_1)$ Nahm sum for the vacuum character of $T_{10}M_{\\rm eff}(11,2)$, we construct a three-dimensional (3d) $\\mathcal N=2$ $U(1)^8$ Chern--Simons matter theory $\\mathcal T$ with level matrix $C_{E_8}$. Its $A$-twisted vacuum half-index reproduces the character exactly, while four distinguished Wilson loop half-indices agree with the remaining characters to the orders checked. Applying particle--vortex duality and gauging yields a second 3d $\\mathcal N=2$ Chern--Simons matter theory $\\mathcal T^\\vee$ with level matrix $C_{E_8}^{-1}$. Exact superconformal-index matching supports the claim that the two theories flow to 3d $\\mathcal N=4$ rank-zero mirror SCFTs. For the $(\\mathcal D,D_c)$ boundary condition, the mirror map between the $A$-twisted Wilson loop half-indices of $\\mathcal T$ and the $B$-twisted Wilson loop half-indices of $\\mathcal T^\\vee$ coincides componentwise with the Zagier transformation, realizing a Zagier duality between the complete $(E_8,T_1)$ and $(T_1,E_8)$ Nahm systems. Using the Bethe-equation formalism, we show that the corresponding $A/B$-twisted TQFT data agree up to orientation reversal and the $E_8$ framing phase $e^{-2\\pi \\mathrm{i}/3}$. The duality interface gives the torus bilinear $Z_{\\mathcal I}(\\tau)=\\sum_i\\chi_i(\\tau)\\chi_i^\\vee(\\tau)=\\chi_{(E_8)_1}(\\tau)$, where $\\{\\chi_i\\}$ and $\\{\\chi_i^\\vee\\}$ are the corresponding five-component character bases. Thus Zagier duality is realized as part of a concrete 3d mirror and interface structure.", "url": "https://arxiv.org/abs/2608.08780", "type": "理论", "summary": "1. 该工作从(E8,T1) Nahm和构造了一个3d N=2 U(1)^8 Chern–Simons物质理论，其A-twisted真空半指标精确重现真空特征标，四个Wilson圈半指标也对应其余特征标。\n2. 通过粒子-涡旋对偶与规范获得第二套理论，超共形指标匹配支持两者流向3d N=4 rank-zero镜像SCFT；在(D,Dc)边界条件下，A/B-twisted Wilson圈映射逐分量等同Zagier变换，实现完整Nahm系统间的Zagier对偶。\n3. Bethe方程形式下A/B-twisted TQFT数据在定向反转与E8 framing相因子下一致，对偶界面给出环面双线性等于(E8)1特征标，提示Zagier对偶可嵌入具体三维镜像与界面结构。", "summary_source": "deepseek", "authors": [{"name": "Yutaka Yoshida"}], "featured_authors": [{"name": "Yutaka Yoshida"}], "author_count": 1}, {"id": "2608.08792", "category": "hep-th", "title": "Running soft theorems in effective field theory", "abstract": "We study soft theorems for photons and pions with local effective field theory (EFT) corrections up to one loop order. In massive QED with a dimension-five Pauli operator, the local analytic part of the subleading soft photon theorem is renormalized by the hard integration region. On the other hand, as was previously known, the logarithmic soft terms do not receive corrections from higher-dimensional operators. We find that analogous structure appears in the double-soft pion theorem: the coefficients of logarithmic contributions are controlled entirely by the Nonlinear Sigma Model (NLSM) Lagrangian, while the Wilson coefficients of four-derivative operators in Chiral EFT appear in local subleading terms, in a form that is dictated by their RG equations.", "url": "https://arxiv.org/abs/2608.08792", "type": "理论", "summary": "1. 该工作在一圈阶研究含局域有效场论修正的光子与π介子软定理，涉及带五维 Pauli 算符的大质量 QED 及手征有效理论中的双软π过程。\n2. 核心结果：硬积分区使次领头软光子定理的局域解析部分重整化，而对数软项不受高维算符修正；双软π定理的对数项系数完全由 NLSM 拉氏量决定，四导数算符 Wilson 系数则经其 RG 方程进入局域次领头项。\n3. 这一结构揭示软定理跑动行为与 EFT 低能常数的联系，为约束手征微扰论中的 Wilson 系数并推广软定理至更高阶提供了明确方向。", "summary_source": "deepseek", "authors": [{"name": "Jonah Berean-Dutcher"}, {"name": "Maria Derda"}, {"name": "Riley Stewart"}], "featured_authors": [{"name": "Jonah Berean-Dutcher"}, {"name": "Maria Derda"}, {"name": "Riley Stewart"}], "author_count": 3}, {"id": "2608.08837", "category": "hep-th", "title": "Holography in flipped AdS/$\\mathbb{Z}$: Another approach to dS holography", "abstract": "Motivated by the subtleties in the conventional dS/CFT correspondence, we explore analytic continuation as a constructive route to de Sitter holography. We show that quantum field theories in de Sitter space and in a spacetime that we call flipped $\\mathrm{AdS}/\\mathbb{Z}$ (fAdS) are related by analytic continuation. We then develop a holographic description of fAdS in terms of a boundary theory referred to as flipped CFT (fCFT). In particular, we construct the extrapolate dictionary for general asymptotically fAdS spacetimes and compute the holographic two-point functions, finding agreement with an independent derivation based on the conformal symmetry of fCFT. The analytic continuation relation between fAdS and dS further suggests that fCFT may provide a starting point for an alternative holographic description of de Sitter physics. As a nontrivial check of this picture, we show that the Cardy formula of fCFT$_2$ reproduces the Bekenstein--Hawking entropies of the cosmological horizons in both pure dS$_3$ and Kerr-dS$_3$.", "url": "https://arxiv.org/abs/2608.08837", "type": "理论", "summary": "1. 该工作提出以解析延拓构造de Sitter全息对应的方案，建立翻转AdS/Z（fAdS）与dS中量子场论的联系，并发展其边界fCFT描述。\n2. 技术核心是建立一般渐近fAdS时空的外推词典并计算全息两点函数，结果与fCFT共形对称性的独立推导一致，且fCFT_2的Cardy公式复现dS_3与Kerr-dS_3宇宙学视界的Bekenstein-Hawking熵。\n3. 这为dS全息提供了替代性边界理论出发点，或可进一步推广至更高维及更一般dS时空的量子引力检验。", "summary_source": "deepseek", "authors": [{"name": "Bin Chen"}, {"name": "Zezhou Hu"}, {"name": "Xin-Cheng Mao"}, {"name": "Shan-Ming Ruan"}], "featured_authors": [{"name": "Bin Chen"}, {"name": "Zezhou Hu"}, {"name": "Xin-Cheng Mao"}, {"name": "Shan-Ming Ruan"}], "author_count": 4}, {"id": "2608.08855", "category": "hep-th", "title": "Numerical Study of Scalar Field Theory on the Fuzzy Onion", "abstract": "We study the behaviour of the scalar field theory on the fuzzy onion model -- a three-dimensional matrix model consisting of concentric fuzzy spheres of gradually increasing radii. We use a numerical method of Hamiltonian Monte Carlo simulations to study the phase structure of this theory. We identify the field phases, investigate and describe a phenomenon of dynamical phase transitions and attempt to reconstruct phase transition lines. We compare the results with the well-studied phase structure of the fuzzy sphere. Finally, we identify two boundaries on the phase transitions of the theory, a uniform phase boundary and a critical boundary between the disordered and non-uniform phase.", "url": "https://arxiv.org/abs/2608.08855", "type": "理论", "summary": "1. 该工作利用哈密顿蒙特卡罗数值方法，系统研究了由半径逐渐增大的同心模糊球堆叠而成的三维矩阵模型——“模糊洋葱”上的标量场论，绘制相图并识别出不同场位形相。\n2. 其主要结果是在相图中标定均匀相边界以及无序相与非均匀相之间的临界边界，观察到动态相变现象，并尝试重构相变线，且与模糊球已知相结构进行了系统比较。\n3. 这为非交换时空及矩阵几何中的标量场相变研究提供了可扩展的数值路径与对照基准，也为探索模糊几何与物质场相互作用带来了明确启发。", "summary_source": "deepseek", "authors": [{"name": "Matej Hrmo"}, {"name": "Samuel Kováčik"}, {"name": "Juraj Tekel"}], "featured_authors": [{"name": "Matej Hrmo"}, {"name": "Samuel Kováčik"}, {"name": "Juraj Tekel"}], "author_count": 3}, {"id": "2608.08870", "category": "hep-th", "title": "Production of Primordial Black Holes in the Double D3-Brane - anti-D3-Brane Inflation Model", "abstract": "A natural extension of the successful $D3$-${\\bar D}3$-brane inflation model in string theory is one with two $D3$-${\\bar D}3$-brane pairs, giving rise to a novel feature in string-theory. When the first pair annihilates, $D1$-strings and $F1$-strings are produced. Following the non-commutative geometric properties in string theory, it is shown by Myers that the presence of the $D3$-charge field strength of the remaining $D3$-${\\bar D}3$-brane pair leads to the formation of dielectric $3$-branes -- neutral, finite-size bound states of $3$-branes with $D1$-strings. They behave as matter with little or no pressure. Spanning a wide range of masses, they seed primordial black holes in the early universe.", "url": "https://arxiv.org/abs/2608.08870", "type": "理论", "summary": "1. 该工作提出在弦论的双D3-anti-D3膜暴涨模型中，第一对膜湮灭时产生D1弦与F1弦，从而引入新的弦论宇宙学特征。\n2. 其技术卖点在于利用非对易几何的Myers效应，使剩余膜对的D3荷场强将D1弦演化为电介质3-膜，即中性且具有有限尺寸的束缚态，并表现为几乎无压的物质。\n3. 这些束缚态覆盖广泛的质量范围，可在早期宇宙充当原初黑洞种子，为弦论暴涨模型提供可检验的暗物质与引力波观测窗口。", "summary_source": "deepseek", "authors": [{"name": "S.-H. Henry Tye"}], "featured_authors": [{"name": "S.-H. Henry Tye"}], "author_count": 1}, {"id": "2608.08972", "category": "hep-th", "title": "Matrix Multiverses Meet Multiple Mythologies", "abstract": "We present a model in which asymptotically de Sitter universes of various types, and de Sitter (dS) radii $R_n$, live in the interiors of black holes in a maximally entropic flat $p = \\rho$ Friedmann-Robertson-Walker universe. These dS universes clearly have many quantum states. We argue that they decay and equilibrate with the maximal entropy universe on time scales of order $\\alpha_n R_n {\\rm ln} (R_n /\\delta_n)$, where $\\alpha_n$ are model-dependent dimensionless constants and $\\delta_n$ are the initial distances between the shell, satisfying the Israel junction conditions, and the dS horizon. These are time-scales as viewed by a detector following a trajectory far from the would-be cosmological horizon. These times are all exponentially shorter than dS recurrence times, which have no meaning in this model. It is impossible for a detector inside one of the dS universes to determine whether it is actually part of such a structure. This model could be used as the basis for claiming that certain constants of nature or cosmological initial conditions were chosen to have mathematically unnatural values because other values could not lead to any form of intelligent life.", "url": "https://arxiv.org/abs/2608.08972", "type": "理论", "summary": "1. 该工作提出一个模型：不同半径的德西特宇宙位于最大熵平坦p=ρFRW宇宙的黑洞内部。\n2. 其核心是推导出衰变时标α_n R_n ln(R_n/δ_n)，远短于德西特重现时标，且内部探测器无法分辨自身所处结构。\n3. 这为解释某些自然常数或宇宙初始条件具有非自然值提供了新的人择论证基础。", "summary_source": "deepseek", "authors": [{"name": "Sidan A"}, {"name": "Tom Banks"}, {"name": "Willy Fischler"}], "featured_authors": [{"name": "Sidan A"}, {"name": "Tom Banks"}, {"name": "Willy Fischler"}], "author_count": 3}, {"id": "2608.09017", "category": "hep-th", "title": "Superselected ghost theory: perturbation theory", "abstract": "A superselection rule based on an exact ghost parity can endow a ghost QFT with a probability interpretation. However, this ghost parity is not respected at finite order in the standard perturbative expansion. A ghost-parity-preserving perturbation theory (Z$_2$PT) is obtained through a similarity transformation of the Hamiltonian, $h=g H g^{-1}=h_0+h_1+h_2+...$. The resulting expansion is reminiscent of old-fashioned perturbation theory (OFPT) with some significant differences. The superselection rule selects the principal-value prescription for cross-sector energy denominators, with the prescription determined by the type of transition rather than the particle species. At third order, products of $h_1$ and $h_2$ combine with $h_3$ to reproduce OFPT away from vanishing denominators. At fourth order, when $h_1=0$, we show that $h_2^2$ and $h_4$ satisfy the analogous relation. Contact terms from vanishing denominators distinguish Z$_2$PT from OFPT but do not alter the local primitive UV divergences through these orders.", "url": "https://arxiv.org/abs/2608.09017", "type": "理论", "summary": "1. 该工作提出一种保持鬼宇称超选择规则的微扰论（Z₂PT），通过对哈密顿量实施相似变换，使原本缺乏概率诠释的鬼量子场论获得一致性框架。\n2. 其技术卖点在于超选择规则将跨扇区能级分母固定为主值积分，处方由跃迁类型而非粒子种类决定；三阶时h₁与h₂乘积协同h₃、四阶时h₂²与h₄满足类似恒等式，接触项虽区分Z₂PT与旧式微扰论却保持局域原初紫外发散不变。\n3. 该框架为鬼场论的概率诠释和微扰展开的奇异性处理提供了新途径，并可能拓展至量子引力或约束规范系统的有效场论研究。", "summary_source": "deepseek", "authors": [{"name": "Bob Holdom"}], "featured_authors": [{"name": "Bob Holdom"}], "author_count": 1}, {"id": "2608.09056", "category": "hep-th", "title": "Long-range multipartite entanglement in holographic gapless systems", "abstract": "Gapless quantum systems support correlations over arbitrarily long distances, giving rise to power-law long-range entanglement. We investigate long-range entanglement at strong coupling for three-dimensional gapless systems using holography, asking whether multipartite entanglement can exhibit scale-growing behavior and become enhanced at large distances. We show that a broad class of multipartite entanglement quantities share the same leading large-distance scaling exponent determined by the IR geometry. To realize different scaling regimes, we consider hyperscaling-violating IR geometries. Depending on the parameters, long-distance multipartite entanglement can decay, become logarithmic, grow subextensively, or reach a volume law. We also analyze an anisotropic IR geometry \\(\\mathrm{AdS}_{3}\\times\\mathbb{R}^{2}\\), where long-range multipartite entanglement survives along one direction but becomes short-ranged in the transverse gapped directions. These results show that holographic gapless phases can support rich and enhanced long-range multipartite entanglement, providing a nonlocal characterization of the underlying IR physics.", "url": "https://arxiv.org/abs/2608.09056", "type": "理论", "summary": "1. 该工作利用全息对偶研究强耦合三维无间隙系统中长程多体纠缠，并考察超标度破坏与各向异性红外几何下的尺度行为。\n2. 核心结果是一类多体纠缠量具有由红外几何决定的统一大距离标度指数，且随参数可衰减、对数增长、次广延增长或达到体积律。\n3. 这为无间隙强关联相提供了基于非局域纠缠的红外物理刻画，并可启发对更多全息或量子格子模型中长程多体纠缠的研究。", "summary_source": "deepseek", "authors": [{"name": "Xiantong Chen"}, {"name": "Xuanting Ji"}, {"name": "Xin-Xiang Ju"}, {"name": "Wen-Peng Li"}, {"name": "Ya-Wen Sun"}], "featured_authors": [{"name": "Xiantong Chen"}, {"name": "Xuanting Ji"}, {"name": "Xin-Xiang Ju"}, {"name": "Wen-Peng Li"}, {"name": "Ya-Wen Sun"}], "author_count": 5}, {"id": "2608.09304", "category": "hep-th", "title": "Holographic multipartite entanglement dynamics in AdS$_3$-Vaidya", "abstract": "We study how multipartite entanglement is dynamically reorganized during holographic thermalization following a global quench in AdS$_3$/CFT$_2$. We first use the $n$-partite information $(-1)^n I_n$ to probe collective multipartite entanglement in holographic configurations where the full $n$-region entanglement wedge is connected while all fewer-party ones are disconnected, thereby excluding fewer-party contributions. The spatial range of multipartite entanglement first expands and then contracts as the system approaches its late-time locally thermal state. Entanglement involving different numbers of parties develops on comparable early-time scales, while the entanglement that involves more parties relaxes more slowly, revealing a transient propagation from shorter to longer spatial distances. We further compute the Markov gap and the genuine tripartite multi-entropy as complementary probes of tripartite entanglement. The Markov gap can remain enhanced after local thermalization, whereas the genuine tripartite multi-entropy undergoes a nonmonotonic evolution and returns to its vacuum value for the adjacent tripartition considered in this work. These results show that a global quench redistributes the entanglement across spatial scales and reorganizes its multipartite structure.", "url": "https://arxiv.org/abs/2608.09304", "type": "理论", "summary": "1. 该工作借助AdS$_3$-Vaidya时空，研究AdS$_3$/CFT$_2$中全局淬火后多体纠缠在热化过程中的动力学重组。\n2. 其物理卖点是以$n$部信息为探针，在完整纠缠楔连通而少体楔均不连通的构型中排除少体贡献，发现多体纠缠空间范围先增大后收缩，且参与体数越多弛豫越慢。\n3. 此外，马尔可夫间隙在局域热化后仍可增强，而相邻三划分的真三体多熵非单调演化并回到真空值，说明全局淬火将纠缠按空间尺度与多体结构重新组织。", "summary_source": "deepseek", "authors": [{"name": "Xin-Xiang Ju"}, {"name": "Ya-Wen Sun"}, {"name": "Yang Zhao"}, {"name": "Hao-Ran Zhou"}], "featured_authors": [{"name": "Xin-Xiang Ju"}, {"name": "Ya-Wen Sun"}, {"name": "Yang Zhao"}, {"name": "Hao-Ran Zhou"}], "author_count": 4}, {"id": "2608.09598", "category": "hep-th", "title": "Nonperturbative Stabilization of D-Instantons in the Bosonic IIB Matrix Model", "abstract": "We study the bosonic type IIB (IKKT) matrix model and the fate of the D-instanton positions $p^{(i)}_\\mu$, the diagonal components of the $d$ Hermitian matrices, whose one-loop effective potential infamously drives them to a single point. We argue that this collapse is an artifact of the leading (one-loop) truncation, while the actual non-collapse of the $p^{(i)}_\\mu$ is a nonperturbative effect: it is invisible at one loop but already present in the exact (all-loop) two-body interaction. Since the two-body sector of the $N\\times N$ model factorizes into copies of $N=2$, this interaction is captured exactly by the $\\mathrm{U}(2)$ model, and we find that the two D-instantons do not collapse onto each other. To set up the computation, we gauge-fix the $\\text{U}(N)$ symmetry in a way that keeps the diagonal and off-diagonal sectors distinct, and we handle the residual $\\mathrm{U}(1)^N$ symmetry with an auxiliary-ghost BRST construction. This construction generates a new ghost four-leg vertex; the resulting Faddeev-Popov determinant admits a systematic large-separation expansion that organizes the effective potential into a many-body decomposition, separating the interaction into two-body, three-body, and higher-body contributions. The exact $N=2$ partition function is finite at finite separation; its naive Lorenz-gauge form develops a negative region at separations of order one, which we trace to a Gribov ambiguity of the Lorenz gauge and resolve with the maximal diagonal gauge--the classical frame containing the perturbative vacuum--where the short-distance force is finite and repulsive, so that the two-body potential develops a stable minimum at finite separation. These results are consistent with a stable, non-collapsed distribution of the $p^{(i)}_\\mu$; establishing the detailed distribution and full $N$-body non-collapse requires the higher-body potentials and is left to future work.", "url": "https://arxiv.org/abs/2608.09598", "type": "理论", "summary": "1. 该工作研究玻色型IIB（IKKT）矩阵模型中D-瞬子位置（厄米矩阵对角元）的动力学，论证其单圈有效势导致的单点塌缩是微扰截断的假象，真实行为由非微扰效应决定。\n2. 卖点在于利用N=2（U(2)）扇区精确刻画全圈两体相互作用，通过辅助鬼BRST构造处理残余U(1)^N并展开大分离多体分解，且以最大对角规范消除Lorenz规范的Gribov歧义，得到短程排斥力与有限分离稳定极小。\n3. 结果为稳定的非塌缩D-瞬子分布提供坚实非微扰证据，并明确将完整分布与多体修正留待含更高阶势的后续研究。", "summary_source": "deepseek", "authors": [{"name": "Yu-An Chen"}, {"name": "Hikaru Kawai"}, {"name": "Henry Liao"}, {"name": "Cheng-Tsung Wang"}], "featured_authors": [{"name": "Yu-An Chen"}, {"name": "Hikaru Kawai"}, {"name": "Henry Liao"}, {"name": "Cheng-Tsung Wang"}], "author_count": 4}, {"id": "2608.09776", "category": "hep-th", "title": "Schwinger-Keldysh effective field theory of type-B Goldstone: near-diagonal geometry and Berry term", "abstract": "In this work, we formulate a finite temperature Schwinger-Keldysh effective field theory for type-B Goldstone modes. In particular, we organize the required two time contour structure by a near-diagonal geometry in which the r-type field is interpreted as the physical Goldstone configuration and the a-type field is identified as corresponding tangent displacement. Within this geometric viewpoint, the Berry term essential for type-B Goldstones is obtained directly through the transgression of the Berry curvature. Moreover, we show that this exact Berry transgression is compatible with dynamical KMS condition. In order to construct the conservative, dissipative and noise sectors, we classify possible tensors globally defined on the coset manifold. Based on this framework, we discuss in detail two concrete model examples. The dispersion relations of the Goldstone modes and the associated two-point correlation functions are calculated in the presence of dissipation.", "url": "https://arxiv.org/abs/2608.09776", "type": "理论", "summary": "1. 该工作为B类戈德斯通模建立了有限温度Schwinger-Keldysh有效场论。\n2. 其核心是将双时间轮廓组织为近对角几何，把r型场解释为物理戈德斯通位形、a型场解释为切向位移，从而由Berry曲率的transgression直接导出Berry项，并证明其满足动态KMS条件。\n3. 基于余流形上的整体张量分类构建守恒、耗散与噪声项后，文中计算了耗散下两个示例模型的色散关系与两点关联函数，为开放量子多体系统的B类戈德斯通物理提供了可推广的场论框架。", "summary_source": "deepseek", "authors": [{"name": "Pei Zheng"}, {"name": "Mei Huang"}], "featured_authors": [{"name": "Pei Zheng"}, {"name": "Mei Huang"}], "author_count": 2}, {"id": "2608.09797", "category": "hep-th", "title": "Thermal Origin of Black Hole Quasinormal Modes", "abstract": "When a black hole rings after a merger, it emits gravitational waves at characteristic frequencies known as quasinormal modes (QNMs). In the eikonal limit, these modes are governed by the unstable circular light orbits that form the photon ring. In this work, we demonstrate that the ringing of a black hole has a precise thermal interpretation. A probe string propagating in the near-ring geometry acquires an induced Rindler horizon on its worldsheet, with a temperature set by the Lyapunov exponent of the photon ring. Out of this structure, the black hole QNMs emerge as therm
