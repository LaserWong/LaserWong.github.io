al excitations, so that the characteristic ringing of a black hole is the retarded response of a thermal system living on the photon ring. We explicitly derive the QNM spectrum from two complementary perspectives: microscopically, via unstable transverse worldsheet fluctuations, and macroscopically, through the pole structure of the causal response function of an open thermal quantum system.", "url": "https://arxiv.org/abs/2608.09797", "type": "理论", "summary": "1. 该工作提出黑洞准正则模的热起源诠释，证明其铃宕可由光子环附近探针弦世界体上诱导的Rindler视界描述。\n2. 其核心在于将eikonal极限下的QNM谱分别从微观不稳定横向涨落与宏观开量子系统响应函数极点两种互补途径严格导出，并识别温度为Lyapunov指数的热系统。\n3. 这为将黑洞铃宕视为光子环上热系统的延迟响应奠定了微观基础，或可推广至亚eikonal修正乃至量子引力候选理论。", "summary_source": "deepseek", "authors": [{"name": "D. Giataganas"}, {"name": "G.F. Giudice"}, {"name": "A. Kehagias"}, {"name": "F. Quevedo"}, {"name": "A. Riotto"}], "featured_authors": [{"name": "D. Giataganas"}, {"name": "G.F. Giudice"}, {"name": "A. Kehagias"}, {"name": "F. Quevedo"}, {"name": "A. Riotto"}], "author_count": 5}, {"id": "2608.09803", "category": "hep-th", "title": "Closed-form thermal threshold functions for the proper-time renormalisation group", "abstract": "We derive closed-form expressions for the thermal threshold functions of the finite-temperature proper-time renormalisation group (PTRG): until now these have been evaluated numerically, Matsubara mode by Matsubara mode. For the standard one-parameter regulator family, Poisson resummation of the Matsubara sum yields a rapidly convergent winding-number series of modified Bessel functions, and a single algebraic identity reduces every higher threshold function to this same closed form at a shifted kernel parameter. The sharp proper-time regulator, recovered as the exact $m\\to\\infty$ endpoint of the family with a controlled $O(1/m)$ approach, factorises into a field-dependent and a purely thermal piece. Built on them, the local potential approximation (LPA) and its refinement to a running anomalous dimension (LPA$'$) for the $O(N)$-symmetric theory reduce to established results, all cross-checked against the exact Wetterich equation with the optimised regulator. Two findings go beyond reduction. First, the known zero-temperature anomalous-dimension construction is extended here to finite temperature. Second, because the closed form holds for any real regulator parameter, the refined truncation's fixed point can for the first time be tracked as a continuous function of the regulator, rather than at a handful of isolated points, and is found to vary smoothly and remain bounded, with no special or pathological point anywhere on the line.", "url": "https://arxiv.org/abs/2608.09803", "type": "理论", "summary": "1. 该工作推导出有限温度固有时重整化群热阈值函数的闭式表达式，不再需要逐 Matsubara 模地数值求值。\n2. 其技术卖点在于对 Matsubara 求和实施 Poisson 重排，将热阈值函数表示为修正贝塞尔函数的快速收敛卷绕数级数，再借助一个代数恒等式把高阶阈值函数约化到同一闭式，并恢复了尖劈正规化作为参数族 m→∞ 精确端点的受控 O(1/m) 逼近。\n3. 这使 O(N) 对称理论在局域势近似及其含反常维数改进下回归已有基准，且任意实正规化参数下不动点可连续追踪、光滑有界，同时把零温反常维数构造推广到有限温度。", "summary_source": "deepseek", "authors": [{"name": "Daniele Rizzo"}], "featured_authors": [{"name": "Daniele Rizzo"}], "author_count": 1}, {"id": "2608.09858", "category": "hep-th", "title": "On the Renormalization in Conformal Quantum Gravity", "abstract": "One-loop divergences in classically conformal theory in curved spacetime is a nontrivial issue if the theory under consideration possesses gauge invariance. In this case, quantization involves introducing the gauge-fixing term and the action of ghosts, both of which are not conformal. The formal proof of the conformal invariant renormalizability in this situation, including interacting theories, has been given in the paper from 1984 by one of the present authors. Owing to BRST symmetry, the contributions of the gauge-fixing and ghost sectors to the conformal variation of the effective action cancel each other. This cancellation does not hold in the finite part of the one-loop and higher-loops effective action, that results in the anomaly. In this paper, we extend the early results on conformal matter fields in external gravitational field and apply them to conformal quantum gravity, including the case of conformal gravity coupled to other conformal matter fields. The gauge-fixing in the Weyl-squared gravity is more complicated, nevertheless, the proof of the one-loop conformal invariant renormalization using BRST symmetry is possible. As a preliminary to conformal quantum gravity, we also present a detailed general proof of conformal invariant one-loop divergences in the corresponding semiclassical theory.", "url": "https://arxiv.org/abs/2608.09858", "type": "理论", "summary": "1. 该工作将共形物质场在外引力场中的早期结论推广至共形量子引力，并涵盖其与共形物质场耦合的情形。\n2. 其要点是借助BRST对称性证明规范固定项与鬼场贡献在有效作用量的共形变化中相消，从而确立Weyl平方引力单圈共形不变重整化的可行性。\n3. 这为后续严格处理共形引力中的共形反常以及开展高圈或半经典研究提供了可靠的理论基础。", "summary_source": "deepseek", "authors": [{"name": "Ioseph L. Buchbinder"}, {"name": "Petr M. Lavrov"}, {"name": "Thomas M. Sangy"}, {"name": "Ilya L. Shapiro"}], "featured_authors": [{"name": "Ioseph L. Buchbinder"}, {"name": "Petr M. Lavrov"}, {"name": "Thomas M. Sangy"}, {"name": "Ilya L. Shapiro"}], "author_count": 4}, {"id": "2608.09918", "category": "hep-th", "title": "Ricci-flat metrics from gauged linear $σ$-models without RG flow", "abstract": "We investigate a class of Ricci-flat Kähler metrics on generalized conifolds constructed via gauged linear sigma models (GLSMs) with indefinite signature. By introducing shadow coordinates (superfields) entering the sigma model with negative signature kinetic term, we show that these GLSMs yield explicit Ricci-flat metrics on complex cones over products of projective spaces. We provide a general formula for the resulting Kähler potentials, along with detailed examples. Our results suggest new directions for the study of Calabi-Yau metrics and toric geometry, and raise interesting questions about the geometric meaning of indefinite signature models. We also give an interpretation in terms of a novel generalized Kähler gauging.", "url": "https://arxiv.org/abs/2608.09918", "type": "理论", "summary": "1. 该工作研究由不定符号规范线性σ模型（GLSM）构造的广义锥（generalized conifolds）上的里奇平坦凯勒度量，其关键做法是引入带负号动能项的影坐标超场作为额外自由度。\n2. 主要卖点在于不依赖重整化群流，直接从GLSM得到射影空间乘积上复锥的显式凯勒势通式，并通过详细算例及新型广义凯勒规范诠释给出完整构造。\n3. 这为卡拉比-丘度规与环（toric）几何提供了新构造路径，也引发关于不定符号模型几何意义及其在弦论紧化中潜在角色的进一步思考。", "summary_source": "deepseek", "authors": [{"name": "Dmitri Bykov"}, {"name": "Ondrej Hulik"}, {"name": "Ulf Lindström"}, {"name": "Martin Roček"}, {"name": "Rikard von Unge"}], "featured_authors": [{"name": "Dmitri Bykov"}, {"name": "Ondrej Hulik"}, {"name": "Ulf Lindström"}, {"name": "Martin Roček"}, {"name": "Rikard von Unge"}], "author_count": 5}, {"id": "2608.09922", "category": "hep-th", "title": "The quadratic growth of Krylov spread complexity in the BTZ black hole", "abstract": "The boundary quantity that captures the growth of black-hole interiors quantified by holographic complexity remains unknown beyond 2d dilaton gravity. We provide a critical analysis of a partition-function construction of Krylov spread complexity for thermofield-double states that provides a dimension-independent boundary reconstruction from semiclassical holographic partition functions, while developing the present dynamical and bulk construction for the BTZ saddle. In the double-scaled Sachdev-Ye-Kitaev model, where exact and semiclassical results can be compared, we show that the classical limit is reliable only when taken after the complexity has been reconstructed; taking this limit at the level of individual Lanczos coefficients discards essential information. Applying the construction to a large-central-charge two-dimensional conformal field theory above the Hawking-Page temperature dual to a Bañados-Teitelboim-Zanelli black hole, we find an intermediate departure from early-time quadratic growth followed by behavior compatible with a return toward asymptotically quadratic growth, rather than the linear late-time behavior of the volume and the standard finite-functional complexity = anything class. We then match this boundary behavior to a generalized complexity = anything bulk object built from an infinite series of extrinsic-curvature invariants. The construction provides a systematic route from black-hole thermodynamics to Krylov dynamics and can naturally be extended to higher-dimensional holographic black holes.", "url": "https://arxiv.org/abs/2608.09922", "type": "理论", "summary": "1. 该工作针对BTZ黑洞提出基于半经典配分函数重构热场双态Krylov扩散复杂度的方案，并检验了双重标度SYK模型中经典极限的适用条件。\n2. 其关键发现是大中心荷二维共形场论在Hawking-Page温度以上先偏离早期二次增长、随后回归渐进二次增长，并以无穷阶外曲率不变量构造广义复杂度体量加以匹配。\n3. 这为从黑洞热力学系统导出Krylov动力学提供了可行路径，且可自然推广至更高维全息黑洞。", "summary_source": "deepseek", "authors": [{"name": "Aranya Bhattacharya"}, {"name": "Mario Flory"}, {"name": "Michal P. Heller"}, {"name": "Emiliano Rizza"}, {"name": "Tim Schuhmann"}], "featured_authors": [{"name": "Aranya Bhattacharya"}, {"name": "Mario Flory"}, {"name": "Michal P. Heller"}, {"name": "Emiliano Rizza"}, {"name": "Tim Schuhmann"}], "author_count": 5}, {"id": "2608.07878", "category": "math-ph", "title": "Analytic Integration of the Lambert W Cosmic Fluid Model H(z) Formula", "abstract": "The Lambert $W$ (LW) model for the cosmic fluid equation of state was proposed by S. Saha and K. Bamba in 2019-2020. A recent (early 2026) paper by Dubey, et al, carries out a new fit of the LW model to observational data, in order to estimate the model's parameters. That paper exhibits a formula for the logarithm of the relative Hubble factor at redshift $z$, $\\ln(H(z)/H_0)$, which is based upon a numerical integration. That integral can be evaluated analytically, and we present the details in this working paper. The resulting analytic expression for $H(z)/H_0$ may be convenient for exploration of the LW model.", "url": "https://arxiv.org/abs/2608.07878", "type": "理论", "summary": "1. 该工作针对Saha与Bamba提出的Lambert W宇宙流体模型，对描述相对哈勃因子随红移演化的对数积分进行了严格解析求值，将原先基于数值积分的ln(H/H0)公式改写为闭式解析表达式。\n2. 其核心卖点在于利用Lambert W函数的特殊积分性质消除数值积分步骤，得到H(z)/H0的显式解析式，从而避免观测拟合中因数值积分引入的误差，并简化参数估计与模型探索。\n3. 该解析结果可望作为后续Saha-Bamba模型与超新星、宇宙微波背景等观测数据比较时的便捷工具，也为其他含特殊函数状态方程的宇宙学模型提供了可推广的精确化处理思路。", "summary_source": "deepseek", "authors": [{"name": "Ken Roberts"}, {"name": "S. R. Valluri"}], "featured_authors": [{"name": "Ken Roberts"}, {"name": "S. R. Valluri"}], "author_count": 2}, {"id": "2608.08108", "category": "math-ph", "title": "Perturbation Theory for Time-dependent Singular Quantum Systems", "abstract": "We develop a perturbative framework for time-dependent point interactions in quantum systems with purely discrete unperturbed spectrum. In two and three dimensions the point interaction is described through the renormalized resolvent obtained from heat-kernel regularization, while in one dimension the diagonal Green function is finite and no renormalization is required. Time dependence is introduced either through the interaction parameter or through the motion of the support point. In both cases we expand the non-autonomous Hamiltonian in the spectral basis of the corresponding static point-interaction problem and derive the first- and second-order pole shifts, projection corrections, and transition amplitudes. The method is illustrated by explicit examples: point interactions with time-dependent coupling, harmonic oscillators perturbed by moving point interactions, and a particle on a sphere with a moving interaction center. We also discuss the one-dimensional harmonic oscillator with a moving delta potential, showing that in the non-renormalized case the present formulation reduces to the standard time-dependent perturbation theory.", "url": "https://arxiv.org/abs/2608.08108", "type": "理论", "summary": "1. 该工作为具有纯分立无扰谱的量子系统建立了含时点相互作用的微扰论框架，覆盖二维与三维需重整化的一类奇异情形以及一维无需重整化的情形。\n2. 其技术核心是将含时非自治哈密顿量在静态点相互作用谱基下展开，给出了极点移动、投影修正与跃迁振幅至二阶的显式表达式，并结合含时耦合、谐振子与球面上的运动点相互作用等例证加以说明。\n3. 该框架可推广至奇异相互作用或几何运动诱导的非绝热过程，为量子控制与少体物理中含时奇异势的系统处理提供了可靠的理论工具。", "summary_source": "deepseek", "authors": [{"name": "Kaya Güven Akbaş"}, {"name": "Fatih Erman"}, {"name": "O. Teoman Turgut"}], "featured_authors": [{"name": "Kaya Güven Akbaş"}, {"name": "Fatih Erman"}, {"name": "O. Teoman Turgut"}], "author_count": 3}, {"id": "2608.08249", "category": "math-ph", "title": "Moving Frames for Lie Pseudo-groups: A Recursive Implementation", "abstract": "A new recursive implementation of the equivariant moving frame method for infinite-dimensional Lie pseudo-group actions is presented. It allows pseudo-group normalizations to be performed before the prolonged action is computed, thereby avoiding the introduction of unnecessarily complicated intermediate expressions. Several examples are provided to illustrate the algorithm.", "url": "https://arxiv.org/abs/2608.08249", "type": "理论", "summary": "1. 该工作针对无限维李伪群作用，提出了一种等变活动标架方法的递归实现方案。\n2. 其技术核心是在计算延拓作用之前先执行伪群规范化，从而避免引入复杂中间表达式，提高算法效率。\n3. 这为李伪群不变量与微分方程对称性等领域的高效符号计算提供了可行途径与工具基础。", "summary_source": "deepseek", "authors": [{"name": "Peter J. Olver"}, {"name": "Francis Valiquette"}], "featured_authors": [{"name": "Peter J. Olver"}, {"name": "Francis Valiquette"}], "author_count": 2}, {"id": "2608.08396", "category": "math-ph", "title": "New results on the domain of analyticity of the free energy for the Ising model", "abstract": "We investigate the analyticity of the free energy of the Ising model in the presence of a non-zero external magnetic field, at high temperature, and at low temperature. Using the Fernandez--Procacci convergence criterion for cluster expansions, together with generating-function techniques and graph-theoretical methods, we derive improved convergence conditions in all three regimes. In particular, the generating-function approach yields sharper estimates for polymers and contours in the strong-field and low-temperature regimes, while a new high-temperature expansion based on Veblen's theorem provides a substantially larger analyticity region than the classical results in the literature.", "url": "https://arxiv.org/abs/2608.08396", "type": "理论", "summary": "1. 该文研究非零外场下Ising模型自由能在高温与低温区的解析性。\n2. 结合Fernandez-Procacci判据、生成函数与图论，借助Veblen定理的新高温展开显著扩大解析区域。\n3. 这为经典格点模型自由能解析性的严格估计提供新途径，或可推广至其他聚合物系统。", "summary_source": "deepseek", "authors": [{"name": "Nguyen Tong Xuan"}, {"name": "Nguyen Dang Thien Thu"}], "featured_authors": [{"name": "Nguyen Tong Xuan"}, {"name": "Nguyen Dang Thien Thu"}], "author_count": 2}, {"id": "2608.08409", "category": "math-ph", "title": "Notes on the Optical-Lattice Hard-Core Bose Gas of Aizenman--Lieb--Seiringer--Solovej--Yngvason", "abstract": "These are detailed expository notes on the staggered optical-lattice hard-core Bose gas of Aizenman, Lieb, Seiringer, Solovej and Yngvason. They restate and expand the arguments and their principal inputs in a common notation, and describe the central and orbitwise decompositions of thermodynamic-limit equilibrium states. The purpose is to make compressed or delegated steps explicit, not to introduce a new method, strengthen the estimates, or otherwise improve the cited results.", "url": "https://arxiv.org/abs/2608.08409", "type": "理论", "summary": "1. 该论文以统一记号重述并逐步展开ALSSY关于交错光晶格硬核玻色气体的论证，完整描述热力学极限平衡态的中心分解与轨道分解。\n2. 其卖点在于将原文中压缩或委托的步骤显式化，清晰呈现决定平衡态结构的物理输入与推导逻辑，但未引入新方法或改进原有估计。\n3. 该工作为后续研究提供了可核查的论证细节与统一记号框架，有助于在更大交错势或非均匀晶格等方向拓展相关理论分析。", "summary_source": "deepseek", "authors": [{"name": "Yoshitsugu Sekine"}], "featured_authors": [{"name": "Yoshitsugu Sekine"}], "author_count": 1}, {"id": "2608.08811", "category": "math-ph", "title": "The $\\mathcal{L}$-Calculus for Causal Variational Principles: An Exterior Differential Calculus on Non-Smooth Spaces", "abstract": "A differential calculus for causal variational principles is developed, which generalizes the exterior calculus of differential forms and some of the associated differential topological structures to non-smooth spaces. Our calculus includes the exterior derivative, de Rham cohomology, glueing constructions (restrictions and extensions of differential forms, Mayer-Vietoris sequence), a Künneth formula and Poincar{é}'s lemma. Moreover, we prove versions of Stokes' theorem and the Gauß divergence theorem. The constructions and results are illustrated by several examples.", "url": "https://arxiv.org/abs/2608.08811", "type": "理论", "summary": "1. 该工作为因果变分原理建立了一套非光滑空间上的外微分演算，推广了微分形式及相关拓扑结构。\n2. 其核心进展是在缺乏光滑结构的设定下仍构造出外导数、de Rham上同调与粘合构造，并证明Stokes定理、Gauss散度定理、Künneth公式及Poincaré引理等关键结果。\n3. 这为因果变分原理及离散或奇异几何模型的拓扑与几何分析提供了基础工具，也提示可向更一般的非光滑微分结构拓展。", "summary_source": "deepseek", "authors": [{"name": "Felix Finster"}, {"name": "Niky Kamran"}, {"name": "Frank van der Top"}], "featured_authors": [{"name": "Felix Finster"}, {"name": "Niky Kamran"}, {"name": "Frank van der Top"}], "author_count": 3}, {"id": "2608.09157", "category": "math-ph", "title": "Theoretical analysis of the maximum range of a projectile released from a pendulum", "abstract": "The motion of a projectile released from a simple pendulum is analyzed, with particular emphasis on investigating the optimal release angle that maximizes the horizontal range and the corresponding maximum range. This system serves as a simplified model of the Tarzan jump problem. Using simple analytical methods, the optimal release angle is shown to be characterized by a cubic equation and to increase with the initial velocity. In addition, asymptotic expressions for both the optimal angle and maximum range are derived in the limits of low and high initial velocity.", "url": "https://arxiv.org/abs/2608.09157", "type": "理论", "summary": "1. 该工作对简单摆释放抛体的运动进行解析理论研究，重点求解最大化水平射程的最优释放角与最大射程，并将其视为Tarzan跳跃问题的简化模型。\n2. 其核心在于用初等解析方法证明最优释放角由三次方程刻画且随初速度增大，同时给出低初速与高初速极限下最优角及最大射程的渐近表达式。\n3. 这一解析结果可为理解摆动释放抛射系统的最优策略提供清晰图像，并为后续引入空气阻力、弹性摆绳等推广提供可靠基线。", "summary_source": "deepseek", "authors": [{"name": "Ken Yamamoto"}], "featured_authors": [{"name": "Ken Yamamoto"}], "author_count": 1}, {"id": "2608.09570", "category": "math-ph", "title": "Eigenvalue asymptotics for the one-particle density matrix and one-particle kinetic energy density operator", "abstract": "Let $\\psi({\\mathbf x})$, ${\\mathbf x} \\in{\\mathbb R}^{3N}$, be an eigenfunction of the $N$-particle atomic Schrödinger operator. We consider the one-particle density matrix $\\gamma(x, y)$ and one-particle kinetic energy density $\\varkappa(x, y)$, $x, y\\in {\\mathbb R}^3$, associated with the eigenfunction $\\psi$. Both functions play a central role in quantum chemistry computations of atomic and molecular bound states: the knowledge of the eigenvalue behaviour of the integral operators ${\\sf{\\Gamma}}$ and ${\\sf{K}}$ with kernels $\\gamma(x, y)$ and $\\varkappa(x, y)$ serves to estimate the errors due to finite-dimensional approximations. We find the following asymptotic formulas for their eigenvalues $\\lambda_k({\\sf{\\Gamma}})>0$ and $\\lambda_k({\\sf{K}})>0$: \\[ \\lim_{k\\to \\infty} k^{\\frac{8}{3}} \\,\\lambda_k({\\sf{\\Gamma}}) = A^{\\frac{8}{3}},\\quad \\lim_{k\\to \\infty} k^2\\,\\lambda_k({\\sf{K}}) = B^2, \\] where $A$ and $B$ are non-negative constants given explicitly in terms of the eigenfunction $\\psi$. These asymptotics are determined by the singularities of the function $\\psi$ at pair coalescence points of the particles. To identify and isolate these singularities we use some recent regularity results for $\\psi$. At the last step we apply Birman-Solomyak spectral asymptotics results for pseudodifferential operators with homogeneous symbols. In the special case where the eigenfunction $\\psi$ is totally antisymmetric, it exhibits enhanced regularity, which leads to a faster decay of the eigenvalues $\\lambda_k(\\sf{\\Gamma})$ and $\\lambda_k(\\sf{K})$. The asymptotic formulas take the form \\[ \\lim_{k\\to \\infty} k^{\\frac{10}{3}} \\,\\lambda_k({\\sf\\Gamma}) = \\big(A_{asym}\\big)^{\\frac{10}{3}},\\quad \\lim_{k\\to \\infty} k^{\\frac{8}{3}} \\,\\lambda_k({\\sf K}) = \\big(B_{asym}\\big)^{\\frac{8}{3}}, \\] where $A_{asym}$ and $B_{asym}$ are non-negative constants given explicitly in terms of the gradient of $\\psi$.", "url": "https://arxiv.org/abs/2608.09570", "type": "理论", "summary": "1. 该工作推导了N粒子原子薛定谔算符本征函数所诱导的单粒子密度矩阵与单粒子动能密度算符的本征值渐近公式，并给出显式常数。\n2. 其技术核心在于利用波函数在粒子对并合点的奇性以及全反对称本征函数的增强正则性，结合Birman–Solomyak谱渐近定理，得到k^{-8/3}、k^{-2}与反对称情形k^{-10/3}、k^{-8/3}的精确衰减律。\n3. 这些渐近律对量子化学有限维基组近似的误差估计提供了定量依据，并为单粒子约化密度矩阵与动能密度谱结构的进一步研究给出明确预测。", "summary_source": "deepseek", "authors": [{"name": "Søren Fournais"}, {"name": "Alexander V. Sobolev"}], "featured_authors": [{"name": "Søren Fournais"}, {"name": "Alexander V. Sobolev"}], "author_count": 2}, {"id": "2608.09737", "category": "math-ph", "title": "The determinant of the Dirichlet-to-Neumann map for a surface with boundary and periods of holomorphic differentials on its double", "abstract": "Let $(M,g)$ be a smooth orientable $2d$ Riemannian manifold of genus $\\mathfrak{g}$ with Riemannian metric $g$ and connected boundary $\\Gamma$. Let $\\Lambda$ be the Dirichlet-to-Neumann map on $\\Gamma$ and let ${\\rm det}_\\zeta(\\Lambda)$ be its (modified, i. e. with zero mode excluded) $\\zeta$-regularized determinant. It is well-known that the quantity ${\\rm det}_\\zeta(\\Lambda)/|\\Gamma|$ (where $|\\Gamma|$ is the length of $\\Gamma$) is a conformal invariant. It was shown by Edward and Wu (\\cite{EV}) that this invariant equals one for $\\mathfrak{g}=0$; in the case $\\mathfrak{g}>0$ Guillarmou and Guillopé \\cite{Guillarmou} found two explicit expressions for this invariant through the Rouelle and (respectively) the Selberg zeta-functions of the two surfaces of negative constant curvature from the conformal class of $(M,g)$: one is of infinite volume and complete whereas another has geodesic boundary. We present an elementary counterpart of the formulae of Guillarmou and Guillopé using the periods of holomorphic differentials on the double $2M$ of $M$ only. Our approach is based on the properties of the Hilbert transform of $M$ \\cite{B,HilbKor} and the Kontsevich-Vishik-Friedlander-Guillemin regularization of the determinants of pseudodifferenial operators \\cite{KV,Ww,F}. In particular, a connection between the length spectra of (uniformized) $M$, $2M$ and the periods of holomorphic differentials on $2M$ is established.", "url": "https://arxiv.org/abs/2608.09737", "type": "理论", "summary": "1. 该文对带边界的紧致定向黎曼曲面，用其双覆盖上全纯微分的周期给出Dirichlet-to-Neumann映射ζ-正则化行列式（剔除零模式）与边界长度之比这一共形不变量的初等表达式。\n2. 其技术要点是利用希尔伯特变换及Kontsevich-Vishik-Friedlander-Guillemin正则化，不借助负常曲率曲面的zeta函数，并建立了均匀化M、双覆盖2M的长度谱与2M上全纯微分周期的联系。\n3. 该结果可作为Guillarmou-Guillopé公式的初等替代，或为高亏格多边界推广及谱几何、逆问题研究提供新视角。", "summary_source": "deepseek", "authors": [{"name": "Dmitrii Korikov"}, {"name": "Alexey Kokotov"}], "featured_authors": [{"name": "Dmitrii Korikov"}, {"name": "Alexey Kokotov"}], "author_count": 2}, {"id": "2608.07686", "category": "quant-ph", "title": "Emergent Problem-Graph Alignment in RL-Discovered Entanglement Topologies for QAOA", "abstract": "In the Quantum Approximate Optimization Algorithm (QAOA), the entanglement topology, where qubit pairs are connected by two-qubit gates, is conventionally set equal to the edge set of the problem graph. This coupling ties circuit design to explicit problem knowledge and may not yield the most trainable circuit under limited optimization budgets. We investigate whether a reinforcement learning (RL) agent can discover more effective entanglement topologies for QAOA-based MaxCut optimization without direct access to the problem graph. A Masked Proximal Policy Optimization agent sequentially places IsingZZ gates to construct a circuit topology, while a variational inner loop optimizes the resulting QAOA parameters and returns the approximation ratio as a sparse terminal reward. The agent's observation contains only the edges placed so far and the current approximation ratio; graph structure can only be inferred indirectly through the optimization reward. On Erdős--Rényi instances with up to $10$~qubits, the agent consistently converges to topologies that are strict subsets of the problem graph, achieving overlap ratios approaching $1.0$, despite receiving no explicit information about the graph structure in its observations. These sparse, problem-aligned topologies outperform the full graph topology and several structural baselines when the optimization budget is limited ($50$~gradient steps), but are overtaken by denser topologies given sufficient optimization budget. Our results reveal a trainability--expressibility trade-off governed by topology density and suggest that the variational optimization landscape implicitly encodes structural information about the problem Hamiltonian.", "url": "https://arxiv.org/abs/2608.07686", "type": "理论+数值", "summary": "1. 该工作让掩蔽近端策略优化智能体仅根据已放置边和当前近似比，为QAOA MaxCut顺序构造纠缠拓扑，且无需直接访问问题图。\n2. 其核心发现在于智能体收敛到问题图的严格子集，并在50步梯度预算下优于全图拓扑，体现拓扑密度决定的可训练性与表达性权衡。\n3. 这暗示变分优化景观隐式编码了哈密顿量结构，为受限资源下量子电路拓扑的自适应发现提供了新途径。", "summary_source": "deepseek", "authors": [{"name": "Tobias Rohe"}, {"name": "Federico Harjes Ruiloba"}, {"name": "Markus Baumann"}, {"name": "Gerhard Stenzel"}, {"name": "Leo Sünkel"}, {"name": "Thomas Gabor"}, {"name": "Claudia Linnhoff-Popien"}], "featured_authors": [{"name": "Tobias Rohe"}, {"name": "Federico Harjes Ruiloba"}, {"name": "Markus Baumann"}, {"name": "Leo Sünkel"}, {"name": "Thomas Gabor"}, {"name": "Claudia Linnhoff-Popien"}], "author_count": 7}, {"id": "2608.07696", "category": "quant-ph", "title": "Preparing approximate $N$-fold cat states with the phase space instruction set", "abstract": "The phase space instruction set is a continuous-variable universal gate set involving single-qubit rotations and qubit-dependent displacements on a single boson. Using these gates, we prove that a circuit depth $\\mathrm{\\Omega}(\\varphi(N))$ is necessary to approximately prepare a large $N$-fold rotationally invariant Schrödinger cat state; here $\\varphi(N) \\gtrsim N/\\log\\log N$ is the Euler totient function. A protocol saturating this asymptotic bound on circuit depth is obtained for every prime number $N$. This protocol has an asymptotically optimal runtime, when the gates are generated by Hamiltonian evolution. Our results provide a sharp example where a universal gate set is surprisingly inefficient at preparing a simple family of states, and further imply that converting bosonic circuits between different universal gate sets can be extremely inefficient.", "url": "https://arxiv.org/abs/2608.07696", "type": "理论", "summary": "1. 该工作针对单玻色子上的相位空间指令集，证明近似制备N重旋转不变薛定谔猫态所需电路深度至少为Ω(φ(N))，并给出对每个素数N饱和该渐近下界的协议。\n2. 其技术卖点是将态制备复杂度与欧拉函数φ(N)的数论标度联系起来，且协议在门由哈密顿演化生成时运行时间亦渐近最优，凸显该通用门集在制备简单态族上的惊人低效。\n3. 这一结果暗示玻色子电路在不同通用门集间相互转换可能极其低效，为连续变量量子信息处理中的资源估算与门集设计提供了具体教训。", "summary_source": "deepseek", "authors": [{"name": "Shuyan Zhou"}, {"name": "Andrew Lucas"}], "featured_authors": [{"name": "Shuyan Zhou"}, {"name": "Andrew Lucas"}], "author_count": 2}, {"id": "2608.07706", "category": "quant-ph", "title": "The Case for the Everett Multiverse", "abstract": "I give a non-technical presentation of the argument that quantum mechanics, in the form in which it is currently used, needs to be understood in many-worlds (Everettian) terms; the alternatives that have been discussed are at present not able to reproduce the full empirical content of the theory. This is a draft of a chapter for the forthcoming \\emph{Blackwell Companion to Philosophy and the Multiverse (Klaas Kraay and Daniel Rubio, eds.) }", "url": "https://arxiv.org/abs/2608.07706", "type": "理论", "summary": "1. 该文以面向普通读者的非技术性方式为埃弗雷特多世界诠释辩护，主张当前实际使用的量子力学必须在多世界框架下理解。\n2. 其核心论据是：已提出的各类替代诠释目前均无法复现量子理论的全部经验内容，而多世界诠释仅凭标准量子动力学就能给出完整、自洽的经验预言。\n3. 这为量子基础研究厘清了诠释选择的标准，即以经验充分性和理论自洽性为判据，也为未来多世界方案的细化及与其他诠释的严格比较指明了方向。", "summary_source": "deepseek", "authors": [{"name": "David Wallace"}], "featured_authors": [{"name": "David Wallace"}], "author_count": 1}, {"id": "2608.07720", "category": "quant-ph", "title": "Randomized product formulas beyond optimal deterministic scaling", "abstract": "Product formulas, also known as Trotter formulas, are among the most widely used and practical methods for simulating quantum systems on quantum computers. Here we introduce two new classes of randomized product formulas for simulating Hamiltonians with separated energy scales, $H=A+\\alpha B$, where $\\alpha$ is small. In the standard access model, where one can implement exponentials of $A$ and $B$ separately, our randomized formulas achieve $\\mathcal O(\\alpha^2)$ error scaling at the cost of only doubling the gate depth of the corresponding deterministic formula. We further prove an $\\Omega(\\alpha)$ lower bound for deterministic product formulas. In a stronger access model, allowing exponentials of $A+\\alpha B_\\ell$ for $B = \\sum_{\\ell}B_\\ell$, our randomized formula, based on Trotter Heuristic Resource Improved Formulas for Time-dynamics (THRIFT)~[J. L. Bosse et al., Nat. Commun. 16, 2673 (2025)], achieves $\\mathcal O(\\alpha^3)$ error scaling with only constant-factor expected gate overhead. We also establish an $\\Omega(\\alpha^2)$ lower bound for deterministic product formulas in this access model. Numerical simulations confirm gate-count reductions for simulating physically motivated systems.", "url": "https://arxiv.org/abs/2608.07720", "type": "理论+数值", "summary": "1. 该工作提出两类随机化乘积公式，用于模拟具有分离能量标度 H=A+αB 的量子系统，并给出误差与门开销的理论分析。\n2. 其卖点在于标准访问模型下仅以加倍电路深度达到 O(α²) 误差，并基于 THRIFT 思想在更强模型下以常数倍预期门开销达到 O(α³)，同时证明确定性公式的 Ω(α) 与 Ω(α²) 下界。\n3. 这为含弱耦合项的量子动力学模拟提供了实用门数削减方案，也启发进一步研究随机化公式的方差调控与最优访问模型。", "summary_source": "deepseek", "authors": [{"name": "Leeseok Kim"}, {"name": "Luis Pedro García-Pintos"}], "featured_authors": [{"name": "Leeseok Kim"}, {"name": "Luis Pedro García-Pintos"}], "author_count": 2}, {"id": "2608.07723", "category": "quant-ph", "title": "Emergent Non-Markovian Nonlinear Qubit From Collective Spin Interactions", "abstract": "Open-system descriptions are typically introduced by coupling a quantum system to an external environment. Here we show that a closed interacting many-body system can itself generate a controlled non-Markovian quantum channel acting on a reduced nonlinear qubit through finite-size corrections to a nonlinear mean-field limit. We demonstrate this using the Kitagawa-Ueda one-axis twisting model, $H=\\chi J_z^2$, a paradigmatic model of collective spin dynamics, spin squeezing, and two-component Bose-Einstein condensates. Although the large-$N$ regime of this model has been extensively studied, the conventional fixed-$\\chi$ scaling does not yield a nontrivial dynamical large-$N$ limit. In this paper, we investigate a complementary large-$N$ formulation obtained from the double limit $N\\rightarrow\\infty$ and $\\chi\\rightarrow O(g/N)$, where $g$ is a coupling constant. We derive the leading finite-$N$ corrections to this limit and show that they correspond to an emergent non-Markovian dephasing process, producing a Gaussian decay of the Bloch-vector coherence with characteristic timescale $t_\\varphi\\geq\\sqrt{N}/(2g)$. Exact finite-$N$ calculations demonstrate that this effective open-system description becomes quantitatively accurate for systems containing on the order of one hundred qubits. The resulting framework provides a microscopic realization of non-Markovian dephasing generated intrinsically by a closed many-body system and enables efficient simulation of collective quantum dynamics beyond unitary mean-field theory. These results link the long-studied phenomenon of phase diffusion in atomic ensembles and Bose-Einstein condensates to the growing effort to characterize non-Markovian, beyond-Lindblad noise in quantum computing hardware, providing a rare case in which such a noise channel is derived from microscopic dynamics rather than fit phenomenologically.", "url": "https://arxiv.org/abs/2608.07723", "type": "理论+数值", "summary": "1. 该工作证明闭合相互作用多体系统可通过有限尺寸修正产生作用于约化非线性量子比特的非马尔可夫量子通道，并以单轴扭转模型H=χJ_z^2为例加以实现。\n2. 其技术核心是在N→∞与χ~g/N的双重极限中导出领头阶有限N修正，表现为涌现的非马尔可夫退相干，给出Bloch矢量相干性的高斯衰减，特征时间t_φ≥√N/(2g)，对约百个量子比特体系定量精确。\n3. 该框架将原子系综与玻色-爱因斯坦凝聚中的相位扩散与量子硬件中超越Lindblad噪声的表征联系起来，为噪声通道提供了源于微观动力学的罕见实例。", "summary_source": "deepseek", "authors": [{"name": "Gregory T. Carroll"}, {"name": "Michael R. Geller"}, {"name": "Andre Erpenbeck"}], "featured_authors": [{"name": "Gregory T. Carroll"}, {"name": "Michael R. Geller"}, {"name": "Andre Erpenbeck"}], "author_count": 3}, {"id": "2608.07783", "category": "quant-ph", "title": "Multistage Rewinding Decoder for QLDPC Codes", "abstract": "In this paper, we propose a multistage decoding framework that leverages internal information produced by an underlying message-passing decoder. The proposed method targets the failure dynamics caused by both classical trapping sets and degenerate errors supported on symmetric stabilizers, which are among the primary limitations of iterative decoding for QLDPC codes. To identify unreliable variable nodes, we introduce a heuristic metric that combines several dynamical features of the decoder, including variable-node log likelihood reliabilities, hard-decision oscillations, the number of adjacent unsatisfied checks, and the soft information contributed by unsatisfied checks. Based on this ranking metric, the decoder performs guided rewinds by selectively forcing the initial log likelihood ratio values of the most suspicious variable nodes and restarting the message-passing decoder under the corresponding forced configuration. To manage the combinatorial growth of candidate configurations, the search is formulated within a beam- search framework with controlled beam width. In addition, we introduce a pruning metric based on the combination of the residual syndrome weight and a posteriori reliability of the decoder output, thereby retaining only the most promising search paths. Logical error rate results demonstrate that the proposed decoder significantly outperforms the normalized min- sum decoder and achieves competitive performance with belief propagation enhanced by order-10 ordered statistics decoding.", "url": "https://arxiv.org/abs/2608.07783", "type": "理论", "summary": "1. 该工作提出一种针对量子LDPC码的多级回卷译码框架，利用消息传递译码器内部信息定位失败变量节点。\n2. 核心在于用启发式度量与束搜索修剪，强制重设可疑节点的对数似然比值以处理陷阱集和对称稳定子简并错误。\n3. 这为实用化量子LDPC码迭代译码提供可扩展纠错方案，并有潜力结合更多内信息进一步提升性能。", "summary_source": "deepseek", "authors": [{"name": "Milad Taghipour"}, {"name": "Dimitris Chytas"}, {"name": "Bane Vasić"}], "featured_authors": [{"name": "Milad Taghipour"}, {"name": "Dimitris Chytas"}, {"name": "Bane Vasić"}], "author_count": 3}, {"id": "2608.07833", "category": "quant-ph", "title": "Playing Nonlocal Games with Little to No Shared Randomness", "abstract": "Bell nonlocality reveals correlations that cannot be explained by classical models and plays a central role in quantum information theory. In this work, we investigate classical models of Bell nonlocality under restrictions on shared randomness. For bipartite scenarios with bounded shared randomness, the set of classical correlations becomes nonconvex. We characterize the correlations achievable without shared randomness through the simultaneous evaluation of multiple linear Bell functionals. We then extend our analysis to quantum networks by relaxing the standard assumption of source independence. In this setting, the feasibility constraints derived for the bipartite case can be used to certify source dependence, and we further construct nonlinear inequalities that distinguish classical models with correlated sources from correlations achievable in standard quantum networks. As an application, we show that these nonlinear network inequalities give rise to an entropic Bell inequality for bipartite scenarios with limited shared randomness.", "url": "https://arxiv.org/abs/2608.07833", "type": "理论", "summary": "1. 该文在共享随机性受限的设定下研究贝尔非局域性博弈中的经典模型，刻画无共享随机性时由多个线性贝尔泛函同时求值实现的关联集合，并揭示有界共享随机性下经典关联集合的非凸性。\n2. 其核心卖点在于将双粒子情形所得可行性约束移植到量子网络，通过放宽源独立性假设认证源相关，并构造区分相关源经典模型与标准量子网络关联的非线性不等式。\n3. 这些非线性网络不等式进而导出有限共享随机性双粒子体系的熵贝尔不等式，为检验非局域性、认证网络源特性及设计非局域博弈实验提供可检验的新途径。", "summary_source": "deepseek", "authors": [{"name": "Mingze Xu"}, {"name": "Eric Chitambar"}], "featured_authors": [{"name": "Mingze Xu"}, {"name": "Eric Chitambar"}], "author_count": 2}, {"id": "2608.07882", "category": "quant-ph", "title": "Biorthogonal-only Floquet Dynamical Quantum Phase Transitions", "abstract": "Non-Hermitian dynamical quantum phase transitions (DQPTs) are intrinsically sensitive to the choice of inner product under nonunitary time evolution. Although the biorthogonal formulation based on associated states provides a normalized Loschmidt echo with a probabilistic interpretation, previous studies have found biorthogonal and self-normal DQPTs to occur in the same parameter regimes, suggesting that the two forms of dynamical criticality are concomitant. Here we demonstrate that this is not the case. In an exactly solvable periodically driven non-Hermitian Su-Schrieffer-Heeger chain, we uncover a finite biorthogonal-only Floquet DQPT regime, where the biorthogonal Loschmidt rate becomes nonanalytic while the self-normal Loschmidt rate remains smooth. The critical conditions are obtained analytically, showing that the onset of biorthogonal Floquet DQPTs is locked to the exceptional lines of the effective Floquet Hamiltonian, whereas self-normal criticality has no corresponding spectral boundary. Moreover, for each critical momentum, the biorthogonal DQPT exhibits a pair of critical times within every driving period, whereas the self-normal DQPT exhibits only one. Our results establish a fundamental distinction between biorthogonal and self-normal DQPTs, thereby opening a route toward new nonequilibrium quantum phenomena in non-Hermitian systems.", "url": "https://arxiv.org/abs/2608.07882", "type": "理论", "summary": "1. 该工作在可精确求解的周期驱动非厄米SSH链中，发现了有限的双正交独有Floquet动力学量子相变区间，其中双正交洛施密特速率非解析而自归一化速率保持光滑。\n2. 其核心在于解析给出临界条件，证明双正交临界性锁定于有效Floquet哈密顿量的异常线，且每个临界动量在每个驱动周期内产生一对临界时刻，而自归一化情形既无对应谱边界也仅有一次临界时刻。\n3. 这一结果确立了双正交与自归一化动力学量子相变的根本区别，为在非厄米系统中发掘新的非平衡量子现象开辟了途径。", "summary_source": "deepseek", "authors": [{"name": "Jiangrong Wen"}, {"name": "Qidong Yuan"}, {"name": "Zi-Xiang Hu"}, {"name": "Jian-Jun Dong"}], "featured_authors": [{"name": "Jiangrong Wen"}, {"name": "Qidong Yuan"}, {"name": "Zi-Xiang Hu"}, {"name": "Jian-Jun Dong"}], "author_count": 4}, {"id": "2608.07893", "category": "quant-ph", "title": "Breaking the Curse of Dimensionality in Quantum PDE Solvers via Gevrey Regularity", "abstract": "We connect different degrees of smoothness of real-valued periodic functions to the cost of preparing their high-precision Fourier-basis amplitude encodings as quantum states. Our central observation is that the Gevrey hierarchy, which stratifies the space between smooth and analytic functions, provides a natural class for high-precision quantum algorithms. We then specialize to solving general linear partial differential equations (PDEs), showing how our Fourier methods do so efficiently at varying target precisions on a quantum computer. This also demonstrates how our framework enables passage from query-complexity results to explicit elementary gate counts. As an application, we introduce a hierarchy of many-body quantum simulation pipelines that harness these high-precision algorithms to probe the linear response of atomistic systems in first quantization. Each level of the hierarchy unlocks a further polynomial-degree quantum speedup, yielding a gradual improvement in simulation efficiency as quantum computers scale.", "url": "https://arxiv.org/abs/2608.07893", "type": "理论+数值", "summary": "1. 该工作利用周期函数的Gevrey正则性层级，将高精度傅里叶基振幅编码成本与函数光滑度直接关联，并据此设计量子线性PDE求解框架。\n2. 其技术核心在于把Gevrey层级作为光滑与解析之间的自然插值类，将查询复杂度结果转化为显式量子门计数，从而在高精度下规避维度灾难并给出多项式加速。\n3. 这一框架为可验证资源核算的量子PDE求解器及一量子化原子体系线性响应多体模拟指明了渐进的实用化路径。", "summary_source": "deepseek", "authors": [{"name": "Pooya Ronagh"}, {"name": "Mariia Sobchuk"}, {"name": "Xiaoran Li"}, {"name": "Arsalan Motamedi"}, {"name": "Grecia Castelazo"}, {"name": "Ala Shayeghi"}], "featured_authors": [{"name": "Pooya Ronagh"}, {"name": "Mariia Sobchuk"}, {"name": "Xiaoran Li"}, {"name": "Arsalan Motamedi"}, {"name": "Grecia Castelazo"}, {"name": "Ala Shayeghi"}], "author_count": 6}, {"id": "2608.07939", "category": "quant-ph", "title": "Stable three-dimensional solitons in spin-orbit-coupled atomic-molecular condensates", "abstract": "We elaborate a mechanism for the creation of stable three-dimensional (3D) solitons in spin-orbit-coupled (SOC) atomic-molecular Bose-Einstein condensate, modeled by the mean-field equations with the quadratic three-wave interaction, characterized by mismatch $\\alpha $. The planar (effectively two-dimensional) SOC is applied to the soliton's atomic component, structuring it as a mixed mode (MM) or semi-vortex (SV). The molecular component of the SV soliton is shaped as a 3D vortex, while the molecular component in the MM soliton is an MM too. The solitons exist up to a critical value of $\\alpha $. The system demonstrates a relatively large norm share of the vortex components, exceeding $50\\%$ of the total norm, which is an essential feature of SOC-supported solitons. This is scheme for realizing stable vortex solitons in free space with the quadratic nonlinearity.", "url": "https://arxiv.org/abs/2608.07939", "type": "理论", "summary": "1. 该工作提出自旋轨道耦合原子-分子凝聚体中稳定三维孤子的形成机制。\n2. 平面自旋轨道耦合与二次三波作用使半涡或混合模孤子的分子分量呈三维涡旋，涡旋占比超50%。\n3. 这为自由空间中利用二次非线性实现稳定涡旋孤子提供了可行方案。", "summary_source": "deepseek", "authors": [{"name": "Chao Kong"}, {"name": "Jinqing Li"}, {"name": "Guihua Chen"}, {"name": "Guilong Li"}, {"name": "Zhaopin Chen"}, {"name": "Haiming Deng"}, {"name": "Boris A. Malomed"}, {"name": "Yongyao Li"}], "featured_authors": [{"name": "Chao Kong"}, {"name": "Jinqing Li"}, {"name": "Guihua Chen"}, {"name": "Haiming Deng"}, {"name": "Boris A. Malomed"}, {"name": "Yongyao Li"}], "author_count": 8}, {"id": "2608.07986", "category": "quant-ph", "title": "Near-Optimal Gap Amplification for Nonnegative Unentangled Quantum Proofs", "abstract": "We study gap amplification of the class $\\mathsf{QMA}^{+}(2)$ characterized by unentangled quantum proofs whose amplitudes are nonnegative in the computational basis. This class was recently introduced by Jeronimo and Wu (STOC 2023), and its behavior depends sharply on the completeness-soundness gap: although it captures the power of $\\mathsf{NEXP}$ for some small constant gap, it is equal to $\\mathsf{QMA}(2)$ for larger constant gap. This is in stark contrast to $\\mathsf{QMA}(2)$ where strong gap amplification is known due to the product test by Harrow and Montanaro (FOCS 2010, JACM 2013). In this paper, we prove for every completeness $c$ and soundness $s$ with $c-s=1/\\mathrm{poly}(n)$, \\[ \\mathsf{NEXP} = \\mathsf{QMA}^{+}(2,c,s) = \\mathsf{QMA}^{+}\\left(2,1-\\frac1{\\mathrm{poly}(n)},\\frac14+\\frac1{\\mathrm{poly}(n)}\\right). \\] Our result gives a clean complexity phase transition for $\\mathsf{QMA}^{+}(2)$ since we have \\[ \\mathsf{QMA}^{\\mathbb R}(2) = \\mathsf{QMA}^{+}\\left(2,1-\\frac1{\\mathrm{poly}(n)},\\frac14-\\frac1{\\mathrm{poly}(n)}\\right), \\] where $\\mathsf{QMA}^{\\mathbb R}(2)$ denotes $\\mathsf{QMA}(2)$ with witnesses restricted to real amplitudes. Our amplification is thus optimal in the sense that a slight improvement of our soundness would have the collapse \\[ \\mathsf{QMA}^{\\mathbb R}(2)=\\mathsf{NEXP}. \\] Our proof combines symmetric-subspace projections with the relation $\\mathsf{QMA}^{+}(1)=\\mathsf{NEXP}$ of Bassirian, Fefferman, and Marwaha (ITCS 2024). The main technical ingredient is a dimension-independent de Finetti theorem in Hilbert-Schmidt norm that applies when the number of registers under consideration grows logarithmically.", "url": "https://arxiv.org/abs/2608.07986", "type": "理论", "summary": "1. 该工作针对非负振幅非纠缠量子证明类 QMA\\(^+(2)\\)，证明了任意逆多项式间隙下其与 NEXP 相等，并可将间隙放大到完备性接近 1、可靠性 \\(1/4+1/\\mathrm{poly}(n)\\)。\n2. 其卖点在于放大是近最优的：由于 QMA\\(^{\\mathbb R}(2)\\) 对应可靠性 \\(1/4-1/\\mathrm{poly}(n)\\)，任何轻微改进都将导致 QMA\\(^{\\mathbb R}(2)=\\)NEXP 的复杂性坍缩。\n3. 证明结合对称子空间投影与 QMA\\(^+(1)=\\)NEXP，并依赖寄存器数目对数增长时 Hilbert-Schmidt 范数下维度无关的 de Finetti 定理，为量子证明复杂性提供了清晰相变。", "summary_source": "deepseek", "authors": [{"name": "Masayuki Miyamoto"}], "featured_authors": [{"name": "Masayuki Miyamoto"}], "author_count": 1}, {"id": "2608.08051", "category": "quant-ph", "title": "Quantum Decision Theory for Displacement Detection with Finite-Energy GKP States", "abstract": "We develop a quantum-decision-theoretic framework for detecting phase-space displacements with finite-energy, $d$-level Gottesman-Kitaev-Preskill (GKP) probes. For single-mode and entanglement-assisted architectures, we derive the Bayesian minimum-error probability, the optimal Neyman-Pearson receiver-operating characteristic, and the corresponding minimum detectable displacement. Finite-energy effects are treated through exact theta-series displacement kernels, while pure loss followed by quantum-limited amplification is mapped to an effective Gaussian random-displacement channel. Entanglement removes preparation-dependent blind directions and preserves both logical displacement labels, although it does not surpass the pointwise optimized single-mode strategy in the noiseless pure-state setting. We benchmark the resulting protocols against coherent-state, direction-matched squeezed-vacuum, and twin-beam schemes at equal nominal squeezing. Numerical results identify finite-squeezing and lossy regimes in which GKP probes achieve both a lower Bayesian error and a smaller minimum detectable perturbation than the selected Gaussian receivers.", "url": "https://arxiv.org/abs/2608.08051", "type": "理论+数值", "summary": "1. 该工作建立量子决策论框架，研究有限能量d级GKP探针在单模与纠缠辅助结构中的相空间位移检测。\n2. 其技术核心是用theta级数核精确刻画有限能量效应，并将纯损耗加量子受限放大映射为高斯随机位移信道，由此导出贝叶斯最小误差、尼曼-皮尔逊ROC及最小可检测位移。\n3. 纠缠虽消除制备相关盲向却不优于无噪声单模优化，且在有限压缩与有损区域GKP探针较所选高斯方案误差更低，为位移计量树立了新基准。", "summary_source": "deepseek", "authors": [{"name": "Seid Koudia"}, {"name": "Symeon Chatzinotas"}], "featured_authors": [{"name": "Seid Koudia"}, {"name": "Symeon Chatzinotas"}], "author_count": 2}, {"id": "2608.08065", "category": "quant-ph", "title": "Time-reparameterisation invariant quantum evolution law: the lack of absolute time does not imply a stationary global state", "abstract": "We challenge the common belief that if there is no absolute time parameter in physics, a quantum system described without reference to an external clock can be assumed to be in a stationary state of its Hamiltonian. We present a time-reparameterisation invariant quantum evolution law, which for a given initial condition predicts the same trajectory in state space as the Schrödinger equation, except that for nontrivial trajectories it does not predict the speed at which the trajectory is traversed. The solutions of this evolution law are all time-reparameterised solutions of the Schrödinger equation. We show how the predictions of the Schrödinger equation are recovered relative to an internal clock in this framework. In contrast to the Page-Wootters formalism or Dirac's quantisation of the Hamiltonian constraint, here the global sate is not stationary. We discuss the assumptions leading to the common conclusion that the state can be taken stationary and suggest that they need to be revisited.", "url": "https://arxiv.org/abs/2608.08065", "type": "理论", "summary": "1. 该工作提出一种时间重参数化不变的量子演化定律，并挑战“无绝对时间则全局态可取为哈密顿量平稳态”的常见看法。\n2. 其要点是：该定律在态空间给出与薛定谔方程相同的演化轨迹，但不预测轨迹被遍历的速率，所有解都是薛定谔方程解的时间重参数化，并可通过内禀时钟恢复薛定谔方程预言，同时全局态不平稳。\n3. 这表明 Page-Wootters 形式和狄喇克哈密顿约束量子化中假设平稳全局态的前提需要重新审视，为无外时钟量子系统与量子引力中的时间问题提供了新的理论框架。", "summary_source": "deepseek", "authors": [{"name": "Ognyan Oreshkov"}, {"name": "Denis Bouvy"}], "featured_authors": [{"name": "Ognyan Oreshkov"}, {"name": "Denis Bouvy"}], "author_count": 2}, {"id": "2608.08128", "category": "quant-ph", "title": "Gravitational Casimir-Polder interaction in a thermal bath", "abstract": "We have investigated, by separating the contributions from thermal fluctuations (tf) and the radiation reaction (rr), the gravitational Casimir-Polder interaction between a gravitationally polarizable two-level object and an infinite gravitational Dirichlet boundary in a thermal bath at a temperature $T$. The results indicate that the rr-contribution to the interaction potential is independent of the temperature, whereas the tf-contribution is generally governed by a nontrivial interplay between the thermal corrections and the polarization effect. Here, the object-to-boundary distance, the characteristic transition wavelength of the object and the thermal wavelength of gravitons are denoted by $L$, $\\lambda$ and $\\beta$, respectively. In contrast to the vacuum case, where the interaction potential scales as $L^{-5}$ for $L\\ll\\lambda$ and $L^{-6}$ for $L\\gg\\lambda$, corresponding to an always repulsive force, qualitatively new behaviors emerge at high temperatures. Particularly, when $\\sqrt[4]{\\beta\\lambda^3}\\ll L\\ll\\lambda$ and the object is polarizable within the plane perpendicular to the boundary, a novel scaling of $TL^{-1}$ arises; when $\\sqrt{\\beta\\lambda}\\ll L\\ll\\lambda$ and the object is polarizable along the vertical-to-boundary axis, the interaction force becomes surprisingly attractive. At extremely high temperatures and large distances, i.e. when $\\beta\\ll \\lambda\\ll L$, the potential oscillates with the distance $L$ and thus an attractive or repulsive and even vanishing force can be resulted, depending on the exact values of $L$. Our work demonstrates that thermal gravitons can act as an active control mechanism for quantum gravitational interactions, and temperature, polarization configuration, and object-to-boundary distance jointly determine the magnitude, scaling law, and even the attractive or repulsive nature of the interaction force.", "url": "https://arxiv.org/abs/2608.08128", "type": "理论", "summary": "1. 该工作在热浴中研究了引力极化二能级物体与无限大引力狄利克雷边界间的卡西米尔-波尔德相互作用，并分别考察了热涨落与辐射反作用贡献。\n2. 其核心发现是辐射反作用项与温度无关，而热涨落项在高温区产生新标度律，例如面内极化时出现 TL^{-1} 行为，垂直极化时可产生吸引势，极端高温下势能随距离振荡。\n3. 这显示热引力子可作为主动调控量子引力相互作用的机制，温度、极化构型与距离共同决定作用力的大小、标度乃至吸引或排斥性质。", "summary_source": "deepseek", "authors": [{"name": "Shijing Cheng"}, {"name": "Tianxin Wang"}, {"name": "Zili Zhang"}], "featured_authors": [{"name": "Shijing Cheng"}, {"name": "Tianxin Wang"}, {"name": "Zili Zhang"}], "author_count": 3}, {"id": "2608.08130", "category": "quant-ph", "title": "Preserving Heisenberg-Limited Metrological Information during Storage via Correlated-Noise Correction", "abstract": "Quantum error correction has become an indispensable tool for restoring Heisenberg-limited precision in noisy quantum metrology. Existing protocols, however, almost exclusively focus on correcting noise during the signal-encoding stage and implicitly assume that the probe is measured immediately after sensing. In many quantum information processing tasks, the encoded probe must instead be stored before subsequent quantum operations, during which environmental noise can significantly degrade the accumulated metrological information. Here, we propose a correlated-noise correction (CNC) protocol for protecting quantum probes during the storage stage. By correlating probe errors with auxiliary qubits through fixed two-body entangling gates, memory errors are converted into measurable syndromes that are extracted only once after storage. We show that the protocol naturally extends from single-qubit to multi-qubit probes and protects the stored quantum Fisher information against dephasing, bit-flip, and amplitude-damping noise. Furthermore, we demonstrate that preserving the quantum Fisher information does not necessarily require restoring the entire quantum state when the probe is measured immediately after storage, whereas full state recovery becomes essential for subsequent rounds of quantum signal processing. Our results establish correlated-noise correction as a practical framework for protecting metrological information during quantum memory and provide a useful building block for sensing-enabled quantum information processing.", "url": "https://arxiv.org/abs/2608.08130", "type": "理论", "summary": "1. 该工作提出关联噪声校正协议，用于在量子存储阶段保护已编码探针携带的计量信息，从而维持海森堡极限精度。\n2. 其核心在于借助固定两体纠缠门将探针错误关联至辅助比特，并在存储后一次性提取综合征，可同时应对退相、比特翻转与振幅耗散噪声，并自然推广至多比特探针。\n3. 该工作还表明，存储后立即测量时保护量子Fisher信息无需完整恢复量子态，而后续信号处理则必须完全恢复，这为传感增强型量子信息处理提供了实用框架。", "summary_source": "deepseek", "authors": [{"name": "Hang Xu"}, {"name": "Xue-Ke Song"}, {"name": "Jingzheng Huang"}, {"name": "Tailong Xiao"}, {"name": "Guihua Zeng"}], "featured_authors": [{"name": "Hang Xu"}, {"name": "Xue-Ke Song"}, {"name": "Jingzheng Huang"}, {"name": "Tailong Xiao"}, {"name": "Guihua Zeng"}], "author_count": 5}, {"id": "2608.08181", "category": "quant-ph", "title": "Hamiltonian spectra in quantum computers through the generalized eigenvalue method", "abstract": "Quantum computers can generate real-time correlators of field theories. By adapting the generalized eigenvalue problem to these correlators, energy eigenvalues can be extracted directly. The method is tested using both classical simulations and quantum hardware, successfully resolving several low-lying energy levels in agreement with exact diagonalization. Comparison with an alternative spectrum determination based on the Fourier transform of correlators shows that the proposed approach is substantially more efficient.", "url": "https://arxiv.org/abs/2608.08181", "type": "理论+数值", "summary": "1. 该工作提出将广义本征值问题应用于量子计算机生成的实时关联函数，以直接提取场论或量子系统的能量谱。\n2. 其技术卖点在于相比基于傅里叶变换的谱方法，该方案在经典模拟和量子硬件上均能以更高的效率解析多个低能级，并与精确对角化一致。\n3. 这为量子计算平台上多体系统的能谱测量提供了更优途径，有望推动强耦合场论与格点模型中的低能谱研究。", "summary_source": "deepseek", "authors": [{"name": "Valery Simonyan"}, {"name": "Greg Ridgway"}, {"name": "Paulo Bedaque"}], "featured_authors": [{"name": "Valery Simonyan"}, {"name": "Greg Ridgway"}, {"name": "Paulo Bedaque"}], "author_count": 3}, {"id": "2608.08215", "category": "quant-ph", "title": "Opposite post-processing orders of fermionic horizon channels and their quantum-resource monotonicity", "abstract": "Relativistic quantum-information studies in noninertial and black-hole settings often determine resource behavior through explicit calculations for particular input states and state functionals, leaving unclear whether the recurring monotonic trends originate from those choices or from a common underlying structure. In this work, we formulate the effective single-mode fermionic horizon transformation as a pair of complementary exterior and interior quantum channels, corresponding respectively to the physically accessible and inaccessible sectors, and establish exact post-processing orders in opposite directions. As the relativistic channel parameter $q$ increases, the exterior channel becomes progressively degraded, whereas the interior channel is ordered in the reverse direction. These relations extend to arbitrary multipartite settings. Consequently, every state functional that is non-increasing under the corresponding intermediate maps is non-increasing in homogeneous exterior sectors and non-decreasing in homogeneous interior sectors. The framework therefore applies to broad classes of quantum resources and correlations, including entanglement and occupation-basis coherence monotones, optimized Bell-functional quantities, and contractive-divergence correlation measures. We further numerically evaluate collective coherence based on the quantum Jensen-Shannon divergence (QJSD) in the Garfinkle-Horowitz-Strominger (GHS) dilaton-black-hole spacetime, illustrating the predicted homogeneous monotonicity. The recurring trends are therefore traced to a common channel-ordering structure, while the physical setting determines the parameterization of $q$ and the resource-theoretic monotonicity determines which output-state quantities inherit the order.", "url": "https://arxiv.org/abs/2608.08215", "type": "理论+数值", "summary": "1. 该工作将单模费米子视界变换分解为外部可及与内部不可及的互补量子通道，并证明两者随相对论参数q增大具有相反方向的后处理序。\n2. 其核心物理卖点是把纠缠、相干性、优化Bell泛函与收缩散度等资源的单调趋势统一归因于通道序结构：在外区齐性扇区不增，在内区齐性扇区不减。\n3. 这一框架将视界量子资源行为从逐态计算提升为通道序的普适推论，并在GHS伸缩子黑洞时空中以QJSD集体相干性数值验证，为相对论量子信息研究提供了可推广的范本。", "summary_source": "deepseek", "authors": [{"name": "Shuhao Li"}, {"name": "Jin-Ming Liu"}], "featured_authors": [{"name": "Shuhao Li"}, {"name": "Jin-Ming Liu"}], "author_count": 2}, {"id": "2608.08248", "category": "quant-ph", "title": "Catching Transpilation Drift with a CI/CD Workflow in Quantum Software Development", "abstract": "Quantum software workflows rely on compiler and provider toolchains that evolve independently of application source code. Consequently, an unchanged quantum circuit may transpile into a different target-specific realization after changes in SDK versions, optimization settings, basis gates, coupling maps, or backend descriptions. Such transpilation drift can affect circuit depth, gate composition, qubit mapping, and execution behavior, yet it is rarely monitored in CI/CD pipelines. This paper proposes a Quantum DevOps workflow for detecting transpilation drift before execution. The workflow transpiles source circuits against configured target profiles, computes structural drift metrics, records provenance and artifacts in MLflow, and raises configurable warnings or failures in GitHub Actions. Using representative circuits and target profiles, we show how drift checks can expose toolchain-induced changes and support reproducibility audits. The contribution is a practical CI/CD guardrail for making quantum compilation behavior observable, testable, and auditable.", "url": "https://arxiv.org/abs/2608.08248", "type": "数值", "summary": "1. 该工作提出一种量子DevOps流程，在CI/CD管线中自动检测未变量子电路因SDK、编译器或后端配置变化导致的转译漂移。\n2. 其技术核心是对目标配置转译电路并计算结构漂移指标，将产物与溯源记录于MLflow，再以可配置警告或失败机制在GitHub Actions中阻断异常。\n3. 这为量子编译行为提供了可观测、可测试和可审计的工程护栏，有助于可复现性审计与工具链演化下的可靠执行。", "summary_source": "deepseek", "authors": [{"name": "Jouni Peltonen"}, {"name": "Otso Kinanen"}, {"name": "Vlad Stirbu"}], "featured_authors": [{"name": "Jouni Peltonen"}, {"name": "Otso Kinanen"}, {"name": "Vlad Stirbu"}], "author_count": 3}, {"id": "2608.08279", "category": "quant-ph", "title": "Energetic Cost of Temporal Information Processing in Quantum Reservoirs", "abstract": "Quantum reservoir computing offers a promising route toward energy-efficient machine learning by processing temporal information with minimal training overhead. Yet, the physical principles linking its energetic cost to computational performance remain largely unexplored. Here we show that, in an interacting spin reservoir, information encoding and information processing are governed by distinct physical mechanisms. In the weak interacting regime, we derive an analytical expression for the average (switching) work, showing that the energetic cost of encoding new inputs is determined by the local response of the reservoir units. In contrast, interactions primarily redistribute the encoded information, generating memory and nonlinear features while only weakly affecting the work. This separation produces opposite correlations between energetic cost and performance for representative linear and nonlinear benchmark tasks. Our results identify the switching work as the energetic signature of information encoding and clarify when energetic efficiency and computational performance are compatible.", "url": "https://arxiv.org/abs/2608.08279", "type": "数值", "summary": "1. 该工作考察相互作用自旋储层中时间信息处理的能量代价，区分了编码新输入与处理已有信息所对应的物理机制。\n2. 技术要点是在弱耦合区解析求得平均切换功，表明编码成本取决于储层单元局域响应，而相互作用仅弱影响做功却负责信息再分配并产生记忆和非线性特征。\n3. 这一分离导致线性和非线性基准任务中能量代价与计算性能呈相反关联，提示切换功可作为编码能量印记并用于判断能效与性能可兼容的条件。", "summary_source": "deepseek", "authors": [{"name": "Gabriele Cenedese"}, {"name": "Gonzalo Manzano"}, {"name": "Gian Luca Giorgi"}, {"name": "Roberta Zambrini"}], "featured_authors": [{"name": "Gabriele Cenedese"}, {"name": "Gonzalo Manzano"}, {"name": "Gian Luca Giorgi"}, {"name": "Roberta Zambrini"}], "author_count": 4}, {"id": "2608.08346", "category": "quant-ph", "title": "Entanglement and non-local magic in a non-unitarily deformed non-Hermitian bipartite system", "abstract": "Non-Hermitian degeneracies are usually discussed through spectral coalescence, whereas entanglement is a property of eigenvectors and need not be fixed by the eigenvalues alone. We formulate a compact bipartite model that separates these two notions. A Hermitian operator with a degenerate eigenspace is transformed by an invertible non-unitary similarity map. The resulting Hamiltonian is non-Hermitian and retains a non-defective degeneracy at every finite value of the non-Hermiticity parameter. For an exactly solvable two-qubit realization, the right eigenstates evolve continuously from product states to maximally entangled states although the spectrum is unchanged. We distinguish the positive right-state reduced density matrix from the generally non-positive biorthogonal reduction, for which entropy may become complex. The same two-qubit solution gives a closed partial-transpose negativity and a Schmidt-gauged non-local magic. Entanglement grows monotonically with the non-Hermiticity parameter, whereas the non-local magic vanishes for both the product and maximally entangled limits and is largest at an intermediate coupling. In larger bipartite spaces, the Page entropy and Haar-averaged purity provide reference values for eigenstate typicality. These diagnostics separate non-defective degeneracy, exceptional-point sensitivity, Haar-typical entanglement, and non-stabilizer correlations without relying on a proliferation of basis-dependent spectral quantities.", "url": "https://arxiv.org/abs/2608.08346", "type": "理论", "summary": "1. 该工作通过可逆非幺正相似变换构造非厄米二分模型，在谱不变条件下分离谱简并与本征态纠缠，并研究非局域魔力。\n2. 其核心在于精确可解两比特解：右态纠缠随非厄米参数单调增至最大纠缠，而双向正交约化熵可变复，且部分转置负性与施密特规范的非局域魔力在中间耦合取峰值。\n3. 这为在更大二分空间中区分非缺陷简并、奇异点敏感性、Haar典型纠缠与非稳定子关联提供了不依赖基态谱量的诊断框架。", "summary_source": "deepseek", "authors": [{"name": "Chen-Huan Wu"}], "featured_authors": [{"name": "Chen-Huan Wu"}], "author_count": 1}, {"id": "2608.08403", "category": "quant-ph", "title": "Deep Holes in the Clifford Hierarchy", "abstract": "We determine the covering radius of the topological closure of the single-qubit Clifford hierarchy in $\\SU(2)\\cong S^3$. This closure is a union of $18$ great circles --- the Clifford--Pauli circles --- and we prove that its covering radius is $\\arccos\\sqrt{5/6}$. The extremal points, which we call \\emph{deep holes}, form a single orbit of size $192$ under left and right multiplication by Clifford gates, and are described in closed form. Equivalently, the minimum over one-qubit unitaries of the all-level Clifford fidelity is $5/6$. The proof rests on two structures attached to the configuration of $18$ planes in $\\R^4$: their centered rank-two projectors form an orthonormal basis of the irreducible $\\SO(4)$-module $\\Sym_0(4)$, and the projection profile of a unit quaternion is exactly its image under the double cover $\\SU(2)\\to\\SO(3)$. These reduce the covering problem to a minimax statement for the $\\ell^\\infty$-norm on $\\SO(3)$ which we solve exactly, classifying its equality cases.", "url": "https://arxiv.org/abs/2608.08403", "type": "理论", "summary": "1. 该工作确定了单比特 Clifford 层级拓扑闭包在 SU(2)≅S^3 中的覆盖半径，并证明其为 arccos√(5/6)，等价地给出全层级 Clifford 保真度的最小值 5/6。\n2. 其证明利用 18 个大圆簇的对称结构：中心化秩二投影子构成不可约 SO(4) 模 Sym_0(4) 的正交基，而单位四元数在二重覆盖下的投影轮廓将其化为 SO(3) 上 ℓ∞ 范数的极大极小问题，并分类了深洞这一 192 元轨道。\n3. 该精确覆盖半径给出了单比特幺正算符与任意 Clifford 层级元间距离的下确界，可直接指导量子门合成中的最优近似与保真度界限分析。", "summary_source": "deepseek", "authors": [{"name": "Ian Teixeira"}, {"name": "David Meyer"}], "featured_authors": [{"name": "Ian Teixeira"}, {"name": "David Meyer"}], "author_count": 2}, {"id": "2608.08464", "category": "quant-ph", "title": "Effect of Strong Field Space-time Features on Vacuum Pair", "abstract": "The relativistic dynamics of bound states across inertial reference frames are investigated using the computational quantum field theory (CQFT). The results reveal that the spatiotemporal properties of bound states within a given potential well are strictly frame-dependent. Crucially, this spatiotemporal modulation of the external field enables a reduction in the laser intensity threshold required for vacuum electron-positron pair creation. Analytical and numerical calculations demonstrate that this threshold reduction originates from the Lorentz transformation of the four-momentum, which reshapes the vacuum excitation pathways in phase space. By developing CQFT, we establish a comprehensive framework in which relativistic effects intrinsically govern the quantum vacuum decay process", "url": "https://arxiv.org/abs/2608.08464", "type": "理论+数值", "summary": "1. 该工作利用计算量子场论（CQFT）研究惯性参考系间束缚态的相对论动力学，表明势阱中束缚态的时空性质严格依赖于参考系，并考察强场时空特性对真空正负电子对产生的影响。\n2. 其核心发现是：外场的时空调制可通过四动量的洛伦兹变换重塑相空间中的真空激发路径，解析与数值计算表明该机制显著降低真空对产生的激光强度阈值。\n3. 这为将相对论效应内禀地纳入量子真空衰变过程的理论框架提供了基础，并可能促进低强度激光条件下真空正负电子对产生的实验探测。", "summary_source": "deepseek", "authors": [{"name": "B. An"}, {"name": "N.S. Lin"}, {"name": "C.K. Li"}, {"name": "M. Jiang"}, {"name": "Y.J. Li"}], "featured_authors": [{"name": "B. An"}, {"name": "N.S. Lin"}, {"name": "C.K. Li"}, {"name": "M. Jiang"}, {"name": "Y.J. Li"}], "author_count": 5}, {"id": "2608.08603", "category": "quant-ph", "title": "Quantum discord of Ganssian states in an expanding universe", "abstract": "We investigate the redistribution of continuous-variable quantum discord within the framework of an expanding universe. We find that quantum discord exhibits stronger sensitivity to the spacetime expansion rate than to the expansion volume. As both the expansion rate and expansion volume increase, the initial quantum discord shared by the two bosonic modes decays, while quantum discord is induced in additional mode pairs by the underlying spacetime expansion, signaling a global redistribution of quantum correlations across the system. Specifically, the induced discord is largest for cross-observer bosonic-antibosonic pairs, followed by same-observer bosonic-antibosonic pairs, and smallest for the pair of antibosonic modes. Furthermore, our quantum discord analysis demonstrates that particles with lower momentum and optimal mass serve as more favorable candidates for extracting information about the expanding universe. This work substantially enriches the theoretical framework of quantum discord in expanding spacetimes, and provides new perspectives as well as a solid theoretical foundation for further investigations.", "url": "https://arxiv.org/abs/2608.08603", "type": "理论", "summary": "1. 该工作研究膨胀宇宙背景下高斯态连续变量量子失协的再分配，发现初始双模量子失协随膨胀率与膨胀体积的增大而衰减，并在额外模对间产生诱导量子失协。\n2. 其核心卖点在于揭示量子失协对膨胀率的敏感性高于膨胀体积，且诱导失协按交叉观测者玻色-反玻色对、同观测者玻色-反玻色对、反玻色模对的顺序递减，体现了宇宙膨胀导致的量子关联全局再分配。\n3. 该结果指出较低动量与最优质量粒子是提取膨胀宇宙信息的更优候选，为相对论量子信息、弯曲时空量子关联及其宇宙学探测提供了理论依据与后续研究方向。", "summary_source": "deepseek", "authors": [{"name": "Siwei Li"}, {"name": "Xiaofen Huang"}], "featured_authors": [{"name": "Siwei Li"}, {"name": "Xiaofen Huang"}], "author_count": 2}, {"id": "2608.08619", "category": "quant-ph", "title": "Dissipation-engineered dual-charger quantum batteries", "abstract": "Suppressing coherent energy backflow while maintaining extractable energy in a stable nonequilibrium state remains a central challenge for quantum energy storage. Here, we introduce a reservoir-engineered dual-charger quantum battery architecture, in which nonequilibrium dissipation is exploited as a control resource to stabilize useful stored energy. A hot-reservoir-coupled driver supplies excitations, while a cold-reservoir-coupled cache biases the resonant three-body transition toward charging and suppresses the dressed-state coherences responsible for energy backflow. This mechanism establishes a population-inverted steady state with finite ergotropy and converts reversible charger--battery exchange into persistent energy storage. For uniformly spaced multilevel batteries, we show that the stored energy and ergotropy scale approximately linearly with the number of accessible levels, while the stored-energy utilization approaches unity. The accompanying stationary heat current provides a thermodynamic signature of the charging regime. Our results demonstrate dissipation engineering as a strategy for achieving stable and scalable quantum energy storage beyond transient coherent charging protocols.", "url": "https://arxiv.org/abs/2608.08619", "type": "理论", "summary": "1. 该工作提出一种耗散工程化的双充电器量子电池架构，利用非平衡耗散作为控制资源来稳定存储可用能量。\n2. 其核心机制是热库驱动供能、冷库缓存偏置共振三体跃迁朝向充电并抑制导致能量回流的缀饰态相干，从而建立具有有限ergotropy的粒子数反转稳态。\n3. 对均匀多能级电池，存储能量与ergotropy随能级数近似线性增长且利用率趋于一，伴随稳态热流作为充电特征，表明耗散工程可实现超越瞬态相干充电的可扩展稳定量子储能。", "summary_source": "deepseek", "authors": [{"name": "Yi-jia Yang"}, {"name": "Yu-qiang Liu"}, {"name": "Zheng Liu"}, {"name": "Zhi-Hao Ma"}, {"name": "Ming-Xing Luo"}, {"name": "Chang-shui Yu"}], "featured_authors": [{"name": "Yi-jia Yang"}, {"name": "Yu-qiang Liu"}, {"name": "Zheng Liu"}, {"name": "Zhi-Hao Ma"}, {"name": "Ming-Xing Luo"}, {"name": "Chang-shui Yu"}], "author_count": 6}, {"id": "2608.08668", "category": "quant-ph", "title": "Born-Oppenheimer, Born-Huang, and exact factorization: quantum geometry and error in analytically transparent benchmark models", "abstract": "The phrase \"potential energy surface\" refers to several distinct objects. The Born-Oppenheimer construction gives a clamped-nucleus electronic eigenvalue, the single-surface Born-Huang construction adds the diagonal correction, and exact factorization gives a state-dependent exact scalar potential. These constructions answer different questions and should not be regarded as competing definitions of one universal surface. We compare them in two analytically transparent benchmark models. For Fernández's bilinearly coupled oscillators, the exact molecular spectrum, the Born-Oppenheimer and Born-Huang spectra, and the ground-state exact-factorization surface are obtained in closed form. We prove the ground-state ordering of these energies for every admissible mass ratio and coupling and show why it does not extend uniformly to excited states. The diagonal Born-Huang correction is identified with the mass-weighted quantum metric, and Fernández's sixth-order result is recast as a leading geometric error budget involving the metric and a gap-weighted spectral moment of the same derivative couplings. In a linear vibronic-coupling model the metric localizes at an avoided crossing while the total Fubini-Study length remains $\\pi/2$, separating the localization of electronic-state change from its total magnitude. Exact factorization is smooth for the nodeless ground state but becomes increasingly ill-conditioned, while remaining finite, when an excited-state nuclear marginal becomes small. These models separate approximation error, geometric correction, and conditioning in a form that can be checked directly.", "url": "https://arxiv.org/abs/2608.08668", "type": "理论", "summary": "1. 该工作在两个可解析求解的基准模型中系统比较了Born-Oppenheimer、Born-Huang与精确因子化三种势能面构造，并给出封闭解。\n2. 其核心在于将Born-Huang对角修正识别为质量加权量子度量，并在线性振动耦合模型中展示了度量在避免交叉处的局域化与总Fubini-Study长度π/2的分离。\n3. 这为分离绝热近似误差、几何修正与条件数效应提供了可解析检验的模型，并启示了激发态精确因子化在核边缘概率密度变小条件下的病态性。", "summary_source": "deepseek", "authors": [{"name": "Stephen Wiggins"}], "featured_authors": [{"name": "Stephen Wiggins"}], "author_count": 1}, {"id": "2608.08687", "category": "quant-ph", "title": "Point-gap topology in amorphous non-Hermitian quantum systems", "abstract": "Recent studies have revealed that not only does the correspondence between spectral winding numbers and skin modes break down in non-Hermitian systems, but the energy spectrum itself is highly sensitive to generic perturbations, system size, and boundary conditions. In amorphous non-Hermitian systems, where the positions of lattice sites are uncertain, the spectral instability becomes even more severe, making it difficult to identify stable topological edge states from the eigenvalue spectrum alone. To overcome this challenge, we introduce a correspondence between stable zero-mode singular states and mid-gap states of the energy spectrum in the thermodynamic limit. Because the singular value spectrum is highly robust against small perturbations and variation in size, topological edge states can be reliably probed via singular values even in finite-sized systems. Based on the singular-value decomposition of the Hamiltonian, we construct a topological invariant in real space to characterize the associated topologically protected edge states. Our approach provides a general strategy for exploring point-gap topology in real space and redefine the non-Hermitian skin effect from a new perspective.", "url": "https://arxiv.org/abs/2608.08687", "type": "理论", "summary": "1. 该工作针对晶格位置不确定的非厄米无序量子系统，提出以奇异值谱取代本征能量谱来探测稳定的拓扑边缘态，并研究其点隙拓扑性质。\n2. 其卖点在于建立了热力学极限下稳定零模奇异态与能谱隙中态的一一对应，并基于哈密顿量的奇异值分解在实空间构造出表征边缘态的拓扑不变量。\n3. 由于奇异值谱对微扰和系统尺寸高度鲁棒，该方法可在有限尺寸无序体系中可靠探测拓扑现象，并为重新定义非厄米趋肤效应提供了新视角。", "summary_source": "deepseek", "authors": [{"name": "Xue-Min Yang"}, {"name": "Deng-Feng Li"}, {"name": "Jian Li"}, {"name": "Jia-Ji Zhu"}, {"name": "Li Li"}, {"name": "Qiu-Chi Chen"}, {"name": "Xin-Qi Xu"}, {"name": "Hao-Peng Zhang"}, {"name": "Hong Wu"}], "featured_authors": [{"name": "Xue-Min Yang"}, {"name": "Deng-Feng Li"}, {"name": "Jian Li"}, {"name": "Xin-Qi Xu"}, {"name": "Hao-Peng Zhang"}, {"name": "Hong Wu"}], "author_count": 9}, {"id": "2608.08694", "category": "quant-ph", "title": "A Resource-Efficient Quantum Framework for Graph Coloring and Chromatic Number Estimation", "abstract": "Many industrial optimization tasks can be modeled as graph coloring, where adjacent vertices must have different colors. This NP-hard problem is challenging for large graphs. We present a quantum encoding requiring qubits that scale logarithmically with the number of colors and linearly with vertices. Using adiabatic evolution with a novel mixer Hamiltonian and vertex terms, we compute the chromatic number and demonstrate robustness by solving constrained truck loading problems.", "url": "https://arxiv.org/abs/2608.08694", "type": "理论+数值", "summary": "1. 该工作提出一种资源高效的量子编码，用于图着色问题与色数估计。\n2. 其核心是采用含新型混频哈密顿量与顶点项的绝热演化，实现比特数随颜色对数、随顶点线性增长。\n3. 这为约束卡车装载等工业组合优化问题提供了中等规模量子求解的可行途径。", "summary_source": "deepseek", "authors": [{"name": "Francesco Turro"}, {"name": "Daniele Dragoni"}], "featured_authors": [{"name": "Francesco Turro"}, {"name": "Daniele Dragoni"}], "author_count": 2}, {"id": "2608.08798", "category": "quant-ph", "title": "Symmetry Constraints Regularize Neural Quantum State Learning", "abstract": "Neural quantum states (NQS) offer highly expressive variational wavefunctions, but their optimization is frequently bottlenecked by redundant parameters and poorly conditioned landscapes. We demonstrate that embedding Hamiltonian symmetries directly into the variational parameterization geometrically regularizes this learning problem. For Boltzmann-family NQS, we enforce symmetries by tying local Pauli-$Z$ generators along physical geometric orbits, analytically collapsing the trainable coefficient space prior to optimization. To quantify the resulting optimization geometry, we introduce a geometric metric built on the Jacobian and Hessian of the optimization landscape. This framework evaluates the fraction of the physically accessible state space that corresponds to high-quality, low-energy solutions. Evaluating our approach on transverse-field Ising (TFIM) and XXZ spin chains shows that symmetry compilation excises the vast majority of parameters while maintaining ground-state accuracy within the resolution of the reported benchmarks. In large TFIM systems, strong spatial constraints compress thousands of parameters down to tens, delivering substantial runtime accelerations. Our geometric diagnostics indicate that symmetry produces a more favorable target-aware geometry by concentrating the reachable state space around low-energy solutions while retaining broad target basins. Together, our results indicate that symmetry compilation concentrates the expressive power of NQS on states relevant to the target problem, thereby reducing model size and training cost without sacrificing accuracy.", "url": "https://arxiv.org/abs/2608.08798", "type": "理论+数值", "summary": "1. 该工作将哈密顿量对称性嵌入玻尔兹曼型神经量子态的变分参数化中，通过沿几何轨道绑定局域泡利-Z生成元来压缩训练参数空间。\n2. 主要卖点是引入基于优化景观雅可比与海森矩阵的几何度量，证明对称编译能集中可达态空间于低能解附近并保留宽目标盆地，从而正则化学习问题。\n3. 这为减少量子多体变分方法模型规模与训练成本而不损失精度提供了一种通用且可诊断的对称编译途径，并启发后续基于对称性的量子态学习几何分析。", "summary_source": "deepseek", "authors": [{"name": "Turbasu Chatterjee"}, {"name": "Manas Sajjan"}, {"name": "Songbo Xie"}, {"name": "Elliott Love"}, {"name": "Vinit Singh"}, {"name": "Bojko N. Bakalov"}, {"name": "Sabre Kais"}], "featured_authors": [{"name": "Turbasu Chatterjee"}, {"name": "Manas Sajjan"}, {"name": "Songbo Xie"}, {"name": "Vinit Singh"}, {"name": "Bojko N. Bakalov"}, {"name": "Sabre Kais"}], "author_count": 7}, {"id": "2608.08836", "category": "quant-ph", "title": "Two-copy distillability of one-copy-undistillable negative-partial-transpose states in every dimension", "abstract": "Whether negative-partial-transpose (NPT) states that are undistillable from one copy become distillable from finitely many copies remains a basic open problem in entanglement theory. We study the canonical two-parameter family of DiVincenzo \\textit{et al.}, introduced as a symmetry-reduced testbed for this question. We prove that a distinguished one-copy-undistillable state in this family is already two-copy distillable in every local dimension $d\\geq 3$. A uniform equal-norm tight-frame construction gives explicit Schmidt-rank-two certificates in every dimension, thereby disproving the conjecture that the entire one-copy-undistillable region of the canonical family remains undistillable for arbitrarily many copies. The same witnesses certify an open two-copy-distillable neighborhood around the counterexample, while separately constructed three-copy witnesses enlarge the inner bounds for the distillable region in the surrounding parameter space. In contrast, recent results for Werner states, together with the propagation argument of DiVincenzo \\textit{et al.}, establish a neighboring region of one-copy-undistillable states that remains two-copy undistillable. Thus a single symmetry-reduced family contains rigorously certified states with opposite two-copy behavior, separated by a substantial region whose finite-copy distillability remains unresolved.", "url": "https://arxiv.org/abs/2608.08836", "type": "理论+数值", "summary": "1. 该工作证明DiVincenzo等人两参数族中一个特殊的一拷贝不可蒸馏负部分转置态，在所有局域维度d≥3下均为两拷贝可蒸馏。\n2. 其技术核心是利用均匀等模紧框架构造各维度显式Schmidt秩二证人，否定该族一拷贝不可蒸馏区对任意多拷贝均不可蒸馏的猜想，并以同一证人给出开放邻域、以三拷贝证人扩大内界。\n3. 与Werner态近期结果对照，同一族中邻近区域保持两拷贝不可蒸馏，因而中间大片参数区的有限拷贝可蒸馏性仍待解决，为纠缠蒸馏提供了精确判定基准。", "summary_source": "deepseek", "authors": [{"name": "Gelo Noel M. Tabia"}, {"name": "Kai-Siang Chen"}, {"name": "Min-Hsiu Hsieh"}], "featured_authors": [{"name": "Gelo Noel M. Tabia"}, {"name": "Kai-Siang Chen"}, {"name": "Min-Hsiu Hsieh"}], "author_count": 3}, {"id": "2608.08931", "category": "quant-ph", "title": "The Logic of Partitions and Partition Logics: Ore's Correspondence, Contextual Pasting, and Direct-Sum Decompositions", "abstract": "The term ``partition logic'' denotes two constructions at different levels. In automaton and generalized-urn models, selected partitions generate Boolean event algebras whose contextwise union forms a concrete pasted event structure; in Ellerman's framework, whole partitions are classifications governed by refinement and partition operations. For a finite set $U$, Ore's correspondence maps each generator $\\pi$ to its Boolean algebra $\\BA(\\pi)$, but it neither identifies the pasted carrier with $\\Part(U)$ nor makes pasting a partition operation. It yields $\\BA(\\pi\\wedge\\sigma)=\\BA(\\pi)\\cap\\BA(\\sigma)$ and $\\BA(\\pi\\vee\\sigma)=\\langle\\BA(\\pi)\\cup\\BA(\\sigma)\\rangle_{\\rm BA}$, where $\\langle\\cdot\\rangle_{\\rm BA}$ denotes Boolean-algebra generation. Thus meet captures the common event algebra, whereas join gives the ambient Boolean closure. Chinese-lantern, Firefly, and triangular examples distinguish shared events, atomic intertwining, and inherited concrete order. Ellerman's direct-sum decompositions (DSDs) provide a vector-space analogue: component projections of an orthogonal DSD resolve the id
