entity and encode exclusive outcomes, but its components are not equivalence classes of vectors. Gleason and Kochen--Specker applications require globally context-consistent valuations on those projections.", "url": "https://arxiv.org/abs/2608.08931", "type": "理论", "summary": "1. 该文厘清划分逻辑在自动机与广义罐模型及Ellerman框架中的两种层级构造，借助Ore对应将有限集合U上每个划分生成元映射为布尔代数。\n2. 其技术要点在于证明交与并分别对应公共事件代数的交集与布尔生成闭包，并以中式灯笼、萤火虫和三角形例子区分共享事件、原子交织与继承的具体序结构。\n3. 针对Ellerman直接和分解的类向量空间类比，该工作提示量子测量投影需满足全局语境一致的赋值，为Gleason与Kochen-Specker类论证提供结构启发。", "summary_source": "deepseek", "authors": [{"name": "Karl Svozil"}], "featured_authors": [{"name": "Karl Svozil"}], "author_count": 1}, {"id": "2608.09007", "category": "quant-ph", "title": "Universal entropic occupation statistics in disordered bosonic resonators", "abstract": "Programmable microcavities support grand-canonical photon gases. We show that bosonic state counting creates an entropic staircase of most-probable total occupations. For detuning density continuous and nonzero at the chemical-potential threshold, the active-cell fraction is asymptotically linear at low temperature and the conditional law has a universal limit; for uniform disorder the law is exact over a finite temperature interval. For two modes it is the Gauss--Kuzmin distribution, linking photonic thermodynamics and metric number theory. We outline finite-array and dye-microcavity tests.", "url": "https://arxiv.org/abs/2608.09007", "type": "理论", "summary": "1. 该工作研究可编程无序玻色微腔中巨正则光子气体的占据统计，论证玻色子态计数使最可几总占据数呈现由熵驱动的阶梯结构。\n2. 其要点在于，当化学势阈值处失谐密度连续非零时，低温下活跃元胞占比渐近线性且条件分布具有普适极限；均匀无序情形下该分布在有限温度区间内严格成立，且双模体系对应Gauss-Kuzmin分布，将光子热力学与度量数论联系起来。\n3. 这为有限阵列与染料微腔中的实验检验提供了明确方案，并在可调控光子平台上开辟了探索普适占据规律与数论结构的新途径。", "summary_source": "deepseek", "authors": [{"name": "Orest Bucicovschi"}, {"name": "David A. Meyer"}], "featured_authors": [{"name": "Orest Bucicovschi"}, {"name": "David A. Meyer"}], "author_count": 2}, {"id": "2608.09215", "category": "quant-ph", "title": "A Heterogeneous Distributed Architecture for Quantum Simulation", "abstract": "Architectural specialization and distribution can help scale fault-tolerant quantum computers, but may also introduce substantial overheads from communication, routing, and resource duplication. We introduce a heterogeneous distributed architecture in which a magic core is connected to an extensible storage system composed of one-dimensional lanes of specialized cold-storage nodes. The storage system supports parallel random access to Pauli string parities. This organization is particularly well suited to fermionic quantum simulation, enabling parallel execution of the highly non-local Pauli strings arising from these systems. We evaluate the architecture on fault-tolerant simulations of the dynamics of the Fermi-Hubbard and sparse Sachdev-Ye-Kitaev (SYK) models on systems of up to 450 logical qubits. These workloads exhibit complementary communication structures: Fermi-Hubbard produces a spectrum of interactions from local to non-local shaped by lattice geometry, whereas sparse SYK produces highly non-local and overlapping Pauli operators. For a Trotter step of a 450-logical-qubit Fermi-Hubbard workload, a six-lane system with 30 T-state factories is within approximately $1.4\\times$ the wall-clock time of a homogeneous distributed architecture with 4 times as many T-state factories and substantially greater connectivity and sites for injecting magic. For matched T-factory counts, our architecture is $\\sim 2\\times$ faster.", "url": "https://arxiv.org/abs/2608.09215", "type": "理论+数值", "summary": "1. 该工作提出一种面向量子模拟的异构分布式容错量子计算架构，将魔态核心与由一维专用冷存储节点通道构成的扩展存储系统相结合，并针对多达450逻辑量子比特的Fermi-Hubbard与稀疏SYK模型进行了评估。\n2. 其核心卖点在于存储系统支持对Pauli串奇偶性的并行随机访问，从而并行执行费米子模拟中高度非局域的Pauli串；在T态工厂数相同时比同构分布式架构快约2倍，而仅需其四分之一数量的T态工厂即可达到相近的墙钟时间。\n3. 这表明通过专用冷存储通道的架构特化能显著降低非局域模拟负载的魔态注入与连通性开销，为大规模容错量子模拟机的设计提供了具体参照。", "summary_source": "deepseek", "authors": [{"name": "John Stack"}, {"name": "Sitong Liu"}, {"name": "Abhinav Anand"}, {"name": "Inder Monga"}, {"name": "Yuan Liu"}, {"name": "Erhan Saglamyurek"}, {"name": "Pedro L. S. Lopes"}, {"name": "Frank Mueller"}, {"name": "Katherine Klymko"}], "featured_authors": [{"name": "John Stack"}, {"name": "Sitong Liu"}, {"name": "Abhinav Anand"}, {"name": "Pedro L. S. Lopes"}, {"name": "Frank Mueller"}, {"name": "Katherine Klymko"}], "author_count": 9}, {"id": "2608.09301", "category": "quant-ph", "title": "High-fidelity controlled-phase gates for distinguishable quantum walkers via extended interactions", "abstract": "We investigate the implementation of controlled-phase (CP) gates with quantum walks in a dual-rail encoding through the use of interacting particles. While previous proposals have focused on indistinguishable particles (bosons or fermions) to achieve unitary fidelity for plane-wave scattering, practical implementations require finite-size wavepackets and routing through single-particle gates, both factors that introduce unavoidable fidelity losses. We show that extending the interaction range beyond on-site or first-neighbor terms provides sufficient control over the scattering potential to engineer CP gates with distinguishable particles that match the ideal bosonic/fermionic performance. For finite Gaussian wavepackets, we derive analytical approximations for the gate fidelity in terms of the transmission coefficient's magnitude and phase derivatives. We find that while distinguishable-particle scattering alone exhibits slightly lower fidelity than the indistinguishable case, the overall architecture that we propose avoids the additional single-particle gates required for routing indistinguishable particles. The roundabout gates needed for the latter indeed introduce fidelity losses approximately one order of magnitude larger than the interaction-induced losses, making the distinguishable-particle approach competitive for practical implementations. Our results establish multi-neighbor interactions as a tool for quantum information processing with continuous-time quantum walks and provide quantitative guidelines for optimizing gate fidelities in finite-size systems.", "url": "https://arxiv.org/abs/2608.09301", "type": "理论+数值", "summary": "1. 该工作提出利用扩展相互作用在双轨编码量子行走中实现可分辨粒子受控相位门的方案。\n2. 其卖点在于通过调节多邻位散射势规避可分辨粒子路由所需单粒子门，并给出高斯波包保真度关于透射系数的解析近似。\n3. 这为连续时间量子行走中多邻相互作用作为量子信息处理工具及有限尺寸系统保真度优化提供了定量指引。", "summary_source": "deepseek", "authors": [{"name": "Gaia Forghieri"}, {"name": "Matteo G. A. Paris"}], "featured_authors": [{"name": "Gaia Forghieri"}, {"name": "Matteo G. A. Paris"}], "author_count": 2}, {"id": "2608.09461", "category": "quant-ph", "title": "Probing Non-equilibrium baths: Frequency-Resolved Thermometry and Quantum Heat Current Turnover", "abstract": "Quantum heat transport for non-equilibrium steady state (NESS) exhibits a characteristic turnover effect, where the heat current reaches a maximum and subsequently declines as system-bath coupling increases. Although numerically exact methods can simulate this non-monotonic behavior, they offer limited information on the thermal state of the heat baths. Here, we introduce a frequency-selective thermometric protocol to probe the baths sustaining an NESS. By extracting a frequency-resolved effective temperature spectrum using a tunable two-level probe, we demonstrate that spectral dispersion serves as a direct witness for the non-equilibrium state of the heat baths. To demonstrate the protocol, we applied the hierarchical equations of motion to spin-boson and two-qubit models, though any exact method can be used. For both models, the turnover effect can be explained by how the thermal state of the heat baths evolves as the system-bath coupling strength increases.", "url": "https://arxiv.org/abs/2608.09461", "type": "理论+数值", "summary": "1. 该工作提出一种频率分辨的热测量协议，利用可调二能级探针提取维持量子非平衡稳态的热库的等效温度谱。\n2. 其物理卖点在于频谱色散作为非平衡态的直接判据，并借助层级运动方程在自旋玻色子与两量子比特模型中揭示热流先增后减的翻转起源于库热态随耦合强度的非单调演化。\n3. 该协议可与任何精确数值方法直接搭配，为实验上表征非平衡热库的频谱性质以及主动调控量子热输运提供了通用且可操作的诊断工具。", "summary_source": "deepseek", "authors": [{"name": "Akhil Bhartiya"}, {"name": "Tobias Kramer"}, {"name": "David Gelbwaser-Klimovsky"}], "featured_authors": [{"name": "Akhil Bhartiya"}, {"name": "Tobias Kramer"}, {"name": "David Gelbwaser-Klimovsky"}], "author_count": 3}, {"id": "2608.09496", "category": "quant-ph", "title": "Autoregressive Projective Quantum Monte Carlo: From a Hermitian to a Non-Hermitian Perspective", "abstract": "Accurately determining the ground-state properties of quantum many-body systems remains a central challenge. In this work, we introduce an autoregressive projective quantum Monte Carlo (PQMC) framework that leverages recurrent neural networks (RNNs) to guide the stochastic dynamics. By incorporating autoregressive sampling into PQMC, we demonstrate substantial improvements in accuracy compared to standard unguided PQMC, while retaining polynomial computational cost. We benchmark our approach against conventional variational RNN ansätze and find that the autoregressive PQMC consistently achieves lower energies and higher fidelity, regardless of system size or whether the Hamiltonian is Hermitian or non-Hermitian. Our results highlight the versatility and power of neural-guided PQMC methods, paving the way for promising scalable simulations of low-energy states in complex quantum many-body systems.", "url": "https://arxiv.org/abs/2608.09496", "type": "理论+数值", "summary": "1. 该工作提出自回归投影量子蒙特卡洛框架，用递归神经网络引导随机动力学求解量子多体基态性质。\n2. 其技术卖点是将自回归采样嵌入投影蒙特卡洛，以多项式成本显著提升精度，且在厄米与非厄米哈密顿量下均优于变分递归神经网络波函数。\n3. 这为神经引导量子蒙特卡洛方法可扩展地模拟复杂多体系统低能态提供了明确路径与启示。", "summary_source": "deepseek", "authors": [{"name": "Lavoisier Wah"}, {"name": "Remmy Zen"}, {"name": "Flore K. Kunst"}], "featured_authors": [{"name": "Lavoisier Wah"}, {"name": "Remmy Zen"}, {"name": "Flore K. Kunst"}], "author_count": 3}, {"id": "2608.09513", "category": "quant-ph", "title": "Faster Algorithms for Multimarginal Optimal Transport", "abstract": "We study algorithms for approximating the multimarginal optimal transport (MOT) distance, a generalization of the classic optimal transport distance, between $m$ discrete probability distributions each supported on at most $n$ points. We give a classical algorithm that computes a coupling between these marginals whose expected transportation cost is within an additive $\\varepsilon > 0$ of the MOT distance in time $O(m^2 n^m \\varepsilon^{-1}\\mathrm{polylog}(m,n,\\varepsilon^{-1}))$. This is, to our knowledge, the first bound for general MOT problems with simultaneous linear dependence on the dimension $n^m$ and on the accuracy parameter $\\varepsilon^{-1}$, improving the prior state of the art. On the quantum side, we give two algorithms that achieve speedups in dimension, though with worse accuracy dependence than classical approaches. First, we construct a quantum projected subgradient method for estimating the MOT distance within an additive $\\varepsilon >0$ with runtime $O( m^3 n^{\\frac{m}{2}+1} \\varepsilon^{-2} \\mathrm{polylog}(m,n,\\varepsilon^{-1}))$. This algorithm works with the linear programming dual of the MOT problem, and does not return a coupling. We also give a quantum multimarginal Sinkhorn algorithm for entropy-regularized MOT. This algorithm returns an implicit description of an approximately optimal coupling with runtime $O(m^8n^{\\frac{m+1}{2}} \\varepsilon^{-5} \\mathrm{polylog}(m,n,\\varepsilon^{-1})))$ after the usual reduction from entropic MOT to unregularized MOT. We also record query lower bounds: for any precision $\\varepsilon<1/2$, randomized classical algorithms require $\\Omega(n^m/(1+\\varepsilon n))$ queries and quantum algorithms require $\\Omega(\\sqrt{n^m/(1+\\varepsilon n)})$ queries.", "url": "https://arxiv.org/abs/2608.09513", "type": "理论+数值", "summary": "1. 该工作研究多边缘最优输运距离的近似算法，针对m个支撑大小至多n的离散分布，提出经典和量子算法并给出查询下界。\n2. 经典算法以O(m^2 n^m ε^{-1} polylog)运行，首次同时线性依赖n^m与ε^{-1}；量子投影次梯度与多边缘Sinkhorn算法虽在维度上加速，但精度依赖恶化。\n3. 这些复杂性界限与Ω(√(n^m/(1+εn)))等量子下界，为一般MOT问题的算法最优性及量子优势何时成立提供了明确基准。", "summary_source": "deepseek", "authors": [{"name": "Brandon Augustino"}, {"name": "Yue Sun"}, {"name": "Atithi Acharya"}, {"name": "Shouvanik Chakrabarti"}, {"name": "Junhyung Lyle Kim"}, {"name": "Shree Hari Sureshbabu"}, {"name": "Charlie Che"}], "featured_authors": [{"name": "Brandon Augustino"}, {"name": "Yue Sun"}, {"name": "Atithi Acharya"}, {"name": "Junhyung Lyle Kim"}, {"name": "Shree Hari Sureshbabu"}, {"name": "Charlie Che"}], "author_count": 7}, {"id": "2608.09583", "category": "quant-ph", "title": "A Highly Accurate Fast Decoding Framework for QLDPC codes Accelerated by Noise Perturbation and Ensemble Decoding", "abstract": "A well-balanced decoder has been central to the development of modern fault-tolerant quantum computing. However, the inherent topologies of quantum error correcting codes can limit the performance of many well-studied decoding algorithms. In this work, we introduce Noise Assisted Ensemble Decoding (NAED), a highly accurate decoding framework with a significant advantage in real-time speed. NAED constructs an ensemble of Tanner forests, obtained as acyclic subgraphs of the original Tanner graph, and performs exact inference on each Tanner forest using a lightweight dynamic programming algorithm. The forest construction is guided by synthetic soft information derived jointly from the measured syndrome and channel statistics, with controlled noise perturbations generating diverse yet informative decoding matrix column orderings for the Tanner forest construction across the ensemble. Our benchmark results show that the proposed synthetic soft information-driven construction and inference on the Tanner forests can achieve improved or comparable decoding performances to the state-of-the-art decoding solutions, such as BP+OSD$0$, while also providing orders-of-magnitude improvements in per-round decoding speed under circuit-level noise.", "url": "https://arxiv.org/abs/2608.09583", "type": "数值", "summary": "1. 该工作提出一种面向量子LDPC码的噪声辅助系综解码框架（NAED），通过对Tanner森林进行轻量级精确推断实现高精度快速解码。\n2. 其核心技术在于利用由实测症状与信道统计联合构造的合成软信息，并施加受控噪声扰动生成多样而有效的森林构建顺序，在电路级噪声下获得与BP+OSD0相当或更优的纠错性能，同时将每轮解码速度提升数个数量级。\n3. 该框架为容错量子计算中实时解码瓶颈提供了可扩展的实用方案，并启发将信道统计信息与结构化系综推断相结合的新一代解码算法设计。", "summary_source": "deepseek", "authors": [{"name": "Mainak Bhattacharyya"}, {"name": "Ankur Raina"}], "featured_authors": [{"name": "Mainak Bhattacharyya"}, {"name": "Ankur Raina"}], "author_count": 2}, {"id": "2608.09625", "category": "quant-ph", "title": "A Design Space Study of Density Matrix Parameterizations for Diffusion-Based Quantum State Tomography", "abstract": "Diffusion-based quantum state tomography (QST) has shown promising results, but all existing methods implicitly adopt a single parameterization---typically Cholesky---without systematic evaluation. We present a design space study of density matrix parameterizations for diffusion QST, introducing a geometric framework based on the Jacobian Gram matrix $\\mathbf{J}^\\top\\mathbf{J}$ that quantifies two competing criteria: isometric conditioning and physical constraint satisfaction. Our calibration of seven parameterizations at 2- and 3-qubit scales reveals three key findings. First, isometry and constraints are orthogonal criteria---no single parameterization optimizes both. Second, theoretical elegance does not predict geometric quality: the exponential map exhibits a spectral range of $149\\times$ at 2 qubits and $75\\,658\\times$ at 3 qubits, while simpler parameterizations remain well-conditioned. Third, geometric conditioning alone does not fully predict end-to-end performance: without classifier-free guidance (CFG), Hermitian direct outperforms Bloch despite worse local isometry; under CFG, the ranking reverses due to amplified boundary effects. End-to-end training confirms that better-conditioned parameterizations converge faster and achieve higher fidelity in the absence of CFG. We provide actionable selection guidelines to guide future QST method design.", "url": "https://arxiv.org/abs/2608.09625", "type": "理论+数值", "summary": "1. 作者系统评估了扩散量子态层析中七种密度矩阵参数化，引入基于雅可比Gram矩阵的几何框架统一量化等距条件与物理约束满足。\n2. 结果表明二者相互正交且理论优雅的参数化几何质量不佳，指数映射谱范围在二/三比特下分别达149倍与75658倍；端到端训练显示良态参数化在无引导时收敛更快、保真度更高。\n3. 该工作为后续量子态层析方法设计提供了可操作的参数化选择指南，并提示几何条件与生成引导之间存在需权衡的边界效应。", "summary_source": "deepseek", "authors": [{"name": "Shuangju Chang"}], "featured_authors": [{"name": "Shuangju Chang"}], "author_count": 1}, {"id": "2608.09659", "category": "quant-ph", "title": "A Domain-Specific Language for Formulating Hybrid Quantum-Classical Meta-Solver Strategies", "abstract": "A key challenge when designing hybrid quantum-classical workflows is the identification of quantum candidates, that is, determining for which specific problems quantum advantages could potentially be achieved. When choosing between several candidates, it is crucial to consider the characteristics specific to the problem, as these can fundamentally determine how successful quantum or classical approaches will be. This implies that specialized expertise is needed to use hybrid quantum-classical workflows successfully. To address this challenge, we propose a domain-specific language (DSL) to express best-practices in solution strategies using a universal representation that is easy to use and share. This DSL provides a flexible approach to design hybrid quantum-classical workflows and to automate decisions for a wide range of problems, supporting decisions down to problem-specific details while remaining technically independent. Furthermore, we propose a framework that is built around our DSL that enables the execution of defined workflows using the ProvideQ toolbox as an orchestration layer. All contributions from this publication are open source.", "url": "https://arxiv.org/abs/2608.09659", "type": "数值", "summary": "1. 该工作提出一种领域专用语言，旨在以通用且易共享的表示形式表达混合量子-经典元求解器的最佳实践策略，并给出围绕该语言的执行框架。\n2. 其核心卖点是让工作流决策自动下沉至问题特征相关的细节，在保持技术独立的同时辅助识别量子候选，从而降低运用混合量子-经典方法所需的专家门槛。\n3. 该开放框架以ProvideQ为编排层执行所定义的工作流，为不同问题定制混合求解策略及量子优势候选的系统筛选提供了可扩展的共享基础。", "summary_source": "deepseek", "authors": [{"name": "Nick Poser"}, {"name": "Domenik Eichhorn"}, {"name": "Ina Schaefer"}], "featured_authors": [{"name": "Nick Poser"}, {"name": "Domenik Eichhorn"}, {"name": "Ina Schaefer"}], "author_count": 3}, {"id": "2608.09661", "category": "quant-ph", "title": "Memory-, Circuit-, and Ansatz-Efficient VQLS for CFD on Hybrid Quantum-HPC Systems", "abstract": "Fluid dynamics workloads are dominated by repeated solves of large, structured linear systems, motivating the search for quantum acceleration. The Variational Quantum Linear Solver (VQLS) is a leading near-term candidate, but practical deployment on hybrid quantum--high--performance computing (HPC) systems faces three persistent challenges: (i) the linear-combination-of-unitaries (LCU) encoding of the system matrix explodes in memory and runtime as the problem size grows, (ii) ansatz selection is largely empirical, with no clear link between standard circuit metrics and solver convergence, and (iii) end-to-end VQLS pipelines have rarely been exercised on production HPC hardware at non-trivial qubit counts. This work addresses these challenges through three contributions. First, we benchmark four matrix-encoding strategies---naive LCU, PennyLane-integrated, Fast Walsh--Hadamard Transform (FWHT)-based parallel Pauli decomposition, and an singular value decomposition (SVD)-based two-term LCU---and show that the FWHT approach reduces peak memory by up to $1298\\times$ on an $11\\times 11$ Hele--Shaw grid, while the SVD-based coherent VQLS delivers over $10{,}000\\times$ per-iteration speedup over standard Pauli-based VQLS at 8 qubits. Second, we evaluate 11 ansatz families with gradient-free and gradient-based optimizers on canonical Hele--Shaw flow, and find that expressibility and entanglement metrics correlate only weakly with VQLS convergence, motivating problem-aware ansatz design. Third, we deploy the full workflow on the OLCF Frontier supercomputer and successfully simulate a 15-qubit tridiagonal Toeplitz system on a single node. Together, these results establish a practical baseline for VQLS in hybrid quantum--HPC computation fluid dynamic (CFD) workflows and identify the remaining bottlenecks for larger problems.", "url": "https://arxiv.org/abs/2608.09661", "type": "理论+数值", "summary": "1. 该工作面向混合量子-HPC系统上的流体动力学线性求解，系统评测了多种VQLS矩阵编码与11类拟设，并在Frontier超算上完成15比特三对角Toeplitz系统模拟。\n2. 其技术亮点在于FWHT并行Pauli分解将峰值内存降低约1298倍，而基于SVD的两项LCU相干VQLS在8比特下每迭代提速逾万倍，且发现表达力与纠缠度量与收敛性仅弱相关。\n3. 这为VQLS在CFD工作流中的实用化建立了基线，并指明扩展至更大规模问题时仍需解决的内存与收敛瓶颈。", "summary_source": "deepseek", "authors": [{"name": "Chao Lu"}, {"name": "Muralikrishnan Gopalakrishnan Meena"}, {"name": "Eduardo Antonio Coello Perez"}, {"name": "Kalyana Chakravarthi Gottiparthi"}, {"name": "Seongmin Kim"}], "featured_authors": [{"name": "Chao Lu"}, {"name": "Muralikrishnan Gopalakrishnan Meena"}, {"name": "Eduardo Antonio Coello Perez"}, {"name": "Kalyana Chakravarthi Gottiparthi"}, {"name": "Seongmin Kim"}], "author_count": 5}, {"id": "2608.09670", "category": "quant-ph", "title": "Microscopic QED origin of spin entanglement", "abstract": "We study effective spin interactions arising from quantum electrodynamics (QED) scattering between localized fermionic spins. By integrating out photon and mediator fields, the dynamics reduce to an effective spin Hamiltonian. For two qubits in the nonrelativistic regime, the resulting interaction takes a tensor dipolar form with an asymptotic decay proportional to \\(R^{-3}\\). We obtain analytical expressions for the entanglement negativity, highlighting its dependence on coupling strength and spatial configuration. We then examine a setup in which two bath spins interact via a sequential exchange with an intermediate fermionic mediator. At the perturbative order considered, the mediator remains unentangled and induces an effective bath--bath interaction with stronger spatial suppression than in the photon-mediated case. Extending the construction to an \\(N\\)-spin setting yields an effective interaction network mediated by virtual exchange processes, which can support the generation of multipartite entanglement across the system.", "url": "https://arxiv.org/abs/2608.09670", "type": "理论", "summary": "1. 该工作从量子电动力学微观散射出发，推导局域费米子自旋间的有效自旋哈密顿量，并解析研究其纠缠性质。\n2. 关键技术在于积分掉光子和中介场，得到非相对论双量子比特的张量偶极相互作用，其渐近衰减为R^{-3}，并给出纠缠负度对耦合强度与空间构型的依赖；对中介费米子顺序交换，中介体保持未纠缠，诱导的浴间作用空间抑制更强。\n3. 扩展到N自旋体系，虚拟交换过程形成有效相互作用网络，为多体纠缠的产生提供了微观QED起源和可解析验证的实现途径。", "summary_source": "deepseek", "authors": [{"name": "Moslem Zarei"}], "featured_authors": [{"name": "Moslem Zarei"}], "author_count": 1}, {"id": "2608.09695", "category": "quant-ph", "title": "Spread of Entanglement in Generalized Kicked Ising Chain", "abstract": "We investigate the dynamics of entanglement in a generalized version of the kicked Ising chain, extending the model from the standard qubit case (local dimension $q=2$) to higher local dimensions ($q > 2$). We identify the existence of ''dual-unitary'' points where the model's space-time duality allows for exact analytical solutions. Our analysis reveals that while a few unique dual-unitary points exist analytically for systems with local dimensions $q=3$ and $q=4$, such points do not exist for $q \\ge 5$ due to the lack of a unique kicking strength that satisfies the required matrix element conditions. Utilizing the transfer matrix method and a replica trick specifically adapted for higher dimensions, we derive exact expressions for the growth of entanglement entropy in the $q=3$ (kicked Potts-type) model starting from a class of solvable initial states. Our results demonstrate that at the dual-unitary point, both Rényi and von Neumann entanglement entropies grow linearly with time until reaching a maximum value determined by the subsystem size.", "url": "https://arxiv.org/abs/2608.09695", "type": "理论", "summary": "1. 该工作将踢自旋伊辛链推广至局域维度q>2，系统研究其纠缠增长，并特别关注双酉点的存在与效应。\n2. 技术上发现q=3、4存在解析双酉点，而q≥5因无单一踢强度满足矩阵元条件故不存在；并利用转移矩阵及适配高维的replica技巧精确求解q=3模型的纠缠熵演化。\n3. 在双酉点处，Rényi与von Neumann纠缠熵均随时间线性增长至子系统尺度决定的上限，为非可积高维量子动力学的精确纠缠传播提供了新范例。", "summary_source": "deepseek", "authors": [{"name": "Tanay Pathak"}, {"name": "Hiromi Ebisu"}, {"name": "Tomaž Prosen"}], "featured_authors": [{"name": "Tanay Pathak"}, {"name": "Hiromi Ebisu"}, {"name": "Tomaž Prosen"}], "author_count": 3}, {"id": "2608.09705", "category": "quant-ph", "title": "State Diagnostics of Complexity in Open Quantum Systems", "abstract": "We study the emergence of complexity in finite-size quantum systems as their dynamics transition from closed and coherent evolution to interacting and effectively open behavior. Using a state-based geometric framework, we represent mixed quantum states as probability measures on complex projective Hilbert space. This representation allows us to track how interactions reshape the underlying pure-state geometry. We introduce two complementary diagnostics: a distinguishability measure, based on the Wasserstein distance between probability-measure representations of mixed states, that quantifies sensitivity to initial states, and a state-space coverage index that measures long-time exploration of the subsystem state space. These diagnostics provide a geometric perspective on the emergence and evolution of quantum dynamical complexity. When applied to the quantum kicked top, both diagnostics generally increase with interaction strength. Their dependence on environment size is structured by parity symmetry, with integer-spin systems often exhibiting greater sensitivity and state-space coverage than half-integer-spin systems. These results highlight finite-size quantum effects and provide a geometric approach to quantifying dynamical complexity deep in the quantum regime", "url": "https://arxiv.org/abs/2608.09705", "type": "理论", "summary": "1. 该工作利用基于态的几何框架，将开放量子系统的混合态表示为复射影希尔伯特空间上的概率测度，研究有限尺寸系统从相干闭合到开放相互作用动力学中复杂性的涌现。\n2. 其技术卖点是提出两个互补诊断量：基于Wasserstein距离的可区分性度量用于量化对初态的敏感度，以及态空间覆盖率用于刻画子系统态空间的长期探索，二者在量子踢顶模型中均随相互作用强度增强而增大。\n3. 结果表明环境尺寸的影响受宇称对称性调控，整数自旋系统常比半整数自旋系统表现出更高的敏感性和覆盖率，为深量子区动力学复杂度提供了几何量化途径。", "summary_source": "deepseek", "authors": [{"name": "Komal Sah"}, {"name": "Fabio Anza"}, {"name": "Alexandra M. Jurgens"}, {"name": "James P. Crutchfield"}], "featured_authors": [{"name": "Komal Sah"}, {"name": "Fabio Anza"}, {"name": "Alexandra M. Jurgens"}, {"name": "James P. Crutchfield"}], "author_count": 4}, {"id": "2608.09727", "category": "quant-ph", "title": "Magic State Distillation via Codes over Binary Extension Fields", "abstract": "Fault-tolerant quantum computation architectures are frequently bottlenecked by the overhead of producing high-fidelity magic states. In this work, we use algebraic geometric techniques to construct codes over binary extension fields $\\mathbb{F}_{2^s}$, thus discovering new protocols for the distillation of qubit magic states, where our focus is on the regime of practical qubit-based quantum computing architectures. To do this, we show that multi-qubit gates of interest such as $\\text{CS}$, $\\text{CCZ}$, and $\\text{TOF}\\# = \\text{CCZ}_{123}\\text{CCZ}_{345}$, can be packaged into simple gates over the larger fields, and we derive simple algebraic conditions in the extension fields allowing the distillation of these gates. Because they are derived from Galois qudits, the corresponding qubits codes naturally handle the correlated errors present on such multi-qubit states. Moreover, the protocols we discover are extremely compact; for example, we show that 4 $\\text{CS}$ states can be distilled to 1 $\\text{CS}$ state at distance 2, using only 4 logical qubits. For a case study, we consider the distillation of $\\text{CS}$ and $\\text{CCZ}$ states from injected $\\text{T}$ and $\\text{CS}$ states. When optimized for magic state production per unit time, or logical spacetime volume, we find that our protocols outperform the state-of-the-art in almost every situation, both at input error rates $10^{-3}$ (direct injection), and $10^{-6}$ (allowing some cultivation pre-injection).", "url": "https://arxiv.org/abs/2608.09727", "type": "理论+数值", "summary": "1. 该工作利用二元扩域上的代数几何码构造量子魔法态蒸馏新协议，重点面向实用化量子比特架构中的低开销需求。\n2. 其技术卖点在于把CS、CCZ与TOF#等多量子比特门包装成扩域上的简单门并导出蒸馏的代数条件，使码能自然处理相关错误；例如仅用4个逻辑量子比特即可将4个CS态蒸馏为1个距离2的CS态。\n3. 在输入错误率10^-3与10^-6下，按单位时间魔法态产率或逻辑时空体积优化时，新协议几乎在所有情形下优于现有最优方案，为实用容错量子计算中魔法态生产提供了明确性能参考。", "summary_source": "deepseek", "authors": [{"name": "Anqi Gong"}, {"name": "Christopher A. Pattison"}, {"name": "Patrick Rall"}, {"name": "Adam Wills"}], "featured_authors": [{"name": "Anqi Gong"}, {"name": "Christopher A. Pattison"}, {"name": "Patrick Rall"}, {"name": "Adam Wills"}], "author_count": 4}, {"id": "2608.09749", "category": "quant-ph", "title": "Quantized Stabilizer-Rényi Boundary Response across Fermionic SPT Transitions", "abstract": "Open boundaries host symmetry-protected Majorana modes, yet their imprint on the stabilizer Rényi entropy is obscured by a nonuniversal volume law. At Rényi index $\\alpha=1/2$, we isolate a bulk-subtracted boundary response in free-fermion BDI chains using exact finite-open-chain relations, large-$L$ Pfaffian evaluations, and direct positive-weight checks. Across a mass inversion, this response approaches $|\\Delta\\omega|\\ln 2$, where $\\Delta\\omega$ is the change in winding number. The response survives primitive bulk deformations, the tested local boundary perturbations, and broken bulk duality. Thus, for the families studied here, the boundary response counts the Majorana channels that change the fermionic SPT index.", "url": "https://arxiv.org/abs/2608.09749", "type": "理论", "summary": "1. 该工作研究了自由费米子BDI链中稳定子Rényi熵的边界响应，通过有限开链精确关系、大L Pfaffian计算与正权重检验扣除体态贡献。\n2. 其核心结果是在Rényi指标α=1/2时，质量反转使该边界响应趋于|Δω|ln2，其中Δω为绕数变化，且此响应抵抗原始体态形变、局域边界微扰与体态对偶破缺。\n3. 这为利用稳定的边界量子信息响应来计数改变费米子SPT指标的Majorana通道和判定拓扑不变量提供了具体途径。", "summary_source": "deepseek", "authors": [{"name": "M. A. Rajabpour"}], "featured_authors": [{"name": "M. A. Rajabpour"}], "author_count": 1}, {"id": "2608.09823", "category": "quant-ph", "title": "Quantum Information Flow under String-Diagram Rewriting", "abstract": "We revisit the notion of ``quantum information flow'' introduced in Bob Coecke's early work and seek to give it an explicit string-diagrammatic formalization. Given a semantics preserving string-diagram rewriting sequence, we first distinguish apparent through-paths, which depend on the current graphical presentation, from genuine through paths, which can be compatibly inherited through successive rewrites to a terminal decoupled bare wire factor. We then formally define a ``Coecke flow line'' in terms of this compatible inheritance relation. In particular, we use the ZX calculus, i.e., the ZX string diagram rewriting system, to illustrate the resulting formalism. In the physical setting of quantum protocols, a Coecke flow can be interpreted as a constrained, quasi-local, line-like presentation of a target bare wire morphism factor within the protocol string diagram.", "url": "https://arxiv.org/abs/2608.09823", "type": "理论", "summary": "1. 该工作为Coecke早期提出的量子信息流概念给出了显式弦图形式化，并区分表观贯通路径与可在重写中相容继承的真贯通路径。\n2. 其核心在于以相容继承至末端解耦裸线因子的关系定义Coecke流线，并借助ZX演算演示该图形重写系统的语义保持结构。\n3. 这为量子协议中准局域线状信息传播提供了严谨图形刻画，可启发量子线路简化与信息流自动验证的后续工具发展。", "summary_source": "deepseek", "authors": [{"name": "Yi-Yu Lin"}, {"name": "Chen-Ye Li"}], "featured_authors": [{"name": "Yi-Yu Lin"}, {"name": "Chen-Ye Li"}], "author_count": 2}, {"id": "2608.09832", "category": "quant-ph", "title": "An upper bound for the purity of absolutely positive partial transpose states", "abstract": "A quantum state is called absolutely separable (resp. absolutely positive partial transpose (APPT)) if it remains separable (resp. positive partial transpose (PPT)) under any global unitary transformation. It is known that the set of all absolutely separable states is a subset of the set of all APPT states. Moreover, these two sets are identical for qubit-qudit systems. In this note, we give an upper bound for the purity of APPT bipartite states (and therefore for the purity of absolutely separable bipartite states). For qubit-qudit systems, this upper bound becomes the maximum purity of APPT (and absolutely separable) states.", "url": "https://arxiv.org/abs/2608.09832", "type": "理论", "summary": "1. 该工作针对任意整体酉变换下保持正部分转置性质的APPT双量子态，给出了其纯度的一个上界，由此也约束了绝对可分态的纯度。\n2. 技术关键在于该上界在qubit-qudit系统中成为APPT与绝对可分态的最大纯度，从而精确刻画了这两类态集合边界在该情形下的重合特征。\n3. 这一结果可为判定一般双量子态是否绝对可分或APPT提供可操作的纯度判据，并对纠缠资源理论与量子信息处理中的态制备问题具有参考价值。", "summary_source": "deepseek", "authors": [{"name": "Anh T. Tran"}], "featured_authors": [{"name": "Anh T. Tran"}], "author_count": 1}, {"id": "2608.09912", "category": "quant-ph", "title": "Learning Clifford-structured quantum unitaries and Hamiltonians", "abstract": "Learning algorithms for structured quantum unitaries and Hamiltonians have primarily considered classes of processes that are local or sparse in the Pauli basis. We turn our attention to learning $n$-qubit quantum unitaries $U$ and Hamiltonians $H$, given query access to $U$ or the unitary evolution of $H$, that may be dense in the Pauli basis but still admit concise Clifford decompositions. Specifically, we consider unitaries (or Hamiltonians) of the form $U = \\sum_i \\alpha_i C_i$ over Cliffords $C_i$ with bounded Clifford extent $\\sum_i |\\alpha_i|$. To extract this Clifford structure, we introduce an agnostic tomography protocol for Clifford unitaries that given query access to an unknown unitary $U$ with optimal Clifford fidelity $\\textsf{opt}$, outputs a Clifford unitary witnessing fidelity $\\geq \\textsf{opt} - \\varepsilon$ for some error $\\varepsilon > 0$, in time $\\textsf{poly}(n,(1/\\varepsilon)^{\\log(1/\\varepsilon)})$. We then apply this protocol to obtain tomography protocols for unitaries and Hamiltonians that have bounded Clifford extent. This extends learnability of Hamiltonians from those with sparse Pauli decompositions to those that are dense (i.e., has sparsity $\\Omega(2^n)$) in the Pauli basis but are Clifford structured.", "url": "https://arxiv.org/abs/2608.09912", "type": "理论+数值", "summary": "1. 该工作研究具有有界Clifford展开的n比特量子酉算符与哈密顿量的层析成像，此类算符在Pauli基下可能稠密但仍具有简洁Clifford分解。\n2. 其核心是提出Clifford酉算符的不可知层析协议，在最优Clifford保真度为opt时，可输出保真度不低于opt−ε的Clifford酉，用时poly(n,(1/ε)^{log(1/ε)})。\n3. 该结果将哈密顿量可学习性从Pauli稀疏类推广到Pauli基下稠密但具Clifford结构的系统，为结构化量子过程与哈密顿量学习开辟了新类别。", "summary_source": "deepseek", "authors": [{"name": "Arkopal Dutt"}, {"name": "Dale Jacobs"}, {"name": "John Jeang"}, {"name": "Saeed Mehraban"}, {"name": "Vladimir Podolskii"}], "featured_authors": [{"name": "Arkopal Dutt"}, {"name": "Dale Jacobs"}, {"name": "John Jeang"}, {"name": "Saeed Mehraban"}, {"name": "Vladimir Podolskii"}], "author_count": 5}, {"id": "2608.09913", "category": "quant-ph", "title": "From Koszul-Complex Stabilizer Models to Superselection Profiles: Topological Rigidity and Nonsplit Extensions", "abstract": "Koszul-complex stabilizer models unify the toric-code hierarchy and bivariate-bicycle codes in one homological framework. To study translation-symmetry-enriched topological (SET) phases in these models and, more generally, in translation-invariant Calderbank-Shor-Steane (CSS) codes with stabilizer maps $(\\varphi_X,\\varphi_Z)$, we introduce the associated topological superselection profile $\\mathscr S_\\sigma:=\\tau_{\\geq1}\\mathbf R\\!\\operatorname{Hom}_R(\\overline{\\operatorname{coker}\\varphi_\\sigma},R),\\ \\sigma=X,Z$. Its cohomology layers $E_\\sigma^\\ell:=H^\\ell(\\mathscr S_\\sigma)\\cong_R\\operatorname{Ext}_R^\\ell(\\overline{\\operatorname{coker}\\varphi_\\sigma},R)$ encode sectors, fusion, and translation action. When finite, the $\\ell=1,2,\\ldots$ layers describe pointlike, looplike, and higher-dimensional excitations; $\\mathscr S_\\sigma$ retains inter-layer gluing. For regular Koszul models, we compute $E_\\sigma^\\ell$ explicitly, find $\\mathscr S_\\sigma$ single-layer, and obtain finite-size $Z$-logicals from $\\operatorname{Tor}$. Single-layer means that at most one positive-degree layer $E_\\sigma^\\ell$ is nonzero. Our matrix-level Schanuel-lemma method proves rigidity: under a finite-resolution hypothesis, the nonzero layer and degree uniquely determine a topological CSS code's translation SET order at the stable translation-invariant Clifford level. For prime qudits the hypothesis is automatic, and a finite layer's translation kernel gives the exact minimal coarse graining to a toric-code stack. We realize admissible single-layer data. Beyond this regime, split and nonsplit extensions of 3D qubit toric codes yield eight models sharing all identical $E_\\sigma^\\ell$ layers with trivial translation action but having distinct size-dependent ground-state degeneracies, hence distinct translation SET phases. Thus inter-layer gluing carries SET data invisible to individual layers.", "url": "https://arxiv.org/abs/2608.09913", "type": "理论", "summary": "1. 该工作为平移不变CSS码定义拓扑超选择剖形，将toric码层级与双变量双循环码统一于Koszul复形同调框架，并用其各阶余调层描述点状、环状及高维激发。\n2. 其卖点是矩阵级Schanuel引理方法：在有限分辨率假设下，非零层及其次数唯一决定稳定Clifford等价类的平移SET序；素数qudit情形自动成立，并给出粗粒化到toric码叠的精确最小核。\n3. 该结果不仅为拓扑CSS码的SET相分类提供刚性判据，还通过3D qubit toric码的分裂与非分裂扩展构造八种层数据相同但基态简并度不同的模型，揭示层间胶合携带不可见SET信息。", "summary_source": "deepseek", "authors": [{"name": "Hao Song"}], "featured_authors": [{"name": "Hao Song"}], "author_count": 1}, {"id": "2608.09915", "category": "quant-ph", "title": "Decoupling 2D translation-invariant topological CSS codes", "abstract": "Two-dimensional translation-invariant topological CSS codes on qubits are known to be locally equivalent, after coarse-graining, to stacks of toric codes. However, existing constructions generally break more translation symmetry than is required to remove anyon-permuting translations, leaving open whether any further obstruction exists. We prove that no such obstruction occurs: after passing to the maximal anyon-preserving superlattice, every such code admits a local unitary decoupling into toric codes and product states. We further provide an efficient algorithm for explicitly constructing the decoupling map, together with bounds on the required supercell size and operator spreading. The decoupling requires no additional ancillas in generic cases and extends to finite systems with suitable boundary conditions.", "url": "https://arxiv.org/abs/2608.09915", "type": "理论+数值", "summary": "1. 该文证明二维平移不变拓扑CSS码在过渡到最大任意子保持超晶格后，不再存在阻碍其局域幺正解耦为环面码与乘积态的额外障碍。\n2. 其技术要点是给出显式高效算法构造解耦映射，并界定所需超胞尺寸与算符扩展范围，且一般情形无需辅助比特，并适用于合适边界的有限体系。\n3. 这为任意子平移对称性之外的拓扑CSS码分类提供了完备性视角，也为解码资源的理论估计与数值构造给出可操作依据。", "summary_source": "deepseek", "authors": [{"name": "Yifei Wang"}, {"name": "Zhongyi Ni"}, {"name": "Mingxin He"}, {"name": "Jinguo Liu"}, {"name": "Yingfei Gu"}], "featured_authors": [{"name": "Yifei Wang"}, {"name": "Zhongyi Ni"}, {"name": "Mingxin He"}, {"name": "Jinguo Liu"}, {"name": "Yingfei Gu"}], "author_count": 5}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>${paper.summary_source === "deepseek" ? "DeepSeek three-sentence PRL summary" : (paper.summary_source === "local-fallback" ? "Local three-sentence fallback" : (paper.summary_source === "translation" ? "Chinese abstract translation" : "Chinese placeholder fallback"))}</span><a href="${safeUrl}" target="_blank" rel="noreferrer">Open arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
</body>
</html>
