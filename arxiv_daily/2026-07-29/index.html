<html lang="zh-CN">
<head>
  <meta charset="utf-8">

  <title>arXiv 2026-07-29 · Daily ArXiv Selection</title>
  <style>
    :root {
      --bg: #f6f1e8;
      --panel: rgba(255, 252, 246, 0.92);
      --text: #2d241d;
      --muted: #6d5d50;
      --line: rgba(69, 49, 32, 0.14);
      --accent: #8f3d2e;
      --accent-2: #1d5f6b;
      --theory: #7c3a2a;
      --numeric: #255b6a;
      --both: #5d4a99;
      --experimental: #2f6b39;
      --shadow: 0 18px 40px rgba(54, 32, 16, 0.12);
      --radius: 22px;
      --ui-font: "Aptos", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --title-font: "Palatino Linotype", "Noto Serif SC", Georgia, serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--ui-font);
      color: var(--text);
      background: radial-gradient(circle at top left, rgba(255,255,255,0.78), transparent 32%), radial-gradient(circle at 88% 12%, rgba(29,95,107,0.14), transparent 20%), linear-gradient(180deg, #fbf7f0 0%, var(--bg) 42%, #f2e8dc 100%);
      min-height: 100vh;
    }
    .shell { width: min(1220px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 64px; }
    .hero {
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(255,255,255,0.84), rgba(255,248,238,0.72)), linear-gradient(135deg, rgba(143,61,46,0.08), rgba(29,95,107,0.08));
      box-shadow: var(--shadow);
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.82); border: 1px solid var(--line); color: var(--muted); font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase;
    }
    h1 { margin: 18px 0 10px; font-family: var(--title-font); font-size: clamp(32px, 5vw, 54px); line-height: 1.04; letter-spacing: -0.03em; }
    .hero p { max-width: 880px; color: var(--muted); font-size: 16px; line-height: 1.7; margin: 0; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-top: 26px; }
    .stat { padding: 16px 18px; background: rgba(255,255,255,0.76); border: 1px solid var(--line); border-radius: 18px; }
    .stat .label { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
    .stat .value { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
    .controls { position: sticky; top: 12px; z-index: 3; margin-top: 22px; padding: 18px; border: 1px solid var(--line); border-radius: 24px; background: rgba(250,244,236,0.9); backdrop-filter: blur(16px); box-shadow: 0 10px 24px rgba(54,32,16,0.08); }
    .control-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 16px; }
    .field { display: flex; flex-direction: column; gap: 10px; }
    .field label { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
    .search { width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line); background: rgba(255,255,255,0.92); font: inherit; color: var(--text); }
    .chip-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .chip { border: 1px solid var(--line); background: rgba(255,255,255,0.82); color: var(--text); padding: 10px 14px; border-radius: 999px; font: inherit; cursor: pointer; }
    .chip.active { border-color: rgba(143,61,46,0.35); background: rgba(143,61,46,0.12); color: #5b2419; }
    .chip[data-type="数值"].active { border-color: rgba(37,91,106,0.35); background: rgba(37,91,106,0.12); color: #173f49; }
    .chip[data-type="理论+数值"].active { border-color: rgba(93,74,153,0.35); background: rgba(93,74,153,0.12); color: #46337d; }
    .chip[data-type="实验"].active { border-color: rgba(47,107,57,0.35); background: rgba(47,107,57,0.12); color: #214c29; }
    .meta-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 14px; color: var(--muted); font-size: 14px; }
    .paper-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 18px; margin-top: 22px; }
    .paper { display: flex; flex-direction: column; gap: 14px; padding: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 10px 24px rgba(54,32,16,0.06); }
    .paper-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .tag { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid transparent; }
    .tag.category { background: rgba(45,36,29,0.08); color: var(--text); }
    .tag.type-theory { background: rgba(124,58,42,0.1); color: var(--theory); border-color: rgba(124,58,42,0.16); }
    .tag.type-numeric { background: rgba(37,91,106,0.1); color: var(--numeric); border-color: rgba(37,91,106,0.16); }
    .tag.type-both { background: rgba(93,74,153,0.1); color: var(--both); border-color: rgba(93,74,153,0.16); }
    .tag.type-experimental { background: rgba(47,107,57,0.1); color: var(--experimental); border-color: rgba(47,107,57,0.16); }
    .paper h2 { margin: 0; font-family: var(--title-font); font-size: 22px; line-height: 1.25; letter-spacing: -0.02em; }
    .paper h2 a { color: inherit; text-decoration: none; }
    .paper h2 a:hover { color: var(--accent); }
    .paper .id { color: var(--muted); font-size: 13px; }
    .author-block { display: grid; gap: 10px; padding: 14px 16px; border-radius: 18px; background: rgba(255,255,255,0.64); border: 1px solid var(--line); }
    .author-label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .author-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .author-item { display: grid; gap: 4px; }
    .author-item strong { font-size: 14px; }
    .author-item span { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .author-note { color: var(--muted); font-size: 12px; }
    .paper .summary { margin: 0; font-size: 15px; line-height: 1.75; white-space: pre-line; }
    details { border-top: 1px solid var(--line); padding-top: 12px; }
    details summary { cursor: pointer; color: var(--accent-2); font-weight: 700; list-style: none; }
    details summary::-webkit-details-marker { display: none; }
    details p { margin: 10px 0 0; color: var(--muted); line-height: 1.72; font-size: 14px; white-space: pre-line; }
    .paper footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 6px; color: var(--muted); font-size: 13px; }
    .paper footer a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .empty { display: none; margin-top: 24px; padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 22px; background: rgba(255,255,255,0.7); }
    @media (max-width: 980px) { .control-grid { grid-template-columns: 1fr; } .controls { position: static; } }
  </style>

  <script>
    const papers = [{"id": "2607.24925", "category": "cond-mat", "title": "Effective Field Theory of Operator Scrambling from Strong-to-Weak Symmetry Breaking", "abstract": "Operator scrambling is commonly diagnosed by the growth of out-of-time-ordered correlators (OTOCs), yet a general symmetry principle underlying their effective dynamics has remained elusive. For Brownian or short-time-correlated large-$N$ Majorana systems, we develop a symmetry-based effective field theory for operator scrambling, organized by a strong-to-weak U(1) symmetry breaking in operator space. The key observation is that, in the noninteracting fermion limit, the four-fold Keldysh contour representation of an OTOC admits an emergent strong U(1) symmetry in a doubled Hilbert-space description, even when the original system has no ordinary conserved quantity. The associated slow mode is the phase of the strong-charge creation operator, whose conjugate density is identified with the local operator size. Generic interactions explicitly break the strong symmetry and generate a mass term at lowest order for the would-be Goldstone mode, thereby converting diffusive operator spreading into chaotic growth. We further show that higher-order symmetry breaking terms are tightly constrained by an emergent duality that combines time reversal with contour permutation. This duality fixes the effective action up to quadratic order in the response field, relates the multiplicative noise strength directly to the Lyapunov exponent, and makes the positivity of the Lyapunov exponent a consequence of convergence of the real-time path integral. The resulting OTOC dynamics is governed by a noisy FKPP equation, which captures within a unified framework the early-time exponential growth, ballistic propagation, nonlinear saturation, and stochastic front broadening of operator scrambling. We verify this construction in a Brownian SYK chain, where a direct saddle-point expansion reproduces the symmetry-based effective action. Our results reveal a symmetry origin of operator-size hydrodynamics and scrambling.", "url": "https://arxiv.org/abs/2607.24925", "type": "理论", "summary": "1. 该工作针对布朗或短时关联大N马约拉纳系统，建立了基于强到弱U(1)对称性破缺的算符置乱有效场论，将OTOC动力学纳入对称性框架。\n2. 其核心在于揭示非相互作用极限下四点Keldysh轮廓中涌现的强对称性，慢模相位共轭密度对应局域算符大小，相互作用产生Goldstone模质量项将扩散置乱转化为混沌增长，且有效作用量受时间反演-轮廓对偶约束至响应场二次阶，乘性噪声强度直接关联Lyapunov指数。\n3. 该理论由噪声FKPP方程统一描述早期指数增长、弹道传播与非线性饱和，并在布朗SYK链中通过鞍点展开验证，为算符大小流体力学与混沌的对称性起源提供了普适框架。", "summary_source": "deepseek", "authors": [{"name": "Bai-Lin Cheng"}, {"name": "Shao-Kai Jian"}, {"name": "Zhi-Cheng Yang"}], "featured_authors": [{"name": "Bai-Lin Cheng"}, {"name": "Shao-Kai Jian"}, {"name": "Zhi-Cheng Yang"}], "author_count": 3}, {"id": "2607.24944", "category": "cond-mat", "title": "Organizing Principles for Moiré Quantum Matter", "abstract": "Moiré flat bands in van der Waals bilayers are usually discussed through a small set of mechanisms associated with the $\\Gamma$ and $K$ valleys of hexagonal crystals, and more recently with $M$-valleys systems. Here we show that this view is incomplete. The momentum-space location and effective local orbital character of the monolayer's band edge, in conjunction with the moiré symmetry and the symmetry representations of the resulting bands, provide a general set of organizing variables for the emergent low-energy moiré Hamiltonian. Applying fully relaxed first-principles calculations, band unfolding and symmetry-representation analysis to more than 600 commensurate twisted bilayers spanning all 2D lattice classes, we identify several routes to moiré quantum matter beyond the conventional single-orbital paradigm. The resulting flat bands realize trigonal, honeycomb, square, checkerboard and kagome-like Hubbard models with single-orbital, multi-orbital and multi-site Hilbert spaces; spin-orbit-coupled multi-orbital flat bands exhibit symmetry-indicated topology beyond the conventional $K$-valley setting; and nonsymmorphic moiré symmetries enforce semimetallic flat-band connectivity. Analogous quasi-one-dimensional flat-band structures are found in $M$-valley hexagonal systems and $X$-valley square or rectangular systems resulting from emergent momentum-space nonsymmorphic symmetries. Separately, coupled multi-valley manifolds with kagome-like connectivity are identified in several systems whose parent band edges lie at non-high-symmetry points. These results establish a valley-orbital-symmetry framework for connecting parent-material electronic structure to emergent moiré Hamiltonians relevant to correlated, topological and symmetry-enforced moiré phases.", "url": "https://arxiv.org/abs/2607.24944", "type": "理论+数值", "summary": "1. 该工作通过对超过600种扭曲双层的第一性原理计算与对称性分析，建立了基于动量空间能带边缘位置和局域轨道特征的谷-轨道-对称性组织框架，系统刻画莫尔量子物质的涌现低能哈密顿量。\n2. 其核心卖点是识别出超越传统单轨道Γ/K谷范式的多种平带实现路径，包括多轨道/多格点Hubbard模型、自旋轨道耦合诱导拓扑、非对称性导致的半金属连接，以及M/K/X谷系统中类一维结构与耦合多谷Kagome连接。\n3. 这为从母体材料电子结构出发，合理设计关联、拓扑及对称性驱动的莫尔物相提供了统一的理论框架与系统映射原则。", "summary_source": "deepseek", "authors": [{"name": "Qiaoling Xu"}, {"name": "Yifan Gao"}, {"name": "Tao Zhang"}, {"name": "Ammon Fischer"}, {"name": "Yi Jiang"}, {"name": "Hanqi Pi"}, {"name": "Zike Fan"}, {"name": "Dongdong An"}, {"name": "Kun Zhou"}, {"name": "Yingjian Li"}, {"name": "Yongqing Li"}, {"name": "Yuhao Fu"}, {"name": "Lei Wang"}, {"name": "Lijun Zhang"}, {"name": "B. Andrei Bernevig"}, {"name": "Dante M. Kennes"}, {"name": "Enge Wang"}, {"name": "Angel Rubio"}, {"name": "Lede Xian"}], "featured_authors": [{"name": "Qiaoling Xu"}, {"name": "Yifan Gao"}, {"name": "Tao Zhang"}, {"name": "Enge Wang"}, {"name": "Angel Rubio"}, {"name": "Lede Xian"}], "author_count": 19}, {"id": "2607.24975", "category": "cond-mat", "title": "Strongly-connected percolation on directed lattices", "abstract": "We study percolation on lattices with directed bonds, focusing on the behavior of strongly-connected percolation clusters -- clusters in which every site is reachable from every other along a directed path. We consider the two-dimensional square lattice and various globally isotropic arrangements of the directions of the bonds. Performing simulations using a range of algorithmic approaches, we calculate high-precision values for critical exponents, fractal dimensions, crossing probabilities, and percolation thresholds for bond percolation with each bond arrangement. We find that the critical behavior is in a distinctly different universality class from that of traditional undirected percolation, but that all bond arrangements appear to fall in the same universality class.", "url": "https://arxiv.org/abs/2607.24975", "type": "理论+数值", "summary": "1. 该工作系统研究了二维有向正方晶格上强连通渗流簇的临界行为。\n2. 高精度模拟揭示其临界指数、分形维数与无向渗流分属不同普适类，但各向同性键方向排列均属同一类。\n3. 这为理解有向系统中渗流相变的普适性分类提供了关键数值证据。", "summary_source": "deepseek", "authors": [{"name": "M. E. J. Newman"}, {"name": "P. Grassberger"}, {"name": "R. M. Ziff"}], "featured_authors": [{"name": "M. E. J. Newman"}, {"name": "P. Grassberger"}, {"name": "R. M. Ziff"}], "author_count": 3}, {"id": "2607.25030", "category": "cond-mat", "title": "Phase Transitions and Order Parameters in Correlation Matrices: A Wishart-Ensemble Perspective on the Largest Eigenvalue", "abstract": "We investigate the properties of the largest eigenvalue of correlation matrices within the framework of Wishart ensembles. In this work, we propose the largest eigenvalue as an effective empirical order parameter for detecting phase transitions in chaotic and spin systems, drawing an analogy between its derivatives and thermodynamic response functions derived from the free energy, however not necessarily linked to a critical divergence originally observed in the context of phase transitions theory.", "url": "https://arxiv.org/abs/2607.25030", "type": "理论", "summary": "1. 该工作从Wishart随机矩阵系综出发，研究相关矩阵最大特征值的统计性质，并提议将其作为检测混沌系统与自旋系统相变的经验序参量。\n2. 其核心卖点在于将最大特征值对参数的导数与自由能导出的热力学响应函数（如比热）进行类比，从而在不依赖临界发散的前提下有效识别相变。\n3. 这为利用相关矩阵谱分析诊断复杂系统相变行为提供了非传统途径，并促进随机矩阵理论向统计物理序参量框架的推广。", "summary_source": "deepseek", "authors": [{"name": "Roberto da Silva"}, {"name": "Antonio Mihara"}, {"name": "Henrique Tramontina"}, {"name": "Sandra D. Prado"}], "featured_authors": [{"name": "Roberto da Silva"}, {"name": "Antonio Mihara"}, {"name": "Henrique Tramontina"}, {"name": "Sandra D. Prado"}], "author_count": 4}, {"id": "2607.25087", "category": "cond-mat", "title": "The effect of side chain length on the mesomorphic properties of ferroelectric nematogens", "abstract": "The discovery of ferroelectric nematic phase opened new directions in the field of soft matter chemistry and physics. In this paper, we have modified a previously reported ferroelectric nematogen based on molecular structure with dimethylamino-terminated part. We have prepared two new homologues by prolonging a side chain and investigated the effect of its length on the mesomorphic properties. While previously reported homologues exhibited a direct phase transition from the isotropic (Iso) to the ferroelectric nematic phase (NF), for prolonged alkyl chain there is a narrow nematic phase (N) in between. For new compounds, we have established their mesomorphic and material properties. We have confirmed ferroelectricity of the NF phase by the polarization, SHG signal and permittivity. Finally, we have compared these parameters with respect to the side-chain length and discussed new effects, discovered for prolonged homologues due to the presence of an additional N phase.", "url": "https://arxiv.org/abs/2607.25087", "type": "理论", "summary": "1. 该工作通过延长侧链制备两种新型铁电向列相液晶同系物，系统研究了侧链长度对中介性质的影响。\n2. 其物理亮点在于发现延长侧链使原本直接由各向同性相进入铁电向列相的转变变为经由窄中间向列相的分步相变，并通过极化、二次谐波和介电常数确认了铁电性。\n3. 这揭示了侧链长度通过调控中间向列相的出现影响铁电向列相稳定性，为设计具有可控相变序列的铁电液晶材料提供了结构-性质关系指导。", "summary_source": "deepseek", "authors": [{"name": "Natalia Podoliak"}, {"name": "Martin Cigl"}, {"name": "Pavlo Golub"}, {"name": "Anej Sterle"}, {"name": "Marta Lavrič"}, {"name": "Nerea Sebastian"}, {"name": "Aitor Erkoreka"}, {"name": "Josu Martinez-Perdiguero"}, {"name": "Alenka Mertelj"}, {"name": "George Cordoyiannis"}, {"name": "Vladimíra Novotná"}], "featured_authors": [{"name": "Natalia Podoliak"}, {"name": "Martin Cigl"}, {"name": "Pavlo Golub"}, {"name": "Alenka Mertelj"}, {"name": "George Cordoyiannis"}, {"name": "Vladimíra Novotná"}], "author_count": 11}, {"id": "2607.25089", "category": "cond-mat", "title": "First-Principles Origins of Charge Transport in Molecular Semiconductors", "abstract": "Charge transport governs organic transistors and photovoltaics, yet predicting it from atomic structure remains challenging. Electron--phonon interactions span disparate frequencies, strengths and spatial ranges, and collectively generate nonperturbative carrier dynamics. Existing methods regain tractability only by assuming a mechanism or reducing electron--phonon coupling to a few modes. We introduce a parameter-free framework that instead computes transport from ab initio electron--phonon Hamiltonians, propagating carriers across hundreds-of-molecule domains with the full phonon spectrum and letting transport regimes and bottlenecks emerge from nonperturbative Green--Kubo dynamics. Across five representative crystals, it captures measured mobilities, temperature exponents, and optical-conductivity fingerprints. Our results overturn the prevailing microscopic mechanism for DNTT, tracing its transient localization to correlated on-site disorder from acoustic phonons rather than independent hopping fluctuations. The resulting two-axis transport map provides design principles and highlights the underexplored phenacene family, exemplified by the high-mobility picene, as a promising direction.", "url": "https://arxiv.org/abs/2607.25089", "type": "理论+数值", "summary": "1. 该工作提出了一个无参数的第一性原理框架，通过非微扰Green-Kubo动力学计算分子半导体中电荷输运，跨越数百分子尺度并保留完整声子谱。\n2. 其卖点在于从原子结构直接重现五种代表性晶体的迁移率、温度指数及光学电导率，并推翻DNTT传统机制，揭示瞬态局域化源于声学声子关联的位点无序。\n3. 这提供了基于声子关联的输运设计原则，并凸显phenacene家族（如picene）是待探索的高迁移率材料方向。", "summary_source": "deepseek", "authors": [{"name": "Tong Jiang"}, {"name": "Joonho Lee"}], "featured_authors": [{"name": "Tong Jiang"}, {"name": "Joonho Lee"}], "author_count": 2}, {"id": "2607.25256", "category": "cond-mat", "title": "Anomalous entanglement scaling from eigenvector nonorthogonality in critical non-Hermitian free fermions", "abstract": "Entanglement carries universal content that labels phases and critical points. We study the entanglement entropy of the steady states of critical non-Hermitian free-fermion chains. It scales logarithmically with subsystem size, but the coefficients vary continuously with the parameters and form a Rényi family that no single central charge can reproduce. We trace this anomaly to an ``imaginary'' Dirac point, a crossing in the imaginary part of the energy where the occupied state switches between two Bloch states. Their nonorthogonality weakens the occupation discontinuity and lowers the logarithmic coefficient. A low-energy expansion yields closed-form coefficients in excellent agreement with lattice numerics in various one-dimensional critical steady states. Remarkably, weak real onsite disorder leaves this logarithmic scaling intact and enhances the entanglement. Our results provide a generic understanding of entanglement in critical non-Hermitian free-fermion steady states.", "url": "https://arxiv.org/abs/2607.25256", "type": "理论", "summary": "1. 该工作研究临界非厄米自由费米子链稳态的纠缠熵，发现其对数标度系数随参数连续变化并形成反常Rényi族，无法用单一中心荷描述。\n2. 物理卖点在于揭示该反常源于本征向量非正交性导致的“虚”狄拉克点，通过布洛赫态占据切换削弱费米面不连续性并降低对数系数，低能展开给出与数值吻合的闭式系数。\n3. 这一框架为理解非厄米临界系统纠缠熵的普适标度提供了机制，并表明弱无序可增强纠缠，启发对非平衡稳态纠缠结构的进一步研究。", "summary_source": "deepseek", "authors": [{"name": "Zhenyu Xiao"}, {"name": "Shinsei Ryu"}], "featured_authors": [{"name": "Zhenyu Xiao"}, {"name": "Shinsei Ryu"}], "author_count": 2}, {"id": "2607.25359", "category": "cond-mat", "title": "Van Hove singularity-driven giant Nernst signal in twisted double bilayer graphene", "abstract": "Twisted graphene layers host van Hove singularities (vHSs), peaks in the electronic density of states, thought to drive exotic phases in moiré materials, but their effect on thermal transport has remained unclear. Here we show that vHSs in twisted double bilayer graphene (tDBLG) generate an unusually large Nernst signal-the transverse voltage produced by a longitudinal temperature gradient in a magnetic field. The pronounced Nernst peaks at the vHSs of the conduction and valence bands of tDBLG are tunable by an electric field with a maximum value of $\\sim 40$ $\\mu V K^{-1} T^{-1}$ at $\\sim 1$ $K$, which is comparable to the best-known Nernst materials. Our theoretical calculations show that the large enhancement of the Nernst signal arises from the Lifshitz transitions around the vHSs. These findings establish the Nernst effect as a sensitive probe of Fermi-surface topology in moiré materials, and identify a universal thermoelectric signature of van Hove singularities.", "url": "https://arxiv.org/abs/2607.25359", "type": "数值", "summary": "1. 该工作通过实验测量发现，在扭转双层石墨烯中，导带与价带的van Hove奇点处可以产生巨大的Nernst热电信号，在约1K温度下其峰值达到约40 μV K^{-1} T^{-1}，且信号强度可以通过外加电场连续调节。\n2. 理论计算的创新之处在于，该巨Nernst效应的物理机制并非简单的能态密度增强，而是van Hove奇点驱动费米面发生Lifshitz转变，即拓扑结构从开放轨道变为闭合轨道，从而极大增强了横向热电输运。\n3. 这一发现将Nernst效应确立为研究莫尔超晶格系统费米面拓扑的灵敏探针，同时为识别二维材料中van Hove奇点提供了一种通用的热电信号特征，对理解相关强关联物理和设计热电转换器件具有启示意义。", "summary_source": "deepseek", "authors": [{"name": "Ujjal Roy"}, {"name": "Monosij Roy"}, {"name": "Unmesh Ghorai"}, {"name": "Arkaprava Mukherjee"}, {"name": "Ravi Kumar"}, {"name": "Kenji Watanabe"}, {"name": "Takashi Taniguchi"}, {"name": "Nandini Trivedi"}, {"name": "Rajdeep Sensarma"}, {"name": "Subroto Mukerjee"}, {"name": "Anindya Das"}], "featured_authors": [{"name": "Ujjal Roy"}, {"name": "Monosij Roy"}, {"name": "Unmesh Ghorai"}, {"name": "Rajdeep Sensarma"}, {"name": "Subroto Mukerjee"}, {"name": "Anindya Das"}], "author_count": 11}, {"id": "2607.25360", "category": "cond-mat", "title": "Relaxation of quenched structural glasses: descent in a stiffening caging potential over inflection-point 'speed bumps'", "abstract": "The slow energy relaxation in quenched glasses is a ubiquitous yet poorly understood phenomenon. Despite extensive study, the microscopic origin of the observed power-law decay remains debated, with proposed mechanisms ranging from saddle-point slowdown and marginal stability to coarsening of localized excitations and phonon dynamics. Here, by simulating gradient descent in archetypal structural glass formers, we show that none of these scenarios can account for our data. Instead, the power-law behavior emerges from a remarkably simple caging effect: each particle experiences an effective stiffening potential that arises from many-body confinement and diverges at a characteristic cage size. This mechanism analytically yields the observed power-law decay and is quantitatively reproduced by a minimal single-particle cage model with fixed neighbours, demonstrating that collective relaxation modes are not essential. The dynamics is punctuated by fluctuations as the system rolls through inflection points on the energy landscape, which act as `speed bumps' but do not affect the overall power-law behaviour. In contrast to mean-field spin glass theory, we find no characteristic temperature that separates distinct dynamical regimes; state following within a given glass basin occurs universally for all initial temperatures whenever the system is sufficiently close to the inherent structure. Our results establish a complete physical picture of gradient descent dynamics in typical structural glasses.", "url": "https://arxiv.org/abs/2607.25360", "type": "理论", "summary": "1. 该工作通过模拟典型结构玻璃形成体的梯度下降动力学，揭示了淬火玻璃中能量弛豫幂律行为的微观起源。\n2. 其物理核心在于发现每个粒子因多体约束而经受一发散于特征笼尺寸的硬化有效势，该单粒子笼模型无需集体模式即可定量复现幂律衰减。\n3. 这为结构玻璃的缓慢弛豫建立了完整物理图像，并表明该机制在足够接近固有结构时对初始温度普适，且无平均场自旋玻璃理论中的特征温度。", "summary_source": "deepseek", "authors": [{"name": "Ting Qu"}, {"name": "Deng Pan"}, {"name": "Yuliang Jin"}], "featured_authors": [{"name": "Ting Qu"}, {"name": "Deng Pan"}, {"name": "Yuliang Jin"}], "author_count": 3}, {"id": "2607.25374", "category": "cond-mat", "title": "Logarithmic Aging Diffusion from a Multiplicative Event Clock: Rare Event Statistics, Ultraslow Transport, and Ensemble-Time Inequivalence", "abstract": "Logarithmic time dependences occur in many aging materials, but neither a $\\ln t$ relaxation law nor a $1/t$ event rate uniquely identifies the underlying stochastic mechanism. We examine a specific log-aging process defined by iterating the age-conditioned forward-recurrence law after every event. This rule makes the event times multiplicative: the logarithmic ratios $U_n=\\ln(T_{n+1}/T_n)$ are independent and identically distributed with an explicit non-exponential density. Consequently, both the mean and the variance of the event count grow linearly with $\\ln(t/t_0)$, while the density of the $n$th event time has a log-normal central sector and a fixed-$n$ algebraic far tail. These clock statistics generate logarithmic drift and spreading, an Einstein relation under local detailed balance, and ultraslow transit and target-survival laws. They also separate trajectory reproducibility from ensemble--time equivalence: the relative scatter of the time-averaged mean-square displacement decays as $1/\\ln(T/t_0)$, although its mean does not converge to the ensemble lag MSD. We distinguish the exact event-level construction from its diffusion-limit generalized Fokker--Planck and random-clock subordination representations, and from a generalized-Langevin closure that can match selected responses and covariances but need not reproduce event counts or rare-duration statistics. The proposed clock is therefore tested not by a single logarithmic curve, but by the joint, no-refitting consistency of multiplier, count, transport, first-passage, and finite-window observables.", "url": "https://arxiv.org/abs/2607.25374", "type": "理论", "summary": "1. 该工作构建了一个基于乘性事件钟的对数老化扩散模型，事件时间比值的对数服从独立同分布的非指数密度。\n2. 其主要卖点在于精确刻画了事件计数、对数漂移与超慢输运的统计规律，并揭示了系综-时间不等价性与轨迹可重复性的分离。\n3. 这为老化材料中单一对数律不足以鉴别微观机制提供了严格判据，要求通过多观测量的联合自洽性检验进行模型验证。", "summary_source": "deepseek", "authors": [{"name": "Chunyan Li"}, {"name": "Zheng Li"}, {"name": "Yueyan Li"}, {"name": "Haiwen Liu"}, {"name": "X. C. Xie"}], "featured_authors": [{"name": "Chunyan Li"}, {"name": "Zheng Li"}, {"name": "Yueyan Li"}, {"name": "Haiwen Liu"}, {"name": "X. C. Xie"}], "author_count": 5}, {"id": "2607.25385", "category": "cond-mat", "title": "Reciprocal theorem for ion-releasing colloidal particles", "abstract": "We describe a generalization of the reciprocal theorem for particles suspended in electrolyte solutions and subjected to an electric field that could be either applied or emerged spontaneously. Attention is focused on catalytic colloids that release ions. The power of the generalization is to capture the effect of formation of a secondary cloud around a catalytic particle, which is equivalent to accounting for an excess charge $Q$ of a system. Our results show that the propulsion speed of catalytic particles has an extra contribution proportional to $Q$ and an external field $E_{\\infty}$. The derived equation for $Q$ reveals that its sign is defined by the difference in the ion diffusivity and the magnitude is controlled by the average flux of ions from the surface. We demonstrate the application of the generalized theorem to electro- and diffusiophoresis of homogeneously releasing ions passive particles, as well as to a self-propulsion of inhomogeneous active particles (microswimmers). It is shown that whilst in some situations the extra term in the reciprocal theorem vanishes or has a little effect on the particle mobility, in many others it may dramatically change its magnitude, and even sign. In addition, the relevance of our results for microswimmer interactions is discussed briefly.", "url": "https://arxiv.org/abs/2607.25385", "type": "理论", "summary": "1. 该工作将互易定理推广至释放离子的催化胶体颗粒，适用于外加或自发电场中的电解质悬浮体系。\n2. 其核心在于通过等效过量电荷Q捕获催化颗粒周围次级离子云团效应，发现推进速度存在正比于Q与外加场E∞的额外项，且Q符号由离子扩散系数差决定、大小受表面平均通量控制。\n3. 这揭示了额外项在多种情形下可显著改变颗粒迁移率的大小甚至符号，为理解微泳者自推进及相互作用提供了关键启发。", "summary_source": "deepseek", "authors": [{"name": "Evgeny S. Asmolov"}, {"name": "Olga I. Vinogradova"}], "featured_authors": [{"name": "Evgeny S. Asmolov"}, {"name": "Olga I. Vinogradova"}], "author_count": 2}, {"id": "2607.25424", "category": "cond-mat", "title": "Nonlocal Majorana polarization in non-Hermitian topological superconductors", "abstract": "The nonlocal Majorana polarization, defined as the product of the expectation values of the particle-hole operator at opposite halves of the system, has been shown to be a reliable topological indicator that determines the presence and quality of Majorana zero modes in Hermitian topological superconducting setups. In this work, we extend the concept of nonlocal Majorana polarization to the non-Hermitian realm by taking into account the biorthogonal eigenstates and demonstrate its utility by exploring distinct non-Hermitian superconducting systems. In particular, we show that the Majorana polarization can distinguish between Majorana zero modes, trivial zero-energy states, and exceptional points in non-Hermitian superconductors. Also, we introduce the concept of nonlocal Majorana polarization sensitiviy for characterizing the contribution of non-Hermiticity to Majorana polarization. As a byproduct, we find that non-Hermiticity enhances Majorana zero modes robustness, a property captured by the nonlocal Majorana polarization.", "url": "https://arxiv.org/abs/2607.25424", "type": "理论", "summary": "1. 该工作将非局域马约拉纳极化概念拓展至非厄米拓扑超导体系，基于双正交本征态给出定义。\n2. 其核心是引入极化敏感度以量化非厄米性贡献，并能区分马约拉纳零模、平庸零能态与异常点。\n3. 这揭示非厄米性可增强马约拉纳零模鲁棒性，为拓扑量子计算中的零模判据提供新视角。", "summary_source": "deepseek", "authors": [{"name": "Arjun S. Kumar"}, {"name": "Jorge Cayao"}, {"name": "Oladunjoye A. Awoga"}], "featured_authors": [{"name": "Arjun S. Kumar"}, {"name": "Jorge Cayao"}, {"name": "Oladunjoye A. Awoga"}], "author_count": 3}, {"id": "2607.25434", "category": "cond-mat", "title": "Don't truncate, decompose: mean-field dynamics of long-range quantum systems from strongly correlated states", "abstract": "We challenge the widespread consensus that mean-field theory fails to describe long-range open quantum systems in the presence of symmetry breaking and/or when starting from strongly correlated states (e.g., macroscopic superpositions). While recent literature relies on cumulant expansions to capture such systems, this approach rests on truncations with no clear justification. Here, we show that it is, at best, conceptually redundant in the strong long-range regime. We show that the evolution can be decomposed into, and fully reconstructed from, independent mean-field dynamics. This decomposition generates the entire hierarchy of cumulants and, as a byproduct, identifies---to our knowledge, for the first time---a regime in which cumulant expansions exactly predict low-order cumulants. We illustrate the power of our findings with two applications: we compute the moment generating function for nonequilibrium $\\mathcal{Z}_2$ symmetry breaking, and construct states restoring time-translation symmetry in time crystals. In both cases, our method fully reproduces the exact many-body dynamics, which is out of reach of cumulant expansions. Our results reclaim the exactness of mean-field theory, offering a transparent framework for large-scale open quantum systems.", "url": "https://arxiv.org/abs/2607.25434", "type": "理论", "summary": "1. 本文挑战了平均场理论在长程开放量子系统中因对称性破缺或强关联初态而失效的共识，证明其动力学可分解为独立平均场演化的精确重构。\n2. 其技术核心在于不依赖截断的分解方法，天然生成整个累积量层级，并首次识别出累积量展开精确预测低阶累积量的参数区间。\n3. 该方法为大规模开放量子系统的可解建模提供了透明框架，理论恢复平均场在远距离作用下的精确性，可推广至时间晶体等非平衡现象。", "summary_source": "deepseek", "authors": [{"name": "Federico Carollo"}], "featured_authors": [{"name": "Federico Carollo"}], "author_count": 1}, {"id": "2607.25462", "category": "cond-mat", "title": "Covariance Geometry of Basis-Resolved Low-Energy Wavefunctions in the Spin-$1/2$ Kitaev--Heisenberg Model", "abstract": "We develop a basis-resolved covariance framework for investigating the organization of low-energy many-body wavefunctions in the spin-$1/2$ Kitaev--Heisenberg model. By constructing covariance matrices from local-spin, bond-correlation, and plaquette-flux representations of the low-energy states, Principal Component Analysis (PCA) is employed to identify the dominant collective covariance modes. We find a systematic evolution of the covariance geometry across the phase diagram: magnetically ordered phases are described by an essentially one-dimensional covariance manifold, conventional magnetic phase boundaries exhibit competition between leading covariance modes, whereas the Kitaev regimes develop intrinsically multidimensional covariance geometry. Furthermore, the same many-body wavefunction produces distinct covariance geometries in different operator representations, demonstrating that covariance geometry is determined jointly by the quantum state and the physical observables used to probe it. Shannon entropy and the participation ratio provide quantitative measures of this evolution. The present framework establishes basis-resolved covariance geometry as a complementary statistical perspective for characterizing frustrated quantum many-body systems beyond conventional order parameters.", "url": "https://arxiv.org/abs/2607.25462", "type": "理论+数值", "summary": "1. 该工作为自旋-1/2 Kitaev–Heisenberg模型低能多体波函数建立基分辨协方差框架，通过PCA识别主导集体协方差模式。\n2. 核心发现是协方差几何维度随相图系统演化：磁有序相呈一维流形，常规磁相边界出现主导模竞争，Kitaev区展现本质多维结构。\n3. 该框架以协方差几何作为超越传统序参量的统计视角，为表征受挫量子自旋系统提供了互补分析工具。", "summary_source": "deepseek", "authors": [{"name": "Sk Saniur Rahaman"}, {"name": "S. R. Hassan"}], "featured_authors": [{"name": "Sk Saniur Rahaman"}, {"name": "S. R. Hassan"}], "author_count": 2}, {"id": "2607.25470", "category": "cond-mat", "title": "Anisotropic domain wall velocity profiles in the creep regime: the interplay of chiral damping, stiffness and Dzyaloshinskii-Moriya interaction", "abstract": "The asymmetric expansion of magnetic bubble domains in ultrathin ferromagnets provides a powerful route to probe the interfacial Dzyaloshinskii-Moriya interaction (DMI). While conventional analyses rely on domain wall velocities measured along selected directions as a function of in-plane field, recent approaches have highlighted the additional insight contained in the angular dependence of the velocity, $v(\\theta)$. Here, we develop an extended angular creep model that incorporates both the dispersive domain wall stiffness and a chirality-dependent prefactor associated with chiral damping. This generalization captures the full anisotropic dynamics of domain wall motion around a bubble domain. We show that these contributions significantly modify the angular velocity profile and can lead to features not accessible within existing models. Our results establish a more complete framework for interpreting creep-driven domain expansion and provide improved sensitivity for the quantitative extraction of DMI and chiral dynamical effects.", "url": "https://arxiv.org/abs/2607.25470", "type": "理论", "summary": "1. 该工作针对传统仅沿特定方向测量畴壁速度方法的局限，建立了一个扩展的角蠕变模型，全面描述超薄铁磁体中磁泡畴壁在蠕变区的各向异性速度角分布，并系统阐述了手性阻尼、畴壁刚度色散与Dzyaloshinskii-Moriya相互作用三者的协同作用。\n2. 其核心技术要点是在模型中同时纳入了色散畴壁刚度和手性依赖的动力学前因子，揭示了这些因素如何显著改变速度角轮廓并产生现有蠕变模型无法复现的新特征，从而提升了对界面DMI测量灵敏度和定量提取精度。\n3. 这一更完备的理论框架为蠕变驱动磁畴膨胀实验提供了可靠的解析工具，有望从速度角分布中更准确、更灵敏地分离并定量提取界面DMI强度及手性阻尼参数，对理解手性自旋动力学及优化相关自旋电子学器件具有重要指导意义。", "summary_source": "deepseek", "authors": [{"name": "Adriano Di Pietro"}, {"name": "Alessandro Magni"}, {"name": "Stefania Pizzini"}, {"name": "Frowin Dörr"}, {"name": "Yasser Shokr"}, {"name": "Gianfranco Durin"}, {"name": "Silvia Tacchi"}, {"name": "Marco Madami"}, {"name": "Giovanni Carlotti"}, {"name": "Emily Darwin"}, {"name": "Alexandra J. Huxtable"}, {"name": "Christopher H. Marrows"}, {"name": "Bryan J. Hickey"}, {"name": "Michaela Kuepferling"}], "featured_authors": [{"name": "Adriano Di Pietro"}, {"name": "Alessandro Magni"}, {"name": "Stefania Pizzini"}, {"name": "Christopher H. Marrows"}, {"name": "Bryan J. Hickey"}, {"name": "Michaela Kuepferling"}], "author_count": 14}, {"id": "2607.25483", "category": "cond-mat", "title": "Anisotropic bond-current susceptibilities and real-space current topology in correlated electron systems", "abstract": "We derive all symmetry-allowed bond-current form factors generated by nearest-neighbor bond-charge interactions on square, triangular, and kagome lattices. We find that the anisotropy of the bond-current susceptibility systematically favors ordering wave vectors that support closed loop-current states, whereas symmetry-related wave vectors with weaker susceptibility generate noncirculating current textures. Near van Hove filling, this correspondence is robust across all lattice geometries considered, producing staggered flux phases on the square lattice, diamond-shaped current patterns on the triangular lattice and both chiral and nonchiral loop-current states on the kagome lattice. Our results establish a direct link between bond-current form factors, susceptibility anisotropy, and real-space current topology, providing a general framework for identifying loop-current orders and interpreting signatures of time-reversal symmetry breaking in correlated electron materials.", "url": "https://arxiv.org/abs/2607.25483", "type": "理论", "summary": "1. 该工作推导了正方、三角与Kagome格点上近邻键电荷相互作用允许的全部键流形状因子，并计算了键流磁化率的各向异性。\n2. 其核心发现是磁化率各向异性系统性地偏好能形成闭环电流态的序波矢，而弱各向异性对应非循环电流纹理，该关联在van Hove填充附近普遍成立。\n3. 这建立了键流形状因子、磁化率各向异性与实空间电流拓扑的直接联系，为识别环流有序及解释时间反演对称破缺信号提供了通用框架。", "summary_source": "deepseek", "authors": [{"name": "Worapon Phatcharasirinawakun"}, {"name": "Hiroyuki Yamase"}], "featured_authors": [{"name": "Worapon Phatcharasirinawakun"}, {"name": "Hiroyuki Yamase"}], "author_count": 2}, {"id": "2607.25508", "category": "cond-mat", "title": "From weakly to strongly-interacting driven-dissipative bosons in one dimension", "abstract": "We consider a one-dimensional driven-dissipative Bose-Hubbard model subjected to incoherent pump and one- and two-body losses, and analyze it by studying its two-point space-time correlations. By employing a combination of numerical methods, such as stochastic semi-classical simulations and tensor network methods, as well as perturbation theory within the Keldysh formalism, we characterize the system at varying filling and interaction strength. We present results for two complementary regimes: i) at large filling and weak interactions, where we show that Kardar-Parisi-Zhang scaling is visible in the linewidth of the spectral function and ii) at weak filling and strong interactions, where we analyze what remains of the mean field transition and identify a change of nature of the excitations. Our study covers two important regions of the phase diagram of such a system.", "url": "https://arxiv.org/abs/2607.25508", "type": "理论+数值", "summary": "1. 该工作通过分析两点时空关联，研究了一维非相干泵浦和单双体损耗下的驱动耗散玻色-哈伯德模型。\n2. 其卖点在于结合随机半经典模拟、张量网络方法与Keldysh微扰论，在高填充弱相互作用区发现Kardar-Parisi-Zhang标度，在低填充强相互作用区揭示激发本质的变化。\n3. 这为理解开放量子多体系统中从弱到强相互作用的过渡以及相关非平衡相图提供了系统性指导。", "summary_source": "deepseek", "authors": [{"name": "Martina Zündel"}, {"name": "Loïc Herviou"}, {"name": "Léonie Canet"}, {"name": "Anna Minguzzi"}], "featured_authors": [{"name": "Martina Zündel"}, {"name": "Loïc Herviou"}, {"name": "Léonie Canet"}, {"name": "Anna Minguzzi"}], "author_count": 4}, {"id": "2607.25534", "category": "cond-mat", "title": "From real polymers to random graphs: percolation thresholds in associative polymer solutions", "abstract": "Sol-gel transitions are ubiquitous in soft matter and biological systems, yet their thresholds are often poorly captured by classical Flory-Stockmayer theory because spatial organization and loop formation are neglected. Here, we combine molecular dynamics simulations with random graph and random geometric graph models to determine the respective roles of topology and geometry in reversible associative polymer solutions. We show that a coordinate-free random graph recovers the mean-field Flory-Stockmayer limit, whereas a random geometric graph quantitatively reproduces the shifted percolation thresholds observed in molecular dynamics simulations when the detection radius is chosen according to the polymer conformational size. This geometric mapping remains quantitatively valid for linear chains with regularly spaced binding sites over a broad range of chain stiffness. At the microscopic level, we identify primary loops formed already in the pre-gel regime as the dominant source of the deviation from mean-field predictions. Near the gel point, the cluster-size statistics obtained from simulations and random geometric graphs are consistent with the universality class of three-dimensional percolation. These results establish random geometric graphs as a minimal predictive framework for describing topological transitions in reversible associative polymer solutions and show that gelation and network formation can be inferred directly from single-chain conformational information.", "url": "https://arxiv.org/abs/2607.25534", "type": "理论+数值", "summary": "1. 该工作结合分子动力学模拟与随机图及随机几何图模型，系统确定了可逆缔合聚合物溶液中凝胶化渗流阈值由拓扑与几何的协同作用决定。\n2. 其核心在于证明无坐标随机图对应平均场极限，而随机几何图在检测半径取为聚合物构象尺寸时，定量重现分子动力学模拟对线性链（宽链刚度范围）的阈值偏移，并解析出前凝胶区初级环是偏离平均场的主要微观起源，且近凝胶点簇统计服从三维渗流普适类。\n3. 这一发现建立了从单链构象信息推断凝胶化与网络形成的随机几何图最小框架，为软物质与生物系统中拓扑相变提供了一种可预测的几何理论，并启示了基于构象测量表征凝胶化阈值的新路径。", "summary_source": "deepseek", "authors": [{"name": "Xinxiang Chen"}, {"name": "Lennart Hebestreit"}, {"name": "Friederike Schmid"}], "featured_authors": [{"name": "Xinxiang Chen"}, {"name": "Lennart Hebestreit"}, {"name": "Friederike Schmid"}], "author_count": 3}, {"id": "2607.25558", "category": "cond-mat", "title": "Ultradilute quasi-two-dimensional Bose-Bose liquid mixtures", "abstract": "We study ultradilute $^{39}$K Bose-Bose bulk mixtures and droplets in an external harmonic potential that confines them in one spatial direction towards the two-dimensional (2D) limit. Equations of state for several confinements are obtained with quantum Monte Carlo (QMC) at $T=0$, using interaction potentials that include information on the $s$-wave scattering length $a$ and the effective range $r_{\\rm eff}$. Performing the calculations using two different interaction potential models we have determined the range of confinements for which equations of state are universal in terms of $a$ and $r_{\\rm eff}$. Based on the QMC equation of state, we develop a 2D QMC density functional for each confinement strength and use it together with the local density approximation to determine properties of the self-bound drops. For moderate squeezing, energies and droplet profiles obtained using the 2D QMC functional agree well with those obtained using 3D functionals, while offering a substantial reduction in computational cost, and a consistent approach in crossover to 2D. Noticeably, our results approach 2D mean-field (MF) + Lee-Huang-Yang (LHY) predictions only for the most strongly confined systems for which universality in terms of $a$ and $r_{\\rm eff}$ is observed. This implies a very narrow range of confinements for which 2D LHY functionals are applicable, which has important consequences for the study of vortices.", "url": "https://arxiv.org/abs/2607.25558", "type": "理论+数值", "summary": "1. 该工作通过量子蒙特卡洛模拟研究了超稀薄39K玻色-玻色混合物在准二维谐波受限下的状态方程与自束缚液滴性质。\n2. 其核心在于利用两种相互作用势模型验证了状态方程在散射长度和有效范围下的普适性，并发展了二维密度泛函，在中等压缩下与三维结果一致且计算成本显著降低。\n3. 结果表明仅强受限下方接近二维平均场加Lee-Huang-Yang预测，该极窄适用区间对研究准二维涡旋等拓扑激发具有重要启示。", "summary_source": "deepseek", "authors": [{"name": "Leandra Vranješ Markić"}, {"name": "Ivan Poparić"}, {"name": "Krešimir Dželalija"}, {"name": "Petar Stipanović"}, {"name": "Jordi Boronat"}], "featured_authors": [{"name": "Leandra Vranješ Markić"}, {"name": "Ivan Poparić"}, {"name": "Krešimir Dželalija"}, {"name": "Petar Stipanović"}, {"name": "Jordi Boronat"}], "author_count": 5}, {"id": "2607.25585", "category": "cond-mat", "title": "Finite-temperature Lanczos for anisotropic spin systems using triple-hybrid high-performance computing", "abstract": "Lanczos concepts are often realized on supercomputers. In view of modern architectures of high-performance computing triple-hybrid schemes employing MPI, CPU-openMP as well as GPU-openMP should be utilized. The present article sketches how such a scheme could be utilized in order to meet the demands of the finite-temperature Lanczos method for anisotropic spin systems.", "url": "https://arxiv.org/abs/2607.25585", "type": "数值", "summary": "1. 该工作提出了一种利用MPI、CPU-openMP与GPU-openMP三重混合高性能计算方案实现各向异性自旋系统有限温度Lanczos方法。\n2. 其技术核心在于通过三重并行架构协同满足各向异性模型精确对角化在高温统计物理中的巨大计算需求。\n3. 这为在现代异构超算上高效求解量子多体系统的热力学性质提供了可扩展的实现路径。", "summary_source": "deepseek", "authors": [{"name": "J. Schnack"}], "featured_authors": [{"name": "J. Schnack"}], "author_count": 1}, {"id": "2607.25591", "category": "cond-mat", "title": "Ferroelectricity and antiferroelectricity in the BaS-PbS system with the rocksalt structure", "abstract": "The ferroelectric instability in superstructures, superlattices, quantum wires, and disordered solid solutions in the BaS--PbS system with the NaCl structure has been discovered and investigated using first-principles calculations within the density functional theory. The emergence of ferroelectricity in these structures is associated with the instability of TO phonons in linear --Pb--S--Pb--S-- chains, which arises as a result of stretching of the structures upon the introduction of large barium atoms. Additionally, it has been discovered that, alongside ferroelectric phases, the structures also exhibit stable, competing antiferroelectric phases and those with a mixed ferroelectric--antiferroelectric ordering (ferroelectrically polarized one-dimensional Pb--S chains arranged in an ordered or disordered manner in the perpendicular direction). These phases often become the ground state of the studied systems. The closeness of the energies of the ferroelectric, antiferroelectric, and mixed states indicates the emergence of a multi-minimum potential with an infinite number of wells separated by potential barriers in the configuration space. This suggests a possible emergence of nonergodicity in the structures at low temperatures.", "url": "https://arxiv.org/abs/2607.25591", "type": "理论+数值", "summary": "1. 该工作利用密度泛函理论第一性原理计算，发现了BaS-PbS体系中NaCl结构超晶格、量子线与无序固溶体中的铁电与反铁电不稳定性。\n2. 其物理机制在于大Ba原子引入导致的晶格拉伸触发线性—Pb—S—Pb—S—链中TO声子软模，并揭示了竞争的反铁电相及铁电-反铁电混合序作为基态的可能性。\n3. 铁电、反铁电与混合态的能量接近暗示构型空间中存在多极小势能面，这为预测低温下该体系非遍历行为的出现提供了依据。", "summary_source": "deepseek", "authors": [{"name": "Alexander I. Lebedev"}], "featured_authors": [{"name": "Alexander I. Lebedev"}], "author_count": 1}, {"id": "2607.25625", "category": "cond-mat", "title": "Entanglement asymmetry in the gapped XYZ spin-$\\frac12$ chain", "abstract": "The entanglement asymmetry measures how strongly a symmetry is broken inside a subsystem. Analytic results at equilibrium have so far covered free theories and, perturbatively, the critical XXZ chain. We compute the Rényi entanglement asymmetries of a large interval in the gapped, $U(1)$-breaking phase of the interacting XYZ chain. The calculation combines three ingredients. A charged-moment identity, which we prove for fermionic Gaussian and for injective matrix-product ground states, ties the asymmetry to the static susceptibility of the broken charge. A non-conservation sum rule then evaluates the susceptibility from sine-Gordon form factors, its two-kink and one-breather channels providing a lower bound on the universal amplitude. The Baxter--Johnson--Krinsky--McCoy solution supplies the kink mass for different couplings. Infinite-system density-matrix renormalization group simulations built on these masses reproduce the master formula.", "url": "https://arxiv.org/abs/2607.25625", "type": "理论+数值", "summary": "1. 该工作通过结合带电矩恒等式、非守恒求和规则与正弦戈登形状因子，计算了有能隙XYZ自旋链中长区间的Rényi纠缠不对称性。\n2. 其核心卖点在于利用Baxter-Johnson-Krinsky-McCoy精确解提取扭结质量，从双扭结与单呼吸子通道给出通用振幅的下界，并由无穷大密度矩阵重正化群模拟验证。\n3. 这为研究有能隙相互作用量子多体系统中U(1)对称性破缺的纠缠特征提供了非微扰分析框架，可推广至其他可积或近可积模型。", "summary_source": "deepseek", "authors": [{"name": "Felipe Taha Sant'Ana"}], "featured_authors": [{"name": "Felipe Taha Sant'Ana"}], "author_count": 1}, {"id": "2607.25660", "category": "cond-mat", "title": "Aharonov-Casher phase in twisted bilayer graphene", "abstract": "The Aharonov-Casher (AC) effect is a quantum mechanical phenomenon in which the wave function of a particle with a magnetic moment moving in a region subject to an electric field develops a phase shift due to spin-orbit interaction, even if no classical force acts on it. This phase also depends on the medium through which the particle moves. Here we focus on the AC phase of an electron moving in twisted bilayer graphene (TBG) lying in the $x$-$y$ plane, subject to a uniform electric field perpendicular to the plane of the graphene, ${\\bf E}=E{\\hat{\\bf z}}$. The AC phase is determined by an $SU(2)$ vector potential ${\\bf A}$ from which a phase factor is generated, and used to perform a gauge transformation of the Hamiltonian. We find that the AC phase is linear with $E$ and exhibits sharp peaks at the magic angles.", "url": "https://arxiv.org/abs/2607.25660", "type": "理论", "summary": "1. 该工作计算了扭曲双层石墨烯中电子在垂直电场下的阿哈罗诺夫-卡舍尔相位。\n2. 其关键发现是相位与电场强度线性相关，并在魔角处出现尖锐峰值。\n3. 这为利用电场调控扭曲双层石墨烯中的自旋轨道效应提供了新思路。", "summary_source": "deepseek", "authors": [{"name": "Igor Kuzmenko"}, {"name": "Y. B. Band"}, {"name": "Yshai Avishai"}], "featured_authors": [{"name": "Igor Kuzmenko"}, {"name": "Y. B. Band"}, {"name": "Yshai Avishai"}], "author_count": 3}, {"id": "2607.25673", "category": "cond-mat", "title": "Relative hybridization textures as local coordinates for band geometry and topology", "abstract": "Global diagnostics such as Berry curvature and quantum metrics characterize the geometry and topology of an occupied Bloch subspace, leaving the microscopic sectors that carry this structure implicit. We introduce the relative hybridization coordinate $Z$ as a projector-level diagnostic connecting these global quantities to local degrees of freedom. As the Grassmann graph coordinate relative to a chosen sector, $Z$ reconstructs the local projector and retains the phase and matrix orientation absent from ordinary weight or fat-band descriptions. On valid chart patches, its momentum-space texture encodes Berry curvature, quantum metric, Berry phases, and Wilson loops, while chart obstructions appear as rank-drop defects whose balanced-chart winding of $\\det Z$ gives the first Chern number. In the QWZ model this defect inventory reproduces the Chern phase diagram. In the lattice BHZ model, matrix $Z$ diagnoses the orbital $E|H$ partition as a robust matched chart for the QSH geometry, while the spin partition remains essential to the block and $\\mathbb Z_2$ interpretation and shows rank deficiency as a matched chart in the spin-conserving limit. The relative hybridization coordinate thus provides a sector-resolved framework for relating band geometry and topology to microscopic structure.", "url": "https://arxiv.org/abs/2607.25673", "type": "理论+数值", "summary": "1. 该工作引入相对杂化坐标Z作为投影器级诊断，将Berry曲率与量子度量等全局拓扑几何量局域化至动量空间微观纹理。\n2. 其技术核心在于Z保留相位与矩阵取向，其纹理直接编码Berry曲率、量子度量与Wilson圈，且图障碍处秩亏缺陷的det Z缠绕给出第一陈数。\n3. 这为从微观杂化结构解析能带拓扑几何的起源，并指导量子材料与拓扑相的扇区分辨设计提供了框架。", "summary_source": "deepseek", "authors": [{"name": "Caiyuan Ye"}, {"name": "Zhong Fang"}, {"name": "Hongming Weng"}, {"name": "Quansheng Wu"}], "featured_authors": [{"name": "Caiyuan Ye"}, {"name": "Zhong Fang"}, {"name": "Hongming Weng"}, {"name": "Quansheng Wu"}], "author_count": 4}, {"id": "2607.25690", "category": "cond-mat", "title": "First-Principles Wannier Representation of Proximity Effects", "abstract": "Proximity effects in layered heterostructures are usually represented by static parameters fitted to first-principles bands, which discards the energy dependence of the virtual hybridization, the momentum transfer, and the spatial structure. We overcome this limitation by deriving a dynamical proximity operator $\\mathcal{V}(\\mathbf{k},\\mathbf{k}';\\omega)$ directly from density functional theory, downfolding the Kohn-Sham Hamiltonian of the heterostructure onto a fixed low-energy target Wannier subspace and reproducing its spectrum exactly within that subspace. The construction separates direct matrix elements from virtual hybridization through all remaining states. In graphene on hBN/Co(0001), virtual hybridization generates more than $99\\%$ of the proximity exchange and gives it a resonant frequency dependence set by the Co $d$ states. In graphene/PtSe$_2$ it resolves a sublattice-selective intervalley coupling with a $\\sqrt{3}\\times\\sqrt{3}$ charge modulation, and in graphene/WSe$_2$ a bond-resolved Rashba coupling of $0.24$~meV, against below $1$~$\\mu$eV for the direct projection alone. Our results expose the limitations of static projections and establish a fitting-free microscopic foundation for low-energy modeling, spin-relaxation theory, and transport calculations.", "url": "https://arxiv.org/abs/2607.25690", "type": "理论+数值", "summary": "1. 该工作从密度泛函理论出发，将异质结构Kohn-Sham哈密顿量降阶到固定低能Wannier子空间，导出了包含能量依赖的动态近邻算符。\n2. 其核心在于直接分离直接矩阵元与虚拟杂化贡献，在石墨烯/Co(0001)等体系中，虚拟杂化贡献了超过99%的近邻交换并呈现共振频率依赖。\n3. 这揭示了静态投影近似在描述近邻效应中的根本局限，为低能建模、自旋弛豫和输运计算提供了无拟合参数的微观基础。", "summary_source": "deepseek", "authors": [{"name": "Yaroslav Zhumagulov"}, {"name": "Johan Félisaz"}, {"name": "Stepan S. Tsirkin"}, {"name": "Denis Kochan"}, {"name": "Oleg V. Yazyev"}], "featured_authors": [{"name": "Yaroslav Zhumagulov"}, {"name": "Johan Félisaz"}, {"name": "Stepan S. Tsirkin"}, {"name": "Denis Kochan"}, {"name": "Oleg V. Yazyev"}], "author_count": 5}, {"id": "2607.25767", "category": "cond-mat", "title": "Critical Ripples and Dirac Fermions in Crystalline Membranes", "abstract": "Crystalline membranes hosting Dirac fermions, with graphene as the paradigmatic example, combine two low-energy sectors with sharply different dynamics: nonrelativistic flexural phonons and relativistic-like Dirac quasiparticles. We develop the low-energy field theory of this coupled system at charge neutrality and determine how this dynamical mismatch controls the coupling between the two sectors. In the long-wavelength flat phase, rotational symmetry ties the renormalization of the leading local scalar strain--density coupling to the scale-dependent bending rigidity, causing its dimensionless strength to decrease logarithmically. At the same time, flexural modes become parametrically slower than the Dirac fermions, so the resulting fermionic feedback vanishes as a power this http URL flat phase is therefore stable against this perturbation. The physics changes when elastic interactions or electronic softening destabilize the membrane at a finite wavelength, selecting a ripple pattern formed by modes at $\\pm\\mathbf{Q}$. For an isolated pair of ordering wavevectors, provided that commensurability-induced phase pinning is irrelevant, the transition is governed by the bosonic Wilson--Fisher fixed point, while the Dirac fermions remain spectators. A genuinely hybrid electronic--structural critical point arises instead when symmetry permits a mass-type Dirac bilinear to share the ripple's momentum and quantum numbers, including horizontal-reflection parity. The transition is then described by the chiral-XY Gross--Neveu--Yukawa universality class. Using the known one-loop critical exponents, we characterize this transition, determine the induced secondary elastic distortion, and show that the fermionic and bosonic velocities lock in the isotropic continuum limit.", "url": "https://arxiv.org/abs/2607.25767", "type": "理论", "summary": "1. 该工作发展了晶体膜中狄拉克费米子与柔性声子耦合的低能场论，并分析了电荷中性点附近的平坦相稳定性与波纹相转变。\n2. 关键物理在于旋转对称性使标量应变-密度耦合强度呈对数衰减，而当狄拉克质量项共享波纹动量与宇称时，跃迁由手征XY Gross-Neveu-Yukawa普适类描述。\n3. 这为理解二维材料中电子-声子耦合诱发的临界行为与结构相变提供了明确的理论框架和可检验的临界指数。", "summary_source": "deepseek", "authors": [{"name": "Sebastián Bahamondes"}, {"name": "Rodrigo Soto-Garrido"}, {"name": "Enrique Muñoz"}, {"name": "Vladimir Juričić"}], "featured_authors": [{"name": "Sebastián Bahamondes"}, {"name": "Rodrigo Soto-Garrido"}, {"name": "Enrique Muñoz"}, {"name": "Vladimir Juričić"}], "author_count": 4}, {"id": "2607.25771", "category": "cond-mat", "title": "Crack-Tip Opening as a Probe for Length-Scale Separation in Geometrically Nonlinear Solids", "abstract": "Soft elastic solids are highly deformable materials where fracture is driven by the complex coupling of geometric and material nonlinearities. While geometric nonlinearity (GNL) arises kinematically from the intrinsic capacity of solids to undergo large deformations, material nonlinearity stems from the constitutive behavior unique to each class of materials. Because GNL is a universal feature of all highly deformable solids, establishing its standalone impact is a prerequisite for understanding nonlinear fracture. Here, we focus on brittle soft solids to study the role of GNL alone on the near-tip fields of a static crack under mode I plane-strain conditions, providing a canonical baseline for integrating material nonlinearities in future investigations. By utilizing a compressible St. Venant-Kirchhoff material model, we analyze crack behavior under large deformations in the absence of material nonlinearity. We propose a robust postprocessing methodology based on the crack-tip opening displacement (CTOD) profile and derive asymptotic analytical solutions. Our results reveal a distinct near-tip region where the CTOD departs from classical linear elastic predictions, transitioning into a nonlinear regime dictated by Poisson's ratio. Using a matched-asymptotics approach, we define a physical nonlinear length scale $\\lambda_\\mathrm{nl}$ that bounds this region and scales quadratically with the far-field stress intensity factor $K_I$. We show that GNL acts as an intrinsic strain-stiffening mechanism sufficient to trigger energy partitioning, effectively shielding the crack tip and imparting an apparent toughening. Ultimately, we conclude that the geometrically nonlinear material model serves as a foundational framework for the broader study of nonlinear elastic fracture mechanics.", "url": "https://arxiv.org/abs/2607.25771", "type": "理论", "summary": "1. 该工作通过可压缩St. Venant-Kirchhoff模型隔离材料非线性，研究几何非线性单独作用下脆性软固体中静态裂纹的尖端场。\n2. 其核心在于基于裂纹张开位移剖面提出稳健后处理与匹配渐近解法，揭示由泊松比调控的非线性区及一个随远场应力强度因子二次标度的长度尺度。\n3. 这证明几何非线性作为内在应变硬化机制可屏蔽裂纹尖端并产生表观增韧，为后续整合材料非线性的弹性断裂力学研究奠定基础框架。", "summary_source": "deepseek", "authors": [{"name": "Raúl Lazo-Molina"}, {"name": "Mokhtar Adda-Bedia"}, {"name": "Mohit Pundir"}, {"name": "Rodrigo Arias"}, {"name": "David S. Kammer"}], "featured_authors": [{"name": "Raúl Lazo-Molina"}, {"name": "Mokhtar Adda-Bedia"}, {"name": "Mohit Pundir"}, {"name": "Rodrigo Arias"}, {"name": "David S. Kammer"}], "author_count": 5}, {"id": "2607.25774", "category": "cond-mat", "title": "Ro-vibrational van der Waals interaction between ultracold polar molecules", "abstract": "We describe the ro-vibrational van der Waals interaction between ultracold polar molecules. This interaction is strong, leading to fast elastic collisions and orders of magnitude suppression of collisional loss. This enables evaporative cooling of Fermi mixtures of molecules in different ro-vibrational states, without active shielding by applying external fields. The scheme is compatible with microwave shielding, where it enables controlled state dependent interactions, opening up new opportunities for quantum simulation and impurity physics. The interaction can also be used to stabilize fermionic molecules in optical lattices, to control interactions in synthetic dimensions, for enhanced tweezer loading, and direct infrared shielding.", "url": "https://arxiv.org/abs/2607.25774", "type": "数值", "summary": "1. 该工作描述了超冷极性分子间振转范德华相互作用的性质及其动力学效应。\n2. 其核心在于该强相互作用大幅抑制碰撞损失，实现无需外部屏蔽的费米混合物蒸发冷却，并与微波屏蔽兼容产生可控态依赖相互作用。\n3. 这为量子模拟、杂质物理、光学晶格稳定化、合成维度调控及直接红外屏蔽等方向提供了新的物理机制与实验途径。", "summary_source": "deepseek", "authors": [{"name": "Kang Feng"}, {"name": "Hanwei Yang"}, {"name": "Hubert J. Jóźwiak"}, {"name": "Tijs Karman"}], "featured_authors": [{"name": "Kang Feng"}, {"name": "Hanwei Yang"}, {"name": "Hubert J. Jóźwiak"}, {"name": "Tijs Karman"}], "author_count": 4}, {"id": "2607.25777", "category": "cond-mat", "title": "Tunable state-dependent interactions in collisionally stable mixtures of polar molecules", "abstract": "We propose encoding a pseudo-spin-$1/2$ system in the ground ($v=0$) and first excited ($v=1$) vibrational states of polar molecules. Double microwave shielding simultaneously shields molecules in both states, suppressing two-body losses by orders of magnitude while strictly avoiding three-body recombination. The microwave dressing is state-dependent and results in highly tunable, long-range dipolar Ising exchange ($J_z$), density-density ($V$), and spin-density ($W$) interactions. These interaction length scales readily exceed the typical interparticle spacing, pushing the molecules deep into the strongly interacting regime. In bulk gases, this enables the exploration of itinerant quantum magnetism and quantum droplets with novel anisotropic spin textures; in optical lattices, it naturally realizes extended Hubbard and $t$-$J_z$ models, opening new directions in quantum simulation.", "url": "https://arxiv.org/abs/2607.25777", "type": "理论+数值", "summary": "1. 该工作提出在极性分子的基态与第一激发振动态中编码赝自旋1/2系统，利用双微波屏蔽同时保护两态，抑制二体损耗并避免三体复合。\n2. 核心卖点在于状态依赖的微波 dressing 产生高度可调的长程偶极 Ising 交换、密度-密度及自旋-密度相互作用，其尺度超越粒子间距，实现强相互作用。\n3. 这为体气体中巡游量子磁性与各向异性量子液滴的探索，以及光晶格中扩展 Hubbard 与 t-Jz 模型的量子模拟提供了明确物理实现路径。", "summary_source": "deepseek", "authors": [{"name": "Hubert J. Jóźwiak"}, {"name": "Hanwei Yang"}, {"name": "Eugen Dizer"}, {"name": "Arthur Christianen"}, {"name": "Tijs Karman"}], "featured_authors": [{"name": "Hubert J. Jóźwiak"}, {"name": "Hanwei Yang"}, {"name": "Eugen Dizer"}, {"name": "Arthur Christianen"}, {"name": "Tijs Karman"}], "author_count": 5}, {"id": "2607.25780", "category": "cond-mat", "title": "Macroscopic wall pressure and microscopic contact load in crowds without egress: social-group cohesion and boundary buffering", "abstract": "Crowd safety in confined venues is usually evaluated through evacuation performance or pre-collision avoidance, while direct mechanical hazards in dense gatherings without egress remain poorly understood. We study an Elastic Reorientation Model (ERM), a Social Force Model (SFM), and their coupled dynamics. Post-collision behavior is represented by social-group cohesion ($\\gamma_g$) and wall buffering ($\\gamma_w$), while risk is quantified by the macroscopic wall line pressure ($P_{\\text{wall}}$) and the microscopic maximum per-agent collision impulse ($\\delta p_{\\text{max}}$). In the ERM, cohesion and wall buffering generally reduce $P_{\\text{wall}}$ by retaining agents in the bulk, but large groups exhibit a high-$\\delta p_{\\text{max}}$ hazard window at intermediate cohesion. As $\\gamma_g\\rightarrow1$, local pairing suppresses cluster growth and shifts kinetic energy from relative to center-of-mass motion, reducing $\\delta p_{\\text{max}}$. SFM pushing and sliding amplify $\\delta p_{\\text{max}}$, especially when agent-agent and agent-wall interactions coexist, while active driving raises $P_{\\text{wall}}$ through near-wall accumulation. The coupled dynamics produces a wall-pressure/contact-load ($P$-$p$) trade-off. Finite-size scaling reveals an independent-agent-induced phase boundary at $\\gamma_w=0.5$, characterized by a susceptibility discontinuity, and a grouped-agent-induced continuous phase boundary along a finite segment of $(1-\\gamma_w)(1-\\gamma_g)=0.5$, characterized by divergent susceptibility and terminating at a critical point. Both disappear in the social-force-free ERM, showing that they emerge from the coupled ERM+SFM dynamics. These results provide mechanistic guidance for crowd-risk mitigation and safety planning in high-density venues without egress.", "url": "https://arxiv.org/abs/2607.25780", "type": "理论+数值", "summary": "1. 该工作通过弹性重定向模型、社会力模型及其耦合动力学，研究了无出口密集人群中群体凝聚力与壁缓冲对宏观壁线压力和微观最大碰撞冲量的影响。\n2. 技术核心在于揭示壁压力与接触载荷间的P-p权衡，以及有限尺寸标度下独立诱导（γ_w=0.5处）与聚集诱导（沿(1-γ_w)(1-γ_g)=0.5线段）两类相边界，且它们仅出现于耦合动力学中。\n3. 这为高密度无出口场所的人群风险缓解与安全规划提供了基于机械力和群体动力学的机理指导。", "summary_source": "deepseek", "authors": [{"name": "Bo-Shiun Shen"}, {"name": "Son-Hsien Chen"}], "featured_authors": [{"name": "Bo-Shiun Shen"}, {"name": "Son-Hsien Chen"}], "author_count": 2}, {"id": "2607.25782", "category": "cond-mat", "title": "Fluctuation-dissipation violations in mean-field non-reciprocal spin glasses", "abstract": "We study the out-of-equilibrium dynamics of the spherical Sherrington-Kirkpatrick model with non-reciprocal asymmetric couplings. Rather than assuming stationarity, we derive the conditions under which the dynamical mean-field equations admit stable time-translational invariant solutions. We analytically solve the asymptotics of the correlation and response functions in the symmetric, uncorrelated and antisymmetric limits, showing that the fluctuation-dissipation theorem is generically violated in the presence of non-reciprocity despite exponential relaxation, due to broken detailed balance rather than aging. Numerical results for generic asymmetry allow us to interpolate between these solvable limit cases, revealing faster dynamics as the asymmetry increases, together with oscillatory dynamics driven by antisymmetric couplings. These results provide a reference framework for understanding the dynamics of disordered, non-reciprocal systems, disentangling two distinct origins of fluctuation-dissipation violations.", "url": "https://arxiv.org/abs/2607.25782", "type": "理论+数值", "summary": "1. 该工作解析与数值研究了非互易不对称耦合球面Sherrington-Kirkpatrick模型的非平衡动力学，导出了稳定时间平移不变解的条件。\n2. 其卖点在于揭示涨落-耗散定理的违反源于非互易性导致的细致平衡破缺而非老化，并在对称、非相关与反对称极限下精确求解关联与响应函数渐近行为。\n3. 这为理解无序非互易系统的动力学提供了参考框架，有助于区分涨落-耗散违反中老化与细致平衡破缺两种不同起源。", "summary_source": "deepseek", "authors": [{"name": "Ot Garcés"}, {"name": "Demian Levis"}], "featured_authors": [{"name": "Ot Garcés"}, {"name": "Demian Levis"}], "author_count": 2}, {"id": "2607.25806", "category": "cond-mat", "title": "Kinetically induced order from mobility-constrained excitations", "abstract": "A fascinating feature of strongly correlated systems is that excitations may carry nontrivial quantum numbers under emergent symmetries which, in some cases, may strongly constrain their motion. We show that such constrained excitations can play a central role in driving symmetry-breaking long-range order through a kinetic mechanism: coupling to a local order-parameter field activates the mobility of otherwise constrained excitations, and condensation of the order parameter then enables a large gain in kinetic energy, thereby stabilizing a phase with long-range order. We illustrate this mechanism in two settings: (i) a dimerization instability in a spin chain with a magnetization dipole conservation law, and (ii) itinerant magnetism of electrons in the Kitaev-Kondo model, where charge carriers couple to local moments that form a spin liquid. This mechanism becomes operative whenever a finite density of mobility-constrained excitations is present, either through non-equilibrium preparation or thermal activation. In the latter case, we argue that increasing temperature can, counterintuitively, promote order by enhancing the kinetic-energy gain of thermally activated excitations.", "url": "https://arxiv.org/abs/2607.25806", "type": "理论", "summary": "1. 该工作揭示了受约束激发可通过动力学机制驱动对称性破缺长程有序，并在自旋链（磁化偶极矩守恒）和Kitaev-Kondo模型（自旋液体背景）中予以实例化。\n2. 其核心卖点是局域序参量场激活原本受迫激发的迁移率，序参量凝聚带来的动能增益稳定有序相，该机制不依赖平衡态前提。\n3. 这一发现暗示，在具有有限密度受约束激发的系统中（如非平衡制备或热激活情形），升温可能反直觉地通过增强动能增益促进有序，为设计新型有序相提供路径。", "summary_source": "deepseek", "authors": [{"name": "Aprem P. Joy"}, {"name": "Urban F.P. Seifert"}], "featured_authors": [{"name": "Aprem P. Joy"}, {"name": "Urban F.P. Seifert"}], "author_count": 2}, {"id": "2607.25809", "category": "cond-mat", "title": "Programmable Bulk Topological Channels via Strain Engineering", "abstract": "Accumulated disorder at physical boundaries prevents the realization of ideal zero-dissipation topological edge channels. Here, we propose a strain engineering mechanism to create a topological domain wall in the pristine material bulk, thereby generating interior chiral channels spatially decoupled from physical boundaries. Quantum transport simulations reveal that these interior channels exhibit exceptional immunity to severe boundary disorder, maintaining an ideal vortex-free transport morphology. Furthermore, the spatial position and confinement of these interior channels can be quantitatively programmed. Under a linear gradient strain field, the channel width obeys an inverse square-root scaling law with respect to the strain gradient. In a high-Chern-number phase (|C|=2), we design the spatial splitting and merging of co-propagating chiral channels, suggesting a topological Mach-Zehnder-like geometry. These results suggest a route toward programmable bulk topological transport and reconfigurable topological circuitry.", "url": "https://arxiv.org/abs/2607.25809", "type": "理论+数值", "summary": "1. 该工作提出利用应变工程在材料体相内创建拓扑畴壁，从而生成与物理边界解耦的内部手性通道。\n2. 其核心在于这些内部通道对边界无序展示出理想免疫性，且通道宽度关于应变梯度服从负二分之一次方标度律，实现空间位置与约束的定量可编程。\n3. 这为可编程体相拓扑输运及可重构拓扑电路（包括高陈数相中的分叉合并型马赫-曾德尔几何）提供了明确实现路线。", "summary_source": "deepseek", "authors": [{"name": "Jiawei Xia"}, {"name": "Shuze Zhu"}], "featured_authors": [{"name": "Jiawei Xia"}, {"name": "Shuze Zhu"}], "author_count": 2}, {"id": "2607.25827", "category": "cond-mat", "title": "Physics-Guided Interpretable Machine Learning Framework for Anomalous Transport in Crowded Media with Tunable Flexibility", "abstract": "Transport in crowded media is governed by the interplay of multiple physical mechanisms. Quantitatively disentangling their individual and coupled contributions remains a longstanding challenge because the evolving microstructure continuously modifies their relative influence. Here, we develop a physics-guided interpretable machine-learning framework that couples Brownian Cluster Dynamics simulations with surrogate machine-learning models and SHAP-based interpretation to quantitatively disentangle the individual and coupled effects of total volume fraction, explorer fraction, and template bond flexibility on explorer-particle transport. We demonstrate the framework using binary colloidal systems in which explorer particles diffuse through a template network formed by irreversible bonds with tunable flexibility. Structural descriptors, mean-squared displacement, intermediate scattering functions, and displacement distributions reveal that network formation localizes explorer particles through enhanced transient caging. Bond flexibility emerges as an independent regulator of post-network relaxation by promoting local bond rearrangements that facilitate the release of transiently caged particles without altering the irreversible network topology. Although crowding and composition dominate the overall transport response, quantitative attribution reveals how the relative contributions of crowding, composition, and template bond flexibility evolve as the confining environment develops. Beyond establishing bond flexibility as a distinct control parameter for relaxation in heterogeneous colloidal networks, this work provides a general physics-guided interpretable machine-learning framework for quantitatively disentangling coupled physical mechanisms in complex transport phenomena.", "url": "https://arxiv.org/abs/2607.25827", "type": "理论+数值", "summary": "1. 该工作构建了物理引导的可解释机器学习框架，结合布朗团簇动力学模拟与SHAP归因，定量解耦体积分数、探险者分数及模板键灵活性对拥挤介质中异常输运的独立与耦合贡献。\n2. 其技术卖点在于揭示键灵活性作为网络弛豫的独立调控参量，通过促进局域键重排释放瞬态笼中粒子，且不改变不可逆网络拓扑结构。\n3. 该框架为定量解耦复杂输运中的多物理机制提供了通用方法，并启发将其应用于其他微观结构演化与动力学耦合的软物质体系。", "summary_source": "deepseek", "authors": [{"name": "Zakiya Shireen"}, {"name": "Sujin B. Babu"}], "featured_authors": [{"name": "Zakiya Shireen"}, {"name": "Sujin B. Babu"}], "author_count": 2}, {"id": "2607.25848", "category": "cond-mat", "title": "Topological Classification of Non-Normalizable Vector Fields", "abstract": "Topological classification of physical vector fields conventionally relies on field normalization and homotopy-based invariants. However, when field amplitudes vanish, normalization becomes ill-defined, preventing a direct topological characterization. Here, we introduce a general framework for the topological classification of non-normalizable $n$-dimensional vector fields with compactifiable base spaces by transforming them into $(n+1)$-dimensional normalized vector fields. This construction extends homotopy-based classification to fields containing amplitude zeros. We explicitly demonstrate the approach for one-, two-, and three-dimensional non-normalized vector fields and derive the corresponding topological invariants. The resulting topological charges are robust under continuous deformations and can change only when the embedding structure becomes singular. Our framework provides a unified route to the topological characterization of non-normalizable fields and opens the door to the study of topological phenomena in a broad range of systems, including magnetic textures, ferroelectrics, electromagnetic fields, and wave systems.", "url": "https://arxiv.org/abs/2607.25848", "type": "理论", "summary": "1. 该工作提出一种将不可归一化n维矢量场提升为(n+1)维归一化矢量场以进行拓扑分类的通用框架。\n2. 其技术关键在于通过嵌入变换将同伦分类扩展至包含振幅零点的场，并导出对应的拓扑不变量。\n3. 该框架为磁织构、铁电体、电磁场及波动系统等体系中不可归一化场的拓扑现象研究提供了统一途径。", "summary_source": "deepseek", "authors": [{"name": "Philipp Gessler"}, {"name": "Alessandro Pignedoli"}, {"name": "Alexander Neuhaus"}, {"name": "Frank-J. Meyer zu Heringdorf"}, {"name": "Maria Azhar"}, {"name": "Karin Everschor-Sitte"}], "featured_authors": [{"name": "Philipp Gessler"}, {"name": "Alessandro Pignedoli"}, {"name": "Alexander Neuhaus"}, {"name": "Frank-J. Meyer zu Heringdorf"}, {"name": "Maria Azhar"}, {"name": "Karin Everschor-Sitte"}], "author_count": 6}, {"id": "2607.25872", "category": "cond-mat", "title": "Scaling universal Fermi network toward ground states: A diffusion-Monte-Carlo assessment", "abstract": "In this work, we show that Fermi Sets---a provably universal neural network architecture for fermionic wavefunctions---can be systematically scaled up to find interacting ground states through energy minimization in a variational Monte Carlo framework. By further performing fixed-phase diffusion Monte Carlo (DMC) on the optimized neural network wavefunction, we demonstrate that as the network size increases, the variational energy systematically decreases while the energy improvement from DMC collapses monotonically to zero, indicating convergence to the ground state. We illustrate the scaling of Fermi Sets accompanied by the DMC assessment for interacting electrons in jellium and in a quantum dot under high magnetic fields.", "url": "https://arxiv.org/abs/2607.25872", "type": "数值", "summary": "1. 该工作展示了Fermi Sets通用费米子波函数神经网络可通过变分蒙特卡洛能量最小化系统扩展至相互作用基态。\n2. 其卖点在于利用固定相位扩散蒙特卡洛评估发现，随网络规模增大变分能系统降低且DMC修正单调消失，确认收敛精确基态。\n3. 这为神经网络波函数在强关联费米子系统中的可扩展计算提供了验证，并启发结合更高效后处理方法的探索。", "summary_source": "deepseek", "authors": [{"name": "Yu-Sheng Li"}, {"name": "Saskia Poldmaa"}, {"name": "Tzen Ong"}, {"name": "Ahmed Abouelkomsan"}, {"name": "Tay-Rong Chang"}, {"name": "Hsin Lin"}, {"name": "Liang Fu"}], "featured_authors": [{"name": "Yu-Sheng Li"}, {"name": "Saskia Poldmaa"}, {"name": "Tzen Ong"}, {"name": "Tay-Rong Chang"}, {"name": "Hsin Lin"}, {"name": "Liang Fu"}], "author_count": 7}, {"id": "2607.25902", "category": "cond-mat", "title": "Non-monotonic diffusion from nonequilibrium driving", "abstract": "The stochastic dynamics of interacting particles far from equilibrium remains a fundamental challenge in statistical physics. While reciprocal interactions often permit effective one-body descriptions, such reductions generally fail for nonreciprocal interactions, which are ubiquitous in driven and active systems. We develop a unified theoretical framework for interacting particles with reciprocal and nonreciprocal couplings, applicable to the principal classes of active matter, including run-and-tumble, active Brownian, and active Ornstein-Uhlenbeck particles. As a minimal example, we study a passive particle driven by an active particle. On a periodic ring, we show analytically that the driven particle is always diffusive at long times, independent of the microscopic driving mechanism. Analytical predictions and numerical simulations reveal a nonmonotonic dependence of the effective diffusivity on the driving activity, giving rise to both enhanced and suppressed transport. Remarkably, the same behavior occurs in an equilibrium system driven out of equilibrium by coupling the driving particle to a higher local temperature. Our framework quantitatively captures both systems, identifies the common mechanism underlying the nonmonotonic transport, and establishes a unified description of transport under active and passive nonequilibrium driving.", "url": "https://arxiv.org/abs/2607.25902", "type": "数值", "summary": "1. 该工作构建了一个统一理论框架，涵盖互易与非互易耦合的相互作用粒子，并推广至三类活性物质模型，解析证明被动粒子在活性驱动下长时间行为始终为扩散。\n2. 核心发现是有效扩散系数随驱动活性呈非单调变化，既能增强也能抑制输运，且该行为同样出现于局域高温驱动的平衡系统，揭示了非平衡驱动的普遍机制。\n3. 这为统一描述活性与被动非平衡驱动系统中的输运现象提供了理论基础，并启示了不同微观机制下非单调扩散的共性起源。", "summary_source": "deepseek", "authors": [{"name": "Manish Patel"}, {"name": "Ritwick Sarkar"}, {"name": "Urna Basu"}, {"name": "Debasish Chaudhuri"}], "featured_authors": [{"name": "Manish Patel"}, {"name": "Ritwick Sarkar"}, {"name": "Urna Basu"}, {"name": "Debasish Chaudhuri"}], "author_count": 4}, {"id": "2607.25938", "category": "cond-mat", "title": "Interacting hydrodynamic modes in spinless fermions with dephasing noise", "abstract": "We study the non-equilibrium dynamics of spinless fermions with dephasing noise in the framework of a many-particle Lindblad equation. Using a mapping to the exactly solvable one-dimensional Hubbard model with purely imaginary tunneling amplitude we analyze the Heisenberg-picture dynamics of operators quartic in fermions and determine their hydrodynamic pr
