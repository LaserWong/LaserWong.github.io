ojections. We construct the relevant diffusive eigenoperators explicitly and show that, in the quartic sector, they can be interpreted as interacting pairs of bilinear hydrodynamic modes. As a consequence, translationally invariant quartic operators generically exhibit non-vanishing diffusive late-time tails, unlike translationally invariant bilinears. Our results show that the hydrodynamic tails of microscopic operators cannot in general be inferred from symmetry constraints or coarse-grained fluctuating hydrodynamics alone; they also depend crucially on the spatial structure and effective size of the hydrodynamic eigenoperators.", "url": "https://arxiv.org/abs/2607.25938", "type": "理论", "summary": "1. 该工作通过映射到可解一维哈伯德模型（纯虚隧穿）分析了退相干噪声下自旋less费米子的非平衡动力学。\n2. 其核心在于构造四次费米子扩散本征算符并揭示其可视为双线性流体动力学模的相互作用对，导致平移不变四次算符具有非零扩散尾。\n3. 这表明微观算符的流体动力学尾不仅由对称性或粗粒化涨落流体动力学决定，还关键取决于本征算符的空间结构与有效尺寸。", "summary_source": "deepseek", "authors": [{"name": "Fabian H.L. Essler"}, {"name": "Patrik Penc"}], "featured_authors": [{"name": "Fabian H.L. Essler"}, {"name": "Patrik Penc"}], "author_count": 2}, {"id": "2607.25969", "category": "cond-mat", "title": "Solvable Quantum Circuits with non-Markovian Influence Matrices", "abstract": "Influence matrices encode the action exerted on local subsystems by the rest of an extended quantum many-body system during their evolution. Thus, knowledge of the influence matrix facilitates computationally efficient simulations of local dynamics. Here we propose a new systematic approach to generating quantum circuits with complex dynamics for which the influence matrices can be written down exactly. In contrast to previous frameworks of this kind, such as dual-unitary circuits, the resulting influence matrices are non-Markovian, exhibiting nontrivial temporal correlations. We explicitly construct a broad family of circuits of this kind, based on dressing free-fermion (matchgate) circuits with appropriately chosen interaction terms. We show that, contrary to previous solvable instances, these circuits produce patterns of correlations that closely resemble that of typical many-body systems. Our approach can be directly interpreted in terms of an error correction scheme where the terms breaking the solvability of the influence matrices play the role of errors.", "url": "https://arxiv.org/abs/2607.25969", "type": "理论+数值", "summary": "1. 该工作提出一种系统方法，用于生成影响矩阵可精确写出的复杂动力学量子电路。\n2. 其关键点在于所得影响矩阵是非马尔可夫的，具有非平凡时间关联，并通过修饰匹配门电路实现。\n3. 该电路能产生类似典型多体系统的关联模式，且可视为一种纠错方案。", "summary_source": "deepseek", "authors": [{"name": "Samuel H. Pickering"}, {"name": "Max McGinley"}, {"name": "Bhavik Kumar"}, {"name": "Bruno Bertini"}], "featured_authors": [{"name": "Samuel H. Pickering"}, {"name": "Max McGinley"}, {"name": "Bhavik Kumar"}, {"name": "Bruno Bertini"}], "author_count": 4}, {"id": "2607.25983", "category": "cond-mat", "title": "Superfluidity without charge order in the attractive Hubbard model on the kagome lattice", "abstract": "Using auxiliary-field quantum Monte Carlo simulations, we study the zero-temperature attractive Hubbard model on the kagome lattice at various relevant electronic fillings. The low-energy physics at $2/3$-density is influenced by the Dirac point at the Fermi energy, wherein we unveil a superfluid transition at a critical attractive interaction $U_c/t=-4.58(3)$, which belongs to the chiral-XY universality class. This U(1) symmetry-breaking is not accompanied by charge order, even for substantially large interaction strengths, in a regime where a description in terms of hardcore bosons becomes increasingly suitable. An investigation of the latter shows that charge ordering at $1/3$-filling only occurs at interaction strengths much larger than those corresponding to the mapping to the original fermionic model. Additionally, for densities exhibiting van Hove singularities in the non-interacting density of states, our results show that any attractive interaction gives rise to superfluidity, yet again without charge ordering, contrary to recent studies employing mean-field theory.", "url": "https://arxiv.org/abs/2607.25983", "type": "理论+数值", "summary": "1. 采用辅助场量子蒙特卡洛方法，研究kagome晶格上吸引Hubbard模型在多种填充下的零温超流性质。\n2. 在2/3填充时发现临界吸引强度U_c/t=-4.58(3)处的手性XY类超流相变，且电荷序始终被抑制；在van Hove填充处任意吸引即可诱导无电荷序的超流。\n3. 所得无电荷序的超流相为理解平带系统中的强关联配对机制提供新视角，并挑战平均场理论对该体系的描述。", "summary_source": "deepseek", "authors": [{"name": "Xiaodong Jin"}, {"name": "Yingping Mou"}, {"name": "Rubem Mondaini"}], "featured_authors": [{"name": "Xiaodong Jin"}, {"name": "Yingping Mou"}, {"name": "Rubem Mondaini"}], "author_count": 3}, {"id": "2607.25999", "category": "cond-mat", "title": "Facet-Dependent Electronic Properties and Interfacial Point Defect Interactions in WS$_2$/ZnO Heterostructures", "abstract": "Aiming at two-dimensional materials for high-efficiency optoelectronics, WS$2$/ZnO heterostructures are computationally screened for their facet-dependent electronic properties and interfacial defect thermodynamics using first-principles hybrid functional calculations. Interface comparison identifies the non-polar ($10\\overline{1}0$) $m$-plane as the optimal substrate facet, maintaining a direct 2.42~eV bandgap and a robust type-I band alignment. Isolated sulfur ($\\mathrm{V_S}$) and interfacial oxygen ($\\mathrm{V_O}$) vacancies introduce deep non-radiative recombination centers. Conversely, zinc vacancies ($\\mathrm{V{Zn}}$) act as shallow acceptors near the valence band edge, contributing to unintentional $p$-type behavior. Analysis of defect pairs reveals that neutral vacancies cluster across the van der Waals gap due to favorable binding energies. Under $n$-type conditions, defects stabilize as charged species. Although inter-layer Coulomb repulsion weakens the binding energy of $(\\mathrm{V_S} - \\mathrm{V_{Zn}})''''$ pairs, their formation energy drops to 2.61~eV under anion-poor conditions, making the $-4$ cluster the most thermodynamically abundant defect pair at the interface. Furthermore, native $\\mathrm{V_{Zn}}$ prevents the Fermi level rise typically induced by interstitial hydrogen ($\\mathrm{H_i}$), distributing donated electrons into shallow acceptor states and preserving host band edge rigidity. These findings establish a microscopic framework for substrate selection and defect engineering in 2D/3D hybrid light-emitting diodes.", "url": "https://arxiv.org/abs/2607.25999", "type": "数值", "summary": "1. 该工作通过第一性原理杂化泛函计算，系统筛选了WS₂/ZnO异质结中依赖衬底晶面的电子性质与界面点缺陷相互作用。\n2. 核心发现包括非极性m面维持直接带隙2.42 eV与I型能带对齐，且锌空位作为浅受主阻止间隙氢导致的费米能级上升。\n3. 这为二维/三维混合发光二极管的衬底择优与缺陷工程建立了微观热力学框架。", "summary_source": "deepseek", "authors": [{"name": "Dedi Sutarma"}, {"name": "Peter Kratzer"}], "featured_authors": [{"name": "Dedi Sutarma"}, {"name": "Peter Kratzer"}], "author_count": 2}, {"id": "2607.26018", "category": "cond-mat", "title": "Extracting Atomic Environments for Machine Learning Interatomic Potentials", "abstract": "In order to appropriately capture large-scale material features and emergent phenomena via atomistic simulations, such as Molecular Dynamics (MD), the system scale can range up to hundreds of millions of atoms. However, the force-field models that drive those simulations are generally trained with Density Functional Theory (DFT) reference data, limited to relatively small configurations on the order of 100s or 1000s of atoms. To compute DFT forces on atoms in regions of interest, for example for active-learning or on-the-fly training of interatomic potentials, one needs to extract a small set of atoms from the larger simulation box, and typical work with periodic boundary conditions for DFT; however, methods to select the shape and size of this extracted set of atoms, as well as to generate a potentially necessary passivating envelope, have not been systematically analyzed. In this work, we present a benchmark of various techniques to extract atomic environments from large, bulk configurations and embed them into smaller configurations suitable for DFT calculations with periodic boundary conditions. We test with a diverse set of material systems, which includes amorphous $\\mathrm{SiO_2}$, Ta with screw dislocations, and molten C. We demonstrated a notably simple procedure, a method we refer to as deletions, yields superior performance over an array of alternative extraction methods.", "url": "https://arxiv.org/abs/2607.26018", "type": "理论+数值", "summary": "1. 该工作系统比较了从大规模体材料构型中提取原子环境以构建适用于周期性边界条件DFT计算的子构型的多种技术。\n2. 其核心卖点在于发现一种称为“删除法”的简单流程在非晶SiO₂、含螺位错Ta及熔融C等多种材料体系中均优于其他候选提取方法。\n3. 这为主动学习或在线训练机器学习原子间势函数时高效获取高质量参考力数据提供了明确且实用的实现路径。", "summary_source": "deepseek", "authors": [{"name": "Jared C. Stimac"}, {"name": "Fei Zhou"}, {"name": "Kyle Bushick"}, {"name": "Bo Lei"}, {"name": "Sebastien Hamel"}, {"name": "Amit Samanta"}, {"name": "Vincenzo Lordi"}], "featured_authors": [{"name": "Jared C. Stimac"}, {"name": "Fei Zhou"}, {"name": "Kyle Bushick"}, {"name": "Sebastien Hamel"}, {"name": "Amit Samanta"}, {"name": "Vincenzo Lordi"}], "author_count": 7}, {"id": "2607.24883", "category": "hep-th", "title": "Wald-like entropy and Islands in Dimensionally Reduced Einstein-Hilbert Gravity", "abstract": "We study the island formula and Page curve for the asymptotically flat eternal and quasi-stationary evaporating black hole solutions within the dimensionally reduced Einstein-Hilbert (DREH) model. In this model, the four-dimensional Einstein-Hilbert action reduces to a two-dimensional dilaton gravity, on top of which the quantum corrections can be incorporated via the Polyakov-Liouville (PL) action for a two-dimensional conformal field theory with a large central charge $c$. This gravity model arises from the s-wave approximation of four-dimensional Einstein-Hilbert gravity and provides a fully gravitational setting in which we study the islands, i.e., we will not require a non-gravitational bath region to collect the radiation, instead it lives in the black hole spacetime itself. The fine-grained entropy of Hawking radiation in the eternal and evaporating black holes within the DREH model was derived using the island rule in \\cite{djordjevic2022eternal, djordevic2025evaporating}. The island rule is based on the replica method using the Euclidean gravitational path integral. In this work, we complement the Euclidean approach by providing a Lorentzian prescription for the generalized entropy $S_{\\text{gen}}$, in the island formula without invoking the replica trick to compute $S_{\\text{gen}}$. The generalized entropy is shown to coincide with Wald-like Noether charge of the combined DREH-PL action. Using this generalized entropy, we determine the quantum extremal surface, the Page time, and the Page curve for the eternal and the evaporating black hole. We conclude with a discussion of the possible extension to the full four-dimensional geometry incorporating vacuum polarization corrections.", "url": "https://arxiv.org/abs/2607.24883", "type": "理论", "summary": "1. 该工作在降维爱因斯坦-希尔伯特引力模型中，通过洛伦兹方案推导永恒与蒸发黑洞的广义熵及Page曲线。\n2. 其技术核心是将岛屿公式中的广义熵等价于结合Polyakov-Liouville作用量的Wald-like Noether荷，无需副本技巧。\n3. 这为全四维几何纳入真空极化修正的岛屿计算提供了路径。", "summary_source": "deepseek", "authors": [{"name": "Krishna Jalan"}], "featured_authors": [{"name": "Krishna Jalan"}], "author_count": 1}, {"id": "2607.24909", "category": "hep-th", "title": "OPE = QNM", "abstract": "At microscopic scales the linear response of thermal states of large-$N$ CFTs is governed by a thermal operator product expansion (OPE), while at large scales response is governed by collective excitations known as quasinormal modes (QNM). We show that the OPE and QNM representations of the retarded correlator in mixed time and spatial momentum coordinates have an overlapping region of convergence in the complex time plane, giving a map between OPE and QNM data. We show that large-overtone QNM asymptotics are related to OPE singularities, while low-overtone QNM data appear in analytic continuation from short to large times. Using this approach we obtain new analytic results for QNM asymptotics, and numerically obtain low-overtone QNMs from OPE data for the Schwarzschild-AdS$_5$ black brane. We further show that the OPE spectrum is intimately related to QNM data through a set of sum rules which we derive in Mellin space. Finally, using the lightcone OPE, we argue that stress tensor correlators at large spatial momentum thermalise slower as the conformal collider bounds approach saturation. This work points to a new thermal bootstrap programme where OPE and QNM data constrain each other.", "url": "https://arxiv.org/abs/2607.24909", "type": "理论", "summary": "1. 该工作建立了大N热共形场论中热OPE与准正规模式（QNM）在混合时间和空间动量坐标下的相互映射，证明了二者在复时间平面存在收敛区域重叠。\n2. 其核心在于通过解析延拓和梅林空间求和规则，将高频QNM渐近行为关联到OPE奇点，并利用OPE数据数值获取低频QNM，同时导出限制谱的求和规则。\n3. 这为以OPE和QNM数据相互约束为核心的热自举程序提供了明确框架，并揭示了共形碰撞算符约束与高动量应力张量关联子热化速度的关联。", "summary_source": "deepseek", "authors": [{"name": "Paolo Arnaudo"}, {"name": "Cristoforo Iossa"}, {"name": "Robin Karlsson"}, {"name": "Benjamin Withers"}], "featured_authors": [{"name": "Paolo Arnaudo"}, {"name": "Cristoforo Iossa"}, {"name": "Robin Karlsson"}, {"name": "Benjamin Withers"}], "author_count": 4}, {"id": "2607.24913", "category": "hep-th", "title": "Neural Spectral Bias and Conformal Correlators II: Modular and Annulus Bootstrap", "abstract": "We develop a neural network bootstrap framework for reconstructing partition functions of two-dimensional conformal field theories (CFTs) based on modular invariance and the Cardy condition, which are recast as crossing equations for four-point correlators. For torus partition functions, we use the twist-field representation in the symmetric-orbifold description to map modular S-invariance to four-point crossing and focus on the diagonal kinematics of four insertions on a line. For annulus partition functions, we formulate open/closed channel duality as crossing symmetry for mixed four-point functions of defect-changing operators in interface CFT. In both cases, the reconstruction problem is formulated in the anchored-bootstrap form, where the crossing constraints are supplemented by minimal spectral input (a gap) and anchor data. We solve this under-determined problem by using lightweight feed-forward neural networks to parametrise the correlators and their corresponding partition functions. A key ingredient of this approach is the spectral bias of the neural networks in the lazy training regime, which selects specific crossing-symmetric configurations. This reformulation unifies standard modular and annulus constraints in two dimensions with the anchored neural approach for CFT correlators, providing a new way to reconstruct full partition functions from sparse data with remarkable accuracy.", "url": "https://arxiv.org/abs/2607.24913", "type": "理论", "summary": "1. 该工作基于模不变性与Cardy条件，将二维共形场论配分函数的重建问题转化为四点关联器的交叉方程，并利用神经网络靴带框架求解。\n2. 其技术核心在于神经网络懒训练区域的谱偏差自动选择交叉对称构型，从而将环面与圆环约束统一为锚定四点关联器形式，实现从稀疏谱数据精确重建完整配分函数。\n3. 这为从最小模数据出发、通过深度学习约束重构二维CFT谱提供了一种可推广的范式，并有望扩展至更高对称性或维度。", "summary_source": "deepseek", "authors": [{"name": "Kausik Ghosh"}, {"name": "Sidhaarth Kumar"}, {"name": "Vasilis Niarchos"}, {"name": "Andreas Stergiou"}], "featured_authors": [{"name": "Kausik Ghosh"}, {"name": "Sidhaarth Kumar"}, {"name": "Vasilis Niarchos"}, {"name": "Andreas Stergiou"}], "author_count": 4}, {"id": "2607.24914", "category": "hep-th", "title": "Kaluza-Klein Perturbation Theory from Exceptional Field Theory", "abstract": "We develop the perturbation theory of ten and eleven-dimensional supergravities on a large class of Kaluza-Klein backgrounds including familiar AdS examples such as AdS$_5\\times S^5$, but also more general manifolds such as black hole geometries. Employing ${\\rm E}_{6(6)}$ exceptional field theory with the backgrounds characterized by a generalized Scherk-Schwarz ansatz, we determine the first order field equations for the fluctuations that are gauge invariant under linearized generalized diffeomorphisms. We then present the details of the Higgs mechanism for all fields including spin-2 for the subset of backgrounds in which higher-form gauge fields vanish. We use a recently established machinery based on homotopy transfer that allows one to separate the fields into gauge invariant physical modes and pure gauge unphysical modes to all orders in perturbation theory. Finally, as a first application for backgrounds with higher-form gauge fields switched on, we analyze part of the spectrum of ten-dimensional Kaluza-Klein modes of type IIB supergravity around a Kerr-Newman AdS$_5$ black hole that in the near horizon limit becomes a fibered product of AdS$_2$ and a squashed three-sphere.", "url": "https://arxiv.org/abs/2607.24914", "type": "理论", "summary": "1. 该工作利用E6(6)例外场论与广义Scherk-Schwarz ansatz，发展了十维和十一维超引力在包括AdS5×S5及一般黑洞几何的大类Kaluza-Klein背景上的一阶微扰理论，确定了线性化广义微分同胚规范不变的涨落场方程。\n2. 其主要技术进步在于借助同伦传递方法，将涨落场系统分解为规范不变的物理模与纯规范模至所有微扰阶，并给出了背景中高形式规范场为零时包括自旋2场在内的所有场的希格斯机制详解。\n3. 作为首次应用，该框架被用于分析Kerr-Newman AdS5黑洞（近极限为AdS2与扭曲三球的纤维积）周围十维IIB超引力的部分Kaluza-Klein谱，证实了其对含高形式规范场等非平凡背景的处理能力。", "summary_source": "deepseek", "authors": [{"name": "Camille Eloy"}, {"name": "Olaf Hohm"}, {"name": "Camilla Lavino"}, {"name": "Henning Samtleben"}, {"name": "Yehudi Simon"}], "featured_authors": [{"name": "Camille Eloy"}, {"name": "Olaf Hohm"}, {"name": "Camilla Lavino"}, {"name": "Henning Samtleben"}, {"name": "Yehudi Simon"}], "author_count": 5}, {"id": "2607.24915", "category": "hep-th", "title": "The Tachyon Chern-Simons action with a generic tachyon field, and baryons in V-QCD", "abstract": "Consistency with global flavor anomalies requires the presence of Chern-Simons terms in holographic models of QCD. Such terms are analyzed in a setup arising in the holographic V-QCD model, where chiral symmetry breaking is implemented through the condensation of a complex scalar field, the tachyon. Using the superconnection formalism, the Tachyon-Chern-Simons terms are constructed explicitly in the general case, where the tachyon is any complex matrix in flavor space. This general case covers, among other things, backgrounds where different quark flavors have different masses. These new results are used to analyze the structure of the baryon solutions in the presence of nonzero quark masses. Expressions for the baryon number current and the total baryon number are found, and the baryon number is shown to be equal to the topological instanton number of the baryon solution. The effective four-dimensional pion action is analyzed and is shown to reproduce the chiral Lagrangian, including the Skyrme and Wess-Zumino-Witten terms.", "url": "https://arxiv.org/abs/2607.24915", "type": "理论", "summary": "1. 该工作在全息V-QCD模型中，利用超联络形式构造了含任意味空间复矩阵快子场的快子Chern-Simons作用量。\n2. 其核心在于严格证明重子数等于重子解的拓扑瞬子数，并指出有效四维π介子作用量精确重现包含Skyrme和Wess-Zumino-Witten项的手征拉格朗日量。\n3. 这为分析不同夸克质量背景下的重子结构及手征有效理论提供了统一的全息框架。", "summary_source": "deepseek", "authors": [{"name": "Jean-Loup Raymond"}, {"name": "Matti Järvinen"}, {"name": "Elias Kiritsis"}, {"name": "Francesco Nitti"}, {"name": "Edwan Préau"}], "featured_authors": [{"name": "Jean-Loup Raymond"}, {"name": "Matti Järvinen"}, {"name": "Elias Kiritsis"}, {"name": "Francesco Nitti"}, {"name": "Edwan Préau"}], "author_count": 5}, {"id": "2607.24916", "category": "hep-th", "title": "Carrollian bosonic supergravity at order $α'$ and the universal cancellation of higher-curvature divergences", "abstract": "We prove that the Carrollian limit of bosonic supergravity remains finite after including the four-derivative terms arising from the $\\alpha'$-corrections, and we explicitly construct the effective action. We also establish a universal criterion to determine the finiteness of higher-curvature contributions given by powers of the Riemann tensor, ${\\rm Riem}_1 \\cdots {\\rm Riem}_N$, with $N>1$. As applications of this criterion, we prove that the purely gravitational $\\alpha'^2$- and $\\alpha'^3$-corrections admit a finite Carrollian limit, derive their explicit contributions to the action, and show that the terms proportional to $\\zeta(3)$ do not contribute to the Carrollian bosonic supergravity at order $\\alpha'^3$.", "url": "https://arxiv.org/abs/2607.24916", "type": "理论", "summary": "1. 该工作证明包含α'修正的四导数项后，玻色超引力的Carrollian极限仍有限，并显式构造了有效作用量。\n2. 其关键卖点是建立了普适判据，判断由黎曼张量幂次构成的高阶曲率项在Carrollian极限下的有限性，并应用于α'^2和α'^3修正的显式构造。\n3. 这为系统研究超引力中高阶曲率修正的Carrollian极限提供了框架，并揭示了此类发散抵消的普适机制。", "summary_source": "deepseek", "authors": [{"name": "Eric Lescano"}], "featured_authors": [{"name": "Eric Lescano"}], "author_count": 1}, {"id": "2607.24919", "category": "hep-th", "title": "Analytic thermal bootstrap in momentum space: From thermal OPE to QNMs", "abstract": "We initiate a bootstrap program that relates ultraviolet data, encoded in the thermal OPE, to infrared observables, namely, the low-frequency behavior and quasinormal modes. Starting from KMS-symmetric completions of individual thermal OPE blocks, which play the role of thermal Polyakov blocks, we construct their Fourier transform, yielding an asymptotic expansion of retarded thermal correlators valid at any spatial momentum. We use these results to derive inversion formulae and connect thermal OPE data to the analytic structure of retarded correlators in the complex frequency plane. Under the assumption of meromorphicity, the inversion formulae express OPE coefficients in terms of the quasinormal-mode frequencies, leading to nontrivial sum rules, constraints on the quasinormal spectrum, and its asymptotics at large spatial momentum. We illustrate these results in free theories, two-dimensional CFTs, the large-$N$ limit and $\\varepsilon$-expansion of the $\\mathrm{O}(N)$ model, and the $R$-current correlator of strongly coupled $\\mathcal N = 4$ SYM at zero spatial momentum. As a byproduct, we derive universal asymptotic formulae for thermal OPE coefficients of heavy operators, resolving their dependence on spin and extending previous results at zero spatial separation. We test these formulae in the three-dimensional Ising CFT, finding good agreement between the resulting truncated correlators and Monte Carlo data.", "url": "https://arxiv.org/abs/2607.24919", "type": "理论", "summary": "1. 该工作建立了动量空间热自举程序，将热OPE紫外数据与低频行为和准正态模红外观测量关联。\n2. 其核心是利用KMS对称性构造热Polyakov块并做傅里叶变换，导出反演公式并由准正态模频率表达OPE系数。\n3. 这为从准正态模频谱约束热OPE系数、推导重算符普适渐近公式提供了新框架，并在三维Ising模型中验证。", "summary_source": "deepseek", "authors": [{"name": "Julien Barrat"}, {"name": "Deniz N. Bozkurt"}, {"name": "Enrico Marchetto"}, {"name": "Alessio Miscioscia"}, {"name": "Elli Pomoni"}], "featured_authors": [{"name": "Julien Barrat"}, {"name": "Deniz N. Bozkurt"}, {"name": "Enrico Marchetto"}, {"name": "Alessio Miscioscia"}, {"name": "Elli Pomoni"}], "author_count": 5}, {"id": "2607.24920", "category": "hep-th", "title": "Split Heun functions via blown-up surface defects", "abstract": "We study resonant solutions of the Heun equation and its confluent limits that arise in the Nekrasov--Shatashvili (NS) limit of four-dimensional $\\mathcal{N}=2$ $\\mathrm{SU}(2)$ gauge theories with fundamental hypermultiplets. At the resonant loci $2a/\\hbar\\in\\mathbb{Z}$ in the Coulomb branch parameter $a$, the Floquet multipliers coalesce and the instanton expansions of the bulk and surface defect NS functions develop poles of increasing order. We derive blow-up equations involving exclusively NS functions and use them to resum these singular expansions. The resulting resummed bulk and surface defect NS functions reveal the analytic structure of the gauge-theoretic solutions near the resonant loci, including the branch structure of the accessory parameter and of the Floquet solutions that is obscured by the term-by-term instanton expansion. At resonance, the resummed accessory parameters and suitably normalized defect wavefunctions admit finite limits that describe periodic or antiperiodic solutions at the edges of spectral gaps and allow us to construct their logarithmic companions. We then identify distinct nested mass loci governing gap closure and semisimple resonant monodromy. On the larger locus the band-edge accessory parameters coalesce, while on the smaller locus two independent resonant (anti)periodic Floquet solutions survive. We develop the general resummation procedure for $N_f=(n_0,n_1)$ theories with $n_i\\leq 2$ $(i=0,1)$, and demonstrate it explicitly for the $N_f=(1,1)$ theory.", "url": "https://arxiv.org/abs/2607.24920", "type": "理论", "summary": "1. 该工作通过构造炸开表面缺陷方程，重求和了Nekrasov–Shatashvili极限下Heun共振解中发散的瞬子展开，揭示了其于2a/ħ∈Z处的完整解析结构。\n2. 其核心在于利用炸开方程消除NS函数的多阶极点，得到重求和后辅助参数与归一化缺陷波函数的有限极限，进而构造带边周期/反周期解及其对数伴侣，并在嵌套质量位形上区分了谱隙闭合与半单共振单值。\n3. 此程序已推广至N_f≤2的一般理论并显式演示了N_f=(1,1)情形，为处理可积系统与规范理论中类似的共振奇点提供了原型思路。", "summary_source": "deepseek", "authors": [{"name": "Saebyeok Jeong"}, {"name": "Tommaso Pedroni"}], "featured_authors": [{"name": "Saebyeok Jeong"}, {"name": "Tommaso Pedroni"}], "author_count": 2}, {"id": "2607.24922", "category": "hep-th", "title": "Unitary Dual-Resonance S-matrices", "abstract": "Dual-resonance models realize crossing symmetry, Regge behavior and infinitely many resonances in a compact analytic form but their canonical tree-level realizations fall short of genuine S-matrix unitarity. Here we explicitly construct fully unitary dual-resonance amplitudes distinct from the conventional worldsheet construction. The zero-width resonance towers are promoted into a physical absorptive spectrum that retains their characteristic crossing and Regge organization, while unitarizing the amplitude through a mechanism distinct from standard eikonalization. The resulting S-matrices are also local and analytic, and can contain controllable second-sheet Regge trajectories as well as substantial inelasticity. More broadly, our construction opens up a new route to charting the space of consistent strongly coupled S-matrices.", "url": "https://arxiv.org/abs/2607.24922", "type": "理论", "summary": "1. 本文构造了完全幺正的对偶共振振幅，区别于常规世界面构造。\n2. 其核心在于将零宽度共振塔提升为物理吸收谱，通过非标准eikonal化机制实现幺正化，同时保留交叉对称性与Regge组织。\n3. 这为系统探索强耦合一致S矩阵空间开辟了新路径。", "summary_source": "deepseek", "authors": [{"name": "Claudia de Rham"}, {"name": "Andrew J. Tolley"}, {"name": "Zhuo-Hui Wang"}, {"name": "Shuang-Yong Zhou"}], "featured_authors": [{"name": "Claudia de Rham"}, {"name": "Andrew J. Tolley"}, {"name": "Zhuo-Hui Wang"}, {"name": "Shuang-Yong Zhou"}], "author_count": 4}, {"id": "2607.24923", "category": "hep-th", "title": "Feynman Tree Theorem and the Gelfand--Yaglom Formula", "abstract": "The Gelfand--Yaglom formula equates the one-loop determinant of a Schrödinger operator with Dirichlet boundary conditions to the solution of an initial value problem. Following a suggestion by Polyakov, we provide a new diagrammatic proof of this formula as a direct application of the Feynman Tree Theorem. By cutting the one-loop determinant, we re-express it as a sum of tree diagrams. These trees explicitly encode the solution to the Gelfand--Yaglom initial value problem. We extend this diagrammatic framework to general boundary conditions and comment on a potential generalization to quantum field theory.", "url": "https://arxiv.org/abs/2607.24923", "type": "理论", "summary": "1. 该工作基于费曼树定理，对Gelfand–Yaglom公式给出了一个新的图论证明。\n2. 通过切割单圈行列式将其重新表达为树图之和，显式编码了Schrödinger算子初值问题的解。\n3. 该图论框架可推广至一般边界条件，并为量子场论中的类似推广提供了可能线索。", "summary_source": "deepseek", "authors": [{"name": "Ipak Fadakar"}, {"name": "Guilherme L. Pimentel"}, {"name": "Behrang Tafreshi"}], "featured_authors": [{"name": "Ipak Fadakar"}, {"name": "Guilherme L. Pimentel"}, {"name": "Behrang Tafreshi"}], "author_count": 3}, {"id": "2607.24989", "category": "hep-th", "title": "Cross-Correlations of Metric and Monopole Perturbations from Holographic Cosmology", "abstract": "In this paper, we present the 1-loop calculation of the three-point function $\\langle TJJ \\rangle$ of the stress-energy tensor and two insertions of $SO(3)$ global currents, using a 3d toy model for holographic cosmology. By applying the holographic dictionary that relates these QFT $n$-point functions to cosmological correlators, together with the $Sl(2,\\mathbb{Z})$ duality that maps the electric Noether current to a magnetic vortex current dual to cosmological magnetic monopoles, we relate the $\\langle TJJ \\rangle$ correlator to the cross-correlations between metric perturbations and the bulk magnetic monopole field, specifically mapping to the non-Gaussianities $\\langle \\xi \\tilde{A} \\tilde{A} \\rangle$ and $\\langle \\gamma \\tilde{A} \\tilde{A} \\rangle$. We calculate the semi-local contact terms necessary to achieve the exact factorization of the cosmological correlators in the squeezed limit, $p_1 \\to 0$. Finally, we evaluate the effective non-linear parameters, showing that the scalar-monopole cross-correlation vanishes at leading order, $f_{NL}^{\\xi \\tilde{A} \\tilde{A}} = 0$, while the tensor-monopole cross-correlation yields a non-zero $f_{NL}^{\\gamma\\tilde A\\tilde A}$. These results respect the expected amplitude hierarchy of the non-Gaussian correlators, while pointing at new directions in which holographic cosmology can be tested experimentally.", "url": "https://arxiv.org/abs/2607.24989", "type": "理论", "summary": "1. 该工作基于三维全息宇宙学玩具模型，计算应力张量与SO(3)整体流三点函数的1-loop修正，通过全息字典与SL(2,Z)对偶，将其映射为度规扰动与体磁单极子场的交叉关联。\n2. 其技术核心在于通过squeezed极限下的半局部接触项实现宇宙学关联函数的精确分解，并揭示标量-单极子非高斯参数领头阶为零、张量-单极子非高斯参数非零的幅度层次。\n3. 这为全息宇宙学中非高斯关联的幅度层次提供了定量验证，并指出了利用张量-单极子交叉关联进行实验检验的新方向。", "summary_source": "deepseek", "authors": [{"name": "Matheus Cravo"}, {"name": "Juliana Z. Finotti"}, {"name": "Horatiu Nastase"}], "featured_authors": [{"name": "Matheus Cravo"}, {"name": "Juliana Z. Finotti"}, {"name": "Horatiu Nastase"}], "author_count": 3}, {"id": "2607.25054", "category": "hep-th", "title": "Quantum Gravity Corrections to Giant Graviton Correlators", "abstract": "We compute the leading quantum gravity correction to the correlation function of two maximal giant gravitons and two light supergravitons in the stress tensor multiplet in the supergravity limit of $\\mathcal{N}=4$ SYM theory. By viewing the giant gravitons as a zero-dimensional defect, we employ the defect version of the AdS unitarity method to reconstruct the one-loop correction from the known tree-level correlators. We obtain the one-loop result in closed form in both Mellin and position space. We also extract the quantum correction to the anomalous dimension of operators describing a bound state of a giant graviton and a light supergraviton at the leading conformal twist in the defect channel OPE.", "url": "https://arxiv.org/abs/2607.25054", "type": "理论", "summary": "1. 该工作计算了N=4 SYM理论超引力极限中最大巨引力子与两个轻超引力子关联函数的领头阶量子引力修正。\n2. 其核心在于将巨引力子视为零维缺陷，利用缺陷版AdS幺正性方法从树级关联函数重构单圈修正，并在Mellin和位置空间获得闭式解。\n3. 所得结果提取了巨引力子-轻超引力子束缚态算符的量子异常维数，为AdS/CFT中非微扰客体量子效应提供了精确基准。", "summary_source": "deepseek", "authors": [{"name": "Junding Chen"}, {"name": "Xi-Er Du"}, {"name": "Hynek Paul"}, {"name": "Xinan Zhou"}], "featured_authors": [{"name": "Junding Chen"}, {"name": "Xi-Er Du"}, {"name": "Hynek Paul"}, {"name": "Xinan Zhou"}], "author_count": 4}, {"id": "2607.25067", "category": "hep-th", "title": "A discrete series gauge field at the late-time boundary of $dS_4$", "abstract": "We study the free Maxwell field on the planar patch of four-dimensional de Sitter spacetime ($dS_4$). We review its bulk canonical quantization in the Bunch-Davies vacuum, and we give a representation-theoretic viewpoint by studying the transformation properties of single-particle states under infinitesimal dS transformations. By taking the late-time limit, we identify two late-time operators with scaling dimensions $\\Delta=1$ (leading) and $\\Delta=2$ (subleading). We introduce CFT-inspired inner products invariant under the dS group ($SO(4,1)$) for states created by late-time operators acting on the Bunch-Davies vacuum. We explain how the unitary discrete series representations of $SO(4,1)$ associated with the photon are furnished by both operators, in contrast with the Maxwell field on $AdS$ where the $\\Delta=1$ operator corresponds to a non-normalizable mode. We also explain how the corresponding discrete series representations of $SO(4,1)$ split into a direct sum of representations corresponding to two helicities $+1$ and $-1$. This is achieved by taking advantage of the dS invariance of the self-dual and anti-self-dual sectors of the photon field strength. In our outlook, we draw inspiration from a recent proposal for the microscopic description of $dS_4$ higher-spin gravity where conformal gauge fields in 3 dimensions play a central role, and we investigate a possible connection of the $\\Delta=1$ late-time operator with a conformal spin-1 gauge field in 3 dimensions.", "url": "https://arxiv.org/abs/2607.25067", "type": "理论", "summary": "1. 该工作研究四维德西特时空平面片上自由麦克斯韦场在晚时极限下的量子化，识别出标度维数Δ=1和Δ=2的两个算符。\n2. 其要点在于利用SO(4,1)幺正离散系列表示描述光子，并通过场强的自对偶与反自对偶分解将其分拆为两个螺旋度±1的表示。\n3. 这为dS4高阶自旋引力微观描述中三维共形自旋1规范场与Δ=1算符的可能关联提供了线索。", "summary_source": "deepseek", "authors": [{"name": "Manizheh Botshekananfard"}, {"name": "Elif Büşra Güraksın"}, {"name": "Vasileios A. Letsios"}, {"name": "Gizem Şengör"}], "featured_authors": [{"name": "Manizheh Botshekananfard"}, {"name": "Elif Büşra Güraksın"}, {"name": "Vasileios A. Letsios"}, {"name": "Gizem Şengör"}], "author_count": 4}, {"id": "2607.25116", "category": "hep-th", "title": "Derivation of the NS5-brane limit of the plane wave matrix model", "abstract": "From the gauge/gravity duality, it was predicted that there exists a nontrivial double scaling limit of the plane wave matrix model (the BMN matrix model), which describes the type IIA little string theory (LST) on $R\\times S^5$. We show on the gauge theory side that such a limit indeed exists for the partition function and in a certain 1/4 BPS sector of the matrix model, and consequently derive an eigenvalue integral, which is expected to describe the 1/4 BPS sector of LST.", "url": "https://arxiv.org/abs/2607.25116", "type": "理论", "summary": "1. 该工作从规范理论侧推导了平面波矩阵模型的NS5-膜极限，并证明该极限存在于配分函数及特定1/4 BPS扇区。\n2. 其核心在于通过精确分析得到描述IIA型弦理论1/4 BPS扇区的特征值积分，直接验证了预言的双标度极限存在性。\n3. 这为利用矩阵模型严格研究弦理论非微扰动力学提供了可解析处理的计算框架。", "summary_source": "deepseek", "authors": [{"name": "Yuhma Asano"}, {"name": "Goro Ishiki"}, {"name": "Shinji Shimasaki"}], "featured_authors": [{"name": "Yuhma Asano"}, {"name": "Goro Ishiki"}, {"name": "Shinji Shimasaki"}], "author_count": 3}, {"id": "2607.25205", "category": "hep-th", "title": "Monodromy, Hidden Conformal Symmetry and Soft Hair in Kerr-MOG Black Hole", "abstract": "We investigate the two-dimensional conformal field theory (2D CFT) dual of the four-dimensional Kerr-MOG (Kerr-modified gravity) black hole using three complementary approaches: (i) black hole thermodynamics, (ii) monodromy analysis, and (iii) the soft-hair formalism. From these independent methods, we derive consistent expressions for the left- and right-moving temperatures and the central charge of the dual CFT. Finally, we derive the entropy product using these approaches. We show that the product is not universal as well as not quantized. We further explore the hidden conformal symmetry of the non-extremal Kerr-MOG black hole by analyzing the near-region dynamics of a massless scalar field. The resulting Kerr-MOG/CFT correspondence identifies the near-region geometry with a two-dimensional CFT characterized by the temperatures ($T_{L}, T_{R}$) derived in Sec. 3. Moreover, using the Cardy formula, we reproduce the microscopic entropy of the dual CFT and find exact agreement with the Bekenstein-Hawking entropy of the Kerr-MOG black hole. We also show that the low-frequency scalar absorption cross section~(greybody factor) in the near-region Kerr-MOG geometry precisely matches the finite-temperature absorption cross section of the dual 2D CFT. In addition, the near-region scalar wave equation exhibits a hidden $(SL(2,\\mathbb{R})_L \\times SL(2,\\mathbb{R})_R)$ conformal symmetry. These independent results provide strong evidence for the existence of a Kerr/CFT-type holographic duality for the Kerr-MOG black hole, establishing a consistent correspondence between the four-dimensional Kerr-MOG spacetime and a two-dimensional conformal field theory. Furthermore, the hidden conformal symmetry is realized in the form of $\\rm {Vir_L} \\otimes \\rm{ Vir_R}$ diffeomorphisms which act non-trivially on the black hole horizon.", "url": "https://arxiv.org/abs/2607.25205", "type": "理论", "summary": "1. 该工作通过黑洞热力学、monodromy分析与软毛形式三种独立方法，构建了四维Kerr-MOG黑洞与二维CFT的对偶对应。\n2. 其关键结果是从三种途径导出一致的左右温度与中心荷，并利用Cardy公式精确重现Bekenstein-Hawking熵，同时发现近区域标量场波动方程具有隐藏的(SL(2,R)_L×SL(2,R)_R)共形对称性。\n3. 这为修改引力理论中黑洞的全息对偶提供了坚实证据，并暗示低能标量吸收截面与对偶CFT有限温吸收截面完全一致。", "summary_source": "deepseek", "authors": [{"name": "Parthapratim Pradhan"}], "featured_authors": [{"name": "Parthapratim Pradhan"}], "author_count": 1}, {"id": "2607.25226", "category": "hep-th", "title": "The quantum electrodynamics for dyons", "abstract": "The quantum electrodynamics for massive fermions carrying electric and magnetic charges, the dyons, is proposed based on the 1960's seminal works by Cabibbo, Ferrari, and Salam, with the gauge group being $U(1)\\times U(1)$, which is associated to a vector field (photon) and a pseudo-vector field (metaphoton), wherein the Dirac quantization is set aside. At the tree level the spectrum consistency of the model is analyzed, and all continuous and discrete symmetries are established. The quantum analysis is performed by using the Becchi-Rouet-Stora (BRS) algebraic renormalization method, which is independent on any regularization scheme. Moreover, thanks to the presence of massless gauge fields, the Lowenstein-Zimmermann (LZ) subtraction scheme is required within the framework of the Bogoliubov-Parasiuk-Hepp-Zimmermann-Lowenstein (BPHZL) renormalization procedure. Finally, it is verified that the proposed model, the dyon quantum electrodynamics (dQED), is free from any anomaly and is multiplicative renormalizable at all orders in perturbation theory, proving, therefore, its quantum consistency.", "url": "https://arxiv.org/abs/2607.25226", "type": "理论", "summary": "1. 该工作基于Cabibbo-Ferrari-Salam形式，提出了规范群为U(1)×U(1)的双荷子量子电动力学(dQED)。\n2. 其核心在于利用BRS代数重整化与BPHZL减除方案，严格证明了模型在微扰论所有阶无反常且乘积可重整化。\n3. 这为在搁置狄拉克量子化条件下构建含磁荷费米子的自洽量子场论奠定了坚实基础。", "summary_source": "deepseek", "authors": [{"name": "D.O.R. Azevedo"}, {"name": "O.M. Del Cima"}, {"name": "T.S. Dias"}, {"name": "E.D. Pereira"}], "featured_authors": [{"name": "D.O.R. Azevedo"}, {"name": "O.M. Del Cima"}, {"name": "T.S. Dias"}, {"name": "E.D. Pereira"}], "author_count": 4}, {"id": "2607.25500", "category": "hep-th", "title": "String theory mathematics and matrix data analysis", "abstract": "Inspired by matrix techniques in quantum field theory and string theory, we review Permutation Invariant Gaussian Matrix Models (PIGMM), which replace the continuous symmetries of traditional Random Matrix Theory, for $ N \\times N$ matrices, with finite permutation symmetry, $S_N$. This symmetry-driven approach reduces highly multivariate $N^2$-variable matrix data analysis problems to a rich but tractable space of parameters. The representation theory of $S_N$ brings a highly correlated quadratic matrix action to a near-diagonal form with $13$ parameters. The invariant observables are parameterised by graphs and their expectation values are computed with Wick contractions implemented algorithmically. We review the successful application of PIGMM for data reduction and anomaly detection in computational linguistics, statistical finance and neural network weights. We conclude with a brief discussion of potential future applications to matrix data analysis tasks that exploit hadronization algorithms and the modular structure of collider-physics data.", "url": "https://arxiv.org/abs/2607.25500", "type": "理论", "summary": "1. 该工作综述了置换不变高斯矩阵模型（PIGMM），用有限置换对称性S_N取代传统随机矩阵理论的连续对称性，以处理高维矩阵数据分析问题。\n2. 其技术核心在于利用S_N表示论将高度相关的二次矩阵作用约化为含13个参数的近对角形式，并以图参量化不变可观测量，通过Wick收缩算法计算期望值。\n3. 该模型已在计算语言学、统计金融与神经网络权重中成功实现数据降维与异常检测，未来可推广至强子化算法及对撞物理数据的模块化结构分析。", "summary_source": "deepseek", "authors": [{"name": "Sanjaye Ramgoolam"}], "featured_authors": [{"name": "Sanjaye Ramgoolam"}], "author_count": 1}, {"id": "2607.25662", "category": "hep-th", "title": "Toward the Structure Constants of $\\mathcal{N}=2$ Liouville Theory", "abstract": "We discuss the structure constants of spacelike $\\mathcal{N}=2$ Liouville theory on the two-sphere. Due to the absence of a particular $b \\leftrightarrow b^{-1}$ self-dual symmetry, where $b$ is the theory's coupling, the standard analytic bootstrap toolkit that was used to solve the bosonic and $\\mathcal{N}=1$ theories cannot be implemented in a straightforward way. Our approach, instead, relies on the fact that $\\mathcal{N}=2$ Liouville theory is dual by mirror symmetry to the $\\mathrm{SL}(2)_k/\\mathrm{U}(1)$ supercoset, whose target space is the $2$d fermionic black hole. Leveraging this duality, we obtain explicit expressions for the winding number preserving and violating structure constants on the supercoset side, and test them on the Liouville side through a semiclassical analysis finding agreement up to one-loop order. We also discuss the chiral rings of the theory and evaluate correlators of $\\frac 12$-BPS operators.", "url": "https://arxiv.org/abs/2607.25662", "type": "理论", "summary": "1. 该工作通过镜像对称性将球面N=2 Liouville理论对偶至SL(2)_k/U(1)超coset（二维费米黑洞），计算了其结构常数。\n2. 其核心在于利用超coset对偶绕过缺乏b↔b^{-1}自对偶对称性导致的解析自举困难，获得了缠绕数保持与违反的结构常数表达式，并在Liouville侧完成了半经典单圈阶验证。\n3. 这为完整确定N=2 Liouville理论算符代数以及相关超弦理论中的关联函数计算提供了可行路径，并启示了镜像对称在超共形场论求解中的一般性作用。", "summary_source": "deepseek", "authors": [{"name": "Beatrix Mühlmann"}, {"name": "Themistocles Zikopoulos"}], "featured_authors": [{"name": "Beatrix Mühlmann"}, {"name": "Themistocles Zikopoulos"}], "author_count": 2}, {"id": "2607.25714", "category": "hep-th", "title": "The coupling flow for supergravity", "abstract": "Quantum correlation functions in supersymmetric field theories can be encoded in the Nicolai map. The infinitesimal inverse map provides their response to a change in a coupling constant through a ``flow equation''. We investigate the flow in the gravitational constant $\\kappa$ for four-dimensional Poincaré supergravity via its superconformal formulation. By expressing the full superconformal off-shell action as a supervariation we derive a ``flow operator'' in the effective vierbein theory, whose exponentiation yields the gauge-invariant part of an all-order (inverse) Nicolai map for supergravity. Alas, the BRST gauge fixing adds to this functional differential flow operator a multiplicative term, which ruins its derivational property and therefore jeopardizes its connection with the Nicolai map. We argue and present an example, however, that such multiplicative flow contributions might be rewritable as derivational ones with the help of Wick's theorem in the free effective theory where the Nicolai-transformed correlators are ultimately evaluated. At least in the Landau gauge, the supergravity flow equation is shown to be regular at $\\kappa{=}0$, allowing for a perturbative expansion around Minkowski geometry. Therewith, we have overcome two of the three obstacles met in an earlier attempt towards a Nicolai map for Poincaré supergravity. Finally, we compare with the direct on-shell construction of a Nicolai map to leading order in $\\kappa$.", "url": "https://arxiv.org/abs/2607.25714", "type": "理论", "summary": "1. 该工作通过超共形表述推导了四维庞加莱超引力中关于引力常数κ的流动方程，并探索其与全阶（逆）Nicolai图的关联。\n2. 技术卖点在于利用超变分导出流动算符，进而克服BRST规范固定对导数性质的破坏，使方程在朗道规范下正则可微扰展开。\n3. 这为完整构建超引力的Nicolai图并系统地计算量子关联函数提供了关键步骤和微扰框架。", "summary_source": "deepseek", "authors": [{"name": "Federico Arrighi"}, {"name": "Saurish Khandelwal"}, {"name": "Olaf Lechtenfeld"}], "featured_authors": [{"name": "Federico Arrighi"}, {"name": "Saurish Khandelwal"}, {"name": "Olaf Lechtenfeld"}], "author_count": 3}, {"id": "2607.25733", "category": "hep-th", "title": "Balanced Metrics Know About SYZ", "abstract": "Numerical Ricci-flat metrics on Calabi-Yau manifolds are becoming increasingly accurate. However, they often lack the interpretability required to extract theoretical insights. In this paper, we introduce a novel variant of Donaldson's algorithm based on the Moore-Penrose pseudo-inverse that operates on the global sections of the ambient space rather than the manifold itself. This approach allows us to use the canonical monomial basis to compute interpretable balanced metrics even at large degrees $k$. Applying our ambient algorithm to multiple families, including the Dwork family and complete intersection Calabi-Yau manifolds, we discover that the metric parameters obey novel power laws near the Large Complex Structure Limit (LCSL). We connect these to the Gromov-Hausdorff metric collapse predicted by the SYZ conjecture.", "url": "https://arxiv.org/abs/2607.25733", "type": "理论", "summary": "1. 该工作基于Moore-Penrose伪逆提出Donaldson算法的新变体，在环境空间整体截面上计算可解释的平衡度量。\n2. 其技术要点在于即使在大度数k下仍可使用规范单项式基，并发现度量参数在大复结构极限附近服从新幂律。\n3. 这些幂律与SYZ猜想预言的Gromov-Hausdorff度量坍缩相关联，为深入理解Calabi-Yau度量的几何行为提供了启示。", "summary_source": "deepseek", "authors": [{"name": "Per Berglund"}, {"name": "Tristan Hübsch"}, {"name": "Vishnu Jejjala"}, {"name": "Viktor Mirjanić"}, {"name": "Challenger Mishra"}], "featured_authors": [{"name": "Per Berglund"}, {"name": "Tristan Hübsch"}, {"name": "Vishnu Jejjala"}, {"name": "Viktor Mirjanić"}, {"name": "Challenger Mishra"}], "author_count": 5}, {"id": "2607.25833", "category": "hep-th", "title": "Curved momentum space and finite Landau spectrum in $κ$-Minkowski spacetime", "abstract": "It is obtained the $\\kappa$-Poincare Casimir from the de Sitter geometry of momentum space and employed as the dynamical constraint governing charged particles within the framework of Poisson gauge theory. The resulting formalism is applied to investigate both scalar and spin-1/2 particles in a constant magnetic field. Exact energy spectra are obtained, including all orders in the deformation parameter $1/\\kappa$. The curvature of momentum space implies a maximal invariant momentum, which in turn leads to a finite Landau spectrum characterized by the existence of a Highest Landau Level (HLL). In the fermionic case, the truncation becomes spin dependent, resulting in a polarized HLL. Possible implications of this ultraviolet truncation and its relation to anomaly-related phenomena are briefly discussed.", "url": "https://arxiv.org/abs/2607.25833", "type": "理论", "summary": "1. 该工作从动量空间的德西特几何导出κ-庞加莱Casimir，并作为泊松规范理论中的动力学约束，得到恒定磁场中标量与自旋1/2粒子的精确能谱。\n2. 其技术核心在于动量空间曲率产生最大不变动量，从而导出有限朗道谱，且费米子情形下截断具有自旋依赖性，形成极化最高朗道能级。\n3. 这一紫外截断机制为理解反常相关现象与弯曲动量空间物理提供了新视角。", "summary_source": "deepseek", "authors": [{"name": "Adrián Huamán Vargas"}, {"name": "Vladislav Kupriyanov"}], "featured_authors": [{"name": "Adrián Huamán Vargas"}, {"name": "Vladislav Kupriyanov"}], "author_count": 2}, {"id": "2607.25952", "category": "hep-th", "title": "Maximal $D=5$ trombone supergravity from M5-branes and $\\mathrm{SU}(2)$-flavoured $\\mathcal{N}=1$ class $\\mathcal{S}$ operator spectra", "abstract": "We recently presented a new $D=5$ $\\mathcal{N}=8$ gauged supergravity involving the local trombone scaling symmetry. It arises by consistent truncation of M-theory on the internal space of the Maldacena-Núñez AdS$_5$ solution dual to the $\\mathcal{N}=2$ four-dimensional superconformal field theory (SCFT) of class $\\mathcal{S}$ associated to M5-branes wrapped on an unpunctured Riemann surface. Using exceptional generalised geometry/field theory, we extend that construction to show that the same $D=5$ $\\mathcal{N}=8$ supergravity also arises by consistent truncation of $D=11$ supergravity on the family of $\\mathcal{N}=1$ M5-brane-wrapped solutions of Bah-Beem-Bobev-Wecht, including the $\\mathcal{N}=1$ Maldacena-Núñez (MN1) configuration. Then, using recently derived mass matrices, we compute universal sectors of the Kaluza-Klein spectrum on the MN1 solution. In general, this universal spectrum is only locally defined, and we give a prescription for extracting globally defined subsectors thereof. This globally defined universal Kaluza-Klein spectrum is dual to a universal sector of the light operator spectrum of the SU(2)-flavoured $\\mathcal{N}=1$ class $\\mathcal{S}$ SCFT dual to MN1.", "url": "https://arxiv.org/abs/2607.25952", "type": "理论", "summary": "1. 该工作证明了一个五维最大trombone超引力也可从十一维超引力对一类N=1 M5膜绕解族的一致截断得到，并计算了Maldacena-Núñez解上的普适KK谱。\n2. 其技术核心在于利用例外广义几何/场论将一致截断扩展至新构型，并结合质量矩阵给出了从局部谱中提取全局定义子扇区的处方。\n3. 所得全局普适KK谱对偶于SU(2)味N=1类S超共形场论的轻算子谱，为研究该理论的普适扇区提供了全息对偶工具。", "summary_source": "deepseek", "authors": [{"name": "Ritabrata Bhattacharya"}, {"name": "Abhay Katyal"}, {"name": "Oscar Varela"}], "featured_authors": [{"name": "Ritabrata Bhattacharya"}, {"name": "Abhay Katyal"}, {"name": "Oscar Varela"}], "author_count": 3}, {"id": "2607.26011", "category": "hep-th", "title": "Krylov-Space Memory Cores", "abstract": "We introduce Krylov-space memory cores as stationary, depth-resolved structures that reveal how anomalous initial-state memory is organized inside the Krylov space of otherwise thermalizing nonintegrable systems. The stationary occupation profile identifies where late-time probability is concentrated along the Krylov chain, while complementary diagnostics of residual equilibration fluctuations, deviation from the Gibbs reference, and long-time Krylov-current fluctuations determine the physical character of that region. Across weak thermalization, confinement-induced anomalous dynamics, and many-body scarring, anomalous initial states develop compact low-depth memory cores that carry appreciable residual fluctuations, Gibbs mismatch, and persistent current-fluctuation activity. These cores are often embedded within substantially broader stationary occupation halos. Generic reference states, by contrast, do not exhibit a comparable combination of signal strength and spatial compactness. An auxiliary integrable comparison further shows that compact Krylov memory is state selective rather than a generic consequence of integrability. Krylov-space memory cores therefore provide a stationary framework for identifying where structured quantum memory resides and how it remains dynamically encoded.", "url": "https://arxiv.org/abs/2607.26011", "type": "理论", "summary": "1. 该工作引入Krylov空间记忆核心作为稳态、深度分辨结构，揭示热化非可积系统中反常初始态记忆的组织方式。\n2. 其卖点在于通过稳态占据分布、残余涨落、Gibbs偏差及持久电流涨落等诊断，定位弱热化、约束诱导异常动力学与多体疤痕系统中紧致记忆核心的物理特征。\n3. 这为识别量子记忆在Krylov链中的储存位置及其动态编码机制提供了稳态分析框架。", "summary_source": "deepseek", "authors": [{"name": "Mohsen Alishahiha"}, {"name": "Mohammad Javad Vasli"}], "featured_authors": [{"name": "Mohsen Alishahiha"}, {"name": "Mohammad Javad Vasli"}], "author_count": 2}, {"id": "2607.25293", "category": "math-ph", "title": "A Rigorous Proof of Metric Blow-Up for Pseudospherical Metrics Associated with the Degasperis--Procesi Equation", "abstract": "This paper studies finite-time blow-up of pseudospherical metrics induced by solutions of the Cauchy problem for the Degasperis--Procesi equation. For initial momentum profiles satisfying suitable left--right sign conditions, we use the method of characteristics, the momentum-transport formula, the Green's-function representation, and Riccati-type differential inequalities to analyze the metric along a distinguished characteristic. We prove that the associated coframe remains non-degenerate before the critical time, so that the induced pseudospherical metric is well defined in the precritical region. Moreover, as wave breaking is approached, the metric component \\(g_{22}\\) diverges to \\(+\\infty\\); when \\(\\mu\\neq0\\), the mixed component \\(g_{12}\\) also blows up in absolute value. Thus, finite-time wave breaking for the Degasperis--Procesi equation is shown to induce blow-up of certain components of the corresponding pseudospherical metric.", "url": "https://arxiv.org/abs/2607.25293", "type": "理论", "summary": "1. 该工作严格证明Degasperis–Procesi方程Cauchy问题的解诱导的伪球面度量在有限时间波破时发生分量暴胀。\n2. 通过特征线法、动量输运公式、Green函数表示和Riccati型微分不等式，证明关键特征线附近度量定义良好，而波破时刻g22发散至+∞，μ≠0时g12绝对值亦暴胀。\n3. 这表明可积系统的波破奇性可直接导致对应伪球面度量的几何奇点，为理解波破与度量的内在耦合提供严格例证。", "summary_source": "deepseek", "authors": [{"name": "Zhenhua Shi"}, {"name": "Mingyue Guo"}], "featured_authors": [{"name": "Zhenhua Shi"}, {"name": "Mingyue Guo"}], "author_count": 2}, {"id": "2607.25414", "category": "math-ph", "title": "Notes on a paper by F. Génot and B. Brogliato on the Painlevé paradox", "abstract": "We reconsider the analysis of the Classical Painlevé Problem developed by F. Génot and B. Brogliato ([1] New results on Painlevé paradoxes. - European Journal of Mechanics-A/Solids, 18(4):653{677, 1999), focusing on the consistency of their results with Galilean invariance. We show that certain conclusions concerning the dynamical evolution of the mechanical system are not invariant under changes of Galilean observer and therefore cannot, in their present form, be interpreted as intrinsic properties of the system. In particular, we show that the classi?cation of motion states depends on the observer through the velocity{dependent characterization of the frictional constraint, and we trace the origin of this dependence to the Galilean velocity-addition theorem. We present and discuss possible reformulations of the model aimed at restoring observer-invariant descriptions of the problem.", "url": "https://arxiv.org/abs/2607.25414", "type": "理论", "summary": "1. 该工作重新审视了Génot与Brogliato对经典Painlevé问题的新结论，揭示了其动力学分析在伽利略变换下的一致性缺陷。\n2. 主要物理卖点在于指出摩擦约束的速度依赖性导致运动状态分类依赖参考系，并追溯该问题至伽利略速度相加定理。\n3. 这为建立观察者无关的Painlevé问题描述提供了模型重构方向，并启发对含摩擦力学系统基础假设的审查。", "summary_source": "deepseek", "authors": [{"name": "Stefano Pasquero"}], "featured_authors": [{"name": "Stefano Pasquero"}], "author_count": 1}, {"id": "2607.25445", "category": "math-ph", "title": "Quantum estimates for classical polynomial optimization", "abstract": "The problem of finding lower and upper bounds on multivariate homogeneous polynomials is both difficult and important given its applications to questions ranging from dynamical stability in complex potential landscapes to data analysis. From the standpoint of tensor eigenvalue theory, the question is equivalent to finding the smallest and the largest eigenvalues of the coefficient tensor corresponding to the given polynomial. Standard approaches outlined in the literature amount to running nonlinear iterations in search for the optimal rays along which the growth of the polynomial is fastest or slowest. Unlike the case of matrices (or their corresponding multivariate quadratic forms) convergence of such algorithms for higher-rank tensors is capricious due to the complex topography of polynomial objective functions. In this essay, a very different strategy, inspired by quantum-mechanical variational methods, is introduced for finding bounds on polynomials. The original polynomial is replaced by an operator acting in a suitably chosen (large) space of states, such that in an appropriate \"classical\" limit this operator approaches the original polynomial expression made of commutative variables. As a result, approximating the smallest and largest eigenvalues of the coefficient tensor, and thus finding bounds on polynomials, amounts to diagonalizing the resulting quantum operator, represented as a large matrix, and then inspecting the smallest and largest eigenvalues of this matrix. This approach is then successfully applied to standard test examples from tensor eigenvalue literature and other problems of interest in mathematical physics including Strichartz-type inequalities.", "url": "https://arxiv.org/abs/2607.25445", "type": "理论", "summary": "1. 该工作提出一种量子变分方法，将经典多项式优化问题转化为大状态空间量子算符的对角化，以求解系数张量的极值特征值。\n2. 其核心在于构造量子算符使其在经典极限下恢复原多项式，从而将高秩张量特征值的非线性迭代替换为大型矩阵的线性谱求解。\n3. 该方法成功应用于张量特征值标准测试及Strichartz型不等式，为经典多项式极值问题提供了量子启发式数值方案。", "summary_source": "deepseek", "authors": [{"name": "Oleg Evnin"}], "featured_authors": [{"name": "Oleg Evnin"}], "author_count": 1}, {"id": "2607.25855", "category": "math-ph", "title": "Mori-Zwanzig formalism: An existence proof for weak solutions of the orthogonal dynamics equation", "abstract": "In classical statistical physics, the Mori-Zwanzig projection operator technique is used to derive generalized Langevin equations for a random variable (observable). Standard derivations implicitly assume the existence of solutions to the so-called orthogonal dynamics equation as well as the validity of the variation of constants formula (Dyson identity). It was pointed out by Givon, Hald and Kupferman that the existence is a subtle issue for infinite-rank projections such as Zwanzig's projection [D. Givon, O. H. Hald, R. Kupferman, Israel Journal of Mathematics, 145 (221-241), 2005]. The authors proved the existence of weak solutions for Zwanzig's projection in the context of stationary Hamiltonian systems. To this date, this is the only existence proof that allows for an infinite-rank projection, whereas the uniqueness and regularity remain open problems. In this article, we generalize the existence proof by Givon et al. to nonstationary non-Hamiltonian systems whose time evolution is given by a quasicontraction semigroup. We establish growth bounds as well as the uniqueness for sufficiently regular solutions (if existent). Finally, we apply our results to Zwanzig's projection using the damped harmonic oscillator as an example.", "url": "https://arxiv.org/abs/2607.25855", "type": "理论", "summary": "1. 该工作将Mori-Zwanzig形式中正交动力学方程弱解的存在性从平稳哈密顿系统推广至非平稳非哈密顿系统，其时间演化由拟压缩半群描述。\n2. 核心进展在于给出了弱解的增长界，并证明了充分正则解（若存在）的唯一性，同时以阻尼谐振子为例验证了Zwanzig投影的应用。\n3. 这为非平稳非哈密顿系统中投影算子技术的严格化奠定基础，而解的唯一性与正则性仍是开放问题。", "summary_source": "deepseek", "authors": [{"name": "Christoph Widder"}], "featured_authors": [{"name": "Christoph Widder"}], "author_count": 1}, {"id": "2607.25994", "category": "math-ph", "title": "Accurate Computation of Activated Volume in Electromagnetic Heating", "abstract": "In electromagnetic heating and other applications, we need to compute the volume enclosed by an isosurface of the 3D temperature distribution that is numerically represented on a rectangular grid. This situation arises naturally when the temperature distribution is obtained by solving a partial differential equation numerically using a finite difference method. Given the temperature distribution on the 3D grid, the isosurface of a prescribed value is represented approximately by a triangulation, a collection of triangles with vertices on the grid lines. The vertices are determined by a linear interpolation to approximate the locations where the temperature is at the prescribed level. The region enclosed by the isosurface is approximated by that enclosed by the triangulation, which is a set of tetrahedrons. The enclosed volume is approximated by summing those of tetrahedrons. This volume approximation is analogous to approximating a curve using line segments and is limited in accuracy. In this study, we combine extrapolation with the triangulation approximation to develop a more accurate method for computing the volume enclosed by an isosurface of the 3D temperature distribution on a rectangular grid.", "url": "https://arxiv.org/abs/2607.25994", "type": "理论", "summary": "1. 该工作结合外推法与三角剖分，提出了计算矩形网格上三维温度分布等值面包围体积的精确方法。\n2. 其技术卖点在于通过外推修正线性插值三角剖分的体积近似误差，显著提高了精度。\n3. 这为电磁加热等应用中基于数值网格的等值面体积计算提供了可靠的高精度方案。", "summary_source": "deepseek", "authors": [{"name": "Hongyun Wang"}, {"name": "Parthiv Seetharaman"}, {"name": "Shannon E. Foley"}, {"name": "Hong Zhou"}], "featured_authors": [{"name": "Hongyun Wang"}, {"name": "Parthiv Seetharaman"}, {"name": "Shannon E. Foley"}, {"name": "Hong Zhou"}], "author_count": 4}, {"id": "2607.24837", "category": "quant-ph", "title": "A Difference Operator Approach to Quantum Random Walks: Parseval Identity, Krawtchouk Matrices, and Hermite Limits", "abstract": "We introduce a discrete difference operator D_k to study the one-dimensional quantum random walk (QRW) with the Hadamard coin. Explicit combinatorial expressions are obtained for the probability amplitudes a(n,k) and b(n,k), which encode the final step direction and carry alternating signs that reflect the merging of leftward steps. Removing these signs and the coin-state distinction recovers the classical binomial distribution. The symmetric and antisymmetric combinations $a\\pm b$ are shown to coincide with diagonal and sub-diagonal entries of the Krawtchouk matrix. Using cross identities among Krawtchouk matrix elements, we prove by induction that the amplitudes satisfy a Parseval identity sum (a^2+b^2)=2^n-1, establishing probability conservation in the Krawtchouk formulation. The operator D_k acts as a discrete Hermite polynomial generator: the ratios h_m = (n choose k)^{-1} D_k^m (n choose k) admit explicit closed forms and converge to Hermite polynomials in the continuous limit. At the discrete level, D_k connects successive Krawtchouk matrices and acts as a coherence generator and a raising operator. The h_m quantify the position-dependent degree of quantum interference on both halves of the distribution, either individually (for x >= 0) or through an inverse-Pascal combination of several h_m (for x < 0), and the ballistic O(n^2) scaling of the variance emerges from the superposition of all excited states. Numerical illustrations for n=6 and n=10 corroborate the analytical results.", "url": "https://arxiv.org/abs/2607.24837", "type": "理论+数值", "summary": "1. 该工作引入离散差分算子Dₖ研究一维Hadamard硬币量子随机游走，给出概率幅的显式组合表达式并证明了Parseval恒等式。\n2. 卖点在于Dₖ作为离散Hermite多项式生成器，其比值hₘ在连续极限收敛到Hermite多项式，并量化了位置依赖的量子干涉程度。\n3. 这为量子随机游走的概率守恒、干涉机制及弹道O(n²)方差标度提供了严格解析框架与离散-连续对应启发。", "summary_source": "deepseek", "authors": [{"name": "Chien-Wen Hwang"}], "featured_authors": [{"name": "Chien-Wen Hwang"}], "author_count": 1}, {"id": "2607.24842", "category": "quant-ph", "title": "Closed-Form Expectation Values of the Damped Kerr Oscillator", "abstract": "We derive a closed-form analytical expression for the expectation values of a damped Kerr nonlinear oscillator initialized in a coherent state. Starting from the exact Liouville-space solution of the Lindblad master equation, we specialize to coherent-state initial conditions, obtaining explicit time-dependent expressions for arbitrary normally ordered expectation values. The resulting expressions depend only on the system parameters and the initial coherent-state amplitude, requiring neither numerical integration nor evolution in a truncated Fock space. We verify the analytical expressions against master-equation simulations over a range of nonlinear interaction strengths. The closed-form solution provides an efficient alternative to numerical simulation while remaining free of Fock-space truncation error. Finally, we note an extension of the underlying Lie-algebraic structure that may provide a useful starting point for obtaining exact solutions to a broader class of open quantum optical systems.", "url": "https://arxiv.org/abs/2607.24842", "type": "理论+数值", "summary": "1. 该工作针对处于相干态的阻尼Kerr非线性振荡器，导出任意正规排序期望值的闭式时间依赖解析表达式。\n2. 解析式直接从Lindblad主方程的精确Liouville空间解获得，完全避免数值积分与Fock空间截断误差。\n3. 所揭示的Lie代数结构有望推广至更广泛的开放量子光学系统精确解。", "summary_source": "deepseek", "authors": [{"name": "Jacob Emerson"}], "featured_authors": [{"name": "Jacob Emerson"}], "author_count": 1}, {"id": "2607.24853", "category": "quant-ph", "title": "Wave-functional formulation of dissipative CSL models", "abstract": "We formulate minimal and dissipative Continuous Spontaneous Localization (CSL) dynamics in the functional Schrödinger representation for a non-relativistic bosonic field. In this framework, the Fock-space state is encoded in a wave functional, and fixed particle-number wave functions are obtained by sector projection. For the minimal CSL coupling to the smeared mass density, this projection gives the standard nonlinear stochastic dynamics in each \\(N\\)-particle sector, with the collapse operator acting on the total smeared density of the configuration. This makes the amplification mechanism transparent and allows us to discuss sector superpositions, local probability balance, and the status of Bohmian equivariance at the wave-function level. We then consider a dissipative extension in which the collapse operator includes a smeared current contribution. The one-particle sector reproduces the expected dissipative CSL energy balance, while fixed many-body sectors contain additional collective momentum shifts and pair-mixing terms that are not reducible, in general, to independent one-particle contributions. Within a leading compact closure, the collective pair friction produces a non-extensive stationary mean kinetic energy: in three dimensions and for weak dissipation, $T_N^{\\rm comp}\\simeq 2T_\\beta/N$, whereas the corresponding dilute energy remains extensive.", "url": "https://arxiv.org/abs/2607.24853", "type": "理论", "summary": "1. 该工作以波泛函表述了最小与耗散连续自发定域化动力学，通过扇区投影将Fock空间态映射为固定粒子数波函数。\n2. 其卖点在于：最小耦合时投影给出标准非线性随机动力学并透明化放大机制；耗散扩展引入弥散流，多体扇区出现不可约化为单体贡献的集体动量偏移与配对混合项。\n3. 在领先紧致闭合近似下，三维弱耗散中集体对摩擦导致非广延平均动能T_N~2T_β/N，与稀薄极限的广延性形成对比，为理解耗散CSL多体效应及非平衡统计提供了启发。", "summary_source": "deepseek", "authors": [{"name": "Y.M.P. Gomes"}], "featured_authors": [{"name": "Y.M.P. Gomes"}], "author_count": 1}, {"id": "2607.24855", "category": "quant-ph", "title": "Information-theoretic limits on undetectable parameter-estimation attacks in continuous-variable quantum key distribution", "abstract": "We formalize side-channel detection in Gaussian-modulated continuous-variable quantum key distribution (CV-QKD) as a certificate-forgery hypothesis test and identify its detectability with an information-theoretic rate. Relative to a set $\\mathcal{M}$ of trusted, real-time-monitored observables, the forgery- detectability rate $g_{\\mathcal M}$ of a benign-statistics certificate is the missed-detection Stein exponent. We prove a dichotomy: $g_{\\mathcal M}$ is monotone and strictly positive in the leaked Holevo information when the shot- noise unit is trusted, and identically zero otherwise, recovering local- oscillator and calibration attacks as the degenerate case. Monotonicity yields a certificate reusability rate bounding the Holevo leakage compatible with an undetected certificate over $N_{\\mathrm{PE}}$ estimation rounds, via the non- asymptotic bound $\\varepsilon_{\\mathrm{PE}}\\le\\exp(-N_{\\mathrm{PE}}\\psi(r))$ whose near-threshold expansion matches the Gaussian confidence-interval scaling of standard finite-size analyses. We then give a composable finite-size key- length statement under collective Gaussian attacks, whose worst-case Holevo term is the reusability rate and whose parameter-estimation failure probability is bounded by the Stein exponent at every block length. Both results are unconditional in the trusted-correlation model, where strict monotonicity of the Holevo leakage in the excess noise follows from a noise-injection argument; for general $\\mathcal{M}$ they hold under an explicit no-spurious-local-minima condition on the divergence landscape, verifiable by low-dimensional inspection. Convexity of the rate further assumes a numerically supported concavity of the Holevo bound, the sole numerical ingredient; proof status is delimited throughout.", "url": "https://arxiv.org/abs/2607.24855", "type": "理论+数值", "summary": "1. 该工作将连续变量量子密钥分发中旁信道攻击的不可检测性转化为证书伪造假设检验，并通过漏检Stein指数形式化其信息论可检测率。\n2. 其关键发现是可检测率在信任散粒噪声单元时对泄漏Holevo信息严格单调正定，否则恒为零，并由此导出证书可重用率非渐近界，其近阈值缩放匹配有限大小分析。\n3. 该结果为集体高斯攻击下可组合有限大小密钥长度提供表述，参数估计失败概率由Stein指数严格界定，且噪声注入论证确保单调性，扩展至一般观测量集需验证景观条件。", "summary_source": "deepseek", "authors": [{"name": "Agung Trisetyarso"}, {"name": "Lenny Putri Yulianti"}, {"name": "Kridanto Surendro"}], "featured_authors": [{"name": "Agung Trisetyarso"}, {"name": "Lenny Putri Yulianti"}, {"name": "Kridanto Surendro"}], "author_count": 3}, {"id": "2607.24924", "category": "quant-ph", "title": "Efficient computation of real-time correlators using Pauli Propagation", "abstract": "Pauli propagation has shown promise for classically simulating quantum dynamics by evolving observables directly in the Heisenberg picture. In this work, we investigate its use for computing real-time two-point time-ordered correlators in one- and two-dimensional quantum systems. One major limitation of Pauli propagation is the rapid growth in the number of Pauli strings beyond short times. We overcome this limitation by combining accurate short-time Pauli-propagation data with time extension methods based on a positivity condition and the observation that the dynamics are often dominated by a small number of characteristic frequencies. This combined approach extends correlation functions far beyond the directly accessible time window while avoiding the exponential proliferation of Pauli operators. We demonstrate that the resulting correlators retain the relevant dynamical and spectral information. Our results broaden the regime in which classical methods can reliably probe the real-time dynamics of interacting quantum many-body systems.", "url": "https://arxiv.org/abs/2607.24924", "type": "理论", "summary": "1. 该工作利用Pauli传播在海森堡图像中演化可观测量，高效计算一维和二维量子系统的实时两点时序关联函数。\n2. 其卖点在于结合短时间传播数据与基于正定性条件和少数特征频率主导性的时间扩展方法，避免了Pauli算符的指数增殖。\n3. 这为经典方法可靠探测相互作用量子多体系统实时动力学提供了更广泛的可达时间窗口与谱信息保留能力。", "summary_source": "deepseek", "authors": [{"name": "Alexander F. Kemper"}, {"name": "Raghav G. Jha"}, {"name": "Arnab Bachhar"}, {"name": "Goksu C. Toga"}, {"name": "Mariano Guerrero Perez"}, {"name": "Nicholas J. Mayhall"}], "featured_authors": [{"name": "Alexander F. Kemper"}, {"name": "Raghav G. Jha"}, {"name": "Arnab Bachhar"}, {"name": "Goksu C. Toga"}, {"name": "Mariano Guerrero Perez"}, {"name": "Nicholas J. Mayhall"}], "author_count": 6}, {"id": "2607.24946", "category": "quant-ph", "title": "Numerical Modeling of Quasiparticle-Induced Dissipation in Fluxonium Qubits", "abstract": "Nonequilibrium quasiparticles (QPs) generated by stray infrared and ionizing radiation can limit the performance of superconducting quantum processors and present challenges for quantum error correction schemes. Models of QP-induced energy relaxation commonly assume that the characteristic energy of the QPs and the qubit transition energy are both small relative to the superconducting gap. Under these assumptions, certain qubits such as the fluxonium would exhibit protection against QP-induced dissipation at specific bias points. Here, we show that this is not necessarily the case, numerically analyzing the predicted rate of QP-induced dissipation in fluxonium qubits for different QP energy distributions and for QPs created via photon-assisted tunneling processes. We find that accounting for small numerical factors, existing theoretical models predict sensitivity to QP-induced errors at bias points previously thought to be protected. We find that inclusion of asymmetry in the superconducting gap energy across the junction can reintroduce suppression of QP-induced relaxation, as expected. Additionally, for QPs created by photon-assisted tunneling, we predict that $T_1$ protection will only occur for a specific energy of pair-breaking radiation. This understanding of fluxonium sensitivity to QP-induced dissipation informs the development of fluxonium-based processors and future QP-mitigation strategies.", "url": "https://arxiv.org/abs/2607.24946", "type": "理论+数值", "summary": "1. 本文通过数值模拟分析了通量量子位中准粒子诱导耗散的弛豫率，揭示了在原本认为受保护的工作点上其敏感性依然存在。\n2. 核心在于考虑了准粒子的不同能量分布及光子辅助隧穿过程，发现计入微小数值因子和约瑟夫森结两侧超导能隙的不对称性可复现耗散抑制。\n3. 这一理解直接指导通量量子位处理器的设计优化及未来准粒子缓解策略的制定。", "summary_source": "deepseek", "authors": [{"name": "Kate Azar"}, {"name": "Max Hays"}, {"name": "Kyle Serniak"}], "featured_authors": [{"name": "Kate Azar"}, {"name": "Max Hays"}, {"name": "Kyle Serniak"}], "author_count": 3}, {"id": "2607.24961", "category": "quant-ph", "title": "Non-Hermitian entropy production from fluctuation theorems", "abstract": "We develop a first-principles thermodynamic framework for non-Hermitian dynamics based on a post-selected version of the fluctuation theorem. This allows us to identify a quantity that remains positive throughout the non-Hermitian evolution and can be interpreted as the entropy production of the post-selected dynamics. We relate this quantity to previously proposed notions of non-Hermitian entropy and derive an associated second law. Furthermore, we establish a connection with information-theoretic quantities, in particular the Petz-Rényi divergences, and leverage this connection to derive upper and lower bounds. Finally, we decompose the entropy production into incoherent and coherent contributions, identifying distinctive features of the coherent term in the vicinity of exceptional points. We illustrate our results using a paradigmatic model of non-Hermitian evolution based on a two-level system.", "url": "https://arxiv.org/abs/2607.24961", "type": "理论", "summary": "1. 该工作基于后选择涨落定理，为非厄米动力学建立了第一性原理热力学框架。\n2. 其核心在于识别出一个在非厄米演化中始终为正的熵产生量，并将其与Petz-Rényi散度关联以导出上下界。\n3. 将熵产生分解为非相干和相干贡献，揭示了奇异点附近相干项的独特特征，为理解非厄米系统热力学提供了新启发。", "summary_source": "deepseek", "authors": [{"name": "Vasco Cavina"}, {"name": "Frank Ernesto Quintela Rodríguez"}, {"name": "Donato Farina"}], "featured_authors": [{"name": "Vasco Cavina"}, {"name": "Frank Ernesto Quintela Rodríguez"}, {"name": "Donato Farina"}], "author_count": 3}, {"id": "2607.24968", "category": "quant-ph", "title": "Universal Optimization and Tighter Fidelity Bounds for Approximate Quantum Error Correction", "abstract": "Approximate quantum error correction (AQEC) not only dictates the performance of discrete- and continuous-variable quantum error correction codes but also serves as a unifying framework across various physical disciplines. Identifying the optimal recovery channel to maximize the entanglement fidelity via standard semidefinite programming is computationally bottlenecked by the exponentially growing number of Kraus operators with system size, rendering large-scale optimization prohibitive. While analytical near-optimal maps exist, they typically work only when the Knill-Laflamme conditions are nearly satisfied. In this Letter, we establish an efficient framework by leveraging the duality between recovery and environment decoupling. This framework yields a tighter analytical lower bound on entanglement fidelity than the conventional limit set by the transpose channel. Furthermore, by exploiting the decayed weights of noise Kraus operators, we introduce a framework based on principal component analysis to reduce the dimension. In thermal loss channels where the weights decay exponentially, our approach achieves a 33-fold computational speedup while maintaining rigorous accuracy. Our approach enables high-precision optimization for AQEC codes that were previously intractable due to the curse of dimensionality.", "url": "https://arxiv.org/abs/2607.24968", "type": "理论+数值", "summary": "1. 该工作利用恢复与环境解耦的对偶性，为近似量子纠错建立了高效优化框架。\n2. 其核心在于给出比转置信道更紧的纠缠保真度解析下界，并基于噪声Kraus算子的指数衰减权重引入主成分分析降维，在热损失信道中实现33倍计算加速。\n3. 这使此前因维度诅咒而难以处理的大规模近似量子纠错码得以实现高精度优化。", "summary_source": "deepseek", "authors": [{"name": "Jing Wu"}, {"name": "Michele Grossi"}, {"name": "Doga Kurkcuoglu"}, {"name": "Silvia Zorzetti"}], "featured_authors": [{"name": "Jing Wu"}, {"name": "Michele Grossi"}, {"name": "Doga Kurkcuoglu"}, {"name": "Silvia Zorzetti"}], "author_count": 4}, {"id": "2607.24972", "category": "quant-ph", "title": "A Kernel-Based Density of States Estimator for Quantum Computing", "abstract": "The density of states (DoS) encodes the thermodynamic and spectral properties of quantum many-body systems, yet its reconstruction becomes intractable for Hilbert spaces too large to diagonalize. Classically, the kernel polynomial method (KPM) addresses this by combining stochastic trace estimation with a smoothing kernel. Here we show that the Rodeo algorithm---one of the simplest eigenvalue-location protocols for near-term quantum hardware---provides a direct quantum analogue of this approach. Averaging the Rodeo response over Haar-random input states yields the DoS convolved with a spectral kernel fixed entirely by the distribution of evolution times: the random states play the role of stochastic trace estimation, and the temporal sampling distribution that of the damping kernel. The construction requires only the standard single-ancilla circuit, and quantum typicality suppresses the statistical error as the Hilbert-space dimension grows. We derive the estimator and its uncertainties, establish an explicit dictionary between signal-processing window functions and quantum reconstruction kernels, and validate the method on the one-dimensional transverse-field Ising and spin-1 models.", "url": "https://arxiv.org/abs/2607.24972", "type": "理论+数值", "summary": "1. 该工作提出了基于Rodeo算法的量子态密度估计器，作为经典核多项式方法的直接量子模拟。\n2. 其技术核心在于利用Haar随机输入态的平均Rodeo响应获得与谱核卷积的态密度，随机态等效于随机迹估计，而时间采样分布则充当阻尼核，统计误差随希尔伯特空间维度增大而抑制。\n3. 该构造仅需标准单辅助比特电路，建立了信号处理窗函数与量子重建核的显式对应，并为近量子硬件上的热力学和谱性质研究提供了可验证的途径。", "summary_source": "deepseek", "authors": [{"name": "Julio Cesar Siqueira Rocha"}], "featured_authors": [{"name": "Julio Cesar Siqueira Rocha"}], "author_count": 1}, {"id": "2607.24976", "category": "quant-ph", "title": "Quantum reference frames beyond subsystems: a reconstruction and generalization of the perspective-neutral framework", "abstract": "We generalize the notion of quantum reference frames (QRFs) to cases where the frame does not necessarily correspond to a tensor factor subsystem, but to a covariant quantum instrument. This unlocks a variety of physical applications: \"frames of labeling\" for indistinguishable particles, suggesting explanations for the symmetrization postulate and the absence of parastatistics, and yielding a transparent description of the entanglement of bosons and fermions; and relational clocks reproducing the Schrödinger equation exactly even when all subsystems are interacting or when there are frequency superselection sectors. Our work generalizes the perspective-neutral approach to QRFs pioneered by Höhn and co-authors, which we reconstruct from a simple operational scenario. We give a resource-theoretic grounding of this framework, and show how the notion of completely covariant operations explains the relevance of the charge-zero sector and the pure-state transformation behavior across perspectives. This also suggests operational clarifications of some aspects of constraint quantization, e.g. of the meaning of constraint equations such as $C|\\psi\\rangle=0$. Some of our results, such as our generalization of relationalization maps to instruments, apply more broadly to other QRF frameworks too, and they contribute to bridging the gap between operational quantum information theory and the internal QRF research program.", "url": "https://arxiv.org/abs/2607.24976", "type": "理论", "summary": "1. 该工作基于操作场景重构并推广量子参考系至协变量子仪器，突破张量因子子系统的限制。\n2. 其核心卖点在于用完全协变操作与资源理论统一处理不可区分粒子标记、关系时钟及频率超选择扇区，精确复现薛定谔方程并诠释对称化公设与纯态变换。\n3. 这为约束量子化中约束方程的操作意义提供澄清，并桥接了操作量子信息理论与内部量子参考系研究计划。", "summary_source": "deepseek", "authors": [{"name": "Stefan L. Ludescher"}, {"name": "Manuel Mekonnen"}, {"name": "Thomas D. Galley"}, {"name": "Markus P. Mueller"}], "featured_authors": [{"name": "Stefan L. Ludescher"}, {"name": "Manuel Mekonnen"}, {"name": "Thomas D. Galley"}, {"name": "Markus P. Mueller"}], "author_count": 4}, {"id": "2607.24987", "category": "quant-ph", "title": "An algebraically closed family of informational n-qubit purity invariants", "abstract": "We present a family of quadratics in Pauli expectation values, and prove that they constitute state-independent invariants for all n-qubit pure states. This family generalises the two-qubit `pentagon identities', discovered in the reconstruction programme of [P. A. Höhn, Quantum 1, 38 (2017), P. A. Höhn and C. S. P. Wever, Phys. Rev. A 95, 012102 (2017)], where they characterise the space of pure states, as well as the unitary group, and are interpreted as complementarity equalities in the Brukner-Zeilinger information measure. The generalisation to arbitrarily many qubits is nontrivial as it requires new tools which in turn reveal novel structural properties that a
