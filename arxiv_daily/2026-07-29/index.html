re absent in the two-qubit case. A thorough analysis of these properties, and their relation with mutual unbiasedness and complementarity in the n-qubit Pauli group, can be found in two companion papers.", "url": "https://arxiv.org/abs/2607.24987", "type": "理论", "summary": "1. 该工作提出一族Pauli期望值二次型，证明其为所有n-qubit纯态的状态无关不变量。\n2. 其卖点在于非平凡推广二-qubit五边形恒等式至任意多qubit，揭示互无偏基与互补性新结构。\n3. 这为n-qubit纯态空间及酉群表征提供了代数封闭的不变量框架与信息论启示。", "summary_source": "deepseek", "authors": [{"name": "Markus Frembs"}, {"name": "Giovanni Natale"}, {"name": "Christopher S.P. Wever"}, {"name": "Philipp A. Hoehn"}], "featured_authors": [{"name": "Markus Frembs"}, {"name": "Giovanni Natale"}, {"name": "Christopher S.P. Wever"}, {"name": "Philipp A. Hoehn"}], "author_count": 4}, {"id": "2607.24988", "category": "quant-ph", "title": "Maximal complementarity in the n-qubit Pauli group", "abstract": "Observables in quantum mechanics are generally complementary, that is, they reveal mutually incompatible pieces of information about a given system. This property is not only a fundamental tenet of the quantum formalism, but also a key component in quantum cryptographic protocols. As such it has fuelled much research into finding sets of highly complementary observables. In its strongest form -- the one we consider in this work -- the information between complementary observables is not merely incompatible but mutually exclusive: maximal information about one observable implies no information about the other, and vice versa. Maximal sets of non-degenerate complementary observables are known to exist in systems of prime power dimension such as n-qubit systems. Here, we study complementarity of degenerate observables, specifically we prove that observables associated with the n-qubit Pauli group also exhibit complementarity under this restriction: first, we obtain a criterion for two such observables to be complementary and, second, we relate maximal sets of complementary observables with informational pure state complementarity equalities, further studied in two companion papers. Equivalently, these results can be formulated in terms of maximal complementary sets of (not necessarily maximal) Abelian subgroups of the Pauli group linking with (possibly coarse-grained) mutually unbiased bases. Finally, we prove that these complementarity sets entail strong entropic uncertainty relations.", "url": "https://arxiv.org/abs/2607.24988", "type": "理论", "summary": "1. 该工作研究了n-qubit Pauli群中简并可观测量的互补性，证明了最大互补集合的存在性并给出了判据。\n2. 其卖点在于将简并互补可观测量集与信息纯态互补等式及互无偏基相联系，获得了等价表述。\n3. 这为理解强熵不确定关系提供了全新视角，并可能推动量子密码协议的设计与优化。", "summary_source": "deepseek", "authors": [{"name": "Markus Frembs"}, {"name": "Giovanni Natale"}, {"name": "Christopher S.P. Wever"}, {"name": "Philipp A. Hoehn"}], "featured_authors": [{"name": "Markus Frembs"}, {"name": "Giovanni Natale"}, {"name": "Christopher S.P. Wever"}, {"name": "Philipp A. Hoehn"}], "author_count": 4}, {"id": "2607.25005", "category": "quant-ph", "title": "Invariant-based master equation applied to driven qutrit coupled to a bath and a leaky cavity", "abstract": "We employ a generalized approach to the master equation for driven open $N$-level ($N>2$) quantum systems using Lewis-Riesenfeld invariants, which avoids the driving-strength restrictions inherent to conventional approaches. We show that the invariant-based master equation provides a unifying generalized framework, which reduces to the frequently employed laboratory-frame master equations and the less frequently employed rotating-frame master equation framework under appropriate simplifications. Extending the prototypical two-level system, we show that the inclusion of another state coupled to the ground state via reservoir-induced dephasing gives rise to qualitatively new dissipative behaviors that are, in general, not captured by standard approximations. We also apply the invariant-based master equation framework to a driven quantum dot coupled to a leaky cavity, demonstrating the framework's ability to capture relevant dissipative dynamics without additional assumptions. Our work paves the way for quantum-control applications in the presence of dissipation.", "url": "https://arxiv.org/abs/2607.25005", "type": "理论", "summary": "1. 该工作基于Lewis-Riesenfeld不变量将主方程推广至驱动开放N能级系统，并应用于与热浴和泄漏腔耦合的qutrit体系。\n2. 其技术核心在于避免常规方法对驱动强度的限制，统一实验室框架与旋转框架主方程，并揭示能级间浴诱导退相干导致的标准近似无法捕获的新耗散行为。\n3. 这为存在耗散的多能级量子系统提供了精确描述动力学与实现高保真度量子控制的通用理论框架。", "summary_source": "deepseek", "authors": [{"name": "Sagarika Basak"}, {"name": "A. Javadi"}, {"name": "D. Blume"}], "featured_authors": [{"name": "Sagarika Basak"}, {"name": "A. Javadi"}, {"name": "D. Blume"}], "author_count": 3}, {"id": "2607.25170", "category": "quant-ph", "title": "QUBO-Based Optimization of Social Indicator Configurations for Working-Age Population Growth", "abstract": "The decline of the working-age population is a major challenge for regional sustainability, particularly in ageing societies such as Japan. We present a methodological demonstration of a quadratic unconstrained binary optimization (QUBO)-based framework for exploring social-indicator configurations associated with working-age population growth. Using Japanese municipal data, we regressed the 2010-2020 working-age population growth rate on ten discretized social indicators. The resulting quadratic surrogate model showed reasonable predictive performance, with a test-set correlation coefficient of 0.84 and an average R-squared value of 0.76. Its coefficient matrix provides an interpretable representation of individual indicator-level contributions and pairwise associations. We converted the fitted model into a QUBO formulation with one-hot constraints and optimized it using quantum annealing, simulated annealing, and Gurobi. All three methods identified the same optimal feasible configuration, while the annealing-based samplers also generated feasible suboptimal configurations with different predicted growth rates. Municipality-level single-indicator analyses showed that changing one indicator can increase or decrease the predicted growth rate depending on the other indicators. The framework provides an interpretable and optimization-ready approach for connecting municipal social statistics, nonlinear interactions, and model-based scenario generation. It should be regarded as an exploratory tool for policy discussion rather than as a causal estimate of policy interventions.", "url": "https://arxiv.org/abs/2607.25170", "type": "理论+数值", "summary": "1. 该工作提出了一个基于二次无约束二元优化（QUBO）的框架，将社会指标离散化回归代理模型转化为可优化形式，用于探索与劳动年龄人口增长相关的配置组合。\n2. 其技术卖点在于利用量子退火、模拟退火及Gurobi求解器，在毫秒至秒级时间内获得一致的最优配置，并通过系数矩阵可解释地揭示指标间的非线性相互作用及单指标效应对全局的依赖性。\n3. 这为连接区域统计、非线性交互与场景生成的探索性政策讨论提供了模型驱动工具，但应明确其作为相关性分析方法而非因果推断的定位。", "summary_source": "deepseek", "authors": [{"name": "Hayate Wada"}, {"name": "Seiya Miyamoto"}, {"name": "Tatsumasa Ogawa"}, {"name": "Kazuki Uehara"}, {"name": "Masaru Hitomi"}, {"name": "Masayuki Ohzeki"}], "featured_authors": [{"name": "Hayate Wada"}, {"name": "Seiya Miyamoto"}, {"name": "Tatsumasa Ogawa"}, {"name": "Kazuki Uehara"}, {"name": "Masaru Hitomi"}, {"name": "Masayuki Ohzeki"}], "author_count": 6}, {"id": "2607.25307", "category": "quant-ph", "title": "Actualization, Records, and the Emergence of Entropic Time", "abstract": "We develop a record-based account of internal time in quantum mechanics, where the formation of a stable record is represented as conditioning on actualized information, and along a history the accumulated record algebras are ordered by inclusion. If the duration of a realized outcome depends only on its conditional Born probability, composes additively under sequential conditioning, and is continuous and calibrated, then the actualization of each outcome contributes an internal duration equal to its surprisal, the negative logarithm of that probability, so that a certain outcome contributes no duration, whereas less likely outcomes contribute larger increments. The ensemble mean of the accumulated clock is the Shannon entropy of the record process, its moment-generating function is fixed by the Rényi entropy spectrum, and the realized clock admits a Doob decomposition into a predictable entropic compensator and a martingale of clock fluctuations, so that each increment is the information gain of the corresponding actualization. Records are characterized by graded criteria of distinguishability, decoherence, and stability. We also clarify the multiple-clock problem: in one fixed context, additivity of two surprisal clocks is equivalent to factorization of the Born distribution in that context, whereas for a pure bipartite state, additivity in every pair of local contexts is equivalent to rank-one factorization of the joint state and to the vanishing of all its $2\\times2$ minors.", "url": "https://arxiv.org/abs/2607.25307", "type": "理论", "summary": "1. 该工作基于记录代数与条件概率，建立了量子力学中内部时间的涌现理论，将实现结果的持续时间定义为其惊异度。\n2. 核心在于完成了实现时钟的Doob分解，将其分解为可预测的熵补偿器与波动鞅，并揭示了可加性等价于Born分布因子化的条件。\n3. 这为理解量子时间方向性、多时钟一致性与纠缠结构提供了形式化工具，并启发了量子信息理论中的熵时间计量方案。", "summary_source": "deepseek", "authors": [{"name": "Lionel Martellini"}], "featured_authors": [{"name": "Lionel Martellini"}], "author_count": 1}, {"id": "2607.25331", "category": "quant-ph", "title": "Entanglement-based quantum key distribution with data in hollow-core fiber", "abstract": "The coexistence of quantum information and classical signals in a single fiber is essential for future quantum networks that leverage the well-established optical fiber infrastructure. Although multiplexing technologies can separate quantum and classical signals, pure silica core fibers (PSCFs) remain fundamentally limited by the high nonlinearity, which generates substantial Raman scattering and four-wave mixing noise. Hollow-core fibers (HCFs), guiding light predominantly in air, offer an attractive solution with intrinsically ultra-low nonlinearity and strongly suppressed nonlinear noise. In this work, we demonstrate the entanglement-based key coexisting with data over an 18-km HCF link. We achieve time-encoded high-dimensional quantum key distribution (HD-QKD) carrying 0 dBm of bidirectional received power, corresponding to a theoretical data capacity of up to 2.3 Tbps. During 24 hours of continuous operation, an average secret key rate (SKR) of 10.56 kbps is obtained. Theoretical analysis further predicts SKRs above 135 kbps over transmission distances exceeding 200 km using state-of-the-art low-loss HCFs. These results show significantly improved performance compared with PSCF-based systems and highlight the potential of HCFs for scalable quantum-classical coexistence compatible with the architectures of established fiber-optic networks.", "url": "https://arxiv.org/abs/2607.25331", "type": "理论", "summary": "1. 该工作实现了基于纠缠的时间编码高维量子密钥分发与双向经典数据在18公里空芯光纤链路中共存。\n2. 其核心卖点在于利用空芯光纤的极低非线性，抑制了拉曼散射与四波混频噪声，使得经典接收功率达0 dBm（对应理论数据容量2.3 Tbps）时仍获得10.56 kbps平均密钥率。\n3. 理论分析表明，采用低损耗空芯光纤可将密钥率提升至135 kbps以上并延长传输距离逾200公里，为基于现有光纤基础设施的可扩展量子-经典共存网络提供了清晰路径。", "summary_source": "deepseek", "authors": [{"name": "Yue Luo"}, {"name": "Sheng Liu"}, {"name": "Yun-Ru Fan"}, {"name": "Da-Wei Ge"}, {"name": "Zhi-Yang Liu"}, {"name": "Hao Li"}, {"name": "Si Shen"}, {"name": "Zi-Chang Zhang"}, {"name": "Hai-Zhi Song"}, {"name": "Li-Xing You"}, {"name": "Tao Zhou"}, {"name": "Kai Guo"}, {"name": "Guang-Can Guo"}, {"name": "Qiang Zhou"}], "featured_authors": [{"name": "Yue Luo"}, {"name": "Sheng Liu"}, {"name": "Yun-Ru Fan"}, {"name": "Kai Guo"}, {"name": "Guang-Can Guo"}, {"name": "Qiang Zhou"}], "author_count": 14}, {"id": "2607.25345", "category": "quant-ph", "title": "Detecting quantum phase transitions via shallow variational quantum circuits", "abstract": "Mapping quantum phase diagrams through classical simulation is notoriously resource-intensive, as even small systems far from the thermodynamic limit demand prohibitive computational effort. The variational quantum eigensolver (VQE) offers a compelling alternative, exploiting approximate ground states to distinguish phases. An appealing proposal, dubbed as Delta-VQE, determines critical points by contrasting variational energies optimized from reference states of distinct phases. Intriguingly, the diagnostic sharpens as circuit depth decreases, highlighting its promise as a resource-conscious probe of quantum criticality. To probe the broader applicability and underlying mechanisms of this approach, we investigate the one-dimensional transverse-field Ising model with a three-spin cluster interaction, a setting in which the Ising transitions are generally situated beyond the self-dual line. We demonstrate that, whenever dual ansätze are employed, Delta-VQE invariably detects the self-dual points rather than the true criticality. In contrast, when ansätze are carefully tailored to embody the competing phases across the boundary, the genuine Ising critical point can be successfully identified with only minor finite-size effects. Our results establish that, while Delta-VQE provides a resource-efficient probe of quantum criticality without requiring precise ground-state preparation, its diagnostic power is fundamentally contingent upon the judicious selection of physically representative ansätze.", "url": "https://arxiv.org/abs/2607.25345", "type": "理论+数值", "summary": "1. 该工作通过浅层变分量子电路（Delta-VQE）检测一维横场Ising模型中的量子相变，并对比双参考态优化能量以确定临界点。\n2. 其卖点在于揭示电路深度降低反而增强诊断锐度和自对偶点干扰的权衡，以及恰当选择代表竞争相态的双重ansätze可准确识别真实Ising临界点。\n3. 这不仅阐明了变分量子本征求解器在资源受限下探测量子临界性的适用条件，更强调了物理代表性ansätze对诊断能力的根本性限制。", "summary_source": "deepseek", "authors": [{"name": "Ching-Yu Huang"}, {"name": "Min-Fong Yang"}], "featured_authors": [{"name": "Ching-Yu Huang"}, {"name": "Min-Fong Yang"}], "author_count": 2}, {"id": "2607.25427", "category": "quant-ph", "title": "A General First- and Second-Order Numerical Solver for Non-Markovian Quantum State Diffusion", "abstract": "The numerical simulation of non-Markovian open quantum systems based on the non-Markovian quantum state diffusion (NMQSD) equation is complicated by functional derivatives with respect to the stochastic process. A general numerical framework that directly treats these functional derivatives without relying on prescribed decompositions of the bath correlation function is still lacking. In this work, we derive an analytical solution of the linear NMQSD equation that reveals three elementary structures of the non-Markovian stochastic dynamics: stochastic propagation, functional-derivative insertion, and memory pairing. Based on this structure, we construct a general auxiliary-state framework for arbitrary bath correlation functions. The framework separates the numerical construction into time discretization, memory quadrature, and hierarchy truncation. We then construct first- and second-order schemes and provide diagrammatic transition rules for their explicit implementation. Numerical results verify the expected temporal accuracy and demonstrate the applicability of the proposed methods to different bath correlation functions and multi-level quantum systems.", "url": "https://arxiv.org/abs/2607.25427", "type": "理论+数值", "summary": "1. 该工作基于线性非马尔可夫量子态扩散方程解析解揭示的随机传播、泛函导数插入与记忆配对三种基本结构，构建了适用于任意浴关联函数的通用一阶与二阶数值求解框架。\n2. 其核心卖点在于将数值构造分离为时间离散化、记忆求积与层级截断，并给出图解转换规则直接实现，从而完全避免了对浴关联函数进行预设分解的传统限制。\n3. 该框架经数值验证适用于多能级系统与多种浴关联函数且达到预期精度，为非马尔可夫开放量子系统的可扩展高效模拟提供了统一的方法论基础与物理启发。", "summary_source": "deepseek", "authors": [{"name": "Zhenning Cai"}, {"name": "Quanhui Zhu"}], "featured_authors": [{"name": "Zhenning Cai"}, {"name": "Quanhui Zhu"}], "author_count": 2}, {"id": "2607.25561", "category": "quant-ph", "title": "Interaction-Endowed PT-Symmetry and its Effects on Decoherence, Einselection, and Non-Markovianity in a Central Spin Model", "abstract": "We have introduced PT-symmetry to a central spin model by adding a PT-symmetric interaction with a tunable hermiticity parameter $\\gamma$. Using the pseudo-Hermitian formalism, we applied a Dyson map to transform the non-Hermitian Hamiltonian to its Hermitian representation. We have found that the decoherence slows down as $\\gamma$ increases, eventually ceasing at $\\gamma=1$. We define a pseudo-Hermitian observable that commutes with the metric operator to add as the self-Hamiltonian. Einselection gradually forced the system to select the eigenstates of the self-Hamiltonian as $\\gamma\\rightarrow1$. The steady-state purity of the central spin states in the strong environment regime exhibits a paradoxical decrease as $\\gamma$ increases. However, a turning point (minimum) corresponding to a maximum information dissipation to the spin bath is found. Finally, the Breuer-Laine-Piilo (BLP) measure, which is used to quantify the non-Markovianity of a quantum system, was evaluated for a finite time. The BLP measure in the strong environment regime exhibited similar turning point behavior, which means that the information backflow reaches a saturation point before declining. This decline signifies the point where PT-symmetry starts shielding the central spin from the environment.", "url": "https://arxiv.org/abs/2607.25561", "type": "理论+数值", "summary": "1. 该工作通过引入带可调厄米性参数γ的PT对称相互作用，将PT对称性拓展至中心自旋模型，并研究了其对退相干、表象选择及非马尔可夫性的影响。\n2. 其技术核心在于运用伪厄米形式论与Dyson映射将非厄米哈密顿量变换至厄米表象，并定义了与度规算符对易的伪厄米可观测量作为自哈密顿量，从而揭示退相干随γ增大而减缓至停止的机制。\n3. 这为利用PT对称性调控量子系统与环境的信息流动（如抑制退相干或调控非马尔可夫性饱和点）提供了明确途径，尤其对量子信息保护与开放量子系统控制具有启发意义。", "summary_source": "deepseek", "authors": [{"name": "Leoj Phoebe M. Esquierdo"}, {"name": "Lemuel John F. Sese"}, {"name": "Rayda P. Gammag"}], "featured_authors": [{"name": "Leoj Phoebe M. Esquierdo"}, {"name": "Lemuel John F. Sese"}, {"name": "Rayda P. Gammag"}], "author_count": 3}, {"id": "2607.25661", "category": "quant-ph", "title": "Discrete power-law decay of subsystem distance after a quantum quench", "abstract": "We present a numerical study of subsystem distance decay following a global quantum quench in the infinite one-dimensional transverse-field Ising chain, using the mathematically rigorous Bures distance $B_A(t)$ to quantify the deviation of the time-evolved reduced density matrix from its stationary generalized Gibbs ensemble state. We show that the late-time decay follows a discrete power law $B_A(t) \\sim t^{-\\lambda}$, with the exponent $\\lambda$ confined to discrete values: $1$, $5/4$, $3/2$, $7/4$, $2$, $5/2$, and potentially further values. The specific exponent is jointly determined by the pre- and post-quench transverse fields, as well as by properties of the symmetric excitation-fraction function $m_S(\\varphi)$, defined on $\\varphi\\in[0,\\pi]$ to characterize the pre-quench Hamiltonian eigenstates, including continuity, boundary values, and first-derivative boundary values, among others. The previously established $t^{-3/2}$ decay for the initial ground state of the pre-quench Hamiltonian is naturally recovered as a special case of this general classification. Our results reveal a universal discrete structure governing local equilibration dynamics in integrable quantum systems.", "url": "https://arxiv.org/abs/2607.25661", "type": "理论+数值", "summary": "1. 该工作数值研究了一维无限横场伊辛链全局量子淬火后子系统Bures距离的衰减，发现其遵循离散幂律$t^{-\\lambda}$。\n2. 核心发现在于衰减指数$\\lambda$仅取$1$、$5/4$、$3/2$、$7/4$、$2$、$5/2$等离散值，且由淬火前后横场及描述初态本征态的对称激发分数函数的连续性、边界值与一阶导数边界值联合决定。\n3. 这揭示可积系统局域平衡化动力学具有普适离散结构，并为非平衡量子多体动力学后期行为提供了精确分类框架。", "summary_source": "deepseek", "authors": [{"name": "Bin Sui"}, {"name": "Jiaju Zhang"}], "featured_authors": [{"name": "Bin Sui"}, {"name": "Jiaju Zhang"}], "author_count": 2}, {"id": "2607.25684", "category": "quant-ph", "title": "Landau Levels on the Surface of a Cube", "abstract": "We study the quantum mechanics of a charged particle confined to the surface of a cube enclosing a magnetic monopole. The magnetic field is chosen to have a constant magnitude on each face and to point along the outward normal, preserving the rotational symmetry of the cube. We formulate the continuum problem using two gauge patches on the cube surface and show that consistency of the wavefunction gives the Dirac quantization condition. Since an explicit vector potential does not remain invariant under ordinary rotations, we construct gauge-modified rotation operators and use them to classify the eigenstates. Even monopole charges are described by the irreducible representations of the cubic rotation group O, while odd monopole charges require the spinorial representations of the binary octahedral group 2O. We compute the spectrum with a gauge-covariant finite-difference discretization and find Landau-level-like manifolds whose degeneracies are split by the discrete cubic symmetry. We also study the corresponding tight-binding Hofstadter problem on the discretized cube. The resulting spectrum contains the usual magnetic subband structure together with additional gap states localized near the cube corners.", "url": "https://arxiv.org/abs/2607.25684", "type": "理论", "summary": "1. 该文在立方体表面构造磁单极子场中的连续与离散紧束缚模型，研究带电粒子的量子力学。\n2. 其卖点在于通过规范修正旋转算符分类，揭示偶奇单极子电荷分别对应不同群表示，离散化后朗道能级简并被立方对称性劈裂并出现角局域态。\n3. 这为在具有离散对称性的弯曲曲面上实现新奇量子霍尔效应及拓扑态提供了可精确求解的范例。", "summary_source": "deepseek", "authors": [{"name": "Almila Kura"}, {"name": "Bayram Tekin"}, {"name": "Mehmet Özgür Oktel"}], "featured_authors": [{"name": "Almila Kura"}, {"name": "Bayram Tekin"}, {"name": "Mehmet Özgür Oktel"}], "author_count": 3}, {"id": "2607.25704", "category": "quant-ph", "title": "Verifiable blind probabilistic error cancellation", "abstract": "Quantum error mitigation (QEM) is an essential tool for mitigating hardware noise without incurring space overhead. Yet, its reliability depends on modeling, calibration, and implementation, leaving end-to-end security on untrusted quantum hardware unresolved. We address this problem by introducing verifiable blind probabilistic error cancellation (VBPEC), the first secure verification protocol against a fully malicious adversary that integrates QEM. VBPEC brings probabilistic error cancellation (PEC), a widely studied QEM technique, within the scope of composable security by formalizing delegated mitigation as a cryptographic resource in the abstract cryptography framework. The protocol performs PEC with perfect blindness and an exponentially small security error. VBPEC retains the absence of quantum-space overhead from recent statistically-secure verified quantum computation protocols and from PEC. The only overhead takes the form of additional repetitions due to the QEM procedure. To achieve this, we extend trap-based verification from deterministic pass/fail checks to statistical tests that benefit from QEM and develop a new proof technique that integrates the corresponding additional deviation sources. Rather than merely tolerating honest noise below a fixed threshold, VBPEC actively cancels it, enabling correctly mitigated estimates to be accepted with high probability without compromising security. Our framework thus establishes an essential route towards secure, reliable, and practical delegated quantum computation on near-future quantum hardware: VBPEC fundamentally improves the practicality of verification.", "url": "https://arxiv.org/abs/2607.25704", "type": "理论+数值", "summary": "1. 该工作提出了可验证盲化概率误差抵消协议，首次将量子误差缓解整合进针对完全恶意对手的可组合安全验证框架。\n2. 其卖点在于通过抽象密码学形式化与统计陷阱检验，实现完美盲化与指数小安全错误，并主动抵消噪声而非仅设定容忍阈值。\n3. 这为近未来量子硬件上安全且实用的委托量子计算建立了关键路线，大幅提升了验证方案的现实可行性。", "summary_source": "deepseek", "authors": [{"name": "Bo Yang"}, {"name": "Elham Kashefi"}, {"name": "Harold Ollivier"}], "featured_authors": [{"name": "Bo Yang"}, {"name": "Elham Kashefi"}, {"name": "Harold Ollivier"}], "author_count": 3}, {"id": "2607.25746", "category": "quant-ph", "title": "Classically Augmented Zero-Noise Extrapolation", "abstract": "We investigate a hybrid quantum-classical approach to quantum error mitigation. We propose Classically Augmented Zero-Noise Extrapolation, a hybrid error-mitigation method in which high-noise Richardson extrapolation nodes are replaced by classically simulated estimates. These classical nodes have negligible sampling variance but introduce deterministic simulation bias. We derive the resulting variance reduction under optimal shot allocation and show that, for linear node spacings and fixed index cutoff, the coefficient-level reduction can be exponential. We validate the prediction numerically using Pauli-propagation simulations and demonstrate a reduction in mean-squared error when the truncation bias is sufficiently small.", "url": "https://arxiv.org/abs/2607.25746", "type": "数值", "summary": "1. 该工作提出经典增强零噪声外推，一种混合量子-经典错误缓解方法，用经典模拟估计替代高噪声Richardson外推节点。\n2. 其卖点在于推导出最优采样分配下的方差减少，在线性节点间距下实现系数级指数抑制，同时仅引入可控的确定性模拟偏差。\n3. 这为在经典模拟偏差足够小的场景下，利用经典资源指数级降低量子错误缓解的采样开销提供了实用路径。", "summary_source": "deepseek", "authors": [{"name": "Timon Scheiber"}], "featured_authors": [{"name": "Timon Scheiber"}], "author_count": 1}, {"id": "2607.25779", "category": "quant-ph", "title": "Exponential de Finetti Theorems for Fermionic Gaussian States", "abstract": "We prove an exponential variant of the Gaussian de Finetti theorem: the subsystems of permutation-invariant, free-fermionic Gaussian states are well-approximated by convex combinations of almost-i.i.d. states that are Gaussian on subsets of their parts. Our result provides an error bound between the original state and its approximants that decays exponentially in the number of unconstrained parts, becoming super-exponential when the subsystem under consideration is small. The dimensional penalty of our bound is polylogarithmic in the local Hilbert space dimension, an exponential improvement over the standard de Finetti theorem of [Nat. Phys. 3, 645-649]. In the fully i.i.d. limit, our bound recovers the Gaussian de Finetti theorem of [ arXiv:2603.12392 ]. Previous works considered Gaussian-symmetric states, which are supported on the trivial irrep of the tensor matchgate representation. We extend these to a broader class of Gaussian-invariant states containing, for example, i.i.d. copies of single-replica mixed Gaussian states. We show that Gaussian-invariant states are precisely the partial traces of Gaussian-symmetric states on locally enlarged replicas, and always admit a purification into a larger Gaussian-symmetric state. This extends de Finetti theorems to the full set of Gaussian-invariant states, with only a polynomial overhead in the dimensional penalty of the error bound.", "url": "https://arxiv.org/abs/2607.25779", "type": "理论", "summary": "1. 该工作证明了排列不变的费米子高斯态子系统可由几乎独立同分布的部分高斯态的凸组合以指数收敛误差近似。\n2. 其技术核心是误差界对未约束部分数量呈指数衰减、对局域希尔伯特空间维度仅含多对数惩罚，并将定理从高斯对称态推广至涵盖单副本混合高斯态的高斯不变态。\n3. 这为多体费米子系统的态近似和量子信息理论提供了显著改进的误差控制，并展示了高斯对称态与不变态间的纯化结构。", "summary_source": "deepseek", "authors": [{"name": "Jędrzej Burkat"}, {"name": "Michał Studziński"}, {"name": "Sergii Strelchuk"}], "featured_authors": [{"name": "Jędrzej Burkat"}, {"name": "Michał Studziński"}, {"name": "Sergii Strelchuk"}], "author_count": 3}, {"id": "2607.25812", "category": "quant-ph", "title": "Optimal Quantum Eigenvalue Transformation via Linear Combinations of Hermitian Matrices", "abstract": "We discover two complementary linear-combination-of-Hermitian-matrices (LCHM) formulations to achieve a general non-normal matrix eigenvalue transformation $g(A)$. Firstly, for $A=L+\\mathrm{i} H$ with Hermitian $L$ and $H$, the vanilla LCHM formula represents $g(A)$ as a kernel integral of $g(\\mathrm{i}(H+kL))$, and it contains linear-combination-of-Hamiltonian-simulation (LCHS) [An, Liu, Lin, Phys. Rev. Lett. 2023] as the special case for matrix exponentials. Secondly, for the angular Hermitian $X_\\theta = \\cos\\theta L+\\sin\\theta H$, the Weyl LCHM formula expresses $g(A)$ via integrating $g(\\mathrm{e}^{\\mathrm{i}\\theta} (X_\\theta\\pm\\mathrm{i}(I-X_\\theta^2)^{1/2}))$. For the matrix power $g(A)=A^m$, the Fourier projection of Weyl LCHM gives \\[ A^m=\\frac{2}{\\pi}\\int_0^\\pi \\text{e}^{\\text{i} m\\theta}T_m(X_\\theta) \\text{d}\\theta = \\frac{2}{N}\\sum_{j=0}^{N-1} \\text{e}^{\\text{i} m\\theta_j}T_m(X_{\\theta_j}),\\quad\\theta_j=\\frac{\\pi j}{N},\\quad \\text{for every } N>m \\] with Chebyshev polynomial of Hermitian $T_m(X_\\theta)$ and $N$ samples. The discrete formula is exact, introduces no truncation and angular quadrature error, and offers $\\mathcal{O}(1)$ post-selection weights. LCHM formulas lead to new quantum eigenvalue transformation (QET) algorithms. For a degree-$d$ polynomial $p_d(A)$ on $|\\psi\\rangle$, our QET algorithm can achieve optimal $\\Theta(d)$ circuit depth and optimal $\\mathcal{O}(||p_d||_{\\infty}/||p_d(A)|\\psi\\rangle||)$ post-selection repetitions. LCHM-based QETs unify various quantum linear algebraic problems with near-optimal $\\mathcal{\\widetilde O}(d\\log(d/\\epsilon))$ Clifford$+T$ gates, including driven ODEs (reduced to standard LCHS), iterative methods, resolvents, $\\log(I+A)$, $(\\lambda I+A)^\\nu$, Sign and ReLU transforms, and Faber approximation on noncircular domains.", "url": "https://arxiv.org/abs/2607.25812", "type": "理论+数值", "summary": "1. 该工作提出了两种互补的厄米矩阵线性组合（LCHM）公式，实现一般非正规矩阵解析函数g(A)的量子特征值变换。\n2. 核心卖点在于离散公式精确无截断和角度求积误差，并给出O(1)后选择权重，对d次多项式达到最优Θ(d)电路深度。\n3. 由此统一的量子线性代数算法族（包括驱动ODE、迭代法、符号函数等）实现近最优Ĩ(d log(d/ε)) Clifford+T门复杂度，为量子数值计算提供高效框架。", "summary_source": "deepseek", "authors": [{"name": "Yanqiao Wang"}, {"name": "Yixuan Liang"}, {"name": "Hongjia Chen"}, {"name": "Jin-Peng Liu"}], "featured_authors": [{"name": "Yanqiao Wang"}, {"name": "Yixuan Liang"}, {"name": "Hongjia Chen"}, {"name": "Jin-Peng Liu"}], "author_count": 4}, {"id": "2607.25865", "category": "quant-ph", "title": "OmniQEC: discovering practical quantum error-correcting codes by an AI scientist", "abstract": "Quantum error correction (QEC) is indispensable for scalable fault-tolerant quantum computing. However, discovering QEC codes that remain effective is challenging, as logical performance depends on the interplay between code structure, hardware, syndrome extraction, and decoding, which often impose competing requirements. Here we introduce OmniQEC, an efficient AI scientist for discovering QEC codes suited to deployment on modern quantum processors. OmniQEC formulates QEC design as an iterative discovery process in which an orchestrator, implemented by advanced large language models (LLMs), coordinates code generation, code-level screening, syndrome-extraction synthesis, and decoder-based circuit evaluation. At its core, OmniQEC combines a self-evolving reasoning mechanism with a slow--fast synergistic workflow: a fast loop explores candidates using inexpensive code-level proxies, whereas a slow loop performs physically grounded circuit-level evaluation and feeds the resulting evidence back into the search. We evaluate OmniQEC across four qLDPC construction families, three LLM backends, and $14$ total-physical-qubit budgets per backend. The discovered codes show steadily improving logical-error suppression with increasing physical-qubit budgets and outperform the BB codes with $[\\![72,12,6]\\!]$ and $[\\![144,12,12]\\!]$ under complete-implementation budgets of 98 and 240 physical qubits, respectively. The discovered codes are hardware-friendly and may be of independent interest for practical QEC implementation. These findings pave the way towards LLM-assisted QEC discovery grounded in physically informed code--circuit--decoder co-design.", "url": "https://arxiv.org/abs/2607.25865", "type": "理论+数值", "summary": "1. 该工作提出OmniQEC，一种由大语言模型驱动的AI科学家，用于发现适配现代量子处理器的高效量子纠错码。\n2. 其技术核心在于结合自演化推理与慢-快协同工作流：快速循环通过廉价代码级代理筛选候选，慢速循环执行物理电路级评估并反馈证据。\n3. 这为基于物理信息的码-电路-解码器协同设计开辟了LLM辅助的实用量子纠错码发现路径。", "summary_source": "deepseek", "authors": [{"name": "Ge Yan"}, {"name": "Shanchuan Li"}, {"name": "Pengyue Ma"}, {"name": "Qixin Zhang"}, {"name": "Pingchuan Ma"}, {"name": "Jianping Wang"}, {"name": "Min-Hsiu Hsieh"}, {"name": "Yuxuan Du"}], "featured_authors": [{"name": "Ge Yan"}, {"name": "Shanchuan Li"}, {"name": "Pengyue Ma"}, {"name": "Jianping Wang"}, {"name": "Min-Hsiu Hsieh"}, {"name": "Yuxuan Du"}], "author_count": 8}, {"id": "2607.25899", "category": "quant-ph", "title": "Consistent Quantum States over Spacetime without a Common Quantum Process", "abstract": "Determining whether multiple record-conditioned quantum descriptions admit a single underlying process is a central consistency problem for quantum states over spacetime (QSOSTs) and relational quantum descriptions. Yet causally agnostic interferometry accesses only a lower-dimensional QSOST projection, which inevitably leaves some process degrees of freedom unresolved. We combine branch-resolved QSOST interferometry with positive-process lifting and semidefinite convex duality to characterize this gluing problem. We prove that every positive-weight QSOST branch has a unique least positive lift and reduce both settingwise and common-process realizability to deterministic-process domination. Using this criterion, we construct a minimal bipartite-qubit example with two record settings and two outcomes in the definite causal order $A\\prec B$: each setting is separately realizable, and both share the same complete unconditional QSOST, yet no single deterministic process realizes them jointly. The separation has the exact visibility threshold $\\eta =1/\\sqrt{2}$ , admits a sparse witness involving eight interferometric quadratures, and persists for full-rank processes. These results establish an operational boundary between QSOST consistency and global process consistency, and provide a practical framework for testing whether multiple quantum perspectives can share one standard-quantum process.", "url": "https://arxiv.org/abs/2607.25899", "type": "理论+数值", "summary": "1. 该工作结合分支分辨干涉测量、正过程提升与半定凸对偶，刻画了多个记录条件量子描述共享单一底层过程的粘合问题。\n2. 核心在于证明每个正权量子时空态分支有唯一最小正提升，并构造二比特两设置确定序A≺B例子：各设置分别可实现且共享完整无条件态，但无确定性过程联合实现，可见度阈值精确为1/√2。\n3. 这建立了量子时空态一致性与全局过程一致性间的操作边界，为实验检验多量子视角能否共享同一标准过程提供了确定性过程支配判据。", "summary_source": "deepseek", "authors": [{"name": "Jianqi Sheng"}], "featured_authors": [{"name": "Jianqi Sheng"}], "author_count": 1}, {"id": "2607.25954", "category": "quant-ph", "title": "Equi-Entropic Maps for Four-Partite Quantum States", "abstract": "Absolutely maximally entangled states represent a highly constrained form of multipartite entanglement and play an important role in quantum information theory. We investigate a weaker form of uniformity of entanglement for four-party systems of local dimension $d>2$ that requires the three balanced bipartitions to have equal but not necessarily maximal linear entropy. We introduce a linear map $\\Xi$ that enforces exact equality of entropies under reshuffling and partial transposition. The transformation arises as the asymptotic limit of an iterative averaging procedure and admits a group-theoretic description in terms of permutations of tensor indices. For Haar-random unitary inputs, a leading-moment analysis supported by numerical simulations predicts highly entangled outputs whose common entropy approaches the maximal value as the local dimension grows. We characterize the algebraic structure, fixed points, and asymptotic behavior of this map and its relation to two-unitary matrices and orthogonal Latin squares.", "url": "https://arxiv.org/abs/2607.25954", "type": "理论+数值", "summary": "1. 该工作引入线性映射Ξ，强制四部分系统中三个平衡二分划具有相等的线性熵，从而研究弱化的均匀纠缠。\n2. 其卖点在于映射通过重排与部分转置实现熵精确相等，源于迭代平均的渐近极限，并具有置换群论描述。\n3. 这为构造均匀纠缠态提供了代数结构与不动点分析，同时揭示了与大维度下两-幺正矩阵及正交拉丁方的深层联系。", "summary_source": "deepseek", "authors": [{"name": "Wojciech Bruzda"}, {"name": "Zahra Raissi"}], "featured_authors": [{"name": "Wojciech Bruzda"}, {"name": "Zahra Raissi"}], "author_count": 2}, {"id": "2607.26029", "category": "quant-ph", "title": "Path integral approach to the truncated Wigner approximation of driven-dissipative spins", "abstract": "Phase-space approaches such as the truncated Wigner approximation (TWA) provide an efficient semiclassical framework for performing approximate simulations of the dynamics of open quantum many-body systems outside the reach of exact numerical methods but beyond the mean-field level. For bosonic systems, TWA is known to be equivalent to a Keldysh path-integral formulation truncated at second order in the so-called quantum fluctuations. This semiclassical approach provides an alternative transparent route towards approximate stochastic equations of motion, which can be efficiently solved. Here we establish the corresponding path-integral formulation for interacting open spin-$1/2$ systems using the continuous $\\mathrm{SU}(2)$ phase space. We show, in particular, that a consistent treatment of dissipation requires correctly mapping operator products onto the curved spin phase space, leading to stochastic equations that coincide with those obtained from the continuous TWA formulation and thus reproduce the exact dynamics of a single dissipative spin. Our results provide a unified field-theoretic foundation for the TWA to dissipative spin dynamics and offer a systematic starting point for extensions beyond the semiclassical approximation.", "url": "https://arxiv.org/abs/2607.26029", "type": "理论+数值", "summary": "1. 该工作为相互作用的开放自旋1/2系统建立了与截断Wigner近似等价的路径积分公式，基于连续SU(2)相空间描述。\n2. 其主要技术贡献在于通过正确映射算符乘积到弯曲自旋相空间处理耗散，所得随机方程与连续TWA一致并复现单耗散自旋的精确动力学。\n3. 这为统一耗散自旋动力学的半经典场论基础提供了系统框架，并为超越该近似的扩展研究奠定了明确起点。", "summary_source": "deepseek", "authors": [{"name": "Viktoria Noel"}, {"name": "Michael Fleischhauer"}, {"name": "Igor Lesanovsky"}], "featured_authors": [{"name": "Viktoria Noel"}, {"name": "Michael Fleischhauer"}, {"name": "Igor Lesanovsky"}], "author_count": 3}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>${paper.summary_source === "deepseek" ? "DeepSeek three-sentence PRL summary" : (paper.summary_source === "local-fallback" ? "Local three-sentence fallback" : (paper.summary_source === "translation" ? "Chinese abstract translation" : "Chinese placeholder fallback"))}</span><a href="${safeUrl}" target="_blank" rel="noreferrer">Open arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
</body>
