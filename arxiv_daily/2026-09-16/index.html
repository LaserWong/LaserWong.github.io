and quality (e.g., fidelity) of the delivered entanglement, but these quantities, unlike standard routing metrics, compose non-additively. The problem is compounded by link-level configuration choices (e.g., distillation rounds or emitter brightness tuning), each trading rate against fidelity, so that a path's performance depends jointly on its route and its per-link settings. We cast this joint path selection and configuration problem as a shortest path computation on a layered graph whose layers track discretized end-to-end fidelity. A single run returns the full rate fidelity Pareto frontier, from which the path maximizing any nondecreasing utility function of rate and fidelity can be selected. We prove that for certain utility functions (including the secret key rate of BB84), the method is a fully polynomial time approximation scheme, returning a near-optimal path within a specified tolerance. We further characterize exactly when cheaper scalarization-based routing suffices: it is optimal for utility functions with convex fidelity profiles, but can be arbitrarily suboptimal otherwise (e.g., for step-like, sigmoidal utilities), whereas the layered method remains reliable in all cases.", "url": "https://arxiv.org/abs/2609.16198", "type": "理论", "summary": "1. 该工作把量子网络中路径选择与逐链路配置统一为分层图上的最短路径问题，层记录离散化的端到端保真度，以联合优化纠缠分发速率与保真度。\n2. 其卖点在于单次计算即返回完整的速率-保真度帕累托前沿，并证明对BB84密钥率等效用函数为全多项式时间近似方案，同时刻画标量化路由仅对凸保真度效用最优、对阶跃或S形效用可任意次优。\n3. 这为按非降效用选择路径与链路参数提供了可证明可靠的通用方法，并提示后续需针对实际效用形状评估分层方法与更廉价路由策略的适用边界。", "summary_source": "deepseek", "authors": [{"name": "Leonardo Bacciottini"}, {"name": "Subhransu Maji"}, {"name": "Don Towsley"}, {"name": "Gayane Vardoyan"}], "featured_authors": [{"name": "Leonardo Bacciottini"}, {"name": "Subhransu Maji"}, {"name": "Don Towsley"}, {"name": "Gayane Vardoyan"}], "author_count": 4}, {"id": "2609.16200", "category": "quant-ph", "title": "Coupling Structure Determines Communication Regimes in Discrete Quantum Convolutional Channels", "abstract": "We study the recently developed theory of quantum convolution for discrete-variable quantum systems. We classify the discrete quantum convolutional channels generated by an invertible $2\\times2$ coupling matrix and a fixed environmental state according to which entries of the coupling ma- trix vanish. Under role-preserving basis relabelings, matrices with all four entries nonzero form $d-2$ canonical cross-ratio classes, whereas matrices with exactly one vanishing entry split into four inequivalent branches. We determine the optimized one-shot Holevo information and the classical, quantum, and private capacities for all four one-entry-vanishing branches. If a diago- nal entry vanishes, the channel is an entanglement-breaking measure-and-prepare orbit channel: its classical capacity equals a relative entropy coherence of the environmental state, whereas its quantum and private capacities vanish. If an off-diagonal entry vanishes, the channel is a degradable generalized-dephasing channel: one complete orthonormal basis is transmitted without error, whereas the quantum and private capacities are determined by the entropy deficit of the environ-ental state after dephasing in the conjugate basis. Thus, the position of a single vanishing entry selects two qualitatively different communication regimes. When all four entries are nonzero, the channels are irreducibly Weyl covariant, reducing the classical-capacity problem to a regularized minimum-output-entropy problem. For the unique fully nonzero coupling class in the single-qutrit case, we further derive an exact Holevo formula for a depolarized one-parameter family and identify its entanglement-breaking threshold.", "url": "https://arxiv.org/abs/2609.16200", "type": "理论+数值", "summary": "1. 该工作按耦合矩阵零元位置对离散量子卷积信道分类，并计算单次Holevo信息及经典、量子与私密容量。\n2. 其核心是零元位置选择两种通信机制：对角零元为纠缠破坏测量-制备，量子/私密容量为零；非对角零元为可退化广义退相位，一正交基无错传输。\n3. 这确立了耦合结构决定通信机制的原则；全非零Weyl协变约化及单qutrit精确Holevo结果，为后续容量与编码研究提供标定。", "summary_source": "deepseek", "authors": [{"name": "Chunhe Xiong"}], "featured_authors": [{"name": "Chunhe Xiong"}], "author_count": 1}, {"id": "2609.16208", "category": "quant-ph", "title": "Link-middle-cut lower bounds for Clifford circuit synthesis", "abstract": "Minimizing the number of CNOT gates required to synthesize a Clifford operator is a central problem in quantum circuit optimization. We extend the link--middle--cut (LMC) framework for linear reversible circuits to Clifford operators represented by binary symplectic tableaux. By introducing block-support connectivity graphs and determinantal invariants, we obtain efficiently computable lower bounds on ancilla-free CNOT complexity. We prove that these bounds are tight for qubit permutations: a permutation of $n$ qubits with $k$ cycles requires exactly $3(n-k)$ CNOT gates, even when arbitrary one-qubit Clifford gates are available. We also derive efficiently computable bounds for synthesis up to a permutation of the output qubits, corresponding to free qubit relabeling. Finally, we further demonstrate the utility of the bound by using it as an admissible heuristic for $A^*$-based Clifford synthesis and show that, on benchmark instances, the resulting search can prove optimality beyond what was possible with earlier SAT-based methods, and that it may be used in combination with earlier $A^*$ heuristics to improve the CNOT counts obtained through heuristic search.", "url": "https://arxiv.org/abs/2609.16208", "type": "理论+数值", "summary": "1. 该文将线性可逆电路的LMC下界框架推广至二元辛表表示的Clifford算子合成，并给出无辅助CNOT复杂度下界。\n2. 其核心是引入块支撑连通图与行列式不变量，证明n比特k循环置换恰需3(n-k)个CNOT，即使允许任意单比特Clifford门。\n3. 该下界可作为A*搜索的容许启发式，在基准实例上证明早先SAT方法无法证明的最优性，并能与早先启发式结合改善CNOT计数。", "summary_source": "deepseek", "authors": [{"name": "Søren Fuglede Jørgensen"}], "featured_authors": [{"name": "Søren Fuglede Jørgensen"}], "author_count": 1}, {"id": "2609.16226", "category": "quant-ph", "title": "Error-corrected function estimation advantage in multiparameter Hamiltonians", "abstract": "We establish the ultimate precision limits for estimating a function of multiple Hamiltonian parameters in the presence of Markovian noise. By reducing multiparameter function estimation to an optimization over effective single-parameter embeddings, we derive tight bounds on the quantum Fisher information. We identify a necessary and sufficient functional Hamiltonian-not-in-Lindblad-span condition for Heisenberg-limited scaling in time. When this condition holds, we construct a code that simultaneously removes the noise and nuisance Hamiltonian parameters while preserving the target signal. When it fails, we derive the optimal standard quantum-limit coefficient and show that it is asymptotically attainable using approximate quantum error correction. Finally, we demonstrate that direct function estimation can substantially outperform estimating all parameters individually and subsequently evaluating the function. This advantage can scale with both the evolution time and the number of parameters.", "url": "https://arxiv.org/abs/2609.16226", "type": "理论+数值", "summary": "1. 该工作确立了马尔可夫噪声下多参量哈密顿量函数估计的最终精度极限，并将问题化为有效单参量嵌入上的优化以导出量子费舍尔信息紧界。\n2. 其关键在于给出实现海森堡时间标度所需的“哈密顿量不在 Lindblad 张成内”充要条件，并构造同时抑制噪声与冗余参量而保留目标信号的编码。\n3. 条件失效时最优标准量子极限系数可由近似量子纠错渐近达到；直接函数估计显著优于先估计各参量再代入函数，优势随演化时间与参量数增长。", "summary_source": "deepseek", "authors": [{"name": "Erfan Abbasgholinejad"}, {"name": "Lorcán O. Conlon"}, {"name": "Sean R. Muleady"}, {"name": "Jacob Bringewatt"}, {"name": "Ali Fahimniya"}, {"name": "Yu-Xin Wang"}, {"name": "Alexey V. Gorshkov"}], "featured_authors": [{"name": "Erfan Abbasgholinejad"}, {"name": "Lorcán O. Conlon"}, {"name": "Sean R. Muleady"}, {"name": "Ali Fahimniya"}, {"name": "Yu-Xin Wang"}, {"name": "Alexey V. Gorshkov"}], "author_count": 7}, {"id": "2609.16266", "category": "quant-ph", "title": "Towards Surrogate Based Dequantization of Quantum Reinforcement Learning", "abstract": "In recent years, the utility of parameterized quantum circuits as function approximators has been widely studied. In the context of reinforcement learning, this approach has led to variational quantum algorithms such as quantum Q-learning. While these methods show promising empirical results, and can provide provable advantages for artificial problems, it remains unclear whether they can provide a provable quantum advantage over classical approaches for problems of practical relevance. A natural way to investigate this question is through the lens of dequantization: The construction of efficient classical algorithms capable of matching the performance of quantum variational methods. Building on recent kernel-based dequantization results for supervised learning, we take steps towards extending this surrogate-based dequantization program to reinforcement learning. Specifically, we study the simplified setting of reinforcement learning with a uniform generative model in which uniformly random state-action samples are available, which models the regime of sampling from a large experience replay buffer after sufficient exploration. Within this setting, we provide finite sample guarantees for classical kernelized Fitted Q-Iteration, with classical kernels designed to match the inductive bias of particular parameterized quantum circuits. Using these results, we then provide a set of sufficient conditions, on the data-encoding strategy of a parameterized quantum circuit, the corresponding classical kernel, and the problem structure, under which kernelized Fitted Q-Iteration provides a meaningful dequantization of quantum Q-learning, in this simplified setting. Apart from providing rigorous dequantization guarantees when these conditions are met, these results also motivate the use of kernelized fitted Q-iteration as a dequantization heuristic when these sufficient conditions cannot be verified.", "url": "https://arxiv.org/abs/2609.16266", "type": "理论+数值", "summary": "1. 该工作把监督学习的核去量子化推广到强化学习，在均匀生成模型与随机状态-动作采样设定下研究量子Q学习。\n2. 其核心是为经典核化拟合Q迭代建立有限样本保证，并给出匹配参数化量子电路归纳偏置的经典核与去量子化充分条件。\n3. 当充分条件满足时可获得严格去量子化保证，条件不可验证时则启发将核化拟合Q迭代用作去量子化启发式。", "summary_source": "deepseek", "authors": [{"name": "Pablo Rodriguez-Grasa"}, {"name": "Sofiene Jerbi"}, {"name": "Mikel Sanz"}, {"name": "Ryan Sweke"}], "featured_authors": [{"name": "Pablo Rodriguez-Grasa"}, {"name": "Sofiene Jerbi"}, {"name": "Mikel Sanz"}, {"name": "Ryan Sweke"}], "author_count": 4}, {"id": "2609.16308", "category": "quant-ph", "title": "Geometric View of Iterative Fixed-Node Dynamics", "abstract": "The sign-structure of a quantum many-body ground state is a central quantity in fixed-node approaches to mitigating the Fermion sign problem. For continuum electronic-structure Hamiltonians, the correct sign-structure is sufficient to compute exact ground state properties; on the other hand, lattice fixed-node approaches retain an additional dependence on trial wave-function amplitudes which are improved upon non-optimally while preserving their sign structure. Here we consider an iterative map obtained by repeatedly replacing the fixed-node trial state with the ground state of its associated lattice fixed-node Hamiltonian (independent of whether and how a practical algorithm could implement this iteration). We show the fixed points of this map are eigenstates of the Hamiltonian and reduced Hamiltonian resulting in at most one fixed point in the interior of each sign chamber. We prove that the ground state fixed point is stable and that the boundary of the ground state sign chamber is repulsive. This shows the amplitude dependence beyond having the correct ground state sign-structure disappears under self-consistent iteration. In other sign chambers, energy descent can be obstructed by the imposed sign structure; this tension leads to the iteration driving select amplitudes to zero producing `support collapse' onto chamber boundaries and corresponding to reduced Hamiltonians. Excited-state fixed points are therefore provably unstable and flow toward lower-energy boundary fixed points. We show sign chamber boundaries have a directional stability; boundary points attractive in one direction are repulsive under a sign flip. By revealing the geometry and stability structure of iterative fixed-node dynamics, our results clarify the foundations of a central approach to the Fermion sign problem and motivate potential new algorithmic strategies.", "url": "https://arxiv.org/abs/2609.16308", "type": "理论+数值", "summary": "1. 该工作将格点固定节点方法中的迭代过程抽象为“以固定节点哈密顿量基态替换试探态”的映射，并分析其不动点、稳定性与符号腔边界几何。\n2. 其核心结论是迭代映射的不动点为哈密顿量或约化哈密顿量本征态，每个符号腔内部至多一个不动点；基态不动点稳定且其符号腔边界排斥，激发态不动点不稳定并流向低能边界不动点，自洽迭代可消除正确符号结构之外的振幅依赖并导致支撑塌缩。\n3. 这从几何与稳定性角度澄清了固定节点方法处理费米子符号问题的理论基础，并可能启发新的自洽迭代与基于符号腔边界的算法策略。", "summary_source": "deepseek", "authors": [{"name": "Pranav Kairon"}, {"name": "Bryan K. Clark"}], "featured_authors": [{"name": "Pranav Kairon"}, {"name": "Bryan K. Clark"}], "author_count": 2}, {"id": "2609.16352", "category": "quant-ph", "title": "qdmag: A Python package for simulating nonequilibrium magnetization of molecules using quantum master equations", "abstract": "We present qdmag, a computational utility for calculating the magnetization of magnetic molecules in a time-varying external magnetic field by solving a generalized Lindblad quantum master equation with spin-phonon coupling treated as a dissipation term. The package relies on the spin Hamiltonian formalism, which includes both the magnetic exchange interactions and the zero-field splitting (ZFS) interaction. Different types of magnetic exchange interaction and ZFS terms up to 12th order, which are written in terms of the extended Stevens operators, are supported. qdmag enables long-time evolution of magnetization for up to a few milliseconds, which is achieved through a staircase approximation of the magnetic field as a function of time. For high-dimensional spin Hamiltonians, a lower-dimensional effective Hamiltonian is constructed to make the calculations computationally feasible. Three case studies of one-spin, two-spin, and three-spin systems are presented to demonstrate the usage of qdmag. Our work offers a computational tool to bridge the gap between theoretical development and numerical calculations of spin dynamics in the presence of spin-phonon coupling.", "url": "https://arxiv.org/abs/2609.16352", "type": "理论+数值", "summary": "1. 该工作开发了qdmag，一个基于广义Lindblad量子主方程的Python计算工具，用于模拟磁性分子在时变外磁场下的非平衡磁化，并将自旋-声子耦合作为耗散项处理。\n2. 其特点在于支持包含磁交换与零场分裂（最高12阶扩展Stevens算符）的自旋哈密顿量，通过磁场阶梯近似实现毫秒量级长时间演化，并对高维自旋哈密顿量构建低维有效模型以保证计算可行。\n3. 通过单自旋、双自旋和三自旋案例，该工作为存在自旋-声子耦合时自旋动力学的理论发展与数值计算之间提供了计算工具，并可启发后续分子磁化与非平衡自旋动力学研究。", "summary_source": "deepseek", "authors": [{"name": "Shuanglong Liu"}, {"name": "Xiao Chen"}, {"name": "Andrew Cupo"}, {"name": "James N. Fry"}, {"name": "Hai-Ping Cheng"}], "featured_authors": [{"name": "Shuanglong Liu"}, {"name": "Xiao Chen"}, {"name": "Andrew Cupo"}, {"name": "James N. Fry"}, {"name": "Hai-Ping Cheng"}], "author_count": 5}, {"id": "2609.16460", "category": "quant-ph", "title": "Environmental records unlock universal quantum computation from thermal decoherence", "abstract": "At a fixed thermal exposure, the same stabilizer processor can be classically simulable or quantum universal, depending on which environmental records its controller retains. We give an exact computational classification of energy-counting thermal-idle instruments in a quantum processor with ideal stabilizer control and independent local Markov baths. The relaxation time $T_1$, homogeneous coherence time $T_2$, and equilibrium excited-state population $p_e$ determine an exact computational boundary at $(1-p_e)T_2/T_1=1$. If every location lies at or below it, branchwise nonnegative stabilizer decompositions give an explicit efficient classical sampler for the adaptive circuit and its full time-resolved exchange record. Above it at a single repeatedly accessible location, a suitable idle duration and no-exchange conditioning supply distillable ancillas and enable universal quantum computation with polynomial overhead. At finite temperature on the resource side, erasing the record at a sufficiently long, unsplit exposure makes the averaged channel stabilizer measure-and-prepare, and even a terminal parity check then yields only simulable branches. Yet at that same exposure, retaining only the bit recording whether any exchange occurred still heralds distillable ancillas, because a thermal round trip restores the parity after its first exchange has already removed the coherence.", "url": "https://arxiv.org/abs/2609.16460", "type": "理论+数值", "summary": "1. 该工作对理想 stabilizer 控制下、受独立局域 Markov 热浴影响的能量计数热闲置量子仪器给出精确计算分类，并确立由 T1、T2 与平衡激发态占据 p_e 决定的边界 (1-p_e)T2/T1=1。\n2. 其核心卖点是环境记录的保留方式决定同一处理器可经典模拟还是量子通用：边界下方用分支非负 stabilizer 分解给出自适应电路及其时间分辨交换记录的高效经典采样器，边界上方在单点重复可达处借适宜闲置时长与无交换条件蒸馏辅助量子比特，以多项式开销实现通用量子计算。\n3. 这表明热退相干并非不可逆损失，擦除或保留环境记录可切换计算能力，为有限温度平台把退相干记录转化为量子资源并界定经典可模拟边界提供了明确启发。", "summary_source": "deepseek", "authors": [{"name": "Chenfeng Cao"}, {"name": "Qi Zhao"}], "featured_authors": [{"name": "Chenfeng Cao"}, {"name": "Qi Zhao"}], "author_count": 2}, {"id": "2609.16490", "category": "quant-ph", "title": "A complete classification of the existence of finite-dimensional quantum solutions to inconsistent linear constraint systems", "abstract": "Linear constraint systems (LCS) provide a compact algebraic language for nonlocal games and state-independent contextuality. In the binary case the Mermin--Peres square shows that inconsistent LCS can be solved by promoting variables to local Pauli operators, whereas a series of no-go results excludes analogous Pauli-, Clifford- and monomial unitary-based constructions at odd prime modulus. We first isolate the reason for this difference: for tensor-product quantum solutions, the obstruction to a classical solution of a LCS over $\\mathbb{Z}_n$ decomposes into obstruction classes carried by the individual factors. As a consequence, a genuinely global obstruction cannot arise solely by tensoring locally unobstructed systems. The argument is specific to odd modulus; at even modulus the reordering phase need not vanish, as in Pauli-based examples. Given this distinction, we instead associate LCS to finite arrangements of rank-one projectors and resolutions of the identity in finite-dimensional vector spaces. Quantum solvability for such LCS is automatic and the search for a quantum-classical gap rests entirely on proving classical unsatisfiability of the underlying modular incidence problem of the arrangement. By relating such LCS with group-valued frame functions, we identify a family of examples in the work of [Harding, Jager, and Smith, Int. J. Theor. Phys. 44, 539 (2005)]. To establish the (non)existence of classically unsatisfiable LCS over $\\mathbb{Z}_n$ with quantum solutions in all dimensions $d$ and for all $n\\in\\mathbb{N}$, we further construct explicit examples for the cases $d=n$ prime. Our main result thus positively resolves the existence problem of such LCS beyond the binary case: such systems exist if and only if $d\\geq 3$ and $\\gcd(n,d)>1$. Moreover, we establish the existence of LCS with a quantum-classical gap over finite fields if and only if $d\\geq 3$ and $p\\mid d$.", "url": "https://arxiv.org/abs/2609.16490", "type": "理论+数值", "summary": "1. 线性约束系统（LCS）为非局部博弈和状态无关的上下文提供了一种紧凑的代数语言。\n2. 这种 LCS 的量子可解性是自动的，并且对量子经典间隙的搜索完全取决于证明该排列的基础模关联问题的经典不满足性。\n3. 44, 539 (2005)]。", "summary_source": "local-fallback", "authors": [{"name": "Markus Frembs"}], "featured_authors": [{"name": "Markus Frembs"}], "author_count": 1}, {"id": "2609.16507", "category": "quant-ph", "title": "Exact Ionization Amplitudes for a Delta-Function Well in an Arbitrary-Strength DC Electric Field", "abstract": "We investigate finite-time field-induced ionization from a one-dimensional attractive delta-function well in a uniform dc electric field of arbitrary strength. Our aim is to determine the physical bound-state survival amplitude \\(a_b(t)\\) at any observation time without constructing the complete time-dependent propagator or wavefunction. In the gauge-equivalent Kramers--Henneberger representation, the field appears as motion of the contact point, and the resulting dynamics reduces to a closed Volterra equation. Exact endpoint-phase factorization organizes the full chronological rescattering history into a relative-time convolution hierarchy and an exact resolvent. By introducing the accumulated bound-state amplitude and reorganizing its two-time domain in relative and complementary center times, the final contact contribution becomes an explicit boundary integral. All spatial integrations are carried out analytically. The field-driven contact-free term is obtained in closed form using the Faddeeva function, while the direct and repeated-rescattering terms are expressed as explicitly evaluable time integrals. The result applies at arbitrary dc-field strength and finite time, with no weak-field expansion, rescattering truncation, or asymptotic-time approximation. It is verified through the exact field-free limit and an independent numerical solution of the original physical Volterra equation. The formulation gives an exact nonperturbative solution of a fundamental ionization model and reveals otherwise hidden analytical structure in driven quantum dynamics.", "url": "https://arxiv.org/abs/2609.16507", "type": "理论+数值", "summary": "1. 该工作精确求解一维吸引δ势阱在任意强度直流电场中的有限时间电离，绕过完整含时传播子直接给出束缚态存活振幅a_b(t)。\n2. 卖点是在Kramers–Henneberger表象下将动力学化为闭合Volterra方程，重散射史经端点相位分解为相对时间卷积与精确解算。\n3. 结果经无场极限与独立数值解验证，在任意场强、有限时间下精确成立，不含微扰展开或渐近近似，揭示驱动量子动力学的隐藏解析结构。", "summary_source": "deepseek", "authors": [{"name": "Ilki Kim"}, {"name": "Gerald J. Iafrate"}], "featured_authors": [{"name": "Ilki Kim"}, {"name": "Gerald J. Iafrate"}], "author_count": 2}, {"id": "2609.16542", "category": "quant-ph", "title": "Phantom Codes: Hardness, Rate Optimal qLDPC Constructions, and Distance Limits", "abstract": "An $[[n,k,d]]$ stabilizer code is phantom if every in-block logical CNOT gate can be realized by a permutation of its physical qubits. This eliminates the large and complicated physical overhead normally required for logical entangling gates. Yet this symmetry is highly restrictive: phantom codes are rare, the number of logical qubits is limited to $k=O(\\log n)$, and no phantom qLDPC family with growing logical dimension was previously known. We make three contributions. 1. We prove that recognizing phantomness of a given stabilizer code is at least as hard as Graph Isomorphism, even for CSS codes encoding only $k=2$ logical qubits. 2. We propose the first rate optimal phantom qLDPC families: for every fixed $D$, our CSS families achieve the maximal logical scaling $k=\\Theta(\\log n)$ and distance $d\\geq D$. 3. We prove a distance no-go theorem: every phantom code family with $k=\\omega(\\sqrt{\\log n})$ and check weight $w=O(1)$ satisfies $d\\leq w$ for sufficiently large $n$. Thus our fixed-distance qLDPC families are distance-scaling optimal at the maximal logical scaling $k=\\Theta(\\log n)$.", "url": "https://arxiv.org/abs/2609.16542", "type": "理论", "summary": "1. 如果每个块内逻辑 CNOT 门都可以通过其物理量子位的排列来实现，则 $[[n,k,d]]$ 稳定器代码是幻像的。\n2. 我们证明，识别给定稳定器代码的幻像至少与图同构一样困难，即使对于仅编码 $k=2$ 逻辑量子位的 CSS 代码也是如此。\n3. 我们证明一个距离不可行定理：每个具有 $k=\\omega(\\sqrt{\\log n})$ 的幻影码族，并且检查权值 $w=O(1)$ 满足 $d\\leq w$ 对于足够大的 $n$。", "summary_source": "local-fallback", "authors": [{"name": "Rui Mao"}, {"name": "Weixiao Sun"}, {"name": "Shengyu Zhang"}], "featured_authors": [{"name": "Rui Mao"}, {"name": "Weixiao Sun"}, {"name": "Shengyu Zhang"}], "author_count": 3}, {"id": "2609.16549", "category": "quant-ph", "title": "Pretty good quantum state transfer via transcendental edge weights", "abstract": "We prove that if we take a rooted product of a circulant graph with universal perfect state transfer with a path of fixed length whose end edge is weighted with a transcendental number, then there is pretty good state transfer between any pair of endpoints of these paths. As a consequence, in a path with an even number of vertices with transcendental weights on the two edges incident to the endpoints, there is pretty good state transfer.", "url": "https://arxiv.org/abs/2609.16549", "type": "理论", "summary": "1. 该文证明：在具通用完美态转移的循环图与固定长度路径的根乘积中，若路径末端边赋超越权重，则各路径端点间存在近似完美态转移。\n2. 其关键技术创新是将超越数作为路径末端边权，并利用根乘积把循环图上的通用完美态转移转化为端点间的近似完美态转移。\n3. 作为推论，偶数顶点路径在两端相邻边取超越权重时也具近似完美态转移，为加权图中的量子态传输设计提供新思路。", "summary_source": "deepseek", "authors": [{"name": "Addison Ballif"}, {"name": "Mark Kempton"}, {"name": "James B. Larsen"}, {"name": "Kellon Sandall"}, {"name": "Christino Tamon"}, {"name": "Trevor Wai"}], "featured_authors": [{"name": "Addison Ballif"}, {"name": "Mark Kempton"}, {"name": "James B. Larsen"}, {"name": "Kellon Sandall"}, {"name": "Christino Tamon"}, {"name": "Trevor Wai"}], "author_count": 6}, {"id": "2609.16608", "category": "quant-ph", "title": "Strong converse for the quantum capacity of the pure-loss bosonic channel", "abstract": "This paper reports the proof of a strong converse for the unconstrained quantum capacity of the pure-loss bosonic channel. At every fixed rate above capacity, the entanglement-generation fidelity of every code is bounded by a constant times the reciprocal of the number of channel uses. The bound holds without an energy constraint and for arbitrary encoded states, including states correlated across all input modes, and arbitrary joint decoders. The proof combines quantum Chebyshev and hockey-stick testing inequalities with a uniform relative-entropy-variance bound for the balanced pure-loss channel, corresponding to transmissivity $\\eta=1/2$. The variance bound follows by expressing the balanced beam splitter in bright and dark modes: the dark modes are exactly in vacuum, and any state orthogonal to that vacuum contains at least one dark photon. For general transmissivity, dilating the degrading attenuator reduces the problem to this balanced-channel setting and bounds the decoder test by precisely the factor that produces the known quantum-capacity threshold. The resulting argument establishes the strong converse at the unconstrained quantum capacity for every pure-loss bosonic channel.", "url": "https://arxiv.org/abs/2609.16608", "type": "理论", "summary": "1. 本文报告了纯损耗玻色子通道的无约束量子容量的强逆证明。\n2. 由此产生的论点为每个纯损耗玻色子通道的无约束量子容量建立了强逆命题。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Mark M. Wilde"}], "featured_authors": [{"name": "Mark M. Wilde"}], "author_count": 1}, {"id": "2609.16609", "category": "quant-ph", "title": "Floquet Dressing and Bath Spectral Effects on the Geometric Phase of a Driven Dissipative Qubit", "abstract": "Building on recent work by Wang et al. on the dissipative geometric phase (GP) in the spin-boson model (SBM), the GP dynamics of a periodically driven symmetric SBM are investigated using the numerically exact process-tensor time-evolving matrix product operator (PT-TEMPO) method. A symmetric two-level system subjected to a longitudinal monochromatic drive along the same system coordinate that couples to an Ohmic bosonic environment exhibits rich GP dynamics arising from the interplay between driving and dissipation. To isolate cooperative drive-bath effects, a non-additive GP contribution is introduced that separates the driven dissipative response from its driven-unitary and undriven-dissipative components. Periodic driving is found to either suppress or enhance bath-induced GP deformation depending on the interplay between drive and bath timescales. These trends are interpreted through Floquet spectral steering, whereby the drive redistributes the coherent dynamics among quasienergy sidebands whose transition frequencies and Fourier-resolved system-bath matrix elements determine their coupling to the environmental spectrum. Floquet analysis shows that the dominant dissipative pathways are governed jointly by Floquet matrix-element weights and bath spectral overlap, rather than by either alone. These results connect Floquet engineering, quantum dissipation, and GP dynamics and establish periodic driving as a means of controlling the GP of open quantum systems (OQSs).", "url": "https://arxiv.org/abs/2609.16609", "type": "理论+数值", "summary": "1. 该工作用 PT-TEMPO 数值精确方法研究周期驱动对称自旋-玻色子模型的几何相位动力学，并引入非加性几何相位贡献，以从驱动-幺正与无驱动耗散分量中分离协同驱动-浴响应。\n2. 其核心是 Floquet 谱调控：驱动将相干动力学重分配到准能边带，主导耗散路径由 Floquet 矩阵元权重与欧姆浴谱重叠共同决定，故因驱动-浴时标竞争而抑制或增强浴致几何相位形变。\n3. 该结果连接 Floquet 工程、量子耗散与几何相位动力学，说明周期驱动可作为调控开放量子系统几何相位的可行途径。", "summary_source": "deepseek", "authors": [{"name": "Chirag Arora"}], "featured_authors": [{"name": "Chirag Arora"}], "author_count": 1}, {"id": "2609.16659", "category": "quant-ph", "title": "Approximate synthesis of general single-qubit unitaries over the Clifford+$\\sqrt{T}$ gate set", "abstract": "For the standard Clifford+$T$ gate set, deterministic, ancilla-free synthesis now attains the minimal $T$-count for general single-qubit unitaries (Morisaki et al., arXiv:2510.05816 ). The $\\sqrt{T}$ gate rotates by half the angle of $T$, generating a finer lattice of implementable operations. It was assumed that access to this magic state lowers the cost of deterministic and ancilla-free synthesis of general single-qubit unitaries, but no direct Clifford+$\\sqrt{T}$ algorithm existed for this case. We provide one by extending the integer lattice-point enumeration method of Morisaki et al. We adopt a resource state cost model based on the magic-state catalysis approach of Gidney and Fowler ( arXiv:1812.01238 ). On Haar-random targets synthesized to precisions ranging from $\\varepsilon=10^{-3}$ to $10^{-8}$, the cost of Clifford+$\\sqrt{T}$ circuits scales as $2.4\\log_2(1/\\varepsilon)$ compared to $3.0\\log_2(1/\\varepsilon)$ for the provably $T$-count-optimal Clifford+$T$ circuits. Once a one-time catalyst state is amortized, the Clifford+$\\sqrt{T}$ circuits are never costlier than their Clifford+$T$ counterparts.", "url": "https://arxiv.org/abs/2609.16659", "type": "理论+数值", "summary": "1. 该工作给出了面向一般单量子比特酉操作的确定性、无辅助比特Clifford+√T近似合成算法，扩展了整数格点枚举方法。\n2. 其技术卖点是针对Haar随机目标，利用√T门的更细格点，在魔态催化成本模型下实现2.4 log2(1/ε)的代价标度，优于Clifford+T最优的3.0。\n3. 一旦一次性催化态被摊销，Clifford+√T电路的代价便不高于对应Clifford+T电路，这为降低容错量子计算中的单比特合成开销提供了明确启发。", "summary_source": "deepseek", "authors": [{"name": "Mathias Weiden"}, {"name": "Jae Won Kim"}, {"name": "Justin Kalloor"}, {"name": "John Kubiatowicz"}, {"name": "Costin Iancu"}], "featured_authors": [{"name": "Mathias Weiden"}, {"name": "Jae Won Kim"}, {"name": "Justin Kalloor"}, {"name": "John Kubiatowicz"}, {"name": "Costin Iancu"}], "author_count": 5}, {"id": "2609.16726", "category": "quant-ph", "title": "Improved Separations between Quantum and Classical Communication Complexity of Total Functions", "abstract": "We refine Gavinsky's framework ( arXiv:2608.18784 ) for exponential separations between quantum and randomized communication complexity of total functions and obtain larger separations: polylogarithmic quantum communication versus $\\tilde\\Omega(\\sqrt n)$ randomized communication with two quantum messages, and versus $\\Omega(n^{1-\\varepsilon})$ for every fixed $0<\\varepsilon<1$ with more quantum messages.", "url": "https://arxiv.org/abs/2609.16726", "type": "理论", "summary": "1. 该工作精化Gavinsky的全函数量子与随机通信复杂度指数分离框架，并构造出更大分离。\n2. 其卖点是仅两条量子消息即可实现多对数级量子通信，而随机通信需Ω̃(√n)；增加消息后随机下界达Ω(n^{1-ε})。\n3. 这表明全函数模型中量子通信优势可更强，并启发更优分离构造与下界技术。", "summary_source": "deepseek", "authors": [{"name": "François Le Gall"}], "featured_authors": [{"name": "François Le Gall"}], "author_count": 1}, {"id": "2609.16781", "category": "quant-ph", "title": "Initial-Slip Dynamics Enables the Quantum Mpemba Effect", "abstract": "We investigate the quantum Mpemba effect, whereby a system initially farther from equilibrium relaxes faster than one initially closer to equilibrium, emerging in a quantum harmonic oscillator linearly coupled to a bosonic environment. Starting from factorized thermal states at different temperatures, we derive exact analytical criteria for the occurrence of the quantum Mpemba effect valid also beyond the typically considered weak-coupling and Markovian approximations. Most importantly, we show that the effect is enabled by the initial-slip dynamics generated by the sudden switch-on of the system-bath interaction. Neglecting this contribution completely suppresses the anomalous relaxation, identifying transient system-bath correlations as the key ingredient underlying the quantum Mpemba effect.", "url": "https://arxiv.org/abs/2609.16781", "type": "理论", "summary": "1. 该工作在线性耦合玻色环境中研究量子谐振子的量子姆潘巴效应，从不同温度的因子化热态出发，推导了该反常弛豫发生的精确解析判据。\n2. 其核心卖点在于判据超越弱耦合与马尔可夫近似，并揭示效应由系统-环境耦合突然开启所触发的初始滑移动力学主导。\n3. 忽略初始滑移会完全抑制该反常弛豫，表明瞬态系统-环境关联是量子姆潘巴效应的关键机制，也为开放量子系统中检验该效应及瞬态关联作用提供启示。", "summary_source": "deepseek", "authors": [{"name": "M. Crotti"}, {"name": "F. Cavaliere"}, {"name": "D. Ferraro"}, {"name": "G. Benenti"}, {"name": "M. Sassetti"}], "featured_authors": [{"name": "M. Crotti"}, {"name": "F. Cavaliere"}, {"name": "D. Ferraro"}, {"name": "G. Benenti"}, {"name": "M. Sassetti"}], "author_count": 5}, {"id": "2609.16813", "category": "quant-ph", "title": "TSS Graphs for Hadamard Matrices: Real vs Complex", "abstract": "We have observed that Hadamard matrices whether real or complex lead to a dense output of identical probabilities for any given single input state. Complex Hadamard matrices have unusual orders and introduce phase which prove useful when controlled phase transformation gates are used. By taking a superposed combinations of input states, we discovered that the Hadamards generate non-uniform probabilities which is practically significant towards amplitude amplification without the need for manual parameterization like Grover's operator~\\cite{grover1996}. A variety of graph theoretic properties are applied to TSS graphs and their trends were explored. Additionally, graphs turn out to be nearly isomorphic for the same set of input states which has potential applications for developing Quantum Algorithms. Keywords: Quantum Algorithms, Hadamard Matrices, Unitary Matrix Approach, Topological Structure of Superpositions (TSS), Graph Theory", "url": "https://arxiv.org/abs/2609.16813", "type": "理论+数值", "summary": "1. 该工作为实/复Hadamard矩阵构建TSS图，比较单输入下的相同概率输出与叠加输入下的非均匀概率，并分析图论性质趋势。\n2. 其卖点在于复Hadamard的特殊阶数和相位可配合受控相位门，且叠加输入无需Grover式人工参数化即可导向振幅放大。\n3. 相同输入集下TSS图近同构，这为量子算法开发与振幅放大流程提供了可探索的结构性启示。", "summary_source": "deepseek", "authors": [{"name": "Wesley Lewis"}, {"name": "Darsh Pareek"}, {"name": "Ravi Janjam"}], "featured_authors": [{"name": "Wesley Lewis"}, {"name": "Darsh Pareek"}, {"name": "Ravi Janjam"}], "author_count": 3}, {"id": "2609.16851", "category": "quant-ph", "title": "Understanding the spin coherence of molecular photoexcited triplet states from first principles", "abstract": "Optically readable molecular spins are attractive as quantum sensors due to their nanoscale modularity, synthetic tunability, and scope for sensitive readout. In particular, photoexcited spin-triplet states in organic molecules are appealing in supporting high optical-spin contrast at room temperature. Their utility is underpinned by their coherence, which warrants a detailed understanding of it. Here, from first principles, we systematically explore the Hahn-echo decoherence of the benchmark molecular system for room-temperature optically detected spin coherence---pentacene guest molecules coupled to a para-terphenyl host. Using generalized cluster-correlation expansion methods, we investigate the mechanisms of nuclear-spin-induced decoherence from zero to high magnetic field, exploring the role of guest vs host molecules, specific nuclei, zero-field splitting interactions, and hyperfine parameters. We describe how zero-field decoherence is driven by ~6 nuclei on the guest, while high-field decoherence is driven by ~600 nuclei in the host; how the longitudinal zero-field splitting parameter, $D$, can prolong $T_2$; and the magnetic-field-dependent processes which drive decoherence. These results advance our understanding of decoherence in optically readable molecular spins, providing insight for their synthetic enhancement and deployment as quantum probes.", "url": "https://arxiv.org/abs/2609.16851", "type": "理论", "summary": "1. 该工作从第一性原理出发，采用广义簇关联展开系统计算并五苯客体分子嵌入对三联苯主体体系的光激发三重态哈恩回波退相干，覆盖零场至强场并分解核自旋诱导机制。\n2. 其卖点在于区分客体与主体核、具体核种、零场分裂及超精细参数的作用，揭示零场退相干由约6个客体核主导、强场由约600个主体核主导，并指出纵向零场分裂D可延长T2。\n3. 这为通过合成调控延长相干时间并推动可光学读出的分子自旋作为量子探针与传感器提供了微观依据。", "summary_source": "deepseek", "authors": [{"name": "Ecaterina Păunică"}, {"name": "Sam L. Bayliss"}], "featured_authors": [{"name": "Ecaterina Păunică"}, {"name": "Sam L. Bayliss"}], "author_count": 2}, {"id": "2609.16901", "category": "quant-ph", "title": "Portable Vector NV-Diamond Magnetometer for Shot-Noise-Limited, Drift-Free Operation in Unshielded Environments", "abstract": "Ensemble nitrogen-vacancy (NV) diamond magnetometers combine high sensitivity with vector-field reconstruction, but practical deployment is limited by errors arising from high-frequency laser noise during short-duration operations and slow-varying gain fluctuations and offset drift during long-term operation. Here, we present an integrated digital architecture for achieving NV magnetometry stability across distinct timescales. A dynamic differential readout continuously balances fluorescence and reference channels to suppress correlated laser noise. Second-derivative Lorentzian lineshape tracking enables in-situ correction of slope variations arising from slow changes in gain and optical excitation. We further identify temperature-induced bias-magnet fluctuations as a dominant source of long-term drift and introduce a magnetic eigenvector transformation that uses the intrinsic response of NV resonances to eliminate these variations. We show, under unshielded ambient conditions, that this architecture achieves an off-resonance noise factor of 1.0 $\\pm$ 0.1, matching the fundamental limit with ten-fold suppression of long-term drift, enabling stable, field-ready quantum magnetometry.", "url": "https://arxiv.org/abs/2609.16901", "type": "理论", "summary": "1. 该工作提出并实现了一种集成数字化架构的便携式矢量NV金刚石磁强计，旨在无屏蔽环境中跨不同时间尺度实现散粒噪声极限且无漂移运行。\n2. 其核心在于动态差分读出持续平衡荧光与参考通道以抑制相关激光噪声，利用二阶导数洛伦兹线型跟踪原位校正增益与光激发慢变引起的斜率变化，并识别温度致偏置磁场涨落为长期漂移主因，通过磁本征矢变换消除该变化。\n3. 该架构在非屏蔽常温条件下获得1.0±0.1的非共振噪声因子，匹配基本极限并将长期漂移抑制十倍，为可现场部署的稳定量子磁测量提供了明确路径。", "summary_source": "deepseek", "authors": [{"name": "Annirudh K P"}, {"name": "Vinayak Rane"}, {"name": "Shradha Atakar"}, {"name": "Sanika Joshi"}, {"name": "Maheshwar Mangat"}, {"name": "Jay Gharat"}, {"name": "Siddharth Tallur"}, {"name": "Kasturi Saha"}], "featured_authors": [{"name": "Annirudh K P"}, {"name": "Vinayak Rane"}, {"name": "Shradha Atakar"}, {"name": "Jay Gharat"}, {"name": "Siddharth Tallur"}, {"name": "Kasturi Saha"}], "author_count": 8}, {"id": "2609.16938", "category": "quant-ph", "title": "Classical Communication Protocol based on Joint Classical-Quantum Coding", "abstract": "We introduce a robust quantum communication protocol that integrates classical error-control coding, entanglement distribution, and superdense coding. Classical error-correcting codes are used to mitigate dark counts and photon losses by determining the positions of qubit transmissions and protecting the data embedded through superdense coding. We derive conditions on the employed codes that guarantee successful error correction under a bounded error-frequency model. Moreover, upper bounds are derived on the performance of conventional superdense coding protected by classical error correction. It is shown that, under the same constraints on error frequency, suitable code configurations of the proposed protocol can exceed those upper bounds both in terms of data rate and energy efficiency. Finally, we develop a physical error model based on fiber attenuation, detector efficiency, dark counts, and time-slot duration, and use it to evaluate the effective performance of different configurations of error-correcting codes. The proposed approach is primarily suited for short-distance quantum links, as in Quantum Local Area Network (QLAN) where it can provide high communication throughput while integrating entanglement distribution directly into the communication process.", "url": "https://arxiv.org/abs/2609.16938", "type": "理论+数值", "summary": "1. 该工作提出并分析了一种基于联合经典量子编码的通信协议，将经典纠错编码、纠缠分发与超密编码集成，用经典码确定量子比特传输位置并保护超密编码数据，以抑制暗计数和光子损耗。\n2. 其技术要点在于推导有界错误频率下保证成功纠错的码条件，并给出传统经典纠错保护超密编码的数据速率与能效上界，证明合适码配置可在相同约束下超越这些上界。\n3. 基于光纤衰减、探测器效率、暗计数与时隙的物理误码模型评估不同码配置，表明该方案主要面向量子局域网等短距链路，可在通信过程中直接集成纠缠分发并实现高吞吐。", "summary_source": "deepseek", "authors": [{"name": "Kristian Skafte Jensen"}, {"name": "René Bødker Christensen"}, {"name": "Čedomir Stefanović"}, {"name": "Petar Popovski"}], "featured_authors": [{"name": "Kristian Skafte Jensen"}, {"name": "René Bødker Christensen"}, {"name": "Čedomir Stefanović"}, {"name": "Petar Popovski"}], "author_count": 4}, {"id": "2609.17037", "category": "quant-ph", "title": "Eigenstate thermalization beyond the envelope: exact two-point overlap statistics in random free fermions", "abstract": "Eigenstate thermalization constrains the smooth dependence of observables on energy, but it does not by itself fix the microscopic statistics of the overlaps between many-body eigenstates and a chosen basis: the smooth envelope is a one-point statement, and the fluctuation field it leaves undetermined carries a structured two-point covariance. We establish this distinction, and solve that fluctuation field exactly, in random free fermions---an ensemble of Slater-determinant eigenstates built from a Gaussian orthogonal single-particle Hamiltonian, whose eigenstate thermalization was established by Magán. In this ensemble every channel overlap is a minor of a Haar-distributed orthogonal matrix, so its statistics follow from classical random-matrix theory. The one-point law is exactly flat for every channel, with an exact moment hierarchy that is not Porter--Thomas: small intensities are enhanced algebraically rather than by the exponential Porter--Thomas form, and the mean sector carries a negative, order-one correlation correction of purely normalization origin. The two-point covariance closes exactly at the Gaussian fixed point: it is organized by the number of one-body modes shared by two eigenstates and by the number of modes shared by two channels, and its energy-resolved form factorizes into this geometry times the classical convolution of the single-particle semicircle, from which the two-resolvent covariance follows by an integral transform. Exact finite-size computations confirm all closed forms, and the structural identities of the dictionary hold at machine precision. The results provide an exactly solvable microscopic realization of the two-point fluctuation sector underlying multi-resolvent descriptions of eigenstate thermalization: a smooth envelope does not determine fine-grained fluctuations.", "url": "https://arxiv.org/abs/2609.17037", "type": "理论+数值", "summary": "1. 该工作在随机自由费米子系综中精确求解多体本征态与基矢重叠的两点统计，区分ETH包络与涨落场。\n2. 其核心是将通道重叠视为Haar正交矩阵子式，用随机矩阵理论得到非Porter-Thomas矩层级和按共享模式几何闭合的两点协方差。\n3. 该结果为ETH的多预解式描述提供可精确求解的微观两点涨落实现，表明光滑包络不能决定细粒度涨落。", "summary_source": "deepseek", "authors": [{"name": "Zhiqiang Huang"}], "featured_authors": [{"name": "Zhiqiang Huang"}], "author_count": 1}, {"id": "2609.17044", "category": "quant-ph", "title": "Constant sized support state distillation with qubit recycling", "abstract": "In order to circumvent that no universal set of gates can be achieved on a given quantum error-correcting codes, additional gates can be performed through magic state injection. This however requires to have access to high fidelity magic state, which can be obtained by the distillation of low quality states to fewer higher quality ones. In this paper, we provide a family of distillation protocols able to produce diagonal states at every level of the Clifford hierarchy. This family is obtained recursively using code doubling techniques and leveraging qubit recycling, the fact that some idle qubits of the protocols can be measured and re-used. At a given level of the Clifford hierarchy, we show that the protocols we derive can be performed at arbitrary high distance on a fix number of logical qubits. This family recovers many known efficient protocols, and uncovers new ones, such as a $111 \\to 1$ protocol for $|T\\rangle$ state distillation at distance $7$, which are the most compact in term of volume. Finally, we discuss possible extension of this framework for distillation protocols producing more than one output state.", "url": "https://arxiv.org/abs/2609.17044", "type": "理论", "summary": "1. 该工作提出一族递归蒸馏协议，用码倍增与量子比特回收制备 Clifford 层级各级对角态。\n2. 其核心在于复用空闲量子比特，使固定逻辑比特数下可运行任意高距离，并得到体积最紧凑的111→1 |T⟩距离7协议。\n3. 这统一了许多已知高效方案，并为多输出蒸馏协议及更低开销魔态注入提供了可扩展框架。", "summary_source": "deepseek", "authors": [{"name": "Victor Barizien"}], "featured_authors": [{"name": "Victor Barizien"}], "author_count": 1}, {"id": "2609.17095", "category": "quant-ph", "title": "Probabilistic Error Cancellation for Single-Mode Gottesman-Kitaev-Preskill Codes", "abstract": "In order to solve practical problems on a quantum computer, it is necessary to use fault-tolerant quantum error correction schemes to overcome noise: the errors arising from imperfections in physical components. The Gottesman-Kitaev-Preskill (GKP) code aims at achieving this in a hardware efficient manner by encoding finite-dimensional logical subspaces in the Hilbert space of one or more continuous variable modes. In near term implementations, however, it is not feasible to eliminate errors entirely, so it is natural to also employ alternative error mitigation techniques together with error correction. In this work, we study a quantum error mitigation method known as probabilistic error cancellation in the context of the GKP code. We compare Steane-type and teleportation-based GKP error correction, and calculate the sampling overheads associated with the technique for square and hexagonal GKP codes. We employ the stabilizer subsystem decomposition for GKP codes to obtain an effective logical channel for noisy operations that is used to express the ideal one of a target logical unitary. We consider noise from finite squeezing on the data and the two ancilla modes, needed for error correction, and examine the relationship between the sampling overhead and the noise for different decoding methods. Our results are calculated for single- and two-qubit GKP Clifford gates and one round of error correction, and show the nontrivial combination of error correction and mitigation in continuous variable codes.", "url": "https://arxiv.org/abs/2609.17095", "type": "理论", "summary": "1. 该工作将概率误差消除（PEC）用于单模GKP码，比较Steane型与传态型GKP纠错，并计算方形与六边形码的采样开销。\n2. 其卖点在于利用GKP码的稳定子子系统分解获得含噪操作的有效逻辑信道，以表示目标逻辑酉操作，并考察数据模与两个辅助模有限压缩噪声下不同解码方法的采样开销与噪声关系。\n3. 对单/双量子比特GKP克利福德门与一轮纠错的结果表明，连续变量码中纠错与缓解存在非平凡结合，并为近期有限压缩下GKP容错实现提供参考。", "summary_source": "deepseek", "authors": [{"name": "Victoria Wadewitz"}, {"name": "Alessandro Ciani"}], "featured_authors": [{"name": "Victoria Wadewitz"}, {"name": "Alessandro Ciani"}], "author_count": 2}, {"id": "2609.17116", "category": "quant-ph", "title": "Thouless pumping via discrete jumping of the adiabatic Hamiltonian", "abstract": "Thouless pumping is a celebrated topological effect that enables quantized particle transport and holds promise for applications in quantum technologies. However, the standard adiabatic pumping theory dictate that the Hamiltonian must be varied continuously and slowly throughout the whole pumping process. In this work, we show that Thouless pumping can be realized by using only discrete sampling of the Hamiltonian, removing the conventional constraint of continuous and slow change of control. Specifically, we select particular parameter points of the Hamiltonian for conventional continuous quantum adiabatic evolution, and then apply the Hamiltonian at these parameter points which induces a geodesic evolution for the pseudospin with a given quasimomentum. This realizes an adiabatic evolution for the Thouless pumping according to a necessary and sufficient condition for quantum adiabatic evolution.", "url": "https://arxiv.org/abs/2609.17116", "type": "理论", "summary": "1. 该工作提出并论证，仅通过对绝热哈密顿量进行离散采样或跳跃即可实现Thouless泵浦，从而突破传统绝热泵浦理论对控制参数须连续且缓慢变化的限制。\n2. 其核心卖点在于选取特定参数点，使给定准动量下的赝自旋沿测地线演化，并依据量子绝热演化的充要条件在离散操作间实现等效绝热演化与量子化输运。\n3. 这一机制将拓扑泵浦的绝热性要求从连续时间控制推广到离散参数序列，为快速、数字化及离散协议下的拓扑量子器件与量子技术应用提供了明确启发。", "summary_source": "deepseek", "authors": [{"name": "Lang Yu"}, {"name": "Yihan Wu"}, {"name": "Zhen-Yu Wang"}], "featured_authors": [{"name": "Lang Yu"}, {"name": "Yihan Wu"}, {"name": "Zhen-Yu Wang"}], "author_count": 3}, {"id": "2609.17176", "category": "quant-ph", "title": "Preparation-protocol-dependent quantum Mpemba dynamics in a magnetically tunable graphene nanotorus qubit", "abstract": "We investigate the quantum Mpemba effect in a graphene nanotorus qubit and show that its strength depends strongly on how the initial state is prepared. We compare two protocols that share the same final Hamiltonian, thermal bath, and Markovian Liouvillian: bare Gibbs preparation, in which the coherent drive is switched on only at the final quench, and driven steady-state preparation, in which the initial states are stationary states of the driven dynamics. Using the distance to the final stationary state and an integrated Mpemba parameter, we find broad regions of strong anomalous relaxation for bare Gibbs preparation, with $M_B$ approaching unity, whereas the driven steady-state protocol almost completely suppresses the effect. A Liouvillian-mode analysis reveals the mechanism: the bare Gibbs protocol typically yields a smaller hot-state weight in the slow active sector than the cold state, $R_s<1$, while the driven steady-state protocol predominantly gives $R_s>1$. Since the final Liouvillian spectrum is identical for both protocols at corresponding parameter points, the contrast originates from preparation-dependent modal weights rather than from changes in the decay-rate hierarchy. These results identify state preparation as a control parameter for anomalous quantum relaxation in a curved graphene qubit.", "url": "https://arxiv.org/abs/2609.17176", "type": "理论", "summary": "1. 我们研究了石墨烯纳米环量子位中的量子 Mpemba 效应，并表明其强度很大程度上取决于初始态的准备方式。\n2. 由于两种协议在相应参数点的最终刘维尔谱是相同的，因此对比度源自与制备相关的模态权重，而不是源自衰减率层次结构的变化。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "J. Furtado"}], "featured_authors": [{"name": "J. Furtado"}], "author_count": 1}, {"id": "2609.17188", "category": "quant-ph", "title": "Real-Space Renormalization of Stabilizer Rényi Entropies in Spin Chains", "abstract": "Stabilizer states constitute an important class of quantum states that can be generated from computational-basis states using Pauli operators and Clifford gates. Although they may exhibit substantial multipartite entanglement, quantum circuits restricted to stabilizer operations can be efficiently simulated classically and therefore cannot, by themselves, provide a quantum computational advantage. Such an advantage requires non-stabilizer resources, commonly referred to as quantum magic. In this paper, we investigate the non-stabilizerness of quantum states arising in a class of spin Hamiltonians by computing their stabilizer Rényi entropies. Using real-space renormalization-group techniques, we obtain a closed-form expression valid in the low-energy, large-distance regime. We analyze how quantum magic evolves under coarse-graining and explore its behavior across different parameter regimes and quantum phases.", "url": "https://arxiv.org/abs/2609.17188", "type": "理论", "summary": "1. 该工作针对一类自旋哈密顿量低能态中的非稳定子资源，计算稳定子Rényi熵，并借实空间重整化群研究其在粗粒化下的演化。\n2. 其主要技术卖点是在低能、大尺度区域给出稳定子Rényi熵的闭式表达式，从而定量刻画量子魔法随尺度变换及不同参数区与量子相的变化。\n3. 这为自旋链中量子魔法的相区分与重整化流提供了可解析追踪的视角，并启发将稳定子熵纳入低能有效理论与后续数值/实验表征。", "summary_source": "deepseek", "authors": [{"name": "Sonja Gombar"}, {"name": "Petar Mali"}, {"name": "Slobodan Radošević"}, {"name": "Milica Rutonjski"}, {"name": "Milan Pantić"}, {"name": "Milica Pavkov-Hrvojević"}], "featured_authors": [{"name": "Sonja Gombar"}, {"name": "Petar Mali"}, {"name": "Slobodan Radošević"}, {"name": "Milica Rutonjski"}, {"name": "Milan Pantić"}, {"name": "Milica Pavkov-Hrvojević"}], "author_count": 6}, {"id": "2609.17256", "category": "quant-ph", "title": "Geometric quantifier of the incompatibility of single-particle property attribution in indistinguishable boson systems", "abstract": "Entanglement in indistinguishable particle systems can be characterized by the impossibility of unambiguously attributing a complete set of physical properties to the individual constituent particles. In this work, we introduce a geometric quantifier of the incompatibility of such simultaneous property attribution for pure states of $N$ indistinguishable bosons. Using the Majorana stellar representation, any symmetric multi-qubit state can be expressed as the symmetrization of constituent single-particle states, allowing the associated single-particle properties to be directly linked with the corresponding Majorana stars. This establishes a direct connection between the geometry of the Majorana representation on the Bloch sphere and the entanglement criterion based on the attribution of single-particle properties in systems of identical two-level bosons. We then generalize this geometric approach to higher-dimensional bosons, extending the quantifier from qubits to qudits, while retaining a geometric interpretation of property-attribution incompatibility in terms of Fubini-Study angles.", "url": "https://arxiv.org/abs/2609.17256", "type": "理论", "summary": "1. 该工作引入几何量，量化 N 个不可区分玻色子纯态中同时归属单粒子完整属性的不相容性，并借马约拉纳星表示建立二能级对称态与纠缠判据的联系，进而推广到高维玻色子。\n2. 其卖点在于将对称多量子比特态视为单粒子态的对称化，使单粒子属性直接对应布洛赫球上的马约拉纳星，从而用星表示几何刻画属性归属不相容性，并在高维推广中以富比尼-施图迪角保持几何解释。\n3. 这为基于单粒子属性归属的不可区分玻色子纠缠表征提供几何框架，并提示可在高维对称态和多体实验中检验与扩展该判据。", "summary_source": "deepseek", "authors": [{"name": "P. Céspedes"}, {"name": "A. Valdés-Hernández"}, {"name": "F. H. Holik"}, {"name": "A. P. Majtey"}], "featured_authors": [{"name": "P. Céspedes"}, {"name": "A. Valdés-Hernández"}, {"name": "F. H. Holik"}, {"name": "A. P. Majtey"}], "author_count": 4}, {"id": "2609.17307", "category": "quant-ph", "title": "Forbidden Subspaces in Quantum State Smoothing", "abstract": "A system between a preparation and a post-selection has had no agreed state since 1964. With positivity as the criterion, a post-selection admits an interval of orderings around the symmetric one exactly when the subspace it forbids is spanned by eigenvectors of a full-rank filtered state. Otherwise it certifies contextuality, testable on a qubit. The averaged filtered state carries the entanglement spectrum of the record, so the smallest forbidden subspaces a symmetry allows are even-dimensional in the Haldane class and odd in the trivial one. That parity is the record's topological class.", "url": "https://arxiv.org/abs/2609.17307", "type": "理论", "summary": "1. 该工作以正性为判据重新分析制备与后选择之间的量子态平滑，界定后选择何时容许围绕对称序的排序区间。\n2. 其核心判据是禁戒子空间由满秩滤波态本征矢张成时存在该区间，否则给出可在量子比特上检验的语境性证明。\n3. 平均滤波态携带记录的纠缠谱，最小禁戒子空间在 Haldane 类为偶维、平凡类为奇维，其宇称即记录的拓扑类。", "summary_source": "deepseek", "authors": [{"name": "Chon-Fai Kam"}, {"name": "Kai-Wen Wong"}], "featured_authors": [{"name": "Chon-Fai Kam"}, {"name": "Kai-Wen Wong"}], "author_count": 2}, {"id": "2609.17309", "category": "quant-ph", "title": "Generalised quantum Stein's lemma more robust than ever", "abstract": "The generalised quantum Stein's lemma is a key result in quantum hypothesis testing, and connects this fundamental primitive of quantum information processing with quantum resource manipulation, a task that is central for technological applications. Prior works have proved this statement in the idealised setting of independent and identically distributed (i.i.d.) sequences of quantum states, and recent extensions consider also sources that are 'close' to i.i.d., according to the strict notion put forth by Mazzola, Sutter, and Renner. For several applications, however, one would need to consider yet more general sources. We establish a version of the generalised quantum Stein's lemma that is conceptually much simpler and general, as it applies to any source that is asymptotically close to an i.i.d. state with respect to the normalised quantum Wasserstein distance of order 1. As an immediate consequence, we solve the Stein exponent of a scenario where the null hypothesis is arbitrarily varying, expressing it in terms of i.i.d. Stein exponents corresponding to arbitrary states in the convex hull of the null hypothesis base set.", "url": "https://arxiv.org/abs/2609.17309", "type": "理论", "summary": "1. 该工作建立了广义量子斯坦因引理的一个概念上更简单且更普遍的版本，将适用源从独立同分布序列及其严格邻近源推广到在归一化一阶量子瓦瑟斯坦距离下渐近趋于独立同分布的任意源。\n2. 其核心卖点是采用归一化量子瓦瑟斯坦距离一阶来刻画这种渐近稳健性，并由此求解零假设任意变化情形的斯坦因指数，将其用零假设基集凸包中任意态的独立同分布斯坦因指数表示。\n3. 这一推广表明资源理论与假设检验的联系可超越理想独立同分布设定，为处理更一般、可能任意变化的量子源及相关应用提供了更稳健的分析工具。", "summary_source": "deepseek", "authors": [{"name": "Filippo Girardi"}, {"name": "Kuan-Yi Lee"}, {"name": "Masahito Hayashi"}, {"name": "Ludovico Lami"}], "featured_authors": [{"name": "Filippo Girardi"}, {"name": "Kuan-Yi Lee"}, {"name": "Masahito Hayashi"}, {"name": "Ludovico Lami"}], "author_count": 4}, {"id": "2609.17313", "category": "quant-ph", "title": "Exceptional Topology Survives Strong Hermitian Fields in Radiative Atomic Arrays", "abstract": "Exceptional points are topological defects of complex band structures that are stable against weak perturbations, yet in bounded two-band systems they are ultimately removed by a sufficiently strong Hermitian field. Here we demonstrate a striking exception in a two-dimensional subwavelength atomic array. Along a continuous square-to-triangular deformation at fixed magnetic field, the bulk passes between line-gapped topological regions with band Chern numbers (C_1,C_2)=(2,-2) through a gapless exceptional region. Within a finite interval of lattice deformation, increasing the magnetic field merely drives the exceptional points toward the light cone because of the singular radiative dipolar couplings. We further show that skin localization toward open boundaries responds non-monotonically to the same field. An intermediate field drives a bipolar skin localization, with bulk modes accumulating at opposite edges, whereas stronger fields suppress boundary localization. Our results establish the interplay of lattice geometry, light-cone singularity, and Hermitian magnetic field as a route to engineering Chern and exceptional topology beyond the conventional strong-field limit.", "url": "https://arxiv.org/abs/2609.17313", "type": "理论", "summary": "1. 特殊点是复杂能带结构的拓扑缺陷，这些缺陷在弱扰动下保持稳定，但在有界二能带系统中，它们最终会被足够强的埃尔米特场消除。\n2. 其卖点在于提炼出该问题中的关键机制、方法优势或可计算结构。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Tian-Shu Gou"}, {"name": "Yi-Cheng Wang"}, {"name": "Ya-Tang Yu"}, {"name": "Guin-Dar Lin"}, {"name": "Jhih-Shih You"}, {"name": "H. H. Jen"}], "featured_authors": [{"name": "Tian-Shu Gou"}, {"name": "Yi-Cheng Wang"}, {"name": "Ya-Tang Yu"}, {"name": "Guin-Dar Lin"}, {"name": "Jhih-Shih You"}, {"name": "H. H. Jen"}], "author_count": 6}, {"id": "2609.17314", "category": "quant-ph", "title": "Evolution of quantum imaginarity in black hole quantum atmosphere", "abstract": "Quantum imaginarity, as a critical resource metric for quantifying intrinsic nonreal coherence encoded in quantum states, exhibits nontrivial evolutionary behaviors in curved spacetime backgrounds. This work focuses on bipartite Dirac field reduced states in the quantum atmosphere of a static Schwarzschild black hole, aiming to explore the modulation of three mainstream imaginarity measures by Hawking thermal radiation. We reveal that the relative-entropy imaginarity, the geometric imaginarity and robustness of imaginarity, the fully accessible state presents a valley-shaped radial profile with a local minimum inside the quantum atmosphere, while the cross-coupling and fully inaccessible states follow opposite peak-shaped trends. Further analysis demonstrates that the Hartle-Hawking constant significantly strengthens the redistribution effect of imaginarity across both regions, whereas an increase in the event horizon radius weakens such redistribution and flattens the extremum features. These findings offer a new perspective for decoding the information structure of black hole quantum atmospheres and the intrinsic quantum nature of Hawking radiation.", "url": "https://arxiv.org/abs/2609.17314", "type": "理论", "summary": "1. 该工作研究静态Schwarzschild黑洞量子大气中双模Dirac场约化态的量子虚数性如何受Hawking热辐射调制，并采用相对熵、几何与鲁棒性三种主流度量刻画其演化。\n2. 其核心发现是：完全可及态的三类虚数性沿径向呈谷形并在量子大气内部出现极小值，而交叉耦合与完全不可及态呈相反峰形；Hartle-Hawking常数增强这种再分配，视界半径增大则削弱并抹平极值。\n3. 该结果可望用于解读黑洞量子大气的信息结构及Hawking辐射的内禀量子特性，并提示量子资源在弯曲时空中的径向再分配可作为探测黑洞量子效应的候选信号。", "summary_source": "deepseek", "authors": [{"name": "Ruopu Sun"}, {"name": "Xiaofen Huang"}], "featured_authors": [{"name": "Ruopu Sun"}, {"name": "Xiaofen Huang"}], "author_count": 2}, {"id": "2609.17457", "category": "quant-ph", "title": "One Gate at a Time: Complexity Growth in Random Quantum Circuits", "abstract": "A random unitary quantum circuit is expected to be incompressible for exponentially long times. We show that the constant-error circuit complexity of a random unitary circuit grows almost linearly with time as $\\Omega(T/\\log T)$. The bound holds for all $2\\leq T\\leq 4^n$ where $n$ is the system size, and involves no other $n$-dependence. This improves previous lower bounds derived from spectral gaps and unitary designs by a factor of $\\mathrm{poly}(n)$. Drawing on insights from stochastic calculus, geometric functional analysis, and randomized linear algebra, our approach exploits the circuit's response to variations of individual gates and requires no control over convergence to high-order unitary designs.", "url": "https://arxiv.org/abs/2609.17457", "type": "理论", "summary": "1. 该工作证明，随机酉量子线路在恒定误差下的电路复杂度随演化时间 T 以 Ω(T/log T) 近线性增长，并对所有 2≤T≤4^n 成立。\n2. 其核心卖点是下界除时间外不显含系统尺寸 n，较谱隙与酉设计导出的旧下界提升 poly(n)，且通过分析线路对单个门扰动的响应，融合随机微积分、几何泛函分析与随机线性代数，无需控制向高阶酉设计的收敛。\n3. 这为随机线路不可压缩性提供了更紧且假设更弱的下界，并启示量子混沌、复杂度增长及随机线路采样等方向可借鉴该门扰动响应框架。", "summary_source": "deepseek", "authors": [{"name": "Zhi Li"}], "featured_authors": [{"name": "Zhi Li"}], "author_count": 1}, {"id": "2609.17482", "category": "quant-ph", "title": "Predictive Structure Behind Rare Outcomes in Random Quantum Circuits", "abstract": "Rare outputs of random quantum circuits are usually treated as terminal statistics. We ask whether they reveal intermediate organization that remains useful beyond the selecting future. Comparing unconditioned random-normal (RN) and peak-selected random-peaked (RP) circuits from the same local generator, we find stronger pairwise correlations and probability redistribution but reduced bipartite and output spreading in RP across n=8-16. Exact full-suffix decomposition reveals stronger peak-directed interference. The structural separation and fresh-future advantage persist across four nominal depths at n=8-14, with 2.01-7.15 fold RP enrichment in the depth extensions at fixed, independently calibrated thresholds. Within the unconditioned ensemble, a structural prefix score predicts fresh-event probability without using the evaluated circuits' terminal outcomes. Population-preserving phase scrambling identifies a functional contribution from relative-phase organization across the tested settings, including primary-depth held-out confirmation. RP trajectory-guided initialization improves high-peak yield over Haar initialization under common local refinement. Intermediate multivariate guidance also improves the fresh-continuation susceptibility of constructed states beyond peak-only guidance across the same size-depth grid. Rare outputs thus reveal intermediate physical organization that remains useful under new dynamics and can guide circuit construction.", "url": "https://arxiv.org/abs/2609.17482", "type": "数值", "summary": "1. 随机量子电路的罕见输出通常被视为终端统计。\n2. 中间多元指导还提高了构建状态的新鲜连续敏感性，超越了相同尺寸深度网格上的仅峰值指导。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Myeongsu Kim"}, {"name": "Travis Humble"}, {"name": "Sabre Kais"}], "featured_authors": [{"name": "Myeongsu Kim"}, {"name": "Travis Humble"}, {"name": "Sabre Kais"}], "author_count": 3}, {"id": "2609.17490", "category": "quant-ph", "title": "Query-optimal quantum simulation of Lindblad evolution", "abstract": "For the problem of simulating Lindblad evolution for time $t$ to precision $\\epsilon$, Hamiltonian simulation provides an additive query lower bound, informally, $\\Omega(t + \\mathrm{polylog}(1/\\epsilon))$. However, the best previously known algorithms for general Lindblad simulation achieve a multiplicative upper bound, informally, $\\mathcal{O}(t\\,\\mathrm{polylog}(1/\\epsilon))$, in gate complexity. It has remained open whether this multiplicative dependence is necessary. In this paper, we close the gap in query complexity by giving an algorithm with optimal additive dependence on evolution time and precision in the block-encoding model. Our approach uses the transducer framework to reduce the query cost of composing first-order approximations to the evolution channel, together with linear combinations of reuse circuits of different lengths to suppress catalyst-removal error. Although our additional gate complexity is higher than that of existing algorithms, our optimal query complexity resolves the question of how much oracle access is fundamentally necessary and identifies the remaining challenge to achieve the optimal gate complexity.", "url": "https://arxiv.org/abs/2609.17490", "type": "理论+数值", "summary": "1. 该工作给出了块编码模型下模拟Lindblad演化的查询最优算法，将查询复杂度对时间与精度由乘法依赖改进为加法最优。\n2. 其核心是转导器框架降低一阶近似合成演化信道的查询代价，并用不同长度复用线路的线性组合抑制催化剂移除误差。\n3. 该最优查询复杂度确定了通用Lindblad模拟所需的基本预言机访问量，同时指出达到最优门复杂度仍是主要挑战。", "summary_source": "deepseek", "authors": [{"name": "Chunhao Wang"}, {"name": "Christopher Ye"}], "featured_authors": [{"name": "Chunhao Wang"}, {"name": "Christopher Ye"}], "author_count": 2}, {"id": "2609.17501", "category": "quant-ph", "title": "A Case Study on Noise Resilient Operator Selection in Adaptive Variational Quantum Algorithms", "abstract": "Hardware noise has been shown to significantly impact the accuracy of ADAPT-VQE, a ground state preparation algorithm. While previous work has studied the impact of noise on its parameter optimization step, its impact on the critical operator selection step remains comparatively unexplored. In this work, we examine the impact of a variety of noise channels on this step, using a linear H$_3$ molecule as a test case. We show that, despite the selection criterion's natural resilience to some noise, both coherent and incoherent noise can prevent convergence for sufficiently high noise rates. We employ quantum error mitigation techniques--dynamical decoupling, zero noise extrapolation, and Pauli twirling--and show that when combined appropriately, these techniques are capable of restoring a successful convergence profile. Our results highlight how error mitigation can improve the performance of ADAPT-VQE and enable convergence in the presence of hardware noise, offering valuable insights into the implementation of the algorithm on near-term quantum hardware.", "url": "https://arxiv.org/abs/2609.17501", "type": "理论+数值", "summary": "1. 该工作以线性H3分子为测试案例，系统考察多种相干与非相干噪声通道对ADAPT-VQE中关键算符选择步骤的影响，弥补了此前噪声研究多集中于参数优化而较少探索该步骤的不足。\n2. 其核心发现是，选择判据虽对部分噪声具内在鲁棒性，但足够高噪声率下相干与非相干噪声均可阻断收敛；动态解耦、零噪声外推与泡利随机化适当组合能恢复成功收敛曲线。\n3. 这表明误差缓解可显著提升ADAPT-VQE在含噪近期量子硬件上的性能并促成收敛，为噪声鲁棒的自适应变分算法实现提供了具体启发。", "summary_source": "deepseek", "authors": [{"name": "Soorya Haravu"}, {"name": "Mafalda Ramôa"}, {"name": "Bharath Sambasivam"}], "featured_authors": [{"name": "Soorya Haravu"}, {"name": "Mafalda Ramôa"}, {"name": "Bharath Sambasivam"}], "author_count": 3}, {"id": "2609.17517", "category": "quant-ph", "title": "Regularized barycentric Rényi divergences", "abstract": "Barycentric Rényi divergences were introduced in [Mosonyi, Bunth, Vrana, Linear Algebra and its Applications, 2024] as an alternative to standard Kubo-Ando constructions to define multivariate quantum Rényi divergences. They are defined via a variational expression and depend on a finite collection of quantum relative entropies $D^{q_x}$. When all the relative entropies are monotone under CPTP maps then so are the corresponding barycentric Rényi divergences, and when all the relative entropies are additive then the corresponding barycentric Rényi divergences are subadditive under tensor product. Additivity has only been established before for the case where all $D^{q_x}$ are chosen to be the Umegaki relative entropy, which is also the only case where the barycentric Rényi divergence (called the minimal one) admits an explicit expression. Here we settle the problem of additivity by showing that for any choice of additive and monotone quantum relative entropies, the regularized barycentric Rényi divergence coincides with the minimal barycentric Rényi divergence on strictly positive inputs. This in turn implies that the only additive barycentric Rényi divergence is the minimal one.", "url": "https://arxiv.org/abs/2609.17517", "type": "数值", "summary": "1. 该文证明对任意加性且单调的量子相对熵选择，正则化重心 Rényi 散度在严格正输入上与最小重心 Rényi 散度一致。\n2. 其核心卖点在于解决此前仅对 Umegaki 相对熵成立的加性问题，并推出唯一可加的重心 Rényi 散度就是最小散度。\n3. 这表明重心型多变量量子 Rényi 散度中可加性会强制退化为最小构造，为后续公理化与唯一性研究提供约束。", "summary_source": "deepseek", "authors": [{"name": "Milán Mosonyi"}], "featured_authors": [{"name": "Milán Mosonyi"}], "author_count": 1}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>${paper.summary_source === "deepseek" ? "DeepSeek three-sentence PRL summary" : (paper.summary_source === "local-fallback" ? "Local three-sentence fallback" : (paper.summary_source === "translation" ? "Chinese abstract translation" : "Chinese placeholder fallback"))}</span><a href="${safeUrl}" target="_blank" rel="noreferrer">Open arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
