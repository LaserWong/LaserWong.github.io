  <style>
    :root {
      --bg: #f6f1e8;
      --panel: rgba(255, 252, 246, 0.92);
      --text: #2d241d;
      --muted: #6d5d50;
      --line: rgba(69, 49, 32, 0.14);
      --accent: #8f3d2e;
      --accent-2: #1d5f6b;
      --theory: #7c3a2a;
      --numeric: #255b6a;
      --both: #5d4a99;
      --experimental: #2f6b39;
      --shadow: 0 18px 40px rgba(54, 32, 16, 0.12);
      --radius: 22px;
      --ui-font: "Aptos", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --title-font: "Palatino Linotype", "Noto Serif SC", Georgia, serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--ui-font);
      color: var(--text);
      background: radial-gradient(circle at top left, rgba(255,255,255,0.78), transparent 32%), radial-gradient(circle at 88% 12%, rgba(29,95,107,0.14), transparent 20%), linear-gradient(180deg, #fbf7f0 0%, var(--bg) 42%, #f2e8dc 100%);
      min-height: 100vh;
    }
    .shell { width: min(1220px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 64px; }
    .hero {
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(255,255,255,0.84), rgba(255,248,238,0.72)), linear-gradient(135deg, rgba(143,61,46,0.08), rgba(29,95,107,0.08));
      box-shadow: var(--shadow);
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.82); border: 1px solid var(--line); color: var(--muted); font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase;
    }
    h1 { margin: 18px 0 10px; font-family: var(--title-font); font-size: clamp(32px, 5vw, 54px); line-height: 1.04; letter-spacing: -0.03em; }
    .hero p { max-width: 880px; color: var(--muted); font-size: 16px; line-height: 1.7; margin: 0; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-top: 26px; }
    .stat { padding: 16px 18px; background: rgba(255,255,255,0.76); border: 1px solid var(--line); border-radius: 18px; }
    .stat .label { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
    .stat .value { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
    .controls { position: sticky; top: 12px; z-index: 3; margin-top: 22px; padding: 18px; border: 1px solid var(--line); border-radius: 24px; background: rgba(250,244,236,0.9); backdrop-filter: blur(16px); box-shadow: 0 10px 24px rgba(54,32,16,0.08); }
    .control-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 16px; }
    .field { display: flex; flex-direction: column; gap: 10px; }
    .field label { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
    .search { width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line); background: rgba(255,255,255,0.92); font: inherit; color: var(--text); }
    .chip-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .chip { border: 1px solid var(--line); background: rgba(255,255,255,0.82); color: var(--text); padding: 10px 14px; border-radius: 999px; font: inherit; cursor: pointer; }
    .chip.active { border-color: rgba(143,61,46,0.35); background: rgba(143,61,46,0.12); color: #5b2419; }
    .chip[data-type="数值"].active { border-color: rgba(37,91,106,0.35); background: rgba(37,91,106,0.12); color: #173f49; }
    .chip[data-type="理论+数值"].active { border-color: rgba(93,74,153,0.35); background: rgba(93,74,153,0.12); color: #46337d; }
    .chip[data-type="实验"].active { border-color: rgba(47,107,57,0.35); background: rgba(47,107,57,0.12); color: #214c29; }
    .meta-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 14px; color: var(--muted); font-size: 14px; }
    .paper-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 18px; margin-top: 22px; }
    .paper { display: flex; flex-direction: column; gap: 14px; padding: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 10px 24px rgba(54,32,16,0.06); }
    .paper-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .tag { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid transparent; }
    .tag.category { background: rgba(45,36,29,0.08); color: var(--text); }
    .tag.type-theory { background: rgba(124,58,42,0.1); color: var(--theory); border-color: rgba(124,58,42,0.16); }
    .tag.type-numeric { background: rgba(37,91,106,0.1); color: var(--numeric); border-color: rgba(37,91,106,0.16); }
    .tag.type-both { background: rgba(93,74,153,0.1); color: var(--both); border-color: rgba(93,74,153,0.16); }
    .tag.type-experimental { background: rgba(47,107,57,0.1); color: var(--experimental); border-color: rgba(47,107,57,0.16); }
    .paper h2 { margin: 0; font-family: var(--title-font); font-size: 22px; line-height: 1.25; letter-spacing: -0.02em; }
    .paper h2 a { color: inherit; text-decoration: none; }
    .paper h2 a:hover { color: var(--accent); }
    .paper .id { color: var(--muted); font-size: 13px; }
    .author-block { display: grid; gap: 10px; padding: 14px 16px; border-radius: 18px; background: rgba(255,255,255,0.64); border: 1px solid var(--line); }
    .author-label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .author-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .author-item { display: grid; gap: 4px; }
    .author-item strong { font-size: 14px; }
    .author-item span { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .author-note { color: var(--muted); font-size: 12px; }
    .paper .summary { margin: 0; font-size: 15px; line-height: 1.75; white-space: pre-line; }
    details { border-top: 1px solid var(--line); padding-top: 12px; }
    details summary { cursor: pointer; color: var(--accent-2); font-weight: 700; list-style: none; }
    details summary::-webkit-details-marker { display: none; }
    details p { margin: 10px 0 0; color: var(--muted); line-height: 1.72; font-size: 14px; white-space: pre-line; }
    .paper footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 6px; color: var(--muted); font-size: 13px; }
    .paper footer a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .empty { display: none; margin-top: 24px; padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 22px; background: rgba(255,255,255,0.7); }
    @media (max-width: 980px) { .control-grid { grid-template-columns: 1fr; } .controls { position: static; } }
  </style>

  <script>
    const papers = [{"id": "2609.16045", "category": "cond-mat", "title": "Maxwell-J$ü$ttner averaged nonaffine theory of relativistic shear viscosity", "abstract": "We formulate a Maxwell-Jüttner averaged extension of relativistic nonaffine shear-viscosity theory for a classical gas of massive particles. The starting point is the relativistic nonaffine response formula derived from generalized Langevin dynamics, where proper-momentum dissipation produces a Lorentz-factor enhancement of the viscosity. Since a thermal relativistic gas is not characterized by a single Lorentz factor, we replace this scalar enhancement by an equilibrium momentum average over the Maxwell-Jüttner distribution. Within the scalar transverse mean-field closure used in this work, the minimal relativistic correction is the Maxwell-Jüttner mean of the Lorentz factor and becomes a finite-mass enhancement function of $\\zeta=mc^2/(k_BT)$. In the general closure, the averaged object is the full product of the Lorentz factor, the zero-frequency memory kernel, and the nonaffine affine-force correlator. This construction separates kinematic relativistic enhancement from dynamical dissipation encoded in the bath memory and collective mode spectrum. We derive the nonrelativistic and ultrarelativistic limits, show that a specified effective hard-sphere scaling reproduces the classical square-root law as a consistency test, and identify the assumptions under which a cubic high-temperature law follows. Comparison with relativistic kinetic-theory examples clarifies that the memory kernel is not equivalent to a relaxation time unless a microscopic closure is specified. Retaining the full frequency dependence instead yields a relaxation spectrum. A single dominant pole reduces this spectrum to one shear relaxation time and gives the usual transient shear equation.", "url": "https://arxiv.org/abs/2609.16045", "type": "理论", "summary": "1. 该工作从广义Langevin动力学导出的相对论非仿射响应公式出发，为经典大质量粒子气体建立了按Maxwell-Jüttner分布作动量平均的剪切黏性理论。\n2. 其技术核心是以Maxwell-Jüttner平衡动量平均替代洛伦兹因子标量增强，从而把运动学相对论增强与记忆核及集体模式所编码的动力学耗散相分离。\n3. 该框架表明记忆核仅在指定微观闭合时才等同于弛豫时间，全频率依赖给出弛豫谱，单一主极点还原瞬态剪切方程，为相对论黏性输运建模提供判据。", "summary_source": "deepseek", "authors": [{"name": "Reggie C. Pantig"}, {"name": "Ali Övgün"}], "featured_authors": [{"name": "Reggie C. Pantig"}, {"name": "Ali Övgün"}], "author_count": 2}, {"id": "2609.16084", "category": "cond-mat", "title": "Topological superconductors and Majorana fermions based on $X$-wave magnets with $X=p,d,f,g,i $", "abstract": "We study superconductors coupled with $X$-wave magnets with $X=p,d,f,g,i$. They are essentially different between altermagnets with $X=d,g,i$ and odd-parity magnets $X=p,f$ due to the compatibility of the spin-singlet formation of the $s$-wave superconductor. The altermagnets and odd-parity magnets show rich superconducting phase diagrams depending on the strength of the magnetic order, the chemical potential and the ratio of the on-site and nearest-neighbor interactions. Especially, we find that the altermagnetic order stabilizes the chiral ($p_{x}+ip_{y}$)-wave superconductor, which is a class D topological superconductor hosting Majorana chiral edge states. It is characterized by the Chern number. Especially, there emerge two chiral edge modes in the $i$-wave altermagnet, which are characterized by the Chern number 2. On the other hand, the $p$ ($f$)-wave odd-parity magnetic order stabilizes the $p$ ($f$)-wave topological superconductor, which is a class DIII topological superconductor hosting Majorana flat bands. It is characterized by the winding number. Majorana flat bands are robust in the presence of the mixing with the $s$-wave superconductivity, which is inevitable for odd-parity magnets although the magnitude of the mixing is tiny.", "url": "https://arxiv.org/abs/2609.16084", "type": "理论+数值", "summary": "1. 该工作系统研究了s波超导体与p、d、f、g、i波磁体耦合的拓扑超导，并依据自旋单态兼容性区分交替磁体(d,g,i)与奇宇称磁体(p,f)。\n2. 其核心卖点是交替磁序稳定手性(p_x+ip_y)波D类拓扑超导，陈数为1并具马约拉纳手性边缘态，i波时陈数为2并出现两个边缘模；p/f波奇宇称磁序则稳定DIII类拓扑超导，具马约拉纳平带。\n3. 这为在交替磁体与奇宇称磁体中分别实现D类手性马约拉纳边缘态和DIII类马约拉纳平带提供了可检验方案，并表明后者的平带在不可避免的s波混合下仍鲁棒。", "summary_source": "deepseek", "authors": [{"name": "Motohiko Ezawa"}], "featured_authors": [{"name": "Motohiko Ezawa"}], "author_count": 1}, {"id": "2609.16124", "category": "cond-mat", "title": "Anderson localization in topological metals", "abstract": "We address the question of whether topological metals (TM) retain their nontrivial characteristics in the presence of disorder. While in the clean case, the issue is what protects the gaplessness of the spectrum, i.e. the band-touching nodes in TM, this question needs to be reformulated in the presence of disorder. The concept of gaplessness loses its sharp meaning in this case, since spectral gaps can be filled in by disorder-induced states. What is still meaningful is entanglement: one may ask whether the long-range entanglement of the clean gapless TM survives in the presence of disorder or, in other words, whether nontrivial topology protects the TM from Anderson localization. We demonstrate that such a protection exists in the case of three-dimensional (3D) Weyl semimetals, but not in 2D and 3D (type-I) Dirac or 3D nodal line semimetals. We establish this by combining the idea of unquantized anomaly as the topological response of TM with the decorated domain wall construction, used previously to discuss average symmetry-protected topological insulating phases.", "url": "https://arxiv.org/abs/2609.16124", "type": "理论", "summary": "1. 该工作研究拓扑金属在无序下是否保持非平庸特性，将无能隙问题重述为纯净体系的长程纠缠能否在无序中存活，即拓扑是否保护其免于安德森局域化。\n2. 通过结合未量子化反常作为拓扑响应与装饰畴壁构造，作者证明三维外尔半金属存在这种保护，而二维和三维I型狄拉克半金属及三维节线半金属则没有。\n3. 这给出了以纠缠与反常判据区分受保护拓扑金属的思路，并为无序下拓扑物态、平均对称保护拓扑相及后续实验/理论检验提供了框架。", "summary_source": "deepseek", "authors": [{"name": "A.A. Burkov"}], "featured_authors": [{"name": "A.A. Burkov"}], "author_count": 1}, {"id": "2609.16147", "category": "cond-mat", "title": "Quantum Critical Solids", "abstract": "We study the fate of quantum solids with a vanishing velocity of transverse phonons. Such ``floppy'' solids exhibit a cubic elastic nonlinearity that is relevant in spatial dimensions $d<4$ and drives the system to a strongly-coupled Lifshitz quantum critical point in $d=3$, that we analyze in an $\\epsilon = 4-d$ expansion. The associated phase transition is generically first-order, preempting the system's full access to the strongly-coupled fixed point. Nevertheless, the critical data of this quantum critical point is accessible within a Ginzburg region in the vicinity of the transition. This cubic nonlinearity vanishes exactly in $d=2$, where the leading interactions are instead quartic and are marginal, leading to weak logarithmic singularities. We discuss possible realizations of this ``crystal Lifshitz criticality'' in quantum materials.", "url": "https://arxiv.org/abs/2609.16147", "type": "理论", "summary": "1. 该工作研究了横向声子速度趋零的“软”量子固体，并用 ε=4-d 展开分析了其被立方弹性非线性驱动到的 d=3 强耦合利夫希茨量子临界点。\n2. 其关键是：立方非线性在 d<4 时相关并使相变通常变为一级，阻止系统完全到达强耦合不动点，但该临界点的临界数据仍可从转变附近的金兹堡区获得；在 d=2，该非线性严格消失，领头四次相互作用变为边缘相关，仅导致弱对数奇异性。\n3. 这为在量子材料中实现和识别“晶体利夫希茨临界性”提供了理论框架，并提示可寻找具有软横声子模式的相关体系。", "summary_source": "deepseek", "authors": [{"name": "Subham Dutta Chowdhury"}, {"name": "Leo Radzihovsky"}, {"name": "Luca V. Delacrétaz"}], "featured_authors": [{"name": "Subham Dutta Chowdhury"}, {"name": "Leo Radzihovsky"}, {"name": "Luca V. Delacrétaz"}], "author_count": 3}, {"id": "2609.16172", "category": "cond-mat", "title": "Two-Dimensional Materials toward CMOS-Compatible Scalable Quantum Hardware", "abstract": "Manufacturability is one of several constraints on developing solid-state quantum processors, along with qubit performance, control, connectivity, cryogenic operation, and fault tolerance. Chemical residues, structural disorder, and non-uniform interfaces introduced during fabrication can compromise qubit coherence. Two-dimensional (2D) materials, with their atomically thin crystals and van der Waals interfaces, offer routes to address some of these challenges. Their concurrent development as next-generation CMOS channel materials motivates an examination of whether relevant processes can be transferred to quantum chips. This Perspective evaluates the opportunities and limitations of 2D materials for CMOS-compatible quantum hardware.", "url": "https://arxiv.org/abs/2609.16172", "type": "理论+数值", "summary": "1. 该展望文章系统评估了二维材料用于互补金属氧化物半导体兼容可扩展量子硬件的机遇与局限，重点考察其能否承接现有工艺并缓解制造引入的退相干问题。\n2. 其卖点在于二维材料原子级薄体与范德华界面可抑制化学残留、结构无序和非均匀界面，从而在保持工艺兼容性的同时提升量子比特相干性。\n3. 这为二维材料从下一代互补金属氧化物半导体沟道向可扩展量子芯片的工艺转移提供了评估框架，但实际可行性仍取决于制造均匀性、控制连接和低温容错等系统约束。", "summary_source": "deepseek", "authors": [{"name": "Mara Lieberegts"}, {"name": "Ye Wang"}], "featured_authors": [{"name": "Mara Lieberegts"}, {"name": "Ye Wang"}], "author_count": 2}, {"id": "2609.16311", "category": "cond-mat", "title": "An improved auxiliary boson method for quantum dots with finite Coulomb interaction U", "abstract": "In this work, we present an improved version of the formulation of the four auxiliary bosons originally proposed by Kotliar and Ruckenstein, adapted to describe a quantum dot in the Kondo regime with finite electron-electron interaction U. The proposed refinement provides a more accurate treatment of strong electronic correlations while preserving the analytical tractability of the original approach, thereby enabling a reliable description of transport properties in nanoscale systems. Benchmark calculations show good agreement with the results of the numerical renormalization group, supporting the validity of the improved formulation. Our approach therefore provides an efficient and robust framework for investigating transport through strongly correlated quantum dots.", "url": "https://arxiv.org/abs/2609.16311", "type": "理论+数值", "summary": "1. 该工作将Kotliar-Ruckenstein四辅助玻色子方法加以改进，用于描述有限库仑相互作用U下处于近藤区的量子点。\n2. 改进方案在保持原方法解析可处理性的同时更准确地处理强电子关联，从而可靠计算纳米尺度体系的输运性质。\n3. 基准计算与数值重整化群结果吻合良好，表明该框架可高效稳健地研究强关联量子点输运。", "summary_source": "deepseek", "authors": [{"name": "Juan Pablo Ramos-Andrade"}, {"name": "Patricia Almeida"}, {"name": "Ana María Calle"}, {"name": "Gustavo Lara"}], "featured_authors": [{"name": "Juan Pablo Ramos-Andrade"}, {"name": "Patricia Almeida"}, {"name": "Ana María Calle"}, {"name": "Gustavo Lara"}], "author_count": 4}, {"id": "2609.16343", "category": "cond-mat", "title": "Domain-wall energy governs coercivity in ordered and disordered additively manufactured Fe--49Co--2V", "abstract": "Additively manufactured soft-magnetic Fe--Co is consistently harder than wrought material of the same composition, and controlling that excess is the central obstacle to printing electrical machines from these alloys. The literature attributes it to B2 chemical ordering, untested because the anisotropy of the ordered state had not been measured for this alloy and because printed material had never been compared with wrought material at matched grain size. In this study we supply both. Calibrating on wrought Fe--49Co--2V at a known order parameter fixes the ordered-state domain-wall energy and caps every pinning channel independent of grain size. Ordering then falls orders of magnitude short of the measured excess, and a tenfold change in antiphase-domain size leaves coercivity unchanged. What ordering controls is the wall energy, and that effect is small and bounded. The excess is retained defect content, which moves process optimization from post-build annealing to in-build defect control.", "url": "https://arxiv.org/abs/2609.16343", "type": "理论+数值", "summary": "1. 该工作通过在已知有序度的锻态Fe-49Co-2V上标定，获得了有序态畴壁能，并在匹配晶粒尺寸下比较增材制造与锻态材料，以检验B2有序化是否主导其过高矫顽力。\n2. 结果表明，有序化仅通过畴壁能产生有限且小幅的贡献，反相畴尺寸十倍变化不改变矫顽力；过剩矫顽力主要来自打印残留缺陷，而非B2有序或晶粒尺寸相关的钉扎。\n3. 因此，增材Fe-Co软磁材料的工艺优化应从后处理退火转向打印过程中的缺陷控制，为直接打印电机部件提供明确路径。", "summary_source": "deepseek", "authors": [{"name": "Dennis Boakye"}, {"name": "Chuang Deng"}], "featured_authors": [{"name": "Dennis Boakye"}, {"name": "Chuang Deng"}], "author_count": 2}, {"id": "2609.16371", "category": "cond-mat", "title": "Soft thermal diodes: grafted polymers provide a highly tunable thermal rectification", "abstract": "We explore the heat-rectification properties of a two-phase fluid confined in a nano-chamber with one wall coated with end-grafted polymers using molecular-dynamics simulations. We find a significant thermal diode effect for a wide range of chamber fillings for both very stiff and fully flexible polymers. A stationary heat flux is imposed on the system by fixing the walls at two different temperatures, computing the heat flow as a function of the filling density. The fluid presents a liquid phase, located close to the cold wall, and, for many fillings, a vapor phase in contact with the hot wall. A vapor-liquid interface is also present and located at different distances from the walls, depending on the fluid filling. We study the system by comparing two operational modes: a direct mode, in which the polymers are grafted on the hot wall and exposed to the vapor phase. In the inverse mode, the wall temperatures are swapped and the fluid rearranges to adapt to the interchanged temperature gradient. We calculate the mean heat flow, number density and temperature profiles for the stationary state in both modes. From them, we computed the density and temperature profiles, heat rectification coefficient, and resistivity profiles, for the two studied extreme cases of polymer bending rigidity. We found that, the nano-chamber presents a significant degree of heat rectification with different characteristics and filling density ranges. We describe the conditions to be met to obtain high thermal rectification as regards fluid filling, polymer properties and fluid-polymer affinity. They can be fine-tuned according to the application or material availability. In the direction parallel to the walls the system is easily scalable towards macroscopic sizes, without affecting the thermal rectification. This makes the soft-diode mechanism very versatile in geometry, size and materials choice.", "url": "https://arxiv.org/abs/2609.16371", "type": "理论+数值", "summary": "1. 该工作用分子动力学模拟研究纳米腔内两相流体与一面壁涂覆末端接枝聚合物构成的软热二极管，通过固定冷热壁温施加稳态热流，比较聚合物接枝热壁的直接模式与交换壁温后的反向模式。\n2. 其物理卖点在于，刚性与完全柔性接枝聚合物、宽填充密度范围内均出现显著热整流，且冷壁侧液相、热壁侧气相及气液界面位置同聚合物弯曲刚度和流体—聚合物亲和性共同决定整流特性。\n3. 该机制可通过填充密度、聚合物性质与亲和性精细调节，并沿平行壁方向扩展至宏观尺寸而不损失整流，为几何、尺寸和材料选择高度通用的软热二极管设计提供启发。", "summary_source": "deepseek", "authors": [{"name": "Claudio Pastorino"}, {"name": "Alejandro Monastra"}, {"name": "Florencia Carusela"}], "featured_authors": [{"name": "Claudio Pastorino"}, {"name": "Alejandro Monastra"}, {"name": "Florencia Carusela"}], "author_count": 3}, {"id": "2609.16438", "category": "cond-mat", "title": "Analytical solutions to the non-equilibrium Green's functions in large-$q$ SYK models", "abstract": "It is known that the Sachdev-Ye-Kitaev (SYK) model is exactly solvable at leading order in $1/q$; specifically, the instantaneously thermal time block after the quench is known in closed form. Thus far the remaining (inherently out of equilibrium) blocks have only been numerically accessible. Here we provide their analytical solutions for a quench between non-commuting $q/2$-body SYK Hamiltonians. We obtain the Green's functions in closed form for every time block. We extract a simple relation between the pre- and post-quench energies $\\epsilon_1 \\propto \\epsilon_0$ leading to an exact temperature update rule. Via a Cauchy-Schwarz inequality, we show that heating is inevitable for the closed system; hence, the second law emerges geometrically. The solution is used in a companion paper to address what ``instantaneous thermalization'' means at finite $q$.", "url": "https://arxiv.org/abs/2609.16438", "type": "理论+数值", "summary": "1. 该工作针对非对易的 q/2 体 SYK 哈密顿量之间的淬火，给出了大 q 极限下非平衡格林函数所有时间区块的闭合解析解。\n2. 其核心在于突破此前仅瞬态热化区块可解析、其余非平衡区块只能数值求解的限制，并推出淬火前后能量满足 ε1 ∝ ε0 的精确温度更新规则，借助柯西-施瓦茨不等式证明封闭系统加热不可避免，使第二定律以几何方式浮现。\n3. 这些解析解为有限 q 下澄清“瞬时热化”的含义提供了严格基础，并可用于检验淬火动力学、热化与熵增之间的联系。", "summary_source": "deepseek", "authors": [{"name": "Jan C. Louw"}], "featured_authors": [{"name": "Jan C. Louw"}], "author_count": 1}, {"id": "2609.16441", "category": "cond-mat", "title": "Full Minimal Coupling All-Electron Real-Time TDDFT for X-Ray-Matter Interactions", "abstract": "Standard real-time time-dependent density functional theory (RT-TDDFT) couples light to matter through a spatially uniform (dipole) vector potential, an approximation that breaks down in the X-ray regime, where the photon wavelength approaches interatomic scales. We present an all-electron, numeric-atom-centered-orbital implementation of full minimal coupling in FHI-aims that retains the spatial structure of the vector potential in both the paramagnetic and diamagnetic couplings, implements a reciprocal-space-resolved current diagnostic, and extends the propagation to periodic systems through a perturbative photon-momentum sideband coupling that recovers the density response at the photon wavevector. Four benchmarks ranging in energy from 100 eV to 5 keV validate the implementation and exercise its reach. The retained photon momentum proves physically consequential throughout, from measurable beyond dipole corrections to the enabling of channels forbidden in the dipole limit. On an all-electron footing, the implementation lays the groundwork for a general ab initio treatment of X-ray light-matter interaction across molecules, surfaces, and solids.", "url": "https://arxiv.org/abs/2609.16441", "type": "理论+数值", "summary": "1. 该工作报道了全电子实时TDDFT的完全最小耦合实现，在FHI-aims中以数值原子中心轨道描述X射线与物质的相互作用。\n2. 它同时在顺磁与抗磁耦合中保留矢量势的空间变化，加入倒空间分辨的电流诊断，并用微扰光子动量边带耦合将传播扩展到周期体系，以恢复光子波矢处的密度响应。\n3. 100 eV至5 keV的四个基准验证了实现，显示光子动量修正可测且能开启偶极禁戒通道，为分子、表面与固体的X射线光-物质相互作用提供通用从头算基础。", "summary_source": "deepseek", "authors": [{"name": "Daniel Schacher"}, {"name": "Tod A. Pascal"}, {"name": "Craig P. Schwartz"}, {"name": "Keith V. Lawler"}], "featured_authors": [{"name": "Daniel Schacher"}, {"name": "Tod A. Pascal"}, {"name": "Craig P. Schwartz"}, {"name": "Keith V. Lawler"}], "author_count": 4}, {"id": "2609.16466", "category": "cond-mat", "title": "Scaling LLM Agents for Materials Design through Hierarchical Collective Reasoning", "abstract": "Materials design must reconcile competing functional requirements with stability and synthesis constraints. Generative models can produce stable, novel crystals, but accommodating detailed natural-language design instructions remains challenging. Here we introduce HiMatGen, a framework for scaling large language model agents through hierarchical collective reasoning. Built from GPT-5.6 Terra, HiMatGen connects 100 investigators in discussion pods across ten scientific domains with tool-enabled domain representatives. Representatives investigate proposals, exchange evidence across domains and return findings and unresolved questions to their pods. This bidirectional exchange turns specialist disagreements into structural revisions and alternative designs. Across six chemical systems, HiMatGen produces 1.9 times as many final crystal candidates and 1.7 times as many stable, unique and novel (SUN) structures as a tool-enabled GPT-6 Astra single-agent baseline. In property-directed tasks, the complete HiMatGen workflow outperforms same-model single-agent and independent-generation controls. Comparisons with MatterGen and Chemeleon2 demonstrate its ability to develop diverse crystals satisfying joint functional and chemical requirements. In a paired comparison initialized from the same proposals, hierarchical discussion reduces debate-stage token usage by a factor of 22 relative to full debate. HiMatGen provides an approach to materials design that sustains the exchange of scientific knowledge and computational evidence throughout iterative exploration as the agent population grows.", "url": "https://arxiv.org/abs/2609.16466", "type": "理论+数值", "summary": "1. 该工作提出 HiMatGen，用分层集体推理扩展 LLM 智能体，将 100 名研究者分入十个领域的讨论小组，并与具备工具调用能力的领域代表双向交换证据。\n2. 其核心在于把专家分歧转化为结构修改与新设计，最终晶体候选数达单智能体基线的 1.9 倍，稳定、独特且新颖结构达 1.7 倍，且分层讨论使辩论阶段 token 消耗降低 22 倍。\n3. 这为在智能体规模增长时仍能持续交换科学知识与计算证据的材料逆向设计提供了可行路径。", "summary_source": "deepseek", "authors": [{"name": "Jaehwan Choi"}, {"name": "Yousung Jung"}], "featured_authors": [{"name": "Jaehwan Choi"}, {"name": "Yousung Jung"}], "author_count": 2}, {"id": "2609.16483", "category": "cond-mat", "title": "Entropy-driven transitions between extended integer and fractional quantum Hall regimes", "abstract": "Electronic states with coexisting Wigner-crystal order can sometimes exhibit a quantum Hall effect over a finite range of electron densities---i.e., exhibit ``extended'' quantum Hall (QH) plateaus in the absence of disorder. Such an extended quantum Hall state can then compete with other QH states over the same density range, allowing a first-order thermal transition between them. Here, we analyze several settings in which the entropy associated with Goldstone modes (e.g., magnons or phonons) or soft gapped modes (e.g., magnetoroton) drives a finite-temperature transition between competing QH regimes. Applying this framework to moiré rhombohedral graphene, we argue that a soft magnetoroton in a fractional quantum anomalous Hall state provides a plausible bulk mechanism for the observed thermal evolution from an extended integer QH to a fractional QH regime.", "url": "https://arxiv.org/abs/2609.16483", "type": "理论", "summary": "1. 该工作分析了几类兼具维格纳晶体序且在无序缺失下形成扩展量子霍尔平台的电子态，及其与竞争量子霍尔态发生有限温一级相变的情形。\n2. 其核心机制是戈德斯通模（磁振子、声子）或软能隙模（如磁旋子）的熵在有限温度下驱动扩展整数与分数量子霍尔区间之间的一级热转变。\n3. 将其用于莫尔菱面体石墨烯时，分数量子反常霍尔态中的软磁旋子可作为观察到从扩展整数量子霍尔向分数量子霍尔热演化的合理体机制，并为理解熵驱动量子霍尔相变提供启发。", "summary_source": "deepseek", "authors": [{"name": "Kyung-Su Kim"}, {"name": "Steven A. Kivelson"}], "featured_authors": [{"name": "Kyung-Su Kim"}, {"name": "Steven A. Kivelson"}], "author_count": 2}, {"id": "2609.16506", "category": "cond-mat", "title": "Unsupervised Machine Learning of the Contact Process", "abstract": "We investigate how unsupervised machine-learning methods can characterize the active-absorbing phase transition in the contact process in one and two spatial dimensions. Our analysis focuses on principal component analysis (PCA) and variational autoencoders (VAEs), and we show that direct applications of these methods encounter a central difficulty: contact process configurations are intrinsically positive-definite. In the PCA case, standard centering procedures fail to isolate the order parameter in the leading component. To address this, we augment the data with sign-reversed configurations, creating a balanced dataset with zero mean while preserving the density information required to describe the transition. This preprocessing allows the dominant principal component to recover the order parameter and reproduce the expected finite-size scaling near criticality. For VAEs, we find a related limitation: a fixed Gaussian prior does not provide sufficient latent regularization across the full range of control parameters and system sizes for positive-definite data. We overcome this by adopting a heteroscedastic Gaussian prior that adapts to the control parameter, leading to a substantial improvement in the finite-size scaling of reconstruction-based observables near the critical threshold. Taken together, these results highlight a key lesson: the success of machine learning in phase-transition problems does not rely on algorithmic complexity alone, but on tailoring the representation to respect the physical structure of the system, including its intrinsic constraints and symmetries.", "url": "https://arxiv.org/abs/2609.16506", "type": "理论+数值", "summary": "1. 该工作用主成分分析和变分自编码器无监督学习一维与二维接触过程的活性-吸收相变。\n2. 关键卖点是针对组态正定导致主成分中心化与固定高斯先验失效，引入符号反转平衡数据和随控制参数变化的异方差高斯先验。\n3. 这表明机器学习在相变问题中的成功不靠算法复杂度，而在于使表征尊重系统的正定性、约束与对称性等物理结构。", "summary_source": "deepseek", "authors": [{"name": "L. T. Brito"}, {"name": "G. A. Alves"}, {"name": "F. W. S. Lima"}, {"name": "A. Macedo-Filho"}, {"name": "R. S. Ferreira"}, {"name": "T. F. A. Alves"}], "featured_authors": [{"name": "L. T. Brito"}, {"name": "G. A. Alves"}, {"name": "F. W. S. Lima"}, {"name": "A. Macedo-Filho"}, {"name": "R. S. Ferreira"}, {"name": "T. F. A. Alves"}], "author_count": 6}, {"id": "2609.16526", "category": "cond-mat", "title": "Symbolic Ensemble Learning Enables Discovery of Fast Accurate Physics-Based Interatomic Potentials", "abstract": "Machine learning has transformed materials simulation by delivering force fields with ab initio accuracy, yet bridging the gap between high-dimensional regression and physical interpretability remains a grand challenge. Conventional analytical potentials offer transparency but often fail to capture the complexity of far-from-ground state regimes. Here, we introduce a hybrid symbolic-neural framework that unifies the interpretability of the Embedded Atom Method (EAM) with the adaptability of data-driven learning. Using Equation Learner Neural Networks (EqNNs) trained on density functional theory (DFT) data, we obtain interpretable models for aluminum through three distinct training protocols: random initialization trained via Monte Carlo Tree Search (MCTS) and gradient descent, and two transfer-learning strategies initialized from a copper potential - one employing MCTS followed by gradient descent, and the other using gradient descent only. We find that while all three resulting symbolic models achieve sub-10 meV/atom accuracy, they occupy distinct local minima in the functional landscape, exhibiting complementary trade-offs across phonon dispersion, surface energetics, and elastic response. By integrating these diverse functional forms through a weighted symbolic ensemble, we derive a composite potential that surpasses the fidelity of its constituent models. The resulting ensemble effectively mitigates individual biases, delivering superior consistency with DFT benchmarks across equation-of-state curvature, phonon spectra, and melting dynamics. This approach demonstrates that combining transfer learning with ensemble symbolic regression yields compact, transparent potentials capable of robust prediction across equilibrium and non-equilibrium states.", "url": "https://arxiv.org/abs/2609.16526", "type": "理论+数值", "summary": "1. 该工作提出符号-神经混合框架，将EAM可解释性与数据驱动学习结合，用DFT数据训练方程学习神经网络为铝构建可解释势，并比较随机初始化与铜势迁移学习等三种训练方案。\n2. 其核心卖点在于三种符号模型均达亚10 meV/atom精度却落入不同局域极小，在声子色散、表面能和弹性响应上互补；加权符号集成削弱个体偏差，在状态方程曲率、声子谱和熔化动力学上优于单一模型并与DFT基准更一致。\n3. 这表明迁移学习与集成符号回归可生成紧凑透明、兼顾平衡与非平衡态的势函数，为可解释、可迁移的机器学习原子间势提供可行路径。", "summary_source": "deepseek", "authors": [{"name": "Bilvin Varughese"}, {"name": "Aditya Koneru"}, {"name": "Adil Muhammad"}, {"name": "Troy D. Loeffler"}, {"name": "Sukriti Manna"}, {"name": "Jan Michael Y. Carrillo"}, {"name": "Orcun Yildiz"}, {"name": "Thomas Peterka"}, {"name": "Subramanian K.R.S. Sankaranarayanan"}], "featured_authors": [{"name": "Bilvin Varughese"}, {"name": "Aditya Koneru"}, {"name": "Adil Muhammad"}, {"name": "Orcun Yildiz"}, {"name": "Thomas Peterka"}, {"name": "Subramanian K.R.S. Sankaranarayanan"}], "author_count": 9}, {"id": "2609.16530", "category": "cond-mat", "title": "Orbital-resolved superexchange and topological magnon bands in MXene Fe$_2$C", "abstract": "Magnetic MXenes are promising candidates for future spintronics due to their intriguing properties. Nevertheless, the topological properties of magnon bands and superexchange mechanism remain relatively underexplored. In this work, we have calculated the spin wave dispersions for MXene Fe$_2$C using the linear spin wave method, with the exchange coupling parameters obtained from first-principles calculations. Owing to the staggered stacking of two Fe sub-lattices, the interlayer exchange coupling lifts the degeneracy of the ferromagnetic magnon modes. A Dirac point is identified in the magnon bands at the $K$ point. The topological properties of magnon bands, including Berry curvature, valley Chern number and edge states, are further computed by means of a two-band model. We also derive an effective Hamiltonian to explain the magnonic topology, which is protected by the $C_{3v}$ rotational symmetry. To understand the microscopic origin of the exchange couplings that govern the magnon bands, we then construct a refined model integrating perturbation theory and the tight-binding approach. The ferromagnetic superexchange coupling is mediated by the virtual hopping between the d orbitals of two distinct Fe sites via a pair of orthogonal p orbitals at the bridging C site. In detail, the intralayer exchange coupling is governed by the in-plane $p_x$ and $p_y$ orbitals, while the out-of-plane $p_z$ orbital is responsible for the interlayer exchange coupling. Our results establish a direct link between the orbital-resolved anisotropic superexchange and topological properties of the magnon bands in magnetic MXene Fe$_2$C, providing theoretical guidance for future spintronics applications.", "url": "https://arxiv.org/abs/2609.16530", "type": "理论+数值", "summary": "1. 该工作基于第一性原理交换耦合参数与线性自旋波方法计算了MXene Fe2C的自旋波色散，并结合两带模型与微扰/紧束缚方法分析了磁振子能带拓扑性质及轨道分辨的超交换机制。\n2. 层间交换耦合因两套Fe亚晶格错落堆叠解除铁磁磁振子模简并，K点出现Dirac点，其Berry曲率、谷Chern数与边缘态受C3v对称性保护；面内px/py轨道主导层内交换，面外pz轨道经桥连C位正交p轨道介导层间铁磁超交换。\n3. 该结果建立了轨道分辨各向异性超交换与磁振子能带拓扑之间的直接联系，为磁性MXene的自旋电子学应用提供了可检验的理论依据。", "summary_source": "deepseek", "authors": [{"name": "Qiang Gao"}, {"name": "Wei Wang"}, {"name": "Shaojin Qi"}, {"name": "Guimei Shi"}, {"name": "Anbang Guo"}, {"name": "Xin Jin"}, {"name": "Chen Shen"}, {"name": "Xing-Qiu Chen"}], "featured_authors": [{"name": "Qiang Gao"}, {"name": "Wei Wang"}, {"name": "Shaojin Qi"}, {"name": "Xin Jin"}, {"name": "Chen Shen"}, {"name": "Xing-Qiu Chen"}], "author_count": 8}, {"id": "2609.16559", "category": "cond-mat", "title": "Diffusivity in Dissipative Quantum Transport from an Exactly Solvable Krylov Chain", "abstract": "The computation of transport coefficients in interacting quantum many-body systems is rarely analytically accessible. Here, we develop a new Krylov-space mechanism that makes the leading density dependent correction to Green-Kubo diffusivity \\emph{exactly} calculable in the strong-dissipation regime of a one-dimensional noisy spin-$\\frac{1}{2}$ XXZ chain. This is done by showing that the density-polarization-dressed bond coherence generates a Krylov subspace where repeated action of the dissipator closes exactly on an explicitly identifiable operator family. Within this subspace, the dissipative dynamics is then mapped onto a self-similar semi-infinite chain with a boundary defect. Surprisingly, \\emph{all} Lanczos coefficients of the Krylov chain and its boundary Green's function can be determined exactly. The latter then determines the exact leading density-dependent correction to the diffusivity. Finally, we calculate analytically the full boundary-to-bulk Green's function and find that it decays exponentially along the emergent Krylov chain.", "url": "https://arxiv.org/abs/2609.16559", "type": "理论", "summary": "1. 该工作在一维噪声自旋-1/2 XXZ链强耗散区，构建Krylov空间机制，精确计算Green-Kubo扩散系数的主导密度依赖修正。\n2. 其卖点在于密度极化修饰的键相干性生成闭合Krylov子空间，耗散动力学映射为带缺陷自相似半无限链，边界格林函数及Lanczos系数可精确求解。\n3. 该工作给出扩散系数精确密度修正，并发现边界-体格林函数沿Krylov链指数衰减，为强耗散量子输运的解析处理提供范例。", "summary_source": "deepseek", "authors": [{"name": "Zhi-Li Zhou"}, {"name": "Jorge Noronha"}], "featured_authors": [{"name": "Zhi-Li Zhou"}, {"name": "Jorge Noronha"}], "author_count": 2}, {"id": "2609.16583", "category": "cond-mat", "title": "Adsorbing Boundaries Stratify the Kinetics of Confined Colloidal Phase Separation", "abstract": "Phase separation in network-forming materials couples mass transport to mechanical relaxation, yet how adsorbing boundaries reshape this coupling remains unclear. We compare fluid-particle-dynamics simulations resolving solvent hydrodynamics with free-draining Brownian dynamics for attractive colloids confined between parallel walls. Adsorbing boundaries do not slow coarsening uniformly but stratify the network into spatially distinct kinetic regimes. With hydrodynamics, the self-similar central network exhibits growth consistent with poroelastic relaxation, Lb~t^(1/2), whereas the adsorbed region follows an effective Lw~t^(1/3) law. In free-draining dynamics, central coarsening approaches t^(1/3), while the boundary exponent remains time dependent over the accessible times. Direction-resolved displacements reveal suppressed wall-normal motion and reduced lateral mobility near the walls. Increasing wall attraction connects adsorbed islands into an extended layer while leaving local dense-phase packing nearly unchanged. For island-like domains, we propose a testable encounter-controlled scaling framework linking boundary growth to domain geometry, size-dependent mobility, and evolving adsorbed mass. Locally self-similar central coarsening thus coexists with distinct or nonstationary boundary kinetics, precluding a common dynamic-scaling length for the central and adsorbed regions over the accessible times; in both regions, the growth law depends on whether solvent hydrodynamics is resolved.", "url": "https://arxiv.org/abs/2609.16583", "type": "理论+数值", "summary": "1. 该工作用分辨溶剂流体动力学的流体粒子动力学与自由排液布朗动力学，模拟平行壁间吸引胶体的受限相分离，考察吸附边界如何重塑动力学。\n2. 吸附壁并不均匀减慢粗化，而是把网络分层为空间不同的动力学区：流体力学下中心自相似网络呈 Lb~t^(1/2) 的孔弹性松弛，吸附区呈 Lw~t^(1/3)；自由排液时中心趋近 t^(1/3)，边界指数随时间变化，近壁法向运动受抑且横向迁移率降低。\n3. 对岛状畴提出可检验的相遇控制标度框架，将边界生长与畴几何、尺寸依赖迁移率及吸附质量演化联系起来，表明中心与吸附区在可及时间内无共同动态标度长度，且生长律依赖是否分辨溶剂流体力学。", "summary_source": "deepseek", "authors": [{"name": "Kui Lin"}, {"name": "Haiming Lu"}], "featured_authors": [{"name": "Kui Lin"}, {"name": "Haiming Lu"}], "author_count": 2}, {"id": "2609.16587", "category": "cond-mat", "title": "Hartree-Fock Density-Matrix Renormalization Group for Very Long Chains", "abstract": "We formulate Hartree--Fock as a density-matrix renormalization group (DMRG) sweep of a single Slater determinant, assuming a density--density electron--electron interaction. We compress the occupied state and long-range interaction separately, reducing each sweep step to a small local Fock problem. Exchange is retained throughout. Uniform antiferromagnetic hydrogen chains provide an almost ideal setting for this approach, while retaining the Coulomb interaction and its $1/r$ tail. We initialize and converge a chain of 100,000 electrons in 1.8 million spatial basis functions in about two hours on a 64-GB Mac mini, using less than a third of its memory. The work per sweep is nearly proportional to chain length, and the number of sweeps needed for convergence changes little from 1000 to 100,000 atoms. DMRG's compression of states and environments thus makes large HF calculations with long-range Hartree and exchange practical on an ordinary desktop computer.", "url": "https://arxiv.org/abs/2609.16587", "type": "理论+数值", "summary": "1. 该工作将Hartree-Fock表述为单Slater行列式的DMRG扫描，分别压缩占据态与长程相互作用，把每步化为小型局域Fock问题。\n2. 其关键卖点是全程保留交换并维持库仑1/r长程尾，每步代价近似正比于链长，收敛扫描数从1000到10万原子几乎不变。\n3. 这表明DMRG对态与环境的压缩可使含长程Hartree与交换的大规模HF计算在普通桌面机上实用化，为极长链研究提供启示。", "summary_source": "deepseek", "authors": [{"name": "Steven R. White"}], "featured_authors": [{"name": "Steven R. White"}], "author_count": 1}, {"id": "2609.16649", "category": "cond-mat", "title": "Total-energy-assisted Tight-binding Method Based on Density Functional Theory - Design Principles toward Transferability and Extrapolation", "abstract": "The previously proposed tight-binding method derived from the total energy has been extended within the local density approximation (TE-TB method; J. Phys. Soc. Jpn. 87, 064802 (2018)). Unlike the earlier two-parameter formulation, the present method introduces three parameters. These parameters explicitly capture local packing effects and improve transferability. Furthermore, based on physical considerations, several boundary conditions (inductive bias) are imposed on the functionals defining the tight-binding Hamiltonian and related energy functionals. The revised formalism is tested on crystalline silicon to assess the stability of the diamond structure, a monovacancy, and the (001) surface. These benchmark tests demonstrate the high transferability and reliability of the present three-parameter TE-TB design philosophy.", "url": "https://arxiv.org/abs/2609.16649", "type": "理论+数值", "summary": "1. 该工作将总能量辅助的紧束缚方法在局域密度近似下扩展为三参数TE-TB形式，并用晶硅体相、单空位与(001)表面进行基准检验。\n2. 其卖点是用三参数显式描述局域堆积效应，并对紧束缚哈密顿量及相关能量泛函施加物理边界条件以提升可迁移性。\n3. 这些基准表明该三参数设计哲学具有高可靠性与外推潜力，为跨结构紧束缚建模提供了可操作的设计原则。", "summary_source": "deepseek", "authors": [{"name": "Takeo Fujiwara"}, {"name": "Yoshiro Nohara"}, {"name": "Susumu Yamamoto"}], "featured_authors": [{"name": "Takeo Fujiwara"}, {"name": "Yoshiro Nohara"}, {"name": "Susumu Yamamoto"}], "author_count": 3}, {"id": "2609.16780", "category": "cond-mat", "title": "Topological spin textures in 2D altermagnetic chromium chalcogenides: Interplay between magnetic frustration and Dzyaloshinskii-Moriya interaction", "abstract": "Altermagnetism has recently emerged as a distinct magnetic paradigm, yet the exploration of topological spin textures within two-dimensional (2D) altermagnets remains limited. Using first-principles calculations and atomistic spin simulations, we investigate monolayer $\\mathrm{Cr_2X_2}$ and Janus monolayer $\\mathrm{Cr_2XY}$ altermagnets ($\\mathrm{X, Y}=\\mathrm{O, S, Se, Te}$, and $\\mathrm{X \\neq Y}$). Both systems exhibit strong intrinsic exchange frustration arising from competition between nearest-neighbor and further-neighbor exchange interactions. In Janus $\\mathrm{Cr_2XY}$, breaking the out-of-plane mirror symmetry additionally activates a substantial in-plane Dzyaloshinskii-Moriya interaction (DMI), mediated by the strong spin-orbit coupling of heavy chalcogen ligands. The interplay between exchange frustration and DMI gives rise to distinct frustration- and DMI-dominated regimes, while magnetic anisotropy determines the preferred spin orientation, leading to a diverse range of non-collinear states. Systematic phase-space scans and geodesic nudged elastic band (GNEB) calculations reveal two distinct mechanisms governing this interplay: a synergistic effect, in which frustration lowers the critical DMI for the onset of non-collinear states, and a competitive effect, in which frustration favors high-topological-charge states while DMI favors low-charge states. Our results establish a general framework for understanding the interplay between frustration and DMI and guiding the design of topological spin textures in two-dimensional altermagnets.", "url": "https://arxiv.org/abs/2609.16780", "type": "理论+数值", "summary": "1. 结合第一性原理与原子尺度自旋模拟，研究了单层Cr₂X₂及Janus Cr₂XY二维交错磁体中的拓扑自旋织构。\n2. 卖点在于揭示交换阻挫与本征面内DMI的协同与竞争：阻挫降低非共线态临界DMI，DMI则偏好低拓扑荷态。\n3. 该工作建立了阻挫—DMI相互作用的通用框架，为二维交错磁体中拓扑自旋织构的设计提供指导。", "summary_source": "deepseek", "authors": [{"name": "Zirui Zhang"}, {"name": "Shiwei Zhu"}, {"name": "Ruixiao Ma"}, {"name": "Qiuyao Zhang"}, {"name": "Xiaoping Wu"}, {"name": "Changsheng Song"}], "featured_authors": [{"name": "Zirui Zhang"}, {"name": "Shiwei Zhu"}, {"name": "Ruixiao Ma"}, {"name": "Qiuyao Zhang"}, {"name": "Xiaoping Wu"}, {"name": "Changsheng Song"}], "author_count": 6}, {"id": "2609.16802", "category": "cond-mat", "title": "ZStar: An automated toolkit for polarization, Born effective charges, dielectric response, and infrared and Raman spectra calculations", "abstract": "Born effective charges (BEC) link atomic displacements to polarization, connecting lattice vibrations to dielectric response and infrared activity. We present ZStar, an open-source Python toolkit that automates calculations of polarization, BEC, phonons, static and frequency-dependent dielectric response, and infrared and Raman spectra. ZStar supports calculations across all dimensionalities, including bulk crystals, two-dimensional materials, one-dimensional structures, and molecules, through an integrated workflow spanning input preparation, execution, and response analysis. Berry-phase polarization and real-space dipoles describe responses along periodic and open directions, respectively. Our unified, symmetry-adapted finite-displacement framework jointly determines BEC and zone-center force constants from the same calculations, improving computational efficiency while preserving numerical accuracy. Reusing the electronic Hamiltonian in the ABACUS+PYATB route enables Raman calculations without additional self-consistent calculations. Reproducible examples and a packaged agent skill support conventional and agent-assisted use. ZStar enables efficient, automated exploration of polarization, BEC, dielectric response, and vibrational spectra across all dimensionalities.", "url": "https://arxiv.org/abs/2609.16802", "type": "理论+数值", "summary": "1. 该工作推出开源Python工具包ZStar，将极化、玻恩有效电荷、声子、静态与频率相关介电响应以及红外和拉曼光谱的计算自动化，并覆盖体相、二维、一维和分子体系。\n2. 其技术卖点是对称适配的有限位移统一框架，可从同一组计算中联合确定玻恩有效电荷与区中心力常数，同时用Berry相位极化和实空间偶极分别处理周期与开放方向，并复用ABACUS+PYATB电子哈密顿量以省去拉曼计算的额外自洽步骤。\n3. 这为跨维度材料极化、介电响应和振动光谱的高效自动化探索提供了可复现流程，并通过打包的智能体技能支持常规与代理辅助使用。", "summary_source": "deepseek", "authors": [{"name": "Xudong Zhu"}, {"name": "Junhong Li"}, {"name": "Gan Jin"}, {"name": "Zheng Guan"}, {"name": "Lixin He"}], "featured_authors": [{"name": "Xudong Zhu"}, {"name": "Junhong Li"}, {"name": "Gan Jin"}, {"name": "Zheng Guan"}, {"name": "Lixin He"}], "author_count": 5}, {"id": "2609.16821", "category": "cond-mat", "title": "Odd diffusion and power-law correlations in chiral mass-transport processes", "abstract": "We study mass-conserving Markov jump processes on a square lattice, where masses hop with a preferred rotational sense, thus breaking both time-reversal and mirror symmetries. We consider closed systems with both periodic and open (reflecting) boundaries, the latter supporting a steady-state edge current. We show that odd diffusion, arising from the chiral transport, generically provides a mechanism for the emergence of scale-invariant two-point density correlations in nonequilibrium steady states even in the presence of lattice rotation symmetry -- a mechanism that is qualitatively distinct from the well-known mechanism of anisotropic hopping. We exactly calculate the steady-state equal-time density-density correlations, which exhibit an algebraic decay, $C(\\mathbf{r}) \\sim |\\mathbf{r}|^{-4}$ for $|\\mathbf{r}| \\gg 1$. This algebraic behavior results from the interplay between the off-diagonal components of the diffusion and mobility tensors, demonstrating that chiral transport alone can generate power-law correlations in isotropic driven systems. Remarkably, the structure factor in the zero-wavenumber limit and the amplitude of the power laws depend nontrivially on chirality. While increasing chirality initially suppresses large-scale density fluctuations, the fluctuations beyond a threshold odd-diffusion strength vary nonmonotonically with chirality and develop a cusp singularity.", "url": "https://arxiv.org/abs/2609.16821", "type": "理论", "summary": "1. 该工作研究方格子上保质量的手性马尔可夫跳跃过程：粒子偏好旋转方向跳跃，破坏时间反演与镜像对称，并考察周期及反射边界下的稳态边缘流。\n2. 其核心是揭示手性输运导致的奇扩散可在保持晶格旋转对称的非平衡稳态中产生尺度不变的两点密度关联，并严格算出等时关联按 C(r)∼|r|^{-4} 代数衰减，源于扩散与迁移率张量非对角分量的耦合。\n3. 这表明仅靠手性输运即可在各向同性驱动系统中生成幂律关联，零波数结构因子与幂律幅度非平庸依赖手性；手性增强先抑制大尺度涨落，超过阈值后涨落非单调并出现尖点奇异性。", "summary_source": "deepseek", "authors": [{"name": "Koushik Das"}, {"name": "Animesh Hazra"}, {"name": "Punyabrata Pradhan"}], "featured_authors": [{"name": "Koushik Das"}, {"name": "Animesh Hazra"}, {"name": "Punyabrata Pradhan"}], "author_count": 3}, {"id": "2609.16868", "category": "cond-mat", "title": "Enskog kinetic theory in a model of confined granular mixtures. Heat flux and some applications", "abstract": "This work considers the Enskog kinetic theory for moderately dense confined granular mixtures within the framework of the $\\Delta$-model, an effective collisional model that accounts for the transfer of energy from the vertical to the horizontal degrees of freedom of grains through an additional velocity increment during collisions. The main objective is to complete the Navier--Stokes hydrodynamic description of dense binary granular mixtures by explicitly determining the heat-flux transport coefficients, namely the Dufour and thermal conductivity coefficients, together with the first-order contributions to the partial temperatures and the cooling rate. These quantities are determined in the steady state from the Enskog kinetic equation by means of the Chapman--Enskog method and are expressed in terms of the masses and diameters of the particles, mixture composition, density, and coefficients of restitution. The results show that finite-density effects have a significant influence on transport, leading to behaviors that differ markedly from those observed in the dilute regime. The complete set of transport coefficients is considered further to study two different problems. First, we perform a linear stability analysis of the homogeneous steady state (HSS). The analysis demonstrates that no unstable transverse or longitudinal hydrodynamic modes are found over the parameter space explored, indicating that the HSS is linearly stable even at moderate densities. As a second problem, the violation of the Onsager reciprocal relations for a confined dense granular mixture is quantified in terms of the parameter space of the problem.", "url": "https://arxiv.org/abs/2609.16868", "type": "理论", "summary": "1. 该工作以Chapman–Enskog方法在Δ模型框架下求解中等密度受限二元颗粒混合物的Enskog方程，补全其Navier–Stokes流体描述。\n2. 主要卖点是显式给出Dufour与热导率等热流输运系数及分温度、冷却率的一阶修正，并表明有限密度效应使输运显著偏离稀薄极限。\n3. 该完整系数集用于均匀稳态的线性稳定性分析并量化Onsager倒易关系的破坏，显示中等密度下稳态仍线性稳定。", "summary_source": "deepseek", "authors": [{"name": "David González Méndez"}, {"name": "Vicente Garzó Puertos"}], "featured_authors": [{"name": "David González Méndez"}, {"name": "Vicente Garzó Puertos"}], "author_count": 2}, {"id": "2609.16935", "category": "cond-mat", "title": "Nonlocal Magic across the Many-Body Localization Crossover", "abstract": "Nonlocal magic quantifies the minimum nonstabilizerness attainable under independent local unitary transformations on the two subsystems. Here, we use min-relative nonlocal magic (NLM) to characterize the crossover from ergodicity to many-body localization (MBL) in the random-field XXZ chain. Unlike entanglement entropy, NLM probes how entanglement is organized through the distance of the Schmidt spectrum from dyadic-flat stabilizer spectra. From weak to intermediate disorder, NLM evolves from an $O(1)$ Haar-like value into a size-enhanced dome, while entanglement remains volume-law, revealing a spectral reorganization not visible in the entropy. Deep in the MBL regime, a two-level cut-hybridization model captures the nearly binary Schmidt spectrum and explains why the mean and median NLM decay approximately as $W^{-1}$ and $W^{-2}$, respectively. Following a product-state quench, NLM overshoots and relaxes in the ergodic regime, whereas at strong disorder it grows slowly and approximately logarithmically. These results show that NLM resolves Schmidt-spectrum structure not visible in the entanglement entropy and provides a complementary probe of ergodicity breaking.", "url": "https://arxiv.org/abs/2609.16935", "type": "理论", "summary": "1. 该工作用最小相对非局域魔法（NLM）刻画随机场XXZ链中从遍历性到多体局域化（MBL）的过渡。\n2. 其卖点是以NLM度量Schmidt谱偏离二进平坦稳定子谱的程度，在熵仍为体积律时揭示谱重组，并用两能级模型解释深MBL区W^{-1}、W^{-2}衰减。\n3. 这表明NLM可作为遍历性破缺的互补探针；乘积态淬火后，NLM在遍历区过冲并弛豫，在强无序区近似对数慢增长。", "summary_source": "deepseek", "authors": [{"name": "Shan-Zhong Li"}, {"name": "Zhi Li"}], "featured_authors": [{"name": "Shan-Zhong Li"}, {"name": "Zhi Li"}], "author_count": 2}, {"id": "2609.17005", "category": "cond-mat", "title": "Odd slip at chiral active surfaces", "abstract": "Odd slip at solid-liquid interfaces, characterized by a velocity component perpendicular to the applied shear stress, introduces a novel class of odd transport phenomena with transverse momentum transfer at boundaries, distinct from odd viscosity, odd elasticity, or odd diffusivity. This effect arises on chiral active surfaces with persistent energy input and defined handedness, such as carpets of rotating biological or synthetic cilia with flexible anchoring. Although odd slip itself is dissipationless, its maintenance comes at an energetic cost, which we estimate from the microscopic model. With respect to its orientation dependence, odd slip can be classified as pseudo-scalar or pseudo-vectorial. We use a perturbative expansion to determine the resistance tensors of problems with different levels of broken symmetries. They reveal how the surface chirality and body asymmetry together violate the Onsager symmetry, but uphold the Onsager-Casimir reciprocity. Strikingly, suspensions of particles with odd slip embedded in a conventional Newtonian bulk fluid exhibit odd viscosity, providing a new minimal mechanism for its emergence beyond current microscopic models.", "url": "https://arxiv.org/abs/2609.17005", "type": "理论", "summary": "1. 该工作提出并刻画手性活性固液界面上的奇滑移，即剪切应力诱导垂直速度分量，并建立边界横向动量输运框架。\n2. 其核心是用微扰展开得到不同对称破缺下的阻力张量，揭示手性与体不对称破坏昂萨格对称却保持昂萨格-卡西米尔互易。\n3. 这为奇粘性提供超越现有微观模型的最小机制，并暗示手性活性界面可调控边界横向输运与悬浮流变。", "summary_source": "deepseek", "authors": [{"name": "Yuto Yosaka"}, {"name": "Andrej Vilfan"}], "featured_authors": [{"name": "Yuto Yosaka"}, {"name": "Andrej Vilfan"}], "author_count": 2}, {"id": "2609.17047", "category": "cond-mat", "title": "Trajectory Statistics Govern Mechanical Power Transfer in Active Baths", "abstract": "The mechanical response of a moving probe in an active bath reflects both the dynamics of the bath and how the probe couples to it. For a probe moving at velocity $\\mathbf V$ and interacting weakly with an ideal active bath, we show that the trajectory statistics of a free bath particle determine a density response from which the bath force on the probe follows. The probe-particle interaction determines how this response is weighted over wave vector $\\mathbf q$, while the probe motion selects frequencies $\\omega_{\\mathbf q}=\\mathbf q\\cdot \\mathbf V$. This trajectory-response relation separates the bath dynamics from the wave-vector weighting, so neither the stationary state nor force correlations need to be recalculated for each probe interaction and velocity. Applying this relation to active-particle models, we prove that positive power transfer is excluded for active Ornstein--Uhlenbeck particles in all dimensions and for complete-reset run-and-tumble particles in $d\\geq2$, while one-dimensional run-and-tumble particles and two-dimensional active Brownian particles possess modes that can transfer positive mechanical power. For a given probe, this response predicts drag reversal, spontaneous probe motion, and motion-induced density distortions, all in quantitative agreement with simulations. Varying the probe geometry changes how the same bath response is weighted, thereby selecting different moving states. Beyond the leading weak-probe, ideal-bath limit, higher orders in probe strength involve multi-interval trajectory statistics, while finite-density corrections involve interacting-particle dynamics. Our results connect the trajectory statistics of active bath particles to the mechanical response of a passive probe, providing a route to predict probe response from single-particle trajectory statistics measured in the absence of the probe.", "url": "https://arxiv.org/abs/2609.17047", "type": "理论+数值", "summary": "1. 活动浴中移动探头的机械响应反映了浴的动态以及探头与其耦合的方式。\n2. 对于给定的探针，该响应预测阻力反转、探针自发运动和运动引起的密度变形，所有这些都与模拟定量一致。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Chul-Ung Woo"}, {"name": "Jiwon Choi"}, {"name": "Heiko Rieger"}], "featured_authors": [{"name": "Chul-Ung Woo"}, {"name": "Jiwon Choi"}, {"name": "Heiko Rieger"}], "author_count": 3}, {"id": "2609.17069", "category": "cond-mat", "title": "Interplay of dimerization and quasiperiodicity in the superconducting proximity effect of a one-dimensional hybrid ring", "abstract": "Recent studies of the superconducting proximity effect in quasicrystalline and topological systems have opened up a new research direction for exploring how quasiperiodicity and topology influence proximity induced superconductivity. In this work, we investigate spatial variation of the proximity induced pairing amplitude in a hybrid ring composed of a spin singlet superconductor and a normal region described by three different lattice models using the self-consistent Bogoliubov-de Gennes formalism. We first consider the normal region described by the diagonal Aubry-André-Harper (AAH) model. Increasing the quasiperiodic potential enhances spatial fluctuations in the induced order parameter, while progressively suppressing its magnitude in the normal region. Beyond the localization transition, proximity-induced pairing is strongly diminished due to the localized nature of the underlying electronic states. The normal region is then modeled by the Su-Schrieffer-Heeger (SSH) chain to investigate the effect of hopping dimerization. Weak dimerization introduces oscillatory modulations in the induced pairing that extend deep into the normal region, whereas strong dimerization confines these oscillations and significantly reduces the penetration of superconducting correlations. Finally, we study the combined SSH-AAH model to explore the interplay between the dimerized hopping and quasiperiodicity. The results show that the SSH dimerization determines the oscillatory behavior and penetration of the induced pairing, while the AAH potential enhances spatial inhomogeneity and further reduces its magnitude. Together, these two effects provide a versatile means of controlling proximity-induced superconductivity in quasiperiodic hybrid systems.", "url": "https://arxiv.org/abs/2609.17069", "type": "理论", "summary": "1. 该工作用自洽BdG形式，研究自旋单重态超导体与正常区组成的一维杂化环中邻近诱导配对振幅的空间变化，正常区分别取AAH、SSH及SSH-AAH晶格模型。\n2. 其核心发现是揭示二聚化与准周期性的分工：SSH二聚化决定诱导配对的振荡行为与穿透深度，弱二聚化使振荡深入正常区，强二聚化则局域振荡并显著降低超导关联穿透；AAH势增强空间不均匀性并压低配对幅度，超过局域化转变后电子态局域使邻近配对明显减弱。\n3. 这两种效应共同为在准周期杂化系统中调控邻近诱导超导电性提供了通用手段，并对理解准周期性与拓扑如何影响近邻配对具有启发意义。", "summary_source": "deepseek", "authors": [{"name": "Sourav Karmakar"}, {"name": "Santanu K. Maiti"}], "featured_authors": [{"name": "Sourav Karmakar"}, {"name": "Santanu K. Maiti"}], "author_count": 2}, {"id": "2609.17080", "category": "cond-mat", "title": "La substitution studies on the heavy-fermion superconductor CeRh$_2$As$_2$", "abstract": "CeRh$_2$As$_2$ has been receiving considerable attention due to its unusual two-phase superconductivity. The superconducting (SC) phase appears at $T_{\\mathrm{c}}$ = 0.35 K in an ordered state (phase I) of the Ce-4$f$ moments, which develops below $T_{\\mathrm{0}}$ = 0.55 K. The microscopic nature of phase I has not been fully established yet. We report a single-crystal study of the effect of La substitution on these low-temperature phases in Ce$_{1-\\textit{x}}$La$_\\textit{x}$Rh$_2$As$_2$ up to $x$ = 0.1. The lattice parameters increase monotonically with $x$, corresponding to an effective negative pressure of approximately -0.3 GPa for $x$ = 0.1. While the Ce$^{3+}$ local valence state and the non-Fermi-liquid behavior are preserved, the resistivity coherence maximum $T^{*}_{\\mathrm{max}}$ $\\approx$ 45 K in the pristine sample shifts to lower temperatures with increasing $x$, indicating a suppression of the Kondo energy scale upon lattice expansion. On the other hand, both $T_{\\mathrm{c}}$ and $T_{\\mathrm{0}}$ are rapidly suppressed to below 0.1 K for $x$ $>$ 0.05. Notably, such a rapid decrease of $T_{\\mathrm{c}}$ under moderate negative pressure is unexpected, but is rather consistent with substitution-induced disorder effect which leads to strong pair breaking in unconventional superconductors. The observed fragility of phase I under both pressure and disorder may imply its itinerant origin.", "url": "https://arxiv.org/abs/2609.17080", "type": "理论", "summary": "1. 该工作通过单晶输运测量研究了La替代（x≤0.1）对重费米子超导体CeRh2As2中Tc=0.35 K超导相与T0=0.55 K Ce-4f有序相的影响。\n2. 其主要结果是晶格随x单调膨胀、对应约-0.3 GPa等效负压，Ce3+局域价态与非费米液体行为保持，而Kondo能标T*max≈45 K下移，且Tc与T0在x>0.05被快速压制至0.1 K以下。\n3. 温和负压下Tc的快速消失不符合单纯压力预期，更支持La替代无序导致的强配对破缺，并暗示相I可能具有巡游起源，为后续区分压力与无序效应提供约束。", "summary_source": "deepseek", "authors": [{"name": "Sushma Lakshmi Ravi Sankar"}, {"name": "Manuel Brando"}, {"name": "Jochen Wosnitza"}, {"name": "Seunghyun Khim"}], "featured_authors": [{"name": "Sushma Lakshmi Ravi Sankar"}, {"name": "Manuel Brando"}, {"name": "Jochen Wosnitza"}, {"name": "Seunghyun Khim"}], "author_count": 4}, {"id": "2609.17097", "category": "cond-mat", "title": "Course on two-dimensional quantum gases", "abstract": "This course on two-dimensional quantum gases, prepared for the S{ã}o Paulo ICTP-SAIFR IVth School on Light and Cold Atoms, is organized into three lectures. The first introductory lecture addresses Bose-Einstein condensation in an ideal gas, the effect of interactions in the weakly interacting limit, Gross-Pitaevskii equation and its hydrodynamic formulation, as well as superfluidity. The second lecture is devoted to the main features of two-dimensional quantum gases: importance of the interactions, enhanced phase fluctuations and the emergence of a quasi long-range order, superfluidity through the Berezinskii-Kosterlitz-Thouless mechanism, scaling symmetry. The third lecture has taken the form of a seminar on fast rotating quasi two-dimensional Bose gases and thermal melting of the vortex lattice. The slides accompanying these notes can be found on the school website: this https URL .", "url": "https://arxiv.org/abs/2609.17097", "type": "理论", "summary": "1. 该讲义为光与冷原子学校整理了三讲二维量子气体课程，从理想玻色凝聚讲到旋转涡旋晶格。\n2. 其核心在于贯通弱相互作用格罗斯-皮塔耶夫斯基理论、二维相位涨落、准长程有序及贝雷津斯基-科斯特利茨-索利斯超流与标度对称性。\n3. 这为理解二维冷原子中贝雷津斯基-科斯特利茨-索利斯物理及快速旋转诱导的涡旋晶格热熔化提供了教学框架。", "summary_source": "deepseek", "authors": [{"name": "Hélène Perrin"}], "featured_authors": [{"name": "Hélène Perrin"}], "author_count": 1}, {"id": "2609.17123", "category": "cond-mat", "title": "AI for Science with GPT-6 Astra: Thermal Design and Electrothermal Analysis of 2D CFET", "abstract": "Thermal optimization of 2D CFET inverters requires testing structural proposals against their electrical costs. We examine these research tasks using an AI agent workflow within a supplied electrothermal model. At 12 nm, Astra selects a redistributed source-interconnect geometry, while a coordinating agent proposes a substrate-directed heat-removal path. The combined design reduces peak temperature rise by 1.67 K at fixed metal volume and 20 {\\mu}W. A subsequent metal-resistance sensitivity gives about 0.6-K inverter cooling alongside a 2% nFET on-current loss. Effective contact-length scaling further shows that lower temperature can accompany higher thermal resistance when current falls. Reproduction identifies agreeing implementations and retains a 104.95-K failure for diagnosis. These results show that an AI scientist workflow can propose thermal structures, test them under common constraints, and quantify their electrical cost.", "url": "https://arxiv.org/abs/2609.17123", "type": "理论+数值", "summary": "1. 该工作以 GPT-6 Astra 智能体工作流，在给定电热模型下评估 12 nm 二维 CFET 反相器的热设计及其电学代价。\n2. 其核心是 Astra 选择重分布源极互连，并由协调智能体提出衬底定向散热路径，在固定金属体积与 20 μW 下将峰值温升降低 1.67 K；金属电阻灵敏度显示约 0.6 K 降温伴随 2% nFET 开态电流损失，接触长度缩放表明电流减小时较低温度可与更高热阻共存。\n3. 这些结果表明 AI 科学家工作流能提出并在共同约束下测试热结构、量化电学成本，且复现中保留 104.95 K 失败用于诊断，为二维 CFET 电热协同设计提供可复现路径。", "summary_source": "deepseek", "authors": [{"name": "Min-Hui Kim"}, {"name": "Khushi Sharma"}, {"name": "Sarah Zhang"}, {"name": "Ye Wang"}], "featured_authors": [{"name": "Min-Hui Kim"}, {"name": "Khushi Sharma"}, {"name": "Sarah Zhang"}, {"name": "Ye Wang"}], "author_count": 4}, {"id": "2609.17166", "category": "cond-mat", "title": "Numerical Study of Stability of Clean Critical Points across Aperiodic, Topological, and Uncorrelated Disorder", "abstract": "Using the two-dimensional Ashkin-Teller (AT) model, we compare criticality on three non-periodic lattices: the Smith-hat aperiodic tiling, Voronoi-Delaunay (VD) random triangulations, and uncorrelated diluted square lattices. The decay of the block-averaged coordination fluctuation $\\sigma_Q$ with exponent $\\alpha$ is used to describe the connectivity disorder. The first two lattices share the same exponent $\\alpha$, which differs from that of the third. We consider the regime where the correlation-length exponent $\\nu<1$, where randomness is relevant according to the Harris criterion $d \\nu \\le 2$, but should be irrelevant in cases of the Smith-hat tiling and VD triangulations, where $\\alpha \\nu >1$, according to the Harris--Barghathi--Vojta (HBV) criterion. For the diluted lattice, we indeed find that the clean universality behavior breaks down along the entire critical line, indicating a crossover to a fixed line dominated by disorder, in line with both the Harris criterion and the HBV criterion. In contrast, both VD and Smith-hat lattices display critical exponents consistent with the clean AT universality class, as validated by a Coulomb-gas self-consistency check, violating the Harris criterion while conforming to the HBV criterion.", "url": "https://arxiv.org/abs/2609.17166", "type": "理论+数值", "summary": "1. 该工作用二维Ashkin-Teller模型数值比较Smith-hat非周期镶嵌、Voronoi-Delaunay随机三角化与无关联稀释方格上的临界行为，检验清洁临界点稳定性。\n2. 其关键是用块平均配位数涨落σ_Q的衰减指数α刻画连接性无序：稀释格点整条临界线偏离清洁Ashkin-Teller普适类并流向无序主导不动线，而Smith-hat与Voronoi-Delaunay镶嵌仍保持清洁临界指数，且经Coulomb-gas自洽检验。\n3. 这表明在ν<1时，α ν>1的HBV判据可正确预言非周期与随机三角化中清洁临界性对无序的稳定性，为拓扑/非周期格点保护普适行为提供启示。", "summary_source": "deepseek", "authors": [{"name": "Shuhao Fan"}, {"name": "Lu Liu"}, {"name": "Wenan Guo"}], "featured_authors": [{"name": "Shuhao Fan"}, {"name": "Lu Liu"}, {"name": "Wenan Guo"}], "author_count": 3}, {"id": "2609.17213", "category": "cond-mat", "title": "Latent kinetic Ising models of neural spike trains", "abstract": "Inferring directed effective interactions from neuronal spike trains is a central inverse problem in statistical physics and computational neuroscience. Kinetic Ising models provide a tractable framework for this task, but their application to neural data typically requires binning spike trains into binary activity variables, discarding within-bin timing and conflating collective network dynamics with single-neuron history effects. We introduce SpiKIsing, a latent-variable model that separates these two levels of description. A discrete-time asymmetric kinetic Ising model describes collective network activity, while continuous-time, history-dependent point processes generate the observed spikes conditional on the latent states, accounting explicitly for refractoriness and post-spike recovery. We derive a variational mean-field expectation-maximization scheme in which the point-process likelihood enters as an effective observation field, enabling joint inference of latent activity, network couplings, and emission parameters. The framework extends naturally to maximum-a-posteriori inference with structured priors, including sparsity and a hierarchical extension favouring Dale-consistent outgoing interactions. We validate parameter recovery on matched synthetic data and test the method on spike trains generated by a recurrent conductance-based leaky integrate-and-fire network. In this setting, SpiKIsing recovers sparse connection structure and correctly classifies all excitatory and inhibitory neurons despite the substantial mismatch between the data-generating dynamics and the SpiKIsing model.", "url": "https://arxiv.org/abs/2609.17213", "type": "理论+数值", "summary": "1. 该工作提出SpiKIsing潜变量动力学Ising模型，从神经元脉冲序列推断有向有效相互作用，将离散时间非对称Ising描述的集体网络活动与连续时间、依赖历史的点过程发放分离。\n2. 其卖点是变分平均场EM方案，将点过程似然作为有效观测场，联合推断潜在活动、网络耦合和发放参数，并可扩展至稀疏先验及偏好Dale一致输出连接的分层MAP推断。\n3. 在合成数据及电导型泄漏积分发放网络数据上，该方法恢复稀疏连接结构并正确分类兴奋性与抑制性神经元，表明潜变量建模可缓解脉冲分箱与历史效应混淆，为神经回路有效连接推断提供可行路径。", "summary_source": "deepseek", "authors": [{"name": "Davide Ghio"}, {"name": "David Saad"}], "featured_authors": [{"name": "Davide Ghio"}, {"name": "David Saad"}], "author_count": 2}, {"id": "2609.17239", "category": "cond-mat", "title": "Quantum Brownian motion in a temperature gradient", "abstract": "When a classical Brownian particle is subjected to a temperature gradient it can undergo thermophoresis, i.e., the particle gets transported towards the colder regions of the environment, which bears relevant consequences to nonequilibrium self-organization. Here, we investigate how the quantum Brownian motion is affected by a temperature gradient. We employ a recently proposed generalized system-plus-reservoir model, where one assumes a continuum field of thermal baths. As our main result, we obtain the quantum influence functional, within the Feynmann-Vernon path integral approach. To test convergence, we derive an effective Langevin equation for the center of mass of the quantum wavepacket, and show that it coincides with the classical Langevin equation at high temperatures. Both the fully quantum (low temperatures) and the semiclassical (high temperature) limits show signatures of quantum thermophoresis in the quantum Brownian motion, a so far unexplored effect.", "url": "https://arxiv.org/abs/2609.17239", "type": "理论", "summary": "1. 该工作研究量子布朗粒子在温度梯度下的动力学，采用广义系统-热库模型，其中热库为连续场，并借助费曼-弗农路径积分推导量子影响泛函。\n2. 其核心在于得到量子影响泛函，并通过导出量子波包质心的有效朗之万方程验证收敛性，证明高温下与经典朗之万方程一致。\n3. 结果表明低温全量子与高温半经典极限均出现量子热泳特征，这揭示了一种此前未被探索的非平衡量子输运效应，可启发量子热力学与自组织研究。", "summary_source": "deepseek", "authors": [{"name": "Ricardo J. S. Afonso"}, {"name": "Pedro V. Paraguassú"}, {"name": "Thiago Werlang"}, {"name": "Daniel Valente"}], "featured_authors": [{"name": "Ricardo J. S. Afonso"}, {"name": "Pedro V. Paraguassú"}, {"name": "Thiago Werlang"}, {"name": "Daniel Valente"}], "author_count": 4}, {"id": "2609.17289", "category": "cond-mat", "title": "Self-balancing luminescence kinetics of charged excitons in WS$_2$ monolayer", "abstract": "Two-dimensional tungsten-based transition metal dichalcogenides exhibit a rich emission spectrum with distinct lines of exciton and biexciton states, neutral and charged, which are typically considered as independent entities. Here, we present a study of the emission kinetics of a WS$_2$ monolayer, demonstrating that these states together form a single interacting ensemble, with their population and depletion mutually coordinated with temperature. Dark trions make a long-lived contribution to the bright trion on a time scale of 200-300 picoseconds, and replenishment from dark states promotes intense luminescence of charged biexcitons. The developed self-consistent rate equation model reproduces the temperature dependence of the kinetics well, opening the way to controlling exciton states in such materials.", "url": "https://arxiv.org/abs/2609.17289", "type": "理论", "summary": "1. 该工作在WS₂单层中开展发光动力学研究，表明中性/带电激子与双激子并非独立实体，而是构成布居和耗竭相互协调的单一相互作用系综。\n2. 关键机制是暗三子在200–300 ps尺度向亮三子长寿命补给，暗态再填充进一步促进带电双激子强发光，且温度同步调节这些过程。\n3. 自洽速率方程模型成功再现动力学温度依赖，为利用暗态和温度调控二维TMD中激子态并探索其光电器件应用提供了可检验路径。", "summary_source": "deepseek", "authors": [{"name": "A.I. Veretennikov"}, {"name": "A.I. Galimov"}, {"name": "M.M. Glazov"}, {"name": "T.V. Shubina"}], "featured_authors": [{"name": "A.I. Veretennikov"}, {"name": "A.I. Galimov"}, {"name": "M.M. Glazov"}, {"name": "T.V. Shubina"}], "author_count": 4}, {"id": "2609.17329", "category": "cond-mat", "title": "Integrated quantum-secured cryptographic memory in customizable single nanodiamonds", "abstract": "As advanced physical cloning and cyber-extraction techniques proliferate, achieving absolute hardware-level information security has become a paramount global challenge. Conventional architectures systems are fundamentally vulnerable because deterministic memory and cryptographic hardware are physically decoupled, exposing sensitive data to interception. While physical unclonable functions (PUFs) offer robust authentication, integrating them with high-density data writing within a unified nanoscale medium remains elusive. Here, we present an intrinsically secure all-in-one architecture that inextricably fuses high-dimensional data encoding with multiscale physical encryption within single nanodiamonds (NDs). Through precise focused-electron-beam irradiation, we achieve single-nanoparticle defect engineering, enabling deterministic base-36 data writing within individual NDs. Crucially, this customized memory layer is permanently locked within the medium's inherent stochasticity, combining macroscopic spatial PUFs with strictly irreproducible atomic-scale quantum fingerprints extracted via optically detected magnetic resonance (ODMR). By seamlessly embedding deterministic memory into an unclonable physical environment, our approach intrinsically eliminates the vulnerabilities of separated hardware, providing an unconditionally secure solid-state foundation for tamper-proof memory chips, zero-trust networks and next-generation data vaults.", "url": "https://arxiv.org/abs/2609.17329", "type": "理论", "summary": "1. 该工作提出并实现了一种在单个纳米金刚石中融合高维数据编码与多尺度物理加密的一体化架构，利用聚焦电子束辐照进行单颗粒缺陷工程，实现确定性的36进制数据写入。\n2. 其关键卖点在于将可定制存储层永久锁定于介质固有随机性中，把宏观空间物理不可克隆函数与通过ODMR提取的严格不可复制的原子尺度量子指纹相结合，使确定性存储与不可克隆认证在同一纳米介质内不可分割。\n3. 这一策略从物理层面消除了存储与加密硬件分离带来的截获漏洞，为防篡改存储芯片、零信任网络和下一代数据保险库提供了无条件安全的固态基础，并启示以量子缺陷指纹构建硬件信任根。", "summary_source": "deepseek", "authors": [{"name": "Tongtong Zhang"}, {"name": "Jiaqi Li"}, {"name": "Zhiqin Chu"}], "featured_authors": [{"name": "Tongtong Zhang"}, {"name": "Jiaqi Li"}, {"name": "Zhiqin Chu"}], "author_count": 3}, {"id": "2609.17378", "category": "cond-mat", "title": "Exact solutions of nonreciprocal Su-Schrieffer-Heeger model with domain walls", "abstract": "We investigate domain-wall physics in a non-Hermitian Su-Schrieffer-Heeger model featuring the non-Hermitian skin effect and its higher-dimensional extensions, focusing on analytical eigenstate solutions under open boundary conditions. By gluing two Su-Schrieffer-Heeger chains with inverted coupling ratios together, we identify two distinct interface geometries, and derive closed-form quantization conditions for the complex wave number and wave functions using symmetry-based ansatzes. Besides conventional skin modes and topological zero modes, the domain walls generate additional localized states at finite energy that detach from the bulk open-boundary-condition continuum. We validate the analytical results by exact diagonalization, and further generalize the interface construction to a two-dimensional Lieb lattice, where competing nonreciprocities produce tunable funneling regimes towards codimension-one and codimension-two interfaces.", "url": "https://arxiv.org/abs/2609.17378", "type": "理论+数值", "summary": "1. 该工作解析研究了具有非互易耦合与趋肤效应的非厄米SSH模型中的畴壁物理，通过拼接耦合比反转的两条链并针对开边界条件求解本征态。\n2. 其核心在于用对称性拟设给出复波数与波函数的闭式量子化条件，发现除常规趋肤模和拓扑零模外，畴壁还可产生脱离体开边界连续谱的有限能局域态，并经精确对角化验证。\n3. 该框架可推广到二维Lieb晶格，通过竞争非互易性实现向余维一和余维二界面的可调漏斗，为高阶非厄米界面态与定向输运提供启示。", "summary_source": "deepseek", "authors": [{"name": "Tong Wang"}, {"name": "Mengjie Yang"}, {"name": "Flore K. Kunst"}], "featured_authors": [{"name": "Tong Wang"}, {"name": "Mengjie Yang"}, {"name": "Flore K. Kunst"}], "author_count": 3}, {"id": "2609.17433", "category": "cond-mat", "title": "Nonlinear electron-phonon interactions from first principles", "abstract": "Electron-phonon interactions underpin a variety of phenomena, ranging from transport and superconductivity to polarons and ultrafast carrier dynamics. Despite being one of the most intensely studied subjects in condensed matter physics, research on electron-phonon physics mostly focused on linear, first-order couplings. Second- and higher-order nonlinear couplings are commonly ignored because their calculations are too demanding and we lack computational frameworks that can provide both diagonal and off-diagonal coupling matrix elements. In this work, we report a theory and computational method for computing nonlinear electron-phonon interactions of any order in real materials. Our approach combines the advantages of unit-cell calculations of electron wavefunctions and supercell calculations of phonon perturbations, is systematically improvable, can be used with either semilocal or nonlocal exchange-correlation functionals, and is amenable to Wannier-Fourier interpolation. As a first proof of concept, we illustrate this method by computing second-order electron-phon
