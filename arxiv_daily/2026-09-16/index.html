on coupling matrix elements in diamond, lithium fluoride, and graphite as representative nonpolar semiconductors, polar semiconductors, and metals, respectively. Furthermore, we generalize the ab initio polaron equations to second-order electron-phonon couplings, and we show that second-order couplings are essential to achieve quantitative accuracy in polaron formation energies and hopping barriers. The present methodology will find application in the study of all properties and phenomena that are currently being investigated within the linear electron-phonon coupling approximation, from phonon-mediated superconductivity to excited-states dynamics, both in harmonic and anharmonic systems.", "url": "https://arxiv.org/abs/2609.17433", "type": "理论+数值", "summary": "1. 该工作提出了计算真实材料中任意阶非线性电子-声子耦合的第一性原理理论与计算方法。\n2. 其技术优势在于结合原胞电子波函数与超胞声子微扰，可系统改进、兼容半局域或非局域交换关联泛函并支持万尼尔-傅里叶插值；以金刚石、氟化锂和石墨为例验证二阶耦合矩阵元，并将第一性原理极化子方程推广至二阶耦合，表明二阶项对极化子形成能与跳跃势垒的定量精度不可或缺。\n3. 这为在线性电子-声子耦合近似下研究的声子介导超导、激发态动力学等性质提供了向非线性与非谐体系扩展的通用途径。", "summary_source": "deepseek", "authors": [{"name": "Zhenbang Dai"}, {"name": "Feliciano Giustino"}], "featured_authors": [{"name": "Zhenbang Dai"}, {"name": "Feliciano Giustino"}], "author_count": 2}, {"id": "2609.17477", "category": "cond-mat", "title": "Bias-Induced Crossover in Absolute Capacity of Dense Associative Memory", "abstract": "The absolute capacity of dense associative memory has mainly been analyzed for unbiased patterns. Here we examine the effect of bias in centered binary patterns under the Krotov-Hopfield single-site criterion $P_{\\mathrm{error}}=1/N$, where $P_{\\mathrm{error}}$ is the probability that a single-site flip lowers the energy of a stored pattern and $N$ is the number of neurons. Each pattern component takes $1-q$ with probability $q$ and $-q$ otherwise, where $0<q\\le1/2$. For polynomial interactions of order $n$, a signal-to-noise analysis gives an absolute capacity of order $N^{n-1}/\\ln N$ at $q=1/2$. For fixed $q<1/2$, however, the capacity is $O(N^{n/2})$ for even $n\\ge4$ and $O(N^{(n+1)/2})$ for odd $n\\ge5$. For $n=3$, both the unbiased and fixed-bias capacities remain $O(N^2/\\ln N)$. For $n\\ge4$, these different asymptotic forms imply a nonuniform large-$N$ limit near $q=1/2$. Asymptotic matching predicts a bias-induced crossover in the region $1-2q=O(\\ln N/N^{\\lfloor n/2\\rfloor-1})$. The crossover originates from a bias-dependent crosstalk mean that reduces the stability of sites carrying the more frequent value $-q$. Computer simulations are compared with the finite-size conditioned-Gaussian predictions. An activity-dependent control potential that cancels the conditional crosstalk mean restores the $N^{n-1}/\\ln N$ capacity for fixed $0<q<1/2$ within the conditioned-Gaussian approximation.", "url": "https://arxiv.org/abs/2609.17477", "type": "理论+数值", "summary": "1. 该工作研究中心化二值模式偏置对密集联想记忆绝对容量的影响，在Krotov-Hopfield单点判据 P_error=1/N 下令分量以概率 q 取 1-q、否则取 -q（0<q≤1/2）。\n2. n 阶多项式相互作用的信号噪声分析表明，q=1/2 时容量为 N^{n-1}/ln N；固定 q<1/2 时偶数 n≥4 为 O(N^{n/2})、奇数 n≥5 为 O(N^{(n+1)/2})，n=3 仍为 O(N^2/ln N)，且 q=1/2 附近出现非一致大 N 极限和偏置诱导交叠。\n3. 交叠区满足 1-2q=O(ln N/N^{⌊n/2⌋-1})，源于偏置相关串扰均值降低 -q 位点稳定性；条件高斯近似下用活动依赖控制势抵消该均值可恢复 N^{n-1}/ln N 容量。", "summary_source": "deepseek", "authors": [{"name": "Yuto Sakurai"}, {"name": "Takeaki Shimokawa"}, {"name": "Kazunori Iwata"}, {"name": "Kazushi Mimura"}], "featured_authors": [{"name": "Yuto Sakurai"}, {"name": "Takeaki Shimokawa"}, {"name": "Kazunori Iwata"}, {"name": "Kazushi Mimura"}], "author_count": 4}, {"id": "2609.17514", "category": "cond-mat", "title": "Molecular Decomposition of the Area Compressibility Modulus of Lipid Membranes", "abstract": "The area compressibility modulus is a key descriptor of lipid membrane mechanics, but the molecular interactions that determine this elasticity are not evident from the total modulus alone. Here, molecular dynamics simulations of a POPC bilayer described by the coarse-grained Martini 3 force field were combined with virial stress analysis to decompose the area compressibility modulus into contributions from molecular groups and their interactions. Partial lateral tensions were evaluated as functions of membrane area strain, and their derivatives at the equilibrium state were used to obtain the corresponding contributions to the area compressibility modulus. Hydrocarbon chains provided the dominant positive contribution, accounting for approximately 70% of the total modulus, whereas water-lipid interactions contributed approximately 30%, predominantly through water-headgroup interactions. Within the bilayer, the headgroup and headgroup-chain contributions were of similar magnitude but opposite in sign and nearly canceled. Direct intermonolayer interactions contributed only about 3% of the bilayer-only modulus, indicating an almost additive elastic response of the two monolayers. The hierarchy of elastic contributions differed markedly from that of equilibrium partial tensions, showing that interactions responsible for static stress balance are not necessarily those governing membrane stiffness. This decomposition provides a microscopic interpretation of lipid bilayer area elasticity.", "url": "https://arxiv.org/abs/2609.17514", "type": "数值", "summary": "1. 该工作以Martini 3粗粒化分子动力学结合维里应力分析，将POPC双层的面积压缩模量分解为各分子基团及其相互作用的贡献。\n2. 通过对部分侧向张力关于面积应变的导数求得模量贡献，发现碳氢链贡献约70%，水-脂相互作用约30%（主要为水-头基），头基与头基-链项量级相近、符号相反而近乎抵消，单层间直接作用仅约3%，表明双层弹性近似为两单层加和。\n3. 弹性贡献层级与平衡部分张力层级明显不同，表明维持静态应力平衡的相互作用未必决定膜刚度，为脂双层面积弹性提供了微观解释。", "summary_source": "deepseek", "authors": [{"name": "Konstantin V. Pinigin"}], "featured_authors": [{"name": "Konstantin V. Pinigin"}], "author_count": 1}, {"id": "2609.16103", "category": "hep-th", "title": "A LooKK at the Higuchi Bound", "abstract": "Massive spin 2 fields on de Sitter must satisfy the Higuchi bound, $m^2\\geq 2H^2$. Compactifications of higher dimensional gravity to $\\mathrm{dS}_4$ come with a tower of Kaluza-Klein gravitons whose masses are fixed by the internal geometry, so the bound becomes a constraint on the compactification. We propose that the KK gravitons of a consistent compactification never violate it, and test this in a few examples. On a circle stabilized by Casimir energy the bound holds unless the circle shrinks below the species scale, and on a warped interval with negative tension branes the tower is gapped at $m^2\\geq \\tfrac{9}{4}H^2$ for any length of the interval. On group manifolds, we argue that if the internal curvature is not parametrically larger than the Hubble scale, the bound can apparently be violated by smooth deformations. The violation disappears once one promotes these deformations to moduli, which are immediately extremized when solving the 10d equations of motion.", "url": "https://arxiv.org/abs/2609.16103", "type": "理论", "summary": "1. 该文研究高维引力紧化到四维 de Sitter 时 Kaluza-Klein 引力子塔与 Higuchi 界的关系，并提出一致紧化中的 KK 引力子不会违反 m^2 ≥ 2H^2。\n2. 作者在 Casimir 稳定的圆环、含负张力膜的翘曲区间及群流形等具体例子中检验该主张：圆环仅在缩至 species scale 以下时失效，翘曲区间对任意长度给出 m^2 ≥ 9/4 H^2 的能隙，而群流形上的表观违反会在把形变提升为模并求解 10 维运动方程后消失。\n3. 这为用 Higuchi 界筛选一致 de Sitter 紧化提供了依据，并暗示内部几何形变须作为动力学模处理，否则光滑形变会误判对自旋 2 质量界的违反，对高维紧化模型具有警示意义。", "summary_source": "deepseek", "authors": [{"name": "Dieter Lüst"}, {"name": "Joaquin Masias"}], "featured_authors": [{"name": "Dieter Lüst"}, {"name": "Joaquin Masias"}], "author_count": 2}, {"id": "2609.16107", "category": "hep-th", "title": "Canonical differential equations for Feynman integrals from $\\mathcal{A}$-hypergeometric systems in the Schwinger representation", "abstract": "We follow a $D$-module approach to the construction of canonical differential equations for Feynman integrals directly from their Gel'fand-Kapranov-Zelevinsky (GKZ) hypergeometric systems. Starting from the Schwinger representation, we identify the associated generalized Euler integral and its GKZ system, as an alternative to the Lee-Pomeransky representation. The generalized Euler formulation allows reductions associated with facets of the Newton polytope to be identified directly, reducing the number of variables in the resulting differential systems. We construct the associated Pfaffian systems using Frobenius bases, which also provide direct access to the singular loci. After a suitable rationalizing change of variables, the systems are brought into canonical $\\epsilon$-form. A key feature of the construction is that the dimension of the canonical basis is determined by the holonomic rank of the GKZ system and, for the examples considered, it is smaller than or equal to the number of master integrals obtained from integration-by-parts, thus providing a reduced description of the differential system.", "url": "https://arxiv.org/abs/2609.16107", "type": "理论", "summary": "1. 该工作以D-模方法从Schwinger表示出发，将Feynman积分识别为广义Euler积分及其GKZ系统，并直接构造canonical微分方程。\n2. 卖点是用Frobenius基构造Pfaffian系统，且canonical基维数由GKZ的holonomic rank决定，可不大于IBP主积分数。\n3. 该框架绕开Lee-Pomeransky表示，为多圈积分提供更精简的微分方程，其facet约化与秩计数思路可推广至更复杂积分族。", "summary_source": "deepseek", "authors": [{"name": "Mateo Jimenez-Santacruz"}, {"name": "Cristhiam Lopez-Arcos"}, {"name": "Alexander Quintero Velez"}], "featured_authors": [{"name": "Mateo Jimenez-Santacruz"}, {"name": "Cristhiam Lopez-Arcos"}, {"name": "Alexander Quintero Velez"}], "author_count": 3}, {"id": "2609.16109", "category": "hep-th", "title": "Boundary duals of bulk detectors", "abstract": "What is the boundary dual of an Unruh-DeWitt detector in anti-de Sitter space? We argue that this question is naturally answered by the HKLL reconstruction program. A local detector in the bulk can be associated with a smeared detector in the boundary, where the choice of smearing depends on the choice of HKLL kernel. We use this formalism to analyze entanglement harvesting in the Poincaré patch of AdS$_{3}$ for a bulk Unruh-DeWitt detector paired either with a boundary detector or with a second bulk detector. We compute the amount of harvesting in the standard way, namely by evaluating the two-detector density matrix to quadratic order in the coupling $\\lambda$. Additionally, we address an apparent tension between microcausality for spacelike-separated bulk detectors and the fact that the dual HKLL detectors may directly overlap in the boundary theory.", "url": "https://arxiv.org/abs/2609.16109", "type": "理论", "summary": "1. 该工作借助HKLL重构，在AdS/CFT框架下把反德西特空间中的局域Unruh-DeWitt探测器映射为边界上依赖核函数的涂抹探测器，并在AdS3庞加莱片中计算其与边界探测器或第二个体探测器的纠缠收获。\n2. 其关键在于以HKLL核确定边界涂抹，按耦合λ二次阶求两探测器密度矩阵以量化收获，并处理体内空间类分离探测器的微观因果性与边界对偶探测器可直接重叠之间的表观张力。\n3. 这为在AdS/CFT中构造体探测器的边界对应、研究体-边界纠缠收获以及检验微观因果性提供了可操作的框架。", "summary_source": "deepseek", "authors": [{"name": "Jacqueline Caminiti"}, {"name": "Robert C. Myers"}, {"name": "Kelly Wurtz"}], "featured_authors": [{"name": "Jacqueline Caminiti"}, {"name": "Robert C. Myers"}, {"name": "Kelly Wurtz"}], "author_count": 3}, {"id": "2609.16111", "category": "hep-th", "title": "Classification of c=1 CFTs", "abstract": "We completely classify unitary 2d CFTs with central charge $c=1$ and discrete spectrum. We confirm the folklore that the only such theories are the compact free boson, its $\\mathbb{Z}_2$-orbifold, and three exceptional theories obtained as orbifolds of the SU(2)$_1$ WZW model. The proof is by recasting the $c=1$ modular bootstrap as a crystalline measure problem for the density of states, and analytically solving it. We also show that, once the density of states is specified, the full CFT can be uniquely reconstructed.", "url": "https://arxiv.org/abs/2609.16111", "type": "理论", "summary": "1. 本文完整分类了中心荷为 1 且具离散谱的二维幺正共形场论，证实此类理论仅有紧致自由玻色子、其 Z2 轨道商以及 SU(2)_1 WZW 模型轨道商给出的三种例外理论。\n2. 其核心创新在于将 c=1 模 bootstrap 改写为态密度的晶体测度问题并解析求解，且证明态密度给定后整个共形场论可唯一重构。\n3. 这厘清了 c=1 临界理论的全景，为模 bootstrap 的严格化、态密度与完整共形数据的对应以及更高中心荷理论的分类提供了明确启示。", "summary_source": "deepseek", "authors": [{"name": "Lorenz Eberhardt"}, {"name": "Nat Levine"}], "featured_authors": [{"name": "Lorenz Eberhardt"}, {"name": "Nat Levine"}], "author_count": 2}, {"id": "2609.16113", "category": "hep-th", "title": "When the gravity path integral describes a statistical average", "abstract": "We find the necessary and sufficient conditions for the gravitational path integral (GPI) to admit an interpretation in terms of (i) an inner product in the Hilbert space of open/closed universes or (ii) a statistical average of boundary observables. The conditions needed for (i) are necessary but not sufficient for (ii). Requiring the stronger condition (ii) places additional constraints on all wormhole amplitudes, giving a concrete diagnostic of whether the GPI computes an average or merely a pseudo-average. To exemplify the difference between the two constraints, we present a class of gravitational toy models that satisfy (i) but fail the stronger condition (ii); to emphasize the power of the stronger condition, we initiate a bootstrap study of statistical ensembles based on condition (ii), finding that the resulting constraints substantially sharpen the bounds on the moments of the ensemble obtained by imposing (i). More broadly, both of these positivity conditions impose nontrivial constraints on wormhole amplitudes and thereby restrict which gravitational effective field theories can be embedded in consistent theories of quantum gravity.", "url": "https://arxiv.org/abs/2609.16113", "type": "理论", "summary": "1. 该工作给出了引力路径积分能够分别对应开/闭宇宙希尔伯特空间内积与边界可观测量统计平均的充要条件，并厘清后者所需的更强约束。\n2. 其核心在于证明内积条件必要但不充分于统计平均条件，且后者额外限制所有虫洞振幅，从而可诊断GPI给出真实平均还是伪平均；作者构造仅满足前者的一类玩具模型，并基于后者开展统计系综的bootstrap分析，显著收紧系综矩的界限。\n3. 这些正性条件对虫洞振幅施加非平凡约束，可用于筛选哪些引力有效场论能嵌入自洽量子引力，并为系综平均与引力的对应提供可操作判据。", "summary_source": "deepseek", "authors": [{"name": "Gabriele Di Ubaldo"}, {"name": "Luca V. Iliesiu"}, {"name": "Henry W. Lin"}, {"name": "Cynthia Yan"}], "featured_authors": [{"name": "Gabriele Di Ubaldo"}, {"name": "Luca V. Iliesiu"}, {"name": "Henry W. Lin"}, {"name": "Cynthia Yan"}], "author_count": 4}, {"id": "2609.16116", "category": "hep-th", "title": "Group-averaged baby universe field theory", "abstract": "Gravitational sums over spacetime topology suggest a baby-universe field theory whose quanta are entire universes. We develop such a description from group-averaged amplitudes that impose gravitational constraints and define physical inner products in the single-universe theory. To sharpen the contrast with ordinary QFT, we start with gravity on one-dimensional worldlines, which can arise from reducing higher-dimensional cylinders. For multiple noninteracting worldlines that pair boundary components, the baby-universe Hilbert space is the symmetric Fock space over the physical one-universe Hilbert space, and the universe field expands in the on-shell modes spanning the latter. Each mode multiplies the sum of creation and annihilation operators, so the mode coefficients commute. The mode expansion thus makes explicit the field's commutativity and its Wheeler-DeWitt linear field equation. Diagonalizing the coefficients recovers a statistical description by a Gaussian path integral over on-shell field configurations labelling superselection ($\\alpha$-)sectors. We take exploratory steps toward more general topologies. Disk-like topologies coherently shift the no-boundary state, turning on the Hartle-Hawking wavefunction as a one-point function. Even with nontrivial topologies represented by interacting Feynman diagrams, we argue that group averaging near each boundary still enforces the same linear field equation, while interactions instead enter through a non-Gaussian measure over $\\alpha$-sectors. In the topological Marolf-Maxfield model, we promote a disk-and-cylinder truncation to an exact Fock-space representation of the full theory incorporating all topologies. We also relate the truncated and exact inner products by an insertion of interactions, whose perturbative expansion produces a sum over time evolutions generated by pairs of pants, evoking an analogy to group averaging.", "url": "https://arxiv.org/abs/2609.16116", "type": "理论", "summary": "1. 该工作由群平均振幅构造婴儿宇宙场论，以整个宇宙为量子，并在一维世界线引力上定义单宇宙物理内积与对称Fock空间。\n2. 其关键在于宇宙场按壳上模展开，每个模式乘以产生与湮灭算符之和，使系数对易并显式给出Wheeler-DeWitt线性场方程，对角化后化为α-扇区的高斯路径积分。\n3. 该结果表明非平凡拓扑与相互作用下，各边界附近的群平均仍强制同一线性场方程，相互作用仅体现为α-扇区的非高斯测度。", "summary_source": "deepseek", "authors": [{"name": "Hong Zhe Chen"}], "featured_authors": [{"name": "Hong Zhe Chen"}], "author_count": 1}, {"id": "2609.16117", "category": "hep-th", "title": "An attempt to derive the LVS from a 10d EFT perspective", "abstract": "Non-perturbative scalar potentials are a central ingredient for stabilising moduli in flux compactifications. A key target in this context is the direct 10d derivation of the LVS AdS potential, i.e., the scalar potential of the Large Volume Scenario before the uplift. The familiar result, relying on 4d supergravity machinery and large volume expansion, consists of three terms of parametric form $\\exp(-2a\\tau_s)/{\\mathcal V}$, $W_0\\exp(-a\\tau_s)/{\\mathcal V}^2$, and $W_0^2/{\\mathcal V}^3$. In plain 10d EFT language, the first term is an instanton-anti-instanton effect while the second term comes from a single instanton coupled to 3-form flux. When attempting to derive the suppression by the volume ${\\mathcal V}$ directly from the 10d EFT, one encounters a puzzle: One expects a flux-dilution factor $1/\\sqrt{\\mathcal V}$ for the second term and a factor $1/{\\mathcal V}^2$ from Weyl rescaling to the 4d Einstein frame for both the first and second term. Thus, the total volume suppression for these two terms is stronger than in the aforementioned 4d EFT expectations. We discuss the underlying logic in detail, also in the gaugino condensation case, but fail to find a satisfactory explanation for the mismatch. While log-corrections to the Kähler potential may be responsible, these would have to be strong enough to affect the outcome of the LVS scheme at the ${\\mathcal O}(1)$ level. What is worse, the origin of the required correction remains unclear.", "url": "https://arxiv.org/abs/2609.16117", "type": "理论", "summary": "1. 该文尝试从10维有效场论视角直接推导LVS未抬升的AdS标量势，并与4维超引力大体积展开的三项结果对照。\n2. 其卖点是：10维直接推导中通量稀释1/√V与外尔重标度1/V^2使前两项体积压低强于4维LVS预期，且未找到满意解释。\n3. 这一不匹配暗示凯勒势可能需强对数修正至O(1)量级才能影响LVS，但其来源仍不清楚，需进一步研究。", "summary_source": "deepseek", "authors": [{"name": "Arthur Hebecker"}, {"name": "Andreas Schachner"}, {"name": "Gaetano Maria Sifo"}], "featured_authors": [{"name": "Arthur Hebecker"}, {"name": "Andreas Schachner"}, {"name": "Gaetano Maria Sifo"}], "author_count": 3}, {"id": "2609.16130", "category": "hep-th", "title": "Single-Instance Observables in the Sachdev-Ye-Kitaev Model", "abstract": "We present a diagrammatic expansion for thermal expectation values of low-weight Majorana strings in a fixed realization of the $N$-fermion Sachdev--Ye--Kitaev (SYK) model. At each order in the expansion, the observable is expressed as a finite sum of polynomials in the couplings multiplied by temperature-dependent kernels built from the large-$N$ melonic propagator. At fixed $\\beta J$, the expansion is organized in powers of $N^{-1/2}$, and each order can be efficiently evaluated with classical resources polynomial in $N$. The expansion also extends to correlations at arbitrary imaginary times and sufficiently short real times. For the four-body SYK model, we show that the diagrammatic predictions give an excellent account of exact diagonalization results at sizes up to $N=24$. We also apply the method to the Maldacena--Qi (MQ) model formed from two identical copies of a fixed SYK realization. This enables the identification of a nearby SYK-like Hamiltonian whose thermofield double state has higher fidelity with the Maldacena--Qi ground state than the thermofield double of the original SYK Hamiltonian.", "url": "https://arxiv.org/abs/2609.16130", "type": "理论", "summary": "1. 该工作针对固定无序实现下的N费米子SYK模型，提出了低权重Majorana弦热期望值的图解展开，并将其用于由两个相同SYK副本构成的Maldacena-Qi模型。\n2. 其卖点是在固定βJ下将展开按N^{-1/2}逐阶组织，每阶为耦合多项式乘以由大N melonic传播子构造的温度核，可用多项式经典资源计算，并适用于任意虚时和足够短实时，且对N≤24的四体SYK与精确对角化高度一致。\n3. 该框架为单实例有限N SYK观测值提供可控解析工具，并可通过构建邻近SYK型哈密顿量提升其热场双态与MQ基态的保真度，为有限N修正与MQ态制备研究提供启示。", "summary_source": "deepseek", "authors": [{"name": "Brian Swingle"}], "featured_authors": [{"name": "Brian Swingle"}], "author_count": 1}, {"id": "2609.16132", "category": "hep-th", "title": "Exact group invariant scar towers in two dimensional gauge theories", "abstract": "We construct exact many-body scar towers in two dimensional gauge theories with two flavors of massless fundamental fermions. For oppositely charged fermions, the scar subspace is generated by a gauge-neutral $\\eta$-pairing operator, and admits a purely algebraic construction. Exact diagonalization methods reveal anomalously low entanglement and long-range pair correlations in the scar states. Charge conjugation maps the $\\eta$-tower to a vector-flavor polarization sector of the equal charge model, yielding an interpretation as a coherent flavor mode with Josephson-like phase dynamics. Finite fermion masses mix the protected pair with an orthogonal channel and destroy the exact tower. The identified scar tower can be algebraically realized in a large family of lattice field theories, revealing a universal character of these states. Our results provide an analytical construction of invariant scar subspaces in a gauge theory with a nontrivial continuum interpretation.", "url": "https://arxiv.org/abs/2609.16132", "type": "理论", "summary": "1. 该工作构造了二维规范理论中含两味无质量基本费米子的精确多体疤痕塔；相反电荷扇区的疤痕子空间由规范中性η配对算符生成，可纯代数构建。\n2. 其物理卖点是精确对角化显示疤痕态具反常低纠缠与长程配对关联，电荷共轭将η塔映射为等电荷模型的矢量味极化扇区，可解释为类约瑟夫森相位动力学的相干味模式；有限质量会混合正交通道并破坏精确塔。\n3. 该构造可代数推广到大量格点场论，表明此类不变疤痕子空间具普适性，并为具有非平凡连续统解释的规范理论提供了可解析的疤痕态构造，或可启发后续格点与连续统研究。", "summary_source": "deepseek", "authors": [{"name": "João Barata"}, {"name": "Kiryl Pakrouski"}, {"name": "Andrey V. Sadofyev"}], "featured_authors": [{"name": "João Barata"}, {"name": "Kiryl Pakrouski"}, {"name": "Andrey V. Sadofyev"}], "author_count": 3}, {"id": "2609.16136", "category": "hep-th", "title": "$D$-term and $F$-term potential of non-Abelian D7-branes in IIB Calabi-Yau orientifolds", "abstract": "We derive the 4d $D$-term and $F$-term potential generated by a D7-brane stack in Calabi-Yau orientifold compactifications of type IIB string theory, taking into account the effect of worldvolume and ISD bulk fluxes and the non-Abelian nature of the brane fields. This potential is an important ingredient for moduli stabilization in IIB, e.g., in de Sitter scenarios using a T-brane uplift. While aspects of the $D$-term and $F$-term parts of the potential have been inferred before with various arguments, we provide here a unified first-principles derivation of the full potential by dimensionally reducing the non-Abelian DBI action of the D7-branes. Our result generalizes previous expressions and agrees with them where applicable, thus confirming the mutual consistency of the various approaches. Moreover, we provide a thorough discussion of corrections from integrating out KK modes and argue that demanding control over such corrections implies bounds on the Calabi-Yau volume and the brane fields. Aside from these various results for the 4d effective action, our calculation also shows how bulk fluxes correct the potential and the BPS equations in the 8d worldvolume theory that governs the microscopic dynamics of non-Abelian branes.", "url": "https://arxiv.org/abs/2609.16136", "type": "理论", "summary": "1. 该文在IIB型Calabi-Yau orientifold紧化中，由非阿贝尔D7膜堆的DBI作用量经维度约化，统一导出了含世界体与ISD体通量贡献的四维D项和F项势。\n2. 其卖点在于第一性原理地推广了此前分散推导的结果，并表明体通量会修正八维世界体理论中的势与BPS方程。\n3. 该势可用于T-brane uplift等de Sitter模稳定，且对KK模式修正的控制要求给出Calabi-Yau体积和膜场范围的约束，并确认了不同方法的自洽性。", "summary_source": "deepseek", "authors": [{"name": "Daniel Junghans"}], "featured_authors": [{"name": "Daniel Junghans"}], "author_count": 1}, {"id": "2609.16141", "category": "hep-th", "title": "Symmetry Descent in M-theory, Part I: A Twelve-Dimensional Parent Theory", "abstract": "We initiate a symmetry descent procedure for M-theory engineered quantum field theories. Starting from a higher form BF theory supplemented by a cubic bulk topological interaction, we construct a gauge-invariant bulk-boundary system whose edge modes acquire generalized Maxwell--Chern--Simons dynamics after the introduction of a metric-dependent boundary action. The nonlinear contribution to the boundary equation is induced entirely by the cubic bulk interaction. In the case of twelve dimensional bulk parent, the resulting boundary conditions reproduce the local flux equations of the eleven-dimensional supergravity $C$-field, including the gravitational $I_8$ correction. Thus, the electric--magnetic pairing and the nonlinear Maxwell--Chern--Simons dynamics descend from a single 12D topological model. Using Hypothesis H, we identify the bulk equations with the Sullivan model of $S^4$ and interpret their nonlinear gauge transformations as homotopies. We then propose a twisted 4-cohomotopy quantization of the bulk fields and a homotopy pullback description of the coupled bulk--boundary field space. The construction provides both a local dynamical mechanism for M-theory symmetry descent and a candidate global characterization of its fields.", "url": "https://arxiv.org/abs/2609.16141", "type": "理论", "summary": "1. 我们为 M 理论工程量子场论启动了对称下降过程。\n2. 该构造既提供了 M 理论对称性下降的局部动力学机制，又提供了其场的候选全局表征。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Pinak Banerjee"}, {"name": "Subham Roy"}, {"name": "Xingyang Yu"}], "featured_authors": [{"name": "Pinak Banerjee"}, {"name": "Subham Roy"}, {"name": "Xingyang Yu"}], "author_count": 3}, {"id": "2609.16146", "category": "hep-th", "title": "Separation of variables for non-diagonalisable models: XXX with twisted boundary conditions", "abstract": "We study the Heisenberg XXX spin chain with twisted periodic boundary conditions with a defective twist matrix. Using quantum separation of variables, we show that the generalised eigenvectors of this system can be characterised in terms of a modified TQ equation that we have named \"Jordanian TQ equation\". We also show that the wavefunction in the separated basis is only separable for true eigenvectors, while the wavefunction for generalised eigenvectors of higher rank is given instead by a sum over weak compositions.", "url": "https://arxiv.org/abs/2609.16146", "type": "理论", "summary": "1. 该工作以量子分离变量研究具有缺陷扭曲矩阵的扭曲周期边界海森堡 XXX 自旋链，并刻画其广义本征向量。\n2. 其卖点是给出“Jordanian TQ方程”以刻画广义本征向量，并揭示分离基波函数仅真本征向量可分离，高阶广义本征向量为弱复合之和。\n3. 这为不可对角化可积模型的分离变量提供范例，并表明高阶广义本征态需由弱复合等组合结构而非单个乘积波函数描述。", "summary_source": "deepseek", "authors": [{"name": "Juan Miguel Nieto García"}], "featured_authors": [{"name": "Juan Miguel Nieto García"}], "author_count": 1}, {"id": "2609.16153", "category": "hep-th", "title": "The Role of Completeness in Probing Symmetry Breaking", "abstract": "Completeness is widely recognized in quantum information as an important property of a family of monotones, because it ensures that no information relevant to state conversion is lost. We show that completeness is also physically important in many-body systems: an incomplete measure of symmetry breaking can miss essential features of symmetry-restoration dynamics. We study the logarithmic characteristic function (LCF), also known as the string order parameter, whose full family is complete for exact i.i.d. pure-state conversion under symmetry-preserving operations for finite groups. We introduce a fidelity-based extension of the LCF to mixed states and identify two concrete advantages over entanglement asymmetry (EA). First, for a finite symmetry group $G$, EA is bounded by $\\log |G|$ and can approach the same saturated value for different initial states in the thermodynamic limit, making their relaxation curves indistinguishable and preventing the identification of a discrete-symmetry Mpemba effect. By contrast, the LCF can remain extensive, with a coefficient that depends on the initial state and time, and therefore continues to distinguish their relaxation dynamics. Second, different LCF components can exhibit distinct relaxation and crossing behavior, including cases in which EA shows no crossing. We demonstrate these advantages in spin-chain quenches and a single-qubit system under depolarizing noise. We also develop a replica construction for the fidelity-based LCF in quantum field theory and derive analytical results for conformal field theory.", "url": "https://arxiv.org/abs/2609.16153", "type": "理论", "summary": "1. 在量子信息中，完整性被广泛认为是单调族的一个重要属性，因为它确保了与状态转换相关的信息不会丢失。\n2. 其次，不同的 LCF 组件可以表现出不同的弛豫和交叉行为，包括 EA 不显示交叉的情况。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Yuya Kusuki"}, {"name": "Hiroyasu Tajima"}, {"name": "Shion Yamashika"}], "featured_authors": [{"name": "Yuya Kusuki"}, {"name": "Hiroyasu Tajima"}, {"name": "Shion Yamashika"}], "author_count": 3}, {"id": "2609.16154", "category": "hep-th", "title": "Making the Great Desert Bloom", "abstract": "The absence of new physics beyond neutrino masses between the weak scale and the Planck scale is referred to as the great desert. It is often seen as a nightmare scenario for particle physics. Here we argue, by contrast, that the great desert assumption in fact has dramatic implications: it predicts that the Standard Model has a semi-classical AdS$_4$ vacuum with CFT$_3$ dual and, under reasonable assumptions, must be accompanied by at least one extra dimension significantly larger than Planck length. We also present one plausible candidate CFT$_3$ to be ``the\" dual to the Standard Model.", "url": "https://arxiv.org/abs/2609.16154", "type": "理论", "summary": "1. 该工作反转“大沙漠”通常被视为粒子物理噩梦的视角，论证弱尺度至普朗克尺度间除中微子质量外无新物理这一假设本身具有深刻且可推导的物理后果。\n2. 其核心卖点是在该假设下标准模型应具有半经典 AdS4 真空及 CFT3 对偶，并在合理条件下必须伴随至少一个显著大于普朗克长度的额外维度，作者还给出了一个可作为标准模型对偶的候选 CFT3。\n3. 这提示大沙漠并非消极的无新物理区间，而可成为连接标准模型真空、全息对偶和额外维度唯象的指导原则，为后续理论构造与检验提供明确方向。", "summary_source": "deepseek", "authors": [{"name": "Jacques Distler"}, {"name": "Andreas Karch"}], "featured_authors": [{"name": "Jacques Distler"}, {"name": "Andreas Karch"}], "author_count": 2}, {"id": "2609.16162", "category": "hep-th", "title": "Persistent Spontaneous Time-Reversal Breaking", "abstract": "We provide an analytic realization of spontaneous parity and time-reversal breaking without thermal restoration in a local, unitary, ultraviolet-complete quantum field theory in $2+1$ dimensions with finitely many fields. The theory is defined by a relevant Yukawa deformation of a product of the critical biconical vector model and free massless Dirac fermions. This deformation induces a renormalization group flow whose infrared endpoint is a decoupled product of the critical vector model and the conformal Gross-Neveu-Yukawa model. At zero temperature, the vacuum preserves both symmetries, whereas upon heating, the theory undergoes an inverse thermal transition at a finite critical temperature. Above this temperature, a fermion mass, odd under parity and time reversal, is dynamically generated, and the broken phase persists to arbitrarily high temperatures.", "url": "https://arxiv.org/abs/2609.16162", "type": "理论", "summary": "1. 该工作在2+1维、局域、幺正且紫外完备、含有限个场的量子场论中，解析构造了自发破坏宇称与时间反演对称性且不因升温而恢复的真空。\n2. 其核心机制是通过相关Yukawa形变耦合临界双锥矢量模型与无质量狄拉克费米子，使重整化群流在红外端落到临界矢量模型与共形Gross-Neveu-Yukawa模型的解耦乘积；零温真空保持宇称与时间反演对称，升温则在有限临界温度发生逆相变，并在高温下动态生成宇称和时间反演奇的费米子质量，破缺相可持续至任意高温。\n3. 该结果给出热涨落未必恢复自发破缺对称性的反例，为研究逆热相变、高温持续破缺以及2+1维紫外完备场论中的非零温相图提供了可解析处理的范例。", "summary_source": "deepseek", "authors": [{"name": "Michael Smolkin"}, {"name": "Lev Yung"}], "featured_authors": [{"name": "Michael Smolkin"}, {"name": "Lev Yung"}], "author_count": 2}, {"id": "2609.16164", "category": "hep-th", "title": "Schwinger-Keldysh effective actions for non-hydrodynamic poles and branch cuts", "abstract": "Retarded thermal correlators, analytically continued to complex frequency, exhibit non-hydrodynamic poles and branch cuts that constrain hydrodynamics. We construct Gaussian Schwinger-Keldysh effective actions in which branch cuts arise from continua of relaxation poles and response functions are governed by Stieltjes transforms of relaxation-time densities. Dynamical KMS symmetry, positivity and stability constrain the spectra, while endpoint behaviour controls the local branch structure and near-edge pole scaling. The illustrative examples of uniform and power-law densities exhibit respectively beyond-all-orders pole-endpoint separation and a continuous interpolation between pole-pole and pole-branch-point termination. Finally, we show that an energy-dependent relaxation-time approximation in kinetic theory provides a microscopic realization of our branch cuts at zero momentum.", "url": "https://arxiv.org/abs/2609.16164", "type": "理论", "summary": "1. 该工作构建高斯Schwinger-Keldysh有效作用量，刻画推迟热关联函数复频率解析延拓后的非流体力学极点与分支割线。\n2. 其核心是将分支割线视为弛豫极点连续谱，响应函数由弛豫时间密度的Stieltjes变换给出，并受动力学KMS、正性与稳定性约束。\n3. 该框架表明端点行为决定局部分支结构与近边缘极点标度，并为动能理论中能量依赖弛豫时间近似提供零动量下的微观实现途径。", "summary_source": "deepseek", "authors": [{"name": "Andrea Amoretti"}, {"name": "Matteo Anselmi"}, {"name": "Daniel K. Brattan"}], "featured_authors": [{"name": "Andrea Amoretti"}, {"name": "Matteo Anselmi"}, {"name": "Daniel K. Brattan"}], "author_count": 3}, {"id": "2609.16165", "category": "hep-th", "title": "Instanton Interactions and the Axion Weak Gravity Conjecture", "abstract": "The Weak Gravity Conjecture admits a formulation in terms of long-range charged particle self-interactions being repulsive. We adopt a similar approach to the Axionic Weak Gravity Conjecture by considering long-range instanton interactions. At leading order, in the instanton separation, such interactions are mediated purely by massless scalar fields. Gravitational and gauge interactions are sub-leading. We formulate a repulsive interaction Axionic Weak Gravity Conjecture, which forms a bound on the scalar field dependence of the complex Euclidean instanton action. We show that in standard ultraviolet complete examples, this bound implies the usual formulation of the Axionic Weak Gravity Conjecture, while generally being stronger. Because this formulation is purely a statement about massless scalar fields, it implies that in the absence of massless scalars the usual bound on the axion decay constant could be modified.", "url": "https://arxiv.org/abs/2609.16165", "type": "理论", "summary": "1. 该工作将弱引力猜想的排斥性自相互作用表述推广到轴子情形，通过考察长程瞬子相互作用来构建轴子弱引力猜想。\n2. 其技术卖点是在瞬子间距领头阶相互作用仅由无质量标量场传递，引力和规范作用为次领头阶，并给出复欧氏瞬子作用量中标量场依赖的排斥性束缚，该束缚在标准紫外完备例子中蕴含通常的轴子弱引力猜想且一般更强。\n3. 由于该表述仅关乎无质量标量场，它表明在不存在无质量标量场时，通常的轴子衰变常数上界可能被修改，为轴子弱引力猜想的适用条件和紫外完备性约束提供了新启发。", "summary_source": "deepseek", "authors": [{"name": "Jarod Hattab"}, {"name": "Eran Palti"}], "featured_authors": [{"name": "Jarod Hattab"}, {"name": "Eran Palti"}], "author_count": 2}, {"id": "2609.16169", "category": "hep-th", "title": "A $dS_4$ maximum in M-theory from Casimir energies on Riemann-flat manifolds", "abstract": "We describe a fully explicit, four-dimensional, top-down de Sitter saddle, constructed via compactification of M-theory on the Riemann-flat manifold $T^7/\\mathbb{Z}_8$. The solution has a vacuum energy of $5.02\\cdot 10^{-10}\\,M_\\text{Pl}^4$, a hierarchy $m_{KK}/H\\sim 10^{2}$, and is under control with respect to higher-loop and higher-derivative corrections. While the solution is the first example of a top-down dS maximum in four dimensions, it is far from being phenomenologically viable. The solution also suggests several promising directions in the search for higher-quality dS saddles in the Riemann-flat Landscape, which we describe.", "url": "https://arxiv.org/abs/2609.16169", "type": "理论", "summary": "1. 该工作在黎曼平坦流形 T^7/Z_8 上紧化 M理论，显式构造出一个四维自上而下的德西特鞍点。\n2. 其卖点是由卡西米尔能量给出 V≈5.02×10^-10 M_Pl^4、m_KK/H≈10^2，并首次在四维实现自上而下德西特极大值且高阶修正可控。\n3. 尽管该解远非现象学可行，它为在黎曼平坦景观中寻找更高质量德西特鞍点指明了具体方向。", "summary_source": "deepseek", "authors": [{"name": "Miquel Aparici"}, {"name": "Bruno Valeixo Bento"}, {"name": "Miguel Montero"}], "featured_authors": [{"name": "Miquel Aparici"}, {"name": "Bruno Valeixo Bento"}, {"name": "Miguel Montero"}], "author_count": 3}, {"id": "2609.16263", "category": "hep-th", "title": "Zero- and Finite-Temperature Casimir Effect in a Fracton Gauge Field", "abstract": "We investigate the zero- and finite-temperature Casimir interaction of the free trace-full scalar-charge fracton gauge field between two parallel reflecting boundaries. A variational analysis determines a consistent boundary-value problem that confines all five physical polarizations of the rank-two field. The spectrum separates into three faster and two slower propagating modes. At zero temperature, the vacuum interaction weights the modes by their propagation speeds; when the fast-branch speed is set equal to the speed of light, the resulting Casimir pressure is approximately 2.21 times the ideal electromagnetic value. At finite temperature, the two branches acquire different thermal weights and generate a split crossover. The normalized free energy and pressure follow distinct crossover profiles but approach the same classical high-temperature ratio of 2.5 relative to ideal electromagnetism, because the Matsubara zero mode counts the five confined polarizations independently of their propagation speeds. We derive the exact thermal interaction, its low- and high-temperature limits, and the dependence of the crossover scale on the effective gauge-field velocity. The transition from velocity-weighted quantum fluctuations to classical mode counting provides a direct spectral signature of the multi-branch structure of the higher-rank gauge field.", "url": "https://arxiv.org/abs/2609.16263", "type": "理论", "summary": "1. 该工作研究两平行反射边界间含迹标量荷分形子规范场的零温与有限温Casimir相互作用。\n2. 变分分析给出束缚五种物理极化的边界条件，谱分为三快两慢，零温压约为理想电磁的2.21倍，高温趋至2.5倍。\n3. 有限温交叉源于速度加权量子涨落向经典模式计数的过渡，可作为高阶秩规范场多支结构的直接谱学特征。", "summary_source": "deepseek", "authors": [{"name": "Celio R. Muniz"}], "featured_authors": [{"name": "Celio R. Muniz"}], "author_count": 1}, {"id": "2609.16400", "category": "hep-th", "title": "Edge observables in Maxwell theory on null boundaries", "abstract": "We study edge observables in three-dimensional Maxwell theory on null boundaries using a Hamiltonian formulation adapted to null foliations. We consider three backgrounds: Minkowski spacetime, the BTZ black hole, and de Sitter space, where the relevant boundaries are, respectively, null infinity, the black hole horizon, and the cosmological horizon. In all three cases we find, besides the usual $U(1)$ charge, a second edge observable associated with an intrinsic symmetry on the null boundary. The two charges are well defined quasilocally. They form a centrally extended algebra which, in Fourier modes, becomes two independent Abelian Kac-Moody algebras with opposite levels. Thus, the same centrally extended edge structure appears at both asymptotic and finite-distance null boundaries.", "url": "https://arxiv.org/abs/2609.16400", "type": "理论", "summary": "1. 该工作以适配零叶状结构的哈密顿形式，研究三维麦克斯韦理论在零边界上的边缘可观测量，涵盖闵可夫斯基时空、BTZ黑洞与de Sitter时空，分别对应零无穷、黑洞视界和宇宙学视界。\n2. 其核心在于：除常规U(1)电荷外，零边界内禀对称性还给出第二个边缘可观测量；两荷均可准局域定义，并构成中心扩展代数，在傅里叶模式下化为两个水平相反的独立阿贝尔Kac-Moody代数。\n3. 这表明同一中心扩展边缘结构可出现在渐近与有限距离零边界，为黑洞视界和宇宙学视界的边缘自由度及量子引力边界描述提供统一启示。", "summary_source": "deepseek", "authors": [{"name": "Dušan Đorđević"}, {"name": "Olivera Miskovic"}, {"name": "Antonia Montecinos"}, {"name": "Tatjana Vukašinac"}], "featured_authors": [{"name": "Dušan Đorđević"}, {"name": "Olivera Miskovic"}, {"name": "Antonia Montecinos"}, {"name": "Tatjana Vukašinac"}], "author_count": 4}, {"id": "2609.16455", "category": "hep-th", "title": "Stringy Gauge Structures", "abstract": "A field theory action, able to incorporate stringy gauge symmetry enhancement-breaking effects, which occur at particular points of moduli space in a heterotic string toroidal compactification framework, was previously constructed from three-point interactions and duality symmetries. Via doubled periodic coordinates and a non-commutative product, it encodes the non-Abelian structure in a background-independent form. Moduli-space dependence becomes manifest upon performing a generalized mode expansion. Here we further elaborate on this construction. In particular, we propose field transformations for the retained sectors that make up the foundations of a potential symmetry of the action and that, when mode expanded at enhancement points in moduli space, contain the usual non-Abelian gauge transformations. We also examine the covariance of the corresponding scalar derivative structures. Although the proposal must be regarded as a truncated version of a full, presently unknown field-theory description, it already encodes representations of massless and massive states containing up to one oscillator excitation. Finally, we relate the construction to gauged DFT with an extended tangent space by associating generalized Kaluza-Klein modes considered here with additional generalized-frame directions. At enhancement, their brackets reproduce the enhanced gauge algebra; away from enhancement, the same algebraic structure is recovered by rotating the Cartan basis.", "url": "https://arxiv.org/abs/2609.16455", "type": "理论", "summary": "1. 该工作进一步阐述异弦环面紧化中模空间依赖的弦规范构造，提出保留扇区的场变换并检验标量导数结构协变性，使模展开在增强点回到非阿贝尔规范变换。\n2. 其卖点是以双周期坐标和非对易乘积将非阿贝尔结构背景无关地编码，模展开显式呈现模空间依赖；截断中已含至多一个振子激发的无质量与有质量态，并与具扩展切空间的规范双场论对应：增强点括号复现增强规范代数，非增强点经旋转嘉当基恢复同一结构。\n3. 这为统一描述规范对称性增强、卡鲁扎-克莱因模与增强规范代数提供框架，并启示后续在完整场论中纳入更高激发有质量态并检验协变性。", "summary_source": "deepseek", "authors": [{"name": "Gerardo Aldazabal"}, {"name": "Eduardo Andrés"}, {"name": "Lucía M. Cabrera"}, {"name": "Martín Mayo"}], "featured_authors": [{"name": "Gerardo Aldazabal"}, {"name": "Eduardo Andrés"}, {"name": "Lucía M. Cabrera"}, {"name": "Martín Mayo"}], "author_count": 4}, {"id": "2609.16896", "category": "hep-th", "title": "Unitarity and the Forward Direction in Theories with Long-Range Forces", "abstract": "Integrating scattering amplitudes over the forward direction, and consequently the unitarity constraints one extracts from such integrals, can appear ambiguous in theories with long-range forces. Standard techniques for bounding EFT couplings then typically produce bounds that depend on an arbitrary infrared scale. We study a non-relativistic model in which the standard techniques produce such an ambiguous bound, but which is simple enough that the exact bound can also be derived non-perturbatively and shown to involve no infrared scale. We then show how to derive bounds perturbatively, with no infrared scale entering at any stage. This requires two ingredients: accounting for the modified distributional structure of long-range amplitudes, and using distorted-wave perturbation theory (DWPT), which treats the Coulomb dynamics exactly. Together they give amplitudes with well-defined partial-wave projections and no spurious infrared divergences. Interpreting the model as an EFT with an ultraviolet cutoff $\\Lambda_{\\rm EFT}$, we derive cutoff-dependent bounds valid for arbitrary UV completions. Taking $\\Lambda_{\\rm EFT}\\to\\infty$ at each order yields bounds that rapidly converge to the exact bound, reaching $0.002\\%$ accuracy at fourth order in the expansion. Finally, we demonstrate that every order of the DWPT expansion resums infinitely many Feynman diagrams of short-range perturbation theory, which individually evaluate to multiple polylogarithms and complete elliptic integrals, into a compact expression. At the orders we compute, no integration is even required, suggesting that DWPT may offer a simpler representation of scattering amplitudes than standard perturbation theory.", "url": "https://arxiv.org/abs/2609.16896", "type": "理论", "summary": "1. 该工作针对长程力理论中前向散射积分及由此提取的幺正性约束的模糊性，以一个可精确求解的非相对论模型为例，比较标准微扰技术给出的红外尺度依赖界限与无红外尺度的精确结果。\n2. 其核心是引入长程振幅的修正分布结构与精确处理库仑动力学的畸变波微扰论（DWPT），从而获得部分波投影良定义、无虚假红外发散的振幅，并给出适用于任意紫外完成的截断依赖界限。\n3. 当逐阶取紫外截断趋于无穷时，界限迅速收敛至精确值（四阶达0.002%），且DWPT每阶将无穷多短程费曼图重求和为紧凑表达式，暗示其可能比标准微扰论更简洁地表示散射振幅。", "summary_source": "deepseek", "authors": [{"name": "Luke Lippstreu"}], "featured_authors": [{"name": "Luke Lippstreu"}], "author_count": 1}, {"id": "2609.16924", "category": "hep-th", "title": "Positivity Bounds in $\\mathcal N =1$ Supersymmetry", "abstract": "For a low-energy Effective Field Theory (EFT) to admit a consistent ultraviolet (UV) completion, it must adhere to the fundamental principles of locality, unitarity, analyticity, and Lorentz invariance. This leads to positivity constraints on certain Wilson coefficients via dispersion relations of $2\\rightarrow2$ forward elastic amplitudes, which carry significant implications for both theoretical consistency and experimental phenomenology. In this work, we extend this bootstrap framework to $\\mathcal N = 1$ supersymmetric theories, where the super-Poincaré algebra relates the bosonic and fermionic degrees of freedom within a single supermultiplet. Supersymmetric Ward identities (SWIs) enforce exact linear relations among component scattering amplitudes. Consequently, the Wilson coefficients associated with different $2\\rightarrow2$ processes are mutually constrained, rendering their respective positivity bounds dependent. Focusing on dimension-8 operators, we explicitly show the positivity bounds on quartic interactions involving scalars, fermions and gauge fields, and demonstrate how they are related as a direct consequence of the SWIs. Furthermore, we expect that the algebraic nature of this framework naturally extends to loop-level superamplitudes and higher-point processes, providing a unified bootstrap perspective on supersymmetric EFTs.", "url": "https://arxiv.org/abs/2609.16924", "type": "理论", "summary": "1. 该工作将基于前向2→2弹性振幅色散关系的正定性边界推广到 N=1 超对称有效场论，重点给出量纲8算子的Wilson系数限制。\n2. 其技术卖点在于超对称Ward恒等式强制不同分量振幅满足精确线性关系，使标量、费米子与规范场四线相互作用的正定性边界相互依赖而非彼此独立。\n3. 这一代数结构有望自然推广至圈图超振幅与更高点多过程，为超对称有效场论提供统一的自举视角，并对相关唯象与紫外完备性研究形成启发。", "summary_source": "deepseek", "authors": [{"name": "Jingxuan Bu"}, {"name": "Jiayin Gu"}, {"name": "Runqing Wang"}], "featured_authors": [{"name": "Jingxuan Bu"}, {"name": "Jiayin Gu"}, {"name": "Runqing Wang"}], "author_count": 3}, {"id": "2609.16980", "category": "hep-th", "title": "Constraints on Kasner Exponents from Holography and Energy Conditions", "abstract": "A central question in bottom-up holography is whether a given bulk effective theory admits a consistent holographic dual. In this work, we explore whether the near-singularity Kasner scaling of planar AdS black hole interiors can serve as a useful diagnostic based on interior-sensitive holographic probes. By examining the metric combinations that control interior-sensitive observables, including Complexity=Volume (CV), the bulk contribution to Complexity=Action (CA), Hartman-Maldacena (HM) entropy, and the thermal $a$-function, we derive algebraic bounds on the Kasner exponents $(p_t,p_s)$ for the relevant semi-classical regimes: finite-radius late-time branches of CV and HM, finite CA complexity, and a finite near-singularity thermal $a$-function. The resulting inequalities delineate the corresponding regions of Kasner space in which the terminal scaling alone is sufficient to realize these behaviors. Furthermore, we demonstrate that classical energy conditions, specifically the null and dominant energy conditions, provide simple sufficient criteria ensuring that the Kasner exponents fall within these holographically allowed regions. These results establish a direct connection between classical bulk energy conditions and the interior geometry selected by holographic probes, and suggest that Kasner scaling can provide a complementary diagnostic in bottom-up holography.", "url": "https://arxiv.org/abs/2609.16980", "type": "理论", "summary": "1. 自下而上全息术的一个核心问题是给定的整体有效理论是否承认一致的全息对偶。\n2. 这些结果在经典体能量条件和全息探针选择的内部几何形状之间建立了直接联系，并表明卡斯纳标度可以在自下而上的全息术中提供补充诊断。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Zi-Hao Li"}, {"name": "Run-Qiu Yang"}], "featured_authors": [{"name": "Zi-Hao Li"}, {"name": "Run-Qiu Yang"}], "author_count": 2}, {"id": "2609.17086", "category": "hep-th", "title": "Carrollian Conformal Dynamics and Flat-Space Holography", "abstract": "The conformal boundary of asymptotically flat spacetime is null and therefore carries a Carrollian rather than Lorentzian geometry. This changes the relation between symmetry, variational principles and evolution equations in an essential way: unlike a Lorentzian Levi-Civita connection, a torsion-free Carrollian connection compatible with the conformal structure contains genuine independent data. We develop a metric-affine formulation of conformal dynamics that keeps track of these connection degrees of freedom through hypermomenta. Local Carroll boosts, rotations, Weyl transformations and diffeomorphisms then imply a set of covariant evolution equations. We apply this framework to Einstein gravity in four-dimensional asymptotically flat spacetimes. Penrose's conformal compactification identifies null infinity as a conformal Carrollian manifold; the undetermined transverse symmetric part of its compatible connection is the asymptotic Bondi shear. After fixing a Bondi-van der Burg-Metzner-Sachs (BMS) frame and identifying the Carrollian momenta and hypermomenta with the Bondi data, the general Carrollian evolution equations reproduce the standard evolution equations for the mass and angular-momentum aspects. The result provides a boundary-intrinsic derivation of the gravitational evolution equations and a geometric realization of radiative degrees of freedom in flat-space holography. This is a proceedings contribution to the \"Athens Workshop in Theoretical Physics: 10th Anniversary\", held at the National and Kapodistrian University of Athens on December 17-19 2025.", "url": "https://arxiv.org/abs/2609.17086", "type": "理论", "summary": "1. 该文在渐近平坦时空的零无穷上建立共形卡罗尔几何的度规-仿射动力学，将相容卡罗尔联络的独立自由度用超动量表示，并推导局域卡罗尔助推、旋转、外尔变换与微分同胚协变演化方程。\n2. 其关键在于指出无挠且相容共形结构的卡罗尔联络含有真实独立数据；在四维爱因斯坦引力中，该联络未定的横向对称部分正是邦迪剪切，固定邦迪-范德堡-梅茨纳-萨克斯规范后卡罗尔动量与超动量对应邦迪数据，所得方程重现质量与角动量方面的标准演化方程。\n3. 这给出了引力演化方程的边界内禀推导，并把平坦全息中的辐射自由度实现为卡罗尔联络的几何量，为从零无穷共形结构理解渐近平坦引力提供了新框架。", "summary_source": "deepseek", "authors": [{"name": "Simon Pekar"}], "featured_authors": [{"name": "Simon Pekar"}], "author_count": 1}, {"id": "2609.17161", "category": "hep-th", "title": "Supersymmetric extension of the Hull--Lambert--Sen chiral boson on the 2-Torus", "abstract": "We present a supersymmetric extension of the Hull-Lambert-Sen chiral boson model. The two-metric formulation developed by Hull provides a powerful and tractable framework for the quantization of chiral bosons, and we demonstrate that it admits a natural supersymmetric generalization. We construct the theory explicitly on the two-torus and analyze its coupling to external sources.", "url": "https://arxiv.org/abs/2609.17161", "type": "理论", "summary": "1. 该工作在二维环面上构造了Hull–Lambert–Sen手征玻色子模型的超对称扩展，并分析其与外源的耦合。\n2. 其关键在于Hull的双度规表述为手征玻色子量子化提供了强有力且可计算的框架，并被证明可自然容纳超对称推广。\n3. 这为手征玻色子的超对称量子化、环面紧致化及外源响应研究提供了可操作的形式基础。", "summary_source": "deepseek", "authors": [{"name": "Amine El Amri"}, {"name": "Pietro Antonio Grassi"}], "featured_authors": [{"name": "Amine El Amri"}, {"name": "Pietro Antonio Grassi"}], "author_count": 2}, {"id": "2609.17182", "category": "hep-th", "title": "Generalized complexity and dynamical response in holographic Vaidya spacetimes", "abstract": "We investigate \"Complexity=Anything\" for smooth Vaidya geometries, using the Weyl squared functional as the most common candidate for our study. Our numerical analysis of candidates in 4- and 5-dimensional Reissner-Nordström (RN) and 5-dimensional Gauss-Bonnet (GB) shows evolution in both $r$ and $v$ (\"doubled complexity\"), unlike static solutions that depend only on $r$. We then study the difference between the complexity of static and dynamical solutions in the asymptotically AdS regime using a Fefferman-Graham expansion. By expanding the bulk metric, extremal embedding, induced metric, normal vector, and extrinsic curvature simultaneously, we show that the first four FG coefficients cancel between the two geometries. In contrast, the first nonvanishing contribution occurs at the fifth coefficient and is controlled by the boundary stress tensor and its derivatives. During the Vaidya quench, the derivative contribution encodes the time-dependent response of the boundary state. In linear response, this response is governed by the retarded stress-tensor correlator and, through generalized Kramers-Kronig relations, can be represented in terms of its spectral density. We thus identify a connection between generalized holographic complexity and the dynamical stress-tensor response, which in the linear-response regime can be represented in terms of the corresponding stress-tensor spectral density.", "url": "https://arxiv.org/abs/2609.17182", "type": "理论", "summary": "1. 该工作以Weyl平方泛函为候选，在光滑Vaidya时空中研究\"Complexity=Anything\"，并数值分析4维、5维RN及5维Gauss-Bonnet背景。\n2. 借Fefferman-Graham展开发现前四个系数在静态与动力学几何间相消，首个非零项出现在第五系数，由边界应力张量及其导数决定。\n3. 由此把广义全息复杂度与边界应力张量的动力学响应关联起来，线性响应区可由推迟关联函数的谱密度表示。", "summary_source": "deepseek", "authors": [{"name": "Mojtaba Shahbazi"}, {"name": "Monireh Emami"}], "featured_authors": [{"name": "Mojtaba Shahbazi"}, {"name": "Monireh Emami"}], "author_count": 2}, {"id": "2609.17195", "category": "hep-th", "title": "Cohomological Aspects of Entanglement Entropy: From Information Theory to Noncommutative Geometry", "abstract": "We develop a cohomological framework for entanglement entropy that unifies perspectives from information theory, operator algebras, and noncommutative geometry. Starting from the information-theoretic characterization of entropy as a 1-cocycle, we show how this structure generalizes to the quantum setting through Hochschild and cyclic cohomology. A central result is the embedding of an entanglement complex into the Connes cyclic bicomplex via a conditional expectation, identifying entanglement cohomology as the kernel of the restriction map from a von Neumann algebra to its subalgebra. The Tomita-Takesaki modular theory provides the dynamical structure, with the Connes-Radon-Nikodym cocycle serving as the fundamental object encoding relative entanglement. This framework naturally accommodates Type III von Neumann algebras, where no local density matrix exists, offering a rigorous foundation for entanglement in quantum field theory and holography.", "url": "https://arxiv.org/abs/2609.17195", "type": "理论", "summary": "1. 该工作提出纠缠熵的上同调框架，统一信息论、算子代数与非交换几何，并将熵作为1-余圈推广到Hochschild与循环上同调。\n2. 其核心在于用条件期望将纠缠复形嵌入Connes循环双复形，把纠缠上同调识别为限制映射的核，并以Connes-Radon-Nikodym余圈刻画相对纠缠。\n3. 该框架自然容纳无局部密度矩阵的III型von Neumann代数，为量子场论与全息中的纠缠提供严格基础。", "summary_source": "deepseek", "authors": [{"name": "Radoslav C. Rashkov"}], "featured_authors": [{"name": "Radoslav C. Rashkov"}], "author_count": 1}, {"id": "2609.17342", "category": "hep-th", "title": "Low-energy brane decoupling in AdS flux vacua", "abstract": "We study the decoupling of branes sourcing AdS flux vacua from the asymptotic bulk using scalar-wave absorption probabilities. In a one-modulus truncation, the result depends only on the dimension of the AdS vacuum and on the asymptotic steepness of the scalar potential. We find that for any steepness and for any dimension greater than two the absorption probability vanishes in the low-energy limit, showing that the branes decouple from the bulk. We illustrate the general analysis in several scale-separated AdS vacua. For DGKT we find $P_{\\rm abs}\\sim\\omega^{27/7}$ and an effective transverse dimension $d_{\\rm eff}=20/7$. Interestingly, the scalar potential along the brane-induced moduli trajectory agrees with that obtained by compactifying a hypothetical $(4+13/7)$-dimensional gravity theory on a $13/7$-dimensional sphere threaded by flux. We also apply the analysis to scale-separated $\\mathrm{AdS}_3$ examples and to the simplest one-modulus KKLT model.", "url": "https://arxiv.org/abs/2609.17342", "type": "理论", "summary": "1. 该文用标量波吸收概率研究 AdS 通量真空中作为源的膜与渐近体空间的低能解耦，并在单模截断下分析其对 AdS 维数和标量势渐近陡度的依赖。\n2. 核心结果是：只要 AdS 维数大于二，无论势的渐近陡度如何，低能极限下吸收概率均趋于零，表明膜与体空间解耦；在 DGKT 中给出 P_abs ∼ ω^{27/7} 与有效横向维数 d_eff=20/7，并发现沿膜诱导模轨迹的标量势等价于将假想 (4+13/7) 维引力紧化在带通量 13/7 维球面上的结果。\n3. 该分析可推广到尺度分离的 AdS3 与最简单模 KKLT 模型，为检验通量紧化中膜是否真正退耦及低能有效理论的自洽性提供判据。", "summary_source": "deepseek", "authors": [{"name": "Fien Apers"}, {"name": "Noelia Sánchez González"}], "featured_authors": [{"name": "Fien Apers"}, {"name": "Noelia Sánchez González"}], "author_count": 2}, {"id": "2609.17359", "category": "hep-th", "title": "Topological Modular Forms Constrain Threshold States in Extremal $\\mathcal{N}=1$ AdS$_3$ Gravity", "abstract": "We identify a topological constraint on extremal $\\mathcal{N}=1$ AdS$_3$ spectra that is not implied by genus-one modular covariance of the three even spin structure partition functions. Assuming the expected topological modular forms divisibility of the Ramond Witten index, we show that for infinitely many odd $n$ at central charge $c=12n$, an extremal holomorphic $\\mathcal{N}=1$ superconformal field theory requires an odd number of Neveu--Schwarz primaries at the BTZ threshold. Thus the strict ansatz with no threshold primaries is excluded for this infinite family.", "url": "https://arxiv.org/abs/2609.17359", "type": "理论", "summary": "1. 该工作识别出 extremal N=1 AdS3 引力谱中的一个拓扑约束，该约束不能由三个偶自旋结构配分函数的一亏格模协变性推出。\n2. 在假定 Ramond Witten 指标具有拓扑模形式整除性的条件下，他们证明当中心荷 c=12n 且 n 为无穷多个奇数时，extremal 全纯 N=1 超共形场论在 BTZ 阈处必须包含奇数个 Neveu–Schwarz 原初态。\n3. 因此，无阈处原初态的严格拟设对这一无限族被排除，说明 TMF 约束能给出超越常规模不变性的谱限制，并提示 AdS3 量子引力中阈处态与拓扑索引之间存在深层联系。", "summary_source": "deepseek", "authors": [{"name": "Yutaka Yoshida"}], "featured_authors": [{"name": "Yutaka Yoshida"}], "author_count": 1}, {"id": "2609.17426", "category": "hep-th", "title": "Channel-Resolved High-Overtone Quasinormal Modes Decode Kasner Scaling inside Black Holes", "abstract": "The high-overtone quasinormal-mode spectrum encodes the near-singularity Kasner scaling of black-hole interiors. We show that distinct structures in this spectrum independently determine the temporal and spatial Kasner grades, allowing the corresponding metric exponents to be reconstructed without imposing Kasner constraints or invoking holography. We demonstrate this independent reconstruction at the fixed Kasner point of five-dimensional asymptotically flat Schwarzschild and planar Schwarzschild--AdS$_5$, and then extend it to a continuously varying Gibbons--Maeda black-hole family. The reconstructed exponents satisfy the Kasner relation a posteriori, providing a nontrivial geometric consistency check. More generally, the high-overtone spectrum separates into global spectral data and local algebraic corrections whose fractional powers are fixed by the near-singularity Kasner geometry. These fractional corrections therefore provide a direct spectral probe of the local geometry behind the horizon.", "url": "https://arxiv.org/abs/2609.17426", "type": "理论", "summary": "1. 该工作表明高泛音准正规模谱编码黑洞内部近奇异区的 Kasner 标度，并据此独立重构时间与空间 Kasner 指数，而无需预设 Kasner 约束或全息对偶。\n2. 作者在五维渐近平直 Schwarzschild、平面 Schwarzschild-AdS5 及连续变化的 Gibbons-Maeda 黑洞族中验证，不同谱结构分别确定两类 Kasner 级数，且重构指数事后满足 Kasner 关系，提供非平凡几何自洽检验。\n3. 更一般地，高泛音谱分离为全局谱数据与由近奇异 Kasner 几何固定的局域代数修正，其分数幂可作为视界后局域几何的直接谱学探针。", "summary_source": "deepseek", "authors": [{"name": "Zi-Qing Xiao"}, {"name": "Jun Nian"}, {"name": "Li Li"}], "featured_authors": [{"name": "Zi-Qing Xiao"}, {"name": "Jun Nian"}, {"name": "Li Li"}], "author_count": 3}, {"id": "2609.17447", "category": "hep-th", "title": "On the relaxation dynamics of non-equilibrium quantum systems", "abstract": "We investigate the relaxation of an approximately conserved charge in interacting quantum systems close to local equilibrium. To this end, we provide a pedagogical review of Zubarev's non-equilibrium statistical operator approach in the minimal setting of a single non-conserved charge and apply it to the problem at hand. We explicitly highlight the physical assumptions that lead to a local relaxation law: weak charge violation, a separation between the short timescale of microscopic correlations and the much longer timescale of charge relaxation, and the resulting loss of microscopic memory. Under these conditions, the leading relaxation rate is determined by an equilibrium correlation function of the charge-violating operator. We show that the same result follows from a simpler local-equilibrium construction based on the system's evolution over an intermediate timescale, providing a direct alternative for practical calculations and making the common physical ingredients of the two approaches explicit. Beyond the decay law itself, we relate the relaxation rate to the equilibrium diffusion of the same charge. We then allow the charge density to vary in space, which leads to a diffusion-relaxation equation. Finally, we illustrate the formalism through electroweak $\\mathrm{B+L}$ washout and a perturbative scalar model, where agreement with the linearized Boltzmann equation establishes a direct connection between equilibrium-correlator and kinetic descriptions.", "url": "https://arxiv.org/abs/2609.17447", "type": "理论", "summary": "1. 该工作以Zubarev非平衡统计算符框架，在单个非守恒荷的最小设定下研究近局域平衡量子系统的弛豫动力学。\n2. 它厘清弱荷破坏、微观与弛豫时间尺度分离及记忆丢失等假设，证明弛豫率由荷破坏算符的平衡关联函数决定，并给出更简局域平衡构造。\n3. 该框架将弛豫率联于平衡扩散并导出扩散-弛豫方程，还借电弱B+L washout与微扰标量模型同线性化Boltzmann方程吻合，沟通关联函数与动理学描述。", "summary_source": "deepseek", "authors": [{"name": "Matthias Carosi"}, {"name": "Björn Garbrecht"}, {"name": "Silvia Pla"}, {"name": "Nils Wagner"}, {"name": "Edward Wang"}], "featured_authors": [{"name": "Matthias Carosi"}, {"name": "Björn Garbrecht"}, {"name": "Silvia Pla"}, {"name": "Nils Wagner"}, {"name": "Edward Wang"}], "author_count": 5}, {"id": "2609.17528", "category": "hep-th", "title": "Exact Black Branes in General Dimensions in Higher-Curvature Scalar-Tensor Gravity", "abstract": "We obtain two families of neutral planar black branes in a potential-free dilaton-coupled Lovelock--Horndeski theory. Heterotic compactification relates higher-dimensional curvature to scalar dynamics and motivates the interaction structure. At fixed scalar zero mode, the horizon radius and temperature vary while the complete stationary Wald entropy remains constant and positive. The exponential scalar factor at the horizon exactly compensates the area growth, giving this behavior a direct geometric explanation. An exact coefficient analysis determines the two four-dimensional branches and their continuation to every higher dimension through closed coupling relations. The linear family is conformally flat and leaves the AdS scale free at fixed couplings; the fractional family is Weyl curved and fixes that scale. The common kinetic relation also excludes their realization through a real one-scalar flat-torus reduction of a metric--dilaton parent.", "url": "https://arxiv.org/abs/2609.17528", "type": "理论", "summary": "1. 该工作在无势伸缩子耦合的Lovelock-Horndeski理论中，获得两族中性平面黑膜，并确定四维分支及向任意高维的闭合耦合延拓。\n2. 关键卖点是固定标量零模时视界半径与温度可变，而完整静态Wald熵保持常数且为正，视界指数标量因子精确补偿面积增长。\n3. 其意义在于线性族共形平坦且AdS尺度自由，分数族Weyl弯曲并固定AdS尺度，且排除实单标量平环化约的度规-伸缩子母理论。", "summary_source": "deepseek", "authors": [{"name": "Tianhao Wu"}], "featured_authors": [{"name": "Tianhao Wu"}], "author_count": 1}, {"id": "2609.16043", "category": "math-ph", "title": "Gauged AKSZ sigma models", "abstract": "We propose a new class of sigma models that extend AKSZ sigma models, which we refer to as gauged AKSZ sigma models. These models are constructed using QP-manifolds. The compatibility between the AKSZ structure and gauging is characterized by geometric conditions on the target graded manifold. As an example, we explicitly analyze the gauging of higher Courant sigma models in higher dimensions. When fluxes and boundaries are introduced into gauged higher Courant sigma models, generalizations of momentum maps and Hamiltonian $G$-spaces arise as consistency conditions for the models.", "url": "https://arxiv.org/abs/2609.16043", "type": "理论", "summary": "1. 该文在AKSZ框架中引入规范对称性，提出一类新的sigma模型，并用QP流形构造。\n2. 其核心是以靶分级流形上的几何条件刻画AKSZ结构与规范化的相容性，并显式分析高维高阶Courant sigma模型。\n3. 引入通量与边界后，广义动量映射和Hamiltonian G-空间作为一致性条件出现，为高阶几何与规范理论提供启发。", "summary_source": "deepseek", "authors": [{"name": "Noriaki Ikeda"}], "featured_authors": [{"name": "Noriaki Ikeda"}], "author_count": 1}, {"id": "2609.16949", "category": "math-ph", "title": "Reflectionless edge states in Dirac models of topological insulators", "abstract": "We study an effective model of topological insulators joined along a bent interface. The Hamiltonian is a Dirac operator $\\mathcal{D} = D_1\\sigma_1 + D_2\\sigma_2 + \\kappa(x) \\sigma_3$ on $L^2(\\mathbb{R}^2,\\mathbb{C}^2)$, where $\\kappa(x)$ represents a domain wall with a corner: while initially straight, it undergoes a bend when passing from one side of $\\mathbb{R}^2$ to the other. For most energies in a spectral window centered at $0$, we construct a reflectionless edge state of $\\mathcal{D}$: a distorted plane wave with transmission coefficient of modulus $1$. This implies that $\\mathcal{D}$ admits modes confined near $\\kappa^{-1}(\\{0\\})$, that travel through the bend with no loss neither to the bulk nor to reflection. Our result explains experimental observations from the physics literature, as well as our own numerical simulations.", "url": "https://arxiv.org/abs/2609.16949", "type": "理论", "summary": "1. 该工作研究了沿弯折界面拼接的拓扑绝缘体有效狄拉克模型，在带角点的畴壁 κ(x) 上分析算子 D = D1σ1 + D2σ2 + κ(x)σ3。\n2. 其核心结果是：在零点附近谱窗内的大多数能量处构造出无反射边缘态，表现为透射系数模为 1 的畸变平面波，表明模式束缚于 κ^{-1}({0}) 附近并可无损耗穿过弯折，既不泄漏到体态也不产生反射。\n3. 这一机制解释了相关实验观测与数值模拟，并提示弯折拓扑界面可作为低耗散/无背散射输运的鲁棒平台，为后续理论与器件设计提供依据。", "summary_source": "deepseek", "authors": [{"name": "Alexis Drouot"}], "featured_authors": [{"name": "Alexis Drouot"}], "author_count": 1}, {"id": "2609.16969", "category": "math-ph", "title": "Operator-theoretic and analytic properties of a driven single-mode Kerr cavity in Bargmann space", "abstract": "We study the stationary spectrum of a coherently driven single-mode Kerr cavity in Bargmann--Fock space. For positive Kerr coupling the Hamiltonian is self-adjoint, bounded below, and has compact resolvent. For nonzero drive, a minimal-solution continued fraction yields an exact scalar spectral condition, with all eigenvalues simple. A Liouville transformation identifies the eigenvalue equation with a degenerate double-confluent Heun problem and classifies its singularities. An Olver-type Volterra construction gives normalized sectorial solutions at infinity with explicit error bounds. In the strong-drive regime, the leading turning-point energy coefficient is proved, whereas the next coefficient remains conditional on a stated global-connection conjecture; independent Bogoliubov and complex-WKB calculations provide consistency checks. A formal weak-drive expansion is verified from the Bargmann recurrence, and its upper-edge tridiagonal series is summed in closed form. Exploratory WKB iteration portraits are included only as visual aids and do not establish the conjectural global connection.", "url": "https://arxiv.org/abs/2609.16969", "type": "理论", "summary": "1. 该工作在有驱动单模Kerr腔的Bargmann–Fock空间中研究定态谱，证明正Kerr耦合下哈密顿量自伴、下有界且具紧预解。\n2. 卖点是最小解连分式给出精确谱条件且本征值单重，Liouville变换将本征方程化为退化双合流Heun问题，Olver型Volterra构造给出显式误差界。\n3. 强驱动下已证明首阶转折点能量系数，次阶系数仍依赖全局连接猜想，为驱动Kerr腔谱分析提供严格框架与可检验判据。", "summary_source": "deepseek", "authors": [{"name": "Maciej Janowicz"}], "featured_authors": [{"name": "Maciej Janowicz"}], "author_count": 1}, {"id": "2609.17441", "category": "math-ph", "title": "Diassociative conformal algebras and their deformation cohomology", "abstract": "In this paper, we introduce diassociative conformal algebras that unify both associative conformal algebras and diassociative algebras. We show that the category of diassociative conformal algebras is equivalent to the category of equivalence classes of formal distribution diassociative algebras. By employing its Maurer-Cartan characterization, we then define the cohomology of a diassociative conformal algebra and show that it carries a Gerstenhaber algebra structure. Our cohomology can be used to study deformations and extensions of the structure. Finally, we define averaging operators on associative conformal algebras and find their close relations with diassociative conformal algebras.", "url": "https://arxiv.org/abs/2609.17441", "type": "理论", "summary": "1. 该文引入双结合共形代数，统一结合共形代数与双结合代数，并证明其范畴等价于形式分布双结合代数的等价类范畴。\n2. 其技术卖点是以毛雷尔-嘉当刻画定义形变上同调，证明其上同调承载格斯坦哈伯代数结构，并用于形变与扩张。\n3. 该框架通过结合共形代数上的平均算子与双结合共形代数的联系，为共形代数形变与扩张研究提供新工具。", "summary_source": "deepseek", "authors": [{"name": "Anupam Sahoo"}, {"name": "Apurba Das"}], "featured_authors": [{"name": "Anupam Sahoo"}, {"name": "Apurba Das"}], "author_count": 2}, {"id": "2609.17518", "category": "math-ph", "title": "Higher abelian gauge theory in BV formalism", "abstract": "A BV structure is constructed on the space of zero modes of a quadratic elliptic higher abelian gauge theory. The associated BV integral is shown to be independent of the choice of zero-mode Lagrangian under mild hypotheses. The construction yields explicit zero-mode partition functions for several $p$-form abelian gauge theories.", "url": "https://arxiv.org/abs/2609.17518", "type": "理论", "summary": "1. BV 结构构建在二次椭圆高阿贝尔规范理论的零模空间上。\n2. 其卖点在于提炼出该问题中的关键机制、方法优势或可计算结构。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Shuhan Jiang"}], "featured_authors": [{"name": "Shuhan Jiang"}], "author_count": 1}, {"id": "2609.16108", "category": "quant-ph", "title": "Large-scale quantum simulations of dissipative spin-1/2 Heisenberg chains", "abstract": "A quantum many-body system coupled to an environment relaxes to a nonequilibrium steady state that can sustain order with no equilibrium counterpart. Computing such steady states is harder than closed-system dynamics as the density matrix problem squares the Hilbert-space dimension, and no free energy selects the steady state. The dissipative spin-1/2 Heisenberg chain is a benchmark example for nonequilibrium steady state physics; various methods have each calculated its phase diagram but do not agree, and a controlled determination at large system size has remained out of reach. Here we simulate the Lindblad dynamics of chains of up to 50 sites on the superconducting processor ibm_kingston -- 100 simultaneously active qubits at up to 1700 entangling-gate depths -- realizing the dissipation via Stinespring dilation. The system's dissipative evolution is a self-correcting mechanism that effectively erases errors, so hardware noise enters only as a weak competing dissipator. We measure static structure factors and resolve ferromagnetic, antiferromagnetic, spin-density-wave, and paramagnetic steady states, mapping the phase diagram with 117 quantum hardware data points across the $J_x$--$J_y$ plane. We uncover a rich non-equilibrium phase diagram of ordered phases with only remnants of the mean-field order, and where sharp transitions give way to the crossovers expected in one dimension. We also find the existence of an incipient (Trotter-induced) spin density wave phase, highlighting the potential of controlled Trotterization as a tool to engineer various magnetic phases in dissipative spin systems. Our quantum simulations largely settle the lingering uncertainty regarding the correct phase diagram of this benchmark system. Moreover, they show that quantum computers are now a feasible tool for addressing scientific questions involving dissipative quantum systems.", "url": "https://arxiv.org/abs/2609.16108", "type": "数值", "summary": "1. 与环境耦合的量子多体系统松弛到非平衡稳态，可以在没有平衡对应物的情况下维持秩序。\n2. 我们测量静态结构因子并解析铁磁、反铁磁、自旋密度波和顺磁稳态，在 $J_x$-$J_y$ 平面上绘制具有 117 个量子硬件数据点的相图。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "João C. Getelina"}, {"name": "Andrew Cox"}, {"name": "Muhammad Asaduzzaman"}, {"name": "Omar Alsheikh"}, {"name": "Ryan S. Bennink"}, {"name": "James K. Freericks"}, {"name": "Alexander F. Kemper"}], "featured_authors": [{"name": "João C. Getelina"}, {"name": "Andrew Cox"}, {"name": "Muhammad Asaduzzaman"}, {"name": "Ryan S. Bennink"}, {"name": "James K. Freericks"}, {"name": "Alexander F. Kemper"}], "author_count": 7}, {"id": "2609.16125", "category": "quant-ph", "title": "Hyperbolic color codes with constant rate and polynomial distance", "abstract": "Recent advances in quantum hardware relax the strict geometric-locality constraints traditionally imposed on quantum error-correcting codes, motivating interest in high-rate quantum low-density parity-check (qLDPC) codes. At the same time, color codes provide a particularly rich setting for fault-tolerant quantum computation, underlying protocols such as single-shot error correction and self-correcting quantum computation. Hyperbolic color codes provide a class of high-rate qLDPC codes that also retain the structural features of color codes relevant to fault-tolerant quantum computation. However, previous constructions of hyperbolic color codes have achieved at most logarithmic code distance. In this work, we construct hyperbolic color codes with both constant rate and polynomial distance by building on arithmetic hyperbolic manifolds that support polynomial-distance hyperbolic toric codes. Our construction applies in arbitrary dimension \\(D\\geq 4\\). In even dimensions, the resulting type-\\(D/2\\) color codes have constant encoding rate and polynomial distance, while in other cases the number of logical qubits and the code distance both exhibit polynomial scaling. We further derive explicit exponents for polynomial lower bounds as functions of the dimension and code type. These results establish a family of hyperbolic color codes simultaneously achieving constant rate and polynomial distance and providing a testbed to explore fault-tolerant quantum computation protocols that combine high-rate quantum codes with the structural advantages of color codes.", "url": "https://arxiv.org/abs/2609.16125", "type": "理论", "summary": "1. 该工作构建了基于算术双曲流形的双曲色码，在任意维度 D≥4 上同时实现常码率与多项式距离，突破了此前双曲色码距离至多对数的限制。\n2. 其核心是利用可支持多项式距离双曲环面码的算术双曲流形；偶数维所得 type-D/2 色码具有常编码率与多项式距离，其他维逻辑比特数和距离均为多项式缩放，并给出多项式下界的显式维度依赖指数。\n3. 这确立了兼具高码率与色码结构优势的一类 qLDPC 码，并为探索单发纠错、自校正量子计算等容错协议提供了可扩展测试平台。", "summary_source": "deepseek", "authors": [{"name": "Shun Hasegawa"}, {"name": "Hayata Yamasaki"}], "featured_authors": [{"name": "Shun Hasegawa"}, {"name": "Hayata Yamasaki"}], "author_count": 2}, {"id": "2609.16133", "category": "quant-ph", "title": "Pulse-Level Compilation of Measurement-Free Recovery in Transmon Circuits", "abstract": "Quantum error correction commonly relies on syndrome measurement, decoding, and conditional feedback. We numerically show that the conditional spectrum of an interacting transmon circuit can compile a local recovery rule into a fixed open-loop control cycle. In a four-bit repetition-code ring, the resulting input-independent control slows the decay of logical coherence under Pauli-\\(X\\) noise and stabilizes logical-one population under data relaxation relative to uncorrected references. Its local, bounded-degree architecture provides a hardware-native framework for extending compiled recovery control to larger quantum networks.", "url": "https://arxiv.org/abs/2609.16133", "type": "实验", "summary": "1. 该工作数值展示相互作用Transmon电路的条件谱可将局部恢复规则编译为固定开环控制周期，无需测量。\n2. 其核心卖点是在四比特重复码环中，输入无关控制相对未纠错参考减缓Pauli-X噪声下逻辑相干衰减，并稳定数据弛豫时的逻辑1布居。\n3. 该局域有界度架构为把编译恢复控制扩展到更大量子网络提供了硬件原生框架。", "summary_source": "deepseek", "authors": [{"name": "Yi-Han Yu"}, {"name": "Kai Xu"}, {"name": "Heng Fan"}], "featured_authors": [{"name": "Yi-Han Yu"}, {"name": "Kai Xu"}, {"name": "Heng Fan"}], "author_count": 3}, {"id": "2609.16140", "category": "quant-ph", "title": "Designs without disorder: unitary $k$-designs from a single-site bulk defect", "abstract": "We show that an $O(1)$ local defect is sufficient to generate approximate unitary $k$-designs from an otherwise integrable quantum many-body system. Using a two-Pauli-kick (2PK) protocol with temporal sampling, we demonstrate this mechanism in a fixed-magnetization sector of deterministic XXZ spin chains with a single integrability-breaking bulk defect. We derive an analytical selection rule for the Pauli kicks and show that symmetry-preserving strings with a specific domain-wall count, fixed by the couplings, govern design formation. An exhaustive search over all admissible Pauli strings identifies a broad family of kicks that produce designs in the chaotic regime, whereas no such kicks exist in the integrable limit, including for boundary defects. We further show that the design-forming mechanism remains effective for weak bulk defects as the system size increases.", "url": "https://arxiv.org/abs/2609.16140", "type": "理论", "summary": "1. 该工作证明，在原本可积的量子多体系统中，仅需一个O(1)大小的局域体内缺陷即可生成近似酉k-design，并在固定磁化扇区的确定性XXZ自旋链上通过含时采样的双Pauli踢协议验证了该机制。\n2. 其核心在于推导出Pauli踢的解析选择定则，并表明由耦合固定、具有特定畴壁数的对称保持字符串决定设计形成；穷举所有容许Pauli字符串显示混沌区存在广泛踢族，而可积极限（包括边界缺陷）无此踢族。\n3. 这提示无需无序即可由单个体内缺陷诱导酉k-design，且弱体内缺陷在大尺寸下仍有效，为利用可积模型中的局域破坏实现随机化提供路径。", "summary_source": "deepseek", "authors": [{"name": "Samudra Sur"}, {"name": "Pratik Nandy"}], "featured_authors": [{"name": "Samudra Sur"}, {"name": "Pratik Nandy"}], "author_count": 2}, {"id": "2609.16142", "category": "quant-ph", "title": "Investigating Interacting Fermionic Models with Locality-Preserving Qubit Encodings", "abstract": "We investigate the utility of the locality-preserving Derby-Klassen (DK) fermion-to-qubit mapping [ arXiv:2003.06939 ] for variational quantum simulation of two-dimensional $t$-$V$ and Fermi-Hubbard models. The DK mapping preserves the locality of fermionic interactions with an enlarged Hilbert space, thereby requiring additional constraints that define the physical sector. We incorporate these constraints directly into a Hamiltonian Variational Ansätz (HVA) through Clifford-gate state preparation and use the Variational Quantum Eigensolver (VQE) to show that the low-energy properties of the resulting qubit Hamiltonian are accurately reproduced. We further exploit particle-number conservation inherent in the ansätz to resolve distinct symmetry sectors and reliably access degenerate states. Consequently, we benchmark the DK-HVA against Jordan-Wigner-based variational circuits at nonzero chemical potential, where particle-hole symmetry and the associated half-filled sign-free condition are absent. Finally, we demonstrate the advantage of locality-preserving mappings in higher-dimensional fermionic systems, where the conventional Jordan-Wigner (JW) transformation generates increasingly long Pauli strings and corresponding circuit overheads. We further extend the framework to the spinful Fermi-Hubbard model and identify a tradeoff between fermionic-mode placement and the locality of hopping and on-site interaction terms. These results establish a practical framework combining locality-preserving fermion-to-qubit mappings, constraint-preserving Clifford state preparation, and symmetry-preserving variational circuits, that trades auxiliary-qubit and stabilizer-preparation overhead for reduced operator nonlocality, providing a practical route toward resource-efficient quantum simulation of higher-dimensional interacting fermionic systems.", "url": "https://arxiv.org/abs/2609.16142", "type": "理论+数值", "summary": "1. 该工作研究了保持局域性的Derby-Klassen费米子-量子比特映射在二维t-V与Fermi-Hubbard模型变分量子模拟中的效用。\n2. 其核心是将DK映射的物理扇区约束直接嵌入基于Clifford态制备的HVA，并利用粒子数守恒分辨对称扇区、获取简并态。\n3. 该方法以辅助量子比特和稳定子制备开销换取算符非局域性降低，为高维相互作用费米子体系资源高效量子模拟提供可行路径。", "summary_source": "deepseek", "authors": [{"name": "Ashutosh P. Tripathi"}, {"name": "Debasish Banerjee"}, {"name": "Sandip Maiti"}, {"name": "Nilmani Mathur"}], "featured_authors": [{"name": "Ashutosh P. Tripathi"}, {"name": "Debasish Banerjee"}, {"name": "Sandip Maiti"}, {"name": "Nilmani Mathur"}], "author_count": 4}, {"id": "2609.16198", "category": "quant-ph", "title": "Utility-Based Path Selection and Configuration in Quantum Networks via Layered Shortest Paths", "abstract": "A path in a quantum network is a chain of repeaters that distributes entanglement between two users. Selecting a path requires balancing the rate
