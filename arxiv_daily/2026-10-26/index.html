判据原则上可由两个大质量标量体间非相对论势的首个后牛顿修正探测，为检验高自旋媒介子零质量极限提供了明确的可观测入口。", "summary_source": "deepseek", "authors": [{"name": "Dominik Haslehner"}, {"name": "Elena Kaiser"}, {"name": "Javi Serra"}, {"name": "Andreas Weiler"}], "featured_authors": [{"name": "Dominik Haslehner"}, {"name": "Elena Kaiser"}, {"name": "Javi Serra"}, {"name": "Andreas Weiler"}], "author_count": 4}, {"id": "2610.31760", "category": "hep-th", "title": "Generalized Thermodynamics and Phase Transitions of Vaidya-adS Black Holes", "abstract": "This work investigates the thermodynamics of non-stationary anti-de Sitter (adS) black holes and their gauge-gravity duals. To model a non-equilibrium process, we employ a time-dependent Vaidya-adS metric to describe the collapse of a null fluid and the subsequent thermalization of the dual field theory. We introduce an effective version of free energy as a quasilocal probe to be used in a dynamical setup. By analyzing how this quantity evolves, we show that a first-order phase transition occurs when the final black-hole mass exceeds the limit established by the Hawking-Page temperature. Furthermore, we demonstrate that the final state only approaches the thermal behavior of the N=4 supersymmetric Yang-Mills theory for mass states much larger than the adS radius. Finally, we compute the boundary energy-momentum tensor using holographic renormalization and compare the resulting energy density with the strong-coupling limit. This demonstrates that the dual description provides a consistent framework for both the equilibrium and non-equilibrium thermodynamics of strongly coupled gauge theories.", "url": "https://arxiv.org/abs/2610.31760", "type": "理论", "summary": "1. 该工作以含时 Vaidya-adS 度规描述零质量流体坍缩及对偶场论热化，系统研究非稳态反德西特黑洞的热力学与规范-引力对偶。\n2. 其关键在于引入可作为动力学准局域探针的有效自由能，并据此识别当末态黑洞质量超过 Hawking-Page 温度所定界限时出现的一阶相变。\n3. 结果表明末态仅在质量尺度远大于 adS 半径时才趋近 N=4 超对称杨-米尔斯热行为，且边界能动张量的全息重整化计算为强耦合规范理论平衡与非平衡热力学提供了一致框架。", "summary_source": "deepseek", "authors": [{"name": "A. F. Cardona"}, {"name": "C. Molina"}], "featured_authors": [{"name": "A. F. Cardona"}, {"name": "C. Molina"}], "author_count": 2}, {"id": "2610.31780", "category": "hep-th", "title": "Fermions Scattering Off Non-Abelian Rotors", "abstract": "We study the dynamics of $d=1+1$ chiral fermions interacting with a rotor impurity. The rotors are non-Abelian, taking values in either an $SU(N)$ group manifold, or an $SU(N)/SO(N)$ coset. At low energies, the fermions pass through the impurity, seemingly unimpeded, but trailing a topological line that is necessary for current conservation. In certain cases, these topological lines exhibit non-Abelian fusion and braiding. This can be viewed as a toy model that captures aspects of s-wave monopole-fermion scattering in $d=3+1$ dimensions.", "url": "https://arxiv.org/abs/2610.31780", "type": "理论", "summary": "1. 该工作构建并分析了1+1维手征费米子与非阿贝尔转子杂质相互作用的动力学，转子取值于SU(N)群流形或SU(N)/SO(N)陪集。\n2. 其关键物理在于低能下费米子看似无阻穿透杂质，却必须拖曳一条维持电流守恒的拓扑线，且特定情形下这些拓扑线呈现非阿贝尔融合与编织。\n3. 这一玩具模型可类比3+1维s波单极子-费米子散射，并为拓扑线、电流守恒与非阿贝尔统计的受控研究提供启发。", "summary_source": "deepseek", "authors": [{"name": "George Koundouros"}, {"name": "David Tong"}], "featured_authors": [{"name": "George Koundouros"}, {"name": "David Tong"}], "author_count": 2}, {"id": "2610.31839", "category": "hep-th", "title": "Gauge conditions in the perturbative quantization of quadratic gravity and its quantum Lagrangian", "abstract": "In the perturbative formulation of the Hamiltonian of quadratic gravity, a specific gauge condition is required to hold the equivalence of the Hamiltonian equations of motion with the covariant field equations. Here we give robust evidence that this is an effect of perturbations, the exact nonperturbative equations of both formulations are equivalent, with no need of specific gauge conditions. Despite this, the required gauge condition must be imposed in the perturbative approach. We use it, together with other conditions obtained on very broad grounds, to obtain the quantum Lagrangian resulting from the integration on the canonical variables of the BFV quantization of the theory. This allow us to characterize the quantum modes from the Lagrangian perspective.", "url": "https://arxiv.org/abs/2610.31839", "type": "理论", "summary": "1. 该工作系统考察二次引力微扰哈密顿形式与协变场方程等价所依赖的特定规范条件，并利用BFV量子化中对正则变量的积分构造相应的量子拉格朗日量。\n2. 其技术卖点在于给出稳健证据表明该规范条件来自微扰展开而非非微扰理论：精确层面两种表述已等价、无需特定规范，但微扰量子化仍须施加该条件并配合宽泛约束以消去正则变量。\n3. 所得量子拉格朗日量使人们能从拉格朗日视角识别和刻画量子模式，为二次引力量子化中的规范选择、模式分析及后续计算提供明确而可操作的启发。", "summary_source": "deepseek", "authors": [{"name": "Jorge Bellorin"}, {"name": "Claudio Bórquez"}, {"name": "Byron Droguett"}], "featured_authors": [{"name": "Jorge Bellorin"}, {"name": "Claudio Bórquez"}, {"name": "Byron Droguett"}], "author_count": 3}, {"id": "2610.31953", "category": "hep-th", "title": "Towards ${\\cal N}=8$ Supergravity in ${\\cal N}=1$ Superspace", "abstract": "We study the possibility of constructing maximally supersymmetric supergravity in ${\\cal N}=1$ superspace. We dimensionally reduce the eleven dimensional supersymmetry transformations, and decouple these transformations using the residual $G_2$ symmetry of the theory. This allows us to find the ${\\cal N}=1$ superfields relevant to this theory. Among our results, we find a description of a self-dual superfield involving a spin 1 and a spin 3/2 field which does not seem to have been discussed previously in the literature.", "url": "https://arxiv.org/abs/2610.31953", "type": "理论", "summary": "1. 该文探讨在N=1超空间中构造最大超对称超引力的可行性，通过对十一维超对称变换作维度约化来识别相应的N=1超场。\n2. 其技术核心是利用理论残余的G2对称性解耦约化后的变换，并给出一个包含自旋1与自旋3/2场的自对偶超场描述，该表述此前未见文献讨论。\n3. 这为将最大超对称超引力表述为N=1超空间理论提供了具体路径，并提示自对偶超场可成为组织相关多重态及后续约化研究的工具。", "summary_source": "deepseek", "authors": [{"name": "Arvind Rajaraman"}], "featured_authors": [{"name": "Arvind Rajaraman"}], "author_count": 1}, {"id": "2610.31989", "category": "hep-th", "title": "Melonic ladder holography with a single free bulk field in AdS$_{d+1}$", "abstract": "We derive a cylinder from the pair Casimir of a CFT$_d$: at zero centre momentum it depends only on relative dilations and rotations. Relative-coordinate radial quantisation then encodes exchanged family labels as cylinder energies. For a melonic CFT$_d$ in the normalisable and stable range, the reduced ladder sum is the Robin boundary-to-boundary propagator of a single free scalar field in rigid AdS$_{d+1}$, with the cylinder as its conformal boundary. The Robin boundary condition and bulk regularity (or parity) determine the holographic radial extension of the boundary data. A nonzero Robin boundary coefficient in global AdS breaks $2d$ AdS generators, yet the scalar's boundary propagator still encodes the conformal data of the melonic ladder. We demonstrate the correspondence for the Sachdev--Ye--Kitaev and the $d=2$ disorder-free long-range Amit--Roginsky melonic models, which correspond to a single free local scalar in AdS$_2$ and AdS$_3$, respectively.", "url": "https://arxiv.org/abs/2610.31989", "type": "理论", "summary": "1. 该工作从CFT_d的配对卡西米尔量构造柱面，并在零中心动量下将melon型共形场论的约化梯形求和映射为刚性AdS_{d+1}中单个自由标量的Robin传播子。\n2. 其核心是用相对坐标径向量子化把交换族标签编码为柱面能量，并由Robin边界条件与体正规性/宇称固定边界数据的径向延拓；非零Robin系数虽破坏全局AdS的2d个生成元，标量边界传播子仍保留melon梯子的共形数据。\n3. 该对应在SYK与d=2无无序长程Amit–Roginsky melon模型中分别落实为AdS_2和AdS_3中的单个自由局域标量，为单自由体场刻画melon全息提供了可检验启示。", "summary_source": "deepseek", "authors": [{"name": "Kok Hong Thong"}], "featured_authors": [{"name": "Kok Hong Thong"}], "author_count": 1}, {"id": "2610.32030", "category": "hep-th", "title": "Can Spontaneous Time-Translation Symmetry Breaking Be Quantized Without Explicit Branches?", "abstract": "Can classically branched dynamics associated with spontaneous time-translation-symmetry breaking be quantized without explicitly retaining the branches of the Hamiltonian? We investigate this question using a reduced phase space. formulation in which the Hamiltonian is single-valued, while the critical structure of the classical Legendre map is encoded in a singular, momentum-dependent symplectic geometry. Quantization of the reduced Poisson algebra yields a deformed position-momentum commutator whose singularities determine distinct regular momentum sectors. Using the positive measure induced by the reduced symplectic structure, we identify a bounded central sector and two unbounded outer sectors. In the central sector, states with vanishing mean momentum obey a nonzero lower bound on position uncertainty, subject to the operator-domain assumptions of the representation. We further identify a possible field-theoretic connection with k-essence, where nonlinear scalar-field kinetics can produce finite-velocity degeneracies of the Legendre map. The relationship between the resulting reduced quantum description and branch-matching quantization remains unresolved and requires a comparison of the corresponding Hilbert spaces and operator domains.", "url": "https://arxiv.org/abs/2610.32030", "type": "理论", "summary": "1. 该文在约化相空间框架中探讨自发时间平移对称破缺所伴随的经典分支动力学能否在不显式保留哈密顿量分支的情况下量子化，并用单值哈密顿量与奇异、依赖动量的辛几何编码经典Legendre映射的临界结构。\n2. 其核心在于对约化Poisson代数量子化后得到位置—动量对易子变形，奇异性划分出不同正则动量扇区；由约化辛结构诱导的正测度给出一个有界中心扇区与两个无界外围扇区，且中心扇区内零平均动量态在算符定义域假设下具有非零位置不确定度下界。\n3. 这提示与k-essence等非线性标量场动力学中Legendre映射有限速度简并的可能联系，但约化量子描述与分支匹配量子化之间的Hilbert空间及算符定义域比较仍未解决。", "summary_source": "deepseek", "authors": [{"name": "Partha Nandi"}], "featured_authors": [{"name": "Partha Nandi"}], "author_count": 1}, {"id": "2610.32552", "category": "hep-th", "title": "Phase transitions of a cubic Casimir matrix model on the fuzzy sphere", "abstract": "In this work, we analyse the phase transitions of a higher derivative matrix model on the fuzzy space, where the kinetic term is a cubic polynomial on the Casimir invariant. The phase transitions of the model are determined numerically and the presence of a triple point is exhibited. The associated critical values of the coupling parameters are calculated numerically and compared with the linear and quadratic Casimir models, showing that the cubic Casimir kinetic term helps to reduce the UV/IR mixing in these models.", "url": "https://arxiv.org/abs/2610.32552", "type": "理论", "summary": "1. 该工作针对模糊球面上动能项为卡西米尔不变量三次多项式的高阶导数矩阵模型，通过数值方法确定其相变结构并展示三相交点。\n2. 其核心卖点在于数值给出临界耦合参数，并将三次模型与线性和二次卡西米尔模型对照，表明三次卡西米尔动能项有助于降低这些模型中的紫外/红外混合。\n3. 这为高阶导数矩阵模型及模糊空间上紫外/红外混合的控制提供了定量依据，并对后续相图、临界行为与连续极限研究具有明确启发。", "summary_source": "deepseek", "authors": [{"name": "Edgar Guzmán-González"}, {"name": "Marco Maceda"}, {"name": "Andrés Tornero"}], "featured_authors": [{"name": "Edgar Guzmán-González"}, {"name": "Marco Maceda"}, {"name": "Andrés Tornero"}], "author_count": 3}, {"id": "2610.32599", "category": "hep-th", "title": "Gauge-field energy density in inflationary kinetic-coupling models: QFT regularization versus horizon cutoffs", "abstract": "Coupling gauge fields to the inflaton can amplify their quantum fluctuations during inflation, with potential applications to a range of cosmological phenomena. A central challenge is to define finite and physically meaningful observables, such as the gauge-field energy density. In this work, we study an Abelian gauge field kinetically coupled to the inflaton through $f^2(\\phi)F_{\\mu\\nu}F^{\\mu\\nu}$ in a de Sitter background with $f\\propto a^{\\gamma_1}$, and compare conventional quantum-field-theoretic regularization with horizon-cutoff prescriptions. Using a hard physical-momentum cutoff and dimensional regularization, we derive the ultraviolet divergences in closed form and fix the remaining one-parameter finite-part ambiguity by requiring the coupling-induced total energy density to be nonnegative. We then examine five horizon-cutoff prescriptions based on characteristic scales of the mode equations. Their predictions depend sensitively on the choice of horizon scale and, for weak gauge-field production, can deviate substantially from the regularized result; for the adopted finite-part prescription, the minimal horizon agrees best with the regularized total energy density. As $|\\gamma_1|\\to 2$, where infrared modes dominate, the relative deviation of all prescriptions from the regularized result vanishes, independently of the finite-part prescription. Outside this regime, the separate electric and magnetic contributions, which can become negative after regularization, are not reliably reproduced by any of the horizon-cutoff prescriptions.", "url": "https://arxiv.org/abs/2610.32599", "type": "理论", "summary": "1. 该文在de Sitter背景下研究阿贝尔规范场经f²(φ)F_{μν}F^{μν}与暴胀子动能耦合时的规范场能量密度，并系统比较量子场论正则化与视界截断方案。\n2. 其技术核心是用硬物理动量截断和维数正则化以闭式给出紫外发散，并令耦合诱导的总能量密度非负以固定单参数有限部分歧义，同时检验五种基于模式方程特征尺度的视界截断。\n3. 结果表明弱规范场产生时视界截断对尺度选择敏感且可能显著偏离正则化结果，最小视界最接近，而在|γ₁|→2的红外主导极限下各方案相对偏差均消失，之外电、磁分量不可靠。", "summary_source": "deepseek", "authors": [{"name": "A.O. Naidenko"}, {"name": "O.O. Sobol"}, {"name": "S.I. Vilchinskii"}], "featured_authors": [{"name": "A.O. Naidenko"}, {"name": "O.O. Sobol"}, {"name": "S.I. Vilchinskii"}], "author_count": 3}, {"id": "2610.32654", "category": "hep-th", "title": "Defects in Topological Symmetric Orbifolds and their String Dual", "abstract": "We review defect topological field theories with finite gauge groups. We then concentrate on restriction and induction defects between symmetric orbifold theories and recall that the defects form an algebra. This requires identifying the features of restriction and induction defects that are independent of the order of the symmetric group, which is natural in a grand canonical framework. The construction leads to Khovanov's categorification of the Heisenberg algebra. The bulk algebra of partial permutations corresponds to the endomorphisms of the identity defect in the category. We also interpret the Hurwitz theory defects in the dual Gromov-Witten theory. This gives a defect descendant interpretation to higher level operators that arise in the integrable hierarchy of the Gromov-Witten theory of curves. In further applications, we relate known defects to our symmetric group theoretic description. For seamed surfaces, we determine the boundary operator algebra for higher values of the covering degree n and provide asymptotics for the large n growth of the number of boundary operators.", "url": "https://arxiv.org/abs/2610.32654", "type": "理论", "summary": "1. 该文系统研究了有限规范群缺陷拓扑场论中对称轨道理论之间的限制与诱导缺陷代数，并在大正则框架下识别出与对称群阶无关的结构特征。\n2. 其核心卖点是将部分置换的体代数对应为范畴中恒等缺陷的自同态，由此联系Khovanov对Heisenberg代数的范畴化，并把Hurwitz理论缺陷解释为对偶Gromov-Witten理论中的缺陷后代及可积层级高阶算子。\n3. 这一对应为缝面边界算子代数的高覆盖度n计算与大n增长渐近提供统一描述，并可启发对称轨道、缺陷范畴与Gromov-Witten/Hurwitz理论之间的进一步交叉研究。", "summary_source": "deepseek", "authors": [{"name": "Jan Troost"}], "featured_authors": [{"name": "Jan Troost"}], "author_count": 1}, {"id": "2610.32856", "category": "hep-th", "title": "Non-singlets and the phase diagram of Matrix Quantum Mechanics", "abstract": "The quantum mechanics of one $N\\times N$ Hermitian matrix in the infinite $N$ limit is well known to define a two-dimensional string theory when the quartic coupling constant $g$ is tuned to a special negative value $g_*$. We study the thermodynamics of this Matrix Quantum Mechanics (MQM), treating the SU$(N)$ symmetry as a global symmetry. Crucially, the non-singlets, i.e. states in non-trivial representations of SU$(N)$, implement the effects of vortices on the discretized worldsheets. This random lattice model has the low-temperature $c=1$ and high-temperature $c=0$ phases, with the Berezinskii-Kosterlitz-Thouless (BKT) transition separating them. We map out the phase diagram in the coupling--temperature plane, which is separated by the critical stability curve $T_c(g)$ extending from $g_*< g <0$. We study this curve using the non-perturbative matrix bootstrap and low- and high-temperature perturbation theory, which explain the thermal instability. At low temperatures, thermally excited non-singlets backreact on the Fermi sea of matrix eigenvalues, causing it to spill over. At high temperatures, the theory is described by an effective matrix integral obtained by dimensional reduction on the thermal circle; the eigenvalue distribution of the zero mode becomes unstable at the critical coupling. We conjecture that the BKT transition occurs at a special point on the critical curve and estimate its position. Finally, we switch to the regular square lattice and study the MQM-inspired Villain model, where the link factor is the one-dimensional propagator on a circle. Using Monte Carlo simulations, we map out the BKT transition in this model.", "url": "https://arxiv.org/abs/2610.32856", "type": "理论", "summary": "1. 该工作将无限N下单个厄米矩阵量子力学的SU(N)视为整体对称性，研究其热力学并绘制耦合—温度相图，并用蒙特卡洛分析正方晶格Villain模型的BKT转变。\n2. 关键卖点是把非单态解释为离散世界面涡旋效应，结合矩阵自举与高低温微扰给出g*<g<0的临界稳定曲线Tc(g)：低温非单态反作用于本征值费米海致其溢出，高温维数约化使零模本征值分布在临界耦合失稳。\n3. 作者据此推断分隔c=1与c=0相的BKT转变位于该曲线上一特殊点并估计位置，为用非单态刻画弦论相图及晶格临界行为提供可检验方向。", "summary_source": "deepseek", "authors": [{"name": "Igor R. Klebanov"}, {"name": "Henry W. Lin"}, {"name": "Pavel Meshcheriakov"}, {"name": "Jessica Yeh"}], "featured_authors": [{"name": "Igor R. Klebanov"}, {"name": "Henry W. Lin"}, {"name": "Pavel Meshcheriakov"}, {"name": "Jessica Yeh"}], "author_count": 4}, {"id": "2610.32892", "category": "hep-th", "title": "Shear viscosity from complex light-cone expansion", "abstract": "Near thermal equilibrium, the transverse momentum density in a fluid diffuses according to $\\omega(k) \\sim - i {\\cal D} k^2$ at small $k$, where the diffusion coefficient ${\\cal D}$ is proportional to the shear viscosity. In field theories with a holographic dual description in terms of classical gravity, the shear-mode frequency $\\omega(k)$ approaches the light cone at large imaginary wave vector. We develop a WKB approach to study this limit. For black branes in AdS$_{p+2}$, we determine the leading terms of the asymptotic large-$k$ expansion of the shear-mode frequency $\\omega(k)$. In the case of AdS$_{5}$, we compute a large number of terms of this series and use resummation techniques to analytically continue the result to small $k$. We find strong evidence that $\\omega(k)$ is analytic at $k=0$ and vanishes there, which amounts to the existence of hydrodynamics encoded in the large-$k$ physics. Taking 10 terms in the large-$k$ expansion of $\\omega(k)$ gives an answer for ${\\cal D}$ which is accurate to better than $0.5\\%$.", "url": "https://arxiv.org/abs/2610.32892", "type": "理论", "summary": "1. 该工作针对全息对偶场论中的剪切模，发展复光锥下的 WKB 方法，计算 p+2 维反德西特空间黑膜在大虚波数下剪切模频率的渐近展开，并据此提取与剪切黏度成正比的扩散系数。\n2. 其技术卖点是在五维反德西特空间中计算大量大波数级数项，并用重求和解析延拓至零波数，给出剪切模频率在零波数处解析且消失的强证据，仅取 10 项即可使扩散系数精度优于 0.5%。\n3. 这表明流体力学行为可由大波数复光锥物理编码，并为以少项渐近展开高精度提取全息输运系数提供了可推广的思路。", "summary_source": "deepseek", "authors": [{"name": "Inês Aniceto"}, {"name": "Pavel Kovtun"}, {"name": "Alex Ratcliffe"}, {"name": "Michał Spaliński"}], "featured_authors": [{"name": "Inês Aniceto"}, {"name": "Pavel Kovtun"}, {"name": "Alex Ratcliffe"}, {"name": "Michał Spaliński"}], "author_count": 4}, {"id": "2610.32956", "category": "hep-th", "title": "All Order Self-Dual Correlators From Symmetries", "abstract": "We consider the scalar actions for self-dual Yang-Mills and self-dual gravity. We give a novel resummed version of their infinite tower of symmetries. We show that the Ward identities for symmetries corresponding to the individual levels of the infinite tower give the soft limits for wavefunction coefficients, while their resummed version completely fixes the full wavefunction. Our analysis is valid for general boundary conditions. Finally, we give an explicit formula for the $n$-point wavefunction coefficient as a single determinant reorganising the perturbiner solution, which also satisfies the soft limits.", "url": "https://arxiv.org/abs/2610.32956", "type": "理论", "summary": "1. 该文针对自对偶杨-米尔斯与自对偶引力的标量作用量，构造了无穷对称塔的一种重求和表述，并据此研究波函数系数。\n2. 其核心在于逐层对称性的Ward恒等式给出波函数系数的软极限，而重求和后的恒等式可完全确定整个波函数，且适用于一般边界条件。\n3. 作者进一步给出以单个行列式重排微扰解的n点波函数系数显式公式，并满足软极限，这为利用对称性系统计算自对偶理论全阶相关函数提供了可行路径。", "summary_source": "deepseek", "authors": [{"name": "Chandramouli Chowdhury"}, {"name": "Silvia Nagy"}], "featured_authors": [{"name": "Chandramouli Chowdhury"}, {"name": "Silvia Nagy"}], "author_count": 2}, {"id": "2610.32957", "category": "hep-th", "title": "All-multiplicity $\\textrm{AdS}_4$ correlators in the self-dual sector", "abstract": "It was recently shown that tree-level gluon correlators of any multiplicity in $\\textrm{AdS}_4$ admit an expansion in terms of flat-space scattering amplitudes, where lower-point amplitudes in the expansion depend on merged external data. We derive here analogous formulae for correlators of scalar theories which encode the self-dual sectors of Yang-Mills theory and gravity in this background. In the latter case, the amplitudes are differential operators which can be obtained from the former using a simple double copy prescription in terms of kinematic numerators satisfying color-kinematics duality.", "url": "https://arxiv.org/abs/2610.32957", "type": "理论", "summary": "1. 该工作推导了 AdS4 背景中编码 Yang-Mills 与引力自对偶扇区的标量理论任意多重数树级关联函数的展开公式，将其表示为平直空间散射振幅的贡献。\n2. 其核心在于低点振幅依赖合并后的外线数据，且引力情形下的振幅为微分算符，可由满足色-运动学对偶的运动学分子通过简单双拷贝规则从 Yang-Mills 情形得到。\n3. 这表明平直空间振幅展开与双拷贝结构可延伸至 AdS 自对偶扇区，为弯曲背景关联函数计算及对偶关系研究提供了可操作的出发点。", "summary_source": "deepseek", "authors": [{"name": "Humberto Gomez"}, {"name": "Renann Lipinski Jusinskas"}, {"name": "Arthur Lipstein"}, {"name": "Cristhiam Lopez-Arcos"}], "featured_authors": [{"name": "Humberto Gomez"}, {"name": "Renann Lipinski Jusinskas"}, {"name": "Arthur Lipstein"}, {"name": "Cristhiam Lopez-Arcos"}], "author_count": 4}, {"id": "2610.31738", "category": "math-ph", "title": "Strongly non-linear continuous model for wave propagation in 2D granular media: derivation and hyperbolicity analysis", "abstract": "In this work, we develop a nonlinear continuum model for wave propagation in two-dimensional granular materials, building on key ideas from Nesterenko's work. Starting from the Hertzian contact law and neglecting contact friction, we derive an effective continuum description through homogenization, assuming spherical, monodisperse grains, local periodicity, and the Cauchy--Born hypothesis. The resulting strain-gradient model depends on both the first and second gradients of the displacement field. We analyse the hyperbolicity of the leading-order system through its eigenvalues and eigenvectors, establishing conditions for hyperbolicity within a restricted deformation domain. The model is solved using an explicit finite-volume method to investigate gravitational settling and wave propagation. We derive analytical expressions for the longitudinal and transverse wave speeds and highlight their dependence on depth. Finally, the predictions of the continuum model are compared with existing discrete-element simulations. This formulation allows several extensions, including more complex packing geometries, contact laws, and large-deformation regimes in which the contact network can evolve.", "url": "https://arxiv.org/abs/2610.31738", "type": "理论", "summary": "1. 该工作从Hertz接触律出发，在球形单分散颗粒、局部周期性与Cauchy--Born假设下均质化，建立含位移一阶和二阶梯度的二维颗粒介质强非线性应变梯度连续模型，并用显式有限体积法模拟重力沉降与波传播。\n2. 其技术核心在于通过特征值与特征向量分析领先阶系统在受限变形域内的双曲性，给出纵波和横波速度的解析表达式及其深度依赖，并与离散元模拟对照。\n3. 该框架可扩展到更复杂堆积几何、接触律及接触网络可演化的大变形情形，为颗粒介质波动建模提供可检验的连续化路径。", "summary_source": "deepseek", "authors": [{"name": "Sebastiano Cominelli"}, {"name": "Régis Cottereau"}, {"name": "Sergey Gavrilyuk"}, {"name": "Bruno Lombard"}, {"name": "Fabien Petitpas"}], "featured_authors": [{"name": "Sebastiano Cominelli"}, {"name": "Régis Cottereau"}, {"name": "Sergey Gavrilyuk"}, {"name": "Bruno Lombard"}, {"name": "Fabien Petitpas"}], "author_count": 5}, {"id": "2610.31794", "category": "math-ph", "title": "Quasideterminants and differential realizations of W-algebras", "abstract": "In this work, we study the Hamiltonian reduction, used in constructing finite rectangular $W$-algebras, of the big-cell differential realization of $\\mathfrak{gl}_{np}$. We establish an intrinsic factorization of the reduced differential realization, identifying its Yangian action with the coproduct action on a tensor product of $n$ evaluation differential realizations of $\\mathfrak{gl}_p$. Corner quasideterminants provide the essential noncommutative mechanism through which Hamiltonian reduction transforms the higher-rank differential realization into a factorized lower-rank Yangian action.", "url": "https://arxiv.org/abs/2610.31794", "type": "理论", "summary": "1. 该工作研究了构造有限矩形 W-代数所用的哈密顿约化，并将其施加于 gl_{np} 的大胞腔差分实现。\n2. 其核心卖点是建立约化后差分实现的内在因子化，把 Yangian 作用等同于 n 个 gl_p 求值差分实现张量积上的余积作用，并指出角准行列式是实现该非交换机制的关键。\n3. 这一结果表明哈密顿约化可将高秩差分实现转化为低秩因子化 Yangian 作用，为有限矩形 W-代数及相关可积结构的构造提供了明确路径。", "summary_source": "deepseek", "authors": [{"name": "Sergey Derkachov"}, {"name": "Daniil Getta"}], "featured_authors": [{"name": "Sergey Derkachov"}, {"name": "Daniil Getta"}], "author_count": 2}, {"id": "2610.32149", "category": "math-ph", "title": "Spin Toda systems and N-point spherical Whittaker functions", "abstract": "We define and study a spin version of the open Toda integrable system, using the Iwasawa decomposition of a connected split real Lie group. We study spherical Whittaker functions as solutions of the spin Toda system. We also construct their N-point version and find the corresponding factorisation of the Casimir element, which yields asymptotic boundary KZB type equations.", "url": "https://arxiv.org/abs/2610.32149", "type": "理论", "summary": "1. 该文基于连通分裂实李群的岩泽分解，定义并研究了开Toda可积系统的自旋版本，并将球Whittaker函数作为其解加以分析。\n2. 作者构造了相应的N点球Whittaker函数，通过对Casimir元素进行分解，导出渐近边界型KZB方程，这是该框架的核心技术结果。\n3. 这一表述把自旋Toda、Whittaker函数与KZB型方程联系起来，为后续研究可积结构、表示论对应及边界关联函数提供了可操作的出发点。", "summary_source": "deepseek", "authors": [{"name": "Haoyi Li"}], "featured_authors": [{"name": "Haoyi Li"}], "author_count": 1}, {"id": "2610.32236", "category": "math-ph", "title": "Averages of traces and ratios of characteristic polynomials of random unitary matrices", "abstract": "In this work we explore the extent to which the Ratios Theorem for averages over $U(N)$, with respect to Haar measure, of ratios of characteristic polynomials can be used to evaluate averages of traces of unitary matrices. We derive concrete expressions for all averages involving up to 4 traces, valid for any matrix size, $N$. We also calculate the so-called zero-swap and one-swap contributions to an average with any number of traces, which amounts to determining general trace moments in a range double the size of the renowned result of Diaconis and Shahshahani. The expression is tractable enough to use in applications, for example to determine the parameter range where certain trace averages assume negative values.", "url": "https://arxiv.org/abs/2610.32236", "type": "理论", "summary": "1. 该工作考察哈尔测度下U(N)特征多项式比值平均的比值定理能在多大程度上用于计算幺正矩阵迹的平均，并给出涉及至多4个迹、适用于任意矩阵尺寸N的显式表达式。\n2. 其技术要点在于算出任意迹数平均中的零交换与单交换贡献，从而在比迪亚科尼斯–沙沙哈尼著名结果大一倍的范围内确定一般迹矩，且所得表达式足够可操作。\n3. 这为在具体应用中利用可处理的迹矩表达式划定参数区间（如确定若干迹平均取负值的范围）提供了直接工具，并显示比值定理方法可用于超出经典迹矩结果的更广泛平均计算。", "summary_source": "deepseek", "authors": [{"name": "Ada Bendel"}, {"name": "Rhys Cahill"}, {"name": "John Brian Conrey"}, {"name": "Gregor Harrison Barraclough"}, {"name": "Ayesha Irfan"}, {"name": "Nina Claire Snaith"}, {"name": "Leonid Tyulenev"}], "featured_authors": [{"name": "Ada Bendel"}, {"name": "Rhys Cahill"}, {"name": "John Brian Conrey"}, {"name": "Ayesha Irfan"}, {"name": "Nina Claire Snaith"}, {"name": "Leonid Tyulenev"}], "author_count": 7}, {"id": "2610.32570", "category": "math-ph", "title": "On Trace Averages and Sharp Asymptotics for Powers of Haar-Unitary Matrices", "abstract": "For a Haar-distributed matrix $U \\in U(N)$, Rains's power-map theorem represents the spectrum of $U^m$, $m \\in \\mathbb{N}$, as a superposition of independent lower-dimensional CUE spectra. We determine how this exact decomposition appears in trace moments and in sharp Gaussian and Poisson limit laws. For averages of mixed trace products, a Charlier--Ewens convolution separates the stable Wick term from its full finite-$N$ correction. A Fredholm factorisation gives sharp total-variation asymptotics for the normalised trace in four regimes, from fixed powers to $m\\geq N$. For a fixed trace power $p$, coherent summation of the leading Laguerre correction yields the exact factor $e^{2/p}$. At the mean-spacing scale, we obtain a sharp Poisson limit for the unfolded spectrum of $U^m$ on a fixed interval as $N, m \\rightarrow \\infty$; its first-order correction, obtained via the second Charlier polynomial, quantifies the residual under-dispersion of local eigenvalue counts.", "url": "https://arxiv.org/abs/2610.32570", "type": "理论", "summary": "1. 该工作研究 Haar 随机酉矩阵幂 U^m 的迹平均与谱渐近，并厘清 Rains 幂映射定理在迹矩和 Gaussian/Poisson 极限中的精确呈现。\n2. 其关键在于以 Charlier–Ewens 卷积分离混合迹乘积平均中的稳定 Wick 项与完整有限 N 修正，并用 Fredholm 分解在固定幂至 m≥N 的四个区域导出归一化迹的锐利全变差渐近，固定迹幂 p 的 Laguerre 领头修正相干求和给出精确因子 e^{2/p}。\n3. 在平均间距尺度上获得 U^m 展开谱于固定区间的锐利 Poisson 极限，其二阶 Charlier 多项式修正量化局部本征值计数的残余欠离散，为高维酉群幂的精细谱统计提供可检验基准。", "summary_source": "deepseek", "authors": [{"name": "Ayesha Irfan"}], "featured_authors": [{"name": "Ayesha Irfan"}], "author_count": 1}, {"id": "2610.32618", "category": "math-ph", "title": "The solution of the Hopfield model with Gaussian patterns", "abstract": "We prove that the free energy of the Hopfield model with Gaussian patterns has a thermodynamic limit at every load $\\alpha$ and temperature $T$, and we give it as an explicit variational principle. The Hubbard--Stratonovich transformation maps the model onto $N$ Ising spins coupled to $M=\\alpha N$ Gaussian hidden units, whose radius, the empirical variance of the hidden layer, is a thermodynamic variable with an entropic cost. At fixed radius the model is an Ising--spherical spin glass with Gaussian couplings, which we solve. The principle (i) reproduces the Amit-Gutfreund-Sompolinsky theory as its replica-symmetric restriction, (ii) identifies $T_g=1+\\sqrt\\alpha$ as the rigorous boundary of the annealed region, (iii) selects a unique spin-glass solution of the AGS equations, and (iv) gives the radius an equation of state. Moreover, (v) below $T_g$ we prove that replica symmetry is broken throughout: the instability of the AGS solution reduces to the zero-field de Almeida-Thouless condition of the Sherrington-Kirkpatrick model.", "url": "https://arxiv.org/abs/2610.32618", "type": "理论", "summary": "1. 该工作证明高斯模式Hopfield模型的自由能在任意负载α与温度T下存在热力学极限，并给出其显式变分原理。\n2. 其核心是用Hubbard-Stratonovich变换将模型映射为N个Ising自旋与M=αN个高斯隐藏单元耦合，并把隐藏层经验方差作为带熵代价的热力学变量；固定该半径后化为可解的高斯耦合Ising-球面自旋玻璃。\n3. 该变分原理把AGS理论作为复本对称限制，严格确定Tg=1+√α为退火区边界、选出AGS方程唯一自旋玻璃解并给出半径状态方程，且证明Tg以下复本对称破缺可归约为SK模型零场de Almeida-Thouless条件。", "summary_source": "deepseek", "authors": [{"name": "Francesco Camilli"}, {"name": "Pierluigi Contucci"}, {"name": "Emanuele Mingione"}], "featured_authors": [{"name": "Francesco Camilli"}, {"name": "Pierluigi Contucci"}, {"name": "Emanuele Mingione"}], "author_count": 3}, {"id": "2610.32867", "category": "math-ph", "title": "Correlation-induced suppression of Granger causality and Gaussian transfer entropy", "abstract": "In complex dynamical systems, Granger causality and transfer entropy are widely used to infer directional interactions, but they quantify a source's unique predictive contribution after conditioning and can therefore be substantially attenuated by correlation with the retained variables. Here, using our previously developed Linear Operator Causality Analysis (LOCA) framework, which measures causal response from the system propagator, we derive a relationship between predictive and operator-based causality. For a two-dimensional linear system, the fractional suppression of Granger causality equals the squared correlation between source and receiver. We generalize this result to high-dimensional systems using the source covariance remaining after conditioning and show that additional conditioning can only increase the suppression. The same covariance ordering yields a corresponding upper bound for Gaussian transfer entropy. A linearized Burgers advection chain exhibits 36.6% suppression at the convective travel-time peak, and exact nonlinear acoustic Burgers solutions show that the fitted-surrogate penalty is governed by correlation structure rather than nonlinearity and remains robust to sensor noise after operator debiasing. Applied to resting-state fMRI from the Human Connectome Project (80 brain regions, 8 functional networks, 10 subjects), the single-lag Granger causality measure falls 39.4% below the operator response when conditioning only on the receiver and 73.0% when conditioning on the receiver and all other retained variables. The framework provides a quantitative bridge between predictive and operator-based causal measures in high-dimensional dynamical systems.", "url": "https://arxiv.org/abs/2610.32867", "type": "理论", "summary": "1. 该工作基于线性算子因果分析(LOCA)框架,从系统传播子给出的因果响应出发,推导了Granger因果与高斯转移熵等预测性度量同算子因果之间的定量关系,并在线性化Burgers平流链、非线性声学Burgers精确解以及HCP静息态fMRI(80脑区、8网络、10被试)上加以检验。\n2. 其核心结论是:二维线性系统中Granger因果的衰减比例恰等于源与接收者之间相关系数的平方,该结果可借条件化后残余的源协方差推广至高维,并证明增加条件变量只会加剧抑制,同一协方差序还给出高斯转移熵的上界;Burgers链在对流走时峰处抑制达36.6%,而代理拟合惩罚由相关结构而非非线性决定,算子去偏后对传感噪声保持稳健。\n3. 该框架为高维动力系统中预测性因果与算子因果之间提供了定量桥梁,并提示仅对接收者条件化时fMRI单滞后Granger因果已低于算子响应39.4%、加入其余保留变量后达73.0%,故基于条件化度量的网络推断可能系统性低估真实耦合。", "summary_source": "deepseek", "authors": [{"name": "Louis Cattafesta"}, {"name": "Scott T. M. Dawson"}, {"name": "Ankit Srivastava"}], "featured_authors": [{"name": "Louis Cattafesta"}, {"name": "Scott T. M. Dawson"}, {"name": "Ankit Srivastava"}], "author_count": 3}, {"id": "2610.32899", "category": "math-ph", "title": "Variance of relative entropy over random states", "abstract": "Average relative entropy over major generic random states is recently studied. In this work, the investigation is extended by deriving the variances of relative entropy over the Hilbert--Schmidt and Bures--Hall ensembles, which characterize its fluctuations around the average value. Exact results for the variances of relative entropy between independent states drawn from the same ensemble and from two different ensembles are obtained. These results further indicate that the average relative entropy is typical in the considered limiting regimes. In addition to the matrix-level calculations similar to the average relative entropy, eigenvalue correlation functions of the ensembles are involved in the variance computations through the use of zonal polynomials.", "url": "https://arxiv.org/abs/2610.32899", "type": "理论", "summary": "1. 该工作将随机态相对熵的研究从平均值推广到方差，推导了希尔伯特–施密特和布雷斯–霍尔系综中独立随机态间相对熵的精确方差，覆盖同系综与异系综抽取情形。\n2. 其技术核心是沿用矩阵层面计算并引入系综本征值关联函数，借助分区多项式获得精确结果，进而表明在相应极限区制下平均相对熵具有典型性。\n3. 这为随机态相对熵的涨落评估和典型性论证提供了可用的解析基准，并提示以平均值替代个体样本需满足相应极限条件。", "summary_source": "deepseek", "authors": [{"name": "Linfeng Wei"}, {"name": "Lu Wei"}], "featured_authors": [{"name": "Linfeng Wei"}, {"name": "Lu Wei"}], "author_count": 2}, {"id": "2610.32973", "category": "math-ph", "title": "Ideal interaction dynamics of defects and background fields in condensed matter", "abstract": "While defect dynamics in condensed matter systems is widely studied and several methods are available to track the defect position over time, the formulation of dynamical models for the coupled evolution of both defect and background field quantities seems to be more challenging. Yet, the overall behavior of a system containing moving defects is strongly influenced by this defect-field interaction. Here, we propose a modeling framework for the conservative coupled evolution of the defect density and the background fields upon focusing on two relevant cases of study: the Gross-Pitaevskii theory of quantum fluids and the Ericksen-Leslie model of nematic liquid crystals. To achieve the coupled evolution, we combine the Euler-Poincaré variational setting of continuum dynamics with the gauge theory of topological defects. While the latter allows us to overcome certain ambiguities in definition of the defect density, the Euler-Poincaré method provides a unified modeling approach in the absence of defect reconnection.", "url": "https://arxiv.org/abs/2610.32973", "type": "理论", "summary": "1. 该工作提出了一个描述凝聚态缺陷密度与背景场保守耦合演化的建模框架，并以量子流体的格罗斯-皮塔耶夫斯基理论和向列相液晶的埃里克森-莱斯利模型为两个研究案例。\n2. 其技术核心是将连续介质动力学的欧拉-庞加莱变分框架与拓扑缺陷规范理论结合，从而澄清缺陷密度定义中的歧义，并在无缺陷重联条件下获得统一的耦合演化表述。\n3. 这为运动缺陷与背景场强耦合的系统提供了可推广的变分建模路径，并有望启发对量子流体和液晶等平台中缺陷输运与场响应的一致理论刻画。", "summary_source": "deepseek", "authors": [{"name": "François Gay-Balmaz"}, {"name": "Tudor S. Ratiu"}, {"name": "Cesare Tronci"}], "featured_authors": [{"name": "François Gay-Balmaz"}, {"name": "Tudor S. Ratiu"}, {"name": "Cesare Tronci"}], "author_count": 3}, {"id": "2610.31729", "category": "quant-ph", "title": "Mutual Information Across Quantum Reference Frame Perspectives", "abstract": "In quantum information theory, standard notions typically presuppose a fixed partition of the world into subsystems, encoded in a tensor product structure of the Hilbert space. Yet, in some scenarios, the subsystem structure is not uniquely fixed. A case in point is the description of subsystems relative to different quantum reference frames (QRFs), where the tensor product structure, although fixed in a specific QRF, changes across different QRFs. Such a relativity of subsystems underlies many interesting features of QRFs, such as the relativity of entanglement, entropy, and coherence. It also raises a broader question: how do we compare the information across different subsystem perspectives, especially when the corresponding subsystem algebras overlap? Here, we propose a notion of quantum mutual information across different QRF perspectives, which captures the correlations between subsystems relative to different frames of reference. To do so, we focus on an algebraic definition of subsystems. Studying in detail the union and overlap between subsystem algebras relative to different QRFs, we find that the usual definition of mutual information in terms of the chain law overcounts the information associated to the overlap. Based on this insight, we propose a modified chain law and show that the resulting notion of mutual information satisfies subadditivity and connects naturally to other measures found in the literature [1]. Our investigations not only provide a way to quantify the relation between different QRF perspectives from an information-theoretic point of view but also sheds light on some important features of quantum information in absence of a fixed tensor product structure.", "url": "https://arxiv.org/abs/2610.31729", "type": "理论", "summary": "1. 该文在不同量子参考系视角下提出了一种量子互信息定义，用于刻画相对于不同参考系的子系统之间的关联，并采用代数量子系统描述处理跨视角比较。\n2. 其关键点在于发现通常基于链式法则的互信息会重复计入不同参考系下子系统代数交叠部分的信息，进而提出修正链式法则，并证明所得互信息满足次可加性且与文献中的相关度量自然衔接。\n3. 这为在缺乏固定张量积结构时量化不同量子参考系视角之间的关系提供了信息论工具，并有助于理解子系统结构相对性下的量子信息性质。", "summary_source": "deepseek", "authors": [{"name": "Leonardo Valente"}, {"name": "Carla Ferradini"}, {"name": "Flaminia Giacomini"}, {"name": "Viktoria Kabel"}], "featured_authors": [{"name": "Leonardo Valente"}, {"name": "Carla Ferradini"}, {"name": "Flaminia Giacomini"}, {"name": "Viktoria Kabel"}], "author_count": 4}, {"id": "2610.31775", "category": "quant-ph", "title": "The Entire Quantum Computer on a Classical Leash", "abstract": "We show that a classical client with no quantum hardware can use a single untrusted and potentially malicious quantum server as if it were its own trusted quantum computer. Through the server, the client can privately choose and run quantum computations, prepare quantum states, and process quantum states supplied by other parties. It can also keep quantum memory on the server, hidden from the server itself, and use that memory in later computations so its quantum state persists across rounds of interaction. Together, these capabilities let a purely classical party act as a quantum party in a variety of interactive protocols. We expect this virtual quantum computer to be a broadly useful tool. As immediate applications, we resolve two known open problems: (1) classical verification of quantum sampling with negligible computational soundness error, and (2) remote state preparation of arbitrary efficiently preparable quantum states. Underlying all of these results is a general-purpose, maliciously secure two-party computation protocol between a classical client and a quantum server, which we construct assuming only the post-quantum hardness of learning with errors.", "url": "https://arxiv.org/abs/2610.31775", "type": "理论", "summary": "1. 该工作提出一种让纯经典客户端借助单个不可信且可能恶意的量子服务器，私密选择并运行量子计算、制备与处理量子态并跨轮保持隐藏量子内存的虚拟量子计算机框架。\n2. 其核心卖点是仅假设带误差学习问题的后量子困难性，构造通用且恶意安全的经典客户端—量子服务器两方计算协议，并据此解决量子采样经典验证的可忽略计算可靠性误差与任意高效可制备量子态远程制备两个开放问题。\n3. 这一框架可使经典参与方在多种交互协议中充当量子方，并为可验证量子计算与远程量子态制备提供通用且可扩展的技术路径。", "summary_source": "deepseek", "authors": [{"name": "Yael Tauman Kalai"}, {"name": "Dakshita Khurana"}, {"name": "Justin Raizes"}], "featured_authors": [{"name": "Yael Tauman Kalai"}, {"name": "Dakshita Khurana"}, {"name": "Justin Raizes"}], "author_count": 3}, {"id": "2610.31792", "category": "quant-ph", "title": "Quantum Complexity and Stabilizer-State Expansions: From Pairing to Deformation in Fermionic Systems", "abstract": "Understanding how collective phenomena such as pairing and deformation emerge in interacting fermionic systems, and how the correlations underlying them shape the resources required for their simulation, is a central challenge in many-body physics. We investigate various aspects of quantum complexity in a fermionic system exhibiting two main forms of collectivity, specifically deformation and pairing, through entanglement, non-stabilizerness, and fermionic non-Gaussianity. In the deformed phase, high entanglement coexists with low non-stabilizerness, while the superfluid pairing phase, by contrast, exhibits substantial multipartite entanglement and non-stabilizerness, together with maximal fermionic anti-flatness. In a second step we examine how to describe the phase diagram of the system in a classically scalable and symmetry-preserving way, by combining stabilizer-state expansion and variational basis optimization. A physics-guided decomposition of the Hamiltonian identifies the relevant stabilizer states, which can be constructed from graph states. A single stabilizer state captures the deformed phase to a large extent, and, although the number of stabilizer states required to describe the pairing phase grows exponentially with system size, a symmetry-preserving basis rotation yields a high-fidelity approximation using far fewer states. This rotated state can then serve as a practical starting point for quantum refinement.", "url": "https://arxiv.org/abs/2610.31792", "type": "理论+数值", "summary": "1. 该工作以纠缠、非稳定子性和费米子非高斯性为指标，考察同时具有形变与配对集体性的相互作用费米子系统的量子复杂性，并尝试用稳定子态展开与变分基优化以可扩展且保对称的方式刻画相图。\n2. 其卖点在于物理引导的哈密顿量分解可选取由图态构造的相关稳定子态：单个稳定子态即可较大程度描述形变相，而配对相虽需指数多稳定子态，却可通过保对称基旋转以更少态获得高保真近似。\n3. 这提示旋转后的稳定子态可作为量子精化的实用起点，并为理解集体关联如何决定经典可模拟性与量子资源需求提供可检验框架。", "summary_source": "deepseek", "authors": [{"name": "S. Momme Hengstenberg"}, {"name": "Caroline E. P. Robin"}], "featured_authors": [{"name": "S. Momme Hengstenberg"}, {"name": "Caroline E. P. Robin"}], "author_count": 2}, {"id": "2610.31885", "category": "quant-ph", "title": "Optimal Control of a Fluxonium Circuit with the Q-PRONTO Numerical Method", "abstract": "Optimizing the control of large quantum systems is a resource-intensive task, where the convergence rate of the underlying iterative schemes is crucial. The recently developed Quantum Projection Operator-Based Newton Method for Trajectory Optimization (Q-PRONTO) offers a unique quadratic convergence for controlling quantum states, while most model-based solvers guarantee only an approximately linear convergence rate. As a proof of concept, here, we design and benchmark single-qubit gates optimized by Q-PRONTO based on the circuit Hamiltonian of a fluxonium superconducting qubit. To ensure that we can apply a long string of arbitrary pulses to the circuit, we modify the firmware associated with the Quantum Instrumentation Control Kit (QICK) by altering its memory allocation. We characterize the performance of the optimal solutions using standard randomized benchmarking and achieve a total error per gate of $6.6\\times10^{-4}$.", "url": "https://arxiv.org/abs/2610.31885", "type": "理论+数值", "summary": "1. 该工作在通量量子比特电路哈密顿量上设计并基准测试单量子比特门，采用Q-PRONTO数值方法优化控制脉冲，并改造QICK固件内存分配以支持长串任意脉冲输出。\n2. 其技术卖点在于Q-PRONTO对量子态控制具有二次收敛，而多数基于模型的求解器仅近似线性收敛，并用随机基准测试评估最优解，得到每门总误差6.6×10^-4。\n3. 这表明二次收敛轨迹优化结合可扩展仪器控制可用于超导量子门校准，并为更复杂通量量子比特系统的脉冲优化提供可检验路径。", "summary_source": "deepseek", "authors": [{"name": "John Barta"}, {"name": "Brian D. Isakov"}, {"name": "Pablo Aramburu Sanchez"}, {"name": "Jieqiu Shao"}, {"name": "Tamás Kalmár"}, {"name": "Trevyn F. Q. Larson"}, {"name": "Marco M. Nicotra"}, {"name": "András Gyenis"}], "featured_authors": [{"name": "John Barta"}, {"name": "Brian D. Isakov"}, {"name": "Pablo Aramburu Sanchez"}, {"name": "Trevyn F. Q. Larson"}, {"name": "Marco M. Nicotra"}, {"name": "András Gyenis"}], "author_count": 8}, {"id": "2610.31947", "category": "quant-ph", "title": "Noise-Assisted Quantum Entanglement: Memory-Enhanced Coherence in Stochastic Jaynes-Cummings Dynamics", "abstract": "We investigate qubit entanglement dynamics in a two-qubit cavity system with stochastically fluctuating coupling strength, comparing white noise (Markovian) and Ornstein-Uhlenbeck noise (non-Markovian) processes. We analytically solve the system dynamics for both Fock and coherent cavity states and systematically characterize how initial qubit configurations affect entanglement generation and preservation. Our results reveal distinct dynamical regimes: in the Fock-state cavity, initial states in the single-excitation subspace generate robust qubit entanglement in decoherence-free subspaces, while initially entangled states in the double-excitation subspace exhibit inevitable decay without protective symmetries. For coherent cavities, we identify a critical photon-number threshold in the intermediate coherent-state amplitude regime where dynamics transition from low-frequency to high-frequency entanglement oscillations, while universal entanglement loss occurs at large amplitudes. Remarkable resilience against entanglement sudden death emerges under strong non-Markovian noise with long correlation times, where repeated revivals occur. These findings establish cavity photon statistics and environmental memory time as key control parameters for engineering qubit entanglement dynamics in qubit-cavity systems, revealing how system-environment correlations govern quantum information preservation.", "url": "https://arxiv.org/abs/2610.31947", "type": "理论", "summary": "1. 该工作解析研究了随机耦合强度下双量子比特腔系统的纠缠动力学，并比较白噪声与Ornstein-Uhlenbeck非马尔可夫噪声及不同初态构型的影响。\n2. 其核心在于区分Fock腔单激发子空间的无退相干保护与双激发的必然衰减，并指出相干腔中光子数阈值导致低频到高频纠缠振荡及强非马尔可夫长关联时间下的纠缠复苏。\n3. 这将腔光子统计与环境记忆时间确立为调控量子比特纠缠的关键参数，并表明系统-环境关联可支配量子信息保存。", "summary_source": "deepseek", "authors": [{"name": "Fang Wang"}, {"name": "Quanzhen Ding"}, {"name": "Jun Jing"}, {"name": "Ting Yu"}], "featured_authors": [{"name": "Fang Wang"}, {"name": "Quanzhen Ding"}, {"name": "Jun Jing"}, {"name": "Ting Yu"}], "author_count": 4}, {"id": "2610.32014", "category": "quant-ph", "title": "Additive uncertainty relations via pseudospectral methods", "abstract": "Given Hermitian observable $A$, the variance of $A$ is given by the difference of expectations $\\langle A^2\\rangle - \\langle A\\rangle^2$, where the expectation of an observable implicitly assumes a choice of state for the underlying system. As a sub-case of a general lower bound for the sum of variances for finitely many arbitrary elements in a $C^*$-algebra, we prove that the sum of the variances for $d$ observables $A_1, \\dots , A_d$ is greater than some expression in the expectations $\\langle i[A_j,A_k]\\rangle$ for $j\\neq k$ plus the square of the smallest singular value of the associated localizer. In special cases, this expression is just a root mean square average. Our technique also derives a general containment between the Clifford pseudospectra and quadratic pseudospectra for $d$ observables.", "url": "https://arxiv.org/abs/2610.32014", "type": "理论", "summary": "1. 该文在C*-代数框架下利用伪谱方法导出有限多个任意元素方差和的一般下界，并将其具体化为d个可观测量的可加不确定性关系。\n2. 其核心卖点是该下界由对易子期望<i[A_j,A_k]>的表达式与关联局域化算子最小奇异值的平方组成，特例可化为均方根平均，并同时建立Clifford伪谱与二次伪谱的包含关系。\n3. 这为多可观测量联合方差约束提供了算子代数层面的可计算判据，并启发将伪谱包含方法推广到更一般的可观测量集与数值检验。", "summary_source": "deepseek", "authors": [{"name": "Alexander Cerjan"}, {"name": "Lara Ismert"}, {"name": "Terry A. Loring"}], "featured_authors": [{"name": "Alexander Cerjan"}, {"name": "Lara Ismert"}, {"name": "Terry A. Loring"}], "author_count": 3}, {"id": "2610.32054", "category": "quant-ph", "title": "Real-space construction and selection rules of center-of-mass momentum eigenstates in two-dimensional many-body lattices", "abstract": "We present a comprehensive framework for the real-space construction of center-of-mass (c.m.) momentum eigenstates in two-dimensional (2D) quantum many-body systems. Unlike standard momentum-space approaches, our real-space formalism explicitly captures the non-uniformity of cyclic subspace dimensions, which are fundamentally governed by the spatial symmetries of the many-body configurations and particle statistics. We demonstrate that performing 2D real-space translations on multi-particle states naturally induces non-trivial translation phase factors associated with the characters of these stabilizer subgroups, leading to a renormalization of permissible momentum values. Notably, we identify an anomalous cross-dimensional momentum coupling in highly symmetric particle distributions, where the permissible momentum values in one direction are strictly constrained by those in the perpendicular direction. We emphasize the algorithmic necessity of this coupling, as neglecting it leads to missing or duplicated basis states in numerical implementations. Concrete examples are provided to demonstrate the practical implementation and physical consequences of this framework.", "url": "https://arxiv.org/abs/2610.32054", "type": "理论+数值", "summary": "1. 该工作针对二维量子多体格点体系，建立了在实空间中系统构造质心动量本征态的完整方案，并与通常的动量空间方法形成对照。\n2. 其要点在于指出循环子空间维度的非均匀性由多体构型的空间对称性与粒子统计决定，多粒子态的平移会引入与相应稳定子群特征标对应的相位因子，并由此重整化允许的动量取值，同时在高对称粒子分布下出现一个方向的允许动量严格约束垂直方向允许动量的跨维耦合。\n3. 该耦合在算法上是必要的，忽略它会导致数值实现中基矢缺失或重复，从而为二维多体体系的数值构造提供了可靠的实现依据。", "summary_source": "deepseek", "authors": [{"name": "Ling Lin"}, {"name": "Yongguan Ke"}, {"name": "Chaohong Lee"}], "featured_authors": [{"name": "Ling Lin"}, {"name": "Yongguan Ke"}, {"name": "Chaohong Lee"}], "author_count": 3}, {"id": "2610.32145", "category": "quant-ph", "title": "Quantum Cryptomania with Classical Communication without One-Way Functions", "abstract": "In classical cryptography, one-way functions are necessary for most of cryptography. In the quantum world, however, Kretschmer at {TQC'21} and subsequent works have demonstrated that quantum versions of various primitives in minicrypt, such as signatures and private-key encryption, do not require quantum-computable one-way functions (\\textsf{qOWF}s). However, the question of the necessity of \\textsf{qOWF}s for primitives in Cryptomania like public-key encryption with classical public keys and ciphertexts (\\textsf{qPKE}) has remained open. We provide a comprehensive picture of the relationship between \\textsf{qPKE} and \\textsf{qOWF}. First, our main result is a black-box separation between \\textsf{qOWF}s and \\textsf{qPKE}. In particular, we show that relative to a unitary, real, and self-inverse oracle, there exists a \\textsf{qPKE} scheme (with classical keys and ciphertexts), but \\textsf{qOWF}s do not exist. Further, our oracles admit a point-function obfuscation construction, thus ruling out black-box construction of \\textsf{qOWF} from point function obfuscations. On the positive side, we construct \\textsf{qPKE} from quantum indistinguishability obfuscation for quantum circuits with classical obfuscated descriptions and efficiently verifiable one-way puzzles, which is known to be a potentially weaker assumption than \\textsf{qOWF}s, due to an existing black-box separation. Our construction is the quantum analog of the classical construction of \\textsf{PKE} from one-way functions and indistinguishability obfuscation in the quantum computation with classical communication (QCCC) setting.", "url": "https://arxiv.org/abs/2610.32145", "type": "理论", "summary": "1. 该工作系统刻画了量子公钥加密（qPKE，经典公钥与密文）与量子单向函数（qOWF）之间的关系，并给出二者的黑盒分离及一个正向构造。\n2. 其核心卖点是构造一个酉、实且自逆的预言机，使qPKE存在而qOWF不存在，并借由该预言机支持的点函数混淆排除从点函数混淆黑盒构造qOWF。\n3. 正面结果将qPKE建立在量子电路不可区分混淆（经典混淆描述）与可高效验证的单向谜题之上，表明Cryptomania类原语可在QCCC设定下绕开qOWF，并为后续假设关系与构造研究提供明确基准。", "summary_source": "deepseek", "authors": [{"name": "Mohammed Barhoush"}, {"name": "Amit Behera"}], "featured_authors": [{"name": "Mohammed Barhoush"}, {"name": "Amit Behera"}], "author_count": 2}, {"id": "2610.32152", "category": "quant-ph", "title": "Trident: Efficient Load Verification for Yoked Surface Codes using a Three-Level Memory Hierarchy", "abstract": "Fault-Tolerant Quantum Computers (FTQCs) commonly use the surface code to encode program qubits as error-corrected logical qubits. Unfortunately, the surface code has a poor encoding rate, so recent work has proposed Yoked Surface Codes (YSCs), which concatenate the surface code with a high-rate quantum code. The surface code qubits in YSCs are protected by the checks, or yokes, of the high-rate code. YSCs have 1D and 2D variants, which are $1.8\\times$ and $4.5\\times$ more efficient than the surface code, respectively. Modern FTQC architectures use a two-level hierarchy: surface codes perform logical operations (compute) while 2D YSCs store idle program qubits (memory). To load a qubit from memory, the FTQC first performs retrieval, which logically moves a program qubit from a 2D YSC into a surface code (8 cycles). However, retrieval is not fault-tolerant, so the FTQC must verify the load by measuring all the yokes of the 2D YSC (178 cycles). As verification dominates memory access latency, eliminating it can provide a speedup of $5.7\\times$. Our goal is to reduce the verification overhead of 2D YSCs while retaining their storage efficiency. We exploit the fact that 1D YSCs, though less storage-efficient, incur negligible verification latency. We propose Trident, which expands the two-level hierarchy into a three-level hierarchy by adding a small intermediate level containing a 1D YSC (L1). If most loads hit L1 rather than L2 (2D YSC tier), it can significantly reduce verification overhead. We present two variants: Trident-D (demand-driven) and Trident-P (prefetch-driven), which achieve speedups of $2.8\\times$ and $4.2\\times$, respectively, while increasing the physical qubit cost of memory by only 4.9%.", "url": "https://arxiv.org/abs/2610.32152", "type": "理论", "summary": "1. 该工作提出Trident，将表面码计算与二维Yoked表面码存储的两级架构扩展为加入小型一维YSC中间层（L1）的三级存储层次，并给出按需与预取两种变体。\n2. 其核心卖点是利用一维YSC验证延迟可忽略的特性，使多数加载命中L1以规避二维YSC需测量全部yoke的178周期验证开销，在仅增加4.9%物理量子比特成本下分别实现2.8倍和4.2倍加速。\n3. 这表明通过细粒度存储分层可显著压缩容错量子计算的内存访问验证瓶颈，并为兼顾存储效率与访问延迟的FTQC架构设计提供可借鉴方向。", "summary_source": "deepseek", "authors": [{"name": "Gunagya Singh Mamak"}, {"name": "Suhas Vittal"}, {"name": "Kabir Dubey"}, {"name": "Kaitlin N. Smith"}, {"name": "Moinuddin K. Qureshi"}], "featured_authors": [{"name": "Gunagya Singh Mamak"}, {"name": "Suhas Vittal"}, {"name": "Kabir Dubey"}, {"name": "Kaitlin N. Smith"}, {"name": "Moinuddin K. Qureshi"}], "author_count": 5}, {"id": "2610.32156", "category": "quant-ph", "title": "Quantum Evolution Networks Learn Long-Time Coherent Dynamics in Driven Spin Registers", "abstract": "Predicting and controlling driven quantum systems requires access to dynamics across physical parameters, initial states, and evolution times. A reusable neural model must capture this dependence while preserving unitary structure and maintaining accuracy over long-time coherent evolution. Here we introduce Quantum Evolution Networks (QENs), which map physical parameters and time to complete propagators for periodically driven three-spin registers. Shared networks learn unitary one-period propagators and compatible within-period paths, enabling predictions through known periodic composition without query-specific numerical integration. For transverse driving, the fifth-percentile fidelity, minimized over input states and sampled times, is 0.9947 over 24 periods on 256 held-out configurations. A leading-order analysis of spectrally resolved endpoint residuals predicts multicycle process error more accurately than quadratic or spectrum-averaged estimates. Interventions at matched single-period infidelity produce orders-of-magnitude differences in multicycle infidelity, demonstrating the importance of residual orientation. Compatible component replacements identify how endpoint and within-period approximations limit reconstruction accuracy. These results establish a reusable neural representation of the studied propagator families and connect its learned residual structure to its observed long-time reliability.", "url": "https://arxiv.org/abs/2610.32156", "type": "理论+数值", "summary": "1. 该工作提出量子演化网络（QENs），将物理参数与时间映射为周期驱动三自旋寄存器的完整传播子，并用共享网络学习单周期幺正传播子及周期内兼容路径，通过周期复合预测长期相干演化而无需逐查询数值积分。\n2. 其技术卖点是以谱分辨端点残差的一阶分析预测多周期过程误差，优于二次或谱平均估计，并表明单周期不保真度匹配时残差取向可导致多周期不保真度相差数量级；横向驱动下24周期、256个留出构型的第五百分位保真度为0.9947。\n3. 这为同类受驱自旋寄存器提供可复用的传播子神经表示，并提示残差取向可作为长期可靠性诊断与误差控制的设计变量。", "summary_source": "deepseek", "authors": [{"name": "Puran Li"}, {"name": "Condon Lau"}, {"name": "Xiu-Hao Deng"}], "featured_authors": [{"name": "Puran Li"}, {"name": "Condon Lau"}, {"name": "Xiu-Hao Deng"}], "author_count": 3}, {"id": "2610.32209", "category": "quant-ph", "title": "Bogoliubov Dynamics and Zitterbewegung in Optical Dirac Systems", "abstract": "We develop a bosonic Bogoliubov description of Zitterbewegung in time-dependent optical-Dirac systems. Within the optical-Dirac framework, the anomalous pair-creation and pair-annihilation terms of a bosonic Bogoliubov Hamiltonian correspond to couplings between the positive- and negative-frequency sectors, whose coherence underlies the Zitterbewegung response. When the constitutive parameters vary in time, the resulting moving-frame connection generates dynamical interbranch coupling and positive--negative-frequency coherence. Under periodic modulation, this coupling becomes resonant near $\\Omega\\simeq2\\omega_0$, leading to parametric amplification of the coherence and consequently to an enhanced Zitterbewegung motion.", "url": "https://arxiv.org/abs/2610.32209", "type": "理论+数值", "summary": "1. 该工作针对含时变本构参数的光学狄拉克体系，建立了以玻色博戈留博夫哈密顿量描述颤振的理论框架。\n2. 其关键是把博戈留博夫哈密顿量的反常对产生与对湮灭项对应为正、负频扇区耦合，并表明时变参数通过运动参考系联络产生动力学支间耦合和正负频相干。\n3. 周期调制下该耦合在Ω≈2ω0附近发生共振，参量放大正负频相干并增强颤振，这为可调光学狄拉克平台中的相干调控与参量放大提供了明确启示。", "summary_source": "deepseek", "authors": [{"name": "Lili Yang"}], "featured_authors": [{"name": "Lili Yang"}], "author_count": 1}, {"id": "2610.32218", "category": "quant-ph", "title": "Traceable Quantum Secret Sharing", "abstract": "Quantum secret sharing protects distributed quantum information against unauthorized reconstruction, yet existing schemes provide no intrinsic accountability when shares are leaked or forged. This missing capability is particularly relevant in realistic distributed settings, where compromised participants may either expose valid shares or maliciously interfere with reconstruction. Here we establish a framework for traceable quantum secret sharing under these two threat models. We introduce leakage-verifiable and traceable quantum secret sharing (LVT-QSS), which attributes leaked shares through an explicit leakage verification mechanism, and malicious-traceable and accountable quantum secret sharing (MTA-QSS), which identifies participants who submit forged shares during reconstruction. We formulate security definitions for both settings and prove that the proposed protocols satisfy the corresponding guarantees against the relevant adversaries. Numerical simulations under per-share depolarizing noise further quantify the robustness of the proposed schemes and identify verification as the dominant noise sensitive stage. These results incorporate accountability into quantum secret sharing and provide a foundation for traceable distributed quantum cryptography.", "url": "https://arxiv.org/abs/2610.32218", "type": "理论+数值", "summary": "1. 该工作针对份额泄露与重构时伪造份额两类威胁，建立了可追溯量子秘密共享框架，并提出LVT-QSS与MTA-QSS两种协议及相应安全定义与证明。\n2. 其技术要点是分别以显式泄露验证归因泄露份额、以可问责机制识别提交伪造份额的参与者，并在逐份额退极化噪声下数值评估鲁棒性且指出验证环节最噪声敏感。\n3. 这将问责性纳入分布式量子密码，为可追溯量子秘密共享的安全模型与后续实验及协议设计提供了可检验的基础。", "summary_source": "deepseek", "authors": [{"name": "Mengyan Qiao"}, {"name": "Jian Long"}, {"name": "Yu Li"}, {"name": "Zhu Cao"}], "featured_authors": [{"name": "Mengyan Qiao"}, {"name": "Jian Long"}, {"name": "Yu Li"}, {"name": "Zhu Cao"}], "author_count": 4}, {"id": "2610.32267", "category": "quant-ph", "title": "Two-Layer Verification for Fault-Tolerant Magic-State Preparation in High-Rate Quantum Codes", "abstract": "Encoded magic states are essential for universal fault-tolerant quantum computation, but their resource-efficient preparation in high-rate quantum codes remains challenging. To address this limitation, we propose two-layer verification, which combines local verification of independently prepared subblocks with logical verification after their embedding into a target code. This hierarchy detects harmful error patterns, including even-parity logical-eigenvalue flips that are invisible to a collective product check alone. We demonstrate this scheme for a $[[21,3,5]]$ code by constructing a circuit that embeds three verified seven-qubit Steane-code magic states into the target code. Circuit-level simulations of $T$- and $S$-state preparation show logical-error suppression consistent with the code distance. These results demonstrate the potential of two-layer verification as a design principle for reliable magic-state preparation in quantum codes encoding multiple logical qubits.", "url": "https://arxiv.org/abs/2610.32267", "type": "理论+数值", "summary": "1. 该工作提出双层校验方案，将独立制备子块的局域校验与嵌入目标码后的逻辑校验结合，用于高码率量子码中的容错魔术态制备。\n2. 其关键卖点是分级校验可识别集体乘积校验单独无法发现的偶数宇称逻辑本征值翻转等有害错误，并在[[21,3,5]]码上通过把三个经校验的七量子比特Steane码魔术态嵌入目标码，线路级模拟T态和S态制备显示逻辑错误抑制与码距一致。\n3. 这表明双层校验可作为编码多个逻辑量子比特的量子码中可靠魔术态制备的设计原则，并为高码率容错架构中资源效率与错误抑制的权衡提供启发。", "summary_source": "deepseek", "authors": [{"name": "Naoyuki Kanomata"}, {"name": "Hayato Goto"}], "featured_authors": [{"name": "Naoyuki Kanomata"}, {"name": "Hayato Goto"}], "author_count": 2}, {"id": "2610.32541", "category": "quant-ph", "title": "Photon-Pair Advantage for Dissipative Parameter Estimation in Whispering-Gallery-Mode Interferometers", "abstract": "We study the estimation of detuning and intrinsic loss in a lossy whispering-gallery-mode (WGM) resonator located in a balanced Mach--Zehnder interferometer. We use indistinguishable photon pairs and coherent-state probes. We show that using indistinguishable photon pairs can provide higher Quantum Fisher Information (QFI) of dissipative parameters, such as intrinsic loss, at resonance away from critical coupling. Taking into account all photon-loss outcomes, we obtain analytical QFI expressions and compare photon-pair and coherent-state probe results when they have the same mean photon number. For estimating the round-trip amplitude transmission at resonance and away from critical coupling, the photon-pair probe gives a higher QFI than the coherent-state probe, and photon-number-resolved detection saturates this QFI. This advantage is due to the photon-loss statistics and it is still accessible for a typical overcoupled condition after averaging over fluctuations of the unresolved detuning. We identify the limits of this advantage: phase doubling does not improve resonant detuning estimation, and coincidence-only detection is inefficient close to a zero transmission. These results identify the cases in which photon pairs can be useful for absorption and pump--probe WGM sensing.", "url": "https://arxiv.org/abs/2610.32541", "type": "理论+数值", "summary": "1. 该工作在平衡马赫–曾德尔干涉仪中研究含损耗回音壁模式谐振腔的失谐与本征损耗估计，并比较不可区分光子对与相干态探针的量子费舍尔信息。\n2. 其卖点是相同平均光子数下，计入全部损耗结果后，光子对探针在共振且远离临界耦合处对往返振幅透过率等耗散参数给出更高量子费舍尔信息，光子数分辨探测可饱和该值，优势源于损耗统计。\n3. 该优势在典型过耦合条件并对未分辨失谐涨落平均后仍可出现，为吸收和泵浦–探测回音壁模式传感界定适用场景；同时指出相位倍增不改善共振失谐估计、仅符合计数在零透射附近效率低。", "summary_source": "deepseek", "authors": [{"name": "Elnaz Darsheshdar"}, {"name": "Callum Jones"}, {"name": "Seyed Mostafa Moniri"}, {"name": "Antonio Vidiella-Barranco"}, {"name": "Jolly Xavier"}, {"name": "Frank Vollmer"}], "featured_authors": [{"name": "Elnaz Darsheshdar"}, {"name": "Callum Jones"}, {"name": "Seyed Mostafa Moniri"}, {"name": "Antonio Vidiella-Barranco"}, {"name": "Jolly Xavier"}, {"name": "Frank Vollmer"}], "author_count": 6}, {"id": "2610.32571", "category": "quant-ph", "title": "Classical Pre-Training of Large Shallow Parametrized Quantum Circuits through Pauli Propagation and deployment on Quantum Hardware", "abstract": "Scaling parametrized quantum circuits to a larger number of qubits is a central challenge in Quantum Machine Learning: gradient estimation via the parameter-shift rule quickly becomes prohibitively expensive, while gradient-free optimizers offer limited convergence guarantees. We apply the Pauli propagation framework to a broad class of Quantum Machine Learning problems in which the loss is expressed as a function of expectation values of the circuit's observables, while keeping the relevant quantity of interest, such as the quantum state or its samples, classically intractable to compute. By propagating the observables backward through the circuit, we obtain an explicit parametric expression for the loss that can be minimized entirely on classical hardware. We also present complementary strategies to make propagation tractable at large scale, including weight-based and degree-based truncations and pruning heuristics. We demonstrate the approach on two benchmarks run on 64-qubit circuits: Variational Quantum Eigensolver on a two-dimensional Ising model, and training of a discrete-type generative model for binary images. In both cases, the classically pre-trained parameters are deployed on the IBM quantum processor ibm_berlin. For generative learning, we additionally show that the circuits considered here require substantially fewer parametrized gates than IQP-style ansätze, reducing transpilation overhead and making deployment on current quantum hardware feasible.", "url": "https://arxiv.org/abs/2610.32571", "type": "理论+数值", "summary": "1. 该工作将Pauli传播框架用于损失可写成可观测量期望值函数的量子机器学习问题，在64比特浅层参数化电路上完全于经典硬件预训练参数，并在ibm_berlin上对二维Ising模型的变分量子本征求解与二值图像离散生成模型进行部署验证。\n2. 其核心在于把可观测量反向传播得到损失的显式参数表达式，从而绕开参数移位法则的梯度开销，并配合基于权重与基于阶数的截断及剪枝启发式使大规模传播可行；生成任务中所需参数化门数显著少于IQP型拟设，降低了转译开销。\n3. 这表明经典预训练加量子硬件部署可作为当前规模下浅层参数化电路的务实路径，并为大规模量子机器学习的可扩展训练与门数受限硬件的落地提供明确启发。", "summary_source": "deepseek", "authors": [{"name": "Saverio Monaco"}, {"name": "Jamal Slim"}, {"name": "Ran Xue"}, {"name": "Dirk Krücker"}, {"name": "Kerstin Borras"}], "featured_authors": [{"name": "Saverio Monaco"}, {"name": "Jamal Slim"}, {"name": "Ran Xue"}, {"name": "Dirk Krücker"}, {"name": "Kerstin Borras"}], "author_count": 5}, {"id": "2610.32595", "category": "quant-ph", "title": "The Compendium of Super-Quadratic Computational Quantum Advantages", "abstract": "This compendium presents a structured collection of computational problems with credible prospects for realizing meaningful quantum advantage, focused on describing problem characteristics rather than specific algorithms. It is intended for non-quantum researchers and practitioners with strong computational backgrounds, particularly domain experts, seeking to assess the relevance of quantum methods to real-world problems. The compendium focuses on enumerating core problems for which there is good evidence that a quantum computer can realize more than a quadratic speedup in offline non-relativized time-complexity (e.g., as opposed to in oracular settings, streaming models, or communication advantages). Entries characterize the structural constraints that real-world instances must satisfy to realize those advantages in practice. The intention is to provide a reference that can be leveraged to connect quantum algorithms to practical use cases.", "url": "https://arxiv.org/abs/2610.32595", "type": "理论+数值", "summary": "1. 该文编纂了一份结构化的问题汇编，系统梳理在离线非相对化时间复杂度下有望实现超二次加速的计算问题，侧重刻画问题特征而非具体算法，面向计算背景强但非量子领域的专家。\n2. 其核心取舍在于排除谕示、流式与通信模型等设定，仅收录有较强证据支持超二次加速的问题，并明确给出真实实例在实践中兑现该优势所需满足的结构性约束。\n3. 该汇编可作为参照基准，帮助将量子算法与实际用例对接，并为领域专家评估量子方法与本领域问题的相关性提供可操作的判据。", "summary_source": "deepseek", "authors": [{"name": "Philipp Kammerlander"}, {"name": "Thomas E. O'Brien"}, {"name": "Robbie King"}, {"name": "Rolando D. Somma"}, {"name": "Mária Kieferová"}, {"name": "Brad Lackey"}, {"name": "Alexander Schmidhuber"}, {"name": "Siddhartha Jain"}, {"name": "Andi Gu"}, {"name": "Yuri Alexeev"}, {"name": "Shouvanik Chakrabarti"}, {"name": "Ruslan Shaydulin"}, {"name": "Pietro M. Posta"}, {"name": "Guang Hao Low"}, {"name": "Dar Gilboa"}, {"name": "Matthias Troyer"}, {"name": "Barry C. Sanders"}, {"name": "Matthias Christandl"}, {"name": "Elica Kyoseva"}, {"name": "Catherine Lefebvre"}, {"name": "Ryan Babbush"}], "featured_authors": [{"name": "Philipp Kammerlander"}, {"name": "Thomas E. O'Brien"}, {"name": "Robbie King"}, {"name": "Elica Kyoseva"}, {"name": "Catherine Lefebvre"}, {"name": "Ryan Babbush"}], "author_count": 21}, {"id": "2610.32605", "category": "quant-ph", "title": "QuantumBilliards.jl: An extensible, user friendly, high-performance Julia library for the large scale computation of spectra and eigenstates of quantum billiards and related problems", "abstract": "We present this http URL , an open-source Julia library providing a suite of numerical solvers for the two-dimensional interior Helmholtz eigenproblem with Dirichlet boundary conditions, a paradigmatic model in quantum chaos. The library implements conventional wavenumber-sweep techniques together with several accelerated eigensolvers: the Vergini--Saraceno scaling method, the expanded boundary integral method (EBIM), Beyn's contour-integral method, and the Compact Rational Krylov (CORK) method. It provides a common framework for constructing billiard geometries, exploiting discrete symmetries, computing eigenvalues and eigenstates, and treating smooth, cornered, and multiply connected domains. The library further includes reconstruction of eigenfunctions from boundary normal derivatives and the computation of Poincaré--Husimi (PH) phase-space representations. Available at: this https URL .", "url": "https://arxiv.org/abs/2610.32605", "type": "理论+数值", "summary": "1. 该工作发布 QuantumBilliards.jl，一个开源 Julia 库，用于二维 Dirichlet 内 Helmholtz 本征问题及量子混沌台球谱与本征态的大规模数值求解。\n2. 其核心卖点是将波数扫描与 Vergini–Saraceno 标度、扩展边界积分、Beyn 围道积分和 CORK 等加速本征求解器统一到可构造几何、利用离散对称性并处理光滑、角点及多连通区域的框架中。\n3. 库还支持由边界法向导数重构本征函数及 Poincaré–Husimi 相空间表示，为量子混沌谱统计与高激发态计算提供了可复用、可扩展的工具基础。", "summary_source": "deepseek", "authors": [{"name": "Matic Orel"}, {"name": "Črt Lozej"}], "featured_authors": [{"name": "Matic Orel"}, {"name": "Črt Lozej"}], "author_count": 2}, {"id": "2610.32610", "category": "quant-ph", "title": "Optimizing Quantum Battery via Counterdiabatic driving", "abstract": "We analyze the energy charging of a quantum battery within an open quantum framework, where the interaction between the battery element and an external power source is mediated by an ancilla system acting as a controllable switch. Specifically, we investigate the charging and discharging dynamics of a cavity-based quantum battery coupled to a driven qubit functioning as the charger. To ensure lossless power transfer, we utilize an adiabatic evolution protocol. Furthermore, we implement counterdiabatic driving, achieved by applying an auxiliary control field to the original Hamiltonian, to suppress undesired transitions and realize fast adiabatic dynamics. This scheme significantly accelerates the charging process. We demonstrate that the charging efficiency under adiabatic evolution is enhanced and exhibits stable, non-oscillatory behavior, and we determine the optimal duration for the operation. Finally, we show that counterdiabatic driving minimizes the path length between the initial and final states, inducing the shortest possible evolution distance.", "url": "https://arxiv.org/abs/2610.32610", "type": "理论+数值", "summary": "1. 该工作在开放量子框架中构建了以辅助系统为可控开关、驱动量子比特为充电器的腔量子电池模型，并分析其充放电动力学与反绝热驱动下的充电优化。\n2. 核心卖点是通过在原始哈密顿量上施加辅助控制场实现反绝热驱动，抑制非绝热跃迁，在保持绝热无损能量传输的同时显著加速充电，并将演化路径压缩至最短。\n3. 这表明反绝热驱动可作为开放量子电池兼顾速度、效率与稳定性的控制手段，为后续腔量子平台上的快速无损充放电实验与最优控制设计提供启发。", "summary_source": "deepseek", "authors": [{"name": "F. Ahmadi"}, {"name": "S. Salimi"}], "featured_authors": [{"name": "F. Ahmadi"}, {"name": "S. Salimi"}], "author_count": 2}, {"id": "2610.32622", "category": "quant-ph", "title": "Trace-distance characterization of recurrent pairwise synchronization in cavity-coupled superconducting qubits", "abstract": "We theoretically investigate recurrent pairwise synchronization in three super?conducting qubits coupled to a common single-mode microwave cavity. The qubits interact indirectly through the cavity field and are driven by a coher?ent microwave field. We obtain the coherent dynamics in the dressed-state basis and quantify pairwise synchronization by the trace distance between reduced single-qubit density matrices. The trace-distance dynamics exhibit oscillatory wave-packet structures, with low-trace-distance regions identifying finite syn?chronization windows. An envelope-threshold procedure is introduced to extract the representative duration of these windows. By varying the middle-qubit coupling strength and the relative coupling ratio of the outer qubits, we con?struct a parameter-dependent map of the synchronization-window duration. The duration decreases rapidly with increasing relative outer-qubit coupling and becomes weakly dependent on the middle-qubit coupling in the stronger-coupling regime. These results provide a reduced-state-based characterization of coherent collective dynamics in multiqubit circuit-QED systems.", "url": "https://arxiv.org/abs/2610.32622", "type": "理论", "summary": "1. 该文在三个共腔超导量子比特被相干微波驱动的模型中，基于缀饰态求解相干动力学，并用约化单比特密度矩阵间的迹距离刻画循环成对同步。\n2. 其关键做法是以迹距离振荡包络和阈值流程提取有限同步窗口的持续时间，并扫描中间比特耦合与外比特相对耦合比得到窗口时长参数图。\n3. 结果显示窗口时长随外比特相对耦合增强而快速缩短、在强耦合区对中间比特耦合较弱依赖，为电路QED多比特集体动力学的约化态表征提供可检验视角。", "summary_source": "deepseek", "authors": [{"name": "Tiantian Huan"}], "featured_authors": [{"name": "Tiantian Huan"}], "author_count": 1}, {"id": "2610.32659", "category": "quant-ph", "title": "An Invitation to Algebraic Methods in Quantum Theory", "abstract": "In this paper, we present various well-studied examples of quantum systems, and discuss how they might be analysed algebraically. We analyse the harmonic oscillator, hydrogenic atom, optical components, and particle spin using multiple algebraic methods, and highlight the central importance of algebraic relationships between operators in determining the physical character of the system. In particular, we show: the ubiquity of the Lie algebra $\\mathfrak{so}(2,1)\\cong\\mathfrak{su}(1,1)$ as the ``spectrum generating algebra''; the role of $\\mathfrak{su}(2)$ and $\\mathfrak{su}(1,1)$ in determining the action of optical components; that an elementary algebraic approach to particle spin offers novel insights into its nature versus the usual approaches; and how understanding the full (often hidden) symmetry of a problem enables it to be solved immediately without the need to solve differential equations. We hope this work will serve as a gentle introduction to algebraic methods in quantum mechanics for the interested reader --- we therefore signpost active areas of research within the community.", "url": "https://arxiv.org/abs/2610.32659", "type": "理论+数值", "summary": "1. 该文以谐振子、氢原子、光学元件和粒子自旋为例，系统讨论了如何用多种代数方法分析量子系统，并给出面向读者的入门性梳理。\n2. 其核心贡献在于强调算子间代数关系决定系统物理特性，展示so(2,1)≅su(1,1)作为谱生成代数的普适性、su(2)与su(1,1)对光学元件作用的刻画，以及利用完整（常为隐藏）对称性无需解微分方程即可直接求解。\n3. 这为量子力学教学与研究者提供了一个以代数关系和对称性为线索的统一入口，并指向群论与谱生成代数等仍活跃的研究方向。", "summary_source": "deepseek", "authors": [{"name": "Peter T. J. Bradshaw"}, {"name": "Jonte R. Hance"}], "featured_authors": [{"name": "Peter T. J. Bradshaw"}, {"name": "Jonte R. Hance"}], "author_count": 2}, {"id": "2610.32693", "category": "quant-ph", "title": "Elementary proofs of quantum lower bounds for element distinctness and k-sum", "abstract": "We give elementary proofs of the $\\Omega(n^{2/3})$ quantum query lower bound for element distinctness and the $\\Omega(n^{k/(k+1)})$ lower bound for the $k$-sum problem, for fixed $k$ and sufficiently large groups. The proofs use only basic properties of quantum states and linear algebra, analyzing the differences of algorithm states on different inputs.", "url": "https://arxiv.org/abs/2610.32693", "type": "理论+数值", "summary": "1. 该文为元素区分问题给出Ω(n^{2/3})量子查询下界，并为固定k及足够大群上的k-sum问题给出Ω(n^{k/(k+1)})下界的初等证明。\n2. 其技术卖点在于仅使用量子态的基本性质与线性代数，通过分析算法在不同输入上量子态之间的差异来推导下界，避免繁重高级工具。\n3. 这一证明框架降低了相关量子查询下界的理解门槛，并可为其他组合问题的初等下界证明提供可迁移的思路。", "summary_source": "deepseek", "authors": [{"name": "Andris Ambainis"}, {"name": "Martins Kokainis"}], "featured_authors": [{"name": "Andris Ambainis"}, {"name": "Martins Kokainis"}], "author_count": 2}, {"id": "2610.32724", "category": "quant-ph", "title": "Optimal probes for estimating the dephasing of a quantum spin system", "abstract": "We investigate the optimal estimation of dephasing in finite-dimensional quantum spin systems. We first discuss some properties of the optimal probe states and present an efficient numerical algorithm to compute the optimal precision in dephasing estimation and identify the optimal probe states. For the dephasing channel arising from Gaussian phase diffusion, a spin cat state is known to be optimal for small dephasing. We analytically determine the range of dephasing strengths over which the cat state remains globally optimal for spins $J=1$ and $J=3/2$, and derive upper bounds on its optimality region for larger spins. We then compare numerically several probe states proposed in the literature, showing in particular that the simple class of probes obtained from uniform superpositions of all levels performs near-optimally for stronger dephasing. Finally, we apply our framework to a central-spin model coupled to a nuclear-spin bath, whose dynamics we simulate using the cluster-correlation expansion. Our results show that, while the cat state is optimal for weak Gaussian dephasing, pulse-controlled non-Markovian dynamics can favor states with amplitudes distributed over multiple spin levels, and in some cases the uniform state outperforms the other fixed probes considered. This shows how the choice of probe state depends both on the dephasing strength and on the dynamics.", "url": "https://arxiv.org/abs/2610.32724", "type": "理论+数值", "summary": "1. 该工作系统研究了有限维量子自旋体系中退相强度的最优估计，给出了计算最优精度并识别最优探针态的高效数值算法，并解析确定了自旋J=1与J=3/2时猫态保持全局最优的退相范围。\n2. 其核心在于比较猫态、均匀叠加态等文献探针，发现弱高斯退相下猫态最优，而较强退相下全能级均匀叠加态可近最优，并通过对核自旋浴的中心自旋模型与簇关联展开模拟揭示了脉冲控制非马尔可夫动力学下多能级分布态的优势。\n3. 这表明最优探针选择同时依赖退相强度与具体动力学，为有限维自旋体系的退相估计及受控非马尔可夫场景下的探针设计提供了可检验依据。", "summary_source": "deepseek", "authors": [{"name": "Leonardo Ratini"}, {"name": "Stefano Carretta"}, {"name": "Francesco Albarelli"}], "featured_authors": [{"name": "Leonardo Ratini"}, {"name": "Stefano Carretta"}, {"name": "Francesco Albarelli"}], "author_count": 3}, {"id": "2610.32733", "category": "quant-ph", "title": "Entanglement Asymmetry and Asymmetry Contour under Boundary Symmetry Breaking", "abstract": "We investigate how symmetry-breaking boundary magnetic fields affect magnetization and Rényi-2 entanglement asymmetry (EA) in the transverse-field Ising model. For the ground state, magnetization exhibits qualitatively distinct behaviors in the ordered and disordered phases. EA also exhibits phase-dependent behavior, which is well captured by the lower and upper bounds derived in this work. In the critical regime, both magnetization and EA exhibit behavior qualitatively consistent with the field-theoretical predictions for a related setup. We also study boundary-quench dynamics and find that magnetization propagates from the boundary into the bulk wi
