<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>arXiv 2026-10-26 · Daily ArXiv Selection</title>
  <style>
    :root {
      --bg: #f6f1e8;
      --panel: rgba(255, 252, 246, 0.92);
      --text: #2d241d;
      --muted: #6d5d50;
      --line: rgba(69, 49, 32, 0.14);
      --accent: #8f3d2e;
      --accent-2: #1d5f6b;
      --theory: #7c3a2a;
      --numeric: #255b6a;
      --both: #5d4a99;
      --experimental: #2f6b39;
      --shadow: 0 18px 40px rgba(54, 32, 16, 0.12);
      --radius: 22px;
      --ui-font: "Aptos", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --title-font: "Palatino Linotype", "Noto Serif SC", Georgia, serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--ui-font);
      color: var(--text);
      background: radial-gradient(circle at top left, rgba(255,255,255,0.78), transparent 32%), radial-gradient(circle at 88% 12%, rgba(29,95,107,0.14), transparent 20%), linear-gradient(180deg, #fbf7f0 0%, var(--bg) 42%, #f2e8dc 100%);
      min-height: 100vh;
    }
    .shell { width: min(1220px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 64px; }
    .hero {
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(255,255,255,0.84), rgba(255,248,238,0.72)), linear-gradient(135deg, rgba(143,61,46,0.08), rgba(29,95,107,0.08));
      box-shadow: var(--shadow);
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.82); border: 1px solid var(--line); color: var(--muted); font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase;
    }
    h1 { margin: 18px 0 10px; font-family: var(--title-font); font-size: clamp(32px, 5vw, 54px); line-height: 1.04; letter-spacing: -0.03em; }
    .hero p { max-width: 880px; color: var(--muted); font-size: 16px; line-height: 1.7; margin: 0; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-top: 26px; }
    .stat { padding: 16px 18px; background: rgba(255,255,255,0.76); border: 1px solid var(--line); border-radius: 18px; }
    .stat .label { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
    .stat .value { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
    .controls { position: sticky; top: 12px; z-index: 3; margin-top: 22px; padding: 18px; border: 1px solid var(--line); border-radius: 24px; background: rgba(250,244,236,0.9); backdrop-filter: blur(16px); box-shadow: 0 10px 24px rgba(54,32,16,0.08); }
    .control-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 16px; }
    .field { display: flex; flex-direction: column; gap: 10px; }
    .field label { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
    .search { width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line); background: rgba(255,255,255,0.92); font: inherit; color: var(--text); }
    .chip-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .chip { border: 1px solid var(--line); background: rgba(255,255,255,0.82); color: var(--text); padding: 10px 14px; border-radius: 999px; font: inherit; cursor: pointer; }
    .chip.active { border-color: rgba(143,61,46,0.35); background: rgba(143,61,46,0.12); color: #5b2419; }
    .chip[data-type="数值"].active { border-color: rgba(37,91,106,0.35); background: rgba(37,91,106,0.12); color: #173f49; }
    .chip[data-type="理论+数值"].active { border-color: rgba(93,74,153,0.35); background: rgba(93,74,153,0.12); color: #46337d; }
    .chip[data-type="实验"].active { border-color: rgba(47,107,57,0.35); background: rgba(47,107,57,0.12); color: #214c29; }
    .meta-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 14px; color: var(--muted); font-size: 14px; }
    .paper-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 18px; margin-top: 22px; }
    .paper { display: flex; flex-direction: column; gap: 14px; padding: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 10px 24px rgba(54,32,16,0.06); }
    .paper-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .tag { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid transparent; }
    .tag.category { background: rgba(45,36,29,0.08); color: var(--text); }
    .tag.type-theory { background: rgba(124,58,42,0.1); color: var(--theory); border-color: rgba(124,58,42,0.16); }
    .tag.type-numeric { background: rgba(37,91,106,0.1); color: var(--numeric); border-color: rgba(37,91,106,0.16); }
    .tag.type-both { background: rgba(93,74,153,0.1); color: var(--both); border-color: rgba(93,74,153,0.16); }
    .tag.type-experimental { background: rgba(47,107,57,0.1); color: var(--experimental); border-color: rgba(47,107,57,0.16); }
    .paper h2 { margin: 0; font-family: var(--title-font); font-size: 22px; line-height: 1.25; letter-spacing: -0.02em; }
    .paper h2 a { color: inherit; text-decoration: none; }
    .paper h2 a:hover { color: var(--accent); }
    .paper .id { color: var(--muted); font-size: 13px; }
    .author-block { display: grid; gap: 10px; padding: 14px 16px; border-radius: 18px; background: rgba(255,255,255,0.64); border: 1px solid var(--line); }
    .author-label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .author-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .author-item { display: grid; gap: 4px; }
    .author-item strong { font-size: 14px; }
    .author-item span { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .author-note { color: var(--muted); font-size: 12px; }
    .paper .summary { margin: 0; font-size: 15px; line-height: 1.75; white-space: pre-line; }
    details { border-top: 1px solid var(--line); padding-top: 12px; }
    details summary { cursor: pointer; color: var(--accent-2); font-weight: 700; list-style: none; }
    details summary::-webkit-details-marker { display: none; }
    details p { margin: 10px 0 0; color: var(--muted); line-height: 1.72; font-size: 14px; white-space: pre-line; }
    .paper footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 6px; color: var(--muted); font-size: 13px; }
    .paper footer a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .empty { display: none; margin-top: 24px; padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 22px; background: rgba(255,255,255,0.7); }
    @media (max-width: 980px) { .control-grid { grid-template-columns: 1fr; } .controls { position: static; } }
  </style>
</head>

      <h1>Daily ArXiv Selection</h1>

        数据来自 arXiv 当天的 <code>cond-mat</code>、<code>hep-th</code>、<code>math-ph</code>、<code>quant-ph</code> 四个分类页，口径限定为 <code>New submissions</code>。
        页面主体优先展示 DeepSeek reasoner 生成的三句话中文总结；若 API 不可用或返回异常，则回退为基于中文翻译抽取的本地三句话总结；下拉可以查看英文原版摘要。

  <script>
    const papers = [{"id": "2610.31676", "category": "cond-mat", "title": "Lattice Symmetry Remnants in Spatial and Temporal Entanglement of Quantum Critical Spin Chains", "abstract": "Quantum critical lattice models carry universal information beyond the bulk data of their infrared conformal field theory (CFT): microscopic lattice symmetries constrain how the CFT is realized. We probe these remnants through the spatial and temporal entanglement of two Euclidean-evolved states from the same critical model. In the finite-length scaling regime, a conformal boundary encodes the long-distance effect of the short-range initial state, and boundary CFT (BCFT) organizes the universal low-lying entanglement spectrum. We formulate the temporal state as a uniform infinite matrix product state evolved by a symmetry-preserving infinite matrix product operator, using a local factorization regular even at arbitrarily small Trotter steps. For the Ising and three-state Potts chains, whose relevant symmetries are onsite, the spatial and temporal constructions approach the same BCFT structure; varying the initial state engineers conformal boundaries distinguishable spectroscopically. The spin-1/2 XXZ chain instead realizes a Lieb--Schultz--Mattis (LSM) constraint between internal U(1) symmetry and one-site translation. A U(1)-preserving short-range spatial state accommodates it through a doubled unit cell and inequivalent entanglement cuts, whereas the temporal state remains uniform along Euclidean time. Successive spatial transfer steps pump the temporal entanglement spectrum between translation-related Dirichlet sectors, equivalently between integer and half-integer compact-boson zero modes. Breaking U(1) removes both the zero mode and the alternation. Continued evolution at fixed bond dimension crosses over from the finite-length BCFT regime to a finite-entanglement regime generated by symmetry-allowed relevant deformations. Thus microscopic symmetry and anomaly data remain visible in universal entanglement by constraining the boundary realization of the infrared CFT.", "url": "https://arxiv.org/abs/2610.31676", "type": "理论", "summary": "1. 该工作以同一量子临界自旋链的两个欧氏演化态为对象，通过空间与时间纠缠探测微观格点对称性在红外共形场论边界实现中的残留。\n2. 其核心是把时间态写成由对称保持的无限矩阵乘积算子演化的均匀无限矩阵乘积态，并采用任意小Trotter步下仍正则的局部分解，用边界CFT组织低能纠缠谱；Ising与三态Potts链的空间/时间构造趋于同一BCFT结构，而XXZ链的U(1)-单格点平移LSM约束体现为双胞元、非等价纠缠切及时间纠缠谱在平移相关Dirichlet扇区间的泵浦。\n3. 这表明微观对称性与反常数据会通过约束CFT的边界实现而显现在普适纠缠中，并为有限键维下从有限长度BCFT区制向有限纠缠区制的交叉提供可检验启示。", "summary_source": "deepseek", "authors": [{"name": "Xiao-Han Yang"}, {"name": "Rui-Zhen Huang"}], "featured_authors": [{"name": "Xiao-Han Yang"}, {"name": "Rui-Zhen Huang"}], "author_count": 2}, {"id": "2610.31843", "category": "cond-mat", "title": "Optical signatures of Rashba--Dresselhaus coupling across Franz--Keldysh and Landau regimes in two-dimensional semiconductors", "abstract": "We develop a unified theory of the interband optical response of a two-dimensional semiconductor with simultaneous Rashba and Dresselhaus spin-orbit couplings in electric and magnetic fields. In crossed fields, the in-plane electric field generates an effective spin-orbit drift field that modifies the Landau spectrum and spinor states, while at zero magnetic field the problem maps onto Landau--Zener spin this http URL zero external fields, the total joint density of states above the band gap remains unchanged, while characteristic subgap structures appear. Pure Rashba coupling produces an inverse square root singularity, whereas a finite Dresselhaus term gives a step and a logarithmic peak, allowing the two couplings to be distinguished optically. At zero magnetic field, the Franz--Keldysh response shows a crossover from diabatic to adiabatic spin dynamics as the electric field is reduced. In the weak-field Rashba regime, the field-free singularity becomes a finite peak whose height scales as $\\mathcal E^{-1/3}$ and whose position approaches $E_g-E_{\\rm SO}$, providing a direct measure of the Rashba energy. In a perpendicular magnetic field, spin-orbit coupling shifts and splits the Landau absorption lines and produces anticrossings without changing their total weights. The Rashba splitting changes from a $\\sqrt{B}$ dependence at weak fields to a linear dependence at strong fields. Finally, in crossed electric and magnetic fields, the electric field broadens the Landau lines and drives a continuous crossover toward the Franz--Keldysh regime, while spin-orbit coupling produces opposite shifts and different widths for the two members of each doublet.", "url": "https://arxiv.org/abs/2610.31843", "type": "理论", "summary": "1. 该工作建立了同时含Rashba与Dresselhaus自旋轨道耦合的二维半导体在电场、磁场及交叉场中的带间光学响应统一理论，覆盖Franz–Keldysh与Landau区域。\n2. 其核心卖点是用子带隙光学线型区分两种耦合：纯Rashba给出逆平方根奇点，有限Dresselhaus产生台阶与对数峰；弱电场下峰高按E^{-1/3}缩放、位置趋于Eg-E_SO，可直接测得Rashba能量。\n3. 该框架为二维半导体中自旋轨道耦合组分的光学诊断及电场/磁场驱动的Landau–Franz–Keldysh渡越提供可检验预言，并可启发后续磁光实验。", "summary_source": "deepseek", "authors": [{"name": "Bahruz Suleymanli"}, {"name": "Samir Tariverdiev"}, {"name": "B. Tanatar"}], "featured_authors": [{"name": "Bahruz Suleymanli"}, {"name": "Samir Tariverdiev"}, {"name": "B. Tanatar"}], "author_count": 3}, {"id": "2610.31849", "category": "cond-mat", "title": "'Dancing' two-dimensional patterns in nematics above the flexoelectric instability threshold", "abstract": "Various types of electrohydrodynamic instabilities in liquid crystals (LCs) are a recurring theme in LC research. The nonlinear stage of the flexoelectric instability in nematics remains the least studied aspect of this phenomenon. This work highlights a key advancement in nonlinear physics, providing a compelling example of nonlinear dynamical system behavior. By solving the system of nonlinear equations for a nematic in an alternating external field, we derive from first principles the unique \"dancing\" behavior of truly two-dimensional patterns above the flexoelectric instability threshold. Our analysis is restricted to liquid crystals with negative dielectric permittivity and electrical conductivity anisotropies. The resulting solution represents a stable limit cycle near above the Hopf bifurcation, valid within the parameters range where the solutions characteristic exponent is complex. The generalized two-dimensional Ginzburg-Landau-like phenomenological theory of the phenomenon is developed.", "url": "https://arxiv.org/abs/2610.31849", "type": "理论", "summary": "1. 该工作通过求解交流外场中向列相液晶的非线性方程组，从第一性原理导出了柔性电不稳定性阈值以上真正二维图案的“舞蹈”行为，并限定于介电常数与电导率各向异性均为负的材料。\n2. 其核心在于将阈值上方的非线性动力学刻画为Hopf分岔附近的稳定极限环，且仅在特征指数为复数的参数区有效，并建立了广义二维Ginzburg-Landau型唯象理论。\n3. 这为柔性电不稳定性非线性阶段提供了可检验的动力学图像，并启发利用二维极限环与唯象模型设计和调控液晶电对流图案。", "summary_source": "deepseek", "authors": [{"name": "E.S. Pikina"}], "featured_authors": [{"name": "E.S. Pikina"}], "author_count": 1}, {"id": "2610.31871", "category": "cond-mat", "title": "Strontium Titanate Capping Layers as Kinetic Regulators of Redox Phase Transitions in Oxide Heterostructures", "abstract": "Oxide capping layers are widely used to protect and stabilize thin-film heterostructures, yet their role in governing phase-transition kinetics remains largely unexplored. Here, we uncover the kinetic function of few-nanometer-thick SrTiO$_3$ (STO) capping layers in controlling oxidation and reduction processes, using real-time in situ optical spectroscopic ellipsometry. We show that oxygen diffusion through the nanoscale capping layer constitutes the rate-limiting step, giving rise to diffusion-controlled phase transitions in the underlying materials. As a result, both capping-layer thickness and oxygen partial pressure provide effective handles to tune phase transition temperatures. Quantitative analysis yields an activation energy of $E_A$ = 0.64 $\\pm$0.06 eV for oxygen diffusion through STO, highlighting its suitability for precise control of redox reactions in diverse material systems. These results establish oxide capping layers as active kinetic regulators of redox-driven phase transitions and offer a general framework for engineering redox dynamics in complex oxide heterostructures.", "url": "https://arxiv.org/abs/2610.31871", "type": "理论", "summary": "1. 该工作利用实时原位光学椭偏光谱，研究数纳米厚SrTiO3覆盖层对氧化物异质结构中氧化还原相变动力学的调控作用。\n2. 其核心卖点在于证明氧通过覆盖层的扩散是限速步骤，使相变呈扩散控制，并可由覆盖层厚度与氧分压调节相变温度，拟合得氧扩散激活能为0.64±0.06 eV。\n3. 这将氧化物覆盖层从被动保护层提升为主动动力学调节器，并为复杂氧化物异质结构中氧化还原动力学的通用设计提供框架。", "summary_source": "deepseek", "authors": [{"name": "Pooya Abdollahi"}, {"name": "Woo Jin Kim"}, {"name": "Keaghan Knight"}, {"name": "Harold Y. Hwang"}, {"name": "Ambrose Seo"}], "featured_authors": [{"name": "Pooya Abdollahi"}, {"name": "Woo Jin Kim"}, {"name": "Keaghan Knight"}, {"name": "Harold Y. Hwang"}, {"name": "Ambrose Seo"}], "author_count": 5}, {"id": "2610.31893", "category": "cond-mat", "title": "Heat current and noise in a point-like junction between normal metal and fractional quantum hall edge state with $ν= 1/3$", "abstract": "In this study, we investigate heat current correlations between two edge states coupled through a constriction in the fractional quantum Hall regime at filling factor $\\nu = 1/3$. This configuration allows us to map the system onto an interacting Tomonaga-Luttinger liquid with a local impurity, where the interaction parameter takes the value $\\kappa = 1/2$. This specific parameter value enables the application of the refermionization method. By solving the refermionized Hamiltonian, we compute the heat current and evaluate the finite-frequency heat auto- and cross-correlation functions. Our results reveal asymmetric behavior with frequency, corresponding to absorption and emission noise, respectively. Furthermore, we examine several limiting cases, including low- and high-temperature limits as well as strong- and weak-backscattering regimes. In the weak backscattering regime, the Lorenz number approaches $4L_0$ at high voltage, suggesting a rescaling of the Wiedemann-Franz law due to interactions. A detailed study of the heat current fluctuations has made it possible to identify and derive expressions for the dominant contribution in the various regimes of interest, and to reveal the predominance of partition noise.", "url": "https://arxiv.org/abs/2610.31893", "type": "理论+数值", "summary": "1. 该工作研究正常金属与ν=1/3分数量子霍尔边缘态点结中的热流及噪声，将系统映射为κ=1/2的相互作用朝永–卢廷格液体加局域杂质，并用再费米化方法计算热流及有限频自/互关联。\n2. 其卖点是揭示吸收与发射噪声的频率不对称性，并在弱背散射高偏压区得到洛伦兹数趋近4L0、表明相互作用重整了维德曼–弗兰兹定律，且分配噪声占主导。\n3. 这为用热噪声谱探测分数量子霍尔边缘的相互作用与点接触输运提供可检验预言，并启发对重整化维德曼–弗兰兹行为的实验检验。", "summary_source": "deepseek", "authors": [{"name": "Redouane Zamoum"}, {"name": "Houssam Eddine Farhi"}, {"name": "Abdellah Touati"}, {"name": "Adeline Crépieux"}], "featured_authors": [{"name": "Redouane Zamoum"}, {"name": "Houssam Eddine Farhi"}, {"name": "Abdellah Touati"}, {"name": "Adeline Crépieux"}], "author_count": 4}, {"id": "2610.31926", "category": "cond-mat", "title": "Poly(vinylidene fluoride) under finite electric displacement fields: a removable $α\\!\\to\\!δ$ reorientation barrier and a persistent first-order $δ\\!\\to\\!β$ conformational change", "abstract": "The $\\alpha$, $\\delta$, and $\\beta$ phases of PVDF are interconverted by electrical poling and mechanical drawing, yet the thermodynamics under a controlled electrical boundary condition has not been established from first principles. We evaluate the zero-temperature free energy at fixed electric displacement $D$ from van der Waals density-functional calculations along two constrained coordinates in a common 24-atom cell: a tilt of the gauche C--C bonds that maps antipolar $\\alpha$ onto polar $\\delta$ (cell change $<1\\%$), and a backbone torsion that straightens TG$^+$TG$^-$ chains into all-trans $\\beta$ (chain-repeat strain $10.6\\%$). As $D$ increases from 0 to $0.30$~C\\,m$^{-2}$, the lowest homogeneous free energy switches from $\\alpha$ to $\\delta$ at $D_{c1}=0.046$~C\\,m$^{-2}$ and from $\\delta$ to $\\beta$ at $D_{c2}=0.157$~C\\,m$^{-2}$. At $T=0$ with domain-wall energy neglected, a $\\delta$ multidomain state lies $14.3$~meV per cell below homogeneous $\\alpha$ at every $D$. A $\\Gamma$-point harmonic estimate suggests that vibrations reverse this ordering at room temperature. $\\delta$ and $\\beta$ coexist for $0.11<D<0.21$~C\\,m$^{-2}$ at $E^*=0.69$~GV\\,m$^{-1}$, independent of the screening constant. The tilt barrier falls from $0.66$~eV per cell at $D=0$ to $17$~meV at $D=0.30$~C\\,m$^{-2}$ (below $k_BT$ at $300$~K), while the torsion barrier remains $0.66$~eV at $D_{c2}$ and $0.34$~eV at $D=0.30$~C\\,m$^{-2}$, so $\\delta\\to\\beta$ stays first order. Much of the difference traces to the path effective charge ($0.28e$ for the tilt, $0.18e$ for the torsion). Scaling shows the tilt barrier would survive with the torsion charge; the smaller torsion charge accounts for about half the barrier it retains. The landscape accounts for why a field produces $\\delta$ and why $\\beta$ is reached by drawing, and suggests that raising that charge could let a field alone produce $\\beta$.", "url": "https://arxiv.org/abs/2610.31926", "type": "理论+数值", "summary": "1. 该工作用范德华密度泛函在固定电位移下构建聚偏氟乙烯α、δ、β相的自由能景观，沿旁式C–C键倾转和主链扭转两个约束坐标计算零温热力学与相变路径。\n2. 其卖点是给出电位移驱动α→δ→β的临界值0.046与0.157 C m⁻²，并揭示倾转势垒从0.66 eV降至17 meV而消失、扭转势垒仍为0.66/0.34 eV使δ→β保持一阶，差异可由路径有效电荷解释。\n3. 该景观解释了电场易得δ相、β相需拉伸实现的相选择，并启示提高扭转路径有效电荷有望仅靠电场获得β相。", "summary_source": "deepseek", "authors": [{"name": "Shaohui Qiu"}, {"name": "Jacob C. Dean"}, {"name": "Rajagopalan Thiruvengadathan"}, {"name": "Ramanujam Brahmadesam Thoopul Srinivasa Raghava"}], "featured_authors": [{"name": "Shaohui Qiu"}, {"name": "Jacob C. Dean"}, {"name": "Rajagopalan Thiruvengadathan"}, {"name": "Ramanujam Brahmadesam Thoopul Srinivasa Raghava"}], "author_count": 4}, {"id": "2610.32072", "category": "cond-mat", "title": "Boundary shape controls the stress distribution in two-component elastic materials", "abstract": "We investigate how the shape and arrangement of high-stiffness regions govern stress redistribution in two-component triangular elastic spring networks subjected to spatially correlated and uncorrelated random prestress. We compare boundary roughness, partitioning into disconnected regions, and graded transitions between regions of different stiffness. Our simulations identify interface bonds as channels for energy transfer: increasing their number provides additional transfer paths and reduces stress concentration in mechanically rigid regimes, while offering little benefit in compliant subnetworks. This is analogous to defects in naturally occurring crystal structures, where the defects themselves isolate stress. At a fixed fraction of high-stiffness material, partitioning reduces stress concentration for both correlated and uncorrelated prestress. The benefit diminishes with further subdivision as the number of interface bonds becomes comparable to the number of interior nodes. Stress reduction, however, depends on the spatial correlations of the imposed prestress: random prestress generally yields a stronger effect, though the difference diminishes in some regimes. Graded interfaces further reduce peak stress by distributing the stiffness transition over a broader region. Together, these results suggest design strategies based on increasing interface area, matching subdivision scale to prestress correlations, and grading stiffness transitions. This minimal framework identifies how internal structure controls energy transfer and stress redistribution, suggesting design principles for mechanical robustness under both internal and external loading.", "url": "https://arxiv.org/abs/2610.32072", "type": "理论+数值", "summary": "1. 该工作基于双组分三角弹性弹簧网络，在空间相关与不相关随机预应力下系统比较边界粗糙度、高刚度区离散分区和刚度渐变过渡对应力重分布的影响。\n2. 其核心在于识别界面键为能量传递通道：增加界面键可在刚性区提供额外传递路径并降低应力集中，而在柔性子网中收益有限；固定高刚度比例时分区可降低集中，但细分至界面键数与内部节点数相当时收益饱和，且随机预应力下效应通常更强。\n3. 这些结果指向以增大界面面积、使分区尺度匹配预应力关联并对刚度过渡进行梯度化的设计策略，并为内部结构调控能量传递与力学稳健性提供最小框架。", "summary_source": "deepseek", "authors": [{"name": "Kyungeun Kim"}, {"name": "Adam Clare"}, {"name": "Miranda Holmes-Cerfon"}], "featured_authors": [{"name": "Kyungeun Kim"}, {"name": "Adam Clare"}, {"name": "Miranda Holmes-Cerfon"}], "author_count": 3}, {"id": "2610.32090", "category": "cond-mat", "title": "The Extended Diode Equation", "abstract": "For more than 75 years, the p-n junction current-voltage characteristic has been derived by treating majority carriers as an inert background and conflating the junction voltage with the applied bias. Here we show that the base electric field, generated by the coupling of excess majority and minority carriers, fundamentally alters the internal potential distribution. This self-consistent framework yields a closed-form extended diode equation that reproduces the high-injection roll-off without invoking an external series resistance, thereby eliminating an empirical patch that has persisted in the classical theory.", "url": "https://arxiv.org/abs/2610.32090", "type": "理论", "summary": "1. 该工作重新审视p-n结电流-电压特性的经典推导，在考虑过剩多数与少数载流子耦合产生的基区电场下建立自洽框架，并给出闭式扩展二极管方程。\n2. 其关键在于不再把多数载流子视为惰性背景、也不将结电压等同于外加偏压，而由内部电势重分布自然再现高注入滚降，无需引入外部串联电阻这一经验修补。\n3. 这消解了经典理论中长期保留的经验项，并为高注入条件下结器件的建模与参数提取提供更自洽的起点。", "summary_source": "deepseek", "authors": [{"name": "Jianhong Yang"}, {"name": "Gonghao Sun"}, {"name": "Tinglan Li"}], "featured_authors": [{"name": "Jianhong Yang"}, {"name": "Gonghao Sun"}, {"name": "Tinglan Li"}], "author_count": 3}, {"id": "2610.32121", "category": "cond-mat", "title": "Material criteria for angular-momentum transfer from twisted photons to photoelectrons", "abstract": "We study the material requirements for transferring the total-angular-momentum (TAM) projection of a twisted photon to the orbital angular momentum (OAM) of a photoelectron emitted from an $n$-type semiconductor surface. Within a single-valley effective-mass model of surface photoemission, we calculate OAM-resolved spectra for GaAs, InSb, $\\mathrm{InAs}_{0.34}\\mathrm{Sb}_{0.66}$, and $\\mathrm{Hg}_{0.76}\\mathrm{Cd}_{0.24}\\mathrm{Te}$ irradiated by twisted photons with Laguerre--Gaussian--like momentum profile. The OAM transfer is characterized by the mean electron OAM, its root-mean-squared width, and the fraction of electrons with OAM-projection equal to the photon TAM-projection. Efficient transfer requires the transverse momentum of the conduction electron to be much smaller than the transverse momentum width of the photon, which favors low temperatures, small conduction-band effective masses, and shallow donor levels. GaAs is less favorable within the present model because of its larger effective mass and deeper donor levels. We also discuss the demanding photon-wave packet parameters, possible extensions to Dirac and Weyl semimetals, and post-emission OAM selection. Although the generation of vortex electrons with a vanishing OAM uncertainty via photoemission seems challenging, we argue that it is still possible to generate single-electron vortex states with a finite OAM dispersion.", "url": "https://arxiv.org/abs/2610.32121", "type": "理论+数值", "summary": "1. 该文在单谷有效质量表面光电发射模型中，计算GaAs、InSb、InAs0.34Sb0.66和Hg0.76Cd0.24Te在类拉盖尔-高斯扭曲光子照射下的OAM分辨谱，以评估将光子总角动量投影转移为光电子轨道角动量的材料判据。\n2. 其核心判据是导带电子横向动量须远小于光子横向动量宽度，因而低温、小导带有效质量和浅施主有利，GaAs因有效质量较大且施主较深而不占优。\n3. 作者指出零OAM不确定度的涡旋电子生成仍困难，但有限OAM色散的单电子涡旋态可行，并讨论了波包参数、向Dirac/Weyl半金属扩展及发射后OAM选择。", "summary_source": "deepseek", "authors": [{"name": "A. A. Shchepkin"}, {"name": "D. V. Karlovets"}], "featured_authors": [{"name": "A. A. Shchepkin"}, {"name": "D. V. Karlovets"}], "author_count": 2}, {"id": "2610.32123", "category": "cond-mat", "title": "Kinetic competition controls loss-induced exceptional points of Hubbard pairs", "abstract": "Two-body loss can bind two fermions in a Hubbard lattice, yet the binding threshold in the infinite lattice need not be an exceptional point (EP). At fixed total momentum $\\mathbf{K}$, the hops of the two particles interfere into a relative-motion hopping along each lattice direction, which sets the kinetic energy of the relative motion. On a hypercubic lattice, the threshold $g_c=1/[\\pi\\rho_2(0)]$ is an EP precisely when the maximum kinetic energy along one direction exceeds the sum of the transverse maxima. This dominance keeps every transverse-momentum scattering channel propagating near the band center, making the local pair Green function purely imaginary there. Two real-energy scattering zeros associated with coherent perfect absorption then coalesce at the threshold into a second-order EP of the analytically continued pair problem, where loss restores the parity-time symmetry of the pair's scattering solutions. Without a dominant direction, binding occurs without coalescence and without breaking of that symmetry. Total momentum can therefore select EP sectors even on isotropic lattices. More broadly, the kinetic structure of the two-particle continuum determines whether loss-induced binding and exceptional degeneracy coincide.", "url": "https://arxiv.org/abs/2610.32123", "type": "理论", "summary": "1. 该文研究了Hubbard晶格中双体损耗诱导的两费米子束缚阈值何时成为例外点，并给出由相对运动动能竞争控制的判据。\n2. 其核心是固定总动量下跃迁干涉形成相对运动动能，阈值 gc=1/[πρ2(0)] 仅当某一方向最大动能超过横向最大动能之和时对应二阶EP，使横向动量通道在带心附近传播并使配对格林函数为纯虚，散射零点合并且损耗恢复配对散射解的PT对称性。\n3. 这表明总动量甚至可在各向同性晶格上选择EP扇区，双粒子连续谱的动能结构决定损耗诱导束缚与例外简并是否重合。", "summary_source": "deepseek", "authors": [{"name": "Ho-Kin Tang"}, {"name": "Xiaosen Yang"}], "featured_authors": [{"name": "Ho-Kin Tang"}, {"name": "Xiaosen Yang"}], "author_count": 2}, {"id": "2610.32224", "category": "cond-mat", "title": "Intrinsic Paramagnetism of Optical Phonons and Thermal Hall Effect in Quantum Paraelectrics", "abstract": "We propose a microscopic theory of the phonon-mediated thermal Hall effect in quantum paraelectrics, driven by the intrinsic paramagnetism due to quantum fluctuations of the (nearly) critical optical phonon modes. The effective magnetization due to temporal fluctuations of the assosciated dipoles couple to an external magnetic field resulting the magnetoelectric term $\\mathbf{H} \\cdot (\\mathbf{P} \\times \\dot{\\mathbf{P}})$ in the effective Lagrangian density of the polarisation field $\\mathbf{P}$. This coupling splits the transverse optical phonon spectrum into right- and left-circularly polarized chiral branches. Using the chiral phonon Green's functions and the Kubo formalism, we derive the thermal Hall conductivity $\\kappa_{xy}$ from the heat-current correlation function. We observe that $\\kappa_{xy}$ is proportional to the difference in spectral weights of the two chiral modes, $\\kappa_{xy} \\propto A_+^2 - A_-^2$, establishing a direct microscopic link between phonon chirality and transverse heat transport. Our theory predicts three key observations: (i) a linear-in-magnetic-field response $\\kappa_{xy} \\propto H$ at low fields, evolving into nonlinear behavior at higher fields (ii) a non-monotonic temperature dependence of $\\kappa_{xy}$ with a peak arising from the competition between thermal population and phonon scattering and (iii) strong enhancement of $\\kappa_{xy}$ near the quantum critical point $\\omega_0 \\to 0$, it exhibits power-law scaling $\\kappa_{xy} \\propto T^{\\alpha}$ with $\\alpha \\approx 0.41$. Our findings provide an understanding of thermal Hall transport in quantum paraelectrics due to intrinsic paramagnetism and is aligned with the observed behaviour in SrTiO$_3$ and related materials.", "url": "https://arxiv.org/abs/2610.32224", "type": "理论", "summary": "1. 该文提出量子顺电体中由近临界光学声子量子涨落所致内禀顺磁驱动声子热霍尔效应的微观理论，并用NONE手性声子格林函数与久保公式计算热霍尔电导率。\n2. 其关键在于：偶极矩时间涨落产生有效磁化，经H·(P×Ṗ)磁电耦合将横光学声子劈裂为左右圆偏振手性支，且κxy∝A₊²−A₋²直接联系声子手性与横向热输运。\n3. 理论预言低场κxy∝H并高场转向非线性、温度依赖非单调出现峰值，并在量子临界点ω0→0附近以κxy∝T^α（α≈0.41）增强，为SrTiO3等材料的热霍尔行为提供微观解释与可检验启示。", "summary_source": "deepseek", "authors": [{"name": "Harsh Jain"}, {"name": "Manideep Gone"}, {"name": "Nabyendu Das"}], "featured_authors": [{"name": "Harsh Jain"}, {"name": "Manideep Gone"}, {"name": "Nabyendu Das"}], "author_count": 3}, {"id": "2610.32228", "category": "cond-mat", "title": "Interface Control of Second-Harmonic Generation in Layered CuInP2S6 via PbZr0.2Ti0.8O3 Domain Wall", "abstract": "The control of nonlinear optical responses in van der Waals ferroelectrics at the nanoscale offers opportunities for developing two-dimensional integrated nanophotonics with programmable functionalities. In this work, we report the first realization of nanoscale nonvolatile control of the amplitude and polarization of second-harmonic generation (SHG) response in layered CuInP2S6 (CIPS) via the domain structure in an interfacial PbZr0.2Ti0.8O3 (PZT) thin film. The SHG intensity at CIPS/PZT heterointerface is continuously modulated, either substantially enhanced or almost entirely quenched, by the circular domain walls in underlying ferroelectric oxide. The interfacial coupling of CIPS polar axis with in-plane polarization of PZT domain walls tailors the SHG light polarization into two-fold (C2V) symmetry, which is well modeled by nonlinear electromagnetic theory. Overall, this study enables nonvolatile programmable design of nonlinear light intensity and polarization in van der Waals ferroelectrics at the nanoscale.", "url": "https://arxiv.org/abs/2610.32228", "type": "理论", "summary": "1. 该工作首次在CIPS/PZT异质界面利用PZT畴结构实现了层状CuInP2S6二次谐波产生振幅与偏振的纳米尺度非易失调控。\n2. 其核心在于PZT圆形畴壁可连续增强或几乎淬灭界面SHG强度，并通过CIPS极性轴与畴壁面内极化的界面耦合将SHG偏振裁剪为C2V对称性，且由非线性电磁理论模型解释。\n3. 该结果展示了在范德华铁电体中纳米尺度非易失编程非线性光强与偏振的可行路径，为二维集成纳米光子学的可编程功能设计提供了启示。", "summary_source": "deepseek", "authors": [{"name": "Dawei Li"}, {"name": "Juhe Liu"}, {"name": "Yifei Hao"}, {"name": "Qiuchen Wu"}, {"name": "Xi Huang"}, {"name": "Jesse Stebbing"}, {"name": "Xinyi Hou"}, {"name": "Gaolei Zhao"}, {"name": "Kun Wang"}, {"name": "Yongfeng Lu"}, {"name": "Xia Hong"}], "featured_authors": [{"name": "Dawei Li"}, {"name": "Juhe Liu"}, {"name": "Yifei Hao"}, {"name": "Kun Wang"}, {"name": "Yongfeng Lu"}, {"name": "Xia Hong"}], "author_count": 11}, {"id": "2610.32283", "category": "cond-mat", "title": "Triplon dynamics from partial Kondo screening in frustrated heavy-fermion systems", "abstract": "The partially disordered (PD) phase, in which magnetically ordered and Kondo-screened sites coexist, has been proposed as a possible ground state of geometrically frustrated heavy-fermion systems. We investigate its dynamical properties in the half-filled periodic Anderson model on a triangular lattice by calculating the dynamical spin susceptibility within the random-phase approximation built on a self-consistent Hartree-Fock solution. We show that successive quantum phase transitions from the Kondo-insulating phase to the PD phase and to a magnetically ordered phase are driven by the condensation of triplon modes originating predominantly from the Kondo-screened sites. In the PD phase, magnons and triplons coexist and hybridize, leading to characteristic level repulsion in the excitation spectrum. These results reveal how triplet excitations evolve into collective magnetic modes across the successive phase transitions and highlight the dynamical interplay between magnetic order and Kondo screening in frustrated heavy-fermion systems.", "url": "https://arxiv.org/abs/2610.32283", "type": "理论+数值", "summary": "1. 该工作在半满三角晶格周期安德森模型中，基于自洽哈特里-福克解用随机相位近似计算动态自旋磁化率，研究几何阻挫重费米子体系部分近藤屏蔽相的自旋动力学。\n2. 其核心发现是，从近藤绝缘体到部分无序相再到磁有序相的连续量子相变由主要源于近藤屏蔽格点的三重态激子凝聚驱动，且部分无序相中磁振子与三重态激子共存杂化并产生能级排斥。\n3. 这揭示了三重态激发跨相变演化为集体磁模式的路径，并为理解阻挫重费米子中磁序与近藤屏蔽的动态耦合提供了明确启发。", "summary_source": "deepseek", "authors": [{"name": "Hiroki Nakahara"}, {"name": "Masahito Mochizuki"}, {"name": "Rintaro Eto"}], "featured_authors": [{"name": "Hiroki Nakahara"}, {"name": "Masahito Mochizuki"}, {"name": "Rintaro Eto"}], "author_count": 3}, {"id": "2610.32291", "category": "cond-mat", "title": "Existence and Absence of Spin-Glass Phases on Migdal--Kadanoff Hierarchical Lattices: A Complete Classification", "abstract": "We consider the Ising spin-glass model on Migdal--Kadanoff (MK) hierarchical lattices, characterized by the fractal dimension $d=1+\\log s/\\log b$, where $s$ and $b$ denote the number of parallel branches and the number of bonds in series within each branch, respectively. For independent Gaussian couplings, we rigorously establish a necessary and sufficient condition for the existence of finite-temperature spin-glass order for arbitrary integers $b,s\\ge2$. We prove that a finite-temperature spin-glass phase exists whenever \\[ \\frac{b}{\\sqrt{s}} \\left( \\frac{b\\sqrt{s(s-1)}}{bs-1} \\right)^{s-1}<1. \\] In particular, this condition holds for all three-dimensional MK hierarchical lattices ($d=3$, or equivalently $s=b^2$), regardless of the choice of $b$. Conversely, we prove the absence of finite-temperature spin-glass order for fractal dimensions $d<1+\\log17/\\log6\\approx2.58$, as well as in the large-$b$ limit for any fixed $d<3$. In the intermediate regime $1+\\log17/\\log6\\le d<3$, we provide a finite-step procedure to determine the presence or absence of spin-glass order, which depends on $b$ and $s$. Our results provide a complete characterization of finite-temperature spin-glass order on MK hierarchical lattices.", "url": "https://arxiv.org/abs/2610.32291", "type": "理论", "summary": "1. 该工作针对Migdal--Kadanoff分层格点上的Ising自旋玻璃模型，在独立高斯耦合下严格给出了任意整数b,s≥2时有限温自旋玻璃序存在的充要条件，并完成了完整分类。\n2. 其核心卖点是显式含b与s的判据：所有三维MK格点（s=b^2）均存在有限温自旋玻璃序，而分形维数低于1+log17/log6≈2.58时严格无此类序，中间维数区则给出依赖b、s的有限步判定程序。\n3. 这一完整表征为分形维数和局域连接结构如何控制自旋玻璃相提供了可证明的基准，并可启发对其他无序统计模型的递归判据与近似方法进行检验。", "summary_source": "deepseek", "authors": [{"name": "Manaka Okuyama"}, {"name": "Masayuki Ohzeki"}], "featured_authors": [{"name": "Manaka Okuyama"}, {"name": "Masayuki Ohzeki"}], "author_count": 2}, {"id": "2610.32341", "category": "cond-mat", "title": "Flexo-Photoresponses from First Principles", "abstract": "Many functionally important materials, such as silicon, possess high-symmetry crystal structures that forbid even-order nonlinear optical responses, thereby limiting their application in e.g., photonics and optoelectronics. Strain gradients can effectively break symmetries, activating otherwise forbidden optical responses. Although such flexo-photoresponses have attracted considerable interest recently, a comprehensive microscopic theoretical framework is still lacking. Here, we develop a first-principles approach that can systematically evaluate a wide range of flexo-photoresponses in realistic materials. By mapping strain gradients to long-wavelength phonons within the established theory of electron-phonon coupling, our approach captures the nonlocal quantum-mechanical effects of lattice deformations on nonlinear optical responses. Applying the framework to prototypical centrosymmetric materials, including Si, cubic $\\rm SrTiO_3$, and monolayer black phosphorus, we demonstrate that a strain gradients of $10^5\\sim10^6~\\rm m^{-1}$ can induce flexo-second-harmonic generation and flexo-bulk photovoltaic effects comparable to the intrinsic responses of non-centrosymmetric crystals. Our work establishes a rigorous foundation for strain gradient engineering of light-matter interactions, opening new avenues for nanoscale optomechanics, optoelectronics, and beyond.", "url": "https://arxiv.org/abs/2610.32341", "type": "理论+数值", "summary": "1. 该工作建立了第一性原理框架，用于系统计算真实材料中由应变梯度激活的多种挠曲光响应。\n2. 其核心是将应变梯度映射为长波声子并纳入电子-声子耦合，从而捕捉晶格形变对非线性光学响应的非局域量子效应，并在Si、立方SrTiO3和黑磷单层中预言10^5~10^6 m^-1应变梯度可产生与非中心对称晶体本征响应相当的挠曲二次谐波和挠曲体光伏效应。\n3. 这为应变梯度调控光-物质相互作用提供了严格基础，并启发纳米尺度光力学、光电子学及更广泛器件设计。", "summary_source": "deepseek", "authors": [{"name": "Zhichao Guo"}, {"name": "Hua Wang"}, {"name": "Haowei Xu"}], "featured_authors": [{"name": "Zhichao Guo"}, {"name": "Hua Wang"}, {"name": "Haowei Xu"}], "author_count": 3}, {"id": "2610.32378", "category": "cond-mat", "title": "Low-Temperature Hybrid Monte Carlo for Perylene and Corannulene: Stabilizing Determinant and Force", "abstract": "We demonstrate a real world physics study of the molecules perylene and corannulene at different doping levels, and calculating selected one-, two- (exciton) and three-body (trion) correlators. This has been done by performing Hubbard-model simulations near room temperature. We find, between charge neutral and doubly charged plateaus of perylene, an interaction-induced $\\Delta Q = 1$ plateau whose width grows with interaction strength and in which the ground state is a spin doublet rather than a singlet. The algorithmic advancement enabling this study simultaneously stabilizes the determinant and force calculations to machine precision at room temperature, while scaling as well as standard determinant Quantum Monte Carlo simulations of these systems. Furthermore, our formalism retains the full time-displaced (2-point) Green's function, allowing us to construct any $n$-body correlator, including those that contain disconnected diagrams.", "url": "https://arxiv.org/abs/2610.32378", "type": "理论+数值", "summary": "1. 该工作用低温混合蒙特卡罗在Hubbard模型中近室温模拟苝与蔻烯的不同掺杂态，计算选定的一体、二体（激子）和三体（三重子）关联函数，并在苝的中性与双荷电平台之间发现随相互作用增强而展宽的ΔQ=1平台，其基态为自旋双重态而非单重态。\n2. 其算法卖点是在近室温下将行列式与力计算同时稳定到机器精度，扩展性与标准行列式量子蒙特卡罗相当，并保留完整的时间位移两点格林函数，从而可构造任意n体关联函数（包括非连通图）。\n3. 这为有机分子体系的低温Hubbard模拟及包含非连通图的任意阶关联函数计算提供了可扩展路径，并提示掺杂平台宽度、相互作用强度与基态自旋多重度之间存在可检验的联系。", "summary_source": "deepseek", "authors": [{"name": "Petar Sinilkov"}, {"name": "Thomas Luu"}, {"name": "Johann Ostmeyer"}, {"name": "Finn L. Temmen"}, {"name": "Marcel Rodekamp"}], "featured_authors": [{"name": "Petar Sinilkov"}, {"name": "Thomas Luu"}, {"name": "Johann Ostmeyer"}, {"name": "Finn L. Temmen"}, {"name": "Marcel Rodekamp"}], "author_count": 5}, {"id": "2610.32405", "category": "cond-mat", "title": "Quantum Landau Lifshitz Gilbert equation in ferromagnetic conductors and magnetic insulators", "abstract": "Understanding the microscopic origin of magnetic damping is essential for describing magnetization dynamics in nanoscale magnetic systems. In this work, we develop a microscopic framework to derive Gilbert damping terms from specific interactions in ferromagnetic conductors and magnetic insulators. In ferromagnetic conductors, magnetic damping is dominated by the s d exchange interaction between the localized magnetic moments and the itinerant electrons, which is effectively equivalent to an electronmagnon interaction. From the spin diffusion equation and the spin transfer torque therein, we obtain the corresponding quantum LLG equation. In magnetic insulators, where free electrons are absent, spin phonon interactions become the primary source of the this http URL from an effective spin phonon interaction and using linear response theory, we derive a quantum LLG equation with a Gilbert damping tensor analytically. Our results demonstrate that different microscopic interactions lead to qualitatively different structures of magnetic damping. Instead of being described by a universal scalar parameter, Gilbert damping can exhibit spatial dependence and tensorial characteristics determined by the underlying microscopic interactions.", "url": "https://arxiv.org/abs/2610.32405", "type": "理论", "summary": "1. 该工作建立微观框架，分别从铁磁导体中的s-d交换（等效电子-磁振子相互作用）和磁性绝缘体中的自旋-声子相互作用出发，推导量子LLG方程及Gilbert阻尼项。\n2. 其核心在于由自旋扩散方程中的自旋转移矩处理导体阻尼，并用线性响应理论解析给出绝缘体的Gilbert阻尼张量，表明阻尼并非普适标量而可具空间依赖与张量结构。\n3. 这提示磁阻尼建模须纳入具体微观相互作用，并为纳米磁体系动力学及不同材料平台中的阻尼调控提供微观依据。", "summary_source": "deepseek", "authors": [{"name": "Ji Yang Zhu"}, {"name": "Zheng Chuan Wang"}], "featured_authors": [{"name": "Ji Yang Zhu"}, {"name": "Zheng Chuan Wang"}], "author_count": 2}, {"id": "2610.32532", "category": "cond-mat", "title": "Excitonic Stark Response Induced by Quantum Capacitance in van der Waals Heterostructures", "abstract": "Precise electrostatic control in van der Waals heterostructures is commonly described by a geometric capacitor model, which assumes that the internal electric field is fully determined by external gate voltages. Here, we show that this description breaks down in the presence of interfacial charge transfer, where quantum capacitance modifies the internal electrostatics. Using interlayer excitons as local probes, we observe a dipole-dependent energy splitting that persists even when the gate-induced geometric field is nominally canceled. This splitting reflects incomplete cancellation between gate- and carrier-induced fields set by quantum capacitance, while many-body renormalization is largely symmetric with respect to the two opposite dipole orientations, allowing the splitting to provide a direct optical measure of the local chemical potential. Our results reveal the central role of quantum capacitance in interface electrostatics and provide a route to probe it in operando.", "url": "https://arxiv.org/abs/2610.32532", "type": "理论", "summary": "1. 该工作以层间激子为局域探针，系统测量范德华异质结中界面电荷转移引起的静电修正，并观察到偶极依赖的能量劈裂。\n2. 其核心在于该劈裂在栅极几何电场名义抵消时仍存在，反映量子电容导致的栅极场与载流子场不完全抵消，而多体重整化对相反偶极取向近似对称。\n3. 这使该劈裂成为局域化学势的直接光学量度，凸显量子电容在界面静电中的关键作用，并为在器件工作状态下原位探测界面静电提供可行路径。", "summary_source": "deepseek", "authors": [{"name": "Xiangzhi Hong"}, {"name": "Yongkang Jian"}, {"name": "Yang Chen"}, {"name": "Rukai Cang"}, {"name": "Yuanlong Guo"}, {"name": "Takashi Taniguchi"}, {"name": "Kenji Watanabe"}, {"name": "Baigeng Wang"}, {"name": "Erfu Liu"}], "featured_authors": [{"name": "Xiangzhi Hong"}, {"name": "Yongkang Jian"}, {"name": "Yang Chen"}, {"name": "Kenji Watanabe"}, {"name": "Baigeng Wang"}, {"name": "Erfu Liu"}], "author_count": 9}, {"id": "2610.32712", "category": "cond-mat", "title": "On the Spontaneous Structural Reconstructions of Chalcogen-Depleted MoS$_2$, MoSe$_2$, and Janus MoSSe Monolayers", "abstract": "Removing one chalcogen layer from a transition-metal dichalcogenide monolayer leaves an undercoordinated sheet that reconstructs as the remaining chalcogen atoms cross the metal plane. Here, we combine \\textit{ab initio} and reactive molecular dynamics (MD) simulations of depleted MoS$_2$, MoSe$_2$, and Janus MoSSe, examining each remaining chalcogen on two parent lattices, to show that the remaining chalcogen type determines the structural reconstruction, with only a minor influence from the parent lattice. In \\textit{ab initio} trajectories of the Janus-derived sheets, Se crosses the Mo plane already at 300~K, whereas S stays in place at 300~K and the sheet reconstructs only at 900~K. With a free in-plane cell, the crossings precede an anisotropic lattice contraction, which therefore results from the structural reconstruction. Reactive MD simulations of 50~nm sheets show that, when S remains, the Mo lattice stays crystalline in nanometric domains that disappear with time and temperature, with pores/holes at 900~K. In contrast, when Se remains, the Mo lattice loses crystalline order within the first picosecond, and 36--39\\% of the Se atoms cross at every temperature. In a depleted lateral MoS$_2$/MoSe$_2$ heterostructure, both modes coexist in one sheet, each half reconstructing like its single-chalcogen counterpart, suggesting chalcogen patterning as a route to define crystalline and disordered regions in a single monolayer.", "url": "https://arxiv.org/abs/2610.32712", "type": "数值", "summary": "1. 该工作结合第一性原理与反应分子动力学，模拟贫硫族MoS2、MoSe2和Janus MoSSe单层中剩余硫族原子跨越金属面的自发重构，并比较母晶格与横向异质结的影响。\n2. 其核心是剩余硫族种类而非母晶格主导重构：Se在300 K即穿越Mo面，各温度下36–39%的Se穿越，使Mo晶序在一皮秒内丧失；S在300 K保持原位、900 K才重构，其间暂存纳米晶畴并于高温形成孔洞，面内收缩由穿越触发。\n3. 硫族图案化因而可在单一单层内空间定义晶态与无序区，为贫硫族TMD的可控重构、孔洞形成及横向异质结构设计提供明确启发。", "summary_source": "deepseek", "authors": [{"name": "Bruno Ipaves"}, {"name": "Guilherme S. L. Fabris"}, {"name": "Raphael B. Oliveira"}, {"name": "Pulickel M. Ajayan"}, {"name": "Marcelo L. Pereira Junior"}, {"name": "Douglas S. Galvão"}], "featured_authors": [{"name": "Bruno Ipaves"}, {"name": "Guilherme S. L. Fabris"}, {"name": "Raphael B. Oliveira"}, {"name": "Pulickel M. Ajayan"}, {"name": "Marcelo L. Pereira Junior"}, {"name": "Douglas S. Galvão"}], "author_count": 6}, {"id": "2610.32713", "category": "cond-mat", "title": "Machine Learning Accelerated Simulation of Charge Regulation Effects", "abstract": "Many solvated materials, from nanoparticles to polyelectrolytes, acquire charge through the dissociation or association of surface groups, a phenomenon known as charge regulation (CR). Recent methods use hybrid charge regulation Monte Carlo (CR-MC)/molecular dynamics (MD) to evolve the system while dynamically adjusting charges on the surface groups. However, this approach is computationally expensive, as Monte Carlo sampling can be as costly as the accompanying MD. In this work, we introduce charge regulation machine learning (CR-ML), a graph attention network that predicts the ionization probability of every surface site from the instantaneous configuration, the dissociation constant of surface groups, and the solution conditions. We show that CR-ML reproduces the equilibrium conformations and degree of ionization obtained with CR-MC for a hydrophobic polyanion. We further test CR-ML on the more complex system of two nanoparticles mediated by a polyelectrolyte, where it accurately predicts the charge asymmetry that develops between the two particles. Across these systems, CR-ML updates charges an order of magnitude faster than CR-MC while accurately reproducing its equilibrium properties. This framework opens a path toward large-scale simulations of charge-regulating materials for understanding and designing their responsive behavior.", "url": "https://arxiv.org/abs/2610.32713", "type": "理论+数值", "summary": "1. 该工作提出电荷调控机器学习（CR-ML）框架，用图注意力网络由瞬时构型、表面基团解离常数和溶液条件预测各表面位点的电离概率，以替代混合CR-MC/MD中的蒙特卡罗电荷采样。\n2. 其卖点在于对疏水聚阴离子复现CR-MC的平衡构象与电离度，并在聚电解质介导的双纳米颗粒体系中准确预测电荷不对称性，同时将电荷更新速度提升约一个数量级。\n3. 这为电荷调控材料的大尺度模拟及理解与设计其响应行为提供了可行路径，但结论仍主要基于所测试体系，推广至更复杂界面需进一步验证。", "summary_source": "deepseek", "authors": [{"name": "Vijay Yadav"}, {"name": "Sunita Kumari"}, {"name": "Prabhat K. Jaiswal"}], "featured_authors": [{"name": "Vijay Yadav"}, {"name": "Sunita Kumari"}, {"name": "Prabhat K. Jaiswal"}], "author_count": 3}, {"id": "2610.32743", "category": "cond-mat", "title": "First- and Second-Order Electron Position Correlators Reveal Topological Phase Transitions", "abstract": "The theory of conventional critical phenomena is built around the concepts of fluctuations and correlators of local observables. Here, we show that topological phase transitions can also be characterized through spatial and temporal two-point correlation functions associated with fluctuations of the electronic position operator. The key object is the antisymmetric part of the position-position correlation function, which yields the Chern number in the equal-time and equal-space limit. When the system is translationally invariant in space or time (the latter case corresponding to an equilibrium condition), these two-point correlators reduce to one-variable functions of the remaining variable. Remarkably, these functions are both reminiscent of critical behaviour, including divergent correlation times and lengths signalling the phase transitions. Away from these conditions, namely in non-periodic systems or genuinely dynamical processes, criticality is instead better captured by higher-order Chern-Chern correlators constructed from local or dynamical markers obtained as coincident-point limits of the position correlators. These higher-order Chern-Chern correlators can be seen as double Levi-Civita contractions of second-order position correlators, selecting the antisymmetric sector in each index pair. We substantiate this framework through numerical simulations and analytic calculations. Our results establish a general correlator-based description of topological phase transitions, applicable to crystalline, noncrystalline, equilibrium, and dynamical systems.", "url": "https://arxiv.org/abs/2610.32743", "type": "理论+数值", "summary": "1. 该工作提出用一阶与二阶电子位置关联函数刻画拓扑相变，指出等时等空间极限下位置-位置关联函数的反对称部分给出陈数。\n2. 其卖点在于空间或时间平移不变（含平衡）时二阶位置关联约化为单变量函数并呈类似临界行为的发散关联长度或时间，非周期或真实动力学情形则用二阶位置关联的双列维-奇维塔收缩构造高阶陈-陈关联子来捕捉临界性。\n3. 数值与解析结果支持这一统一关联子框架适用于晶体、非晶体、平衡与动力学系统，并启示可从位置涨落关联而非仅局域序参量探测拓扑临界。", "summary_source": "deepseek", "authors": [{"name": "Antimo Marrazzo"}, {"name": "Christian Loer Llemit"}, {"name": "Massimo Capone"}], "featured_authors": [{"name": "Antimo Marrazzo"}, {"name": "Christian Loer Llemit"}, {"name": "Massimo Capone"}], "author_count": 3}, {"id": "2610.32763", "category": "cond-mat", "title": "Spontaneous Decay of High Energy Composite Fermions", "abstract": "An electron, when added to a fractional quantum Hall fluid, famously splits into fractionally charged composite-fermion quasiparticles. We show here that a high energy composite fermion carrying a fractional charge decays into a collection of particles, including quasiparticles, quasiholes, and even whole electrons.", "url": "https://arxiv.org/abs/2610.32763", "type": "理论", "summary": "1. 该工作研究了高能复合费米子在分数量子霍尔流体中的自发衰变过程，即携带分数电荷的高能复合费米子分裂为准粒子、准空穴乃至完整电子的多粒子末态。\n2. 其关键物理要点在于指出复合费米子并非稳定元激发，高能分数电荷激发可衰变为包含整电子在内的多粒子谱，从而刻画分数量子霍尔流体中高能激发的非平衡动力学。\n3. 该结果提示需重新审视分数量子霍尔体系中高能激发的稳定性与谱学图像，并为分数电荷输运、隧穿实验及高能激发的弛豫研究提供可检验的物理启示。", "summary_source": "deepseek", "authors": [{"name": "Mytraya Gattu"}, {"name": "J. K. Jain"}], "featured_authors": [{"name": "Mytraya Gattu"}, {"name": "J. K. Jain"}], "author_count": 2}, {"id": "2610.32788", "category": "cond-mat", "title": "Generalization properties of the token perceptron: the role of embedding and vocabulary", "abstract": "Large language models are trained to predict tokens from a finite vocabulary, each represented by a vector in a $d$-dimensional embedding space. Therefore, token prediction is a classification problem whose classes have a geometry determined by the embedding. We study how this geometry affects learning in a minimal solvable model: a linear predictor that maps a sequence of $N$ embedded tokens to a $d$-dimensional output through one $d\\times d$ matrix per position, trained in the teacher--student setting. We call this the \\textit{token perceptron}. We compute its generalization error with the replica method, taking $N\\to\\infty$ at fixed number of examples per position $\\alpha=P/N$ and keeping $d$ and the vocabulary size $D$ finite. As a first reference case, we consider continuous embeddings on the sphere, which isolate the role of the embedding dimension. The natural load is then $\\alpha/d$, and for $d>1$ a normalized label fixes the direction of the teacher output, so the problem becomes a noiseless regression: the teacher is recovered exactly above $\\alpha_{\\rm rec}=d^2/(d-1)$, and spherical cross-entropy reaches this threshold at large inverse temperature. In the same setting the storage capacity of random associations scales as $d^2$ for margins $O(1/\\sqrt{d})$. We then turn to vocabulary embeddings, where a label only identifies the Voronoi cell of the teacher output, so that each example imposes inequalities rather than equations, as in the classical perceptron. We compute the Bayes-optimal error for a given embedding matrix through an approximate spectral closure and show that the optimal learner first resolves the directions in which the vocabulary has the largest variance, even when the teacher is isotropic.", "url": "https://arxiv.org/abs/2610.32788", "type": "理论", "summary": "1. 该工作构建“词元感知机”最小可解模型，在线性逐位置映射和教师—学生框架下，用复本方法在 N→∞、α=P/N 固定且 d 与词表规模 D 有限时计算词元预测的泛化误差。\n2. 关键卖点是区分两类嵌入几何：连续球面嵌入化为无噪声回归，教师输出在 α_rec=d^2/(d-1) 以上可精确恢复；词表嵌入使标签仅确定教师输出的沃罗诺伊胞，形成不等式约束，并用近似谱闭包求得给定嵌入矩阵的贝叶斯最优误差。\n3. 该框架为评估嵌入维度、词表几何与各向异性如何支配词元预测的样本复杂度和可学习性提供了可解析基准。", "summary_source": "deepseek", "authors": [{"name": "Dario Bocchi"}, {"name": "Matteo Negri"}, {"name": "Flavio Nicoletti"}, {"name": "Francesco D'Amico"}], "featured_authors": [{"name": "Dario Bocchi"}, {"name": "Matteo Negri"}, {"name": "Flavio Nicoletti"}, {"name": "Francesco D'Amico"}], "author_count": 4}, {"id": "2610.32847", "category": "cond-mat", "title": "Magnons and excitons from Bethe-Salpeter equation and its application to graphene-based magnets", "abstract": "With the recent isolation of two-dimensional semiconducting magnetic materials, the theoretical study of spin-flip collective excitations (magnons) along with spin-conserving electron-hole bound pairs (excitons) has become particularly relevant. Describing both types of quasiparticles within the same theoretical framework is possible, in principle, but the well-established many-body formalism for the calculation of excitons, based on the intertwined Bethe-Salpeter and Hedin's equations, is not satisfactory for magnons, since the usual approximations produce a spurious gapped Goldstone mode. Here, we show that excitons and magnons can be computed on the same footing under the same Bethe-Salpeter formalism, while respecting the gapless Goldstone mode for magnons. We demonstrate how this can be achieved through the evaluation of the full Bethe-Salpeter equation, beyond the Tamm-Dancoff approximation in model Hamiltonians. As an example, we apply it to ferromagnetic and antiferromagnetic graphene, faithfully represented by the extended Hubbard model. Our results clarify the roles of on-site and non-local interactions in exciton and magnon appearance and identify consistency requirements relevant to extending the approach to first-principles calculations.", "url": "https://arxiv.org/abs/2610.32847", "type": "理论+数值", "summary": "1. 该工作在同一Bethe-Salpeter方程框架下统一计算激子与磁振子，并在模型哈密顿量中通过超越Tamm-Dancoff近似的完整BSE求解，将其应用于扩展Hubbard模型描述的铁磁与反铁磁石墨烯。\n2. 其关键点在于同时保持磁振子的无能隙Goldstone模式、避免常规近似引入的虚假能隙，并据此厘清格点内与非局域相互作用对激子和磁振子出现的不同作用。\n3. 该结果给出了将同一多体形式推广到第一性原理计算的相容性要求，为二维磁性半导体中自旋翻转与自旋守恒元激发的统一描述提供了可检验的理论启示。", "summary_source": "deepseek", "authors": [{"name": "Simran Chourasia"}, {"name": "Maurício F. C. Martins Quintela"}, {"name": "J. J. Palacios"}], "featured_authors": [{"name": "Simran Chourasia"}, {"name": "Maurício F. C. Martins Quintela"}, {"name": "J. J. Palacios"}], "author_count": 3}, {"id": "2610.32918", "category": "cond-mat", "title": "CO2-Induced Shifts in the Confined Phase Transformation of CH4 in Metal-Organic Frameworks", "abstract": "A sharp increase in gas uptake over a narrow pressure range can occur for fluids confined in nanoporous materials such as metal-organic frameworks (MOFs), reflecting a transformation between distinct adsorption states, often accompanied by the existence of metastable states. Understanding how co-adsorbed species modify this behavior is important for predicting and optimizing gas storage and separation. Here, we investigate the effect of CO2 on the adsorption transformation of confined CH4 in rigid IRMOF-1 and IRMOF-8. Transition-Matrix Monte Carlo (TMMC) simulations were performed for systems containing 0-75 and 0-150 CO2 molecules in IRMOF-1 and IRMOF-8, respectively. While the addition of CO2 decreases the maximum CH4 uptake, consistent with competition for pore space, remarkably, the presence of CO2 significantly shifts the discontinuity in the CH4 adsorption isotherm to substantially lower pressures relative to the pure CH4 system. This promotion of the high-density CH4 phase at lower pressures demonstrates that CO2 substantially alters the thermodynamic landscape governing confined CH4 through changes in both fluid-fluid and fluid-framework interactions. These results establish CO2 as a thermodynamic modifier of confined CH4 behavior and suggest that controlled co-adsorption provides a means of tuning adsorption transformations in nanoporous materials.", "url": "https://arxiv.org/abs/2610.32918", "type": "理论+数值", "summary": "1. 该工作用过渡矩阵蒙特卡洛模拟研究了CO2共吸附对刚性IRMOF-1和IRMOF-8中受限CH4吸附态转变的影响，CO2负载分别覆盖0–75和0–150个分子。\n2. 其核心结果是CO2虽因竞争孔容降低CH4最大吸附量，却显著把CH4吸附等温线的不连续点移至更低压力，从而在低压下促进高密度CH4相，表明CO2通过改变流体–流体和流体–骨架相互作用重塑热力学景观。\n3. 这确立CO2作为受限CH4行为的热力学调控剂，并启示可通过受控共吸附调控纳米多孔材料中的吸附转变。", "summary_source": "deepseek", "authors": [{"name": "Anthony Dorhauer"}, {"name": "Bartosz Mazur"}, {"name": "Bogdan Kuchta"}, {"name": "Carlos Wexler"}], "featured_authors": [{"name": "Anthony Dorhauer"}, {"name": "Bartosz Mazur"}, {"name": "Bogdan Kuchta"}, {"name": "Carlos Wexler"}], "author_count": 4}, {"id": "2610.32929", "category": "cond-mat", "title": "Extended Hydrodynamics of Planar Heisenberg Ferromagnetic Systems", "abstract": "Access to hydro and quasi-hydro regimes in magnetic systems is steadily increasing with the advances in fabrication of clean materials, and motivates study of hydrodynamics beyond conventional regimes and probe non-equilibrium transport. We employ the framework of extended irreversible thermodynamics which includes dynamical dissipative currents as quasi-hydro variables, and effect the modified hydrodynamic equations suitable to describe planar Heisenberg ferromagnetic systems in both paramagnetic and ferromagnetic phases. We show that the new transport coefficients and relaxation time scales introduced by quasi-hydro variables can engineer diverse combination of dispersion relations and provide control over the nature of hydrodynamic modes. For instance, we can change the diffusive energy mode into propagating one in multiple ways, including by tuning the relaxation time of magnetization current.", "url": "https://arxiv.org/abs/2610.32929", "type": "理论", "summary": "1. 该工作基于扩展不可逆热力学，将耗散流作为准流体力学变量，构建了适用于顺磁与铁磁相的平面海森堡铁磁系统修正流体力学方程。\n2. 其核心在于新引入的输运系数与弛豫时间可重构色散关系并调控流体力学模式性质，例如通过调节磁化电流弛豫时间将扩散型能量模式变为传播型。\n3. 这为在洁净磁性材料中探测非平衡输运及超越常规区域的准流体力学行为提供了可操作的理论框架与实验启发。", "summary_source": "deepseek", "authors": [{"name": "Dwigbijoy Paul"}, {"name": "Sreedhar B. Dutta"}], "featured_authors": [{"name": "Dwigbijoy Paul"}, {"name": "Sreedhar B. Dutta"}], "author_count": 2}, {"id": "2610.32944", "category": "cond-mat", "title": "Robustness of Skyrmion-Mediated Magnetization Switching in Perpendicular Magnetic Tunnel Junctions (p-MTJs) to Material Disorder and Elevated Temperature", "abstract": "Transient-skyrmion mediated voltage-controlled magnetic anisotropy (VCMA) switching is a fast and energy efficient way to magnetization reversal, but its reliability under realistic material disorder and thermal fluctuations remain unclear. In this work, we use stochastic micromagnetic simulations of a 100 nm perpendicular magnetic tunnel junction to study switching reliability under grain-scale variations in Dzyaloshinskii-Moriya interaction, perpendicular magnetic anisotropy, easy-axis orientation, and intergrain exchange coupling. We find that switching remains robust under moderate disorder, with 100% switching observed in 10^4 stochastic simulations after pulse width optimization at both 300 K and 350 K. Increasing the temperature from 300 to 350 K shifts the optimum VCMA pulse width from ~475 to ~450 ps, indicating that an apparent reduction in switching probability at a fixed pulse duration can be primarily due to pulse detuning. In contrast, strong easy-axis disorder reduces the maximum switching probability even after pulse-width optimization, indicating degradation of the switching dynamics. We further show that, under strong easy-axis disorder a transient skyrmion still forms while the subsequent post-pulse dynamics fails to complete the magnetization reversal. Our study therefore establishes the distinction between recoverable reliability due to timing shifts and permanent disorder-induced degradation that simply cannot be recovered by pulse re-tuning. Finally, for no disorders but at room temperature, 100% switching is observed with 10^6 stochastic simulations with correct pulse shaping.", "url": "https://arxiv.org/abs/2610.32944", "type": "数值", "summary": "1. 该工作采用随机微磁学模拟，在100 nm垂直磁隧道结中引入DMI、垂直各向异性、易轴取向与晶粒间交换耦合的晶粒尺度涨落，系统考察瞬态斯格明子辅助VCMA翻转在300 K与350 K下的可靠性。\n2. 其核心结论是：中等无序下经脉宽优化后10^4次随机模拟均实现100%翻转，且升温仅使最佳脉宽由约475 ps移至约450 ps，故固定脉宽下的概率下降主要源于脉冲失谐而非动力学退化。\n3. 该研究区分了可由脉宽重调补偿的时序型可靠性与强易轴无序导致的不可逆退化（斯格明子仍成核但脉冲后动力学无法完成反转），为器件容差评估与脉冲整形设计提供了明确判据。", "summary_source": "deepseek", "authors": [{"name": "Prosenjit Das"}, {"name": "Md Mahadi Rajib"}, {"name": "Jayasimha Atulasimha"}], "featured_authors": [{"name": "Prosenjit Das"}, {"name": "Md Mahadi Rajib"}, {"name": "Jayasimha Atulasimha"}], "author_count": 3}, {"id": "2610.31674", "category": "hep-th", "title": "M5-brane source charges, Chern--Connes pairings and noncommutative compactifications", "abstract": "We formulate a source-adapted Chern--Connes description of M5-brane magnetic charge in physically motivated noncommutative and quotient linking sectors. The starting point is the local codimension-five geometry of an M5-brane source: the magnetic charge is measured on a four-dimensional link. In the smooth local model the link is the ordinary four-sphere, and the pairing reduces to the standard flux integral of the M-theory four-form field strength. The construction is motivated by the published even-codimensional Noncommutative Foliation Invariant (NCFI for short), where Connes' transverse fundamental cyclic cocycle is paired with an even transverse-geometric \\(K\\)-class. For an M5-brane the relevant codimension is odd, so the required odd \\(K\\)-class is supplied instead by the boundary map of the source/linking extension. Noncommutative or groupoid algebras are used only when they arise from physical mechanisms: Matrix/M-theory compactification on noncommutative tori, reduction to D-branes in background \\(B\\)-fields, large \\(C\\)-field M5 limits, or quotient/orbifold source links. The result is a topological charge formula, not a derivation of the full M5-brane dynamics or of the complete M-theory action.", "url": "https://arxiv.org/abs/2610.31674", "type": "理论", "summary": "1. 该文构建了源适配的Chern–Connes框架，用于在非交换与商链接扇区中刻画M5膜磁荷，并给出拓扑荷公式。\n2. 其技术要点是从M5源的五余维局部几何出发，将光滑极限下四维链接上的配对约化为M理论四形式场强的标准通量积分，并用源/链接扩张的边界映射提供奇数K类以匹配M5的奇数余维。\n3. 该框架把非交换环面紧化、背景B场下的D膜约化、大C场M5极限及轨道流形源链接产生的代数纳入磁荷描述，但仅提供拓扑荷而非完整M5动力学或M理论作用量。", "summary_source": "deepseek", "authors": [{"name": "Ioannis P. Zois"}], "featured_authors": [{"name": "Ioannis P. Zois"}], "author_count": 1}, {"id": "2610.31680", "category": "hep-th", "title": "Local Thermodynamics and Rényi Bounds on Black Hole Mergers", "abstract": "Rényi entropy inequalities have been proposed to strengthen the area-theorem bound on mergers of thermodynamically stable black holes in Anti de Sitter (AdS) space. The stronger bounds depend on the joint initial state, whereas masses and temperatures fix only its local thermal marginals. We quantify this distinction inside the canonical two-hole description. Correlations confined to rare energy fluctuations can leave both thermal states exactly intact and drive the trace distance and mutual information to zero, yet still change the joint Rényi entropy at leading semiclassical order. We determine the smallest entropy compatible with a controlled approach to statistical independence, uniformly over all positive Rényi orders up to one. For equal Schwarzschild--AdS$_4$ holes, the resulting optimized canonical mass constraint reduces to the area bound at leading semiclassical order. The reduction concerns only the information needed to infer a bound; it does not produce a lighter attainable remnant or a dynamical instability. Stronger merger constraints therefore require control of the initial correlations beyond single black hole thermodynamics.", "url": "https://arxiv.org/abs/2610.31680", "type": "理论", "summary": "1. 该工作在正则双黑洞描述中量化了Rényi熵合并约束所依赖的联合初态信息与仅由质量、温度确定的局域热边缘之间的区别。\n2. 其技术要点在于证明局限于稀有能量涨落的关联可保持两个热态不变并使迹距离与互信息趋零，却仍在半经典领头阶改变联合Rényi熵，并给出在直至1的所有正Rényi阶上一致可控趋近统计独立时的最小熵。\n3. 对等质量Schwarzschild-AdS4黑洞，优化后的正则质量约束在半经典领头阶还原为面积界，但这只涉及推断约束所需的信息，并不给出更轻的可达遗迹或动力学不稳定性，更强合并限制仍需控制单黑洞热力学之外的初态关联。", "summary_source": "deepseek", "authors": [{"name": "Sudhanva Joshi"}, {"name": "Sunil Kumar Mishra"}], "featured_authors": [{"name": "Sudhanva Joshi"}, {"name": "Sunil Kumar Mishra"}], "author_count": 2}, {"id": "2610.31699", "category": "hep-th", "title": "Kasner Exponents from the Bouncing Singularity", "abstract": "The black hole singularity can be probed by the thermal boundary two-point correlator. When there is a bouncing geodesic, the boundary correlator reveals the singular behavior $G(t, \\vec{x}=0) \\propto (t-t_c)^{-2\\Delta+b_t}$ at large $N$. We show that the additional power $b_t$ is determined by the Kasner exponents near the singularity: for planar black branes in AdS$_{d+1}$, we derive the formula $b_t=(d-1) \\max \\left(\\frac{p_i-p_t}{1-p_t} , \\frac12 \\right)$, where $p_t$ and $p_i$ are the exponents of the time and spatial directions. We compare our formula with the numerical values of Čeplak and Valach. It reproduces their relation for black branes with $g_{tt}g_{rr}=-1$. For $g_{tt}g_{rr}\\neq-1$, where no formula had been found, our formula agrees with most of their data and fits them much better than their relation. We also give predictions for $b_t$ in theories where the Kasner exponents are known, but $b_t$ has not been computed.", "url": "https://arxiv.org/abs/2610.31699", "type": "理论", "summary": "1. 该工作利用热边界两点关联函数在反弹测地线情形下的大\\(N\\)奇异行为，推导了附加幂次\\(b_t\\)与黑洞奇点附近Kasner指数之间的关系。\n2. 对AdS\\(_{d+1}\\)中的平面黑膜，作者给出\\(b_t=(d-1)\\max((p_i-p_t)/(1-p_t),1/2)\\)，并对照Čeplak-Valach数值：在\\(g_{tt}g_{rr}=-1\\)时复现其关系，在\\(g_{tt}g_{rr}\\neq-1\\)时与多数数据相符且拟合更优。\n3. 该公式为Kasner指数已知而\\(b_t\\)未算的理论提供预测，并表明边界关联函数可作为诊断反弹奇点附近时空各向异性的定量探针。", "summary_source": "deepseek", "authors": [{"name": "Hyunwoo Oh"}], "featured_authors": [{"name": "Hyunwoo Oh"}], "author_count": 1}, {"id": "2610.31700", "category": "hep-th", "title": "Matrix scattering and the black hole interior", "abstract": "Complex-time singularities of thermal correlators carry imprints of black hole interiors. We investigate their microscopic origin in matrix quantum mechanics at high temperature, where the dynamics becomes semi-classical. We introduce a complex-time scattering kernel that encodes these singularities and makes their finite-$N$ resolution accessible to numerics. Studying both integrable and chaotic models, we find evidence for a smoothing scale $\\Delta t\\sim N^{-1/2}$, suggesting that the resolution is due to quantum fluctuations of D-branes. This scattering picture provides a starting point for probing the black hole interior beyond a classical geometric description.", "url": "https://arxiv.org/abs/2610.31700", "type": "理论", "summary": "1. 该文在高温情形的矩阵量子力学中研究热关联函数复时间奇点的微观起源，并引入复时间散射核以在有限\\(N\\)下数值刻画这些奇点。\n2. 其核心在于在可积与混沌模型中给出奇点被\\(\\Delta t\\sim N^{-1/2}\\)尺度平滑的证据，并将其归因于D膜的量子涨落。\n3. 这一散射图像为超越经典几何描述、进一步探测黑洞内部提供了起点。", "summary_source": "deepseek", "authors": [{"name": "Matthew Dodelson"}, {"name": "Henry W. Lin"}, {"name": "Haitian Xie"}, {"name": "Jessica Yeh"}], "featured_authors": [{"name": "Matthew Dodelson"}, {"name": "Henry W. Lin"}, {"name": "Haitian Xie"}, {"name": "Jessica Yeh"}], "author_count": 4}, {"id": "2610.31737", "category": "hep-th", "title": "Intertwining Defects and Fermion-Boundary Scattering from TQFT", "abstract": "We construct conformal boundary conditions of free Dirac fermions that preserve chiral, anomaly-free symmetries, and determine the associated fermion-boundary scattering, using the TQFT/CFT framework. We apply the construction to several previously unresolved examples: higher-charge monopoles in non-chiral QED, a family of $SU(N)\\times SU(N+2)$-symmetric models, the chiral QED with charges $\\{1^5,3,(-2)^4\\}$, and the charge-three monopole of the Standard Model. In these examples, out-going states are created by defect operators at the end of non-invertible topological lines; when such a line is non-simple, the out-going state splits into superselection sectors, and we give a formula for the branching ratios in terms of TQFT data. We also propose a general construction that adds and then gaps neutral spectators, under a technical assumption, which is potentially applicable to the 1-5-7-8-9 model.", "url": "https://arxiv.org/abs/2610.31737", "type": "理论", "summary": "1. 该工作用TQFT/CFT框架构造保持手征、无反常对称性的自由狄拉克费米子共形边界条件，并确定相应的费米子—边界散射。\n2. 其核心在于出射态由非可逆拓扑线末端的缺陷算符产生，非单拓扑线导致超选择扇区劈裂，并给出以TQFT数据表达的分支比公式。\n3. 该构造可处理非手征QED高荷单极子、SU(N)×SU(N+2)模型、特定手征QED及标准模型三荷单极子等未解例，并在技术假设下通过添加再能隙中性旁观者指向1-5-7-8-9模型。", "summary_source": "deepseek", "authors": [{"name": "Kantaro Ohmori"}, {"name": "Masataka Watanabe"}, {"name": "Pengcheng Wei"}, {"name": "Yunqin Zheng"}], "featured_authors": [{"name": "Kantaro Ohmori"}, {"name": "Masataka Watanabe"}, {"name": "Pengcheng Wei"}, {"name": "Yunqin Zheng"}], "author_count": 4}, {"id": "2610.31748", "category": "hep-th", "title": "Multicriticality in the Generalized Schwinger Model", "abstract": "We consider the generalized Schwinger model. This theory is obtained by coupling the field strength to an auxiliary scalar field $B$ and allowing generic potentials $V(B)$. We study the properties and phases of the model, focusing on the case where the potential is quartic. We investigate the model using both semiclassical and numerical methods, and find a rich phase diagram in the space of couplings. A region with unbroken charge conjugation is separated from one where the symmetry is spontaneously broken by lines of first- and second-order phase transitions. At the special point where these two lines meet, we find a fixed point in the tricritical Ising universality class. We also observe infinitely many lines of first order phase transitions ending at points of the Ising universality class.", "url": "https://arxiv.org/abs/2610.31748", "type": "理论", "summary": "1. 该工作通过将场强耦合到辅助标量场B并允许一般势V(B)，构造广义Schwinger模型，重点研究四次势情形，结合半经典与数值方法给出耦合空间中的丰富相图。\n2. 其核心在于识别出电荷共轭未破缺区与自发破缺区由一阶和二阶相变线分隔，并在两线交汇处发现属于三临界Ising普适类的固定点，同时观察到无穷多条终止于Ising普适类点的一阶相变线。\n3. 这表明广义Schwinger模型可作为研究多临界现象与普适类交叉的受控平台，并为后续解析、数值及量子模拟探索提供明确方向。", "summary_source": "deepseek", "authors": [{"name": "Federico Ambrosino"}, {"name": "Bernardo Zan"}], "featured_authors": [{"name": "Federico Ambrosino"}, {"name": "Bernardo Zan"}], "author_count": 2}, {"id": "2610.31749", "category": "hep-th", "title": "Gauge It or Break It: Lectures on Global Symmetries and the Cobordism Conjecture", "abstract": "These lecture notes introduce the No Global Symmetries Conjecture in the context of the Swampland Program, with particular emphasis on the Cobordism Conjecture. We begin with a review of ordinary and higher-form symmetries, their realization by extended operators, and mechanisms for gauging or breaking them. We then discuss the no global symmetries principle, including evidence from black hole physics, string perturbation theory, and AdS/CFT, and its relation to other Swampland constraints. A central theme is the reformulation of symmetry constraints in topological terms: we introduce bordism groups, with special focus on spin bordism, and explain how they provide a natural framework for organizing would-be global symmetries in gravitational theories. With this at hand, we discuss the Cobordism Conjecture, which proposes that nontrivial bordism classes are eliminated by dynamical processes in quantum gravity. We conclude with examples and a discussion of dynamical aspects involving defects, boundaries, and related open questions. These notes are based on lectures delivered by Matilda Delgado at the 21st Modave Summer School on Mathematical Physics. A similar series of lectures was also presented at the KMPB School on D-branes in Physics and Mathematics.", "url": "https://arxiv.org/abs/2610.31749", "type": "理论", "summary": "1. 该讲义在Swampland纲领框架下系统介绍无全局对称性猜想，重点阐述配边猜想，并回顾普通与高形式对称性、扩展算符实现及规范或破缺机制，同时梳理黑洞物理、弦微扰论与AdS/CFT等证据及其与其他Swampland约束的关系。\n2. 其核心卖点是用拓扑配边群尤其是spin bordism重新表述对称性约束，为组织引力理论中候选全局对称性提供自然框架，并论证非平凡配边类可由量子引力动力学过程消除。\n3. 这为从缺陷、边界与动力学角度理解量子引力中的对称性限制和Swampland条件提供了统一拓扑视角，并提示了后续开放问题。", "summary_source": "deepseek", "authors": [{"name": "Matilda Delgado"}, {"name": "Corinne Englert"}, {"name": "Guillermo Mera Álvarez"}, {"name": "Eduardo Velasco-Aja"}], "featured_authors": [{"name": "Matilda Delgado"}, {"name": "Corinne Englert"}, {"name": "Guillermo Mera Álvarez"}, {"name": "Eduardo Velasco-Aja"}], "author_count": 4}, {"id": "2610.31750", "category": "hep-th", "title": "Six and seven dimensional extrema of Non-SUSY heterotic theory with non-maximal enhancements", "abstract": "We propose a construction of non-supersymmetric heterotic theories on $T^n$ for $n=1,2,3,4$ that lead to extrema of the one-loop effective potential. In contrast to other approaches, we do not impose maximal gauge enhancement, instead relying on Weyl symmetries of the right-moving part of the momentum lattice to ensure that we get an extremum. The classification depends on finding all lattices within a given genus using Kneser's method. We find several thousand extrema, most of which have non-maximal rank gauge enhancements. Several hundred of our extrema are tachyon-free, and several dozen are also not knife edges. There may be further equivalences among these points, but we find at least 2, 11, and 38 distinct tachyon-free non-knife-edge points for $T^2$, $T^3$, and $T^4$, respectively. In addition, we build on our previous work to study the perturbative stability of $AdS_{3}\\times S^{3}\\times T^{4}$ backgrounds by calculating the Hessian at the extrema in the $T^4$ moduli space. The lowest eigenvalues of the Hessian at all of these $ADE$ points show violations of the BF bound and satisfy the refined deSitter conjecture.", "url": "https://arxiv.org/abs/2610.31750", "type": "理论", "summary": "1. 该工作在 \\(T^n\\)（\\(n=1\\)–4）上构造非超对称杂化弦理论，并借助右行动量格的Weyl对称性而非最大规范增强来寻找单圈有效势极值。\n2. 其技术核心是用Kneser方法系统分类给定亏格内的格，得到数千个极值，其中数百个无快子、数十个非刀锋点，并在 \\(T^2\\)、\\(T^3\\)、\\(T^4\\) 上分别识别出至少2、11、38个不同的无快子非刀锋点。\n3. 对 \\(AdS_3\\times S^3\\times T^4\\) 背景在 \\(T^4\\) 模空间极值处计算Hessian表明，ADE点最低本征值违反BF界并满足精炼de Sitter猜想，为相关非超对称真空的微扰稳定性提供了可检验约束。", "summary_source": "deepseek", "authors": [{"name": "Stevell Muller"}, {"name": "Daniel Robbins"}, {"name": "Hassaan Saleem"}], "featured_authors": [{"name": "Stevell Muller"}, {"name": "Daniel Robbins"}, {"name": "Hassaan Saleem"}], "author_count": 3}, {"id": "2610.31752", "category": "hep-th", "title": "Universal and nonuniversal pole-skipping points", "abstract": "We study the pole-skipping phenomenon for a holographic superfluid/superconductor near the critical point using dual analytic Green's functions ( arXiv:2605.20415 [hep-th]). (1) There is a hydrodynamic pole-skipping point that is common to all Green's functions: this point was obtained from the near-horizon analysis previously. (2) In addition, if one examines each Green's functions, the Green's functions have additional pole-skipping points. Unlike the conventional pole-skipping points, they do not satisfy the universality, i.e., they are not located at $\\omega=-(2\\pi T)ni$, where $n$ is an integer. (3) We also point out that a pole-skipping does not necessary implies an ambiguity of a Green's function.", "url": "https://arxiv.org/abs/2610.31752", "type": "理论", "summary": "1. 该文以全息超流/超导体临界点附近的对偶解析格林函数为工具，系统研究了极点跳跃现象，并区分了普适与非普适极点跳跃点。\n2. 其核心发现是：除由近视界分析得到、为所有格林函数共有的流体力学极点跳跃点外，每个格林函数还含有额外的极点跳跃点，但这些点不满足ω=-(2πT)ni（n为整数）的普适定位。\n3. 作者进一步指出极点跳跃并不必然导致格林函数歧义，这提醒后续研究在解释全息响应函数中的此类结构时需更谨慎地判定其物理含义。", "summary_source": "deepseek", "authors": [{"name": "Makoto Natsuume"}], "featured_authors": [{"name": "Makoto Natsuume"}], "author_count": 1}, {"id": "2610.31759", "category": "hep-th", "title": "Discontinuity at the Pole", "abstract": "The exchange of a particle whose mass is taken to zero need not reproduce the exchange of a particle that is strictly massless from the outset. We derive a general on-shell diagnostic of the well-known discontinuity between the exchange of a massless particle and the massless limit of a massive-particle exchange, valid for a mediator of arbitrary integer spin S. Our main observation is that this discontinuity can be identified directly at the level of the pole residue. We find that, in four dimensions, the residue is governed by a Chebyshev polynomial in the massless case and by a Legendre polynomial in the massless limit of the massive case. For S = 2, this reproduces the van Dam-Veltman-Zakharov discontinuity. For general S, it provides a simple and compact higher-spin analogue from on-shell factorisation. The discontinuity is probed, in principle, by the leading post-Newtonian correction to the non-relativistic potential between two massive scalar bodies.", "url": "https://arxiv.org/abs/2610.31759", "type": "理论", "summary": "1. 该工作针对无质量粒子交换与有质量粒子交换在质量趋零时的极限不连续，构建了适用于任意整数自旋媒介子的通用在壳判据。\n2. 核心卖点是把不连续性直接定位到极点留数：四维无质量情形由切比雪夫多项式支配，而有质量情形的零质量极限对应勒让德多项式，S=2时重现vDVZ不连续，并借在壳因子化给出任意S的紧凑高自旋类比。\n3. 该
