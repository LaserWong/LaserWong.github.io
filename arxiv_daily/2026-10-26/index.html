th a velocity consistent with the maximum quasiparticle velocity. In contrast, because EA is a subsystem-integrated quantity, its spatial structure is not directly resolved. We therefore introduce the asymmetry contour, a contour-like finite-difference quantity that provides a spatially resolved characterization of the symmetry-breaking information encoded in the reduced density matrix. The resulting contour is complementary to the local magnetization, retaining sensitivity to nonlocal many-body correlations while its dynamics also reflects the underlying quasiparticle propagation. These results show how EA and its contour can provide complementary information-theoretic characterizations of symmetry breaking and its spatial structure.", "url": "https://arxiv.org/abs/2610.32733", "type": "理论+数值", "summary": "1. 该工作系统研究了横场Ising模型中对称性破缺边界磁场对基态磁化与Rényi-2纠缠不对称性的影响，并分析边界淬火动力学。\n2. 其核心在于给出纠缠不对称性的上下界，并引入“不对称性等值线”这一有限差分量，将约化密度矩阵中的对称破缺信息空间分辨化，同时保留对非局域多体关联的敏感性。\n3. 结果表明该等值线与局域磁化互补，其动力学反映准粒子传播，为以信息论方式刻画边界对称破缺及其空间结构提供了可操作框架。", "summary_source": "deepseek", "authors": [{"name": "Takahiro Orito"}, {"name": "Daisuke Yamamoto"}], "featured_authors": [{"name": "Takahiro Orito"}, {"name": "Daisuke Yamamoto"}], "author_count": 2}, {"id": "2610.32783", "category": "quant-ph", "title": "Bounding single-copy information causality violations", "abstract": "Information causality is a physical principle that constrains bipartite post-quantum nonlocal correlations from information-theoretic assumptions. A direct characterization of the correlations satisfying it, however, remains difficult because the defining entropic condition must hold for all admissible protocols in the corresponding task. Here, we formulate the single-copy information causality problem as an optimization over all protocol parameters and simplify it by proving a deterministic reduction. We then show that generic adaptive multi-copy protocols can be represented as single-copy protocols applied to an effective behavior obtained by local wirings. As a consequence, for families of correlations closed under wirings, excluding single-copy violations suffices to exclude all finite-copy adaptive-protocol violations. We formulate the resulting membership and set-inclusion problems as optimization problems and discuss possible semidefinite programming relaxations. As an application, we study expansions of the information causality functional around zero-capacity channels, generalizing a method recently employed by Gachechiladze and Miklin to derive the Tsirelson--Landau--Masanes boundary from information causality. For expansions centered on channels whose output distribution has full support, imposing the second-order constraints for all single-copy protocols characterizes exactly the set of macroscopic locality in the CHSH scenario. Expanding instead around appropriate constant-output channels with perturbations that change the channel support, we show that every single-copy IC violation can be witnessed already at first order with a channel of arbitrarily small capacity.", "url": "https://arxiv.org/abs/2610.32783", "type": "理论+数值", "summary": "1. 该文把单拷贝信息因果性违反写成对协议参数的优化，证明确定性归约，并将一般自适应多拷贝协议表示为经局域布线得到的有效关联上的单拷贝协议。\n2. 其卖点在于对布线封闭关联族，排除单拷贝违反即可排除所有有限拷贝自适应协议违反；围绕全支撑输出通道展开时，所有单拷贝协议的二阶约束精确刻画CHSH场景的宏观局域性，而改变支撑的微扰可在任意小容量下一阶见证单拷贝违反。\n3. 这为信息因果性的成员与集合包含问题提供了可计算的优化及半正定规划松弛路径，并启示用通道容量展开连接后量子关联边界与信息论原理。", "summary_source": "deepseek", "authors": [{"name": "Marco Pompili"}, {"name": "Costantino Budroni"}], "featured_authors": [{"name": "Marco Pompili"}, {"name": "Costantino Budroni"}], "author_count": 2}, {"id": "2610.32812", "category": "quant-ph", "title": "Exploiting the Weyl-Chamber Structure for Hardware-Aware Quantum Circuit Compression", "abstract": "Quantum circuit compression based on tensor networks enables long-time simulation of quantum many-body dynamics on near-term hardware. While Riemannian optimization has been successfully employed for this purpose, it typically optimizes over the manifold of generic two-qubit unitaries. Consequently, the resulting gates must still be synthesized into the hardware's native gate set via KAK decomposition, an overhead that partially negates the original compression gain. We show that Riemannian-optimized gates already exhibit a predictable Weyl structure: near-$R_{ZZ}$ for the Ising model and near-fSim for the Heisenberg XXZ model. Building on this insight, we investigate whether parameterized optimization directly over the native gate set can offer a beneficial trade-off between expressivity and circuit efficiency by reducing the circuit's dimensionality. When comparing the two approaches, we find that the small residual Weyl parameters neglected by the latter are essential for high compression of the Ising propagator, whereas for the Heisenberg propagator, the native XXZ structure can be exploited directly to build a more efficient compressed circuit.", "url": "https://arxiv.org/abs/2610.32812", "type": "理论+数值", "summary": "1. 该工作研究在张量网络量子线路压缩中利用外尔腔结构，将黎曼优化所得门直接参数化到硬件原生门集，以评估表达力与线路效率的权衡。\n2. 其要点是发现优化门呈现可预测外尔结构（Ising 近 RZZ、Heisenberg XXZ 近 fSim），并表明原生门参数化忽略的小残余外尔参数对 Ising 传播子的高压缩至关重要，而 Heisenberg 可直接利用 XXZ 结构构建更高效压缩线路。\n3. 这提示硬件感知压缩应按模型与原生门集匹配参数化，在保留必要残余自由度的同时减少 KAK 合成开销，并为近中期多体动力学模拟提供可操作准则。", "summary_source": "deepseek", "authors": [{"name": "Neel Misciasci"}, {"name": "Isabel Nha Minh Le"}, {"name": "Christian B. Mendl"}], "featured_authors": [{"name": "Neel Misciasci"}, {"name": "Isabel Nha Minh Le"}, {"name": "Christian B. Mendl"}], "author_count": 3}, {"id": "2610.32823", "category": "quant-ph", "title": "Minimal unitary representations of time-invariant causal quantum channels", "abstract": "In this work, we study quantum channels that respect causality in single-input-single-output linear time-invariant systems. We show that positive semidefinite kernels satisfying certain analyticity constraints, which we call Schur-class kernels, provide a suitable description of such channels through multiplicative maps (Schur multipliers). Using the Moore-Aronszajn Theorem, we establish that these multipliers admit a minimal analytic Stinespring representation, which, in the unital case, is given by multiplication by a left inner function. We then relate the output rank of pure-state inputs to the dimension of the associated reproducing kernel Hilbert space. Using de Branges-Rovnyak realizations, we derive a stability criterion for the existence of two-sided inner completions of these vector-valued functions. We further show that the adjoint of the Julia embedding associated with the realization is minimal, and that its characteristic function essentially coincides with the canonical two-sided inner completion suggested by the Beurling-Lax-Halmos Theorem. Finally, we provide algorithms for explicitly computing minimal two-sided inner completions in the case of finite McMillan degree.", "url": "https://arxiv.org/abs/2610.32823", "type": "理论+数值", "summary": "1. 该工作针对单输入单输出线性时不变系统中保持因果性的量子信道，基于Schur类核与Schur乘子建立了极小解析Stinespring表示。\n2. 其核心是利用Moore-Aronszajn定理在再生核Hilbert空间上实现该表示：幺正情形化为左内函数乘法，并将纯态输入输出秩与空间维数联系，借助de Branges-Rovnyak实现给出双侧内补全存在性的稳定性判据，且证明Julia嵌入伴随极小、特征函数与Beurling-Lax-Halmos规范补全一致。\n3. 在有限McMillan度情形给出显式计算最小双侧内补全的算法，为因果量子信道的系统级建模、约简与后续实现提供了可操作路径。", "summary_source": "deepseek", "authors": [{"name": "Antonius Jacobus Hasenack"}, {"name": "Boris Škorić"}], "featured_authors": [{"name": "Antonius Jacobus Hasenack"}, {"name": "Boris Škorić"}], "author_count": 2}, {"id": "2610.32937", "category": "quant-ph", "title": "Certain Quantum States Already Require Quantum Time Evolution", "abstract": "Model-independent tests of quantum theory, such as Bell inequality violations, focus on static properties of the theory and do not rely on its dynamical aspects. Hence, this core part of quantum theory remains largely untested in a model-independent way. We show that the structure of quantum time evolution can be examined by testing the consistency between the state space and the dynamical laws. Considering a class of generalized phase-space theories, we find that certain quantum states can only be part of a theory if the time evolution is quantum: their evolution in anharmonic potentials would otherwise result in unphysical, negative marginal distributions. Furthermore, we demonstrate that the existence of the first excited state of a quantum harmonic oscillator is already sufficient to single out the Moyal bracket (quantum dynamics) to leading order in $\\hbar^2$. We outline how theory-independent Wigner tomography of this state can be used to empirically exclude nonquantum dynamical theories.", "url": "https://arxiv.org/abs/2610.32937", "type": "理论", "summary": "1. 该工作通过检验态空间与动力学定律的一致性，提出可在不依赖具体模型的情况下审视量子时间演化结构，并分析了一类广义相空间理论。\n2. 其关键结果是在非谐势中某些量子态若采用非量子演化会产生非物理的负边缘分布，而已知量子谐振子第一激发态的存在已足以在ℏ²领头阶唯一选出莫亚尔括号。\n3. 作者进一步给出基于与理论无关的维格纳层析对该态进行经验检验的方案，从而为排除非量子动力学理论提供可操作途径。", "summary_source": "deepseek", "authors": [{"name": "Joel D. Huber"}, {"name": "Matthias Kleinmann"}], "featured_authors": [{"name": "Joel D. Huber"}, {"name": "Matthias Kleinmann"}], "author_count": 2}, {"id": "2610.32946", "category": "quant-ph", "title": "Low-frustration block encodings by patch routing", "abstract": "Block-encoding has emerged as a core primitive in many quantum algorithms, including quantum simulation. In this work, we design efficient and extensible methods for generating low-frustration block encodings of frustrated lattice Hamiltonians built from repeated local interaction patches through a technique we call \"patch routing\". We construct block encodings for a full Hamiltonian by first block-encoding a small local patch and then using a SWAP-style routing network to coherently apply the local patch encoding across the lattice. The expensive, local block-encoding cost is paid only once per query and is independent of lattice size, whereas the comparatively inexpensive routing network grows linearly with the lattice size, dominating at large sizes. Our method allows for a hierarchical structure in which larger patches can be block-encoded with small normalization factors, albeit at a higher (local, non-extensive) block-encoding cost, thereby reducing overall query complexity in an algorithm. We exploit symmetries and algebraic structures in local interactions to construct efficient block encodings, and we apply these techniques to the Heisenberg, Fermi-Hubbard, and honeycomb spin-liquid models. For a $120\\times 120$ square-lattice $J_1$-$J_2$ Heisenberg model near maximal frustration ($J_2/J_1=0.4-0.6$), our methods result in a $15-17\\times$ reduction in the leading $T$ cost per qubitized-QPE run (ignoring initial state preparation and overlap) relative to prior state-of-the-art Pauli LCU constructions. Corresponding reductions are approximately $3\\times$ for the $120\\times120$ Fermi-Hubbard model at half-filling. For time evolution of the honeycomb spin-liquid model on $120\\times120$ unit cells, the leading cost is reduced by $5\\times$. Our framework provides a systematic way forward for larger and more accurate fault-tolerant simulations of real-world quantum systems.", "url": "https://arxiv.org/abs/2610.32946", "type": "理论+数值", "summary": "1. 该工作提出“patch routing”方法，通过对重复局域相互作用斑块先做块编码并用SWAP型路由网络相干铺展，为阻挫晶格哈密顿量构造低阻挫、可扩展的块编码。\n2. 其核心卖点是将昂贵的局域块编码代价降为每次查询一次且与晶格尺寸无关，路由代价仅随尺寸线性增长，并可用层级化大斑块以较小归一化因子降低整体查询复杂度，同时在Heisenberg、Fermi-Hubbard和蜂窝自旋液体模型中演示，120×120 J1-J2近最大阻挫下相较Pauli LCU约降15–17倍。\n3. 该框架为更大规模、更高精度的容错量子模拟提供了系统化路径，尤其启示通过局域对称性与代数结构及斑块层级化来压缩真实体系模拟的主导成本。", "summary_source": "deepseek", "authors": [{"name": "Minzhao Liu"}, {"name": "Abeynaya Gnanasekaran"}, {"name": "Ananth Kaushik"}, {"name": "Siddharth Hariprakash"}, {"name": "Alireza Marefat Khah"}, {"name": "Martin Roetteler"}, {"name": "Grant Salton"}], "featured_authors": [{"name": "Minzhao Liu"}, {"name": "Abeynaya Gnanasekaran"}, {"name": "Ananth Kaushik"}, {"name": "Alireza Marefat Khah"}, {"name": "Martin Roetteler"}, {"name": "Grant Salton"}], "author_count": 7}, {"id": "2610.32968", "category": "quant-ph", "title": "Distributed Quantum-Centric Supercomputing with Multi-Layered Generative Learning for Intermolecular Interactions", "abstract": "Quantum-centric supercomputing (QCSC) approaches, such as sample-based quantum diagonalization (SQD), combine quantum processors with high-performance computers (HPC), offering a promising route toward solving challenging electronic structure problems. However, implementation of QCSC approaches to large active space calculations is constrained by the associated number of qubits, deep quantum circuits, sampling cost, and large-scale Hamiltonian diagonalization. To overcome these limitations, we introduce a distributed QCSC framework that decomposes complex molecular problems into parallel sub-problems requiring fewer qubits, shallower circuits, and reduced shot budgets. A physically motivated, two-step aggregation scheme then reconstructs the global solution: first, a computational bit assignment strategy optimizes a cost function to appropriately map local bit indices to global ones, yielding a mapped tensor product state (MTPS); second, an inter-fragment correlation recovery module restores missing cross-fragment interactions. Herein, we employ a multi-layered generative machine learning architecture, starting with utilizing the recently proposed physics-informed generative SQD (PIGen-SQD) as a distributed QCSC solver, followed by a secondary generative module to model configuration distributions and identify dominant sectors of the global Hilbert space. For water and formamide dimers, our method achieves up to $95\\%$ reduction in the diagonalization dimension while enhancing energy accuracy by an order of magnitude over conventional SQD. Furthermore, application to the water hexamer ($\\mathrm{(H_2O)_6}$) cage successfully decomposes a 120-qubit problem into six 20-qubit monomeric subsystems, and stitches the monomers under a dimeric approximation, demonstrating excellent agreement with the reference classical methods.", "url": "https://arxiv.org/abs/2610.32968", "type": "理论+数值", "summary": "1. 该工作提出分布式量子中心超算框架，将大活性空间分子问题分解为需更少量子比特、更浅线路和更低采样预算的并行子问题，并以两步聚合重建全局解。\n2. 其卖点是用计算比特分配优化局部到全局索引生成映射张量积态，再以片段间关联恢复补偿缺失的跨片段相互作用，并用多层生成学习建模构型分布、定位全局希尔伯特空间主导扇区。\n3. 水与甲酰胺二聚体上对角化维度最多降低95%且能量精度较传统SQD提升一个量级，水六聚体120比特问题被拆为六个20比特单体并按二聚体近似拼接，表明该路线可扩展至更大分子体系并启发跨片段关联恢复的混合量子-经典电子结构计算。", "summary_source": "deepseek", "authors": [{"name": "Chayan Patra"}, {"name": "Prayas Ghosh"}, {"name": "Adwait Patkhedkar"}, {"name": "Rahul Maitra"}], "featured_authors": [{"name": "Chayan Patra"}, {"name": "Prayas Ghosh"}, {"name": "Adwait Patkhedkar"}, {"name": "Rahul Maitra"}], "author_count": 4}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>${paper.summary_source === "deepseek" ? "DeepSeek three-sentence PRL summary" : (paper.summary_source === "local-fallback" ? "Local three-sentence fallback" : (paper.summary_source === "translation" ? "Chinese abstract translation" : "Chinese placeholder fallback"))}</span><a href="${safeUrl}" target="_blank" rel="noreferrer">Open arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
</body>
