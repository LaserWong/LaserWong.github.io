iptions. For representative examples, including subspace projection, spin expectation values, partial trace, and an imperfect detector map, we obtain explicit scaling laws and closed-form expressions for the associated volumes. The resulting framework provides a geometric measure of quantum ignorance at the level of the preparation and complements entropy notions based on density matrices and coarse graining.", "url": "https://arxiv.org/abs/2608.20136", "type": "理论", "summary": "1. 该工作为量子制备引入一种几何熵，将其定义为与给定约束相容的纯态所构成希尔伯特空间体积的对数。\n2. 其核心卖点在于将玻尔兹曼计数推广到量子态空间，用非正交相容态的体积替代态数目，并对子空间投影、自旋期望值、部分迹与不完美探测器映射等例子给出闭式体积及标度律。\n3. 该框架在制备层面提供量子无知的几何度量，补充基于密度矩阵与粗粒化的熵概念，并为受限量子态计数及量子统计力学研究提供新的几何工具与启发。", "summary_source": "deepseek", "authors": [{"name": "Raúl O. Vallejos"}, {"name": "Isadora Veeren"}, {"name": "Frederico Brito"}, {"name": "Fernando de Melo"}], "featured_authors": [{"name": "Raúl O. Vallejos"}, {"name": "Isadora Veeren"}, {"name": "Frederico Brito"}, {"name": "Fernando de Melo"}], "author_count": 4}, {"id": "2608.20140", "category": "quant-ph", "title": "Vacuum viscosity and relativistic inertia: Motion of a massive object with charged internal degrees of freedom interacting with a classical field", "abstract": "Our present investigation into a rather rudimentary problem is motivated by two classes of problems studied since the 70's, cosmological particle creation and its more accessible analog, the dynamical Casimir effect on the one hand, and quantum friction a neutral atom moving along a dielectric surface would experience, on the other. The backreaction effects of produced particles being able to isotropize the expansion of the universe, or to slow down the moving mirror can be understood via the concept of vacuum viscosity arising from fluctuations of the quantum field. We want to track down the origin of this effect by asking the question whether a moving massive $M$ object with a charged internal degrees of freedom $\\chi$ interacting with a free unbounded classical field $\\phi$ at zero temperature would experience a viscous force, similar to the said precedents. Adopting a microphysics model for optomechanics which can treat the unequal tripartite $\\chi$-$\\phi$-$M$ interactions, we first perform a nonrelativistic calculation, which seems perfectly legitimate considering the needs of atomic physics, and found the answer to be yes, but a relativistic covariant calculation says no. We identify where the nonrelativistic framework is defective. The resolution of this latent yet real conflict is technically nontrivial but physically quite inspirational. It results in added enriched contents to Newton's first and second laws when the principles of special relativity are enforced, and rules to follow to get the correct nonrelativistic answer", "url": "https://arxiv.org/abs/2608.20140", "type": "理论+数值", "summary": "1. 该文针对一个带内部带电自由度的大质量物体与自由无界经典场相互作用的微观光力学模型，考察运动物体是否遭受源自真空涨落的黏滞力。\n2. 其核心在于对比非相对论与相对论协变计算，发现前者预言有阻力而后者预言无阻力，并定位非相对论框架的缺陷，进而为狭义相对论下的牛顿定律注入相对论惯性内容。\n3. 这为统一理解宇宙粒子产生、动态卡西米尔效应与量子摩擦等回作用现象，以及如何获得正确的非相对论近似提供了原则性启发。", "summary_source": "deepseek", "authors": [{"name": "Jen-Tsung Hsiang"}, {"name": "Bei-Lok Hu"}], "featured_authors": [{"name": "Jen-Tsung Hsiang"}, {"name": "Bei-Lok Hu"}], "author_count": 2}, {"id": "2608.20155", "category": "quant-ph", "title": "The ebbs and flows of quantum learning and sensing", "abstract": "What is the relation between subsystem quantum complexity and the emergence of computationally useful structure? We address this by studying a family of minimally tunable postvariational quantum circuits, and show how spectral nonflatness and metrological response directly control the ensemble-typical information processing power. This unveils an intermediate \"learning phase\" that precedes the onset of quantum chaos, characterized by pronounced nonflatness and sensitivity of readout states. The optimal information processing capacity improves with system size, while deep scrambling suppresses observable response. The results reveal how such features of random quantum dynamics can be viewed as computational resources for scalable nonlinear computation.", "url": "https://arxiv.org/abs/2608.20155", "type": "数值", "summary": "1. 该工作通过研究一族最小可调的后变分量子电路，探讨子系统量子复杂度与可计算上有用结构之间的关系，并刻画其系综典型的信息处理能力。\n2. 其核心发现是谱非平坦性与计量响应直接控制信息处理容量，揭示一个先于量子混沌的中间“学习相”，该相具有显著非平坦性与读出态高灵敏度，且最优处理容量随体系规模增大而提升。\n3. 该结果将随机量子动力学中的谱非平坦与深度扰乱效应诠释为可扩展非线性计算的计算资源，为量子学习与传感的实验设计与理论理解提供清晰指引。", "summary_source": "deepseek", "authors": [{"name": "Matias Karjula"}, {"name": "Teemu Ojanen"}, {"name": "Tapio Ala-Nissila"}, {"name": "Moein N. Ivaki"}], "featured_authors": [{"name": "Matias Karjula"}, {"name": "Teemu Ojanen"}, {"name": "Tapio Ala-Nissila"}, {"name": "Moein N. Ivaki"}], "author_count": 4}, {"id": "2608.20162", "category": "quant-ph", "title": "Proper Learning of Shallow All-to-All Quantum Circuits", "abstract": "This work considers a variation on the problem of learning shallow quantum circuits. Given query access to the circuit, as well as knowledge of its gate layout, we consider the task of learning the specific gates used in the circuit, producing an operationally-equivalent circuit matching this structure. Building on recent work for learning Haar random brickwork circuits, we identify a meta-algorithmic framework for learning broad classes of circuits based on iterative local gate inversions at the front and back of the circuit. We apply these techniques to study random, all-to-all, two-local circuits, and provide analytical and numerical evidence that this ensemble undergoes a sharp learnability transition at depth $d^* \\sim \\log_2 n + \\log_2\\log_2 n$ in the large size limit, based on an analysis of lightcone growth. These results have implications for recently proposed quantum cryptographic schemes based on the difficulty of circuit learning, though there are important distinctions with respect to our setting that suggest avenues for future study.", "url": "https://arxiv.org/abs/2608.20162", "type": "数值", "summary": "1. 该工作研究了浅层全连接量子电路的适切学习问题，即在已知电路门排列并具有查询访问时，学习其中的具体门以构造操作等价的电路。\n2. 其技术核心是提出一种基于在电路前后端迭代进行局部门反转的元算法框架，并通过光锥增长分析给出解析与数值证据，表明随机双局域全连接电路在深度 d* ~ log2 n + log2 log2 n 处发生尖锐的可学习性相变。\n3. 这为基于电路学习困难性的量子密码方案提供了启示，但本设置与这类方案存在重要差异，因而为后续研究指明了方向。", "summary_source": "deepseek", "authors": [{"name": "Steven Kordonowy"}, {"name": "Jacob Watkins"}], "featured_authors": [{"name": "Steven Kordonowy"}, {"name": "Jacob Watkins"}], "author_count": 2}, {"id": "2608.20164", "category": "quant-ph", "title": "Architecture and Compilation Co-Design for High-Rate Quantum Product Codes on Neutral Atom Arrays", "abstract": "Achieving fault-tolerant quantum computing at a practical scale demands quantum error correction (QEC) codes with high encoding rates. Quantum low-density parity-check (qLDPC) codes emerge as a promising candidate, especially given the rise of neutral atom arrays that provide dynamic long-range connectivity via atom movements. In general, synthesizing valid and efficient physical execution plans for QEC is a provably hard combinatorial problem, forming a critical compilation bottleneck that worsens as code sizes grow. To overcome this complexity, we focus on an important product family of qLDPC codes with dimension-reduction properties, and propose ONEX. This framework decomposes complex 2D physical execution planning into independent 1D subproblems, each solved to optimal execution depth within practical compilation time. First, we formulate the 1D execution plan with an explicit satisfiability modulo theories (SMT) encoding. This protocol produces provably depth-optimal solutions with substantial duration reduction. Second, we develop a multi-stage compilation pipeline featuring anytime optimization, movement compaction, and iterative feedback. This pipeline maintains practical wall-clock times while providing progressive refinement and on-demand retrieval of quality solutions. Third, we evaluate ONEX in the application of hypergraph product (HGP) code memory mapped onto neutral atom arrays, achieving 3.7x to 6.1x and 29.8x to 42.1x higher clock rates than the constructive 1D algorithm and the general 2D compiler, respectively, while scaling efficiently to codes with 2,500 data qubits. Finally, we extend ONEX to zoned layouts, revealing architectural insights into the associated trade-offs, and demonstrate its applicability to the broader lifted-product (LP) code family through a representative example.", "url": "https://arxiv.org/abs/2608.20164", "type": "理论+数值", "summary": "1. 该工作针对中性原子阵列上的量子乘积码，提出联合架构与编译的协同设计框架ONEX，将二维物理执行规划分解为可最优求解的一维子问题。\n2. 其核心技术是用SMT编码实现一维执行计划的深度最优，并辅以多阶段编译管线与随时优化，在2500个数据比特规模下将时钟速率较通用二维编译器提升近30至42倍。\n3. 该框架还扩展至分区布局与提升乘积码族，为高编码率qLDPC码在可重构原子阵列上的可扩展容错编译提供了实用路径与架构权衡启示。", "summary_source": "deepseek", "authors": [{"name": "Adrian Liu"}, {"name": "Wan-Hsuan Lin"}, {"name": "Daniel Bochen Tan"}, {"name": "Qian Xu"}, {"name": "Jason Cong"}], "featured_authors": [{"name": "Adrian Liu"}, {"name": "Wan-Hsuan Lin"}, {"name": "Daniel Bochen Tan"}, {"name": "Qian Xu"}, {"name": "Jason Cong"}], "author_count": 5}, {"id": "2608.20178", "category": "quant-ph", "title": "Characterization of a damping channel as a mixture of amplitude damping and anti-damping channels of different parameters", "abstract": "Non-unital noise is a fundamental feature of open quantum systems, governing energy exchange and inducing state translations on the Bloch sphere. While such translations can be useful for tasks such as state preparation and channel capacity, unital dynamics where no translation occurs are often preferred in quantum information processing, particularly for error correction. Phase-covariant dynamics provide a general framework encompassing dissipation, excitation, and dephasing processes in qubit systems; however, commonly used models such as the generalized amplitude damping (GAD) channel offer only limited control over these features. In this work, we present a constructive framework for generating a broader class of phase-covariant dynamics by mixing amplitude-damping and anti-damping channels with unequal decay parameters and time-dependent mixing probabilities. This approach enables independent control over contraction and translation, allows continuous tuning between non-unital and unital regimes, and yields an effective dephasing contribution absent in GAD. To characterize these dynamics, we employ the general theorem for P-divisibility and show that it can be used constructively by evaluating it in suitably chosen Hilbert space bases, leading to simplified conditions for both unital and non-unital cases. The framework captures a wide range of behaviors, including CP-divisible, P-divisible but not CP-divisible, and non-P-divisible dynamics. We further show that appropriate mixing can reduce the deviation from the ideal noiseless evolution and that such improvement persists even after tuning the dynamics to the unital regime. Our results provide a flexible approach to engineering open system dynamics beyond standard thermal models, with potential applications in noise control and quantum information processing.", "url": "https://arxiv.org/abs/2608.20178", "type": "理论+数值", "summary": "1. 该工作提出将不同参数的振幅阻尼与反阻尼通道按时间相关概率混合，构造更广的相位协变开放量子动力学。\n2. 其卖点是可独立调控收缩与平移，连续跨越非幺正与幺正区间，并引入广义振幅阻尼缺失的有效退相，且用P-可除性定理简化判定。\n3. 这为超越标准热库模型的噪声工程提供灵活途径，并有望通过适当混合抑制与无噪演化的偏差，服务量子信息处理。", "summary_source": "deepseek", "authors": [{"name": "Vijay Pathak"}, {"name": "R. Srikanth"}], "featured_authors": [{"name": "Vijay Pathak"}, {"name": "R. Srikanth"}], "author_count": 2}, {"id": "2608.20209", "category": "quant-ph", "title": "Rigorous existence and location of quantum phase transitions in lattice Hamiltonian systems", "abstract": "We extend the analysis of the class of quantum phase transitions (QPTs) that can be interpreted as condensations in state space, first introduced in [M. Ostilli and C. Presilla, J. Phys. A 54, 055005 (2021)], by generalizing the arguments of [M. Ostilli and C. Presilla, Phys. Rev. Lett. 127, 040601 (2021)] to prove the existence and determine the location (via simple bounds) of QPTs in general one-parameter lattice Hamiltonians. Unlike our original formulation, this extension also encompasses second-order QPTs, for which we provide the explicit example of the transverse-field Ising model. Our analysis suggests that, under conditions typically satisfied in physical contexts, any QPT taking place in lattice systems can be interpreted as a condensation in state space.", "url": "https://arxiv.org/abs/2608.20209", "type": "理论", "summary": "1. 该工作延续态空间凝聚这一量子相变诠释，将先前针对特殊情形的严格论证推广至一般单参数格点哈密顿量，证明相变必然存在并借简单界限确定其位置。\n2. 其技术卖点在于该推广同时覆盖二级量子相变，并以横场伊辛模型给出显式示例，说明新框架不再受限于原构造的可积或特殊对称条件。\n3. 这一结果支持在通常物理条件下，任意格点量子相变皆可视为态空间凝聚，为统一刻画与定位各类相变提供了严格的数学基础。", "summary_source": "deepseek", "authors": [{"name": "Massimo Ostilli"}, {"name": "Carlo Presilla"}], "featured_authors": [{"name": "Massimo Ostilli"}, {"name": "Carlo Presilla"}], "author_count": 2}, {"id": "2608.20227", "category": "quant-ph", "title": "Hybrid Qubit-Rotor Quantum Systems: Clifford Structure, Universal Control, and Applications", "abstract": "A $U(1)$ quantum rotor pairs a periodic angle with an integer-valued conjugate momentum, and occurs in molecular rotation, superconducting phase-charge circuits, and compact gauge fields. Coupling such a rotor coherently to qubits gives a hybrid register whose control structure is not inherited from either the oscillator-qubit or the qudit case. We develop a Clifford theory, together with a universal-control result, for registers of $n$ qubits and $r$ rotors. We classify all automorphisms of the hybrid phase space $\\mathbb{F}_2^{2n}\\times\\mathbb{Z}^r\\times\\mathbb{T}^r$ that preserve the Weyl commutation relations, and give an explicit finite Clifford circuit for each one. The classification is directional: rotor momentum parity may control qubit Pauli operations within the Clifford group, while every nonzero qubit-controlled rotor momentum shift is non-Clifford. It also yields normal forms for the mixed qubit-rotor couplings and the exact minimum number of elementary mixed gates needed to synthesize them. Adding a rotor cosine potential and one fixed qubit-rotor conditional phase to the local Clifford operations gives universal control on the full Hilbert space in the strong operator topology. We then apply this structure in three settings: an exact controlled-shift realization of gauge-covariant matter hopping, which is necessarily non-Clifford; rotor phase estimation with direct angle readout and probe optimization under momentum-support and energy constraints; and finite Fourier transforms on rotor momentum codes, where the one-rotor transform for $d=2^s$ compiles into $O(s)$ momentum-selective and controlled-shift instructions and each cross-register Fourier factor is implemented by one quadratic rotor Clifford gate.", "url": "https://arxiv.org/abs/2608.20227", "type": "理论+数值", "summary": "1. 该工作为n个量子比特与r个U(1)转子混合系统建立Clifford理论，证明通用控制，并分类保持Weyl对易关系的相空间自同构及各自动力学对应的Clifford电路。\n2. 核心在于方向性控制：转子动量奇偶可在Clifford群内操控量子比特Pauli算符，而量子比特控制的非零转子动量平移必然非Clifford，由此得到混合耦合规范形和基本混合门最小数目。\n3. 加入转子余弦势和一个固定条件相位即可在强算子拓扑下实现普适控制，并应用于规范协变物质跳跃、转子相位估计及转子动量码上的有限傅里叶变换编译。", "summary_source": "deepseek", "authors": [{"name": "Dengyao Luo"}, {"name": "Arvin Kushwaha"}, {"name": "Mastawal Tirfe"}, {"name": "Bojko N. Bakalov"}], "featured_authors": [{"name": "Dengyao Luo"}, {"name": "Arvin Kushwaha"}, {"name": "Mastawal Tirfe"}, {"name": "Bojko N. Bakalov"}], "author_count": 4}, {"id": "2608.20233", "category": "quant-ph", "title": "Nonthermal Dynamics of a One-dimensional Rydberg-atom Chain with Constraint Four-body Interactions", "abstract": "We investigate dynamics of a linear chain of Rydberg atoms driven by a constrained four-body interaction, where two neighboring atoms are excited simultaneously from the electronic ground state $|0\\rangle$ to Rydberg state $|1\\rangle$ only when their closest neighbors are in $|0\\rangle$ state. By employing an ansatz for the many-body ground state, the low-energy Hamiltonian is given by a tridiagonal form. The many-body ground state energy, which scales linearly with the chain length $L$, is obtained analytically in the thermodynamic limit and agrees with the one of the exact diagonalization. Our model supports quantum many-body scar eigenstates that are nearly equally spaced energetically. The scar states overlap strongly with the basis state $|\\mathbf{0}\\rangle=|0\\cdots 0\\rangle$. We show that the overlap distribution is tilted by the state-dependent four-body interaction. This leads to non-ergodic dynamics, evidenced by the revival of the initial state. The four-body constrained model can be realized with Rydberg atoms in a Peierls array with alternating bond lengths, where atoms on the shorter and longer bonds experience Rydberg blockade and antiblockade, respectively. Our study provides a pathway to explore constrained non-ergodic dynamics with four-body interactions by combining the Rydberg blockade and antiblockade.", "url": "https://arxiv.org/abs/2608.20233", "type": "理论+数值", "summary": "1. 本文研究一维里德伯原子链中受约束四体相互作用驱动的非平衡动力学，并解析求得热力学极限下随链长线性增长的多体基态能量。\n2. 其要点在于低能哈密顿量呈三对角形式，体系拥有能级近似等距且与全零态强重叠的量子多体疤痕态，态依赖四体相互作用使重叠分布倾斜并导致初态复兴。\n3. 该模型可由具有交替键长的Peierls阵列结合里德伯阻塞与反阻塞实现，为探索四体相互作用的约束非遍历动力学开辟了途径。", "summary_source": "deepseek", "authors": [{"name": "Tianyi Yan"}, {"name": "Weibin Li"}], "featured_authors": [{"name": "Tianyi Yan"}, {"name": "Weibin Li"}], "author_count": 2}, {"id": "2608.20250", "category": "quant-ph", "title": "Logarithmic depth compression of Heisenberg Hamiltonian simulation by fan-out parallelization, with built-in error detection", "abstract": "Noisy intermediate-scale quantum computers are constrained by circuit depth, while product-formula simulation of spin systems leads to narrow and deep circuits. Here we introduce a fan-out-based gadget compiler that trades circuit depth for width in simulations of Heisenberg-type nuclear magnetic resonance (NMR) Hamiltonians. Each logical spin is encoded into a small repetition-code register sized by its interaction degree, so that all pairwise interactions of a given Pauli type execute in parallel after a logarithmic-depth CNOT fan-out, and the redundant registers provide error detection for post-selection at no additional algorithmic overhead. The central result is a fixed-protocol resource comparison of the two compilations, transpiled to heavy-hex superconducting and all-to-all trapped-ion targets across a set of NMR spin systems. For interaction graphs with a high-degree hub the volume-optimal schedule halves the two-qubit depth and reduces the volume 1.7-fold for the 13-spin demonstration, which on heavy-hex also lowers the two-qubit gate count, and the depth reduction rises to 2.5-fold on all-to-all for the highest-degree molecule studied. On all-to-all the two-qubit gate count rises for every system, so the volume reduction is a benefit on depth-limited hardware. The gain grows with the degree inhomogeneity of the interaction graph and vanishes for dense uniform graphs, where the optimum is the sequential circuit. We simulate the zero-field NMR spectrum of tetramethylsilane, a 13-spin star system. Under a noise model scaled from a published present-day processor calibration, the shallower gadget circuits match or surpass the sequential compilation only after post-selection on their built-in error detection, once error rates improve by one to one and a half orders of magnitude. We verify the spectra against an independent classical computation.", "url": "https://arxiv.org/abs/2608.20250", "type": "理论+数值", "summary": "1. 该工作提出一种基于扇出并行化的编译方法，将 Heisenberg 型 NMR 哈密顿量模拟的电路深度对数化压缩，同时以宽度换取深度。\n2. 其核心技术是将每个逻辑自旋编码为按相互作用度设定大小的重复码寄存器，使同类型 Pauli 相互作用经 CNOT 扇出后并行执行，并利用冗余寄存器提供零额外算法开销的内建错误检测与后选择。\n3. 在 heavy-hex 与全连接离子阱靶台的资源比较表明，高非均匀度相互作用图中深度最多降低 2.5 倍，且需错误率改善约一个半数量级后选择才能受益，为深度受限硬件上的量子模拟提供了明确优化方向。", "summary_source": "deepseek", "authors": [{"name": "Artemiy Burov"}, {"name": "Clément Javerzac"}], "featured_authors": [{"name": "Artemiy Burov"}, {"name": "Clément Javerzac"}], "author_count": 2}, {"id": "2608.20273", "category": "quant-ph", "title": "Analytical Solutions of the Generalized Klein-Gordon Oscillator in Som-Raychaudhuri Space-Time via the Extended Nikiforov-Uvarov Method", "abstract": "In this study, we present an analytical approach based on the extended Nikiforov-Uvarov method to solve the generalized Klein-Gordon oscillator in the presence of a uniform magnetic field within the Som-Raychaudhuri space-time. Exact eigenstate solutions are obtained for two distinct potential models, namely the linear potential and the Cornell potential. The corresponding energy eigenvalues are determined, and the associated eigenfunctions are analyzed and illustrated graphically.", "url": "https://arxiv.org/abs/2608.20273", "type": "理论", "summary": "1. 该工作用扩展Nikiforov-Uvarov方法解析求解Som-Raychaudhuri时空中含均匀磁场的广义Klein-Gordon振子。\n2. 技术卖点是对线性和Cornell势模型求得精确本征态，并给出能谱及波函数图形化分析。\n3. 这为弯曲时空相对论量子力学中的可解势模型研究提供参考，可推广至其他时空或耦合情形。", "summary_source": "deepseek", "authors": [{"name": "Hale Karayer"}, {"name": "Tolga Celik"}, {"name": "Dogan Demirhan"}], "featured_authors": [{"name": "Hale Karayer"}, {"name": "Tolga Celik"}, {"name": "Dogan Demirhan"}], "author_count": 3}, {"id": "2608.20282", "category": "quant-ph", "title": "Quantum-mechanical wave functions in singular potentials: linear and nonlinear states", "abstract": "It is known that the attractive singular inverse-square potential gives rise to the critical quantum collapse in the framework of the three-dimensional (3D) linear Schroedinger equation. This article summarizes theoretical results which demonstrate suppression of the collapse, caused by this singular potential, and the creation of the otherwise missing ground state (GS) in a 3D gas of bosonic particles, carrying an electric dipole moment, which are pulled to the central electric charge, with repulsive contact interactions between the particles. In the mean-field approximation, the repulsive interactions are represented by the cubic term in the respective Gross-Pitaevskii (GP) equation. In addition to the GS, excited states with angular momentum are briefly considered too. Another topic considered in the article is 1D and 2D bound states in the linear Schroedinger and GP equations with the repulsive potential, which demonstrates a singularity at r --> infinity. A very recent result is that such a potential, growing faster than the negative harmonic-oscillator potential, produces a full spectrum of counter-intuitive normalizable (localized) bound states. The article puts forward perspectives for further studies of linear and nonlinear bound states existing under the action of the potentials with the singularity at r --> 0 or r --> infinity.", "url": "https://arxiv.org/abs/2608.20282", "type": "理论", "summary": "1. 该工作系统评述奇异势中线性薛定谔方程与Gross-Pitaevskii方程的束缚态，涵盖三维偶极玻色气体中排斥接触作用抑制吸引反平方势导致的量子坍缩，并恢复原本缺失的基态。\n2. 其核心卖点是平均场三次非线性项通过对抗奇异吸引势实现坍缩抑制，并发现随r趋近无穷增长快于负谐振子的排斥势可产生完整的可归一化局域束缚谱。\n3. 这为继续研究r趋近0或无穷时奇异势下线性与非线性束缚态的稳定性、角动量激发态及全新量子物态提供了明确理论方向。", "summary_source": "deepseek", "authors": [{"name": "Hidetsugu Sakaguchi"}, {"name": "Boris A. Malomed"}], "featured_authors": [{"name": "Hidetsugu Sakaguchi"}, {"name": "Boris A. Malomed"}], "author_count": 2}, {"id": "2608.20297", "category": "quant-ph", "title": "Parallel Quantum Advantage with Limited Adaptivity Requires Structure", "abstract": "Aaronson and Ambainis (Theory of Computing, 2014) conjectured that quantum query algorithms admit efficient almost-everywhere classical simulation: for any $T$-query quantum algorithm, its acceptance probability can be approximated on a $(1-\\delta)$ fraction of inputs, up to $\\epsilon$ additive error, using $\\mathrm{poly}(T, 1/\\epsilon, 1/\\delta)$ classical queries. At a high level, the conjecture suggests that exponential quantum speedups are possible only on sufficiently structured inputs. In this work, we make progress on this conjecture by proving it for quantum algorithms that make massively parallel quantum queries. In contrast, Yamakawa and Zhandry (Journal of the ACM, 2024) showed that quantum algorithms restricted to parallel queries can still achieve exponential speedups over classical algorithms for sampling problems. We establish our simulation theorem by proving the stronger statement that parallel-query quantum algorithms cannot distinguish the uniform distribution over oracles from oracles drawn from so-called \"dense distributions\". Our main technical contribution is a coupling theorem that relates the uniform distribution over oracles to oracles drawn from dense distributions. We further extend this approach beyond the purely parallel setting, obtaining simulation theorems both for algorithms with a bounded quantum-query prefix followed by a massively parallel quantum-query stage, and for hybrid algorithms that make an arbitrary polynomial number of adaptive classical queries before the massively parallel quantum-query stage. Finally, using the parallel-query simulation theorem as a base case, we obtain simulation theorems for quantum algorithms with constant rounds of adaptivity.", "url": "https://arxiv.org/abs/2608.20297", "type": "理论+数值", "summary": "1. 该工作证明了Aaronson-Ambainis猜想在巨量并行量子查询情形下成立：任何T次并行量子查询算法的接受概率可由poly(T,1/ε,1/δ)次经典查询在几乎所有输入上近似。\n2. 核心技术创新是耦合定理，表明并行量子查询算法无法区分均匀预言机分布与稠密分布，并推广到有界量子查询前缀、混合经典自适应查询后接并行量子查询以及常数轮自适应等情形。\n3. 这为“指数量子加速仅存在于足够结构化输入”提供了新证据，同时提示并行量子算法对采样问题的指数优势并不与几乎处处经典模拟矛盾。", "summary_source": "deepseek", "authors": [{"name": "Qipeng Liu"}, {"name": "Saachi Mutreja"}], "featured_authors": [{"name": "Qipeng Liu"}, {"name": "Saachi Mutreja"}], "author_count": 2}, {"id": "2608.20340", "category": "quant-ph", "title": "Group-theoretic treatment of strong light-matter coupling with an arbitrary number of excitations", "abstract": "Strong light-matter interactions in optical microcavities give rise to hybrid light-matter states known as polaritons. While actively used in modern technologies, theoretical descriptions of such systems are often restricted to the single-excitation case, limiting their ability to capture many-excitation physics and hindering further technological advancements. Here, by exploiting the combinatorial structure of quantum emitters, we investigate the Tavis-Cummings model with arbitrary number of excitations. We derive the structure and properties of its eigensystem and identify allowed radiative transitions in systems of realistic size scales. Our work reveals new behavior inaccessible to the few-excitation regime, while also providing a framework to reduce the computational complexity of similar systems with exponentially growing Hilbert spaces.", "url": "https://arxiv.org/abs/2608.20340", "type": "理论", "summary": "1. 该工作利用量子辐射体的组合结构，以群论方法处理任意激发数下的Tavis-Cummings模型。\n2. 其核心在于推导出完整本征系统的结构与性质，并识别实际尺度体系中允许的辐射跃迁，从而突破单激发限制。\n3. 这为刻画多激发光物质耦合新行为、降低指数增长希尔伯特空间的计算复杂度提供了可推广框架。", "summary_source": "deepseek", "authors": [{"name": "Antti Peltola"}, {"name": "Olli Siltanen"}, {"name": "Kimmo Luoma"}, {"name": "Konstantinos S. Daskalakis"}], "featured_authors": [{"name": "Antti Peltola"}, {"name": "Olli Siltanen"}, {"name": "Kimmo Luoma"}, {"name": "Konstantinos S. Daskalakis"}], "author_count": 4}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>${paper.summary_source === "deepseek" ? "DeepSeek three-sentence PRL summary" : (paper.summary_source === "local-fallback" ? "Local three-sentence fallback" : (paper.summary_source === "translation" ? "Chinese abstract translation" : "Chinese placeholder fallback"))}</span><a href="${safeUrl}" target="_blank" rel="noreferrer">Open arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
