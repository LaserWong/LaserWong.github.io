<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>arXiv 2026-08-21 · Daily ArXiv Selection</title>
  <style>
    :root {
      --bg: #f6f1e8;
      --panel: rgba(255, 252, 246, 0.92);
      --text: #2d241d;
      --muted: #6d5d50;
      --line: rgba(69, 49, 32, 0.14);
      --accent: #8f3d2e;
      --accent-2: #1d5f6b;
      --theory: #7c3a2a;
      --numeric: #255b6a;
      --both: #5d4a99;
      --experimental: #2f6b39;
      --shadow: 0 18px 40px rgba(54, 32, 16, 0.12);
      --radius: 22px;
      --ui-font: "Aptos", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --title-font: "Palatino Linotype", "Noto Serif SC", Georgia, serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--ui-font);
      color: var(--text);
      background: radial-gradient(circle at top left, rgba(255,255,255,0.78), transparent 32%), radial-gradient(circle at 88% 12%, rgba(29,95,107,0.14), transparent 20%), linear-gradient(180deg, #fbf7f0 0%, var(--bg) 42%, #f2e8dc 100%);
      min-height: 100vh;
    }
    .shell { width: min(1220px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 64px; }
    .hero {
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(255,255,255,0.84), rgba(255,248,238,0.72)), linear-gradient(135deg, rgba(143,61,46,0.08), rgba(29,95,107,0.08));
      box-shadow: var(--shadow);
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.82); border: 1px solid var(--line); color: var(--muted); font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase;
    }
    h1 { margin: 18px 0 10px; font-family: var(--title-font); font-size: clamp(32px, 5vw, 54px); line-height: 1.04; letter-spacing: -0.03em; }
    .hero p { max-width: 880px; color: var(--muted); font-size: 16px; line-height: 1.7; margin: 0; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-top: 26px; }
    .stat { padding: 16px 18px; background: rgba(255,255,255,0.76); border: 1px solid var(--line); border-radius: 18px; }
    .stat .label { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
    .stat .value { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
    .controls { position: sticky; top: 12px; z-index: 3; margin-top: 22px; padding: 18px; border: 1px solid var(--line); border-radius: 24px; background: rgba(250,244,236,0.9); backdrop-filter: blur(16px); box-shadow: 0 10px 24px rgba(54,32,16,0.08); }
    .control-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 16px; }
    .field { display: flex; flex-direction: column; gap: 10px; }
    .field label { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
    .search { width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line); background: rgba(255,255,255,0.92); font: inherit; color: var(--text); }
    .chip-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .chip { border: 1px solid var(--line); background: rgba(255,255,255,0.82); color: var(--text); padding: 10px 14px; border-radius: 999px; font: inherit; cursor: pointer; }
    .chip.active { border-color: rgba(143,61,46,0.35); background: rgba(143,61,46,0.12); color: #5b2419; }
    .chip[data-type="数值"].active { border-color: rgba(37,91,106,0.35); background: rgba(37,91,106,0.12); color: #173f49; }
    .chip[data-type="理论+数值"].active { border-color: rgba(93,74,153,0.35); background: rgba(93,74,153,0.12); color: #46337d; }
    .chip[data-type="实验"].active { border-color: rgba(47,107,57,0.35); background: rgba(47,107,57,0.12); color: #214c29; }
    .meta-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 14px; color: var(--muted); font-size: 14px; }
    .paper-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 18px; margin-top: 22px; }
    .paper { display: flex; flex-direction: column; gap: 14px; padding: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 10px 24px rgba(54,32,16,0.06); }
    .paper-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .tag { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid transparent; }
    .tag.category { background: rgba(45,36,29,0.08); color: var(--text); }
    .tag.type-theory { background: rgba(124,58,42,0.1); color: var(--theory); border-color: rgba(124,58,42,0.16); }
    .tag.type-numeric { background: rgba(37,91,106,0.1); color: var(--numeric); border-color: rgba(37,91,106,0.16); }
    .tag.type-both { background: rgba(93,74,153,0.1); color: var(--both); border-color: rgba(93,74,153,0.16); }
    .tag.type-experimental { background: rgba(47,107,57,0.1); color: var(--experimental); border-color: rgba(47,107,57,0.16); }
    .paper h2 { margin: 0; font-family: var(--title-font); font-size: 22px; line-height: 1.25; letter-spacing: -0.02em; }
    .paper h2 a { color: inherit; text-decoration: none; }
    .paper h2 a:hover { color: var(--accent); }
    .paper .id { color: var(--muted); font-size: 13px; }
    .author-block { display: grid; gap: 10px; padding: 14px 16px; border-radius: 18px; background: rgba(255,255,255,0.64); border: 1px solid var(--line); }
    .author-label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .author-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .author-item { display: grid; gap: 4px; }
    .author-item strong { font-size: 14px; }
    .author-item span { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .author-note { color: var(--muted); font-size: 12px; }
    .paper .summary { margin: 0; font-size: 15px; line-height: 1.75; white-space: pre-line; }
    details { border-top: 1px solid var(--line); padding-top: 12px; }
    details summary { cursor: pointer; color: var(--accent-2); font-weight: 700; list-style: none; }
    details summary::-webkit-details-marker { display: none; }
    details p { margin: 10px 0 0; color: var(--muted); line-height: 1.72; font-size: 14px; white-space: pre-line; }
    .paper footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 6px; color: var(--muted); font-size: 13px; }
    .paper footer a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .empty { display: none; margin-top: 24px; padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 22px; background: rgba(255,255,255,0.7); }
    @media (max-width: 980px) { .control-grid { grid-template-columns: 1fr; } .controls { position: static; } }
  </style>
</head>

  <div class="shell">
    <section class="hero">
      <div class="eyebrow">arXiv Daily Digest · 2026-08-21</div>
      <h1>Daily ArXiv Selection</h1>

        数据来自 arXiv 当天的 <code>cond-mat</code>、<code>hep-th</code>、<code>math-ph</code>、<code>quant-ph</code> 四个分类页，口径限定为 <code>New submissions</code>。
        页面主体优先展示 DeepSeek reasoner 生成的三句话中文总结；若 API 不可用或返回异常，则回退为基于中文翻译抽取的本地三句话总结；下拉可以查看英文原版摘要。

  <script>
    const papers = [{"id": "2608.19274", "category": "cond-mat", "title": "Exact expressions of correlation functions between two spins in the boundary row of the two-dimensional rectangular Ising model with periodic-free boundary conditions and finite size", "abstract": "We present exact expressions of correlation functions between two spins in the boundary row of the two-dimensional rectangular Ising model with periodic-free boundary conditions and finite size. Some properties of exact expressions obtained are discussed. The fundamental property of the Ising model that the long range order emerge as the temperature decrease is shown clearly; expressions of the correlation functions in the thermodynamic limit varies depending on the order of taking limits of two parameters L and N; the impact of different sizes on correlation functions is illustrated with the aid of diagrams. Expressions of the correlation function discussed in this paper in the thermodynamic limit has been presented by previous researchers, and we prove that expressions obtained in this article is identical in form to expressions provided by previous researchers in the thermodynamic limit.", "url": "https://arxiv.org/abs/2608.19274", "type": "理论", "summary": "1. 该工作针对具有周期-自由边界条件的二维矩形伊辛模型，推导了边界行上两个自旋之间关联函数的精确有限尺寸表达式，并讨论了这些表达式的基本性质。\n2. 其核心卖点在于精确表达式清晰地展示了温度降低时长程序的出现，表明热力学极限下关联函数形式依赖于L与N两个参数的取极限次序，并以图示阐明了不同尺寸对关联函数的影响。\n3. 文中所得表达式在热力学极限下与前人给出的结果形式一致，证明了该推导的可靠性，并为有限尺寸标度与边界临界现象的研究提供了严格基准。", "summary_source": "deepseek", "authors": [{"name": "Mei Tao"}], "featured_authors": [{"name": "Mei Tao"}], "author_count": 1}, {"id": "2608.19284", "category": "cond-mat", "title": "Extension of the Shockley-Queisser Limit for Nanostructured Solar Cells", "abstract": "This article extends the Shockley-Queisser limit to nanostructured solar cells using the quantum phase space formalism. The parameter B_ll represents the momentum variance in each confinement direction and acts as a variance-covariance matrix linking the nanostructure geometry to thermodynamic properties. Electron-electron interactions are included via an exchange-correlation energy with an adjustable coefficient theta. The authors derive an analytical expression for the maximum efficiency as a function of size, shape, temperature, and doping. For the cylindrical geometry, the exact confinement energy uses the first zero of the Bessel function j_0,1. Numerical simulations are performed with Python 3.8.1, NumPy, and Matplotlib for PbS quantum dots in four geometries: cube, square parallelepiped, cylinder, and sphere. The integral is evaluated using an exact convergent series expansion. Results show that the maximum efficiency reaches 48.7 percent for a 5 nanometre cube, 49.0 percent for flattened parallelepiped and cylinder shapes, and 49.1 percent for a 3 nanometre sphere. These values greatly exceed the bulk PbS efficiency of 15.8 percent and surpass classical Shockley-Queisser limits. For constant-volume shapes, two efficiency peaks appear corresponding to different aspect ratios. The model correctly returns to classical values for large sizes. This approach provides a theoretical framework for optimising nanostructured solar cells and demonstrates that quantum confinement offers a promising route to surpass traditional photovoltaic limits.", "url": "https://arxiv.org/abs/2608.19284", "type": "理论+数值", "summary": "1. 该工作利用量子相空间形式将Shockley-Queisser极限推广至纳米结构太阳电池，并推导出效率关于尺寸、形状、温度及掺杂的解析表达式。\n2. 其技术核心在于引入动量方差矩阵B_ll关联几何与热力学性质，并借助交换关联能及贝塞尔函数精确处理约束能，从而在PbS量子点中实现约49%的极限效率，远超体材料15.8%。\n3. 这为通过量子限域优化光伏器件提供了可推广的理论框架，也提示形状与尺寸调控可突破传统效率上限，但需注意大尺寸极限下回归经典结果。", "summary_source": "deepseek", "authors": [{"name": "Rivo Herivola Manjakamanana Ravelonjato"}, {"name": "Jean Patrice Rakotoniaina"}, {"name": "Ravo Tokiniaina Ranaivoson"}, {"name": "Wilfrid Chrysante Solofoarisina"}], "featured_authors": [{"name": "Rivo Herivola Manjakamanana Ravelonjato"}, {"name": "Jean Patrice Rakotoniaina"}, {"name": "Ravo Tokiniaina Ranaivoson"}, {"name": "Wilfrid Chrysante Solofoarisina"}], "author_count": 4}, {"id": "2608.19312", "category": "cond-mat", "title": "Interferometric Signatures of Zero Modes in Fractional Quantum Hall-Superconductor Heterostructures", "abstract": "Fractional quantum Hall-superconductor (FQH-SC) heterostructures are predicted to host defect-bound parafermion zero modes (PZMs). We propose two related configurations to probe their fusion structure. In a Josephson junction coupled to a single quantum point contact (QPC), quasiparticle tunneling switches the defect fusion channel, producing stochastic transitions between branches of the fractional Josephson spectrum. Embedding the junction in a two-QPC Fabry-Pérot interferometer provides a complementary probe. Weak zero mode tunneling produces fusion-channel-dependent interference while strong tunneling makes the interferometer probe a superposition of fusion channels and strongly suppresses the signal: in the topological limit it vanishes exactly, revealing the defects' non-Abelian nature even when the parent FQH state is Abelian.", "url": "https://arxiv.org/abs/2608.19312", "type": "理论", "summary": "1. 该工作针对分数量子霍尔-超导体异质结中缺陷束缚的帕拉费米子零模，提出两种干涉测量方案来探测其融合结构。\n2. 其核心在于单量子点接触隧穿可随机切换缺陷融合通道，而双点接触法布里-珀罗干涉仪在弱隧穿时呈现融合通道依赖的干涉，强隧穿则强烈抑制信号并在拓扑极限下严格消失。\n3. 这为在阿贝尔母态平台上观测非阿贝尔缺陷性质、并通过隧穿强度控制融合通道提供了可行的干涉测量途径。", "summary_source": "deepseek", "authors": [{"name": "Junyi Cao"}, {"name": "Ramanjit Sohal"}, {"name": "Angela Kou"}, {"name": "Eduardo Fradkin"}], "featured_authors": [{"name": "Junyi Cao"}, {"name": "Ramanjit Sohal"}, {"name": "Angela Kou"}, {"name": "Eduardo Fradkin"}], "author_count": 4}, {"id": "2608.19343", "category": "cond-mat", "title": "Self-calibrating thermal interferometry of vortex parity in a two-dimensional chiral superconductor", "abstract": "A chiral superconductor carries chiral Majorana modes along its boundary, and the integer that counts them fixes everything that follows, yet that integer has never been measured together with a local parity observable on one object. Proximitized one-dimensional wires read fermion parity rapidly but diagnose bulk topology through a separate protocol. Here we show that a reconfigurable domain wall between regions of opposite Chern number in an intrinsic two-dimensional chiral superconductor performs both functions. Opened to its contacts the wall is a ballistic channel whose quantized thermal conductance counts its Majorana modes; closed, the same wall is a Fabry--Pérot resonator whose spectrum shifts by half a level spacing when the parity of the enclosed vortices changes, giving a two-level heat conductance. We derive the exact transmission, the elastic heat full counting statistics, and a theorem showing that linear-response heat scattering of a fixed quadratic problem resolves vortex parity but not the fusion channel of well-separated cores. An outside vortex hybridized with the wall is an intrinsic false positive; temperature, geometry and a finite-bias mean--noise test separates it. Rhombohedral-graphene parameters place submicron loops in the resolved regime at millikelvin temperatures, where chiral-domain reconfiguration and noise thermometry are both established.", "url": "https://arxiv.org/abs/2608.19343", "type": "理论+数值", "summary": "1. 该工作提出一种自校准热干涉方案，在二维手性超导体中用可重构畴壁同时测量体拓扑对应的马约拉纳模数目与局域涡旋宇称。\n2. 其技术要点是同一畴壁在开态作为弹道通道，以量子化热导计数边缘模；在闭态作为法布里-珀罗腔，涡旋宇称改变引起半能级间距谱移，并给出两级热导与完整计数统计。\n3. 结合菱方石墨烯参数，亚微米环路在毫开温度下即可进入可分辨区，为手性超导体拓扑序的探测提供了自校准的热干涉途径。", "summary_source": "deepseek", "authors": [{"name": "Kumar Ghosh"}], "featured_authors": [{"name": "Kumar Ghosh"}], "author_count": 1}, {"id": "2608.19365", "category": "cond-mat", "title": "Layered matter that maintains spacing but loses stacking order", "abstract": "In layered materials, spacing and stacking-order extent are usually locked. Here we show that in swollen suspensions of stiff, charged nanosheets they decouple, and that this defines a distinct regime, apart from the crystalline- and Wigner-swelling regimes such systems usually occupy. The mean spacing stays sharp and salinity-tunable while scattering-weighted stacking spans only two to three layers. We demonstrate this in a near-perfect model material, so the behaviour is intrinsic, not defect-driven. X-ray and neutron scattering, sedimentation and a Donnan analysis show the spacing is held by a parameter-free osmotic restoring slope below one pascal per nanometre. Because the slope is so weak, the spacing sits at equilibrium while faults relax slowly, a quenched metastable registry whose ageing-like relaxation of low-dimensional periodic order has not, to our knowledge, been realised before. The same decoupling is expected across stiff, swollen nanosheets, from clays to oxide nanosheets and graphene oxide.", "url": "https://arxiv.org/abs/2608.19365", "type": "理论", "summary": "1. 该工作通过近乎完美的模型体系证明，刚性带电纳米片溶胀悬浮液中层间距与堆垛有序度可解耦，前者保持锐利且随盐度可调，后者仅覆盖两至三层。\n2. 结合X射线/中子散射、沉降与Donnan分析，间距由低于每纳米1帕的无参数渗透恢复斜率维持，使间距处于平衡而堆垛缺陷缓慢弛豫，形成淬火亚稳堆垛配准。\n3. 该解耦行为定义了不同于晶体或Wigner溶胀的新区间，并预期普遍存在于黏土、氧化物及氧化石墨烯等刚性溶胀纳米片体系，为独立调控间距与堆垛无序提供途径。", "summary_source": "deepseek", "authors": [{"name": "Osvaldo Trigueiro Neto"}, {"name": "Paulo Henrique Michels-Brito"}, {"name": "Bruno Ceccato Telli"}, {"name": "Natalie Jasmin Eichstaedt"}, {"name": "Leide P. Cavalcanti"}, {"name": "Tomás S. Plivelic"}, {"name": "Josef Breu"}, {"name": "Jon Otto Fossum"}], "featured_authors": [{"name": "Osvaldo Trigueiro Neto"}, {"name": "Paulo Henrique Michels-Brito"}, {"name": "Bruno Ceccato Telli"}, {"name": "Tomás S. Plivelic"}, {"name": "Josef Breu"}, {"name": "Jon Otto Fossum"}], "author_count": 8}, {"id": "2608.19391", "category": "cond-mat", "title": "State convertibility and fluctuation theorems from a dynamical reference: majorization meets martingales", "abstract": "State convertibility represents a fundamental concept used to determine whether a transformation is possible given a specific set of resources. Within the field of Thermodynamics, where physical process are required to preserve a reference state typically in microcanonical or canonical form, this translates into the notions of majorization and thermo-majorization ---criteria that require constructing and comparing state-dependent Lorenz curves. In this work, we firstly unify and extend these notions to an arbitrary and possibly time-dependent reference distribution $g(t)$, introducing the concept of $g(t)$-majorization; we then introduce a dual picture whereby state convertibility is turned into a one-dimensional convex-order problem, which allows us to demonstrate that a transition is admissible if and only if the associated real-valued distributions of relative populations $ k_j(t)/g_j(t)$ are connected by a martingale. Building on it, we then derive an exact fluctuation theorem for a reference-relative entropy production whose average violation certifies, through a $\\chi^{2}$-divergence bound, the mismatch between an assumed and the true reference evolution---a model-independent diagnostic that requires no independent characterization of the latter and turns an observed breakdown of the fluctuation relation into a certified lower bound on the reference error.", "url": "https://arxiv.org/abs/2608.19391", "type": "理论+数值", "summary": "1. 该工作将态可转换性推广到任意且可随时间变化的参考分布g(t)，提出g(t)-支配判据，并建立等价的鞅刻画。\n2. 其核心在于把转换允许性问题转化为一维凸序下的鞅连接，进而导出关于参考相对熵产生的精确涨落定理，其平均违反受χ²散度下界约束。\n3. 这为参考演化未知或失配的热力学过程提供模型无关诊断，可将涨落关系的观测破坏转化为参考误差的可证下界，启发相关实验检验。", "summary_source": "deepseek", "authors": [{"name": "Davide Cugini"}, {"name": "Giacomo Guarnieri"}], "featured_authors": [{"name": "Davide Cugini"}, {"name": "Giacomo Guarnieri"}], "author_count": 2}, {"id": "2608.19485", "category": "cond-mat", "title": "Statistical complexity from fluctuations in the information content", "abstract": "We argue that the variance of the information content ($C$), an information-theoretic quantity, can be naturally interpreted as a measure of statistical complexity. We show that $C$ satisfies widely accepted criteria for statistical complexity measures: it vanishes for both ordered and equiprobable states, while attaining maxima in intermediate regimes, typically shifted toward order. This interpretation establishes direct connections with thermodynamics and phase transitions: for systems obeying Boltzmann--Gibbs statistics, $C$ is extensive and directly proportional to energy fluctuations and heat capacity. Moreover, unlike other statistical complexity measures, it attains a maximum at continuous phase transitions, as illustrated for the two-dimensional Ising model. Applications to chaotic maps and fractional Gaussian noise further indicate that $C$ captures nontrivial dynamical structure in different classes of correlated systems.", "url": "https://arxiv.org/abs/2608.19485", "type": "理论", "summary": "1. 该工作提出将信息含量的方差 C 解释为统计复杂度的自然度量，并在多个理论模型中检验其行为。\n2. 其核心卖点在于 C 满足复杂度度量公认判据：对有序与等概率态均为零，在偏向有序的中间区域取最大，且对玻尔兹曼-吉布斯系统正比于能量涨落与热容，在二维伊辛连续相变处达到峰。\n3. 这为将复杂度与热力学涨落、相变及混沌和长程关联动力学统一诊断提供了可操作的统计工具。", "summary_source": "deepseek", "authors": [{"name": "Renio S. Mendes"}, {"name": "Sergio Picoli"}, {"name": "Evaldo M. F. Curado"}], "featured_authors": [{"name": "Renio S. Mendes"}, {"name": "Sergio Picoli"}, {"name": "Evaldo M. F. Curado"}], "author_count": 3}, {"id": "2608.19573", "category": "cond-mat", "title": "Free Energy of Non-uniform Disordered Superconductors", "abstract": "We extend the Luttinger-Ward free energy functional to disordered superconductors and superfluids with arbitrary scattering mechanisms, including both impurity disorder and the presence of interfaces. The disorder is taken into account within the self-consistent $t$-matrix approximation, thus allowing for arbitrary impurity scattering strengths. It is shown that both the interface and the impurity scattering self-energy appear in the functional only implicitly, through self-consistently determined fermionic propagators. The free energy functional is formulated in terms of a generalized integral in the complex energy plane, which encompasses formulations both in terms of retarded/advanced propagators and in terms of Matsubara Green's functions by appropriately choosing the integration path. It can be applied, e.g., to spatially non-uniform and hybrid systems, triplet and other unconventional condensates, and strongly-correlated Fermi liquids. A particularly useful formulation in terms of the quasiclassical propagators is applied to unconventional non-uniform singlet and triplet superconductors and superfluids in an external Zeeman magnetic field.", "url": "https://arxiv.org/abs/2608.19573", "type": "理论", "summary": "1. 该工作将Luttinger-Ward自由能泛函推广至包含杂质无序与界面效应的非均匀超导/超流体，并采用自洽t矩阵近似处理任意强度杂质散射。\n2. 其技术卖点在于界面与杂质自能仅通过自洽确定的费米子传播子隐式进入泛函，复能量平面上的广义积分路径统一了推迟/超前与Matsubara格林函数表述。\n3. 该泛函适用于非均匀/混合、三重态及其他非常规凝聚体与强关联费米液体，其准经典形式可处理外磁场中的非均匀单态和三态超导/超流，为相关热力学计算提供统一框架。", "summary_source": "deepseek", "authors": [{"name": "Matthias Eschrig"}, {"name": "Anton B. Vorontsov"}], "featured_authors": [{"name": "Matthias Eschrig"}, {"name": "Anton B. Vorontsov"}], "author_count": 2}, {"id": "2608.19592", "category": "cond-mat", "title": "Dynamic Pseudogap Model", "abstract": "We formulate a microscopic theory of pseudogap formation generated by dynamic finite nesting vector ${\\bf Q}$ fluctuations with characteristic oscillation frequency $\\omega_0$, and damping $\\gamma$. Starting from a Hamiltonian describing electrons coupled to a classical Gaussian random field, we derive explicit double-series representations of the single-particle Green's function within an Abelian (commuting) approximation to the exact SU(2) time evolution. The resulting propagator naturally acquires a generalized Bogoliubov structure in which every stochastic scattering history is characterized by an effective dynamic gap, leading to a coherent superposition of dynamically broadened sidebands with complex Poisson weights. A central result of the theory is the emergence of a dynamically generated decoherence scale $\\Gamma_{\\rm eff}$ governing the crossover between two qualitatively different pseudogap regimes. For $\\omega_0>\\Gamma_{\\rm eff}$ the fluctuating field is resolved coherently and the double-series representation provides a controlled description of dynamic sideband formation. Conversely, when $\\Gamma_{\\rm eff}\\gtrsim\\omega_0$, coherence is progressively lost and the theory crosses over to the quasistatic fluctuating-gap regime described by the exact continued-fraction solution. The coherent and quasistatic descriptions are therefore interpreted as two complementary asymptotic limits of the same microscopic dynamic pseudogap model. The detailed results of numerical calculations for electron spectral density and density of states are presented for different sets of model parameters confirming this crossover over the broad range of model parameters.", "url": "https://arxiv.org/abs/2608.19592", "type": "理论+数值", "summary": "1. 该工作提出了由有限嵌套矢量Q的动态涨落所驱动的赝隙形成的微观理论，并导出电子单粒子格林函数的双级数表示。\n2. 其核心在于揭示了一个由动力学产生的退相干标度Γ_eff，统一描写从相干动态边带体系到准静态涨落赝隙体系的交叉，两者成为同一模型的两个互补渐近极限。\n3. 这一框架为在电子谱密度与态密度中识别动态赝隙的特征信号，以及联系铜氧化物等量子材料的光电发射和隧穿测量提供了明确的理论基础。", "summary_source": "deepseek", "authors": [{"name": "E.Z. Kuchinskii"}, {"name": "M.V. Sadovskii"}], "featured_authors": [{"name": "E.Z. Kuchinskii"}, {"name": "M.V. Sadovskii"}], "author_count": 2}, {"id": "2608.19604", "category": "cond-mat", "title": "Universality of long-wavelength behavior of composite-fermion Fermi liquid", "abstract": "A recent article evaluated the long-wavelength behavior of the projected static structure factor of the composite-fermion (CF) liquid within the zeroth-order microscopic theory and found $\\bar{S}(\\mathbf{q})\\sim q^3$, in disagreement with the $\\bar{S}(\\mathbf{q})\\sim q^3\\ln q$ behavior predicted by the Chern-Simons field theory for the Coulomb interaction. Here we consider the possibility that the discrepancy arises because the zeroth-order CF Fermi-liquid wave function used in that work does not properly capture the long wavelength behavior. We use CF diagonalization to significantly improve the wave function but do not find any evidence for $\\bar{S}(\\mathbf{q})\\sim q^3 \\ln q$ behavior. Additionally, we find that the small-$q$ behavior of $\\bar{S}(\\mathbf{q})$ is also insensitive to the form of the interaction between electrons, suggesting universality.", "url": "https://arxiv.org/abs/2608.19604", "type": "理论+数值", "summary": "1. 该工作通过复合费米子对角化改进波函数，重新检验复合费米子费米液体投影静态结构因子在长波极限下的行为。\n2. 结果显示S̄(q)仍遵循q³而非Chern-Simons场论预言的对数修正，且该标度对电子相互作用形式不敏感，支持其普适性。\n3. 这提示长波行为由复合费米子拓扑约束主导，为量子Hall理论的微观与场论描述之差提供了约束。", "summary_source": "deepseek", "authors": [{"name": "Aamir A. Makki"}, {"name": "Mytraya Gattu"}, {"name": "J. K. Jain"}], "featured_authors": [{"name": "Aamir A. Makki"}, {"name": "Mytraya Gattu"}, {"name": "J. K. Jain"}], "author_count": 3}, {"id": "2608.19605", "category": "cond-mat", "title": "Exact partition function of arithmetic Ising model", "abstract": "We present a compact formula for the exact partition function of the $d$-dimensional arithmetic Ising model (AIM). For a $2\\times2$ system, we express it analytically using the $q$-Hurwitz-Lerch zeta function and derive explicit forms for the free energy and entropy. Additionally, we find that the entropy increases at high temperatures, supporting the presence of entropic order.", "url": "https://arxiv.org/abs/2608.19605", "type": "理论", "summary": "1. 该工作提出了d维算术伊辛模型配分函数的紧致精确公式，并针对2×2系统借助q-Hurwitz-Lerch zeta函数解析地推导出自由能与熵的具体显式形式。\n2. 其主要物理与技术卖点在于严格证明了高温下熵随温度单调增加，进而从精确配分函数出发为熵序的存在提供了定量而直接的证据。\n3. 这使算术伊辛模型成为具有数论结构的可精确统计模型中一个难得的严格范例，并为后续探索熵序、相变结构与数论函数性质之间的潜在关联提供了清晰的理论支点。", "summary_source": "deepseek", "authors": [{"name": "Anu Dhochak"}, {"name": "Ken Kikuchi"}, {"name": "Shrinit Singh"}], "featured_authors": [{"name": "Anu Dhochak"}, {"name": "Ken Kikuchi"}, {"name": "Shrinit Singh"}], "author_count": 3}, {"id": "2608.19698", "category": "cond-mat", "title": "Interplay of exchange and spin-conserving scattering processes in a ferromagnetic two-sublattice system", "abstract": "In magnetic alloys or hybrid systems formed by molecular magnets coupled to a magnetic substrate, the exchange interaction leads to fast spin dynamics after excitation. We investigate the electronic charge and spin dynamics due to the exchange interaction in a two-sublattice system with antiferromagnetic coupling. We employ a simplified model for a ferrimagnetic alloy as a coupled system of itinerant and localized electron states together with an exchange coupling between the two. For the itinerant system we include electron-electron Coulomb scattering and electron-phonon scattering. We study numerically the heat-induced ultrafast magnetization dynamics due to the interplay of exchange scattering and spin-independent scattering processes and discuss different scenarios for the demagnetization and relaxation dynamics of the sublattices. Our results highlight the impact of spin-conserving electron-electron scattering processes on the exchange-driven spin dynamics on ultrashort timescales.", "url": "https://arxiv.org/abs/2608.19698", "type": "理论+数值", "summary": "1. 该工作数值研究了反铁磁耦合双子格系统中交换散射与自旋无关散射共同驱动的超快磁化动力学。\n2. 其核心是揭示自旋守恒电子-电子散射对交换主导的超短时间尺度自旋动力学的关键影响。\n3. 这为理解分子磁体/磁衬底等混合体系中退磁与弛豫机制提供了明确的理论启发。", "summary_source": "deepseek", "authors": [{"name": "Ariyan Tavakoli"}, {"name": "Kai Leckron"}, {"name": "Hans Christian Schneider"}], "featured_authors": [{"name": "Ariyan Tavakoli"}, {"name": "Kai Leckron"}, {"name": "Hans Christian Schneider"}], "author_count": 3}, {"id": "2608.19712", "category": "cond-mat", "title": "Internal cyclotron probe of the vertical polarizability of a surface-state electron on helium", "abstract": "We study a surface-state electron on liquid helium in a tilted magnetic field. The tilt couples the cyclotron ladder to the vertical Rydberg-like subbands of the same electron and thereby realizes a self-coupled Landau-subband Hamiltonian. In the far-detuned regime, the cyclotron line acquires a state-dependent shift described by standard second-order perturbation theory. The resulting expression identifies the cyclotron resonance as a direct probe of the dynamical polarizability of the vertical ladder. The theory is intrinsically multilevel. Exact diagonalization confirms a broad microwave window in which sizable state-dependent cyclotron shifts are expected while the system remains dispersive.", "url": "https://arxiv.org/abs/2608.19712", "type": "理论+数值", "summary": "1. 该工作研究倾斜磁场中液氦上表面态电子，使回旋阶梯与竖直里德伯子带耦合，建立自耦合朗道-子带哈密顿量。\n2. 其要点是在远失谐区得到由二阶微扰描述的态依赖回旋移动，从而将回旋共振确立为竖直阶梯动态极化率的直接探针。\n3. 精确对角化表明存在宽微波窗口，兼具可观态依赖移动与色散行为，为实验探测该极化率提供了可行谱学方案。", "summary_source": "deepseek", "authors": [{"name": "Kirill Shulga"}], "featured_authors": [{"name": "Kirill Shulga"}], "author_count": 1}, {"id": "2608.19810", "category": "cond-mat", "title": "A Central Disulfide Junction Drives Transient Network Formation in Elastin-Like Polypeptides, Enabling Low-Concentration Hydrogels", "abstract": "The self-assembly of associative triblock copolymers composed of a central hydrophilic elastin-like polypeptide (ELP) block and short fatty acid end groups (C16) was investigated in aqueous solution. In one system, the ELP contains 80 pentapeptide units (C16-80-C16), whereas in the other two C16-ELP40 chains were oxidatively coupled through their terminal cysteine residues to form a central disulfide bond, yielding C16-(40)2-C16. Despite their nearly identical molecular weights and compositions, the two polymers exhibit markedly different self-assembly behaviors. C16-80-C16 forms large hydrophobic aggregates that remain kinetically trapped and do not develop a dynamically connected network. In contrast, C16-(40)2-C16 forms very small associative nodes with an aggregation number of only $\\sim$3 chains. These nodes coexist with larger clusters and become dynamically interconnected at higher concentrations, leading to transparent hydrogels at concentrations as low as 2.5 wt %. Oscillatory rheology reveals a transient Maxwell network governed by a single relaxation process associated with the reversible association of the C16 end groups. SAXS, light scattering, cryo-TEM, and molecular modeling consistently support a model in which the central disulfide junction promotes transient network formation.", "url": "https://arxiv.org/abs/2608.19810", "type": "理论", "summary": "1. 该工作结合振荡流变学、SAXS、光散射、cryo-TEM和分子模拟，比较了含中央二硫键的C16-(40)2-C16与近同分子量、同组成的C16-80-C16两种ELP三嵌段聚合物的自组装行为。\n2. 其核心物理在于中央二硫键使缔合节点仅含约3条链，并驱动这些节点与较大团簇在更高浓度下动态互联，形成由C16端基可逆缔合控制、具有单一Maxwell弛豫的瞬态网络，从而在低至2.5 wt%浓度下形成透明水凝胶。\n3. 这表明通过控制缔合节点的拓扑尺寸而非仅改变疏水平衡，可设计低浓度可逆网络材料，并为其他缔合型多嵌段聚合物的凝胶化工程提供启发。", "summary_source": "deepseek", "authors": [{"name": "Tingting Zhang"}, {"name": "Jean-François Le Meins"}, {"name": "Jean-Paul Chapel"}, {"name": "Saron Catak"}, {"name": "Guillaume Goudounet"}, {"name": "Olivier Sandre"}, {"name": "Nadia Mahmoudi"}, {"name": "Christophe Schatz"}, {"name": "Bertrand Garbay"}], "featured_authors": [{"name": "Tingting Zhang"}, {"name": "Jean-François Le Meins"}, {"name": "Jean-Paul Chapel"}, {"name": "Nadia Mahmoudi"}, {"name": "Christophe Schatz"}, {"name": "Bertrand Garbay"}], "author_count": 9}, {"id": "2608.19884", "category": "cond-mat", "title": "A solvent-flux theory for nonequilibrium swelling dynamics of thermoresponsive microgels", "abstract": "Thermoresponsive microgels undergo large reversible size changes as temperature alters solvent quality. Predicting their nonequilibrium swelling and deswelling kinetics is challenging because polymer volume fraction, mechanical response, and solvent transport evolve during large volume changes. Here we develop a solvent-flux theory for the dynamics of a spherical microgel. The radius-change rate is driven by the osmotic-pressure imbalance across the particle boundary and resisted by water transport through the polymer network, yielding a nonlinear equation for the global swelling coordinate and a state- and temperature-dependent swelling diffusion coefficient, $D_{\\mathrm{SW}}(\\phi,T)$. In the linear-response regime, the theory recovers Tanaka--Fillmore exponential relaxation and the scaling $\\tau_\\mathrm{SW}\\sim R_{\\mathrm{eq}}^2\\gamma/K_{\\mathrm{eq}}$, while providing a microscopic interpretation of the polymer--solvent friction coefficient $\\gamma$. Beyond this limit, the model retains quadratic size scaling while accounting for state-dependent transport and mechanics. For pNIPAM microgels, it predicts asymmetric pathways, with deswelling faster than swelling over the same temperature interval. Finite thermalization produces a crossover from a microgel-controlled to a thermalization-controlled regime, in which the apparent relaxation time grows linearly with the external thermalization time and hysteresis-like loops emerge in the radius--temperature plane. A stochastic extension based on the Smoluchowski equation predicts transient broadening of the radius distribution during collapse, with maximal fluctuations in the volume-transition region. The theory links solvent transport, nonlinear swelling dynamics, thermalization effects, and nonequilibrium size fluctuations in responsive microgels.", "url": "https://arxiv.org/abs/2608.19884", "type": "理论", "summary": "1. 该工作提出溶剂通量理论，描述热响应微凝胶在温度改变时的非平衡溶胀与退溶胀动力学，以跨边界渗透压差驱动半径变化并受聚合物网络内水输运阻力控制。\n2. 其核心在于给出状态与温度依赖的溶胀扩散系数 D_SW(φ,T) 的非线性全局溶胀方程，在线性响应极限恢复 Tanaka-Fillmore 指数弛豫，并预测退溶胀快于溶胀及热化导致的滞后回线等非线性现象。\n3. 该框架将溶剂输运、力学响应、热化效应与非平衡尺寸涨落统一起来，为 pNIPAM 微凝胶动力学实验及基于 Smoluchowski 方程的随机扩展提供了可检验预言。", "summary_source": "deepseek", "authors": [{"name": "Arturo Moncho-Jordá"}, {"name": "Alessandro Patti"}, {"name": "Fabián A. García-Daza"}, {"name": "Alejandro Cuetos"}], "featured_authors": [{"name": "Arturo Moncho-Jordá"}, {"name": "Alessandro Patti"}, {"name": "Fabián A. García-Daza"}, {"name": "Alejandro Cuetos"}], "author_count": 4}, {"id": "2608.19969", "category": "cond-mat", "title": "Unmasking the internal structure of casein micelles through enzymatic hydrolysis: A SAXS study", "abstract": "Casein micelles, one of the most studied natural association colloids, are supramolecular assemblies of caseins and colloidal calcium phosphate that constitute the fundamental building blocks of dairy matrices. Despite extensive investigation, the internal structure of casein micelles remains debated. While $\\kappa$-casein is known to ensure colloidal stability of casein micelle suspension, the spatial organization of casein fractions and salts is still unresolved, and several structural models coexist. Small-angle scattering is a method of choice to probe biological colloids \\emph{in situ}, yet interpretation of scattering data remains challenging due to the hierarchical nature of casein micelles. Here we address this issue by probing micelle structure during enzymatic gelation induced by chymosin, which cleaves $\\kappa$-casein and triggers aggregation. Using time-resolved SAXS, we probe structural changes throughout the sol-gel transition over length scales from 3 nm to 3 $\\mu$m. First, we show that enzyme-driven aggregation, counterintuitively, reveals information about the internal organization of casein micelles: the reduction of specific surface area during gelation unmasks a high-q structural peak previously observed under contrast-matching conditions. Second, we report that $\\kappa$-casein cleavage leads to a gradual disappearance of the structural feature at intermediate scales. Analysis of the disappearance kinetics and comparison to structural models reveal that $\\kappa$-casein cleavage induces a progressive relaxation of the colloidal porous substructure, providing direct evidence for its contribution to micellar organization. More broadly, these results demonstrate that the gelation process provides unique access to the internal structure of biological colloids and offers new perspectives for interpreting scattering data in complex soft-matter systems.", "url": "https://arxiv.org/abs/2608.19969", "type": "理论+数值", "summary": "1. 该工作利用时间分辨小角X射线散射追踪凝乳酶诱导的酪蛋白胶束溶胶-凝胶转变，在3纳米至3微米的宽尺度范围内考察酶解过程中的结构演化。\n2. 其卖点在于，酶驱动聚集引起的比表面积减小揭露出此前仅在对度匹配条件下可见的高q结构峰，且κ-酪蛋白切割使中间尺度结构特征逐渐消失，证实其对胶束多孔亚结构组织的直接贡献。\n3. 这一结果说明凝胶化过程可成为探测生物胶体内部结构的独特窗口，并为复杂软物质散射数据的层级解释提供新视角。", "summary_source": "deepseek", "authors": [{"name": "Julien Bauland"}, {"name": "Ghazi Ben Messaoud"}, {"name": "François Boué"}, {"name": "Pascaline Hamon"}, {"name": "Florence Rousseau"}, {"name": "Thomas Gibaud"}, {"name": "Thomas Croguennec"}], "featured_authors": [{"name": "Julien Bauland"}, {"name": "Ghazi Ben Messaoud"}, {"name": "François Boué"}, {"name": "Florence Rousseau"}, {"name": "Thomas Gibaud"}, {"name": "Thomas Croguennec"}], "author_count": 7}, {"id": "2608.20003", "category": "cond-mat", "title": "Role of topology in scaling laws for studying mechanics in open-porous solids: Moving beyond classical Gibson-Ashby scaling", "abstract": "The elastic modulus of porous materials is commonly described using power-law scaling relations with relative density, where the scaling exponent is often interpreted in terms of the underlying deformation mechanism. However, in highly disordered porous networks, changes in density are generally accompanied by changes in network topology, which can substantially modify the apparent scaling behavior. In this paper, we propose a topology-informed framework that separates the intrinsic mechanical contribution from the effects of network structure. Three representative topological descriptors are considered: the mean coordination number, the fraction of the load-bearing backbone, and the tortuosity of the load paths. For each case, the corresponding density-dependent contribution to the apparent modulus-scaling exponent is derived and analyzed. The results show that variations in connectivity, mechanical participation of the solid phase, and load-path efficiency can all lead to apparent scaling exponents exceeding the intrinsic exponent associated with the local deformation mechanism. These effects are particularly pronounced at low relative densities, where network topology evolves most strongly. The framework provides a physically interpretable basis for understanding anomalous modulus-density scaling in disordered porous materials and highlights the need to consider topology explicitly alongside relative density.", "url": "https://arxiv.org/abs/2608.20003", "type": "理论", "summary": "1. 该工作提出拓扑感知框架，将无序开孔多孔固体表观弹性模量-相对密度标度中的本征力学贡献与网络拓扑贡献分离。\n2. 通过平均配位数、承载主骨架分数和载荷路径迂曲度三种描述符，推导各拓扑因素对表观标度指数的密度依赖性修正，并揭示低密度下其可超越局域变形机制对应的本征指数。\n3. 这一框架为解释无序多孔材料中异常的模量-密度标度提供了可物理解释的基础，并强调需将拓扑作为与相对密度并列的关键状态变量纳入本构描述。", "summary_source": "deepseek", "authors": [{"name": "Ameya Rege"}], "featured_authors": [{"name": "Ameya Rege"}], "author_count": 1}, {"id": "2608.20013", "category": "cond-mat", "title": "Exact Fluctuation-Response Relations for Underdamped Langevin Dynamics", "abstract": "Thermodynamic uncertainty relations connect current fluctuations to dissipation and are often rooted in fluctuation-response principles. In underdamped dynamics, however, conventional mean-current uncertainty relations can fail, while the underlying connection between fluctuations, response, and dissipation remains elusive. Here we uncover this structure by deriving an exact finite-time fluctuation-response equality for underdamped Langevin dynamics, valid for arbitrary time-dependent driving and general additive observables. The equality yields sharp response bounds and a variational characterization of the dynamically generated variance. Choosing the perturbation along the irreversible probability flow gives a friction-response thermodynamic uncertainty relation that can be saturated at any finite observation time, leading to an exact variational principle for the total entropy production. We further show that the conventional uncertainty factor of velocity-resolved currents can decay exponentially with dissipation even in driven free diffusion, while the friction-response factor retains its universal lower bound. These results establish response, rather than the mean current itself, as the quantity directly linking fluctuations and dissipation in underdamped dynamics.", "url": "https://arxiv.org/abs/2608.20013", "type": "理论+数值", "summary": "1. 该工作针对欠阻尼朗之万动力学，严格推导了在任意时变驱动与一般加性可观测量下均成立的有限时间涨落-响应等式。\n2. 其核心在于沿不可逆概率流施加微扰，导出可在任意有限时刻饱和的摩擦-响应热力学不确定关系，并给出总熵产生率的精确变分原理。\n3. 这表明连接涨落与耗散的基本量是响应而非平均流，同时速度分辨电流的常规不确定因子可随耗散指数衰减，为非平衡响应理论提供新框架。", "summary_source": "deepseek", "authors": [{"name": "Tan Van Vu"}, {"name": "Van Tuan Vo"}, {"name": "Ruicheng Bao"}, {"name": "Keiji Saito"}], "featured_authors": [{"name": "Tan Van Vu"}, {"name": "Van Tuan Vo"}, {"name": "Ruicheng Bao"}, {"name": "Keiji Saito"}], "author_count": 4}, {"id": "2608.20039", "category": "cond-mat", "title": "Anomalous behavior of native point defects in C2-ordered antiferromagnet $α$-MnO$_2$", "abstract": "$\\alpha$-MnO$_2$ is an emerging material for electronic, optoelectronic, and energy applications, owing to its structural flexibility and defect-driven functionality. During synthesis of $\\alpha$-MnO$_2$, native oxygen vacancies readily form and are typically compensated by foreign dopants. A thorough understanding of intrinsic defects is therefore essential for enabling controlled extrinsic doping and optimizing material performance. Using density functional approach, we investigate the structural, electronic, magnetic, and optical properties of the ground state C2-type antiferromagnetic $\\alpha$-MnO$_2$ in the presence of native point defects, including interstitials, vacancies, and antisites. We compute their thermodynamic stability, incorporating electrostatic corrections to eliminate spurious long-range interactions. Mn interstitial (Mn$_\\text{i}$) and Mn antisite O (Mn$_\\text{O}$) introduce shallow donor levels, whereas O-vacancy (V$_\\text{O}$) exhibit amphoteric behavior and act as compensating centers. The calculated defect formation energies reveal pronounced competition between donor- and acceptor-type native defects, leading to strong intrinsic defect compensation under both Mn-rich and O-rich growth conditions. Mn vacancy (V$_\\text{Mn}$) remains ionized across the band gap and behaves as a shallow acceptor, suggesting its potential role under suitable non-equilibrium growth conditions, whereas O antisite Mn (O$_\\text{Mn}$) forms deep acceptor levels. BSE@G$_0$$W_0$ calculations reveal a strongly anisotropic optical response in stoichiometric $\\alpha$-MnO$_2$, while native point defects introduce pronounced sub-gap excitations and enhanced dielectric screening, with vacancies producing the largest effect.", "url": "https://arxiv.org/abs/2608.20039", "type": "数值", "summary": "1. 该工作采用密度泛函方法系统研究了C2反铁磁有序α-MnO2中本征点缺陷（间隙、空位与反位）的热力学稳定性及其电子、磁性和光学性质。\n2. 核心发现是Mn间隙与Mn反位O引入浅施主能级，O空位呈两性并充当补偿中心，Mn空位为全带隙电离的浅受主，而O反位Mn形成深受主，且BSE@G0W0计算显示缺陷产生显著亚带隙激发和增强的介电屏蔽。\n3. 这为利用非平衡条件调控Mn空位受主、实现可控外掺杂，并为相关光电器件与能源材料的缺陷工程提供了明确理论指导。", "summary_source": "deepseek", "authors": [{"name": "Archana Sharma"}, {"name": "Brahmananda Chakraborty"}], "featured_authors": [{"name": "Archana Sharma"}, {"name": "Brahmananda Chakraborty"}], "author_count": 2}, {"id": "2608.20049", "category": "cond-mat", "title": "Effect of molecular constraints on vibrational and quasilocalized excitations in glasses", "abstract": "Recent years have seen substantial progress in elucidating the statistical physics of the vibrational properties of structural glasses. Although many real-world glasses relevant for science and technology are molecular, the majority of computational studies concerning the mechanical and vibrational properties of structural glasses employ simple atomistic glass-forming models. Thus, the effects of stiff molecular constraints on mechanical and vibrational glass physics remain largely unexplored. In this work, we directly compare the properties of a molecular computer glass with those of an atomistic model featuring the same inter-molecular interaction potential, and created using the same formation protocol. We find that the molecular glass features a higher degree of mechanical disorder, with larger mesoscopic correlation lengths, while at the same time it hosts a lower number of soft, quasilocalized vibrations per atom -- compared to the atomistic glass. We rationalize these differences by accounting for the reduction in the effective number of degrees of freedom induced by the stiff molecular constraints. We additionally find that nonlinear plastic modes --- that carry plastic deformation in driven glassy solids --- couple much more strongly to volumetric strains in the molecular glass. Future research directions are discussed.", "url": "https://arxiv.org/abs/2608.20049", "type": "理论", "summary": "1. 该工作直接对比了具有相同分子间相互作用势和相同形成流程的分子玻璃与原子玻璃，系统考察了刚性分子约束对振动谱及准局域激发的影响。\n2. 其核心物理发现是分子玻璃表现出更强的力学无序和更大的介观关联长度，而单位原子上的软准局域振动数目反而更少，同时非线性塑性模式与体积应变的耦合明显增强。\n3. 这些差别源于刚性分子约束导致的有效自由度减少，为理解真实分子玻璃中力学与振动性质的统计物理提供了新视角，并启示后续研究关注分子内约束的作用。", "summary_source": "deepseek", "authors": [{"name": "Keane Ramdin"}, {"name": "Edan Lerner"}], "featured_authors": [{"name": "Keane Ramdin"}, {"name": "Edan Lerner"}], "author_count": 2}, {"id": "2608.20156", "category": "cond-mat", "title": "Biorthogonal Conformal Dynamics in Non-Hermitian Quantum Quenches", "abstract": "Global quenches at one-dimensional critical points admit a boundary conformal field theory (BCFT) description in which Euclidean strip correlators are analytically continued to real time. We formulate this construction for interacting non-Hermitian critical systems, where a right ket alone does not specify the dynamical readout and the left covector is part of the microscopic quench protocol. Independent left and right preparations flowing to the same conformal boundary define the two temporal boundaries of a strip with generally complex one-sided extrapolation parameters; linear and antilinear symmetry pairings are exploited to constrain this geometry. In the interacting Yang-Lee spin chain, statically calibrated boundary data determine the biorthogonal dynamics of the complete-character return amplitude, a primary one-point function, and a spatial correlator. The imaginary part of the linear-paired extrapolation parameter predicts the temporal center of an independently evolved antilinear-paired one-point function at the $10^{-3}$ relative level; the same preparation phase controls local phase evolution and the analytic-continuation path of boundary blocks. Further results test this formalism with a direct field-on quench, mixed left and right preparations, and a complex five-state Potts fixed point with complex primary dimensions. These results establish a BCFT framework for biorthogonal global quenches in interacting non-Hermitian critical systems, in which complex temporal-boundary data organize universal post-quench dynamics.", "url": "https://arxiv.org/abs/2608.20156", "type": "理论", "summary": "1. 该工作把一维临界点全局淬火的边界共形场论方案推广到相互作用的非厄米临界系统，以左右独立制备定义双正交实时演化。\n2. 其技术卖点是用线性和反线性对称配对约束条带复外推参数，并在杨-李自旋链中由静态标定边界数据精确预言线性配对外推参数虚部对应的反线性配对单点函数时间中心。\n3. 该框架以复时间边界数据组织普适淬火后动力学，并对非酉临界不动点及混合左右制备的实时行为提供可直接检验的共形场论描述。", "summary_source": "deepseek", "authors": [{"name": "Yifan Liu"}], "featured_authors": [{"name": "Yifan Liu"}], "author_count": 1}, {"id": "2608.20168", "category": "cond-mat", "title": "Quantum Dissipative Paraelectricity", "abstract": "Whether a quantum system with a double-well effective potential undergoes spontaneous symmetry breaking depends not only on the potential landscape but also on the kinetics and the coupling with additional degrees of freedom. Here we introduce a quasi-exactly solvable model to study this problem in the context of ferroelectrics, with results that apply to a broad class of quantum phase transitions. Exploiting the analytical solutions, we provide a strict definition of the quantum paraelectric regime and identify a distinct quantum ferroelectric regime in which symmetry breaking can be realized without tunneling features. We then show that explicit symmetry breaking cannot be inferred from the order-parameter Hamiltonian alone, but requires additional couplings. This leads us to identify a regime of \\emph{quantum dissipative paraelectricity}, in which observable symmetry breaking is suppressed during the evolution toward the ground state, even when the double-well structure dominates over zero-point quantum fluctuations.", "url": "https://arxiv.org/abs/2608.20168", "type": "理论", "summary": "1. 该工作为研究量子双阱有效势中的自发对称破缺引入准精确可解模型，并指出判据不仅依赖势能形态，还取决于量子动力学及额外自由度的耦合。\n2. 借助解析解，作者严格定义量子顺电区，区分出无需隧穿特征即可实现对称破缺的量子铁电区，并证明显式破缺不能仅由序参量哈密顿量推断。\n3. 由此提出量子耗散顺电性：在弛豫向基态的过程中，即使双阱结构压过零点量子涨落，可观测对称破缺仍被抑制，为铁电相变与量子耗散研究提供新视角。", "summary_source": "deepseek", "authors": [{"name": "A. Cano"}], "featured_authors": [{"name": "A. Cano"}], "author_count": 1}, {"id": "2608.20221", "category": "cond-mat", "title": "Universal meson spectra near $(1+1)$-dimensional Ising criticality", "abstract": "Near $(1+1)$-dimensional [$(1+1)$D] Ising criticality, a magnetic perturbation induces confinement and produces a cascade of bound-state excitations known as mesons. Here we show these mesons share a universal mass scaling after independently rescaling the model-dependent microscopic couplings. The number of stable mesons is controlled by the lightest two-meson threshold, while the lightest-meson mass follows a continuous trajectory characterized by a single scaling parameter. Using Hamiltonian truncation method, we obtain the trajectory numerically in both Ising field theory and the near-critical mixed-field Ising chain (MFIC). Under the rescaling, the trajectory and stable-meson-count crossover windows of MFIC both collapse onto the field-theory results. To further demonstrate the above universal organization of the meson spectra, we consider a class of four-periodic spin-$1/2$ Heisenberg-Ising chains under transverse fields, whose parameter space contains a family of quantum Ising critical points. The Hamiltonian family includes effective spin models for the quasi-one-dimensional antiferromagnets Ba(Sr)Co$_2$V$_2$O$_8$. Using tensor-network calculations, we obtain the corresponding lightest-meson mass trajectory for BaCo$_2$V$_2$O$_8$ and find that it also collapse onto the same universal curve given by field-theory result. Our results suggest that the universal scaling structure of quantum Ising criticality extends into the nearby confining regime, governing the organization of the meson spectrum. They thereby provide a practical criterion for interpreting excitations of quasi-1D Ising-like magnets in mixed fields beyond $E_8$ integrability.", "url": "https://arxiv.org/abs/2608.20221", "type": "理论+数值", "summary": "1. 该工作通过哈密顿截断和张量网络计算，研究了近临界束缚态介子谱在多种一维横场自旋模型中的普适标度行为。\n2. 其核心发现在于，独立重标定微观耦合后，最轻介子质量沿单一参数连续轨道变化，稳定介子数由双介子阈值决定，使混合场伊辛链及BaCo₂V₂O₈等模型的谱系均塌缩到同一场论普适曲线。\n3. 这表明量子伊辛临界性的普适标度结构延伸至禁闭区，为非可积准一维伊辛类磁体在混合场中的激发提供了实用判据与解释框架。", "summary_source": "deepseek", "authors": [{"name": "Xiao Wang"}, {"name": "Jianda Wu"}], "featured_authors": [{"name": "Xiao Wang"}, {"name": "Jianda Wu"}], "author_count": 2}, {"id": "2608.20226", "category": "cond-mat", "title": "Splitting probabilities for Brownian motion with diffusing boundaries: Application to polymer translocation", "abstract": "We study the translocation of a polymer chain through a nanopore where the chain length fluctuates stochastically due to the polymerization-depolymerization processes at the chain ends. We map this process to an equivalent representation where the pore performs a stochastic random-walk-like process on a line in the presence of two diffusing sinks on either side of it with diffusion constants $D_1$ and $D_3$ respectively. The translocation process terminates when the pore hits either of the two outer diffusing sinks. In the case where the pore motion itself is diffusive with diffusion constant $D_2$, we compute exactly the splitting probability that the pore hits the left (right) sink before hitting the right (left) sink. We show that the splitting probability in the presence of mobile sinks is rather nontrivial compared to the classical case of immobile sinks (the latter corresponds to the case when the chain length is fixed). Furthermore, we also compute exactly the probability distribution of the translocation time and that of the chain length at the completion time of the translocation. We show that both distributions have power law tails with exponents that depend continuously on the diffusion constants $D_1$, $D_2$ and $D_3$. We validate our analytical predictions via numerical simulations. We then present numerical results for the case when the pore performs a fractional Brownian motion with Hurst exponent $0<H<1$, while the sinks are still diffusive.", "url": "https://arxiv.org/abs/2608.20226", "type": "理论+数值", "summary": "1. 该工作系统研究纳米孔穿链过程中因链端聚合与解聚造成的链长涨落，将聚合物穿孔映射为孔在两侧扩散阱之间的布朗运动，并精确求解分裂概率。\n2. 其核心在于解析得到移动边界下分裂概率及穿孔时间与终态链长分布的精确表达式，经数值模拟验证，并揭示幂律尾指数连续依赖三个扩散常数。\n3. 这为活细胞中聚合-解聚驱动的生物大分子穿膜输运提供可检验的理论预测，也为反常扩散与移动边界逃逸问题研究带来启发。", "summary_source": "deepseek", "authors": [{"name": "Alexander K. Hartmann"}, {"name": "Satya N. Majumdar"}, {"name": "Alberto Rosso"}], "featured_authors": [{"name": "Alexander K. Hartmann"}, {"name": "Satya N. Majumdar"}, {"name": "Alberto Rosso"}], "author_count": 3}, {"id": "2608.20269", "category": "cond-mat", "title": "Nonlinear Drude weight of the one-dimensional Hubbard model", "abstract": "We investigate nonlinear Drude weights (NLDWs) in the one-dimensional repulsive Hubbard model by combining exact Bethe-ansatz calculations with low-energy effective field theory. At quarter filling, we first derive the strong-coupling expansion of the NLDWs and confirm it numerically over a wide range of interaction strength. We then compare the numerical results with the prediction of the Tomonaga-Luttinger liquid (TLL) description including irrelevant perturbations. While band-curvature corrections yield finite contributions to higher-order NLDWs, the Umklapp interaction predicts divergent NLDWs when the order $n$ of the Drude weight exceeds a threshold determined by the TLL parameter. In contrast, finite-size scaling of the exact Bethe-ansatz results indicates that all calculated NLDWs remain finite in the thermodynamic limit, revealing a discrepancy between the exact results and the predictions of the low-energy effective field theory. At half filling, we analyze the finite-size scaling of the NLDWs across the Mott metal-insulator transition. We derive their asymptotic behavior in the insulating phase and propose a hyperscaling ansatz for NLDWs near the critical point, which is verified numerically. Our results clarify the interaction dependence and critical scaling of nonlinear transport coefficients in the one-dimensional Hubbard model and highlight limitations of the conventional low-energy effective description for higher-order transport.", "url": "https://arxiv.org/abs/2608.20269", "type": "理论+数值", "summary": "1. 该工作结合精确Bethe-ansatz与低能有效场论，研究了一维排斥性Hubbard模型在四分之一与半填充下的非线性Drude权重。\n2. 其核心在于揭示低能Tomonaga-Luttinger液体描述预言高阶NLDW因Umklapp散射发散，而精确有限尺寸标度表明热力学极限下所有NLDW有限，并在半填充Mott转变附近提出并验证了超标度假定。\n3. 这凸显了传统低能有效理论对高阶非线性输运系数的局限，为强关联一维系统的非线性响应及量子临界标度研究提供了可靠基准。", "summary_source": "deepseek", "authors": [{"name": "Tetsuya Iwasaki"}, {"name": "Hosho Katsura"}], "featured_authors": [{"name": "Tetsuya Iwasaki"}, {"name": "Hosho Katsura"}], "author_count": 2}, {"id": "2608.20325", "category": "cond-mat", "title": "Strange Metal Hall Effect in Underdoped BaFe$_2$(As$_{1-x}$P$_x$)$_2$", "abstract": "The unusual transport properties of strange metals point to the breakdown of the quasiparticle picture, the understanding of which remains one of the most vexing problems in physics. Here, we report investigations of the electrical Hall effect of the strange metal superconductor BaFe$_2$(As$_{1-x}$P$_x$)$_2$. We show that a doping-independent contribution to the Hall effect exists within a fan shaped region above a putative quantum critical point. This `strange metal Hall' contribution echoes many of the properties of the antiferromangetic Hall response, but attains universal properties that distinguish it from the effects of Fermi surface reconstruction. This is consistent with an underlying origin connected to the presence of critical fluctuations, tying it to observations of $T$-linear resistivity and the appearance of unconventional superconductivity.", "url": "https://arxiv.org/abs/2608.20325", "type": "理论", "summary": "1. 该工作报道了欠掺杂铁基超导体BaFe2(As1-xPx)2在奇异金属区的霍尔效应系统测量，并在量子临界点上方的扇形区域内识别出一个与掺杂浓度无关的奇异金属霍尔贡献。\n2. 其核心卖点在于该贡献具有普适标度行为，既复现反铁磁霍尔响应的关键特征，又能与费米面重构效应清楚区分，从而支持其源于量子临界涨落。\n3. 这一发现将霍尔响应与T-线性电阻率及非常规超导电性相联系，为奇异金属中准粒子图像失效的输运机制提供了新的实验约束和理论检验基准。", "summary_source": "deepseek", "authors": [{"name": "Augusto Ghiotto"}, {"name": "Darian Hall"}, {"name": "Yuanqi Lyu"}, {"name": "Kohtaro Yamakawa"}, {"name": "Sophie Rodehutskors"}, {"name": "Corina Dunn"}, {"name": "Philip J. W. Moll"}, {"name": "John Singleton"}, {"name": "Nikola Maksimovic"}, {"name": "James G. Analytis"}], "featured_authors": [{"name": "Augusto Ghiotto"}, {"name": "Darian Hall"}, {"name": "Yuanqi Lyu"}, {"name": "John Singleton"}, {"name": "Nikola Maksimovic"}, {"name": "James G. Analytis"}], "author_count": 10}, {"id": "2608.20330", "category": "cond-mat", "title": "Torus Berry Data Determine All-Genus Abelian Topological Orders", "abstract": "We show that for Abelian Chern-Simons topological orders, torus Berry matrices determine the all-genus extended TQFT. We identify the topological part of the projective Berry holonomy under metric deformations with the mapping-class-group representation of the Abelian Chern-Simons TQFT and prove that the normalized torus data reconstruct its finite quadratic module $(G,q)$. Recent work showed that $(G,q)$ classifies the extended theory up to symmetric monoidal natural isomorphism, then genus-one data determine the all-genus theory without choosing a $K$-matrix presentation. We also prove that, for normalized character row errors $\\delta<21.96$%, nearest-row decoding recovers the Abelian fusion algebra independently of the number of anyons. The result applies to Abelian fractional quantum Hall and spin-liquid phases described by even-lattice Chern-Simons theories.", "url": "https://arxiv.org/abs/2608.20330", "type": "理论", "summary": "1. 该文证明对阿贝尔陈-西蒙斯拓扑序，环面Berry矩阵确定其任意亏格上的扩展TQFT，即亏格一数据已包含整体拓扑结构的全部信息。\n2. 其技术要点是把度规形变下射影Berry和乐的拓扑部分等同于映射类群表示，并证明归一化环面数据可重构有限二次模(G,q)，无需选定K矩阵表象。\n3. 结论适用于偶格点陈-西蒙斯理论描述的分数量子霍尔与自旋液体，且对小于21.96%字符误差的最近行解码可恢复融合代数，为抗噪声拓扑量子态表征提供了可操作判据。", "summary_source": "deepseek", "authors": [{"name": "Daniel Galviz"}], "featured_authors": [{"name": "Daniel Galviz"}], "author_count": 1}, {"id": "2608.19293", "category": "hep-th", "title": "Constrained Scenarios of Non-Commutative Schwarzschild Black Holes with Global Monopoles from Van der Waals Behaviors", "abstract": "Combining thermodynamics and optics, we investigate the Van der Waals behaviors of non-commutative Schwarzschild black holes with global monopoles. First, we examine the constrained thermodynamic recovering such properties. Using these thermodynamic results, we approach the shadows by merging Event Horizon Telescope findings and the Van der Waals limits. In this context, we provide a machine learning study to determine the compatibility with the empirical data of M87^*, SgrA^*_{\\mathrm{VLTI}}, and SgrA^*_{\\mathrm{Keck}} black holes. As a result, we find that such a proposed model matches with the M87^* observational data.", "url": "https://arxiv.org/abs/2608.19293", "type": "理论", "summary": "1. 该工作综合运用热力学与光学手段，研究含有整体单极的非对易史瓦西黑洞的范德瓦尔斯行为，并分析维持这种性质的约束热力学情景。\n2. 其技术卖点在于将事件视界望远镜的阴影约束与范德瓦尔斯极限相结合，用机器学习评估M87*、SgrA*_VLTI和SgrA*_Keck数据与该模型的匹配程度。\n3. 该模型与M87*观测符合最好，而对银心候选体给出更紧限制，为从阴影观测甄别非对易时空与整体单极效应提供了定量路径。", "summary_source": "deepseek", "authors": [{"name": "Ismail Benyaich"}, {"name": "Maryem Jemri"}], "featured_authors": [{"name": "Ismail Benyaich"}, {"name": "Maryem Jemri"}], "author_count": 2}, {"id": "2608.19305", "category": "hep-th", "title": "Holographic Local Operator Quenches with Conserved Momentum and Spin", "abstract": "We investigate the holographic dictionary relating point particles carrying longitudinal momentum or angular momentum in asymptotically AdS$_3$ spacetimes to suitably regulated, time-evolved states created by local primary operators in the dual two-dimensional conformal field theory (2D CFT). We find that asymmetric left/right Euclidean smearing of local operators produces states carrying momentum, and the corresponding bulk excitation is a particle with conserved momentum. We compute the energy density and entanglement entropy in these states and in their dual back-reacted geometries, finding exact agreement between the CFT and gravity descriptions. We further extend this correspondence to particles with intrinsic spin, whose CFT duals are primary operators with unequal holomorphic and anti-holomorphic scaling dimensions. We again find a precise match between CFT and holographic calculations of energy densities and entanglement entropies. Finally, we explore applications of these setups beyond holography by deriving the evolution of Rényi entropies in 2D rational CFTs and introducing a new class of local quantum quench protocols with conserved longitudinal or angular momentum.", "url": "https://arxiv.org/abs/2608.19305", "type": "理论", "summary": "1. 本工作建立三维反德西特时空中携带纵向动量或角动量的点粒子与二维共形场论中局域初级算符生成的时间演化态之间的全息字典。\n2. 其技术卖点在于用不对称左右欧几里得涂抹构造带动量态，并将内禀自旋映射为全纯与反全纯标度维数不等的初级算符；能量密度与纠缠熵在引力与场论两侧精确一致。\n3. 该构造进一步导出二维有理共形场论中Rényi熵的演化，并提出携带守恒纵向或角动量的新型局域量子淬火协议，为全息以外的体系提供可检验预言。", "summary_source": "deepseek", "authors": [{"name": "Pawel Caputa"}, {"name": "Pedro Castellini Grand"}, {"name": "Justin R. David"}, {"name": "Rahul Metya"}], "featured_authors": [{"name": "Pawel Caputa"}, {"name": "Pedro Castellini Grand"}, {"name": "Justin R. David"}, {"name": "Rahul Metya"}], "author_count": 4}, {"id": "2608.19309", "category": "hep-th", "title": "3D Einstein action from 6D Kodaira-Spencer gravity", "abstract": "In view of embedding 3D gravity into topological string theory, we show that the dimensional reduction of 6D Kodaira-Spencer gravity on $\\text{AdS}_3\\times S^3$, i.e. the low-energy description of twisted holography, contains a subsector that coincides with the action of chiral 3D gravity on $\\text{AdS}_3$. Furthermore, we show that the full 3D Einstein action is obtained as the reduction of two independent complex-conjugate copies of 6D Kodaira-Spencer gravity. We perform the dimensional reduction explicitly at the level of the classical actions, extending our previous work that related the equations of motion of the two theories. Our reduction procedure is based on a novel rewriting of the non-local 6D Kodaira-Spencer action as a local 6D holomorphic Chern-Simons action for the gauge group $\\mathrm{SL}(2,\\mathbb{C})$, valid within a subsector of complex structure deformations that we identify. Our results provide a necessary step toward embedding the Euclidean path integral of 3D gravity into topological string theory.", "url": "https://arxiv.org/abs/2608.19309", "type": "理论", "summary": "1. 该工作将六维Kodaira-Spencer引力在AdS3×S3上约化，获得三维手征引力及完整爱因斯坦作用量。\n2. 技术卖点是把非局域六维作用量改写为SL(2,C)全纯陈-西蒙斯局域形式，从而显式完成经典约化。\n3. 这为将三维引力欧几里得路径积分嵌入拓扑弦理论提供了必要步骤。", "summary_source": "deepseek", "authors": [{"name": "Johanna Erdmenger"}, {"name": "Jonathan Karl"}, {"name": "Jani Kastikainen"}, {"name": "Henri Scheppach"}], "featured_authors": [{"name": "Johanna Erdmenger"}, {"name": "Jonathan Karl"}, {"name": "Jani Kastikainen"}, {"name": "Henri Scheppach"}], "author_count": 4}, {"id": "2608.19322", "category": "hep-th", "title": "The EEC-Hedron: Positivity Bounds on Energy Correlators", "abstract": "We study the constraints placed by energy positivity on general unitary quantum field theories. We show that the coefficients in the partial wave expansion of energy-energy correlators all must lie within a bounded region of parameter space, which we call the ``EEC-hedron''. For the particular case of conformal field theories, these positivity constraints on energy correlators lead to bounds on the allowed values of coefficients in the operator product expansion. We demonstrate this approach in the 3d Ising and $O(2)$ CFTs, deriving new bounds on OPE coefficients in both theories.", "url": "https://arxiv.org/abs/2608.19322", "type": "理论", "summary": "1. 该工作研究一般幺正量子场论中能量-能量关联函数所受的正性约束，并构造由分波展开系数构成的允许参数区域“EEC-hedron”。\n2. 其要点在于证明这些正性条件可转化为共形场论中算符乘积展开系数的有限界，并在三维Ising与O(2)临界点导出新的OPE系数不等式。\n3. 这为在非微扰量子场论中系统提取正性约束、并以关联函数数据交叉检验或压缩共形数据空间提供了清晰路径。", "summary_source": "deepseek", "authors": [{"name": "Bianka Meçaj"}, {"name": "Ian Moult"}, {"name": "Hidde Stoffels"}, {"name": "Matthew T. Walters"}, {"name": "Yuan Xin"}], "featured_authors": [{"name": "Bianka Meçaj"}, {"name": "Ian Moult"}, {"name": "Hidde Stoffels"}, {"name": "Matthew T. Walters"}, {"name": "Yuan Xin"}], "author_count": 5}, {"id": "2608.19324", "category": "hep-th", "title": "Black Holes, the Bethe Ansatz, and Elliptic Calogero--Moser Systems", "abstract": "We define a map from solutions of the Bethe Ansatz equations (BAEs) of four-dimensional $\\mathcal{N}=4$ super-Yang--Mills with arbitrary semisimple gauge algebra $\\mathfrak{g}$ to extrema and poles of the potential of the untwisted elliptic Calogero--Moser system of type $\\mathfrak{g}$. We conjecture the map to be a bijection on the preimage of the Calogero--Moser extrema, and show that it intertwines the symmetries of the two systems, both the gauge ones (torus, Weyl and center invariance) and a $\\mathrm{PSL}(2,\\mathbb{Z})$ action, so that solutions on both sides organize into orbits, each BAE orbit mapping onto a single orbit of Calogero--Moser extrema or poles. That the system produced is the untwisted one has a consequence: the conjectured correspondence between BAE solutions and vacua of the $\\mathcal{N}=1^\\ast$ deformation of $\\mathcal{N}=4$ on $\\mathbb{R}^{3,1}$, which are extrema of the twisted system, cannot extend to non-simply-laced $\\mathfrak{g}$. It also fails within the simply-laced cases, though not for $\\mathfrak{su}(N)$: we exhibit an $\\mathfrak{so}(8)$ solution that flows to a pole of the Calogero--Moser potential rather than to an extremum, and so has no $\\mathcal{N}=1^\\ast$ counterpart. We illustrate the map in detail for every rank-two $\\mathfrak{g}$, classical and exceptional alike, and use these cases as evidence for the conjecture.", "url": "https://arxiv.org/abs/2608.19324", "type": "理论", "summary": "1. 该文建立从四维\\( \\mathcal{N}=4 \\)超杨-米尔斯理论任意半单规范代数的Bethe拟设方程解，到无扭转椭圆Calogero-Moser系统势能极值与极点的映射，并猜想在极值原像上为双射。\n2. 其技术核心在于映射交织规范环面、Weyl、中心不变性与\\( \\mathrm{PSL}(2,\\mathbb{Z}) \\)作用，使两侧解按轨道对应，同时指出该对应无法推广到非单李代数，且\\( \\mathfrak{so}(8) \\)存在流向极点的反例。\n3. 作者对全部秩二经典与例外代数逐例验证，为猜想提供证据，并启发Bethe解流向Calogero-Moser极点这一现象可能对应\\( \\mathcal{N}=1^\\ast \\)理论之外的新物态。", "summary_source": "deepseek", "authors": [{"name": "Marco Fazzi"}, {"name": "Kuba Krawczyk"}], "featured_authors": [{"name": "Marco Fazzi"}, {"name": "Kuba Krawczyk"}], "author_count": 2}, {"id": "2608.19327", "category": "hep-th", "title": "Inflationary Bispectra and IR Physics from Quantum Simulators", "abstract": "Bose-Einstein condensates have been used successfully as quantum simulators for early-universe particle production. Here we extend this analogy to the interacting theory. To this end, we compute the leading interaction terms expected in a general experimental setup that determine the 3-point correlations. We apply them to cosmologically motivated expanding model universes, but also periodically oscillating ones. While expanding scale factors do not necessarily lead to easily observable signatures due to experimental constraints on the realizable scale factor, periodically driven ones produce resonant correlators that grow linearly over time and lend themselves well to experimental detection. One direct application of this analysis is the experimental study of late-time infrared divergencies often discussed in the context of massless scalars in de Sitter space.", "url": "https://arxiv.org/abs/2608.19327", "type": "理论", "summary": "1. 该工作将玻色-爱因斯坦凝聚体作为早期宇宙粒子产生的量子模拟器推广至相互作用理论，计算了决定三点关联函数的前导相互作用项。\n2. 其技术要点在于指出周期驱动标度因子可产生随时间线性增长的共振三点关联，从而规避膨胀标度因子受实验限制难以观测的问题。\n3. 这一分析为在量子模拟平台上实验研究德西特空间中无质量标量场晚期红外发散提供了直接途径。", "summary_source": "deepseek", "authors": [{"name": "Matthias Thomas Nowinski"}, {"name": "Ivo Sachs"}], "featured_authors": [{"name": "Matthias Thomas Nowinski"}, {"name": "Ivo Sachs"}], "author_count": 2}, {"id": "2608.19331", "category": "hep-th", "title": "Deep neural networks as lattice gauge theories", "abstract": "We modify the NN/QFT duality [1] to incorporate the layerwise permutation symmetry of the network, resulting in a $(0\\!+\\!1)$-dimensional lattice gauge theory, in which each layer of $N$ neurons acts as an $N$-component lattice site, and the weight matrices play the role of gauge fields living on the links. In this framework, we compute the tree-level neuron-neuron propagator which describes the evolution of layer variance in the network, and develop the Feynman diagram machinery to compute interactions in the perturbative expansion in $1/N$. In particular, we obtain a recursive expression for all corrections to the exact propagator at $O(1)$, representing statistical fluctuations in the ensemble of networks, including infinitely-many loop diagrams mediating the interactions from previous layers. We also present a preliminary analysis of neuron scattering amplitudes that contribute order-by-order in $1/N$, which provides a field-theoretic framework for studying higher-point correlations, and by extension information propagation, in deep networks. We remark on some interesting directions for future work at the intersection of neural networks and quantum field theory.", "url": "https://arxiv.org/abs/2608.19331", "type": "理论", "summary": "1. 该工作修改神经网络与量子场论的对偶关系，引入逐层置换对称性，将深度网络表述为(0+1)维格点规范理论，神经元为格点、权重矩阵为链接上的规范场。\n2. 其核心在于计算树级神经子传播子并建立1/N微扰的费曼图方法，给出O(1)精确传播子的全部修正，包含无穷多圈图，并初步分析神经散射振幅。\n3. 这为研究深度网络中的高阶关联与信息传播提供了场论化框架，并指明了神经网络与量子场论交叉方向的后续研究可能。", "summary_source": "deepseek", "authors": [{"name": "Ro Jefferson"}, {"name": "Shradha Ramakrishnan"}], "featured_authors": [{"name": "Ro Jefferson"}, {"name": "Shradha Ramakrishnan"}], "author_count": 2}, {"id": "2608.19346", "category": "hep-th", "title": "Quantum chaos and late-time equipartition of symmetry-resolved Krylov complexity", "abstract": "We study symmetry-resolved Krylov complexity in finite-dimensional chaotic quantum many-body systems. When both the Hamiltonian and the initial operator commute with a conserved charge, the operator dynamics decomposes into independent symmetry sectors, each with its own Krylov chain. We show that, after saturation, the unresolved Krylov complexity is additive over symmetry sectors. In the absence of additional Liouvillian degeneracies, the late-time contribution of a sector with Hilbert-space dimension $d_q$ is controlled by $d_q(d_q-1)$, leading to a dimension-weighted equipartition that approaches the simple large-sector scaling $d_q^2/\\sum_{q'}d_{q'}^2$. This late-time rule differs from the early-time weighted-average discussed in the literature and is governed instead by the dimensions of the accessible operator spaces. We support the analytic prediction with numerical studies of the real and complex SYK models, a chaotic bosonic spin model, and the mixed-field Ising chain. Our results show that resolving exact symmetries is essential for interpreting the saturation value of Krylov complexity as a diagnostic of chaotic operator growth.", "url": "https://arxiv.org/abs/2608.19346", "type": "理论", "summary": "1. 该工作研究了混沌量子多体系统中对称性分解的Krylov复杂度，证明饱和后未分辨总复杂度是各守恒荷扇区贡献的简单加和。\n2. 其关键结果是无附加Liouvillian简并时，晚期扇区贡献由d_q(d_q-1)控制，呈维度加权等分并趋于d_q^2/\\sum d_q^2，与早期加权平均不同。\n3. 这指明精确解析对称性对以Krylov复杂度饱和值诊断量子混沌算子增长不可或缺，并由实/复SYK、自旋模型及混合场Ising链数值支持。", "summary_source": "deepseek", "authors": [{"name": "Jayashish Das"}, {"name": "Suman Das"}, {"name": "Juan F. Pedraza"}, {"name": "Le-Chen Qu"}], "featured_authors": [{"name": "Jayashish Das"}, {"name": "Suman Das"}, {"name": "Juan F. Pedraza"}, {"name": "Le-Chen Qu"}], "author_count": 4}, {"id": "2608.19359", "category": "hep-th", "title": "Quantum effects of charged massive scalar fields on charged black hole space-times", "abstract": "We compute the renormalized expectation values of the scalar condensate, charge current and stress-energy tensor for a massive charged quantum scalar field on a Reissner-Nordstrom black hole. The mass of the scalar field is sufficiently large that classical superradiance is absent. We present results for the Boulware, Unruh and Hartle-Hawking states. Renormalized expectation values in the Hartle-Hawking state are computed using an efficient and accurate mode sum prescription, and for the other two states we employ state subtraction. The efficiency of our numerical method enables us to explore a large part of the parameter space, including near-extremal black hole charges and scalar field masses close to the superradiant limit.", "url": "https://arxiv.org/abs/2608.19359", "type": "理论", "summary": "1. 该工作计算了Reissner-Nordström黑洞上荷电大质量标量场的凝聚、荷流与应力张量的重整化期望值，覆盖Boulware、Unruh与Hartle-Hawking三种态。\n2. 其技术要点在于对Hartle-Hawking态采用高效的模和方案，对其余态采用态相减，从而能够扫描近极端电荷与接近超辐射极限的质量参数空间。\n3. 这为研究强场量子效应与黑洞荷动力学提供了可靠的数值工具，并对理解半经典背反应及超辐射边界附近的行为具有启发意义。", "summary_source": "deepseek", "authors": [{"name": "Cormac Breen"}, {"name": "George Montagnon"}, {"name": "Peter Taylor"}, {"name": "Elizabeth Winstanley"}], "featured_authors": [{"name": "Cormac Breen"}, {"name": "George Montagnon"}, {"name": "Peter Taylor"}, {"name": "Elizabeth Winstanley"}], "author_count": 4}, {"id": "2608.19373", "category": "hep-th", "title": "Krylov complexity and the growth of the black hole interior in 3D gravity", "abstract": "We investigate the growth of the black hole interior in three-dimensional gravity from the boundary theory. For the two-sided BTZ black hole, we propose a boundary reconstruction of the time dependence of a codimension-one surface in terms of correlation functions of smeared operators in the thermofield double state, reproducing the characteristic late-time linear growth predicted by the complexity-volume proposal. Using the Chern--Simons formulation of three-dimensional gravity, these nonlocal correlators are represented by bulk Wilson lines with smeared endpoints, extending the familiar connection between Wilson lines and codimension-two observables underlying holographic entanglement entropy to codimension-one observables. We then ask whether the same geometric growth is captured by Krylov complexity. For the smeared operators, we extract the Lanczos data from their correlation functions and find that operator Krylov complexity reproduces the late-time linear growth of the black hole interior, extending previous connections between operator growth and bulk geometry to AdS$_3$. By contrast, the Krylov spread complexity of the thermofield double state, obtained from the semiclassical gravitational partition function, does not exhibit the linear growth of the bulk volume within the regime accessible to our analysis. Our results therefore point to a distinguished role for operator Krylov complexity in encoding black hole interior growth beyond two-dimensional gravity, while highlighting a qualitative distinction between operator and state notions of Krylov complexity.", "url": "https://arxiv.org/abs/2608.19373", "type": "理论", "summary": "1. 该工作针对三维引力中BTZ黑洞内部体积的增长，在边界理论中提出用热场双态下涂抹算符的关联函数来重建余维一曲面，并复现复杂性-体积方案预言的晚期线性增长。\n2. 其技术卖点在于借助Chern-Simons形式将这类非定域关联函数实现为端点涂抹的体Wilson线，进而从关联函数提取Lanczos数据，证明算符Krylov复杂度重现内部体积的晚期线性增长。\n3. 相比之下，由半经典引力配分函数得到的态Krylov扩散复杂度在可分析区间内不呈现线性增长，这表明算符Krylov复杂度在编码黑洞内部生长中具有特殊作用，且算符与态两类复杂度行为存在本质区别。", "summary_source": "deepseek", "authors": [{"name": "Arpan Bhattacharyya"}, {"name": "Sounak Pal"}, {"name": "Juan F. Pedraza"}], "featured_authors": [{"name": "Arpan Bhattacharyya"}, {"name": "Sounak Pal"}, {"name": "Juan F. Pedraza"}], "author_count": 3}, {"id": "2608.19378", "category": "hep-th", "title": "Stochastic Schwinger Effect: de Sitter and beyond", "abstract": "We develop a stochastic formulation of the Schwinger effect in de Sitter spacetime using the Schwinger--Keldysh (in-in) formalism, tailored to particle production by non-stationary gauge backgrounds in the early Universe. Treating the gauge field as a prescribed classical stochastic ensemble, we integrate out massless charged matter and derive the corresponding influence functional and particle-production kernel to leading non-trivial order in the gauge coupling. Conformal invariance allows the result to be extended directly from de Sitter to generic spatially flat FLRW spacetimes, without relying on asymptotic out states. We establish the infrared safety and classicality conditions of the stochastic description and clarify its relation to the conventional static Schwinger effect. We further extend the framework to massless conformally coupled scalars and to weakly coupled non-Abelian gauge sectors, including Standard Model and hidden-sector examples, in regimes where thermal corrections are negligible. Our results provide a general framework for matter creation by stochastic gauge fields in inflation, preheating, and non-thermal BSM sectors, connecting quantum field theory in curved spacetime with early-Universe and high-energy phenomenology.", "url": "https://arxiv.org/abs/2608.19378", "type": "理论", "summary": "1. 该工作基于Schwinger-Keldysh形式建立了de Sitter时空中随机施温格效应的随机表述，处理非平稳规范背景下的粒子产生。\n2. 其技术核心是将规范场视为经典随机系综并积分掉无质量荷电物质，借助共形不变性推广到一般空间平坦FLRW时空，同时建立红外安全与经典性条件。\n3. 这为暴胀、预加热及非热BSM扇区中随机规范场产生物质提供了统一框架，连接弯曲时空量子场论与早期宇宙唯象学。", "summary_source": "deepseek", "authors": [{"name": "Lucas Vicente García-Consuegra"}, {"name": "Azadeh Maleknejad"}], "featured_authors": [{"name": "Lucas Vicente García-Consuegra"}, {"name": "Azadeh Maleknejad"}], "author_count": 2}, {"id": "2608.19400", "category": "hep-th", "title": "Lorent
