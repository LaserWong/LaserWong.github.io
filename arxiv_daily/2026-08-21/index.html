zian Kähler-Dirac fermions", "abstract": "We examine the formulation of Kähler fermions on spacetimes with Lorentz signature. In practice we focus on Minkowski spacetime since most of the difficulties that are encountered are visible even when the spacetime is flat. We show that the theory, when interpreted as a Lorentz invariant theory of forms or antisymmetric tensor fields, is non-unitary. We show that unitarity can be restored provided one adopts a modified inner product on the Hilbert space. This modified inner product requires the insertion of an operator J that anti-commutes with certain modes of the Kähler field in such a way as to guarantee all states have positive norm. We give an explicit (and local) form for J and show that while it commutes with the Hamiltonian, it is incompatible with the Lorentz transformation properties of the tensor fields. In flat space, the unitarized formulation is equivalent to 4 Dirac fermions.", "url": "https://arxiv.org/abs/2608.19400", "type": "理论", "summary": "1. 该工作研究了洛伦兹号差时空（重点为闵可夫斯基时空）中Kähler-Dirac费米子的表述。\n2. 其核心发现是：该理论若按洛伦兹不变的微分形式场论解释则非幺正，但通过引入与部分Kähler场模式反对易的局域算子J构造修正内积可恢复正模与幺正性，只是该修正与张量场的洛伦兹变换性质不相容。\n3. 在平坦时空中，这种幺正化表述等价于4个狄拉克费米子，为理解非幺正形式场论与幺正自旋-1/2粒子间的对偶提供了明确模型。", "summary_source": "deepseek", "authors": [{"name": "Simon Catterall"}, {"name": "Jay Hubisz"}], "featured_authors": [{"name": "Simon Catterall"}, {"name": "Jay Hubisz"}], "author_count": 2}, {"id": "2608.19418", "category": "hep-th", "title": "BCFW recursion for light-like Wilson loop correlators", "abstract": "We apply the idea of holomorphic linking ( arXiv:1101.1329 ) to correlators of multiple light-like loop operators in $\\mathcal{N}=4$ super Yang-Mills theory. This allows us to extend the BCFW recursion relations for planar scattering amplitude integrands or single Wilson loops in the planar theory to correlators of multiple loop operators. We discover a novel term which feeds the recursion for single loops into the relation for multiple loop operators. We illustrate the recursion relations with several examples and highlight its applicability in combination with the $\\bar{Q}$-equation for multiple loop operators. Finally, we again employ holomorphic linking to derive a recursion relation for colour-exact Wilson loop correlators.", "url": "https://arxiv.org/abs/2608.19418", "type": "理论", "summary": "1. 该工作将全纯链环思想应用于N=4超杨-米尔斯理论中多个类光威尔逊圈算符的关联子，建立了其BCFW递推关系。\n2. 其核心卖点是发现一个将单圈递推馈入多圈关联子递推的新项，能与\\bar{Q}方程结合，并进一步导出颜色精确威尔逊圈关联子的递推关系。\n3. 这为平面散射振幅、单圈与多圈威尔逊圈关联子之间递推结构的统一，以及非平面颜色精确计算提供了新的技术工具与理论启发。", "summary_source": "deepseek", "authors": [{"name": "James Drummond"}, {"name": "Matthew Rochford"}, {"name": "Rowan Wright"}], "featured_authors": [{"name": "James Drummond"}, {"name": "Matthew Rochford"}, {"name": "Rowan Wright"}], "author_count": 3}, {"id": "2608.19428", "category": "hep-th", "title": "Holographic Bit Threads from String-Diagrammatic Quantum Information Flow", "abstract": "Bit threads, arising as the convex dual of the minimal-surface formula for holographic entanglement entropy, are line-like structures with nontrivial bulk trajectories. Their physical picture has long been associated with Bell-pair interpretations, yet the meaning of their detailed trajectories, particularly their nonuniqueness, remains unclear. We propose to apply Coecke's notion of quantum information flow (QIF) in protocol-network geometry, developed within categorical quantum mechanics, to a holographic setup, and show that its trajectories within the discrete holographic bulk---the tensor network---obey the divergence-free and density-bound conditions of bit threads. From this process-centered perspective, bit-thread nonuniqueness becomes natural: for a given resource state, different protocols realizing the same distillation task can give rise to different QIF trajectories. We further analyze stabilizer-type holographic tensor networks using ZX string diagrams and show that QIF trajectories can probe finer entanglement structure beyond the level captured by entanglement entropy.", "url": "https://arxiv.org/abs/2608.19428", "type": "理论", "summary": "1. 该工作将范畴量子力学中协议网络几何的量子信息流概念应用于全息张量网络，据此重新诠释全息纠缠熵位线的体轨迹。\n2. 其核心在于用ZX弦图证明离散全息体中量子信息流轨迹满足位线的无散度与密度束缚条件，并将位线非唯一性自然解释为实现同一蒸馏任务的不同协议。\n3. 该过程中心视角使量子信息流轨迹能探测超越纠缠熵的精细纠缠结构，为全息量子信息流与协议网络几何的交叉研究提供了新启发。", "summary_source": "deepseek", "authors": [{"name": "Yi-Yu Lin"}, {"name": "Song Cheng"}], "featured_authors": [{"name": "Yi-Yu Lin"}, {"name": "Song Cheng"}], "author_count": 2}, {"id": "2608.19539", "category": "hep-th", "title": "Higher Chern--Simons Theory in $2n+2$ Dimensions for Balanced 2-term $L_\\infty$-Algebras", "abstract": "We construct a semistrict higher Chern--Simons (HCS) gauge theory in $2n+2$ dimensions associated with balanced 2-term $L_\\infty$-algebras. Starting from the homotopy Maurer--Cartan theory, we first introduce 2-term $L_\\infty$-algebra gauge theory, and show that there is a four-dimensional HCS construction. Then we extend invariant bilinear pairings to invariant multilinear forms of the appropriate degree, and define a $(2n+3)$-dimensional higher Pontryagin--Chern form, which is closed and invariant under infinitesimal gauge transformations. Its transgression yields an explicit $(2n+2)$-dimensional HCS form. We further establish a higher Chern--Weil theorem that generates higher transgression forms, and prove that the HCS theory is a distinguished instance of the higher transgression gauge theory. Finally, we apply the extended Cartan homotopy formula in this semistrict setting, and show that it is a common origin of both the higher Chern--Weil theorem and the associated triangle equation.", "url": "https://arxiv.org/abs/2608.19539", "type": "理论", "summary": "1. 该工作基于平衡二项L∞代数构造了2n+2维半严格高阶Chern–Simons规范理论，并建立了相应的高阶Chern–Weil定理。\n2. 其技术核心在于将不变双线性型推广为适当次数的不变多重线性型，借助高阶Pontryagin–Chern形式的超度得到闭且规范不变的Chern–Simons形式。\n3. 这为高维拓扑场论与L∞代数规范理论的统一提供了清晰框架，并可能启发更多高阶超度规范理论的构造。", "summary_source": "deepseek", "authors": [{"name": "Danhua Song"}, {"name": "Yibo Wang"}], "featured_authors": [{"name": "Danhua Song"}, {"name": "Yibo Wang"}], "author_count": 2}, {"id": "2608.19720", "category": "hep-th", "title": "Tropical and Stringy Integrals for In-In Correlators", "abstract": "We introduce tropical and stringy integrals for fixed-graph contributions to cosmological in-in correlators of conformally coupled scalars. The full-time representation factorizes into a graph-dependent vertex-space Laplace integral, with one real variable for each graph vertex, and an elementary edge-space Laplace integral, with one real variable for each internal edge. The vertex-space exponent is a sum of absolute values associated with sites and relative edge times; as a piecewise-linear function, it is the support function of the in-in zonotope. Each absolute value is also the tropical limit of a positive Laurent binomial. Retaining these binomials before tropicalization defines a finite-$\\alpha'$ vertex-space stringy integral, so both the polytope and its stringy integral are read directly from the physical time integral. In the $\\alpha' \\to 0$ limit this integral becomes the normalized dual volume of the in-in zonotope, while the edge-space factor deforms independently into a product of beta integrals and restores the elementary propagator normalization. We derive the field-theory rational form from augmented-graph chambers, as well as exact finite-$\\alpha'$ parallel-edge reduction, factorization formulas for edge-energy and partial-energy poles, and even descendant towers. As an alternative geometric realization of fixed-graph correlators, we find an ambient Minkowski-sum and stringy-integral realization of the graph correlahedron for a tree graph as the so-called graph cubeahedron of its line graph. For completeness, we also record the logarithmic critical equations and generic reference degrees of the associated affine divisor arrangement.", "url": "https://arxiv.org/abs/2608.19720", "type": "理论", "summary": "1. 该工作为共形耦合标量场的宇宙学 in-in 关联函数建立了热带与弦积分表示，将固定图贡献分解为顶点空间和边空间上的拉普拉斯积分。\n2. 其核心在于顶点空间指数是 in-in 佐诺托普的支撑函数，且每个绝对值可看作正洛朗二项式的热带极限；保留二项式得到有限 α′ 弦积分，其 α′→0 极限给出佐诺托普的归一化对偶体积，边因子则独立形变为 β 积分。\n3. 这一几何实现将树图关联函数的图相关体解释为线图的图立方体，并为场论有理形式、极点的能量与部分能量分解以及后代塔提供了统一推导。", "summary_source": "deepseek", "authors": [{"name": "Song He"}, {"name": "Xiang Li"}, {"name": "Yong-Xiang Su"}, {"name": "Fan Zhu"}], "featured_authors": [{"name": "Song He"}, {"name": "Xiang Li"}, {"name": "Yong-Xiang Su"}, {"name": "Fan Zhu"}], "author_count": 4}, {"id": "2608.19775", "category": "hep-th", "title": "Supergroup Gauged Linear Sigma Models and their Physical Mathematics", "abstract": "We construct 2d $\\mathcal{N}=(2,2)$ gauged linear sigma models with $\\mathrm{U}(1|1)^N$ supergauge group possibly with superpotential. Despite being nonunitary, one can still study their space of supersymmetric states and explore their applications to mathematics. In particular, we find a relation between a nonlinear sigma model on a Calabi-Yau complete intersection of hypersurfaces in a super-Grassmannian and a supergauged Landau-Ginzburg orbifold, which can reduce to a regular Calabi-Yau/Landau-Ginzburg correspondence for complete intersections. This defines a super-Grassmannian/supergroup generalization of the correspondence proved by Clader [1] and Zhao [2]. Similarly, we find a relation between a nonlinear sigma model on a Calabi-Yau hypersurface in a product of super-Grassmannians and a hybrid NLSM/supergauged Landau-Ginzburg orbifold, which can reduce to a regular hybrid Calabi-Yau/Landau-Ginzburg correspondence for hypersurfaces in product space. This defines a super-Grassmannian/supergroup generalization of the correspondence proved by Fan-Jarvis-Ruan [3]. We also find that Calabi-Yau supervector bundles over a super-Grassmannian can undergo a physically related mild topology change which is reducible to a regular Atiyah-type flop transition. This defines a super-Grassmannian generalization of a birational equivalence of Calabi-Yau vector bundles in mathematics. Similarly, we find that a Calabi-Yau complete intersection of quadrics in a super-Grassmannian can also undergo a physically related topology change which is reducible to a regular conifold transition. This defines a super-Grassmannian generalization of a homological projective duality for Calabi-Yau quadrics by Kuznetsov-Perry [4] in mathematics.", "url": "https://arxiv.org/abs/2608.19775", "type": "理论", "summary": "1. 该工作构造了带U(1|1)^N超规范群及超势的二维N=(2,2)超规范线性sigma模型，并在非幺正情形下研究其超对称态空间。\n2. 其核心在于建立超Grassmannian上Calabi-Yau完全交与超规范Landau-Ginzburg orbifold的对应，统一推广了Clader-Zhao与Fan-Jarvis-Ruan的CY/LG对应，并发现可约化为Atiyah型flop与conifold转变的拓扑变化。\n3. 这为从非幺正量子场论导出代数几何对偶（如同调投影对偶）提供了物理数学路径，或可激发更多超群推广。", "summary_source": "deepseek", "authors": [{"name": "Arif Er"}, {"name": "Zhangcheng Liu"}, {"name": "Meng-Chwan Tan"}], "featured_authors": [{"name": "Arif Er"}, {"name": "Zhangcheng Liu"}, {"name": "Meng-Chwan Tan"}], "author_count": 3}, {"id": "2608.19795", "category": "hep-th", "title": "A Stationary Composition Law for Schwinger-Keldysh Effective Actions", "abstract": "Let $W_{\\cal O}[J]$ and $W_{\\cal C}[J]$ denote the connected generating functionals of an open system and its closed system counterpart, and define the environment-induced contribution $W_{\\rm IF}[J]$ by the difference: $ W_{\\rm IF}[J]\\equiv W_{\\cal O}[J]-W_{\\cal C}[J].$ The corresponding Legendre transforms, $\\Gamma_{\\cal O}$, $\\Gamma_{\\cal C}$, and $\\Gamma_{\\rm IF}$, do not obey an analogous additive relation but satisfy a stationary composition law given by: \\[ \\Gamma_{\\cal O}[\\Phi] = \\operatorname*{Stat}_{\\Psi} \\left\\{ \\Gamma_{\\cal C}[\\Psi] + \\Gamma_{\\rm IF}[\\Phi-\\Psi] \\right\\} \\] where ${\\rm Stat}$ denotes evaluation at a solution of the stationarity condition with respect to $\\Psi$. This variational composition applies to both local and nonlocal Schwinger-Keldysh effective actions in nonequilibrium quantum field theory. We illustrate its linear and nonlinear realizations through quadratic theories and general time independent effective actions, respectively.", "url": "https://arxiv.org/abs/2608.19795", "type": "理论", "summary": "1. 该文推导了开放系统与封闭系统 Schwinger-Keldysh 有效作用量之间的驻点组合律。\n2. 其核心是证明了生成泛函之差经 Legendre 变换后满足变分组合式，并适用于局域与非局域非平衡量子场论。\n3. 这为分解环境诱导贡献、构造开放系统有效场论提供了新的形式框架与计算路径。", "summary_source": "deepseek", "authors": [{"name": "Denis Comelli"}], "featured_authors": [{"name": "Denis Comelli"}], "author_count": 1}, {"id": "2608.19845", "category": "hep-th", "title": "Holographic Dual of Synge's Identity in AdS/CFT", "abstract": "We identify CFT counterparts of Synge's identity for finite AdS geodesics in arbitrary dimensions. Starting from exact finite bulk--boundary pairs, the Synge equation induces endpoint scale equations for a Weyl-frame scalar two-point function and for the finite entanglement entropy between disjoint balls. In the planar frame, the common-scale correlator equation is the dilatation Ward identity. In the entanglement sector, the corresponding relative-scale equation is governed by a transverse hyperbolic area and reduces in two dimensions to the previously identified entanglement RG equation.", "url": "https://arxiv.org/abs/2608.19845", "type": "理论", "summary": "1. 该工作针对任意维 AdS/CFT，建立了有限 AdS 测地线 Synge 恒等式的全息对偶，并给出其诱导的边界端点标度方程。\n2. 其核心是把精确有限体边配对代入 Synge 方程，分别得到外尔标架标量两点函数的公共标度方程（平面情形即膨胀 Ward 恒等式）以及分离球纠缠熵的相对标度方程，后者由横向双曲面积控制并在二维约化为纠缠 RG 方程。\n3. 这为从体测地线几何导出边界共形与纠缠标度约束提供了新途径，可进一步用于研究有限纠缠结构及全息 RG 流。", "summary_source": "deepseek", "authors": [{"name": "Bingbing Chen"}, {"name": "Deyou Chen"}], "featured_authors": [{"name": "Bingbing Chen"}, {"name": "Deyou Chen"}], "author_count": 2}, {"id": "2608.19859", "category": "hep-th", "title": "One more Sine-Gordon soliton in AdS", "abstract": "In previous work arXiv:2604.00160 , we found soliton solutions in a deformation of the sine-Gordon theory in AdS spacetime that, in the infinite-radius limit, reduce to single-soliton solutions in flat space. In this paper, we find another single soliton solution that has no analog in flat space.", "url": "https://arxiv.org/abs/2608.19859", "type": "理论", "summary": "1. 该工作在AdS时空中的变形sine-Gordon理论里找到了另一个单孤子解，且该解不随AdS半径趋于无穷而退化为平坦时空中的单孤子。\n2. 其核心特点在于该定域激发完全依赖AdS的弯曲几何或边界条件而存在，在平坦空间中无对应物，体现了曲率对可积系统中孤子谱的实质影响。\n3. 这为AdS背景下可积变形与精确孤子分类提供了新例证，或对全息框架中与边界条件相关的孤立子激发研究有所启发。", "summary_source": "deepseek", "authors": [{"name": "D. V. Diakonov"}], "featured_authors": [{"name": "D. V. Diakonov"}], "author_count": 1}, {"id": "2608.19896", "category": "hep-th", "title": "Massive spin-2 supermultiplet and supergravity", "abstract": "In this work, we consider the interaction of massless $N=1$ supergravity with a massive (2,3/2,3/2,1) supermultiplet, as a possible candidate for a supersymmetric extension to bigravity. A gauge invariant description for massive spin-2, spin-3/2 and spin-1 fields is used. As a result of this, ambiguities arise related to possible field redefinitions, which are fixed by using a recently proposed method based on unfolded equations, and by restricting ourselves to interactions with the minimum number of derivatives (two for bosonic and one for fermionic vertices). It appears that this completely fixes the entire construction.", "url": "https://arxiv.org/abs/2608.19896", "type": "理论", "summary": "1. 该工作构造了无质量N=1超引力与巨超多重态(2,3/2,3/2,1)的相互作用，作为超对称双引力的候选理论。\n2. 其技术卖点在于借助展开方程方法并限制最小导数阶数，消除了场重定义引起的全部歧义，从而唯一确定整个构造。\n3. 这为超对称大质量引力与高自旋规范耦合的后续研究提供了完全自洽的模型框架。", "summary_source": "deepseek", "authors": [{"name": "Yu. M. Zinoviev"}], "featured_authors": [{"name": "Yu. M. Zinoviev"}], "author_count": 1}, {"id": "2608.19941", "category": "hep-th", "title": "A Note on a High-Energy Limit of Gravitational Perturbation Theory", "abstract": "The post-Minkowskian expansion of general relativity expands the metric in Newton's constant G around flat space-time, but much effort currently focuses on ways to extend its range of applicability by summing the perturbative series to all orders. A regime of particular interest is a specific high-energy limit where a formula derived recently provides the momentum kick of binary scattering problem to all orders, and even suggests an approach towards strong coupling. We show that this is an asymptotic expansion. Although the series diverges we give evidence that it is Borel summable, and the full function in integral form is finite. As a by-product we determine the transcendentality properties of the coefficients in the expanded expression.", "url": "https://arxiv.org/abs/2608.19941", "type": "理论", "summary": "1. 该工作分析了引力微扰论后闵氏展开在高能极限下的性质，指出此前提出的全阶动量递推公式对应一个渐近级数。\n2. 其技术核心在于证明该发散级数仍可博雷尔求和，并给出有限积分形式的完整函数，同时确定了展开系数的超越性。\n3. 这为全阶求和与强耦合区域的研究提供了严格基础，也提示类似可求和性可能适用于更广的散射问题。", "summary_source": "deepseek", "authors": [{"name": "Poul H. Damgaard"}, {"name": "Ludovic Plante"}], "featured_authors": [{"name": "Poul H. Damgaard"}, {"name": "Ludovic Plante"}], "author_count": 2}, {"id": "2608.19948", "category": "hep-th", "title": "Hilbert space relation from dS to AdS through Reflection Positivity", "abstract": "De Sitter unitarity and reflection positivity are logically independent. We study their relation for a free scalar field on a fixed de Sitter background, restricting attention to the one-particle sector. Motivated by Witten's de Sitter pairing and the radial adjoint of Bousso, Maloney and Strominger, we compose the invariant Hilbert product with equatorial reflection. In the standard principal-series realization, this form vanishes identically and its Osterwalder-Schrader quotient contains no states. For the complementary series, the reflected product becomes a nonzero reflected kernel on the unit ball. A result of Neeb and Ólafsson shows that this kernel is positive semidefinite precisely when the lower weight satisfies the scalar conformal unitarity bound. The resulting Hilbert space with the reflected inner product furnishes a positive-energy representation of AdS isometries according to Neeb and Ólafsson. We identify that the range coincides with the Klebanov-Witten alternative-quantization window from physics point of view. This correspondence suggests a novel relation from the representation viewpoint between AdS and dS without the conventional analytic continuation of radius.", "url": "https://arxiv.org/abs/2608.19948", "type": "理论", "summary": "1. 该工作研究固定 de Sitter 背景上自由标量场单粒子扇区中 dS 幺正性与反射正定性的关系，并用赤道反射构造反射 Hilbert 内积。\n2. 其核心在于互补序列下反射核的正半定性恰等价于标量共形幺正性下界，所得 Hilbert 空间实现 AdS 等距群的正能表示，其范围对应 Klebanov-Witten 替代量子化窗口。\n3. 这从表示论角度建立了 dS 与 AdS 之间无需半径解析延拓的新联系，也为 de Sitter 量子化及其全息诠释提供了新的切入点。", "summary_source": "deepseek", "authors": [{"name": "Yu-ki Suzuki"}], "featured_authors": [{"name": "Yu-ki Suzuki"}], "author_count": 1}, {"id": "2608.20071", "category": "hep-th", "title": "Singularity-Rank Signatures in Generalized Dirac Oscillators near a BTZ Horizon", "abstract": "We study singular generalized Dirac-oscillator couplings in the near-horizon region of a nonextremal BTZ black hole. An effective covariant construction adapted to the stationary horizon congruence relates the two singular profiles to the proper acceleration and its radial gradient, whose leading near-horizon behaviors are $1/\\rho$ and $1/\\rho^2$. This motivates the family $\\mathcal{L}_p(\\rho)=\\lambda_0+\\beta_p/\\rho^p$, with $p=1,2$. The $p=1$ system has a regular singular point and is Fuchsian, whereas $p=2$ is the first irregular case; more generally, a leading $\\rho^{-p}$ interaction with $p>1$ has Poincaré rank $p-1$. For $p=1$, a constant spinor transformation reduces the matrix-Coulomb system exactly to the Whittaker equation, while elimination in the original basis gives an equivalent confluent-Heun representation with an apparent finite singularity. For $p=2$, the local branches contain the essential factors $e^{\\pm\\beta_2/\\rho}\\rho^{-1/2}$, and their coefficient expansions exhibit generic factorial late-order growth. The finite-radius response $\\mathcal{Z}_p(\\Omega;\\rho_0)=\\psi_{2,p}(\\rho_0)/\\psi_{1,p}(\\rho_0)$ obeys an exact Riccati equation whose large-damping expansion first becomes sensitive to the radial gradient of the interaction at order $\\gamma^{-3}$. Even when the two couplings are matched at $\\rho_0$, this response retains information about their different pole orders. The response functions provide local spinorial data for subsequent matching to the complete BTZ exterior.", "url": "https://arxiv.org/abs/2608.20071", "type": "理论", "summary": "1. 该工作研究非极端BTZ黑洞视界附近的广义Dirac谐振子奇异耦合，通过适应平稳视界汇的协变构造将两类奇异轮廓分别与固有加速度及其径向梯度相联系，并引入p=1,2的L_p=λ0+β_p/ρ^p族。\n2. 其核心在于p=1系统为Fuchs型并可经常自旋变换化为Whittaker方程，而p=2首次出现含e^{±β2/ρ}ρ^{-1/2}本质因子的不规则奇点；有限半径响应Z_p满足精确Riccati方程，大阻尼展开到γ^{-3}阶才感知径向梯度，且耦合匹配后仍保留极点阶差异。\n3. 响应函数可为匹配完整BTZ外域提供局域旋量数据，并为从近视界响应辨识奇异相互作用阶数及黑洞视界物理特征提供理论依据。", "summary_source": "deepseek", "authors": [{"name": "João V. R. Alencar"}, {"name": "Allan R. P. Moreira"}, {"name": "João B. R. Silva"}, {"name": "Abdullah Guvendi"}], "featured_authors": [{"name": "João V. R. Alencar"}, {"name": "Allan R. P. Moreira"}, {"name": "João B. R. Silva"}, {"name": "Abdullah Guvendi"}], "author_count": 4}, {"id": "2608.20333", "category": "hep-th", "title": "Maximal Torus Topological Entanglement Entropy in WZW Theories at Bounded Ground-State Degeneracy", "abstract": "For an untwisted Wess--Zumino--Witten modular tensor category $\\cC(\\mathfrak g,k)$, let $r(\\mathfrak g,k)$ be the number of simple objects and $\\cD(\\mathfrak g,k)$ its total quantum dimension. The vacuum-flux state on a torus divided into two cylinders has positive universal entropy contribution $\\Gamma_{T^2}=2\\log\\cD$. We maximize this quantity over all simple Lie algebras and positive integral levels subject to $r(\\mathfrak g,k)\\leq R$. If $q_R=\\log_2R$, then $\\Gamma_{\\max}(R)\\sim[7\\zeta(3)/(4\\pi^2)]q_R^2$ as $R\\to\\infty$. The sequence $Sp(2n)_n$ attains the asymptotic coefficient. At equal rank and level, the Fourier expansion of the type-$C$ root product loses its even modes, leaving $2\\pi^{-2}\\sum_{m\\,\\mathrm{odd}}m^{-3}=7\\zeta(3)/(4\\pi^2)$. An entropy--spectral inequality proves optimality among the classical families, while rank--level duality and fixed-rank estimates control unbalanced and exceptional sequences.", "url": "https://arxiv.org/abs/2608.20333", "type": "理论", "summary": "1. 该工作在无扭转WZW模张量范畴中，研究环面二分时真空通量态拓扑纠缠熵在简单对象数受限下的最大值。\n2. 其要点是证明最大值满足Γ_max(R)~(7ζ(3)/(4π²))q_R²，且由Sp(2n)_n达到；常数来自等秩等水平下C型根积Fourier展开缺失偶模。\n3. 熵-谱不等式配合秩-水平对偶，为受简并度约束的拓扑纠缠极值问题提供了统一方案，对最优拓扑序纠缠结构有启示。", "summary_source": "deepseek", "authors": [{"name": "Ce Shen"}], "featured_authors": [{"name": "Ce Shen"}], "author_count": 1}, {"id": "2608.19619", "category": "math-ph", "title": "Moore--Read construction and explicit monodromies of Laughlin states on Riemann surfaces", "abstract": "We revisit the Moore--Read construction of the $\\nu=1/k$ Laughlin states on compact Riemann surfaces, deriving their conformal blocks from $U(1)_k$ Chern--Simons theory through the CS/WZW correspondence. We compute their explicit monodromies under quasi-hole transport and Aharonov--Bohm flux insertion, and conjecture that these coincide with the corresponding adiabatic holonomies. Under this identification, we recover classical results on Laughlin states including the flux-averaged Hall conductance $1/k$ via a vector bundle of Laughlin states over $Jac(\\Sigma)$. We also relate our construction to the recently developed algebro-geometric approach to higher genus Laughlin states.", "url": "https://arxiv.org/abs/2608.19619", "type": "理论", "summary": "1. 该工作重新审视了紧黎曼曲面上Laughlin态的Moore–Read构造，通过U(1)_k Chern–Simons理论与CS/WZW对应导出其共形块。\n2. 主要技术点在于显式计算准空穴输运与Aharonov–Bohm磁通插入下的单值性，并猜想其与绝热和乐一致，从而由Jacobi簇上向量丛恢复平均霍尔电导1/k。\n3. 该构造与新兴的高亏格Laughlin态代数几何方法相联系，为分数霍尔态的高亏格拓扑响应与几何描述提供了可检验的统一框架。", "summary_source": "deepseek", "authors": [{"name": "Kiyoon Eum"}], "featured_authors": [{"name": "Kiyoon Eum"}], "author_count": 1}, {"id": "2608.19243", "category": "quant-ph", "title": "The HALO Engine: $\\mathcal{O}(1)$-Step Compilation and Localized String Rupture for Lattice Gauge Theories on Quantum Hardware", "abstract": "Simulating the real-time dynamics of lattice gauge theories (LGTs) represents a challenge for near-term quantum computing. Standard digital simulations rely on Trotterization schemes where circuit depth scales proportionally with lattice size, inevitably colliding with the coherence limits of noisy intermediate-scale quantum (NISQ) hardware. To deal with this depth-scaling bottleneck, we introduce the Hardware-Aware Lattice Optimization (HALO) compiler, an architecture that executes global time-evolution steps in an immutable $\\mathcal{O}(1)$ circuit depth per Trotter step. Leveraging this framework, we elevate the digital simulation of the Quantum Link Model (QLM) truncation of the Schwinger model to the mesoscopic scale, utilizing a composite multi-qubit gauge link representation to support non-trivial electric field dynamics. We initialize and execute the non-perturbative dynamics of a heavily stretched $L=15$ meson string on a 16-qubit superconducting transmon processor. By coupling the $\\mathcal{O}(1)$ compilation with Zero-Noise Extrapolation (ZNE), we suppress physical hardware decoherence to extract the precise dynamical crossover of localized pair creation, identifying the topological transition at $t \\approx 0.790$ lattice units with an $18.3 \\pm 2.2\\%$ rupture probability. Furthermore, we empirically map the dynamical phase diagram of the mesoscopic lattice, pinpointing the effective confinement phase boundary at precisely $g_c = 1.0$. Finally, we extend the mathematical principles of the HALO engine to higher dimensions, presenting a scalable, constant-depth 2D unit-cell blueprint that eliminates the routing overhead of magnetic plaquettes, paving a direct algorithmic pathway toward the fault-tolerant simulation of two-dimensional Quantum Chromodynamics (QCD).", "url": "https://arxiv.org/abs/2608.19243", "type": "理论+数值", "summary": "1. 该工作提出硬件感知的HALO编译器，使格点规范理论的每步Trotter演化具有O(1)电路深度，并在16量子比特超导处理器上演示了施温格模型QLM截断的介观尺度动力学。\n2. 其技术核心在于用复合多量子比特规范链表示支持非微扰电场动力学，并结合零噪声外推抑制退相干，精确提取局域粒子对产生及其在t≈0.790处的拓扑转变与g_c=1.0的禁闭相界。\n3. 该框架进一步给出可扩展的二维常数深度单元胞方案，消除磁通面元路由开销，为容错二维QCD模拟提供了直接算法路径。", "summary_source": "deepseek", "authors": [{"name": "Abhiroop Gohar"}], "featured_authors": [{"name": "Abhiroop Gohar"}], "author_count": 1}, {"id": "2608.19249", "category": "quant-ph", "title": "Adaptive Error Budget Allocation for Fault-Tolerant Quantum Resource Estimation: A Metaheuristic Approach", "abstract": "System-level resource estimation is a key component of fault-tolerant quantum computing (FTQC) toolchains. Its efficiency depends on how global error tolerance is allocated across logical operations, T-state distillation, and rotation synthesis to minimize physical resource overhead. The commonly used uniform-allocation strategy ignores circuit-specific structure and can overprovision inactive or less critical subsystems, leading to inflated space-time estimates. Prior work aims to address this limitation using supervised models trained on offline-generated datasets. However, this approach incurs additional data-generation costs and limits deployment flexibility. To overcome these drawbacks, we propose a training-free optimization framework that performs derivative-free search directly on the Azure Quantum Resource Estimator (AQRE), enabling instance-specific error budget allocation for previously unseen circuits without requiring offline training data. To evaluate robustness to optimizer choice, we instantiate the framework with two structurally distinct metaheuristics, simulated annealing and quantum particle swarm optimization. We evaluate our framework across 433 circuits spanning 2 to 91 qubits from 31 families in the MQT Bench suite. Across the benchmark suite, both methods reduce space-time cost by more than 33\\% on average and agree within 1.34\\% points, indicating that the gains are stable across different metaheuristic search strategies. Our analysis further finds that the optimization benefit is driven primarily by error-profile asymmetry rather than circuit scale, and the metric, Gini coefficient of optimized allocation, provides an interpretable diagnostic of expected improvement. Together, these results position adaptive error budget allocation as a system-software optimization layer for FTQC resource estimation pipeline.", "url": "https://arxiv.org/abs/2608.19249", "type": "理论+数值", "summary": "1. 该工作提出一种免训练的元启发式优化框架，直接在Azure量子资源估算器上为未见过电路分配错误预算，以降低容错量子计算的资源估计开销。\n2. 其技术卖点在于用模拟退火和量子粒子群两种搜索策略，在433个测试电路上平均减少超33%的时空成本，且收益主要由错误轮廓不对称性而非电路规模决定。\n3. 这一结果表明自适应分配可作为FTQC资源估算流水线的系统软件优化层，吉尼系数则提供预期改进的可解释诊断。", "summary_source": "deepseek", "authors": [{"name": "Asif Akhtab Ronggon"}, {"name": "Tasnuva Farheen"}], "featured_authors": [{"name": "Asif Akhtab Ronggon"}, {"name": "Tasnuva Farheen"}], "author_count": 2}, {"id": "2608.19310", "category": "quant-ph", "title": "Dissipation-enhanced scrambling in the SYK model coupled to a lossy cavity", "abstract": "We study the Yukawa-Sachdev-Ye-Kitaev model, a disordered model of $N$ Majorana fermions and $R=\\gamma N$ bosons in which the bosons are linearly coupled to independent realizations of SYK $p$-body interactions, in the presence of dissipation, modeled by a Lindblad master equation. Motivated by recent proposals for implementing SYK models in quantum simulators, we focus on bosonic leakage at rate $\\kappa$. Initializing the system in the steady state, we analyze the late-time fermionic relaxation rate and the Lyapunov exponent, solving the large-$N$ theory both numerically and for $p$ large, finding a rich landscape of dynamical behaviors. Most notably, the Lyapunov exponent remains positive for every value of $\\kappa$ and, for $p>2$, can even grow as $\\kappa$ increases. The QED case $p=2$, which lies between the fully chaotic regime $p>2$ and the integrable case $p=1$, exhibits special features. We also identify a critical value of the boson-to-fermion ratio $\\gamma_c \\approx 2/p^2$ separating distinct dynamical regimes.", "url": "https://arxiv.org/abs/2608.19310", "type": "理论+数值", "summary": "1. 该工作研究耦合到损耗腔的Yukawa-SYK模型，在Lindblad耗散下求解大N方程，计算费米子弛豫率与李雅普诺夫指数。\n2. 其核心发现是玻色子泄漏不会抑制混沌：李雅普诺夫指数对任意衰减率κ保持为正，且在p>2时随κ增强，并识别出玻色费米比临界值γ_c≈2/p²。\n3. 这一结果对开放量子系统中SYK混沌模拟平台具有直接指导意义，并提示耗散可作为增强量子scrambling的调控手段。", "summary_source": "deepseek", "authors": [{"name": "Pietro Pelliconi"}, {"name": "Bastien Lapierre"}, {"name": "Shinsei Ryu"}], "featured_authors": [{"name": "Pietro Pelliconi"}, {"name": "Bastien Lapierre"}, {"name": "Shinsei Ryu"}], "author_count": 3}, {"id": "2608.19314", "category": "quant-ph", "title": "Proof of the hiding conjecture for Gaussian boson sampling with an arbitrary number of squeezed input modes", "abstract": "Gaussian boson sampling (GBS) is a sampling task proposed to demonstrate quantum advantage. We consider Gaussian boson sampling on $M$ optical modes, with $K$ equally squeezed input modes and $N$ observed photon counts. We complete the proof of the hiding conjecture for Gaussian boson sampling with an arbitrary number of squeezers $K$, which is a part of the argument for classical hardness of GBS. In particular, we show that for any $K$ and $N=o(\\sqrt{K})$, the symmetric product $MK^{-1/2}U_{NK}U_{NK}^T$, for $U_{NK}$ the top left $N\\times K$ submatrix of an $M\\times M$ Haar random unitary $U$, is close in total variation distance to both an $N\\times N$ symmetric complex Gaussian matrix $\\mathbf G$ with independent entries, and the symmetric product $GG^T/\\sqrt{K}$ for $G$ an $N\\times K$ matrix of iid standard complex Gaussians. We show however that the density-based instance generating method of [Aaronson and Arkhipov, Theory Comput. 9, 143 (2013), Lemma 5.8] used to efficiently implement a hiding procedure fails for Gaussian boson sampling with $K=cM$ if $c<1/2$. Instead we use approximate instance generating to implement the hiding for the usual classical hardness reduction.", "url": "https://arxiv.org/abs/2608.19314", "type": "理论", "summary": "1. 该工作完成了任意数目压缩输入模高斯玻色采样中隐藏猜想的证明，覆盖K个等强度压缩模与N个光子计数情形。\n2. 其技术核心在于证明对任意K与N=o(√K)，对称积MK^{-1/2}U_{NK}U_{NK}^T在总变差距离上同时接近对称复高斯矩阵G与GG^T/√K。\n3. 该证明还指出密度实例生成方法在K=cM且c<1/2时失效，故改用近似实例生成以实现经典硬度归约所需的隐藏过程。", "summary_source": "deepseek", "authors": [{"name": "Laura Shou"}, {"name": "Alexey V. Gorshkov"}, {"name": "Victor Galitski"}, {"name": "Sarah H. Miller"}], "featured_authors": [{"name": "Laura Shou"}, {"name": "Alexey V. Gorshkov"}, {"name": "Victor Galitski"}, {"name": "Sarah H. Miller"}], "author_count": 4}, {"id": "2608.19315", "category": "quant-ph", "title": "Thermal Throttling of Quantum State Transfer", "abstract": "Quantum state transfer on qubit lattices is a crucial step in a panoply of quantum information processing tasks. Understanding its fundamental limits in the presence of practical imperfections remains a pressing open question. In particular, it is unclear how thermal noise in the intermediate ancilla sites impedes transfer. In this work, we derive tight lower bounds on the necessary growth of commutator norms to achieve approximate state transfer. Specializing to 1D power-law systems with thermal ancilla states, we demonstrate that state transfer runtimes depend sensitively on the scaling of temperature with system size, improving logarithmic bounds to algebraic ones. Our work extends previous results on exact state transfer to the qualitatively different and more practically relevant regime of approximate state transfer.", "url": "https://arxiv.org/abs/2608.19315", "type": "理论", "summary": "1. 该工作推导了在辅助量子位含热噪声时实现近似量子态传输所需对易子范数增长的紧致下界。\n2. 核心在于对一维幂律相互作用系统，发现传输时间随系统尺寸的温度标度敏感，并将对数界限加强为代数界限。\n3. 这为热噪声环境中近似态传输的基本极限提供更实际的下界，并启发后续对非精确传输速度极限的研究。", "summary_source": "deepseek", "authors": [{"name": "Twesh Upadhyaya"}, {"name": "T. C. Mooney"}, {"name": "Yifan Hong"}, {"name": "Alexey V. Gorshkov"}], "featured_authors": [{"name": "Twesh Upadhyaya"}, {"name": "T. C. Mooney"}, {"name": "Yifan Hong"}, {"name": "Alexey V. Gorshkov"}], "author_count": 4}, {"id": "2608.19336", "category": "quant-ph", "title": "Multipolar Light-Matter Hamiltonians in Symmetry-Breaking Photonic Vacuums", "abstract": "We show that the conventional multipolar Hamiltonian is qualitatively modified when the photonic vacuum breaks inversion or time-reversal symmetry. By explicitly applying the Power-Zienau-Woolley transformation, we derive the resulting multipolar Hamiltonians for two idealized chiral photonic environments: a spatial-chiral vacuum, which breaks inversion symmetry, and a temporal-chiral vacuum, which breaks time-reversal symmetry. In the spatial-chiral case, the transformation generates an inversion-breaking self-energy, whereas in the temporal-chiral case it produces an additional Zeeman-like energy. Using a trapped hydrogen-like atom and a charged harmonic oscillator in cavities as minimal examples, we show that these symmetry-dependent terms lead to characteristic spectral shifts. Our work provides a general framework for describing light-matter interactions in chiral quantum electrodynamics and identifying the associated symmetry-dependent effects on cavity-embedded atoms, molecules, and quantum materials.", "url": "https://arxiv.org/abs/2608.19336", "type": "理论", "summary": "1. 该工作通过显式应用Power-Zienau-Woolley变换，推导出光子真空分别破缺空间反演或时间反演对称性时的多极光-物质哈密顿量。\n2. 其核心发现在于空间手性真空诱导出反演对称性破缺的自能项，而时间手性真空则产生额外的类塞曼能量；以受限氢原子和带电谐振子为例，这些对称性依赖项导致特征谱移。\n3. 这一框架为手性腔量子电动力学中原子、分子和量子材料的对称性相关效应提供了统一描述，并为后续光谱测量或材料设计给出明确指引。", "summary_source": "deepseek", "authors": [{"name": "Liu Yang"}, {"name": "Jiadu Lin"}, {"name": "Qing-Dong Jiang"}], "featured_authors": [{"name": "Liu Yang"}, {"name": "Jiadu Lin"}, {"name": "Qing-Dong Jiang"}], "author_count": 3}, {"id": "2608.19348", "category": "quant-ph", "title": "Dataflows and Computational Patterns for Hybrid Quantum-Classical Scientific Computing", "abstract": "Hybrid quantum-classical computing has emerged as the dominant paradigm for near-term quantum applications, yet hybrid workflows are typically described by individual algorithms rather than their underlying execution behavior. We introduce the Quantum Execution Locality Framework (QELF), a qualitative framework for characterizing hybrid quantum-classical workflows according to recurring dataflow structures and quantum execution locality, the extent to which computation remains resident on the Quantum Processing Unit (QPU) before host intervention or classical synchronization. From a representative cross-section of applications, QELF identifies five recurring computational patterns with distinct locality characteristics and discusses their implications for communication overhead, workflow organization, and future hybrid computing architectures. By providing a common vocabulary for reasoning about hybrid workloads, QELF establishes a foundation for future quantitative validation and the co-design of algorithms, runtime systems, and hybrid computing architectures.", "url": "https://arxiv.org/abs/2608.19348", "type": "理论+数值", "summary": "1. 该工作提出量子执行局域性框架（QELF），一种依据重复出现的数据流结构和量子执行局域性来刻画混合量子-经典科学计算工作流的定性框架。\n2. 其技术卖点在于从代表性应用横截面中提炼出五种具有不同局域性特征的计算模式，并阐明它们对通信开销、工作流组织和未来混合架构的影响。\n3. 这为混合计算算法、运行时系统与架构的协同设计奠定了共同词汇和基础，也为后续定量验证和混合工作流优化提供了清晰方向。", "summary_source": "deepseek", "authors": [{"name": "Ryan Landfield"}, {"name": "Jordan J. Winetrout"}, {"name": "Michael A. Sandoval"}], "featured_authors": [{"name": "Ryan Landfield"}, {"name": "Jordan J. Winetrout"}, {"name": "Michael A. Sandoval"}], "author_count": 3}, {"id": "2608.19403", "category": "quant-ph", "title": "Rescaled Mandelstam Tamm characterization of discrete time crystal response in a disordered Floquet Ising chain", "abstract": "For pure state unitary dynamics, the Mandelstam Tamm (MT) lower-bound functional compares the endpoint Fubini Study return angle with path averaged energy dispersion. Their distinct size and temporal dependences obscure the origin of period two MT structure in discrete time crystal (DTC) like dynamics and its relation to the spin response. For binary Floquet drives, we derive an exact segment resolved MT expression without assuming commuting segment Hamiltonians and apply it to a disordered Floquet Ising chain. Absolute and uniform summability of connected covariances of local energy terms implies an $O(\\sqrt{L})$ upper bound on the path-averaged energy dispersion. Endpoint data for four system sizes are consistent with this leading behavior and support the corresponding rescaling of the MT functional. At a representative point in the finite-size region with a locked spin response, odd and even rescaled MT branches remain separated throughout the $10^2$ period observation window. The return angle alternates strongly, whereas the size-normalized path-averaged energy dispersion shows little discernible parity dependence, indicating that endpoint geometry is the main source of the branch splitting. Across the interacting parameter grid, the period-two MT component has a strong partial Spearman rank correlation with the locked spin response after controlling for pulse error and interaction strength. The rescaled MT functional characterizes the global return geometry of finite-size period-two dynamics and quantifies its association with the locked spin response.", "url": "https://arxiv.org/abs/2608.19403", "type": "理论+数值", "summary": "1. 该工作推导了二元Floquet驱动下分段精确的Mandelstam-Tamm表达式，并将其应用于无序Floquet Ising链，以刻画离散时间晶体的自旋响应。\n2. 主要技术在于证明局域能量项关联函数的绝对且一致可和性给出路径平均能量色散的O(√L)上界，由此重标定MT泛函；奇偶分支分离主要源于端点几何而非能量色散的奇偶差异。\n3. 重标定后的MT泛函将有限尺寸周期二动力学的全局返回几何与锁定自旋响应联系起来，其周期二分量在控制脉冲误差和相互作用后仍与自旋响应显著偏相关，可作为DTC响应的几何探针。", "summary_source": "deepseek", "authors": [{"name": "Abrar Ahmed Naqash"}, {"name": "Salman Sajad Wani"}, {"name": "Saif Al-Kuwari"}], "featured_authors": [{"name": "Abrar Ahmed Naqash"}, {"name": "Salman Sajad Wani"}, {"name": "Saif Al-Kuwari"}], "author_count": 3}, {"id": "2608.19427", "category": "quant-ph", "title": "Compressibility of genuine multipartite entanglement under the Hadamard map", "abstract": "One of the most counterintuitive effects in the examination of quantum states is the phenomenon of superactivation, which describes the fact that a quantum state, which is useless for a specific task, may become useful when one considers multiple copies of it. This effect can be observed in the case of genuine multipartite entanglement, where local projections from multiple copies to the single-copy Hilbert space could significantly simplify the practical accessibility of its superactivation. We investigate how such projections behave in the limit of many copies, using the Hadamard map as an example, and studying different state families. We show that, in this scheme, for a fixed map, an optimal number of copies exists, beyond which the obtained entanglement decreases, highlighting the differences between entanglement distillation and local projection schemes.", "url": "https://arxiv.org/abs/2608.19427", "type": "理论", "summary": "1. 该工作研究了Hadamard映射下真多体纠缠的可压缩性，即多份拷贝经局域投影到单拷贝空间后纠缠的超级激活行为。\n2. 其技术要点在于对固定映射证明存在最优拷贝数，超过该数目后所得纠缠反而下降，从而揭示局域投影方案与纠缠蒸馏之间的关键差异。\n3. 这一结论为多体纠缠激活的实用化操控以及非渐近纠缠资源理论的后续研究提供了明确指引。", "summary_source": "deepseek", "authors": [{"name": "Klára Baksová"}, {"name": "Lisa T. Weinbrenner"}], "featured_authors": [{"name": "Klára Baksová"}, {"name": "Lisa T. Weinbrenner"}], "author_count": 2}, {"id": "2608.19448", "category": "quant-ph", "title": "Efficient Classical Simulation of Weakly Interacting Fermion Dynamics", "abstract": "We consider the task of simulating the real-time dynamics of weakly interacting fermionic systems. In particular, we focus on computing the expectation value of a local observable $A$ at time $t$. By analyzing the convergence of the perturbative expansion in the interaction strength $\\lambda$ for the Heisenberg-picture observable, we propose a polynomial-time algorithm for estimating this expectation value in the weakly interacting regime $\\lambda |t|^{2D+1}=\\mathcal{O}(1)$, when the Hamiltonian is geometrically local on a $D$-dimensional lattice. Importantly, this condition is independent of the system size. If the goal is instead to approximate the time-evolved observable in normalized Frobenius norm, we extend the convergence regime to $\\lambda |t|=\\mathcal{O}(1)$ with quasi-polynomial runtime. When the non-interacting part exhibits Anderson localization, our polynomial-time algorithm can be extended up to $\\lambda |t|=\\mathcal{O}(1)$, modulo polylogarithmic factors. Our algorithm brings together ideas from continuous-time QMC, diagrammatic QMC, and Majorana Propagation, but with a new Heisenberg-picture operator-growth analysis that makes the sampling complexity rigorously controllable. This leads to provably efficient classical algorithms in regimes where the interaction is weak enough that the sampling variance remains bounded independently of system size. Together, these results identify broad regimes in which weak interactions, locality, and localization can be leveraged to make real-time fermionic dynamics classically tractable.", "url": "https://arxiv.org/abs/2608.19448", "type": "理论+数值", "summary": "1. 该工作针对弱相互作用费米子体系的实时动力学，提出在局域观测量期望值计算上具有多项式复杂度的经典算法。\n2. 其核心在于结合连续时间量子蒙特卡洛、图解量子蒙特卡洛与马约拉纳传播技巧，利用海森堡绘景算符增长分析严格控制采样复杂度，使算法在λ|t|^{2D+1}=O(1)条件下与系统大小无关。\n3. 这揭示了弱相互作用、空间局域性与安德森局域化可被用于令实时费米子动力学经典可处理，为相关计算复杂性研究提供了明确启发。", "summary_source": "deepseek", "authors": [{"name": "Chu Zhao"}, {"name": "Iman Marvian"}, {"name": "Yu Tong"}], "featured_authors": [{"name": "Chu Zhao"}, {"name": "Iman Marvian"}, {"name": "Yu Tong"}], "author_count": 3}, {"id": "2608.19458", "category": "quant-ph", "title": "Renormalization group ontology in quantum foundations: a non-interacting spin-0 toy model", "abstract": "A realist, anti-psi interpretation of quantum field theory is introduced, based on an expanded ontology that was inspired by the renormalization group. A goal will be to work with a classical non-interacting scalar field \"toy model\" in the canonical ensemble and show that an observer in this expanded ontology, under certain limiting conditions, will see a QFT. The inverse renormalization group (IRG) will be key in both interpreting this expanded ontology and furnishing novel examples of QFTs. This will lead to a definition of Planck's constant that flows as we head towards a fixed point, is expressed in terms of a temperature, and depends on the observer being studied in this expanded ontology. Our hope is that this approach will lead both to insights into quantum foundations and to prescriptions for developing new QFTs.", "url": "https://arxiv.org/abs/2608.19458", "type": "理论", "summary": "1. 该工作为量子场论提出一种实在论、反波函数的重新诠释，其扩展本体论受重整化群启发，并用经典无相互作用标量场系综玩具模型证明，观察者在特定极限条件下会得到量子场论。\n2. 其核心卖点是逆重整化群(IRG)既用于解释扩展本体论中的QFT涌现，也用于构造新的QFT例子，并导出一个随流动趋向固定点、以温度表达且依赖观察者的普朗克常数定义。\n3. 这为量子基础研究提供新洞见，并为发展新量子场论提供可操作的构造路径；其局限在于当前仅是非相互作用玩具模型，普适性有待进一步检验。", "summary_source": "deepseek", "authors": [{"name": "Gary Kapilevich"}], "featured_authors": [{"name": "Gary Kapilevich"}], "author_count": 1}, {"id": "2608.19459", "category": "quant-ph", "title": "Is the Quantum-Entangled Universe a Small World?", "abstract": "Partial entanglement may provide enough connections in the universe to satisfy the definition of a small world. To investigate this possibility, we define a network of particles on a given space-like hyper-surface with a long-range link between any two particles that are connected by a chain of exchanged particles involving less than some small maximum number of interactions. Considering the mean free paths of particles in different regions of space and the resulting probability distributions of entanglement connections vs. distance, we find evidence of small-world or random network structure on all but the smallest scales - corresponding to stars and planets - on which other types of connections would need to be added to complete the small world picture.", "url": "https://arxiv.org/abs/2608.19459", "type": "理论", "summary": "1. 该工作针对量子纠缠能否让宇宙满足小世界定义的问题，在给定空间类超曲面上构建以粒子为节点、以少于某较小上限次数的交换粒子链为长程连边的纠缠网络。\n2. 其技术要点是根据不同空间区域的粒子平均自由程，计算纠缠连接随距离的概率分布，由此发现除恒星和行星等最小尺度外，宇宙在所有尺度上均呈现小世界或随机网络结构。\n3. 这表明部分纠缠足以在大多数尺度上构成小世界联系，也为小尺度上需要引入额外连接机制以补全图景的后续研究提供了依据。", "summary_source": "deepseek", "authors": [{"name": "Gregory S. Duane"}], "featured_authors": [{"name": "Gregory S. Duane"}], "author_count": 1}, {"id": "2608.19489", "category": "quant-ph", "title": "Fast Algorithms for Stoquastic Spin Systems", "abstract": "We establish a general framework for developing fast sampling and counting algorithms for stoquastic spin systems at high temperature. Our framework is based on a rapidly mixing Markov chain for polymer models and a subcritical percolation process for sampling individual polymers. We apply our framework to obtain fast algorithms for approximating the partition function and sampling from the thermal distribution of (1) general stoquastic spin systems, (2) ferromagnetic Heisenberg models, and (3) antiferromagnetic Heisenberg models on bipartite graphs. For the Heisenberg models, we obtain an improved bound on the inverse temperature by using their respective cycle and loop representations.", "url": "https://arxiv.org/abs/2608.19489", "type": "理论+数值", "summary": "1. 该工作研究高温区域内的stoquastic自旋系统，为一般情形、铁磁海森堡模型以及二部图上的反铁磁海森堡模型建立了快速采样与计数算法的统一框架。\n2. 其技术卖点在于基于聚合物模型的快速混合马尔可夫链来逼近配分函数，并设计亚临界渗流过程用于单个聚合物的采样，同时利用圈与环表示获得了改进的逆温度界限。\n3. 该框架为配分函数近似和热态分布采样提供了具有多项式时间保证的算法，也为其他量子多体模型的经典概率构造与数值模拟提供了可推广的重要思路。", "summary_source": "deepseek", "authors": [{"name": "Ryan L. Mann"}], "featured_authors": [{"name": "Ryan L. Mann"}], "author_count": 1}, {"id": "2608.19508", "category": "quant-ph", "title": "Quantum algorithm for differential equations via permutation matrix representation with application to the Burgers equation", "abstract": "We develop a quantum algorithm for solving the dynamics of the nonlinear viscous Burgers equation. We apply the Carleman linearization procedure on the spatially discretized equation, followed by a padding scheme that allows implementation on qubit registers. Existing Carleman-based quantum algorithms commonly formulate the lifted linear differential equation in an oracle model. Here we decompose the padded generator into diagonal masks and reversible arithmetic permutations using the Permutation Matrix Representation (PMR), which we show to be naturally compatible with the Linear Combination of Hamiltonian Simulations (LCHS) algorithm. Under the assumptions required by LCHS - most importantly positive semidefiniteness of the Hermitian part of the linear generator, possibly after a stabilizing shift - the algorithm prepares a normalized quantum state proportional to the solution of the truncated lifted system; the stabilizing shift introduces an exponential postselection overhead, which we quantify and mitigate through a rescaling scheme. We show that our algorithm scales with the off-diagonal norm of the Carleman generator instead of the matrix norm, which can be advantageous for other generators that are diagonally dominant. We also extend the PMR scheme to general fluid equations that may contain higher-order derivatives or nonlinear terms, or may involve multiple fluid variables or spatial dimensions. The construction illustrates how PMR can serve as a convenient Hamiltonian-simulation primitive for a broader class of LCU-based algorithms.", "url": "https://arxiv.org/abs/2608.19508", "type": "理论+数值", "summary": "1. 该工作提出一种基于置换矩阵表示（PMR）的量子算法，用于求解非线性黏性Burgers方程及更一般流体方程的动力学。\n2. 其核心技术是将Carleman线性化后的空间离散生成元分解为对角掩码与可逆算术置换，并利用与LCHS的兼容性，使算法复杂度取决于Carleman生成元的非对角范数而非矩阵范数。\n3. 该构造展示了PMR可作为更广LCU类算法的哈密顿模拟原语，为含高阶导数、非线性或多变量多空间流体方程的量子求解提供了可行路径。", "summary_source": "deepseek", "authors": [{"name": "Hriday Sabharwal"}, {"name": "Amir Kalev"}, {"name": "Itay Hen"}], "featured_authors": [{"name": "Hriday Sabharwal"}, {"name": "Amir Kalev"}, {"name": "Itay Hen"}], "author_count": 3}, {"id": "2608.19519", "category": "quant-ph", "title": "Beyond Integrability Preserving Renormalization-Group Protocol in Non-Hermitian Hamiltonians with Time-Dependent Interaction Strengths", "abstract": "It is well established that in time-dependent quantum systems, integrability preserving time-dependent interaction strengths are identical to the renormalization group (RG) trajectories of the corresponding static model when time `$t$' in the driven model is identified with the logarithm of the cutoff `$\\log\\Lambda$' of the static model. We refer to this integrability preserving driving as the RG protocol. In this work we extend the class of time-dependent integrable models to include non-Hermitian quantum models with time-dependent interaction strengths. Using the recently formulated generalized Bethe ansatz framework [P. R. Pasnoori, Phys. Rev. B 112, L060409 (2025)], we show that the constraints imposed by integrability are more general: The interaction strengths of the static model that flow in the RG follow the respective RG trajectories in the corresponding time-dependent model as described above. In addition, the interaction strengths of the static model that are RG invariant can either be constant or have a specific time-dependence in the corresponding time-dependent model which is constrained by integrability. Thus we establish that in the context of time-dependent non-Hermitian systems, the set of integrability preserving time-dependent strengths is larger than the set corresponding to the RG protocol.", "url": "https://arxiv.org/abs/2608.19519", "type": "理论+数值", "summary": "1. 该工作将保持可积性的含时相互作用强度方案推广到含时非厄米量子模型，并借助广义Bethe ansatz框架处理该问题。\n2. 其核心发现是静态模型中沿重整化群流动的耦合需按RG轨迹演化，而RG不变的耦合在可积性约束下可为常数或遵循特定的含时形式。\n3. 这表明含时非厄米系统中可积性保持的含时强度集合严格大于RG协议对应集合，为理解非厄米可积驱动与重整化群的广义联系提供了新视角。", "summary_source": "deepseek", "authors": [{"name": "Parameshwar R. Pasnoori"}], "featured_authors": [{"name": "Parameshwar R. Pasnoori"}], "author_count": 1}, {"id": "2608.19655", "category": "quant-ph", "title": "Variational Quantum Linear Solver via Block Encoding for the Poisson Equation", "abstract": "We present a variational quantum linear solver (VQLS) for the Poisson equation built on an exact block encoding of the discrete Laplacian, and demonstrate its performance on physically motivated benchmarks. Unlike LCU-based VQLS where the number of distinct circuits required per cost-function evaluation is $\\mathcal{O}(L^2)$, where $L$ is the number of terms in the LCU decomposition of the discrete Laplacian operator, this approach requires only a single circuit for cost evaluation. We further empirically demonstrate that the choice of classical optimizer materially affects where the variational optimization ceases to make progress. The solver is benchmarked on three problems: a Poisson equation with sinusoidal forcing and a steady-state heat conduction problem with a localized Gaussian source, both with Dirichlet boundaries, and the pressure-Poisson equation of a two-dimensional lid-driven cavity flow, in which the solver is invoked once per time step under Neumann boundary conditions.", "url": "https://arxiv.org/abs/2608.19655", "type": "理论+数值", "summary": "1. 该工作提出一种基于离散拉普拉斯算子精确块编码的变分量子线性求解器，用于求解泊松方程，并在Dirichlet与Neumann边界条件下对正弦源、高斯源及驱动空腔流压力泊松问题进行了基准测试。\n2. 其核心卖点是将每次代价评估所需的不同线路数由LCU方案的O(L^2)降为单条线路，同时还实证表明经典优化器的选择会显著改变变分优化停止推进的位置。\n3. 该结果展示了块编码结合变分路线在偏微分方程量子求解中的资源优势，对计算流体力学等需逐时间步调用求解器的实际应用具有明确启发。", "summary_source": "deepseek", "authors": [{"name": "Viraj Dsouza"}, {"name": "Ayush Singhal"}, {"name": "Alex Khan"}, {"name": "Rut Lineswala"}, {"name": "Abhishek Chopra"}], "featured_authors": [{"name": "Viraj Dsouza"}, {"name": "Ayush Singhal"}, {"name": "Alex Khan"}, {"name": "Rut Lineswala"}, {"name": "Abhishek Chopra"}], "author_count": 5}, {"id": "2608.19679", "category": "quant-ph", "title": "Geometric phase of open paths and a geodesic-selection rule at a level degeneracy", "abstract": "When the control field of a qubit, a polarization state, or a spin-$\\tfrac12$ system is swept through a level degeneracy, its direction traces an open curve on the Bloch sphere whose endpoints are antipodal, and the geodesic rule for the open-path geometric phase becomes ambiguous: infinitely many geodesics close the path, and different closures enclose different solid angles. We resolve this ambiguity in closed form. A coordinate-free monopole connection defines the open-path solid angle $\\Omega[C]$ intrinsically, and displacing the degeneracy by $\\epsilon\\uhat$ closes the path with enclosed solid angle $\\Omega(\\epsilon\\uhat)=\\Omega[C]+2\\alpha+O(\\epsilon)$, where $\\alpha$ is the azimuth of the transverse part of $\\uhat$ measured from the principal normal of the control curve at the crossing. The identity between geometric phase and enclosed solid angle therefore holds for exactly one closing geodesic---the great circle in the osculating plane ($\\alpha=0$)---supplied by the curvature at the degeneracy. Berry's $\\pi$ invariant under reversal of the displacement and the values $\\pm\\pi/2$ under a reflection symmetry follow as corollaries, and the pure-state limit of the finite-temperature Uhlmann phase selects the osculating-plane closure automatically, turning the heuristic closing rules of the open-path literature into a computable prescription.", "url": "https://arxiv.org/abs/2608.19679", "type": "理论", "summary": "1. 该工作针对量子比特、偏振态或自旋-1/2系统控制场扫过能级简并时，开放路径因无穷多闭合测地线而导致的几何相位歧义，给出了闭式的解析判定规则。\n2. 其核心是无坐标单极联络内禀定义开放路径立体角，证明仅当闭合测地线取密切平面大圆（α=0）时几何相位才严格等于包围立体角，且简并位移εuhat给出Ω(εuhat)=Ω[C]+2α+O(ε)。\n3. 该规则自然推出Berry π不变性与反射对称下的±π/2推论，并令有限温度Uhlmann相位的纯态极限自动选择密切平面闭合，将开放路径文献中的启发式闭合规则转化为可计算处方。", "summary_source": "deepseek", "authors": [{"name": "Hyeonseok Yang"}, {"name": "Changsuk Noh"}], "featured_authors": [{"name": "Hyeonseok Yang"}, {"name": "Changsuk Noh"}], "author_count": 2}, {"id": "2608.19685", "category": "quant-ph", "title": "Tight Entropy Contraction of Generalized Quantum Depolarization", "abstract": "We establish upper and lower bounds for relative entropy contraction of generalized quantum depolarizing channels and semigroups. Our bound provides tight first order asymptotic of the contraction rate in terms of the dimension constant. One side estimate are based on sharp reverse ratio and convexity of relative entropy of two states, which can be derived from the recently introduced Hockey-Stick quantum $f$-divergence, and also independently, Bogoliubov--Kubo--Mori quantum Fisher information metric. The other side follows from the existence of index achieving pure state with respect to a general conditional expectation. Our results extend to the complete entropy contraction rate, tensor stable estimates for product dynamics. Examples include quantum depolarization, dephasing, and compact group symmetrization, with consequences for the decay rate of coherence and asymmetry.", "url": "https://arxiv.org/abs/2608.19685", "type": "理论", "summary": "1. 该工作推导了广义量子退极化信道及其半群的相对熵收缩上下界，并给出收缩率关于维度常数的一阶渐近紧估计。\n2. 技术核心是利用Hockey-Stick量子f-散度与Bogoliubov-Kubo-Mori量子Fisher信息度量导出锐化逆向比及相对熵凸性，另一侧依赖一般条件期望下指标实现纯态的存在性，并扩展至完全熵收缩率与张量积稳定估计。\n3. 该结果统一涵盖量子退极化、退相与紧致群对称化过程，定量刻画相干性与不对称性的衰减率，为相关开放量子系统的精确分析提供依据。", "summary_source": "deepseek", "authors": [{"name": "Li Gao"}, {"name": "Long Zhao"}], "featured_authors": [{"name": "Li Gao"}, {"name": "Long Zhao"}], "author_count": 2}, {"id": "2608.19694", "category": "quant-ph", "title": "Dissipation-tunable extended and localized steady states in a non-disordered lattice", "abstract": "Dissipation is usually regarded as a source of decoherence that suppresses quantum interference and localization. Here we show that suitably engineered dissipation can instead be used to select localized or extended states in a strictly non-disordered one-dimensional lattice. The underlying clean lattice has spatially inhomogeneous hopping and supports both extended bulk states and localized boundary states, including an algebraically localized bound state in the continuum. We introduce a nonlocal bond jump operator with a tunable relative phase and show that this phase selectively favors eigenstates with different spatial phase correlations. As a result, the long-time density matrix can be steered toward sectors dominated by localized or extended Hamiltonian eigenstates without changing any Hamiltonian parameter. The microscopic origin of the selection is quantified by the fraction of site pairs separated by a distance $l$ that are phase matched with the dissipative channel. We further characterize the dissipative quench through the quantum fidelity and show that the selected character of the steady state can persist after the dissipation is removed. Our results establish phase-selective bond dissipation as a route to controllable state preparation and transport manipulation in non-disordered lattices.", "url": "https://arxiv.org/abs/2608.19694", "type": "理论", "summary": "1. 该工作在严格无无序的一维晶格中，利用含可调相对相位的非局域键跳变算符，证明耗散可选择局域或扩展稳态，包括连续谱中的代数局域束缚态。\n2. 其技术卖点是以耗散通道与相距l的格点对间的空间相位匹配作为选择判据，无需改变哈密顿量即可调控长期密度矩阵所落入的本征态扇区。\n3. 该机制为无无序晶格中相位选择性键耗散用于态制备与输运调控开辟了途径，且耗散撤除后稳态特征仍可保持，有助于后续量子模拟验证。", "summary_source": "deepseek", "authors": [{"name": "Ming-Jie Tao"}, {"name": "Yi-Ting Wang"}, {"name": "Jing Li"}, {"name": "Hongsheng Hou"}, {"name": "Xiang-Ping Jiang"}, {"name": "Lei Pan"}], "featured_authors": [{"name": "Ming-Jie Tao"}, {"name": "Yi-Ting Wang"}, {"name": "Jing Li"}, {"name": "Hongsheng Hou"}, {"name": "Xiang-Ping Jiang"}, {"name": "Lei Pan"}], "author_count": 6}, {"id": "2608.19770", "category": "quant-ph", "title": "Gradient flow towards quantum states with ideal quantum geometry", "abstract": "We propose a gradient-flow method for quantum states in lattice models, generated by an action consisting of the quantum-metric and the square of the Berry curvature. These two terms drive the spectral projector toward Bogomolny saturation and uniform Berry curvature, respectively. We show that, due to a no-go theorem for finite-dimensional projectors, the two conditions cannot in general be satisfied simultaneously in lattice models. Hence the flow is expected to approach a nontrivial fixed point that balances the two geometric requirements. For the Wilson-Dirac model, we demonstrate that the flowed projector exhibits almost uniform Berry curvature while remaining close to the Bogomolny bound. We further construct a short-range truncated flattened Hamiltonian from the flowed projector and obtain a lattice model with nearly flat bands and nearly uniform Berry curvature. We also apply the method to the Hofstadter model and confirm the roles of the metric and Berry-curvature terms in a Chern band with higher Chern number.", "url": "https://arxiv.org/abs/2608.19770", "type": "理论", "summary": "1. 该工作提出一种梯度流方法，通过在量子态上作用由量子度规和贝里曲率平方构成的泛函，驱动谱投影子趋向理想量子几何。\n2. 技术要点在于，由于有限维投影子的不可行定理，两个几何条件无法同时满足，流趋向非平凡不动点；在Wilson-Dirac模型中实现近均匀贝里曲率且接近Bogomolny界，并构造近平坦能带模型。\n3. 该方法还可用于Hofstadter模型等高陈数体系，为构建具有理想量子几何的平带模型以及研究分数陈绝缘体等强关联拓扑物态提供了可控途径。", "summary_source": "deepseek", "authors": [{"name": "T. Shiga"}, {"name": "T. Fukui"}], "featured_authors": [{"name": "T. Shiga"}, {"name": "T. Fukui"}], "author_count": 2}, {"id": "2608.19779", "category": "quant-ph", "title": "An Irreducible Quantum Advantage in Aligning World Models with Reality", "abstract": "World models provide digital simulacra of the true world, allowing agents to be trained and tested before costly real-world deployment. At each time step, they receive an action and generate an observation and reward matching the statistics of the true world. In complex environments where present outcomes depend on events far in the past, this requires memory. One might expect that, by increasing memory, we can always build a model accurately enough to align the optimal agent policies of the real and virtual worlds. We show that this is false for classical world models, even when the true world itself is classical. We construct true worlds for which every finite classical model fails along the same possible trajectory: it either loses the ability to distinguish actions when the true world clearly prefers one, or repeatedly assigns the highest expected reward to suboptimal actions. Its expected-reward estimates also retain a nonvanishing average error. In contrast, each such true world admits a quantum world model using a single qutrit that reproduces it exactly: its reward estimates and preferred actions always match those of the true world, ensuring that the optimal policies of the real and virtual worlds remain perfectly aligned.", "url": "https://arxiv.org/abs/2608.19779", "type": "理论", "summary": "1. 该工作证明在经典世界模型与真实世界对齐问题中，存在经典有限模型无法消除的失败模式，而量子模型可实现不可约优势。\n2. 其核心在于构造出一类经典真实环境：任意有限经典模型都会沿某条轨迹混淆动作或持续高估次优动作，而单个qutrit的量子世界模型却能精确复现真实奖励与最优偏好。\n3. 这为强化学习中的世界模型设计与量子模拟提供了新视角，表明量子内在维度可在策略与奖励估计上带来原理性的经典不可替代优势。", "summary_source": "deepseek", "authors": [{"name": "Josep Lumbreras"}, {"name": "Hailan Ma"}, {"name": "Jayne Thompson"}, {"name": "Mile Gu"}], "featured_authors": [{"name": "Josep Lumbreras"}, {"name": "Hailan Ma"}, {"name": "Jayne Thompson"}, {"name": "Mile Gu"}], "author_count": 4}, {"id": "2608.19787", "category": "quant-ph", "title": "Constant-round quantum advantage in communication complexity for total functions", "abstract": "We show that there exists a total function for which there is a polynomial gap between the randomized and the constant-round quantum communication complexity. Previously, such a separation was known only for quantum protocols using polynomially many rounds.", "url": "https://arxiv.org/abs/2608.19787", "type": "理论", "summary": "1. 该工作构造了一个全函数，证明其常数轮量子通信复杂度与随机化复杂度之间存在多项式分离。\n2. 关键在于设计出适用于常数轮协议的量子与下界技术，突破了以往需要多项式轮次的限制。\n3. 这为低轮次量子通信优势的普适性提供新证据，或可启发轮数—复杂度权衡的进一步研究。", "summary_source": "deepseek", "authors": [{"name": "Atsuya Hasegawa"}, {"name": "François Le Gall"}], "featured_authors": [{"name": "Atsuya Hasegawa"}, {"name": "François Le Gall"}], "author_count": 2}, {"id": "2608.19868", "category": "quant-ph", "title": "Resource-Efficient Bio-Molecular Docking on a NISQ-era Digital Quantum Computer", "abstract": "Molecular docking is a vital computational task in drug discovery, wherein the objective is to efficiently identify optimal binding poses between a ligand and a target receptor protein. Due to the combinatorial explosion of possible binding configurations, docking of large and flexible molecules remains a computationally intensive problem, especially at scale. Early studies have revealed that the molecular docking can be re-cast as a maximum vertex-weighted clique problem (MVWCP) problem on a compatibility graph to be solved classically. In this work, we proposed a hybrid quantum-classical approach for molecular docking leveraging the MVWCP formalism with a variational full-basis encoding (FBE) strategy, which enables efficient encoding of classical binary variables with Bloch sphere vectors. We further prove that a global minimizer of the FBE objective can always be chosen to be a pure product state, thereby providing a rigorous justification for its optimization using a unitary variational circuit. The molecular docking problem is first mapped to a cost Hamiltonian that is minimized within a variational framework, optimized via a randomized imaginary time evolution (ITE)-inspired warm start, and gradient-based techniques. Finally, we also executed the circuit on an IBM quantum computer, underlying the feasibility and of quantum-assisted optimization for structure-based drug design and point towards the broader utility of advanced encoding techniques in quantum optimization for computational biology.", "url": "https://arxiv.org/abs/2608.19868", "type": "理论+数值", "summary": "1. 该工作提出并演示了一种面向NISQ数字量子计算机的资源高效混合量子-经典分子对接方案，将药物分子与受体的对接建模为最大顶点加权团问题并纳入变分优化框架。\n2. 其核心卖点是全基编码策略将经典二元变量映射为Bloch球矢量，并证明该目标函数的全局极小值可取纯乘积态，从而为单酉变分线路优化提供了严格理论基础，并结合随机虚时演化热启动与梯度技术。\n3. 该工作在IBM量子计算机上的执行验证了量子辅助结构药物设计的可行性，也为先进编码方法在计算生物学量子优化中的更广泛应用提供了明确启发。", "summary_source": "deepseek", "authors": [{"name": "Tianqi Chen"}, {"name": "Adrian M. Mak"}, {"name": "Jianguo Li"}, {"name": "Jian Feng Kong"}, {"name": "Chandra Verma"}, {"name": "Sebastian Maurer-Stroh"}], "featured_authors": [{"name": "Tianqi Chen"}, {"name": "Adrian M. Mak"}, {"name": "Jianguo Li"}, {"name": "Jian Feng Kong"}, {"name": "Chandra Verma"}, {"name": "Sebastian Maurer-Stroh"}], "author_count": 6}, {"id": "2608.19917", "category": "quant-ph", "title": "Disassembling qLDPC codes for depth-optimal parity-check circuits", "abstract": "Quantum low-density parity-check (qLDPC) codes offer a promising route to scalable fault-tolerant quantum computing, but their practical implementation requires efficient circuits for syndrome extraction. Many qLDPC families are assembled from a small set of components through explicit constructions that imprint edge symmetries on their Tanner graphs. We show that these symmetries can be exploited to design syndrome-extraction circuits from the underlying components, rather than from the full quantum code. For Lifted Product and Balanced Product codes this approach yields an analytical construction with provably optimal or near-optimal CNOT depth. For Quantum Tanner codes it produces depth-optimal circuits on every instance we test, including codes up to nearly 600 data qubits.", "url": "https://arxiv.org/abs/2608.19917", "type": "理论", "summary": "1. 该工作利用qLDPC码Tanner图的边对称性，从底层构件而非完整码设计综合征提取线路。\n2. 其核心优势是为Lifted Product与Balanced Product码给出解析构造，并证明其CNOT深度最优或近最优，对Quantum Tanner码测试至近600数据比特均达深度最优。\n3. 这为可扩展容错量子计算中高效奇偶校验线路的系统化设计提供了明确理论路径与验证基准。", "summary_source": "deepseek", "authors": [{"name": "Minh T. P. Nguyen"}, {"name": "Maximilian Rimbach-Russ"}, {"name": "Stefano Bosco"}], "featured_authors": [{"name": "Minh T. P. Nguyen"}, {"name": "Maximilian Rimbach-Russ"}, {"name": "Stefano Bosco"}], "author_count": 3}, {"id": "2608.19943", "category": "quant-ph", "title": "Imaginary time evolution of a quantum system through analytic continuation from real-time quantum simulation", "abstract": "Though quantum computing naturally offers an advantage for simulations of real-time quantum systems, implementing Imaginary-Time Evolution (ITE) is comparatively more difficult. Nevertheless, quantum implementations of ITE are useful both in cases where classical implementations have associated sign problems, and also as an exact method of preparing eigenstates on quantum computers. In this work we present an algorithm to obtain ITE of a generic quantum Hamiltonian by performing analytic continuation of measured real-time correlation functions. We present simulations and demonstrations on IBM quantum hardware of 1D Fokker-Planck equations for classical diffusion process and imaginary-time evolution of integrated correlation functions in 1D quantum mechanical scattering as examples to demonstrate the effectiveness of the method.", "url": "https://arxiv.org/abs/2608.19943", "type": "理论+数值", "summary": "1. 该工作提出一种量子算法，通过对实时量子模拟中测得的实时关联函数做解析延拓，获得一般量子哈密顿量的虚时演化。\n2. 其物理卖点在于规避了直接实现虚时演化的困难，并在IBM量子硬件上以1D Fokker-Planck方程的经典扩散过程及1D量子散射积分关联函数的虚时演化为示例，验证了方法的有效性。\n3. 这项技术为经典模拟面临符号问题的体系提供了可行研究途径，也为在量子计算机上以精确方式制备本征态给出了明确启发。", "summary_source": "deepseek", "authors": [{"name": "Peng Guo"}, {"name": "Anto Shibu"}, {"name": "Joshua Lin"}, {"name": "Yong Zhao"}], "featured_authors": [{"name": "Peng Guo"}, {"name": "Anto Shibu"}, {"name": "Joshua Lin"}, {"name": "Yong Zhao"}], "author_count": 4}, {"id": "2608.19945", "category": "quant-ph", "title": "Entangling two qudits of arbitrary dimension through light-atomic Faraday interaction", "abstract": "The paper investigates entangling operations acting on two qudits of arbitrary dimension, with one encoded in the states of a spatially multimode optical field, the other in those of atomic collective spin coherence, both carrying orbital angular momentum (OAM). We demonstrate the generation of a wide range of entangling operations within a protocol consisting of two Faraday interactions and a rotation of atomic and light quadratures between them. All generated gates can be represented as rational powers of the d-dimensional gate $SWAP^{\\alpha}_d$. The probabilities of two-qudit transformations are calculated for various dimensions of the logical space and for different entangling powers of the logical gates.", "url": "https://arxiv.org/abs/2608.19945", "type": "理论", "summary": "1. 该工作从理论上研究了光场空间多模轨道角动量态与原子集体自旋相干态所编码的两个任意维度qudit，经法拉第相互作用实现的纠缠门生成。\n2. 其技术要点是，在两次法拉第相互作用之间对光和原子正交分量施加旋转，从而将所生成的全部双qudit纠缠门统一表示为d维SWAP门的有理幂。\n3. 这一方案为光与原子混合系统中实现高维纠缠门提供了可扩展思路，其概率计算可指导选择逻辑空间维度和纠缠功率，以用于量子信息处理。", "summary_source": "deepseek", "authors": [{"name": "R. Surmay"}, {"name": "V.A. Leonov"}, {"name": "E.A. Vashukevich"}], "featured_authors": [{"name": "R. Surmay"}, {"name": "V.A. Leonov"}, {"name": "E.A. Vashukevich"}], "author_count": 3}, {"id": "2608.19988", "category": "quant-ph", "title": "Dynamical one-from-many quantum metrology: Sum rule and matrix-free precision bound", "abstract": "Practical quantum single-parameter estimation is rarely a pristine task; it almost invariably involves nuisance parameters, casting it as a one-from-many problem. Existing approaches to this problem rely on multi-parameter metrology, reducing the matrix quantum Cramér-Rao bound to obtain scalar quantum precision limits. However, these methods are often hampered by the demanding inversion of the quantum Fisher information (QFI) matrix and the requisite choice of a weight matrix, and they break down when the QFI matrix becomes singular. Here, we show that for dynamical one-from-many estimation, a previously overlooked sum rule connecting the QFI about all model parameters to the QFI about time necessitates including the latter to consider an augmented QFI matrix while simultaneously rendering it inherently singular--precisely the scenario where conventional approaches fail. To meet this challenge, we derive a tight, matrix-free quantum precision bound that involves only scalar quantities, offers broad applicability, and subsumes existing results as special cases. Validated in both unitary and noisy settings, our findings provide a refined operational framework for practical quantum single-parameter metrology.", "url": "https://arxiv.org/abs/2608.19988", "type": "理论", "summary": "1. 该工作研究动力学多中取一量子单参数估计，提出一个连接全部模型参数与时间的量子费希尔信息求和规则，并由此导出无需矩阵求逆的标量精度下界。\n2. 其核心在于证明该求和规则迫使增广量子费希尔信息矩阵必然奇异，恰为传统多参数方法失效的情形；新导出的紧致标量界无需权重矩阵，且包含已有结果作为特例。\n3. 该结果在幺正与噪声动力学中均得到验证，为实际量子单参数计量提供了更稳健的操作框架，并为奇异费希尔信息矩阵情形下的量子估计建立了新的理论基准。", "summary_source": "deepseek", "authors": [{"name": "Ziyu Xie"}, {"name": "Junjie Liu"}], "featured_authors": [{"name": "Ziyu Xie"}, {"name": "Junjie Liu"}], "author_count": 2}, {"id": "2608.20050", "category": "quant-ph", "title": "Radial Convex Geometry of Quantum States and Its Relation to Best Separable Approximation", "abstract": "We study bipartite entanglement from the convex geometry of quantum states. Taking the maximally mixed state as a reference point, we define a geometric entangled-space quantity $G(\\rho)=[1-L(\\rho)]/L(\\rho)$ from the relative positions of the separable and quantum-state boundaries, and introduce a relative entanglement degree $Q(\\rho)=[(1-p)/p]/G(\\rho)$ by comparing it with the robustness relative to the maximally mixed state. We apply this geometric construction to the Best Separable Approximation (BSA). For the optimal decomposition, we derive the general bound $(1-p)L_B/[p(1-L_B)]\\leq p_0\\leq Q(\\rho)$ and show that the entangled component of the BSA has an entangled-space size no smaller than that of the original mixed state, namely $[1-L_R]/L_R\\leq[1-L_B]/L_B$. For two-qubit states, the BSA entangled component is a pure entangled state. Using the PPT criterion, its geometric parameter can be evaluated explicitly, giving the bound $(1-p)/(2p)\\leq p_0\\leq Q(\\rho)$. These results provide a simple geometric description of the relation between BSA, robustness, and the entangled region of the quantum-state space.", "url": "https://arxiv.org/abs/2608.20050", "type": "理论+数值", "summary": "1. 该工作从量子态的径向凸几何出发研究两体纠缠，以最大混合态为参考定义几何纠缠空间量G(ρ)与相对纠缠度Q(ρ)，并将其用于最佳可分近似(BSA)。\n2. 其核心在于导出最优分解的一般不等式(1-p)L_B/[p(1-L_B)]≤p0≤Q(ρ)，并证明BSA中纠缠分量的纠缠空间尺寸不小于原混合态；对两量子比特，借助PPT判据可得显式边界(1-p)/(2p)≤p0≤Q(ρ)。\n3. 这为BSA、纠缠鲁棒性与态空间纠缠区域的关系提供了简洁几何描述，可启发纠缠资源度量及可分近似的理论与实验研究。", "summary_source": "deepseek", "authors": [{"name": "Haonan Qiang"}], "featured_authors": [{"name": "Haonan Qiang"}], "author_count": 1}, {"id": "2608.20063", "category": "quant-ph", "title": "PPT Entanglement with Correlated Catalysis: Monotones and Irreversibility", "abstract": "Quantum catalysts can overcome otherwise impossible quantum state transformations without being consumed, and allowing them to become correlated with the output makes this assistance substantially more powerful. This raises a fundamental question for entanglement theory: which limitations on state manipulation remain when such correlated catalysts are freely available? We answer this question in the positive-partial-transpose (PPT) resource theory, which allows a substantially broader class of operations than local operations and classical communication (LOCC). We identify general conditions under which regularized relative-entropy measures become strongly superadditive, and use them to construct monotones that constrain correlated catalytic PPT transformations without any knowledge of the catalyst. In particular, we prove that the regularized PPT relative entropy is fully additive and strongly superadditive, resolving an open problem in entanglement theory. Most importantly, these constraints show that even arbitrary correlated catalysts cannot restore asymptotic reversibility: for an explicit state, the optimal entanglement distillation rate remains strictly smaller than the entanglement cost. Thus, substantial catalytic assistance does not remove some of the fundamental limitations of mixed-state entanglement manipulation.", "url": "https://arxiv.org/abs/2608.20063", "type": "理论", "summary": "1. 该工作研究允许催化剂与输出关联的PPT纠缠态变换，并回答在此类相关催化剂免费时哪些操纵限制仍然保留。\n2. 其核心是建立正则化相对熵强超可加性的一般条件，据此构造不依赖催化剂信息的单调量，并证明正则化PPT相对熵的完全可加性与强超可加性，从而解决了一个开放问题。\n3. 进一步证明即使任意相关催化剂也不能恢复渐近可逆性，因为显式态的纠缠蒸馏率严格低于纠缠代价，表明混合态纠缠操纵存在固有限制。", "summary_source": "deepseek", "authors": [{"name": "Jingsong Ao"}, {"name": "Aby Philip"}, {"name": "Alexander Streltsov"}], "featured_authors": [{"name": "Jingsong Ao"}, {"name": "Aby Philip"}, {"name": "Alexander Streltsov"}], "author_count": 3}, {"id": "2608.20088", "category": "quant-ph", "title": "Squeezed- and coherent-state quantum key distribution over a deployed hybrid fibre-free-space channel", "abstract": "Quantum networks will combine optical fibre with free-space links, yet continuous-variable quantum key distribution (CV-QKD) has been developed predominantly for one medium or the other, while operation across concatenated fibre-free-space channels remains largely unexplored. The two media impose contrasting requirements: fibre transmission is stable and permits long processing intervals, whereas atmospheric propagation imposes transmittance fluctuations that degrade security and must be resolved on short timescales. Here we demonstrate a locally generated local oscillator CV-QKD with both Gaussian-modulated coherent and squeezed states over a deployed hybrid channel comprising a 620-m free-space link and 2 km of deployed fibre, with a total loss up to 20 dB. Rather than adapting the optics to each medium, we move channel adaptation to the post-processing, through a unified adaptive post-processing framework coupling transmittance-based clustering, residual-fading mitigation by covariance-matrix averaging or de-fading, and rate-adaptive blind reconciliation, which alone recovers up to 19% additional key. The same adaptive-processing principle is applied to both protocols, while accounting for their different security analyses and statistical requirements, yielding asymptotic secret-key rates of 0.42 Mbit per sec for the coherent-state protocol and 0.93 Mbit per sec for the squeezed-state protocol under the respective channel conditions, and establishing squeezed-state CV-QKD over a deployed atmospheric channel. These results show that adaptation to the transmission medium can largely be transferred to the data-processing layer, providing a route towards heterogeneous quantum networks spanning fibre, terrestrial free-space and satellite links.", "url": "https://arxiv.org/abs/2608.20088", "type": "理论+数值", "summary": "1. 该工作在一段由620米自由空间链路和2公里部署光纤组成的混合信道上，实现了本地本振连续变量量子密钥分发，并同时演示了高斯调制相干态与压缩态协议。\n2. 其技术核心是将信道自适应从光学端转移到后处理层，通过基于透射率聚类的统一自适应框架、协方差矩阵平均或去衰落处理及速率自适应盲协商，最多额外恢复19%密钥。\n3. 该结果表明介质适配可在数据处理层统一完成，为涵盖光纤、地面自由空间及卫星链路的异构量子网络提供了可行路径。", "summary_source": "deepseek", "authors": [{"name": "Dnan A.E. Hajomer"}, {"name": "Huy Q. Nguyen"}, {"name": "Ivan Derkach"}, {"name": "Andreas B. Kidmose"}, {"name": "Edoardo Rossi"}, {"name": "Mattia Sabatini"}, {"name": "Yoann Pietri"}, {"name": "Marco Avesani"}, {"name": "Francesco Vedovato"}, {"name": "Michael Hentschel"}, {"name": "Radim Filip"}, {"name": "Giuseppe Vallone"}, {"name": "Vladyslav Usenko"}, {"name": "Tobias Gehring"}, {"name": "Soren Forchhammer"}, {"name": "Paolo Villoresi"}, {"name": "Ulrik L. Andersen"}], "featured_authors": [{"name": "Dnan A.E. Hajomer"}, {"name": "Huy Q. Nguyen"}, {"name": "Ivan Derkach"}, {"name": "Soren Forchhammer"}, {"name": "Paolo Villoresi"}, {"name": "Ulrik L. Andersen"}], "author_count": 17}, {"id": "2608.20136", "category": "quant-ph", "title": "Boltzmann counting in Hilbert space", "abstract": "We introduce a geometric entropy for quantum preparations, defined as the logarithm of the Hilbert-space volume of pure states compatible with a given set of constraints. This construction extends Boltzmann's counting perspective to the quantum setting, where compatible states need not be orthogonal and the relevant notion of \"number of states\" is naturally replaced by a volume in state space. We analyze three classes of constraints: restriction to a subspace, fixed expectation values, and coarse-grained subsystem descr
