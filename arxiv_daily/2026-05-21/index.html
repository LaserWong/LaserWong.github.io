{"name": "Públio Rwany B. R. do Vale"}, {"name": "Ilya L. Shapiro"}], "author_count": 3}, {"id": "2605.20688", "category": "hep-th", "title": "Fusion of Integrable Defects and the Defect $g$-Function", "abstract": "We study exact defect $g$-functions for integrable line defects in two-dimensional integrable quantum field theory and use them to probe defect fusion. We consider three settings: fusion of purely transmitting topological defects, fusion of non-topological defects with reflection and transmission, and fusion of a defect with an integrable boundary. For topological defects, the separated logarithmic $g$-function is additive, and the fusion limit is controlled by the multiplicative composition of transmission factors. For non-topological defects, separation-dependent phases in the Bethe-Yang equations produce oscillatory finite-size effects, while the fused defect is described by effective reflection and transmission amplitudes. In the Ising examples studied here, fusion involving non-topological defects lowers the finite localized contribution to the entropy, whereas topological defect-boundary fusion leaves it unchanged.", "url": "https://arxiv.org/abs/2605.20688", "type": "理论", "summary": "1. 该工作通过精确缺陷g-函数，系统研究了二维可积量子场论中拓扑与非拓扑可积线缺陷的融合过程。\n2. 其核心在于揭示拓扑缺陷融合由透射因子乘法复合控制，而非拓扑缺陷则因Bethe-Yang方程中的分离相关相位产生振荡有限尺寸效应，融合后由有效反射透射振幅描述。\n3. 这为利用g-函数和缺陷融合调控量子场论中的熵贡献及边界物理提供了明确的理论框架，尤其适用于伊辛模型等可积系统。", "summary_source": "deepseek", "authors": [{"name": "Yang He"}, {"name": "Yunfeng Jiang"}, {"name": "Yuxiao Liu"}], "featured_authors": [{"name": "Yang He"}, {"name": "Yunfeng Jiang"}, {"name": "Yuxiao Liu"}], "author_count": 3}, {"id": "2605.20851", "category": "hep-th", "title": "Integrable sigma models with Haantjes structure on ${H_{4}}$ Lie group", "abstract": "By solving algebraic relations for the conditions of Haantjes structure on a Lie algebra ${\\G}$ and by using the corresponding automorphism group we proceed to classify all inequivalent algebraic Haantjes structures on ${\\G}$. In this manner, we obtain 34 inequivalent algebraic Haantjes structures on the ${h_{4}}$ Lie algebra. We deform the chiral sigma model on a Lie group by using Haantjes structure on it. Then we try to obtain conditions on this structure such that the deformed sigma model remains to be integrable. Finally, using the ${h_{4}}$ Haantjes structures and solving this conditions three new integrable sigma models on the ${H_{4}}$ Lie group are obtained.", "url": "https://arxiv.org/abs/2605.20851", "type": "理论", "summary": "1. 该工作通过对 \\(h_4\\) 李代数上代数Haantjes结构约束的求解，结合自同构群完成等价类分类，得到34种不等价结构；并将其用于手征sigma模型变形，通过严格导出可积性条件，在 \\(H_4\\) 李群上构造出三个新可积sigma模型。\n2. 其核心在于将代数Haantjes结构作为变形生成元，推导并求解使变形拉格朗日保持可积性的充分必要条件，从而将抽象李代数几何与可积场论的系统构建直接关联。\n3. 这一基于Haantjes结构分类的构造框架，为在其他非半单李群上发现可积sigma模型提供了可推广的方法论，并揭示了李代数内禀几何与可积性之间的深层联系，有望拓展至超对称或拓扑项情形。", "summary_source": "deepseek", "authors": [{"name": "Mirenayatollah Bahadori"}, {"name": "Ali Eghbali"}, {"name": "Adel Rezaei-Aghdam"}], "featured_authors": [{"name": "Mirenayatollah Bahadori"}, {"name": "Ali Eghbali"}, {"name": "Adel Rezaei-Aghdam"}], "author_count": 3}, {"id": "2605.20913", "category": "hep-th", "title": "Chaos-Integrability Transition in the BPS Subspace of the $\\mathcal{N}=2$ SYK Model", "abstract": "We study chaos-integrability transition purely within a BPS subspace of a specific supersymmetric model that interpolates between the chaotic $\\mathcal{N}=2$ SYK model and an integrable $\\mathcal{N}=2$ \"commuting\" SYK model. Using the framework of BPS chaos, we analyze the spectrum of an operator projected onto the BPS subspace. We numerically find that its spectral statistics exhibit random-matrix behavior near the SYK limit and smoothly transitions to Poisson statistics near the integrable limit. Our results provide a direct example of a chaos-integrability crossover diagnosed solely from BPS states.", "url": "https://arxiv.org/abs/2605.20913", "type": "理论", "summary": "1. 该工作通过分析投影算子的谱统计，研究了N=2 SYK模型BPS子空间内从混沌到可积的转变。\n2. 其核心在于利用BPS混沌框架，数值发现谱统计在SYK极限下呈现随机矩阵行为，并平滑过渡到可积极限下的泊松统计。\n3. 这为仅从BPS态诊断混沌-可积交叉提供了直接范例，有望推广至其他超对称模型中的相关研究。", "summary_source": "deepseek", "authors": [{"name": "Leon Miyahara"}, {"name": "Shono Shibuya"}], "featured_authors": [{"name": "Leon Miyahara"}, {"name": "Shono Shibuya"}], "author_count": 2}, {"id": "2605.20995", "category": "hep-th", "title": "Wasserstein Space of Quantum Chaos", "abstract": "We find that the effective dimension of the Wasserstein space of energy eigenstates decreases as a quantum system becomes more chaotic. To demonstrate this, we study a quantum coupled harmonic oscillator system using Husimi Q-representations, to which Sinkhorn-regularized optimal transport is applied to construct an embedding geometry via the Gram-spectrum method. We also demonstrate that exponential OTOC growth, referred to here as quantum scrambling even in the absence of chaos, induces a folding structure in the emergent Wasserstein space, which may underlie the chaotic reduction of the Wasserstein dimension. At the separatrix (the scrambling point) of the inverted harmonic oscillator, the Wasserstein distance correctly captures the Lyapunov exponent. Furthermore, we discover that a branching structure in the Wasserstein space signals quantum scar states within the chaotic sea of phase space. Our optimal transport approach thus provides a new diagnostic for quantum chaos, quantum scrambling, quantum scars, and quantum Lyapunov exponents. The observed chaotic dimensional reduction also supports the recent conjecture [ arXiv:2604.17649 ] that the Wasserstein space serves as an emergent holographic space through the manifold hypothesis, since chaoticity is a characteristic signature of black holes in holography.", "url": "https://arxiv.org/abs/2605.20995", "type": "理论", "summary": "1. 该工作利用Sinkhorn正则化最优传输方法构建能量本征态Husimi Q表示的Wasserstein空间嵌入几何，发现其有效维数随量子混沌增强而降低。\n2. 关键卖点在于Wasserstein距离准确捕捉反转谐振子分界线处的Lyapunov指数，指数级OTOC增长诱导的空间折叠结构解释了维数降低，且分支结构标识混沌海中的量子疤痕态。\n3. 这为量子混沌、量子搅乱和疤痕态提供了基于最优流形假设的新型诊断工具，同时支持Wasserstein空间作为全息涌现空间的猜想。", "summary_source": "deepseek", "authors": [{"name": "Koji Hashimoto"}, {"name": "Norihiro Tanahashi"}, {"name": "Kentaroh Yoshida"}], "featured_authors": [{"name": "Koji Hashimoto"}, {"name": "Norihiro Tanahashi"}, {"name": "Kentaroh Yoshida"}], "author_count": 3}, {"id": "2605.21252", "category": "hep-th", "title": "Exact Holographic Kinematics in AdS/CFT", "abstract": "We propose that holography contains an exact kinematic sector distinct from holographic dynamics. The appropriate setting for this sector is a CFT on an open solid torus in the Weyl frame. The open solid torus introduces an intrinsic scale, and the Weyl frame makes this scale manifest as an extra bulk direction. The resulting bulk-boundary pairs are exact and finite: no cutoff, large-$N$ limit, strong-coupling assumption, or heavy-operator approximation is required. The AdS geometry appearing in this sector should be understood as a kinematic geometry; only in special CFTs and appropriate limits is it promoted to a dynamical semiclassical bulk. The standard boundary-anchored dictionary entries are recovered only as singular limits. As a striking demonstration, we show that Weyl-frame two-point functions provide a replica-free definition of entanglement entropy.", "url": "https://arxiv.org/abs/2605.21252", "type": "理论", "summary": "1. 该工作提出全息对偶中存在一个与动力学分离的精确运动学扇区，通过在Weyl框架的开实心环面CFT实现。\n2. 其核心在于体-边关联对是精确且有限的，无需大N极限、强耦合或截断近似，AdS几何仅作为运动学结构出现。\n3. 这一框架为纠缠熵提供了无复制定义，并为区分全息对偶中运动学和动力学的本质角色提供了严谨途径。", "summary_source": "deepseek", "authors": [{"name": "Haitang Yang"}], "featured_authors": [{"name": "Haitang Yang"}], "author_count": 1}, {"id": "2605.21326", "category": "hep-th", "title": "Matching $A$ with $F$ in long-range QFTs", "abstract": "Unitarity is often a crucial ingredient in establishing theorems -- such as the $A$-theorem -- on the irreversibility of the renormalization group flow. The strongest thesis of this type of theorems would be that there exists a scalar function $A$ and a positive definite metric $G_{IJ}$ in the space of couplings such that the renormalization group flow satisfies a gradient equation, $\\partial_I A= G_{IJ}\\beta^J$, in which case $A$ is locally monotonic along the flow. In this paper we consider the long-range multiscalar $\\phi^4$ theory, which is a nonunitary model that is believed to be conformally invariant at fixed points, and show that its renormalization group flow satisfies the gradient structure up to the third loop order in the coupling. We also show that $A$ and $G_{IJ}$ can be matched to the leading nontrivial order with the sphere free-energy $\\tilde{F}$ and Zamolodchikov's metric $C_{IJ}$ of the corresponding conformal theory concentrating on the examples of the long-range vector $O(N)$ and hypercubic $H_N$ models. Our results imply a perturbative proof of the $\\tilde{F}$-theorem at the leading nontrivial order. We conclude the paper discussing briefly whether this result should hold to the next orders in perturbation theory.", "url": "https://arxiv.org/abs/2605.21326", "type": "理论", "summary": "1. 该文论证了非幺正长程多标量φ^4理论的重整化群流在耦合至三圈阶满足梯度结构，且存在标量函数A与正定度量G_IJ。\n2. 其技术核心在于将A和G_IJ与相应共形理论的球面自由能F̃及Zamolodchikov度量C_IJ在领头非平凡阶精确匹配，并基于长程矢量O(N)与超立方H_N模型实例验证。\n3. 这为F̃-定理在领头非平凡阶提供了微扰证明，并为后续高阶微扰圈图结果的普适性检验指明了方向。", "summary_source": "deepseek", "authors": [{"name": "Lorenzo Benfatto"}, {"name": "Omar Zanusso"}], "featured_authors": [{"name": "Lorenzo Benfatto"}, {"name": "Omar Zanusso"}], "author_count": 2}, {"id": "2605.21377", "category": "hep-th", "title": "Causal UV completions of relativistic hydrodynamics", "abstract": "Relativistic hydrodynamics successfully provides an effective field theory description for the low energy regime of many out-of-equilibrium systems. On the other hand, in this paper we proof that any stand-alone hydrodynamic EFT is inherently acausal and therefore requires the addition of transient UV modes in order to restore causality. This is made possible by the exponential decay of dissipative hydrodynamics in a majority of the lightcone, allowing the possibility of a causal description that still reduces to the hydrodynamic one at late timescales. We then investigate the emergence and possible restrictions of the non-hydrodynamic modes in these causal UV completions.", "url": "https://arxiv.org/abs/2605.21377", "type": "理论", "summary": "1. 该工作严格证明了任何独立的相对论性流体力学有效场论本质上都是非因果的，必须引入瞬态紫外模式才能获得因果完备的紫外理论。\n2. 其关键物理机制在于耗散流体力学在大部分光锥内呈现指数衰减，使得添加的非流体力学模式在长时标上仍能退化为流体力学描述，从而实现因果性恢复。\n3. 该工作还考察了这些非流体力学模式的涌现条件及其对流体动力学行为的可能限制，为相对论性耗散流体动力学的有效性范围及因果完备化提供了重要约束。", "summary_source": "deepseek", "authors": [{"name": "Robbe Brants"}], "featured_authors": [{"name": "Robbe Brants"}], "author_count": 1}, {"id": "2605.20338", "category": "math-ph", "title": "Higher-Rank Connections and Deformed Schrödinger Operators", "abstract": "We study the connection problem for a class of linear differential equations of order $N$ closely related to the Baxter equation of the quantum Toda chain. The space of solutions is $N$-dimensional and several linearly independent solutions decay at each singularity, leading to a rich structure of boundary value problems. We derive the weakest quantization conditions compatible with decaying behavior at both singularities, and formulate these conditions in terms of the associated monodromy data. In doing so, we prove the quantization conditions predicted by the topological string/spectral theory duality for a family of deformed Schrödinger equations. More generally, our results point to a hierarchy of spectral problems interpolating between the minimal conditions studied here and the maximally decaying boundary conditions of the $N$-particle quantum Toda chain.", "url": "https://arxiv.org/abs/2605.20338", "type": "理论", "summary": "1. 该工作研究了与量子Toda链Baxter方程相关的N阶线性微分方程的连接问题，推导了奇异点处多支衰减解所允许的最弱量子化条件。\n2. 其技术核心在于利用关联的单值性数据表述这些条件，从而严格证明了拓扑弦/谱理论对偶对一类变形薛定谔方程的量子化预言。\n3. 这揭示了一个插值于最小衰减条件与N粒子量子Toda链最大衰减边界条件之间的谱问题层次，为可积系统与对偶理论提供了新框架。", "summary_source": "deepseek", "authors": [{"name": "Jonah Baerman"}, {"name": "Alba Grassi"}, {"name": "Giovanni Ravazzini"}], "featured_authors": [{"name": "Jonah Baerman"}, {"name": "Alba Grassi"}, {"name": "Giovanni Ravazzini"}], "author_count": 3}, {"id": "2605.20589", "category": "math-ph", "title": "Universal thin-shell limits for the viscous operator on Riemannian hypersurfaces", "abstract": "We decompose the ambient Bochner Laplacian acting on tangential vector fields on a thin shell around an arbitrary smooth hypersurface $M^n \\hookrightarrow \\R^{n+1}$ into an intrinsic piece and a radial boundary-shear piece. The intrinsic piece is the deformation Laplacian $\\Delta_B^{(n)} + \\Ric^{(n)}$ on every hypersurface, regardless of extrinsic geometry. The boundary-shear piece is determined entirely by the normal profile of the velocity field. We prove that stress-free (Navier slip) boundary conditions yield the deformation Laplacian universally, and that Hodge (zero tangential vorticity) boundary conditions yield the Hodge Laplacian universally. Both results hold on any smooth hypersurface, not only on surfaces of constant curvature. This extends the sphere-specific results of Temam-Ziane and Miura to the general case and explains the extension-dependence found by Chan, Czubak, and Yoneda on the ellipsoid as a physical boundary-condition dependence. We also derive a continuous one-parameter family of boundary conditions interpolating between the two limits, producing an effective viscous operator $\\Delta_\\alpha = \\Delta_\\Def - 2\\alpha\\,\\Ric - 4\\alpha(1-\\alpha)S^2$ that couples to the extrinsic geometry (through the shape operator squared) only in the intermediate partial-slip regime.", "url": "https://arxiv.org/abs/2605.20589", "type": "理论", "summary": "1. 该工作将薄壳边界上作用于切向矢量场的Bochner拉普拉斯算子分解为内禀项与径向边界剪切项，并在任意光滑超曲面上导出普适的薄壳极限。\n2. 关键发现是：无应力边界条件普遍给出变形拉普拉斯算子，而Hodge边界条件给出Hodge拉普拉斯算子，二者均不依赖于超曲面的外在几何。\n3. 这解释了此前椭球面上边界条件依赖性的物理起源，并导出一族连续插值边界条件，其有效粘性算子仅在部分滑移区耦合于外在曲率（形状算子的平方）。", "summary_source": "deepseek", "authors": [{"name": "Zhi-Wei Wang"}, {"name": "Samuel L. Braunstein"}], "featured_authors": [{"name": "Zhi-Wei Wang"}, {"name": "Samuel L. Braunstein"}], "author_count": 2}, {"id": "2605.20662", "category": "math-ph", "title": "Conformal Barycenters in Quaternionic Hyperbolic Balls", "abstract": "We extend the notion of conformal barycenter, recently introduced by Jačimović and Kalaj for the complex hyperbolic ball, to the quaternionic unit ball $\\BH$. The quaternionic conformal barycenter of a measurable set $D$ with finite hyperbolic measure and finite first moment is defined as the unique point $c$ such that $\\int_D \\Phi_c(q)\\, \\dLam(q) = \\mathbf{0}$, where $\\Phi_c$ is the quaternionic Hua involution exchanging $0$ and $c$. Equivalently, it is the unique minimum of the energy functional $G(x) = \\int_D \\log\\cosh^2\\!\\big(\\frac12 d_H(x,y)\\big)\\, \\dLam(y)$. We prove existence and uniqueness using the strict geodesic convexity of $G$, which is established by a direct computation along geodesics. The barycenter is invariant under the full isometry group $\\mathrm{Sp}(n,1)$. We also treat finite point sets and provide explicit examples.", "url": "https://arxiv.org/abs/2605.20662", "type": "理论", "summary": "1. 该工作将复双曲球中共形重心的概念推广至四元数单位球，利用四元数Hua对合定义了可测集的重心为积分方程的唯一解。\n2. 技术关键在于通过沿测地线直接计算，证明能量泛函的严格测地凸性，从而确立重心存在唯一性及其在全等距群Sp(n,1)下的不变性。\n3. 该结果为四元数双曲几何中重心理论的系统发展提供了严格基础，并启发进一步推广至其他对称空间或应用于有限点集的显式构造。", "summary_source": "deepseek", "authors": [{"name": "Wensheng Cao"}, {"name": "Zhijian Ge"}], "featured_authors": [{"name": "Wensheng Cao"}, {"name": "Zhijian Ge"}], "author_count": 2}, {"id": "2605.21074", "category": "math-ph", "title": "Alpha-Dependent Cross-Tidal Residuals Beyond the Diagonal Newtonian Lunar Tensor: A Halilsoy-Inspired 45° Eigenframe Channel", "abstract": "The Earth-Moon tide is classically explained by the Newtonian quadrupolar tidal tensor. In its principal frame, this tensor gives the familiar 90-degree stretching-squeezing geometry and contains only the ordinary plus-type tidal channel. A projected acceleration can be evaluated along any direction, including the 45-degree direction, but this projection is not an independent cross-tidal residual. In this work, we propose a Halilsoy-inspired residual extension of the lunar tidal tensor. The motivation comes from Halilsoy's cross-polarized cylindrical gravitational waves, where an off-diagonal tidal sector naturally rotates the local tidal eigenframe. Using this relativistic mechanism as a guide, we introduce an alpha-dependent residual coefficient, chi_H(alpha,t,rho), representing a possible hidden off-diagonal tidal component beyond the diagonal Newtonian principal-frame tensor. The proposed residual does not destroy the ordinary 90-degree separation of the principal tidal axes. Instead, it rotates the whole eigenframe and produces a distinct 45-degree-type angular signature. This signature appears as an additional sin(2 beta) residual channel whose strongest directions are 45, 135, 225, and 315 degrees. The corresponding residual acceleration scale is controlled by chi_H. The model does not replace standard lunar tidal theory and does not identify the Earth-Moon system with a Halilsoy spacetime. Rather, it provides a testable residual ansatz: Newtonian gravity explains the dominant lunar tide, while the Halilsoy-inspired sector supplies an alpha-dependent off-diagonal cross channel that is absent from the diagonal Newtonian principal-frame description.", "url": "https://arxiv.org/abs/2605.21074", "type": "理论", "summary": "1. 该工作借鉴Halilsoy交叉极化柱面引力波的非对角本征框架旋转机制，提出月球潮汐张量的α依赖残差扩展，引入隐藏的非对角潮汐分量χ_H(α,t,ρ)。\n2. 其物理核心在于该残差不破坏牛顿主潮汐张量的90°主轴分离，而是整体旋转潮汐本征框架，产生特征角度为45°倍数的sin(2β)交叉残差通道，加速度量级由χ_H参数控制。\n3. 该残差假设为标准牛顿潮汐理论提供了一个可检验的扩展，在主导潮汐分量之外，为探测可能存在的非对角潮汐信号指明了明确的角度特征与参数依赖。", "summary_source": "deepseek", "authors": [{"name": "Muhittin Cenk Eser"}, {"name": "Mustafa Halilsoy"}], "featured_authors": [{"name": "Muhittin Cenk Eser"}, {"name": "Mustafa Halilsoy"}], "author_count": 2}, {"id": "2605.21201", "category": "math-ph", "title": "Relative trace formulas for obstacle scattering with Neumann and transmission boundary conditions", "abstract": "We consider the case of scattering by several obstacles in $\\mathbb{R}^d$ for $d \\geq 2$. We establish a relative trace formula for Neumann and transmission boundary conditions analogous to the one obtained in arXiv:2002.07291 for Dirichlet boundary conditions. In the case of $f(x) = x^{1/2}$ the trace has the interpretation of the Casimir energy of the obstacle configuration. In the one-dimensional case, we recover a rigorous version of the Lifshitz formula for the Casimir energy of parallel plates with frequency-independent electric permittivity and magnetic permeability. We thereby strengthen the mathematical foundations of the Casimir effect and demonstrate the flexibility of the rigorous approach established in arXiv:2104.09763 and arXiv:2002.07291 .", "url": "https://arxiv.org/abs/2605.21201", "type": "理论", "summary": "1. 该工作将障碍散射的相对迹公式从Dirichlet边界条件推广至Neumann与传输边界条件，建立了适用于多障碍物构型的数学框架。\n2. 核心在于该公式在特定函数取法下直接对应Casimir能量，且一维情形严格恢复Lifshitz公式，实现了物理可解释性与数学严谨性的统一。\n3. 这进一步夯实了Casimir效应的数学基础，并展示了该形式方法处理不同边界条件散射问题的灵活性与普适性潜力。", "summary_source": "deepseek", "authors": [{"name": "Arne Hofmann"}, {"name": "Alexander Strohmaier"}], "featured_authors": [{"name": "Arne Hofmann"}, {"name": "Alexander Strohmaier"}], "author_count": 2}, {"id": "2605.21327", "category": "math-ph", "title": "Universal fusion category symmetries on tensor products of infinite-dimensional Hilbert spaces", "abstract": "We show that anyon chains, after stabilizing with infinite-dimensional ancilla spaces, factorize locally as tensor products of infinite-dimensional Hilbert spaces. This implies that any unitary fusion category can be realized as symmetries on a tensor product of infinite-dimensional Hilbert spaces. We then show that any two anyon chains with the same symmetry category are related by a symmetry-compatible locality-preserving unitary after stabilizing with infinite-dimensional ancilla, showing that for a fixed fusion category, there is a single stable equivalence class of symmetry realizations on the lattice via anyon chains. As a corollary of our proof, we show that the physical boundary algebras of Levin-Wen type models are bounded spread isomorphic after stabilization if and only if they have the same bulk topological order.", "url": "https://arxiv.org/abs/2605.21327", "type": "理论", "summary": "1. 该工作证明任何子链经无限维辅助空间稳定后局部因子化为无限维希尔伯特空间张量积，从而将任意幺正融合范畴实现为无限维张量积上的对称性。\n2. 其核心卖点在于揭示具有相同融合范畴的任何两个任何子链在稳定后通过对称相容的保域性酉变换等价，确定了对称性实现的单一稳定等价类。\n3. 这为拓扑序分类提供新视角，表明Levin-Wen型模型物理边界代数在稳定后与体拓扑秩序一一对应，启发格点对称性实现的等价类研究。", "summary_source": "deepseek", "authors": [{"name": "Ian Bunner"}, {"name": "Corey Jones"}], "featured_authors": [{"name": "Ian Bunner"}, {"name": "Corey Jones"}], "author_count": 2}, {"id": "2605.21355", "category": "math-ph", "title": "Essentially singular limits of Jacobi operators and applications to higher-order squeezing", "abstract": "We study a family of Jacobi operators in which the diagonal entries are multiplied by a coupling parameter $\\lambda\\geq0$. Under suitable conditions, the operator is self-adjoint for every $\\lambda>0$, while the formal limit at $\\lambda=0$ is a symmetric Jacobi operator admitting a one-parameter family of self-adjoint extensions. A central ingredient of our analysis is the derivation of uniform bounds for square-summable generalized eigenvectors in the small-$\\lambda$ regime, which combines discrete WKB methods with Airy-function asymptotics. Using these estimates, we analyze the limiting behavior $\\lambda\\to0$ in the strong resolvent sense, proving that for every sequence $\\lambda_j\\to0$ one can extract a subsequence along which the corresponding Jacobi operators converge to some self-adjoint extension of the limiting operator; conversely, every such extension can be obtained in this way. We call this behavior an essentially singular limit, by analogy with essential singularities in complex analysis. As an application, we study higher-order squeezing operators arising in quantum optics. Using the connection with Jacobi operators, we show that when the relative strength of the free-field term tends to zero, different self-adjoint extensions of the squeezing operator are selected along different sequences. In particular, this limit does not single out a physically distinguished self-adjoint extension, but instead identifies a distinguished subclass of extensions compatible with the underlying symmetry.", "url": "https://arxiv.org/abs/2605.21355", "type": "理论", "summary": "1. 该工作研究一族带耦合参数λ的Jacobi算子在λ→0时的本质奇异极限，并应用于量子光学高阶压缩算子。\n2. 核心在于结合离散WKB方法与Airy函数渐近，导出小λ下广义特征向量的统一界，严格证明极限过程选取自伴延拓的普适性。\n3. 该极限不唯一确定物理延拓，而是识别出与底层对称性相容的延拓子类，为高阶压缩算子的数学基础提供关键约束。", "summary_source": "deepseek", "authors": [{"name": "Felix Fischer"}, {"name": "Daniel Burgarth"}, {"name": "Davide Lonigro"}], "featured_authors": [{"name": "Felix Fischer"}, {"name": "Daniel Burgarth"}, {"name": "Davide Lonigro"}], "author_count": 3}, {"id": "2605.20222", "category": "quant-ph", "title": "Quantum End-to-End Learning for Contextual Combinatorial Optimization", "abstract": "Contextual combinatorial optimization (CCO) plays a critical role in decision-making under uncertainty, yet remains a significant challenge. We present Quantum End-to-End Learning (QEL), the first quantum computing-based end-to-end learning framework for CCO that leverages Quantum Approximate Optimization Algorithms. Inspired by the integration of state preparation and evolution in data re-uploading, we propose a context re-uploading phase-separator that jointly captures the complex relations among contexts, uncertain coefficients, and optimal solutions. This allows a contextual encoder to be seamlessly integrated within a quantum surrogate policy, enabling joint end-to-end training with a stationarity guarantee. Exploiting an optimization-aware structure grounded in physical principles that classical methods cannot readily leverage, our approach demonstrates practicality by directly training on task loss despite the discreteness and nonconvexity, while avoiding calls to NP-hard optimization solvers. QEL empirically achieves competitive performance while requiring substantially fewer parameters than classical benchmarks, highlighting its industrial-level potential for the future quantum era.", "url": "https://arxiv.org/abs/2605.20222", "type": "理论+数值", "summary": "1. 该工作提出了首个基于量子近似优化算法的上下文组合优化端到端学习框架（QEL），在不确定性决策中实现联合训练。\n2. 其核心创新在于通过上下文重上传相位分离器将状态制备与演化深度集成，并利用优化感知物理结构直接可微训练离散非凸任务损失。\n3. 这一方法在参数效率上显著优于经典基准，为未来量子时代工业级组合优化提供了无需NP-hard调用器的实用范式。", "summary_source": "deepseek", "authors": [{"name": "Jaehwan Lee"}, {"name": "Changhyun Kwon"}], "featured_authors": [{"name": "Jaehwan Lee"}, {"name": "Changhyun Kwon"}], "author_count": 2}, {"id": "2605.20334", "category": "quant-ph", "title": "Halving the cost of QROM", "abstract": "Table lookup, often referred to as quantum read only memory (QROM), is one of the most widely used subroutines in quantum algorithms, and constitutes the majority share of algorithmic overheads in most practical applications of quantum computers. It involves the coherent loading of $N$ bitstrings of length $b$ in superposition, and naively has a non-Clifford cost of $N$ Toffolis. It is known that given access to $b\\, \\lambda$ dirty qubits, one can reduce the Toffoli cost of QROM to $2\\frac{N}{\\lambda} + 4b(\\lambda - 1)$. In this work, we first present an optimization to reduce this cost to $2\\frac{N}{\\lambda} + 2b(\\lambda - 1) + 2\\lambda-6$ by replacing the ``SelectSwap\" architecture with ``SelectCopy\". We then provide a further optimization for the qubit-constrained regime where the Toffoli cost is typically $\\sim 2\\frac{N}{\\lambda}$, and reduce it to $\\sim (1+\\frac{1}{b})\\frac{N}{\\lambda}$, cutting the cost by approximately $50\\%$ and effectively matching the performance of clean-qubit QROM using dirty qubits for practical values of $b$. Lastly, we provide a parametric family of methods that allow the interpolation of the prefactor of the $\\frac{N}{\\lambda} $ term from $2$ to ($\\, 1+\\frac{1}{b}\\,$) to obtain the best cost for different qubit availability regimes.", "url": "https://arxiv.org/abs/2605.20334", "type": "理论+数值", "summary": "1. 该工作通过引入SelectCopy架构和针对量子比特受限情形的进一步优化，将量子只读存储器（QROM）的Toffoli门成本降低约一半。\n2. 其技术核心在于用SelectCopy替代SelectSwap，并将脏量子比特下QROM的成本从约2N/λ降至约(1+1/b)N/λ，有效匹配了干净量子比特的性能。\n3. 所提出的参数化方法族允许在不同量子比特可用性场景下选择最优成本，有望显著减少量子算法中表查找子程序的开销。", "summary_source": "deepseek", "authors": [{"name": "Danial Motlagh"}, {"name": "Matthew Pocrnic"}], "featured_authors": [{"name": "Danial Motlagh"}, {"name": "Matthew Pocrnic"}], "author_count": 2}, {"id": "2605.20346", "category": "quant-ph", "title": "Forced Gap Post-Selection for Quantum LDPC Codes and their Operations", "abstract": "We develop a simple and general post-selection strategy for high-rate quantum codes that is transferrable across decoders. After an initial baseline run, the decoder is re-run once per logical observable, and forced in these latter runs to provide a solution where the given observable has the complementary outcome. Shots are rejected that find logically complementary solutions with similar likelihoods compared to the baseline. Using the Relay-BP decoder, we benchmark the strategy on the $72$-qubit and $144$-qubit bivariate bicycle codes, as well as surgery gadgets for the latter. In comparison to previous post-selection strategies, our results offer an improved logical error rate by over a factor of $4$ on the same circuit and physical error rate, and at the same rate of post-selection. Our strategies are also lightweight, relying only on FPGA-friendly belief propagation, whereas the previous best used repeated rounds of a high-latency BP-OSD decoder.", "url": "https://arxiv.org/abs/2605.20346", "type": "理论", "summary": "1. 该工作提出一种跨解码器可迁移的强制结果间隙后选择策略，用于高码率量子LDPC码的纠错。\n2. 其关键在于通过重新运行解码器并强制逻辑可观测量互补结果，拒绝似然相似样本，在相同电路与物理错误率下将逻辑错误率降低超4倍。\n3. 这一轻量级方法仅依赖FPGA友好型置信传播，为高码率码的容错操作及实验实现提供了实用启发。", "summary_source": "deepseek", "authors": [{"name": "Adam Wills"}, {"name": "Theodore J. Yoder"}, {"name": "Isaac Chuang"}], "featured_authors": [{"name": "Adam Wills"}, {"name": "Theodore J. Yoder"}, {"name": "Isaac Chuang"}], "author_count": 3}, {"id": "2605.20443", "category": "quant-ph", "title": "Interpreting Bohm quantum potentials in Computing quantum waves exactly from classical action", "abstract": "The recent arXiv posting [11], commenting on the paper [7], argues that the proof of Lemma 3.1 in [7] is missing the Bohm quantum potential [1, 2] of the Madelung p.d.e. [9]. This short technical note extends the proof of Lemma 3.1 to introduce a Bohm quantum potential explicitly, and then shows why this term can be assumed to be zero in the wave construction, without loss of generality. The continuity p.d.e. and the Hamilton-Jacobi p.d.e., extended by the Bohm potential, are undisputed. However, the actual action and density solutions depend on their initialization at t = 0. In [7], this initialization is motivated by the Feynman kernel [4], which is fundamentally different from the standard initialization of the Madelung solution [9]. This in turn leads to different action and density solutions, and explains why in one case the Bohm quantum potential disappears and in the other does not. The resulting overall wave, however, is independent of this computational initialization.", "url": "https://arxiv.org/abs/2605.20443", "type": "理论", "summary": "1. 该工作扩展了Lemma 3.1的证明，显式引入Bohm量子势，并论证在Feynman核驱动的初始化下该势可设为零而不失一般性。\n2. 其核心在于指出Bohm势消失与否取决于初始条件选择（Madelung标准初始化保留势，Feynman核初始化消去势），但最终波函数与路径无关。\n3. 这为从经典作用量精确计算量子波函数提供了方法论澄清，明确了Bohm势在不同计算路径中的等价角色。", "summary_source": "deepseek", "authors": [{"name": "Winfried Lohmiller"}, {"name": "Jean-Jacques Slotine"}], "featured_authors": [{"name": "Winfried Lohmiller"}, {"name": "Jean-Jacques Slotine"}], "author_count": 2}, {"id": "2605.20464", "category": "quant-ph", "title": "One-Dimensional Nonlinear Quantum Walks", "abstract": "We explore a continuous-time quantum walk starting at a single vertex on the discrete path and cycle with a cubic nonlinearity. Such nonlinearities arise in Bose-Einstein condensates described by the Gross-Pitaevskii equation or by nonlinear optical waveguide arrays. We analytically prove that the nonlinear quantum walk can be trapped to arbitrary fidelity depending on the coefficient of the nonlinear term. This contrasts with linear quantum walks, which are known for spreading quickly in one dimension. We propose that this trapping can be used for timing in quantum state transfer, where a qubit is held at a node until it is ready to be transferred, and it can also be held again at the receiving node. This scheme can also be interpreted as a form of quantum memory, with the trap and transfer corresponding to the storage and release of quantum information.", "url": "https://arxiv.org/abs/2605.20464", "type": "理论", "summary": "1. 本工作解析研究了离散路径与环上具有立方非线性的连续时间量子行走，初始激发位于单顶点。\n2. 其物理卖点在于证明非线性项系数可调控行走的俘获保真度至任意值，与线性量子行走的一维快速扩散形成根本对比。\n3. 该俘获机制为量子态传输中的定时延迟与节点存储提供了新方案，并可直接映射为量子存储器的写入与释放过程。", "summary_source": "deepseek", "authors": [{"name": "Yujia Shi"}, {"name": "Thomas G. Wong"}], "featured_authors": [{"name": "Yujia Shi"}, {"name": "Thomas G. Wong"}], "author_count": 2}, {"id": "2605.20542", "category": "quant-ph", "title": "Mean-field and fluctuation dynamics in off-resonant two-mode atom-field interactions", "abstract": "We study a two-level system coupled to two quantized electromagnetic modes within the Jaynes-Cummings framework. While the single-mode model is exactly solvable due to its conserved excitation number, yielding finite-dimensional invariant subspaces, the two-mode model extension presents a fundamental challenge: although the total excitation number remains conserved, each invariant subspace is infinite-dimensional, preventing a closed-form analytical solution. Our scheme separates the dynamics into a dominant, exactly solvable semiclassical component, the atom interacting with the mean fields of both modes, and treats the remaining quantum fluctuations through a sequence of unitary transformations that preserve essential quantum features. We validate our approach through direct comparison with numerical solutions, focusing on the non-resonant regime where multiple detunings give rise to rich interference effects and multi-timescale dynamics inaccessible to standard approximations. The method accurately reproduces atomic inversion, field observables, and fidelity over relevant timescales, while remaining computationally efficient.", "url": "https://arxiv.org/abs/2605.20542", "type": "理论+数值", "summary": "1. 该工作研究了二能级系统与两个量子化电磁模式耦合的Jaynes-Cummings模型中无穷维不变子空间的动力学，并提出平均场主导与量子涨落修正的分离方案。\n2. 其核心在于通过一系列幺正变换处理剩余量子涨落，保留量子相干性，并准确再现非共振区域多失谐干涉和多重时间尺度效应。\n3. 这为解析处理多模腔或电路QED中不可约简的量子涨落问题提供了计算高效的理论框架，可启发相关多模量子光学系统的精确研究。", "summary_source": "deepseek", "authors": [{"name": "Luis Medina-Dozal"}, {"name": "Alejandro R. Urzúa"}, {"name": "Carlos A. González-Gutiérrez"}, {"name": "José Récamier"}], "featured_authors": [{"name": "Luis Medina-Dozal"}, {"name": "Alejandro R. Urzúa"}, {"name": "Carlos A. González-Gutiérrez"}, {"name": "José Récamier"}], "author_count": 4}, {"id": "2605.20652", "category": "quant-ph", "title": "WSi weak link element with a non-sinusoidal current-phase relation", "abstract": "Nonlinearity is an essential ingredient for encoding quantum states with non-uniform energy spacing, implementing coherent quantum gates, reading out qubits, amplifying, and mixing electromagnetic signals. In this work, we demonstrate the nonlinear behavior of a constriction fabricated from an amorphous, high-kinetic inductance material, tungsten silicide, embedded in a three-dimensional RF-SQUID. We find that the results are consistent with the weak link behaving as a Josephson junction with a sawtooth-like current-phase relation or a quantum phase slip element. Finally, we measure relaxation times of the metastable, persistent-current states trapped in the local minima of the potential.", "url": "https://arxiv.org/abs/2605.20652", "type": "理论", "summary": "1. 该工作展示了嵌入三维射频超导量子干涉器中的非晶硅化钨弱链接元件的非线性行为，其电流-相位关系呈锯齿状。\n2. 技术卖点在于利用高动能电感材料实现非正弦电流-相位关系，实验证实其行为等效于约瑟夫森结或量子相位滑移元件。\n3. 这为基于弱链接非谐性的超导量子电路设计提供了新途径，尤其有利于量子态编码与读出中的非线性调控。", "summary_source": "deepseek", "authors": [{"name": "Sarah Garcia Jones"}, {"name": "Trevyn F. Q. Larson"}, {"name": "Sai Pavan Chitta"}, {"name": "Heli Vora"}, {"name": "Varun Verma"}, {"name": "Sae Woo Nam"}, {"name": "José Aumentado"}, {"name": "Jens Koch"}, {"name": "Raymond W. Simmonds"}, {"name": "András Gyenis"}], "featured_authors": [{"name": "Sarah Garcia Jones"}, {"name": "Trevyn F. Q. Larson"}, {"name": "Sai Pavan Chitta"}, {"name": "Jens Koch"}, {"name": "Raymond W. Simmonds"}, {"name": "András Gyenis"}], "author_count": 10}, {"id": "2605.20656", "category": "quant-ph", "title": "Entanglement Growth from Structured Initial States in Many-Body Localized Systems", "abstract": "Understanding how complex entanglement structures emerge is a central problem in quantum many-body physics. Recent work by Zhang et al. has considered structured initial states prepared by evolving a product state under a chaotic Hamiltonian for a finite time before quenching to the target Hamiltonian. In this setup, total entanglement entropy growth in many-body localized systems exhibits two distinct regimes, first increasing and then decreasing as the initial entanglement is tuned. In this work, we identify the physical origin of this behavior by analyzing the dynamics of both the Rényi entanglement entropy and the Wehrl-Rényi entropy in the random-field XXZ model, the latter of which characterizes multipartite entanglement. We show that a similar non-monotonic dependence on the initial entanglement also appears in the net growth of the Wehrl-Rényi entropy for product states polarized along the $z$-direction. The first regime is governed by a finite magnetization associated with local integrals of motion, while the second reflects inter-site correlations. In contrast, for product states in the $x/y$-direction, the entanglement growth exhibits a monotonic decay. Our results provide a more fine-grained picture of how distinct initial-state properties shape entanglement dynamics in many-body localized systems.", "url": "https://arxiv.org/abs/2605.20656", "type": "理论", "summary": "1. 该工作通过随机场XXZ模型，研究了多体局域化系统中从结构化初始态开始的纠缠熵增长，发现了非单调依赖行为。\n2. 其核心在于利用Wehrl-Rényi熵刻画多体纠缠，将增长的两个区域分别归因于局域守恒量的有限磁化和站点间关联。\n3. 这揭示了初始态极化方向对纠缠动力学的精细调控，为在局域化系统中设计信息传播模式提供了物理依据。", "summary_source": "deepseek", "authors": [{"name": "Chen Xu"}, {"name": "Pengfei Zhang"}], "featured_authors": [{"name": "Chen Xu"}, {"name": "Pengfei Zhang"}], "author_count": 2}, {"id": "2605.20661", "category": "quant-ph", "title": "Entangling Power: A Probe of Symmetry and Integrability in Quantum Many-Body Systems", "abstract": "The entangling power of a unitary operator quantifies its ability to generate entanglement from product states and provides a natural probe of quantum many-body dynamics. Entanglement extremization at points of enhanced symmetry has previously been observed in high-energy scattering. In this work we compute the time-averaged entangling power of anisotropic Heisenberg spin chains across two-site models and finite-size systems, as well as the entangling power of the two-magnon $S$-matrix in the thermodynamic limit. For two-site models we establish a monotonic hierarchy: the entangling power decreases as the symmetry group grows, reaching its minimum at the $SU(2)$ XXX point. Finite-size XXZ chains exhibit sharp dips at the $SU(2)$ points $\\Delta=\\pm 1$ and the free-fermion point $\\Delta=0$, with the free-fermion dip decaying much more slowly with system size. In the thermodynamic limit, we decompose the two-magnon $S$-matrix into quantum logic gates -- Identity, SWAP, and $\\sigma_z\\otimes\\sigma_z$ -- and show that the entangling power vanishes for all scattering energies at the $SU(2)$ points, where the $S$-matrix reduces to the Identity gate, while the free-fermion point achieves the maximum -- the opposite of the finite-size many-body behavior. The entangling power can serve as an {\\em operator} diagnostic for symmetry and selected aspects of integrability in quantum simulations of spin-chain dynamics.", "url": "https://arxiv.org/abs/2605.20661", "type": "理论+数值", "summary": "1. 该工作计算了各向异性海森堡自旋链的时间平均纠缠能力及热力学极限下双磁子S矩阵的纠缠能力。\n2. 关键发现是纠缠能力随对称群增大单调递减，SU(2)点取极小值，而有限尺寸自由费米子点尖峰在热力学极限下转为极大，揭示多体与散射纠缠行为反转。\n3. 这为量子模拟中利用纠缠能力作为算符探针诊断对称性和可积性提供了明确途径。", "summary_source": "deepseek", "authors": [{"name": "Ian Low"}, {"name": "Pallab Goswami"}], "featured_authors": [{"name": "Ian Low"}, {"name": "Pallab Goswami"}], "author_count": 2}, {"id": "2605.20703", "category": "quant-ph", "title": "Strongly-coupled non-Markovian waveguide QED with input-output HEOM", "abstract": "We consider the problem of modeling a single qubit in contact with a one-dimensional waveguide beyond the standard perturbative and Markovian approximations. Using the recently developed input-output hierarchical equations of motion (io-HEOM), we investigate multiple examples of such waveguides, characterized by different spectral densities. Our examples highlight that the io-HEOM method can accurately capture non-Markovianity in waveguide QED from two distinct origins. The first source of non-Markovianity is spatially non-local coupling between the qubit and the waveguide. By examining two examples with non-local coupling, we show how the coupling function affects the steady-state bound photons, and demonstrate the release of these photons when the qubit energy is quenched. The second source of non-Markovianity is non-linear dispersion. We illustrate this scenario using the example of a cavity array with point-like coupling, where the non-linear dispersion leads to persistent oscillations due to Van Hove singularities in the spectral density.", "url": "https://arxiv.org/abs/2605.20703", "type": "理论", "summary": "1. 该工作采用输入输出分级运动方程方法，对单量子比特与一维波导的非马尔可夫强耦合问题进行了精确建模。\n2. 其核心在于揭示了两种不同的非马尔可夫性起源：空间非局域耦合导致稳态束缚光子及其能量猝灭释放，非线性色散通过范霍夫奇点引发持续振荡。\n3. 这为超越马尔可夫近似的强耦合波导量子电动力学体系中非平庸动力学的定量研究提供了有效工具与明确预测。", "summary_source": "deepseek", "authors": [{"name": "Neill Lambert"}, {"name": "Yi-Te Huang"}, {"name": "Yueh-Nan Chen"}, {"name": "Paul Menczel"}, {"name": "Franco Nori"}], "featured_authors": [{"name": "Neill Lambert"}, {"name": "Yi-Te Huang"}, {"name": "Yueh-Nan Chen"}, {"name": "Paul Menczel"}, {"name": "Franco Nori"}], "author_count": 5}, {"id": "2605.20765", "category": "quant-ph", "title": "Precision and Privacy in Distributed Quantum Sensing: A Quantum Fisher Information Duality", "abstract": "We establish a quantum Fisher information (QFI) duality for distributed quantum sensor networks with local phase encoding. For any $N$-qubit probe state, where $N$ denotes the number of sensors, $F_Q(\\boldsymbol{w}^\\top \\boldsymbol{\\theta}) + F_Q(\\boldsymbol{v}^\\top \\boldsymbol{\\theta}) \\leq N$ for all unit orthogonal sensing directions $\\boldsymbol{w}$ and $\\boldsymbol{v}$, with equality for all equatorial states when $N=2$ and for Greenberger--Horne--Zeilinger (GHZ) states when $N\\geq 2$. Heisenberg-limited precision for direction $\\boldsymbol{w}$, $F_Q(\\boldsymbol{w}^\\top \\boldsymbol{\\theta})=N$, saturates the bound and simultaneously forces zero QFI for all other independent directions. This can be interpreted as the condition for parameter privacy in distributed quantum sensing: attaining Heisenberg-limited precision for the sensing target renders all alternative privacy-intrusive estimations impossible.", "url": "https://arxiv.org/abs/2605.20765", "type": "理论", "summary": "1. 该工作建立了分布式量子传感网络中关于局部相位编码的量子Fisher信息对偶性。\n2. 技术核心是证明对任意N比特探针态，单位正交感测方向的QFI之和不超过N，且海森堡极限精度迫使所有其他独立方向QFI为零，从而实现参数隐私。\n3. 这一对偶性揭示了精密测量与隐私保护间的内在制约关系，为设计兼具最优精度和隐私保障的分布式量子传感协议提供了理论基础。", "summary_source": "deepseek", "authors": [{"name": "Farhad Farokhi"}], "featured_authors": [{"name": "Farhad Farokhi"}], "author_count": 1}, {"id": "2605.20776", "category": "quant-ph", "title": "Generalized quantum Stein's lemma for mixed sources", "abstract": "The generalized quantum Stein's lemma characterizes the optimal asymptotic exponent of the type-II error in quantum hypothesis testing for an independent and identically distributed (IID) null hypothesis against a composite alternative hypothesis. Classically, a probabilistic mixture of IID sources arises as a natural generalization of IID sources, and, in the non-composite setting, the optimal type-II error exponent in hypothesis testing for such classical mixed sources is known to be characterized concisely by the worst-case component of the mixture. In this work, we extend these foundational results to composite quantum hypothesis testing where the null hypothesis is a mixed source, i.e., a probabilistic mixture of IID quantum states, and the alternative hypothesis is composite as in the generalized quantum Stein's lemma. When the type-I error vanishes asymptotically, we characterize the optimal type-II error exponent of this composite quantum hypothesis testing problem in terms of the worst-case component of the mixture, by developing techniques for the non-commutative quantum setting inspired by the classical information-spectrum analysis. We also show that the analogous characterization does not hold in general for a fixed nonzero type-I error threshold, by providing a counterexample beyond the vanishing type-I error regime. These results clarify the applicability of the generalized quantum Stein's lemma to highly non-IID null hypotheses arising from arbitrary finite probabilistic mixtures of IID quantum states.", "url": "https://arxiv.org/abs/2605.20776", "type": "理论", "summary": "1. 该工作将广义量子Stein引理推广至零假设为概率混合的独立同分布量子态情形，刻画了复合假设检验中II类误差的最优渐近指数。\n2. 通过发展非交换量子信息谱技术，证明当I类误差渐近为零时该指数由混合源最差分量决定，并给出固定非零I类误差阈值下其不成立的反例。\n3. 这阐明了广义量子Stein引理对非独立同分布零假设（任意有限混合的独立同分布量子态）的适用边界，为量子资源理论中更一般的假设检验问题提供启示。", "summary_source": "deepseek", "authors": [{"name": "Haruka Kanazawa"}, {"name": "Hayata Yamasaki"}], "featured_authors": [{"name": "Haruka Kanazawa"}, {"name": "Hayata Yamasaki"}], "author_count": 2}, {"id": "2605.20907", "category": "quant-ph", "title": "Symmetric dilations of Pauli channels and semigroups", "abstract": "We explore the symmetry properties of Stinespring dilations of single-qubit Pauli channels, addressing both the generic case and the specific examples of phase damping and depolarizing channels. For each scenario, we derive the representation of the Pauli group acting on the Hilbert space of the environment. We then focus on dilations that are continuous in time and driven by a time-independent Hamiltonian, and on collision models that generate a Pauli dynamical semigroup in the limit of fast collisions. First, we complement some recent general results on these types of dilations (M. Cattaneo, Phys. Rev. A 111, 022209 (2025)) with some additions and clarifications, including the case of covariant channels with strongly conserved quantities. Next, we show that the covariance property of Pauli channels impose strong constraints on both the dilation Hamiltonian and the initial state of the environment, and demonstrate how these constraints can be exploited to explicitly construct the time-dependent dilations in all considered cases. Our results are relevant for the quantum simulation of Pauli channels via unitary dilations and of Pauli semigroups via collision models, both in the laboratory and on quantum computers.", "url": "https://arxiv.org/abs/2605.20907", "type": "理论+数值", "summary": "1. 本文系统研究了单量子比特泡利通道及其半群的Stinespring膨胀的对称性，涵盖一般情形及相位阻尼与退极化通道特例。\n2. 核心卖点在于揭示协变性对膨胀哈密顿量与环境初态的强约束，并展示如何利用这些约束显式构造所有情形的时间依赖膨胀。\n3. 这为实验与量子计算机上通过幺正膨胀模拟泡利通道及通过碰撞模型模拟泡利半群提供了可行途径。", "summary_source": "deepseek", "authors": [{"name": "Marco Cattaneo"}], "featured_authors": [{"name": "Marco Cattaneo"}], "author_count": 1}, {"id": "2605.20930", "category": "quant-ph", "title": "Symmetry-Protected Fast Relaxation and the Strong Quantum Mpemba Effect", "abstract": "Understanding how symmetry constrains dissipative relaxation in open quantum many-body systems remains a central challenge in nonequilibrium physics. Here we uncover a symmetry-selective Liouvillian mechanism that protects an isolated fast-decay channel in a long-range XXZ spin chain subject to dephasing noise. At the \\(SU(2)\\)-symmetric point, highly symmetric initial states couple exclusively to an exact Liouvillian eigenmode with decay rate \\(\\lambda=-2\\), producing universal exponential relaxation independent of system size and interaction range. Breaking the symmetry restores overlap with slow Liouvillian modes and substantially suppresses the relaxation dynamics. This symmetry-filtered mode accessibility naturally gives rise to a strong quantum Mpemba effect, where a state farther from the steady state relaxes anomalously faster than closer thermal states. Our results establish symmetry-protected fast relaxation as a mechanism for controlling nonequilibrium pathways in open quantum systems.", "url": "https://arxiv.org/abs/2605.20930", "type": "理论", "summary": "1. 该工作揭示了一类受对称性保护的快速弛豫机制及强量子Mpemba效应，基于退相干XXZ长程自旋链中的Liouvillian本征模选择性耦合。\n2. 核心卖点在于SU(2)对称点处孤立的本征模具有速率λ=-2，产生与系统尺寸和相互作用范围无关的普适指数弛豫。\n3. 这为通过对称性调控开放量子系统的非平衡弛豫路径与量子Mpemba效应提供了明确物理机制。", "summary_source": "deepseek", "authors": [{"name": "Zijun Wei"}, {"name": "Mingdi Xu"}, {"name": "Yefeng Song"}, {"name": "Yangqian Yan"}, {"name": "Lei Pan"}], "featured_authors": [{"name": "Zijun Wei"}, {"name": "Mingdi Xu"}, {"name": "Yefeng Song"}, {"name": "Yangqian Yan"}, {"name": "Lei Pan"}], "author_count": 5}, {"id": "2605.20958", "category": "quant-ph", "title": "High-Dimensional Carrier-Assisted Entanglement Purification Based on Mutually Unbiased Bases", "abstract": "Distilling high-dimensional quantum entanglement under realistic, general asymmetric noise remains a formidable challenge. Standard entanglement purification protocols inevitably fail to satisfy convergence constraints under severe asymmetric noise. In this paper, we investigate carrier-assisted entanglement purification protocols, namely CAEPP and mCAEPP, for two-qutrit systems, demonstrating that without adaptive pre-processing, convergence is strictly bottlenecked by marginal $X$-error probabilities. To overcome this limitation, we introduce a deterministic pre-processing scheme based on mutually unbiased bases (MUBs). By actively rotating the qutrit phase space to establish primary-axis error dominance, we rigorously prove that the MUB-adapted mCAEPP deterministically yields unit asymptotic fidelity for any two-qutrit Pauli channel with initial fidelity $p_{00} > 1/3$.", "url": "https://arxiv.org/abs/2605.20958", "type": "理论", "summary": "1. 该工作研究了基于互无偏基的确定性预处理方案，用于两qutrit载子辅助纠缠纯化协议。\n2. 其核心在于通过旋转qutrit相位空间建立主轴错误优势，克服了非对称噪声下收敛的边际X-错误瓶颈。\n3. 这为高维量子纠缠在现实噪声道中的高效蒸馏提供了理论保证，并可推广至其他高维系统。", "summary_source": "deepseek", "authors": [{"name": "Zihua Song"}, {"name": "Lin Chen"}, {"name": "Yongge Wang"}], "featured_authors": [{"name": "Zihua Song"}, {"name": "Lin Chen"}, {"name": "Yongge Wang"}], "author_count": 3}, {"id": "2605.21018", "category": "quant-ph", "title": "Photon Efficiency of High-Dimensional Quantum Key Distribution", "abstract": "We investigate entanglement-based quantum key distribution protocols, with particular emphasis on their efficiency under realistic conditions of satellite quantum communications, where performance is limited by the low power of a received signal and background radiation. We focus on scenarios where each photon pair is used to encode multiple qubits in order to optimally utilize the weak signal. By optimizing over the source intensity and the number of encoded qubits we study the theoretical information limit for the QKD efficiency. We show that the optimal efficiency is attained for finite entangled photons pair production probability which is in contrast to conventional communication efficiency maximized in the limit of vanishing signal strength. The multiqubit encoding can enhance the secret key rate by up to an order of magnitude compared to single-qubit schemes.", "url": "https://arxiv.org/abs/2605.21018", "type": "理论+数值", "summary": "1. 该工作从理论和优化角度研究了纠缠基高维量子密钥分发在卫星通信现实条件下的光子效率极限。\n2. 其卖点在于发现最优效率并非出现在信号强度趋零的极限，而是在有限纠缠光子对产生概率处，并揭示了多比特编码可提升密钥率一个数量级。\n3. 这为在低接收功率和背景噪声限制下设计高效卫星量子通信协议提供了明确的优化方向与性能基准。", "summary_source": "deepseek", "authors": [{"name": "Vera Uzunova"}, {"name": "Marcin Jarzyna"}], "featured_authors": [{"name": "Vera Uzunova"}, {"name": "Marcin Jarzyna"}], "author_count": 2}, {"id": "2605.21034", "category": "quant-ph", "title": "Impurity-induced loss bursts from anomalous scale-free localization in a non-Hermitian dissipative lattice", "abstract": "We identify anomalous scale-free localization and the associated impurity-induced loss bursts in a non-Hermitian dissipative cross-stitch lattice. By a local basis rotation, the model is mapped onto an effective non-Hermitian Su-Schrieffer-Heeger lattice, where local impurities act as tunable effective boundaries. For the parameter choice considered here, tuning the impurity strength $\\eta$ connects two effective open-boundary-condition-like limits, reached for $\\eta\\to0$ and $\\eta\\to\\infty$, through generalized-boundary-condition regimes and the impurity-free periodic-boundary-condition point at $\\eta=1$. For finite $\\eta\\notin\\{0,1\\}$, the spectral loops remain separated from the real-energy axis, while the eigenstates exhibit scale-free localization pinned by the impurity. Unlike conventional impurity-induced scale-free localization, the Lyapunov exponent depends explicitly on the eigenenergy, making the localization strength eigenstate dependent. We further show that this anomalous eigenmode structure produces an impurity-induced loss burst: the long-time integrated dissipation probability is strongly enhanced near an impurity-generated effective boundary even when the initial wave packet is far away. In the single-impurity case, the burst region consists of the impurity site and its adjacent effective-boundary site, and the effect occurs without imaginary-gap closing. For multiple impurities, local burst regions emerge around all impurities, while the dominant burst boundary is selected by the initial wave-packet position and the nonreciprocal drift direction. These results connect anomalous scale-free localization with controllable dissipation dynamics in non-Hermitian lattices.", "url": "https://arxiv.org/abs/2605.21034", "type": "理论", "summary": "1. 该工作在非厄米耗散交叉链格点中识别了异常标度无关局域化及其引发的杂质诱导损耗爆发。\n2. 其核心在于通过局域基矢变换将模型映射为有效非厄米SSH格点，使杂质充当可调有效边界，导致本征态呈现能量依赖的Lyapunov指数，且长时积分耗散概率在杂质附近显著增强。\n3. 这为非厄米晶格中利用杂质缺陷可控地调控耗散动力学与定向能量输运提供了明确物理机制与设计思路。", "summary_source": "deepseek", "authors": [{"name": "Hui Liu"}, {"name": "Zhihao Xu"}], "featured_authors": [{"name": "Hui Liu"}, {"name": "Zhihao Xu"}], "author_count": 2}, {"id": "2605.21036", "category": "quant-ph", "title": "Quantum theory of a three-photon Kerr parametric oscillator", "abstract": "We investigate the quantum properties of a nonlinear Kerr oscillator driven by a three-photon pump. We derive both exact and approximate analytical expressions for the ground state of this interacting model. The exact solution arises at an exact spectral degeneracy, while the approximate solution describes regimes of quasi-degeneracy of the energy spectrum. In both cases, the threefold (quasi)degenerate ground-state manifold consists of quantum superpositions of three macroscopically distinct states. These states differ qualitatively from conventional three-component Schrödinger's cat states due to the presence of squeezing with a distinctive parametric dependence. By varying the detuning between the oscillator and the three-photon pump, we show that the squeezing can be enhanced, suppressed, or even reversed, leading to a squeezing-to-anti-squeezing transition. We analyze the generation and stabilization of these superposition states, their robustness against perturbations and analytically quantify the leakage to excited states. Our analysis elucidates how the three-photon Kerr parametric oscillator can be used to encode a Kerr-cat qutrit protected against phase-flip errors.", "url": "https://arxiv.org/abs/2605.21036", "type": "理论", "summary": "1. 该工作解析研究了由三光子泵浦驱动的非线性Kerr振荡器，推导出基态的精确解和近似解析解。\n2. 其核心发现是三重（准）简并基态流形由三种宏观可区分态的量子叠加构成，并展现出可通过失谐调控的压缩-反压缩相变。\n3. 这为实现受相位翻转保护的Kerr-cat qutrit编码提供了理论方案，并量化了其抗扰动能力与泄漏特性。", "summary_source": "deepseek", "authors": [{"name": "Alessandro Bruno"}, {"name": "Patrick P. Potts"}, {"name": "Alexander Grimm"}, {"name": "Matteo Brunelli"}], "featured_authors": [{"name": "Alessandro Bruno"}, {"name": "Patrick P. Potts"}, {"name": "Alexander Grimm"}, {"name": "Matteo Brunelli"}], "author_count": 4}, {"id": "2605.21045", "category": "quant-ph", "title": "Towards transistor-based quantum computing", "abstract": "In this work, we propose and study in depth a universal quantum computing architecture based on a quantum construction of transistors. Our teleportation-based quantum transistors, called ``telesistors'', are ground states of systems with symmetry-protected topological order, hence suppress certain noises and provide high-fidelity Clifford gates without the need for active error correction. This physical protection, quantified by the string order parameters, serves as a low-overhead foundation upon which conventional fault-tolerant encoding (e.g., with stabilizer codes) can be built to achieve universal quantum computation. This architecture shows rich connections with current known architectures, and some desirable merits especially compared with the qubit-based circuits regarding modularity, integration, and program storage. Our study shows that it is plausible to realize it with current technology in the near future.", "url": "https://arxiv.org/abs/2605.21045", "type": "理论", "summary": "1. 该工作提出并深入分析了基于量子晶体管（telesistor）的通用量子计算架构，其晶体管单元通过量子隐形传态操作实现门。\n2. 技术核心在于该量子晶体管为对称保护拓扑序的基态，由弦序参数量化的物理保护可抑制特定噪声，从而无须主动纠错即能高保真执行Clifford门，并为后续稳定子码的低开销容错提供基础。\n3. 该架构与现有量子架构联系紧密，在模块化、集成度和程序存储方面优于传统量子比特线路，且基于当前实验技术有望近期实现通用量子计算。", "summary_source": "deepseek", "authors": [{"name": "Y.-D. Liu"}, {"name": "X. Xu"}, {"name": "Q.-R. Wang"}, {"name": "D.-S. Wang"}], "featured_authors": [{"name": "Y.-D. Liu"}, {"name": "X. Xu"}, {"name": "Q.-R. Wang"}, {"name": "D.-S. Wang"}], "author_count": 4}, {"id": "2605.21140", "category": "quant-ph", "title": "Optimization of Secret Key Rate for BB84 under Collective Rotation Noise", "abstract": "Practical quantum key distribution (QKD) systems operate under noise, but security of most protocols have been analyzed under ideal noiseless scenarios. In this work, we investigated security performance of BB84 protocol under effect of collective rotation noise. Using theoretical quantum information frameworks, we analyzed key security parameters including quantum bit error rate (QBER), mutual information and secret key rate (SKR). Security of protocol is studied under various eavesdropping scenarios based on intercept and resend attacks. Our results show that collective rotation noise has a significant impact on the information shared between the two parties. Particularly, we extended prior treatments by suggesting a noise engineering strategy where we identified a non-zero noise range where information accessed by Eve is minimized while corresponding SKR degradation remains relatively small. This analysis provide insights into robustness of BB84 protocol under realistic noisy channels and may contribute towards development of more resilient QKD systems.", "url": "https://arxiv.org/abs/2605.21140", "type": "数值", "summary": "1. 该工作分析了BB84协议在集体旋转噪声下的安全性，计算了量子比特误码率、互信息与秘密密钥率随噪声强度的变化。\n2. 核心在于提出一种噪声工程策略，识别出特定非零噪声范围，使窃听者Eve获取的信息最小化而密钥率损失相对较小。\n3. 这为在真实噪声信道中优化QKD系统鲁棒性提供了理论依据，可启发更实用的抗噪声协议设计。", "summary_source": "deepseek", "authors": [{"name": "Wajiha Masood"}, {"name": "Muhammad Waseem"}, {"name": "Afshan Irshad"}], "featured_authors": [{"name": "Wajiha Masood"}, {"name": "Muhammad Waseem"}, {"name": "Afshan Irshad"}], "author_count": 3}, {"id": "2605.21213", "category": "quant-ph", "title": "Enhanced Reinforcement Learning-based Process Synthesis via Quantum Computing", "abstract": "In this work, we present quantum reinforcement learning (RL) as a solution strategy for process synthesis problems. Building on our prior work, we develop a generalized framework that formally poses process synthesis as a Markov decision process and introduces quantum-enhanced RL algorithms to solve it with improved scalability. Earlier implementations of quantum-based RL for process synthesis were limited by qubit requirements, which scaled poorly with problem complexity. This work overcomes this challenge by introducing state encoding algorithms to decouple qubit requirements from problem size. A classical RL-based solution strategy is used as a baseline to benchmark the quantum algorithms under identical training conditions. All algorithms are evaluated across a flowsheet synthesis problem of increasing unit counts to analyze their performance and scalability. Results show that all approaches are capable of identifying the optimal flowsheet designs in small design spaces. For moderate-scale unit counts, quantum approaches demonstrate competitive performance on a per-episode basis and improved efficiency on a per-parameter basis versus the classical RL benchmark. This work provides a foundation for future quantum computing applications within process systems engineering, establishes a controlled benchmark for comparing classical and quantum algorithms, and shows that the proposed quantum variants remain competitive for the process synthesis problem examined in this work.", "url": "https://arxiv.org/abs/2605.21213", "type": "理论+数值", "summary": "1. 该工作将过程综合问题形式化为马尔可夫决策过程，并引入量子增强强化学习算法以实现可扩展求解。\n2. 其核心在于通过状态编码算法将量子比特需求与问题规模解耦，从而克服了先前实现中的可扩展性瓶颈。\n3. 这为在过程系统工程中比较经典与量子算法提供了可控基准，并展现了量子方法在中规模综合问题上的竞争力。", "summary_source": "deepseek", "authors": [{"name": "Austin Braniff"}, {"name": "Fengqi You"}, {"name": "Yuhe Tian"}], "featured_authors": [{"name": "Austin Braniff"}, {"name": "Fengqi You"}, {"name": "Yuhe Tian"}], "author_count": 3}, {"id": "2605.21223", "category": "quant-ph", "title": "High-order harmonic generation from an atom in a disordered environment", "abstract": "Using one-dimensional simulations analyzed through the lens of open quantum systems, we study the photoelectron's strong-field dynamics from an atom surrounded by a scattering environment stochastically structured. We theoretically investigate high-order harmonic generation from this situation. We show that local dephasing of the photoelectron wavepacket induced by elastic scattering leads to global decoherence. This drives a transition from quantum to classical behavior, as witnessed by the photoelectron probability density localizing around specific trajectories of the classical analog system: unstable periodic orbits. This phenomenon mirrors quantum scars traditionally observed in the eigenfunctions of time-independent systems, such as quantum billiards. Here, it emerges in-situ within a time-dependent framework, manifesting directly in the real-time dynamics from the ground state rather than solely through spectral analysis.", "url": "https://arxiv.org/abs/2605.21223", "type": "理论+数值", "summary": "1. 该工作通过开放量子系统视角的一维模拟，理论研究了无序散射环境中原子产生高次谐波的过程。\n2. 主要卖点在于揭示弹性散射导致的光电子波包局域退相干驱动从量子到经典行为的转变，并直接在含时动力学中观察到不稳定周期轨道上的量子疤痕现象。\n3. 这为理解退相干在强场含时过程中经典行为与量子疤痕的涌现提供了新途径，可启发复杂环境下的强场物理实验研究。", "summary_source": "deepseek", "authors": [{"name": "Simon His"}, {"name": "Camille Lévêque"}, {"name": "Jérémie Caillat"}, {"name": "Richard Taïeb"}, {"name": "Jonathan Dubois"}], "featured_authors": [{"name": "Simon His"}, {"name": "Camille Lévêque"}, {"name": "Jérémie Caillat"}, {"name": "Richard Taïeb"}, {"name": "Jonathan Dubois"}], "author_count": 5}, {"id": "2605.21274", "category": "quant-ph", "title": "Semidefinite Programming for Optimal Quantum Cloning: A Computational Framework", "abstract": "While algebraic derivations establish theoretical limits for quantum cloning, practical implementations require explicit operator representations that are often unavailable analytically. We present a computational framework that reformulates cloning optimization as a search over completely positive trace-preserving maps using the Choi-Jamiolkowski isomorphism and Semidefinite Programming. The framework (i) numerically certifies global optimality through primal-dual strong duality and (ii) automatically extracts operational Kraus operators from the optimal Choi matrix via spectral decomposition. We systematically treat universal, phase-covariant, asymmetric, and entanglement cloning scenarios, providing -for the first time - a unified computational catalogue of explicit, implementable Kraus representations across all major cloning families, including higher-order processes and arbitrary input state distributions. As an application, we analyse optimal cloning attacks on BB84 under depolarizing noise, demonstrating how the extracted operators enable quantitative security analysis in realistic noisy quantum channels. An open-source implementation enables community validation and extension.", "url": "https://arxiv.org/abs/2605.21274", "type": "理论+数值", "summary": "1. 该工作提出了基于半定规划的计算框架，利用Choi-Jamiolkowski同构将量子克隆优化转化为完全正保迹映射的搜索并自动提取显式Kraus算子。\n2. 其技术核心在于通过原始-对偶强对偶性数值认证全局最优性，并系统构建了涵盖通用、相位协变、非对称及纠缠克隆等所有主要家族的统一计算目录。\n3. 该框架可分析BB84在退极化噪声下的最优克隆攻击，提取的算子使现实信道安全性定量分析成为可能，开源实现便于拓展至更高阶过程与任意输入态分布。", "summary_source": "deepseek", "authors": [{"name": "Jörg Hettel"}], "featured_authors": [{"name": "Jörg Hettel"}], "author_count": 1}, {"id": "2605.21447", "category": "quant-ph", "title": "Combining non-parametric quantum states and MERA tensor networks for ground-state optimization", "abstract": "Hybrid tensor networks offer a promising route to enhance the expressivity of classical tensor network methods by incorporating quantum states prepared on a quantum computer. Existing approaches are limited by the variational optimization of the quantum component of the tensor network. In this work, we introduce an alternative strategy that combines a non-parametric quantum state prepared through quantum annealing and a classical isometric tensor network. The latter is variationally optimized while the former is used as a fixed, boundary tensor resource in the form of classical shadows. We demonstrate the feasibility of this approach through extensive numerical simulations on the transverse-field Ising model, showing that the optimization procedure remains robust under statistical and hardware noise. Moreover, our results indicate that our newly proposed setup improves the accuracy of the obtained ground state approximation compared to the original quantum simulation, without increasing the depth of the applied quantum circuits. Therefore, this setup offers a practical route to scale variational quantum algorithms towards the quantum utility scale.", "url": "https://arxiv.org/abs/2605.21447", "type": "理论+数值", "summary": "1. 该工作将量子退火制备的非参数量子态作为经典阴影形式的固定边界张量，与变分优化的经典等距张量网络相结合，用于基态优化。\n2. 其核心在于利用非参数量子态免于变分优化，通过经典阴影间接引入量子资源，在横向伊辛模型中展现出对统计和硬件噪声的鲁棒性。\n3. 该方法在不增加量子电路深度下提升了基态近似精度，为缩放变分量子算法至实用规模提供了可行途径。", "summary_source": "deepseek", "authors": [{"name": "Julian Schuhmacher"}, {"name": "Alberto Baiardi"}, {"name": "Francesco Tacchino"}, {"name": "Ivano Tavernelli"}], "featured_authors": [{"name": "Julian Schuhmacher"}, {"name": "Alberto Baiardi"}, {"name": "Francesco Tacchino"}, {"name": "Ivano Tavernelli"}], "author_count": 4}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>${paper.summary_source === "deepseek" ? "DeepSeek three-sentence PRL summary" : (paper.summary_source === "local-fallback" ? "Local three-sentence fallback" : (paper.summary_source === "translation" ? "Chinese abstract translation" : "Chinese placeholder fallback"))}</span><a href="${safeUrl}" target="_blank" rel="noreferrer">Open arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
</body>
</html>
