<head>

  <title>arXiv 2026-05-21 · Daily ArXiv Selection</title>
  <style>
    :root {
      --bg: #f6f1e8;
      --panel: rgba(255, 252, 246, 0.92);
      --text: #2d241d;
      --muted: #6d5d50;
      --line: rgba(69, 49, 32, 0.14);
      --accent: #8f3d2e;
      --accent-2: #1d5f6b;
      --theory: #7c3a2a;
      --numeric: #255b6a;
      --both: #5d4a99;
      --experimental: #2f6b39;
      --shadow: 0 18px 40px rgba(54, 32, 16, 0.12);
      --radius: 22px;
      --ui-font: "Aptos", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --title-font: "Palatino Linotype", "Noto Serif SC", Georgia, serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--ui-font);
      color: var(--text);
      background: radial-gradient(circle at top left, rgba(255,255,255,0.78), transparent 32%), radial-gradient(circle at 88% 12%, rgba(29,95,107,0.14), transparent 20%), linear-gradient(180deg, #fbf7f0 0%, var(--bg) 42%, #f2e8dc 100%);
      min-height: 100vh;
    }
    .shell { width: min(1220px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 64px; }
    .hero {
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(255,255,255,0.84), rgba(255,248,238,0.72)), linear-gradient(135deg, rgba(143,61,46,0.08), rgba(29,95,107,0.08));
      box-shadow: var(--shadow);
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.82); border: 1px solid var(--line); color: var(--muted); font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase;
    }
    h1 { margin: 18px 0 10px; font-family: var(--title-font); font-size: clamp(32px, 5vw, 54px); line-height: 1.04; letter-spacing: -0.03em; }
    .hero p { max-width: 880px; color: var(--muted); font-size: 16px; line-height: 1.7; margin: 0; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-top: 26px; }
    .stat { padding: 16px 18px; background: rgba(255,255,255,0.76); border: 1px solid var(--line); border-radius: 18px; }
    .stat .label { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
    .stat .value { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
    .controls { position: sticky; top: 12px; z-index: 3; margin-top: 22px; padding: 18px; border: 1px solid var(--line); border-radius: 24px; background: rgba(250,244,236,0.9); backdrop-filter: blur(16px); box-shadow: 0 10px 24px rgba(54,32,16,0.08); }
    .control-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 16px; }
    .field { display: flex; flex-direction: column; gap: 10px; }
    .field label { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
    .search { width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line); background: rgba(255,255,255,0.92); font: inherit; color: var(--text); }
    .chip-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .chip { border: 1px solid var(--line); background: rgba(255,255,255,0.82); color: var(--text); padding: 10px 14px; border-radius: 999px; font: inherit; cursor: pointer; }
    .chip.active { border-color: rgba(143,61,46,0.35); background: rgba(143,61,46,0.12); color: #5b2419; }
    .chip[data-type="数值"].active { border-color: rgba(37,91,106,0.35); background: rgba(37,91,106,0.12); color: #173f49; }
    .chip[data-type="理论+数值"].active { border-color: rgba(93,74,153,0.35); background: rgba(93,74,153,0.12); color: #46337d; }
    .chip[data-type="实验"].active { border-color: rgba(47,107,57,0.35); background: rgba(47,107,57,0.12); color: #214c29; }
    .meta-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 14px; color: var(--muted); font-size: 14px; }
    .paper-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 18px; margin-top: 22px; }
    .paper { display: flex; flex-direction: column; gap: 14px; padding: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 10px 24px rgba(54,32,16,0.06); }
    .paper-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .tag { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid transparent; }
    .tag.category { background: rgba(45,36,29,0.08); color: var(--text); }
    .tag.type-theory { background: rgba(124,58,42,0.1); color: var(--theory); border-color: rgba(124,58,42,0.16); }
    .tag.type-numeric { background: rgba(37,91,106,0.1); color: var(--numeric); border-color: rgba(37,91,106,0.16); }
    .tag.type-both { background: rgba(93,74,153,0.1); color: var(--both); border-color: rgba(93,74,153,0.16); }
    .tag.type-experimental { background: rgba(47,107,57,0.1); color: var(--experimental); border-color: rgba(47,107,57,0.16); }
    .paper h2 { margin: 0; font-family: var(--title-font); font-size: 22px; line-height: 1.25; letter-spacing: -0.02em; }
    .paper h2 a { color: inherit; text-decoration: none; }
    .paper h2 a:hover { color: var(--accent); }
    .paper .id { color: var(--muted); font-size: 13px; }
    .author-block { display: grid; gap: 10px; padding: 14px 16px; border-radius: 18px; background: rgba(255,255,255,0.64); border: 1px solid var(--line); }
    .author-label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .author-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .author-item { display: grid; gap: 4px; }
    .author-item strong { font-size: 14px; }
    .author-item span { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .author-note { color: var(--muted); font-size: 12px; }
    .paper .summary { margin: 0; font-size: 15px; line-height: 1.75; white-space: pre-line; }
    details { border-top: 1px solid var(--line); padding-top: 12px; }
    details summary { cursor: pointer; color: var(--accent-2); font-weight: 700; list-style: none; }
    details summary::-webkit-details-marker { display: none; }
    details p { margin: 10px 0 0; color: var(--muted); line-height: 1.72; font-size: 14px; white-space: pre-line; }
    .paper footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 6px; color: var(--muted); font-size: 13px; }
    .paper footer a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .empty { display: none; margin-top: 24px; padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 22px; background: rgba(255,255,255,0.7); }
    @media (max-width: 980px) { .control-grid { grid-template-columns: 1fr; } .controls { position: static; } }
  </style>

      <h1>Daily ArXiv Selection</h1>

        页面主体优先展示 DeepSeek reasoner 生成的三句话中文总结；若 API 不可用或返回异常，则回退为基于中文翻译抽取的本地三句话总结；下拉可以查看英文原版摘要。

  <script>
    const papers = [{"id": "2605.20219", "category": "cond-mat", "title": "A Design Framework for Compositional Hierarchical Mechanical Metamaterials via a Qualitative Unit-Cell Library", "abstract": "Hierarchically designed mechanical metamaterials involve nested levels of structural organization, mimicking natural structures (such as bones, wood, and bird feathers) to create advanced functional materials. Compositional hierarchy, a specific type of hierarchical strategy that involves the methodical assembly of discrete building blocks, offers unique advantages in engineering design due to its modular nature. This involves proper selection and spatial arrangements of distinct microstructures, as a result of which the desired macro-scale mechanical behavior can be achieved. Towards the design of such compositional hierarchical metamaterials, this paper presents a two-step design framework. First, material optimization of the design domain is performed using a parameterized elasticity matrix to obtain optimal conceptual designs. Second, building-block microstructure geometries are selected from a qualitative library and subjected to shape-size refinement to satisfy the desired kinematic or stiffness requirements. To construct the qualitative library, a novel parametrization scheme is initially introduced, which categorizes the planar orthotropic elasticity matrix into four distinct classes. Utilizing a kinetostatic load flow visualization technique, the candidate microstructure geometries are then populated within these four classes. The framework is validated for the design of a cantilever beam with a specified lateral stiffness requirement and the design of planar sheets that exhibit specified target deformation patterns. Thus, the present work provides a systematic and physically intuitive methodology applicable to arbitrary kinematic deformation and stiffness requirements.", "url": "https://arxiv.org/abs/2605.20219", "type": "数值", "summary": "1. 该工作提出一种两步设计框架，通过材料优化与基于定性单元库的微结构选择构建组合分层力学超材料。\n2. 技术核心在于利用参数化弹性矩阵将平面正交各向异性材料分为四类，并借助运动静力载荷流可视化技术填充候选几何构型库。\n3. 该框架为满足任意目标变形与刚度需求的超材料设计提供了系统且物理直观的方法论。", "summary_source": "deepseek", "authors": [{"name": "Shammo Dutta"}, {"name": "Girish Krishnan"}, {"name": "Sree Kalyan Patiballa"}], "featured_authors": [{"name": "Shammo Dutta"}, {"name": "Girish Krishnan"}, {"name": "Sree Kalyan Patiballa"}], "author_count": 3}, {"id": "2605.20326", "category": "cond-mat", "title": "Representability-Aware Neural Networks for Reduced Density Matrices: Application to Fractional Chern Insulators", "abstract": "We develop a representability-aware and interpolable neural network (NN) framework for predicting two-particle reduced density matrices (2-RDMs). The NN incorporates a subset of representability conditions through its architecture and loss function, and can operate on different momentum meshes, enabling evaluating the representability conditions across multiple meshes, which we call interpolated representability condition. The framework can be used either to predict 2-RDMs on large momentum meshes by interpolating exact results from small meshes, or as a variational 2-RDM ansatz optimized by energy minimization on arbitrary meshes. We apply this approach to the fractional Chern insulator in the one-band projected model of twisted bilayer MoTe$_2$ at twist angle $3.89^\\circ$ and hole filling $2/3$. Trained on exact-diagonalization (ED) 2-RDMs from meshes with $12$ or $18$ momentum points using six different NN architectures, the best NN is the residual multilayer perceptron, which predicts the $6\\times6$ 2-RDM with $97.07\\%-98.18\\%$ accuracy relative to the ED 2-RDM but predicts an energy $77.353$ meV above ED ground-state energy. We then variationally optimize the NN on several meshes including $6\\times6$, predicting a $6\\times 6$ energy of just $0.104$ meV below ED while maintaining $98.94\\%-98.96\\%$ accuracy. Compared with the conventional boundary-point semidefinite programming, which gives an energy $5.560$ meV below ED with $96.40\\%-98.94\\%$ accuracy, the NN achieves a more accurate energy and similar accuracy while using only less than 1/20 as many parameters. Eventually, we add a symmetric mesh of $48$ momentum points to the variational optimization of the NN, and provide a prediction of the many-body ground-state energy and the many-body quantum metric on that mesh.", "url": "https://arxiv.org/abs/2605.20326", "type": "理论+数值", "summary": "1. 该工作开发了可表示性感知且可插值的神经网络框架，用于预测两粒子约化密度矩阵，并应用于扭曲双层MoTe₂分数量子陈绝缘体。\n2. 其核心卖点在于将部分可表示性条件融入网络架构与损失函数，通过从小网格插值或变分能量最小化实现任意动量网格上的高精度预测，且参数不足常规方法的二十分之一。\n3. 这为利用神经网络高效处理可表示性约束、进行强关联多体系统的高精度变分研究提供了坚实范例，并预示了向更大网格外推基态性质的可能。", "summary_source": "deepseek", "authors": [{"name": "Justin B. Hart"}, {"name": "Awwab A. Azam"}, {"name": "Thomas Li"}, {"name": "Yunxuan Li"}, {"name": "Ye Bi"}, {"name": "Haining Pan"}, {"name": "Jiabin Yu"}], "featured_authors": [{"name": "Justin B. Hart"}, {"name": "Awwab A. Azam"}, {"name": "Thomas Li"}, {"name": "Ye Bi"}, {"name": "Haining Pan"}, {"name": "Jiabin Yu"}], "author_count": 7}, {"id": "2605.20328", "category": "cond-mat", "title": "Targeting Clause Type Distributions: a Picklock for Random Satisfiability Problems", "abstract": "Optimization problems such as the NP-complete 3-SAT provide an important benchmark for the difficult task of finding ground-states in strongly correlated many-body systems with rugged energy landscapes. The study of random 3-SAT problems as Ising spin Hamiltonians in statistical physics has yielded major insights including the existence of a satisfiability phase transition, and the prediction of a critical parameter line of particularly hard instances. Yet, progress on solving those instances has been scarce for several decades. Here, introducing the Target-SAT (TSAT) algorithm, we roughly triple the tractable problem sizes in the hardest regime, with an even greater improvement in a vast range of neighboring regions. By leveraging statistical information hidden in the combinatorial constraints of the problem, TSAT is actively guided in its stochastic local search toward a target within the relevant parameter space. Our analysis also explains why established local search algorithms are limited to relatively small system sizes due to a vast low-energy trap. Furthermore, we characterize the aforementioned critical line in terms of a dominant additional complexity barrier, whose exponential scaling is quickly overcome by TSAT only in the surrounding parameter space. With TSAT, the lead in solving the hardest known random satisfiability problems returns to the realm of stochastic local search algorithms.", "url": "https://arxiv.org/abs/2605.20328", "type": "理论+数值", "summary": "1. 该工作提出Target-SAT算法，基于子句类型分布这一统计信息主动引导随机局部搜索，使NP难随机3-SAT问题在最硬区域的可解规模提升约三倍，且在更广参数区间改进更大。\n2. 其技术核心在于利用约束组合中隐藏的统计规律设计目标导向搜索，并揭示既有算法因低能阱受限的关键机制，同时刻画了临界线附近额外指数复杂性屏障的主导作用。\n3. 这一进展使随机局部搜索算法重回求解最难随机SAT问题的领先地位，并为强关联无序系统基态搜索的统计物理研究提供了启发与可扩展的高效算法。", "summary_source": "deepseek", "authors": [{"name": "J. Schwardt"}, {"name": "J. C. Budich"}], "featured_authors": [{"name": "J. Schwardt"}, {"name": "J. C. Budich"}], "author_count": 2}, {"id": "2605.20339", "category": "cond-mat", "title": "Textured phase diagrams of featureless insulators", "abstract": "We study phase diagrams of charge-conserving `class A' non-interacting fermions, focusing on the trivial phase in various dimensions. Such phases are usually termed `featureless' to distinguish them from those others with either symmetry-broken or topological order. We show that the presence of non-trivial topological families of states, including charge pumps and their generalizations, results in phase diagrams being endowed with non-trivial topological textures that can be visualized through Berry phases and their higher-dimensional generalizations. We show that for non-interacting fermion systems with translation invariance, these `higher' Berry phases can be computed using integrals of non-abelian Chern-Simons forms of the Berry-Bloch connection over momentum and parameter spaces. Singularities in these textures correspond to gap-closing loci of `diabolical points', which represent the obstruction to contracting topologically non-trivial families of states, and bulk-boundary correspondence results in a locus of robust boundary modes that terminate at the bulk diabolical points. In the presence of finite chemical potential, we argue that the edge modes are generically robust without any need for fine-tuning for two and higher dimensions, whereas in one dimension they are `estranged' in the phase diagram, i.e. appearing at different parameter values for different edges. We demonstrate our results by constructing several microscopic models of non-interacting fermions. We argue stability to interactions and explore proximate phase diagrams by mapping to continuum field theories.", "url": "https://arxiv.org/abs/2605.20339", "type": "理论+数值", "summary": "1. 该工作系统研究了电荷守恒A类非相互作用费米子平凡相的相图，揭示了非平凡拓扑族（如电荷泵）导致的相图拓扑纹理。\n2. 其技术核心是利用非阿贝尔Chern-Simons形式对高维Berry相位的积分，通过能隙闭合的魔鬼点与鲁棒边界模刻画相图结构。\n3. 这为理解无特征绝缘体中拓扑纹理的涌现及相互作用效应下的邻近相图提供了理论框架，并启发对高维边界模鲁棒性的探索。", "summary_source": "deepseek", "authors": [{"name": "Sashank Singam"}, {"name": "Nick G. Jones"}, {"name": "Abhishodh Prakash"}], "featured_authors": [{"name": "Sashank Singam"}, {"name": "Nick G. Jones"}, {"name": "Abhishodh Prakash"}], "author_count": 3}, {"id": "2605.20343", "category": "cond-mat", "title": "Velocity collapse and non-conformal spiral phase in the sawtooth spin chain", "abstract": "Recent matrix-product-state calculations show that the spiral phase in the sawtooth chain has numerical signatures that are difficult to reconcile with an ordinary conformal critical point: a large apparent central charge, slow dynamical scaling, nearly flat excitations, and no detectable dimerization. We develop a bosonization theory for this phenomenology by embedding the sawtooth limit in a zigzag ladder described by two coupled SU(2)$_1$ conformal field theories characterized by an extreme velocity ratio. We show that the sawtooth geometry cancels the leading staggered interaction, leaving a marginal twist interaction that selectively collapses the slow apical spin velocity. Crucially, as this velocity vanishes, the generated apical backscattering interaction diverges only in dimensionless units, causing the energy scale to collapse independently of the spatial correlation length. This mechanism naturally accounts for many of the numerical anomalies and we interpret the perturbative flow as an entrance to local quantum criticality in the strong-coupling regime.", "url": "https://arxiv.org/abs/2605.20343", "type": "理论+数值", "summary": "1. 该工作发展了一个玻色化理论，将锯齿链螺旋相中的数值反常（大表观中心荷、慢动力学标度）归因于嵌入锯齿梯子的两个SU(2)₁共形场论，其特征是极端速度比。\n2. 核心物理在于锯齿几何抵消了主导交错相互作用，留下一个边缘扭曲相互作用选择性坍缩慢顶端自旋速度，使能量尺度独立于空间关联长度而发散。\n3. 这一机制将进入强耦合区域的行为解释为局域量子临界性的入口，为非共形自旋系统中类似反常标度行为提供了可检验的理论框架。", "summary_source": "deepseek", "authors": [{"name": "Nai Chao Hu"}], "featured_authors": [{"name": "Nai Chao Hu"}], "author_count": 1}, {"id": "2605.20384", "category": "cond-mat", "title": "Dataset-aware entropy-maximized active learning for machine-learned interatomic potentials", "abstract": "We present an active learning framework for efficiently generating training data for machine-learned interatomic potentials (MLIPs). The method combines local entropy-driven molecular dynamics with global dataset-aware filtering: a per-configuration entropy term biases MD trajectories toward structurally diverse snapshots, while a global entropy measure, the log-determinant of the fingerprint covariance matrix of the entire dataset, selects only those configurations that provide genuinely new information. We employ dual covariance modes (per-atom for disordered structures and per-config for ordered phases) to achieve broad coverage of configuration space. Combined with a pre-trained foundation model (Allegro-OAM-L) and analytical fingerprint gradients from Gaussian overlap matrix eigenvalues, the framework produces high-quality domain-specific potentials with near- or sub-meV/atom accuracy on test data drawn from the same distribution at training-set sizes of order $10^{2}$ to $10^{3}$ entropy-selected DFT-labeled structures. We demonstrate the method on three systems spanning diverse bonding types and pressure-driven phase transitions: carbon (covalent), silicon (covalent/metallic), and NaCl (ionic). In learning curve comparisons against random molecular dynamics sampling at matched training set sizes ($N = 100$ to $800$), evaluated over three independent training-set draws per condition, entropy-driven sampling achieves a factor of approximately $3$ to $10$ lower energy MAE at $N = 800$ on in-distribution holdouts across the three systems, with the magnitude of the gain depending on the bonding type and the size at which the random-MD baseline saturates.", "url": "https://arxiv.org/abs/2605.20384", "type": "理论+数值", "summary": "1. 该工作提出一种数据集感知的熵最大化主动学习框架，用于高效生成机器学习原子间势的训练数据。\n2. 其核心卖点在于结合局部熵驱动分子动力学与全局数据集滤波，并采用双协方差模式及分析指纹梯度，以实现构型空间的广泛覆盖与信息选择。\n3. 此方法在碳、硅、氯化钠等不同键合体系上展示了约3至10倍的误差降低，为构建高精度领域特定原子间势提供了高效且可迁移的主动学习策略。", "summary_source": "deepseek", "authors": [{"name": "Meiyan Wang"}, {"name": "Rishi Rao"}, {"name": "Li Zhu"}], "featured_authors": [{"name": "Meiyan Wang"}, {"name": "Rishi Rao"}, {"name": "Li Zhu"}], "author_count": 3}, {"id": "2605.20428", "category": "cond-mat", "title": "Fröhlich-type Polarons in Isotopically Enriched Hexagonal Boron Nitride", "abstract": "Exciton-phonon interactions play a central role in defining the optical response of hexagonal boron nitride (hBN), yet their quantitative determination has remained incomplete. Here, we reveal the Fröhlich-type exciton-phonon coupling in boron-10-enriched hBN using low-temperature cathodoluminescence. We resolve the indirect exciton 5.95$\\pm$0.02 eV together with its longitudinal optical (LO) phonon replica detuned by 184$\\pm$56 meV, enabling the extraction of a Fröhlich coupling constant $\\alpha$=0.159 and a larger exciton binding energy of 161 meV, larger than previously reported values for natural-abundance hBN, which is attributed to isotope enrichment. The inferred polaron radius exceeds the lattice constant, indicating large-polaron behavior. We deduced an exciton scattering time ~of 97 fs, corresponding to a homogeneous linewidth of ~6.76 meV. We further obtain a polaron binding energy of ~48 meV and an effective mass of 1.045 $m_0$. These results provide a direct quantitative characterization of exciton-phonon coupling in isotopically engineered hBN and establish a foundation for tailoring its phonon-polaritonic and quantum-optical properties.", "url": "https://arxiv.org/abs/2605.20428", "type": "理论", "summary": "1. 该工作通过低温阴极发光光谱在硼-10富集六方氮化硼中定量揭示了Fröhlich型激子-声子耦合。\n2. 关键卖点在于解析出间接激子及其纵光学声子副本，提取出Fröhlich耦合常数α=0.159、更大激子结合能161 meV及极化子半径超晶格常数的大极化子行为。\n3. 这为同位素工程化六方氮化硼中激子-声子耦合的精确表征及声子极化激元与量子光学性质调控提供了定量基础。", "summary_source": "deepseek", "authors": [{"name": "Ioannis Chatzakis"}, {"name": "Timur Abdilov"}, {"name": "Elliot Walker"}, {"name": "Jaime Freitas"}, {"name": "Song Liu"}, {"name": "James H. Edgar"}], "featured_authors": [{"name": "Ioannis Chatzakis"}, {"name": "Timur Abdilov"}, {"name": "Elliot Walker"}, {"name": "Jaime Freitas"}, {"name": "Song Liu"}, {"name": "James H. Edgar"}], "author_count": 6}, {"id": "2605.20430", "category": "cond-mat", "title": "Excitation-Energy-Selective Control of Hot-Carrier Cooling via a Resonant Optical-Phonon Bottleneck in Graphene", "abstract": "Understanding and controlling hot-carrier relaxation in graphene is crucial for advancing ultrafast optoelectronic and terahertz technologies. Here, we investigate carrier cooling dynamics in monolayer and bilayer graphene using mid-infrared pump pulses (0.22-0.73 eV) and terahertz probe pulses. We uncover a pronounced, reproducible, and non-monotonic dependence of the carrier relaxation time on excitation photon energy. Remarkably, within a narrow spectral window (0.42 to 0.48 eV), the carrier lifetime increases by an order of magnitude compared to a few picosecond-scale cooling observed at other energies. We show that this anomalous slowdown originates from a resonant enhancement of the optical-phonon lifetime, causing accumulation and reabsorption of hot optical phonons that suppress energy transfer to the lattice. All observed behaviors are captured within a unified carrier-phonon energy-balance framework, where excitation-energy-dependent variations of the effective optical-phonon decay pathway govern the cooling dynamics. These findings demonstrate excitation-energy-selective control of hot-carrier relaxation in graphene and provide new insight into non-equilibrium carrier-phonon interactions near the optical-phonon bottleneck.", "url": "https://arxiv.org/abs/2605.20430", "type": "理论", "summary": "1. 本工作利用中红外泵浦-太赫兹探针光谱，系统研究了单层与双层石墨烯中热载流子冷却动力学对激发光子能量的依赖关系。\n2. 其核心发现在于0.42至0.48 eV的窄光谱窗口内，由于光学声子衰变路径的共振抑制导致声子瓶颈效应增强，载流子冷却时间较其他能量区域延长近一个数量级。\n3. 这为通过选择激发能量主动调控石墨烯热载流子弛豫过程提供了可行途径，并深化了对非平衡载流子-声子耦合中光学声子瓶颈行为的理解。", "summary_source": "deepseek", "authors": [{"name": "Sachin Sharm"}, {"name": "Elliott Walker"}, {"name": "Rachael Myers-Ward"}, {"name": "Jenifer Hajzus"}, {"name": "Yijing Liu"}, {"name": "Paola Barbara"}, {"name": "Ioannis Chatzakis"}], "featured_authors": [{"name": "Sachin Sharm"}, {"name": "Elliott Walker"}, {"name": "Rachael Myers-Ward"}, {"name": "Yijing Liu"}, {"name": "Paola Barbara"}, {"name": "Ioannis Chatzakis"}], "author_count": 7}, {"id": "2605.20575", "category": "cond-mat", "title": "The Dislocation Content of Triple Junctions", "abstract": "Triple junctions, line defects formed by the intersection of different grain boundaries, exist within all polycrystalline materials. While it has long been recognized that triple junctions could play an important role in microstructural evolution, there remains much uncertainty regarding their properties. Triple junctions are line defects capable of carrying dislocation content. However, no general method for calculating this content has been established. In this work, we derive the necessary equations to calculate the intrinsic dislocation content of a triple junction whose trichromatic pattern forms a coincidence site lattice. We further show that this approach can be easily applied to facet junctions, and in principle, any type of grain boundary junction for which a coincidence site lattice can be defined. We apply this formalism to atomistic simulations of tungsten to compute the Burgers vectors of a facet junction and a triple junction formed during twin grain nucleation and growth from a free surface. By tracking the evolution of the triple junction's Burgers vector and its core structure, we reveal the sequence of individual line defect reactions responsible for triple-junction-mediated twin growth.", "url": "https://arxiv.org/abs/2605.20575", "type": "理论+数值", "summary": "1. 该工作推导了三叉晶界内禀位错含量的通用计算公式，适用于形成重合位置点阵的多种晶界交汇类型。\n2. 其技术突破在于通过原子模拟追踪Burgers矢量与核心结构演化，揭示三叉晶界介导的孪晶生长中线缺陷反应序列。\n3. 这为定量理解多晶材料中三叉晶界对微观结构演化的作用提供了普适性理论工具。", "summary_source": "deepseek", "authors": [{"name": "Ian S Winter"}, {"name": "R. Daniel Moore"}, {"name": "R. E. Rudd"}, {"name": "T. Oppelstrup"}, {"name": "T. Frolov"}], "featured_authors": [{"name": "Ian S Winter"}, {"name": "R. Daniel Moore"}, {"name": "R. E. Rudd"}, {"name": "T. Oppelstrup"}, {"name": "T. Frolov"}], "author_count": 5}, {"id": "2605.20653", "category": "cond-mat", "title": "Pressure-induced superconductivity in epitaxially-stabilized Pr$_3$Ni$_2$O$_7$ films", "abstract": "The discovery of high critical-temperature $T_{\\mathrm{c}}$ superconductivity in La$_3$Ni$_2$O$_7$ under high pressure has led to a rapid expansion of the $T_{\\mathrm{c}}$ range through lanthanide $Ln$ substitution, and to ambient-pressure superconductivity in strained thin films, yet the exploration of new bilayer nickelates remains strongly constrained by thermodynamic stability. Beyond the difficulty of synthesis of bulk single-crystals, here we report on the pressure-induced high-$T_{\\mathrm{c}}$ superconductivity in epitaxially-stabilized Pr$_3$Ni$_2$O$_7$ thin films. While the Pr$_3$Ni$_2$O$_7$ films exhibit insulating behaviour at ambient pressure regardless of ozone-annealing treatment, they show $T$-linear metallic transport and superconductivity reaching an onset $T_{\\mathrm{c}}$ of 66 K and zero-resistance at nearly 40 K at 22 GPa. Furthermore, Nd$_3$Ni$_2$O$_7$, with the smaller rare-earth ion Nd, can also be stabilized, however, superconductivity is not observed in the measured pressure range. Epitaxial stabilization enables us to examine the dependence of $T_{\\mathrm{c}}$ and the critical pressure $P_{\\mathrm{c}}$ for superconductivity on the $Ln$ ion in $Ln_3$Ni$_2$O$_7$ ($Ln$ = La, Pr, Nd). These results suggest that a higher $P_{\\mathrm{c}}$ is required for smaller $Ln$ ions, consistent with trends observed in bulk studies of $Ln$ substitution. This study demonstrates that epitaxial stabilization is a powerful technique to further expand the family of superconducting bilayer nickelates.", "url": "https://arxiv.org/abs/2605.20653", "type": "理论", "summary": "1. 该工作利用外延稳定技术克服热力学限制，制备出Pr₃Ni₂O₇薄膜，并在22 GPa下观测到起始温度66 K、零电阻约40 K的压力诱导超导电性。\n2. 其技术卖点在于外延稳定使得Pr₃Ni₂O₇乃至Nd₃Ni₂O₇等亚稳态样品得以实现，从而揭示了超导临界压力随稀土离子半径减小而升高的明确趋势。\n3. 该结果证实外延稳定是探索新型双层镍酸盐超导体的有效手段，并为通过离子尺寸调控优化超导相图及理解高压超导机制提供了关键实验依据。", "summary_source": "deepseek", "authors": [{"name": "Motoki Osada"}, {"name": "Chieko Terakura"}, {"name": "Hsiao-Yi Chen"}, {"name": "Akiko Kikkawa"}, {"name": "Masamichi Nakajima"}, {"name": "Ryoma Asai"}, {"name": "Jean-Baptiste Morée"}, {"name": "Yusuke Nomura"}, {"name": "Ryotaro Arita"}, {"name": "Yoshinori Tokura"}, {"name": "Atsushi Tsukazaki"}], "featured_authors": [{"name": "Motoki Osada"}, {"name": "Chieko Terakura"}, {"name": "Hsiao-Yi Chen"}, {"name": "Ryotaro Arita"}, {"name": "Yoshinori Tokura"}, {"name": "Atsushi Tsukazaki"}], "author_count": 11}, {"id": "2605.20709", "category": "cond-mat", "title": "What Lies Between Crystal and Randomly Packed Structures? A General Characterization of Non-Periodic Order", "abstract": "In this paper we address the characterization of the structure of condensed materials, periodic and non-periodic. Carrying out an extensive study of over 7000 different groundstate structures of a 2D lattice model of binary packing, we find a predominance of non-periodic structures (over 96%) that extend across the entire range of possible diversities. These non-periodic structures are resolved by establishing whether a structure will accommodate or reject additional local structures. This property, structural selectivity, is treated as a signature of an underlying ordering principle. The major result of the paper is the determination that roughly 35% of the non-periodic structures are selective and, hence, ordered in some way. This selectivity extends up to a diversity of ~ 9, well beyond the upper threshold for diversity in periodically ordered states.", "url": "https://arxiv.org/abs/2605.20709", "type": "理论+数值", "summary": "1. 该工作通过分析二维晶格二元堆积模型的7000余种基态结构，系统研究了凝聚态材料中非周期有序的普遍特征。\n2. 其核心卖点在于提出“结构选择性”判据——结构是否接纳额外局部结构，由此揭示约35%的非周期结构具有有序性，多样性阈值高达约9，远超周期有序态。\n3. 这为理解非周期有序的起源提供了统一分类框架，并为解释晶体与随机堆积之间的中间态行为指明了关键物理原则。", "summary_source": "deepseek", "authors": [{"name": "Ian Douglass"}, {"name": "Peter Harrowell"}], "featured_authors": [{"name": "Ian Douglass"}, {"name": "Peter Harrowell"}], "author_count": 2}, {"id": "2605.20783", "category": "cond-mat", "title": "Generalized Phase Diagrams for Graphene CVD growth on Copper", "abstract": "Understanding the competition between first-layer lateral expansion and second-layer nucleation is essential for layer-controlled graphene growth via chemical vapor deposition (CVD). Building on our previous phase diagram framework based on the dimensionless parameters $\\alpha$ and $\\Gamma$, we develop an enhanced model incorporating two previously neglected effects: thermal-expansion-induced substrate strain and chemical desorption of carbon monomers via reverse dehydrogenation. First-principles calculations are employed to determine the strain-dependent diffusion and attachment barriers on both exposed and graphene-covered Cu(111) surfaces. By mapping the multi-step CVD process into an effective quasi-physical vapor deposition, we construct a generalized phase diagram characterized by the coupled effects of $\\alpha$, $\\Gamma$, and a newly introduced desorption parameter $Z$. Our results show that tensile strain expands the bilayer graphene (BLG) growth window for critical nucleus sizes $i^*>1$. In contrast, chemical desorption suppresses BLG formation in the high-$\\Gamma$ regime via $Z$-dependent monomer depletion. This unified framework provides a predictive guide for the rational synthesis of high-quality bilayer graphene by linking macroscopic growth parameters to microscopic layer-selection mechanisms.", "url": "https://arxiv.org/abs/2605.20783", "type": "理论+数值", "summary": "1. 该工作构建了铜衬底上石墨烯CVD生长中第一层横向扩展与第二层成核竞争的广义相图。\n2. 核心在于引入热膨胀诱导衬底应变与碳单体化学脱附两种被忽略效应，通过第一性原理计算应变依赖扩散与附着势垒，建立了无量纲参数α、Γ及新脱附参数Z耦合的相图。\n3. 这为理性合成高质量双层石墨烯提供了预测框架，揭示拉伸应变扩展双层窗口而脱附在高Γ区抑制双层形成的对称机制。", "summary_source": "deepseek", "authors": [{"name": "Tongtong Wang"}, {"name": "Ke Jin"}, {"name": "Yishi Zhang"}, {"name": "Dajun Shu"}], "featured_authors": [{"name": "Tongtong Wang"}, {"name": "Ke Jin"}, {"name": "Yishi Zhang"}, {"name": "Dajun Shu"}], "author_count": 4}, {"id": "2605.20785", "category": "cond-mat", "title": "Anisotropic Crystallization Kinetics and Interfacial Dynamics of Phase-Change Material Sb$_2$S$_3$ from Machine Learning Force Field Simulations", "abstract": "The phase-change material antimony sulfide (Sb$_2$S$_3$) relies on rapid and reversible phase transitions between crystalline and amorphous states, which are critical for their performance in data storage and photonics applications. In this work, a machine learning force field is developed based on the moment tensor potential approach, allowing us to understand the atomistic origin of the structural evolution and crystallization kinetics in Sb$_2$S$_3$ for the first time, by enabling large-scale molecular dynamics simulations (up to 7680 atoms for 40 ns). Sb$_2$S$_3$ shows anisotropic growth rates with the [100] facet exhibiting the fastest growth due to the strong Sb-S covalent bonding along its quasi-1D ribbon-like structure of its crystalline phase. The activation energy for crystal growth is found to be 0.55-0.57 eV, whereas that for diffusion is around 1.16-1.56 eV. The lower activation energy for crystal growth indicates that its heterogeneous crystallization is interface controlled rather than diffusion limited, unlike GST and GeTe with atomic attachment at the solid-liquid interface being energetically favoured over long range atomic transport. These findings provide key insights into the structural, thermodynamic, and kinetic properties of Sb$_2$S$_3$, paving the way for optimizing its functionality including switching speed, reliability, and energy efficiency.", "url": "https://arxiv.org/abs/2605.20785", "type": "理论+数值", "summary": "1. 该工作利用基于矩张量势的机器学习力场，实现了含7680原子、长达40纳秒的大规模分子动力学模拟，首次揭示了相变材料Sb₂S₃结晶动力学与界面动力学的原子尺度起源。\n2. 其核心发现是Sb₂S₃晶体沿[100]面具有最快各向异性生长速率，源于其准一维带状结构中较强的Sb–S共价键，且异质结晶由界面控制而非扩散限制，激活能0.55–0.57 eV远低于扩散激活能。\n3. 这为通过调控结晶各向异性与界面原子附着过程来优化Sb₂S₃的开关速度、可靠性和能效提供了关键的结构与热力学启示。", "summary_source": "deepseek", "authors": [{"name": "Souvik Chakraborty"}, {"name": "Wen-Qing Li"}, {"name": "Yun Liu"}], "featured_authors": [{"name": "Souvik Chakraborty"}, {"name": "Wen-Qing Li"}, {"name": "Yun Liu"}], "author_count": 3}, {"id": "2605.20790", "category": "cond-mat", "title": "Field-tunable spin-valley transport in monolayer MoS$_2$", "abstract": "We study field-controlled spin-valley transport in monolayer MoS$_2$ through a single electrostatic barrier and a uniform off-resonant elliptically polarized irradiation. Starting from the massive Dirac Hamiltonian with intrinsic spin-orbit coupling, we use a high-frequency Floquet expansion to obtain an effective static model with a laser-renormalized mass (gap) term. We solve the scattering problem by spinor matching and derive the exact analytic expression for the transmission. The numerical results show that the drive tunes both the spin-valley-dependent propagation threshold inside the barrier and the Fabry-Pérot phase, creating controllable pass/stop bands. By varying both the laser intensity (amplitude) and the polarization shape, we show that the same junction can be switched between broadband valley filtering and resonance-selective operation, and the valley contrast remains visible in the Landauer conductance. Our findings establish an efficient route for realizing optically reconfigurable valleytronic and spintronic functionalities in MoS$_2$.", "url": "https://arxiv.org/abs/2605.20790", "type": "理论+数值", "summary": "1. 该工作通过静电势垒与均匀椭圆偏振光场，理论研究了单层MoS₂中可调控的自旋谷输运性质。\n2. 核心技术在于利用高频Floquet展开获得激光重正化能隙的有效静态模型，并解析推导出完美透射条件，揭示激光强度与偏振形状独立调控势垒内传输阈值和Fabry-Pérot相位。\n3. 这为MoS₂中实现光学可重构的宽带谷滤波与共振选择性自旋阀功能提供了明确理论途径。", "summary_source": "deepseek", "authors": [{"name": "Kamal Azaidaoui"}, {"name": "Hocine Bahlouli"}, {"name": "Clarence Cortes"}, {"name": "David Laroze"}, {"name": "Ahmed Jellal"}], "featured_authors": [{"name": "Kamal Azaidaoui"}, {"name": "Hocine Bahlouli"}, {"name": "Clarence Cortes"}, {"name": "David Laroze"}, {"name": "Ahmed Jellal"}], "author_count": 5}, {"id": "2605.20882", "category": "cond-mat", "title": "Monte Carlo simulation of selective adsorption in a binary hard-disk mixture on patterned adhesive surfaces", "abstract": "Selective adsorption in a two-dimensional model of a binary hard-disk mixture on patterned adhesive surfaces is studied using grand canonical Monte Carlo simulations. The two species have equal diameters and equal bulk chemical potentials, but different attraction strengths to adhesive domains. Thus, affinity-driven selectivity is separated from particle-size asymmetry and unequal chemical potentials. The surface pattern is defined by domain size, domain surface coverage, and ordered or disordered arrangement of circular domains. The results show that selectivity depends strongly on surface geometry, especially at low and intermediate chemical potentials. Domains comparable to the particle size enhance selectivity by forming adsorption regions with large particle-domain overlap, whereas larger domains can provide high selectivity at low chemical potentials. For small domains, further reduction in size can also increase selectivity as the system approaches a uniform attractive surface with corresponding effective affinity parameters of the species.", "url": "https://arxiv.org/abs/2605.20882", "type": "理论+数值", "summary": "1. 该工作通过巨正则蒙特卡洛模拟，研究了等径等化学势但粘附强度不同的二元硬盘混合物在图案化粘附表面上的选择性吸附行为。\n2. 其核心在于通过控制变量分离亲和力与几何因素，系统揭示表面域尺寸、覆盖度及有序性对选择性的非单调调控机制。\n3. 这为通过表面图案工程优化小分子或胶体混合物选择性吸附提供了定量设计依据，尤其适用于低化学势场景。", "summary_source": "deepseek", "authors": [{"name": "Nazar Kukarkin"}, {"name": "Taras Patsahan"}], "featured_authors": [{"name": "Nazar Kukarkin"}, {"name": "Taras Patsahan"}], "author_count": 2}, {"id": "2605.20890", "category": "cond-mat", "title": "Transferable 3D Convolutional Neural Networks for Elastic Constants Prediction in Nanoporous Metals", "abstract": "The topology of nanoporous metals is crucial for determining their mechanical response. In this work, we generated 6,000 gold and 422 silver nanoporous structures and calculated three components of elastic modulus with Molecular Dynamics simulations, resulting in 19,263 data points. This study compared two distinct approaches of predicting elastic modulus: a Fully-Connected neural network trained on precomputed topological descriptors, and several 3D Convolutional neural network architectures adapted from computer vision. The 3D CNNs outperformed the descriptor-based baseline model ($R^2 = 0.704$), with to-performing DenseNet-201 architecture achieving $R^2 = 0.955$. Additionally, the effects of training grid resolution, dataset size, and descriptor integration into a model were investigated. We further demonstrated model robustness through Transfer learning: a pretrained model was fine-tuned on a much smaller dataset of denser gold structures and the dataset of denser silver structures. Finally, the trained model was employed to evaluate the mechanical properties of 100,000 stochastic nanoporous gold structures and identify the Pareto optimal designs.", "url": "https://arxiv.org/abs/2605.20890", "type": "理论+数值", "summary": "1. 该工作基于分子动力学生成的金和银纳米多孔结构数据集，训练了用于预测弹性常数的三维卷积神经网络，并与基于拓扑描述符的全连接基线模型进行了对比。\n2. 其核心优势在于DenseNet-201架构达到了0.955的决定系数，并通过迁移学习在较小数据集上微调后仍保持高精度，展现出对结构密度变化的鲁棒泛化能力。\n3. 这为大规模随机纳米多孔金属的力学性能快速评估与Pareto最优设计提供了高效深度学习方案。", "summary_source": "deepseek", "authors": [{"name": "Sergei Zorkaltsev"}, {"name": "Rafał Topolnicki"}, {"name": "Tal-El Carmon"}, {"name": "Santhosh Mathesan"}, {"name": "Paweł Dłotko"}, {"name": "Dan Mordehai"}, {"name": "Maciej Harańczyk"}], "featured_authors": [{"name": "Sergei Zorkaltsev"}, {"name": "Rafał Topolnicki"}, {"name": "Tal-El Carmon"}, {"name": "Paweł Dłotko"}, {"name": "Dan Mordehai"}, {"name": "Maciej Harańczyk"}], "author_count": 7}, {"id": "2605.20918", "category": "cond-mat", "title": "High-performance linear-scaling electronic structure method via chromatic superposition states", "abstract": "We introduce a high-performance linear-scaling electronic structure method that employs chromatic superposition states (CSS) as a low-dimensional, high-fidelity representation, which can be orders of magnitude smaller than the full Hilbert space. Grounded in the system's finite correlation length, the CSS representation aggregates the uncorrelated orbitals into a single basis via a graph-coloring scheme, and is independent of the system size yet accurately preserves all sparse operators in solving the Kohn-Sham equations. The projection onto CSSs is efficiently computed by employing the block-Lanczos Krylov method which features high hardware efficiency and linear-scaling cost, enabling fast calculation of large-scale Kohn-Sham density matrix. We show that this method already outperforms previous linear-scaling density matrix purification method by more than one order of magnitude in computational speed at even small scale, while preserving high accuracy. The practical utility of the CSS method is demonstrated through molecular dynamics simulation of a 10000 $H_2O$, and self-consistent calculation of a 1-million $H_2O$ with modest resources.", "url": "https://arxiv.org/abs/2605.20918", "type": "理论+数值", "summary": "1. 该工作提出一种基于色叠加态（CSS）的高性能线性标度电子结构方法，将 Hilbert 空间压缩至与系统尺寸无关的低维表示。\n2. 其核心是借助图着色聚合非关联轨道形成 CSS，并利用块-Lanczos Krylov 法高效投影，在保持稀疏算符精度下实现 O(N) 标度计算 Kohn-Sham 密度矩阵。\n3. 该方法在小规模已超越传统线性标度纯化法十倍以上，为百万原子级自洽计算及大尺度分子动力学模拟提供了可行技术路径。", "summary_source": "deepseek", "authors": [{"name": "Zhikang Jiang"}, {"name": "Zhizhi Xiao"}, {"name": "Mingfa Tang"}, {"name": "Weiyu Li"}, {"name": "Zhaoru Sun"}, {"name": "Ke Xia"}, {"name": "Youqi Ke"}], "featured_authors": [{"name": "Zhikang Jiang"}, {"name": "Zhizhi Xiao"}, {"name": "Mingfa Tang"}, {"name": "Zhaoru Sun"}, {"name": "Ke Xia"}, {"name": "Youqi Ke"}], "author_count": 7}, {"id": "2605.20938", "category": "cond-mat", "title": "Origin of Persistent Boundary Motion in Confined Active Matter", "abstract": "Active matter systems under confinement display persistent surface motion and a strong boundary affinity. However, despite extensive studies of their positional dynamics, much less attention has been given to the corresponding orientational behavior. Here, using molecular simulations of an active Brownian particle confined within a hard circular boundary and the Fokker-Planck equation, we show that the positional distribution of the particle is directly coupled to orientational fluctuations, as characterized by the conditional orientational distribution. Confinement generates two preferred tangential orientational states connected by stochastic flipping pathways: rapid boundary-localized switching and slower bulk-mediated excursions. Further, the positional distribution exhibits a nontrivial power-law decay with distance from the boundary that is closely linked to curvature-induced bistable orientational states and the variance of the associated conditional distribution. The mean waiting time between flips exhibits power-law dependence on the confinement strength. Our results establish that the interplay between orientational fluctuations, bistability, positional accumulation, and stochastic switching governs the observed dynamics of active particles under confinement, providing a framework for understanding transport, exploration, and escape processes in confined active systems.", "url": "https://arxiv.org/abs/2605.20938", "type": "理论+数值", "summary": "1. 通过活性布朗粒子在硬圆边界内的分子模拟与福克-普朗克方程分析，揭示了位置分布与定向涨落之间的直接耦合机制。\n2. 发现受限系统存在边界局域切换与体中介偏移两种随机翻转路径，且位置分布呈现与曲率诱导双稳定向态方差相关的幂律衰减。\n3. 该成果为理解受限活性物质中的输运、探索与逃逸过程提供了基于定向涨落、双稳性与随机切换的定量框架。", "summary_source": "deepseek", "authors": [{"name": "Elsa Baby"}, {"name": "Manoj Gopalakrishnan"}, {"name": "Vishwas V. Vasisht"}], "featured_authors": [{"name": "Elsa Baby"}, {"name": "Manoj Gopalakrishnan"}, {"name": "Vishwas V. Vasisht"}], "author_count": 3}, {"id": "2605.20966", "category": "cond-mat", "title": "Multiple Superconducting Phases in Palladium Deuteride Induced by Nuclear-Spin Isotope Effect", "abstract": "We study the superconducting properties of high-quality PdD$_{x}$ films. The resistivity shows a sharp drop at $T$ $\\sim$1.7 K, marking the superconducting transition. However, a finite resistivity persists and vanishes at $\\sim$0.6 K. The temperature and magnetic-field dependences of the resistivity exhibit multiple anomalies within the superconducting state, revealing distinct superconducting phases. Such anomalies are absent in PdH$_{x}$ films. These results demonstrate a clear qualitative difference between the superconducting phase diagrams of PdD$_{x}$ and PdH$_{x}$, highlighting the role of nuclear-spin isotope effects.", "url": "https://arxiv.org/abs/2605.20966", "type": "数值", "summary": "1. 该工作通过高质量PdDₓ薄膜的电阻测量，观察到其超导转变温度附近出现多重电阻异常，揭示了多个不同超导相的存在。\n2. 其物理卖点在于发现氘核的核自旋同位素效应导致PdDₓ与PdHₓ的超导相图存在定性差异，而后者中并无此类多重超导相。\n3. 这暗示核自旋-晶格耦合或同位素质量效应在超导配对机制中可能扮演关键角色，为研究同位素效应与非常规超导关联提供了新平台。", "summary_source": "deepseek", "authors": [{"name": "Ryoma Kato"}, {"name": "Ten-ichiro Yoshida"}, {"name": "Riku Iimori"}, {"name": "Masanobu Shiga"}, {"name": "Yuji Inagaki"}, {"name": "Takashi Kimura"}, {"name": "Koichiro Ienaga"}, {"name": "Tatsuya Kawae"}], "featured_authors": [{"name": "Ryoma Kato"}, {"name": "Ten-ichiro Yoshida"}, {"name": "Riku Iimori"}, {"name": "Takashi Kimura"}, {"name": "Koichiro Ienaga"}, {"name": "Tatsuya Kawae"}], "author_count": 8}, {"id": "2605.20990", "category": "cond-mat", "title": "Competing anisotropies and phase transitions in the $q$-state clock model with a $p$-fold crystalline field", "abstract": "We study the two-dimensional $q$-state clock model in the presence of an additional $p$-fold symmetry-breaking crystalline field using Monte Carlo simulations. While the pure clock model exhibits Berezinskii--Kosterlitz--Thouless (BKT) transitions for sufficiently large $q$, the effect of competing discrete anisotropies on this topological phase remains nontrivial. We show that even weak crystalline fields qualitatively modify the phase diagram by suppressing the BKT phase and inducing transitions to states with true long-range order. The resulting behavior depends sensitively on the interplay between the intrinsic $\\mathbb{Z}_q$ symmetry and the imposed $\\mathbb{Z}_p$ anisotropy. In particular, in the six-state clock model for $p=2$ we observe qualitatively different scenarios depending on the sign of the field: a single transition for $h_2>0$ and a two-step ordering process for $h_2<0$ with an intermediate ordered phase. For $p=3$, the system exhibits a direct transition consistent with three-state Potts criticality. These results demonstrate that the phase structure cannot be inferred from symmetry considerations alone, but is governed by the competition between distinct locking mechanisms. Our findings provide a discrete counterpart to the multi-frequency sine-Gordon description of generalized $XY$ models and illustrate how additional anisotropies reshape topological phase transitions in two dimensions.", "url": "https://arxiv.org/abs/2605.20990", "type": "理论+数值", "summary": "1. 该工作运用蒙特卡洛模拟研究二维q态时钟模型在附加p重晶场下的相变行为。\n2. 其核心发现是竞争性离散各向异性抑制了BKT拓扑相，并诱导出真正长程序，且对于六态模型p=2情形，场的符号决定了单步或两步有序化过程。\n3. 这揭示了相结构不能仅由对称性推断，而是取决于不同锁定机制的竞争，为广义XY模型的多频率正弦-戈登描述提供了离散对应。", "summary_source": "deepseek", "authors": [{"name": "Milan Žukovič"}], "featured_authors": [{"name": "Milan Žukovič"}], "author_count": 1}, {"id": "2605.21003", "category": "cond-mat", "title": "Thermodynamic and structural behavior of one-dimensional divalent patchy hard rods: Wertheim's first-order thermodynamic perturbation theory versus exact results", "abstract": "We investigate the thermodynamic and structural properties of divalent patchy hard rods confined to a one-dimensional channel by modeling the bonding sites as attractive square-well (SW) patches located at the rod tips. The zero-range sticky limit is recovered by letting the well width vanish while keeping the stickiness parameter finite. While Wertheim's first-order thermodynamic perturbation theory (TPT1) becomes exact in this sticky limit, it fails for finite-range site-site interactions. We show that the theory can be made exact in one dimension by replacing the standard law of mass action with an exact relation between the density and the fraction of unbonded sites, together with an exact bonding free-energy contribution. Finite-range SW sites produce a richer structural behavior than sticky sites, including monotonic and oscillatory asymptotic decay of the pair correlation function, separated by the Fisher--Widom line. In the monotonic regime, the correlation length exhibits an absolute maximum defining the Widom line, while in the oscillatory regime it may display a local maximum and minimum, whose locus defines the ``Extrema of the Correlation length under Oscillatory decay'' (ECO) line. These features disappear in the sticky limit, where the system remains entirely in the oscillatory regime. We also show that the high-pressure behavior of the correlation length changes from $\\xi\\sim p^2$ for finite-range SW sites to $\\xi\\sim p^3$ in the sticky limit.", "url": "https://arxiv.org/abs/2605.21003", "type": "理论", "summary": "1. 该工作研究一维二价位点硬棒体系，比较Wertheim一阶热力学微扰理论与精确热力学及结构结果。\n2. 核心在于用精确的密度-未键合分数关系替代标准质量作用定律，使TPT1在一维严格精确，并揭示有限程方阱位点引发比粘性极限更丰富的结构行为，包括相关函数的单调与振荡衰减及Fisher-Widom线、Widom线与ECO线。\n3. 这为发展可精确求解的位点粒子模型理论提供了明确路径，并启示有限程位点相互作用在低维体系中产生非平庸结构特征的普适性。", "summary_source": "deepseek", "authors": [{"name": "Ana M. Montero"}, {"name": "Andrés Santos"}, {"name": "Péter Gurin"}, {"name": "Szabolcs Varga"}], "featured_authors": [{"name": "Ana M. Montero"}, {"name": "Andrés Santos"}, {"name": "Péter Gurin"}, {"name": "Szabolcs Varga"}], "author_count": 4}, {"id": "2605.21010", "category": "cond-mat", "title": "Properties of the skyrmion crystal SkX-2 in the Heisenberg triangular lattice with scalar chirality", "abstract": "Skyrmion crystals have been primarily discovered under a magnetic field for materials with non-centrosymmetric interactions. More recent developments have investigated the stability of skyrmion crystals in itinerant magnets without magnetic field. In this study, we find that a type of skyrmion crystal with two topological charges per unit cell and no magnetization at the ferromagnetic point in reciprocal space, SkX-2, is naturally stabilized in an $SO(3)$-symmetric model with short-range interactions realized by the Heisenberg model on the triangular lattice with scalar chirality. We complement our numerical results with a theoretical analysis that quantitatively describes the transition from the ferromagnetic ground state to the SkX-2 and the evolution of the topological charge density. Despite the constraints given by the Mermin-Wagner theorem at finite temperature, the SkX-2 exhibits both a first-order phase transition associated with translation symmetry breaking and a continuous transition to a floating solid, depending on the charge density controlled by the model parameters. Finally, the tetrahedral phase supported by an antiferromagnetic interaction in our model is found to host $\\mathbb{Z}_2$-vortices at finite temperature, suggesting the existence of an additional vortex topological transition.", "url": "https://arxiv.org/abs/2605.21010", "type": "理论+数值", "summary": "1. 该工作通过数值模拟与理论分析，在具有标量手性的三角晶格海森堡模型中发现了稳定的双拓扑荷斯格明子晶体SkX-2，每个原胞携带两个拓扑荷且在倒空间Γ点无净磁化。\n2. 核心卖点在于揭示了SO(3)对称短程相互作用下无外磁场时SkX-2的自发稳定机制，并定量描述了从铁磁基态到SkX-2的拓扑相变及拓扑荷密度演化。\n3. 这为突破传统非中心对称相互作用和外磁场限制提供新途径，并预言了有限温度下平移对称性破缺一级相变、浮固体连续相变及四面体相中Z2涡旋拓扑转变。", "summary_source": "deepseek", "authors": [{"name": "H. Bocquet"}, {"name": "C. J. Ganahl"}, {"name": "M. Scheurer"}, {"name": "P. M. Derlet"}, {"name": "A. M. Läuchli"}], "featured_authors": [{"name": "H. Bocquet"}, {"name": "C. J. Ganahl"}, {"name": "M. Scheurer"}, {"name": "P. M. Derlet"}, {"name": "A. M. Läuchli"}], "author_count": 5}, {"id": "2605.21229", "category": "cond-mat", "title": "Probing topological phase transitions via nonlinear Hall response in strained moiré dice lattice", "abstract": "Valley polarized twisted bilayer dice lattice hosts topologically nontrivial flat bands far from charge neutrality due to broken time reversal symmetry, whereas the ones in the vicinity of it remain topologically trivial. However, when both valleys are taken into consideration, the time reversal symmetry is preserved, which poses a serious hindrance to enumerate the valley specific topological phases that rely on the detection of the Berry curvature. In this work, we demonstrate that such a twisted structure with an applied uniaxial strain exhibits a nonlinear Hall effect far from charge neutrality. We ascertain that the nonlinear anomalous Hall signals can serve as a probe for topological phase transitions associated with a specific energy state that is constrained to reside at the lower edge of the middle subband and controlled via a staggered mass. Specifically, we show that the nonlinear anomalous Hall response undergoes a sign reversal across the topological phase boundaries. By tuning the carrier density, we compute the nonlinear Hall response obtained from the Berry curvature dipole, both in the chiral limit, and also when the chiral symmetry is broken. It is further seen that the nonlinear Hall effect is significantly enhanced in the broken chiral symmetry regime.", "url": "https://arxiv.org/abs/2605.21229", "type": "理论", "summary": "1. 该工作理论展示了在具有单轴应变的扭曲双层谷极化dice晶格中，非线性反常霍尔信号可探测远离电荷中性的拓扑相变。\n2. 其关键物理在于非线性霍尔响应在拓扑相边界处发生符号反转，且在手性对称性破缺时显著增强，源于Berry曲率偶极子的贡献。\n3. 这为在时间反演对称体系中通过非线性霍尔效应区分特定能态（中间子带下边缘）的拓扑相提供了可验证的探针。", "summary_source": "deepseek", "authors": [{"name": "Gourab Paul"}, {"name": "Srijata Lahiri"}, {"name": "Bilal Tanatar"}, {"name": "Saurabh Basu"}], "featured_authors": [{"name": "Gourab Paul"}, {"name": "Srijata Lahiri"}, {"name": "Bilal Tanatar"}, {"name": "Saurabh Basu"}], "author_count": 4}, {"id": "2605.21254", "category": "cond-mat", "title": "Random Matrix Spectra from Boltzmann-Weighted Lattice Ensembles", "abstract": "We introduce a random matrix framework for studying statistical-mechanical lattice systems through spectral observables. Equilibrium configurations sampled from a Boltzmann measure are mapped to matrix ensembles whose covariance structure is inherited from the spatial correlations of the underlying model. This construction maps real-space correlation functions to a momentum-space variance profile, providing a direct bridge between statistical-mechanical correlations and correlated random matrix ensembles. We derive this variance profile in finite-correlation-length and critical regimes, and compute spectral moments within a Wick-contraction expansion. A complementary self-consistent description of the bulk density is developed using the resolvent formalism. These analytical methods are benchmarked against Monte Carlo data for the two-dimensional Ising model and three-dimensional Edwards--Anderson spin glasses. In both cases, the spectra evolve from the semicircle law at high temperature to model-dependent critical forms reflecting the structure of correlations. The framework, therefore, provides a quantitative spectral route to probing collective behavior in ordered and disordered statistical systems, while also defining a class of physically motivated correlated random matrix ensembles.", "url": "https://arxiv.org/abs/2605.21254", "type": "理论+数值", "summary": "1. 该工作构建了一个将玻尔兹曼权重格点系综映射为协方差结构源于空间关联的随机矩阵系综的框架，并将实空间关联函数变换为动量空间方差分布。\n2. 其核心在于推导了有限关联长度和临界区的方差分布，并利用维克收缩展开及预解式形式分别计算谱矩和体密度，在二维伊辛模型与三维爱德华兹-安德森自旋玻璃中验证了谱从半圆律到临界形式的结构演化。\n3. 这为通过谱观测量化探测有序及无序统计系统中的集体行为提供了直接途径，并定义了一类物理上相关的关联随机矩阵系综，启发后续理论分析。", "summary_source": "deepseek", "authors": [{"name": "Yaprak Önder"}, {"name": "Abbas Ali Saberi"}, {"name": "Roderich Moessner"}], "featured_authors": [{"name": "Yaprak Önder"}, {"name": "Abbas Ali Saberi"}, {"name": "Roderich Moessner"}], "author_count": 3}, {"id": "2605.21277", "category": "cond-mat", "title": "Fermion condensation in a generalized Hatsugai-Kohmoto model with momentum-mixing Landau interactions", "abstract": "The Hatsugai-Kohmoto (HK) model is an exactly solvable electronic lattice model where the interaction between electrons with opposite spin is diagonal in momentum space. We generalize the HK model by introducing momentum-mixing Landau interactions. Within a self-consistent mean-field analysis we find that the ground state of this model exhibits a partially flat energy band, in agreement with the fermion condensation scenario proposed by Khodel and Shaginyan [JETP Lett. 51, 553 (1990)]. Inspired by Andersons pseudospin formulation of BCS theory, we show that the HK model with Landau interactions can be mapped onto a generalized Ising model where each site of the reciprocal lattice hosts two Ising spins. In the pseudospin picture the emergence of a partially flat electronic band corresponds to the smoothing of a magnetic domain wall. Moreover, guided by the pseudospin picture, we propose an exactly solvable variant of the HK model which has a unique ground state for all densities.", "url": "https://arxiv.org/abs/2605.21277", "type": "理论", "summary": "1. 该工作推广了Hatsugai-Kohmoto模型，引入动量混合Landau相互作用，并运用自洽平均场分析其基态。\n2. 其核心在于发现部分平坦能带，证实费米子凝聚，并通过赝自旋映射将之与广义Ising模型磁畴壁平滑化等价。\n3. 这为解析非费米液体行为及构建具唯一基态的精确可解强关联模型提供了理论框架与直观图像。", "summary_source": "deepseek", "authors": [{"name": "Jan Heinrich"}, {"name": "Andreas Rückriegel"}, {"name": "Peter Kopietz"}], "featured_authors": [{"name": "Jan Heinrich"}, {"name": "Andreas Rückriegel"}, {"name": "Peter Kopietz"}], "author_count": 3}, {"id": "2605.21284", "category": "cond-mat", "title": "Ligand-mediated Origin of Altermagnetic Spin-Splitting", "abstract": "Altermagnets host spin-split electronic bands despite zero net magnetization, opening new routes for spintronics beyond conventional ferromagnets. Going beyond symmetry-based classifications, which specify allowed terms but not their hierarchy, here we use first-principles calculations and Wannier Hamiltonian engineering to uncover the microscopic bonding contributions of altermagnetic spin splitting in the $g$-wave altermagnet Co$_{1/4}$NbSe$_2$. We show that the splitting is captured by a short-range tight-binding model, establishing its local origin. By selectively controlling hopping channels, we demonstrate that the dominant contribution arises not from direct magnetic-ion hopping, but from ligand-mediated hybridization that transfers anisotropy to itinerant states. This identifies ligand-assisted coupling as the key mechanism of altermagnetic spin splitting and provides a microscopic bridge between minimal models and symmetry guided first-principles material searches, enabling real-space design of altermagnetic functionality.", "url": "https://arxiv.org/abs/2605.21284", "type": "理论+数值", "summary": "1. 该工作利用第一性原理计算与Wannier函数方法，针对g波交变磁体Co1/4NbSe2，揭示了其自旋劈裂源于配体介导的杂化过程，而非直接d-d轨道跳跃，确立了该劈裂的局域和短程特征。\n2. 其主要物理卖点在于通过选择性调控不同跳跃通道，证明短程紧束缚模型足以定量描述自旋劈裂，并指出配体辅助耦合是传递磁各向异性至巡游态的核心机制，超越了对称性层级分析。\n3. 这一发现为最小模型与第一性原理材料预测提供了微观桥梁，并启发了通过理性设计配体环境来实空间调控交变磁功能，为开发新型自旋电子学材料指明了具体路径。", "summary_source": "deepseek", "authors": [{"name": "Luigi Camerano"}, {"name": "Federico Bisti"}, {"name": "Gianni Profeta"}], "featured_authors": [{"name": "Luigi Camerano"}, {"name": "Federico Bisti"}, {"name": "Gianni Profeta"}], "author_count": 3}, {"id": "2605.21298", "category": "cond-mat", "title": "Interaction Controlled Molecular Probing of Length Scale Dependent Glassy Dynamics in Polymer Melts", "abstract": "Single molecule probes are widely used to characterize dynamic heterogeneity in glass forming liquids, but interpreting probe dynamics remains challenging because the measured response depends on how the probe couples to its host environment. Using molecular dynamics simulations of dilute probe dimers embedded in a supercooled polymer melt, we show that the probe--host interaction strength determines which heterogeneous environment of the host matrix is reflected in the probe dynamics. Weakly interacting probes partially decouple from their local cages and remain able to access dynamically active environments, whereas strongly interacting probes are more constrained within less mobile, cage-like environments. This interaction-dependent response provides a microscopic basis for the variation in fragility inferred from the probe dynamics, even though the intrinsic host dynamics remains essentially unperturbed. By comparing probe rotational relaxation with the wavevector-dependent structural relaxation and dynamic susceptibility of the host, we establish a scale-dependent correspondence between probe dynamics and host dynamic heterogeneity. Our results show that molecular probes do not simply report the bulk host relaxation, but instead encode the spatial scale and heterogeneous environment associated with the probe--host interaction.", "url": "https://arxiv.org/abs/2605.21298", "type": "数值", "summary": "1. 该工作通过分子动力学模拟稀探针二聚体，研究了探针-宿主相互作用强度如何调控过冷聚合物熔体中玻璃态动力学的尺度依赖探测。\n2. 其核心发现是弱相互作用探针部分脱离局域笼而访问活性环境，强相互作用探针受限于低迁移笼，从而建立了探针旋转弛豫与宿主波矢依赖结构弛豫及动态磁化率之间的尺度对应关系。\n3. 这为理解基于探针动力学推断的脆性变化提供了微观机制，揭示分子探针本质上是编码相互作用调节的空间尺度与异质环境的敏感器，而非简单反映本体弛豫。", "summary_source": "deepseek", "authors": [{"name": "Suyeon Kim"}, {"name": "Taejin Kwon"}], "featured_authors": [{"name": "Suyeon Kim"}, {"name": "Taejin Kwon"}], "author_count": 2}, {"id": "2605.21357", "category": "cond-mat", "title": "Physical completion of the Navier-Stokes equations", "abstract": "The incompressible Navier-Stokes equations contain viscous dissipation but no thermal noise. I show, using a topological argument based on Poincaré's lemma, that the fluctuation-dissipation relation for the full nonlinear dynamics can be derived without the linearisation or structural assumptions that all previous derivations require. The nonlinear convective term is Hamiltonian (energy-preserving and phase-space-volume-preserving) and drops out of the Fokker-Planck equilibrium condition exactly, so the noise derived from linearised fluctuations near equilibrium is in fact exact for the full nonlinear system. This result proves, rather than assumes, the reversible/irreversible decomposition that the GENERIC framework postulates, provided Poincaré's lemma holds on the phase space. The resulting stochastic system, with a physical molecular-scale spectral cutoff, is trivially globally well-posed: a finite-dimensional stochastic differential equation with non-degenerate noise and a confining Lyapunov function. It has a unique Gibbs equilibrium and converges to it exponentially. The difficulty of the Clay Millennium Prize Problem arises entirely from two idealisations, zero temperature and infinite spectral resolution, neither of which is satisfied by any physical fluid.", "url": "https://arxiv.org/abs/2605.21357", "type": "理论", "summary": "1. 该工作通过引入分子尺度热噪声并证明涨落-耗散定理对完全非线性Navier-Stokes动力学精确成立，实现了方程的物理完备化。\n2. 其核心卖点是利用庞加莱引理的拓扑论证，无需线性化或结构假设即导出可逆/不可逆分解，严格证明了GENERIC框架的合理性。\n3. 这一结果明确指出Clay千禧年问题中全局正则性的困难源于零温度和无限谱分辨率两类理想化，而物理流体固有有限维随机正则性。", "summary_source": "deepseek", "authors": [{"name": "Samuel L. Braunstein"}], "featured_authors": [{"name": "Samuel L. Braunstein"}], "author_count": 1}, {"id": "2605.21364", "category": "cond-mat", "title": "Dynamical systems on ultra small-world networks", "abstract": "Despite the knowledge that social, economical, and ecological networks are often of a small-world nature with inter-nodal distance growing even slower than logarithmically with system size, we often assume theoretical systems to be outside of this regime, to make them easier to treat analytically. Here we derive a framework to apply the powerful dynamical mean-field theory on highly heterogeneous networks that is able to account for more of the degree correlations naturally arising from network constraints, known as structural cut-offs. We apply this framework to the well-studied and understood disordered Lotka-Volterra model, and show typically reported observables such as survival rates and stability for these systems on ultra small-world networks. We find much better agreement for these variables for all ranges of exponents for simulated power-law networks as well as empirically sourced networks.", "url": "https://arxiv.org/abs/2605.21364", "type": "理论", "summary": "1. 该工作针对超小世界高度异质网络，推导了能处理结构截止引起的度相关性的动态平均场理论框架。\n2. 其核心卖点在于该框架通过保留网络约束带来的度相关性，显著提升了Lotka-Volterra模型在模拟与实证网络上生存率和稳定性的预测精度。\n3. 这为精确分析真实小世界网络（如社会、生态网络）上的非平衡动力学提供了普适工具，并可启发对强异质性系统中涌现行为的理论探索。", "summary_source": "deepseek", "authors": [{"name": "Nirbhay Patil"}, {"name": "Ada Altieri"}, {"name": "Fabian Aguirre-Lopez"}], "featured_authors": [{"name": "Nirbhay Patil"}, {"name": "Ada Altieri"}, {"name": "Fabian Aguirre-Lopez"}], "author_count": 3}, {"id": "2605.21386", "category": "cond-mat", "title": "Strange metallicity in the Kagome metal Ni$_3$In: a DMFT investigation", "abstract": "Strange metallicity, characterized by a linear temperature dependence of the resistivity, is observed in a broad range of correlated materials, including heavy-fermion compounds and cuprate superconductors. It has also recently been reported for the Kagome metal Ni$_3$In, where almost localized and itinerant electronic degrees of freedom coexist as a result of a partially flat band. We investigate the correlated electronic structure and transport properties of Ni$_3$In with dynamical mean field theory (DMFT) calculations performed on a minimal single-band Hubbard model, constructed from compact molecular orbitals. Despite the large band filling, even for moderate Hubbard repulsion, we observe a non-Fermi-liquid like frequency dependence of the self-energy, as well as the formation of local magnetic moments. With increased hole doping, a crossover to a heavy Fermi-liquid regime is found. We interpret these results in terms of an effective model for the partially filled narrow band near $k_z=0$.", "url": "https://arxiv.org/abs/2605.21386", "type": "理论+数值", "summary": "1. 该工作利用动力学平均场理论，基于紧束缚分子轨道构建的单带Hubbard模型，研究了Kagome金属Ni₃In的奇异金属性。\n2. 其技术核心在于揭示了即使处于高带填充分数，中等强度Hubbard排斥即可导致非费米液体自能频率依赖与局域磁矩形成，而空穴掺杂则诱导向重费米液体的渡越。\n3. 这为理解部分扁平带系统中奇异物性提供了有效低能模型框架，并启发对关联电子体系中奇异金属相图的理论刻画。", "summary_source": "deepseek", "authors": [{"name": "Ruslan Mushkaev"}, {"name": "Francesco Petocchi"}, {"name": "Philipp Werner"}], "featured_authors": [{"name": "Ruslan Mushkaev"}, {"name": "Francesco Petocchi"}, {"name": "Philipp Werner"}], "author_count": 3}, {"id": "2605.20294", "category": "hep-th", "title": "Topology sums, sectorwise holography, and horizon normalcy", "abstract": "The ``holography of information'' (HoI) principle argues that gravity can encode information redundantly in asymptotic observables. Although HoI is ultimately a nonperturbative claim, its standard motivation uses semiclassical gravitational constraints, the boundary nature of the Hamiltonian, and vacuum-sector cyclicity. We ask what happens when the same semiclassical path-integral reasoning allows topology sums that generate baby-universe or $\\alpha$-sector data. Our analysis is conditional: such sectors need not survive in every unitary completion, and the Baby Universe Hypothesis of McNamara and Vafa instead suggests $\\dim\\mathcal H_{\\rm BU}=1$ in consistent $d>3$ quantum gravity. If $\\mathcal H_{\\rm BU}$ is nontrivial, as in the Marolf--Maxfield formulation and in ensemble-like examples such as JT gravity, then HoI is naturally refined to an $\\alpha$-sectorwise statement, $\\overline{\\mathcal A_\\infty^{(\\alpha)}|0_\\alpha\\rangle}=\\mathcal H_\\alpha$, rather than completeness on the full topology-summed Hilbert space. In a fixed $\\alpha$-sector, HoI may obstruct AMPS factorization and allow a smooth horizon; in an unconditioned topology-summed state, the sector-independent obstruction is not automatic. A Bell-pair diagnostic shows that a sector-independent smooth interior requires aligned interior reconstructions, or access to the sector label. Thus the HoI-based absence of firewalls becomes conditional on global sector data, in tension with the generally covariant expectation emphasized by Bousso that horizon normalcy should be determined by local semiclassical geometry. If the exact theory collapses $\\mathcal H_{\\rm BU}$ to one dimension, the obstruction discussed here is absent.", "url": "https://arxiv.org/abs/2605.20294", "type": "理论", "summary": "1. 本文分析了半经典路径积分中包含拓扑和时，全息信息原理（HoI）如何自然地精炼为α扇区依赖的表述，并探讨了其对视界正常性的影响。\n2. 核心在于指出若婴儿宇宙希尔伯特空间（ℋ_BU）非平凡，则基于HoI的无防火墙论证依赖于全局扇区数据，这与局部几何决定视界正常性的协变期望产生张力。\n3. 若精确量子引力将ℋ_BU坍缩为一维，则上述障碍消失；否则防火墙问题的解决需借助扇区标签或内部重构，启示了非微扰全息框架修正的必要性。", "summary_source": "deepseek", "authors": [{"name": "Naman Kumar"}], "featured_authors": [{"name": "Naman Kumar"}], "author_count": 1}, {"id": "2605.20319", "category": "hep-th", "title": "The Equivalence Principle at High Energies Completes the Spectrum", "abstract": "We prove a version of the completeness hypothesis that follows from the coexistence of symmetry and gravity: tree-level gravitational scattering mandates single-particle states in all possible irreducible representations of the symmetry group constructible from a single seed charge. Our main assumption is that the leading high-energy behavior of scattering is universal irrespective of charge, thus satisfying the equivalence principle. Curiously, we discover that these newly-deduced states contribute democratically - that is, with equal interaction strengths - to scattering.", "url": "https://arxiv.org/abs/2605.20319", "type": "理论", "summary": "1. 该工作证明了对称性与引力共存导出的完备性假说：树级引力散射要求从单一种子电荷构造的所有对称群不可约表示中均存在单粒子态。\n2. 其核心假设是散射的高能主导行为对电荷具有普适性，从而满足等效原理，并基于此推出新态的存在。\n3. 新推演出的态以等相互作用强度民主地贡献于散射，这为高能引力散射中对称性与等效原理的统一提供了深刻约束。", "summary_source": "deepseek", "authors": [{"name": "Francesco Calisto"}, {"name": "Clifford Cheung"}, {"name": "Grant N. Remmen"}, {"name": "Francesco Sciotti"}, {"name": "Michele Tarquini"}], "featured_authors": [{"name": "Francesco Calisto"}, {"name": "Clifford Cheung"}, {"name": "Grant N. Remmen"}, {"name": "Francesco Sciotti"}, {"name": "Michele Tarquini"}], "author_count": 5}, {"id": "2605.20321", "category": "hep-th", "title": "Poles-zeros duality in semi-holographic Mott insulators", "abstract": "Inspired by the poles-zeros duality of Green's functions that appears in transitions into Mott-insulating phases in strongly correlated condensed matter systems, we propose a semi-holographic approach to Mott insulators. In this model, a fundamental fermion is coupled to a large-$N$, strongly interacting sector that generates a self-energy for the fundamental fermion's Green's function. This coupling amounts to a hybridization of the fundamental fermion with a strongly correlated fermionic composite. Within the holographic framework, at large $N$, the Green's function of the composite fermion naturally exhibits a poles-zeros duality. Zeros of the Green's function are caused by the poles of the self-energy that correspond to collective many-body excitations of the holographic strongly interacting sector. We calculate the spectral function of the fundamental fermion, from which we characterize the semi-holographic metallic and the Mott-insulating phases. In addition to the new physical interpretation of the zeros, our analysis yields a well-defined picture of the poles-zeros duality in terms of the freedom to choose between standard and alternative quantization in the strongly coupled sector.", "url": "https://arxiv.org/abs/2605.20321", "type": "理论", "summary": "1. 该工作提出半全息方法研究Mott绝缘体，将基本费米子耦合至大N强相互作用扇区，以描述格林函数的极点-零点对偶性。\n2. 其物理卖点在于复合费米子格林函数在全息框架下自然呈现对偶，零点源于强关联扇区集体激发的自能极点，并通过标准与替代量子化选择给出清晰诠释。\n3. 这为理解强关联体系中Mott跃迁的极点-零点对偶机制提供了新视角，并指导半全息金属与绝缘体相的光谱表征。", "summary_source": "deepseek", "authors": [{"name": "Thomas Kögel"}, {"name": "Alessio Caddeo"}, {"name": "Amelie Pitters"}, {"name": "Francesca Paoletti"}, {"name": "Lorenzo Crippa"}, {"name": "Giorgio Sangiovanni"}, {"name": "René Meyer"}, {"name": "Johanna Erdmenger"}], "featured_authors": [{"name": "Thomas Kögel"}, {"name": "Alessio Caddeo"}, {"name": "Amelie Pitters"}, {"name": "Giorgio Sangiovanni"}, {"name": "René Meyer"}, {"name": "Johanna Erdmenger"}], "author_count": 8}, {"id": "2605.20324", "category": "hep-th", "title": "Closed String Field Theory in 25.99 Dimensions", "abstract": "We return to and refine Zwiebach's formulation of closed string field theory (CSFT) built around non-critical backgrounds [1,2], restricting our attention to genus zero. The structure involves a special string state $F$ that encodes the failure of worldsheet BRST invariance, and a metric-dependent descent operator $\\mathcal{B}$ adapted to the Weyl frame. We construct the mixed moduli spaces needed for the classical BV action, prove their existence, and extend the Sen-Zwiebach background independence argument to first order off of the conformal locus. We apply the formalism to the mildest deviation away from criticality - worldsheet CFTs with nonzero central charge: we consider both D=26-$\\epsilon$ dimensional flat space and linear dilaton profiles in bosonic string theory, focusing for simplicity on building solutions that depend on only one of the D dimensions.", "url": "https://arxiv.org/abs/2605.20324", "type": "理论", "summary": "1. 该工作重新审视并完善了基于非临界背景的闭弦场论形式，在属零层次构造了经典BV作用所需的混合模空间并证明其存在。\n2. 其物理核心在于引入编码世界面BRST破缺的弦态F和适配Weyl标架的下降算符B，并将背景独立性论证拓展至共形轨迹一阶邻域。\n3. 这为系统研究非零中心荷世界面CFT（如D=26-ε维平坦时空与线性膨胀背景）的低维弦场论提供了严格框架，有望推广至高阶微扰或高属结构。", "summary_source": "deepseek", "authors": [{"name": "Ahmadain Amr"}, {"name": "Frenkel Alexander"}, {"name": "Yin Xi"}], "featured_authors": [{"name": "Ahmadain Amr"}, {"name": "Frenkel Alexander"}, {"name": "Yin Xi"}], "author_count": 3}, {"id": "2605.20349", "category": "hep-th", "title": "The fate of Reissner--Nordström--de Sitter black holes: nonequilibrium discharge and evaporation", "abstract": "We develop a semiclassical description of Reissner--Nordström--de Sitter (RN--dS) evaporation by combining a spherically reduced two-dimensional dilaton gravity model with Polyakov anomaly backreaction. The framework captures the causal and thermodynamic structure of the static patch and yields closed adiabatic evolution equations for the mass and charge. With an outward-oriented flux convention, the anomaly-induced Killing-energy flux is $\\mathcal F=(N_{\\rm eff}/48\\pi)(\\kappa_b^2-\\kappa_c^2)$, while the full mass evolution is $\\dot M=-\\mathcal F+\\Phi_b\\dot Q$, with $\\Phi_b=Q/r_b$. We prove analytically that along the entire sub-Nariai neutral Schwarzschild--de Sitter branch $\\kappa_b>\\kappa_c$, so neutral black holes lose mass monotonically. Schwinger pair production provides the discharge channel. In the rapid-discharge regime, controlled charged trajectories become effectively neutral on a timescale short compared with the anomaly-driven Hawking mass-loss time and then follow the neutral SdS channel toward empty de Sitter space. The classical lukewarm locus $T_b=T_c$ is only the nullcline of the anomaly-induced heat flux: the electromagnetic work term tilts the full semiclassical vector field away from this curve, so it is not an invariant trajectory. When sufficiently light charged species provide a rapid-discharge channel, the classical cold/extremal, charged Nariai, ultracold, and lukewarm loci are not semiclassical attractors for controlled nondegenerate trajectories. These results give an adiabatically backreacted derivation of the RN--dS evaporation endpoint in the regime controlled by anomaly-induced flux and rapid charge discharge, and provide the semiclassical background for generalized-second-law monotonicity and conservative quantum-extremal-surface/island estimates.", "url": "https://arxiv.org/abs/2605.20349", "type": "理论", "summary": "1. 该工作通过球对称约化的二维dilaton引力与Polyakov反常反作用，建立了Reissner–Nordström–de Sitter黑洞蒸发的半经典描述。\n2. 其核心在于解析推导出反常诱导Killing能流与质量演化方程，证明中性Schwarzschild–de Sitter支单调蒸发，并指出快速Schwinger放电使带电轨迹退耦为中性通道。\n3. 这为确定RN–dS蒸发终点、广义第二定律单调性及量子极端面/岛计算提供了自洽的半经典背景。", "summary_source": "deepseek", "authors": [{"name": "Damien A. Easson"}], "featured_authors": [{"name": "Damien A. Easson"}], "author_count": 1}, {"id": "2605.20415", "category": "hep-th", "title": "The dual Ginzburg-Landau theory for a holographic superfluid/superconductor: Critical dynamics", "abstract": "Holographic superfluids/superconductors are one of the most studied systems in the AdS/CFT duality. In the low-energy, in the long-wavelength limit, they should be described by a Ginzburg-Landau theory. For critical dynamics, one expects that they belong to \"model F\" universality class. We consider a bulk 5-dimensional holographic superfluid/superconductor in the probe limit. For the holographic superconductor, we impose the boundary Maxwell equation to make the boundary Maxwell field dynamical. We identify the dual model F equations where numerical coefficients are obtained exactly.", "url": "https://arxiv.org/abs/2605.20415", "type": "理论", "summary": "1. 该工作为探针极限下的五维全息超流/超导体构建了低能长波极限的对偶金兹堡-朗道理论，并聚焦临界动力学。\n2. 其主要技术进展在于通过使边界麦克斯韦场动力学化，精确识别了对偶“模型F”方程中所有数值系数。\n3. 这为从全息对偶精确描述超流/超导体临界动力学提供了具体框架，并建立了与凝聚态模型F普适类的严格对应。", "summary_source": "deepseek", "authors": [{"name": "Makoto Natsuume"}], "featured_authors": [{"name": "Makoto Natsuume"}], "author_count": 1}, {"id": "2605.20427", "category": "hep-th", "title": "Conformal anomaly in a vector field model with auxiliary scalar field", "abstract": "The conformal anomaly has well-known ambiguities related to the possible schemes of regularization and renormalization. In case of dimensional regularization, one of the options is to formulate the theory as conformal in the dimension $D \\neq 4$. For a gauge vector field this can be done in several ways and one of the options is to introduce an auxiliary scalar playing the role of a compensator. The advantage of this approach is that it preserves gauge symmetry and avoids problems with possible violation of unitarity. We explore the consequences of introducing such an auxiliary field for the anomaly and anomaly-induced action. It is shown that the new scalar degree of freedom gains an independent dynamics after taking the $4D$ limit. The remnant scalar, also, demonstrates some interesting properties.", "url": "https://arxiv.org/abs/2605.20427", "type": "理论", "summary": "1. 该工作研究了引入辅助标量场作为补偿器对规范矢量场模型中共形反常及反常诱导作用量的影响。\n2. 其技术优势在于该方案在非四维维度下保持规范对称性且避免幺正性问题，并揭示辅助标量场在四维极限下获得独立动力学。\n3. 这为理解共形反常的规范不变处理及标量补偿器的物理后果提供了新线索，并可能影响相关量子场论的重整化方案选择。", "summary_source": "deepseek", "authors": [{"name": "Samuel W. P. Oliveira"}, {"name": "Públio Rwany B. R. do Vale"}, {"name": "Ilya L. Shapiro"}], "featured_authors": [{"name": "Samuel W. P. Oliveira"},
