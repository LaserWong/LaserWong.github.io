}, {"name": "Patrick Rebentrost"}], "author_count": 6}, {"id": "2610.03281", "category": "quant-ph", "title": "Efficiently and Reliably Measuring Information Processing Capacity in Dynamical Systems via Kernels", "abstract": "Information Processing Capacity (IPC) is a powerful system-agnostic metric for quantifying a dynamical system's computational capability and is widely used in quantum reservoir computing. However, standard IPC suffers from severe computational limitations. Computing IPC involves estimating how well the system can reconstruct, via linear regression, an (in principle) infinite family of orthogonal polynomial functions of delayed inputs. In practice, this evaluation must be made finite, so we need only to consider polynomials up to a chosen maximum degree. Moreover, the computational complexity for computing IPC grows combinatorially with the considered maximum degree and delay. Here, we introduce Kernel-IPC (KIPC), a scalable framework that uses kernel methods to compute the total IPC without explicitly enumerating basis functions. This allows us to account for the full (infinite) basis (without degree truncation). We also provide a null-hypothesis test for statistically comparing the KIPC of two dynamical systems. We validate KIPC on an echo state network and demonstrate its utility for quantum reservoir computing on a disordered spin chain.", "url": "https://arxiv.org/abs/2610.03281", "type": "理论", "summary": "1. 该工作提出基于核方法的信息处理能力计算框架，以避免显式枚举正交多项式基函数，并在回波状态网络和无序自旋链量子储备池计算上验证其有效性。\n2. 其核心卖点是无需按最大阶数截断即可计入完整无限基，从而绕过随阶数与延迟组合增长的计算复杂度，并给出比较两个动力系统信息处理能力的零假设检验。\n3. 该框架使量子储备池计算等平台的能力评估更可扩展且可统计比较，并为高维延迟输入和有限采样下的基准测试提供明确启发。", "summary_source": "deepseek", "authors": [{"name": "Alessio Benavoli"}, {"name": "Felix Binder"}, {"name": "Cangxiong Chen"}], "featured_authors": [{"name": "Alessio Benavoli"}, {"name": "Felix Binder"}, {"name": "Cangxiong Chen"}], "author_count": 3}, {"id": "2610.03304", "category": "quant-ph", "title": "Free fermionic black holes as polarised mirrors", "abstract": "Understanding the speed with which various classes of quantum systems can scramble information is a key goal of quantum information theory, with relevance to both fundamental physics and the study of the efficiency of quantum algorithms. Famously, such understanding enabled Hayden and Preskill to show that, under the assumption that black hole dynamics may be modelled by a Haar-random unitary, old black holes act as ''mirrors'', reflecting infalling quantum information back out again effectively instantaneously. In this work, we investigate which aspects of this mirror behaviour survive beyond the Haar-random setting by considering a random free fermionic model of black hole dynamics. We find that the rate of information release is governed by the underlying representation-theoretic structure; such a black hole acts as a ''polarised mirror'', retaining information encoded in low fermionic-degree irreps while reflecting information encoded in high fermionic-degree irreps much more rapidly. As a result of the retention of low-degree information, we show that faithful recovery of the infalling quantum information is impossible until all but a vanishing fraction of the black hole has evaporated. However, augmenting the dynamics with a fixed Clifford unitary can restore their reflective behaviour, even though the ensemble's frame potential remains unchanged and far above its Haar value. Remarkably, we find that such black holes can outperform their fully Haar-random counterparts: in the high-fidelity limit, recovering a single-qubit message requires asymptotically approximately $37\\%$ fewer emitted qubits.", "url": "https://arxiv.org/abs/2610.03304", "type": "理论+数值", "summary": "1. 了解各类量子系统扰乱信息的速度是量子信息理论的一个关键目标，与基础物理学和量子算法效率的研究相关。\n2. 由于保留了低度信息，我们表明，除非黑洞的几乎消失部分全部蒸发，否则不可能忠实地恢复落入的量子信息。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Maureen Krumtünger"}, {"name": "Maxwell West"}], "featured_authors": [{"name": "Maureen Krumtünger"}, {"name": "Maxwell West"}], "author_count": 2}, {"id": "2610.03362", "category": "quant-ph", "title": "Strict non-tightness of the level-3 quantum bootstrap for a natural three-dimensional Hamiltonian, at an excited level", "abstract": "For the coupled three-dimensional double well $H=\\tfrac12|p|^2+2\\sum_i(q_i^2-1)^2-\\sum_{i<j}q_i^2q_j^2$ we exhibit, at the first excited energy level (and also at the ground state), a linear functional on polynomials of degree $\\le 6$ that satisfies every constraint of the standard level-3 eigenstate bootstrap, has a \\emph{strictly} positive definite moment matrix, and nevertheless assigns a negative value to a nonnegative polynomial. It is therefore an interior point of the level-3 relaxation that is realized by no quantum state. The construction reflects a fact that holds at every level: the eigenstate rows never reach the top-degree momentum moments. At level 3, where strictly feasible points exist, this means that the corresponding block of the moment matrix carries no information about which energies admit one. Every algebraic ingredient is an exact rational certificate, and the only numerical ingredients (spectral enclosures of an eigenfunction) are carried out in rigorous ball arithmetic.", "url": "https://arxiv.org/abs/2610.03362", "type": "理论+数值", "summary": "1. 对于耦合三维双阱 $H=\\tfrac12|p|^2+2\\sum_i(q_i^2-1)^2-\\sum_{i<j}q_i^2q_j^2$ 我们展示，在第一激发能级（也在基态），$\\le 6$ 次多项式的线性函数满足标准 3 级本征态自举的每个约束，具有\\emph{严格}正定矩矩阵，但仍将负值分配给非负多项式。\n2. 其卖点在于提炼出该问题中的关键机制、方法优势或可计算结构。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Daniel Keren"}, {"name": "Ye Zhou"}], "featured_authors": [{"name": "Daniel Keren"}, {"name": "Ye Zhou"}], "author_count": 2}, {"id": "2610.03364", "category": "quant-ph", "title": "Distance-Independent Universality of Clifford+T", "abstract": "A well-known theorem states that the Clifford+T gate set is universal for quantum computing. The theorem combines approximation using a distance measure on unitary matrices with equality up to global phase. Previous proofs combine these two notions for specific distance measures, but do not identify the properties that govern how they work together. Which properties are sufficient to state and prove the theorem? We answer this question by defining projective distance measures using four axioms. We prove that the universality theorem holds for every distance measure satisfying these axioms. Thus, our formulation of the theorem is independent of any particular choice of distance measure. We show that the Hilbert-Schmidt distance is already a projective distance measure. We also develop a general construction that transforms a large class of distance measures into projective distance measures and apply it to obtain projective versions of the operator-norm distance, the Frobenius distance, and the trace distance. Finally, we formalize the proof of the universality theorem in Lean.", "url": "https://arxiv.org/abs/2610.03364", "type": "理论", "summary": "1. 该工作用四条公理定义投影距离度量，并证明Clifford+T通用性定理对满足公理的所有距离度量成立。\n2. 其关键在于证明通用性不依赖特定距离，希尔伯特-施密特距离已满足投影性，并给出算子范数、弗罗贝尼乌斯与迹距离的投影化构造。\n3. 该距离无关表述可推广通用性证明的适用范围，并为Lean形式化验证及距离度量选择提供统一框架。", "summary_source": "deepseek", "authors": [{"name": "Jens Palsberg"}, {"name": "Keli Huang"}, {"name": "Abdullah Almanei"}], "featured_authors": [{"name": "Jens Palsberg"}, {"name": "Keli Huang"}, {"name": "Abdullah Almanei"}], "author_count": 3}, {"id": "2610.03377", "category": "quant-ph", "title": "No Size-Preserving Amplification with Quantum Advice", "abstract": "Marriott and Watrous showed that quantum Merlin--Arthur games admit generic error reduction without increasing witness size [Computational Complexity, 2005]. In this work, we show that this state-size-preserving amplification property does not hold for polynomial-time quantum computation with quantum advice. In particular, we present decision problems for which even a vanishing additive error reduction requires longer advice. More precisely, for every polynomially bounded advice length $m(n)\\geq n^4$ and every error bound $\\varepsilon(n)$ that stays below $1/2$ by at least an inverse polynomial, there is a positive function $\\delta$ with $\\delta(n)=O\\bigl(\\min\\{(\\log m/m)^{1/4},\\ \\sqrt{\\log m/m}\\,/(1/2-\\varepsilon(n))\\}\\bigr)$ such that $\\mathsf{BQP}_{\\varepsilon}/\\mathsf{q}m \\subsetneq \\mathsf{BQP}_{\\varepsilon + \\delta}/\\mathsf{q}m$; for constant $\\varepsilon$ the gap is $O(\\sqrt{\\log m/m})$. Here, $\\mathsf{BQP}_\\varepsilon/\\mathsf{q}m$ is the class of languages recognizable with error at most $\\varepsilon(n)$ by a polynomial-time quantum algorithm with an $m(n)$-qubit advice state that only depends on the input length $n$. We show this by proving a stronger separation $\\mathsf{P}_{\\varepsilon+\\delta}/\\mathsf{r} m \\not\\subset \\mathsf{BQP}_{\\varepsilon}/\\mathsf{q} m$, where $\\mathsf{P}_{\\varepsilon}/\\mathsf{r}m$ is the class of languages recognizable with error at most $\\varepsilon(n)$ by a deterministic polynomial-time algorithm with an $m(n)$-bit advice string sampled from a distribution that depends only on $n$.", "url": "https://arxiv.org/abs/2610.03377", "type": "理论+数值", "summary": "1. 该工作否定了量子建议下保持建议长度的通用误差放大，构造出即使将加性误差降低至消失也必须加长建议的多项式时间量子决策问题。\n2. 其技术卖点是给出定量间隙：对任意多项式有界建议长度 m(n)≥n^4 和至少以反多项式低于 1/2 的 ε(n)，存在 δ(n)=O(min{(log m/m)^{1/4}, √(log m/m)/(1/2−ε(n))})，使 BQP_ε/qm 严格包含于 BQP_{ε+δ}/qm；常数 ε 时间隙为 O(√(log m/m))。\n3. 更强分离 P_{ε+δ}/rm ⊄ BQP_ε/qm 表明，依赖输入长度的分布建议所定义的经典多项式可计算性无法由量子建议模拟，从而限定了量子建议在误差降低中的能力，并提示建议复杂度与误差放大之间存在本质权衡。", "summary_source": "deepseek", "authors": [{"name": "Shih-Han Hung"}, {"name": "Han-Hsuan Lin"}], "featured_authors": [{"name": "Shih-Han Hung"}, {"name": "Han-Hsuan Lin"}], "author_count": 2}, {"id": "2610.03393", "category": "quant-ph", "title": "Multivariate quantum signal processing with optimal query complexity", "abstract": "Polynomial transformations of data encoded in quantum operations are a building block of quantum algorithms, and their query complexity measures how often those operations are used. For multiple variables, existing methods either realize restricted polynomial families or implement monomials separately at a query cost exponential in the number of variables. We present a quantum circuit that implements every multivariate trigonometric polynomial up to an explicit normalization. The circuit processes one variable coherently over the frequency components of the remaining variables, allowing all components to share the same signal queries. Each variable is queried exactly as many times as its degree in the polynomial, and we prove that this query complexity is optimal. We further extend the construction to commuting unitaries. The resulting circuit applies the multivariate polynomial simultaneously across their shared eigenbasis, using the minimum numbers of forward and inverse queries to each unitary. We also study trainable rotations with fixed preparation and a local readout of the last input. At query depth at least two, independent uniform initialization gives every active readout gradient a variance lower bound set by its squared branch weight and the inverse square root of the depth, uniformly over data states and dimensions. For supervised squared loss, retaining sample correlations gives an initialization gradient-variance bound in terms of targets and input spectra. This also bounds the expected loss decrease after the first exact gradient step with a specified step size. These results provide a scalable and practical solution for developing multivariate quantum algorithms and quantum learning models.", "url": "https://arxiv.org/abs/2610.03393", "type": "理论+数值", "summary": "1. 该工作提出一个能实现任意多变量三角多项式的量子电路，并扩展到对易酉算子。\n2. 各变量查询次数恰为其多项式次数且被证明最优，频率分量共享同一信号查询；可训练旋转深度不低于二时给出梯度方差下界。\n3. 这为可扩展的多变量量子算法与量子学习模型提供了实用方案，并给出初始化与首步梯度下降的界。", "summary_source": "deepseek", "authors": [{"name": "Mingrui Jing"}, {"name": "Xin Wang"}, {"name": "Zhan Yu"}, {"name": "Lei Zhang"}], "featured_authors": [{"name": "Mingrui Jing"}, {"name": "Xin Wang"}, {"name": "Zhan Yu"}, {"name": "Lei Zhang"}], "author_count": 4}, {"id": "2610.03399", "category": "quant-ph", "title": "Optimizing quantum error correction through error attribution", "abstract": "Logical error rate is a standard benchmark for quantum error correction, providing an aggregate measure of the overall effect of physical noise. In actual QEC architectures, errors at different circuit locations can have markedly different effects on logical failure even when their probabilities are equal. Here we introduce an error attribution scheme to quantitatively characterize the influence of individual circuit components on the logical error rate and use this refined information to guide targeted intervention and design for improved QEC performance. Our attribution estimator computes all component sensitivities jointly from the same Monte Carlo samples used to estimate the logical error rate. The resulting sensitivity maps identify hotspots where targeted noise reduction can most effectively improve logical performance. We test the scheme in circuit simulations of rotated surface code memories and high-rate lifted product codes: halving the noise strength on about 5\\%-7\\% of physical components selected by sensitivity reduces logical error rates by approximately 15\\%-25\\%, roughly twice the mean reduction from the same intervention on an equal number of randomly selected components. By connecting performance benchmarking to targeted optimization, our scheme provides a practical strategy for improving quantum error correction with limited resources.", "url": "https://arxiv.org/abs/2610.03399", "type": "理论+数值", "summary": "1. 该工作提出误差归因方案，用同一组蒙特卡洛样本联合估计各电路组件对逻辑错误率的敏感度，从而把整体基准分解到具体噪声位置并指导定向优化。\n2. 其关键在于无需额外采样即可给出灵敏度图，识别对逻辑失效影响最大的热点组件；在旋转表面码存储器和贵码率提升乘积码模拟中，对约5%–7%的组件将噪声减半可使逻辑错误率降低约15%–25%，约为随机选取同等数量组件的两倍。\n3. 这表明将性能基准与定向优化衔接，可在有限资源下提升量子纠错性能，并为后续面向具体架构的噪声热点干预与编码设计提供实用策略。", "summary_source": "deepseek", "authors": [{"name": "Yuguo Shao"}, {"name": "Zi-Wen Liu"}], "featured_authors": [{"name": "Yuguo Shao"}, {"name": "Zi-Wen Liu"}], "author_count": 2}, {"id": "2610.03408", "category": "quant-ph", "title": "Subdimensional linear-optical quantum computation: from qudit resource states to qubit quantum computation", "abstract": "In this paper, we propose a linear-optical quantum computation scheme that starts from high-dimensionally entangled qudits but performs quantum computation on qubits defined in their subspaces. This approach enables us to increase the success probability of linear-optical fusions from $50\\%$ to $1-1/d$ for qudits of dimension $d$ without relying on existing approaches using ancilla photons and quantum codes. In particular, we show that a 2D cluster state of qubits can be generated from 5-qudit 1D cluster states using pairwise fusion gates while preserving their boosted success probability. We numerically demonstrate that this approach can improve the loss tolerance of a percolation-based scheme while keeping the photon number per resource state constant.", "url": "https://arxiv.org/abs/2610.03408", "type": "数值", "summary": "1. 该工作提出子维度线性光学量子计算方案，从高维纠缠 qudit 资源态出发，仅在其中子空间定义的 qubit 上执行量子计算。\n2. 其核心卖点是不借助辅助光子和量子纠错码，仅通过高维融合门便将线性光学融合门的成功概率从 50% 提升至 1-1/d，并能用 5-qudit 一维簇态经成对融合生成 qubit 二维簇态而保持该增强概率。\n3. 数值结果表明，该方法在每资源态光子数不增的条件下可改善基于渗流的方案损耗容限，为以高维资源态支撑可扩展 qubit 线性光学量子计算提供了可行思路。", "summary_source": "deepseek", "authors": [{"name": "Tomohiro Yamazaki"}], "featured_authors": [{"name": "Tomohiro Yamazaki"}], "author_count": 1}, {"id": "2610.03438", "category": "quant-ph", "title": "An exact semidefinite characterization of the stoquasticity cone of permutationally invariant Bell operators", "abstract": "Bell correlations have been detected in atomic ensembles ranging from hundreds to hundreds of thousands of particles, witnessed by the permutationally invariant (PI) Bell operators. For all the operators realized so far, the maximally violating state can be brought, in a suitable basis, into a nonnegative-amplitude form. In that basis, the Bell operator is stoquastic. The coefficients parametrising these operators that at the same time lead to stoquasticity form a convex cone, the so-called stoquasticity cone. Its characterization had remained open beyond two-body operators, as for many-body operators the number of inequalities grows with the system size $n$. In this work we show that, in the thermodynamic limit, the stoquasticity cone admits an exact semidefinite characterization, valid at any operator order. The key observation is that, along each off-diagonal, the matrix elements are the values of a single univariate polynomial. Being univariate, this condition is equivalent to a linear matrix inequality, with no relaxation hierarchy. Therefore, deciding stoquasticity becomes a single semidefinite feasibility problem. As its lowest-degree instances, this description recovers the known three-hyperplane characterization for two-body operators and yields, for three-body operators, a curved boundary.", "url": "https://arxiv.org/abs/2610.03438", "type": "理论", "summary": "1. 该工作证明置换不变Bell算符的stoquasticity锥在热力学极限下具有精确半正定刻画，且适用于任意算符阶数。\n2. 其关键在于每条非对角线上矩阵元是同一单变量多项式的取值，故条件等价于线性矩阵不等式，无需松弛层级。\n3. 作为最低阶情形，它重现二体算符的三超平面刻画并给出三体弯曲边界，为高阶Bell算符分析提供精确基准。", "summary_source": "deepseek", "authors": [{"name": "Jan Li"}, {"name": "Owidiusz Makuta"}, {"name": "Evert van Nieuwenburg"}, {"name": "Jordi Tura"}], "featured_authors": [{"name": "Jan Li"}, {"name": "Owidiusz Makuta"}, {"name": "Evert van Nieuwenburg"}, {"name": "Jordi Tura"}], "author_count": 4}, {"id": "2610.03446", "category": "quant-ph", "title": "Geometric Aspects of Entanglement", "abstract": "Quantum entanglement is a fundamental resource in quantum information theory, yet its general characterization and quantification remain challenging, especially in multipartite systems. In this work we investigate entanglement from a geometric perspective, focusing on the Riemannian structure induced by the Fubini--Study metric on the projective Hilbert space of multi-qubit quantum states. By exploiting the local-unitary invariance of this metric, we derive the entanglement distance (ED), a geometric measure that quantifies entanglement as an obstruction to locally minimizing the sum of squared Fubini--Study distances generated by local operations. We analyze the properties of ED for pure multi-qubit states and discuss its behavior under local operations and classical communication. In particular, we show that ED reproduces established entanglement measures in well-defined and restricted settings. For pure states of two qubits, ED reduces to an exact monotone function of the concurrence and, independently, to an explicit monotone function of the entropy of entanglement. These results provide a clear geometric interpretation of standard bipartite entanglement measures within the present framework, while highlighting the limitations of such correspondences beyond the two-qubit case.", "url": "https://arxiv.org/abs/2610.03446", "type": "理论", "summary": "1. 该工作从Fubini-Study度规诱导的射影Hilbert空间黎曼结构出发，研究多量子比特纯态的纠缠几何刻画。\n2. 利用局部酉不变性定义纠缠距离ED，将纠缠视为局部操作无法最小化平方FS距离和的几何障碍，并考察LOCC行为。\n3. ED在双比特纯态下等价于并发度及纠缠熵的单调函数，为二分度量提供几何解释，也揭示多体推广的局限。", "summary_source": "deepseek", "authors": [{"name": "Lucio De Simone"}, {"name": "Lorenzo Capra"}, {"name": "Arthur Vesperini"}, {"name": "Leonardo Rossi"}, {"name": "Loris Di Cairano"}, {"name": "Roberto Franzosi"}], "featured_authors": [{"name": "Lucio De Simone"}, {"name": "Lorenzo Capra"}, {"name": "Arthur Vesperini"}, {"name": "Leonardo Rossi"}, {"name": "Loris Di Cairano"}, {"name": "Roberto Franzosi"}], "author_count": 6}, {"id": "2610.03463", "category": "quant-ph", "title": "Generalization of Transformer-Based Neural Quantum States via In-Context Learning", "abstract": "Neural quantum states based on modern deep learning architectures have emerged as powerful representations for quantum many-body systems. In particular, Transformer-based neural quantum states provide expressive models capable of capturing long-range correlations, and their empirical generalization performance has recently been demonstrated. However, a theoretical understanding of their generalization behavior remains largely unexplored. In this paper, we develop a theoretical framework to analyze the generalization properties of Transformer-based neural quantum states under in-context learning. We establish a rigorous inference-time generalization error bound in terms of mean squared error (MSE), showing that the pointwise prediction error decreases inversely with both the number of in-context examples and the depth of the Transformer. We further show that the Transformer depth required to achieve this guarantee scales only linearly with the system size--namely, the number of particles in continuous systems or the number of qudits in discrete systems. Building on this result, we extend our analysis to full quantum states formulated as rank-one density operators, and derive MSE-based generalization bounds over both continuous and discrete domains under physical constraints. Finally, numerical simulations corroborate our theoretical analysis.", "url": "https://arxiv.org/abs/2610.03463", "type": "理论+数值", "summary": "1. 该工作提出理论框架，分析Transformer神经量子态在上下文学习中的泛化行为，并导出严格的均方误差泛化界。\n2. 其卖点是证明逐点预测误差随上下文示例数与Transformer深度反比下降，且所需深度仅随系统尺度线性增长。\n3. 该结果将分析推广至受物理约束的秩一密度算符全量子态，为深度设计与大尺度扩展提供可证明依据。", "summary_source": "deepseek", "authors": [{"name": "Zhen Qin"}, {"name": "Qing Qu"}, {"name": "Alfred O. Hero III"}], "featured_authors": [{"name": "Zhen Qin"}, {"name": "Qing Qu"}, {"name": "Alfred O. Hero III"}], "author_count": 3}, {"id": "2610.03528", "category": "quant-ph", "title": "Breaking the chain: geometry-native state preparation with ASPIRE", "abstract": "Loading data into quantum computers is a key bottleneck that threatens end-to-end quantum advantage. Quantum-circuit compilers for structured states like matrix product states (MPS) are a critical enabler to manage this in quantum chemistry, finance, and many-body quantum simulation. Approximate preparation of MPS typically relies on layered sequential staircases of nearest-neighbour gates. We present Adaptive State Preparation by Iterative Removal of Entanglement (ASPIRE), an algorithm that approximately compiles state-preparation circuits by selecting gates based on the state's underlying entanglement geometry and the available connectivity of the target quantum processor. Our protocol scores candidate qubit pairs on the removability of their entanglement and identifies layers of parallelised long-ranged gates that remove the most entanglement. We demonstrate our protocol empirically across a range of settings, illustrating its success for preparing Hamiltonian ground states and multivariate amplitude-encoded functions, and accounting for qubit connectivity, hardware noise, and both NISQ and early fault-tolerant settings. Throughout, ASPIRE typically achieves higher fidelities and shallower circuits than existing methods for states with long-ranged entanglement, even when classical optimisation is accounted for. Our investigation positions ASPIRE as a competitive, resource-frugal state-preparation protocol, with particular promise for applications tolerant to imperfect fidelity such as preparation of guide states for quantum phase estimation.", "url": "https://arxiv.org/abs/2610.03528", "type": "理论+数值", "summary": "1. 提出 ASPIRE 算法，依据态的内禀纠缠几何与处理器连通性，通过迭代去除纠缠来自适应编译近似态制备线路。\n2. 其核心是给候选量子比特对按纠缠可去除性打分，并筛选出能最大程度去除纠缠的并行长程门分层，兼顾噪声与 NISQ/早期容错约束。\n3. 对长程纠缠态通常获得更高保真度与更浅线路，有望作为资源节约型制备方案，用于量子相位估计的引导态等可容忍不完美保真度的任务。", "summary_source": "deepseek", "authors": [{"name": "Fredrik Hasselgren"}, {"name": "Matthew L. Sims-Goh"}], "featured_authors": [{"name": "Fredrik Hasselgren"}, {"name": "Matthew L. Sims-Goh"}], "author_count": 2}, {"id": "2610.03557", "category": "quant-ph", "title": "A graph-theoretic analysis of non-generic free-fermion solvability by Krylov decompositions", "abstract": "Exactly solvable models are often identified from structural features of their interactions. For quantum spin Hamiltonians, these are captured by the frustration graph of anticommuting Pauli terms. The frustration graph characterizes broad families of spin models that map to free fermions for arbitrary, or generic, values of their coupling strengths. Nevertheless, there exist non-generically solvable models that admit free-fermion solutions only at finely tuned couplings. In this work, we characterize a family of such models in terms of graph structures. Given an arbitrary instance of Fendley's free-fermions-in-disguise (FFD) chain, we construct a set of operators, called Krylov currents, that are exactly quadratic in its effective fermionic modes and thus extend it to a linear family of free-fermion solvable Hamiltonians. As the Krylov currents are nonlinear in the FFD Hamiltonian terms, the elements of this generated family are non-generically solvable, and they accordingly fail the known conditions for generic solvability. We prove that every Krylov current admits an expansion in terms of induced paths of the frustration graph and that they generate the full special-orthogonal algebra of Gaussian transformations. Our results identify path support as a signature of non-generic solvability, and they provide a systematic route to finding exactly solvable many-body Hamiltonians.", "url": "https://arxiv.org/abs/2610.03557", "type": "理论", "summary": "1. 该工作针对芬德利自由费米子伪装链，构造称为克雷洛夫流的算符，把单个实例扩展为一族自由费米子可解哈密顿量，并从阻挫图结构刻画这类非泛型自由费米子可解模型。\n2. 其要点是：克雷洛夫流在有效费米子模式下严格二次，但在原自旋哈密顿量项中非线性，因而生成族不满足已知的泛型可解条件；作者证明每个克雷洛夫流可按阻挫图的诱导路径展开，并能生成高斯变换的完整特殊正交李代数。\n3. 这表明阻挫图中的诱导路径支撑可作为非泛型自由费米子可解性的图论特征，并为系统搜索精确可解多体模型提供构造性路线。", "summary_source": "deepseek", "authors": [{"name": "Jannis Ruh"}, {"name": "Samuel J. Elman"}, {"name": "Adrian Chapman"}], "featured_authors": [{"name": "Jannis Ruh"}, {"name": "Samuel J. Elman"}, {"name": "Adrian Chapman"}], "author_count": 3}, {"id": "2610.03566", "category": "quant-ph", "title": "Gibbs state preparation through quantum decoding", "abstract": "We propose a Gibbs state preparation algorithm that exploits algebraic structure in the Hamiltonian. Our starting point is Hamiltonian Decoded Quantum Interferometry (HDQI), a recent algorithm that reduces Gibbs state preparation for Pauli Hamiltonians to decoding error-correcting codes. We introduce quantum decoding HDQI (QD-HDQI), replacing HDQI's coherent classical decoder by a quantum decoder that can exploit interference between different errors. For commuting Pauli Hamiltonians, our reduction is efficient and the associated quantum decoding problem corresponds to transmitting the associated symplectic code over i.i.d. pure-state classical-quantum channels. For uniformly random Hamiltonian signs, the vanishing-error threshold of an efficient decoder directly determines the lowest temperature that our algorithm can reach. Even using only classical decoders, this improves upon HDQI's achievable inverse temperature from linear to square-root in the correctable error fraction; quantum decoders can improve further by tolerating still stronger noise. A similar picture extends to the noncommuting regime previously handled by HDQI, where now the noise is correlated within small, independent blocks. We study two such quantum decoders in our QD-HDQI Gibbs sampling framework. The first, based on unambiguous state discrimination, works efficiently for arbitrary binary linear codes. However, we \"dequantize\" this strategy for commuting Hamiltonians, contributing a classical rejection sampler that matches its temperature threshold. The second is belief propagation with quantum messages (BPQM), a quantum generalization of classical belief propagation. We show that for certain dilute spin glasses, BPQM's decoding threshold exceeds the Shannon limit for classical decoding, reaching temperatures inaccessible to any classical decoder within our framework.", "url": "https://arxiv.org/abs/2610.03566", "type": "理论+数值", "summary": "1. 我们提出了一种利用哈密顿量中的代数结构的吉布斯状态准备算法。\n2. 类似的情况也适用于之前由 HDQI 处理的非通勤机制，现在噪声在小的独立块内相关。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Christophe Piveteau"}, {"name": "Yihui Quek"}, {"name": "M. Isabel Franco Garrido"}], "featured_authors": [{"name": "Christophe Piveteau"}, {"name": "Yihui Quek"}, {"name": "M. Isabel Franco Garrido"}], "author_count": 3}, {"id": "2610.03578", "category": "quant-ph", "title": "Rapid mixing of Gibbs samplers via quantum Dobrushin--Shlosman conditions", "abstract": "Classical Dobrushin--Shlosman theory uses heat-bath block updates to identify sharp temperature thresholds for establishing the rapid mixing of Gibbs samplers. In particular, these mixing guarantees often hold even when stricter single-site conditions fail. We extend this approach to noncommuting quantum lattice systems through a quantum Dobrushin--Shlosman condition for finite-block dynamics, which we call smoothed heat-bath dynamics. We establish this condition in two regimes. For finite-range quantum spin chains at every fixed finite temperature, we prove logarithmic trace-norm mixing in system size, with normalized bounds uniform in on-site fields and single exponential in inverse temperature. We also prove stability under small local perturbations of interacting, possibly noncommuting reference Hamiltonians on graphs of polynomial volume growth. For classical references with bounded local interactions, uniform strong spatial mixing implies our quantum condition. With bounded local terms and fixed physical, geometric and block parameters, the resulting samplers prepare Gibbs states to trace-norm error $\\varepsilon$ using $N\\operatorname{polylog}(N/\\varepsilon)$ gates and classical operations. Our block updates combine a local Gibbs reset with quantum belief propagation to incorporate interactions across the block boundary, yielding exactly Gibbs-preserving, KMS-reversible channels. Two independently tunable parameters control contraction: an internal evolution time suppresses the influence of sites inside a block, while the block size allows interior contraction to dominate boundary influence. This finite-time relaxation has no counterpart in a classical heat-bath block update.", "url": "https://arxiv.org/abs/2610.03578", "type": "理论", "summary": "1. 该工作将经典 Dobrushin--Shlosman 热浴块更新判据推广到非对易量子格点系统，提出有限块量子 DS 条件与平滑热浴动力学，以证明 Gibbs 采样器快速混合。\n2. 其卖点是用局部 Gibbs 重置加量子信念传播构造严格保 Gibbs、KMS 可逆的块通道，以内部演化时间和块尺寸独立控制收缩，从而在有限温量子自旋链上给出迹范数对数混合、对局域场一致且对逆温度单指数，并在多项式体积增长图上证明小局域扰动稳定性及 N polylog(N/ε) 门复杂度，且其有限时间弛豫在经典热浴块更新中无对应。\n3. 这为有限温度量子 Gibbs 态的可证高效制备提供通用判据，并启示经典强空间混合可推出量子条件，连接经典与量子采样复杂度。", "summary_source": "deepseek", "authors": [{"name": "Cambyse Rouzé"}, {"name": "Daniel Stilck França"}], "featured_authors": [{"name": "Cambyse Rouzé"}, {"name": "Daniel Stilck França"}], "author_count": 2}, {"id": "2610.03581", "category": "quant-ph", "title": "Quantum algorithms for orthogonal polynomial transforms", "abstract": "A quantum orthogonal polynomial transform (QOPT) is an algorithmic primitive that maps a superposition of standard basis states $\\sum_k \\alpha_{k} \\ket{k}$ coherently to a basis of normalized univariate polynomials orthogonal with respect to a probability measure $\\mu(x)$. We provide new discrete and continuous QOPTs for polynomial families in the Askey scheme extending the results for the quantum Hermite transform (Jain et al., STOC'26). Our efficient QOPT algorithms require time $O(\\text{polylog}(N, 1/\\epsilon))$, where $N$ is the grid size and $\\epsilon$ is the error, for the discrete Charlier, Meixner and Krawtchouk transforms and for the integer-order Laguerre transform in the continuous setting. The efficient QOPTs are obtained by uncovering the links between Askey scheme polynomials and Gaussian quantum optical gates and developing a compilation framework for $SU(2)$ and $SU(1,1)$ optical gates on Cartesian grids extending the framework developed by Iyer et al. ( arXiv:2602.15180 ). Further, we reduce the continuous Jacobi transform to the discrete Hahn transform and provide an $O\\!\\left(N\\operatorname{polylog}((N+\\alpha+\\beta+1)/\\epsilon)\\right)$-time Hahn transform, a quadratic speedup over the naive implementation. This is based on a more efficient compilation of the Clebsch--Gordan transform for coupling $\\mathrm{SU}(2)$ representations with spins $(j_{1}, j_{2})$. Finally, we develop a new framework for Laguerre transforms for all orders $\\nu>0$ by fast-forwarding the corresponding radial oscillator using a 3-term chirp decomposition and an efficient algorithm for the Quantum Hankel Transform on a logarithmic grid.", "url": "https://arxiv.org/abs/2610.03581", "type": "数值", "summary": "1. 该工作为 Askey 方案构造离散与连续量子正交多项式变换（QOPT），将标准基叠加相干映射到相应正交多项式基。\n2. 其技术核心是发现 Askey 多项式与高斯量子光学门的联系，并编译 SU(2)/SU(1,1) 门，使多类变换达 O(polylog(N,1/ε))。\n3. 该框架将连续 Jacobi 归约到离散 Hahn 并获二次加速，这为全阶 Laguerre、量子 Hankel 变换及后续光学门编译提供可扩展路线。", "summary_source": "deepseek", "authors": [{"name": "Anupam Prakash"}, {"name": "Shree Hari Sureshbabu"}, {"name": "Dylan Herman"}, {"name": "Shouvanik Chakrabarti"}], "featured_authors": [{"name": "Anupam Prakash"}, {"name": "Shree Hari Sureshbabu"}, {"name": "Dylan Herman"}, {"name": "Shouvanik Chakrabarti"}], "author_count": 4}, {"id": "2610.03584", "category": "quant-ph", "title": "A Complete Proof of $\\mathsf{QMA}_1$-Hardness for Weighted Gapped Clique Homology", "abstract": "The computational complexity of simplicial homology has been studied since the question was raised by Kaibel and Pfetsch, and clique homology was later shown to be $\\mathsf{QMA}_1$-hard by Crichigno and Kohler. King and Kohler subsequently introduced the weighted, spectrally gapped version considered here and developed a reduction intended to establish the same hardness result in this setting. We give a complete proof of the hard direction. The earlier King-Kohler argument contains a gap in the analysis of the nontrivially folded local gadgets, so the required topological and spectral properties have to be re-established on the clique complexes actually produced by the reduction. This is not a local repair of the published proof: the argument requires a new analysis of the local topology, the filtered cochain complexes, and the interaction of many overlapping gadgets. Our proof uses exact finite certificates for the local combinatorial data and relative homology to determine the effect of each gadget on the encoded qubit space. We then prove the finite-dimensional filtered-Hodge statement needed to recover the corresponding rank-one low-energy penalty and derive a quantitative global estimate that transfers the source-Hamiltonian promise gap to the final weighted Hodge Laplacian. Consequently, for fixed efficiently computable $k(n)$ and inverse-polynomial $\\gamma(n)$, weighted gapped clique homology is $\\mathsf{QMA}_1(\\mathcal G)$-hard. The previously known $\\mathsf{QMA}$-containment argument is logically independent of the gap and remains unaffected.", "url": "https://arxiv.org/abs/2610.03584", "type": "理论", "summary": "1. 该工作完整证明了加权带隙团同调的QMA1困难性，补上了King-Kohler归约硬方向证明中的缺口。\n2. 其关键在于不局部修补原证明，而是重新建立折叠局部小片、过滤上链复形及大量小片重叠相互作用的分析，用精确有限证书与相对同调确定各小片对编码量子比特空间的作用，并证明有限维过滤Hodge命题以恢复秩一低能惩罚，再给出定量全局估计将源哈密顿量的promise gap传递至最终加权Hodge拉普拉斯。\n3. 由此，对固定可高效计算的k(n)与反多项式γ(n)，加权带隙团同调为QMA1(G)-困难；已知的QMA包含性论证不依赖于该带隙，故不受影响。", "summary_source": "deepseek", "authors": [{"name": "Tal Barak"}], "featured_authors": [{"name": "Tal Barak"}], "author_count": 1}, {"id": "2610.03593", "category": "quant-ph", "title": "Quantum Fire with Delegated Cloning", "abstract": "Quantum fire is a recently introduced cryptographic primitive consisting of efficiently preparable quantum states, called \\emph{flames}, that admit efficient cloning but resist efficient telegraphing, namely reconstruction via classical communication without preshared entanglement. In all prior constructions of quantum fire, cloning is a public operation that requires no separate key and every holder of a flame state can clone it. For applications to access control, however, an issuer may wish to delegate cloning to designated quantum servers while withholding this capability from other flame holders. To address this, we introduce \\emph{delegatable quantum fire}, in which cloning requires a separate key. We give two constructions in the classical-oracle model. Our first construction uses a classical secret key which enables cloning, and any user with the entire key may clone successfully. Our second construction, which we call \\emph{torch-fire}, uses quantum cloning keys, called \\emph{torches}, which enable cloning while remaining unaffected in the process but cannot otherwise be split or delegated to enable additional cloning. An efficient adversary given $m$ torches cannot, except with negligible probability, enable more than $m$ noncommunicating parties to each clone a fresh, independently issued challenge flame. The adversary may jointly process its resources before separating the parties and distribute arbitrarily entangled registers among them. Both constructions are in the oracle model, relying on public classical oracles that allow queries in quantum superposition.", "url": "https://arxiv.org/abs/2610.03593", "type": "理论", "summary": "1. 该文提出可委托量子火，并在经典预言机模型中给出两种需独立密钥才能克隆的构造：一种依赖经典秘密密钥，另一种依赖称为火炬的量子克隆密钥。\n2. 其核心卖点是火炬型构造：量子克隆密钥在克隆过程中保持不变且不可拆分或委托，并证明持有m个火炬的敌手至多能让m个不通信方各自克隆一份新挑战火焰，即便敌手可先联合处理资源并分配任意纠缠。\n3. 这为量子火的访问控制提供了可委托克隆的安全模型与实现路径，并启发在预言机模型中设计密钥化量子克隆与抗经典通信重构协议。", "summary_source": "deepseek", "authors": [{"name": "Rohit Chatterjee"}, {"name": "Ananta Mukherjee"}, {"name": "Vir Pathak"}, {"name": "Supartha Podder"}], "featured_authors": [{"name": "Rohit Chatterjee"}, {"name": "Ananta Mukherjee"}, {"name": "Vir Pathak"}, {"name": "Supartha Podder"}], "author_count": 4}, {"id": "2610.03594", "category": "quant-ph", "title": "Fault-tolerant and fully addressable unitary logical gates via round-robin sparsification", "abstract": "For quantum low-density parity check (qLDPC) codes, the ability to manipulate individual logical units of information, i.e. the use of addressable gates, enables maximal utility of their efficient encoding. We introduce explicit low-depth unitary circuits that realize fully addressable and fault-tolerant two-qubit Clifford gates for a subset of two-dimensional translationally invariant qLDPC codes. Our transversal unitaries are created by applying a geometrically structured sparsification procedure to round-robin circuits. We verify the general applicability of our protocol by proposing and numerically simulating a range of addressable CZs between toric, cyclic hypergraph-product, color, gross, and directional codes, demonstrating fault-tolerant memory-like logical error rate scaling.", "url": "https://arxiv.org/abs/2610.03594", "type": "理论+数值", "summary": "1. 该工作面向二维平移不变量子低密度奇偶校验码，显式构造了一类低深度酉电路，用以实现可完全寻址且容错的两比特克利福德逻辑门。\n2. 其关键机制是将轮转电路经几何结构化的稀疏化处理，生成横向酉门，从而在保持低深度与平移不变性的同时兼顾完全寻址性和容错性。\n3. 通过在环面码、循环超图乘积码、色码、Gross码及方向码之间提出并数值模拟可寻址CZ门，作者展示了记忆式逻辑错误率标度，表明该协议对多类qLDPC码具有可推广性。", "summary_source": "deepseek", "authors": [{"name": "Kaavya Sahay"}, {"name": "Cody Jones"}], "featured_authors": [{"name": "Kaavya Sahay"}, {"name": "Cody Jones"}], "author_count": 2}, {"id": "2610.03595", "category": "quant-ph", "title": "The exact LCU sampling overhead of collective diagonal unitaries: resonances and a continued-fraction dichotomy", "abstract": "We consider the cost of implementing the quadratic collective phase $e^{-i\\gamma K^2}$, with $K$ a collective observable of evenly spaced spectrum, such as the permutation-symmetric Hamming weight. This gate is the cardinality-penalty layer of constrained quantum optimization, the one-axis-twisting gate of spin squeezing and the Kerr phase of a bosonic mode. Instead of two-qubit gates, it can be sampled as a linear combination of single-qubit rotation layers (an LCU) at an overhead $\\Gamma$. We determine the minimal overhead. Ancilla-free sampling of the layers reproduces the target's outcome probabilities up to this factor, and no smaller factor works for every input; when $K$ is permutation symmetric, arbitrary single-qubit gates do no better. The minimal overhead's growth with the register size $n$ is set by the continued fraction of $\\gamma/\\pi$: rational angles $\\pi p/q$ in lowest terms cost exactly $\\Gamma=q$ for every $n\\ge2q-2$; the cost is $\\Theta(n)$ if and only if $\\gamma/\\pi$ is badly approximable; and a master formula, proved two-sided near low-denominator rationals, reads it off the nearest one. Without the symmetry the cost over single-qubit gates can be exponential: for the binary-weighted $K=\\sum_j2^jx_j$ the squaring phase of Fourier arithmetic on $m$ qubits costs at least $2^{0.557m-O(1)}$, beyond the $2^{m/2}$ ceiling of every cut bound, by a new certificate-lifting argument. The Fourier-based LCU of Carrera Vazquez, Egger and Woerner (2026), which guarantees $\\Gamma\\le n+1$, is optimal up to a constant factor at typical angles at fixed $n$; at rational angles the unique optimizer is the fractional-revival decomposition of Kerr optics, a recipe independent of $n$. In bosonic simulation, the Kerr-gate phase-shifter decomposition of Upreti, Quesada and Chabaud (2026) is the unique optimum over phase shifters, and a finite-cost one exists only at rational $\\gamma/\\pi$.", "url": "https://arxiv.org/abs/2610.03595", "type": "理论+数值", "summary": "1. 我们考虑实现二次集体相位 $e^{-i\\gamma K^2}$ 的成本，其中 $K$ 是均匀间隔频谱的集体可观测量，例如排列对称汉明权重。\n2. 如果没有对称性，单量子位门上的成本可能是指数级的：对于二进制加权 $K=\\sum_j2^jx_j$ ，$m$ 量子位上傅立叶算术的平方阶段成本至少为 $2^{0.557m-O(1)}$，超出了每个切割边界的 $2^{m/2}$ 上限（通过新的证书提升参数）。\n3. Carrera Vazquez、Egger 和 Woerner (2026) 的基于傅立叶的 LCU 保证 $\\Gamma\\le n+1$，在固定 $n$ 的典型角度下达到恒定因子是最佳的；在有理角度，独特的优化器是克尔光学的分数复兴分解，这是一个独立于 $n$ 的配方。", "summary_source": "local-fallback", "authors": [{"name": "Zhihui Wang"}, {"name": "Sujit Roy"}, {"name": "Manil Maskey"}, {"name": "Rahul Ramachandran"}], "featured_authors": [{"name": "Zhihui Wang"}, {"name": "Sujit Roy"}, {"name": "Manil Maskey"}, {"name": "Rahul Ramachandran"}], "author_count": 4}, {"id": "2610.03609", "category": "quant-ph", "title": "The QICK Box: A Modular RF Front-End System for Quantum Control and Readout", "abstract": "The QICK (Quantum Instrumentation Control Kit), first introduced in 2022, is a standalone open source control system for quantum information science. Since then, QICK has been migrated to new hardware platforms, expanded its functionality for applications with different types of qubits (superconducting, atomic, ion-trapped, and spin defects), as well as quantum sensors, and quantum networks. QICK is a highly optimized control kit, with a library of functions that can be used for more than one application. In particular, the software and firmware are customized to minimize latency and maximize control performance and throughput. In this white paper, we describe hardware details and performance of the QICK Box. The QICK Box features up to 16 outputs, up to 8 inputs, and 8 20-bit DC biases. Modular output and input daughtercards give the choice of signal chains optimized for fast DC-coupled signals or RF signals up to 10 GHz. Power levels, step attenuation, and bandpass filtering are controlled by software. We demonstrate the system's performance through single-shot readout measurements of a six-transmon device at the Quantum Underground Instrumentation Experimental Testbed (QUIET) at Fermilab, achieving (91.7 +/- 0.4)% readout fidelity limited by T1 decay during the readout. The single shot readout signal-to-noise ratio (SNR) is 4.4 +/- 0.1 without a quantum amplifier, confirming that the QICK Box is suitable for high-fidelity quantum control and measurement applications. Advances in firmware and software will be described in a separate paper.", "url": "https://arxiv.org/abs/2610.03609", "type": "实验", "summary": "1. 该白皮书介绍了QICK Box模块化射频前端量子控制与读出系统的硬件细节与实测性能。\n2. 卖点是最多16路输出、8路输入与8路20位直流偏置，可换子卡覆盖DC耦合至10 GHz，衰减与滤波由软件控制。\n3. 在Fermilab QUIET对六transmon器件测得91.7±0.4%单发读出保真度，受读出期间T1衰减限制，无量子放大器时SNR为4.4。", "summary_source": "deepseek", "authors": [{"name": "L. Arnaldi"}, {"name": "D. Martin"}, {"name": "S. Sussman"}, {"name": "S. Uemura"}, {"name": "K. Treptow"}, {"name": "N. Wilcer"}, {"name": "A. Colón Cesaní"}, {"name": "O. Seidel"}, {"name": "K. Anyang"}, {"name": "G. Bratrud"}, {"name": "F. Abouzahr"}, {"name": "J. Christiansen-Salameh"}, {"name": "D. Baxter"}, {"name": "G. Cancelo"}], "featured_authors": [{"name": "L. Arnaldi"}, {"name": "D. Martin"}, {"name": "S. Sussman"}, {"name": "J. Christiansen-Salameh"}, {"name": "D. Baxter"}, {"name": "G. Cancelo"}], "author_count": 14}, {"id": "2610.03630", "category": "quant-ph", "title": "Entanglement of purification for Werner states: canonical purification and nonadditivity", "abstract": "We prove that the von Neumann entanglement of purification is nonadditive. For two-qubit Werner states $W(f)$ with singlet weight $1/64\\le f\\le1/4$, we show that canonical purification is globally optimal: its entanglement, also known as reflected entropy, gives the exact entanglement of purification. In contrast, the regularized entanglement of purification lies strictly below the reflected entropy for $0<f<f_\\ast$, where $f_\\ast\\approx0.017$. Together, these results establish nonadditivity throughout $1/64\\le f<f_\\ast$. Our canonical-optimality proof generalizes the proof in [1], which established Rényi nonadditivity for $0\\le\\alpha<1$ using classical two-qubit states. We thus resolve the additivity question at $\\alpha=1$. Remarkably, nonadditivity is again witnessed by separable states and no entanglement in the underlying states is required.", "url": "https://arxiv.org/abs/2610.03630", "type": "理论", "summary": "1. 我们证明纯化的冯诺依曼纠缠是非加性的。\n2. 其卖点在于提炼出该问题中的关键机制、方法优势或可计算结构。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Zahra Baghali Khanian"}, {"name": "Amir-Reza Negari"}], "featured_authors": [{"name": "Zahra Baghali Khanian"}, {"name": "Amir-Reza Negari"}], "author_count": 2}, {"id": "2610.03637", "category": "quant-ph", "title": "Polynomial-Time Algorithms for Nuclear Tensor Norms and Multipartite Separability", "abstract": "We study a multilinear optimization problem for tensors with bounded Frobenius norm, where each of the $k$ local factors of dimension $d$ is chosen from a convex set. We give a deterministic algorithm running in time $d^{O(k)}$ for constant additive approximations. As applications, we obtain the first polynomial-time algorithms at constant accuracy for weak membership in the nuclear-norm unit ball of high-order tensors and for multipartite quantum separability in Frobenius norm. Our approach views tensor optimization as a cooperative multiprover game and combines this perspective with a recursive spectral compression procedure. We then show that related ideas admit a quantum implementation when the input state is given through copies, rather than an explicit classical description. In these settings we obtain an algorithm to solve Frobenius-norm separability testing using $\\text{poly}(k)$ copies and $\\text{poly}(k\\log d)$ time.", "url": "https://arxiv.org/abs/2610.03637", "type": "理论+数值", "summary": "1. 该工作研究有界弗罗贝尼乌斯范数下、k个d维局部因子取自凸集的张量多线性优化，给出时间d^{O(k)}的确定性常数加性近似算法。\n2. 其卖点是合作多证明者博弈加递归谱压缩，首次以多项式时间在常数精度下判定高阶张量核范数单位球弱隶属与弗罗贝尼乌斯范数多体可分离性。\n3. 该框架还可量子实现：量子态以副本给定时，用k的多项式个副本和关于k log d的多项式时间完成弗罗贝尼乌斯范数可分离性测试，为高效纠缠验证提供启示。", "summary_source": "deepseek", "authors": [{"name": "Martino Bernasconi"}, {"name": "Giulio Malavolta"}], "featured_authors": [{"name": "Martino Bernasconi"}, {"name": "Giulio Malavolta"}], "author_count": 2}, {"id": "2610.03645", "category": "quant-ph", "title": "Exponential quantum space advantage in random data streams", "abstract": "We show two unconditional quantum space advantages in the random-order streaming model. First, we show the Yamakawa--Zhandry Code Intersection problem admits exponential quantum advantage in the streaming model when its inputs are streamed in random order. This means quantum computers exhibit exponential space advantage even when simply receiving $(x,f(x))$ pairs for a uniformly random function $f$ in a uniformly random order. Our lower bound is shown using density-restoring partitions as in the work of Göös, Gur, Jain, and Li (STOC 2025) combined with a convex potential, similar to the work of Raz ( this http URL 2018) on parity learning and its generalization by Garg, Raz, and Tal (STOC 2018). Second, we use our framework to show quantum space advantage for the Optimal Polynomial Intersection (OPI) problem in certain regimes via a streaming version of the Decoded Quantum Interferometry algorithm (Nature 2025; arXiv:2510.10967 ). In particular, we show that for degree $d$ and $n$ evaluation points, attaining $1/2 + \\Omega(\\sqrt{d/n})$ fraction of satisfied OPI constraints via streaming requires $\\Omega(n)$ classical bits of memory but only $O(d\\log n)$ qubits. This yields provable quantum advantage in a \"low-rate\" regime when the number of evaluation points is much larger than the degree, with a space advantage that can be as large as exponential in certain parameter settings.", "url": "https://arxiv.org/abs/2610.03645", "type": "理论+数值", "summary": "1. 该工作证明在随机顺序流式模型中，Yamakawa-Zhandry码相交问题具有无条件的指数级量子空间优势，并在最优多项式相交问题的特定区间给出类似优势；前者仅接收均匀随机函数的(x,f(x))对。\n2. 其技术卖点在于用密度恢复划分结合凸势建立指数级量子空间下界，并借助解码量子干涉的流式版本，使OPI在满足1/2+Ω(√(d/n))约束时需Ω(n)经典比特却仅O(d log n)量子比特。\n3. 这确立了n远大于d的低速率区间内可证明的量子优势，并在特定参数下可达指数级，为随机数据流中的量子内存优势及后续算法与实验研究提供了明确启发。", "summary_source": "deepseek", "authors": [{"name": "Adam Bouland"}, {"name": "Matthew Ding"}, {"name": "Siddhartha Jain"}], "featured_authors": [{"name": "Adam Bouland"}, {"name": "Matthew Ding"}, {"name": "Siddhartha Jain"}], "author_count": 3}, {"id": "2610.03654", "category": "quant-ph", "title": "A Basis-Aware Approach to Quantum Sampling of the Fermi-Hubbard Ladder", "abstract": "Sample-based quantum diagonalization can reduce the classical cost of many-body calculations by restricting diagonalization to configurations identified through quantum sampling, but its efficiency depends on how compactly the target state is represented in the sampled basis. We investigate this dependence for sample-based Krylov quantum diagonalization of the half-filled Fermi-Hubbard ladder using physically motivated one-body orbital rotations. Across position, momentum, bonding/antibonding, and leg-mode representations, the most compressible basis varies systematically with interaction strength and hopping anisotropy, with momentum sampling favored in the weakly interacting regime and geometry- or interaction-adapted representations becoming advantageous as the dominant energy scale changes. Near intermediate interaction and isotropic hopping, however, even the most favorable representation remains poorly compressible. Statevector SKQD calculations further show that basis choice strongly affects sampling efficiency. Hardware calculations on systems containing up to 120 qubits retain qualitative signatures of this basis dependence while revealing increasing particle-number leakage and reconstruction sensitivity with system size. These results show that scalable sample-based diagonalization requires co-design of the sampled representation, quantum circuit, and classical reconstruction procedure.", "url": "https://arxiv.org/abs/2610.03654", "type": "理论+数值", "summary": "1. 该工作研究半填充费米-哈伯德梯子中基于量子采样的Krylov对角化，考察不同单体轨道旋转基对态压缩与采样效率的影响。\n2. 其关键发现是：最可压缩的基随相互作用强度与跳跃各向异性系统变化，弱耦合偏好动量采样，而中等相互作用和各向同性跳跃下即便最优表示仍难压缩；态矢量SKQD计算显示基选择强烈影响采样效率。\n3. 最多120量子比特的硬件结果保留基依赖的定性特征，却随规模出现粒子数泄漏与重构敏感性，表明可扩展采样对角化需协同设计采样表示、量子线路与经典重构。", "summary_source": "deepseek", "authors": [{"name": "Adam Leicester"}, {"name": "Zixu Wang"}, {"name": "Jack Mandell"}, {"name": "Yangyang Xu"}, {"name": "Osama Muhammad Raisuddin"}, {"name": "Haimeng Zhang"}, {"name": "Jian Shi"}], "featured_authors": [{"name": "Adam Leicester"}, {"name": "Zixu Wang"}, {"name": "Jack Mandell"}, {"name": "Osama Muhammad Raisuddin"}, {"name": "Haimeng Zhang"}, {"name": "Jian Shi"}], "author_count": 7}, {"id": "2610.03655", "category": "quant-ph", "title": "Breaking the cubic barrier for the inverse-free Solovay-Kitaev algorithm", "abstract": "The Solovay-Kitaev algorithm states that it is possible to efficiently compile unitaries to accuracy $\\epsilon$ in $\\text{polylog}(1/\\epsilon)$ time using any universal gate set. While Solovay and Kitaev's initial work addressed inverse-closed gate sets, recently Bouland and Giurgicǎ-Tiron showed it is possible to efficiently compile arbitrary gate sets without inverses. However, the exponent of their compilation algorithm is high. For example the inverse-free exponent for a qubit is over $8.62$, while information theoretically it is known that an inverse-free exponent of $3$ is possible in any dimension by a result of Oszmaniec, Sawicki, and Horodecki. This leads to a natural question: can one improve the exponent in Bouland and Giurgicǎ-Tiron's algorithm? And are there any cases where the inverse-free exponent is below 3, thus surpassing existing information-theoretic arguments? To answer this question, we first show that a special case of the inverse-free compiling problem -- namely Pauli gates supplemented by an irrational rotation of a qubit - admits a highly efficient compilation algorithm with an exponent at most $\\approx 2.138$. Our algorithm fuses ideas from prior algorithms of Kuperberg and Sardharwalla, Cubitt, Harrow and Linden to construct an efficient ``Pauli golf'' compilation routine. We then extend these ideas to the general inverse-free case for a qubit, where we give a compiling algorithm with exponent at most $2.988$. This result uses a novel form of approximate ``aiming'' of unitary corrections to improve the compilation efficiency. Our results give two examples of quantum compiling algorithms surpassing information-theoretic arguments, and demonstrate that there are many efficiency gains possible for inverse-free compilation.", "url": "https://arxiv.org/abs/2610.03655", "type": "理论+数值", "summary": "1. 该工作针对无逆 Solovay-Kitaev 编译，给出 Pauli 门加无理旋转指数≤2.138、量子比特一般情形指数≤2.988 的算法。\n2. 其卖点在于构造“Pauli golf”例程并以近似“瞄准”幺正修正降低指数，在两种情形突破立方壁垒。\n3. 该结果超越既有信息论论证，表明无逆编译效率仍有大量提升空间并启发更低指数算法。", "summary_source": "deepseek", "authors": [{"name": "Adam Bouland"}, {"name": "Victor Shyaka"}, {"name": "Chenyi Zhang"}], "featured_authors": [{"name": "Adam Bouland"}, {"name": "Victor Shyaka"}, {"name": "Chenyi Zhang"}], "author_count": 3}, {"id": "2610.03657", "category": "quant-ph", "title": "Super-Exponential Advantage of Squeezed Light in Phase Estimation under Discrete Phase Randomisation", "abstract": "A paradigmatic task in quantum metrology is that of phase estimation. For this task it is commonly believed, under reasonable assumptions about prior information, that a quadratic advantage in sensitivity is the maximum possible advantage offered by the use of quantum resources. In this work, we consider a channel that implements a phase shift by an angle $2\\pi k/M$, where $k$ is a uniformly random unknown integer, in addition to a small unknown phase shift of interest. We show that, subject to a constraint on the mean photon number per channel use, there is a super-exponential separation between the quantum Fisher information (QFI) attainable using a squeezed vacuum state and that attainable using coherent states. This advantage holds over any state obtained from a coherent state via phase covariant channels. Specifically, when the mean photon number per channel use is 1, the ratio of their QFI grows as $\\Omega[(M/\\sqrt{2}e)^M]$. For a mean photon number per channel use of $M/\\log(M)$, the squeezed vacuum QFI is $\\Omega(M^{3/2}/\\sqrt{\\log(M)})$, whereas for a coherent state it is at most $\\exp[-M\\log\\log(M)+O(M)]$. We complement this QFI analysis with non-asymptotic estimation results. For a mean photon number per channel use of $M/\\log M$, an explicit squeezed-vacuum protocol estimates the phase to accuracy $O(1/M)$ using $O(\\sqrt{M\\log M})$ channel uses, whereas every coherent state protocol requires at least $\\exp[M\\log\\log M-O(M)]$ channel uses. We consider the effects of noise and show that the ratio of their QFIs can still grow super-exponentially in $M$. Finally, under fixed optical loss and thermal noise, choosing $\\bar n=M^2/(\\log M)^{3/2}$ allows squeezed vacuum with heterodyne detection to achieve accuracy $O(1/M)$ using sub-polynomially many channel uses, whereas every protocol in the specified classical family requires super-polynomially many.", "url": "https://arxiv.org/abs/2610.03657", "type": "理论", "summary": "1. 该工作研究了在离散相位随机化（相位为 2πk/M，k 均匀随机未知）并叠加待估小相移的信道中，压缩真空与相干态在相位估计中的量子Fisher信息差异及非渐近估计性能。\n2. 其核心卖点是在每次信道使用平均光子数约束下，压缩真空相对相干态及相位协变信道所得态具有超指数分离：平均光子数为1时量子Fisher信息比按 Ω[(M/√2e)^M] 增长；平均光子数为 M/log M 时压缩真空为 Ω(M^{3/2}/√log M)，相干态至多为 exp[-M loglog M+O(M)]。\n3. 非渐近结果进一步表明，压缩真空协议以 O(√(M log M)) 次信道达到 O(1/M) 精度，而相干态协议至少需 exp[M loglog M−O(M)] 次；在固定损耗与热噪声下选择平均光子数 M^2/(log M)^{3/2} 并结合外差检测，可用亚多项式次数达到 O(1/M)，提示压缩光在随机相位计量中的鲁棒优势。", "summary_source": "deepseek", "authors": [{"name": "Lorcan O. Conlon"}, {"name": "V Vijendran"}, {"name": "Aritra Das"}, {"name": "Yu-Xin Wang"}, {"name": "Erfan Abbasgholinejad"}, {"name": "Anthony J. Brady"}, {"name": "Jacob Bringewatt"}, {"name": "Sean R. Muleady"}, {"name": "Syed M. Assad"}, {"name": "Alexey V. Gorshkov"}], "featured_authors": [{"name": "Lorcan O. Conlon"}, {"name": "V Vijendran"}, {"name": "Aritra Das"}, {"name": "Sean R. Muleady"}, {"name": "Syed M. Assad"}, {"name": "Alexey V. Gorshkov"}], "author_count": 10}, {"id": "2610.03658", "category": "quant-ph", "title": "A note on tomography of states with low stabilizer rank", "abstract": "In this note, we consider tomography of $n$-qubit quantum states $|\\psi \\rangle$ that are promised to have stabilizer rank $k$ i.e., admit a stabilizer decomposition of $|\\psi\\rangle = \\sum_{i=1}^k c_i |\\phi_i\\rangle$ where each $|\\phi_i\\rangle$ is a stabilizer state. We give a tomography protocol for such states up to trace distance $\\varepsilon > 0$ running in $\\textsf{poly}(n,2^k,1/\\varepsilon)$ time and thus can handle $k=O(\\log n)$ efficiently. This follows from first showing that the stabilizer extent $\\xi(|\\psi\\rangle)$, which is the minimal $\\ell_1$ norm over the coefficients $\\{c_i\\}$ of any stabilizer decomposition of $|\\psi\\rangle$, can be bounded as $\\xi(|\\psi\\rangle) \\leq 2^{O(k)}$ and improving upon the previous best bound of $k^{O(k)}$. The protocol is then obtained by utilizing a tomography protocol for states with bounded stabilizer extent.", "url": "https://arxiv.org/abs/2610.03658", "type": "理论", "summary": "1. 该工作研究了承诺稳定子秩为 k 的 n 量子比特态的层析问题，提出了达到迹距离 ε 的协议，其运行时间为 n、2^k 与 1/ε 的多项式，因而可高效处理 k=O(log n) 的情形。\n2. 其核心卖点是先证明稳定子延展度 ξ(|ψ⟩)（任意稳定子分解系数的最小 ℓ1 范数）满足 ξ≤2^{O(k)}，将先前 k^{O(k)} 的上界显著改进，再借助有界稳定子延展度层析协议完成构造。\n3. 这表明低稳定子秩态可在多项式时间内被高效层析，并为基于稳定子分解的量子态学习、经典模拟与资源理论研究提供了更紧边界和明确路径。", "summary_source": "deepseek", "authors": [{"name": "Arkopal Dutt"}], "featured_authors": [{"name": "Arkopal Dutt"}], "author_count": 1}, {"id": "2610.03659", "category": "quant-ph", "title": "Quantum Codeword Sensing", "abstract": "Consider the task of identifying an unknown classical codeword delivered to a register of quantum sensor qubits through a sequence of weak phase interactions that each encode one bit. Suppose that each received bit controls an identical $Z$-rotation of angle $\\theta$ applied to every sensor qubit; receivers may also use auxiliary qubits within a total qubit budget $Q$, with arbitrary control unitaries and entanglement among all qubits allowed during each reception step. When the total collected signal is weak ($Q\\theta \\rightarrow 0$), we establish that a sensor coupled to a persistent quantum memory can identify the original codeword more reliably than any receiver with the same $Q$ and $\\theta$ but only classical memory between received bits, even when bit flips occur during transmission. In particular, for a family of $[n,k]$ binary simplex codes with even $k$ and $n=2^k-1$, we achieve exact correction of up to $t\\leq(k-2)/4$ transmission errors by coupling the sensor register to a persistent quantum memory of the same size, using $Q = \\Theta((t+1)\\log n)$ and $\\theta=\\frac{2\\pi}{k\\sqrt{n+1}}$; for $t=o(\\sqrt k)$, every comparable receiver with only classical memory instead has average success probability (over uniformly chosen codewords) tending to zero. Furthermore, under independent bit flips of any fixed probability $p<1/16$, our receiver with persistent quantum memory achieves decoding error tending to zero as $n\\to\\infty$ using $Q=O(\\log n\\log\\log n)$ total qubits and the same $\\theta$. In contrast, every otherwise equivalent receiver with only classical memory has vanishing average success probability under the same stochastic error model.", "url": "https://arxiv.org/abs/2610.03659", "type": "理论", "summary": "1. 考虑通过一系列弱相相互作用（每个编码一个位）来识别传递到量子传感器量子位寄存器的未知经典码字的任务。\n2. 特别是，对于具有偶数 $k$ 和 $n=2^k-1$ 的一系列 $[n,k]$ 二进制单工码，我们通过将传感器寄存器耦合到相同大小的持久量子存储器，使用 $Q = \\Theta((t+1)\\log n)$ 和 $\\theta=\\frac{2\\pi}{k\\sqrt{n+1}}$ 实现高达 $t\\leq(k-2)/4$ 传输错误的精确校正；对于 $t=o(\\sqrt k)$，每个仅具有经典记忆的可比接收器的平均成功概率（在统一选择的码字上）趋于零。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "John Blue"}, {"name": "Zachary E. Chin"}, {"name": "Vlad S. Oros"}, {"name": "Isaac L. Chuang"}], "featured_authors": [{"name": "John Blue"}, {"name": "Zachary E. Chin"}, {"name": "Vlad S. Oros"}, {"name": "Isaac L. Chuang"}], "author_count": 4}, {"id": "2610.03661", "category": "quant-ph", "title": "Lie Algebraic Uncertainty Relations", "abstract": "Uncertainty relations express the fundamental incompatibility of quantum observables, yet optimal state-independent bounds are known analytically in only a few cases. Here we introduce a covariance-based formulation of quantum uncertainty that yields an infinite family of relations for both Hermitian observables and non-Hermitian operators. For operators forming a basis of a Lie algebra, we derive the optimal bound in closed form from the algebra and its representation, replacing optimization over quantum states with a direct algebraic calculation. Within each weight space, uncertainty takes a fixed value, turning the inequality into a conservation law. These results show how commutation relations and their realization on a quantum state jointly determine the minimum quantum uncertainty associated with incompatible operators. By connecting uncertainty to symmetry and representation theory, the framework offers a route to uncovering intrinsic limits on quantum information processing through its underlying Lie algebra.", "url": "https://arxiv.org/abs/2610.03661", "type": "理论+数值", "summary": "1. 该工作提出一种基于协方差的量子不确定性表述，为厄米与非厄米可观测量给出无限族不等式，并在算子构成李代数基时推导出闭式最优界。\n2. 其核心卖点是把对量子态的优化替换为李代数及其表示的直接代数计算，且同一权空间内不确定性取固定值，从而使不等式转化为守恒律。\n3. 该框架揭示交换关系及其表示共同决定不相容算子的最小量子不确定性，并为通过李代数寻找量子信息处理的内在极限提供路径。", "summary_source": "deepseek", "authors": [{"name": "Xiaoli Hu"}, {"name": "Naihuan Jing"}, {"name": "Jian Zhang"}, {"name": "Yunlong Xiao"}], "featured_authors": [{"name": "Xiaoli Hu"}, {"name": "Naihuan Jing"}, {"name": "Jian Zhang"}, {"name": "Yunlong Xiao"}], "author_count": 4}, {"id": "2610.03663", "category": "quant-ph", "title": "BARC codes: general polynomial framework for coherent-state superposition codes", "abstract": "We introduce an algebraic framework for constructing a new class of quantum error-correcting codes, bosonic algebraically-restricted constellation (BARC) codes. The code states are finite superpositions of coherent-state constellations constrained by symmetries of solution sets to multivariate complex polynomial systems. The constraints are associated with photon-gain and photon-loss errors, thereby imposing approximate Knill--Laflamme conditions for such errors. For equally-weighted constellation points, we derive upper bounds on the minimum geometric separation between points, indicating how noise-resilient the code is. In the single-mode case, we characterize degree-two polynomial solution sets using an orthogonal group symmetry to obtain explicit ellipsoidal and hexagonal BARC codes. We benchmark representative instances of these families against spherical and cubature codes using the entanglement fidelity with optimal recovery under pure-loss noise.", "url": "https://arxiv.org/abs/2610.03663", "type": "理论", "summary": "1. 该工作提出BARC码的代数框架：以多元复多项式解集对称性约束相干态星座叠加，构造玻色量子纠错码。\n2. 其卖点是将约束与光子增益/损耗误差关联以近似满足Knill-Laflamme条件，并给出等权星座点最小几何间隔上界。\n3. 单模下由正交群对称性得到椭球与六边形显式码，纯损耗噪声下与球面/求积码的纠缠保真度比较表明该框架可指导相干态叠加码设计。", "summary_source": "deepseek", "authors": [{"name": "Praneel Gore"}, {"name": "Davit Aghamalyan"}, {"name": "Varun Narasimhachar"}, {"name": "Andrew Tanggara"}], "featured_authors": [{"name": "Praneel Gore"}, {"name": "Davit Aghamalyan"}, {"name": "Varun Narasimhachar"}, {"name": "Andrew Tanggara"}], "author_count": 4}, {"id": "2610.03669", "category": "quant-ph", "title": "Optimal kernel functions for linear combination of Hamiltonian simulation", "abstract": "Linear combination of Hamiltonian simulation (LCHS) provides an asymptotically optimal framework for the quantum simulation of linear non-unitary dynamics. The LCHS approach approximately implements the Peano--Baker propagator through an integral representation determined by a kernel function. We establish an LCHS approximation theorem for a broadened class of admissible kernel functions, defined by natural complex-analytic conditions. In the standard time-independent block-encoding access model, we explicitly construct, for each target error $\\varepsilon$, the unique kernel function in this class minimizing the query-cost functional and show that the minimum of this functional has the asymptotic expansion $\\tfrac{2\\mathrm{e}}{\\pi}\\big(\\log\\frac{1}{\\varepsilon}-\\log\\log\\frac{1}{\\varepsilon}+o(1)\\big)$ as ${\\varepsilon\\downarrow0}$. The provably optimal leading coefficient $2\\mathrm{e}/\\pi$ improves by a factor of approximately 2.1 on the coefficient obtained empirically by Low and Somma through numerical minimization over their family of optimally scaling kernel functions. We construct a spectrally convergent quadrature with explicit bounds on operator error and linear combination of unitaries (LCU) subnormalization, proving that this asymptotic improvement persists after discretization into a finite linear combination of unitaries suitable for implementation. Our results are based on Hardy space theory and convex analysis.", "url": "https://arxiv.org/abs/2610.03669", "type": "理论+数值", "summary": "1. 该工作针对线性非幺正动力学的量子模拟，在LCHS框架下建立更广复解析容许核函数的逼近定理，并构造最小查询代价的唯一最优核。\n2. 其卖点是用Hardy空间与凸分析证明最优查询代价渐近为(2e/π)(log(1/ε)-loglog(1/ε)+o(1))，主导系数较Low-Somma经验值约优2.1倍。\n3. 该工作给出谱收敛求积及算子误差与LCU次归一化显式界，使该渐近优势在可实现的有限线性组合中保持，并为LCHS的查询复杂度提供可证明最优渐近基准。", "summary_source": "deepseek", "authors": [{"name": "Harriet Apel"}, {"name": "Bjorn K. Berntson"}], "featured_authors": [{"name": "Harriet Apel"}, {"name": "Bjorn K. Berntson"}], "author_count": 2}, {"id": "2610.03670", "category": "quant-ph", "title": "Classical Algorithms for Bipartite Quantum Max-Cut on Dense Expanders", "abstract": "Quantum Max-Cut is a well-studied local Hamiltonian problem for which the classical complexity of the bipartite case remains open. We give a polynomial-time classical randomized algorithm for the spin-$\\tfrac12$ antiferromagnetic Heisenberg model, equivalently Quantum Max-Cut, on dense balanced bipartite expanders. This class includes $G(n,n,p)$ with high probability for every fixed $p>0$. The algorithm estimates the ground energy and any ground state edge correlation to additive error $\\varepsilon$ in time polynomial in $n$ and $1/\\varepsilon$. We construct a Markov chain on perfect matchings of the complete bipartite graph, each matching representing a product of singlets, that converges to the ground state, and use the expansion of the graph to show that polynomially many steps and samples of this chain suffice.", "url": "https://arxiv.org/abs/2610.03670", "type": "理论+数值", "summary": "1. 量子最大割是一个经过充分研究的局部哈密顿问题，其二分情况的经典复杂性仍然是开放的。\n2. 其卖点在于提炼出该问题中的关键机制、方法优势或可计算结构。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Stuart Wayland"}, {"name": "Zackary Jorquera"}, {"name": "Alexandra Kolla"}], "featured_authors": [{"name": "Stuart Wayland"}, {"name": "Zackary Jorquera"}, {"name": "Alexandra Kolla"}], "author_count": 3}, {"id": "2610.03672", "category": "quant-ph", "title": "Ordering-Aware Theory of Trotter Error", "abstract": "Product formulas are a basic tool for simulating quantum many-body dynamics, but a fundamental degree of freedom in their application---the ordering of Hamiltonian terms---has remained largely unexplored. Here we systematically study such ordering effects, quantifying their impact on simulation accuracy and exploiting them to design more accurate product-formula simulations. We develop an efficiently computable, ordering-sensitive bound on the finite-step-size Trotter error for geometrically local Hamiltonians for arbitrarily high-order product formulas. For translation-invariant one-dimensional chains, our bounds are close to exact second-, fourth-, and sixth-order Trotter errors in small-system tests, while on large-scale systems they improve on previous higher-order analytical bounds by orders of magnitude. We further use the local structure of the error bounds and estimates to optimize ordering efficiently, reducing the long-chain problem to a minimum-mean-weight-cycle problem on a weighted de Bruijn graph. For random translation-invariant chains, sequential (staircase-like) orderings consistently outperform standard brickwall circuits; when circuit depth is restricted, the optimizer instead favors wave-like parallel-sequential orderings, which preserve much of the accuracy advantage over brickwall circuits. These results establish ordering as a useful degree of freedom for both understanding and improving product-formula simulation.", "url": "https://arxiv.org/abs/2610.03672", "type": "理论+数值", "summary": "1. 该工作系统研究了乘积公式中哈密顿量项排序对模拟精度的影响，并为几何局域哈密顿量构造了依赖于排序的有限步长Trotter误差上界。\n2. 该上界可高效计算且适用于任意高阶公式，在小系统中接近精确的二、四、六阶误差，在大系统中比既有高阶解析界改进了数个数量级。\n3. 将长链排序优化归结为加权de Bruijn图上的最小平均权回路问题，确立了排序作为理解与改进乘积公式模拟的有效自由度。", "summary_source": "deepseek", "authors": [{"name": "Zhenning Liu"}, {"name": "Zhi-Yuan Wei"}, {"name": "Michael Foss-Feig"}, {"name": "Alexey V. Gorshkov"}, {"name": "Andrew M. Childs"}], "featured_authors": [{"name": "Zhenning Liu"}, {"name": "Zhi-Yuan Wei"}, {"name": "Michael Foss-Feig"}, {"name": "Alexey V. Gorshkov"}, {"name": "Andrew M. Childs"}], "author_count": 5}, {"id": "2610.03673", "category": "quant-ph", "title": "Quantum Simulation on Riemannian Manifolds", "abstract": "We investigate algorithms for the quantum simulation of the Schrödinger equation on a Riemannian manifold, where the kinetic operator is defined by the Laplace--Beltrami operator corresponding to the metric. Our first algorithms are based on a global spectral method based on the identification of an efficient transform to the eigenbasis of the Laplace--Beltrami operator. We use this method to provide explicit, efficient, quantum simulation algorithms for the Riemannian Schrödinger equation on tori and spheres with their standard metrics, simplices with the Wright--Fisher metric, truncated positive orthants and their invertible affine images with the log-barrier Hessian metric, and $\\ell_p$ balls with a metric induced by the Duffy map. Our second algorithm is based on a coherent simulation of local spectral methods on multiple charts, and is in principle applicable to any compact manifold. We first analyze this algorithm in the continuum and derive conditions under which a polynomial spectral cutoff suffices. We also provide a discretization analysis of a polynomial spectral cutoff for tensor-products of constant-dimensional manifolds. Finally, we consider applications of these methods to optimization and physical simulation. For optimization, we provide results including a generalization and convergence analysis of Quantum Hamiltonian Descent for geodesically convex functions that leads to explicit algorithms on the sphere and simplex, and a Riemannian generalization of the Real-Space Adiabatic Algorithm. For physical simulation, we show that our algorithms can simulate certain spatially discretized field theories, including a variant of the nonlinear sigma model.", "url": "https://arxiv.org/abs/2610.03673", "type": "理论+数值", "summary": "1. 我们研究了黎曼流形上薛定谔方程的量子模拟算法，其中动力学算子由对应于度量的拉普拉斯-贝尔特拉米算子定义。\n2. 最后，我们考虑这些方法在优化和物理模拟中的应用。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Dylan Herman"}, {"name": "Jacob Watkins"}, {"name": "Guneykan Ozgul"}, {"name": "Jiayu Shen"}, {"name": "Brandon Augustino"}, {"name": "Junhyung Lyle Kim"}, {"name": "Shouvanik Chakrabarti"}], "featured_authors": [{"name": "Dylan Herman"}, {"name": "Jacob Watkins"}, {"name": "Guneykan Ozgul"}, {"name": "Brandon Augustino"}, {"name": "Junhyung Lyle Kim"}, {"name": "Shouvanik Chakrabarti"}], "author_count": 7}, {"id": "2610.03674", "category": "quant-ph", "title": "Efficient capacity-achieving entanglement generation with application to pure-loss Bosonic channels", "abstract": "While the ultimate limits on the rate of quantum communication over noisy channels are well-established, very few efficient coding schemes achieving these limits are known. This contrasts sharply with transmitting classical data over classical channels, where polar codes and low-density parity-check codes both efficiently achieve the classical capacity of any noisy channel. In this work we construct an efficient entanglement generation scheme which achieves the coherent information for a broad class of channels. For degradable channels in the class, which includes truncated versions of the pure loss Bosonic channel, the resulting scheme achieves the quantum capacity. The construction makes use of polar codes for two kinds of classical-input, quantum-output (CQ) channels: those with commuting outputs and those whose outputs are heralded mixtures of pure states. The former case is amenable to decoding by classical polar decoding algorithms, the latter by the belief propagation with quantum messages (BPQM) algorithm. To our knowledge, this construction is the first explicit and efficiently decodable protocol that achieves the energy-constrained quantum capacity of the pure-loss Bosonic channel.", "url": "https://arxiv.org/abs/2610.03674", "type": "理论+数值", "summary": "1. 该工作构建了一种高效纠缠生成方案，对一大类噪声信道达到相干信息量，并在包含截断纯损耗玻色信道的可退化信道上达到量子容量。\n2. 其核心是针对输出对易与输出为纯态预示混合的两类经典输入量子输出信道，分别借助极化码的经典译码算法与量子消息置信传播算法实现高效译码。\n3. 这是已知首个可显式构造并高效译码、达成纯损耗玻色信道能量约束量子容量的协议，为逼近量子通信容量极限的高效编码提供了明确范式。", "summary_source": "deepseek", "authors": [{"name": "Avijit Mandal"}, {"name": "Christophe Piveteau"}, {"name": "Henry D. Pfister"}, {"name": "Joseph M. Renes"}], "featured_authors": [{"name": "Avijit Mandal"}, {"name": "Christophe Piveteau"}, {"name": "Henry D. Pfister"}, {"name": "Joseph M. Renes"}], "author_count": 4}, {"id": "2610.03676", "category": "quant-ph", "title": "How I Learned to Stop Worrying and Love the Redfield Equation: Completely-Positive Resummation of Non-Markovian Dynamics", "abstract": "The Redfield equation with time-dependent coefficients (or TCL2 equation) gives one of the simplest perturbative descriptions of open quantum system dynamics derived from a microscopic theory. Its status as an approximation is nevertheless subtle: while perturbation theory fixes the reduced dynamics order-by-order in the system-environment coupling, solving the Redfield equation yields a particular resummation that need not preserve complete positivity. Here we compare Redfield evolution with an exponentiated (Magnus) resummation of the same second-order perturbative map, which is completely positive and trace preserving (CPTP) for a broad class of physical conditions. We also construct a simple CPTP resolvent resummation, illustrating the non-uniqueness of resummations of the same perturbative map. The Redfield and Magnus prescriptions agree to second order but differ through time-ordering corrections at higher orders. We exhibit a weak-coupling criterion which guarantees that Redfield evolution, even when non-Markovian, remains close to a CPTP map. We illustrate the criterion in two examples, focusing on finite-dimensional (qubit) systems. Our results clarify when, and why, Redfield evolution can remain reliable even when it is highly non-Lindbladian.", "url": "https://arxiv.org/abs/2610.03676", "type": "理论+数值", "summary": "1. 该工作比较含时系数Redfield方程（TCL2）与同一二阶微扰映射的指数化Magnus重求和，并构造保完全正定与保迹（CPTP）的resolvent重求和，指出同一微扰映射的重求和非唯一。\n2. 其卖点是：Redfield解对应特定重求和、一般不保CPTP，而Magnus/resolvent重求和在广泛条件下CPTP；两者二阶一致，高阶因时间排序修正而异，并给出弱耦合判据。\n3. 该判据说明非马尔可夫Redfield演化仍可接近CPTP映射，并在有限维量子比特例中展示，澄清了其即使高度非Lindblad型仍可靠的条件与原因。", "summary_source": "deepseek", "authors": [{"name": "Greg Kaplanek"}, {"name": "Jason Pollack"}], "featured_authors": [{"name": "Greg Kaplanek"}, {"name": "Jason Pollack"}], "author_count": 2}, {"id": "2610.03677", "category": "quant-ph", "title": "Exact Recovery for Non-Abelian Surface Codes", "abstract": "We study exact recovery for non-Abelian topological surface codes based on the quantum double $D(G)$ of any finite group $G$. We determine an orthogonal error basis, that is comprised of group multiplication and irreducible representation operators. Whenever the errors are supported on closed loops on the lattice or dual lattice, there is a redundancy in the basis, due to stabilizers. To remedy this, we introduce a gauge-fixing that results in a complete and orthogonal error basis on the code space. Assuming as input predetermined, neutral correctable error clusters, we construct charge and flux transfer circuits that move the errors onto ancillas that then get projected out. This is an exact and deterministic recovery protocol, applicable to surface codes for any finite, in particular non-Abelian, group $G$.", "url": "https://arxiv.org/abs/2610.03677", "type": "理论", "summary": "1. 该工作为任意有限群G的量子双D(G)非阿贝尔拓扑表面码构建精确恢复协议，确定由群乘法与不可约表示算符组成的正交错误基，并用规范固定消除闭环错误因稳定子产生的冗余，得到码空间上的完备正交基。\n2. 关键卖点是：在给定中性可纠正错误簇前提下，设计电荷与磁通转移电路，把错误移到辅助比特并投影剔除，从而实现确定性、精确且适用于非阿贝尔群的恢复。\n3. 这为任意有限群表面码的容错纠错提供了统一框架，并启发将电荷/磁通转移与规范固定用于非阿贝尔拓扑码的解码、实验实现及更一般量子双模型。", "summary_source": "deepseek", "authors": [{"name": "Alison Warman"}, {"name": "Nathanan Tantivasadakarn"}, {"name": "Sakura Schafer-Nameki"}], "featured_authors": [{"name": "Alison Warman"}, {"name": "Nathanan Tantivasadakarn"}, {"name": "Sakura Schafer-Nameki"}], "author_count": 3}, {"id": "2610.03682", "category": "quant-ph", "title": "Low-Overhead Quantum Error Correction with Boundary-Connected Planar Modules", "abstract": "Realizing practical quantum computers requires quantum error correction, but the most widely implemented approach, the planar surface code, demands a substantial physical qubit overhead. Here, we demonstrate that partitioning quantum processors into manageable, flat modules with non-local inter-module connections provides a natural solution. By wiring sparse, static boundary connections between Euclidean planar modules, we construct modular hyperbolic surface and color codes, based on new families of semi-hyperbolic codes. Using modular syndrome extraction circuits and efficient neural network and matching decoders, our circuit-level simulations show that this modular memory design can reduce the physical qubit overhead by tenfold or more compared to the surface code, even under elevated inter-module seam error rates. Projecting to larger system sizes, we find modular codes with encoding rate $k/n=1/16$ a
