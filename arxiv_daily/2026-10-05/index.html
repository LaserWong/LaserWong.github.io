<head>

  <title>arXiv 2026-10-05 · Daily ArXiv Selection</title>
  <style>
    :root {
      --bg: #f6f1e8;
      --panel: rgba(255, 252, 246, 0.92);
      --text: #2d241d;
      --muted: #6d5d50;
      --line: rgba(69, 49, 32, 0.14);
      --accent: #8f3d2e;
      --accent-2: #1d5f6b;
      --theory: #7c3a2a;
      --numeric: #255b6a;
      --both: #5d4a99;
      --experimental: #2f6b39;
      --shadow: 0 18px 40px rgba(54, 32, 16, 0.12);
      --radius: 22px;
      --ui-font: "Aptos", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --title-font: "Palatino Linotype", "Noto Serif SC", Georgia, serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--ui-font);
      color: var(--text);
      background: radial-gradient(circle at top left, rgba(255,255,255,0.78), transparent 32%), radial-gradient(circle at 88% 12%, rgba(29,95,107,0.14), transparent 20%), linear-gradient(180deg, #fbf7f0 0%, var(--bg) 42%, #f2e8dc 100%);
      min-height: 100vh;
    }
    .shell { width: min(1220px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 64px; }
    .hero {
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(255,255,255,0.84), rgba(255,248,238,0.72)), linear-gradient(135deg, rgba(143,61,46,0.08), rgba(29,95,107,0.08));
      box-shadow: var(--shadow);
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.82); border: 1px solid var(--line); color: var(--muted); font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase;
    }
    h1 { margin: 18px 0 10px; font-family: var(--title-font); font-size: clamp(32px, 5vw, 54px); line-height: 1.04; letter-spacing: -0.03em; }
    .hero p { max-width: 880px; color: var(--muted); font-size: 16px; line-height: 1.7; margin: 0; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-top: 26px; }
    .stat { padding: 16px 18px; background: rgba(255,255,255,0.76); border: 1px solid var(--line); border-radius: 18px; }
    .stat .label { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
    .stat .value { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
    .controls { position: sticky; top: 12px; z-index: 3; margin-top: 22px; padding: 18px; border: 1px solid var(--line); border-radius: 24px; background: rgba(250,244,236,0.9); backdrop-filter: blur(16px); box-shadow: 0 10px 24px rgba(54,32,16,0.08); }
    .control-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 16px; }
    .field { display: flex; flex-direction: column; gap: 10px; }
    .field label { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
    .search { width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line); background: rgba(255,255,255,0.92); font: inherit; color: var(--text); }
    .chip-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .chip { border: 1px solid var(--line); background: rgba(255,255,255,0.82); color: var(--text); padding: 10px 14px; border-radius: 999px; font: inherit; cursor: pointer; }
    .chip.active { border-color: rgba(143,61,46,0.35); background: rgba(143,61,46,0.12); color: #5b2419; }
    .chip[data-type="数值"].active { border-color: rgba(37,91,106,0.35); background: rgba(37,91,106,0.12); color: #173f49; }
    .chip[data-type="理论+数值"].active { border-color: rgba(93,74,153,0.35); background: rgba(93,74,153,0.12); color: #46337d; }
    .chip[data-type="实验"].active { border-color: rgba(47,107,57,0.35); background: rgba(47,107,57,0.12); color: #214c29; }
    .meta-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 14px; color: var(--muted); font-size: 14px; }
    .paper-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 18px; margin-top: 22px; }
    .paper { display: flex; flex-direction: column; gap: 14px; padding: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 10px 24px rgba(54,32,16,0.06); }
    .paper-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .tag { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid transparent; }
    .tag.category { background: rgba(45,36,29,0.08); color: var(--text); }
    .tag.type-theory { background: rgba(124,58,42,0.1); color: var(--theory); border-color: rgba(124,58,42,0.16); }
    .tag.type-numeric { background: rgba(37,91,106,0.1); color: var(--numeric); border-color: rgba(37,91,106,0.16); }
    .tag.type-both { background: rgba(93,74,153,0.1); color: var(--both); border-color: rgba(93,74,153,0.16); }
    .tag.type-experimental { background: rgba(47,107,57,0.1); color: var(--experimental); border-color: rgba(47,107,57,0.16); }
    .paper h2 { margin: 0; font-family: var(--title-font); font-size: 22px; line-height: 1.25; letter-spacing: -0.02em; }
    .paper h2 a { color: inherit; text-decoration: none; }
    .paper h2 a:hover { color: var(--accent); }
    .paper .id { color: var(--muted); font-size: 13px; }
    .author-block { display: grid; gap: 10px; padding: 14px 16px; border-radius: 18px; background: rgba(255,255,255,0.64); border: 1px solid var(--line); }
    .author-label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .author-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .author-item { display: grid; gap: 4px; }
    .author-item strong { font-size: 14px; }
    .author-item span { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .author-note { color: var(--muted); font-size: 12px; }
    .paper .summary { margin: 0; font-size: 15px; line-height: 1.75; white-space: pre-line; }
    details { border-top: 1px solid var(--line); padding-top: 12px; }
    details summary { cursor: pointer; color: var(--accent-2); font-weight: 700; list-style: none; }
    details summary::-webkit-details-marker { display: none; }
    details p { margin: 10px 0 0; color: var(--muted); line-height: 1.72; font-size: 14px; white-space: pre-line; }
    .paper footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 6px; color: var(--muted); font-size: 13px; }
    .paper footer a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .empty { display: none; margin-top: 24px; padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 22px; background: rgba(255,255,255,0.7); }
    @media (max-width: 980px) { .control-grid { grid-template-columns: 1fr; } .controls { position: static; } }
  </style>

  <script>
    const papers = [{"id": "2610.02346", "category": "cond-mat", "title": "Traveling waves, phase separation and pattern formation in the active stepping stone model", "abstract": "Selective advantage leads to the proliferation of a species into an ecosystem. On the other hand, self-propulsion can lead to dynamic clustering of individuals. To analyze the intricate effects produced by such competing processes, we introduce a minimal model for a proliferating active population, where run-and-tumble migration is combined with a stochastic birth-death process. Beginning with the microscopic dynamics of the particles, we derive the corresponding hydrodynamic equations and validate them through numerical simulations. We demonstrate that the inclusion of activity leads to the emergence of novel morphological patterns, which are sensitive to the specific rules governing migration. Furthermore, we show that activity significantly alters the characteristics of invasion waves, increasing their propagation speed. However, beyond a threshold, excessive activity disrupts the wave-like nature of the invasion process. We also extend our study to two dimensions and analyze the instabilities that lead to pattern formation in such systems.", "url": "https://arxiv.org/abs/2610.02346", "type": "理论+数值", "summary": "1. 该工作构建了一个耦合跑动-翻滚迁移与随机生灭过程的增殖活性种群极简模型，从微观粒子动力学推导流体力学方程并用数值模拟验证，进而研究入侵波、相分离与斑图形成。\n2. 其核心物理卖点在于揭示活性会诱发对迁移规则敏感的新形态斑图，并显著提高入侵波速，但超过阈值后过度活性会破坏波的传播性质，同时二维不稳定性分析刻画了斑图形成机制。\n3. 这为理解选择优势与自驱动聚集竞争下的种群扩张、相分离及生态入侵波提供可扩展的流体力学框架，并提示需在具体迁移规则和维度下检验活性阈值效应。", "summary_source": "deepseek", "authors": [{"name": "Rashmiranjan Bhutia"}, {"name": "Prasad Perlekar"}, {"name": "Kabir Ramola"}], "featured_authors": [{"name": "Rashmiranjan Bhutia"}, {"name": "Prasad Perlekar"}, {"name": "Kabir Ramola"}], "author_count": 3}, {"id": "2610.02409", "category": "cond-mat", "title": "Projective symmetry group classification of fermionic $Z_2$ spin liquids on the dipolar-octupolar pyrochlore magnets", "abstract": "We construct and classify $Z_2$ quantum spin liquids (QSLs) of fermionic partons on the dipolar-octupolar (DO) pyrochlore lattice. The DO pseudospin shares the space-group and time-reversal algebra of the effective spin-1/2 Kramers doublet, its projective symmetry group (PSG) yields the same 48 symmetric $Z_2$ classes as the generic fermionic classification. We show, the distinct DO symmetry action, encoded in a set of sublattice-independent operators, selects a physically different set of symmetry-allowed mean-field channels, so that the resulting ansatze, spinon spectra, and observables differ from both the effective spin-1/2 case and the bosonic DO classification. Decomposing the anisotropic XYZ exchange model into all symmetric singlet and triplet hopping and pairing channels and minimizing the mean-field energy self-consistently, we obtain phase diagrams in the ($\\tilde{J_x}, \\tilde{J_z}$) plane in which only a few $Z_2$ states, several supporting gapless or flat-band spinon spectra, are stabilized. For these states we compute the spinon band structures, the low-temperature specific heat, and the dynamical spin structure factor, and we argue that the power-law specific-heat exponent is a diagnostic of the spinon nodal structure. A near-linear-in-temperature specific heat together with broad continua in the structure factor gives a fermionic-parton account of the gapless, fractionalized thermodynamics reported in DO materials such as $Nd_2ScNbO_7$, complementing the bosonic quantum-spin-ice picture of the Ce-based compounds. The work extends the fermionic-parton classification of DO pyrochlore QSLs beyond the $U(1)$ sector, where $Z_2$ topological order is realized equally naturally by fermionic and bosonic spinons.", "url": "https://arxiv.org/abs/2610.02409", "type": "理论+数值", "summary": "1. 该工作构建并分类了偶极-八极（DO）烧绿石格子上费米子部分子的Z2量子自旋液体，得到与一般费米子分类相同的48个投影对称群Z2类。\n2. 其卖点在于DO对称作用由与子格无关的算符编码，筛选出独特的对称允许平均场通道，使ansatz、自旋子谱与可观测量均区别于有效自旋1/2与玻色DO分类；XYZ交换模型自洽平均场仅稳定少数Z2态，比热幂律指数可诊断自旋子节点结构。\n3. 该费米子部分子图像解释了Nd2ScNbO7等材料近线性比热与结构因子宽连续谱所对应的无能隙分数化热力学，与Ce基化合物的玻色量子自旋冰互补，并将DO烧绿石QSL分类推进到U(1)之外的Z2拓扑序。", "summary_source": "deepseek", "authors": [{"name": "Rohit Deb"}, {"name": "Sambuddha Sanyal"}], "featured_authors": [{"name": "Rohit Deb"}, {"name": "Sambuddha Sanyal"}], "author_count": 2}, {"id": "2610.02411", "category": "cond-mat", "title": "Distinguishing sodium-ion penetration and sustained transport in realistic hard carbon nanostructures", "abstract": "Hard carbons are promising anodes for sodium-ion energy storage, yet the relationship between their heterogeneous microstructure and sodium transport remains poorly understood. Here, we combine machine-learning-generated hard-carbon structures with molecular dynamics simulations of explicit 1 M NaPF6 in ethylene carbonate/dimethyl carbonate electrolyte to investigate sodium storage and transport across carbon structures with densities from 0.5 to 2.0 g cm-3. Increasing carbon density produces less accessible pore networks and greater graphitic local ordering, allowing the influence of microstructure on electrochemical response and Na+ transport to be examined systematically. Sodium uptake increases with applied potential but decreases strongly with carbon density, while electrode charging persists even in the densest structure, where Na+ uptake remains very small. Coordination analysis shows increasing interaction with the carbon framework under applied potential, while Na+ retains a partially solvated environment. Three-dimensional trajectory analysis reveals heterogeneous, predominantly tortuous transport pathways, with the more open HC-C1 structure supporting broader penetration and greater sustained displacement. Maximum penetration depth and retained displacement are not equivalent: ions can transiently reach deep regions of denser carbon structures before returning towards the electrolyte interface. Potential-of-mean-force analysis further shows that deep penetration occurs across a range of projected free-energy changes and cannot be described by a single energetic criterion. These results show that Na+ storage and transport are governed by the interplay between electrostatic driving force, electrolyte solvation, pore accessibility and confinement, highlighting carbon microstructure as a key determinant of sustained ionic penetration.", "url": "https://arxiv.org/abs/2610.02411", "type": "理论+数值", "summary": "1. 硬碳是有前途的钠离子储能阳极，但其异质微观结构与钠传输之间的关系仍知之甚少。\n2. 三维轨迹分析揭示了异质的、主要是曲折的运输路径，更开放的 HC-C1 结构支持更广泛的渗透和更大的持续位移。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Carolina Cruz-Cardona"}, {"name": "Andreea Hedes"}, {"name": "Patrick Rowe"}, {"name": "Anderson Arboleda-Lamus"}, {"name": "Raul Arenal"}, {"name": "Zhenyu Guo"}, {"name": "Heather Au"}, {"name": "Magda M. Titirici"}, {"name": "Celine Merlet"}, {"name": "Carla de Tomas"}], "featured_authors": [{"name": "Carolina Cruz-Cardona"}, {"name": "Andreea Hedes"}, {"name": "Patrick Rowe"}, {"name": "Magda M. Titirici"}, {"name": "Celine Merlet"}, {"name": "Carla de Tomas"}], "author_count": 10}, {"id": "2610.02422", "category": "cond-mat", "title": "Highly Tunable Photon-Magnon Coupling Governed by Collective-Mode Profiles in Reconfigurable Dielectric-Resonator Arrays", "abstract": "The spatial structure of a microwave photon mode provides a degree of freedom for controlling its interaction with a localized magnetic excitation. We demonstrate site-selective magnon-photon coupling in modular arrays of discrete dielectric resonators mounted on a common microstrip line. The resonators can be added, removed, or rearranged on the same completed PCB, enabling post-fabrication geometrical reconfiguration of the collective photon modes and their nodal structure. A YIG sphere is positioned successively above individual resonators, while an in-plane magnetic field tunes its Kittel mode through the collective photon resonances. In a three-resonator array, modes with finite local microwave magnetic fields hybridize with the magnon at every measured site, whereas a mode containing a central field node exhibits no resolvable splitting when the sphere is positioned at that node. Full-wave simulations and a coupled-mode model show that the interaction is governed by the local amplitude of the collective photon mode rather than by spectral resonance alone. Extending this local-node selection rule to a five-resonator array successfully predicts the measured position-dependent coupling patterns. These results establish post-fabrication control of spatial magnon-photon hybridization and provide a route toward reconfigurable magnonic interfaces in future hybrid quantum microwave architectures.", "url": "https://arxiv.org/abs/2610.02422", "type": "理论+数值", "summary": "1. 该工作在同一条微带线上搭建可增删重排的模块化介质谐振器阵列，将YIG球依次置于各谐振器上方，测量位点选择性的磁振子-光子耦合。\n2. 其关键在于耦合强度由集体光子模的局域振幅与节点结构决定而非仅由谱共振决定：含中心场节点的模式在节点处无可分辨劈裂，五谐振器阵列验证了该定则。\n3. 这确立了后制备阶段对空间磁振子-光子杂化的调控能力，为未来混合量子微波架构中的可重构磁子界面提供了可行路径。", "summary_source": "deepseek", "authors": [{"name": "Shihao Zhou"}, {"name": "Edward Kwao"}, {"name": "Junming Wu"}, {"name": "Abhijit Shinde"}, {"name": "Yin Lyu"}, {"name": "Rene Lopez"}, {"name": "Wencan Jin"}, {"name": "Yi Li"}, {"name": "Binbin Yang"}, {"name": "Wei Zhang"}], "featured_authors": [{"name": "Shihao Zhou"}, {"name": "Edward Kwao"}, {"name": "Junming Wu"}, {"name": "Yi Li"}, {"name": "Binbin Yang"}, {"name": "Wei Zhang"}], "author_count": 10}, {"id": "2610.02454", "category": "cond-mat", "title": "Universal energy barrier for plastic flow in a network glass", "abstract": "Shear transformations are the elementary events of plasticity in glasses and underpin many mesoscopic models of plastic flow, yet their atomic origin and energetics remain difficult to establish. Here we use a machine-learned interatomic potential to show that, in amorphous carbon as a representative network glass, a shear transformation corresponds to the breaking or formation of a single covalent bond. The simplicity of the associated reaction coordinate, the bond length, enables us to extract energy landscapes and barriers. Despite the intrinsic structural disorder, we find that all energy landscapes collapse onto a universal barrier shape. What remains bond-specific is a single scale, the bond-jump distance, which fixes the barrier height through a cubic law. Combined with the activation statistics of shear transformations, this yields a model that predicts the plastic flow stress from independently determined bond-level quantities. Our results provide microscopic support for phenomenological models of plastic flow in glasses and suggest a route towards a quantitative description of amorphous plasticity.", "url": "https://arxiv.org/abs/2610.02454", "type": "理论", "summary": "1. 该工作用机器学习原子间势，在非晶碳这一代表性网络玻璃中证明剪切转变对应于单个共价键的断裂或形成。\n2. 其卖点在于以键长为反应坐标提取能量景观与势垒，发现无序下所有景观塌缩为普适能垒形状，且仅由键跳距离这一键级尺度通过三次律决定势垒高度，再结合剪切转变激活统计，建立从独立键级量预测塑性流动应力的模型。\n3. 这为玻璃塑性流动的唯象模型提供微观支撑，并给出以键级独立参数定量描述非晶塑性的路线。", "summary_source": "deepseek", "authors": [{"name": "Ibrahim Ghanem"}, {"name": "Richard Jana"}, {"name": "Wolfram G. Nöhring"}, {"name": "Michael Moseler"}, {"name": "Lars Pastewka"}], "featured_authors": [{"name": "Ibrahim Ghanem"}, {"name": "Richard Jana"}, {"name": "Wolfram G. Nöhring"}, {"name": "Michael Moseler"}, {"name": "Lars Pastewka"}], "author_count": 5}, {"id": "2610.02635", "category": "cond-mat", "title": "Fractionalization-Induced Time-Reversal Symmetry Breaking at Continuous Superconducting Transitions in Low-Symmetry Kondo Lattices", "abstract": "In conventional Landau theory, simultaneous continuous onset of superconductivity and the breaking of additional symmetries generally requires a multidimensional order parameter or fine tuning. We show that symmetry fractionalization provides a different route. In a Kondo lattice with a $\\mathbb Z_2$ spin liquid, the Kondo fields inherit the projective symmetry action of the spinons. When the projective time-reversal action on these fields squares to $-1$, the projective symmetry algebra forbids a condensate that preserves time-reversal symmetry and enforces twofold degeneracy of the critical modes. Because Kondo condensation in a $\\mathbb Z_2$ spin liquid also breaks electromagnetic $U(1)$ symmetry, superconductivity and time-reversal symmetry breaking can emerge at a single continuous transition, even if crystal symmetry admits only one-dimensional irreducible representations. We demonstrate this mechanism in an anisotropic Kondo-Kitaev model, where superconductivity and the breaking of time-reversal and mirror symmetries emerge simultaneously.", "url": "https://arxiv.org/abs/2610.02635", "type": "理论", "summary": "1. 该工作提出并论证，在具有Z2自旋液体的近藤晶格中，对称性分数化可使超导与时间反演对称破缺在同一连续相变中同时发生。\n2. 其核心机制是近藤场继承自旋子的投影对称作用；当投影时间反演作用平方为-1时，投影对称代数禁止保持时间反演不变的凝聚，并迫使临界模式二重简并。\n3. 由于近藤凝聚同时破缺电磁U(1)，该路线无需多维序参量或精细调节即可在仅有一维不可约表示的低对称晶体中实现单一连续相变；各向异性近藤-Kitaev模型展示了超导与时间反演、镜像对称的同时破缺，为探索分数化诱导的对称性破缺提供启示。", "summary_source": "deepseek", "authors": [{"name": "Wonjune Choi"}, {"name": "Shi-Zeng Lin"}], "featured_authors": [{"name": "Wonjune Choi"}, {"name": "Shi-Zeng Lin"}], "author_count": 2}, {"id": "2610.02671", "category": "cond-mat", "title": "LATHE: LAnguage-driven Toolkit for Hypothesis-based crystal Editing", "abstract": "Manipulating crystal structures towards targeted geometric properties or symmetry constraints is a longstanding challenge. Existing computational frameworks fall short: LLMs have poor spatial awareness and operate at coarse granularity in the token space, while diffusion- and gradient-based structure generation approaches generally produce complete structures \\textit{de novo} rather allowing for fine-grained editing of a given input under arbitrary constraints. We present LATHE, a geometric toolkit that closes this gap by expressing seven classes of crystallographic properties --- bond length, bond angle, dihedral angle, coordination environment, lattice parameters, cell volume, and space group, as differentiable objectives to enable direct geometric editing of crystal structures. To demonstrate its usage in materials design, we further expose LATHE through a Model Context Protocol server and embed it in a closed-loop multi-agent system which translates hypotheses intogeometric modifications in natural language towards a given design objective. Across single-property benchmarks, LATHE attains near-perfect constraint satisfaction on all seven property types while keeping optimized structures close to local energy minima. The LATHE-equipped agent translates over 87.5\\% of natural-language prompts into valid executable configurations and faithfully completes them. In a band-gap inverse-design case study, the multi-agent loop reaches the target tolerance window in nine of ten independent runs at a typical cost of thirteen hypothesis-evaluation cycles. By bridging natural-language hypothesis generation and physically grounded gradient-based structural editing, this work establishes a paradigm for interpretable, closed-loop computational materials discovery that is immediately applicable to a broad class of functional material design tasks.", "url": "https://arxiv.org/abs/2610.02671", "type": "理论+数值", "summary": "1. 该工作提出LATHE工具包，把键长、键角、二面角、配位环境、晶格参数、晶胞体积和空间群七类晶体学性质写成可微目标，实现对给定结构的直接几何编辑。\n2. 其卖点是以可微目标做梯度式细粒度编辑，并经MCP服务器嵌入多智能体闭环，把自然语言假设转成可执行几何修改且保持结构近局部能量极小。\n3. 在带隙逆向设计中十次独立运行有九次落入目标容差，通常仅需十三轮假设—评估，为可解释的闭环功能材料发现提供了范式。", "summary_source": "deepseek", "authors": [{"name": "Qianyu Zheng"}, {"name": "Shuyi Jia"}, {"name": "Victor Fung"}], "featured_authors": [{"name": "Qianyu Zheng"}, {"name": "Shuyi Jia"}, {"name": "Victor Fung"}], "author_count": 3}, {"id": "2610.02794", "category": "cond-mat", "title": "Emergent Noncoplanar Spin Chirality through Magnetic and Nonmagnetic Substitution in the Kagome Antiferromagnet Mn$_3$Sn", "abstract": "Controlling noncoplanar spin textures in centrosymmetric magnets remains a central challenge for realizing emergent Berry-phase phenomena. Here, we demonstrate that magnetic (Cr) and nonmagnetic (Cu) substitution at the Mn site provide distinct routes to engineer spin chirality and topological transport in the kagome antiferromagnet Mn$_3$Sn. Cr substitution enhances low-temperature spin canting, stabilizing a dense noncoplanar texture that yields a pronounced topological Hall effect (THE) at low temperatures. In contrast, Cu substitution drives a spin-reorientation transition accompanied by an easy-axis rotation, creating a broad temperature window (150--208 K) where competing magnetic anisotropies stabilize noncoplanar spin textures and generate a large THE. A concurrent carrier-type crossover signals an underlying electronic-structure reconstruction. These results reveal that exchange enhancement and exchange dilution represent two fundamentally different pathways for tuning real-space Berry curvature, establishing chemical substitution as a powerful strategy for engineering topological transport in kagome antiferromagnets.", "url": "https://arxiv.org/abs/2610.02794", "type": "理论", "summary": "1. 该工作通过在Kagome反铁磁体Mn3Sn的Mn位分别引入磁性Cr与非磁性Cu替代，系统研究了化学掺杂对非共面自旋手性和拓扑输运的调控。\n2. Cr替代增强低温自旋倾斜并稳定密集非共面织构，在低温产生显著拓扑霍尔效应；Cu替代则诱发自旋重取向与易轴转动，在150–208 K宽温区利用竞争磁各向异性形成非共面织构并给出大拓扑霍尔信号，同时伴随载流子类型转变，指示电子结构重构。\n3. 结果表明交换增强与交换稀释是调控实空间贝里曲率的两种根本不同路径，确证化学替代可作为在Kagome反铁磁体中工程化拓扑输运的有效策略。", "summary_source": "deepseek", "authors": [{"name": "Anupam Barik"}, {"name": "Achintya Low"}, {"name": "Susanta Ghosh"}, {"name": "Kapildeb Dolui"}, {"name": "Setti Thirupathaiah"}], "featured_authors": [{"name": "Anupam Barik"}, {"name": "Achintya Low"}, {"name": "Susanta Ghosh"}, {"name": "Kapildeb Dolui"}, {"name": "Setti Thirupathaiah"}], "author_count": 5}, {"id": "2610.02849", "category": "cond-mat", "title": "Nonlocal, nonlinear electrostatics: like-charge attraction and asymmetric solvation", "abstract": "We study an equilibrium system, where linear molecules with a rigid charge distribution interact via the mean-field generated by the Coulomb coupling. We focus on the nonlinear regime, which is valid close to external charges immersed in the system. The finite molecular size in this regime leads to a nonlocal response at short distances. First, we show that the mean-field potential is non-monotonic, i.e., like charges can attract each other. Second, we show that the polarization induced by an external charge (and hence its solvation structure) depends on the sign of this charge, violating the effective C-symmetry of the macroscopic electrodynamics. We identify several scenarios of this effect, characterize it with the free energy and entropy differences, and compare it with analogous effects in asymmetric electrolytes described by nonlinear Poisson-Boltzmann equations.", "url": "https://arxiv.org/abs/2610.02849", "type": "理论", "summary": "1. 该工作研究由刚性电荷分布的线性分子经库仑耦合平均场相互作用构成的平衡体系，重点分析靠近浸入体系的外电荷时成立的非线性响应区。\n2. 其核心物理卖点在于：有限分子尺寸导致的短程非局域响应使平均场势非单调，进而出现同号电荷吸引；同时外电荷诱导的极化与溶剂化结构依赖电荷符号，破坏宏观电动力学的有效电荷共轭对称性。\n3. 作者还识别多种情形，以自由能和熵差表征该效应，并与非线性泊松-玻尔兹曼方程描述的非对称电解质中的类似效应类比；这提示非局域非线性静电可统一解释同号吸引与不对称溶剂化，并为软物质及电解质后续研究提供启发。", "summary_source": "deepseek", "authors": [{"name": "V. Stepanyan"}, {"name": "Y. Sh. Mamasakhlisov"}, {"name": "A. E. Allahverdyan"}], "featured_authors": [{"name": "V. Stepanyan"}, {"name": "Y. Sh. Mamasakhlisov"}, {"name": "A. E. Allahverdyan"}], "author_count": 3}, {"id": "2610.02883", "category": "cond-mat", "title": "Structural crossover of complex networks: bridging degree correlation and fractality", "abstract": "We investigate the relationship between long-range degree correlations and fractality in scale-free random networks. By analyzing degree correlations in scale-free random networks at the percolation threshold, at which a giant component emerges, we derive the ball volume $\\tilde{\\nu}_k(l)$, defined as the average number of nodes within distance $l$ from a root node with degree $k$. The resulting expression predicts a degree-dependent structural crossover. For $l\\ll k^{1/(\\df-1)}$, the ball volume grows as $\\tilde{\\nu}_k(l)\\sim kl$, whereas for $l\\gg k^{1/(\\df-1)}$, it crosses over to the global fractal scaling $\\tilde{\\nu}_k(l)\\sim l^{\\df}$. Here, $\\df$ is the fractal dimension of critical scale-free random networks. We further show that the structural crossover can be naturally understood in terms of critical branching processes and is also observed in empirical fractal networks.", "url": "https://arxiv.org/abs/2610.02883", "type": "理论", "summary": "1. 该工作分析无标度随机网络在巨片出现的渗流阈值处的度关联，推导出根节点度为 k 的球体积及其度依赖结构交叉。\n2. 其核心卖点是短程球体积按 kl 增长，而越过尺度 k^(1/(d_f−1)) 后转为 l^(d_f) 的全局分形标度，d_f 为分形维数。\n3. 该交叉可由临界分支过程自然解释，并在经验分形网络中出现，为连接度关联与分形性提供了可检验框架。", "summary_source": "deepseek", "authors": [{"name": "Shogo Mizutaka"}, {"name": "Jun Yamamoto"}, {"name": "Kousuke Yakubo"}], "featured_authors": [{"name": "Shogo Mizutaka"}, {"name": "Jun Yamamoto"}, {"name": "Kousuke Yakubo"}], "author_count": 3}, {"id": "2610.02884", "category": "cond-mat", "title": "Orientational origin of nonlinear shear rheology in unentangled polymer melts", "abstract": "Universal rheological properties of unentangled polymer melts are investigated through the stretch-orientation decomposition of polymer dynamics. By externalizing stretch from the explicit state of each Rouse mode, we construct a constitutive model with orientational kinetics that preserves the Rouse relaxation spectrum. The resulting model yields the observed steady-shear scalings of the shear viscosity and first normal-stress coefficient, predicts a finite second normal-stress coefficient, and approximately reproduces the Cox-Merz and Gleissle-Osaki rules. The derived steady-oscillatory shear correspondence further identifies an elastic contribution, associated with the first normal stress difference, that is absent from the conventional Cox-Merz rule.", "url": "https://arxiv.org/abs/2610.02884", "type": "理论", "summary": "1. 通过拉伸-取向分解并外化各Rouse模式的拉伸，构建保持Rouse谱的取向动力学本构模型，研究未缠结聚合物熔体非线性剪切流变。\n2. 模型复现稳态剪切黏度与第一法向应力系数的标度，预言有限第二法向应力系数，并近似给出Cox-Merz与Gleissle-Osaki规则。\n3. 由此导出的稳态-振荡剪切对应关系揭示第一法向应力差伴随的弹性贡献，表明传统Cox-Merz规则缺失该项，并为非线性流变提供取向起源视角。", "summary_source": "deepseek", "authors": [{"name": "Souta Miyamoto"}, {"name": "Takeshi Sato"}, {"name": "John J. Molina"}, {"name": "Takashi Taniguchi"}], "featured_authors": [{"name": "Souta Miyamoto"}, {"name": "Takeshi Sato"}, {"name": "John J. Molina"}, {"name": "Takashi Taniguchi"}], "author_count": 4}, {"id": "2610.02998", "category": "cond-mat", "title": "Ab initio design of enhanced and sign-reversible spin Hall and spin Nernst conductivity in skutterudite materials", "abstract": "The search for novel materials capable of robust spin-current generation remains an active area of research. Here, we investigate the intrinsic spin Hall and spin Nernst effects in Co- and Rh-based skutterudites and explore their enhancement through heavy-metal substitution and site-selective doping. Using first-principles calculations and Wannier-based tight-binding models, we analyze the spin Berry curvature and spin-transport responses of pristine MX$_3$, where M = Co, Rh and X = As, Sb, as well as chemically modified systems. Despite sizable momentum-resolved spin Berry curvature, the pristine compounds exhibit relatively small net spin Hall responses due to substantial cancellation across the Brillouin zone. Isoelectronic Ir and Bi substitution at 8$c$ Wycoff M site produces little enhancement near the E$_F$, whereas non-isoelectronic Pt substitution yields a relatively better response. Most interestingly, the incorporation of Pt at the interstitial $2a$ Wycoff site of RhAs$_3$ nearly doubles the spin Hall conductivity to $\\sim400~(\\hbar/e)(\\Omega,\\mathrm{cm})^{-1}$ near the E$_F$ when compared to Pt substitution at 8$c$ position. At 300 K, the same interstitially filled system exhibits a spin Nernst conductivity of $\\sim1.46~(\\hbar/e),\\mathrm{A,m^{-1}K^{-1}}$ at the E$_F$, nearly an order of magnitude larger than that of $M$-site Pt substitution. The enhanced responses arise from Pt $5d$ states, strong spin-orbit coupling, and avoided crossings that generate pronounced spin-Berry-curvature hot spots. These results demonstrate that site-selective chemical engineering can effectively overcome momentum-space cancellation resulting in enhanced spin Hall and spin Nernst responses in skutterudites. Our results provide a possible route towards robust spin-current generation in this class of materials.", "url": "https://arxiv.org/abs/2610.02998", "type": "理论+数值", "summary": "1. 寻找能够产生强大自旋电流的新型材料仍然是一个活跃的研究领域。\n2. 8$c$ Wycoff M 位点的等电子 Ir 和 Bi 取代在 E$_F$ 附近几乎没有产生增强，而非等电子 Pt 取代产生相对更好的响应。\n3. 在 300 K 时，相同的间隙填充系统在 E$_F$ 处表现出 $\\sim1.46~(\\hbar/e),\\mathrm{A,m^{-1}K^{-1}}$ 的自旋能斯特电导率，几乎比 $M$ 位点 Pt 取代的电导率大一个数量级。", "summary_source": "local-fallback", "authors": [{"name": "Saikat Debnath"}, {"name": "Babu Baijnath Prasad"}, {"name": "Shishir Kumar Pandey"}], "featured_authors": [{"name": "Saikat Debnath"}, {"name": "Babu Baijnath Prasad"}, {"name": "Shishir Kumar Pandey"}], "author_count": 3}, {"id": "2610.03094", "category": "cond-mat", "title": "Quantum critical superconductivity in a dense fermi dilute bose mixture close to mechanical instability", "abstract": "We couple a metal to an uncondensed bose gas with repulsive bose-fermi interactions in two dimensions. Within the random phase approximation, we show that the density fluctuations of the bosons, which mediate the effective fermion-fermion attraction, become long ranged on appropriate tuning of interactions. This leads to parametrically enhanced superconducting temperatures $T_c \\propto g$ as opposed to $T_c \\propto \\exp(-1/g)$ for the BCS case. The dilute bose gas density acts as the primary bottleneck to the enhancement. We discuss the conceptual difficulties of implementing this idea in electron-exciton mixtures.", "url": "https://arxiv.org/abs/2610.03094", "type": "理论", "summary": "1. 该工作将二维金属与未凝聚的排斥性玻色气体耦合，在随机相近似下研究近力学失稳时玻色密度涨落诱导的超导。\n2. 其卖点在于玻色密度涨落中介的费米子吸引可被调为长程，使 Tc ∝ g，而非 BCS 的 exp(-1/g)。\n3. 该机制亦指出稀薄玻色气体密度是增强的主要瓶颈，并为电子-激子混合物等体系的实现提供启示与概念挑战。", "summary_source": "deepseek", "authors": [{"name": "Vibhu Mishra"}], "featured_authors": [{"name": "Vibhu Mishra"}], "author_count": 1}, {"id": "2610.03104", "category": "cond-mat", "title": "Evaluating Chern Topology in Discretized Brillouin Zones Using Bargmann Invariants", "abstract": "We develop a finite-state geometric framework based on third-order Bargmann invariants for evaluating Chern numbers and characterizing local quantum-state geometry. Using gauge-invariant state overlaps, the framework evaluates the Chern number directly on discretized parameter spaces while retaining local geometric information through the phase-derived density and the complementary amplitude density, as well as signatures associated with changes in topological character. We apply the construction to the Qi--Wu--Zhang, $1/3$- and $1/4$-flux Hofstadter, SSH, and Rice--Mele models, including a rank-$2$ extension for isolated composite subspaces and applications to closed-loop and parameter-space topology. The resulting framework organizes Chern topology and local geometric information directly from finite-state data, providing a compact state-based description without relying on dynamical evolution.", "url": "https://arxiv.org/abs/2610.03104", "type": "理论+数值", "summary": "1. 该工作建立了基于三阶 Bargmann 不变量的有限状态几何框架，用于在离散化布里渊区/参数空间上计算陈数并表征局部量子态几何。\n2. 其核心卖点是利用规范不变的态重叠直接在离散参数空间求取陈数，同时通过相位密度、互补振幅密度和拓扑变化信号保留局部几何信息。\n3. 该框架在 Qi-Wu-Zhang、1/3与1/4通量 Hofstadter、SSH、Rice-Mele 及 rank-2 复合子空间等模型中验证，为不依赖动力学演化的紧凑态基拓扑描述提供了可扩展方案。", "summary_source": "deepseek", "authors": [{"name": "Swarup Sangiri"}, {"name": "A Taraphder"}], "featured_authors": [{"name": "Swarup Sangiri"}, {"name": "A Taraphder"}], "author_count": 2}, {"id": "2610.03169", "category": "cond-mat", "title": "Cup and Cap Topological Neural Network", "abstract": "Topological Deep Learning (TDL) is designed to learn features associated with higher-dimensional simplices including not only nodes but also edges, triangles and so on. However, most TDL approaches, being based on boundary operators and Hodge Laplacians, have the limitation that features and signals cannot be lifted or lowered across more than one dimension per layer. To overcome this limitation, in this work, we propose the adoption of the cup and cap products. Specifically, we formulate the Cup and Cap Topological Neural Network (CCNN), a topological deep learning architecture designed to learn node-based variables (or 0-cochains) by taking into account their many-body interactions (e.g. triangles) present in the data. We validate CCNN by assessing its performance on the TopoBench datasets, revealing its competitiveness with respect to other simplicial complex neural networks.", "url": "https://arxiv.org/abs/2610.03169", "type": "理论", "summary": "1. 该工作提出杯积与帽积拓扑神经网络（CCNN），以0-上链表示节点变量并学习三角形等多体相互作用。\n2. 其关键在于用杯积和帽积替代仅依赖边界算子与Hodge拉普拉斯的常规层，使单层可跨多维度提升或降低信号。\n3. 在TopoBench上其表现与多种单纯复形神经网络相当，提示杯帽积可推广至更高阶拓扑表示并启发新架构。", "summary_source": "deepseek", "authors": [{"name": "Marta Niedostatek"}, {"name": "Ferran Hernandez Caralt"}, {"name": "Runyue Wang"}, {"name": "Federica Baccini"}, {"name": "Lorenzo Giambagli"}, {"name": "Pietro Lió"}, {"name": "Ginestra Bianconi"}], "featured_authors": [{"name": "Marta Niedostatek"}, {"name": "Ferran Hernandez Caralt"}, {"name": "Runyue Wang"}, {"name": "Lorenzo Giambagli"}, {"name": "Pietro Lió"}, {"name": "Ginestra Bianconi"}], "author_count": 7}, {"id": "2610.03180", "category": "cond-mat", "title": "Probing fluctuating hydrodynamics through current fluctuations in hard rod gas", "abstract": "We study the full counting statistics of the integrated current in a one-dimensional hard-rod gas in equilibrium, employing two recently proposed fluctuating hydrodynamic frameworks: (i) Ballistic Macroscopic Fluctuation Theory (BMFT) and (ii) diffusive fluctuating hydrodynamic theory based on correlated Brownian motion approximation of hard-rod quasiparticles (CBFHD). We investigate how the predictions of these two approaches compare with each other and with the underlying microscopic dynamics. We show within BMFT that the current distribution admits a large-deviation form under ballistic scaling, and we derive an explicit expression for the large-deviation function, valid for an arbitrary inhomogeneous initial state factorized in point-particle coordinates. The corresponding current cumulants are also obtained. We subsequently analyze the current statistics within the CBFHD framework, which explicitly incorporates stochastic noise and dissipative terms, and demonstrate that the current distribution likewise obeys a large-deviation principle in this approach. We find that, while BMFT predictions for the first few cumulants and the rate function are in excellent agreement with direct numerical simulations of the microscopic hard-rod dynamics, CBFHD prediction is not. We further verify the predictions of the CBFHD independently using a collection of correlated Brownian motions, which provides an approximate description of the dynamics of hard-rod quasiparticles. Our findings indicate that CBFHD does not accurately capture large-scale current fluctuations in the hard-rod gas, whereas BMFT yields predictions in quantitative agreement with the microscopic dynamics, at least in the context of full counting statistics.", "url": "https://arxiv.org/abs/2610.03180", "type": "理论+数值", "summary": "1. 该工作用弹道宏观涨落理论（BMFT）与基于关联布朗运动近似的扩散涨落流体力学（CBFHD），研究一维平衡硬杆气体积分流的全计数统计，并与微观数值模拟对照。\n2. 其核心在于 BMFT 在弹道标度下给出流分布的大偏差形式、显式速率函数及累积量，而含噪声耗散的 CBFHD 虽满足大偏差原理，却未能准确刻画硬杆准粒子的大尺度流涨落。\n3. 结果表明至少在全计数统计层面 BMFT 与微观动力学定量一致，提示涨落流体力学框架需以精确微观基准检验其大偏差预测。", "summary_source": "deepseek", "authors": [{"name": "Tirthankar Mondal"}, {"name": "Indranil Mukherjee"}, {"name": "Anupam Kundu"}], "featured_authors": [{"name": "Tirthankar Mondal"}, {"name": "Indranil Mukherjee"}, {"name": "Anupam Kundu"}], "author_count": 3}, {"id": "2610.03188", "category": "cond-mat", "title": "Plasmon modes in tilted three-dimensional nodal-ring semimetals. II. Vortex nodal ring", "abstract": "We investigate collective charge excitations in three-dimensional vortex nodal-ring semimetals (VNRs), whose pseudospin texture winds around the nodal ring and differs qualitatively from that of the conventional $\\mathcal{PT}$-symmetric nodal-ring semimetal (PTNR). While plasmon modes in PTNRs have been studied in a companion work, arXiv:2609.35373 . Here, we focus on how a VNR's pseudospin texture changes the response compared with the former. Within a low-energy two-band description and the random-phase approximation, we analyse the density response, density-of-states, Drude weights, dielectric function, and plasmon modes at low doping. We consider the untilted system together with in-plane and axial band-tilts. Although the VNR and PTNR have distinct Hamiltonians, pseudospin textures, and Berry-curvature distributions, their linearised energy dispersions coincide. The vortex texture, however, introduces a toroidal-angle dependence in the band-overlap factor and quantum metric, thereby modifying the charge response. We examine how these effects enter the dielectric screening and collective modes for different wavevector orientations. Our results clarify how pseudospin texture, beyond the band dispersion alone, influences collective charge dynamics in three-dimensional nodal-ring semimetals.", "url": "https://arxiv.org/abs/2610.03188", "type": "理论", "summary": "1. 该工作基于低能两带模型与随机相近似，研究了三维涡旋节点环半金属中的集体电荷激发，并对比PT对称节点环半金属，考察未倾斜及面内/轴向能带倾斜下的密度响应、态密度、德鲁德权重、介电函数与低掺杂等离激元。\n2. 其卖点在于：尽管两者线性化色散相同，涡旋赝自旋织构仍使能带重叠因子和量子度规出现环向角依赖，进而改变介电屏蔽及不同波矢取向的等离激元。\n3. 这揭示出除能带色散外，赝自旋织构与量子几何可独立调控三维节点环半金属的集体电荷动力学，并为后续倾斜和各向异性响应研究提供基准。", "summary_source": "deepseek", "authors": [{"name": "Ipsita Mandal"}], "featured_authors": [{"name": "Ipsita Mandal"}], "author_count": 1}, {"id": "2610.03239", "category": "cond-mat", "title": "Discontinuous buckling from cytoplasmic mechanics in vertex models of epithelia", "abstract": "The cell cortex and cell adhesion contribute to the mechanics of epithelial cells and hence tissues. Vertex models of epithelia represent the cell cortex and cell adhesion, but these models mostly ignore the other subcellular structures that compose the cytoplasm surrounded by the cortex. Here, we reveal the mechanical consequences of these structures in a minimal vertex model of an epithelial monolayer, in which the single-cell energy includes a cytoplasmic contribution that represents, e.g., the cost of confinement of cytosolic polymers. Strikingly, our simulations show that the buckling transition of the monolayer under compression becomes discontinuous in an intermediate range of values of the associated cytoplasmic modulus. By asymptotic solution of this buckling problem in the continuum limit of the model, we explain this reentrant behaviour in terms of the tricritical points of a sixth-order Landau theory. Our results thus underline how cell-scale mechanics beyond the cortex and cell adhesion can change emergent, tissue-scale behaviour even qualitatively.", "url": "https://arxiv.org/abs/2610.03239", "type": "理论+数值", "summary": "1. 该工作在包含细胞皮层与黏附能的最小顶点模型中引入代表胞质聚合物受限代价的胞质模量，模拟上皮单层在压缩下的屈曲转变。\n2. 其核心发现是当胞质模量处于中间区间时屈曲由连续转为不连续，并通过连续极限下的渐近解将其归因于六阶朗道理论的三临界点，从而解释该重入行为。\n3. 这表明皮层与黏附之外的细胞尺度力学足以定性地改变组织尺度的集体行为，提示后续模型与实验需纳入胞质力学。", "summary_source": "deepseek", "authors": [{"name": "Chandraniva Guha Ray"}, {"name": "Pierre A. Haas"}], "featured_authors": [{"name": "Chandraniva Guha Ray"}, {"name": "Pierre A. Haas"}], "author_count": 2}, {"id": "2610.03244", "category": "cond-mat", "title": "Algebra of symmetry allowed physical properties of crystals", "abstract": "The symmetry of a physical system given by the 122 magnetic point groups (MPGs) leads to only 21 sets of restrictions on any physical tensors. Those, so called, tenor forms were labeled by letters from A to U by R. R. Birss (Symmetry and Magnetism, North Holland, Amsterdam, 1964). A new concept of property-related point groups (PRPGs) is proposed. It is shown that the 21 PRPGs isomorphic to the 21 non-centrosymmetric crystallographic point groups (CPGs) corresponds to the 21 tensor forms. Therefore instead of a symbols from A to U one can use PRPGs as mathematical objects corresponding to the tenor forms. From the Neumann's principle given multipole component is only allowed in a system when a group describing symmetry of the system is a subgroup of the multipole component symmetry. Each tensor can be expressed in the terms of the multipole degrees of freedom, i.e. it corresponds to a subset of all multipole components allowed by given PRPG. Those relations leads to the algebra of tensor forms, where space of allowed tensor components and space of PRPG operators are somehow dual to each other.", "url": "https://arxiv.org/abs/2610.03244", "type": "理论", "summary": "1. 该工作提出性质相关点群概念，用122个磁点群所允许的21类张量形式统一刻画晶体物理性质。\n2. 其核心卖点是以性质相关点群作为21种张量形式的数学对象，取代传统字母标记，并借诺伊曼原理把张量表为多极自由度。\n3. 由此得到的张量形式代数显示，允许张量分量空间与性质相关点群算符空间对偶，为磁点群下物性分类提供群论框架。", "summary_source": "deepseek", "authors": [{"name": "Piotr Fabrykiewicz"}], "featured_authors": [{"name": "Piotr Fabrykiewicz"}], "author_count": 1}, {"id": "2610.03318", "category": "cond-mat", "title": "Beyond Pure Dephasing: Quantum Error Correction in Single Molecules Requires Multiple Spins", "abstract": "We propose multi-spin molecules as a viable architecture for fault-tolerant quantum computing. To this aim, we introduce a correction protocol handling both diagonal and off-diagonal errors, typically associated with dephasing and relaxation. The scheme is based on a hybrid encoding which combines dephasing-tolerant units suppressing the leading pure dephasing error into a multi-spin molecule implementing a multi-qubit code for residual off-diagonal errors. Our proposal leverages peculiar properties of molecular spins, i.e. the strong hierarchy between different errors and the possibility to engineer multi-spin molecules at the synthetic level. Moreover, it addresses the important issue of the loss of coherences in anharmonic systems subject to off-diagonal errors, which hampers their correction at the single spin level. Thanks to the huge suppression of dephasing by the first-level code, we numerically demonstrate the potential performance of this strategy even with a limited number of spins per logical unit.", "url": "https://arxiv.org/abs/2610.03318", "type": "理论+数值", "summary": "1. 该工作提出以多自旋分子为容错量子计算架构，并设计能同时处理对角退相位与非对角弛豫误差的纠错协议，采用抗退相位单元与多量子比特码结合的混合编码。\n2. 其技术核心在于利用分子自旋中不同误差的强层级性，先由第一级编码大幅抑制主导纯退相位，再用多自旋分子实现的多量子比特码纠正残余非对角误差，从而克服单自旋层面难以修正的非谐相干损失。\n3. 数值结果表明，即使每个逻辑单元自旋数有限，该策略仍具潜在性能，为可合成工程化的分子自旋量子计算与容错纠错提供了可行启示。", "summary_source": "deepseek", "authors": [{"name": "Matteo Mezzadri"}, {"name": "Silvia Macedonio"}, {"name": "Luca Lepori"}, {"name": "Emilio Macaluso"}, {"name": "Francesco Albarelli"}, {"name": "Richard E.P. Winpenny"}, {"name": "Alessandro Chiesa"}, {"name": "Stefano Carretta1"}], "featured_authors": [{"name": "Matteo Mezzadri"}, {"name": "Silvia Macedonio"}, {"name": "Luca Lepori"}, {"name": "Richard E.P. Winpenny"}, {"name": "Alessandro Chiesa"}, {"name": "Stefano Carretta1"}], "author_count": 8}, {"id": "2610.03365", "category": "cond-mat", "title": "Functional renormalization group in an external field: constant field versus constant order parameter", "abstract": "Renormalization group (RG) flows for systems subject to an external field can be derived either by fixing the field or by fixing the conjugate order parameter. We show how to implement these boundary conditions within the functional renormalization group approach. We derive and compare the corresponding flow equations for $\\phi^4$ theory and show that some scaling variables and scaling exponents associated with the linearized flow of the relevant three-point vertex in the vicinity of the Ising fixed point depend on the boundary conditions. We also discuss the effect of elasticity on Ising criticality. In this case two of the fixed points (namely the renormalized Ising fixed point and the spherical fixed point) obtained for constant strain are shifted to physically inaccessible regimes of parameter space when we perform the RG at constant stress.", "url": "https://arxiv.org/abs/2610.03365", "type": "理论", "summary": "1. 该工作在外场下的泛函重正化群框架中，分别采用固定外场与固定共轭序参量两类边界条件，推导并比较了φ^4理论的流方程。\n2. 其核心在于表明伊辛不动点附近相关三点顶点的线性化流所对应的标度变量与标度指数依赖边界条件，并进一步分析弹性对伊辛临界性的影响：常应变下得到的重正化伊辛不动点和球面不动点在常应力重正化群中移入物理不可及的参数区域。\n3. 这提示外场系综选择会改变临界标度描述，并为弹性耦合临界系统中不同边界条件下的不动点稳定性与可达性比较提供了明确框架。", "summary_source": "deepseek", "authors": [{"name": "Julia von Rothkirch"}, {"name": "Andreas Rückriegel"}, {"name": "Peter Kopietz"}], "featured_authors": [{"name": "Julia von Rothkirch"}, {"name": "Andreas Rückriegel"}, {"name": "Peter Kopietz"}], "author_count": 3}, {"id": "2610.03366", "category": "cond-mat", "title": "TUR Violation, Minimal Power Fluctuation, and Enhanced Efficiency", "abstract": "We investigate the performance characteristics of an active magneto gyrator that consists of an inertial charged active particle confined in a two-dimensional asymmetric parabolic potential, coupled to two thermal baths maintained at two different temperatures and in the presence of a magnetic field applied perpendicular to the plane of motion. In contrast to the passive Brownian gyrator, where the power-efficiency trade-off imposes strict operational limits, the active magneto gyrator exhibits striking violations of this rule, allowing regimes in which both output power and efficiency increase simultaneously with load strength. Moreover, while the Thermodynamic Uncertainty Relation (TUR) predicts that highly efficient engines necessarily produce strongly fluctuating power, rendering the Brownian gyrator unusable as the efficiency approaches the Carnot bound, the active magneto gyrator circumvents this constraint. Specifically, it achieves high efficiency with minimal power fluctuations, thus defying the TUR. Remarkably, the efficiency can even surpass the Carnot limit and approach 100\\%, without compromising stability. These results highlight the active magneto gyrator as a promising setup for designing stochastic heat engines that can transcend Carnot efficiency.", "url": "https://arxiv.org/abs/2610.03366", "type": "理论", "summary": "1. 该工作研究了由惯性带电活性粒子构成的主动磁回转器：粒子受限在二维非对称抛物势中，耦合两个不同温度热浴且受垂直磁场作用，并考察其功率、效率与涨落特性。\n2. 其核心卖点在于该主动磁回转器可突破被动布朗回转器的功率-效率权衡，使输出功率与效率随负载同时增大，并在高效率下保持极小功率涨落，违反热力学不确定关系（TUR），效率甚至可超越卡诺极限并接近100%。\n3. 这一结果表明活性驱动与垂直磁场可构建稳定且超越卡诺极限的随机热机，为检验TUR适用边界及设计非平衡热机提供了明确启示。", "summary_source": "deepseek", "authors": [{"name": "F. Adersh"}, {"name": "M. Sahoo"}], "featured_authors": [{"name": "F. Adersh"}, {"name": "M. Sahoo"}], "author_count": 2}, {"id": "2610.03416", "category": "cond-mat", "title": "Floquet density response in laser-assisted fast-electron scattering from solids", "abstract": "We extend the Bethe--Floquet formalism of Joachain and coworkers, originally developed for laser-assisted electron--atom collisions, to inelastic scattering of fast electrons from a many-body condensed-matter target in a time-periodic light field. At first order in the projectile--target interaction, the general Floquet--Fourier cross section separates into exact laser-dressed projectile kernels and a matrix-valued Floquet density response of the target. For spatially structured or translationally non-invariant systems, the latter is the bi-momentum Floquet structure factor; its momentum diagonal defines the Floquet generalization of the dynamic structure factor, constrained by Hermiticity, positivity, and sum rules. As a controlled realization of the general projectile kernel, an eikonal--Volkov approximation for slowly varying inhomogeneous fields yields a finite-momentum-resolution convolution of the target response. In the homogeneous-field dipole limit, the projectile kernel reduces to Bessel-function sidebands and the cross section takes the familiar Bethe--Floquet form. The Floquet density correlator separates exactly into the outer product of the pump-induced coherent mean density and connected fluctuations. In the straight-trajectory nonrecoil limit, the coherent, target-elastic sector defines the weak-coupling PINEM amplitude; repeated coherent insertions generate the PINEM Bessel ladder, with an explicit no-double-counting prescription for combining this channel with connected losses. As worked examples, we evaluate the connected, target-changing cross section analytically for a metal in the Drude and diffusive limits, recovering Bessel-weighted plasmon-loss and diffusive combs, and for a driven two-level model that exhibits off-diagonal Floquet coherences through Bessel-channel interference.", "url": "https://arxiv.org/abs/2610.03416", "type": "理论+数值", "summary": "1. 该工作将激光辅助电子-原子碰撞的 Bethe-Floquet 形式推广到含时周期光场中快电子与多体凝聚态靶的非弹性散射，并在一阶弹靶相互作用下导出 Floquet-Fourier 截面。\n2. 其核心是截面分解为激光缀饰的弹丸核与矩阵值 Floquet 密度响应，后者在非平移不变体系中表现为双动量 Floquet 结构因子，其对角元定义满足厄米性、正定性与求和规则的 Floquet 动态结构因子；均匀场偶极极限退化为 Bessel 边带与标准 Bethe-Floquet 形式。\n3. 该框架将相干 PINEM 振幅与连通损耗严格区分，并解析给出金属 Drude/扩散极限的 Bessel 加权等离激元损耗梳及驱动二能级模型的非对角 Floquet 相干，为激光辅助电子显微/谱学中的量子相干响应提供可检验预言。", "summary_source": "deepseek", "authors": [{"name": "Ferdinand Evers"}, {"name": "Sascha Schäfer"}, {"name": "Richard Korytár"}], "featured_authors": [{"name": "Ferdinand Evers"}, {"name": "Sascha Schäfer"}, {"name": "Richard Korytár"}], "author_count": 3}, {"id": "2610.03450", "category": "cond-mat", "title": "Magnetic-Order-Driven Nonlinear Photocurrents in PT-Broken Antiferromagnetic MnS2 and Altermagnetic MnSe2", "abstract": "Nonlinear photocurrent responses generally require inversion-symmetry breaking, but its origin can be magnetic rather than structural. In this study, we investigate the bulk photovoltaic effect in antiferromagnetic MnS2 and altermagnetic MnSe2, two pyrite-type semiconductors whose magnetic ordering breaks inversion symmetry P and its combination with time reversal PT, while the accompanying lattice distortion is minute. We calculate the shift current (SC) and injection current (IC) responses under linearly and circularly polarized light with and without spin-orbit coupling (SOC) and identify their symmetry-allowed tensor components using the corresponding magnetic and spin point groups, respectively. Linear SC and circular IC are symmetry-allowed in both MnS2 and MnSe2 irrespective of SOC, whereas linear IC and circular SC remain forbidden in MnS2 but become allowed in MnSe2 only when SOC is included. These results highlight the importance of SOC and the corresponding MPG analysis for a complete description of nonlinear charge photocurrents in magnetic materials. Beyond charge responses, MnSe2 supports linear shift and circular injection spin photocurrents in the nonrelativistic limit, whereas all spin-photocurrent responses are forbidden in MnS2. Our findings therefore establish inversion symmetry breaking induced by compensated magnetic order as a route to generating and controlling nonlinear photocurrents.", "url": "https://arxiv.org/abs/2610.03450", "type": "理论", "summary": "1. 该工作计算了反铁磁MnS2与交错磁MnSe2的体光伏效应，涵盖位移电流与注入电流，并比较有无自旋轨道耦合的情形。\n2. 其卖点是用磁/自旋点群给出允许张量分量，揭示SOC决定MnSe2中线性注入与圆偏振位移电流，并区分二者的自旋光电流响应。\n3. 这确立了补偿磁序诱导的反演对称破缺作为产生与调控非线性光电流的途径，并强调SOC与磁/自旋点群分析对磁性材料光电流描述的必要性。", "summary_source": "deepseek", "authors": [{"name": "Fu Li"}, {"name": "Rajyavardhan Ray"}, {"name": "Xiaoxiong Liu"}, {"name": "Babu Baijnath Prasad"}, {"name": "Chen Shen"}, {"name": "Yaqian Guo"}, {"name": "Jeroen van den Brink"}, {"name": "Hongbin Zhang"}, {"name": "Harish K. Singh"}], "featured_authors": [{"name": "Fu Li"}, {"name": "Rajyavardhan Ray"}, {"name": "Xiaoxiong Liu"}, {"name": "Jeroen van den Brink"}, {"name": "Hongbin Zhang"}, {"name": "Harish K. Singh"}], "author_count": 9}, {"id": "2610.03461", "category": "cond-mat", "title": "Complete Magnetic Hierarchy in Bichromatically Driven Unconventional Magnets", "abstract": "We establish a general framework for engineering unconventional magnetism using bichromatic driving. We identify a sharp hierarchy: for a bichromatic drive with a generic even commensurate frequency ratio, the leading continuum $q$-wave magnet generates components only up to order $q-2$, whereas lattice higher-gradient terms supply the missing $q-1$ and $q$ parities and complete the hierarchy through order $q$. We explicitly illustrate this new revised hierarchy on a $d$-wave altermagnet irradiated by a circularly-linearly polarized light, and show that the asymmetry of the driving field is transferred to the light-dressed electronic structure, producing momentum-asymmetric dispersions beyond the static and single-frequency limits. We further show that this band asymmetry is absent in the leading continuum expansion and originates from higher-gradient lattice terms that are converted by the bichromatic drive into odd-in-momentum contributions. Extending the analysis to higher-order unconventional magnets, we further obtain complete magnetic hierarchies for all $q$-parity unconventional magnets. Our results establish bichromatic Floquet driving as a general route for generating mixed-parity magnetic hierarchies and dynamically engineering unconventional magnetism.", "url": "https://arxiv.org/abs/2610.03461", "type": "理论", "summary": "1. 该工作建立了双色驱动工程非常规磁性的普适框架，并给出所有 q 宇称非常规磁体的完整磁层级。\n2. 其核心是：偶数公度频率比下，连续介质领头 q 波磁体仅到 q-2 阶，晶格高阶梯度项补足 q-1、q 宇称，并在 d 波交替磁体中产生动量不对称光缀饰色散。\n3. 这确立了双色弗洛凯驱动作为产生混合宇称磁性层级与动态调控非常规磁性的通用途径，可启发后续光控与高阶磁体研究。", "summary_source": "deepseek", "authors": [{"name": "Pei-Hao Fu"}, {"name": "Sayed Ali Akbar Ghorash"}], "featured_authors": [{"name": "Pei-Hao Fu"}, {"name": "Sayed Ali Akbar Ghorash"}], "author_count": 2}, {"id": "2610.03478", "category": "cond-mat", "title": "Minimax entropy production for arbitrary processes", "abstract": "For any physical process, varying the initial distribution over its states will change the resulting expected entropy production (EP). An initial distribution that minimizes the EP of a particular process is called the prior of that process. Varying the microphysical details of the process will change its this http URL consider the following question: if an engineer wants to design a system to implement a given map, what prior should they design into the system to minimize the EP for the worst-case actual distribution? We derive the closed-form solution to this problem when the map is deterministic. We also show that for stochastic maps, a worst-case actual distribution can always be chosen to be a point mass on a single state, and that the associated minimax prior resembles a Boltzmann-Gibbs equation, and can be found by a globally convergent numerical algorithm. We also show that the associated minimax mismatch cost is the maximum uncertainty about the input that remains after observing the output. Finally, we extend the analysis to the continuous-time regime, showing that the minimax instantaneous mismatch-cost diverges, while the corresponding finite-time minimax mismatch cost has a universal short-time scaling set by the largest escape rate of the dynamics.", "url": "https://arxiv.org/abs/2610.03478", "type": "理论+数值", "summary": "1. 该工作研究任意物理过程中初始分布变化引起的期望熵产，提出以最坏实际输入分布为准则的极小极大熵产问题，并分别求解决策映射为确定性及随机映射时的最优先验。\n2. 其核心结果给出确定性映射的闭式解；对随机映射证明最坏输入可退化为单状态点质量，对应极小极大先验满足类玻尔兹曼-吉布斯形式并可由全局收敛算法求得，同时将其失配代价解释为观测输出后关于输入的最大剩余不确定性。\n3. 连续时间下瞬时极小极大失配代价发散，而有限时间对应量在短时呈现由动力学最大逃逸速率设定的普适标度，这为设计低耗散系统与理解信息—热力学权衡提供了可检验的约束。", "summary_source": "deepseek", "authors": [{"name": "Mahran Yousef"}, {"name": "Ben Ansbacher"}, {"name": "David H. Wolpert"}], "featured_authors": [{"name": "Mahran Yousef"}, {"name": "Ben Ansbacher"}, {"name": "David H. Wolpert"}], "author_count": 3}, {"id": "2610.03513", "category": "cond-mat", "title": "Melting phase diagram of the two-dimensional electron solid in a perpendicular magnetic field", "abstract": "We determine the thermal melting phase diagram of the electron solid by measuring the onset density of the double-threshold voltage-current curves in the insulating state in the ultra-high mobility two-dimensional electron system in SiGe/Si/SiGe quantum wells at different temperatures in perpendicular magnetic fields. The introduction of a magnetic field leads to a considerable increase in the onset density, which is strongest at the lowest temperatures and decreases with increasing temperature, and the melting temperature increases with magnetic field. These data are in agreement with theoretical predictions. Unexpectedly, the melting temperature as a function of electron density in a fixed magnetic field reveals a plateau, which can be interpreted in terms of resonance modes in the crystallites.", "url": "https://arxiv.org/abs/2610.03513", "type": "理论+数值", "summary": "1. 该工作通过测量硅锗/硅/硅锗量子阱中超高迁移率二维电子系统绝缘态双阈值电压-电流曲线的起始密度，在不同温度和垂直磁场下确定了电子固体的热熔化相图。\n2. 核心物理发现是垂直磁场显著提高熔化起始密度，低温下增强最明显并随温度升高而减弱，且熔化温度随磁场升高；固定磁场下熔化温度随电子密度呈平台，可归因于微晶中的共振模式。\n3. 这些数据与理论预测相符，且平台特征可解释为微晶中的共振模式，为利用磁场调控二维电子固体熔化及探测微晶共振提供线索。", "summary_source": "deepseek", "authors": [{"name": "M. Yu. Melnikov"}, {"name": "D. G. Smirnov"}, {"name": "A. A. Shashkin"}, {"name": "S.-H. Huang"}, {"name": "C.W. Liu"}, {"name": "S. V. Kravchenko"}], "featured_authors": [{"name": "M. Yu. Melnikov"}, {"name": "D. G. Smirnov"}, {"name": "A. A. Shashkin"}, {"name": "S.-H. Huang"}, {"name": "C.W. Liu"}, {"name": "S. V. Kravchenko"}], "author_count": 6}, {"id": "2610.03569", "category": "cond-mat", "title": "Consistent perturbation expansions in screened interactions", "abstract": "Many-body perturbation theory is a powerful framework to calculate spectroscopic quantities, as well as the total energy. However, the field suffers from the fact that different flavors of approximations lead to a wide range of results. We present several in principle exact expansions and discuss how to use them consistently. We concentrate on the first two orders in the respective screened Coulomb interaction. Of special interest is a consistent expansion around the Kohn-Sham system. We illustrate the performance of the various choices using the symmetric Hubbard dimer over a wide range of correlation strength. In particular, the expansion based on exact Kohn-Sham ingredients stands out as a promising route towards good energies and good spectra.", "url": "https://arxiv.org/abs/2610.03569", "type": "理论", "summary": "1. 该工作给出了若干原则上严格的屏蔽库仑相互作用多体微扰展开，聚焦前两阶，并讨论如何在不同近似间保持一致，以对称哈伯德二聚体检验其表现。\n2. 其核心卖点是围绕科恩-沈体系的相容展开；采用精确科恩-沈组分时，该方案在宽关联强度范围内同时给出良好能量与谱学结果，缓解近似选择导致的结果分散。\n3. 这为统一总能量与谱学计算提供了可行路线，并提示以精确科恩-沈为起点的屏蔽相互作用展开值得在更真实体系中进一步检验。", "summary_source": "deepseek", "authors": [{"name": "Abdallah Arthur El Sahili"}, {"name": "Francesco Sottile"}, {"name": "Lucia Reining"}], "featured_authors": [{"name": "Abdallah Arthur El Sahili"}, {"name": "Francesco Sottile"}, {"name": "Lucia Reining"}], "author_count": 3}, {"id": "2610.03610", "category": "cond-mat", "title": "Decohering Kitaev's Sixteenfold Way: A Holographic Approach", "abstract": "We study anyon decoherence in 2D topological order, with the fermion decoherence in Kitaev's sixteenfold way as explicit examples. The sixteenfold way includes chiral topological phases, which are believed to admit no commuting projector Hamiltonian, making it challenging to study their decoherence directly. We further conjecture the density matrix produced by this decoherence induced phase transition can be obtained by a three-step procedure: first lift the topological order to its Walker-Wang model, followed by a transition to another Walker-Wang model, and finally trace over the bulk degrees of freedom. This establishes a connection between the decoherence of a topological order and a pure state phase transition in its 3D counterpart. Many examples are given. In particular, we show that decohering the fermion in each of the sixteen states always yields an intrinsically mixed-state topological order, a consequence of the fact the corresponding 3D bulk always transits into the 3D fermionic toric code (fTC). Our result suggests a systematic method for studying anyon decoherence in chiral topological orders at the level of commuting projector Hamiltonians.", "url": "https://arxiv.org/abs/2610.03610", "type": "理论", "summary": "1. 该工作以Kitaev十六重态中的费米子退相干为例，研究二维拓扑序中的任意子退相干，并特别针对缺乏对易投影算符哈密顿量的手性拓扑相。\n2. 核心卖点是提出全息三步方案：先将拓扑序提升为Walker-Wang模型，再跃迁至另一Walker-Wang模型，最后对体自由度求迹，从而把二维退相干映射为三维纯态相变。\n3. 该结果说明十六种情形中费米子退相干后均产生内禀混合态拓扑序，其原因是相应三维体均跃迁至三维费米环面码(fTC)，并暗示可在对易投影算符层面系统研究手性拓扑序退相干。", "summary_source": "deepseek", "authors": [{"name": "Shuyu Zhang"}, {"name": "Linhao Li"}, {"name": "Zhen Bi"}, {"name": "Tzu-Chieh Wei"}, {"name": "Zijian Song"}], "featured_authors": [{"name": "Shuyu Zhang"}, {"name": "Linhao Li"}, {"name": "Zhen Bi"}, {"name": "Tzu-Chieh Wei"}, {"name": "Zijian Song"}], "author_count": 5}, {"id": "2610.03613", "category": "cond-mat", "title": "Surface Charge--Potential Relation for Spherical Particles in Electrolyte Solutions", "abstract": "Predicting the relationship between surface charge density and electrostatic potential for spherical particles remains a fundamental challenge in colloid science. Because the governing non-linear Poisson--Boltzmann equation lacks a general exact analytical solution, researchers typically rely on numerical calculations or various semi-empirical approximations. In this paper, we overcome these limitations by developing a dual-asymptotic framework that provides explicit, closed-form expressions for this surface charge--potential relationship across the entire spectrum of particle curvature. For weakly curved systems, where the Debye length $\\lambda_D$ is much smaller than the particle radius $R$ ($\\lambda_D/R \\ll 1$), a formal mathematical derivation rigorously establishes the Ohshima--Healy--White formula as an exact regular perturbation expansion. Conversely, for highly curved spheres ($R/\\lambda_D \\ll 1$), we employ singular perturbation analysis using the scaled particle radius as the small parameter. This approach provides a first-principles mathematical justification for the spherical Debye--Hückel theory, proving that its leading-order expansion remains asymptotically exact within the full non-linear Poisson--Boltzmann framework due to the geometric deactivation of non-linearity. Crucially, we map the exact limits of this geometric regulation, demonstrating how non-linear screening re-emerges as the particle radius increases, with the breakdown threshold governed by the interplay between curvature and surface charge density.", "url": "https://arxiv.org/abs/2610.03613", "type": "理论+数值", "summary": "1. 该工作针对电解质溶液中球形颗粒的表面电荷密度与静电势关系，发展双渐近框架，给出覆盖全曲率谱的显式闭式表达式。\n2. 其要点在于：弱曲率下用正则微扰严格证明Ohshima-Healy-White公式为精确展开；强曲率下以标度半径为小量作奇异微扰，从第一性原理证明球形Debye-Hückel理论首阶在完整非线性Poisson-Boltzmann框架中渐近精确，源于非线性的几何失活。\n3. 该框架进一步标定几何调控的精确界限，揭示非线性屏蔽随颗粒半径增大而重新出现，其失效阈值由曲率与表面电荷密度共同决定。", "summary_source": "deepseek", "authors": [{"name": "Olga I. Vinogradova"}, {"name": "Elena F. Silkina"}], "featured_authors": [{"name": "Olga I. Vinogradova"}, {"name": "Elena F. Silkina"}], "author_count": 2}, {"id": "2610.02305", "category": "hep-th", "title": "Blackened BPS: the end of the thermal BMN branch", "abstract": "We study the thermodynamics of the BMN matrix model at large $N$ and strong coupling, using its dual black holes in eleven-dimensional supergravity. Within the consistent truncation to two-dimensional $SO(9)$ gauged supergravity, the static $SO(3)\\times SO(6)$-invariant black holes solve ordinary differential equations, which we solve to high precision. We formulate holographic renormalisation for this truncation and fix the finite counterterms using a supersymmetric solution. This gives the energy, the entropy and the response to the BMN mass independently, and we verify the first law and the Smarr relation along the branch. The thermal branch ends at a critical value of $\\mu/T$, which power-law fits place at $4\\pi$ with an estimated uncertainty below $10^{-10}$. The first-order transition inferred in earlier work, where the free energy was reconstructed from the entropy, does not survive, and an independent eleven-dimensional calculation agrees with ours over the range it covers. Instead, the free energy, the entropy and the mass response approach their values in the confined phase continuously at the end of the branch, where the solutions become singular. If this branch remains the dominant one up to its end point, the transition therefore coincides with the singularity. Near the end of the branch, the scalar fields follow a solution of the supersymmetric first-order equations, while the metric carries a nontrivial blackening factor. The horizon develops a neck whose profile is universal, with radii growing as the $2/5$ power of the distance from the pinch. Within the range we resolve, the geometry is not that of the Ricci-flat double cone which governs mergers of vacuum black holes.", "url": "https://arxiv.org/abs/2610.02305", "type": "理论", "summary": "1. 该工作在大N强耦合下用十一维超引力对偶黑洞研究BMN矩阵模型热力学，并在二维SO(9)规范超引力截断中高精度求解SO(3)×SO(6)不变静态黑洞。\n2. 其卖点是通过全息重整化独立定出能量、熵和BMN质量响应，验证第一定律与Smarr关系，并将热支终点定位于μ/T=4π。\n3. 该结果否定先前的一阶相变图像，并表明若该热支主导至终点则相变与奇点重合，近终点出现普适颈状几何而非Ricci平坦双锥。", "summary_source": "deepseek", "authors": [{"name": "Jorge E. Santos"}], "featured_authors": [{"name": "Jorge E. Santos"}], "author_count": 1}, {"id": "2610.02306", "category": "hep-th", "title": "Temperature and Moduli Independence of the Supersymmetric Index from Gravity", "abstract": "The supersymmetric index, which gives a signed count of the microstates of black holes, can be computed directly from a gravitational path integral with appropriate boundary conditions. From general arguments based on the supersymmetry algebra, the index is expected to be independent of the temperature and, away from walls of marginal stability, of the asymptotic values of the scalar moduli. On the gravity side, this has been verified by explicit computations in many examples, but a general proof is lacking even at the classical level. We fill this gap by showing that in any four-dimensional supergravity theory with $\\mathcal{N} \\geq 2$ supersymmetry in asymptotically flat space-time, the classical contribution to the index from each supersymmetric saddle is independent of both. The argument uses only the behavior of the solution and of the Killing spinor equations near infinity. The result therefore holds in the presence of arbitrary higher-derivative corrections and for multi-centered black hole configurations. In particular, moduli independence follows without appeal to the attractor mechanism, which relies on the near-horizon geometry.", "url": "https://arxiv.org/abs/2610.02306", "type": "理论", "summary": "1. 该工作为四维N≥2渐近平坦超引力填补空白，证明每个超对称鞍点对指数的经典贡献不依赖温度与标量模。\n2. 其技术核心是仅用无穷远处解与Killing旋量方程，故结论对高阶导数修正、多中心组态成立且不诉诸吸引子机制。\n3. 该结论表明超对称指数对温度与模的独立性可由无穷远数据保证，而非依赖近地平线吸引子，从而可指导更一般黑洞组态的计算。", "summary_source": "deepseek", "authors": [{"name": "Raghu Mahajan"}, {"name": "Ashoke Sen"}], "featured_authors": [{"name": "Raghu Mahajan"}, {"name": "Ashoke Sen"}], "author_count": 2}, {"id": "2610.02307", "category": "hep-th", "title": "A Semiclassical Entanglement Wedge in Double-Scaled SYK", "abstract": "We study the entanglement structure of partially entangled thermal states in double-scaled SYK , allowing flavor degrees of freedom carried by matter insertions to be in an arbitrary mixed state. In the semiclassical limit, followed by the heavy-probe limit, our replica calculation gives a Faulkner--Lewkowycz--Maldacena formula: the boundary entropy decomposes into an `area' term (independent of the flavor state) and the bulk matter entropy in a corresponding entanglement wedge. Varying the Euclidean locations of the operator insertions produces sharp transitions in the boundary entropy, which we interpret as individual matter excitations crossing the boundary of the wedge and hence as evidence for a sharply defined entanglement wedge. To derive this result, we analyze the semiclassical behavior of general Euclidean $2n$-point functions and give a probabilistic proof of their factorization into sums over products of two-point functions. We also give a complementary derivation from exact spectral representations, using the semiclassical behavior of the quantum $6j$-symbol.", "url": "https://arxiv.org/abs/2610.02307", "type": "理论", "summary": "1. 该工作研究双标度SYK中部分纠缠热态的纠缠结构，允许物质插入携带的味自由度处于任意混合态，并用replica计算给出边界熵。\n2. 其卖点在于半经典极限下得到FLM公式：边界熵分为与味态无关的面积项与楔内体物质熵；移动插入点使熵发生尖锐跃变，对应物质激发穿越楔边界。\n3. 这为DSSYK中纠缠楔的清晰定义提供证据，并借2n点函数因子化的概率证明与量子6j符号半经典行为给出互补推导。", "summary_source": "deepseek", "authors": [{"name": "Xi Dong"}, {"name": "Jiuci Xu"}], "featured_authors": [{"name": "Xi Dong"}, {"name": "Jiuci Xu"}], "author_count": 2}, {"id": "2610.02309", "category": "hep-th", "title": "Entanglement Requires Fluctuations at Conformal Interfaces", "abstract": "We conjecture that the universal logarithmic coefficient for capacity of entanglement $c_{\\mathrm{cap}}$ is bounded below by the corresponding entropy coefficient $c_{\\mathrm{eff}}$ at conformal interfaces. We prove the bound in free boson and fermion CFTs and in holographic models with interface branes, and establish it using defect perturbation theory. Numerical calculations at interacting interfaces between the tricritical Ising and Ising CFTs further support the bound. Despite this constraint, capacity provides independent interface data. We construct interfaces with identical entropy and energy transmission coefficients but different capacity coefficients, and show that capacity can even increase as entropy decreases.", "url": "https://arxiv.org/abs/2610.02309", "type": "理论", "summary": "1. 该文提出共形界面上纠缠容量普适对数系数受熵对数系数下界约束的猜想，并在自由玻色/费米共形场论、全息界面膜模型及三重临界伊辛-伊辛界面中检验。\n2. 其核心卖点是用缺陷微扰论证明该不等式，并构造熵与能量透射系数相同但容量系数不同的界面，显示容量提供独立界面数据。\n3. 这表明容量虽受熵下界限制，仍可作为独立探针，甚至在熵减小时增大，为界面纠缠分类与检验提供新视角。", "summary_source": "deepseek", "authors": [{"name": "Yuya Kusuki"}, {"name": "Kosei Suzuyama"}, {"name": "Yin Tang"}], "featured_authors": [{"name": "Yuya Kusuki"}, {"name": "Kosei Suzuyama"}, {"name": "Yin Tang"}], "author_count": 3}, {"id": "2610.02340", "category": "hep-th", "title": "Holographic thermal propagator at finite energy from modularity and triality", "abstract": "We extend the modularity-based approach of arXiv:2509.02226 for the holographic thermal propagator to the physically relevant case of nonzero energy $\\omega$. Via the AGT correspondence, the problem is mapped to $\\mathcal{N}=2$ $SU(2)$ gauge theory with $N_f=4$ hypermultiplets. Turning on $\\omega$ activates all four hypermultiplet masses, so that the full $SO(8)$ flavor symmetry constrains the low-temperature expansion, rather than the subgroup left unbroken at $\\omega=0$. As a result, the building blocks of the expansion are no longer just Eisenstein series but also Jacobi theta functions. We use this fact, together with the Molien series of the resulting invariant ring and the modular anomaly equation, to fix the low-temperature expansion coefficients order by order, matching only a finite number of terms in the Zamolodchikov's $q$-recursion at each order. We obtain the low-temperature expansion of the propagator and find agreement with the result of a completely different method, the near-boundary expansion of the bulk wave equation.", "url": "https://arxiv.org/abs/2610.02340", "type": "理论", "summary": "1. 该文将基于模性的全息热传播子方法推广至非零能量 ω，并借助 AGT 对应映射到 N=2 SU(2) 规范理论加四个超多重态。\n2. 其技术核心是 ω 激活全部四个超多重态质量，使完整 SO(8) 味对称性而非 ω=0 子群约束低温展开，并借助 Molien 级数、模反常方程与雅可比 θ 函数逐阶定系数。\n3. 所得低温展开与体波方程近边界展开这一独立方法一致，为有限能量全息热传播子提供了可检验的模性计算框架。", "summary_source": "deepseek", "authors": [{"name": "Borut Bajc"}, {"name": "Mendrit Latifi"}, {"name": "Katarina Trailović"}], "featured_authors": [{"name": "Borut Bajc"}, {"name": "Mendrit Latifi"}, {"name": "Katarina Trailović"}], "author_count": 3}, {"id": "2610.02406", "category": "hep-th", "title": "Where in the Island is the Information?", "abstract": "The Island Formula for Quantum Extremal Surfaces of large AdS black holes, which are made to evaporate by coupling the CFT of the AdS/CFT correspondence to an external system, demonstrates that the space time picture can reproduce the quantum mechanically required Page curve of the CFT/bath system if a region in the interior of the black hole has become entangled with the external radiation by the Page time. In an effective quantum field theory (EFT) description in ``nice slice\" coordinates, this appears to imply paradoxical entanglement between degrees of freedom that have been causally disconnected since long before the Page time. We will give two arguments that all of the quantum information in the island is in fact concentrated in a tiny space-like portion of the island very close to the black hole horizon at the Page time. The first applies the covariant entropy bound\\cite{fsb} (CEB) to the causal diamonds of geodesics originating on the space-like region that becomes the island, but on a time slice just before the Page time. All points on the island except those in a stretched horizon region very close to the horizon have entropy bounds that are tiny fractions of the black hole entropy. The second argument uses standard quantum statistical mechanics combined with the tensor network renormalization group regularization of CFT to argue that the wave function of a typical pure state in the microcanonical evaporating black hole always has most of its probability concentrated in a small range of wavelengths corresponding to a small range of radii in the dual tensor network/AdS slice.", "url": "https://arxiv.org/abs/2610.02406", "type": "理论", "summary": "1. 该工作研究蒸发中的大AdS黑洞岛内量子信息究竟位于何处，结合协变熵界与张量网络重整化群给出定位。\n2. 其卖点是用协变熵界证明除伸展视界薄层外岛区熵界极小，并以张量网络重整化群表明典型纯态概率集中于小波长/半径范围。\n3. 这暗示岛内信息在Page时刻主要定域于视界附近，为理解岛公式、EFT因果悖论及全息重构提供微观约束。", "summary_source": "deepseek", "authors": [{"name": "T. Banks"}], "featured_authors": [{"name": "T. Banks"}], "author_count": 1}, {"id": "2610.02415", "category": "hep-th", "title": "Non-linear electrodynamics emerging from a Lorentz-symmetry violation scenario", "abstract": "The effective action at one-loop for the quantum electrodynamics (QED) in the presence of background vectors and tensors that break the Lorentz symmetry is calculated in this work. We highlight that just the Lorentz symmetry violation through the Dirac matrices in the fermionic sector is considered since investigations in others sectors of the extended QED has been explored in recent papers. Using the proper time method, we show that some background vectors and tensors do not contribute to the effective action at one-loop and in the linear approximation. Thereby, only two background tensors contribute to the effective action at one-loop for small components of these tensors, and that a new combination of cubic and quartic non-linear electrodynamics emerge in the weak field regime.", "url": "https://arxiv.org/abs/2610.02415", "type": "理论", "summary": "1. 该工作计算了在破坏洛伦兹对称性的背景矢量和张量存在下量子电动力学的单圈有效作用量，且仅考虑费米子扇区中通过狄拉克矩阵引入的洛伦兹破缺。\n2. 采用固有时方法，作者表明若干背景矢量与张量在单圈及线性近似下不贡献有效作用量，只有两个背景张量在小分量时起作用，并在弱场区产生新的三次与四次非线性电动力学组合。\n3. 这提示洛伦兹破缺可作为生成非线性电动力学修正的机制，为在弱场条件下检验此类量子真空效应提供明确方向。", "summary_source": "deepseek", "authors": [{"name": "M. J. Neves"}, {"name": "G. Peruzzo"}], "featured_authors": [{"name": "M. J. Neves"}, {"name": "G. Peruzzo"}], "author_count": 2}, {"id": "2610.02423", "category": "hep-th", "title": "Note on the Pure State of Old Black Holes in Some Models of Asymptotically Flat Quantum Gravity", "abstract": "We analyze two old models of black holes to see whether they realize the AdS/CFT paradigm of ``multiple representations of bulk data by boundary states that differ only in the expectation value of exponentially complex operators\" . We find that the explanation of the firewall paradox in these models is much simpler and corresponds to the naive way entanglement is resolved when small constituents escape from a complex chaotic quantum system. The real issue is that the quantum field theory (QFT) picture of the stat
