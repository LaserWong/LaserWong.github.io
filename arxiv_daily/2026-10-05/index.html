nd distance $d\\geq 22$, exceeding both the rate and distance of the $[[288,12,18]]$ two-gross bivariate bicycle code while using mostly nearest-neighbor gates within planar modules, and implying an over $30\\times$ overhead reduction relative to surface codes. We develop fault-tolerant walking circuits for implementing logic via code automorphisms, which we co-design with low-weight, highly symmetrical logical bases and a modular extractor system that is $\\approx 4.5\\times$ smaller than the code itself. Combining these methods, our modular memory can be used as dense storage in a universal fault-tolerant architecture, unlocking the efficiency of high-rate codes without sacrificing the fabrication advantages of planar modules.", "url": "https://arxiv.org/abs/2610.03682", "type": "理论+数值", "summary": "1. 该工作将量子处理器划分为平面模块，并用稀疏静态的边界连接构造模块化双曲曲面码与颜色码，基于新一类半双曲码完成电路级模拟。\n2. 其卖点是在模块间缝隙错误率升高时仍可将物理量子比特开销较平面表面码降低十倍以上，并给出k/n=1/16、d≥22的编码，速率与距离均超过[[288,12,18]]双变量自行车码，且提取器体积仅为码的约4.5倍。\n3. 这表明高码率码可作为通用容错架构中的密集存储，在不牺牲平面模块制备优势的前提下实现三十倍以上的开销缩减，值得后续容错逻辑方案借鉴。", "summary_source": "deepseek", "authors": [{"name": "Oscar Higgott"}, {"name": "Hasan Sayginel"}, {"name": "Francisco J.H. Heras"}, {"name": "Zhiyang He"}, {"name": "Tomas Jochym-O'Connor"}, {"name": "Andrew W. Senior"}, {"name": "Lei M. Zhang"}, {"name": "Thomas Edlich"}, {"name": "James S. Spencer"}, {"name": "Matt McEwen"}, {"name": "Craig Gidney"}, {"name": "Johannes Bausch"}, {"name": "Pushmeet Kohli"}, {"name": "Hartmut Neven"}], "featured_authors": [{"name": "Oscar Higgott"}, {"name": "Hasan Sayginel"}, {"name": "Francisco J.H. Heras"}, {"name": "Johannes Bausch"}, {"name": "Pushmeet Kohli"}, {"name": "Hartmut Neven"}], "author_count": 14}, {"id": "2610.03683", "category": "quant-ph", "title": "Modified logarithmic Sobolev inequality for 1D non-commuting Hamiltonians", "abstract": "Given a finite-range, non-commuting Hamiltonian on a 1D chain of finite spins, we prove a modified logarithmic Sobolev inequality with constant $\\Omega(1/\\log n)$ for the heat-bath dynamics, a quasi-local Gibbs sampler, and for the regularised heat-bath dynamics. This implies rapid mixing of both samplers towards the Gibbs state in relative entropy and trace norm, with mixing times of order $\\mathcal{O}(\\log n\\cdot \\log(n/\\epsilon))$. The interactions may be spatially inhomogeneous. The proof combines weak quasi-factorisation of relative entropy, decay-of-correlation estimates, a uniform conditional local gap, and a buffered comparison between conditional entropy and quadratic energy. The resulting bounded entropy defect is removed using the global gap. To the best of our knowledge, this is the first proof of MLSI in the non-commuting regime.", "url": "https://arxiv.org/abs/2610.03683", "type": "理论", "summary": "1. 该工作针对一维有限自旋链上的有限程非对易哈密顿量，证明了热浴动力学、准局域吉布斯采样器及正则化热浴动力学的修正对数索博列夫不等式，常数约为 Ω(1/log n)。\n2. 其核心卖点是首次在非对易情形建立该不等式，并由此推出采样器以相对熵和迹范数快速收敛至吉布斯态，混合时间为 O(log n·log(n/ε))，且允许相互作用空间不均匀。\n3. 证明融合相对熵弱准因子分解、关联衰减估计、均匀条件局域能隙以及条件熵与二次能量的缓冲比较，再用全局能隙消除熵缺陷，为更复杂非对易体系的混合性与吉布斯采样分析提供了可循路径。", "summary_source": "deepseek", "authors": [{"name": "Ángela Capel"}, {"name": "David Pérez-García"}, {"name": "Matteo Scandi"}], "featured_authors": [{"name": "Ángela Capel"}, {"name": "David Pérez-García"}, {"name": "Matteo Scandi"}], "author_count": 3}, {"id": "2610.03686", "category": "quant-ph", "title": "Efficient Block Encoding of Structured Hamiltonians by Separating Where and What", "abstract": "Fault-tolerant block encodings of structured Hamiltonians can reduce their non-Clifford cost in SELECT by selecting where an operator acts separately from what is applied. We construct permute-act-unpermute circuits whose CSWAP networks exploit the support geometry: a selected support is brought to a fixed target register, a shared local circuit acts there, and the permutation is undone. For supports of fixed size, the $T$ count of SELECT then grows with the system size rather than with the number of terms, without requiring translational symmetry or factorised coefficients. For two-site supports, we establish and attain the minimum CSWAP count within address-controlled networks of site transpositions. Compiled for Pauli terms, these circuits use $8SN+O(\\log N)$ $T$ gates with $O(\\log N)$ permutation work qubits, where $N$ is the number of system qubits and $S$ is determined by the support geometry, with $S=1$ for nearest-neighbour interactions and $S=3/2$ for all-to-all pairs. We also introduce a bridged CSWAP that retains and repairs a temporary AND across the target action. When the repair is Clifford, it halves the $T$ count of a matched forward-inverse CSWAP pair at the cost of one retained work qubit. For a Heisenberg ring, the complete block-encoding query reduces the $T$ count by a factor approaching 3 as the system size grows. For a five-orbital Anderson impurity model, which combines nearest-neighbour and all-to-all support geometries, the reduction is about 1.7 at large bath sizes. Both comparisons use the lowest-cost compiled baselines considered, at unchanged block-encoding normalisation and comparable peak ancilla counts.", "url": "https://arxiv.org/abs/2610.03686", "type": "理论", "summary": "1. 结构化哈密顿量的容错块编码可以通过选择操作符与应用程序分开的操作位置来减少 SELECT 中的非 Clifford 成本。\n2. 当修复是 Clifford 时，它会将匹配的正向-反向 CSWAP 对的 $T$ 计数减半，但代价是一个保留的工作量子位。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Alessandro Summer"}, {"name": "François Jamet"}], "featured_authors": [{"name": "Alessandro Summer"}, {"name": "François Jamet"}], "author_count": 2}, {"id": "2610.03690", "category": "quant-ph", "title": "Universal Bounds for Out-of-Distribution Unitary Learning", "abstract": "How much can the action of an unknown unitary dynamics on one family of states reveal about its action elsewhere? We develop a general framework for out-of-distribution quantum dynamics learning based on the first and second moments of the input distribution. These define a notion of the bias and expressivity of an ensemble, which together control generalization between arbitrary pure-state training and testing distributions. Our framework shows that only studying the action of a unitary on random real states can learn its action on random complex states, that tensor products of unbiased pure-state ensembles preserve expressivity, and that single-qubit risks are independent of bias. It also recovers earlier locally scrambling results as loose special cases and yields tight product-to-Haar bounds. We conclude with a series of no-go results and limited generalization bounds for learning certain channels, which further serve to underscore the distinctive role of unitarity in enabling out-of-distribution generalization.", "url": "https://arxiv.org/abs/2610.03690", "type": "理论", "summary": "1. 该工作建立了基于输入分布一阶与二阶矩的分布外量子动力学学习框架，用集合的偏置与表达力刻画任意纯态训练与测试分布之间的泛化。\n2. 其卖点在于揭示偏置与表达力共同控制泛化：随机实态上的学习可迁移至随机复态，无偏纯态集合的张量积保持表达力，单量子比特风险与偏置无关，并恢复局部加扰为宽松特例且给出紧的乘积到哈尔测度界。\n3. 对某些信道学习的不可行结果与受限泛化界进一步凸显幺正性在分布外泛化中的独特作用，为判断量子动力学学习何时可迁移以及一般信道学习的根本限制提供了启示。", "summary_source": "deepseek", "authors": [{"name": "Joachim Favre"}, {"name": "Armando Angrisani"}, {"name": "Zoë Holmes"}], "featured_authors": [{"name": "Joachim Favre"}, {"name": "Armando Angrisani"}, {"name": "Zoë Holmes"}], "author_count": 3}, {"id": "2610.03696", "category": "quant-ph", "title": "Maximum-Entropy Extension of Quantum Correlation Functions from Short Real-Time Dynamics", "abstract": "Correlation functions are central to understanding the behavior of quantum systems, with their spectra giving direct access to quasiparticle and collective excitations. However, the long-time evolution required for sufficient spectral resolution is challenging to reach for both classical and quantum simulations. In this work, we introduce a principled approach for extending time series of quantum correlation functions and reconstructing their spectral densities, based on their connection with covariance sequences of stationary stochastic processes. This connection enables us to apply Burg's maximum-entropy principle to find the least-committal extension compatible with the measured values of the correlation function, which corresponds to an all-pole autoregressive model whose coefficients solve a set of Yule--Walker equations. The resulting extension is positive semi-definite by construction, guaranteeing the positivity of the spectrum and the automatic satisfaction of its total spectral weight sum rule. The approach applies to both scalar and matrix-valued correlation functions, including those with highly structured or continuous spectra. The generalization to the matrix case makes it possible to trade simulation time for additional measured correlation functions, enabling accurate time-series extension and spectral reconstruction from short-time data, even in the presence of noise.", "url": "https://arxiv.org/abs/2610.03696", "type": "理论+数值", "summary": "1. 该工作提出基于平稳随机过程协方差序列与量子关联函数时间序列的对应，利用最大熵原理从短时实时动力学数据外推量子关联函数并重建谱密度。\n2. 其核心在于将外推表述为满足尤尔-沃克方程的全极点自回归模型，使延拓天然半正定，从而保证谱正定并自动满足总谱权重求和规则，同时可推广至矩阵值关联函数。\n3. 这为短时量子模拟数据的高分辨谱重建提供可行途径，并允许用额外测量的关联函数换取模拟时间，在噪声下仍具应用潜力。", "summary_source": "deepseek", "authors": [{"name": "Filippo Maria Gambetta"}, {"name": "Sabrina Yue Wang"}, {"name": "Raul A. Santos"}], "featured_authors": [{"name": "Filippo Maria Gambetta"}, {"name": "Sabrina Yue Wang"}, {"name": "Raul A. Santos"}], "author_count": 3}, {"id": "2610.03697", "category": "quant-ph", "title": "On The Complexity of Redundancy-Free Quantum Hamiltonians", "abstract": "We consider a class of redudancy-free Hamiltonians, which are those where the trace vanishes for any product of Hamiltonian terms in which at least one term appears an odd number of times. This includes Hamiltonians which are sums of products of Paulis with no relations between them. These Hamiltonians arise naturally in Hamiltonian Decoded Quantum Interferometry, which separates the hardness of preparing quantum states into two steps: a classical decoding step, and a step preparing the thermofield double state of such a redundancy-free Hamiltonian. We focus on the hardness of these Hamiltonians, both for intrinsic interest and to understand the complexity of the state preparation step in Hamiltonian DQI. We present several results showing that the problem becomes easy at quadratically lower temperature than for a general Hamiltonian, with the complexity at given inverse temperature $\\beta$ depending on $\\beta^2 d$, where $d$ is the degree of the anticommutation graph. We give an efficient classical algorithm for small $\\beta^2 d$ to approximate the partition function, while for large $\\beta^2 d$ we show that approximating the partition function is NP-hard. To this end, we introduce what we call an anticommutation glass, where frustration arises purely from anticommutation relations. We give a subexponential time quantum algorithm to prepare the thermofield state for small $\\beta^2 d$, and present some results toward a polynomial time algorithm based on the Feiguin-Klich Hamiltonian. As a result of possible independent interest, we show that this Hamiltonian leads to a polynomial time algorithm for preparing thermofield double states of general Hamiltonians on an interaction graph of degree $d$ for $\\beta\\lesssim 1/d$. Finally, we show that estimating the ground state energy of redundancy-free Hamiltonians is QMA-complete.", "url": "https://arxiv.org/abs/2610.03697", "type": "理论+数值", "summary": "1. 该工作研究无冗余哈密顿量的复杂度——其中任意至少一项出现奇数次的乘积之迹为零——并将其与哈密顿量解码量子干涉（DQI）中热场双态制备步骤的复杂性相联系。\n2. 核心结果指出复杂度由β²d决定（d为反交换图的度）：小β²d时存在高效经典算法近似配分函数，大β²d时该问题为NP难，并提出阻挫纯源于反交换关系的\"反交换玻璃\"。\n3. 此外，小β²d下可给出制备热场态的亚指数量子算法，并基于Feiguin-Klich哈密顿量在度d图上β≲1/d时将热场双态制备化为多项式时间，同时证明无冗余哈密顿量基态能量估计为QMA完全。", "summary_source": "deepseek", "authors": [{"name": "Matthew B. Hastings"}, {"name": "Alexander Schmidhuber"}], "featured_authors": [{"name": "Matthew B. Hastings"}, {"name": "Alexander Schmidhuber"}], "author_count": 2}, {"id": "2610.03699", "category": "quant-ph", "title": "Exponential lower bounds on the fermionic Gaussian rank of magic states and the bosonic coherent state rank of Fock states", "abstract": "Recent algorithms for classical simulation of quantum mechanics have runtime whose superpolynomial component is given by a linear dependence on the number of terms required to write large tensor products of certain \"magic\" states as superpositions of \"free\" states (which may be stabilizer states, fermionic Gaussian states or others). Surprisingly little is known about the number of terms in such decompositions, called ranks (e.g. the stabilizer rank, fermionic-Gaussian rank etc.). For complexity theoretic reasons they are expected to grow exponentially in the number of tensor factors but, while exponential upper bounds are known for both the stabilizer and fermionic-Gaussian rank of magic states; the best known lower bounds on the stabiliser rank are quadratic, and no bounds on the fermionic-Gaussian rank are known beyond fixed constants. In this work we prove that any fermionic Gaussian decomposition of $\\lvert M\\rangle^{\\otimes k}$ consists of $\\Omega(1.4^k)$ terms. Here $\\lvert M\\rangle$ is the most standard magic state for fermionic linear optics: the $4$ qubit state that may be consumed to implement a swap gate. We also prove essentially matching bounds on the $\\delta$-approximate rank of the same state, lower bounding it by the same quantity that bounds the exact rank, multiplied by a factor of $1-\\delta^2$. Our results on exact fermionic Gaussian rank apply directly to any product of $k$ fixed parity non-Gaussian states, although the same is not true of the approximate rank. Finally, we prove that the coherent state border rank of an $n$-mode bosonic Fock state with $m_j$ bosons in mode $j$ is exactly $\\prod_{j}(1+m_j)$, answering a conjecture of Ref. [1] and obtain lower bounds on the approximate coherent state rank given by the same quantity multiplied by a function of the fidelity of the approximation, emphasizing the broad applicability of the method we employ.", "url": "https://arxiv.org/abs/2610.03699", "type": "理论+数值", "summary": "1. 最近用于量子力学经典模拟的算法具有运行时间，其超多项式分量由对将某些“神奇”状态的大张量积写为“自由”状态（可能是稳定器状态、费米子高斯状态或其他状态）的叠加所需的项数的线性依赖性给出。\n2. 我们还证明了同一状态的 $\\delta$ 近似等级上的基本匹配界限，将其下限限制为与精确等级相同的数量，乘以 $1-\\delta^2$ 因子。\n3. [1] 并获得近似相干态等级的下界，该下界由相同的量乘以近似保真度的函数给出，强调我们采用的方法的广泛适用性。", "summary_source": "local-fallback", "authors": [{"name": "Oliver Reardon-Smith"}], "featured_authors": [{"name": "Oliver Reardon-Smith"}], "author_count": 1}, {"id": "2610.03700", "category": "quant-ph", "title": "Scalable Passive QRAM", "abstract": "We present a blueprint for implementing the physical QRAM operation in a scalable, passive manner, proving its feasibility in principle. Our construction is passive because for an $n$-qubit address over $N = 2^n$ memory bits the energy cost per QRAM query is $O(\\log N)$, and to our knowledge it is the first construction to use $\\operatorname{polylog} N$ energy. The runtime for each query is $O(\\log^2 N)$. It is achieved by evolving a pre-manufactured time-independent 4-local Hamiltonian with $O(N)$ terms where every qubit participates in at most 4 terms.", "url": "https://arxiv.org/abs/2610.03700", "type": "理论", "summary": "1. 该工作提出可扩展的被动式物理QRAM实现蓝图，并原则上证明其可行性。\n2. 其卖点是用预制的O(N)项、每比特至多参与4项的不含时4局域哈密顿量演化，首次实现每次查询O(log N)能量与O(log² N)时间。\n3. 这为大规模QRAM提供了低能耗、无需时变控制的实现路径，并启发基于定常局域哈密顿量的量子存储操作设计。", "summary_source": "deepseek", "authors": [{"name": "Siddhartha Jain"}, {"name": "Alexander M. Dalzell"}, {"name": "Connor T. Hann"}], "featured_authors": [{"name": "Siddhartha Jain"}, {"name": "Alexander M. Dalzell"}, {"name": "Connor T. Hann"}], "author_count": 3}, {"id": "2610.03705", "category": "quant-ph", "title": "Unitary complexity in polynomial space", "abstract": "We show that if quantum commitments exist, then either there is no polynomial-time solution to the unitary synthesis problem, or $\\mathsf{BPP} \\neq \\mathsf{NEXP}$. Thus, showing unconditionally that quantum commitments exist would require answering at least one of two longstanding open questions in complexity theory. We prove our main result as a consequence of a more general lemma, which shows that every unitary in $\\mathsf{unitaryPSPACE}$ either cannot be synthesized efficiently relative to any classical oracle, or can be synthesized efficiently with an oracle for $\\mathsf{NEXP}$ search problems. Our lemma has other noteworthy consequences, including that certain oracle separations involving $\\mathsf{unitaryPSPACE}$ would imply breakthrough classical lower bounds such as $\\mathsf{NC} \\neq \\mathsf{NP}$. Along the way, we propose new definitions for the unitary complexity classes $\\mathsf{unitaryP}$ and $\\mathsf{unitaryPSPACE}$. Our changes address the biggest conceptual issues with definitions suggested in prior work, and lead to elegant proofs. We study both implementations that erase garbage and implementations that allow it, because we cannot rule out the possibility that the two definitions differ. Nevertheless, we show that both definitions can be viewed as special cases of each other. We also showcase many other ways in which our definitions are robust. For example, we show that $\\mathsf{unitaryPSPACE}$ has an equivalent characterization as the set of unitary transformations whose entries can be computed to arbitrary precision in polynomial space. Consequently, we deduce that $\\mathsf{unitaryPSPACE}$ can generically erase garbage, a result that provably fails relative to unitary oracles.", "url": "https://arxiv.org/abs/2610.03705", "type": "理论+数值", "summary": "1. 该工作重新定义unitaryP与unitaryPSPACE，并证明：若量子承诺存在，则酉合成或无多项式时间解，或BPP≠NEXP。\n2. 关键是一般引理：unitaryPSPACE中酉变换要么对任何经典预言机均无法高效合成，要么可由NEXP搜索预言机高效合成。\n3. 由此，无条件证明量子承诺存在至少需解决这两个长期开放问题之一；相关预言机分离还将推出NC≠NP等经典下界。", "summary_source": "deepseek", "authors": [{"name": "William Kretschmer"}, {"name": "Ewin Tang"}], "featured_authors": [{"name": "William Kretschmer"}, {"name": "Ewin Tang"}], "author_count": 2}, {"id": "2610.03706", "category": "quant-ph", "title": "Quantum estimation, channel orders, and private capacity", "abstract": "Recent examples have shown that zero private capacity need not imply antidegradability and that two channels with zero private capacity can nevertheless transmit private information together. Existing entropic channel orders compare what a receiver and its environment can learn and thereby bound capacities. We connect these orders to the recent constructions through binary estimation, whose minimum mean-square error is governed by measured $\\chi^2$ divergence. A new integral representation shows how measured $\\chi^2$ on a qubit extension recovers quantum $\\chi^2$. It lets us pass from complete measured-$\\chi^2$ ordering to complete quantum-$\\chi^2$, relative-entropy, and less-noisy ordering. Zhu and Wang used a signed lift to show that their qutrit channel has zero private capacity. We show that Hermitian-smoothed measured-$\\chi^2$ ordering characterizes when such lifts exist, even with a quantum reference. Environmental dominance in binary estimation at every blocklength yields a finite-code reliability--secrecy bound. These results explain why complete comparison prevents activation with antidegradable helpers whereas regularized comparison alone does not. Building on that qutrit example, we establish this stability for a range of noisy Werner--Holevo channels, determine sharp private-capacity and antidegradability thresholds, and compute exact complementary capacities in a nondegradable range. By contrast, we extend Pauli half-erasure activation to all $1/2\\le p<1$ and establish the same range for a new four-level family. Reference-assisted measured-$\\chi^2$ witnesses show why these activating constructions lack complete comparison.", "url": "https://arxiv.org/abs/2610.03706", "type": "理论", "summary": "1. 最近的例子表明，零私有容量不一定意味着抗降级性，并且私有容量为零的两个通道仍然可以一起传输私有信息。\n2. Zhu和Wang使用签名电梯来表明他们的qutrit频道的私人容量为零。\n3. 在 qutrit 示例的基础上，我们为一系列嘈杂的 Werner-Holevo 通道建立了这种稳定性，确定了尖锐的私人容量和抗降解性阈值，并计算了不可降解范围内的精确互补容量。", "summary_source": "local-fallback", "authors": [{"name": "Christoph Hirche"}], "featured_authors": [{"name": "Christoph Hirche"}], "author_count": 1}, {"id": "2610.03711", "category": "quant-ph", "title": "How to Build Pseudorandom Unitaries in Microcrypt", "abstract": "We provide the first evidence relative to a classical oracle that pseudorandom unitaries (PRUs) can exist without quantum-computable one-way functions. To obtain this result, we first prove that five independent random diagonal phase layers interleaved with Hadamard transforms \\[ U=F_5HF_4HF_3HF_2HF_1 \\] form a strong PRU with security under adaptive, controlled access to the unitary, its inverse, transpose, and complex conjugate. Our main result is that, when the phase layers are implemented using a classical random oracle O, the construction remains secure against uniform BQP adversaries with coherent access to suitable Boolean completions of classical-input $QMA^{PH}^{O}}$ decision problems. Such an adversary can invert (even quantum-computable) one-way functions and solve efficiently verifiable one-way puzzles defined relative to O. Our result therefore provides classical-oracle evidence that PRUs do not imply quantum-computable one-way functions, in the form of a black-box separation. We substantially strengthen the classical-oracle result of Kretschmer, Qian, and Tal (STOC 2025) by obtaining PRUs secure against these QMA-aided adversaries. Our construction also consists of a simple, efficient circuit that queries a random function, suggesting a route to concrete implementation via the random-oracle heuristic.", "url": "https://arxiv.org/abs/2610.03711", "type": "理论", "summary": "1. 我们提供了与经典预言相关的第一个证据，即伪随机酉（PRU）可以在没有量子可计算单向函数的情况下存在。\n2. 我们的构造还包括一个简单、高效的电路，该电路查询随机函数，建议通过随机预言启发式实现具体实现的路线。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Aditya Gulati"}, {"name": "Dakshita Khurana"}, {"name": "Kabir Tomer"}], "featured_authors": [{"name": "Aditya Gulati"}, {"name": "Dakshita Khurana"}, {"name": "Kabir Tomer"}], "author_count": 3}, {"id": "2610.03714", "category": "quant-ph", "title": "SpiderCSS: Scalable Fault-Tolerant CSS State Preparation", "abstract": "Fault-tolerant preparation of logical states is a critical primitive for the realization of large-scale fault-tolerant quantum computing. This paper introduces SpiderCSS, a scalable compilation pipeline that generates highly-optimized, fault-tolerant state preparation circuits for arbitrary Calderbank-Shor-Steane (CSS) codes. Starting from an idealized specification of a CSS state, we use the ZX-calculus and fault-equivalent rewrites to construct a diagram that prepares the given state while preserving the fault tolerance of the initial ideal ZX-diagram. From this diagram, SpiderCSS constructs a fault-tolerant CSS-state preparation circuit using a modular construction that is CNOT-minimal both within each component and also in the way these components are connected together. By only using fault-equivalent rewrites, the final circuit is provably fault-tolerant without needing expensive verification. Monte Carlo simulations across a variety of CSS codes up to distance 15 show that SpiderCSS scales efficiently and constructs circuits with substantially reduced depth and qubit footprint compared to existing scalable and heuristic methods, while simultaneously achieving an average decrease of 33.7% in logical error rate and an increase of 9.5% in acceptance rate.", "url": "https://arxiv.org/abs/2610.03714", "type": "理论+数值", "summary": "1. 该工作提出可扩展编译流程 SpiderCSS，为任意 CSS 码生成高度优化的容错态制备电路。\n2. 其技术卖点是用 ZX 演算和故障等价重写，使模块化构造在组件内与互连上均 CNOT 最小，且无需昂贵验证即可证明容错。\n3. 最多距离15的多种 CSS 码模拟显示其可扩展并降低深度、量子比特开销，逻辑错误率均降33.7%、接受率升9.5%，为大规模容错量子计算提供实用编译方案。", "summary_source": "deepseek", "authors": [{"name": "Boldizsár Poór"}, {"name": "Andrey Boris Khesin"}, {"name": "Sarah Meng Li"}, {"name": "Benjamin Rodatz"}, {"name": "John van de Wetering"}, {"name": "Richie Yeung"}], "featured_authors": [{"name": "Boldizsár Poór"}, {"name": "Andrey Boris Khesin"}, {"name": "Sarah Meng Li"}, {"name": "Benjamin Rodatz"}, {"name": "John van de Wetering"}, {"name": "Richie Yeung"}], "author_count": 6}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>${paper.summary_source === "deepseek" ? "DeepSeek three-sentence PRL summary" : (paper.summary_source === "local-fallback" ? "Local three-sentence fallback" : (paper.summary_source === "translation" ? "Chinese abstract translation" : "Chinese placeholder fallback"))}</span><a href="${safeUrl}" target="_blank" rel="noreferrer">Open arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
</body>
