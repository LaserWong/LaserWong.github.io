es near the boundary of a causal diamond is wrong. The phrase in quotes above is correct in our models because most of the states associated with any causal diamond cannot be associated with ANY states in quantum field theory.", "url": "https://arxiv.org/abs/2610.02423", "type": "理论", "summary": "1. 该工作分析两个旧黑洞模型，检验其是否实现AdS/CFT中边界态仅在指数复杂算符期望值上不同而多重表示体数据的范式。\n2. 其要点是这些模型中防火墙悖论可简化为小组分逃逸复杂混沌系统时纠缠的朴素消解，真正问题在于因果菱形边界态的QFT描述错误。\n3. 这意味着因果菱形的大多数态无法对应任何量子场论态，从而支持引号中的多重表示并提示重审边界附近态的场论图像。", "summary_source": "deepseek", "authors": [{"name": "T. Banks"}], "featured_authors": [{"name": "T. Banks"}], "author_count": 1}, {"id": "2610.02964", "category": "hep-th", "title": "Ultraviolet dissipation and defect OPE in bottom-up holographic interfaces", "abstract": "We study the radial ultraviolet dissipation quantity $c_{UV}$ defined in arXiv:2601.16888v3 and defect OPE data in bottom-up holographic interfaces. We relate $c_{UV}$ along with the defect primary spectrum and BOPE coefficients in the large defect dimension limit to the optical length $\\rho$ in the holographic bulk. In addition, we prove a new holographic bound for conformal interfaces relating entanglement entropy, energy transmission and UV dissipation: \\[ c_{LR}\\geq \\frac{2c_{\\mathrm{eff}}}{2+\\pi(c/c_{\\mathrm{UV}}-1)}. \\] This compliments the upper bound of $c_{LR}$ by $c_\\text{eff}$ proved in arXiv:2404.01515 .", "url": "https://arxiv.org/abs/2610.02964", "type": "理论", "summary": "1. 该工作研究bottom-up全息界面中的紫外耗散量 c_UV 与缺陷OPE数据，并将大缺陷维度极限下的缺陷主谱、BOPE系数和 c_UV 与体时空光程 ρ 相联系。\n2. 其核心卖点是证明共形界面的新全息下界 c_LR ≥ 2c_eff/[2+π(c/c_UV−1)]，把纠缠熵、能量透射与紫外耗散统一到一个不等式中。\n3. 该下界与 arXiv:2404.01515 中由 c_eff 给出的 c_LR 上界互补，为界面全息中熵、输运与紫外耗散的关联提供了可检验约束。", "summary_source": "deepseek", "authors": [{"name": "Mianqi Wang"}], "featured_authors": [{"name": "Mianqi Wang"}], "author_count": 1}, {"id": "2610.03397", "category": "hep-th", "title": "Anisotropic Domain Walls and Cosmologies", "abstract": "We investigate anisotropic domain wall and cosmological solutions in $D$-dimensional gravitational theories of arbitrary spacetime signature coupled to scalar fields with a scalar potential. We identify a class of scalar potentials for which the second-order equations of motion admit a first-order formulation. The associated bosonic flows allow non-trivial Ricci-flat worldvolumes, while their Killing-spinor realization further requires the worldvolume to admit a non-vanishing parallel spinor. Five-dimensional ${\\cal N}=2$ gauged supergravity provides a concrete realization of this construction, with the worldvolume geometry determined by its signature and giving rise to pp-wave, hyper-Kähler, and hypersymplectic geometries. We further construct a general class of anisotropic solutions depending on a single variable, with the anisotropy encoded in a constant traceless matrix. A particular branch arises when a subset of scalar fields contribute through their kinetic terms but do not enter the scalar potential; these fields follow geodesics on the scalar manifold. As an explicit application, we recover the Kasner-dilaton-AdS solutions and show that, in the appropriate limit, they satisfy the first-order flow equations.", "url": "https://arxiv.org/abs/2610.03397", "type": "理论", "summary": "1. 我们研究任意时空特征与具有标量势的标量场耦合的 $D$ 维引力理论中的各向异性畴壁和宇宙学解。\n2. 作为显式应用，我们恢复了 Kasner-dilaton-AdS 解，并表明在适当的限制下，它们满足一阶流动方程。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "W. A. Sabra"}], "featured_authors": [{"name": "W. A. Sabra"}], "author_count": 1}, {"id": "2610.03485", "category": "hep-th", "title": "On the Stability of Warped Anti-de Sitter Spaces in Supergravity", "abstract": "We discuss the perturbative stability of warped anti-de Sitter (WAdS$_3$) spaces in three-dimensional gauged supergravity. To this end, we first derive the analogue of the Breitenlohner-Freedman bound for a single scalar field on such a curved background. We then apply this analysis to the half-maximal $D=3$ gauged supergravity obtained from the compactification of the $D=6$, $\\mathcal{N}=(1,1)$ supergravity on S$^3$. Families of three-dimensional configurations, uplifting to spaces of the form $\\mathrm{WAdS}_3 \\times \\mathrm{WS}^3$, are found by turning on appropriate vector and scalar fields, supporting the AdS$_3$ and S$^3$ warpings, respectively. Finally, we show that the spectra of scalar fluctuations satisfy the stability criteria for each solution.", "url": "https://arxiv.org/abs/2610.03485", "type": "理论", "summary": "1. 我们讨论三维计量超重力中扭曲反德西特 (WAdS$_3$) 空间的微扰稳定性。\n2. 其卖点在于提炼出该问题中的关键机制、方法优势或可计算结构。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "S. Maurelli"}, {"name": "R. Noris"}, {"name": "M. Oyarzo"}, {"name": "A. Saha"}, {"name": "H. Samtleben"}, {"name": "M. Trigiante"}], "featured_authors": [{"name": "S. Maurelli"}, {"name": "R. Noris"}, {"name": "M. Oyarzo"}, {"name": "A. Saha"}, {"name": "H. Samtleben"}, {"name": "M. Trigiante"}], "author_count": 6}, {"id": "2610.03495", "category": "hep-th", "title": "Carrollian Worldsheets on Carrollian Targets, When does ILST describe a null string theory?", "abstract": "Null string theory (NST) is a two-dimensional (2d) sigma-model on a Carrollian worldsheet with 2d diffeomorphisms, Weyl and Carroll-Weyl (CW) scalings as gauge symmetries whereas the Isberg-Lindström-Sundborg-Theodoridis (ILST) theory on a generic target space only realizes the first two and not the CW gauge symmetry. We show in this work that NST on the Carrollian target spaces (CTS) is well-defined if the background admits a homothetic kernel generator and that, it is described by the ILST theory on the same CTS. To this end, we formulate a minimal null string theory on CTS, starting from first principles and then discuss beyond minimal theories as deformations away from minimality. We study some classes of such deformations involving the clock one-from for ruled Carrollian spaces and/or connection on the Carrollian space. We discuss implications of this for the recently introduced null string holography. As examples CTS, we briefly discuss null strings probing black hole horizons and the null string holography in this context.", "url": "https://arxiv.org/abs/2610.03495", "type": "理论", "summary": "1. 该文从第一性原理构建了卡罗尔靶空间上的最小零弦理论，并考察偏离最小性的形变，包括直纹卡罗尔空间的时钟一形式或靶空间联络。\n2. 其核心结论是：当背景存在位似核生成元时，零弦理论在卡罗尔靶空间上良定义，且由同一靶空间上的ILST理论描述，从而恢复后者缺失的卡罗尔-韦尔规范对称性。\n3. 这为零弦全息及用零弦探测黑洞视界等场景给出了明确判据，并启发后续对非最小形变与全息对偶的研究。", "summary_source": "deepseek", "authors": [{"name": "M.M. Sheikh-Jabbari"}, {"name": "H. Yavartanoo"}], "featured_authors": [{"name": "M.M. Sheikh-Jabbari"}, {"name": "H. Yavartanoo"}], "author_count": 2}, {"id": "2610.03514", "category": "hep-th", "title": "Generalized eigenstate thermalization beyond leading order in 2D large c CFTs", "abstract": "We develop a Fock-space formulation that reduces expectation values of vacuum-family quasi-primaries in qKdV eigenstates of arbitrary highest-weight conformal families to a free-bosonic problem, and employ it to test the generalized eigenstate thermalization hypothesis (GETH), in 2D conformal field theories with large central charge $c$. We demonstrate that the first two quantum Korteweg--de Vries (qKdV) charges $Q_1$ and $Q_3$ lift all degeneracies except along at most countably many curves in the $(c,\\Delta)$ plane, where $\\Delta$ is the highest weight of the conformal family, so that the full-qKdV simultaneous eigenstates are unambiguously determined by $Q_1$ and $Q_3$. Based on this, a near-complete toolkit for testing in the vacuum conformal family or falsifying the general form of GETH, i.e. equating qKdV eigenstates and thermal states of the generalized Gibbs ensemble in the sense of expectations of local observables, is provided in this paper, through the infinite tower of qKdV charges. A stronger form of the GETH, namely that all expectations of local observables of a definite level should be expressible of qKdV charges but not contain microscopic eigenstate information, is directly falsified at subleading order in the large-$c$ expansion. At levels 6 and 8 in the vacuum family, expectation values of quasi-primaries in simultaneous eigenstates of the qKdV charges are not fixed by first finitely many qKdV charges, and microscopic information of the eigenstate is required.", "url": "https://arxiv.org/abs/2610.03514", "type": "理论", "summary": "1. 我们开发了一种福克空间公式，将任意最高权重共形族的 qKdV 本征态中真空族准基元的期望值降低为自由玻色子问题，并用它来检验具有大中心电荷 $c$ 的二维共形场论中的广义本征态热化假说 (GETH)。\n2. GETH 的一种更强的形式，即一定水平的局部可观测量的所有期望都应该可以用 qKdV 电荷来表达，但不包含微观本征态信息，在大 $c$ 展开中的次领先顺序上直接被证伪。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Ziyuan Wang"}, {"name": "Jiaju Zhang"}], "featured_authors": [{"name": "Ziyuan Wang"}, {"name": "Jiaju Zhang"}], "author_count": 2}, {"id": "2610.03554", "category": "hep-th", "title": "Unfolded Schwinger-Dyson hierarchy for vertex functions", "abstract": "We propose a formulation of a quantum field theory within the framework of the unfolded dynamics approach, originally developed in higher-spin gauge theory. We construct an unfolded system that describes a hierarchy of Schwinger-Dyson equations for vertex functions of a scalar QFT in terms of unfolded first-order equations. A distinctive feature of the constructed system is the appearance of two additional evolution parameters responsible for the WKB and RG behaviors. As an illustration, a one-loop analysis of the theory with quartic self-interaction is carried out.", "url": "https://arxiv.org/abs/2610.03554", "type": "理论", "summary": "1. 该工作将源于高自旋规范理论的展开动力学方法用于量子场论，构造出描述标量场顶点函数Schwinger-Dyson方程层级的展开一阶系统。\n2. 其独特之处在于系统引入两个额外演化参数，分别控制WKB近似与重整化群(RG)行为。\n3. 这为在同一展开框架下统一描述WKB与RG行为提供了思路，并以四次自相互作用的单圈分析作了初步验证。", "summary_source": "deepseek", "authors": [{"name": "Nikita Misuna"}], "featured_authors": [{"name": "Nikita Misuna"}], "author_count": 1}, {"id": "2610.03576", "category": "hep-th", "title": "Sharp null-energy lower bounds for Page-like entropy excursions in two-dimensional conformal field theory", "abstract": "We derive sharp lower bounds on the energy cost of Page-like entanglement entropy excursions in two-dimensional conformal field theory. For states satisfying the primary quantum null energy condition (QNEC), the positive null energy \\(E_+\\) obeys a sharp lower bound with two branches separated by the threshold \\(\\Delta S=(c/6)\\ln 2\\). We also derive a sharp lower bound on the net energy \\(E_{\\rm net}\\), with a coefficient larger by a factor of two than the value quoted by Abdolrahimi and Page [Phys. Rev. D 92, 083005 (2015)] and, in the QNEC-saturating sector, we obtain a sharp lower bound on the negative energy \\(E_-\\). The constants are sharp as infima over smooth conformal vacua. We determine the entropy profiles that minimize \\(E_+\\) for general QNEC states and the one that minimizes \\(E_-\\) in the saturating sector. Finally, for an excursion containing an infinite sequence of small sub-excursions within a finite duration, we derive a necessary condition for the total positive energy to remain finite, which is stronger than requiring the entropy to have finite total variation.", "url": "https://arxiv.org/abs/2610.03576", "type": "理论", "summary": "1. 我们得出了二维共形场论中类似页面纠缠熵偏移的能量成本的急剧下限。\n2. D 92, 083005 (2015)]，并且在 QNEC 饱和扇区中，我们获得了负能量 \\(E_-\\) 的急剧下限。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Soufiane Karmoudi"}, {"name": "Mohammed Daoud"}], "featured_authors": [{"name": "Soufiane Karmoudi"}, {"name": "Mohammed Daoud"}], "author_count": 2}, {"id": "2610.03606", "category": "hep-th", "title": "Non-Renormalizability Properties of Quarter-BPS Correlators in $\\mathcal{N}$=4 SYM", "abstract": "We study extremal and next-to-extremal four-point correlators involving general quarter-BPS operators in $\\mathcal{N}$=4 Super Yang-Mills. Using a combination of $R$-symmetry considerations, operator product expansion content, and analytic superspace techniques, we show that such correlators get contributions only from operators belonging to short and semi-short multiplets. This result together with the non-renormalizability of the relevant three-point functions guarantees that all such four-point correlators are protected from quantum corrections.", "url": "https://arxiv.org/abs/2610.03606", "type": "理论", "summary": "1. 该工作在 N=4 超杨-米尔斯理论中研究含一般四分之一 BPS 算符的极端与次极端四点关联函数。\n2. 卖点在于用 R 对称性、OPE 内容与解析超空间证明其仅受短和半短多重态贡献，并借三点函数非重整化保证四点函数免于量子修正。\n3. 这表明此类保护源于多重态结构而非微扰意外，为更一般的 BPS 关联函数与高圈计算提供了判据。", "summary_source": "deepseek", "authors": [{"name": "Agnese Bissi"}, {"name": "Giulia Fardelli"}, {"name": "Hector Puerta-Ramisa"}], "featured_authors": [{"name": "Agnese Bissi"}, {"name": "Giulia Fardelli"}, {"name": "Hector Puerta-Ramisa"}], "author_count": 3}, {"id": "2610.03652", "category": "hep-th", "title": "Quantum Gravity from Gluing Consistency: AdS/CFT to Spin-Foams", "abstract": "We argue that BF theory with $SO(d+1,1)$ gauge group provides a SymTFT ''skeleton'' for building AdS$_{d+1}$/CFT$_d$ pairs via gluing consistency as the bootstrap principle, loosely analogous to how compact Chern-Simons theory is a TQFT skeleton for rational CFTs. This is a non-perturbative $bulk$ framework for quantum gravity. The bootstrap is formulated as presentation independence of physical amplitudes within a universal, defect-closed BF sewing calculus, which includes Wilson lines, codimension-two monodromy defects, and their junctions. The flat BF connection encodes the conformal geometry of the boundary, while Wilson-line path integrals construct candidate quantum-gravity microstates and charge sectors. When the bootstrapped spectrum has a stress tensor, Ward identities naturally connect it to the $B$-field, a relation we call generalized simplicity. In large-$N$, large-gap regimes admitting a gravitational EFT, this motivates the introduction of an effective notion of the $B$-field. In the Einstein limit, this becomes the ''simplicity'' relation used in spin-foam models. Conventional spin-foam models reach gravity by constraining BF theory. We suggest instead that BF theory is the Platonic sewing skeleton, from which theories are to be bootstrapped. Despite the topological nature of the skeleton, perturbative local bulk fields can emerge via Wilson-towers of multi-trace primaries, reproducing their one-loop determinants. We note that the BF Fourier kernel is a suggestive higher-dimensional analogue of the modular-$S$ structure. Because the bulk gluing principle in itself does not require a boundary description, the framework is conceptually broader than AdS/CFT. We sketch how de Sitter space may fit into this picture, with a natural role for observers. Our approach elevates gluing consistency to a universal bulk principle underlying theories of quantum gravity.", "url": "https://arxiv.org/abs/2610.03652", "type": "理论", "summary": "1. 该文提出以SO(d+1,1)规范群BF理论作为SymTFT骨架，通过粘合一致性自举构造AdS/CFT对，并建立非微扰体量子引力框架。\n2. 其技术卖点是自举等价于缺陷闭合BF缝合演算中振幅的呈现无关性，并由应力张量Ward恒等式导出广义简单性及Wilson塔浮现局域场。\n3. 该框架将粘合一致性提升为不依赖边界描述的普适体原理，原则上超越AdS/CFT，并为de Sitter情形与观察者角色提供启发。", "summary_source": "deepseek", "authors": [{"name": "Chethan Krishnan"}], "featured_authors": [{"name": "Chethan Krishnan"}], "author_count": 1}, {"id": "2610.03708", "category": "hep-th", "title": "Quantum Love and ringdown near extremality", "abstract": "In this paper we discuss the quasinormal modes and the tidal responses of a four-dimensional asymptotically flat Reissner-Nördstrom black hole near extremality and investigate the nontrivial near-horizon quantum corrections of these observables. The near-horizon dynamics of near extremal black holes are generally governed by an effective Schwarzian action coupled to boundary gauge modes. We use this description and couple this effective theory with a massless scalar field outside. Using this setup we compute $2 \\to 2$ scattering process of a black hole and a scalar particle. The poles of the scattering amplitude at complex frequencies give us the quasinormal mode spectrum and we recover the predicted zero damped modes near extremality at leading order. Next we evaluate the static Love numbers from the elastic limit of the scattering amplitude. We show that the static Love numbers are non-zero in contrast to the classical expectations. Very close to extremality, the behaviour is analytic, but as the near-extremal energy becomes sufficiently large, we find logarithmic dependence on the energy. This cannot be removed by the choice of renormalisation scheme. Thus near-horizon quantum effects non-trivially change the tidal response of near-extremal black holes.", "url": "https://arxiv.org/abs/2610.03708", "type": "理论", "summary": "1. 该工作将近极端 Reissner-Nordström 黑洞近视界的有效 Schwarzian 作用量与边界规范模及外部无质量标量场耦合，计算黑洞与标量粒子的 2→2 散射，并由振幅极点与弹性极限提取准正规模谱和静态 Love 数。\n2. 其技术要点是：振幅极点领头阶复现近极端零阻尼模；静态 Love 数因近视界量子修正而非零，并在近极端能量足够大时呈现无法由重整化方案消除的对数能量依赖。\n3. 这揭示近视界量子效应会非平凡改变近极端黑洞的潮汐响应，提示对其环降与潮汐特征的计算必须纳入相应量子修正。", "summary_source": "deepseek", "authors": [{"name": "Arindam Bhattacharjee"}, {"name": "Muktajyoti Saha"}, {"name": "M.V.S. Saketh"}], "featured_authors": [{"name": "Arindam Bhattacharjee"}, {"name": "Muktajyoti Saha"}, {"name": "M.V.S. Saketh"}], "author_count": 3}, {"id": "2610.02294", "category": "math-ph", "title": "Noncommutative Marcus-Ree inequality and Erdős channels", "abstract": "Unital quantum channels are the noncommutative analogues of doubly stochastic matrices. In 1959, Marcus and Ree showed that the squared Frobenius norm of a doubly stochastic matrix is at most its maximal diagonal sum. We prove a quantum version of this inequality for mixed unitary channels on $\\mathbb{M}_d$ and give an example showing that it fails for general unital channels. As in the classical case, we call the channels attaining equality as Erdős channels. We show that the trace-preserving conditional expectation onto any unital $C^*$-subalgebra of $\\mathbb{M}_d$ is an Erdős channel. It is also locally isolated among channels of the same Choi rank. Next, we introduce quantum RCDS channels. These are the noncommutative analogue of doubly stochastic matrices whose supported permutations all have the same diagonal sum. We prove a structure theorem for them and use it to characterize the quantum RCDS Erdős channels. We give an explicit form, up to unitary equivalence, for the Erdős channels of Choi rank $2$, and further show that there are uncountably many unitary equivalence classes of Erdős channels unlike the classical case. We also characterize the Erdős channels among mixed Weyl-unitary channels of any Choi rank. For qubits, we prove that there are exactly four unitary equivalence classes of Erdős channels and they are represented by the identity channel and uniform averages of Pauli channels. Finally, restricting to the diagonal channels, our results recover the Marcus--Ree inequality, the structure of RCDS doubly stochastic matrices, and the characterization of Erdős.", "url": "https://arxiv.org/abs/2610.02294", "type": "理论", "summary": "1. 该工作证明了混合酉信道上的非交换 Marcus-Ree 不等式，即信道平方 Frobenius 范数不超过其最大对角和，并指出该不等式对一般 unital 信道失效，同时将取等信道定义为 Erdős 信道。\n2. 其核心卖点是把经典 RCDS 与 Erdős 结构量子化：证明到 unital C*-子代数的保迹条件期望为 Erdős 信道且在相同 Choi 秩中局部孤立，并借量子 RCDS 结构定理分类 Choi 秩 2、混合 Weyl-酉及 qubit 等情形。\n3. 该结果限制到对角信道时可恢复经典 Marcus-Ree、RCDS 和 Erdős 刻画，表明非交换推广在保持经典边界的同时允许不可数多酉等价类，为量子信道等号条件研究提供了统一线索。", "summary_source": "deepseek", "authors": [{"name": "Repana Devendra"}, {"name": "Chaman Kumar Sahu"}], "featured_authors": [{"name": "Repana Devendra"}, {"name": "Chaman Kumar Sahu"}], "author_count": 2}, {"id": "2610.02773", "category": "math-ph", "title": "Stratification of the space of density matrices via invariant theory and Uhlmann's connection", "abstract": "The space of $n\\times n$ density matrices is the full state space of an $n$-level quantum system. While it has been asserted in the literature on quantum information theory that decomposing this state space into equirank pieces yields a Whitney stratification, rigorous proofs have remained absent. Using methods from invariant theory, this work provides a proof that the rank decomposition of the matrix algebra constitutes a (b)-regular stratification in the sense of Whitney. Furthermore, we demonstrate how the Uhlmann connection - which describes the adiabatic holonomy of mixed states and reduces to the Berry connection on pure states - can be geometrically treated as a stratified connection on a stratified vector bundle. Finally, our appendix provides a self-contained exposition of stratified fiber bundles and the new concept of stratified connections, which may be of independent interest.", "url": "https://arxiv.org/abs/2610.02773", "type": "理论", "summary": "1. 该工作借助不变量理论，严格证明了 n 阶密度矩阵空间按秩分解构成惠特尼意义下的 (b)-正则分层，弥补了量子信息文献中缺失的严格证明。\n2. 其核心在于将描述混合态绝热和乐的乌尔曼联络几何化为分层向量丛上的分层联络，并说明其在纯态时退化为贝里联络。\n3. 这为混合态几何、量子绝热输运及分层丛联络的统一处理提供了严格框架，附录中分层纤维丛与分层联络的新概念或可独立用于相关数学与物理问题。", "summary_source": "deepseek", "authors": [{"name": "Howy Jordan"}, {"name": "Markus J. Pflaum"}, {"name": "Gerd Rudolph"}], "featured_authors": [{"name": "Howy Jordan"}, {"name": "Markus J. Pflaum"}, {"name": "Gerd Rudolph"}], "author_count": 3}, {"id": "2610.03060", "category": "math-ph", "title": "The monatomic limit of polyatomic gases as concentration of the internal-energy measure", "abstract": "In Rational Extended Thermodynamics, the monatomic limit of polyatomic gases is often singular. For the internal-state density $\\phi(I)=I^a$, with $a=(D-5)/2$, we prove that the normalized equilibrium distribution of the molecular internal energy $I$ concentrates at $I=0$ as $D\\to3$, providing a rigorous justification of the Dirac prescription and its first-order correction. In classical ET14, the internal-mode energy differs from equilibrium by $-3\\Pi/2$; positivity yields $-p<\\Pi<(D-3)p/3$, while the exact entropy develops a boundary corner at $\\Pi=0$. Negative dynamic pressures remain admissible, but fixed negative values do not approach the monatomic state with the prescribed total energy. This explains the need for compatible initial data. In the relativistic case, the internal energy is conditionally gamma distributed at fixed momentum; the constitutive integrals follow directly, and we derive an exact energy identity and the first correction to the Synge energy.", "url": "https://arxiv.org/abs/2610.03060", "type": "理论", "summary": "1. 该工作研究多原子气体单原子极限的奇异性，对内部态密度 φ(I)=I^{(D-5)/2} 证明归一化内能平衡分布随 D→3 集中于 I=0，为狄拉克处方及一阶修正提供严格依据。\n2. 核心贡献在于用内能测度集中统一经典 ET14 与相对论描述：经典中内模能量偏离 -3Π/2，熵在 Π=0 有边界角，负动态压强虽可容许但固定负值无法以给定总能趋于单原子态；相对论中固定动量下内能呈条件伽马分布，并直接给出本构积分、精确能量恒等式与 Synge 能量的一阶修正。\n3. 这强调单原子极限需相容初始数据，并为负动态压强和相对论扩展热力学的本构闭合提供判据与启发。", "summary_source": "deepseek", "authors": [{"name": "Tommaso Ruggeri"}], "featured_authors": [{"name": "Tommaso Ruggeri"}], "author_count": 1}, {"id": "2610.03097", "category": "math-ph", "title": "On the Cauchy Problem for the Sawada-Kotera Equation: Soliton resolution conjecture, Painlevé transcendents and asymptotic stability", "abstract": "We derive long-time asymptotics in different space-time regions for the Sawada-Kotera (SK) equation with admissible data involving continuous spectrum and finite discrete spectrum. Our result proves the soliton resolution conjecture, yields the asymptotics governed by the F-XVIII Painlevé transcendent, and establishes the asymptotic stability of \\(N\\)-soliton solutions. More importantly, this extends the long-time asymptotic theory to the coexistence of solitons and radiation, whereas previous results were restricted to the purely continuous spectrum. One key ingredient in our argument is a new meromorphic Riemann-Hilbert framework that incorporates the discrete spectrum through complete six-point pole orbits while preserving cofactor analyticity and the singular structure at the spectral origin. A second ingredient is the combination of an orbitwise, region-dependent pole reduction mechanism and the \\(\\bar{\\partial}\\)-nonlinear steepest descent method, which allows us to select the solitons contributing in each region and separate them from the continuous radiation. Our framework also resolves the coalescing stationary points at the singular spectral origin through the regular modified SK problem and the Miura map.", "url": "https://arxiv.org/abs/2610.03097", "type": "理论", "summary": "1. 该工作针对含连续谱与有限离散谱的可容许初值，建立Sawada-Kotera方程Cauchy问题的分区域长时渐近，并证明孤子分解猜想、F-XVIII Painlevé渐近以及N-孤子解的渐近稳定性。\n2. 其技术卖点是用新的亚纯Riemann-Hilbert框架以完整六点极点轨道纳入离散谱并保持余因子解析性与谱原点奇性，配合按轨道和区域相关的极点约化与∂̄非线性最速下降法，选择各区域贡献孤子并将其与连续辐射分离，从而覆盖孤子与辐射共存的长时渐近。\n3. 该框架借助正则化修改SK问题与Miura映射处理谱原点处驻相点合并，为可积系统长时渐近、Painlevé约化和孤子稳定性研究提供了可推广的路径。", "summary_source": "deepseek", "authors": [{"name": "Zheng-Kang Huang"}, {"name": "Shou-Fu Tian"}], "featured_authors": [{"name": "Zheng-Kang Huang"}, {"name": "Shou-Fu Tian"}], "author_count": 2}, {"id": "2610.03539", "category": "math-ph", "title": "Conformal Bootstrap for surfaces with boundary in Liouville CFT. Part II: spectral resolution and bootstrap", "abstract": "This paper is the second part of the proof of the conformal bootstrap for Liouville conformal field theory on compact surfaces with boundary. It is devoted to the spectral theory of the half-annulus semigroup and to the resulting bootstrap formula. Building on the Segal axioms and gluing properties established in Part~1~\\cite{GRW1}, we identify the generator of the half-annulus semigroup with the boundary Hamiltonian and establish its spectral decomposition by scattering methods. This yields a direct-integral decomposition of the boundary state space into irreducible Virasoro representations, governed by the boundary spectral measure. Combining this decomposition with Ward identities for boundary deformations, we express general correlation functions as integrals over spectral parameters attached to cutting curves, with integrands given by products of bulk and boundary structure constants and the corresponding conformal blocks. These results also underpin the analyticity and symmetry properties of conformal blocks~\\cite{GRSSbloc}, and contribute to the construction of mapping class group representations on spaces of conformal blocks~\\cite{PapierBlocs}.", "url": "https://arxiv.org/abs/2610.03539", "type": "理论", "summary": "1. 本文是有边界紧表面上刘维尔共形场理论的共形自举证明的第二部分。\n2. 其卖点在于提炼出该问题中的关键机制、方法优势或可计算结构。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Colin Guillarmou"}, {"name": "Rémi Rhodes"}, {"name": "Baojun Wu"}], "featured_authors": [{"name": "Colin Guillarmou"}, {"name": "Rémi Rhodes"}, {"name": "Baojun Wu"}], "author_count": 3}, {"id": "2610.03540", "category": "math-ph", "title": "Virasoro Conformal Blocks and modular functor from Liouville CFT", "abstract": "In this article, we give a global construction of the Virasoro conformal blocks on Teichmüller space of Riemann surfaces of genus $g$ with $m$ marked points, when the central charge is $c>25$. We prove that they are global holomorphic sections of a holomorphic line bundle and they satisfy the Ward identity, which encodes their conformal invariance. For the sphere with $3$ points, the space of conformal blocks is one-dimensional. For a given marked Riemann surface and a marked pair of pants decomposition, it is in general an infinite dimensional Hilbert space, isomorphic to $L^2(\\R_+^{3g-3+m})$ with respect to some measure involving the DOZZ structure constants. We show that it carries a projective unitary representation of the mapping class group. More generally, there are unitary isomorphisms for each Moore-Seiberg move, changing a marked pair of pants decomposition into another one.", "url": "https://arxiv.org/abs/2610.03540", "type": "理论", "summary": "1. 该工作对中心荷 c>25 的 Liouville 共形场论，在带 m 个标记点、亏格 g 的 Riemann 面 Teichmüller 空间上整体构造了 Virasoro 共形块，并证明其为全纯线丛的整体全纯截面且满足编码共形不变性的 Ward 恒等式。\n2. 其主要技术卖点是给出给定标记面与标记裤子分解下共形块空间与 L^2(R_+^{3g-3+m}) 的等距同构，测度含 DOZZ 结构常数，并证明该空间承载映射类群的射影酉表示及 Moore-Seiberg 移动间的酉同构。\n3. 这为从 Liouville CFT 构造模函数子、研究映射类群作用及裤子分解变化的相容性提供了严格基础，并可启发其他二维共形场论的类似全局构造。", "summary_source": "deepseek", "authors": [{"name": "Guillaume Baverez"}, {"name": "Colin Guillarmou"}, {"name": "Antti Kupiainen"}, {"name": "Rémi Rhodes"}, {"name": "Yuxiao Xie"}], "featured_authors": [{"name": "Guillaume Baverez"}, {"name": "Colin Guillarmou"}, {"name": "Antti Kupiainen"}, {"name": "Rémi Rhodes"}, {"name": "Yuxiao Xie"}], "author_count": 5}, {"id": "2610.02287", "category": "quant-ph", "title": "Premonoidal Semantics and Scalable Diagrammatics of Fermionic Quantum Computing", "abstract": "Local fermionic mode (LFM) based quantum computation has pure state spaces that are isomorphic, via the Jordan-Wigner representation, to qubit state spaces, but its compositional structure is subtly different. Indeed, the algebraic formalism specifying how to embed fermionic systems underlies a notion of parallel composition, for which, in general, the usual interchange law of monoidal categories fails. We give a categorical account of this phenomenon. Starting from the CAR-algebraic semantics of fermionic gate application, we show that LFM processes form a symmetric premonoidal category whose centre is precisely the even, parity-preserving subcategory. The same processes can alternatively be organized with the ordinary tensor product and a fermionic presymmetry that is natural exactly on even maps. To reason diagrammatically in this latter presentation, we introduce pronaps, a relaxation of the notion of prop, in which permutations are not-necessarily-natural, and use them to organize a hierarchy of fragments of the fermionic ZW calculus relevant to the study of fermionic circuits on physically motivated gate-sets. We then extend scalable diagrammatic notation to pronaps. In this setting, syntactic sugars inspired by SZX and GSA are defined, with the specificity that matrix arrows encode minors and determinants, while graph triangles encode pfaffians of principal submatrices. These constructions yield elegant normal forms and completeness proofs for our presentations of the EoW, FoW, EW, and FW fragments. In particular, the FW presentation gives a new normal form for the matchgate fragment, distinct from the rWGS-X normal form of the planar-W (pW) presentation of the same category. The resulting framework connects fermionic circuit semantics, diagrammatic rewriting with scalable notations, and the algebra of determinants and pfaffians.", "url": "https://arxiv.org/abs/2610.02287", "type": "理论", "summary": "1. 该文从CAR代数语义出发，用范畴论刻画局域费米模式量子计算，揭示其并行复合不满足通常交换律。\n2. 技术卖点是对称premonoidal中心刻画、pronap非自然置换，以及矩阵箭/三角编码子式与pfaffian并给出片段完备性与正规形。\n3. 该框架连接费米线路语义、图表重写与行列式/pfaffian代数，并为matchgate片段提供不同于pW/rWGS-X的新正规形。", "summary_source": "deepseek", "authors": [{"name": "Thomas Perez"}, {"name": "Titouan Carette"}], "featured_authors": [{"name": "Thomas Perez"}, {"name": "Titouan Carette"}], "author_count": 2}, {"id": "2610.02312", "category": "quant-ph", "title": "Counterdiabatic Quantum Circuits", "abstract": "Counterdiabatic driving provides a universal route to fast quantum control, but its standard formulation presupposes a Hamiltonian generator. We develop a Hamiltonian-free theory of the adiabatic gauge potential (AGP) for parameter-dependent unitary operators $U_\\lambda$. Exact and regularized versions of the AGP follow from a Hermitian, banded linear system at a cost comparable to the Lanczos construction in the Hermitian case, requiring neither diagonalization nor a matrix logarithm. We demonstrate rapid convergence of the truncated Krylov approximation for the kicked top and for an integrable brickwork circuit built from unitary $\\check{R}$ matrices, a setting in which no local effective Hamiltonian is available. Our results extend shortcuts to adiabaticity, and AGP-based diagnostics of chaos, to Floquet systems and quantum circuits.", "url": "https://arxiv.org/abs/2610.02312", "type": "理论", "summary": "1. 该工作构建了无需哈密顿量生成元的绝热规范势（AGP）理论，针对参数依赖的幺正算符 U_λ 给出精确与正则化版本，并用于量子线路中的快速绝热控制。\n2. 其技术核心是把 AGP 化为厄米带状线性系统求解，代价与厄米情形中 Lanczos 构造相当，且无需对角化或矩阵对数；在受踢陀螺模型与由幺正 R 矩阵构成的可积砖墙线路中，截断 Krylov 近似快速收敛，后者甚至不存在局域有效哈密顿量。\n3. 该结果将绝热捷径与基于 AGP 的混沌诊断从哈密顿系统推广至 Floquet 系统与量子线路，为无哈密顿量描述下的快速量子操控与线路动力学诊断提供了可操作框架。", "summary_source": "deepseek", "authors": [{"name": "Ankit Wenju Shrestha"}, {"name": "Budhaditya Bhattacharjee"}, {"name": "Adolfo del Campo"}], "featured_authors": [{"name": "Ankit Wenju Shrestha"}, {"name": "Budhaditya Bhattacharjee"}, {"name": "Adolfo del Campo"}], "author_count": 3}, {"id": "2610.02321", "category": "quant-ph", "title": "Halving the cost of QROM again via dense encoding", "abstract": "Quantum read only memory (QROM) is a substantial source of non-Clifford cost in fault-tolerant quantum algorithms. Borrowing dirty qubits can reduce this cost, provided their unknown initial states are restored. We consider the practically relevant qubit-constrained regime, where limited workspace restricts the table-block size and table loading dominates the cost. For $N$ entries of $b$ bits and approximately $b\\lambda$ dirty qubits, SelectSwap has leading Toffoli count $2N/\\lambda$. Recent work using sequential bit packets reduces this to $(1+1/b)N/\\lambda$. In this work we introduce a dense encoding construction of QROM, where two bits of classical information are stored in each dirty qubit instead of one by utilizing both the $Z$ and $X$ bases. On its own, dense encoding provides a $2\\times$ improvement over SelectSwap by reducing the leading Toffoli count to $N/\\lambda$. Combining it with sequential bit packets gives $\\tfrac12(1+1/b)N/\\lambda$, a further halving of the sequential construction's leading cost, and an approximately $4\\times$ improvement over SelectSwap in the large-$N$ limit for practical values of $b$.", "url": "https://arxiv.org/abs/2610.02321", "type": "数值", "summary": "1. 该工作提出一种QROM的密集编码构造，在脏量子比特的Z和X基中各存一位，从而将每个脏比特的编码容量翻倍。\n2. 其卖点是在量子比特受限区，将SelectSwap的领头Toffoli数从2N/λ降至N/λ，并结合顺序比特包进一步减半至(1+1/b)N/(2λ)。\n3. 这表明利用双基编码可在实际b和大N下相对SelectSwap获得约4倍开销改善，为容错量子算法的QROM资源优化提供直接启发。", "summary_source": "deepseek", "authors": [{"name": "Danial Motlagh"}], "featured_authors": [{"name": "Danial Motlagh"}], "author_count": 1}, {"id": "2610.02362", "category": "quant-ph", "title": "From Static Lindblad Stabilizability to Robust Physical Control Sequences", "abstract": "Dissipative dynamics can stabilize a quantum target without providing a reliable sequence of finite control operations. We derive checkable conditions for implementing such stabilization with imperfect controls, with bounds on convergence, errors during operations, and physical cost. The analysis includes pulses, idle intervals, and all simultaneously acting background dynamics. Using a common Lyapunov measure of deviation from the target, we require a contraction bound that remains uniformly below one over the prescribed uncertainty set after accounting for implementation errors. If all allowed paths preserve the target subspace throughout each operation, repeated cycles converge to that subspace from every initial state, even when errors vary between cycles. Comparison with these certified target-preserving paths gives an explicit long-time error bound under bounded leakage. Two single-qubit counterexamples show why a stabilizing average or a stabilizing generator obtained by unitary conjugation does not ensure these path conditions. The certification approach also supports a finite-library search. For a specified four-level cascade model with finite pulses, calibration and timing errors, dephasing, and bounded pumping, this search yields a sequence with an explicit preparation-time bound. For every initial state, it guarantees trace distance at most $0.1$ from the target at the end of preparation and throughout subsequent cycles.", "url": "https://arxiv.org/abs/2610.02362", "type": "理论", "summary": "1. 该工作研究如何把静态Lindblad可稳定化转化为在脉冲、空闲与背景动力学下的鲁棒物理控制序列，并给出可检验条件。\n2. 其核心是以共同Lyapunov偏差收缩界统一处理校准、时序、退相干等实现误差，要求所有路径在操作中保持目标子空间。\n3. 该认证支持有限控制库搜索，并在四能级级联模型中给出显式准备时间界及全程迹距离≤0.1的序列。", "summary_source": "deepseek", "authors": [{"name": "Yibin Wang"}, {"name": "Ruifeng Liu"}], "featured_authors": [{"name": "Yibin Wang"}, {"name": "Ruifeng Liu"}], "author_count": 2}, {"id": "2610.02392", "category": "quant-ph", "title": "Singer-Difference-Set Qudit Stabilizer Codes from Non-Degenerate Quadrics in PG(d,q)PG(d,q): Construction, Structural Theorems, and Monte-Carlo Performance", "abstract": "We propose Q(q,d), a family of q-ary non-CSS qudit stabilizer codes with prime power q and dimension d >= 2, constructed from Singer difference sets and non-degenerate quadrics in PG(d,q). The parity check H = (A | M_Q A) couples the Singer-circulant incidence matrix A with the quadric circulant M_Q, and a Cancellation Lemma uses the identity (k - lambda) = q^{d-1} = 0 mod p to make H symplectic-isotropic over F_q. Five structural theorems carry the novelty: a cross-correlation modular-constancy identity nu = 1 mod q at q odd, d >= 3, with a two-value pattern that proves a 2-torsion distance ceiling; a CRT zero-count identity; an explicit Clifford bridge identifying Q(q,2) as a graph-state encoding of the trivial Singer CSS code, with the 2021 low-density-spreading (LDS) sign-flip pattern realised by a symmetric circulant; a paired column-rigidity equality d_min = R_P + 1; and a lower bound d_min(Q(7,2)) >= 8 from an exhaustive Singer-Frobenius search. A Hamada-Smith specialisation yields the closed-form logical dimension k(p,d) = theta_d(p) - C(p+d-1, d) - 1, and the flagship Q(p,2) = [[p^2 + p + 1, p(p+1)/2, d_min]]_p attains asymptotic rate one-half. We conjecture d_min(Q(p,2)) = p + 1 for odd primes, proven at p = 5 and lower-bounded to >= 8 at p = 7. Instances include Q(3,2) = [[13,6,3]]_3, Q(5,2) = [[31,15,6]]_5, Q(7,2) = [[57,28, d>=8]]_7, and Q(3,4) = [[121,105,3]]_3. Monte-Carlo over 1.5 x 10^6 trials shows Q(5,2) achieves a 70-fold per-logical-qudit improvement over Steane [[7,1,3]]_2 at depolarising rate 10^-3 with zero silent logical errors. A textbook bounded-distance decoder is used; Berlekamp-Massey-style cyclic decoding is left as the natural sequel.", "url": "https://arxiv.org/abs/2610.02392", "type": "理论", "summary": "1. 该工作构造了基于Singer差集与PG(d,q)非退化二次曲面的q元非CSS qudit稳定子码族Q(q,d)，其校验矩阵H=(A|M_Q A)耦合两类循环矩阵并由消去引理保证辛迷向。\n2. 卖点是五条结构定理：奇q、d≥3的模常性ν≡1 mod q与二值模式证明2-挠距离上界，CRT零计数，Clifford桥接将Q(q,2)识别为图态编码并实现LDS符号翻转，列刚性d_min=R_P+1，以及Q(7,2)的d_min≥8；并给出闭式逻辑维数k(p,d)=θ_d(p)-C(p+d-1,d)-1，旗舰码Q(p,2)渐近码率1/2。\n3. 这为奇数素数下d_min(Q(p,2))=p+1的猜想提供依据，p=5已证、p=7下界≥8；蒙特卡洛显示Q(5,2)在10^-3去极化率下较Steane码每逻辑qudit提升70倍且无静默逻辑错误，循环译码是自然后续。", "summary_source": "deepseek", "authors": [{"name": "Michel Kulhandjian"}, {"name": "Lajos Hanzo"}], "featured_authors": [{"name": "Michel Kulhandjian"}, {"name": "Lajos Hanzo"}], "author_count": 2}, {"id": "2610.02471", "category": "quant-ph", "title": "Robust constrained optimization of nonequilibrium Casimir repulsion in a biased-semiconductor cavity", "abstract": "Nonequilibrium electromagnetic fluctuations offer a route to repulsive Casimir--Lifshitz forces. However, designs optimized only at nominal conditions may be fragile. We formulate repulsion in a planar PEC--vacuum--biased-GaAs--vacuum--PEC stack as a robust constrained optimization problem. The smaller of the outward pressures on the two conductors is maximized under fabrication and drive uncertainties. In the optically thick-slab limit, we prove that identical boundaries admit a symmetric optimizer, so equality of the optimal gaps emerges from the model rather than being imposed. At $300~\\mathrm{K}$, with gap uncertainty of $\\pm10~\\mathrm{nm}$ and drive uncertainty of $\\pm0.005$, the optimized design sustains a worst-case outward pressure of $2.257~\\mathrm{mPa}$ and exceeds the corresponding far-field radiation-pressure plateau by $0.1812~\\mathrm{mPa}$. At the nominal and active worst-case points, a full finite-slab scattering calculation agrees with the reduced model to within $1.60\\times10^{-3}\\%$. These results provide a design bound for cavity-enhanced nonequilibrium Casimir--Lifshitz repulsion and show how robust optimization can distinguish cavity enhancement from ordinary far-field radiation pressure.", "url": "https://arxiv.org/abs/2610.02471", "type": "理论+数值", "summary": "1. 该工作把平面PEC–真空–偏置GaAs–真空–PEC腔中的非平衡Casimir斥力设计表述为鲁棒约束优化，在制造与驱动不确定度下最大化两导体最小向外压力。\n2. 其关键点是在光学厚板极限证明相同边界存在对称优化器，使最优间隙相等由模型自然导出；300 K、间隙±10 nm、驱动±0.005时最坏情况压力为2.257 mPa，较远场辐射压平台高0.1812 mPa，有限板散射与约化模型偏差仅1.60×10^-3%。\n3. 这为腔增强非平衡Casimir–Lifshitz斥力给出了设计边界，并表明鲁棒优化能区分腔增强与普通远场辐射压，对后续实验与器件设计具有明确启发。", "summary_source": "deepseek", "authors": [{"name": "Mohamed R. Khodja"}, {"name": "Belkacem E. Khodja"}], "featured_authors": [{"name": "Mohamed R. Khodja"}, {"name": "Belkacem E. Khodja"}], "author_count": 2}, {"id": "2610.02636", "category": "quant-ph", "title": "Where Quantum Fourier Sampling Stops Short: A Three-Gate Audit Protocol for Delay-PUF Security Models", "abstract": "Quantum Fourier sampling may help audit the spectral learnability of delay-based physical unclonable functions (PUFs). We ask whether that promise survives access matching, a strong classical comparator, and oracle synthesis. Three gates structure the evaluation. Structure: low degree is not small support at reachable challenge lengths; for 4-XOR at $n=14$, degree $\\le d_f(0.1)$ admits $91\\%$ of all $2^n$ characters and the median $90\\%$-mass set spans a third of the spectrum. Algorithmics: constructing the phase oracle logically implies classical membership access, making Kushilevitz--Mansour the correct baseline; across 45 tasks it exhausts each finite domain, and no 4-XOR ideal-sampling case reaches $90\\%$ mass within $2^n$ calls. A quantum-kernel diagnostic appears more favorable, with geometric difference rising to $2.151$ at $N=512$ challenges, but it correlates $0.991$ with $1/\\sqrt{\\lambda_{\\min}(K_C)}$ for the classical Gram matrix $K_C$, and the 4-XOR label-complexity ratio does not exceed a balance-preserving permutation null ($p=0.930$). Trace-normalized geometric difference can therefore grow through classical ill-conditioning alone, without task-label alignment. Implementation: a simulator-validated fixed-point phase oracle based on the quantum Fourier transform admits an $18.9\\%$ routed-depth reduction, yet the least certified precisions have estimated durations of $1.18$--$1.55\\times$ the median dephasing time $T_2$ of the mapped qubits on a static backend snapshot, without hardware execution. We find no end-to-end advantage in the evaluated regime, although ideal sampling does use fewer coherent calls on the thresholded task. The contribution is the Three-Gate Quantum Audit Protocol: a reproducible procedure separating an ideal query advantage from a realizable security benefit. This is not a claim about deployed silicon and not an impossibility result.", "url": "https://arxiv.org/abs/2610.02636", "type": "理论+数值", "summary": "1. 该工作提出三闸门量子审计协议，从结构、算法与实现三方面检验量子傅里叶采样对延迟型PUF谱可学习性的效用。\n2. 其要点是把理想查询优势与可实现收益分离：低次数不等于小支撑，几何差可由经典Gram病态度单独放大，相位预言机深度虽降18.9%却耗时超T2。\n3. 该流程表明所评估范围内无端到端优势，为PUF安全建模与量子加速主张提供可复现检验，且不构成不可能性结论。", "summary_source": "deepseek", "authors": [{"name": "Owen Friedewald"}, {"name": "Ali Shiri Sichani"}, {"name": "Chi-Ren Shyu"}], "featured_authors": [{"name": "Owen Friedewald"}, {"name": "Ali Shiri Sichani"}, {"name": "Chi-Ren Shyu"}], "author_count": 3}, {"id": "2610.02641", "category": "quant-ph", "title": "When Normalization Selects the Sign: Auditing Robustness Ablations in Quantum Attention", "abstract": "Removing an input-scaling module changes both a classifier and the perturbations reaching its encoder. A robustness difference can therefore reflect the comparison rule as well as the module. We demonstrate this problem in a four-qubit quantum-attention detector on generated power-grid trajectories. A learned scaling module appears beneficial at a fixed physical attack budget, but matching an upper bound on perturbations at the encoder reverses the ordering. Neither comparison alone establishes a robustness benefit caused by the module. The initial test also perturbs clean examples into attacked examples while retaining their original labels; tests restricted to already attacked examples do not establish a benefit. Replacing a trained model's input scales disrupts detection. Retraining its linear classification layer restores the detection rate, but changes individual predictions, leaving the comparison descriptive rather than causal. Two further design checks explain why the input quantum Fisher information regularizer cannot train this model's query parameters, and why removing confidence bounds does not establish a larger certified radius. The evidence is limited to ten seeds, exact simulation, synthetic data, and a restricted set of attacks; classical baselines achieve better clean prediction. The practical lesson is to specify which perturbation budget is fixed, check that attacks preserve labels and interventions preserve predictions, and distinguish exploratory controls from confirmatory evidence.", "url": "https://arxiv.org/abs/2610.02641", "type": "理论+数值", "summary": "1. 该工作以生成式电网轨迹上的四量子比特量子注意力检测器为例，审计归一化/输入缩放模块的鲁棒性消融，并比较固定物理攻击预算与匹配编码器扰动上界两种规则。\n2. 其要旨是：比较规则本身即可逆转模块是否有益的排序，而将干净样本扰动为受攻击样本却保留原标签的测试不能确立鲁棒性增益；重训线性分类层虽恢复检出率却改变个体预测，使比较仅具描述性。\n3. 该证据限于十个种子、精确模拟、合成数据和有限攻击集合，提示应明确固定何种扰动预算、验证攻击保持标签与干预保持预测，并区分探索性对照与确证性证据。", "summary_source": "deepseek", "authors": [{"name": "Owen Friedewald"}, {"name": "Srikar Alla"}, {"name": "Ali Shiri Sichani"}, {"name": "Chi-Ren Shyu"}], "featured_authors": [{"name": "Owen Friedewald"}, {"name": "Srikar Alla"}, {"name": "Ali Shiri Sichani"}, {"name": "Chi-Ren Shyu"}], "author_count": 4}, {"id": "2610.02644", "category": "quant-ph", "title": "Optimal state detection without likelihood estimation", "abstract": "We show that adaptive Bayesian estimation in fluorescence state detection reduces to a comparison of elapsed time with two arithmetic time sequences fixed by the bright and dark count rates and confidence parameters $\\epsilon_d$ and $\\epsilon_b$. No probabilities are computed in real time and the resulting implementation, which we term sequential deadline detection, is provably optimal in mean detection time. The analysis permits closed-form expressions for detection-time distributions, mean detection times, error rates of both channels accounting for miscalibrated rates, decay between the states during detection, and afterpulsing in single photon counting modules. The predictions are validated by Monte Carlo simulation and demonstrated by fluorescence detection with Ba$^+$", "url": "https://arxiv.org/abs/2610.02644", "type": "数值", "summary": "1. 该工作提出无似然估计的自适应贝叶斯荧光态检测，将判决简化为经过时间与由亮/暗计数率及置信参数确定的两条算术时间序列比较。\n2. 其卖点是无需实时计算概率，称为顺序截止检测，并在平均检测时间上可证明最优，且给出检测时间分布与双通道误码率的闭式表达。\n3. 该分析还涵盖率失配、检测期间态衰减与单光子探测器后脉冲，并经蒙特卡洛及Ba+荧光实验验证，为低延迟量子态读出提供明确启示。", "summary_source": "deepseek", "authors": [{"name": "M. D. K. Lee"}, {"name": "Z. Chai"}, {"name": "J. Z. F. Seng"}, {"name": "K. J. Arnold"}, {"name": "M.D.Barrett"}], "featured_authors": [{"name": "M. D. K. Lee"}, {"name": "Z. Chai"}, {"name": "J. Z. F. Seng"}, {"name": "K. J. Arnold"}, {"name": "M.D.Barrett"}], "author_count": 5}, {"id": "2610.02854", "category": "quant-ph", "title": "Thermalization in a repeated-interaction model with memory effects", "abstract": "We study how memory affects the thermalization of a qubit in a repeated-interaction model. In our model, a memory qubit interacts repeatedly with the system, while both qubits undergo collisions with fresh thermal ancillas. We derive exact closed evolution equations for their populations and mutual coherence, and demonstrate memory effects using a causal-break operation. Although the system converges to the target thermal state, the thermalization behavior shows non-monotonic approach. We also find a Mpemba-like reversal, in which the number of collisions required for thermalization depends non-monotonically on the temperature of the target state. Within the initial-state family considered, both phenomena require initial coherence between the system and memory or an imbalance in their excited-state populations.", "url": "https://arxiv.org/abs/2610.02854", "type": "理论", "summary": "1. 该工作研究了记忆效应对重复相互作用模型中量子比特热化的影响，推导系统与记忆比特布居及互相干的精确封闭演化方程，并用因果断裂操作表征记忆效应。\n2. 其核心发现是系统虽最终收敛到目标热态，但热化过程非单调，且出现类姆潘巴反转，即达到热化所需碰撞次数随目标温度非单调变化。\n3. 在考虑的初态族内，这些现象需系统与记忆间存在初始相干或激发态布居失衡，这为以记忆调控开放系统热化路径及其实验表征提供了判据。", "summary_source": "deepseek", "authors": [{"name": "Kanji Nishii"}, {"name": "Ryo Nagai"}, {"name": "Yoshihiko Abe"}], "featured_authors": [{"name": "Kanji Nishii"}, {"name": "Ryo Nagai"}, {"name": "Yoshihiko Abe"}], "author_count": 3}, {"id": "2610.02859", "category": "quant-ph", "title": "From Heat to Homology: Spectral Gap Transfer for Exact Quantum Gibbs Sampling at All Temperatures", "abstract": "Preparing Gibbs states through dissipative dynamics requires controlling convergence for the chosen Hamiltonian $H$ and coupling operators. However, efficient implementation requires convergence guarantees from the spectral gap of the generator of the dynamics, which remains a crucial challenge. Recent results address the challenge by restricting the dynamics with structural assumptions about the Hamiltonian and its interactions. For the Chen-Kastoryano-Gilyen (CKG) construction and arbitrary finite-dimensional Hamiltonians, we prove an explicit comparison that converts a spectral gap estimate for the infinite-temperature generator into a lower bound on the spectral gap of the CKG quantum Gibbs sampler at every finite positive inverse temperature $\\beta$. It allows a single spectral gap estimate at infinite temperature to certify convergence across Hamiltonians and temperatures. Such an estimate is often known from a classical spectral gap estimate, such as the classical random walk spectral gap. For Hodge Laplacians of simplicial complexes as Hamiltonians, we construct coupling operators whose generator at infinite temperature has the same spectral gap as a classical simplicial down-up walk. A positive spectral gap of the walk and bounded spectral width $W=\\lambda_{\\max}(H)-\\lambda_{\\min}(H)$ give a generator spectral gap independent of the number of simplices at every fixed temperature. We then establish conditions under which the sampler approximately prepares zero-energy (harmonic) states in polynomial evolution time. This provides a conditional convergence guarantee for the state preparation in the thermal approach to quantum topological data analysis.", "url": "https://arxiv.org/abs/2610.02859", "type": "理论", "summary": "1. 该工作为CKG量子Gibbs采样器和任意有限维哈密顿量证明显式谱隙比较，将无限温生成元谱隙转化为所有有限正β下的谱隙下界。\n2. 对单纯复形Hodge Laplacian，构造的耦合算子使无限温生成元谱隙等同经典单纯下-上随机游走；正谱隙与有界谱宽给出每固定温度下与单纯形数无关的谱隙。\n3. 该结果给出多项式演化时间内近似制备零能谐波态的条件性收敛保证，为量子拓扑数据分析的热态方法提供了可迁移的谱隙认证思路。", "summary_source": "deepseek", "authors": [{"name": "Caesnan M. G. Leditto"}, {"name": "Kuo-Chin Chen"}, {"name": "Min-Hsiu Hsieh"}], "featured_authors": [{"name": "Caesnan M. G. Leditto"}, {"name": "Kuo-Chin Chen"}, {"name": "Min-Hsiu Hsieh"}], "author_count": 3}, {"id": "2610.02916", "category": "quant-ph", "title": "Quasiparticle quantum simulation of materials with the Bethe-Salpeter equation", "abstract": "The first-principles quantum simulation of the full electronic Hamiltonian of a material model of realistic size appears daunting even in a future era of fully fault-tolerant quantum computers. In contrast, classical simulations of material excited states rely on heuristic quasiparticle frameworks, such as the GW approximation and Bethe-Salpeter equation, where only a few quasiparticles are explicitly considered. Here we give a detailed description of quasiparticle quantum simulation for multi-excitonic states within the BSE. We develop an explicit first-quantized, orbital-based block encoding of the multi-exciton BSE Hamiltonian for qubitization, and reduce its cost using integral factorization and crystal symmetries. For a materials model of size $N$, and a fixed number of quasiparticles, the resulting algorithms require $\\widetilde{O}(N)$ Toffoli gates and $O(\\log N)$ logical qubits, or, using space-time tradeoffs, $\\widetilde{O}(\\sqrt{N})$ Toffoli gates and $\\widetilde{O}(\\sqrt{N})$ logical qubits, achieving up to a sixth power reduction in Toffoli count, or up to exponential reduction in qubit count, versus standard full Hamiltonian simulation techniques that have been explored in materials simulation. Resource estimates for the classically challenging problem of triexcitonic eigenvalue estimation across a range of semiconductor models of a realistic physical size of $O(10^3)$ atoms, show that our Toffoli-optimized implementation reduces the Toffoli count by $10^6-10^7$ relative to full Hamiltonian simulation estimates, while a qubit-optimized implementation requires only a few hundred logical qubits. More broadly, these results show that classical heuristic frameworks will be essential in the design of future fault-tolerant quantum algorithms for materials.", "url": "https://arxiv.org/abs/2610.02916", "type": "理论+数值", "summary": "1. 该工作详细描述了BSE框架下的多激子态准粒子量子模拟，并构造第一量子化轨道基BSE哈密顿量的块编码以实现量子比特化。\n2. 其卖点在于利用积分分解与晶体对称性，将固定准粒子数模拟降至Õ(N)个Toffoli门和O(log N)逻辑量子比特，或时空折中下Õ(√N)门与比特，最高较全哈密顿量模拟减少六次方门数或指数比特。\n3. 对O(10^3)原子半导体模型的三激子本征值估计显示Toffoli优化可减少10^6–10^7门，比特优化仅需数百逻辑比特，表明经典启发式框架对设计未来容错量子材料算法至关重要。", "summary_source": "deepseek", "authors": [{"name": "Jielun Chen"}, {"name": "Jiace Sun"}, {"name": "Garnet Kin-Lic Chan"}], "featured_authors": [{"name": "Jielun Chen"}, {"name": "Jiace Sun"}, {"name": "Garnet Kin-Lic Chan"}], "author_count": 3}, {"id": "2610.02939", "category": "quant-ph", "title": "Root-sparsity scaling for Hamiltonian simulation, differential equations and linear-system solvers", "abstract": "We give quantum algorithms for Hamiltonian simulation, linear differential equations, and linear systems with square-root dependence on sparsity. For an $s$-sparse Hermitian matrix with row and column Euclidean norms bounded by $\\eta$, evolution for time $t$ to error $\\epsilon$ uses $\\mathcal{O}(\\sqrt{s}\\tau+\\sqrt{s\\tau\\log(1/\\epsilon)}+\\log(1/\\epsilon))$ queries, where $\\tau=\\eta|t|$. The same bound holds for time-dependent Hamiltonians with coherent time-indexed sparse access and certified time discretisation. Our construction combines an exact entrywise representation with Cayley transducers. A joint lower bound nearly matches the time, sparsity, and precision dependence, ruling out a uniformly additive bound in $\\sqrt{s}\\tau$ and $\\log(1/\\epsilon)$. For dissipative linear differential equations we obtain $\\mathcal{O}(\\bar g[\\sqrt{s}(\\tau+\\sqrt{\\tau})+1]\\log(C\\bar g/\\epsilon))$ queries, where $\\tau$ is the evolution time multiplied by a norm bound, $\\bar g$ bounds the ratio of combined input and source norms to the final-solution norm, and $C$ is an absolute constant. We sharpen this bound by separating Hamiltonian and dissipative components, and treat general constant generators. Lower bounds capture joint parameter dependence for time-dependent equations and precision hardness for constant positive semidefinite dissipation. For linear systems, a Cayley walk and Chebyshev filter give $\\mathcal{O}(\\kappa\\sqrt{s}\\log(1/\\epsilon))$ queries when $\\|A\\|\\le1$ and $\\|A^{-1}\\|\\le\\kappa$, and we give an alternative proof of a matching joint lower bound. We also give gate-efficient implementations of time-independent Hamiltonian simulation and the dissipative ODE solver, including Lipschitz time dependence, retaining the query bounds with polylogarithmic overhead in inverse precision given efficient entry decoding, arithmetic, and required source preparations.", "url": "https://arxiv.org/abs/2610.02939", "type": "理论+数值", "summary": "1. 该工作为哈密顿模拟、线性微分方程和线性系统求解提出了稀疏度平方根依赖的量子算法，并给出近匹配的联合下界。\n2. 其卖点是用精确逐项表示结合Cayley转换器（线性系统采用Cayley游走与Chebyshev滤波），将查询复杂度降至O(√s·τ+√(sτ log(1/ε))+log(1/ε))和O(κ√s log(1/ε))。\n3. 这为稀疏输入模型下设计近最优量子模拟与线性求解器提供了统一框架，并推动耗散ODE与Lipschitz时间依赖的门高效实现。", "summary_source": "deepseek", "authors": [{"name": "Dominic W. Berry"}, {"name": "Abhishek Rawat"}, {"name": "Sophia Simon"}, {"name": "Guang Hao Low"}], "featured_authors": [{"name": "Dominic W. Berry"}, {"name": "Abhishek Rawat"}, {"name": "Sophia Simon"}, {"name": "Guang Hao Low"}], "author_count": 4}, {"id": "2610.02980", "category": "quant-ph", "title": "Einstein--Langevin source correlations in closed non-relativistic systems", "abstract": "Stochastic semiclassical gravity represents stress--energy fluctuations through the Einstein--Langevin noise kernel. We examine its Newtonian projection for specified closed, particle-number-conserving non-relativistic sources and distinguish the source covariance from a reduced matter channel. The connected one-particle covariance is state dependent and differs from the universal potential-noise law postulated in the Diósi--Penrose model. To relate the source spectrum to dephasing, we define a separate static probe subject to a prescribed Gaussian noise law. For a finite-variance source operator in an isolated non-degenerate eigenstate, the full connected spectral measure has a gap around zero. The probe dephasing exponent is then bounded and its long-time slope vanishes. Stationary doublets can instead carry static or low-frequency spectral lines, while a specified freely spreading Gaussian source gives a finite limiting exponent. Continuum results depend on preparation, normalisation, infrared regularisation and the order of limits. We also compare coherent and incoherent many-body preparations and establish no-signalling for fixed classical-noise channels. These results identify the spatial, temporal and dynamical assumptions needed to relate source fluctuations to a matter-decoherence model. They do not exclude Markovian limits in other number-conserving non-relativistic preparations.", "url": "https://arxiv.org/abs/2610.02980", "type": "理论", "summary": "1. 该文在闭合且粒子数守恒的非相对论源中研究 Einstein–Langevin 噪声核的牛顿投影，区分源协方差与约化物质通道，并引入静态探针关联源谱与退相干。\n2. 其核心为连通单粒子协方差依赖量子态并偏离 Diósi–Penrose 普适势噪声律；孤立非简并本征态下谱测度零附近有隙，探针退相干指数有界且长时斜率消失。\n3. 这明确了把源涨落映射为物质退相干模型所需的空间、时间与动力学假设，且不排除其他粒子数守恒非相对论制备中的马尔可夫极限。", "summary_source": "deepseek", "authors": [{"name": "Peng Xu"}, {"name": "Li-E Qiang"}], "featured_authors": [{"name": "Peng Xu"}, {"name": "Li-E Qiang"}], "author_count": 2}, {"id": "2610.03026", "category": "quant-ph", "title": "Spatiotemporal quantum advantages for rare-event sampling", "abstract": "In a world fraught with uncertainty, it behooves us to consider the most disastrous possible outcomes, in order that we can best mitigate against them. Often these are extreme risk events -- of high consequence, but low probability. Yet, the rarity of such events limits our ability to study them; there is a paucity of past occurrences to draw upon, and sampling such rare events from models is typically costly in time. Here, we introduce an approach for rare-event sampling based on quantum stochastic models. This integrates the memory advantages of quantum stochastic modelling -- and its associated efficient means of preparing quantum sample states -- with the `speed-ups' of quantum amplitude amplification, to yield simultaneous reductions in spatial and temporal computational complexity compared to classical Monte Carlo-based approaches.", "url": "https://arxiv.org/abs/2610.03026", "type": "理论+数值", "summary": "1. 该工作提出了一种基于量子随机模型的稀有事件采样框架，利用量子随机建模的记忆优势及其高效制备量子样本态的方法，并融合量子振幅放大带来的加速。\n2. 其技术卖点在于同时降低空间与时间计算复杂度，相较经典蒙特卡洛方法，在低概率高后果的稀有事件采样中给出量子加速。\n3. 这为极端风险事件的建模与缓解提供了可扩展的量子采样路径，并启发将振幅放大与量子随机模型结合以处理更广泛的稀有事件。", "summary_source": "deepseek", "authors": [{"name": "Akshat Gupta"}, {"name": "Jianjun Chen"}, {"name": "Chengran Yang"}, {"name": "Mile Gu"}, {"name": "Caterina Doglioni"}, {"name": "Jayne Thompson"}, {"name": "Thomas J. Elliott"}], "featured_authors": [{"name": "Akshat Gupta"}, {"name": "Jianjun Chen"}, {"name": "Chengran Yang"}, {"name": "Caterina Doglioni"}, {"name": "Jayne Thompson"}, {"name": "Thomas J. Elliott"}], "author_count": 7}, {"id": "2610.03040", "category": "quant-ph", "title": "Direct estimation of $g^{(2)}(0)$ from click statistics of a multiplexed detector", "abstract": "We present and theoretically analyze a method for direct estimation of the second-order correlation function $g^{(2)}(0)$ from the click statistics of a multiplexed detector composed of M binary on-off detection channels. The method uses linear estimators of the first and second moments of the photon-number operator and can provide accurate results even for optical fields with substantial mean photon numbers. For a fixed number of channels, the detection range can be extended by introducing additional losses before the detector. We demonstrate the performance of the method for coherent, thermal, amplitude-squeezed, and photon-added coherent states. We also derive a nonclassicality criterion based on the estimated correlation function and show how the method can be adapted to unbalanced detectors. Our work establishes direct estimation of $g^{(2)}(0)$ as a simple and versatile method for quantitatively characterizing quantum light using multiplexed click detectors.", "url": "https://arxiv.org/abs/2610.03040", "type": "理论", "summary": "1. 该工作提出并理论分析了一种直接从由M个二元开-关通道组成的复用探测器点击统计中估计二阶关联函数g^{(2)}(0)的方法。\n2. 其核心是利用光子数算符一阶与二阶矩的线性估计量，在平均光子数较大时仍保持准确，并可通过前置额外损耗扩展固定通道数下的探测范围，同时给出基于估计值的非经典性判据及非平衡探测器推广。\n3. 该方案将复用点击探测器的直接g^{(2)}(0)估计确立为定量表征相干态、热态、振幅压缩态和加光子相干态等量子光的简便通用途径。", "summary_source": "deepseek", "authors": [{"name": "Jaromír Fiurášek"}], "featured_authors": [{"name": "Jaromír Fiurášek"}], "author_count": 1}, {"id": "2610.03108", "category": "quant-ph", "title": "Determining the Number of Symmetry Sectors in Composite Quantum Spectra", "abstract": "The spectral fluctuations in complex quantum systems are modeled in terms of spectra from random matrices. Quantitative agreement with random matrices holds only when the quantum spectrum is a pure sequence, and not a composite spectrum that mixes levels from different symmetry sectors. It was shown earlier that discrete symmetries in composite spectra can be detected using higher-order spacing ratio statistics provided the symmetry sectors are of equal dimensions. The general case is when the symmetry sectors have unequal dimensions, and the symmetries of the Hamiltonian system are unknown or only partially known. In this work, we address how the number of symmetry sectors can be determined from a composite spectrum arising in Hermitian and non-Hermitian settings. A Best Subset Technique is proposed for determining the number of the symmetry sectors by comparing the spectral fluctuations to that of an appropriate random matrix ensemble without requiring de-symmetrization. It is demonstrated using spectra from Gaussian, Wishart and Ginibre ensembles, and also for spectra drawn from many-body quantum systems.", "url": "https://arxiv.org/abs/2610.03108", "type": "理论", "summary": "1. 该工作研究如何从复合量子谱中确定对称性扇区数目，涵盖厄米与非厄米情形，并允许各扇区维数不等且对称性未知或仅部分已知。\n2. 其核心是无需去对称化的最佳子集技术：通过将复合谱涨落与适当随机矩阵系综比较来确定扇区数，并在高斯、威沙特、吉尼布尔系综及多体量子谱上验证。\n3. 该方案为复杂量子系统中隐藏离散对称性的探测提供了无需预先去对称化的途径，尤其适用于扇区维数不等和对称性信息不完整的谱分析。", "summary_source": "deepseek", "authors": [{"name": "Nisarg Vyas"}, {"name": "S. Harshini Tekur"}, {"name": "M. S. Santhanam"}], "featured_authors": [{"name": "Nisarg Vyas"}, {"name": "S. Harshini Tekur"}, {"name": "M. S. Santhanam"}], "author_count": 3}, {"id": "2610.03133", "category": "quant-ph", "title": "Infrared Memory of a Majorana Shutter", "abstract": "We study a finite-width Majorana shutter as a local, time-dependent scattering defect and determine which features of its infrared memory are insensitive to the microscopic spatial profile. For a smooth shutter, the zero-frequency scattering matrix is fixed by the integrated coupling, while finite-width corrections vanish in the long-wavelength limit. A time-dependent switch then produces an infrared Bogoliubov kernel whose singular part is controlled by the change in this scattering matrix. We examine the many-body response through three observables. The overlap of the pre- and post-shutter Gaussian vacua exhibits Anderson orthogonality, with an exponent set by the scattering angle. A lattice calculation of the post-quench quasiparticle number resolves its logarithmic infrared growth, reaching the predicted coefficient in the slow-switch test and reproducing the expected dependence on the scattering-angle change. When the entanglement cut passes through the shutter, the entropy follows the effective-central-charge description of a conformal defect, with parameter-free agreement at the percent level, improving for the wider shutter. When the shutter lies inside the interval, its contribution remains a subleading finite-size correction. A local bilinear correlator approaches the expected Majorana power law and shows no stable logarithmic amplitude. These results show that the same low-frequency scattering data control distinct global and spatial observables, while their infrared coefficients are not interchangeable. The remaining limits are also made explicit: the finite-memory correction to the continuum kernel and the controlled continuum limit of large-interval spatial entropy.", "url": "https://arxiv.org/abs/2610.03133", "type": "理论+数值", "summary": "1. 该文将有限宽度的马约拉纳快门作为局域含时散射缺陷，考察其红外记忆中不依赖微观空间剖面的特征。\n2. 其卖点在于：光滑快门的零频散射矩阵由积分耦合决定，开关诱导的博戈留波夫核奇异部分由散射矩阵变化控制，全局与空间可观测量受同一低频数据支配。\n3. 这表明同一低频散射数据可控制不同全局与空间可观测量，但各红外系数不可互换；有限记忆修正与大区间空间熵的连续极限仍待明确。", "summary_source": "deepseek", "authors": [{"name": "Ali Vahedi"}], "featured_authors": [{"name": "Ali Vahedi"}], "author_count": 1}, {"id": "2610.03161", "category": "quant-ph", "title": "Landscape-Dependent Performance of Photonic Quantum Solvers in QUBO Feature Selection for Financial Risk Detection", "abstract": "Feature selection for imbalanced classification tasks such as credit card fraud and consumer default detection requires balancing predictive relevance, inter-feature redundancy, and computational feasibility. We benchmark three computing paradigms, classical branch-and-bound optimization (Gurobi), photonic entropy computing (QCI Dirac-3), and simulated photonic boson sampling (Piquasso), across thirteen feature-selection methods on two datasets: ULB Credit Card Fraud (30 features) and AmEx consumer default (159 features). Each method is routed to the solver matched to its mathematical structure. On ULB, Dirac-3 MI-Spearman matches the all-features model using 13 of 30 features (mean F1 0.873 +/- 0.023 over five runs, best run 0.896), and Piquasso is the best method at k=5. On AmEx, performance rises steadily with the feature budget and every paradigm approaches F1 = 0.80 only near the full feature set. Most differences between Gurobi and Dirac-3 on identical methods fall within run-to-run variation; the large gaps occur where the certified optimum generalizes poorly, most sharply for distance correlation on AmEx at k=25 (Gurobi F1 = 0.422 vs. a Dirac-3 mean of 0.746). At matched budgets, F1 varies about ten times more across methods on ULB than on AmEx, which we trace to how concentrated the predictive signal is in each feature space.", "url": "https://arxiv.org/abs/2610.03161", "type": "理论+数值", "summary": "1. 该工作在信用卡欺诈与消费违约数据上，将13种特征选择方法分别路由至经典分支定界、光量子熵计算和模拟玻色采样三类求解器进行基准测试。\n2. 卖点在于揭示QUBO景观依赖：认证最优泛化差时Dirac-3可明显优于Gurobi，且ULB方法间F1差异约为AmEx十倍，归于信号集中度。\n3. 这提示金融风险特征选择应结合QUBO景观与信号集中度选择求解器，而非仅依赖认证最优或单一计算范式。", "summary_source": "deepseek", "authors": [{"name": "Nirvik Sahoo"}, {"name": "Paul Robert Griffin"}], "featured_authors": [{"name": "Nirvik Sahoo"}, {"name": "Paul Robert Griffin"}], "author_count": 2}, {"id": "2610.03186", "category": "quant-ph", "title": "Topological phase transition in a symmetric blockade structure", "abstract": "We present a numerical study of a blockade Hamiltonian with a local $\\mathbb{Z}_2$ symmetry. For such models, the existence of a topologically ordered ground state has been proven rigorously for weak Rabi driving [T. F. Maier et al., PRX Quantum 6, 030340 (2025)]. However, the phase diagram beyond weak driving is still an open question. We perform large-scale infinite-size density matrix renormalization group (iDMRG) simulations on a cylinder and map out the full phase diagram of the model. We find a single continuous phase transition between the topologically ordered phase and a trivial paramagnetic phase, and confirm numerically the stability of the topologically ordered phase up to Rabi drives comparable to the characteristic energy scale of the system. Furthermore, we compute the excitation gaps and show that the charge gap remains open across the phase transition and charges become confined in the trivial phase. On the other hand, the gap in the symmetric sector closes at the transition, consistent with the condensation of flux excitations.", "url": "https://arxiv.org/abs/2610.03186", "type": "理论+数值", "summary": "1. 该工作通过无限尺寸密度矩阵重正化群（iDMRG）在柱面上数值求解含局域Z2对称性的阻塞哈密顿量，并绘制了弱Rabi驱动之外的全相图。\n2. 其核心结果是发现拓扑有序相与平庸顺磁相之间仅由单一连续相变分隔，且拓扑有序相在Rabi驱动与体系特征能标相当时仍稳定；电荷隙跨相变保持打开而电荷在平庸相中受限，对称扇区能隙在相变点闭合，符合磁通激发凝聚图像。\n3. 该数值相图为对称阻塞模型的拓扑序稳定性、电荷禁闭与磁通凝聚机制提供了依据，并提示后续可检验有限驱动、有限尺寸及实验实现中的相变与任意子行为。", "summary_source": "deepseek", "authors": [{"name": "Johannes Mögerle"}, {"name": "Simon Fell"}, {"name": "Tobias F. Maier"}, {"name": "Ali Otaifi"}, {"name": "Lode Pollet"}, {"name": "Nicolai Lang"}, {"name": "Hans Peter Büchler"}], "featured_authors": [{"name": "Johannes Mögerle"}, {"name": "Simon Fell"}, {"name": "Tobias F. Maier"}, {"name": "Lode Pollet"}, {"name": "Nicolai Lang"}, {"name": "Hans Peter Büchler"}], "author_count": 7}, {"id": "2610.03214", "category": "quant-ph", "title": "Quantum code parameters, checkable by a certificate of provable size", "abstract": "A code is described by three numbers: its physical qubits, its logical qubits, and the smallest error it cannot detect, counted in qubits. The first two are linear algebra. The third, the distance, is an optimum over an exponentially large set, read off a solver whose answer carries no certificate. Whether a code's parameters can be checked uniformly across codes, with a certificate of proved size, is open. Here we show that they can, by moving the unit of work from the code to a \\emph{certificate}, a short object, either a list, a pairing or a symbolic instance, whose correctness the kernel of the \\Lean\\ proof assistant decides by computation. The kernel is the small core that checks each step. The certificate's size is itself a theorem: its enumeration form lists the vectors of weight below the distance $d$, $\\sum_{j<d}\\binom{n}{j}$ of them, a polynomial in the code's length $n$ at fixed distance $d$. No bound uniform over codes in both $n$ and $d$ is smaller. For product families the certificate is smaller still, the bound being proved once, symbolically. Deciding that a vector lies outside the row space of the check matrix, the set of sums of its rows, becomes one matrix-vector product and one inner product. On an eighteen-qubit toric code, a surface code closed into a torus, the whole-file check of that decision falls from 42\\,s to 9\\,s. Eleven code families and thirty-nine parameter sets follow, the widest at 1872 qubits. Nothing beyond the three standard axioms of \\Lean's logic is trusted, though the generator that writes a code's checks stops at twenty qubits, and the lower bound for the 144-qubit code is imported rather than proved here. A distance becomes checkable rather than believed, and the same move applies wherever else a computation ends in a solver.", "url": "https://arxiv.org/abs/2610.03214", "type": "理论+数值", "summary": "1. 该工作证明量子码的参数可由大小可证明的证书统一检查，把验证负担从码转移到短证书。\n2. 核心是证书取列表、配对或符号实例，由Lean内核计算判定；枚举证书规模为∑_{j<d}C(n,j)，固定d时是n的多项式，且n、d一致界不能更小。\n3. 这使码距从被相信变为可检查，同一思路可推广到其他以求解器收尾的计算；十八量子比特环面码检查由42秒降至9秒。", "summary_source": "deepseek", "authors": [{"name": "Shuoming An"}, {"name": "Fusheng Yang"}], "featured_authors": [{"name": "Shuoming An"}, {"name": "Fusheng Yang"}], "author_count": 2}, {"id": "2610.03217", "category": "quant-ph", "title": "Two-center Dirac equation in a Gaussian basis set", "abstract": "A method for solving the two-center Dirac equation using a Gaussian-product basis set tailored to the axial symmetry of diatomic systems is presented. For the ground state of H$_2^+$ at an internuclear distance $R=2.0~a_0$, we obtain a relativistic energy with relative precision at the $10^{-18}$ level. The properties of the basis set allow for an analytic Fourier transform of the wave function. As a first application we evaluate, for the first time, the zero-potential contribution to the one-loop self-energy for H$_2^+$ in Feynman and Coulomb gauges. Although this contribution is not separately gauge invariant, its calculation provides a proof of principle for the use of the present framework in prospective QED calculations.", "url": "https://arxiv.org/abs/2610.03217", "type": "理论+数值", "summary": "1. 该工作提出适配双原子轴对称性的高斯乘积基组，求解双中心狄拉克方程并计算H2+基态。\n2. 对R=2.0 a0达到10^-18相对精度，且基组允许波函数解析傅里叶变换；首次计算Feynman与Coulomb规范下单圈自能零势贡献。\n3. 该零势贡献虽不单独规范不变，但为将本框架用于未来QED计算提供了原理验证。", "summary_source": "deepseek", "authors": [{"name": "Dávid Ferenc"}], "featured_authors": [{"name": "Dávid Ferenc"}], "author_count": 1}, {"id": "2610.03235", "category": "quant-ph", "title": "Two-body control of noiseless subsystems with mixed $SU(3)$ representations lifts teleportation above the classical fidelity limit", "abstract": "Collective noise can leave degrees of freedom unaffected, allowing them to store quantum information. Processing this information also requires physically available logical gates. We consider $r$ fundamental qutrits transforming under $U\\in SU(3)$ and $s$ dual qutrits transforming under its complex conjugate $\\overline U$, with collective action $R_{r,s}(U)=U^{\\otimes r}\\otimes\\overline U^{\\otimes s}$. Using the image of the walled Brauer algebra and Lie-algebra arguments, we show that adjacent exchanges within each qutrit type and one singlet-projector interaction between the two types generate any independently chosen family of special unitary gates on the noiseless subsystems by a finite pulse sequence, for every $r,s\\geq1$. This establishes semi-universality of this system. We illustrate the result with a numerically optimised sequence of 24 pulses for three fundamental qutrits and one dual qutrit. We then use the encoding and available logical corrections for qutrit teleportation under correlated Weyl noise. Under explicit assumptions on channel composition and which trials are retained, and allowing for baseline implementation errors, we identify noise ranges in which encoded teleportation exceeds the classical fidelity bound of $1/2$, while the unencoded teleportation channel is entanglement breaking. We analyse fidelity on accepted trials separately from the transmission costs of the additional physical qutrits.", "url": "https://arxiv.org/abs/2610.03235", "type": "理论+数值", "summary": "1. 该工作研究r个基本与s个对偶qutrit在混合SU(3)表示下无噪声子系统的两体控制，并用于关联Weyl噪声中的qutrit隐形传态。\n2. 其核心论证借助墙围Brauer代数像与李代数，证明同类qutrit相邻交换和两型间单态投影相互作用可半通用生成逻辑门，并给出24脉冲实例。\n3. 在显式信道组成与保留试验假设下，编码隐形传态可在未编码信道纠缠破坏时超过经典保真度1/2，但须权衡接受试验保真度与额外qutrit传输开销。", "summary_source": "deepseek", "authors": [{"name": "Otavio A. D. Molitor"}, {"name": "Sergii Strelchuk"}, {"name": "Michał Studziński"}], "featured_authors": [{"name": "Otavio A. D. Molitor"}, {"name": "Sergii Strelchuk"}, {"name": "Michał Studziński"}], "author_count": 3}, {"id": "2610.03260", "category": "quant-ph", "title": "Compiling Together: High-Throughput Distributed Quantum Computing via Multi-Compilation", "abstract": "Quantum computing is a promising paradigm for problems that are challenging for classical machines, but realizing that promise requires far more qubits than a single processor can offer. Distributed quantum computing (DQC) scales out by connecting multiple quantum processing units (QPUs), at the cost of making entanglement the scarce resource: every remote gate consumes a Bell pair, and inter-QPU links generate Bell pairs at finite rates orders of magnitude slower than local gates. Since quantum programs are executed repeatedly, this rate bounds how fast shots complete and thus how fast results are obtained. Existing DQC compilers emit a single implementation per circuit, so throughput is capped by its busiest link while other links stay idle. We observe that alternative compilations of the same circuit are logically equivalent yet stress different links; executing them concurrently and pooling their samples converts idle Bell pairs into additional shots. We formulate the joint selection of compilations and allocation of shots under per-link Bell-pair capacities as Candidate-Constrained Max-Shot Allocation (CMA), prove it NP-hard, and solve it with a dynamic program and its approximate variant AppDP, a compact MILP, and a greedy heuristic Effi. In simulation on six-QPU networks, multi-compilation raises throughput by 2-4.5* over the single compilation and correspondingly improves output fidelity under equal Bell-pair budgets. On hardware, it increases measured fidelity by up to 93% and reaches the single-compilation fidelity in up to 10* less time. Scaling to 36 QPUs and 144-qubit circuits, MILP improves throughput over the single compilation by 76.8% on average across 48 configurations while Effi allocates in milliseconds.", "url": "https://arxiv.org/abs/2610.03260", "type": "理论+数值", "summary": "1. 量子计算对于解决经典机器所面临的挑战问题来说是一种很有前景的范式，但要实现这一前景需要的量子比特数远多于单个处理器所能提供的数量。\n2. 我们将每个链路贝尔对容量下的镜头编译和分配联合选择制定为候选约束最大镜头分配（CMA），证明它是 NP 困难的，并用动态程序及其近似变体 AppDP、紧凑 MILP 和贪婪启发式 Effi 来解决它。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Yipei Liu"}, {"name": "Sen Zhang"}, {"name": "Zebo Yang"}, {"name": "Lei Yang"}], "featured_authors": [{"name": "Yipei Liu"}, {"name": "Sen Zhang"}, {"name": "Zebo Yang"}, {"name": "Lei Yang"}], "author_count": 4}, {"id": "2610.03279", "category": "quant-ph", "title": "Pricing of graph-based quantum portfolios from first principles", "abstract": "A central topic in economics and finance is the valuation of strategic games and bets, of investments providing uncertain future cashflows, and of other asset-like structures and contracts. Often, such valuation involves a probabilistic model, random variables, and computing expectation values of complex payoffs. Extending beyond this classical framework, a scenario emerges where assets are non-commuting operators and the inherent uncertainty is described by quantum states. In this work, we combine such notions of quantum finance with a graph-theoretic framework and ideas from contextuality. We discuss exclusive quantum assets and introduce scenarios when holding such assets can provide advantages over holding classical assets. In particular, we consider a \"quantum market\" based on nonlocal games such as the CHSH game and demonstrate that this setting can function as a market with well-defined financial structures. We provide upper bounds on the fair prices of the quantum assets based on graph-theoretic quantities like the independence number and the Lovász theta number. Our insights into markets of non-commuting assets help to elucidate what a financial system in a world filled with quantum technology could look like.", "url": "https://arxiv.org/abs/2610.03279", "type": "理论", "summary": "1. 该工作从第一性原理出发，将量子金融与图论及上下文性结合，构建基于图的量子投资组合定价框架，并讨论非对易量子资产市场。\n2. 其核心是以独立数、洛瓦兹θ数等图论量给出量子资产公平价格上界，并在非局域博弈市场中刻画其相对经典资产的优势。\n3. 这提示量子技术环境下的金融市场可由非对易资产与图结构描述，为量子金融与量子基础交叉研究提供可操作方向。", "summary_source": "deepseek", "authors": [{"name": "Daniel J. Spencer"}, {"name": "Bin Cheng"}, {"name": "Dinh-Long Vu"}, {"name": "Kishor Bharti"}, {"name": "Alexey V. Gorshkov"}, {"name": "Patrick Rebentrost"}], "featured_authors": [{"name": "Daniel J. Spencer"}, {"name": "Bin Cheng"}, {"name": "Dinh-Long Vu"}, {"name": "Kishor Bharti"}, {"name": "Alexey V. Gorshkov"
