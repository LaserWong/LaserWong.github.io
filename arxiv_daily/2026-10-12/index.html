 identity. The algebraic decay is rooted in the nonanalyticity of the von Neumann entropy at rank-deficient density operators. We exhibit an analogous instability on an ordinary qubit chain. More generally, we show that the Markov length is unstable in any translation-invariant state with even a single rank-deficient reduced density operator. These results pose a challenge to recent definitions of mixed-state phase equivalence based on the Markov length.", "url": "https://arxiv.org/abs/2610.12929", "type": "理论", "summary": "1. 该工作研究量子马尔可夫长度在弱局域信道下的稳定性，构造出一维费米链中深度二最近邻高斯信道电路，将真空映射为条件互信息代数衰减、马尔可夫长度发散的状态。\n2. 其关键卖点在于证明即使信道无限接近恒等，纯直积态也会失稳，根源是秩亏约化密度算符处冯诺依曼熵的非解析性，并在普通量子比特链及任意含单个秩亏约化密度算符的平移不变态中给出类似不稳定性。\n3. 这表明基于马尔可夫长度的混合态相等价定义面临根本挑战，后续需引入对弱局域信道更稳健的判据来刻画混合态物相。", "summary_source": "deepseek", "authors": [{"name": "David C. Newsom"}, {"name": "Michael Levin"}], "featured_authors": [{"name": "David C. Newsom"}, {"name": "Michael Levin"}], "author_count": 2}, {"id": "2610.12949", "category": "quant-ph", "title": "Quantum-assisted rendezvous on hypercubes: a quantum Bernoulli noise approach", "abstract": "We study quantum-assisted balanced rendezvous on the $d$-dimensional hypercube in a one-step two-agent quantum-walk framework, where the two agents move the same Hamming distance and meet at a common midpoint. The key structure is a projective $t$-sphere resolution, which governs exact finite-dimensional quantum attainment. Its scalar analogue recovers the corresponding classical characterization. We characterize finite-dimensional quantum attainment of the no-signalling benchmark, construct quantum strategies from projective sphere resolutions, and establish a rigidity theorem for optimal finite-dimensional strategies. A marked difference appears between nearest-neighbor and higher-cardinality updates: quantum advantage can occur in the former, whereas in the latter the geometry of the relevant Hamming spheres rules out exact finite-dimensional attainment of the no-signalling value. Together, these results connect quantum-walk dynamics, Hamming-sphere geometry, and quantum rendezvous within the quantum Bernoulli noises (QBN) framework.", "url": "https://arxiv.org/abs/2610.12949", "type": "理论", "summary": "1. 该工作在d维超立方体的一步双主体量子行走框架下，研究量子辅助平衡会合，并刻画无信号基准的有限维量子可达性。\n2. 其核心是投影t球分解，支配精确有限维量子可达性，标量类比回归经典刻画，并可构造量子策略、证明最优有限维策略刚性定理。\n3. 最近邻更新可出现量子优势，高基数更新则因Hamming球几何排除精确有限维无信号值；这连接量子行走、Hamming球几何与QBN框架。", "summary_source": "deepseek", "authors": [{"name": "Ce Wang"}], "featured_authors": [{"name": "Ce Wang"}], "author_count": 1}, {"id": "2610.13033", "category": "quant-ph", "title": "When irrelevance governs: dissipation-regression scaling in open quantum criticality", "abstract": "The real-time dynamics of quantum phase transitions in open systems coupled to finite-temperature environments sits at the heart of contemporary condensed-matter and quantum-information science. Here, invoking a Schwinger-Keldysh formalism, we uncover that, within the coherence-dominated regime of critical real-time evolution, a dissipative coupling deemed naively irrelevant determines, counterintuitively, the longest timescale that holds sway. Possessing a well-defined temporal scaling dimension, it engenders a novel dissipation-regression scaling that systematically reproduces the unusual Kibble-Zurek scaling and relaxation observed in recent numerical studies. By contrast, dissipation-dominated dynamics behaves qualitatively differently. There, furthermore, we show that the discretized and diagonalized formulations of the same open quantum Ising chain realize distinct universality classes.", "url": "https://arxiv.org/abs/2610.13033", "type": "理论+数值", "summary": "1. 该工作基于施温格-凯尔迪什形式研究有限温度开放量子临界系统的实时动力学，发现在相干主导的临界演化区间，一个通常被视为不相关的耗散耦合反而支配最长时标。\n2. 其核心卖点是提出具有确定时间标度维度的耗散-回归标度，系统复现近期数值研究中反常的基布尔-祖雷克标度与弛豫行为，并表明耗散主导区定性不同，且同一开放量子伊辛链的离散化与对角化表述分属不同普适类。\n3. 这提示开放量子临界动力学需重新审视表观不相关耗散的作用，也为基布尔-祖雷克机制、普适类判定及数值方法一致性提供明确检验。", "summary_source": "deepseek", "authors": [{"name": "Fan Zhong"}], "featured_authors": [{"name": "Fan Zhong"}], "author_count": 1}, {"id": "2610.13038", "category": "quant-ph", "title": "Error Mitigation by Zero-Noise Extrapolation (ZNE) in Indirect-Control System", "abstract": "The indirect-control paradigm offers a scalable approach to quantum computation by restricting external operations to a small subset of qubits, whereas the entire system evolves under its intrinsic many-body Hamiltonian. This framework reduces hardware complexity and limits the noise introduced through control channels. Recently, Anan et al. proposed an implementation of the variational quantum eigensolver (VQE) within this indirect-control architecture. However, the impact and integration of quantum error mitigation techniques in such a setting remain largely unexplored. In particular, zero-noise extrapolation (ZNE), a widely used error mitigation strategy, has not yet been systematically adapted to indirect-control VQE. A key requirement of ZNE is the controlled amplification of noise, which is commonly achieved through circuit-level techniques such as unitary folding. In the indirect-control framework, however, quantum operations are largely governed by continuous time-evolution under the system Hamiltonian, making the construction of physically realizable inverse operations non-trivial. In this study, we investigate the feasibility of implementing ZNE within the this http URL address the challenges associated with unitary folding in the presence of time-evolution operators and, with a minimal relaxation of the indirect-control constraint, we propose a ZNE-based error-mitigation strategy that exploits the symmetry of the one-dimensional XY spin chain.", "url": "https://arxiv.org/abs/2610.13038", "type": "理论+数值", "summary": "1. 该工作研究在间接控制架构中实现零噪声外推（ZNE）的可行性，并针对其VQE场景提出误差缓解方案。\n2. 其核心挑战是时间演化算子下的酉折叠与可物理实现逆操作；作者最小放松间接控制约束，利用一维XY自旋链对称性构造ZNE噪声放大。\n3. 这表明间接控制量子计算可借助体系对称性适配ZNE，为受限控制下的误差缓解与VQE扩展提供可行路径。", "summary_source": "deepseek", "authors": [{"name": "Arijit Das"}, {"name": "Masaki Owari"}], "featured_authors": [{"name": "Arijit Das"}, {"name": "Masaki Owari"}], "author_count": 2}, {"id": "2610.13135", "category": "quant-ph", "title": "Pulsed control of an entanglement-breaking index: thermal valleys, a certified valve, and its open-close asymmetry", "abstract": "The entanglement-breaking index of a channel is the number of self-compositions after which all entanglement with a reference system is destroyed. In a thermal qubit collision loop whose round is affine in the bath polarisation p, some circuits have thermal valleys: on an interior window of p the index falls below its infinite-temperature value. Rounds at different p compose exactly, so every schedule of polarisations defines a composite channel whose entanglement-breaking status can be certified in ball arithmetic. A gated search of 33 million random circuits finds no valley with contrast above about 3e-3, with an interior maximum near index 90, and yields six certified targets. At the reference target, held inside its window for 88 rounds, a centred excursion to p = 0.05 restores entanglement at exactly eight rounds: every shorter centred pulse certifiably fails, and so do the same eight rounds at the start. A 53-round pulse certifiably beats the static protocol, a depth-three valley is walked down its staircase by pulse duration, and a 1.2 per cent coherent tilt of the ancilla opens the switch at fixed population. Closing the switch costs 21 to 35 rounds. The asymmetry is not one of local rates, which agree to within about two per cent at matched circuit positions (certified). It is one of distance and response: closing must remove an entanglement margin 2.2 times larger, and while hot rounds added to a window hold act almost independently, window rounds added to a hot hold act collectively. Near the crossing, the lever of the log-margin is that of a linear approach to the entanglement-breaking boundary, with no free parameter. At the reference target, depolarising noise of about $4\\nu/n$ per round kills a signature of size $\\nu$ read after $n$ rounds: 1.3e-4 for the static signal, 6.5e-6 for the eight-round switch.", "url": "https://arxiv.org/abs/2610.13135", "type": "理论", "summary": "1. 该工作围绕《Pulsed control of an entanglement-breaking index: thermal valleys, a certified valve, and its open-close asymmetry》对应的问题给出了新的分析、建模或计算结果。\n2. 其卖点在于把核心物理图像、技术路线或数值证据压缩为可直接比较的结论。\n3. 这为相关体系的后续理论推演、算法验证或实验设计提供了可参考的出发点。", "summary_source": "translation-fallback", "authors": [{"name": "Eran Kopel"}], "featured_authors": [{"name": "Eran Kopel"}], "author_count": 1}, {"id": "2610.13211", "category": "quant-ph", "title": "Verifiable Sampling for Delegated Generative Quantum Machine Learning", "abstract": "Generative machine learning has shown remarkable results across a wide range of interdisciplinary tasks, motivating significant efforts toward Quantum Generative Models as a path to beyond-classical performance, given their capability of generating classically intractable distributions. However, comparatively little attention has been paid to securely delegating such computations to a powerful remote quantum server. In this work, we propose a blind and verifiable protocol for sampling that can be used for the inference phase of such quantum models. Such a protocol inherits blindness from Universal Blind Quantum Computing and achieves verifiability by exploiting known approaches based on trapification schemes. Alongside, to delegate the training phase, we discuss an extension of the previously proposed verifiable end-to-end Delegated Variational Quantum Algorithms (Inajetovic et al., Phys. Rev. Research, 2026). Beyond the usual Accept/Abort outcome characterizing verification protocols, the sampling protocol for inference also provides, even against a malicious server, an estimation of the amount of corrupted generated samples, i.e., a fine-grained feature describing the quality of the outcome connecting verification protocols and application-level benchmarking.", "url": "https://arxiv.org/abs/2610.13211", "type": "理论+数值", "summary": "1. 该工作提出了面向委托生成式量子机器学习的盲化可验证采样协议，用于生成模型的推理阶段，并讨论将训练阶段委托给远程量子服务器的扩展方案。\n2. 其技术核心在于继承通用盲量子计算的盲性并利用陷阱化机制实现可验证性，且突破传统接受/中止二元结果，在恶意服务器下仍能估计被污染生成样本的数量。\n3. 这将可验证量子计算与应用层基准测试相衔接，为安全委托量子生成模型的质量评估、部署及端到端训练扩展提供了可操作的方向。", "summary_source": "deepseek", "authors": [{"name": "Matteo Inajetovic"}, {"name": "Anna Pappa"}, {"name": "Petros Wallden"}], "featured_authors": [{"name": "Matteo Inajetovic"}, {"name": "Anna Pappa"}, {"name": "Petros Wallden"}], "author_count": 3}, {"id": "2610.13228", "category": "quant-ph", "title": "Block encoding of semiseparable matrices via their generators", "abstract": "We present an explicit quantum circuit that constructs a block encoding of a generator-representable semiseparable (one-pair) matrix directly from its two generators. For an $N\\times N$ semiseparable matrix with $N=2^{n}$, the circuit uses $2n+2$ ancilla qubits and has $O({\\rm polylog} N)$ depth, and it realizes a $(2\\sqrt{N},\\,2n+2,\\,2 \\sqrt{2}\\ \\varepsilon)$-block encoding, where $\\varepsilon$ is controlled by the accuracy of the state-preparation routines that load the generators. The building blocks of the circuit are cyclic shifts, swaps, and Hadamard gates, each admitting an efficient implementation through the binary decomposition of the relevant indices.", "url": "https://arxiv.org/abs/2610.13228", "type": "理论", "summary": "1. 该工作围绕《Block encoding of semiseparable matrices via their generators》对应的问题给出了新的分析、建模或计算结果。\n2. 其卖点在于把核心物理图像、技术路线或数值证据压缩为可直接比较的结论。\n3. 这为相关体系的后续理论推演、算法验证或实验设计提供了可参考的出发点。", "summary_source": "translation-fallback", "authors": [{"name": "Giacomo Antonioli"}, {"name": "Gianna M. Del Corso"}, {"name": "Roel Van Beeumen"}], "featured_authors": [{"name": "Giacomo Antonioli"}, {"name": "Gianna M. Del Corso"}, {"name": "Roel Van Beeumen"}], "author_count": 3}, {"id": "2610.13233", "category": "quant-ph", "title": "Percolation of Data Constraints and Reorganization of Boolean Function States in Parity Learning", "abstract": "We study how a neural network reorganizes its learned function as training proceeds and as previously unseen parity data accumulate. The trained model is itself a Boolean function on binary strings of finite length. We then evaluate it on all data, inside and outside the training set, and read off its complete sign table. Its $\\pm1$ entries are the amplitudes of a normalized state, dubbed the function-state, whose inverse subsystem purity $K_f=1/\\textrm{Tr}(\\rho_A^2)$ is an effective Schmidt rank. We find that small data additions broaden the Schmidt spectrum, whereas larger additions reconcentrate it in the target mode. The former is called differentiation because the model distinguishes inputs more sharply. The latter is called target-selective recoherence, where the model settles on the single rule shared by the added data. As the dataset grows, the connectivity of the constraint graph defined by the training set increases monotonically, whereas the learned inverse purity changes nonmonotonically. On a fixed connected dataset, as learning proceeds, the Schmidt spectrum begins to reorganize, followed by gains in target alignment and later by improvement in predictive accuracy. This ordering distinguishes three aspects of learning: constraint identifiability, function-state organization, and predictive accuracy. At fixed data size, a function that has already been learned can re-differentiate, an event we call retreat, without changing graph connectivity. Recovery reconcentrates the Schmidt spectrum in a similar target-selective pattern, without exact recurrence of the Boolean state. Thus the percolation of data constraints fixes the identifiable support, while the reduced state produced by training continues to reorganize even after that support stops changing.", "url": "https://arxiv.org/abs/2610.13233", "type": "理论+数值", "summary": "1. 该文将奇偶学习模型视为有限二进制串上的布尔函数，由完整符号表构造归一化函数态，并以逆子系统纯度定义有效Schmidt秩，追踪其重构。\n2. 其关键在于数据约束图连通性单调增长而逆纯度非单调变化，并区分约束可识别性、函数态组织与预测精度三个层面。\n3. 这意味数据约束的渗流决定可识别支撑，但训练所得约化态在支撑停止变化后仍持续重组，为表示学习提供机制性启发。", "summary_source": "deepseek", "authors": [{"name": "Han Ma"}], "featured_authors": [{"name": "Han Ma"}], "author_count": 1}, {"id": "2610.13250", "category": "quant-ph", "title": "Zak Phase Quantization without Global Symmetry through Destructive Interference", "abstract": "The Zak phase provides a fundamental geometric characterization of one-dimensional band structures and, when quantized by symmetry, serves as a bulk indicator of polarization and boundary phenomena. Conventionally, its exact quantization is tied to a global symmetry of the Bloch Hamiltonian, such as inversion or reflection symmetry. Here, we demonstrate a distinct mechanism by which the Zak phase remains exactly quantized even when the corresponding protecting symmetry is explicitly broken at the level of the full Hamiltonian. The mechanism is based on local support symmetry and destructive interference: symmetry-breaking degrees of freedom are coupled to a topological parent system in such a way that the relevant Bloch states cannot leak into them. The preserved states therefore retain their parent wave functions and inherit their quantized Zak phase exactly, despite the absence of the protecting global symmetry. We establish this mechanism for general one-dimensional insulators and demonstrate it in an inversion-broken minimal model and a reflection-broken armchair nanoribbon, where a quantized $\\pi$ Zak phase and associated boundary-localized states persist. We further show that perturbations violating the exact destructive-interference condition continuously dequantize the Zak phase, while a finite regime with a near-$\\pi$ Zak phase and boundary response can survive. Our results establish wave-function support, rather than global symmetry alone, as a mechanism for protecting quantized quantum geometry in one-dimensional systems.", "url": "https://arxiv.org/abs/2610.13250", "type": "理论", "summary": "1. 该工作提出一种无需全局对称性即可保持 Zak 相位精确量子化的机制，通过局域支撑与破坏性干涉实现。\n2. 其卖点在于：将破缺对称性的自由度耦合到拓扑母体系，使相关布洛赫态无法泄漏，受保护态保留母体波函数并严格继承量子化 Zak 相位；在破缺反演的最小模型与破缺反射的扶手椅纳米带中，π Zak 相位及边界局域态得以持续存在。\n3. 这确立了波函数支撑而非仅全局对称性可作为一维量子几何的保护机制；微扰若破坏严格干涉条件，Zak 相位会连续退量子化，但有限区间内近 π 相位与边界响应仍可存活，为后续模型与实验平台提供启发。", "summary_source": "deepseek", "authors": [{"name": "Geonwoo Hwang"}, {"name": "Jun-Won Rhim"}], "featured_authors": [{"name": "Geonwoo Hwang"}, {"name": "Jun-Won Rhim"}], "author_count": 2}, {"id": "2610.13283", "category": "quant-ph", "title": "Circuit Design Problems in Binary Polynomial Quantum Optimization", "abstract": "Solving combinatorial optimization problems on near-term quantum computers mainly relies on their quadratic unconstrained binary formulation. Lately, binary polynomial formulations start to take the center stage, having a better scaling with respect to the number of used qubits. However, while quadratic forms are straightforward to implement on quantum circuits, polynomial forms of degree $d$ incur in circuit depth overheads, due to the lack of $d$-qubit gates, for $d\\geq 3$, on current hardware. In this paper, we study the problem of designing the shallowest quantum circuit for a given polynomial form. We formulate it as a classical binary linear problem and we prove the \\textsf{NP}-completeness of a variant of it. On the algorithmic side, we offer a scalable and performant heuristic method to tackle it, Tempura, as well as faster binary linear problem formulations, which offer computational feasibility while sacrificing optimality. Our performance evaluation shows that the algorithms yield far shorter circuits than the state-of-the-art approaches, and Tempura is mostly comparable with them in terms of runtime.", "url": "https://arxiv.org/abs/2610.13283", "type": "理论+数值", "summary": "1. 该工作研究二元多项式量子优化中给定多项式形式的最浅量子线路设计问题，并将其形式化为经典二元线性问题。\n2. 主要技术卖点在于证明其变体的NP完全性，并提出可扩展启发式Tempura及牺牲最优性换取可行性的二元线性表述。\n3. 性能评估显示所得线路远短于现有方法且Tempura运行时间大体相当，为高阶量子优化线路编译提供了可扩展思路。", "summary_source": "deepseek", "authors": [{"name": "Dylan Laplace Mermoud"}, {"name": "Dimitri Watel"}, {"name": "Sourour Elloumi"}, {"name": "Andrea Simonetto"}], "featured_authors": [{"name": "Dylan Laplace Mermoud"}, {"name": "Dimitri Watel"}, {"name": "Sourour Elloumi"}, {"name": "Andrea Simonetto"}], "author_count": 4}, {"id": "2610.13349", "category": "quant-ph", "title": "A General Method for Extending Isoscattering Non-Isospectral Quantum Graphs", "abstract": "The present paper sets out a general method for extending the isoscattering, non-isospectral quantum graphs. The methodology is illustrated by considering two graphs, denoted by $\\Gamma_1$ and $\\Gamma_2$, which have the same total metric length but different topologies. It is demonstrated that, despite the fact that their scattering matrices are identical, their eigenvalues, denoted by $k_n$, and Euler characteristics differ from one another. The next step in the process is to extend both graphs by affixing the same star graph to each of them. Utilising the Titchmarsh-Weyl M-function formalism, it is proven that the newly constructed, extended graphs are also isoscattering and non-isospectral.", "url": "https://arxiv.org/abs/2610.13349", "type": "理论", "summary": "1. 该工作提出一种扩展等散射非等谱量子图的一般方法，并以总度量长度相同、拓扑不同且散射矩阵相同但本征值k_n与欧拉特征不同的Γ1、Γ2为例加以说明。\n2. 其技术关键在于将同一星形图分别接附到Γ1和Γ2上进行扩展，并借助Titchmarsh-Weyl M函数形式证明扩展后的新图仍等散射但非等谱。\n3. 这为在保持散射矩阵不变的前提下系统构造谱与拓扑不同的量子图提供了可推广框架，并对谱反演与同散射异构问题具有启发。", "summary_source": "deepseek", "authors": [{"name": "Omer Farooq"}, {"name": "Michal Lawniczak"}, {"name": "Leszek Sirko"}], "featured_authors": [{"name": "Omer Farooq"}, {"name": "Michal Lawniczak"}, {"name": "Leszek Sirko"}], "author_count": 3}, {"id": "2610.13359", "category": "quant-ph", "title": "System-Design Optimization of a Single-Transmitter, Single-Fiber QKD-based ITS Communication Link", "abstract": "Deploying QKD-based secure communication at scale requires reducing duplicated optical hardware while preserving the rate of protected user data. Earlier studies established the physical feasibility of carrying CV-QKD and classical signals over shared infrastructure, motivating a quantitative comparison between optical hardware savings and the OTP-encrypted rate. We perform this comparison by defining the secure communication rate (SCR) as the rate jointly supported by secret-key generation and classical transport, and using it to optimize a shared discrete-modulation CV-QKD link. The model combines a binomial 64-QAM security bound with a trusted receiver, protocol traffic, spectral leakage - optical power leaking into the quantum receive band - and Raman scattering. At 25 km, the asymptotic model gives an optimized SCR of 12.079 Mbps, compared with 12.095 Mbps for a separated-link reference, while reducing the transmitter and fiber counts from two to one each in the modeled direction. Increasing channel separation suppresses spectral leakage, but the resulting SCR gain diminishes once receiver bandwidth limits the rate. Under the adopted receiver-noise law, increasing the bandwidth budget from 350 to 750 MHz raises the projected 25-km SCR to 24.535 Mbps despite higher trusted electronic noise. For the studied metropolitan link, sharing saves optical resources with little rate loss, while receiver-bandwidth improvements provide greater benefit than further spectral separation. Together, these results suggest an integration path: share the transmitter and fiber, limit unwanted classical power in the quantum receive band, and increase usable receiver bandwidth where the noise budget permits.", "url": "https://arxiv.org/abs/2610.13359", "type": "理论+数值", "summary": "1. 该工作围绕《System-Design Optimization of a Single-Transmitter, Single-Fiber QKD-based ITS Communication Link》对应的问题给出了新的分析、建模或计算结果。\n2. 其卖点在于把核心物理图像、技术路线或数值证据压缩为可直接比较的结论。\n3. 这为相关体系的后续理论推演、算法验证或实验设计提供了可参考的出发点。", "summary_source": "translation-fallback", "authors": [{"name": "Shivang Srivastava"}, {"name": "Guillaume Ricard"}, {"name": "Yves Jaouën"}, {"name": "Matteo Schiavon"}, {"name": "Romain Alléaume"}], "featured_authors": [{"name": "Shivang Srivastava"}, {"name": "Guillaume Ricard"}, {"name": "Yves Jaouën"}, {"name": "Matteo Schiavon"}, {"name": "Romain Alléaume"}], "author_count": 5}, {"id": "2610.13417", "category": "quant-ph", "title": "Modelling Josephson Junctions with Boundary Conditions: Towards High-Fidelity Models for Superconducting Qubits", "abstract": "Josephson junctions are the central nonlinear element of superconducting qubits, yet their standard description is reached through a chain of approximations. We propose a purely quantum-mechanical model of the junction, formulated directly in Hilbert space: a charged particle moves on a one-dimensional loop, and the junction is a point at which the wave function obeys self-adjoint boundary conditions, labelled by a coupling strength $\\lambda$, which controls the transparency of the junction, and a phase jump $\\delta$, which plays the role of the superconducting phase difference. For a loop with a single junction we solve the spectral problem and show that the ground-state momentum expectation, identified with the supercurrent, factorises exactly as $\\langle\\hat{p}_0\\rangle = I_c(\\delta,\\lambda)\\sin\\delta$. For opaque junctions $I_c$ becomes independent of $\\delta$ and the first Josephson relation $I=I_c\\sin\\delta$ is recovered; for strongly attractive coupling, where the ground state is bound to the junction, the $\\sin\\delta$ law is also recovered, but with an exponentially suppressed amplitude. For more transparent junctions, however, the model \\emph{predicts} deviations from the pure $\\sin\\delta$ law: $I_c$ acquires a dependence on $\\delta$ already at order $\\lambda^{-2}$, compatible with the higher Josephson harmonics recently found necessary to describe superconducting qubit spectra, and a fully transparent contact yields a current linear in $\\delta$. When the phase varies in time, a gauge transformation shows that the voltage drop across the junction is proportional to $\\dot\\delta$, so that the second Josephson relation emerges without being imposed. The boundary-condition approach thus reproduces both Josephson relations from first principles and predicts corrections to them, offering a route towards higher-fidelity models of superconducting qubits.", "url": "https://arxiv.org/abs/2610.13417", "type": "理论", "summary": "1. 该工作提出纯量子力学约瑟夫森结模型：一维环上带电粒子在结点满足自伴边界条件，由耦合强度和相位跳变参数化。\n2. 其卖点是基态动量期望严格分解为 Ic(δ,λ)sinδ，从不透明极限到完全透明结均给出第一关系及其高阶修正，并由规范变换自然导出第二关系。\n3. 该边界条件框架从第一性原理重现并修正两个约瑟夫森关系，为超导量子比特的高保真建模提供了明确路径。", "summary_source": "deepseek", "authors": [{"name": "Luis Bueno Blanco"}, {"name": "Juan Manuel Pérez-Pardo"}], "featured_authors": [{"name": "Luis Bueno Blanco"}, {"name": "Juan Manuel Pérez-Pardo"}], "author_count": 2}, {"id": "2610.13477", "category": "quant-ph", "title": "Harmonic analysis and circuit approximation of Sobolev functions on quantum input spaces", "abstract": "We derive approximation rates for Sobolev functions defined on the complex unit sphere and complex projective space, representing quantum states, and on the special and projective unitary groups, representing quantum unitary operations. By using harmonic analysis on compact groups and compact homogeneous spaces, we characterize the corresponding Peter--Weyl decompositions and Sobolev spaces via irreducible representations and the Laplace--Beltrami operator. Combining spectral truncation with finite-depth quantum-circuit approximation, invoking the Solovay--Kitaev theorem, we establish quantitative rates that separate the spectral truncation error from the circuit approximation error.", "url": "https://arxiv.org/abs/2610.13477", "type": "理论", "summary": "1. 该工作针对表示量子态的复单位球与复射影空间，以及表示量子酉操作的特殊酉群与射影酉群，推导其上 Sobolev 函数的逼近速率。\n2. 其卖点是用紧群与紧齐性空间上的调和分析、Peter-Weyl 分解及不可约表示和 Laplace-Beltrami 算子刻画相应 Sobolev 空间，并将谱截断与有限深度量子线路逼近用 Solovay-Kitaev 定理结合，定量分离两类误差。\n3. 这为量子态与酉操作空间上的函数逼近、线路编译及相关学习任务提供了误差可分离的复杂度分析框架。", "summary_source": "deepseek", "authors": [{"name": "Philipp Schmocker"}], "featured_authors": [{"name": "Philipp Schmocker"}], "author_count": 1}, {"id": "2610.13512", "category": "quant-ph", "title": "Construction of isoscattering non-isospectral quantum graphs using the concept of a germ graph", "abstract": "The recently developed concept of germ graphs (P. Kurasov {\\it et al.}, Phys. Rev. Research {\\bf 7}, L022071 (2025)) is employed to construct families of isocattering, non-isospectral graphs that exhibit dissipation. More specifically, a new pair of isoscattering non-isospectral graphs is constructed by connecting the existing isoscattering non-isospectral graphs, so called attachments, to the different contact vertices of the germ graph. The existing isoscattering non-isospectral graphs contained a two-loop graph labelled $\\Gamma_{A2}$ and a three-loop graph labelled $\\Gamma_{A3}$. These graphs have an equal total metric length, but different topologies. The resulting graphs $\\Gamma_3$ and $\\Gamma_4$ are verified as non-isospectral using their Euler characteristics, while their isoscattering properties are investigated by calculating the one-port scattering matrices numerically.", "url": "https://arxiv.org/abs/2610.13512", "type": "数值", "summary": "1. 该工作借助新近提出的胚图概念，将既有等散射非等谱图作为附着体连接到胚图的不同接触顶点，构造出带耗散的新型等散射非等谱图对 Γ3 与 Γ4。\n2. 其技术要点是以总度量长度相同但拓扑不同的二环图 Γ_A2 与三环图 Γ_A3 为构件，用欧拉示性数判定所得图非等谱，并通过单端口散射矩阵的数值计算验证其等散射性。\n3. 这说明胚图方法可系统生成耗散量子图上的等散射非等谱图族，为量子图散射与谱几何的构造性研究提供可推广思路，并可能启发后续理论或实验探索。", "summary_source": "deepseek", "authors": [{"name": "Omer Farooq"}, {"name": "Michał Ławniczak"}, {"name": "Leszek Sirko"}], "featured_authors": [{"name": "Omer Farooq"}, {"name": "Michał Ławniczak"}, {"name": "Leszek Sirko"}], "author_count": 3}, {"id": "2610.13589", "category": "quant-ph", "title": "Decoder- and Noise-Aware Optimization Framework for Clifford-Deformed Quantum Error-Correcting Codes", "abstract": "Practical fault-tolerant quantum computing requires qubit-efficient quantum error correction (QEC). Clifford deformations (CDs) modify the stabilizers of a QEC code to lower its logical error rate at no additional resource cost. However, the number of possible CDs grows exponentially with the number of qubits, making exhaustive search infeasible beyond small codes. In this work, we further show that under circuit level noise the optimal CD depends strongly on both the noise model and decoder. To make systematic CD optimization possible, we introduce Evolution-Based Best-arm Identification (EBBI), a shot-efficient search algorithm that treats the circuit, noise model and decoder as a black box. We benchmark EBBI's performance on the rotated surface code, under two strongly $Z$-biased circuit-level noise models with the PyMatching decoder. At distance 3, EBBI finds the optimal CD using up to $\\sim 1100\\times$ fewer shots than random search. At distance 5, when run at the target error rate, the median EBBI run converges to the CDs we believe to be optimal, while random search never converges. Under a $Z$-biased SI1000-like noise model, EBBI discovers a new CD, the B-XZZX code, which we generalized to larger distances. It differs from XZZX on only a fraction $\\mathcal{O}(d^{-1})$ of the qubits at code distance $d$, yet its relative advantage grows from $\\approx 5\\%$ at $d = 3$ to $\\approx 12\\%$ at $d = 11$. We thus show that the B-XZZX pattern found by EBBI can be systematically scaled to larger code distances. Our work represents a first step towards scalable CD optimization for general QEC codes.", "url": "https://arxiv.org/abs/2610.13589", "type": "理论+数值", "summary": "1. 该工作指出电路级噪声下最优Clifford形变依赖噪声模型与解码器，并提出EBBI算法在旋转表面码上搜索最优形变。\n2. EBBI将电路、噪声与解码器视为黑箱，采样高效：d=3较随机搜索少约1100倍，d=5中位运行可收敛并发现B-XZZX码。\n3. 在Z偏置SI1000类噪声下，B-XZZX与XZZX仅差O(1/d)量子比特，优势随码距从约5%增至约12%，为通用QEC码可扩展优化提供起点。", "summary_source": "deepseek", "authors": [{"name": "Julius Rye Bønnelykke"}, {"name": "Benjamin Joecker"}, {"name": "Peter Krogstrup"}, {"name": "Vincent Philippe Michal"}, {"name": "Mark Kamper Svendsen"}], "featured_authors": [{"name": "Julius Rye Bønnelykke"}, {"name": "Benjamin Joecker"}, {"name": "Peter Krogstrup"}, {"name": "Vincent Philippe Michal"}, {"name": "Mark Kamper Svendsen"}], "author_count": 5}, {"id": "2610.13602", "category": "quant-ph", "title": "Entanglement Catalysis Beyond the Asymptotic Rate", "abstract": "Quantum entanglement is a fundamental resource in quantum information science, commonly consumed to perform tasks like quantum teleportation and quantum key distribution. Entanglement concentration converts partially entangled pure states into nearly perfect Bell pairs. While its efficiency is well understood in the asymptotic limit, practical protocols must operate with finite systems. In this finite regime, and at the low error levels relevant in practice, performance is penalized by corrections that reduce the achievable yield. We investigate whether this fundamental finite-size penalty can be mitigated by an entanglement catalyst: an auxiliary state that aids the transformation but is returned exactly and uncorrupted. Although such a catalyst cannot increase the leading-order asymptotic yield, we show that it fundamentally alters the finite-size scaling. For every bipartite pure state with nonuniform Schmidt coefficients, we exactly determine the optimal second-order correction to the yield and show that catalysis completely overcomes this finite-size penalty.", "url": "https://arxiv.org/abs/2610.13602", "type": "理论+数值", "summary": "1. 该工作研究纠缠浓缩在有限系统低误差下产率受二阶修正惩罚的问题，并考察纠缠催化能否消除该惩罚；对任意非均匀施密特系数的二分纯态，精确求解了最优二阶修正。\n2. 其核心贡献在于：催化剂虽不能提升渐近主导阶产率，却从根本上改变有限尺寸标度，并使催化完全克服该有限尺寸惩罚，达到最优二阶产率。\n3. 这为实用有限码长、低误差条件下的纠缠浓缩提供新途径：催化辅助态可作资源调控，超越渐近速率层面的限制，并启发后续协议与实验设计。", "summary_source": "deepseek", "authors": [{"name": "Alexander Streltsov"}], "featured_authors": [{"name": "Alexander Streltsov"}], "author_count": 1}, {"id": "2610.13621", "category": "quant-ph", "title": "Encoding Matters: A Qubit-Efficient Reformulation for Quantum Resilient Routing", "abstract": "Qubits are powerful computational resources because each additional qubit doubles the size of the accessible state space. This expressive power comes at a cost: adding qubits also increases circuit size, constraint overhead, and exposure to hardware noise. These limitations are especially critical for near-term quantum computers, making the number of qubits required to formulate a problem a central practical concern. In this work, we present a method for efficiently mapping logistics and routing problems onto qubits through structure-aware encoding reduction. We demonstrate the method on a benchmark problem of latency-resilient routing under dual-link failures. For this benchmark, the reduced formulation substantially lowers both the qubit count and the compiled circuit complexity while preserving the original optimization task. By running the reduced model on the same trapped-ion quantum computer as the benchmark, we obtain a 100X improvement in the success probability. This finding shows how careful problem formulation can make current quantum hardware substantially more effective for practical optimization.", "url": "https://arxiv.org/abs/2610.13621", "type": "理论+数值", "summary": "1. 该工作针对量子弹性路由问题提出一种结构感知的编码约简方法，将物流与路由问题更高效地映射到量子比特，并在双链路失效下的时延弹性路由基准上给出约简模型。\n2. 其核心卖点在于不改变原优化任务的前提下显著降低所需量子比特数与编译后电路复杂度，并在同一离子阱量子计算机上使成功概率相对基准提升约100倍。\n3. 这表明面向近中期硬件的量子优化研究应重视问题编码与形式化，通过更紧凑的比特资源占用和更浅电路释放现有硬件的实际求解能力。", "summary_source": "deepseek", "authors": [{"name": "Emanuele G. Dalla Torre"}, {"name": "Bat-El Friedman"}, {"name": "Daniel Porat"}], "featured_authors": [{"name": "Emanuele G. Dalla Torre"}, {"name": "Bat-El Friedman"}, {"name": "Daniel Porat"}], "author_count": 3}, {"id": "2610.13652", "category": "quant-ph", "title": "Finite-Size Limits of Adaptive Pauli Prediction", "abstract": "Can quantum data reliably answer questions chosen from earlier results? We prove that $M$ adaptive Pauli predictions on $n$ qubits require $\\Omega(\\sqrt{\\min\\{n,M\\}})$ copies at fixed accuracy. Published upper bounds make this tight for $M\\le n$. Thus $n$ adaptive predictions cost $\\Theta(\\sqrt n)$ copies, whereas a fixed list costs only $O(\\log n)$. The lower bound uses diagonal states and commuting observables, identifying a statistical cost of adaptation. We also quantify how this cost increases with precision.", "url": "https://arxiv.org/abs/2610.13652", "type": "理论", "summary": "1. 该工作证明了对 n 个量子比特进行 M 次自适应 Pauli 预测时，在固定精度下至少需要 Ω(√min{n,M}) 个副本，并在 M≤n 时与已知上界匹配。\n2. 其卖点在于用对角态与相互对易可观测量构造下界，揭示自适应选择带来的统计代价：n 次自适应预测需 Θ(√n) 个副本，而固定列表仅需 O(log n)，并进一步量化该代价随精度提高的增长。\n3. 这为自适应量子测量与预测协议确立了有限尺寸下的资源下界，表明问题依赖先前结果的选择本身具有不可避免的统计成本，并为量子学习实验的资源估计提供依据。", "summary_source": "deepseek", "authors": [{"name": "Luofei Wang"}, {"name": "Boyu Liu"}, {"name": "Zihe Wang"}, {"name": "Zhangqi Yin"}], "featured_authors": [{"name": "Luofei Wang"}, {"name": "Boyu Liu"}, {"name": "Zihe Wang"}, {"name": "Zhangqi Yin"}], "author_count": 4}, {"id": "2610.13709", "category": "quant-ph", "title": "Dynamical Lie Algebras for Fixed-Gate Quantum Ansätze", "abstract": "Parameterized Quantum Circuits have emerged as a central framework for variational quantum algorithms in the NISQ regime, with major applications in quantum simulation, combinatorial optimization, and, more recently, quantum machine learning (QML). By developing a new approach for computing dynamical Lie algebras associated with quantum circuits combining parametrized gates and non-parametrized entangling gates, we aim to extend the applicability of recent algebraic results to architectures that are actually used in quantum machine learning.", "url": "https://arxiv.org/abs/2610.13709", "type": "数值", "summary": "1. 该工作提出了一种计算固定门量子拟设动力学李代数的新方法，可处理参数化门与固定纠缠门的组合。\n2. 其卖点在于把近期李代数结果推广至量子机器学习实际采用的含非参数化纠缠门架构。\n3. 这为QML线路的代数分析、可表达性与后续架构设计提供了可直接应用的工具体系。", "summary_source": "deepseek", "authors": [{"name": "Orlane Zang"}, {"name": "Daniel Juteau"}, {"name": "Tony Quertier"}, {"name": "Grégoire Barrué"}], "featured_authors": [{"name": "Orlane Zang"}, {"name": "Daniel Juteau"}, {"name": "Tony Quertier"}, {"name": "Grégoire Barrué"}], "author_count": 4}, {"id": "2610.13784", "category": "quant-ph", "title": "Locality-Preparation Time Tradeoffs in Dissipative Quantum Systems", "abstract": "Dissipative state preparation engineers quantum many-body states as steady states of an open-system dynamics. The spatial range of the required dissipation sets both the feasibility of analog implementations and the connectivity and control complexity of digital ones. Yet how this locality quantitatively constrains preparation times remains largely unknown. Here, we establish an exact locality-preparation time relation for quadratic fermionic systems and develop a construction that optimizes the locality of the dissipative dynamics while preserving the target state. Applied to the Kitaev chain, our framework reveals sharply different locality-preparation time tradeoffs in critical and gapped regimes. At criticality, suppressing the algebraic tails of the jump operators necessarily forces the preparation time to grow algebraically with system size. By contrast, both trivial and topological gapped phases admit exponentially localized dissipation with a finite preparation time in the thermodynamic limit. Our results identify when fast dissipative preparation is compatible with local control and when criticality imposes an unavoidable dynamical cost.", "url": "https://arxiv.org/abs/2610.13784", "type": "理论+数值", "summary": "1. 该工作针对耗散态制备中局域性与制备时间的约束，对二次费米子系统建立了精确的局域性—制备时间关系，并构造了在保持目标态的同时优化耗散局域性的方案。\n2. 其核心贡献在于将该关系应用于一维Kitaev链，揭示临界区为压制跳跃算符代数尾必须使制备时间随系统尺寸代数增长，而有能隙的平庸与拓扑相均允许指数局域耗散并在热力学极限下保持有限制备时间。\n3. 该结果明确了快速耗散制备与局域控制兼容的条件，并表明临界性会施加不可避免的动力学代价，为开放量子多体态制备的局域性与时间权衡提供了判据与启发。", "summary_source": "deepseek", "authors": [{"name": "Philipp Westhoff"}, {"name": "Sara Murciano"}, {"name": "Mattia Moroder"}], "featured_authors": [{"name": "Philipp Westhoff"}, {"name": "Sara Murciano"}, {"name": "Mattia Moroder"}], "author_count": 3}, {"id": "2610.13854", "category": "quant-ph", "title": "No advantage from classical assistance for energy-constrained bosonic dephasing channels", "abstract": "We prove that four capacities of single-mode bosonic dephasing channels coincide under an average photon-number constraint: the unassisted quantum capacity, the unassisted private capacity, the two-way classically assisted quantum capacity, and the two-way public-classically assisted private capacity. The assistance may be interactive: the parties can exchange classical messages between channel uses and choose subsequent inputs based on earlier outcomes. For every finite value of the constraint, their common value is the coherent information optimized over Fock-diagonal input states satisfying the constraint. The proof uses a relative entropy comparison with the completely dephasing channel to derive chain rules for the Rains relative entropy and the relative entropy of entanglement. These chain rules give an upper bound on the rates achievable by adaptive protocols whose mean input photon number is constrained on average over all channel uses. We also show that both chain rules are attained by canonical purifications of finite-energy Fock-diagonal states.", "url": "https://arxiv.org/abs/2610.13854", "type": "理论+数值", "summary": "1. 该文证明在平均光子数约束下，单模玻色退相干信道的无辅助量子、无辅助私密、双向经典辅助量子及双向公开经典辅助私密四种容量相等。\n2. 其技术卖点是用与完全退相干信道的相对熵比较导出Rains相对熵和纠缠相对熵的链式规则，将共同值化为Fock对角态上受限优化的相干信息。\n3. 这些链式规则给出平均光子数约束下自适应协议速率的普适上界，表明交互经典辅助不能提升该信道的能量受限容量，并为有限能量Fock对角态的典型纯化提供可达性。", "summary_source": "deepseek", "authors": [{"name": "Amir Arqand"}, {"name": "Graeme Smith"}], "featured_authors": [{"name": "Amir Arqand"}, {"name": "Graeme Smith"}], "author_count": 2}, {"id": "2610.13879", "category": "quant-ph", "title": "GPU-Based Parallel BP Decoding for Quantum LDPC Memory", "abstract": "Quantum low-density parity-check (qLDPC) decoding requires reliable corrections and low latency over long syndrome histories. We extend BP-SF, an oscillation-guided belief-propagation (BP) decoder with independent syndrome-flip trials, by introducing windowed and streaming operations. Our CUDA implementation combines disordered-memory retries, sliding windows, correlation-aware graphs, and layered scheduling. Circuit-level simulations test fixed-basis memory and complete logical Pauli-frame recovery. On the [[144,12,12]] bivariate bicycle code at physical error rate p = 0.002, parallel BP-SF reduces 99.9th-percentile call latency by a factor of 13.15 relative to an eight-chain Relay-BP GPU baseline on 100,000 matched samples for which every tested method's initial BP stage fails within 80 iterations. Windowed BP-SF maintains a flat logical error rate and nearly constant per-round compute time through 512 rounds, reaching a 17.1-fold speedup over monolithic decoding. In 512-round full-frame streaming decoding with 2.97-ms syndrome arrivals, layered BP-SF on a transformed joint graph with 20 retries reduces 99.9th-percentile correction-release age from 166.29 to 36.25 ms relative to the joint graph with flooding updates and 100 retries. These results connect parallel BP post-processing to lower decoding costs and earlier correction release in streaming quantum memory.", "url": "https://arxiv.org/abs/2610.13879", "type": "数值", "summary": "1. 量子低密度奇偶校验 (qLDPC) 解码需要在较长的综合症历史上实现可靠的校正和低延迟。\n2. 在具有 2.97 毫秒综合症到达的 512 轮全帧流解码中，相对于具有洪泛更新和 100 次重试的联合图，在经过 20 次重试的变换联合图上分层 BP-SF 将 99.9% 的校正释放年龄从 166.29 毫秒减少到 36.25 毫秒。\n3. 这为相关模型、算法、实验平台或后续理论研究提供了可继续推进的方向。", "summary_source": "local-fallback", "authors": [{"name": "Ming Wang"}, {"name": "Yanbo Zhao"}, {"name": "Ang Li"}, {"name": "Frank Mueller"}], "featured_authors": [{"name": "Ming Wang"}, {"name": "Yanbo Zhao"}, {"name": "Ang Li"}, {"name": "Frank Mueller"}], "author_count": 4}, {"id": "2610.13903", "category": "quant-ph", "title": "Maximally antiflat fixed-particle-number fermionic states", "abstract": "Fermionic Gaussian states are completely characterized by their two-point correlations, making the covariance matrix a natural reference for quantifying non-Gaussian structure. Motivated by fermionic antiflatness, we study its extremal form for pure number-conserving states and ask which states can be maximally antiflat and how they can be constructed. We show that, at fixed particle number, maximal first antiflatness is equivalent to a completely flat one-body reduced density matrix, and we obtain a complete existence classification together with explicit block and cyclic-orbit constructions of all allowed sectors. We then investigate the structure that appears beyond the covariance level. Maximally antiflat states with identical one-body data can exhibit distinct connected four-point correlations, which we characterize through the four-point Majorana Wick error and, equivalently, the connected two-body reduced density matrix cumulant. We show that this quartic structure is necessarily nonzero and formulate its extremization as a two-body reduced density matrix (2RDM) purity problem. Combining this framework with a Hilbert--Schmidt estimate of Christiansen for truncated two-body correlations, we obtain an upper bound on the connected quartic structure in terms of first antiflatness. Our results establish both a complete characterization of maximal fermionic antiflatness at fixed particle number and a constrained hierarchy linking covariance-level flatness to higher-order non-Gaussian correlations.", "url": "https://arxiv.org/abs/2610.13903", "type": "理论", "summary": "1. 该工作研究固定粒子数纯费米子态的最大反平坦性，给出存在性分类以及所有允许扇区的块和循环轨道构造。\n2. 其核心结论是最大一阶反平坦等价于完全平坦的单体约化密度矩阵，且相同单体数据可对应不同的连通四点关联。\n3. 由此将四阶结构刻画为两体约化密度矩阵纯度问题并给出以反平坦性表示的上界，建立协方差平坦性与高阶非高斯关联的约束层级。", "summary_source": "deepseek", "authors": [{"name": "Rahul Gupta"}, {"name": "Arya Haghighian"}, {"name": "James D. Whitfield"}], "featured_authors": [{"name": "Rahul Gupta"}, {"name": "Arya Haghighian"}, {"name": "James D. Whitfield"}], "author_count": 3}, {"id": "2610.13906", "category": "quant-ph", "title": "Quantum Query Complexity of Maximum Degree and its Generalizations", "abstract": "We study the quantum query complexity of several basic graph problems. 1) We prove a tight $\\Theta(n^{3/2})$ bound for finding a maximum-out-degree vertex in an $n$-vertex tournament, resolving a conjecture of Mande, Paraashar, and Saurabh [FSTTCS'23]. 2) Using the same proof idea, we give a direct proof that finding a maximum-degree vertex in an $n$-vertex undirected graph requires $\\Theta(n^{3/2})$ quantum queries, a bound implicit in the work of Apers and Lee [CCC'21]. Both lower bounds above hold even for computing only the maximum degree or maximum out-degree. 3) We also study Maximum $(k,n-k)$-Cut, which asks for the largest cut with one side of size $k$. For every constant $k\\geq 1$, we give an $O(n^{2-1/(k+1)})$-query quantum algorithm. 4) We establish a reduction to Maximum $(k,n-k)$-Cut involving $k$-Graph Collision, which asks whether the marked vertices of a known graph contain a $k$-clique. For $k\\geq 3$, this yields unconditional lower bounds with exponents strictly larger than $3/2$, showing that this problem is strictly harder than computing maximum degree. Additionally, under a conjecture we propose for $k$-Graph Collision, the reduction yields a lower bound matching our upper bound above.", "url": "https://arxiv.org/abs/2610.13906", "type": "理论+数值", "summary": "1. 该工作研究了最大度及其推广的量子查询复杂度，包括竞赛图最大出度、无向图最大度与最大(k,n-k)-割。\n2. 其核心贡献是证明最大出度与最大度均需紧的Θ(n^{3/2})量子查询下界，并给出最大(k,n-k)-割的O(n^{2-1/(k+1)})算法。\n3. 通过k-图碰撞归约，k≥3的最大(k,n-k)-割获得指数严格大于3/2的无条件下界，表明其严格难于最大度；所提猜想下该下界与上界匹配。", "summary_source": "deepseek", "authors": [{"name": "Amin Shiraz Gilani"}, {"name": "Nikhil S. Mande"}, {"name": "Subhasree Patro"}, {"name": "Nithish Raja"}], "featured_authors": [{"name": "Amin Shiraz Gilani"}, {"name": "Nikhil S. Mande"}, {"name": "Subhasree Patro"}, {"name": "Nithish Raja"}], "author_count": 4}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>${paper.summary_source === "deepseek" ? "DeepSeek three-sentence PRL summary" : (paper.summary_source === "local-fallback" ? "Local three-sentence fallback" : (paper.summary_source === "translation" ? "Chinese abstract translation" : "Chinese placeholder fallback"))}</span><a href="${safeUrl}" target="_blank" rel="noreferrer">Open arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
</body>
</html>
