le saddles that compute this index to all orders in the 4d supergravity derivative expansion and calculate their action using equivariant localization. The gravitational on-shell action localizes entirely to the north and south poles of each black hole, with the two contributions determined by the holomorphic and anti-holomorphic topological string free energies, respectively, evaluated at the attractor values of the moduli. For single-center black hole saddles, this provides a proof of the OSV conjecture to all orders in the topological string coupling. The same localization formula also applies to all saddles that contribute to the helicity supertrace, such as multi-center black holes, which leads to a non-perturbative refinement of the conjecture.", "url": "https://arxiv.org/abs/2610.12550", "type": "理论", "summary": "1. 该工作用引力路径积分证明 OSV 猜想：在四维 N=2 超引力中，通过欧几里得黑洞鞍点计算黑洞螺旋超迹，并将其与吸引子点处拓扑弦配分函数的模平方对应起来。\n2. 其核心技术卖点是等变局域化：壳上作用量完全局域于每个黑洞的南北极，两贡献分别等于吸引子模处全纯与反全纯拓扑弦自由能，从而对单中心鞍点给出拓扑弦耦合各阶的证明。\n3. 同一局域化公式还覆盖多中心黑洞等所有贡献螺旋超迹的鞍点，将猜想精炼为非微扰形式，并表明引力路径积分与拓扑弦之间存在超越微扰的精确联系。", "summary_source": "deepseek", "authors": [{"name": "Nikolay Bobev"}, {"name": "Jan Boruch"}, {"name": "Luca V. Iliesiu"}, {"name": "Dawid Maskalaniec"}], "featured_authors": [{"name": "Nikolay Bobev"}, {"name": "Jan Boruch"}, {"name": "Luca V. Iliesiu"}, {"name": "Dawid Maskalaniec"}], "author_count": 4}, {"id": "2610.12554", "category": "hep-th", "title": "GLSMs for non-polynomial deformations and generalized complete intersection Calabi-Yau manifolds", "abstract": "Gauged Linear Sigma Models (GLSMs) have long been a key tool in understanding Calabi-Yau compactifications of string theory. While descriptions of complete intersections of polynomial defining equations have long been understood in this context, a full treatment of non-polynomial complex structure deformations has been absent from the literature. Likewise, the somewhat more exotic generalized complete intersection Calabi-Yau construction has resisted a GLSM description. In this paper we resolve both of these omissions using completely standard GLSMs with polynomial superpotentials. The non-polynomial structure seen in the geometric constructions only arises in the associated GLSM upon restriction to the vacuum space of the theory. This feature enables the construction to avoid singularities in field space that could have arisen if non-polynomial structure were incorporated directly into the GLSM superpotential.", "url": "https://arxiv.org/abs/2610.12554", "type": "理论", "summary": "1. 该工作利用具有多项式超势的标准GLSM，同时给出了非多项式复结构形变与广义完全交卡拉比-丘流形的统一GLSM描述，填补了此前文献中长期缺失的两项重要空白。\n2. 其核心卖点在于，非多项式结构仅在GLSM的真空空间上显现，而不直接写入超势，从而避免了场空间中原本可能出现的奇点。\n3. 这一构造表明，可用常规多项式超势统一处理更广泛的卡拉比-丘紧化，并为后续弦论模型构造及GLSM计算提供可操作框架。", "summary_source": "deepseek", "authors": [{"name": "Lara B. Anderson"}, {"name": "James Gray"}, {"name": "Eric Sharpe"}, {"name": "Albert Haochen Zhang"}], "featured_authors": [{"name": "Lara B. Anderson"}, {"name": "James Gray"}, {"name": "Eric Sharpe"}, {"name": "Albert Haochen Zhang"}], "author_count": 4}, {"id": "2610.12560", "category": "hep-th", "title": "Quantum limit to transparency", "abstract": "We argue that no material can be made completely transparent to light as long as it has a nontrivial index of refraction. The quantum decay of photons into phonons is an ineliminable source of attenuation. This survives even once all other excitations have been gapped away, impurities have been removed, and the temperature has been set to zero. Restricting for simplicity to the case of a superfluid, we determine via effective field theory methods the corresponding low-frequency contribution to the imaginary part of the index of refraction. This scales as $\\omega^4$ and induces a nonanalyticity of the real part for $\\omega \\rightarrow 0$. We also extend our result to large coherent electromagnetic fields, such as those of a laser, showing that the effect can receive strong nonlinear enhancements. Our result is a genuine quantum lower bound to the transparency of a medium.", "url": "https://arxiv.org/abs/2610.12560", "type": "理论", "summary": "1. 该工作论证只要介质具有非平庸折射率，就不可能对光完全透明，并指出光子衰变为声子是不可避免的量子衰减来源。\n2. 以超流为简化模型，作者用有效场论给出折射率虚部的低频贡献，其按 ω^4 标度并在 ω→0 时导致实部非解析，还表明在激光等强相干电磁场下该效应可获强非线性增强。\n3. 因此这给出了介质透明度的真实量子下界，为极低温、无杂质体系中的光传播极限及强场调控提供了基本原理性约束。", "summary_source": "deepseek", "authors": [{"name": "Angelo Esposito"}, {"name": "Alberto Nicolis"}, {"name": "Federico Piazza"}], "featured_authors": [{"name": "Angelo Esposito"}, {"name": "Alberto Nicolis"}, {"name": "Federico Piazza"}], "author_count": 3}, {"id": "2610.12615", "category": "hep-th", "title": "The Real EFThedron: A Moment Geometry for the Nonperturbative S-Matrix", "abstract": "The S-matrix bootstrap restricts low-energy interactions through unitarity, analyticity and crossing symmetry. For effective field theory couplings, positivity bounds have a natural geometric formulation, the EFThedron, in which the allowed couplings form the classical positive moment problem. We show that this geometry extends to full nonlinear unitarity. Multiplying the amplitude by fractional powers of the energy turns its real part into a moment as well, so that unitarity becomes a bounded complex moment problem. Analyticity becomes a set of linear constraints requiring different kernels to reconstruct the same couplings, analogous to the null constraints imposed by crossing symmetry. In two dimensions the problem can be solved exactly, leading to Castillejo--Dalitz--Dyson amplitudes as extremal measures of the moment problem. In four dimensions we obtain closed-form and semi-analytic bounds for the massless EFThedron model and for massive scalar scattering. For massive scalars, the analyticity constraints improve on published dual bounds, reducing the gap to the primal region. By placing the real and imaginary parts of amplitudes on an equal footing, the Real EFThedron provides a powerful framework combining unitarity, analyticity and crossing, opening a new route to mapping the space of consistent quantum field theories.", "url": "https://arxiv.org/abs/2610.12615", "type": "理论", "summary": "1. 该工作提出Real EFThedron，将EFThedron的矩问题几何推广到非微扰S矩阵，借能量分数幂把振幅实部也化为矩，从而把完整非线性幺正性写成有界复矩问题，并将解析性转为不同核重构同一耦合的线性约束。\n2. 其核心创新在于让振幅实部与虚部处于同等地位：二维情形可精确求解，CDD振幅成为极值测度；四维则给出无质量EFThedron模型与有质量标量散射的闭式或半解析界。\n3. 对有质量标量，解析性约束改进了已发表的对偶界并缩小与原问题可行域的差距，为统一幺正性、解析性与交叉对称并系统映射一致量子场论空间开辟了新路径。", "summary_source": "deepseek", "authors": [{"name": "Laurentiu Rodina"}, {"name": "Anna Tokareva"}, {"name": "Yongjun Xu"}], "featured_authors": [{"name": "Laurentiu Rodina"}, {"name": "Anna Tokareva"}, {"name": "Yongjun Xu"}], "author_count": 3}, {"id": "2610.12653", "category": "hep-th", "title": "Tropical QFT and the sine-Gordon model", "abstract": "A tropical quantum field theory is an exactly solvable deformation limit of an ordinary QFT, governed by a non-linear partial differential equation. We use the integrable two-dimensional sine-Gordon theory as a testbench to compare the exact features of an undeformed model with its tropical counterpart. We classify scale-invariant tropical QFTs in $D=2$ and leverage functional renormalization group methods to demonstrate that all scale-invariant theories with periodic effective actions are infrared fixed points of flows originating from sine-Gordon Lagrangians. For the tropical sine-Gordon model, we compute the $\\beta$-functions exactly, solve the renormalized theory both via a convergent expansion and numerically for all admissible couplings, and illustrate the complete renormalization group flow from the Gaussian to the IR fixed point. Finally, we study the large-order behaviour of the loop expansion and relate it to the Hamilton-Jacobi equation, whose solutions we interpret as tropical instantons.", "url": "https://arxiv.org/abs/2610.12653", "type": "理论", "summary": "1. 该工作围绕《Tropical QFT and the sine-Gordon model》对应的问题给出了新的分析、建模或计算结果。\n2. 其卖点在于把核心物理图像、技术路线或数值证据压缩为可直接比较的结论。\n3. 这为相关体系的后续理论推演、算法验证或实验设计提供了可参考的出发点。", "summary_source": "translation-fallback", "authors": [{"name": "Michael Borinsky"}, {"name": "Jury Radkovski"}, {"name": "Suriyah Rajalingam Kannagi"}], "featured_authors": [{"name": "Michael Borinsky"}, {"name": "Jury Radkovski"}, {"name": "Suriyah Rajalingam Kannagi"}], "author_count": 3}, {"id": "2610.12672", "category": "hep-th", "title": "Could four-dimensional $ϕ^4$ theory exist beyond the usual triviality arguments?", "abstract": "Do lattice triviality, suspected Borel non-summability and the perturbative Landau pole exclude an interacting four-dimensional theory satisfying the Osterwalder--Schrader axioms and reproducing every renormalized coefficient of positive-coupling $O(N)$ $\\phi^4$ theory? An example involving one real function separates vanishing cutoff limits along its allowed bare trajectories from a nonzero result obtained by renormalizing the coefficients first; an exponentially small correction preserves its expansion and removes the pole in its running coupling. For the massless two-point expansion of the singlet composite $\\Phi_a\\Phi_a$ at leading order in $1/N$, ordinary Borel summation fails even for Gaussian smearing. The arithmetic mean of two Borel integrals along opposite imaginary rays defines a real distribution on every four-dimensional Schwartz momentum or position test, with finite-order remainder bounds uniform on bounded test sets. Two alternative covariances with nonnegative mass spectral weights remove the Euclidean pole and construct generalized free fields. After a fixed contact subtraction, their Euclidean extensions preserve every coefficient of the collective correlations obtained by Wick pairing. The interacting finite-$N$ family remains open. We also state a conditional interacting route through the physical scalar correlations of a larger theory (the parent) with heavy particles. A concrete $N=1$ gauge--Higgs--fermion candidate has a tuned one-loop trajectory on which all interaction couplings tend to zero in the ultraviolet, and a stable tree vacuum with additional masses comparable to the heavy scale. Constructing the parent and its corrected ultraviolet trajectory, and proving coefficient decoupling and the exact remainder bounds as the quartic coupling tends to zero and the family's heavy masses grow, remain open.", "url": "https://arxiv.org/abs/2610.12672", "type": "理论", "summary": "1. 该工作重新审视四维O(N) φ^4理论因格点平凡性、Borel不可求和与微扰Landau极点而被排除的论证，并构造一个单实函数例子，将沿允许裸轨迹的截断极限消失与先重整化系数所得非零结果区分开。\n2. 其核心卖点在于引入指数小修正以保持展开并消除跑动耦合极点，并用沿相反虚轴的Borel积分算术平均定义四维Schwartz检验函数上的实分布，配合非负质量谱协方差去除欧氏极点并构造广义自由场。\n3. 相互作用有限N情形和母理论路线仍开放；N=1规范—希格斯—费米子候选虽有紫外耦合趋零的调节单圈轨迹与稳定树真空，但构造母理论、证明系数解耦以及四次耦合趋于零时的精确余项界仍是关键挑战。", "summary_source": "deepseek", "authors": [{"name": "Anton Ragin"}], "featured_authors": [{"name": "Anton Ragin"}], "author_count": 1}, {"id": "2610.12825", "category": "hep-th", "title": "Brane space localization and genus-0 T-duality with $H$-flux", "abstract": "We construct a geometric theory on the brane space $S^2M=C^\\infty(S^2,M)$ associated to a gerbe with connection on $M$. Normalized logarithmic holonomy around the latitude circles defines an average holonomy line bundle on the brane space, whose connection and averaged flux give an equivariantly flat superconnection. We prove that the completed periodic exotic twisted cohomology defined by this superconnection localizes to the twisted cohomology of $M$. This {\\bf brane space localization} happens in two stages: circle localization lands on the free path space of $M$, and contracting the paths, after a correction of the twisting form, brings us back to $M$. Parallel transport along the meridians lets us average gerbe module connections, after which the circular iterated-integral construction applies. The resulting {\\bf twisted brane Bismut-Chern forms} restrict to the twisted Chern forms on $M$; their variation is described by {\\bf twisted brane Bismut-Chern-Simons forms.} For a T-dual pair, transporting the classical Hori morphisms through localization yields {\\bf graded genus-0 T-duality} on brane cohomology. The composite of each morphism with its dual is minus the Euler operator in the level variable, so these morphisms are isomorphisms at every nonzero level. At level one these morphisms are compatible with the brane character and twisted $K$-theory T-duality.", "url": "https://arxiv.org/abs/2610.12825", "type": "理论", "summary": "1. 该工作围绕《Brane space localization and genus-0 T-duality with $H$-flux》对应的问题给出了新的分析、建模或计算结果。\n2. 其卖点在于把核心物理图像、技术路线或数值证据压缩为可直接比较的结论。\n3. 这为相关体系的后续理论推演、算法验证或实验设计提供了可参考的出发点。", "summary_source": "translation-fallback", "authors": [{"name": "Fei Han"}, {"name": "Varghese Mathai"}], "featured_authors": [{"name": "Fei Han"}, {"name": "Varghese Mathai"}], "author_count": 2}, {"id": "2610.13016", "category": "hep-th", "title": "Distinguishing Flat and Warped Extra Dimensions with Unruh-DeWitt Detectors", "abstract": "We examine the response of a two level Unruh-DeWitt (UD) detector interacting with the Kaluza-Klein (KK) mass modes of a bulk scalar field in extra dimensional models. Considering two of the promising extra dimensional models with distinct compactifications, such as large, flat extra dimensions in the Arkani Hamed, Dimopoulos \\& Dvali (ADD) framework and warped extra dimensions in the Randall-Sundrum (RS) scenario, we compute the profile function of the detector. We extend this computation to the 6 dimensional doubly compactified spacetime geometry. The profile function of the detector has been examined as a function of the energy gap of the detector, the compactification radius of the extra dimension, and the dimensionality of spacetime, requiring the chosen parameter space appropriately such that the gauge hierarchy problem is duly addressed. We find that the pattern of the profile function is dictated by the spacing of the KK mass spectrum and the resolution of the detector. For ADD model, the spacing between successive KK modes decreases with the increasing compactification radius, yielding a smoothly increasing continuum pattern in the profile function. Whereas for the RS warped geometry model, a tiny deviation in the radius of the extra dimension produces a large change in the same, resulting a sharp increment. The resolvability of the KK mode structure is sensitive to the underlying geometry of the spacetime, providing a qualitative distinction between flat and warped extra dimensional scenarios within the UD detector framework.", "url": "https://arxiv.org/abs/2610.13016", "type": "理论", "summary": "1. 该工作计算了两能级 Unruh-DeWitt 探测器与 ADD 平直及 RS 卷曲额外维中体标量场 KK 模耦合的响应剖面，并推广至六维双重紧致化几何。\n2. 其卖点在于剖面由 KK 质量谱间距与探测器分辨率共同决定：ADD 中随紧致半径增大呈平滑连续上升，RS 中半径微小偏离即导致尖锐跃增。\n3. 这表明 UD 探测器对 KK 模结构的可分辨性可定性区分平直与卷曲额外维几何，并为相关模型甄别提供启示。", "summary_source": "deepseek", "authors": [{"name": "Ashmita Das"}, {"name": "Anjana Krishnan"}, {"name": "Soumitra Sengupta"}], "featured_authors": [{"name": "Ashmita Das"}, {"name": "Anjana Krishnan"}, {"name": "Soumitra Sengupta"}], "author_count": 3}, {"id": "2610.13150", "category": "hep-th", "title": "Disformal Closure Selects 3D Scalar-Tensor Gravity without Local Bulk Modes", "abstract": "Three-dimensional Einstein gravity has no local degrees of freedom, yet retains rich global and black-hole physics. Adding a scalar normally spoils this. We show that closure of three-dimensional Horndeski gravity under disformal field redefinitions selects a square-root curvature interaction. A nonlinear analysis finds no local bulk modes on regular branches, while an independent Hamiltonian analysis confirms the result on the timelike-gradient branch. This extends the no-local-bulk-dynamics paradigm beyond pure Einstein gravity and motivates studying its boundary and global sectors.", "url": "https://arxiv.org/abs/2610.13150", "type": "理论", "summary": "1. 该工作考察三维Horndeski标量-张量引力在disformal场重定义下的封闭性，发现封闭性条件筛选出含平方根曲率相互作用的标量-张量理论。\n2. 其核心卖点在于，非线性分析表明规则分支上不存在局部体自由度，独立的哈密顿分析在类时梯度分支上进一步证实该结论，从而把无局部体动力学范式推广到纯爱因斯坦引力之外。\n3. 这一结果提示，后续应重点研究该理论的边界与全局扇区，并为三维标量-张量引力中无局部体模的范式提供可检验、可延展的出发点。", "summary_source": "deepseek", "authors": [{"name": "M. Shams Nejati"}, {"name": "M.H. Vahidinia"}], "featured_authors": [{"name": "M. Shams Nejati"}, {"name": "M.H. Vahidinia"}], "author_count": 2}, {"id": "2610.13191", "category": "hep-th", "title": "Dirac-Born-Infeld action from inequivalent representations of open strings", "abstract": "We study open strings in a constant magnetic field from the viewpoint of universal canonical variables. Using a conserved Klein-Gordon-type pairing, we show that the canonical commutation relations remain background independent in the distributional sense, while the background dependence is encoded in the mode representation. The Bogoliubov transformation between different magnetic backgrounds is not unitarily implementable, so that the corresponding Fock representations are inequivalent. Nevertheless, the transformation determines the relative normalization of the vacua. We show that the resulting relative vacuum normalization precisely reproduces the relative boundary $g$-function, or equivalently the magnetic-field-dependent part of the disk amplitude, and yields the Dirac-Born-Infeld factor. Thus the disk normalization is encoded directly in the transformation between inequivalent representations of universal open-string variables.", "url": "https://arxiv.org/abs/2610.13191", "type": "理论", "summary": "1. 该文从通用正则变量研究恒定磁场中的开弦，证明正则对易关系在分布意义下背景无关，背景依赖进入模表示。\n2. 其关键是不同磁场间的Bogoliubov变换不可幺正实现、Fock表示不等价，但该变换给出真空相对归一化并精确重现相对边界g函数与DBI因子。\n3. 这表明盘振幅归一化可直接编码于通用开弦变量不等价表示间的变换，为DBI作用量提供表示论解释。", "summary_source": "deepseek", "authors": [{"name": "Isao Kishimoto"}, {"name": "Tomohiko Takahashi"}, {"name": "Ayane Tezuka"}], "featured_authors": [{"name": "Isao Kishimoto"}, {"name": "Tomohiko Takahashi"}, {"name": "Ayane Tezuka"}], "author_count": 3}, {"id": "2610.13240", "category": "hep-th", "title": "The origin of amplitude chaos and strings", "abstract": "We analytically study the peak statistics of an amplitude ensemble to identify the local mechanism responsible for peak repulsion. Our analytical approaches show that a smooth, nondegenerate ensemble of sufficiently differentiable amplitudes exhibits quartic nearest-neighbor repulsion, $p_{\\rm nn}(S)\\sim S^4$, where $S$ is the spacing between adjacent peaks. We verify this prediction numerically for the tree-level highly excited string scattering amplitudes. Interestingly, we find the quartic repulsion to be robust by varying both the underlying ensemble and the amplitude functions, whereas a tunable cusp model shows that weakening differentiability changes the strength of the repulsion. Peak repulsion therefore defines a local universality class that is not unique to string theory and may occur in amplitude ensembles in other theories.", "url": "https://arxiv.org/abs/2610.13240", "type": "理论", "summary": "1. 该工作解析研究振幅系综的峰统计，以识别相邻峰排斥的局部机制，并在树级高度激发弦散射振幅中数值验证所预言的峰间距分布。\n2. 其核心卖点在于证明足够光滑、非退化且充分可微的振幅系综普遍呈现四次最近邻排斥 p_nn(S)∼S^4，该四次排斥对系综与振幅函数变化保持稳健，而可微性减弱会改变排斥强度。\n3. 这意味着峰排斥构成一个并非弦理论独有的局部普适类，可能出现在其他理论的振幅系综中，并为解释振幅混沌的起源提供可检验的普适判据。", "summary_source": "deepseek", "authors": [{"name": "Pallab Basu"}, {"name": "Anurag Sarkar"}], "featured_authors": [{"name": "Pallab Basu"}, {"name": "Anurag Sarkar"}], "author_count": 2}, {"id": "2610.13284", "category": "hep-th", "title": "The Casimir energy in Maxwell-Chern-Simons electrodynamics with various perfect electric or magnetic boundary condition combinations", "abstract": "We investigate the Casimir effect between two parallel wires in $(2+1)D$ Maxwell-Chern-Simons (MCS) electrodynamics under different boundary conditions and separated by a distance $L$. Using a functional approach in which the boundary constraints are implemented by auxiliary fields localized on the wires, we integrate out the gauge field and derive an effective boundary theory whose functional determinant allows us to compute the Casimir energy. We consider perfect electric conductor (PEC), perfect magnetic conductor (PMC), and infinitely permeable (PMC2) boundary conditions. For two PEC wires, we recover the known MCS result and show that it coincides with the result obtained in the Abelian limit of the Curci-Ferrari (CF) model, implying that the Casimir effect in this case probes the photon mass $\\mu$ but not its origin. The same energy is obtained for two PMC2 wires. In sharp contrast, the Casimir energy vanishes identically for the covariant PMC condition in MCS theory, both for PMC-PMC and PEC-PMC. Since this cancellation does not occur in the CF model, it could provide a signature of the topological origin of the photon mass in $(2+1)D$. Finally, the PEC-PMC2 case yields a non-vanishing Casimir force and reproduces the known result for a perfectly conducting wire facing an infinitely permeable one. Interestingly enough, we show that for PEC-PMC2, the Casimir force in the MCS theory is smaller than the one of the CF model for any $L,\\mu >0$. Our results thus show that, depending on the boundary conditions, the Casimir effect could probe not only the photon mass but also reveal signatures of its origin.", "url": "https://arxiv.org/abs/2610.13284", "type": "理论", "summary": "1. 该工作围绕《The Casimir energy in Maxwell-Chern-Simons electrodynamics with various perfect electric or magnetic boundary condition combinations》对应的问题给出了新的分析、建模或计算结果。\n2. 其卖点在于把核心物理图像、技术路线或数值证据压缩为可直接比较的结论。\n3. 这为相关体系的后续理论推演、算法验证或实验设计提供了可参考的出发点。", "summary_source": "translation-fallback", "authors": [{"name": "Philipe De Fabritiis"}, {"name": "Wellisson B. De Lima"}, {"name": "David Dudal"}], "featured_authors": [{"name": "Philipe De Fabritiis"}, {"name": "Wellisson B. De Lima"}, {"name": "David Dudal"}], "author_count": 3}, {"id": "2610.13286", "category": "hep-th", "title": "Confining Random Potential Quantum Mechanics for Jackiw-Teitelboim Gravity", "abstract": "We formulate perturbative Jackiw-Teitelboim gravity as an ensemble of ordinary one-dimensional Hamiltonians with a confining random potential. The leading profile reproduces the disk density of states, while connected cumulants of a single master field encode the topological expansion. After formulating the cumulant power counting required by the topological expansion, we show that the cumulants reproduce all genus-zero multi-boundary amplitudes $\\mathcal Z_{0,n}$. At higher genus, we show that a renormalization scheme can be chosen consistently order by order so that imposing one-boundary polynomiality recursively reproduces the perturbative JT string equation and yields the standard JT one-boundary amplitudes $\\mathcal Z_{g,1}$. The framework provides a self-contained finite-$S_0$ quantum dynamics with a discrete spectrum and unitary real time evolution, beyond a mere rewriting of the matrix integral. The same confining dynamics also underlies late-time saturation and the dynamical avoidance of the would-be black hole singularity, as shown in our earlier work.", "url": "https://arxiv.org/abs/2610.13286", "type": "理论", "summary": "1. 该工作将微扰JT引力表述为带约束随机势的一维普通哈密顿量系综，并给出拓扑展开所需的累积量幂次计数。\n2. 其技术卖点在于用单一主场的连通累积量编码拓扑展开：零亏格多边界振幅全部重现，高亏格下逐阶选取一致重整化并施加单边界多项式性，可递归复现微扰JT弦方程与标准单边界振幅。\n3. 该框架给出有限S0、离散谱且幺正实时演化的自洽量子动力学，超越矩阵积分改写，并启示晚期饱和与黑洞奇点回避源自同一约束随机势机制。", "summary_source": "deepseek", "authors": [{"name": "Dongsu Bak"}, {"name": "Chanju Kim"}, {"name": "Sang-Heon Yi"}], "featured_authors": [{"name": "Dongsu Bak"}, {"name": "Chanju Kim"}, {"name": "Sang-Heon Yi"}], "author_count": 3}, {"id": "2610.13289", "category": "hep-th", "title": "Codimension-Zero Holographic Complexity and Spectral Three-Point Correlators", "abstract": "Holographic complexity is expected to capture the linear growth of black hole interiors, with quantum corrections ultimately leading to a late-time saturation. We develop a spectral formulation of holographic complexity measures associated with codimension-zero bulk regions in the framework of the complexity=anything proposal. The corresponding generating function of complexity is governed by three-point correlation functions of the density of states, establishing a direct connection between bulk geometric observables and nonperturbative Euclidean spacetime wormholes. We find that the codimension-zero holographic complexity reduces to the sum of two codimension-one contributions and exhibits a universal time evolution, characterized by an exponentially long regime of linear growth followed by saturation at the Heisenberg time. The late-time plateau is a direct result of the spectral level repulsion, a generic feature of quantum chaotic systems, thereby providing a universal mechanism for the saturation of holographic complexity. We also develop a complementary operator interpretation, in which Euclidean wormhole corrections render the semiclassical basis of fixed-complexity states overcomplete. Constructing a complete orthonormal basis then yields well-defined holographic complexity operators that reproduce the same universal time evolution. Our results establish a unified connection among black hole interiors, chaotic spectral statistics, and Euclidean wormholes in quantum gravity.", "url": "https://arxiv.org/abs/2610.13289", "type": "理论", "summary": "1. 该工作在 complexity=anything 框架下，为余维零体区域的全息复杂度构建谱表述，其生成函数由态密度的三点关联函数支配，从而将体几何可观测量与非微扰欧几里得虫洞直接联系。\n2. 其核心卖点是：余维零全息复杂度可写成两个余维一贡献之和，并呈现普适时间演化——线性增长持续指数长时间后在 Heisenberg 时间饱和，晚期平台源自量子混沌中普遍的能级排斥。\n3. 该结果不仅统一了黑洞内部、混沌谱统计与欧几里得虫洞，还表明虫洞修正使固定复杂度态的半经典基过完备，需构造正交完备基以定义复现同一演化的复杂度算符。", "summary_source": "deepseek", "authors": [{"name": "Masamichi Miyaji"}, {"name": "Shan-Ming Ruan"}, {"name": "Shono Shibuya"}, {"name": "Kazuyoshi Yano"}], "featured_authors": [{"name": "Masamichi Miyaji"}, {"name": "Shan-Ming Ruan"}, {"name": "Shono Shibuya"}, {"name": "Kazuyoshi Yano"}], "author_count": 4}, {"id": "2610.13323", "category": "hep-th", "title": "General relativity and its modifications as effective field theories of $GL(4)$ breaking", "abstract": "We discuss General Relativity and some of its modifications as effective field theories of the breaking of the affine general linear group using the coset approach and the Maurer-Cartan form. While the ultimate goal is to break the symmetry down to the Lorentz subgroup, we argue that there are three interesting breaking cascades in which the affine general linear group is first broken to a larger subgroup that contains the Lorentz group. In all cases, the breaking of translations always generates Goldstone modes that can be interpreted as metric degrees of freedom. We argue that the effective field theories that emerge as a result of the different breaking patterns are all dynamically equivalent at the lowest order of the derivative expansion, e.g., using Einstein-Hilbert-like actions, but can differ beyond the leading order.", "url": "https://arxiv.org/abs/2610.13323", "type": "理论", "summary": "1. 该文用陪集方法与毛雷尔–嘉当形式，把广义相对论及其修正表述为四维仿射一般线性群破缺的有效场论。\n2. 其核心是三类先破缺到含洛伦兹子群的级联；平移破缺必给出可诠释为度规自由度的戈德斯通模。\n3. 不同破缺模式在最低阶导展开给出等价的爱因斯坦–希尔伯特型作用量，但高阶项可区分，为修改引力提供统一有效场论视角。", "summary_source": "deepseek", "authors": [{"name": "Tommaso Viacava"}, {"name": "Omar Zanusso"}], "featured_authors": [{"name": "Tommaso Viacava"}, {"name": "Omar Zanusso"}], "author_count": 2}, {"id": "2610.13377", "category": "hep-th", "title": "On the quantum statistical relation and the covariant phase space Hamiltonian", "abstract": "We show how the covariant phase space Hamiltonian can be constructed in theories in which some of the fields have gauge freedoms. The addition to the action of boundary terms that guarantee the well-posedness of a variational principle and its exact gauge invariance for the prescribed boundary conditions turn out to be essential in this construction. The same ingredients are essential in the use of the action in the framework of Gibbons and Hawking's Euclidean approach to Quantum Gravity and we show how the on-shell action constructed with a Lagrangian with those properties can be expressed in terms of the covariant phase space Hamiltonian. We compute the Hamiltonian of several theories, one of which has Chern--Simons terms, using our prescription and show that, in black-hole backgrounds, the Hamiltonian gives directly the quantum statistical relation including terms related to non-gravitational charges and chemical potentials, as expected.", "url": "https://arxiv.org/abs/2610.13377", "type": "理论", "summary": "1. 该文提出在部分场具有规范自由度的理论中构造协变相空间哈密顿量的方案，并借助保证变分原理良定与给定边界条件下精确规范不变的边界项，将欧氏量子引力中的壳上作用量表示为该哈密顿量。\n2. 其技术核心在于边界项同时保证变分良定与规范不变性，使壳上作用量可由协变相空间哈密顿量给出，并在黑洞背景下直接重现量子统计关系，包括非引力荷与化学势的贡献。\n3. 这一框架表明边界项与规范不变性对定义引力热力学量至关重要，为在含陈-西蒙斯项等更一般理论及黑洞背景中系统提取量子统计关系提供了途径。", "summary_source": "deepseek", "authors": [{"name": "José Luis V. Cerdeira"}, {"name": "Tomás Ortín"}], "featured_authors": [{"name": "José Luis V. Cerdeira"}, {"name": "Tomás Ortín"}], "author_count": 2}, {"id": "2610.13389", "category": "hep-th", "title": "Dualities, symmetries and the elliptic genus of 2d (0,2) SCFTs", "abstract": "While naively simpler than its higher dimensional cousins, 2d physics still has its own share of puzzles. An example of this is instances of dualities of $(0,2)$ theories, passing all consistency checks save for a mismatch in global symmetry. This is common when said duality can be motivated by dimensional reduction of a duality of 4d $\\mathcal{N}=1$ theories where said symmetry emerges in 2d, often from an anomalous 4d symmetry. It is commonly believed that these symmetries are broken in the 2d theory, though often the mechanism for such breaking is not understood. We examine various appearances of this phenomenon and show that in these cases the elliptic genus shows signs of the presence of marginal operators that can break these symmetries. Interestingly, these operators do not appear perturbatively but emerge from the calculation, raising the question of what operators the $(0,2)$ elliptic genus actually counts. This provides a potential mechanism to overcome the discrepancy in symmetry, though we point out some potential subtleties.", "url": "https://arxiv.org/abs/2610.13389", "type": "理论", "summary": "1. 该工作系统考察二维(0,2)超共形场论对偶中通过一致性检验却存在整体对称性失配的现象，重点分析由四维N=1对偶降维产生的实例。\n2. 其关键之处在于椭圆亏格显示出非微扰涌现的边缘算符迹象，这些算符能破缺缺失的整体对称性，为对称性失配提供潜在机制，并引发椭圆亏格实际计数何种算符的疑问。\n3. 这为理解降维对偶中的对称性破缺及二维(0,2)理论的算符谱提供了新线索，但该机制仍存在若干需进一步澄清的微妙之处。", "summary_source": "deepseek", "authors": [{"name": "Salomon Malka"}, {"name": "Gabi Zafrir"}], "featured_authors": [{"name": "Salomon Malka"}, {"name": "Gabi Zafrir"}], "author_count": 2}, {"id": "2610.13501", "category": "hep-th", "title": "Integrable auxiliary field sigma model and the metric approach to $T\\bar{T}$-like deformations", "abstract": "We describe a family of two-dimensional metric deformations that preserve integrability. The seeds are (classically) conformal integrable field theories and the deformations are directly related to different classes of auxiliary field sigma models. We introduce a master action connecting deformations by Lie-algebra-valued auxiliary fields, the so-called $\\nu$-frame, to deformations by two Lorentz-charged scalars. These auxiliary scalar fields can be identified as Beltrami differentials of an auxiliary two-dimensional metric, providing a direct connection with the metric approach to $T\\bar{T}$-like deformations. For Weyl-invariant seed matter theories, the auxiliary metric sector is described by a reduced gravitational potential. We show that the resulting framework preserves classical Lax integrability whenever the seed matter theory admits a Lax representation of its equations of motion on a generic curved two-dimensional spacetime. Finally, within the Lorentz-invariant family and the zweibein deformations of conformal matter theories considered here, we identify $T\\bar{T}$ as the only deformation that can be interpreted as a field-dependent coordinate transformation.", "url": "https://arxiv.org/abs/2610.13501", "type": "理论", "summary": "1. 该工作构造了一类保持可积性的二维度规形变，种子为经典共形可积场论，并将其与不同辅助场σ模型及T\\bar{T}类形变的度规方法关联。\n2. 其技术核心是主作用量统一李代数取值的ν标架辅助场与两个洛伦兹荷标量形变，并将后者等同于辅助二维度规的Beltrami微分。\n3. 对于Weyl不变种子物质，辅助度规部分由约化引力势描述；框架在弯曲二维时空Lax表示下保持经典可积性，且T\\bar{T}是唯一可解释为场依赖坐标变换的形变。", "summary_source": "deepseek", "authors": [{"name": "Nicola Baglioni"}, {"name": "Daniele Bielli"}, {"name": "Parita Shah"}, {"name": "Gabriele Tartaglino-Mazzucchelli"}], "featured_authors": [{"name": "Nicola Baglioni"}, {"name": "Daniele Bielli"}, {"name": "Parita Shah"}, {"name": "Gabriele Tartaglino-Mazzucchelli"}], "author_count": 4}, {"id": "2610.13555", "category": "hep-th", "title": "Holographic Krylov complexity in confining backgrounds: particle, string, and frames", "abstract": "We investigate holographic Krylov complexity in bottom-up holographic QCD models describing the confined phase, using the recently proposed correspondence between the growth rate of Krylov complexity and the proper radial momentum of probes, such as particles and strings, falling in the bulk spacetime. As representative confining backgrounds, we consider two horizonless geometries, namely the dilaton-deformed AdS-soliton and the deformed thermal-AdS spacetime, both arising as solutions of an Einstein-dilaton gravity system. We find that the Krylov complexity associated with a massive particle exhibits qualitatively distinct behavior in these two backgrounds when analyzed in the Einstein frame. In the deformed AdS-soliton geometry, the complexity undergoes periodic oscillations, with both the oscillation period and amplitude depending on the parameters of the model. In contrast, in the deformed thermal-AdS geometry, the complexity grows exponentially at late times and does not display oscillatory behavior. We then investigate string dynamics in the string frame and find that the Krylov complexity exhibits oscillatory behavior in both confining backgrounds. This behavior is traced to the emergence of an additional turning point in the deep infrared of the string-frame geometry. Motivated by this observation, we further analyze massive-particle dynamics in the string frame, where we find qualitatively similar behavior in the two confining backgrounds. Our results demonstrate that the Krylov complexity of confined holographic systems depends sensitively on the choice of probe and frame, while also revealing a closer correspondence between the two confining geometries in the string-frame description.", "url": "https://arxiv.org/abs/2610.13555", "type": "理论", "summary": "1. 该文利用Krylov复杂度增长率与体内径向动量的对应，在膨胀子形变AdS孤子和形变热AdS两个无视界禁闭背景中研究粒子与弦的全息Krylov复杂度。\n2. 其要点是：爱因斯坦标架下大质量粒子在AdS孤子中呈周期振荡、在形变热AdS中晚期指数增长；而弦标架因红外额外转折点，使粒子与弦在两种背景中均呈振荡并趋同。\n3. 这表明禁闭全息复杂度敏感依赖探针与标架，弦标架或更自然统一不同禁闭几何的红外描述，并可为后续全息QCD研究提供判据。", "summary_source": "deepseek", "authors": [{"name": "Jasper Nongmaithem"}, {"name": "Deepak Kumar Kar"}, {"name": "Ayush Kumar"}, {"name": "Shreeya Rajesh Parab"}, {"name": "David Dudal"}, {"name": "Subhash Mahapatra"}], "featured_authors": [{"name": "Jasper Nongmaithem"}, {"name": "Deepak Kumar Kar"}, {"name": "Ayush Kumar"}, {"name": "Shreeya Rajesh Parab"}, {"name": "David Dudal"}, {"name": "Subhash Mahapatra"}], "author_count": 6}, {"id": "2610.13566", "category": "hep-th", "title": "Robustness of exact $SU(N)$ Einstein-Skyrme solutions: black holes, wormholes and cosmologies", "abstract": "The $SU(2)$ Skyrme model admits exact solutions when coupled to General Relativity in four spacetime dimensions. Here, we demonstrate that relevant gravitational configurations, such as black holes, wormholes, and cosmologies, are robust under the extension to $SU(N)$ with an arbitrary number of flavors. We show that key physical features, such as the thermodynamic properties, the baryon number of the configurations, and the geometry, are crucially determined by the number of flavors as well as the coupling constants of the theory. In particular: first, we prove that an increase in the matter content favors the local thermal stability of spherically symmetric black holes. Second, for cosmological solutions, we demonstrate analytically that as the hadronic matter content increases, the scale factor grows more slowly due to enhanced gravitational attraction, while the expansion rate (measured by the Hubble parameter) increases as a consequence of the higher energy density. Third, we find that the throat of traversable wormhole solutions can be enlarged by increasing the number of flavors, since the energy density required to keep the throat open does not grow indefinitely but rather saturates at a finite value.", "url": "https://arxiv.org/abs/2610.13566", "type": "理论", "summary": "1. 该工作将四维Einstein-Skyrme精确解从SU(2)推广至任意味数SU(N)，证明黑洞、虫洞与宇宙学配置的稳健性。\n2. 卖点在于味数N与耦合常数决定热力学、重子数和几何：物质增多增强黑洞热稳定，标度因子增长放缓、哈勃参数升高，虫洞喉部因能量密度饱和随N扩张。\n3. 这为将Skyrme物质推广到多味规范群、并借助味数调控黑洞热力学、宇宙学与虫洞几何提供了新思路。", "summary_source": "deepseek", "authors": [{"name": "Carla Henríquez-Baez"}, {"name": "Perla Medina"}, {"name": "Pablo Rodríguez"}, {"name": "Aldo Vera"}], "featured_authors": [{"name": "Carla Henríquez-Baez"}, {"name": "Perla Medina"}, {"name": "Pablo Rodríguez"}, {"name": "Aldo Vera"}], "author_count": 4}, {"id": "2610.13575", "category": "hep-th", "title": "Dynamical symmetry breaking in a non-polynomial four-fermion model", "abstract": "We present a new four-fermion model with a strongly non-polynomial coupling. To eliminate these non-polynomialities, we introduce two auxiliary vector fields and show that the dynamical Lorentz symmetry breaking is possible in our theory, as revealed by the effective potential generated for these vector fields. We explicitly calculate the low-energy effective action for these fields, which is given by the sum of three Maxwell terms (one for each field and a mixed one) plus a potential term displaying nontrivial minima.", "url": "https://arxiv.org/abs/2610.13575", "type": "理论", "summary": "1. 该工作构建了一个具有强非多项式耦合的新型四费米子模型，并通过引入两个辅助矢量场消去非多项式项，进而研究其动力学对称性破缺。\n2. 其核心在于显式计算辅助矢量场的低能有效作用量：由三个麦克斯韦项（两个独立场项与一个混合项）加一个具有非平凡极小值的势能项组成，从而表明动力学洛伦兹对称性破缺可能发生。\n3. 这为在非多项式费米相互作用框架下研究动力学洛伦兹对称性破缺及后续有效场论分析提供了具体路径。", "summary_source": "deepseek", "authors": [{"name": "J. F. Assunção"}, {"name": "T. Mariz"}, {"name": "A. Yu. Petrov"}, {"name": "V. Prata"}], "featured_authors": [{"name": "J. F. Assunção"}, {"name": "T. Mariz"}, {"name": "A. Yu. Petrov"}, {"name": "V. Prata"}], "author_count": 4}, {"id": "2610.13586", "category": "hep-th", "title": "G2 resolutions and backtracking in scale-separated AdS$_3$", "abstract": "We study scale-separated AdS$_3$ models with full moduli stabilization in massive IIA supergravity on G2 orientifolds. In addition to constructing new examples, we investigate the properties of these models once the singularities of the G2 toroidal orbifold are resolved. The blow-up moduli are shown to be stabilized using fluxes in a parametric regime that preserves scale separation and control under the supergravity approximation. We further show that the apparent orientifold intersections in the singular orbifold description do not exist on such resolved spaces. Finally, we analyze the brane dual picture of such models using flux backtracking. We highlight several interesting features from such analysis such as a finite interval solution of the resulting flow equations in some of the models and the desirable low-energy decoupling of brane modes.", "url": "https://arxiv.org/abs/2610.13586", "type": "理论", "summary": "1. 该工作在G2 orientifold上的大质量IIA超引力中研究具有完整模稳定化的尺度分离AdS3模型，构造新例并考察G2环面orbifold奇点解析后的性质。\n2. 其核心在于用通量稳定blow-up模，并在保持尺度分离与超引力可控的参数区间内证明，奇点描述中的表观orientifold交点在解析空间上并不存在。\n3. 通过通量回溯分析brane对偶图像，作者发现部分模型流方程存在有限区间解且brane模可实现期望的低能解耦，为相关构造与对偶研究提供明确方向。", "summary_source": "deepseek", "authors": [{"name": "Aviral Aggarwal"}, {"name": "Fien Apers"}, {"name": "Fotis Farakos"}], "featured_authors": [{"name": "Aviral Aggarwal"}, {"name": "Fien Apers"}, {"name": "Fotis Farakos"}], "author_count": 3}, {"id": "2610.13612", "category": "hep-th", "title": "The Gregory-Laflamme Instability of five-dimensional Black Strings in Einstein-Gauss-Bonnet Gravity", "abstract": "We complement and extend our recent study of the non-linear evolution of the Gregory-Laflamme instability of black strings in Einstein-Gauss-Bonnet gravity in five spacetime dimensions. First, we study time-dependent perturbations of uniform black strings in Einstein-Gauss-Bonnet theory and determine the growth rates as a function of the coupling. We find that for positive Gauss-Bonnet couplings, the black strings are more unstable than in general relativity in the sense that the growth rates are larger and shorter wavelengths are unstable. In the second part of the paper we show that the hyperbolicity of the equation of motion of Einstein-Gauss-Bonnet theory is determined by an effective metric when the dynamics is restricted to spherical symmetry in the asymptotically flat directions. When the effective field theory becomes strongly coupled, as it happens near the endpoint of the Gregory-Laflamme instability of the black string, this effective metric becomes degenerate and the Cauchy evolution breaks down. Applying this criterion to uniform black strings, we find that for any positive Gauss-Bonnet coupling there is an open set of regular solutions (including the one of minimal thickness) on which the effective metric degenerates in a neighbourhood of the horizon. Therefore, we argue that these solutions cannot be attained from weakly coupled initial data by Cauchy evolution and the solutions of the linearized equations around them cannot be interpreted as approximations to nearby non-linear evolutions. We provide further evidence for this picture with non-linear simulations of the Gregory-Laflamme instability. The non-linear simulations terminate through a loss of hyperbolicity of the Tricomi or Keldysh type, depending on the sign of the Gauss-Bonnet coupling.", "url": "https://arxiv.org/abs/2610.13612", "type": "理论", "summary": "1. 该文扩展五维爱因斯坦-高斯-博内引力中黑洞弦Gregory-Laflamme不稳定性研究，用时变微扰与非线性模拟考察增长率及双曲性。\n2. 正GB耦合使黑洞弦比广义相对论更不稳定，增长率更大且更短波长失稳；强耦合时有效度规退化，柯西演化因双曲性丧失而终止。\n3. 这表明确有一类规则解不能由弱耦合初值经柯西演化得到，其线性扰动也不近似邻近非线性演化，提示GL终点图像需修正。", "summary_source": "deepseek", "authors": [{"name": "Pau Figueras"}, {"name": "Áron D. Kovács"}, {"name": "Shunhui Yao"}], "featured_authors": [{"name": "Pau Figueras"}, {"name": "Áron D. Kovács"}, {"name": "Shunhui Yao"}], "author_count": 3}, {"id": "2610.13667", "category": "hep-th", "title": "A discrete analogue of $\\mathscr{N}=2$ super Weil-Petersson volumes", "abstract": "We introduce a discrete spectral curve from $\\mathscr{N}=2$ double-scaled SYK whose topological recursion defines quasi-polynomial volumes in integer boundary lengths. The curve has two edge theories: a local $\\mathscr{N}=2$ theory at the lower edge and a bosonic theory at the upper edge. Focusing on the local $\\mathscr{N}=2$ theory, we compute its finite-$q$ volumes and independently check the first few using the string equation. In the $q\\rightarrow 1$ continuum limit, these recover the super Weil-Petersson volumes of Turiaci and Witten. Finally, we give an all-genus intersection-theoretic interpretation of these local volumes on the moduli space of stable marked curves, in terms of a deformed spin class with a gap-dependent $\\kappa$-class dressing.", "url": "https://arxiv.org/abs/2610.13667", "type": "理论", "summary": "1. 该工作从𝒩=2双标度SYK引入离散谱曲线，其拓扑递归给出以整数边界长度为变量的拟多项式体积。\n2. 该谱曲线下边缘为局域𝒩=2理论、上边缘为玻色理论；其有限q体积由弦方程独立验证，并在q→1极限重现超Weil-Petersson体积。\n3. 这些局域体积在稳定标记曲线模空间上获得全亏格相交论解释，即带间隙依赖κ类修饰的变形自旋类，连接离散全息与模空间几何。", "summary_source": "deepseek", "authors": [{"name": "Wasif Ahmed"}, {"name": "Joydeep Naskar"}], "featured_authors": [{"name": "Wasif Ahmed"}, {"name": "Joydeep Naskar"}], "author_count": 2}, {"id": "2610.13727", "category": "hep-th", "title": "Anomaly induced transport in holographic superconductors", "abstract": "We investigate the anomaly-induced transport properties of a holographic superconductor exhibiting spontaneous symmetry breaking. The holographic model incorporates vector and axial gauge fields, an additional non-anomalous $U(1)$ symmetry, and a charged scalar field that drives the phase transition. Working in the probe limit, we numerically construct the superconducting background under two alternative scalar field quantizations, corresponding to operators with scaling dimensions $\\Delta=1$ and $\\Delta=3$ (denoted as the $O_1$ and $O_2$ theories, respectively). Using Kubo formulae, we compute the chiral magnetic conductivities and examine their response to the scalar condensate. Our findings demonstrate that spontaneous symmetry breaking allows anomaly-induced transport to extend beyond anomalous currents, significantly impacting the non-anomalous sector as well. Remarkably, this effect appears in both theories, indicating that the influence on the non-anomalous sector is independent of the chosen quantization. The comparison of our numerical results with the analytical limits for $O_i \\to 0$ and $O_i \\to \\infty$ $(i=1,2)$ reveals consistent behavior across both theories.", "url": "https://arxiv.org/abs/2610.13727", "type": "理论", "summary": "1. 该工作在全息超导模型中引入矢量与轴矢规范场、额外非反常U(1)对称性及驱动相变的带电标量场，在探针极限下数值构造Δ=1和Δ=3两种标量量子化背景，并利用Kubo公式计算手征磁导率随标量凝聚的响应。\n2. 其核心卖点是发现自发对称破缺使反常诱导输运突破反常流范畴，显著作用于非反常部门，且该效应在两种量子化下均出现，数值结果与O_i→0及O_i→∞解析极限一致。\n3. 这暗示超导凝聚可普遍耦合反常与非反常输运，为强关联超导体系中手征磁效应的后续实验与理论研究提供了明确且可检验的启发。", "summary_source": "deepseek", "authors": [{"name": "Ashis Tamang"}, {"name": "Nishal Rai"}, {"name": "Javier Esteban"}, {"name": "Eugenio Megias"}], "featured_authors": [{"name": "Ashis Tamang"}, {"name": "Nishal Rai"}, {"name": "Javier Esteban"}, {"name": "Eugenio Megias"}], "author_count": 4}, {"id": "2610.13824", "category": "hep-th", "title": "The Quasiparticle Ansatz for Relativistic Continuous Matrix Product States", "abstract": "The Relativistic Continuous Matrix Product State (RCMPS) ansatz introduced in arXiv:2102.07741 is a translation-invariant variational ansatz intended to approximate the ground states of gapped one-dimensional relativistic Quantum Field Theories directly in the continuum limit and in infinite volume. In this work, we develop an ansatz, referred to as the Relativistic Quasiparticle (RQP) ansatz, for the low-lying one-particle excitations of the RCMPS vacuum, as well as for solitons interpolating between two distinct degenerate vacua. The corresponding energies of these states can be obtained as the eigenvalues of an effective Hamiltonian. The RQP ansatz generalizes constructions used in the Matrix Product State and Continuous Matrix Product State literature. We apply the RQP ansatz to the sine-Gordon model and find good agreement with results from integrability for both the soliton and breather masses. We also apply the RQP ansatz to the $\\phi^4$ theory, in both its $\\mathbb Z_2$-preserving and $\\mathbb{Z}_2$-broken phases, and determine the spectrum of particles and solitons. This enables us to determine the parameter regime for which multiple stable particles exist.", "url": "https://arxiv.org/abs/2610.13824", "type": "理论", "summary": "1. 该工作提出相对论准粒子（RQP）拟设，用于在无限体积连续极限下近似RCMPS真空的低能单粒子激发及连接两个简并真空的孤子，其能量由有效哈密顿量本征值给出。\n2. 其卖点在于把矩阵乘积态与连续矩阵乘积态中的准粒子构造推广至相对论连续情形，并在正弦-戈尔登模型中重现可积性给出的孤子与呼吸子质量，进而得到φ^4理论在Z2保持和破缺相中的粒子与孤子谱。\n3. 该框架可标定φ^4理论中存在多个稳定粒子的参数区域，并为无限体积一维相对论量子场论的变分激发谱与孤子研究提供可推广途径。", "summary_source": "deepseek", "authors": [{"name": "Silviu S. Pufu"}, {"name": "Benjamin T. Søgaard"}, {"name": "Spyros Terlemes"}], "featured_authors": [{"name": "Silviu S. Pufu"}, {"name": "Benjamin T. Søgaard"}, {"name": "Spyros Terlemes"}], "author_count": 3}, {"id": "2610.13875", "category": "hep-th", "title": "Modular Properties of Generalised Gibbs Ensembles: The Deformed KdV Hierarchy", "abstract": "We construct a set of conserved charges which are deformations of quantum KdV charges. They are associated with the modular transformation of a GGE with the spin-$\\sigma$ KdV charge inserted with chemical potential $\\alpha_\\sigma$. The charges are formal power series in the chemical potential, with coefficients given by local integrals of motion. We define local recursion relations and equivalent flow equations, prove commutativity to all orders, and establish uniqueness of the currents modulo total derivatives for a fixed generating series. We show that the eigenvalues of these deformed charges can be obtained from the thermodynamic Bethe Ansatz in two models. In the $c=1/2$ free fermion theory, the deformed charges reduce to explicit linear combinations of undeformed KdV charges, and their ground-state eigenvalues agree with the TBA expansion to all orders. In the Lee-Yang model, we find numerical agreement through cubic order in the spin-$5$ deformation for the first few charges evaluated on low-lying states.", "url": "https://arxiv.org/abs/2610.13875", "type": "理论", "summary": "1. 该文构造了量子KdV荷的形变守恒荷，它们对应插入自旋σ KdV荷与化学势α_σ的广义Gibbs系综的模变换，并展开为化学势形式幂级数，系数为局域运动积分。\n2. 技术卖点在于局域递推与等价流方程、全阶对易性、以及固定生成级数下流算符模全导数的唯一性；TBA给出形变荷本征值，在c=1/2自由费米子中约化为未形变KdV荷线性组合且全阶一致，在Lee-Yang模型中自旋5形变至三阶吻合。\n3. 这联系了GGE模性质与形变可积层次，表明TBA可系统计算形变KdV谱，为检验更一般可积场论中的模不变性与高阶形变提供途径。", "summary_source": "deepseek", "authors": [{"name": "Faisal Karimi"}], "featured_authors": [{"name": "Faisal Karimi"}], "author_count": 1}, {"id": "2610.13899", "category": "hep-th", "title": "$q$-deformed Weil-Petersson Volumes from the Spectral Edge of DSSYK and Supersymmetric Extensions", "abstract": "The $q$-deformed Weil-Petersson volumes of Do and Norbury are the top-degree parts of Okuyama's discrete volumes, which are defined by topological recursion on the spectral curve of the double-scaled SYK (DSSYK) model. We show that the same q-deformed volumes can be obtained from a double-scaled matrix model whose disk density is found by zooming in on the soft edges of the DSSYK density. Applying the same procedure to the hard edge of $\\mathcal{N}=1$ DSSYK, we obtain candidate $q$-deformed $\\mathcal{N}=1$ super Weil-Petersson volumes. They are polynomials of fixed degree, and they reduce to the $\\mathcal{N}=1$ super Weil-Petersson volumes in a scaled $q\\to1$ limit. These candidate volumes differ from the $\\mathcal{N}=1$ volumes of Do and Norbury in ( arXiv:2510.12431 ) up to what we call \"irrelevant\" contributions which exactly vanish in the scaled $q\\to 1$ limit. Together, these results demonstrate how q-deformed volumes can be naturally associated to the spectral edges of various DSSYK models and provides an intuitive way to construct them in supersymmetric contexts.", "url": "https://arxiv.org/abs/2610.13899", "type": "理论", "summary": "1. 该工作指出Do–Norbury的q形变Weil–Petersson体积（即Okuyama离散体积的最高次部分）可从DSSYK谱密度软边缩放所得双标度矩阵模型的圆盘密度导出，并将同一流程用于N=1 DSSYK硬边以构造候选q形变N=1超Weil–Petersson体积。\n2. 其技术卖点在于用谱边缩放与矩阵模型圆盘密度给出构造，而非直接依赖拓扑递归；候选超体积为固定次数多项式，在标度q→1极限退化为N=1超Weil–Petersson体积，且与Do–Norbury的N=1结果仅差在该极限严格消失的“无关”贡献。\n3. 这表明q形变体积可自然关联到各类DSSYK模型的谱边，并为超对称背景下的构造提供基于矩阵模型与谱边缩放的直观方案。", "summary_source": "deepseek", "authors": [{"name": "Wasif Ahmed"}, {"name": "Joydeep Naskar"}, {"name": "Krishan Saraswat"}], "featured_authors": [{"name": "Wasif Ahmed"}, {"name": "Joydeep Naskar"}, {"name": "Krishan Saraswat"}], "author_count": 3}, {"id": "2610.13900", "category": "hep-th", "title": "Reflected entropy and islands in JT gravity from partial dimensional reduction", "abstract": "We study how mixed-state correlations reorganize across island transitions in Jackiw-Teitelboim gravity coupled to a non-gravitating bath. Using the partial-dimensional-reduction realization of double holography, we compute reflected entropy for adjacent and disjoint radiation regions in the vacuum and in the thermofield-double state of an eternal black hole. Reflected entropy probes the internal partition of the entanglement wedge and therefore resolves structure that is invisible to the ordinary Page curve: its dominant saddle can change even when the entropy saddle of the union remains fixed, and it vanishes at leading order when the entanglement wedge disconnects. We show that the lower-dimensional reflected-island description agrees, to leading order in the dynamical brane fluctuation, with the higher-dimensional defect-extremal-surface picture. The finite-angle comparison further suggests a projection-covariant identification of island and brane endpoints at linear order. The resulting Page-like curves and Markov gaps provide a geometric probe of the reorganization of the purification and of non-Markovian, multipartite correlation structure during island transitions.", "url": "https://arxiv.org/abs/2610.13900", "type": "理论", "summary": "1. 该工作利用部分维度约化实现的双全息，在耦合非引力浴的JT引力中计算真空与永恒黑洞TFD态下相邻及不相交辐射区的反射熵，以研究岛跃迁中混合态关联的重组。\n2. 其核心在于反射熵探测纠缠楔的内部划分，可分辨普通Page曲线无法显现的结构：并集熵鞍点不变时其主导鞍点仍可改变，纠缠楔断开时领头阶为零，且低维反射岛描述与高维缺陷极值面图像领头阶一致。\n3. 有限角度比较进一步暗示线性阶下岛端点与膜端点的投影协变识别，所得类Page曲线与Markov间隙为岛跃迁中纯化重组及非马尔可夫多体关联结构提供几何探针。", "summary_source": "deepseek", "authors": [{"name": "Debarshi Basu"}, {"name": "Himanshu Chourasiya"}], "featured_authors": [{"name": "Debarshi Basu"}, {"name": "Himanshu Chourasiya"}], "author_count": 2}, {"id": "2610.13938", "category": "hep-th", "title": "A universal sector of $\\mathcal{N}=1$ class $\\mathcal{S}$ spectra", "abstract": "We determine a universal sector of the spectrum of light operators in four-dimensional $\\mathcal{N}=1$ class $\\mathcal{S}$ superconformal field theories arising from M5-branes wrapped on a compact hyperbolic Riemann surface $\\Sigma_2$. We work at large $N$, analysing Kaluza--Klein fluctuations about the dual Bah--Beem--Bobev--Wecht anti-de Sitter backgrounds for general values of the twist parameter $z$. To obtain these spectra, we specialise recently derived mass operators to modes that are constant on $\\Sigma_2$ by imposing a suitable $z$-dependent generalised $G$-structure. We then organise the resulting eigenstates into long and protected $\\mathcal{N}=1$ supermultiplets with definite flavour quantum numbers. As $z$ varies, rich patterns emerge in the spectrum, including both isolated multiplets and infinite towers of multiplets, which we characterise analytically.", "url": "https://arxiv.org/abs/2610.13938", "type": "理论", "summary": "1. 该工作在大N下确定了M5膜包裹紧致双曲Riemann面所得四维N=1 class S超共形场论中轻算符谱的普遍扇区，并在一般twist参数z下分析对偶BBBW反de Sitter背景上的Kaluza-Klein涨落。\n2. 其技术卖点在于施加依赖z的广义G-结构，把近期导出的质量算符限制为Σ2上的常数模，并将本征态整理成具有确定flavor量子数的长与受保护N=1超多重态，同时解析刻画随z变化的孤立多重态与无限多重态塔。\n3. 该普遍扇区可作为检验M5膜构造的全息对偶、追踪twist形变下受保护谱演化的基准，并有望推广至更一般的N=1 class S背景。", "summary_source": "deepseek", "authors": [{"name": "Ritabrata Bhattacharya"}, {"name": "Abhay Katyal"}, {"name": "Oscar Varela"}], "featured_authors": [{"name": "Ritabrata Bhattacharya"}, {"name": "Abhay Katyal"}, {"name": "Oscar Varela"}], "author_count": 3}, {"id": "2610.12724", "category": "math-ph", "title": "An elementary approach to the Szegő theorems", "abstract": "The strong Szegő theorem and the Fisher-Hartwig formula describe the asymptotic behavior of determinants obtained by restricting translationally invariant operators to large finite regions. In particular, Szegő's theorem states that, beyond the leading extensive contribution to such a determinant, there is a universal finite correction, $\\sum_{r>0} rV_rV_{-r}$ where $V_r$ are the Fourier coefficients of the logarithm of the symbol. Although this formula appears throughout analysis and mathematical physics, the origin of its quadratic form and of the weight $r$ is often obscured in its standard analytic derivations. We develop an elementary picture in which the strong Szegő term arises from boundary leakage: paths contributing to the matrix exponential leave the finite interval and subsequently return. Counting the shortest such excursions immediately produces the factor $r$. We then show that an isolated boundary contributes exactly one half of the strong Szegő correction, while the two boundaries of a long interval decouple. For finite-range matrices this gives a rigorous and intuitive elementary derivation of the asymptotics, with extensions to sufficiently rapidly decaying interactions. A complementary free-fermion argument provides a physical interpretation of the same cancellation mechanism. Numerical examples illustrate the asymtotics in the well controlled regime, the Fisher Hartwig logarithmic correction. The boundary formulation does not itself require translation invariance and therefore suggests natural extensions to disordered systems, higher dimensions, and symbols with internal matrix structure. To illustrate this we numerically go beyond the formal applicability region of the Szegő formula, considering slow decay and disordered cases, and showing in some cases a robustness of the approach even for slowly decaying but disordered potentials.", "url": "https://arxiv.org/abs/2610.12724", "type": "理论", "summary": "1. 该工作为Szegő定理（含强Szegő定理与Fisher-Hartwig公式）的有限尺度行列式渐近提供初等推导，将普适有限修正解释为边界泄漏。\n2. 其卖点是通过计数路径逸出有限区间再返回的最短往返，自然导出二次型中权重r，并证明单边界贡献恰为强Szegő项之半、长区间两端解耦；有限程矩阵下给出严格推导，且以自由费米子阐明同一抵消机制。\n3. 该边界表述不要求平移不变性，故提示可推广至无序系统、高维及内矩阵结构符号；数值上在慢衰减与无序情形也显示一定稳健性。", "summary_source": "deepseek", "authors": [{"name": "Israel Klich"}, {"name": "Ravisankar Rajagopal"}], "featured_authors": [{"name": "Israel Klich"}, {"name": "Ravisankar Rajagopal"}], "author_count": 2}, {"id": "2610.12731", "category": "math-ph", "title": "Lieb-Robinson bounds for irreversible dynamics via adaptive Dyson expansion", "abstract": "In this note, we study a broad class of time-dependent and irreversible dynamics for quantum spin systems in both finite and infinite volume. We develop a simple and flexible strategy for expanding commutators of the form $[A,\\tau_{s,t} \\, B]$ in terms of self-avoiding paths of sets, where $A$ and $B$ are local operators and $\\tau_{s,t}$ is the Heisenberg time evolution. This adaptive Dyson expansion requires no backwards time evolution and is thus also applicable to irreversible dynamics. Furthermore, we discuss how such an expansion directly implies Lieb-Robinson bounds. A central feature of our result is that the obtained Lieb-Robinson bounds are independent of any Hamiltonian and dissipative on-site terms of the generator.", "url": "https://arxiv.org/abs/2610.12731", "type": "理论", "summary": "1. 该工作针对有限与无限体积量子自旋系统中一类广泛的含时且不可逆动力学，提出自适应戴森展开，将局域算符对易子表示为集合的自回避路径求和。\n2. 其关键卖点在于无需反向时间演化即可处理不可逆过程，并可直接推出李布-罗宾逊型界；更重要的是所得界不依赖于生成元中的哈密顿项与在位耗散项。\n3. 这为开放量子系统、耗散量子信息与多体动力学中的因果传播和关联约束提供了统一工具，并启示此类界可脱离具体生成元细节而成立。", "summary_source": "deepseek", "authors": [{"name": "Carla Rubiliani"}, {"name": "Marius Wesle"}, {"name": "Tom Wessel"}], "featured_authors": [{"name": "Carla Rubiliani"}, {"name": "Marius Wesle"}, {"name": "Tom Wessel"}], "author_count": 3}, {"id": "2610.12805", "category": "math-ph", "title": "A Sklar-Type Decomposition for Positive Binary Distributions and a Gibbs Interpretation", "abstract": "We study strictly positive multivariate binary distributions by separating one-body marginals from dependence. Local positive reweighting defines a dependence nucleus, completely characterized by the higher-order Walsh log-linear coefficients $J_S$, $|S|\\ge2$. Any such nucleus and any strictly positive one-body marginals determine a unique joint distribution. In finite-spin Gibbs systems, these coefficients are the many-body interaction couplings.", "url": "https://arxiv.org/abs/2610.12805", "type": "理论", "summary": "1. 该工作针对严格正的多变量二值分布，提出了一种 Sklar 型分解，将单体边缘分布与依赖结构分离开来。\n2. 其核心是用局部正重加权定义依赖核，并证明该核由高阶 Walsh 对数线性系数 J_S（|S|≥2）完全刻画，且与严格正的单体边缘分布共同唯一确定联合分布，而在有限自旋 Gibbs 系统中这些系数即多体相互作用耦合。\n3. 这为从边缘分布和高阶耦合重建二值概率模型提供了严格基础，并提示依赖核可对应多体相互作用项，从而用于自旋系统建模或统计推断。", "summary_source": "deepseek", "authors": [{"name": "Yi-Yu Lin"}], "featured_authors": [{"name": "Yi-Yu Lin"}], "author_count": 1}, {"id": "2610.13705", "category": "math-ph", "title": "Critical Ising model as the $M(4,3)$ minimal model of conformal field theory", "abstract": "We construct a linear map from the space of spin polynomials in the critical Ising model on a lattice to the state space of the $M(4,3)$ minimal model of conformal field theory. The kernel of the map consists precisely of null fields, i.e., spin polynomials that vanish in all correlations. For a polynomial $\\Op$ which is not a null field, we define its scaling dimension $\\Delta_{\\Op}\\in\\Z_{\\geq0}\\cup(\\Z_{\\geq0}+\\frac{1}{8}),$ to be the lowest $\\Loper{0}+\\Loperbar{0}$ eigenvalue in the decomposition of its image into homogeneous components. We show that as the mesh size $\\delta$ goes to zero, the rescaled field $\\delta^{-\\Delta_{\\Op}}\\Op$ has a non-trivial scaling limit, when inserted in correlations with other such fields. Moreover, all these limits can be expressed in terms of correlations of primary fields of $M(4,3)$ and the Virasoro action in the continuum. The highest weight vectors of $M(4,3)$, the joint eigenvectors of $\\Loper{0}$ and $\\Loperbar{0}$ with the same eigenvalues $0,1/16,1/2$ for both, are the images of the constant $1$, the spin at a single lattice vertex, and the energy at a single lattice edge, respectively. For the proof, we construct a map from a larger lattice field space, accommodating also fermion and disorder insertions, to a direct sum of two fermionic Fock spaces. This direct sum contains contains the state spaces of both the $M(4,3)$ and the free fermion CFT. The main technical ingredient of the proof is a new version of the exact fermionic current action on the space of lattice local fields due to C. Hongler, K.K. and F. Viklund, combined with some new advances in discrete complex analysis. Our results are valid on arbitrary isoradial graphs.", "url": "https://arxiv.org/abs/2610.13705", "type": "理论", "summary": "1. 该工作围绕《Critical Ising model as the $M(4,3)$ minimal model of conformal field theory》对应的问题给出了新的分析、建模或计算结果。\n2. 其卖点在于把核心物理图像、技术路线或数值证据压缩为可直接比较的结论。\n3. 这为相关体系的后续理论推演、算法验证或实验设计提供了可参考的出发点。", "summary_source": "translation-fallback", "authors": [{"name": "Dmitry Chelkak"}, {"name": "Konstantin Izyurov"}, {"name": "Kalle Kytölä"}], "featured_authors": [{"name": "Dmitry Chelkak"}, {"name": "Konstantin Izyurov"}, {"name": "Kalle Kytölä"}], "author_count": 3}, {"id": "2610.13743", "category": "math-ph", "title": "Perturbed isotropic oscillators with inversion symmetry", "abstract": "We consider the normal form of a 1:1 detuned resonance that can be related, via a double averaging process, to the three body problem of celestial mechanics. In view of the symmetry in the gravitational coupling between the planets, the obtained normal form exhibits inversion symmetry. We provide an analytical prediction of the possible bifurcations in terms of the detunings and the other physical parameters of the system. We show that the bifurcation scenario is rich. It includes bifurcation sequences where the unstable orbit appearing after a saddle-node bifurcation can have a reversed pitchfork bifurcation, where it turns into stability with the birth of two unstable orbits, which eventually reconnect with one of the two quasi-normal modes. Furthermore, another scenario shows a standard pitchfork in which one of the quasi-normal modes becomes unstable, giving rise to a pair of stable periodic orbits. By introducing coupling and asymmetry parameters, we provide an effective way to discern all the possible sequences of bifurcations.", "url": "https://arxiv.org/abs/2610.13743", "type": "理论", "summary": "1. 该工作用双平均方法将1:1失谐共振的正规形与天体力学三体问题相联系，并借助引力耦合的对称性导出具有反演对称的正规形。\n2. 其卖点在于解析预测随失谐等参数变化的分岔，揭示反转叉式分岔等丰富序列，使鞍结产生的失稳轨道经再稳定而最终与准简正模重连。\n3. 引入耦合与非对称参数可有效区分全部分岔序列，为共振系统及三体问题的正规形分析提供可操作判据。", "summary_source": "deepseek", "authors": [{"name": "Antonella Marchesiello"}, {"name": "Rita Mastroianni"}, {"name": "Giuseppe Pucacco"}], "featured_authors": [{"name": "Antonella Marchesiello"}, {"name": "Rita Mastroianni"}, {"name": "Giuseppe Pucacco"}], "author_count": 3}, {"id": "2610.13892", "category": "math-ph", "title": "Unifying spherical convolutions through lifting", "abstract": "We develop a unified description of convolution on the sphere by lifting to the rotation group. A number of definitions of spherical convolution have been proposed, differing in whether the kernel is axisymmetric or directional, whether the output is on the sphere or the rotation group, whether the signals carry spin, and in their computational cost. No unified treatment exists. Regarding the sphere as the homogeneous space $S^2 \\cong \\text{SO(3)}/\\text{SO(2)}$, we lift a spin $s$ field to the rotation group, convolve on $\\text{SO(3)}$, and project back to the sphere through the adjoint of the lift for a potentially different spin $s'$. We recover every rotation-equivariant convolution considered previously through constraints on the kernel, spin choices and inclusion or omission of the lift and projection. For maps between fields of fixed input and output spin, we prove that directional kernels, output on the sphere and equivariance cannot be achieved simultaneously. We make explicit that spin fields are sections of associated line bundles, linking the physics and bundle literatures, and express the spin rotation phase as the character of the twist of the section. We present harmonic-space algorithms for the exact and efficient computation of lifted spherical convolutions of band-limited fields by appealing to sampling theorems on the sphere and rotation group. All operators are implemented in the open-source s2conv code, and numerical experiments confirm the reductions and the equivariance of the operators to machine precision. Finally, we illustrate the operators on fields measured on the Earth and on the celestial sky.", "url": "https://arxiv.org/abs/2610.13892", "type": "理论", "summary": "1. 该工作将球面视为 SO(3)/SO(2)，把自旋 s 场提升到旋转群 SO(3) 上卷积，再通过提升算子的伴随投影回球面，从而统一描述球面卷积。\n2. 它证明在固定输入输出自旋的场映射中，方向性核、球面输出与等变性不能同时成立，并将自旋场解释为伴随线丛截面、其旋转相位对应截面扭曲的特征标，同时给出基于球面与旋转群采样定理的谐波空间精确高效算法。\n3. 所有算子已在开源 s2conv 中实现，数值实验验证其归约关系与等变性达机器精度，并可应用于地球与天球测量场，为自旋球面信号处理提供了统一框架与工具。", "summary_source": "deepseek", "authors": [{"name": "J. D. McEwen"}], "featured_authors": [{"name": "J. D. McEwen"}], "author_count": 1}, {"id": "2610.12597", "category": "quant-ph", "title": "Error correction and quantum information spreading on sparse random graphs", "abstract": "Quantum error-correcting codes on graph geometries beyond regular euclidean lattices have emerged as a promising route toward robust quantum information processing. A major challenge in quantum error correction is the trade-off between favorable properties of codes constructed in high dimensionality and the need for locality in practical implementations on near-term hardware. Sparse intermediate geometries may combine the advantages of both, but how their structure governs quantum information dynamics and code performance remains unclear. Here we show that the spectral dimension $d_s$, defined from the low-energy spectrum of the graph Laplacian, is the universal parameter connecting these properties. Using Floquet random Clifford circuits on two distinct sparse graph architectures with tunable spectral dimension, we find that $d_s$ governs both quantum information spreading and the scaling of the resulting quantum error-correcting code distance. We identify a geometry-induced entanglement phase transition from localized area-law to ergodic volume-law, whose universality is determined by $d_s$ and exhibits long-range percolation criticality. In the ergodic phase, the circuit acts as a CSS code encoder whose code distance is set by the competition between two logical sectors --- the cost of severing the graph and the length of its shortest winding cycle --- which connectivity pushes in opposite directions. The spectral dimension organizes this trade-off, highlighting a maximum at intermediate $d_s$ retaining sparse connectivity and physical realizability.", "url": "https://arxiv.org/abs/2610.12597", "type": "理论", "summary": "1. 该工作在两类可调谱维数的稀疏图上，用弗洛凯随机克利福德线路研究量子信息传播与量子纠错码性能，并发现几何驱动的纠缠相变。\n2. 其主要卖点是指出由图拉普拉斯低能谱定义的谱维数d_s是统一参数，控制信息扩散、码距标度及从局域面积律到遍历体积律的相变，该相变具有长程渗流临界性；在遍历相中线路作为CSS码编码器，码距由割断图的代价与最短缠绕回路长度之竞争决定。\n3. 这表明稀疏中间几何可在保持物理可实现连接的同时优化纠错性能，并暗示纠错能力在中间谱维数处达到最大，为近硬件量子编码设计提供原理性启发。", "summary_source": "deepseek", "authors": [{"name": "Giovanni Cemin"}, {"name": "Marin Bukov"}, {"name": "Andrea Solfanelli"}], "featured_authors": [{"name": "Giovanni Cemin"}, {"name": "Marin Bukov"}, {"name": "Andrea Solfanelli"}], "author_count": 3}, {"id": "2610.12607", "category": "quant-ph", "title": "Dissipative Majorana Chain---Anomalies and Non-Invertible Symmetries", "abstract": "We study symmetries and anomalies of dissipative Majorana chains described by Lindblad dynamics. Using the operator-state mapping, we represent the Lindbladian as a non-Hermitian operator on a doubled Hilbert space. In this formulation, the ket and bra contours admit strong fermion parities and strong translations, while their diagonal combinations define weak symmetries. For even and odd chain lengths, we diagnose anomalies by comparing symmetry algebras with and without weak fermion-parity defects. These algebras retain the lattice precursor of the modulo-$8$ anomaly of the closed Majorana chain and exhibit projective relations between strong fermion parity and weak translation, as well as between weak fermion parity and strong translation, which are intrinsic to open quantum systems. We establish the IR correspondence between the lattice symmetry algebras and those of the doubled Majorana CFT in four spin sectors, identifying chiral fermion parities emanated from the lattice translations. Finally, we develop the lattice bosonization of the dissipative chain. For even length with collective energy dephasing, combining the defect and no-defect sectors and imposing GSO projections gives rise to an Ising Lindbladian with non-invertible Kramers--Wannier symmetries descending from the anomalous strong translation and fermion parity of the Majorana chain. For odd length, constructing mutually commuting ket- and bra-sector spin operators instead yields an Ising Lindbladian with a Kramers--Wannier duality defect. Our results provide a controlled framework for extending lattice anomalies and non-invertible symmetries to open quantum systems.", "url": "https://arxiv.org/abs/2610.12607", "type": "理论", "summary": "1. 该工作通过算符-态映射把Lindblad耗散Majorana链表示为双希尔伯特空间上的非厄米Liouvillian，并借有无弱费米宇称缺陷的对称代数比较，诊断偶/奇数链长异常，建立与双Majorana CFT四自旋扇区的红外对应及晶格玻色化。\n2. 其要旨在于揭示开系统中强费米宇称与弱平移、弱费米宇称与强平移间的投影关系，保留闭合链模8异常的晶格前兆，并由晶格平移生成手性费米宇称。\n3. 对偶数链，集体能量退相干经缺陷/无缺陷扇区合并与GSO投影给出具非可逆Kramers-Wannier对称的Ising Lindbladian；奇数链则用Ket/Bra扇区互易自旋算符得到带KW对偶缺陷的Ising Lindbladian，为开放量子系统中的晶格异常与非可逆对称性提供受控框架。", "summary_source": "deepseek", "authors": [{"name": "Hung-Hsuan Teh"}, {"name": "Tokiro Numasawa"}], "featured_authors": [{"name": "Hung-Hsuan Teh"}, {"name": "Tokiro Numasawa"}], "author_count": 2}, {"id": "2610.12646", "category": "quant-ph", "title": "Optimal linear-optical interferometers for unitary t-designs in a multi-photon Fock space", "abstract": "We investigate the construction of unitary $t$-designs in a multi-photon Fock space on programmable linear-optical interferometers. Using the frame potential as the optimization objective, we identify architectures that realize approximate unitary 1- and 2-designs with considerably fewer controllable parameters than required for universal linear optics. For example, we find numerical evidence suggesting that for unitary 1-designs, the required number of programmable parameters scales empirically as $2d$ with the number of modes $d$, instead of $O(d^2)$. We benchmark the resulting ensembles using single-photon transition probabilities and average channel fidelities. Furthermore, as a practical result, we develop a photon-number estimation protocol for multi-photon Fock states that leverages these optimized 1- and 2-designs. Our findings demonstrate that shallow interferometers can accurately reproduce Haar-averaged first moments, while second-moment-sensitive observables provide a considerably stricter test for approximate unitary 2-designs.", "url": "https://arxiv.org/abs/2610.12646", "type": "数值", "summary": "1. 该工作以帧势为优化目标，在多光子福克空间中设计可编程线性光学干涉仪，构造近似幺正1-设计和2-设计。\n2. 其卖点在于所需可调参数显著少于通用线性光学，1-设计参数数随模式数d经验性地以2d而非O(d^2)增长，并用单光子跃迁概率与平均信道保真度基准测试。\n3. 这表明浅层干涉仪可准确复现哈尔平均的一阶矩，而二阶矩敏感观测量对近似2-设计给出更严格检验，并可用于多光子福克态的光子数估计协议。", "summary_source": "deepseek", "authors": [{"name": "Robert A. Grinshtein"}, {"name": "Ivan V. Dyakonov"}, {"name": "Stanislav S. Straupe"}], "featured_authors": [{"name": "Robert A. Grinshtein"}, {"name": "Ivan V. Dyakonov"}, {"name": "Stanislav S. Straupe"}], "author_count": 3}, {"id": "2610.12664", "category": "quant-ph", "title": "A Catalytic Algorithm for Transposing Unknown Qutrit Unitaries with Tight Query Bounds", "abstract": "We construct exact deterministic circuits for transposing and inverting an unknown qutrit unitary $U\\in\\mathrm{SU}(3)$ using only forward queries. Three queries prepare a catalyst independently of the input state. Four further queries implement transposition while returning the catalyst unchanged and uncorrelated with the output. Two uses within an antisymmetric encoding implement inversion with eight processing queries and return the same catalyst. Reusing the catalyst implements $m$ transpositions or inversions with $3+4m$ or $3+8m$ total queries, respectively. More generally, we prove that exact transposition and inversion of an unknown $U\\in\\mathrm{SU}(d)$, $d\\ge2$, require at least $d+1$ and $d^2-1$ processing queries, respectively, in fixed causal order. These processing bounds hold for any program state prepared independently of the input state using finitely many forward queries, even if that state is consumed during processing. Both our catalytic qutrit algorithms attain their respective bounds. Moreover, exact qutrit transposition with four processing queries requires at least three preparation queries, and our construction attains this bound.", "url": "https://arxiv.org/abs/2610.12664", "type": "理论+数值", "summary": "1. 该工作围绕《A Catalytic Algorithm for Transposing Unknown Qutrit Unitaries with Tight Query Bounds》对应的问题给出了新的分析、建模或计算结果。\n2. 其卖点在于把核心物理图像、技术路线或数值证据压缩为可直接比较的结论。\n3. 这为相关体系的后续理论推演、算法验证或实验设计提供了可参考的出发点。", "summary_source": "translation-fallback", "authors": [{"name": "Yu-Ao Chen"}], "featured_authors": [{"name": "Yu-Ao Chen"}], "author_count": 1}, {"id": "2610.12782", "category": "quant-ph", "title": "Coset Lifted Product Codes: Constructing Quantum LDPC Codes from Non-Normal Subgroup Actions", "abstract": "We introduce coset lifted product (CLP) codes, a family of quantum LDPC codes that combine the protograph structure of lifted product codes with the coset action of Aydin, Tamo, and Barg \\cite{AydinTamoBarg2026}. Given a finite group $G$, a subgroup $H \\le G$ that need not be normal, a protograph $A$ over $\\mathbb F_2[G]$, and a protograph $B$ over $\\mathbb F_2[N_G(H)]$, the two protographs act on the cosets $G/H$ from the left and from the right to produce quantum CSS codes. Further, for groups of odd order, we give an explicit formula for the dimension as a sum over the irreducible representations $\\rho$ of $G$ of hypergraph product dimensions. A search over $14,843$ pairs $(G,H)$ with $H$ restricted to be non-normal and $120 \\le n \\le 400$ yields certified codes that exceed the best published value of $Q=kd^2/n$ at check weights $6,7$ and $9$, i.e., we obtain $[[360,20,20]]$ at $w=6$, a $[[360,24,20]]$ code at $w=7$, and codes $[[252,16,18]]$ and $[[288,16,20]]$ at $w=9$. Our search also produce high-distance codes with parameters $[[168,10,14]], [[240,8,20]]$ at $w=6$ and $[[216,8,18]]$ at $w=7$.", "url": "https://arxiv.org/abs/2610.12782", "type": "理论", "summary": "1. 该工作提出余集提升乘积（CLP）码，把提升乘积码的原图结构与Aydin-Tamo-Barg余集作用结合，借非正规子群H≤G构造量子CSS码。\n2. 其卖点在于F₂[G]与F₂[N_G(H)]上原图从左右作用于G/H，并给出奇数阶群维数按不可约表示求和的公式，且在14843对(G,H)搜索中获得[[360,20,20]]（w=6）等超越已发表Q值的码。\n3. 这为低校验权重下高距离量子LDPC码的设计拓展了非正规子群余集作用这一构造途径，并提示更广的群作用搜索空间。", "summary_source": "deepseek", "authors": [{"name": "Rajendra Prasad Rajpurohit"}, {"name": "V. Lalitha"}, {"name": "Shayan Srinivasa Garani"}], "featured_authors": [{"name": "Rajendra Prasad Rajpurohit"}, {"name": "V. Lalitha"}, {"name": "Shayan Srinivasa Garani"}], "author_count": 3}, {"id": "2610.12844", "category": "quant-ph", "title": "Improved classical optimization of fermionic Hamiltonians beyond Gaussian states", "abstract": "We give a polynomial-time randomized classical algorithm that approximates the largest eigenvalue $\\lambda_{\\max}$ of a traceless quartic fermionic Hamiltonian $H$ on $n$ modes. The algorithm achieves energy at least $\\lambda_{\\max}/O(\\sqrt n)$ and outputs either a fermionic Gaussian state or a polynomially sparse state in the Fock basis. This is achieved through a new upper bound on $\\lambda_{\\max}$ in terms of the maximum energy of a Gaussian state and $\\sqrt{2^{-n}\\operatorname{Tr}(H^2)}$.", "url": "https://arxiv.org/abs/2610.12844", "type": "理论+数值", "summary": "1. 该工作提出一个多项式时间的随机经典算法，用于近似无迹四阶费米子哈密顿量 H 在 n 个模式上的最大本征值 λmax，并输出费米子高斯态或福克基下多项式稀疏态。\n2. 其核心卖点是通过 λmax 的新上界，将其与高斯态最大能量及 √(2^{-n}迹(H²)) 联系起来，从而在保持经典效率的同时突破纯高斯态优化。\n3. 这为费米子多体问题的经典优化提供可证明的近似保证，并暗示在 O(√n) 近似因子下经典方法可超越高斯态限制，对量子优势边界和变分算法设计具有参考意义。", "summary_source": "deepseek", "authors": [{"name": "Ojas Parekh"}], "featured_authors": [{"name": "Ojas Parekh"}], "author_count": 1}, {"id": "2610.12908", "category": "quant-ph", "title": "Classification of bipartite observables II: NIP observables and the Todorcevic trichotomy", "abstract": "A bipartite observable is stable when its idealized responses are continuous. We show that it is NIP exactly when they are of the first Baire class. They then form a Rosenthal compactum, and the dividing lines of Shelah in model theory, together with the classification of Rosenthal compacta of Todorčević, acquire a physical meaning. For observables, mixtures of states make every hereditarily separable compactum of idealized responses metrizable, and the Todorčević trichotomy becomes a classification into three classes. Each class contains a physical order: the comparison of photon numbers, the comparison of positions, and the causal order of spacetime, whose idealized responses are not first countable because a light cone can shrink to a point; the comparison of two phases on a circle joins it there. Each of the seven minimal families of the heptachotomy, which Argyros, Dodos and Kanellopoulos extracted from the methods of Todorčević, is realized by a tree of preparations of photons, of a particle in a box, or of a spin chain read by a probe; the spin chain also shows that NIP, unlike its uniform version, is not symmetric between the two parties. Finally, for the Ising model in a transverse field we show that, in the ordered phase, the responses of the two pure phases form split pairs whose midpoints, the responses of the symmetric state, form an uncountable discrete set; the proof uses a Lee--Yang theorem for this model.", "url": "https://arxiv.org/abs/2610.12908", "type": "理论", "summary": "1. 该工作围绕《Classification of bipartite observables II: NIP observables and the Todorcevic trichotomy》对应的问题给出了新的分析、建模或计算结果。\n2. 其卖点在于把核心物理图像、技术路线或数值证据压缩为可直接比较的结论。\n3. 这为相关体系的后续理论推演、算法验证或实验设计提供了可参考的出发点。", "summary_source": "translation-fallback", "authors": [{"name": "Eduardo Dueñez"}, {"name": "José Iovino"}], "featured_authors": [{"name": "Eduardo Dueñez"}, {"name": "José Iovino"}], "author_count": 2}, {"id": "2610.12929", "category": "quant-ph", "title": "An Instability of the Quantum Markov Length", "abstract": "The Markov length, the length scale governing the exponential decay of conditional mutual information (CMI) in a quantum many-body state, has proven useful for characterizing mixed-state phases of matter. Nevertheless, we show that a state's Markov length is not generally stable under weak local channels. The failure of stability occurs already at a pure product state. We demonstrate this explicitly in a one-dimensional fermionic chain, where a fine-tuned depth-two circuit of nearest-neighbor Gaussian channels maps the vacuum to a state whose CMI decays \\emph{algebraically} and whose Markov length is therefore infinite, even when the channels are taken arbitrarily close to the
