<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>arXiv 2026-10-12 · Daily ArXiv Selection</title>
  <style>
    :root {
      --bg: #f6f1e8;
      --panel: rgba(255, 252, 246, 0.92);
      --text: #2d241d;
      --muted: #6d5d50;
      --line: rgba(69, 49, 32, 0.14);
      --accent: #8f3d2e;
      --accent-2: #1d5f6b;
      --theory: #7c3a2a;
      --numeric: #255b6a;
      --both: #5d4a99;
      --experimental: #2f6b39;
      --shadow: 0 18px 40px rgba(54, 32, 16, 0.12);
      --radius: 22px;
      --ui-font: "Aptos", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --title-font: "Palatino Linotype", "Noto Serif SC", Georgia, serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--ui-font);
      color: var(--text);
      background: radial-gradient(circle at top left, rgba(255,255,255,0.78), transparent 32%), radial-gradient(circle at 88% 12%, rgba(29,95,107,0.14), transparent 20%), linear-gradient(180deg, #fbf7f0 0%, var(--bg) 42%, #f2e8dc 100%);
      min-height: 100vh;
    }
    .shell { width: min(1220px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 64px; }
    .hero {
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(255,255,255,0.84), rgba(255,248,238,0.72)), linear-gradient(135deg, rgba(143,61,46,0.08), rgba(29,95,107,0.08));
      box-shadow: var(--shadow);
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.82); border: 1px solid var(--line); color: var(--muted); font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase;
    }
    h1 { margin: 18px 0 10px; font-family: var(--title-font); font-size: clamp(32px, 5vw, 54px); line-height: 1.04; letter-spacing: -0.03em; }
    .hero p { max-width: 880px; color: var(--muted); font-size: 16px; line-height: 1.7; margin: 0; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-top: 26px; }
    .stat { padding: 16px 18px; background: rgba(255,255,255,0.76); border: 1px solid var(--line); border-radius: 18px; }
    .stat .label { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
    .stat .value { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
    .controls { position: sticky; top: 12px; z-index: 3; margin-top: 22px; padding: 18px; border: 1px solid var(--line); border-radius: 24px; background: rgba(250,244,236,0.9); backdrop-filter: blur(16px); box-shadow: 0 10px 24px rgba(54,32,16,0.08); }
    .control-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 16px; }
    .field { display: flex; flex-direction: column; gap: 10px; }
    .field label { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
    .search { width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line); background: rgba(255,255,255,0.92); font: inherit; color: var(--text); }
    .chip-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .chip { border: 1px solid var(--line); background: rgba(255,255,255,0.82); color: var(--text); padding: 10px 14px; border-radius: 999px; font: inherit; cursor: pointer; }
    .chip.active { border-color: rgba(143,61,46,0.35); background: rgba(143,61,46,0.12); color: #5b2419; }
    .chip[data-type="数值"].active { border-color: rgba(37,91,106,0.35); background: rgba(37,91,106,0.12); color: #173f49; }
    .chip[data-type="理论+数值"].active { border-color: rgba(93,74,153,0.35); background: rgba(93,74,153,0.12); color: #46337d; }
    .chip[data-type="实验"].active { border-color: rgba(47,107,57,0.35); background: rgba(47,107,57,0.12); color: #214c29; }
    .meta-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 14px; color: var(--muted); font-size: 14px; }
    .paper-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 18px; margin-top: 22px; }
    .paper { display: flex; flex-direction: column; gap: 14px; padding: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 10px 24px rgba(54,32,16,0.06); }
    .paper-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .tag { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid transparent; }
    .tag.category { background: rgba(45,36,29,0.08); color: var(--text); }
    .tag.type-theory { background: rgba(124,58,42,0.1); color: var(--theory); border-color: rgba(124,58,42,0.16); }
    .tag.type-numeric { background: rgba(37,91,106,0.1); color: var(--numeric); border-color: rgba(37,91,106,0.16); }
    .tag.type-both { background: rgba(93,74,153,0.1); color: var(--both); border-color: rgba(93,74,153,0.16); }
    .tag.type-experimental { background: rgba(47,107,57,0.1); color: var(--experimental); border-color: rgba(47,107,57,0.16); }
    .paper h2 { margin: 0; font-family: var(--title-font); font-size: 22px; line-height: 1.25; letter-spacing: -0.02em; }
    .paper h2 a { color: inherit; text-decoration: none; }
    .paper h2 a:hover { color: var(--accent); }
    .paper .id { color: var(--muted); font-size: 13px; }
    .author-block { display: grid; gap: 10px; padding: 14px 16px; border-radius: 18px; background: rgba(255,255,255,0.64); border: 1px solid var(--line); }
    .author-label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .author-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .author-item { display: grid; gap: 4px; }
    .author-item strong { font-size: 14px; }
    .author-item span { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .author-note { color: var(--muted); font-size: 12px; }
    .paper .summary { margin: 0; font-size: 15px; line-height: 1.75; white-space: pre-line; }
    details { border-top: 1px solid var(--line); padding-top: 12px; }
    details summary { cursor: pointer; color: var(--accent-2); font-weight: 700; list-style: none; }
    details summary::-webkit-details-marker { display: none; }
    details p { margin: 10px 0 0; color: var(--muted); line-height: 1.72; font-size: 14px; white-space: pre-line; }
    .paper footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 6px; color: var(--muted); font-size: 13px; }
    .paper footer a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .empty { display: none; margin-top: 24px; padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 22px; background: rgba(255,255,255,0.7); }
    @media (max-width: 980px) { .control-grid { grid-template-columns: 1fr; } .controls { position: static; } }
  </style>
</head>

      <h1>Daily ArXiv Selection</h1>

        数据来自 arXiv 当天的 <code>cond-mat</code>、<code>hep-th</code>、<code>math-ph</code>、<code>quant-ph</code> 四个分类页，口径限定为 <code>New submissions</code>。
        页面主体优先展示 DeepSeek reasoner 生成的三句话中文总结；若 API 不可用或返回异常，则回退为基于中文翻译抽取的本地三句话总结；下拉可以查看英文原版摘要。
      </p>

        <div><a href="../index.html">返回归档</a></div>
      </div>

  <script>
    const papers = [{"id": "2610.12511", "category": "cond-mat", "title": "Spinodal-controlled freeze-out and nucleation at the first-order superfluid-supersolid transition of a dipolar gas", "abstract": "Dipolar quantum gases in elongated traps become supersolid through a transition that is continuous at intermediate density but first order at low and high density; at the continuous point, ramps of the scattering length follow Kibble--Zurek scaling. We study ramps across the first-order superfluid--supersolid transition of $^{164}$Dy in an infinite tube using the three-dimensional extended Gross--Pitaevskii equation with truncated-Wigner noise. With quantum noise only, the uniform superfluid survives the metastable window and transforms after its spinodal, where the roton softens. For onsets occurring during the linear ramp, the delay measured from this spinodal has a fitted exponent $\\zeta = 0.36 \\pm 0.02$, close to the continuous-transition result and the mean-field value $1/3$. The quoted uncertainty combines statistical and systematic sensitivities. Reverse ramps show a comparable delay beyond the fold of the crystal branch, producing dynamical hysteresis. Initial thermal noise with nominal temperatures of 2.5--10 nK produces crystalline regions inside the metastable window during holds, with faster nucleation closer to the spinodal and at higher initial temperature. Without a heat bath these effective rates depend on preparation: ramps crossing the window at the same rate nucleate early in 2 of 32 or 11 of 16 realizations depending on their starting point. A crossover time inferred from hold rates is therefore an estimate, not a measured boundary for the ramp protocol. At low density, slower ramps select larger spacings in a crystal of separated droplets, and droplets survive far above the transition on reverse ramps.", "url": "https://arxiv.org/abs/2610.12511", "type": "理论", "summary": "1. 该工作用含截断维格纳噪声的三维扩展GP方程，研究镝-164无限管中跨越一阶超流—超固态转变的扫描，并区分量子噪声与初始热噪声下的冻结和成核。\n2. 其卖点在于扫描延迟由失稳点处 roton 软化决定，拟合指数ζ=0.36±0.02接近连续转变与平均场值1/3，反向扫描呈现动力学迟滞。\n3. 这启示一阶超流—超固态成核与迟滞强烈依赖制备路径和热噪声，由保持过程推断的交叉时间仅为估计而非扫描协议的测量边界。", "summary_source": "deepseek", "authors": [{"name": "Wai Kui Wong"}], "featured_authors": [{"name": "Wai Kui Wong"}], "author_count": 1}, {"id": "2610.12563", "category": "cond-mat", "title": "Enhanced Coulomb pseudopotentials in high-pressure hydrides from first principles", "abstract": "In the Eliashberg theory of superconductivity, Coulomb interactions oppose the phonon-mediated attraction and suppress the superconducting critical temperature $T_{\\mathrm{c}}$. However, most first-principles predictions continue to treat this repulsion with an empirical Coulomb pseudopotential $\\mu^*_{\\text{ME}}$ in the range 0.1-0.15. Here we present first-principles calculations of the Coulomb parameter $\\mu$ and pseudopotential $\\mu^*_{\\text{ME}}$ in superconducting hydrides across a range of pressures. The screened Coulomb interaction is evaluated at the random phase approximation level with the Mantel code. We demonstrate that several hydride systems, including H$_3$S, YSbH$_6$ and Mg$_2$IrH$_6$, have strong Coulomb repulsions driven by a large density of states at the Fermi energy, $N_{\\mathrm{F}}$. For Mg$_2$IrH$_6$ we obtain $\\mu=0.62$ and $\\mu^*_{\\text{ME}}\\approx0.39$, leading to a 40 K suppression in $T_{\\mathrm{c}}$ relative to a standard $\\mu^*_{\\text{ME}}=0.16$. Our obtained $\\mu^*_{\\text{ME}}$ is far above the conventional range and, accounting for the energy dependence of the density of states, resolves the factor-of-two discrepancy between $T_{\\mathrm{c}}$ estimates of previous studies. Across all systems and pressures studied, we find that $\\mu$ closely tracks $N_{\\mathrm{F}}$, suggesting that commonly used $\\mu^*_{\\text{ME}}$ values lead to overestimated $T_{\\mathrm{c}}$ in materials where the density of states at the Fermi energy is large.", "url": "https://arxiv.org/abs/2610.12563", "type": "理论+数值", "summary": "1. 该工作基于第一性原理，在随机相位近似下用Mantel代码计算了高压氢化物超导体的库仑参数μ与赝势μ*_ME。\n2. 其卖点在于揭示H3S、YSbH6、Mg2IrH6等体系因费米能处高态密度N_F而出现强库仑排斥，Mg2IrH6的μ=0.62、μ*_ME≈0.39远高于常规0.1–0.15，使Tc相对μ*_ME=0.16压低40 K。\n3. 所有体系与压力下μ均紧密追随N_F，计入态密度能量依赖可解决先前Tc估计的两倍差异，并表明高N_F材料中常用μ*_ME会系统高估Tc。", "summary_source": "deepseek", "authors": [{"name": "Kieran Bozier"}, {"name": "Chris J. Pickard"}], "featured_authors": [{"name": "Kieran Bozier"}, {"name": "Chris J. Pickard"}], "author_count": 2}, {"id": "2610.12635", "category": "cond-mat", "title": "Entropic-ordered superfluid", "abstract": "We present a minimal classical lattice model of superfluidity at arbitrarily high temperatures, using a modified three-dimensional XY model with ``soft\" rotors. The global U(1) symmetry is spontaneously broken above a positive critical temperature due to entropic order. We study hydrodynamics in this high-temperature regime and verify consistency with the fluctuation-dissipation theorem, explaining how the large noise variance at very high temperatures is not sufficient to destroy superfluidity or the long lifetime of Goldstone modes.", "url": "https://arxiv.org/abs/2610.12635", "type": "理论", "summary": "1. 该工作提出一个可在任意高温下描述超流的最小经典格点模型，采用带“软”转子的三维XY模型，并研究其高温流体力学。\n2. 其卖点在于熵致序使全局U(1)对称性在正临界温度以上自发破缺，同时高温流体力学满足涨落耗散定理，表明大噪声方差不足以破坏超流与Goldstone模的长寿命。\n3. 这为理解熵驱动的高温有序相、连续对称性破缺，以及Goldstone模在强热涨落下的稳定性提供了明确的经典格点模型框架与后续研究启发。", "summary_source": "deepseek", "authors": [{"name": "Isabella Zane"}, {"name": "Andrew Lucas"}], "featured_authors": [{"name": "Isabella Zane"}, {"name": "Andrew Lucas"}], "author_count": 2}, {"id": "2610.12652", "category": "cond-mat", "title": "Entropy Production in Mesoscopic Electronic Transport Beyond Weak-Coupling", "abstract": "We investigate the full statistics of entropy production in coherent mesoscopic conductors beyond the weak-coupling regime. Using the inside-outside perspective and the Landauer-Büttiker scattering framework, we relate entropy production to the full counting statistics of particle transport and show that the corresponding cumulant-generating function satisfies the fluctuation symmetry independently of the coupling strength. We obtain closed analytical expressions for the cumulant-generating function in the weak- and strong-coupling limits, enabling a detailed characterization of entropy production distributions and higher-order cumulants. These cumulants reveal distinct signatures of resonant transport and coherent fermionic partitioning. While coupling-induced broadening substantially modifies the transport statistics, the fluctuation symmetry imposed by microscopic reversibility remains preserved in the long-time limit.", "url": "https://arxiv.org/abs/2610.12652", "type": "理论", "summary": "1. 该工作基于内-外视角和Landauer-Büttiker散射框架，研究了相干介观导体在超出弱耦合区的熵产生全统计，并将其与粒子输运的全计数统计相联系。\n2. 核心卖点在于证明相应的累积量生成函数在任意耦合强度下满足涨落对称性，并给出弱耦合与强耦合极限的闭式解析表达式，从而刻画熵产生分布及高阶累积量，揭示共振输运和相干费米子分配的独特特征。\n3. 该结果意味着耦合诱导的展宽虽显著改变输运统计，但微观可逆性所强制的涨落对称性在长时极限仍保持，为介观相干输运中非弱耦合热力学统计提供可检验的判据与启发。", "summary_source": "deepseek", "authors": [{"name": "Ivana R. A. C. Lucena"}, {"name": "Caio H. Lewenkopf"}, {"name": "Alexandre R. Rocha"}], "featured_authors": [{"name": "Ivana R. A. C. Lucena"}, {"name": "Caio H. Lewenkopf"}, {"name": "Alexandre R. Rocha"}], "author_count": 3}, {"id": "2610.12663", "category": "cond-mat", "title": "Spectral optimization of spherical lattices and applications to classical and quantum interacting spin systems", "abstract": "We develop an optimization algorithm for spherical lattice discretizations based on the spectrum of the discretized Laplace operator. Starting from refined icosahedral lattices, we minimize the splitting of the $(2\\ell+1)$, $\\ell=0,1,2,\\dots$, continuum multiplets expected from $\\mathrm{SO}(3)$ symmetry via gradient descent. This approach simultaneously produces lattices based on triangles with nearly uniform circumradii and perimeters. Although the optimization uses only the free-particle spectrum, we show that the resulting lattices carry over to interacting models. On the optimized lattices, rotational symmetry is restored for the critical Ising and Potts models and primary scaling dimensions are accurately reproduced for the three-dimensional Ising conformal field theory, when appropriate geometry-dependent interaction strengths are used. Higher-angular-momentum descendant states reveal weak residual symmetry breaking beyond the sectors protected by the underlying icosahedral symmetry.", "url": "https://arxiv.org/abs/2610.12663", "type": "理论+数值", "summary": "1. 该工作提出一种基于离散拉普拉斯算子谱的球面格点优化算法，从细化二十面体格点出发，用梯度下降最小化SO(3)对称性所预期的连续(2ℓ+1)重多重态分裂。\n2. 其关键在于仅使用自由粒子谱优化三角形格点，使外接半径与周长近乎均匀，并证明所得格点可迁移至相互作用模型：在临界Ising与Potts模型中恢复转动对称性，并在采用几何依赖相互作用强度时准确复现三维Ising共形场论的主标度维度。\n3. 该谱优化策略为球面格点上的高精度共形与量子多体计算提供可行途径；高阶角动量后代态仅呈现弱残余对称破缺，也为评估二十面体保护之外的离散化误差提供基准。", "summary_source": "deepseek", "authors": [{"name": "Jonas Völler"}, {"name": "Grigorios Makris"}, {"name": "Fabian Hassler"}, {"name": "Stefan Wessel"}], "featured_authors": [{"name": "Jonas Völler"}, {"name": "Grigorios Makris"}, {"name": "Fabian Hassler"}, {"name": "Stefan Wessel"}], "author_count": 4}, {"id": "2610.12700", "category": "cond-mat", "title": "Improving the lower bound on the Laughlin gap: An SDP search", "abstract": "A recent preprint by OpenAI resolved the spherical fermionic Laughlin spectral-gap conjecture for the full $V_1$ interaction by a Fock-space inequality: $H_Q^2\\ge \\gamma H_Q$ on the lowest-Landau-level Fock space for all large flux $Q$ and every $\\gamma$ below $0.0461673\\ldots$, so that the gap above the Laughlin state at filling $1/3$ is at least $1/25$. That proof, with its original constant, has also been formalized in Lean. We show that the same argument supports a much larger constant. Two sharper estimates, a product-twirl bound for the three-body tail and a staircase price for the four-body allowance, raise the constant above $0.0601$ without changing the original certificate. Treating the auxiliary operators as the variables of a semidefinite program (SDP) and enlarging the finite set of orbital modes on which they act then gives $H_Q^2\\ge\\gamma H_Q$ for every $\\gamma<\\gamma_*=0.2190037845063196\\ldots$, certified by exact rational arithmetic. Consequently the gap above the Laughlin state is at least $1/5$ for all sufficiently large spheres, and the untruncated planar $V_1$ Hamiltonian has positive spectrum bounded below by $\\gamma_*$, uniformly in particle number and angular momentum. A heuristic extrapolation of the SDP optima suggests that auxiliary operators of the present form can give at most about $0.222$, while exact diagonalization of finite systems places the true gap near $0.4$. A larger family of auxiliary operators could push the bound further towards the true gap, and the SDP formulation makes such families easy to test. The proof of the improvement and the SDP search were completed by the AI model Claude Opus 5.5 (Anthropic) under the author's direction.", "url": "https://arxiv.org/abs/2610.12700", "type": "理论+数值", "summary": "1. 该工作围绕《Improving the lower bound on the Laughlin gap: An SDP search》对应的问题给出了新的分析、建模或计算结果。\n2. 其卖点在于把核心物理图像、技术路线或数值证据压缩为可直接比较的结论。\n3. 这为相关体系的后续理论推演、算法验证或实验设计提供了可参考的出发点。", "summary_source": "translation-fallback", "authors": [{"name": "Qiang Gao"}], "featured_authors": [{"name": "Qiang Gao"}], "author_count": 1}, {"id": "2610.12714", "category": "cond-mat", "title": "Electron binding by charge disorder surrounding gapped bilayer graphene", "abstract": "Bilayer graphene (BLG) is a unique electronic material offering electrostatic tunability of its band gap. Here, we study how charge disorder in the dielectric environment modifies band-edge states by binding electrons and holes to Coulomb centres, taking into account the in- and out-of-plane dielectric response of Bernal bilayers. We apply this framework to (a) hBN-encapsulated medium-size-gap BLG used for gate-defined quantum dots, and (b) BLG under double n/p ionic gating. In hBN/BLG/hBN, we find that single remote charges produce only weakly bound states, with binding energies generally small compared with the BLG gap. Under ionic gating, we find that the bound states are too large to be trapped by individual ions -- localisation arises from fluctuations in the ion density, whose magnitude is limited by Coulomb charging energy at the freezing temperature $T_f$ of the ionic configuration. Thus, in both regimes, charge disorder does not produce deep midgap states, with the bound states remaining closer to the conduction and valence band edges.", "url": "https://arxiv.org/abs/2610.12714", "type": "理论", "summary": "1. 该工作建立理论框架，研究介电环境中的电荷无序如何通过库仑中心束缚带隙Bernal双层石墨烯的电子和空穴，并计入其面内与面外介电响应来修正带边态。\n2. 应用于hBN封装中等带隙BLG及双n/p离子栅BLG，发现单个远程电荷或离子仅给出浅束缚态，其束缚能多小于BLG带隙；离子栅下的局域化来自受冻结温度T_f库仑充电能限制的离子密度涨落，而非单个离子俘获。\n3. 因此两类体系中电荷无序均未产生深带隙内态，束缚态靠近导带与价带边，这为栅定义量子点和离子栅BLG器件的带边输运、陷阱及无序评估提供了明确约束。", "summary_source": "deepseek", "authors": [{"name": "Jude McClay"}, {"name": "Angelika Knothe"}, {"name": "Igor Rozhansky"}, {"name": "Vladimir Fal'ko"}], "featured_authors": [{"name": "Jude McClay"}, {"name": "Angelika Knothe"}, {"name": "Igor Rozhansky"}, {"name": "Vladimir Fal'ko"}], "author_count": 4}, {"id": "2610.12746", "category": "cond-mat", "title": "The quantum geometry of the chemical bond", "abstract": "Electronic properties of materials depend both on band energies and quantum geometry of electronic states. We relate bonding indices to the quantum geometric tensor (QGT), showing how chemical bonding dictates the momentum-space texture of bands, bridging chemical and physical descriptions of solids. We show the QGT decomposed into the three center bond index, weighted by their oriented area. Resolving these contributions by orbital pair reveals the donor--acceptor character that distinguish ionic, covalent, hypervalent, and metavalent bonding. We identify the bonding pattern for topology in materials: noncollinear three center bonds, which are the source of Berry curvature in solids. Bond fluctuation can be directly linked to electromagnetic response by resolving their energy spectrum, opening a quantitative route towards the design of physical properties of materials from bonding motifs.", "url": "https://arxiv.org/abs/2610.12746", "type": "理论", "summary": "1. 该工作将化学键指标与量子几何张量联系起来，揭示成键如何决定能带在动量空间中的纹理，从而沟通固体化学与物理描述。\n2. 其核心是将量子几何张量分解为有向面积加权的三中心键指标，按轨道对分辨给体-受体特征并区分离子、共价、超价与金属价键，且指认非共线三中心键为贝里曲率来源。\n3. 该框架通过解析键涨落的能谱将其与电磁响应直接关联，为从成键基元定量设计材料物理性质开辟了路径。", "summary_source": "deepseek", "authors": [{"name": "Gabrielle Carrel"}, {"name": "Nishchhal Verma"}, {"name": "Fatmagül Katmer"}, {"name": "Leslie M. Schoop"}, {"name": "Raquel Queiroz"}], "featured_authors": [{"name": "Gabrielle Carrel"}, {"name": "Nishchhal Verma"}, {"name": "Fatmagül Katmer"}, {"name": "Leslie M. Schoop"}, {"name": "Raquel Queiroz"}], "author_count": 5}, {"id": "2610.12749", "category": "cond-mat", "title": "Corrugated Niobene: Stability, Mechanical and Electronic Properties from First-Principles Calculations", "abstract": "The growing diversity of two-dimensional (2D) materials has expanded opportunities in electronics, energy technologies, catalysis, and optical applications. Within this landscape, understanding how corrugated architectures accommodate metallic bonding and influence the stability and properties of monoelemental niobium sheets remains an open research direction. Here, we propose a corrugated niobene nanosheet, denoted c-Nb, and investigate its structural, energetic, vibrational, mechanical, electronic, and optical properties using density functional theory simulations. The optimized structure adopts a centrosymmetric P-3m1 symmetry, with six atoms per primitive cell and a geometrical thickness of 4.279 Angstrom. Its cohesive energy of -6.03 eV/atom indicates strong binding relative to isolated atoms, although bulk BCC Nb remains energetically favored by 2.49 eV/atom. The absence of imaginary phonon frequencies along the investigated high-symmetry path and the positive-definite in-plane stiffness matrix support dynamical and mechanical structural stability. Despite its pronounced corrugation, the nanosheet exhibits isotropic in-plane elasticity, with Young's and shear moduli of 43.66 N/m and 13.66 N/m, respectively, and a Poisson's ratio of 0.598. Electronic states near the Fermi level are dominated by Nb 4d orbitals, establishing multiband metallicity. These findings identify a corrugated structural candidate that combines strong cohesion, elastic compliance, and metallic electronic behavior, extending the structural diversity of monoelemental 2D metals and providing a basis for further exploration of niobium nanosheets in electronic and ultraviolet-responsive systems.", "url": "https://arxiv.org/abs/2610.12749", "type": "理论+数值", "summary": "1. 该工作围绕《Corrugated Niobene: Stability, Mechanical and Electronic Properties from First-Principles Calculations》对应的问题给出了新的分析、建模或计算结果。\n2. 其卖点在于把核心物理图像、技术路线或数值证据压缩为可直接比较的结论。\n3. 这为相关体系的后续理论推演、算法验证或实验设计提供了可参考的出发点。", "summary_source": "translation-fallback", "authors": [{"name": "Willian O. Santos"}, {"name": "José A. S. Laranjeira"}, {"name": "Kleuton A. L. Lima"}, {"name": "Douglas S. Galvão"}, {"name": "David L. Azevedo"}], "featured_authors": [{"name": "Willian O. Santos"}, {"name": "José A. S. Laranjeira"}, {"name": "Kleuton A. L. Lima"}, {"name": "Douglas S. Galvão"}, {"name": "David L. Azevedo"}], "author_count": 5}, {"id": "2610.12798", "category": "cond-mat", "title": "Quadratic XY-anisotropy correction to the spontaneous staggered magnetization of the gapped XYZ spin-$1/2$ chain", "abstract": "The staggered order parameter of the gapped XYZ spin-$1/2$ chain follows from the eight-vertex solution, but in elliptic variables that fix the Hamiltonian couplings only implicitly. We derive a closed form for the coefficient governing the leading quadratic response of the spontaneous staggered magnetization to the XY anisotropy at fixed longitudinal anisotropy in the gapped antiferromagnetic regime. Starting from the Baxter--Kelland--Jimbo--Miwa--Nakayashiki polarization formula, we show that at fixed longitudinal anisotropy both the modular nome and the crossing-parameter variable of the formula move with the XY anisotropy, and that the motion of the crossing-parameter variable reverses the sign of the expansion at fixed elliptic variables. The coefficient is a rational term plus a Lambert series. It is strictly negative and bounded above by a rational function of the longitudinal anisotropy, to which it is asymptotic in the Ising limit. At the isotropic point it diverges as the inverse five-halves power of the distance to that point, and since the Lambert sum has an asymptotic expansion with exponentially small remainder, the subleading terms of the divergence also follow in closed form. When the XY anisotropy vanishes as the five-fourths power of the distance to the isotropic point, the ratio of the perturbed to the unperturbed order parameter tends to a Gaussian in the scaling variable, and the quadratic truncation is controlled when that variable is small. A fourth-order perturbative calculation in the spin chain, with no input from the eight-vertex solution, reproduces the leading strong-coupling behaviour, and infinite-DMRG calculations at four anisotropies in the gapped regime are consistent with the closed form.", "url": "https://arxiv.org/abs/2610.12798", "type": "理论+数值", "summary": "1. 该工作围绕《Quadratic XY-anisotropy correction to the spontaneous staggered magnetization of the gapped XYZ spin-$1/2$ chain》对应的问题给出了新的分析、建模或计算结果。\n2. 其卖点在于把核心物理图像、技术路线或数值证据压缩为可直接比较的结论。\n3. 这为相关体系的后续理论推演、算法验证或实验设计提供了可参考的出发点。", "summary_source": "translation-fallback", "authors": [{"name": "Felipe Taha Sant'Ana"}], "featured_authors": [{"name": "Felipe Taha Sant'Ana"}], "author_count": 1}, {"id": "2610.12956", "category": "cond-mat", "title": "Vacuum-field-mediated Landau-level reconstruction in a cavity-coupled two-dimensional electron gas", "abstract": "We study a two-dimensional electron gas in the integer quantum Hall regime coupled to a single spatially modulated cavity mode in the static off-resonant limit. Retaining both paramagnetic and diamagnetic contributions on equal footing, we derive a gauge complete single-particle Hamiltonian in which virtual photon exchange generates a periodic kinetic renormalization and a diamagnetic scalar potential. Both terms transfer momentum by $2k_0$ and displace guiding centers by $\\Delta X=2k_0\\ell_B^2$, forming a finite-$k_0$ momentum ladder. Diagonalizing the strip Hamiltonian, we find that the ladder reconstructs the Landau-level band structure and redistributes, rather than multiplies, the associated chiral edge states. Occupied-subspace Chern numbers remain $C_\\nu=\\nu$ for $\\nu=1,2,3$ throughout $0\\le\\lambda_{\\mathrm{cav}}\\le 0.5$, while the bulk gaps decrease without closing. Strip Kubo responses show cavity-induced displacements of the Hall-step energies; at finite width the plateau heights are noninteger and approach the integers as $L_x$ increases. The ladder is spectrally resolved at $k_0\\ell_B=0.5$ and collapses at $k_0\\ell_B=0.1$. These results isolate a spatially local, finite-$k_0$ momentum ladder as a clean-system mechanism by which a structured vacuum field reconstructs quantum Hall spectra and strip transport without changing the integer topology, complementary to cavity-mediated all-to-all hopping.", "url": "https://arxiv.org/abs/2610.12956", "type": "理论+数值", "summary": "1. 该工作研究了静态失谐下与单个空间调制腔模耦合的整数量子霍尔二维电子气，并推导了规范完备的单粒子哈密顿量。\n2. 同时保留顺磁与抗磁项，虚光子交换产生周期动能重正化和抗磁标量势，形成有限k0动量阶梯并重构朗道能级。\n3. 该阶梯在不改变整数拓扑(Cν=ν)下重新分配手性边缘态并移动霍尔台阶能量，为腔介导全连接跃迁之外提供局域机制。", "summary_source": "deepseek", "authors": [{"name": "Zi-Heng Zhu"}, {"name": "Yu Chen"}], "featured_authors": [{"name": "Zi-Heng Zhu"}, {"name": "Yu Chen"}], "author_count": 2}, {"id": "2610.12996", "category": "cond-mat", "title": "Real-Time Relaxation Dynamics of Dark Excitons in Mirror-Symmetric Monolayers", "abstract": "Symmetry governs which exciton-phonon (\\textit{exc-ph}) scattering channels \\textit{can} exist, but not which a relaxing exciton actually uses. Combining group theory with \\textit{ab initio} many-body perturbation theory, we derive the mirror parity $\\sigma_h$, of finite-momentum excitons in planar $D_{3h}$ monolayers, and form exact \\textit{exc-ph} selection rules that hold across the whole Brillouin zone. The parity of the lowest exciton band changes across a closed contour. The even phonons connect states of the same parity, while odd phonons connect states of opposite parity. We use these rules to compute exciton linewidths and we solve the real-time Boltzmann transport equation for monolayer GaN as the test case and benchmark it against monolayer \\textit{h}BN.", "url": "https://arxiv.org/abs/2610.12996", "type": "理论+数值", "summary": "1. 该工作结合群论与第一性原理多体微扰理论，推导平面D3h单层有限动量激子的镜面宇称，并建立覆盖全布里渊区的激子-声子选择定则。\n2. 关键物理机制在于最低激子带宇称沿闭合等值线改变，偶声子连接同宇称态、奇声子连接反宇称态，从而确定实际弛豫通道。\n3. 作者据此计算激子线宽并求解实时玻尔兹曼输运方程，以单层氮化镓为测试并与六方氮化硼基准比较，为暗激子弛豫动力学提供可检验框架。", "summary_source": "deepseek", "authors": [{"name": "Rishabh Saraswat"}, {"name": "Mantasha Ansari"}, {"name": "Rekha Verma"}, {"name": "Sitangshu Bhattacharya"}], "featured_authors": [{"name": "Rishabh Saraswat"}, {"name": "Mantasha Ansari"}, {"name": "Rekha Verma"}, {"name": "Sitangshu Bhattacharya"}], "author_count": 4}, {"id": "2610.13009", "category": "cond-mat", "title": "Odd-Parity Crystalline Electric Field and Multipoles in Icosahedral Quasicrystal and Approximant: Magnetic Toroidal and Electric Dipoles in Ce-Based Systems", "abstract": "Quasicrystals (QCs) lack periodic arrangement of atoms but possess unique structural order distinct from periodic crystals and random systems. The electronic property is far from complete understanding. Here we have formulated not only even-parity but also odd-parity crystalline electric field (CEF) in the Ce-based icosahedral QC and approximant crystal (AC) on the basis of the point charge model. Under the odd-parity CEF due to local-inversion symmetry breaking at the Ce site, the hybrid wavefunction of 4f and 5d states at Ce is shown to give rise to the odd-parity multipoles such as electric dipole and magnetic toroidal (MT) dipole. We have found that the vortex order in the 1/1 AC where the magnetic moments on each icosahedron swirl is characterized by the cluster-type MT moment. The ferroic alignment of the cluster MT moments in the vortex order gives rise to the electro-magnetic effect. The cluster-MT moment is shown to be resonated with the MT dipole moments in each icosahedron by tuning the 4f energy level and 5d energy level so as to approach. We have revealed a noncollinear magnetic structure is stabilized in the ground state of the icosahedral QC cluster, behind which there exists underlying mechanism to prefer the ferroic interaction for the net MT dipole moments between the icosahedrons. We point out that the 4f and 5d energy levels can be made approach at the valence transition or the valence crossover, which is ubiquitous in the rare-earth based ACs and QCs.", "url": "https://arxiv.org/abs/2610.13009", "type": "理论", "summary": "1. 该工作基于点电荷模型，为铈基二十面体准晶及1/1近似晶构建了包含偶宇称与奇宇称的晶体电场，并研究局域反演破缺下4f-5d杂化诱导的电偶极与磁环偶极等奇宇称多极。\n2. 其要点是奇宇称晶体电场使1/1近似晶涡旋序由簇型磁环矩刻画，簇磁环矩铁性排列产生电磁效应，调节4f与5d能级可使其与二十面体内磁环偶极共振；准晶簇基态则稳定非共线磁结构，源于二十面体间净磁环偶极的铁性相互作用。\n3. 该机制指出4f与5d能级可在稀土基近似晶和准晶常见的价跃迁或价交叉处接近，为奇宇称多极、磁环序及电磁响应提供可检验的普遍图像。", "summary_source": "deepseek", "authors": [{"name": "Shinji Watanabe"}, {"name": "Syunta Furuya"}, {"name": "Mitsuaki Kawamura"}], "featured_authors": [{"name": "Shinji Watanabe"}, {"name": "Syunta Furuya"}, {"name": "Mitsuaki Kawamura"}], "author_count": 3}, {"id": "2610.13017", "category": "cond-mat", "title": "Parity-Anomalous Hall Response of Chiral Lifshitz Fermions", "abstract": "The parity anomaly of a single massless Dirac fermion is manifested as a half-quantized Hall response once the required parity-breaking regularization is supplied. We study the corresponding response for two-dimensional chiral Lifshitz fermions. For a node with low-energy coupling (qx +iqy)^N, the Fermi-loop winding number W = N gives an anomalous Hall response {\\sigma}xy^anom = (W/2)e^2/h. We examine this mechanism in chiral multilayer Haldane models tuned to a valley-selective critical line, where a single gapless chiral Lifshitz fermion remains at the K valley. For the AB, ABC, and ABCA stacks, the projected pseudospin textures give W = 2, 3, 4, while Kubo calculations yield {\\sigma}xy = (1, 3/2, 2)e^2/h; integrated equilibrium boundary currents reproduce the same W/2 sequence. Six-terminal simulations with dephasing further show that the Hall conductivity is quantized at W/2 while the longitudinal conductivity remains finite. These results identify gapless chiral Lifshitz fermions as a higher-order, winding-controlled generalization of the parity-anomalous Hall response, distinct from a quantum anomalous Hall insulating state even when W/2 is an integer.", "url": "https://arxiv.org/abs/2610.13017", "type": "理论+数值", "summary": "1. 该工作研究二维手性 Lifshitz 费米子的宇称反常霍尔响应，并在手性多层 Haldane 模型中调至谷选择性临界线，使 K 谷仅剩一个无能隙手性 Lifshitz 节点。\n2. 其卖点在于证明低能耦合 (qx+iqy)^N 的费米环缠绕数 W=N 给出 σxy^anom=(W/2)e^2/h，且 AB、ABC、ABCA 堆叠的投影赝自旋织构对应 W=2,3,4，Kubo 计算得到 σxy=(1,3/2,2)e^2/h，边界平衡电流与含退相六端模拟复现 W/2 量子化而纵向电导有限。\n3. 这把手性 Lifshitz 费米子确立为宇称反常霍尔响应的高阶、缠绕数控制推广，即使 W/2 为整数也不同于量子反常霍尔绝缘态，并为多层拓扑材料中无能隙节点的输运识别提供启发。", "summary_source": "deepseek", "authors": [{"name": "Yanmiao Han"}, {"name": "Rundong Zhao"}, {"name": "Yu-Hao Wan"}], "featured_authors": [{"name": "Yanmiao Han"}, {"name": "Rundong Zhao"}, {"name": "Yu-Hao Wan"}], "author_count": 3}, {"id": "2610.13169", "category": "cond-mat", "title": "Imbibition dynamics under dissolution-driven fluid thickening", "abstract": "The imbibition of milk into a biscuit provides an example of a broader class of processes in which a liquid invades a porous material, dissolving components of the solid and thereby modifying its own rheology. This coupling between imbibition, dissolution, and evolving fluid rheology also occurs in food processing, filtration, and reactive porous media. While the resulting changes in fluid viscosity are known to affect imbibition, a quantitative description of how this evolving rheology determines the imbibition dynamics is still lacking. Here, we establish such a description for dissolution-driven fluid thickening. For a capillary tube in the well-mixed limit, we derive a generalized Washburn law showing that the evolving viscosity can be incorporated through a rescaled time given by the accumulated inverse viscosity. This predicts a collapse of the imbibition dynamics for different dissolution rates, which we confirm numerically using coupled free-surface and solute-transport simulations. When diffusion is slower, concentration and viscosity become spatially heterogeneous, resulting in a weaker retardation of the advancing liquid than predicted by the well-mixed theory. We then consider disordered porous media and quantify how dissolution-driven thickening and variations in pore geometry affect the dynamics. Our results extend the classical Washburn description to imbibition with evolving fluid properties and provide a quantitative basis for understanding fluid uptake when interactions with the solid progressively modify the rheology of the invading liquid.", "url": "https://arxiv.org/abs/2610.13169", "type": "理论+数值", "summary": "1. 该工作针对液体吸入多孔介质时溶解固体并导致自身增稠的耦合过程，建立了定量描述，涵盖毛细管与无序多孔介质中的吸入动力学。\n2. 其核心是在充分混合极限下导出广义沃什伯恩定律，用累积逆黏度定义的重标度时间统一不同溶解速率，并预测吸入曲线坍缩；数值耦合自由表面与溶质输运证实该标度，同时表明慢扩散下浓度与黏度空间非均匀会使推进阻力弱于混合理论，多孔介质中孔道几何涨落进一步调制该效应。\n3. 该结果将经典沃什伯恩图像推广到流体性质随固液相互作用演化的情形，为理解反应性多孔介质中液体吸收与流变反馈提供定量基础。", "summary_source": "deepseek", "authors": [{"name": "H. W. Almeida"}, {"name": "A. F. V. Matias"}, {"name": "R. C. V. Coelho"}, {"name": "N. A. M. Araujo"}], "featured_authors": [{"name": "H. W. Almeida"}, {"name": "A. F. V. Matias"}, {"name": "R. C. V. Coelho"}, {"name": "N. A. M. Araujo"}], "author_count": 4}, {"id": "2610.13251", "category": "cond-mat", "title": "Ultrafast laser-stimulated field emission from a metal: a non-equilibrium Green's functions approach", "abstract": "Ultrafast laser-assisted field emission from metallic nanotips is a promising route for generating coherent electron pulses. However, existing theoretical models often neglect many-body strong correlation effects in the emitter's electronic structure and its response to the optical field. In this work, we propose a theoretical framework based on the non-equilibrium Green's function formalism to simulate the out-of-equilibrium electron dynamics across a strongly driven matter-vacuum interface, in a one-dimensional model. Treating the tip-vacuum coupling perturbatively, we find that the interplay between strong-field emission and multi-photon emission regimes can be described in terms of a filtering of the emitter's local density of occupied states through field-dressed vacuum propagators. By including electron-electron interactions via the second-Born approximation, we show that correlation-induced modifications in the electronic structure are directly transferred to the far-field spectrum. Finally, by self-consistently solving the Dyson equation at the interface, we uncover a dynamic back-action regime driven by the optical field, characterized by a periodic polarization of the emitter, which reshapes the far-field spectrum. This shows that the non-equilibrium Green's functions approach provides a versatile framework for exploring and analyzing field emission of correlated electrons.", "url": "https://arxiv.org/abs/2610.13251", "type": "理论", "summary": "1. 该工作提出基于非平衡格林函数形式的一维理论框架，模拟金属纳米尖端在超快激光驱动下跨越金属-真空界面的非平衡电子动力学与场发射。\n2. 其核心在于以微扰方式处理尖端-真空耦合，将强场发射与多光子发射的竞争归结为占据态局域态密度经场缀饰真空传播子的滤波，并用第二玻恩近似表明电子关联会直接修正远场谱。\n3. 通过自洽求解界面戴森方程，作者发现光场驱动的动态背作用与发射体周期性极化会重塑远场谱，这为关联电子场发射的定量研究提供了可推广框架。", "summary_source": "deepseek", "authors": [{"name": "Luciano Jacopo D'Onofrio"}, {"name": "Adolfo Avella"}, {"name": "Martin Eckstein"}], "featured_authors": [{"name": "Luciano Jacopo D'Onofrio"}, {"name": "Adolfo Avella"}, {"name": "Martin Eckstein"}], "author_count": 3}, {"id": "2610.13400", "category": "cond-mat", "title": "Quantitative Eshelby stability: local and finite-shape theory through AI-assisted mechanics", "abstract": "How can human researchers use artificial intelligence (AI) to make progress on difficult mechanics problems while retaining control of physical significance, mathematical rigor, and validation? We explore this opportunity through a quantitative stability problem rooted in the Eshelby conjecture. For a uniform dilatational eigenstrain in a homogeneous isotropic solid, we establish a nonlinear two-sided relation between whole-interior strain heterogeneity and a geometry-only distance from the ellipsoid family, with half-order Sobolev scaling that captures morphological length scale. We then develop a complementary finite-shape theory: ellipsoidal subtraction yields an exact residual-field budget from which systematically convergent upper and lower bounds are obtained for a prescribed geometry. Applied to protruded, indented, and necked inclusions, the bounds agree with independent displacement-based finite-element calculations. The study also documents a human-led, AI-assisted research process in which researchers select consequential problems, shape targets, audit arguments, require independent checks, and interpret mechanics, while AI broadens analytical exploration and supports computation. This experience also led us to develop Open Problems in Mechanics, a versioned community-facing map that makes selected mechanics questions, their known/open boundaries, and criteria for progress explicit.", "url": "https://arxiv.org/abs/2610.13400", "type": "理论+数值", "summary": "1. 该工作以人工智能辅助力学为手段，研究源自Eshelby猜想的定量稳定性问题，在均匀各向同性固体中考察均匀膨胀本征应变，建立整体内部应变非均匀性与到椭球族纯几何距离之间的非线性双侧关系，并发展有限形状理论以给出系统收敛的上下界。\n2. 其核心卖点在于揭示该距离对形态长度尺度的半阶Sobolev标度，且通过椭球减除得到精确残余场预算，从而对凸出、凹陷和颈缩夹杂给出与位移型有限元独立吻合的严格界限，同时示范人类主导问题选择、论证审计与独立校验下的AI辅助分析流程。\n3. 这为Eshelby型稳定性、非椭球夹杂的定量刻画及人机协作力学研究提供了可验证框架，并启发以Open Problems in Mechanics等版本化地图明确开放问题边界与进展判据。", "summary_source": "deepseek", "authors": [{"name": "Bo Ni"}], "featured_authors": [{"name": "Bo Ni"}], "author_count": 1}, {"id": "2610.13401", "category": "cond-mat", "title": "Temperature evolution of spin dynamics in extended Kitaev models within an Abrikosov fermion theory beyond mean field", "abstract": "The $S=1/2$ Kitaev model provides an exactly solvable setting in which spin fractionalization produces itinerant Majorana fermions coupled to an emergent $\\mathbb{Z}_2$ gauge field. In realistic Kitaev magnets, however, non-Kitaev interactions break integrability and make their finite-temperature dynamics difficult to calculate. We develop a finite-temperature parton mean-field theory based on the Abrikosov-fermion representation and incorporate the effects of exchange interactions through the random phase approximation to calculate the dynamical spin structure factor. For the pure Kitaev model, the method reproduces a strong, nearly dispersionless peak at a finite low energy together with a broad continuum at higher energies. It also reproduces the momentum dependence of the dynamical spin structure factor and its temperature evolution, including the downward shift of the low-energy spectral weight, in qualitative agreement with continuous-time quantum Monte Carlo calculations. Within the present theory, the contraction of the continuum is traced to the temperature-induced reduction of the bond amplitudes, which narrows the parton bands and compresses the two-parton phase space. For ferromagnetic Kitaev coupling, the energy of the low-energy peak is minimized at the $\\Gamma$ point for a ferromagnetic Heisenberg interaction and maximized there for an antiferromagnetic interaction. In the ferromagnetic Kitaev-$\\Gamma$ model, the static response develops a finite-momentum softening, indicating an instability toward the period-three magnetic order reported in numerical studies. For uniform-ferromagnetic states selected by a $[111]$ magnetic field, we find that a broad parton continuum coexists with magnonlike dispersive structures, producing spectral features consistent with a spinon-to-magnon crossover.", "url": "https://arxiv.org/abs/2610.13401", "type": "理论+数值", "summary": "1. 该工作提出有限温阿布里科索夫费米子部分子平均场理论，结合随机相近似，计算扩展基塔耶夫模型的自旋动力学结构因子及温度演化。\n2. 其卖点在于纯基塔耶夫极限重现低能近无色散峰与高能连续谱，并定性符合连续时间量子蒙特卡洛的动量依赖和低能谱权下移；连续谱收缩源于温度诱导键幅减小、压窄部分子能带、压缩两粒子相空间。\n3. 该理论进一步揭示海森堡与Γ项可移动低能峰、诱发有限动量软化并指向周期三磁序，且[111]场下部分子连续谱与磁振子色散共存，暗示自旋子到磁振子交叉。", "summary_source": "deepseek", "authors": [{"name": "Daiki Sasamoto"}, {"name": "Joji Nasu"}], "featured_authors": [{"name": "Daiki Sasamoto"}, {"name": "Joji Nasu"}], "author_count": 2}, {"id": "2610.13410", "category": "cond-mat", "title": "The Stone-Wales trefoil: a new topological defect in graphene", "abstract": "Specific heat of graphite at high temperatures demonstrates significant deviation from the ``3R'' Dulong-Petite law. It can be explained by accumulation of defects with formation energy as low as 1.45 eV. Based on the density functional theory calculations, we propose a possible candidate of topological defects, whose energy is comparable to the growth activation energy.", "url": "https://arxiv.org/abs/2610.13410", "type": "理论+数值", "summary": "1. 该工作为解释高温下石墨比热显著偏离3R Dulong-Petit定律，基于密度泛函理论计算提出一种新的拓扑缺陷候选——Stone-Wales三叶结，并指出低至1.45 eV的形成能缺陷累积可导致该比热异常。\n2. 其物理卖点在于该拓扑缺陷的形成能与石墨生长激活能相当，意味着它可能在高温制备或退火过程中大量生成，从而将宏观比热偏差与微观拓扑缺陷结构直接关联。\n3. 这提示石墨烯和石墨中可能存在此前未识别的低能拓扑缺陷，后续可通过比热测量、生长动力学或原子级成像检验其存在并评估其对热力学性质的影响。", "summary_source": "deepseek", "authors": [{"name": "M.V. Kondrin"}, {"name": "Y.B. Lebed"}, {"name": "V.V. Brazhkin"}], "featured_authors": [{"name": "M.V. Kondrin"}, {"name": "Y.B. Lebed"}, {"name": "V.V. Brazhkin"}], "author_count": 3}, {"id": "2610.13418", "category": "cond-mat", "title": "VN-GraphGG: von Neumann--Mullins--based graph grain growth simulation", "abstract": "Efficient simulations of grain growth are essential for investigating the process-structure-property relationships in polycrystalline materials. We introduce a two-dimensional von Neumann-Mullins-based graph grain growth simulation (VN-GraphGG), which couples the grain-scale kinetics with microstructure reconstruction. The polycrystalline microstructure is represented as a graph with grain and junction nodes. The grain-area evolution on the grain graph is governed by the von Neumann--Mullins (VN) law, while a graph neural network is trained to reconstruct the microstructure from the graph. This separation allows kinetic coefficients to be varied without retraining the neural reconstruction model. Topological changes during grain growth such as disappearance of grains and changes in neighbor relations are handled straightforwardly through reconstruction and postprocessing. Simulations demonstrate accurate predictions of VN kinetics and coarsening statistics, and significant speedup over the phase-field simulations. The proposed method provides a foundation for efficient grain growth simulation based on grain-scale kinetics, opening the way to incorporate a broader range of physical mechanisms. An application example is presented for abnormal grain growth, in which kinetic heterogeneity significantly influences the grain microstructure evolution.", "url": "https://arxiv.org/abs/2610.13418", "type": "理论+数值", "summary": "1. 该工作提出二维 VN-GraphGG，将晶粒尺度动力学与微结构重构耦合，用于模拟多晶材料晶粒生长。\n2. 其以晶粒和结点节点的图表示微结构，晶粒面积按 VN 定律演化，图神经网络从图重构微结构，从而解耦动力学与重构并简化拓扑变化处理。\n3. 模拟验证了 VN 动力学与粗化统计，较相场法显著加速，为纳入更多物理机制及研究异常晶粒生长提供基础。", "summary_source": "deepseek", "authors": [{"name": "Yuntong Huang"}, {"name": "Zhihao Li"}, {"name": "Shuyang Dai"}, {"name": "Chang Ma"}, {"name": "Yang Xiang"}], "featured_authors": [{"name": "Yuntong Huang"}, {"name": "Zhihao Li"}, {"name": "Shuyang Dai"}, {"name": "Chang Ma"}, {"name": "Yang Xiang"}], "author_count": 5}, {"id": "2610.13420", "category": "cond-mat", "title": "Predicting Nanofabrication Variance: A Conditional Diffusion Model", "abstract": "Micro- and nanostructures fabricated by focused ion beam (FIB) milling invariably deviate from input designs due to systematic and stochastic effects such as ablation-rate fluctuations, and redeposition. As such, nominally identical iterations of a given process yield a distribution of non-identical fabrication outcomes, leading to variations in the physical (optical, mechanical) properties of fabricated structures. Existing models of the milling process typically predict a single deterministic fabrication result, neglecting this variability. Here we present a conditional diffusion model that learns the statistical distribution of process outcomes conditioned on input design, enabling it to predict a realistic distribution of possible output sample structures. These predictions accurately reproduce edge morphology, linewidth variations, and defect probabilities observed in fabricated samples, enabling statistical analysis of milling performance and the identification of dominant structural and process parameter-dependent deformation modes. The work establishes a probabilistic modelling framework for fabrication variability analysis and fabrication-aware design optimization.", "url": "https://arxiv.org/abs/2610.13420", "type": "理论+数值", "summary": "1. 该工作提出一种条件扩散模型，学习聚焦离子束刻蚀过程在给定输入设计下的结果统计分布，从而预测可能的输出结构分布，而非单一确定性形貌。\n2. 其核心卖点在于预测能定量复现制备样品的边缘形貌、线宽波动与缺陷概率，并可据此开展刻蚀性能统计分析、识别主导的结构与工艺参数相关形变模式。\n3. 该工作确立了面向制造变异性的概率建模框架，为制造感知的设计优化与工艺不确定性量化提供了可推广的思路。", "summary_source": "deepseek", "authors": [{"name": "Wenhan Zhang"}, {"name": "Ben Mills"}, {"name": "Oleksandr Buchnev"}, {"name": "Kevin F. MacDonald"}], "featured_authors": [{"name": "Wenhan Zhang"}, {"name": "Ben Mills"}, {"name": "Oleksandr Buchnev"}, {"name": "Kevin F. MacDonald"}], "author_count": 4}, {"id": "2610.13505", "category": "cond-mat", "title": "Graph-theoretic framework for semi-Markov networks: transient and stationary occupation probabilities, hitting times and weak ergodicity breaking", "abstract": "Semi-Markov networks provide a natural framework for describing stochastic transitions between coarse-grained states with non-exponential dwell times, with applications ranging from biophysics and neuroscience to epidemiology and finance. Here, it is shown that finite semi-Markov networks admit explicit combinatorial representations of their Laplace-transformed occupation probabilities and hitting-time distributions as sums over weighted spanning trees and forests of an augmented graph. These representations yield asymptotic results, including a generalization of the Markov Chain Tree Theorem to semi-Markov networks, in which the rate constants replaced by pseudo-rates given by the inverse mean sojourn time weighted by the exit probability through this channel, as well as the long-time scaling of hitting-time survival probabilities in the presence of infinite-mean sojourn times. They also extend recently derived combinatorial formulas for hitting-time moments to the semi-Markov setting. In particular, the mean hitting-time formula coincides with that of a Markov network with the corresponding pseudo-rates, which also yields a short proof of the constancy of Kemeny's constant for finite-mean semi-Markov networks. Finally, we use the same framework to show that weak ergodicity breaking occurs generically for time-additive state observables that are nonconstant on the support of the limiting distribution in heavy-tailed semi-Markov networks.", "url": "https://arxiv.org/abs/2610.13505", "type": "理论", "summary": "1. 该工作围绕《Graph-theoretic framework for semi-Markov networks: transient and stationary occupation probabilities, hitting times and weak ergodicity breaking》对应的问题给出了新的分析、建模或计算结果。\n2. 其卖点在于把核心物理图像、技术路线或数值证据压缩为可直接比较的结论。\n3. 这为相关体系的后续理论推演、算法验证或实验设计提供了可参考的出发点。", "summary_source": "translation-fallback", "authors": [{"name": "Julian Voits"}], "featured_authors": [{"name": "Julian Voits"}], "author_count": 1}, {"id": "2610.13519", "category": "cond-mat", "title": "Latin squares as a model of perfect mixing of high-entropy alloys", "abstract": "The structure of high-entropy alloys, which include 5 or more components in equimolar proportions, is proposed to be described in the mathematical language of Latin squares. This model is fundamentally discrete and allows for a quantitative description of ideal mixing, in which any given alloy element is guaranteed not to have an identical element as its nearest neighbor. For the two-dimensional case, the model possesses four axes of translational symmetry, which makes it possible to tile the plane with a single Latin square and, based on the properties of this square, describe the properties of macroscopic material samples. The model makes it possible to make quantitative estimates of the suitability of a particular atomic structure (configuration) for implementation in a perfectly mixed high-entropy alloy with maximum mixing entropy. A condition has been obtained for acceptable fluctuations in the concentration of components at which the thermodynamic stability of the alloy is maintained. The possibility of identifying superstructures in high-entropy alloys based on group theory, as applied to the description and construction of Latin squares, is discussed. Based on the proposed model, the probability of forming a multicomponent alloy with ideal mixing is estimated. For a five-component alloy, this probability is no more than 2.6*10^{-10}.", "url": "https://arxiv.org/abs/2610.13519", "type": "理论", "summary": "1. 该文提出用拉丁方描述五元以上等原子比高熵合金，建立理想混合的离散模型并给出定量判据。\n2. 其卖点是以拉丁方离散约束最近邻异类元素，二维可用单个拉丁方铺砌，并获得最大混合熵构型判据与浓度涨落稳定条件。\n3. 该框架结合群论有望识别超结构，并给出五元合金理想混合概率上限2.6×10⁻¹⁰，凸显完美混合的苛刻性。", "summary_source": "deepseek", "authors": [{"name": "P.S. Grinchuk"}], "featured_authors": [{"name": "P.S. Grinchuk"}], "author_count": 1}, {"id": "2610.13523", "category": "cond-mat", "title": "How Fluctuations Control Chiral Symmetry Breaking in Reacting Mixtures of Chiral Molecules", "abstract": "The pronounced chiral asymmetry of biomolecules is a defining feature of living systems, yet the mechanisms by which such asymmetry emerged remain unresolved. Chiral symmetry breaking may have occurred under prebiotic conditions in systems with sufficiently small molecular populations for intrinsic fluctuations to play an important role. Here, we investigate how finite-population fluctuations affect chiral-state selection, the characteristic time for symmetry breaking, and stochastic switching between chiral states in a system driven by autocatalysis and mutual antagonism. We determine how these dynamical processes scale with particle number and derive an analytical expression for the probability of selecting either chiral state as a function of the initial enantiomeric bias. We further calculate the mean selection time for different initial biases and show that, for weak mutual antagonism, fluctuations can induce transitions between opposite chiral states. These results characterize how finite-population fluctuations control both the emergence and stability of molecular chirality in autocatalytic chemical systems.", "url": "https://arxiv.org/abs/2610.13523", "type": "理论+数值", "summary": "1. 该工作研究自催化与相互拮抗驱动的手性分子反应混合体系，考察有限粒子数涨落如何影响手性态选择、对称破缺特征时间以及手性态间的随机切换。\n2. 核心贡献在于给出选择任一手性态的概率随初始对映体偏置变化的解析表达式，并推导平均选择时间及弱相互拮抗下涨落诱导相反手性态跃迁的粒子数标度。\n3. 这表明预生物小分子群体中的内禀涨落可同时支配分子手性的出现与稳定性，为自催化化学体系的手性起源提供可检验的随机动力学启示。", "summary_source": "deepseek", "authors": [{"name": "Leonardo Silva-Dias"}, {"name": "Christoph A. Weber"}], "featured_authors": [{"name": "Leonardo Silva-Dias"}, {"name": "Christoph A. Weber"}], "author_count": 2}, {"id": "2610.13542", "category": "cond-mat", "title": "Giant geometric nonlinear transport in inhomogeneously strained Bi$_2$Se$_3$ single crystalline slabs", "abstract": "Electrical transport in non-centrosymmetric materials exhibits a nonlinear conductivity tensor component that generates second-harmonic voltages in response to applied electric fields. Harnessing this effect is essential for developing zero-threshold electromagnetic energy harvesters and broadband frequency upconverters, both of which require maximizing the nonlinear responsivity. Here, we demonstrate that inhomogeneously strained macroscopic slabs of the topological insulator Bi$_2$Se$_3$ achieve a record-high nonlinear responsivity of $10^4\\,\\mu$m/V: a six orders of magnitude boost compared to its thin-film counterparts. We attribute this giant enhancement to a classical geometric nonlinear transport effect, which is driven by complex strain gradients within the bulk material. Notably, a similar geometric mechanism known as geometric nonlinear Hall was previously observed only in microscale-patterned structures. Our findings establish macroscopic strain engineering as a powerful route to enhance nonlinear transport, with immediate relevance to a broad class of layered systems, including transition metal dichalcogenides and moiré heterostructures.", "url": "https://arxiv.org/abs/2610.13542", "type": "理论", "summary": "1. 该工作在非均匀应变的拓扑绝缘体Bi₂Se₃宏观单晶薄片中实现了高达10⁴ μm/V的非线性响应度，较薄膜体系提升六个数量级。\n2. 其核心卖点是将该增强归因于体内复杂应变梯度驱动的经典几何非线性输运效应，并把此前仅在微纳图案化结构中观察到的几何非线性霍尔机制拓展到宏观体系。\n3. 这表明宏观应变工程可有效增强非线性输运，并为过渡金属硫族化合物与莫尔异质结构等层状体系的零阈值电磁能量收集和宽带频率上转换提供可行路径。", "summary_source": "deepseek", "authors": [{"name": "Igor Veremchuk"}, {"name": "Pavlo Makushko"}, {"name": "Anita Guarino"}, {"name": "Muhammad Waqee Ur Rehman"}, {"name": "Rosalba Tatiana Fittipaldi"}, {"name": "Tobias Kosub"}, {"name": "Alexej Pashkin"}, {"name": "Fabian Ganss"}, {"name": "Oleg A. Petrenko"}, {"name": "Proloy T. Das"}, {"name": "Rui Xu"}, {"name": "Rhonald Burgos Atencia"}, {"name": "Debottam Mandal"}, {"name": "Antonio Vecchione"}, {"name": "Carmine Ortix"}, {"name": "Denys Makarov"}], "featured_authors": [{"name": "Igor Veremchuk"}, {"name": "Pavlo Makushko"}, {"name": "Anita Guarino"}, {"name": "Antonio Vecchione"}, {"name": "Carmine Ortix"}, {"name": "Denys Makarov"}], "author_count": 16}, {"id": "2610.13584", "category": "cond-mat", "title": "Altermagnetic Control of Charge-4e Superconductivity", "abstract": "We present, to our knowledge, the first theoretical realization of an independent charge-4e phase in a two-dimensional classical array of conventional superconductors coupled through altermagnetic junctions. Tuning the altermagnetic splitting suppresses the leading single-pair tunneling harmonic while retaining strong double-pair coupling, producing a finite charge-4e region between staggered and uniform charge-2e states. Using the complete temperature-dependent microscopic Josephson spectrum, we find short-range ordinary pair correlations alongside algebraic coherence of pairs of Cooper pairs. Berezinskii--Kosterlitz--Thouless scaling and a half-flux response further identify the charge-4e phase. Our results establish altermagnetism as a microscopic means to select between ordinary and composite superconducting coherence.", "url": "https://arxiv.org/abs/2610.13584", "type": "理论", "summary": "1. 该工作围绕《Altermagnetic Control of Charge-4e Superconductivity》对应的问题给出了新的分析、建模或计算结果。\n2. 其卖点在于把核心物理图像、技术路线或数值证据压缩为可直接比较的结论。\n3. 这为相关体系的后续理论推演、算法验证或实验设计提供了可参考的出发点。", "summary_source": "translation-fallback", "authors": [{"name": "Yan-Guang Yue"}, {"name": "Jie Lou"}, {"name": "Yan Chen"}], "featured_authors": [{"name": "Yan-Guang Yue"}, {"name": "Jie Lou"}, {"name": "Yan Chen"}], "author_count": 3}, {"id": "2610.13619", "category": "cond-mat", "title": "Ferroelectric Domain-Wall Motion, Stability, and Frequency Responses under Different Screening-Charge Conservation Laws", "abstract": "We analyze ferroelectric domain wall motion, shape, and internal structure arising from coupling between polarization and screening charge. Universal cases are organized by electrical boundary conditions, charge conservation and dynamics, and polarization free energy. We consider exposed surfaces, interfaces beneath a dielectric layer and top electrode, and interfaces with a blocking mixed ionic-electronic conductor. Screening occurs through local exchange, exchange with lateral transport, or strictly conserved redistribution. Analytical derivations and finite-depth calculations establish screening drag, velocity branches, and conditions for spatial instability. For an isolated wall joining differently compensated domains, strict surface conservation and zero far-field current exclude steady translation of the screening profile, while allowing transient displacement, finite-sample arrest, and charge-balanced structural changes. Conservation also constrains long-distance transport around a moving junction in an adjoining conductor. Large-field simulations in the top-electrode geometry reveal nonlinear corrugation, transfer toward longer wavelengths, and coupled polarization rotation. First-order polarization energetics allow two interphase fronts enclosing a paraelectric core; multiaxial polarization permits wall rotation and competing intermediate ferroelectric domains. A driven structural-screening reduction supports stable periodic behavior. Reduced-variable diagrams summarize motion and structural regimes, while BaTiO3 and BiFeO3 examples connect them to material thermodynamics. Small-signal analysis distinguishes displacement, polarization, and electrostatic response functions. These results provide a framework for wall dynamics and structural transitions under different driving and screening conditions.", "url": "https://arxiv.org/abs/2610.13619", "type": "理论+数值", "summary": "1. 该工作按电学边界条件、电荷守恒与动力学及极化自由能分类，分析极化与屏蔽电荷耦合下的铁电畴壁运动、形状与内部结构。\n2. 其物理卖点是给出屏蔽拖曳、速度分支与空间失稳判据，并证明严格表面守恒与零远场电流排除屏蔽剖面的稳态平移。\n3. 这为不同驱动与屏蔽条件下的畴壁动力学和结构转变提供统一框架，并以BaTiO3、BiFeO3实例及小幅响应连接材料热力学与实验。", "summary_source": "deepseek", "authors": [{"name": "Sergei V. Kalinin"}], "featured_authors": [{"name": "Sergei V. Kalinin"}], "author_count": 1}, {"id": "2610.13666", "category": "cond-mat", "title": "A new approach to the Kondo effect: sophomore's dream function and Lee-Yang zeros", "abstract": "We develop an analytical approach to the Kondo problem based on an effective partition function that generalizes the sophomore's dream integral. The Kondo crossover is represented as a passage through an approximately equidistant ladder of its Lee-Yang zeros in the complex plane, rather than as a singularity on the real axis. Summation over this ladder yields the Gamma function $\\Gamma(\\alpha + T_K/(2 \\pi T))$ as the universal crossover backbone, where the offset $\\alpha =1/2$ is fixed by the Friedel sum rule. The Euler-Maclaurin expansion connects the discrete zero structure to the Nozieres Fermi-liquid theory through Bernoulli numbers. A two-cutoff formula provides a compact, essentially one-parameter description of the full crossover in terms of a temperature-space Fano lineshape which is a thermal average of the energy-space Fano resonance observed in STM. Drift corrections are treated. The approach extends to $\\mathrm{SU}(N)$ Coqblin-Schrieffer, underscreened and Anderson impurity models, and Kondo lattices.", "url": "https://arxiv.org/abs/2610.13666", "type": "理论", "summary": "1. 该工作围绕《A new approach to the Kondo effect: sophomore's dream function and Lee-Yang zeros》对应的问题给出了新的分析、建模或计算结果。\n2. 其卖点在于把核心物理图像、技术路线或数值证据压缩为可直接比较的结论。\n3. 这为相关体系的后续理论推演、算法验证或实验设计提供了可参考的出发点。", "summary_source": "translation-fallback", "authors": [{"name": "V. Yu. Irkhin"}], "featured_authors": [{"name": "V. Yu. Irkhin"}], "author_count": 1}, {"id": "2610.13729", "category": "cond-mat", "title": "Shear-driven arrest of dip-coating film entrainment", "abstract": "A plate withdrawn from a bath of partially wetting liquid entrains a film above a critical velocity. Here, we show that this critical threshold can be substantially increased by the presence of a laminar gas flow opposed to the plate velocity that exerts a tangential shear stress on the liquid-gas interface. Using two-phase immiscible Navier-Stokes simulations and confining the gas to a narrow channel, we derive a closed-form expression for the interfacial stress, which combined with lubrication theory relates the thickness of the film and the contact line velocity to the applied shear stress. As the gas velocity is increased, the film thins and the contact line velocity slows down, until the imposed shear overcomes the drag of the moving plate and entrainment is arrested. As in the quiescent case, the velocity mismatch between plate and contact line is independent of the plate velocity and is set by the applied shear alone. We find that one set of varying gas flow simulations, with constant critical plate velocity, therefore determines the critical gas flow for every smaller plate velocity.", "url": "https://arxiv.org/abs/2610.13729", "type": "理论+数值", "summary": "1. 该工作结合两相不可混溶流体模拟与润滑理论，研究反向层流气体的切向剪切如何提高部分润湿基板浸涂夹带的临界速度。\n2. 其核心是导出界面剪切应力的闭式表达式并结合润滑理论，将膜厚和接触线速度同外加剪切关联：气流增大使膜变薄、接触线减速，直至剪切克服运动板拖曳而终止夹带，且速度失配与板速无关、仅由剪切设定。\n3. 由此，固定临界板速的一组变气流量模拟即可确定所有较慢提拉速度下的临界气流，为以剪切调控浸涂成膜与接触线动力学提供可操作判据。", "summary_source": "deepseek", "authors": [{"name": "Theo Witkamp"}, {"name": "Stéphane Zaleski"}, {"name": "Federico Toschi"}], "featured_authors": [{"name": "Theo Witkamp"}, {"name": "Stéphane Zaleski"}, {"name": "Federico Toschi"}], "author_count": 3}, {"id": "2610.13748", "category": "cond-mat", "title": "Arrested phase separation and amorphous patterns in charged binary fluids", "abstract": "Frustration generated by competing interactions can stabilise patterns with tunable lengthscales which evade indefinite coarsening and macroscopic phase separation. Here we investigate a charged binary fluid in which the tendency toward phase separation is opposed by screened electrostatic repulsion. Combining analytics and numerical simulations, we identify a regime of arrested phase separation characterised by finite-wavelength instability. The resulting states include droplet and labyrinthine phases in two dimensions, and droplets, concentric shells and tubular structures in three dimensions. Surprisingly, some of these structures are amorphous morphologies that emerge reproducibly from different initial conditions. Free-energy estimates suggest that these disordered structures may be thermodynamically stabilised by frustration, rather than being kinetically trapped. Our results identify a simple mechanism through which the competition between phase separation and screened electrostatics can generate equilibrium amorphous microphases with glassy features.", "url": "https://arxiv.org/abs/2610.13748", "type": "数值", "summary": "1. 该工作结合解析理论与数值模拟，考察带电二元流体中相分离趋势与屏蔽静电排斥之间的竞争，识别出有限波长不稳定性主导的受阻相分离区。\n2. 其卖点在于，阻挫通过有限波长不稳定性稳定化可调长度尺度的图案，避免无限粗化与宏观相分离，并在二维给出液滴与迷宫相、三维给出液滴、同心壳层与管状结构，部分非晶形貌可由不同初始条件重复生成。\n3. 自由能估计表明这些无序结构可能由阻挫实现热力学稳定化，而非单纯动力学俘获，揭示相分离与屏蔽静电竞争可生成具玻璃特征的平衡非晶微相。", "summary_source": "deepseek", "authors": [{"name": "Logan H. Grant"}, {"name": "Ana Bensabat"}, {"name": "Eva Pospivsilova"}, {"name": "Joost de Graaf"}, {"name": "Alexander Morozov"}, {"name": "Giuseppe Negro"}, {"name": "Ciprian G. Pruteanu"}, {"name": "Tyler N. Shendruk"}, {"name": "Davide Marenduzzo"}], "featured_authors": [{"name": "Logan H. Grant"}, {"name": "Ana Bensabat"}, {"name": "Eva Pospivsilova"}, {"name": "Ciprian G. Pruteanu"}, {"name": "Tyler N. Shendruk"}, {"name": "Davide Marenduzzo"}], "author_count": 9}, {"id": "2610.13782", "category": "cond-mat", "title": "Scalene Yang-Baxter triples realize all nearest-neighbour Hamiltonians with global additive symmetries", "abstract": "We establish that bond Hamiltonian densities, up to local difference terms whose sum vanishes under periodic boundary conditions, lying in the commutant of bond operators, $w_j\\pm w_{j+1}$, is a necessary and sufficient condition for a one-dimensional nearest-neighbour Hamiltonian to conserve a uniform or staggered sum of the one-site operators $w_j$. Starting from these local commutants, we show that every such Hamiltonian and its conserved charge can be obtained from monodromy matrices constructed using regular and non-regular members of scalene Yang-Baxter triples. The results hold on periodic chains of length $L\\geq3$, with even length required in the staggered case. The results do not require translation invariance, and hence the interaction on each bond can be chosen independently from the full corresponding commutant. Our representation-independent construction applies in arbitrary finite local dimension and exhausts the Hamiltonians with either prescribed additive symmetry, without requiring ordinary Yang-Baxter integrability. We illustrate the construction with spin-$\\tfrac12$ and spin-1 systems and discuss its relation to the double-commutant theorem. Classifying the one-site generators $w$ and their associated bond commutants provides a route to classifying such Hamiltonians with additive conserved charges.", "url": "https://arxiv.org/abs/2610.13782", "type": "理论", "summary": "1. 该工作证明了，一维最近邻哈密顿量守恒一体算符 w_j 的均匀或交错求和，当且仅当其键哈密顿密度在周期边界下模去求和为零的局域差分项后，属于键算符 w_j±w_{j+1} 的对易子代数。\n2. 其核心构造利用不等边 Yang-Baxter 三元组中正则与非正则成员给出的单值矩阵，得到所有此类哈密顿量及其守恒荷，无需平移不变性或通常 Yang-Baxter 可积性，并适用于任意有限局域维度。\n3. 该结果给出分类具有可加守恒荷的最近邻模型的途径，并与双对易子定理相联系，为自旋1/2、自旋1等系统构造和识别此类对称性保护的哈密顿量提供了启发。", "summary_source": "deepseek", "authors": [{"name": "Pramod Padmanabhan"}, {"name": "Somnath Maity"}, {"name": "Akash Sinha"}, {"name": "Vladimir Korepin"}], "featured_authors": [{"name": "Pramod Padmanabhan"}, {"name": "Somnath Maity"}, {"name": "Akash Sinha"}, {"name": "Vladimir Korepin"}], "author_count": 4}, {"id": "2610.13795", "category": "cond-mat", "title": "Improved screening of doped ZrO$_2$ catalysts for CO$_2$ hydrogenation from graph-based machine learning", "abstract": "Dopants can tune the activity of zirconia-based CO$_2$ hydrogenation catalysts through changes in adsorbate and transition-state (TS) energetics. Computing these quantities with density functional theory (DFT) becomes expensive when several dopants, reaction intermediates, and TSs must be screened. Here, we further develop the graph-based machine learning method Wasserstein Weisfeiler-Lehman Gaussian Process Regression (WWL-GPR): we introduce additional electronic-structure and local-environment features relevant for oxide surfaces and use the resulting model to predict adsorption and TS energies on ZrO$_2$(101) surfaces doped with Al$^{3+}$, Cd$^{2+}$, Ga$^{3+}$, In$^{3+}$, and Zn$^{2+}$. Adsorbate-surface structures are represented as attributed graphs that combine bonds connectivity and features. We benchmark WWL-GPR against thermodynamic scaling relations (TSR) for reaction intermediates and Bronsted-Evans-Polanyi relations (BEP) for TSs, and then propagate the predicted energies to microkinetic CH$_3$OH-yield estimates. WWL-GPR consistently improves the prediction of reaction intermediate energetics relative to linear scaling approaches and provides TS estimates that are competitive with BEP-based models. These improvements become especially relevant when the predicted energetics are propagated through the reaction network. Microkinetic calculations show that WWL-GPR-derived energies give CH$_3$OH yields closer to DFT-derived yields than the linear-relation workflow. Degree-of-rate-control analysis links the activity errors to dopant-dependent rate-controlling steps, including HCOO* formation, H$_2$COOH* dissociation, and H$_3$CO* formation. These results support WWL-GPR as a data-efficient surrogate for connecting atomistic energetics with catalyst-screening observables on doped oxide surfaces.", "url": "https://arxiv.org/abs/2610.13795", "type": "理论+数值", "summary": "1. 该工作进一步发展了基于图机器学习的 WWL-GPR 方法，并引入与氧化物表面相关的电子结构和局域环境特征，用于预测 Al、Cd、Ga、In、Zn 掺杂 ZrO2(101) 上 CO2 加氢中间体吸附能与过渡态能量。\n2. 其关键创新在于将吸附质-表面结构表示为融合键连接与属性的图，并以热力学标度关系和 Brønsted-Evans-Polanyi 关系为基准，证明其对中间体能量的预测稳定优于线性标度，过渡态估计可与 BEP 竞争。\n3. 将预测能量传播至微观动力学后，WWL-GPR 给出的 CH3OH 产率较线性关系流程更接近 DFT，且速率控制度分析将活性误差关联到 HCOO* 形成、H2COOH* 解离和 H3CO* 形成等掺杂依赖步骤，表明其可作为连接原子尺度能量与掺杂氧化物催化剂筛选指标的数据高效代理模型。", "summary_source": "deepseek", "authors": [{"name": "Karsten Walz Jensen"}, {"name": "Mie Andersen"}, {"name": "Raffaele Cheula"}], "featured_authors": [{"name": "Karsten Walz Jensen"}, {"name": "Mie Andersen"}, {"name": "Raffaele Cheula"}], "author_count": 3}, {"id": "2610.13842", "category": "cond-mat", "title": "Robust Golden Ratio universality as a consequence of a circulant symmetry", "abstract": "We find a robust scenario for the emergence of the Golden Ratio (GR) dynamical universality class, characterized by the dynamical exponent $z \\equiv \\varphi=\\frac{1}{2}(1+\\sqrt{5})$. Previously, its emergence required fine-tuning of system parameters. Here, the GR universality class appears generically in a wide class of Markov processes as a consequence of a global, circulant symmetry of the flux Jacobian. This symmetry leads to GR universality in systems where the total number of conservation laws is odd and larger than three. We introduce a multilane exclusion process with Bernoulli stationary measure as a minimal, parameter-free model, which features GR universality for all conserved modes, most of which are doubly degenerate. Our predictions, based on mode-coupling theory generalized to treat degenerate conserved modes, are corroborated by large-scale Monte Carlo simulations.", "url": "https://arxiv.org/abs/2610.13842", "type": "理论+数值", "summary": "1. 该工作提出了一类马尔可夫过程中稳健涌现黄金比例动力学普适类的机制：当总守恒律数为大于三的奇数时，通量雅可比矩阵的整体循环对称性可自然地导致动力学指数 z=φ=(1+√5)/2，而无需参数微调。\n2. 其技术卖点在于引入具有伯努利稳态的多车道排他过程作为无参数最小模型，并表明该循环对称性使所有守恒模式（多数为二重简并）均落入黄金比例普适类。\n3. 基于推广至简并守恒模式的模式耦合理论预言与大规模蒙特卡洛模拟一致，这暗示循环对称性和奇数个守恒律可为非平衡系统中稳健实现此类动力学普适类提供一般性判据。", "summary_source": "deepseek", "authors": [{"name": "Luka Paljk"}, {"name": "Johannes Schmidt"}, {"name": "Vladislav Popkov"}], "featured_authors": [{"name": "Luka Paljk"}, {"name": "Johannes Schmidt"}, {"name": "Vladislav Popkov"}], "author_count": 3}, {"id": "2610.13874", "category": "cond-mat", "title": "Potential energy release rate for solids with bounded domains during evolutions involving changes to boundaries and boundary data", "abstract": "We investigate the rate of change of equilibrium potential energy for nonlinear elastic solids undergoing evolutions that may involve changes in body geometry, material properties, applied tractions, and prescribed displacements. We represent such an evolution by a one-parameter family of variational problems and identify a class of these families for which the potential-energy release rate is well defined. Particular attention is given to the formulation of the potential energy at each evolution state: each constituent variational problem must yield the appropriate equilibrium state, while its equilibrium value must also correctly represent the physical change in potential energy between states. Within this framework, we derive a closed-form expression for the potential-energy release rate for solids with bounded domains, allowing for spatially nonuniform material evolution, sharp material interfaces, and evolving boundary geometry and prescribed boundary data. The expression is determined entirely by the equilibrium solution at the state under consideration and by the quantities prescribing the local evolution, so neighboring equilibrium problems need not be solved. Finally, we apply the result to the extension of a notch in a two-dimensional elastic body and show that the resulting potential-energy release rate reduces to the classical $J$-integral.", "url": "https://arxiv.org/abs/2610.13874", "type": "理论+数值", "summary": "1. 该工作研究非线性弹性固体在边界几何、材料性质、外载与指定位移随演化改变时，平衡势能的变化率，将演化表述为一参数族变分问题，并界定使势能释放率良定义的变分族类。\n2. 其核心是给出有界区域固体的势能释放率闭式表达式，允许空间非均匀材料演化、尖锐材料界面以及边界几何与边界数据演化，且仅由当前平衡解和局部演化量确定，无需再解相邻平衡问题。\n3. 该框架应用于二维弹性体缺口扩展时，所得释放率退化为经典 J 积分，表明其可为裂纹/缺口演化、构型力与边界/材料变化耦合问题提供严格且可计算的能量释放分析基础。", "summary_source": "deepseek", "authors": [{"name": "Mrityunjay Kothari"}, {"name": "Sayaka Kochiyama"}, {"name": "Haneesh Kesari"}], "featured_authors": [{"name": "Mrityunjay Kothari"}, {"name": "Sayaka Kochiyama"}, {"name": "Haneesh Kesari"}], "author_count": 3}, {"id": "2610.13885", "category": "cond-mat", "title": "Necessary conditions for benchmarking next-generation AI in materials discovery", "abstract": "Current AI predicts materials by speeding up energy minimisation and training on large databases. However, scaling data generation prevents manual analysis by domain experts. If novelty is evaluated by chemical compositions or traditional representations in Crystallographic Information Files, or standard structure matchers based on manually chosen thresholds, one can easily generate millions of ``new'' compositions or files without discovering truly novel materials. This paper uses a hierarchy of crystal invariants to continuously trace and quantify structural novelty based on the new mathematical definition of a crystal structure and asymptotic guarantees for invariant descriptors. The invariant-based analysis through cascade computations on a modest computer exposes the unexpected scale of duplication in the world's largest materials databases, shown here in the high-profile case of GNoME datasets. To prevent current ``embarrassment of over-prediction'', we propose necessary conditions for next-generation AI that should be automatically enforced before claiming any new materials.", "url": "https://arxiv.org/abs/2610.13885", "type": "理论+数值", "summary": "1. 该工作针对材料发现中人工智能预测的新颖性评估，提出以晶体不变量层级持续追踪并量化结构新颖性的判据，并系统检验了GNoME等最大材料数据库中的重复问题。\n2. 其核心卖点在于基于晶体结构的新数学定义与不变量描述子的渐近保证，用级联计算在普通计算机上揭示传统成分、晶体学信息文件表示或阈值结构匹配所掩盖的大规模重复，从而界定宣称新材料的必要条件。\n3. 这提示下一代材料人工智能须在宣称发现前自动执行可验证的新颖性条件，避免过预测，并为数据库基准、模型评价和实验筛选提供更严格的数学约束。", "summary_source": "deepseek", "authors": [{"name": "Daniel E Widdowson"}, {"name": "Tatiana V Kurlina"}, {"name": "Olga D Anosova"}, {"name": "Vitaliy A Kurlin"}], "featured_authors": [{"name": "Daniel E Widdowson"}, {"name": "Tatiana V Kurlina"}, {"name": "Olga D Anosova"}, {"name": "Vitaliy A Kurlin"}], "author_count": 4}, {"id": "2610.12547", "category": "hep-th", "title": "Lattice Monte Carlo of $λϕ^4$ on Euclidean de Sitter", "abstract": "We report the first Monte Carlo simulation of quantum field theory on Euclidean de Sitter space, $S^4$. Rather than discretizing space, we use a spectral lattice based on spherical harmonics, keeping all symmetries exact at finite cutoff. For a massless $\\lambda\\phi^4$ theory, the zero-mode distribution reproduces the Starobinsky-Yokoyama equilibrium at weak coupling, and deviations closely follow the one-loop renormalization of $\\lambda$. At strong bare coupling, the renormalized quartic coupling saturates near the ceiling of the one-loop renormalization-group flow. This saturation is the de Sitter counterpart of the triviality mechanism that bounds the Higgs mass in flat space. Our results confirm nonperturbatively that the infrared divergences of light scalars in de Sitter are correctly resummed by the stochastic formalism. More broadly, this work opens up de Sitter space to lattice Monte Carlo methods.", "url": "https://arxiv.org/abs/2610.12547", "type": "理论", "summary": "1. 该工作首次在欧氏德西特空间S^4上对量子场论开展蒙特卡洛模拟，采用球谐函数谱格点而非空间离散，以在有限截断下保持全部对称性。\n2. 针对无质量λφ^4理论，其零模分布在弱耦合下重现Starobinsky-Yokoyama平衡，偏离项符合λ的一圈重整化；强裸耦合时重整化四阶耦合饱和于单圈重整化群流的上限，成为平坦空间中限制希格斯质量的平凡性机制在德西特空间的对应。\n3. 结果非微扰地证实随机形式体系正确重求和了德西特空间中轻标量的红外发散，并更广泛地将德西特空间开放给格点蒙特卡洛方法。", "summary_source": "deepseek", "authors": [{"name": "Angelo Caravano"}], "featured_authors": [{"name": "Angelo Caravano"}], "author_count": 1}, {"id": "2610.12550", "category": "hep-th", "title": "Proving the OSV conjecture with the gravitational path integral", "abstract": "The OSV conjecture relates the helicity supertrace of black holes in $4d$ $\\mathcal{N}=2$ supergravity obtained through a Calabi--Yau compactification of Type IIA string theory to the modulus squared of the topological string partition function evaluated at the attractor point in moduli space for a given set of magnetic black hole charges and electric chemical potentials. We find Euclidean black ho
