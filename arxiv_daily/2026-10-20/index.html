yperelastic examples. We investigate kinematic and stress constraints, including applications to pentamode solids, and show that internally constrained constitutive relations are naturally formulated on equivalence classes of stresses modulo reactive stresses. We formulate the balance laws and thermodynamics covariantly and establish that covariance of the energy balance directly yields the balance of angular momentum in complementary Cauchy elasticity, unlike in conventional Cauchy elasticity. Finally, we linearize implicit, Cauchy, and complementary Cauchy elasticity about finitely deformed and prestressed configurations and show that nonlinear non-hyperelastic solids may possess hyperelastic linearized responses.", "url": "https://arxiv.org/abs/2610.25218", "type": "理论", "summary": "1. 该文建立了互补柯西弹性非线性理论，将右柯西-格林应变表述为第二皮奥拉-基尔霍夫应力的函数，不依赖本构可逆性或互补应变能，并推导协变平衡律、热力学与预应力构型线性化。\n2. 其核心是用互补应力功1-形式刻画互补超弹性的障碍，将应力功与互补应力功1-形式的同步闭合归于本构流形的拉格朗日结构，并借达布分类给出各向异性与各向同性固体的局部标准表示及非超弹性实例。\n3. 该框架还表明内部约束可在模去反作用应力的应力等价类上自然表述，协变能量平衡直接给出角动量平衡，且非线性非超弹性固体的线性化响应可为超弹性，为预应力与五模等约束固体提供启示。", "summary_source": "deepseek", "authors": [{"name": "Arash Yavari"}], "featured_authors": [{"name": "Arash Yavari"}], "author_count": 1}, {"id": "2610.25249", "category": "math-ph", "title": "Response theory at low temperature for weakly interacting quantum spin systems", "abstract": "Recent work by Greenblatt, Lange, Marcelli, and Porta (Commun. Math. Phys. 2024) provides the first rigorous justification of adiabatic theory for interacting quantum systems at positive temperature. Their analysis treats weakly interacting lattice fermions and combines a rigorous Wick rotation with fermionic cluster expansion techniques. Here, we study a class of weakly interacting quantum spin systems and derive response theory at positive temperature, thereby covering non-Fermi systems for the first time. Our proof identifies and exploits the locality property of local indistinguishability as a key ingredient in carrying out low-temperature adiabatic expansions. The fact that these systems satisfy local indistinguishability was recently established jointly with Adhikari ( arXiv:2508.15907 ) using cluster expansion methods together with a probabilistic swapping trick.", "url": "https://arxiv.org/abs/2610.25249", "type": "理论", "summary": "1. 该工作针对弱相互作用量子自旋系统建立了正温度下的响应理论，将此前仅适用于格点费米子的绝热理论严格推广至非费米体系。\n2. 其核心技术要点是识别并利用“局域不可区分性”这一局域性质，使低温绝热展开得以在自旋系统中严格实施。\n3. 该结果为非费米量子多体系统在有限温度下的绝热与线性响应分析提供了可推广的严格框架，并提示局域不可区分性可作为更广泛晶格模型的通用分析工具。", "summary_source": "deepseek", "authors": [{"name": "Joscha Henheik"}, {"name": "Marius Lemm"}, {"name": "Tom Wessel"}], "featured_authors": [{"name": "Joscha Henheik"}, {"name": "Marius Lemm"}, {"name": "Tom Wessel"}], "author_count": 3}, {"id": "2610.25262", "category": "math-ph", "title": "Upper Bound on the Correlation Energy of a Dense Fermi Gas in the Thermodynamic Limit", "abstract": "We prove that the random phase approximation provides an upper bound on the correlation energy of a three-dimensional, weakly interacting, Fermi gas in the thermodynamic limit at high density. More precisely, we consider a mean-field scaling regime where the kinetic and interaction Hamiltonian are scaled by $\\rho^{-2/3}$ and $\\rho^{-1}$, respectively. We use a correlated trial state constructed through a quasi-bosonic Bogoliubov transformation of collective particle--hole excitations associated to patches on the Fermi surface. Key of the proof is to control the position-space localization of the collective excitations. Combined with an iterated Duhamel expansion of the expectation values of (localized) particle number operators we obtain extensive estimates, which justify the reduction to an effective quadratic Hamiltonian and its approximate diagonalization.", "url": "https://arxiv.org/abs/2610.25262", "type": "理论", "summary": "1. 该工作在高密度热力学极限和动能、相互作用分别按 ρ^{-2/3}、ρ^{-1} 缩放的平均场标度下，严格证明三维弱相互作用费米气体的关联能可由随机相近似（RPA）给出上界。\n2. 其技术关键在于用费米面斑块上集体粒子—空穴激发的准玻色 Bogoliubov 变换构造关联试探态，并借位置空间局域性控制与局域粒子数算符的迭代 Duhamel 展开得到广延估计，严格约化到有效二次哈密顿量并近似对角化。\n3. 该上界为在高密度平均场标度下检验 RPA 关联能的变分精确性提供严格依据，并提示局域化集体激发与 Duhamel 展开可用于其他费米多体极限。", "summary_source": "deepseek", "authors": [{"name": "Niels Benedikter"}, {"name": "Sascha Lill"}, {"name": "Marcello Porta"}, {"name": "Benjamin Schlein"}], "featured_authors": [{"name": "Niels Benedikter"}, {"name": "Sascha Lill"}, {"name": "Marcello Porta"}, {"name": "Benjamin Schlein"}], "author_count": 4}, {"id": "2610.25280", "category": "math-ph", "title": "De Finetti Structures in Networks of Quantum Systems", "abstract": "Consider $N$ identical quantum systems at the vertices of a graph, interacting via pairwise edge couplings. We designate $K$ vertices as a system of interest $\\mathrm S$ and the remaining $N-K$ as a reservoir $\\mathrm R$. Under generic connectivity assumptions between $\\mathrm S$ and $\\mathrm R$, we show that for $N\\to\\infty$, the reduced state of $\\mathrm S$ converges to a convex combination of symmetric product states of $K$ single-vertex density matrices -- called a de Finetti representation. Unlike in standard derivations for symmetric (exchangeable) systems, we establish de Finetti representations for quantum networks, which are inherently non-exchangeable. We construct the representations explicitly and quantify the convergence rate. We show that Erdős--Rényi random graphs exhibit the de Finetti structure: as the reservoir grows, the reduced state of any fixed finite subgraph converges almost surely to an explicit deterministic product state. As applications, we establish a general area law for the entanglement entropy of $\\mathrm S$, analyze mean-field and fluctuation scalings of the $\\mathrm S$-$\\mathrm R$ interaction, and illustrate our results on qubit networks. We also derive quantitative convergence estimates for information-theoretic quantities, including von Neumann entropy, mutual information, and entanglement within $\\mathrm S$ and between $\\mathrm S$ and $\\mathrm R$.", "url": "https://arxiv.org/abs/2610.25280", "type": "理论", "summary": "1. 该工作研究图上成对耦合的N个全同量子系统，将K个顶点设为系统S、其余为环境R，证明在一般S-R连通性下N→∞时S的约化态收敛为K个单顶点密度矩阵对称积态的凸组合，即de Finetti表示。\n2. 其卖点是针对本质非可交换的量子网络显式构造该表示并量化收敛速率，且证明Erdős–Rényi随机图中任意固定有限子图的约化态几乎必然趋于显式确定性乘积态。\n3. 由此可导出S纠缠熵的通用面积律并刻画S-R相互作用的平均场与涨落标度，为量子网络信息度量收敛估计及量子比特平台分析提供可检验框架。", "summary_source": "deepseek", "authors": [{"name": "Gavin Hull"}, {"name": "Marco Merkli"}], "featured_authors": [{"name": "Gavin Hull"}, {"name": "Marco Merkli"}], "author_count": 2}, {"id": "2610.25408", "category": "math-ph", "title": "Symmetry algebra of a charged harmonic oscillator in the field of the Dirac magnetic monopole", "abstract": "A charged particle bound by an isotropic harmonic potential to a Dirac magnetic monopole, with the centrifugal term that makes the orbits close, has degeneracies beyond rotational invariance: for integer $q$, the product of the electric and magnetic charges, the levels are those of the oscillator with the states of angular momentum $l<|q|$ removed. The conserved rank-2 tensor $T$ built from the ladder operators that accounts for them was identified thirty-five years ago, but the algebra it generates with the angular momentum $\\mathbf{J}$ was not obtained. We obtain its relations in covariant form and identify it. It is polynomial but not quadratic, and the shift $T'=T+2(H-1)J^{(2)}$ by the quadrupole of $\\mathbf{J}$, and only this one, makes all commutators polynomials in $\\mathbf{J}$. In each sector of fixed energy and $J_z$, $(\\mathbf{J}^2,T'_{zz})$ generates a cubic algebra of Heun--Racah type whose parameters are symmetric, up to a scalar shift, in the magnetic charge and the magnetic quantum number. At $q=0$, $T$ is the algebraic Heun operator of the pair (Casimir of $\\mathfrak{so}(3)$, quadrupole of $\\mathfrak{su}(3)$): the symmetry algebra is the $\\mathfrak{so}(3)$-covariant extension of a Heun--Racah algebra. We define it abstractly and classify its multiplicity-free finite-dimensional representations at the energies of the system: besides the levels, they include, for nonzero integer $q$, a second family carried by the states the monopole removes, the kernel of the Newman--Penrose operator. All relations are derived from the dynamical algebra of the ladder operators and hold for integer and half-integer charges alike.", "url": "https://arxiv.org/abs/2610.25408", "type": "理论", "summary": "1. 该文研究了Dirac磁单极场中带电荷各向同性谐振子的对称性代数，给出了此前未得到的二阶张量T与角动量J的协变对易关系并完成识别。\n2. 其技术核心是T代数虽为多项式但非二次，只有经J四极矩平移T'=T+2(H-1)J^{(2)}后所有对易子才成为J的多项式，并在固定能量与J_z扇区化为参数对磁荷和磁量子数对称的Heun–Racah型三次代数。\n3. 这一抽象定义与无重数有限维表示分类为磁单极–谐振子体系提供了可操作的代数框架，并启示非零整数q时Newman–Penrose算子核态承载第二族表示，且关系对整数与半整数电荷均成立。", "summary_source": "deepseek", "authors": [{"name": "Ian Marquette"}, {"name": "Luc Vinet"}], "featured_authors": [{"name": "Ian Marquette"}, {"name": "Luc Vinet"}], "author_count": 2}, {"id": "2610.25594", "category": "math-ph", "title": "Upper bounds on the number of images produced by point-mass lenses at different distances", "abstract": "If a light source is sequentially lensed by $n$ intervening point-mass lenses at distinct distances, the number of isolated images for a generic source position cannot be greater than $2\\cdot 3^{n-1}$. If lensing shear is present in each lens plane, the image counts could be as large as $4^n$, however. For a general multi-plane point-mass lens system, we also devise the recurrence for the BKK bound on the image counts, which is strictly less than Perry's bound due to the resultant degree for $n\\ge 2$. None the less, this bound is still quadratic in the number of lenses on each plane, so is likely to overestimate the true sharp bound, which is expected to grow linearly with the number of lenses.", "url": "https://arxiv.org/abs/2610.25594", "type": "理论", "summary": "1. 该工作针对不同距离上的点质量透镜序列，推导了一般源位置下孤立像数量的上界，并为多平面点质量透镜系统建立了BKK像数界的递推关系。\n2. 其核心结果是：无剪切时n个异距点透镜的像数不超过2·3^{n-1}，而每个透镜平面含剪切时可增至4^n；BKK递推界因结式次数在n≥2时严格低于Perry界。\n3. 由于该界对每平面透镜数仍为二次，可能高估真实尖锐界，这提示真实像数有望随透镜总数线性增长，并为后续紧界研究提供方向。", "summary_source": "deepseek", "authors": [{"name": "J. An"}], "featured_authors": [{"name": "J. An"}], "author_count": 1}, {"id": "2610.26204", "category": "math-ph", "title": "Wave-Particle Complementarity in Quantum Walk from a Quantum Mechanical Perspective", "abstract": "A quantum walk is a mathematical model and a quantum version of a random walk. For the past two decades, it has been studied from mathematical and physical viewpoints. It has many desirable properties. This paper reevaluates quantum walk from a quantum mechanical perspective, as Feynman essentially proposed it as a toy model in his path integral method. Then we demonstrate that the quantum walk model exhibits both particle-like and wave-like properties by showing reflection and partial reflection as a particle and interference as a wave. In particular, for an initial state supported at two sites $\\pm\\ell$, we explicitly derive the weak limit distribution of the Hadamard walk and show that the Konno distribution is modulated by the interference factor $2\\cos^2(\\ell k(x))$. The resulting interference profile is reminiscent of far-field (Fraunhofer-type) diffraction.", "url": "https://arxiv.org/abs/2610.26204", "type": "理论", "summary": "1. 该文从量子力学视角重新审视量子行走，将其置于费曼路径积分的玩具模型脉络中，并论证该模型同时呈现粒子性与波动性。\n2. 核心结果是对初始态支撑于±ℓ两点的Hadamard行走显式导出弱极限分布，表明Konno分布受到干涉因子2cos^2(ℓ k(x))调制，形成类似远场Fraunhofer衍射的干涉图样。\n3. 这一对应为用量子行走刻画波粒二象性与衍射型干涉提供了可解析范例，并提示后续可据此分析初态空间结构对极限分布的影响。", "summary_source": "deepseek", "authors": [{"name": "Norio Konno"}, {"name": "Shigeki Matsutani"}, {"name": "Etsuo Segawa"}, {"name": "Tomoyuki Terada"}], "featured_authors": [{"name": "Norio Konno"}, {"name": "Shigeki Matsutani"}, {"name": "Etsuo Segawa"}, {"name": "Tomoyuki Terada"}], "author_count": 4}, {"id": "2610.26329", "category": "math-ph", "title": "Two-Dimensional Euclidean Free Fermi Fields from Grassmannian Stochastic Analysis", "abstract": "Motivated by Nelson's Euclidean Markov-field construction, we develop a counterpart for the massive two-dimensional free Dirac field. Starting from a Gaussian white noise with values in a Grassmann algebra on a non-commutative probability space, we construct the associated Brownian motion and a stationary Ornstein--Uhlenbeck field. The resulting Euclidean Fermi field is realized as a tempered distribution on spacetime test functions, with values in the underlying algebra. Its mixed two-point functions reproduce the Euclidean Dirac fundamental solution. Time-zero fields are obtained by conditional expectation onto the past filtration generated by the noise, while their covariance is the reflected Euclidean Dirac kernel. We show that conditional expectation is compatible with Wick ordering and maps Euclidean Wick polynomials to the corresponding time-zero Wick polynomials. The Euclidean time-translation semigroup is then constructed on time-zero fields and Wick sectors, with generators given by the one-particle Hamiltonian and by its second quantization.", "url": "https://arxiv.org/abs/2610.26329", "type": "理论", "summary": "1. 该工作受Nelson欧氏Markov场构造启发，在非交换概率空间的Grassmann代数白噪声上构造了二维大质量自由Dirac场的欧氏随机分析框架。\n2. 其核心是以布朗运动与平稳Ornstein–Uhlenbeck场实现取值于代数的缓增分布欧氏Fermi场，使混合两点函数复现欧氏Dirac基本解，并证明条件期望与Wick序相容且给出反射核协方差的时间零场。\n3. 由此在时间零场与Wick扇区上构造欧氏时间平移半群，其生成元为一粒子Hamiltonian及其二次量子化，为自由费米场的严格随机量子化及后续相互作用研究提供了可延展的模板。", "summary_source": "deepseek", "authors": [{"name": "Claudio Dappiaggi"}, {"name": "Francesco Carlo De Vecchi"}, {"name": "Pietro Tullio Falzoni"}, {"name": "Paolo Rinaldi"}], "featured_authors": [{"name": "Claudio Dappiaggi"}, {"name": "Francesco Carlo De Vecchi"}, {"name": "Pietro Tullio Falzoni"}, {"name": "Paolo Rinaldi"}], "author_count": 4}, {"id": "2610.26637", "category": "math-ph", "title": "Average lower bound on magnetic double-well tunneling with asymptotically large well separation", "abstract": "We study tunneling between two identical, smooth, compactly supported potential wells in a constant perpendicular magnetic field, with the coupling and magnetic field fixed and the well separation tending to infinity. For a sufficiently small positive magnetic field, we prove lower bounds on the hopping coefficient and on the splitting of the two lowest eigenvalues outside a set of separations of density zero. If the well centers are separated by $2d_1$ and the magnetic field strength is $b\\lambda$, the lower bounds have the form $e^{-b\\lambda d_1^2-Cd_1^{1+\\delta}}$ for every fixed $\\delta\\in(0,1)$. No radial or reflection symmetry of the single-well potential is assumed. The proof combines the explicit Landau resolvent kernel with a complex analytic estimate for logarithmic averages of the hopping coefficient.", "url": "https://arxiv.org/abs/2610.26637", "type": "理论", "summary": "1. 该文研究垂直恒定磁场中两个相同光滑紧支势阱在阱间距趋于无穷时的隧穿，证明对小正磁场，在除去密度为零的间距集合外，跳跃系数与最低两能级劈裂满足下界。\n2. 其卖点在于不要求单阱势具有径向或反射对称性，并借助显式朗道预解核与跳跃系数对数平均的复分析估计，得到形如 \\(e^{-b\\lambda d_1^2-Cd_1^{1+\\delta}}\\) 的渐近下界。\n3. 这为强磁场下远距双阱隧穿提供了稳健的定量控制，并提示可用平均化与预解核方法处理缺乏对称性的磁隧穿问题。", "summary_source": "deepseek", "authors": [{"name": "Charles L. Fefferman"}, {"name": "Say-Yeon Kwon"}, {"name": "Jacob Shapiro"}, {"name": "Michael I. Weinstein"}], "featured_authors": [{"name": "Charles L. Fefferman"}, {"name": "Say-Yeon Kwon"}, {"name": "Jacob Shapiro"}, {"name": "Michael I. Weinstein"}], "author_count": 4}, {"id": "2610.23889", "category": "quant-ph", "title": "Asymmetric Entanglement-Assisted Quantum Locally Recoverable Codes", "abstract": "Locally recoverable codes (LRCs) permit reconstruction of a lost coordinate from a small subset of the remaining coordinates, a property that is a fundamental coding technique for distributed storage and, more recently, for fault-tolerant quantum memories and distributed storage systems. Existing constructions of quantum locally recoverable codes (qLRCs) and their entanglement-assisted generalizations (EA-qLRCs) impose a single locality parameter $r$ governing recovery from both bit-flip ($X$-type) and phase-flip ($Z$-type) errors, even though physical noise is rarely symmetric between the two. We introduce entanglement-assisted quantum locally recoverable codes (EA-qLRC) with \\emph{asymmetric locality} $\\{r_X,r_Z\\}$, in which $X$-type and $Z$-type errors are corrected from recovery sets of size at most $r_X+1$ and $r_Z+1$, respectively. We extend a stabilizer sufficient condition for this property and, in particular, the CSS framework, where asymmetric locality corresponds to separate locality conditions on the two classical codes $\\mathcal C_1$ and $\\mathcal C_2$ underlying the construction. From this characterization we derive Singleton-, Griesmer-, Plotkin-, sphere-packing-, and Cadambe\\textendash Mazumdar-like bounds for CSS-type asymmetric EA-qLRCs (AEA-qLRCs) built from Proposition~\\ref{CSS-EA-qLRC-Asym}, and we characterize exactly when a pure CSS-type AEA-qLRC built from a pair of classical LRCs attains the Singleton-like bound with equality.", "url": "https://arxiv.org/abs/2610.23889", "type": "理论", "summary": "1. 该文提出并研究具有非对称局域性 {r_X,r_Z} 的纠缠辅助量子局域可恢复码，使 X 型与 Z 型错误分别由至多 r_X+1 和 r_Z+1 的恢复集纠正。\n2. 其卖点在于给出稳定子充分条件并推广至 CSS 框架，将非对称局域性化为底层两个经典码 C1、C2 的独立局域条件，进而导出 Singleton、Griesmer、Plotkin、球填充和 Cadambe–Mazumdar 型界，并精确刻画纯 CSS 型构造达到 Singleton 型界等号的条件。\n3. 这为比特翻转与相位翻转噪声不对称情形下的量子存储和分布式存储提供更灵活的编码设计，并给出后续构造与性能界的明确基准。", "summary_source": "deepseek", "authors": [{"name": "Vijay Kumar"}, {"name": "Ramakrishna Bandi"}], "featured_authors": [{"name": "Vijay Kumar"}, {"name": "Ramakrishna Bandi"}], "author_count": 2}, {"id": "2610.24077", "category": "quant-ph", "title": "Quantum error correction well below the color code threshold", "abstract": "Quantum error correction enables scalable fault-tolerant quantum computation by suppressing logical errors exponentially with code distance once physical error rates fall below a critical threshold. Here we demonstrate below-threshold operation of triangular color codes with distances $d=3,5,$ and $7$ on Quantinuum's Helios trapped-ion quantum processor. Leveraging both circuit- and hardware- level leakage reduction schemes, we achieve logical error rates as low as $5_{-2}^{+4}\\times 10^{-6}$, and demonstrate error suppression by over an order of magnitude, $\\Lambda=12_{-2}^{+3}$, with each successive increase in code distance. Moreover, we demonstrate below threshold scaling of error rates for Clifford two-qubit randomized benchmarking circuits when encoded in $d=3,5$ color codes, achieving logical error rate of $7^{+3}_{-3}\\times 10^{-5}$ per logical two-qubit Clifford at distance $5$ with a suppression factor of $\\Lambda=9_{-3}^{+8}$. We compare logical performance for existing near-optimal algorithmic decoders, and both convolutional neural network and transformer-based neural network decoders capable of real-time decoding an order of magnitude faster than the syndrome extraction rate. These results approach the logical error rates required for megaquop-scale quantum computation and indicate that scaled trapped-ion processors could reach application-relevant performance with substantially smaller code blocks than indicated by previous results in other qubit modalities.", "url": "https://arxiv.org/abs/2610.24077", "type": "理论+数值", "summary": "1. 该工作在Quantinuum Helios离子阱处理器上实现距离3、5、7三角色码的低于阈值运行，并借助电路与硬件级泄漏抑制测得逻辑错误率随码距增加而下降。\n2. 其卖点是逻辑错误率最低达\\(5_{-2}^{+4}\\times10^{-6}\\)、码距每增一级抑制因子\\(\\Lambda=12_{-2}^{+3}\\)，且在\\(d=3,5\\)色码编码的Clifford二比特随机基准中展示阈值以下缩放，\\(d=5\\)时每逻辑二比特Clifford错误率\\(7_{-3}^{+3}\\times10^{-5}\\)、\\(\\Lambda=9_{-3}^{+8}\\)。\n3. 该工作比较近最优算法解码器与CNN/Transformer解码器，后者实时解码快于症状提取一个量级，表明该平台接近megaquop级计算所需逻辑错误率，并暗示扩展离子阱可比先前其他量子比特模态用更小码块达到应用相关性能。", "summary_source": "deepseek", "authors": [{"name": "Ali Lavasani"}, {"name": "Adam P. Reed"}, {"name": "Joan M. Dreiling"}, {"name": "Annie J. Park"}, {"name": "Michael Mills"}, {"name": "Matteo Puviani"}, {"name": "Gabriel Matos"}, {"name": "M.S. Allman"}, {"name": "Noah Berthusen"}, {"name": "Natalie C. Brown"}, {"name": "Victor E. Colussi"}, {"name": "Brian Estey"}, {"name": "Cameron Foltz"}, {"name": "Daniel Gresh"}, {"name": "Reza Haghshenas"}, {"name": "Akhil Isanaka"}, {"name": "Nikhil Kotibhaskar"}, {"name": "Anthony Ransford"}, {"name": "Ciarán Ryan-Anderson"}, {"name": "Brian Neyenhuis"}, {"name": "David Hayes"}, {"name": "Tzvetan S. Metodi"}, {"name": "Andrew C. Potter"}], "featured_authors": [{"name": "Ali Lavasani"}, {"name": "Adam P. Reed"}, {"name": "Joan M. Dreiling"}, {"name": "David Hayes"}, {"name": "Tzvetan S. Metodi"}, {"name": "Andrew C. Potter"}], "author_count": 23}, {"id": "2610.24154", "category": "quant-ph", "title": "Translation-Invariant Pure States with Exotic Half-Chain Factors", "abstract": "We construct translation-invariant pure quasifree fermionic states on the one-dimensional lattice whose half-chain von Neumann algebras are hyperfinite factors of type $\\mathrm{II}_\\infty$ or $\\mathrm{III}_\\lambda$ for any $0<\\lambda\\leq 1$. Via the Jordan-Wigner-Araki transformation, these yield translation-invariant pure spin-chain states with the same half-chain factors, demonstrating that such factors need not be of type I or III. Each state is the unique ground state of a gapless, translation-invariant parent Hamiltonian with superpolynomially decaying interactions. For any fixed factor type, the interval entanglement entropy can exhibit widely varying growth rates, from arbitrarily slow divergence to nearly power-law growth, showing that entropy scaling does not determine the factor type. In contrast, we prove that gauge-invariant quadratic Hamiltonians with finitely many flavours and exponentially decaying hopping exhibit a dichotomy: their ground states either satisfy an area law with a type I half-chain factor, or have logarithmic entropy growth with a type $\\mathrm{III}_1$ factor. The counterexample was discovered with AI assistance.", "url": "https://arxiv.org/abs/2610.24154", "type": "理论", "summary": "1. 该工作在一维格点上构造平移不变的纯准自由费米态，使其半链冯诺依曼代数可为超有限II∞型或任意IIIλ型（0<λ≤1），并经Jordan-Wigner-Araki变换得到半链因子相同的纯自旋链态。\n2. 其卖点是这些态为具有超多项式衰减相互作用的无能隙平移不变母哈密顿量的唯一基态，且固定因子类型时纠缠熵可从任意慢发散到近幂律增长，说明熵标度不决定因子类型。\n3. 这揭示半链代数类型与纠缠熵标度相互独立，并对照出有限味数、指数衰减跃迁的规范不变二次模型仅在面积律/I型与对数增长/III1型之间二分。", "summary_source": "deepseek", "authors": [{"name": "Ruizhi Liu"}, {"name": "Jinmin Yi"}], "featured_authors": [{"name": "Ruizhi Liu"}, {"name": "Jinmin Yi"}], "author_count": 2}, {"id": "2610.24403", "category": "quant-ph", "title": "Prototype-Guided Optimization of Quantum Data Embeddings with Linear Cost", "abstract": "In supervised quantum machine learning with classical data, classification performance critically depends on the geometry induced by quantum data embedding. Existing data-adaptive approaches rely on pairwise fidelity evaluations between samples, which scale as $O(B^2)$ for $B$ samples and create a computational bottleneck in iterative embedding optimization. To address this issue, we propose a prototype-guided framework for efficient data-adaptive quantum embedding. Using class-prototype separation and sample-to-prototype compactness, we derive a measurable lower certificate for class-ensemble distinguishability and construct a prototype-based objective requiring only $O(B)$ fidelity evaluations. We integrate this objective into an end-to-end pipeline that combines task-specific quantum circuit architecture optimization with continuous refinement of the data-embedding parameters. Across five benchmark datasets with up to 20 qubits, our method retains competitive quantum kernel support vector machine (SVM) performance while reducing fidelity-evaluation cost, with particularly strong gains over budget-matched pairwise optimization on T-MNIST. Geometric analyses examine how the learned embeddings relate to kernel alignment and classification margins, revealing dataset-dependent benefits and limitations. We further derive a prototype-based classifier in the reproducing kernel Hilbert space that provides an explicit witness for the SVM objective and a low-cost proxy for model selection, and extend the framework to multiple prototypes for multimodal class structures.", "url": "https://arxiv.org/abs/2610.24403", "type": "理论+数值", "summary": "1. 该工作提出类原型引导的数据自适应量子嵌入优化框架，以类-原型分离度和样本-原型紧致度构造仅需O(B)次保真度评估的目标，并端到端联合优化任务专用量子线路结构与嵌入参数。\n2. 其技术卖点是把成对保真度O(B^2)的计算瓶颈降为线性代价，并给出类集合可区分性的可测下界证书，在最多20比特的五个基准上保持与量子核SVM相竞争的性能，且在T-MNIST上优于同等预算的成对优化。\n3. 该框架进一步在再生核Hilbert空间导出原型分类器，为SVM目标提供显式见证和低成本模型选择代理，并可扩展至多原型类结构，但几何分析提示收益依赖数据集。", "summary_source": "deepseek", "authors": [{"name": "Seokhoon Jeong"}, {"name": "Daniel K. Park"}], "featured_authors": [{"name": "Seokhoon Jeong"}, {"name": "Daniel K. Park"}], "author_count": 2}, {"id": "2610.24426", "category": "quant-ph", "title": "Margin-Based Generalization for Quantum Machine Learning with Classical Data Encoding", "abstract": "Understanding generalization is essential for assessing the practical viability of quantum machine learning. In many applications, quantum models operate on classical data that must first be encoded into quantum states, making the encoding part of the effective hypothesis class. We develop a margin-based generalization framework for this setting, covering both fixed and trainable quantum data encodings. For fixed encodings, the existing margin bound transfers unchanged. For trainable encodings, we derive a bound using a two-scale covering argument that combines the original margin-dependent term with an additive encoding-capacity term of order $\\tilde O(\\sqrt{L/m})$, where $L$ is the number of trainable encoding parameters and $m$ is the training-sample size. Across 19,440 simulated training runs spanning various image datasets, circuit architectures, and optimization settings, the inverse margin performs best among five baseline and two bound-derived complexity measures under conditional-independence and 90th-percentile sign-error criteria, within bootstrap uncertainty. These results provide a unified margin-based view of generalization in quantum machine learning with classical data.", "url": "https://arxiv.org/abs/2610.24426", "type": "理论+数值", "summary": "1. 该工作针对经典数据需先编码为量子态的量子机器学习，建立了涵盖固定与可训练编码的基于间隔的泛化框架。\n2. 其核心在于对可训练编码采用双尺度覆盖论证，将间隔相关项与量级为 \\(\\tilde O(\\sqrt{L/m})\\) 的编码容量加性项结合，而固定编码情形可沿用原有间隔界。\n3. 在19,440次模拟训练中逆间隔在条件独立与90百分位符号误差准则下表现最佳，这为统一理解编码容量与泛化、指导量子模型选择提供了可检验视角。", "summary_source": "deepseek", "authors": [{"name": "Ju-Young Ryu"}, {"name": "Tak Hur"}, {"name": "Daniel K. Park"}], "featured_authors": [{"name": "Ju-Young Ryu"}, {"name": "Tak Hur"}, {"name": "Daniel K. Park"}], "author_count": 3}, {"id": "2610.24482", "category": "quant-ph", "title": "Local response theory of multiparameter sudden-quench quantum Otto engines", "abstract": "Multiparameter quantum Otto engines raise an optimization problem absent in single-parameter cycles: which small quench vector maximizes the quadratic approximation to the exact output work in a multidimensional control space? We develop a local response theory for sudden-quench Otto engines with quantum working media described by linearly controlled Hamiltonians. We show that the local quadratic work decomposes into a thermal-bias gain and a quadratic response cost, whose competition determines the quench vector that maximizes the local quadratic work at a prescribed quench amplitude. We illustrate the theory in a minimal two-level working medium, where radial and transverse quenches play distinct roles, and in a finite interacting XYZ spin chain, where the resulting quench vector is determined by the balance between thermal-bias and response cost. Our results provide a practical local criterion for designing small multiparameter quenches in sudden-quench quantum Otto engines.", "url": "https://arxiv.org/abs/2610.24482", "type": "理论+数值", "summary": "1. 该工作针对多参数突然淬火量子奥托热机，建立了以线性控制哈密顿量为工作介质的局域响应理论，用于在给定小淬火幅度下比较不同控制方向。\n2. 其核心是证明局域二次输出功可分解为热偏置增益与二次响应代价，两者竞争决定使局域二次功最大的淬火矢量，并在二能级介质与有限XYZ自旋链中展示了径向、横向淬火及相互作用下的平衡机制。\n3. 这为多参数量子热机的小幅淬火设计提供了可操作的局域判据，并启示后续可在更复杂工作介质与非绝热控制中检验该增益—代价框架。", "summary_source": "deepseek", "authors": [{"name": "Dehua Liu"}, {"name": "Yihang Cai"}, {"name": "Biao Xiong"}, {"name": "Jibing Liu"}, {"name": "Chuanjia Shan"}, {"name": "Jianhui Wang"}], "featured_authors": [{"name": "Dehua Liu"}, {"name": "Yihang Cai"}, {"name": "Biao Xiong"}, {"name": "Jibing Liu"}, {"name": "Chuanjia Shan"}, {"name": "Jianhui Wang"}], "author_count": 6}, {"id": "2610.24503", "category": "quant-ph", "title": "Logical-Space Theory of Ordered-Statistics Decoding for Quantum LDPC Codes", "abstract": "Quantum decoding succeeds when a correction matches the logical class of the error, whereas ordered-statistics decoding (OSD) searches a finite list of physical corrections. We connect these spaces through a rank-$k$ logical-signature map $M_{\\rm log}:\\mathbb F_2^q\\to\\mathbb F_2^k$. For fixed, error-independent orderings it yields the exact logical-signature distribution, the OSD-0 logical error rate, and the logical-class coverage of any fixed list. For minimum-cost list decoding we prove $P_L=P_{\\rm miss}+P_{\\rm sel}$, separating absent-class from wrong-selection failures. Hypergraph-product and bivariate-bicycle codes are consistent with the coverage predictions. On the $[\\![144,12,12]\\!]$ gross code, 672 coverage-aware candidates outperform 899 combination-sweep candidates (paired McNemar $p=0.013$), while two lists with identical logical coverage give $P_L=11.30\\%$ and $3.78\\%$; the signature-based coverage compression persists across 30 random column orderings. Logical coverage and within-class representative selection are therefore complementary resources that candidate count alone does not capture. The framework guides OSD list construction and compression by identifying coverage requirements and distinguishing coverage losses from failures of representative selection.", "url": "https://arxiv.org/abs/2610.24503", "type": "理论", "summary": "1. 该工作提出量子LDPC码有序统计译码的逻辑空间理论，用秩k逻辑签名映射连接有限物理候选表与逻辑类，推导精确逻辑签名分布、OSD-0逻辑错误率及固定表的逻辑类覆盖。\n2. 其核心是严格分解最小代价表译码的P_L=P_miss+P_sel，将逻辑类缺失与类内代表选择失败分离，并在gross码上以672个覆盖感知候选优于899个组合扫描候选（p=0.013），且相同覆盖的表P_L为11.30%与3.78%。\n3. 这表明逻辑覆盖与类内代表选择是候选数无法刻画的互补资源，为OSD候选表构建与压缩提供覆盖需求判据，并启发译码器同时优化覆盖和代表选择。", "summary_source": "deepseek", "authors": [{"name": "Yun Shang"}], "featured_authors": [{"name": "Yun Shang"}], "author_count": 1}, {"id": "2610.24518", "category": "quant-ph", "title": "Exact Quantum Query Complexity of the Five-Bit Symmetric Boolean Function $\\Exact^5_{3,4}$", "abstract": "Let \\(f = \\text{EXACT}^5_{3,4}\\) be the Boolean function that equals 1 exactly on inputs of Hamming weight 3 or 4. Earlier numerical studies reported success probabilities close to one using three queries, but the existence of an exact three-query algorithm had remained unresolved. This paper settles this problem by proving that the exact quantum query complexity of \\(f\\) is \\(4\\). For the lower bound, we express every three-query algorithm through layer-by-layer Gram matrices of low-degree Fourier coefficients. We then construct a fixed rational dual certificate whose slack matrices are all positive definite. This certificate separates the necessary Gram-matrix region from the exact-output condition and therefore rules out every exact algorithm using at most three queries in the stated model. The positivity verification reduces to five small rational matrices and Sylvester's criterion. For the upper bound, we invoke the previously known four-query algorithm for the seven-bit function \\(\\text{EXACT}^7_{3,4}\\) and apply the standard padding reduction. To quantify the near-exact behavior, we use the same certificate to derive a valid, though not claimed tight, lower bound \\(\\frac{25600}{43779488192449}>0\\) on the worst-case error of every algorithm using at most three queries. This positive error gap is compatible with the near-unit success probabilities reported in earlier numerical studies, which do not establish exact computation.", "url": "https://arxiv.org/abs/2610.24518", "type": "理论+数值", "summary": "1. 该文证明五比特对称布尔函数 EXACT^5_{3,4} 的精确量子查询复杂度为 4，解决了是否存在三查询精确算法这一未决问题。\n2. 下界以低次傅里叶系数的逐层 Gram 矩阵刻画三查询算法，构造固定有理对偶证书，其正定松弛矩阵分离必要 Gram 区域与精确输出条件，从而排除至多三查询精确算法；正定性验证归结为五个小型有理矩阵和 Sylvester 判据，上界调用七位 EXACT^7_{3,4} 的四查询算法经填充约化。\n3. 同一证书导出至多三查询算法最坏误差的有效但非紧正下界 25600/43779488192449，说明早先接近一的数值成功率并不证明精确计算，也提示对偶证书可用于精确查询复杂度下界。", "summary_source": "deepseek", "authors": [{"name": "Guoliang Xu"}, {"name": "Haoran Zhang"}, {"name": "Mengfan Wu"}, {"name": "Songyao Xue"}, {"name": "Mingke Liu"}], "featured_authors": [{"name": "Guoliang Xu"}, {"name": "Haoran Zhang"}, {"name": "Mengfan Wu"}, {"name": "Songyao Xue"}, {"name": "Mingke Liu"}], "author_count": 5}, {"id": "2610.24561", "category": "quant-ph", "title": "Ergotropy of nonequilibrium steady states beyond the full secular approximation", "abstract": "Understanding the generation and activation of ergotropy, the maximum work extractable by cyclic unitary operations, is central to quantum battery research. Positive-temperature thermal states are passive, whereas nonequilibrium environments can sustain nonpassive steady states with nonzero ergotropy. However, the full secular approximation commonly used in Lindblad descriptions can suppress steady-state coherence and obscure its contribution to ergotropy. Using a Bloch-Redfield master equation beyond the full secular approximation, we investigate the ergotropy of the nonequilibrium steady state (NESS) of two exchange-coupled qubits connected to independent thermal reservoirs. The NESS ergotropy of two qubits with the same frequency is entirely coherent and grows quadratically with temperature bias near equilibrium. In contrast, detuned qubits can exhibit incoherent ergotropy. We derive an exact analytical criterion for its activation and show that activation requires the hotter reservoir to be coupled to the qubit with the higher bare frequency. Comparing NESSs obtained with and without full secularization reveals quantitative and qualitative differences in ergotropy that reflect changes in both its coherent and incoherent contributions. The results clarify the mechanisms of NESS ergotropy activation and demonstrate the importance of retaining steady-state coherence beyond the full secular approximation when characterizing stationary work resources.", "url": "https://arxiv.org/abs/2610.24561", "type": "理论", "summary": "1. 该工作采用超越完全久期近似的Bloch-Redfield主方程，研究两个交换耦合量子比特分别连接独立热库时非平衡稳态ergotropy的产生与激活。\n2. 其核心在于：同频比特的稳态ergotropy完全相干并随温度偏置在近平衡区二次增长，失谐比特则可产生非相干ergotropy，且作者给出激活的精确解析判据，即较热库须耦合到裸频率较高的比特。\n3. 该结果澄清了非平衡稳态ergotropy的激活机制，并表明刻画稳态功资源时须保留完全久期近似之外的稳态相干性。", "summary_source": "deepseek", "authors": [{"name": "Xing-Xing Hu"}, {"name": "Hui-Yu Yang"}, {"name": "Kun Zhang"}, {"name": "Xiao-Hui Wang"}], "featured_authors": [{"name": "Xing-Xing Hu"}, {"name": "Hui-Yu Yang"}, {"name": "Kun Zhang"}, {"name": "Xiao-Hui Wang"}], "author_count": 4}, {"id": "2610.24582", "category": "quant-ph", "title": "Concatenated continuous-drive protection of exchange-based spin-qubit gates", "abstract": "Exchange-based two-qubit gates in semiconductor spin qubits are sensitive to low-frequency detuning noise and control errors. Here, we extend concatenated continuous driving (CCD), implemented by phase modulation of a global microwave drive, to exchange-based SWAP and $\\sqrt{\\mathrm{SWAP}}$ operations between double-dressed spin qubits and investigate its effectiveness for protecting two-qubit gates. We find that CCD retains strong protection against quasistatic common-mode detuning errors while substantially improving robustness against Rabi-frequency errors and qubit-to-qubit Rabi-frequency mismatch compared with conventional continuous dressing. By contrast, the gate fidelity is impacted by differential detuning errors. By modeling partially correlated quasistatic detuning noise, we further show that the noise-averaged gate fidelity depends strongly on the spatial correlation of the qubit-frequency fluctuations, with positive correlations enhancing CCD protection by suppressing the differential-noise component. These results identify the symmetry and spatial correlation of qubit-frequency noise as key factors governing continuous-drive protection in coupled spin-qubit systems.", "url": "https://arxiv.org/abs/2610.24582", "type": "理论", "summary": "1. 该工作把由全局微波相位调制实现的拼接连续驱动（CCD）用于双缀饰自旋量子比特间的交换型SWAP与√SWAP门，并评估其对两比特门的保护效果。\n2. 其要点是CCD在保持对准静态共模失谐强抑制的同时，较传统连续缀饰显著增强对拉比频率误差和比特间拉比失配的鲁棒性，但门保真度仍受差分失谐影响；噪声平均保真度强烈依赖比特频率涨落的空间关联，正相关通过压制差分噪声增强保护。\n3. 结果将比特频率噪声的对称性与空间关联识别为耦合自旋比特体系中连续驱动保护的关键决定因素，为门设计与噪声表征提供依据。", "summary_source": "deepseek", "authors": [{"name": "Takuma Kuno"}, {"name": "Takeru Utsugi"}, {"name": "Andrew J. Ramsay"}, {"name": "Hideo Arimoto"}, {"name": "Tetsuo Kodera"}, {"name": "Hiroyuki Mizuno"}], "featured_authors": [{"name": "Takuma Kuno"}, {"name": "Takeru Utsugi"}, {"name": "Andrew J. Ramsay"}, {"name": "Hideo Arimoto"}, {"name": "Tetsuo Kodera"}, {"name": "Hiroyuki Mizuno"}], "author_count": 6}, {"id": "2610.24658", "category": "quant-ph", "title": "Collective Strong Quantum Mpemba Effect in Accelerated Quantum Detectors", "abstract": "Collective coupling to the Minkowski vacuum allows uniformly accelerated quantum detectors to exhibit a strong quantum Mpemba effect, in which a state initially farther from equilibrium relaxes faster than a closer one. We establish the existence of this effect for every fixed finite number of detectors $N\\geq 2$ at sufficiently small transverse separation within the pointlike secular master equation. The mechanism originates from two reflection sectors whose populations are conserved by the leading collective dynamics. Weak intersector transfer at finite separation generates an isolated, parametrically slow relaxation mode. A simple family of initial states permits its leading-order cancellation by matching the equilibrium sector populations, while a corrected preparation eliminates the slow-mode amplitude exactly. We construct a reference state that establishes a genuine reversal of trace-distance ordering. Numerical calculations and local-rate-preserving controls identify the collective origin of the effect, while spatially smeared detector calculations support its persistence within the second-order secular framework. The same mechanism extends to detectors coupled to a common thermal field, with analytically distinct slow relaxation rates. Thus, strong Mpemba relaxation is not exclusive to acceleration but emerges from a more general interplay between collective dissipation, reflection-sector conservation, and weak symmetry-breaking transfer.", "url": "https://arxiv.org/abs/2610.24658", "type": "理论+数值", "summary": "1. 该文在点状久期主方程框架下证明，对任意有限个（N≥2）横向间距足够小的匀加速量子探测器，集体耦合到闵可夫斯基真空可产生强量子姆潘巴效应，即初态离平衡更远者反而弛豫更快。\n2. 其核心机制是领头集体动力学守恒两个反射扇区的布居，有限间距下的弱扇区间转移产生一个孤立且参数化缓慢的弛豫模式，并通过匹配平衡扇区布居构造初态以抵消该慢模、给出迹距离序反转的参考态。\n3. 该机制可推广至共同热场中的探测器且慢弛豫率解析不同，表明强姆潘巴弛豫并非加速所独有，而源于集体耗散、反射扇区守恒与弱对称性破缺转移的一般交织。", "summary_source": "deepseek", "authors": [{"name": "G. D. de Moraes Neto"}, {"name": "Richard Q. Matos"}, {"name": "Norton G. de Almeida"}], "featured_authors": [{"name": "G. D. de Moraes Neto"}, {"name": "Richard Q. Matos"}, {"name": "Norton G. de Almeida"}], "author_count": 3}, {"id": "2610.24686", "category": "quant-ph", "title": "Efficient Quantum Algorithm for Mixed-State Quantum Geometry", "abstract": "Mixed-state quantum geometry plays a fundamental role in quantum metrology, multiparameter estimation, and the characterization of quantum many-body systems. Yet, unlike its pure-state counterpart, accessing mixed-state geometry requires solving an ill-conditioned Lyapunov equation for the symmetric logarithmic derivative (SLD), posing a major challenge for resource-efficient quantum computation. Here we address the challenge and develop a novel quantum algorithmic framework for efficiently accessing the quantum Fisher information matrix (QFIM) and quantum geometric tensor (QGT) of mixed states. Our key insight is to uncover a previously unexplored connection between the positive semidefinite structure of density matrices and exponentially convergent Gauss-Laguerre quadrature, enabling an efficient integral-based construction of the SLD. A rigorous complexity analysis further establishes the resource efficiency of our algorithm, demonstrating logarithmic precision dependence and double-logarithmic ancillary-qubit overhead at fixed conditioning. Building on this construction, we achieve near-Heisenberg precision scaling for diagonal QFI estimation without quantum phase estimation and construct unified block encodings of the full QFIM and QGT under a bounded spectral-gap assumption. A complementary regularized algorithm extends efficient diagonal estimation to exponentially small spectral gaps under a bounded-response condition. Our results establish a resource-efficient route to coherent mixed-state quantum geometry, enabling its direct integration into quantum linear-algebra algorithms without classical reconstruction and opening new possibilities for quantum-enhanced multiparameter metrology.", "url": "https://arxiv.org/abs/2610.24686", "type": "理论+数值", "summary": "1. 该工作提出一个高效获取混合态量子费希尔信息矩阵与量子几何张量的量子算法框架，避免直接求解病态李雅普诺夫方程中的对称对数导数。\n2. 其核心卖点是利用密度矩阵半正定结构与指数收敛高斯-拉盖尔求积的联系，以积分方式构造对称对数导数，并在固定条件数下给出对数精度依赖、双对数辅助比特开销，以及无需量子相位估计的近海森堡精度对角费希尔信息估计和有限谱隙假设下的全费希尔信息矩阵与几何张量块编码。\n3. 这为将相干混合态量子几何直接集成进量子线性代数算法、免除经典重构并推进量子增强多参量计量提供了资源高效路径。", "summary_source": "deepseek", "authors": [{"name": "Chenyang Wang"}, {"name": "Qi Zhao"}, {"name": "Xiao Yuan"}, {"name": "Xiaoxia Cai"}], "featured_authors": [{"name": "Chenyang Wang"}, {"name": "Qi Zhao"}, {"name": "Xiao Yuan"}, {"name": "Xiaoxia Cai"}], "author_count": 4}, {"id": "2610.24840", "category": "quant-ph", "title": "Characterizing Local and Correlated Pauli Noise in Quantum Teleportation Circuits", "abstract": "We analytically characterize how the location and the local or correlated structure of stochastic Pauli errors affect a three-qubit coherent quantum-teleportation circuit. Independent local channels and a fully correlated two-qubit channel are inserted separately in six configurations. Propagating each Pauli-error realization through the Clifford circuit yields the effective channel on Bob's qubit and analytical expressions for the average and state-resolved fidelities. Under a common ordered-pair probability convention, the six configurations form three pairs that induce equivalent reduced channels on Bob. Within each pair, corresponding Pauli-error realizations have the same probabilities and produce the same effective Pauli operator on Bob's output state. The equivalence therefore holds for every input state within the stochastic Pauli models considered here, rather than only for the average fidelity. Correlated Z errors do not affect the output for the first pair; local X and Z errors exhibit complementary qubit sensitivity for the second; and correlated same-axis Pauli errors cancel for the third. These results classify the error response of the selected circuit configurations and show that it depends jointly on the error statistics, Pauli axis, and position within the protocol.", "url": "https://arxiv.org/abs/2610.24840", "type": "理论+数值", "summary": "1. 该工作解析刻画三量子比特相干量子隐形传态电路中，独立局域泡利信道与完全关联双量子比特信道在六种配置下对接收端有效信道及平均和态分辨保真度的影响。\n2. 核心卖点是按有序对概率约定将六种配置归为三对等价约化信道，并证明同一配对内对应泡利误差实现具有相同概率且对任意输入态产生相同接收端有效泡利算符，而非仅平均保真度等价。\n3. 结果分类出关联Z误差无影响、局域X与Z误差呈互补量子比特敏感性、同轴关联泡利误差相消等行为，表明误差响应由误差统计、泡利轴和协议位置共同决定。", "summary_source": "deepseek", "authors": [{"name": "L. Anjos"}, {"name": "Jose Alfredo de Leon"}, {"name": "R. S. Sarthour"}, {"name": "Alejandro Fonseca"}], "featured_authors": [{"name": "L. Anjos"}, {"name": "Jose Alfredo de Leon"}, {"name": "R. S. Sarthour"}, {"name": "Alejandro Fonseca"}], "author_count": 4}, {"id": "2610.24925", "category": "quant-ph", "title": "Symmetry-breaking chelation enables room-temperature all-optical spin coherence readout of aqueous Cu(II) for chemoselective discrimination", "abstract": "Optical initialization and readout of molecular electron spins in water remains challenging for 3d transition-metal complexes. Their Laporte-forbidden d-d transitions yield weak transition dipole moments, so optical spin detection in aqueous Cu(II) previously required ~1 M concentrations. Here we overcome this constraint through symmetry-breaking chelation. Coordinating Cu(II) with EDTA imposes a non-centrosymmetric ligand field with enhanced metal-ligand covalency, relaxing Laporte restrictions and amplifying d-d transition dipole moments. This design enhances absorption and magnetic circular dichroism by 7.3- and 5.6-fold, enabling ultrafast spin readout down to 100 {\\mu}M with an apparent dephasing time T2^*~0.54 ns. As a proof-of-concept for selective molecular-spin sensing, histidine addition extends T_2^* to ~0.8 ns in a concentration-dependent manner, whereas glycine produces no measurable effect. These results show that symmetry breaking provides a strategy to create molecular spin-photon interfaces, opening avenues toward all-optical, analyte-responsive quantum sensing in water.", "url": "https://arxiv.org/abs/2610.24925", "type": "理论", "summary": "1. 该工作利用对称性破缺螯合，在室温水相中实现Cu(II)电子自旋的全光学相干读出，并演示化学选择性区分。\n2. 其卖点是EDTA配位形成非中心对称配位场并增强金属-配体共价性，弛豫Laporte禁戒、放大d-d跃迁偶极矩，使吸收与磁圆二色性分别增强7.3倍和5.6倍，将超快自旋读出浓度降至100 μM，T2*约0.54 ns。\n3. 组氨酸使T2*延长至约0.8 ns且呈浓度依赖，甘氨酸无响应，表明对称性破缺可用于构建分子自旋-光子界面，并启发水相全光学、分析物响应的量子传感。", "summary_source": "deepseek", "authors": [{"name": "Jinlei Li"}, {"name": "Qiaoyun Wu"}, {"name": "Qiaoqiao Shao"}, {"name": "Zhubin Hu"}, {"name": "Haitao Sun"}, {"name": "Zhenrong Sun"}, {"name": "Donghai Feng"}], "featured_authors": [{"name": "Jinlei Li"}, {"name": "Qiaoyun Wu"}, {"name": "Qiaoqiao Shao"}, {"name": "Haitao Sun"}, {"name": "Zhenrong Sun"}, {"name": "Donghai Feng"}], "author_count": 7}, {"id": "2610.24956", "category": "quant-ph", "title": "Chiral Floquet Selection of an Algebraic Rydberg Bound State in the Continuum", "abstract": "Bound states in the continuum (BICs) remain localized despite the presence of extended modes at the same energy. In driven systems with long-range couplings, the absence of radiation does not by itself determine how a bound state decays in space. We study a Hermitian Rydberg spin waveguide coupled to a four-site plaquette, where a winding drive phase combines rotation with time translation to forbid propagating guide channels in one symmetry sector. The resulting eigenstate remains embedded in the continuum of other sectors and carries an inverse-cube waveguide amplitude, with coherent contributions from direct plaquette--guide coupling and long-range guide propagation. Pair-state calculations determine the microscopic couplings in the axial geometry, while coherent Floquet mixing sets the weight of the dominant circulating plaquette mode. The bound state thus retains the spatial signature of the long-range coupling even when radiation is forbidden.", "url": "https://arxiv.org/abs/2610.24956", "type": "理论+数值", "summary": "1. 该工作构建并研究受驱Rydberg自旋波导与四格点环耦合的厄米体系，利用含绕转相位的Floquet驱动在单一对称扇区禁戒传播通道，从而选择出嵌入连续谱的代数型束缚态。\n2. 其技术卖点是用pair-state计算确定轴向几何的微观耦合，并表明该束缚态的波导振幅按反立方衰减，源自直接格点环–波导耦合与长程波导传播的相干叠加，而相干Floquet混合设定主导环流模式的权重。\n3. 这表明即便辐射被禁戒，束缚态的空间衰减仍携带长程耦合指纹，为Floquet选择性工程代数局域态及其实验识别提供明确判据。", "summary_source": "deepseek", "authors": [{"name": "X. Z. Zhang"}, {"name": "X. F. ZHang"}, {"name": "M.W. Liu"}], "featured_authors": [{"name": "X. Z. Zhang"}, {"name": "X. F. ZHang"}, {"name": "M.W. Liu"}], "author_count": 3}, {"id": "2610.25057", "category": "quant-ph", "title": "Super Howe duality and rigidity of hybrid Fourier transforms", "abstract": "We characterize the hybrid Fourier transform on the Schwartz--Grassmann space $\\caS(\\bbR^m)\\otimes\\Lambda_{2n}$ by operator intertwining relations. Using the bosonic oscillator Howe decomposition and the fermionic Lefschetz decomposition, we describe the action of the hybrid Fourier transform on both tensor factors. We show that first-order covariance with respect to coordinate multiplication and differentiation determines the transform up to a scalar. For $m,n\\ge1$, we prove that covariance under all even quadratic operators, together with any one nonzero mixed quadratic operator, determines the linear span of the hybrid Fourier transform and its inverse. This rigidity result is obtained by computing the ordinary commutants of the even and full quadratic oscillator actions of $\\fosp(4n|2m)$. After a degree-scaling change of normalization, we make the hybrid Fourier transform unitary with respect to the occupation number inner product, and factor it into a bosonic oscillator rotation and (up to a scalar phase) an $SU(2)$ rotation in the fermionic Lefschetz representation. For $m=1$ and $n\\ge2$, we show that full even quadratic covariance together with the parity-preserving cubic relation for $qQ_f$ determines the unitary transform up to a global phase and a fermion-parity phase. Finally we calculate the unitary conjugation formulas for Hubbard--Holstein Hamiltonian for a hybrid continuous-variable and discrete-variable quantum system.", "url": "https://arxiv.org/abs/2610.25057", "type": "理论", "summary": "1. 该工作用算子交织关系刻画混合Fourier变换，并借玻色Howe分解与费米Lefschetz分解给出其在张量因子上的作用与刚性定理。\n2. 核心卖点是：坐标乘法与微分的首阶协变将变换确定到标量；全部偶二次算子协变加任一非零混合二次算子可确定该变换及其逆的线性张成，并由fosp(4n|2m)二次振子作用的交换子完成证明。\n3. 经次数缩放归一化后变换关于占据数内积酉化，可分解为玻色振子旋转与费米SU(2)旋转；Hubbard–Holstein哈密顿量的酉共轭公式为连续-离散混合量子系统提供了可计算的工具。", "summary_source": "deepseek", "authors": [{"name": "Jing-Song Huang"}, {"name": "Yongzhi Luan"}, {"name": "Yinuo Xue"}], "featured_authors": [{"name": "Jing-Song Huang"}, {"name": "Yongzhi Luan"}, {"name": "Yinuo Xue"}], "author_count": 3}, {"id": "2610.25138", "category": "quant-ph", "title": "On the Complexity of Level-Synchronized Tree Automata for Quantum Circuit Verification", "abstract": "Reliable quantum computation requires methods for verifying quantum circuits. Level-synchronized tree automata (LSTAs) were recently introduced to represent sets of quantum states for this purpose. We study LSTAs along two axes relevant to verification: the complexity of their decision problems and the size of their representations under circuit operations. We prove that acyclic LSTAs have NP-complete nonemptiness and $\\Pi_2^P$-complete language inclusion, and that general language inclusion is EXPSPACE-complete. We further prove inherent quadratic representation growth under individual quantum gates in a fixed qubit order, and give an adjacent-qubit reordering construction that preserves level synchronization. These results clarify the scope of applicability of the automata-theoretic toolbox for quantum circuit verification.", "url": "https://arxiv.org/abs/2610.25138", "type": "理论", "summary": "1. 该文系统研究了量子电路验证中水平同步树自动机（LSTA）的判定问题复杂度及其在电路操作下的表示规模。\n2. 其核心结论是无环LSTA的非空性为NP完全、语言包含为Π₂ᴾ完全，而一般语言包含为EXPSPACE完全，并证明固定量子比特顺序下单门操作会导致固有的二次表示增长，同时给出保持水平同步的相邻量子比特重排构造。\n3. 这些结果界定了自动机理论工具在量子电路验证中的适用边界，并为后续表示优化与验证流程设计提供了明确约束和启发。", "summary_source": "deepseek", "authors": [{"name": "Michael Blondin"}, {"name": "Samy Chady Khoumsi-Kasmi"}, {"name": "Guillermo A. Pérez"}, {"name": "Marnix Suilen"}], "featured_authors": [{"name": "Michael Blondin"}, {"name": "Samy Chady Khoumsi-Kasmi"}, {"name": "Guillermo A. Pérez"}, {"name": "Marnix Suilen"}], "author_count": 4}, {"id": "2610.25196", "category": "quant-ph", "title": "Exact probability laws of random inner products: Dirichlet splines, overlaps, uncertainty, and Bargmann invariants", "abstract": "Inner products of random matrices and random quantum states---such as orbital inner products, expectation values, overlaps, and cyclic Bargmann invariants---are shown to follow from two underlying mechanisms: the diagonal of an induced random state is Dirichlet distributed, and the expectation value of a random pure state in a rank-one or two-by-two operator is a numerical shadow on an elliptical disk. For states induced by an environment of dimension $K$, the expectation value of any observable is a Curry--Schoenberg spline with each eigenvalue repeated $K$ times, and the vector of moments has an explicit density on a simplex; for a qutrit, the variance law is obtained in finite form. The overlap of two random qubit states attains its mode at its mean for every rotation-invariant ensemble, but for Hilbert--Schmidt qutrits the density at the mean has a strictly negative derivative, so mode and mean separate; for large environments, the centred overlap converges to a variance-gamma law rather than a Gaussian. For two noncommuting qubit observables, the joint law of the two standard deviations is derived for all $K$, and the probability of coming within a small distance of the optimal sum of variances scales as a power of that distance, with a different exponent when the Bloch axes are orthogonal. For three Haar-random qubit states, the exact density of the Bargmann invariant is given in terms of a complete elliptic integral, together with its local behaviour and elementary marginals. In every dimension, the probability that its real part is negative---certifying basis-independent coherence---is computed, along with all mixed moments. For cycles of arbitrary length, the invariant is shown to be driven by an exact three-parameter Markov chain, and the logarithm of its modulus obeys a law of large numbers and a central limit theorem.", "url": "https://arxiv.org/abs/2610.25196", "type": "理论+数值", "summary": "1. 该工作给出了随机矩阵与随机量子态各类内积——轨道内积、期望值、重叠度与循环Bargmann不变量——的精确概率分布律。\n2. 其关键在于诱导随机态对角元的Dirichlet分布与低秩算子期望值的椭圆盘数值阴影，据此把环境维度K下的可观测期望值化为特征值重复K次的Curry–Schoenberg样条，并导出qutrit方差、重叠度众数与均值的分离、方差-伽马极限以及三态Bargmann不变量的椭圆积分密度。\n3. 该框架表明大环境极限下重叠度统计偏离高斯形式，并为非对易可观测量的联合不确定度与任意长度循环不变量的马尔可夫链描述提供了可精确计算的基准。", "summary_source": "deepseek", "authors": [{"name": "Lin Zhang"}], "featured_authors": [{"name": "Lin Zhang"}], "author_count": 1}, {"id": "2610.25203", "category": "quant-ph", "title": "Simulation-Based Quantum Forensics for QKD: Machine Learning Attack Detection and Signature Extraction", "abstract": "Quantum Key Distribution (QKD) supports secure key establishment under ideal protocol assumptions, but practical systems remain exposed to implementation-level attacks against optical channels, detectors, and controller behavior. This study presents Quantum Forensic Log (QF-LOG), a simulation-based forensic framework for analyzing aggregated QKD operational logs rather than raw quantum states. QF-LOG uses four observable features: quantum bit error rate (QBER), photon count, latency in milliseconds, and abort flag. The framework classifies normal operation and three simulated attack-related conditions: partial intercept-resend, detector-blind, and fiber-tap. A physics-inspired Generator-A dataset with 5 million balanced records was constructed using explicit mathematical generation models for all four features. A transparent threshold baseline, logistic regression, random forest, and XGBoost were evaluated on Generator-A. The full-feature learning models achieved macro F1-scores from 0.8211 to 0.8243 and outperformed the transparent two-feature comparator. Feature diagnostics showed that QBER contributed most, followed by latency in milliseconds and photon count, while no single feature reproduced the full feature set performance. Robustness was assessed on a separately generated Generator-B dataset of 5 million records that uses the same governing equations under shifted simulated operating parameters. Without retraining or tuning, their macro F1-scores decreased to values from 0.5645 to 0.5669. These findings show that QF-LOG can support interpretable forensic classification in a controlled synthetic setting, but stable internal evaluation does not establish reliability under changed simulated QKD operating conditions. The framework provides a documented basis for future evaluation across broader simulated settings and hardware-generated QKD logs.", "url": "https://arxiv.org/abs/2610.25203", "type": "理论+数值", "summary": "1. 该工作提出QF-LOG仿真取证框架，利用聚合QKD运行日志中的QBER、光子计数、毫秒延迟与中止标志四类特征，分类正常及部分拦截重发、探测器致盲、光纤窃听三类模拟攻击。\n2. 其卖点是用物理启发生成模型构建500万条平衡记录，全特征学习模型宏F1为0.8211–0.8243并优于双特征透明基线，且诊断显示QBER贡献最大、任何单特征均不能复现全特征性能。\n3. 在参数偏移的独立生成集上不重训时宏F1降至0.5645–0.5669，说明该框架支持受控合成场景的可解释取证分类，但内部稳定评估不足以确证工况变化下的可靠性，并可作为更广泛仿真与硬件日志评估的文档化基础。", "summary_source": "deepseek", "authors": [{"name": "Madhab Chandra Das"}, {"name": "Sajid Ahmed"}, {"name": "Uzair Hussain"}, {"name": "Van Vung Pham"}], "featured_authors": [{"name": "Madhab Chandra Das"}, {"name": "Sajid Ahmed"}, {"name": "Uzair Hussain"}, {"name": "Van Vung Pham"}], "author_count": 4}, {"id": "2610.25213", "category": "quant-ph", "title": "LiftDiff: Guided Discrete Diffusion for Quantum Code Construction", "abstract": "The realization of fault-tolerant quantum computation relies on Quantum Error-Correcting Codes (QECC). Of particular interest are codes that combine a high encoding rate with sufficient distance. Existing algebraic constructions, such as lifted product (LP) codes, build a large quantum low-density parity-check (qLDPC) code from a classical base matrix. In this work we introduce LiftDiff, a generative approach to the discovery of QECC. A discrete denoising diffusion model is trained to generate base matrices over the group algebra $\\mathbb{F}_2[\\mathbb{Z}_\\ell]$, which are then expanded into LP codes. The reverse diffusion process is guided by an energy function that evaluates quantum code properties, including girth, degree, sparsity and decoding performance, steering the sampler toward matrices that yield LP codes with favorable parameters. Our method discovers codes with parameters such as $[[169,13,11]]$, $[[143,15,9]]$, and $[[260,24,10]]$, including a $[[247,19,14]]$ code that achieves the highest ${kd^2}/{n}$ among the baselines. Moreover, several discovered codes outperform the Gross code across a broad range of the tested physical error rates under both code-capacity and circuit-level noise.", "url": "https://arxiv.org/abs/2610.25213", "type": "理论+数值", "summary": "1. 该工作提出LiftDiff，用离散去噪扩散模型生成群代数F2[Z_ℓ]上的基矩阵，再展开为lifted product量子LDPC码，以生成式搜索兼具高编码率与距离的量子纠错码。\n2. 其关键在于以评估围长、度数、稀疏性和解码性能的能量函数引导反向扩散，使采样偏向参数优良的LP码，并得到[[247,19,14]]等码，其中该码在基线中取得最高kd²/n。\n3. 所发现的多个码在码容量与线路级噪声下、较宽物理错误率范围内优于Gross码，表明能量引导的离散生成模型可补充传统代数构造，为面向实际噪声优化qLDPC码提供可检验路径。", "summary_source": "deepseek", "authors": [{"name": "Yotam Peled"}, {"name": "Eliya Nachmani"}], "featured_authors": [{"name": "Yotam Peled"}, {"name": "Eliya Nachmani"}], "author_count": 2}, {"id": "2610.25260", "category": "quant-ph", "title": "Spatial Discretization Error for Quantum Chemistry Simulation", "abstract": "Nonrelativistic quantum chemistry is based on the Schrödinger equation in continuous, unbounded space. Computational approaches on classical and quantum computers often truncate the spatial domain and introduce a finite-dimensional basis, reducing the continuum problem to a finite-dimensional one. There is therefore a fundamental question: to what extent does this approximation capture the original continuum problem? In this work, we develop a general Sobolev-Galerkin framework for estimating spatial discretization errors in quantum simulation with unbounded Hamiltonians. We apply this framework to many-body Coulomb systems and establish both periodization and Galerkin error estimates for wave-function dynamics and ground-state energies. For dynamics, the finite-basis projection error of the exact wave function does not capture the full basis-discretization error: an additional dynamical projection error enters our bound at a different rate, and we introduce an inner-product argument to control this contribution. Interestingly, the spatial convergence rates for wave-function dynamics and ground-state energies differ quantitatively. For ground-state energies, we establish a sharp $M^{-1}$ convergence rate at fixed cell size, where $M$ is the number of one-particle basis functions. We also show that a uniform $M^{-1}$ convergence rate is impossible for the corresponding real-time wave-function error with general $H^2$ initial data. The analysis relies on many-body Sobolev estimates with explicit polynomial dependence on system size. Combining these estimates with state-of-the-art quantum algorithms, we obtain, to our knowledge, the first rigorous end-to-end complexity bounds for quantum simulation of molecular and electronic dynamics with all spatial errors explicitly controlled. The number of basis functions is determined directly from the continuum problem, without regularization.", "url": "https://arxiv.org/abs/2610.25260", "type": "理论+数值", "summary": "1. 该工作构建Sobolev-Galerkin框架，用于估计无界Hamilton量量子模拟中的空间离散误差，并对多体Coulomb系统给出周期化与Galerkin的动力学及基态能量误差界。\n2. 其关键在于指出有限基投影误差不足以刻画完整离散误差，需用不同收敛阶的内积论证控制额外动力学投影误差；基态能量在固定元胞尺寸下具尖锐M^{-1}速率，而一般H^2初态的实时波函数误差不能达到统一M^{-1}速率，分析依赖显式多项式系统规模依赖的多体Sobolev估计。\n3. 结合先进量子算法，该工作给出首个所有空间误差显式受控的分子与电子动力学量子模拟严格端到端复杂度界，基函数数直接由连续问题确定而无需正则化，为量子化学模拟的离散化误差核算提供可推广路径。", "summary_source": "deepseek", "authors": [{"name": "Di Fang"}, {"name": "Jiaqi Zhang"}], "featured_authors": [{"name": "Di Fang"}, {"name": "Jiaqi Zhang"}], "author_count": 2}, {"id": "2610.25299", "category": "quant-ph", "title": "Fully quantum fidelity-based entropic continuity bounds", "abstract": "We present a continuity bound for quantum conditional entropies in terms of fidelity, with no dependence on the dimension of the conditioning system. Our results encompass both the von Neumann entropy and one version of sandwiched Rényi entropy, which is particularly relevant for applications in quantum key distribution (QKD). In such applications, this bound should provide improved results as compared to previous continuity bounds based on trace distance. We also show that the bounds can be sharpened as expected for classical-quantum states, and verify that they hold when the conditioning system has countably infinite dimension. Finally, we present several variants tailored for exponential functions of the Rényi entropies instead, which should be relevant for QKD applications.", "url": "https://arxiv.org/abs/2610.25299", "type": "理论", "summary": "1. 该工作给出了以保真度度量的量子条件熵连续性界，且界不依赖条件系统的维度，并覆盖冯·诺依曼熵与一种夹层Rényi熵。\n2. 其核心优点是相较基于迹距离的旧界可望在量子密钥分发中给出更紧结果，并证明经典-量子态下可如预期收紧、条件系统可数无限维时仍成立。\n3. 作者还给出针对Rényi熵指数函数的若干变体，为量子密钥分发中的安全性分析及相关有限维与无限维场景提供了更可直接使用的连续性工具。", "summary_source": "deepseek", "authors": [{"name": "Matthew Simon Tan"}, {"name": "Ernest Y.-Z. Tan"}], "featured_authors": [{"name": "Matthew Simon Tan"}, {"name": "Ernest Y.-Z. Tan"}], "author_count": 2}, {"id": "2610.25310", "category": "quant-ph", "title": "Anomalously fast heating of ground states in dephased $SU(N)$ spin systems", "abstract": "We identify a strong quantum Mpemba effect in which a many-body ground state heats faster than every Gibbs state at finite positive temperature under the same dissipative dynamics within a fixed-color sector. In ferromagnetic $SU(N)$ exchange systems with local dephasing, exact coherence shells confine the ground-state evolution and exclude all slower Liouvillian modes. Its relaxation rate is fixed by the bath, independently of system size, exchange graph, and integrability. We derive an energy-resolved sign criterion that guarantees a slower thermal contribution throughout the positive-temperature range. An exact finite-chain solution proves this rate inversion, and symmetry-resolved calculations confirm the criterion in larger spin-one chains, including nonintegrable exchange. The zero-temperature endpoint of a continuous Gibbs family can therefore be dynamically isolated by its exact exclusion from slow relaxation channels.", "url": "https://arxiv.org/abs/2610.25310", "type": "理论+数值", "summary": "1. 该文在局域去相位下的铁磁SU(N)交换自旋系统中识别出强量子姆潘巴效应：固定色扇区内多体基态在同一耗散动力学下比所有正温吉布斯态加热得更快。\n2. 其核心在于用精确相干壳层限制基态演化并排除所有更慢的Liouvillian模式，使弛豫速率仅由浴决定且与系统尺寸、交换图和可积性无关，并给出保证正温区热贡献更慢的能量分辨符号判据。\n3. 有限链精确解与自旋一链的对称性分辨计算验证了该速率反转，表明连续吉布斯族的零温端点可因被慢弛豫通道精确排除而被动力学隔离。", "summary_source": "deepseek", "authors": [{"name": "Tairan Lou"}, {"name": "Junxiao Chen"}, {"name": "Xiang-Ping Jiang"}, {"name": "Mingdi Xu"}, {"name": "Lei Pan"}], "featured_authors": [{"name": "Tairan Lou"}, {"name": "Junxiao Chen"}, {"name": "Xiang-Ping Jiang"}, {"name": "Mingdi Xu"}, {"name": "Lei Pan"}], "author_count": 5}, {"id": "2610.25334", "category": "quant-ph", "title": "Can Quantum Entanglement Increase the Capacity of a Classical Relay Channel?", "abstract": "We show positive and negative results on classical relay channels with entanglement assistance, revealing a sharp contrast between strictly causal and causal relay encoding. First, we consider van der Meulen's setting of a unit-delay relay, with strictly causal encoding. We show that the standard cutset upper bound continues to hold with entanglement assistance, and deduce that entanglement does not increase the capacity for several classes of relay channels. Second, we consider a zero-delay relay, where the encoding is causal. We present an example in which entanglement enables rates that exceed the cutset upper bound by at least 12.5%. Namely, entanglement shared between the source and relay significantly increases the capacity of a classical zero-delay relay channel.", "url": "https://arxiv.org/abs/2610.25334", "type": "理论", "summary": "1. 该文系统研究了纠缠辅助对经典中继信道容量的影响，区分严格因果编码与因果编码两种中继设定，并分别给出负向与正向结果。\n2. 核心结论是：在单位延迟且严格因果的中继场景中，标准割集上界在纠缠辅助下仍成立，多类信道容量不增；而在零延迟因果中继中构造出纠缠使速率至少超过割集上界12.5%的实例。\n3. 这表明纠缠能否提升经典中继容量取决于因果结构与时延约束，并为区分经典与量子资源在通信网络中的作用提供了明确判据。", "summary_source": "deepseek", "authors": [{"name": "Elsa Mizrahi"}, {"name": "Uzi Pereg"}], "featured_authors": [{"name": "Elsa Mizrahi"}, {"name": "Uzi Pereg"}], "author_count": 2}, {"id": "2610.25466", "category": "quant-ph", "title": "Squeezing and Decoherence of Axion Dark Matter", "abstract": "Bosonic particles beyond the Standard Model, such as axions, are among the leading candidates for dark matter. If such particles have a small mass, they are usually described as a purely classical field. However, it was recently shown that this description is incomplete: their inherent gravitational self-interactions can squeeze the field, producing a quantum feature beyond the classical description. Here we analyze squeezing of light dark matter in the presence of decoherence. We show that squeezing is continuously generated, and rapidly enough to survive dissipation, and may also remain present under thermal fluctuations and dephasing. Our results demonstrate that dark matter might possess persistent quantum features and motivate further investigation of their implications for dark matter detection.", "url": "https://arxiv.org/abs/2610.25466", "type": "理论", "summary": "1. 该文研究退相干存在时轻质量轴子暗物质的压缩演化，重点分析其引力自相互作用诱发的量子压缩如何受到耗散、热涨落和退相位的影响。\n2. 其核心在于，压缩由引力自相互作用持续产生，产生速率足够快而能在耗散下存活，并可能在热涨落与退相位下仍不被完全抹除。\n3. 这一结果说明暗物质可能具有可存续的量子特征，并提示在暗物质探测中需考虑压缩及其退相干效应，也为相关量子暗物质研究提供动机。", "summary_source": "deepseek", "authors": [{"name": "Vasileios Fragkos"}, {"name": "Igor Pikovski"}], "featured_authors": [{"name": "Vasileios Fragkos"}, {"name": "Igor Pikovski"}], "author_count": 2}, {"id": "2610.25520", "category": "quant-ph", "title": "Multiplicative Noise in Nanolaser Amplification: From Discrete Emission Events to the Additive-Noise Limit", "abstract": "Laser amplification kicks off with just a few photons in the cavity, a regime where standard additive Langevin noise cannot capture the real fluctuations. To understand how this amplification begins, we map out a single-mode photon-carrier model that links macroscopic lasers directly into nanolasers. Stationary rate equations reveal that stimulated emission takes over across a tight pump window. In nanolasers, however, spontaneous processes coexist across a much broader range. Because steady-state averages miss the individual events that lead to the macroscopic photon number, we frame the stochastic dynamics around the actual discrete transitions, deriving a state-dependent diffusion approximation. The destruction of an excited carrier concurrent with the generation of a photon creates a negative photon-carrier cross-correlation. This unavoidably leads to a correlated, multiplicative Gaussian-noise framework. We track the resulting discrete dynamics with an established, event-based Laser Markov Chain (LMC) which stochastically samples pump, relaxation, emission, and cavity-loss events keeping all physical quantities as non-negative integers. Comparing its predictions to those of our multiplicative model proves that the latter reproduces excellently well the statistical behavior of photons and carrier, as long as a continuous diffusion description holds. Once the emission drops into the few-photon regime, however, the discrete model becomes indispensable. On the other hand, at large photon counts relative fluctuations shrink to a level where the state-dependence of the diffusion matrix can be ignored, to leading order, thus returning to the classic Langevin description of the system's stochastic dynamics.", "url": "https://arxiv.org/abs/2610.25520", "type": "理论", "summary": "1. 该工作建立单模光子-载流子模型，将宏观激光与纳米激光放大统一描述，并从离散发射事件推导状态依赖的扩散近似，辅以事件驱动激光马尔可夫链进行随机采样和对照。\n2. 其核心卖点在于指出激发载流子湮灭与光子产生同时发生会形成负光子-载流子互相关，由此得到相关乘性高斯噪声框架；该框架在连续扩散描述成立时能准确复现光子与载流子的统计行为，而少光子发射区必须依赖离散模型。\n3. 最可辩护的启示是：大光子数下相对涨落减小使扩散矩阵的状态依赖在一阶近似下可忽略，从而自然回到经典朗之万加性噪声极限，为纳米激光跨噪声区间的建模提供统一依据。", "summary_source": "deepseek", "authors": [{"name": "G. Sonnino"}, {"name": "Ph. Peeters"}, {"name": "P. Nardone"}, {"name": "G.L. Lippi"}], "featured_authors": [{"name": "G. Sonnino"}, {"name": "Ph. Peeters"}, {"name": "P. Nardone"}, {"name": "G.L. Lippi"}], "author_count": 4}, {"id": "2610.25657", "category": "quant-ph", "title": "Quantum State Search with Classical Interactive Advice", "abstract": "We study whether a quantum verifier can find a hidden quantum state by exchanging classical messages with an unbounded prover who knows the state. The verifier has access to a reflection oracle about the target. For a Haar-random $n$-qubit target, we prove that achieving constant average fidelity with the target requires $(q+1)^2(B+1)=\\Omega(2^n)$, where $q$ is the number of verifier queries and $B$ is the total prover-to-verifier communication. The bound allows arbitrary classical interaction and unrestricted computation between queries. Our proof extends the lower bound of Aaronson and Kuperberg from a single classical proof to an arbitrary classical interaction. As a result, we obtain a quantum-oracle separation of UniqueQMA from QCIP with polynomially many classical messages. In particular, we give a unitary oracle $\\mathcal{U}$ such that there exists a language $L\\in\\mathrm{UniqueQMA}^{\\mathcal{U}}$ but $L\\notin\\mathrm{QCIP}^{\\mathcal{U}}$. We further give an oracle construction for a notion known as QMA-QCIP[2] gap problem. This gives average case hardness for a QMA language under classical access to a QCIP[2] decision oracle and is used in establishing negative results on witness encryption and quantum indistinguishability obfuscation.", "url": "https://arxiv.org/abs/2610.25657", "type": "理论", "summary": "1. 该文研究量子验证者借助与知晓目标态的全能证明者交换经典消息来寻找隐藏量子态，并证明对Haar随机n量子比特目标，达到常数平均保真度需满足$(q+1)^2(B+1)=\\Omega(2^n)$。\n2. 其核心卖点是将Aaronson–Kuperberg针对单份经典证明的下界推广到任意经典交互（查询间可任意计算），由此得到UniqueQMA与QCIP在多项式经典消息下的量子oracle分离。\n3. 该工作进一步构造出QMA–QCIP[2]间隙问题的oracle，给出QMA语言在经典访问QCIP[2]判定oracle下的平均情形困难性，并据此导出见证加密与量子不可区分混淆的否定性结论。", "summary_source": "deepseek", "authors": [{"name": "Mohammed Barhoush"}], "featured_authors": [{"name": "Mohammed Barhoush"}], "author_count": 1}, {"id": "2610.25792", "category": "quant-ph", "title": "Perturbation theory for quantum information quantities of Gaussian states", "abstract": "Many quantum-information tasks can benefit from Gaussian quantum resources, while their fundamental performance limits are characterized by quantum information quantities. However, a unified perturbation theory for these quantities directly within the Gaussian-state formalism has been lacking. We develop such a theory for the von Neumann entropy, quantum relative entropy, quantum Chernoff quantity, and quantum fidelity, using perturbations of the moments of a reference Gaussian state. Using general Fréchet-derivative identities, we derive compact second-order expressions for reference-state covariance matrices whose symplectic eigenvalues are all greater than $1/2$. We also show that the perturbative quantum Chernoff quantity is maximized at its symmetric point, yielding the quantum Chernoff exponent (QCE). We further show that symplectic eigenvalues equal to 1/2 can lead to slower asymptotic vanishing, potentially improving the corresponding fundamental performance limits. For reference-state covariance matrices containing symplectic eigenvalues both equal to and greater than 1/2, we identify sufficient conditions under which the former determine the leading covariance-matrix contributions, allowing the remaining modes to be traced out without changing the leading-order asymptotic scaling or the coefficient. Applying the framework to quantum illumination and incoherent-light sub-Rayleigh object discrimination, we recover known asymptotic QCEs directly within the Gaussian-state formalism. In the latter problem, the slower asymptotic vanishing explains the known quadratic scaling of the QCE with the source separation.", "url": "https://arxiv.org/abs/2610.25792", "type": "理论", "summary": "1. 该工作在高斯态形式体系内建立了针对冯·诺依曼熵、量子相对熵、量子Chernoff量与保真度的统一微扰理论，并基于参考态矩的微扰导出二阶展开。\n2. 其卖点是用Fréchet导数恒等式给出辛本征值均大于1/2的协方差矩阵的紧凑二阶表达式，证明微扰Chernoff量在对称点取极大并定义量子Chernoff指数，且指出辛本征值等于1/2可导致更慢的渐近消失、潜在提升性能极限。\n3. 将框架用于量子照明与非相干光亚瑞利目标分辨，可直接复现已知渐近Chernoff指数，并以更慢消失解释后者的二次标度，显示其对高斯量子资源极限分析的可推广价值。", "summary_source": "deepseek", "authors": [{"name": "Zihao Gong"}, {"name": "Saikat Guha"}], "featured_authors": [{"name": "Zihao Gong"}, {"name": "Saikat Guha"}], "author_count": 2}, {"id": "2610.25968", "category": "quant-ph", "title": "Efficient Block Encodings for Ensembles of Molecular Hamiltonians", "abstract": "Accurately characterizing molecular properties and reactivity often requires electronic-structure calculations across an ensemble of molecular geometries. Quantum algorithms that process such ensembles coherently could address this challenge, but they require Hamiltonian block encoding circuits that combine advanced factorization techniques with sublinear scaling in ensemble size. Here, we introduce SVD-THC, which extends tensor hypercontraction to sets of Hamiltonians defined at different nuclear geometries through a singular value decomposition of the ensemble. We use SVD-THC to construct a single multiplexed block encoding circuit for all geometries in an ensemble. We then evaluate the approach on ensembles generated by varying internal rotational coordinates in 1-bromo-2-chloroethane as well as in glycine and alanine dipeptides, corresponding to established model systems for peptide conformational landscapes, with up to 5,184 geometries. Across several resolutions of the internal-coordinate grids, the Toffoli complexity of the resulting circuits grows only weakly with the number of geometries, changing by at most 12\\% over grids that differ in size by up to 576$\\times$. In an energy-thresholding circuit, this yields 35--200$\\times$ fewer Toffoli gates than slicing together single-geometry block encodings. This approach could help make coherent processing of molecular geometry ensembles a useful primitive for fault-tolerant quantum computing.", "url": "https://arxiv.org/abs/2610.25968", "type": "理论+数值", "summary": "1. 该工作提出 SVD-THC，将张量超收缩推广到不同核构型下的分子哈密顿量集合，并构造覆盖整个集合的单一复用块编码电路。\n2. 其核心是对集合做奇异值分解以共享因子，并在多达5184个构型的溴氯乙烷、甘氨酸与丙氨酸二肽上表明 Toffoli 复杂度随构型数仅弱增长，网格规模差576倍时变化不超过12%。\n3. 在能量阈值电路中，该编码相较拼接单构型块编码减少35–200倍 Toffoli 门，显示相干处理构型集合可成为容错量子计算的实用原语。", "summary_source": "deepseek", "authors": [{"name": "Cristian L. Cortes"}, {"name": "Andrew J. Jenkins"}, {"name": "William Pol"}, {"name": "Dario Rocca"}, {"name": "Mark Steudtner"}, {"name": "Gian-Luca R. Anselmetti"}, {"name": "Matthias Degroote"}, {"name": "Nikolaj Moll"}, {"name": "Raffaele Santagati"}, {"name": "Michael Streif"}, {"name": "Markus R. Hermann"}], "featured_authors": [{"name": "Cristian L. Cortes"}, {"name": "Andrew J. Jenkins"}, {"name": "William Pol"}, {"name": "Raffaele Santagati"}, {"name": "Michael Streif"}, {"name": "Markus R. Hermann"}], "author_count": 11}, {"id": "2610.26052", "category": "quant-ph", "title": "HyQ-LC: Improving Light-Curve Classification with Hybrid Quantum--Classical Learning", "abstract": "Light curves reveal stellar variability and support studies of stellar evolution and cosmic distances. Reliable classification is therefore important for large time-domain surveys. We present HyQ-LC for ten-class stellar light-curve classification using 359 handcrafted features and 633,034 training objects. The main model combines a window multilayer perceptron (MLP) backbone with a nine-qubit readout using amplitude encoding and angle re-uploading. Both this hybrid and its pure-MLP control have 44,238 parameters. On a shared 20,000-object test set, the hybrid has macro-averaged F1 (Macro-F1) point gains of 0.8276 and 1.2393 percentage points over the pure MLP on two fine-tuning seeds. A separate fixed-fusion configuration achieves slightly higher Macro-F1 but lower accuracy than approximately budget-matched LightGBM. Its positive class-level differences are concentrated in CEP, RRC, and ROT, while the full-budget LightGBM reference scores higher on both metrics. All circuits are simulated classically. The comparisons retain existing validation-selected checkpoints and use the same test objects, with features, predictions, and recomputation code publicly available. The results identify point-estimate improvements over the tested controls while leaving the specific contribution of the quantum branch unresolved.", "url": "https://arxiv.org/abs/2610.26052", "type": "理论+数值", "summary": "1. 该工作提出HyQ-LC，用359个手工特征和633,034个样本对十类恒星光变曲线分类，模型以窗口MLP骨干连接九量子比特振幅编码与角度重上传读出。\n2. 在与纯MLP同为44,238参数下，共享2万测试集上两个微调种子分别获得0.8276和1.2393个百分点的Macro-F1提升；固定融合较预算匹配LightGBM的Macro-F1略高但准确率更低，正类差异集中于CEP、RRC和ROT，而全预算LightGBM两项指标更高，且电路均经典模拟。\n3. 这些点估计改进尚不能厘清量子分支的具体贡献，但公开特征、预测与重算代码可用于后续严格消融与复现。", "summary_source": "deepseek", "authors": [{"name": "Xinghang Yu"}, {"name": "Bin Yang"}], "featured_authors": [{"name": "Xinghang Yu"}, {"name": "Bin Yang"}], "author_count": 2}, {"id": "2610.26120", "category": "quant-ph", "title": "Multi-path Security in Quantum Networks with Trusted Nodes", "abstract": "Quantum communication networks promise information-theoretic security but this security collapses if intermediate relay nodes are compromised, a risk that grows sharply when compromised nodes cannot be identified. We address this twofold: first, we show that multi-path routing provides quantifiable protection against unidentified compromised nodes. Second, we provide a comprehensive statistical and graph-theoretic analysis of network and node security under compromise, covering full and partial node compromise, optimal placement of additional edges via an iterative method, and comparative hacking-probability analysis across network topologies. Together, these results identify the topology and multi-path routing strategy that most improves security for a given network. We apply this framework to quantum key distribution across multiple network topologies, demonstrating a scalable route to secure, reliable quantum communication under realistic, unidentified adversarial threats, without relying on quantum memory.", "url": "https://arxiv.org/abs/2610.26120", "type": "理论", "summary": "1. 该工作针对中继节点被攻陷且无法识别时量子网络安全失效的问题，量化了多路径路由对未识别恶意节点的防护能力，并从统计与图论角度系统分析完全及部分节点攻陷下的网络与节点安全性，包括迭代加边优化与不同拓扑间被攻陷概率的对比。\n2. 其核心卖点是在给定网络下同时确定最优拓扑与多路径路由策略，把额外链路的迭代布设与攻击概率比较纳入统一框架，并在多种拓扑上验证量子密钥分发，且不依赖量子存储。\n3. 这为在节点身份不可辨识的现实对抗环境下构建可扩展、可靠的安全量子通信网络提供了定量设计准则。", "summary_source": "deepseek", "authors": [{"name": "Muhammad Kumail Haider"}, {"name": "Aeysha Khalique"}], "featured_authors": [{"name": "Muhammad Kumail Haider"}, {"name": "Aeysha Khalique"}], "author_count": 2}, {"id": "2610.26126", "category": "quant-ph", "title": "Enhanced charging in open Rab
