educe corrections to the regular long-time collective diffusion coefficients from the direct correlations between the interacting particles and determine these effective diffusion coefficients analytically for a number of hard-particle systems, including mixtures of hard spheres, as well as isotropic and nematic phases of uniaxial spherocylinders and biaxial spherotriangles. Finally, we discuss how to generalize our approach to systems with positional order and suggest a possible application to predicting relaxation times of orientational order parameters.", "url": "https://arxiv.org/abs/2610.26721", "type": "理论+数值", "summary": "1. 该工作将描述各向异性硬粒子混合物时间演化的动力学密度泛函理论简化为扩散方程，并解析求得多组分硬球、单轴球柱及双轴球三角在各向同性或向列相中的有效集体扩散系数。\n2. 其核心卖点是由相互作用粒子的直接关联修正长时间集体扩散系数，从而在无需完整动力学密度泛函数值演化的情况下给出可解析处理的动力学弛豫描述。\n3. 该框架可推广到具有位置序的体系，并为预测取向序参量的弛豫时间提供了可检验的理论线索。", "summary_source": "deepseek", "authors": [{"name": "Anouar El Moumane"}, {"name": "G. H. Philipp Nguyen"}, {"name": "Klaus Mecke"}, {"name": "Hartmut Löwen"}, {"name": "René Wittmann"}], "featured_authors": [{"name": "Anouar El Moumane"}, {"name": "G. H. Philipp Nguyen"}, {"name": "Klaus Mecke"}, {"name": "Hartmut Löwen"}, {"name": "René Wittmann"}], "author_count": 5}, {"id": "2610.26736", "category": "cond-mat", "title": "Phase-sensitive quantum-state texture during thermalization of a Dzyaloshinskii-Moriya Heisenberg dimer", "abstract": "We investigate quantum-state texture during the thermal relaxation of an anisotropic spin-$1/2$ Heisenberg dimer subject to a longitudinal magnetic field and a Dzyaloshinskii-Moriya (DM) interaction. Starting from local transverse and longitudinal couplings to a bosonic bath, we construct a global weak-coupling Lindblad equation, identify its transition channels, and discuss the applicability and limitations of the secular approximation. The Gibbs state is obtained explicitly in the local spin basis, revealing that the DM coupling controls both the modulus and phase of the single-excitation coherence by modifying the energy splitting and rotating the chiral phase. For heating and cooling protocols, we compare rugosity, fidelity-based texture, and trace-distance texture with coherence, vector spin chirality, and purity. The relaxation dynamics separates population thermalization from the decay and precession of deliberately prepared energy-basis coherence. Their combined contribution to local coherence produces DM-dependent texture overshoots and, during cooling, damped oscillations and sign changes of the coherence quadratures. These transients differ from the evolution of coherence magnitude and purity, while trace-distance texture weights them differently from the overlap-based quantifiers. Calculations at reduced dissipation preserve the texture maxima within the secular model. The results identify a phase-sensitive diagnostic of relaxation.", "url": "https://arxiv.org/abs/2610.26736", "type": "理论+数值", "summary": "1. 该工作构建全局弱耦合Lindblad方程，研究纵向磁场与DM相互作用下各向异性自旋-1/2海森堡二聚体热弛豫中的量子态纹理，并在加热/冷却协议下比较纹理量与相干、矢量自旋手性和纯度。\n2. 其核心在于显式Gibbs态表明DM耦合通过修正能级劈裂并旋转手性相位同时控制单激发相干的模与相位，使布居热化与能量基相干的衰减和进动分离，进而产生DM依赖的纹理过冲及冷却时相干正交分量的阻尼振荡与变号。\n3. 这提供了一种相位敏感的热化诊断，且约化耗散下世俗模型仍保留纹理极大值，为开放自旋二聚体热弛豫的表征与后续实验检验提供明确启发。", "summary_source": "deepseek", "authors": [{"name": "Onofre Rojas"}, {"name": "Zhirayr Adamyan"}, {"name": "Fadwa Benabdallah"}, {"name": "Vadim Ohanyan"}], "featured_authors": [{"name": "Onofre Rojas"}, {"name": "Zhirayr Adamyan"}, {"name": "Fadwa Benabdallah"}, {"name": "Vadim Ohanyan"}], "author_count": 4}, {"id": "2610.26806", "category": "cond-mat", "title": "Capillary forces between two identical spherical particles", "abstract": "The properties of colloidal suspensions and granular matter change drastically upon adding a small amount of liquid capable of forming capillary bridges between the solid particles. The attractive forces exerted by these liquid bridges induce the formation of particle aggregates and networks, which radically changes the macroscopic mechanical and rheological behaviour. Predicting these forces across bridge sizes, particle separations and wettability is therefore central to particle-scale modelling of capillary suspensions and wet granular matter. While the Young-Laplace equation governing the properties of the liquid bridges is well known, it lacks a convenient analytical solution. Current simulations therefore employ approximate analytic expressions, typically developed for contact angles below ~40° and bridge volumes below ~2.5% of the solid particle's volume. We compare several frequently used expressions from the literature with numerical solutions of the theoretical capillary forces. An overall good agreement is observed in the aforementioned parameter ranges, while the approximate expressions start to deviate outside their intended domains. We propose accurate and computationally efficient expressions for the capillary force that model this behaviour, for contact angles from 5° to 80° and bridge volumes from $10^{-6}$ to 0.15. We also explore mesoscopic 'fluid-scale' simulations of bridges by Multi-body Dissipative Particle Dynamics (MDPD), to ascertain whether this coarse-grained fluid model faithfully captures the continuum capillary forces. Remarkably, a good agreement is observed even for liquid bridges described by a mere few dozen fluid particles. Together, these results offer two approaches, at different resolution scales, for simulating bridges over a wide range of bridge volumes and contact angles.", "url": "https://arxiv.org/abs/2610.26806", "type": "理论+数值", "summary": "1. 该工作系统比较了文献中常用的毛细桥力近似表达式与杨-拉普拉斯数值解，并检验多体耗散粒子动力学对连续毛细力的再现能力。\n2. 其核心贡献是给出接触角5°–80°、桥体积10⁻⁶–0.15范围内准确且计算高效的毛细力表达式，并发现仅含数十个流体粒子的粗粒化桥仍能与连续理论定量吻合。\n3. 这为跨越不同分辨率的毛细悬浮体与湿颗粒物质模拟提供了可操作方案，并提示粗粒化流体模型在极小桥尺度下仍具定量可靠性。", "summary_source": "deepseek", "authors": [{"name": "Stefano Onofri"}, {"name": "Thejas Hulikal Chakrapani"}, {"name": "Stefan Luding"}, {"name": "Elke Scholten"}, {"name": "Ahmed Jarray"}, {"name": "Wouter K. den Otter"}], "featured_authors": [{"name": "Stefano Onofri"}, {"name": "Thejas Hulikal Chakrapani"}, {"name": "Stefan Luding"}, {"name": "Elke Scholten"}, {"name": "Ahmed Jarray"}, {"name": "Wouter K. den Otter"}], "author_count": 6}, {"id": "2610.26858", "category": "cond-mat", "title": "Kondo Lattice model for field induced triplet pairing in CeRh$_2$As$_2$", "abstract": "Spin triplet superconductors are of interest because of their topological properties, and their robustness to high magnetic fields. CeRh$_2$As$_2$ is a unique heavy fermion superconductor with both even-parity and candidate odd-parity superconducting phases with a special feature enabling a field induced phase transition between the two. The field induced transition which switches the parity of the Cooper pairs is enabled by a staggered antisymmetric spin orbit coupling (ASOC) interaction. However, the heavy fermion origins of the superconductivity in CeRh$_2$As$_2$ and the origin of the antisymmetric spin-orbit coupling are currently unexplored. Here, we develop a Kondo lattice model for CeRh$_2$As$_2$ and demonstrate how local hybridization between Cerium $d$- and $f$-orbitals, driven by the locally broken inversion symmetry, at the Cerium sites generates the ASOC. The resulting Kondo lattice model leads to nearly degenerate even and odd parity superconducting states that display a field induced parity transition between an even-parity state and an odd-parity pseudospin triplet state. We discuss the wider implications of our results extended to other heavy fermion systems like CeSiI.", "url": "https://arxiv.org/abs/2610.26858", "type": "理论", "summary": "1. 该工作针对CeRh2As2构建Kondo晶格模型，用Ce位点局域d-f杂化解释局域反演对称破缺如何产生交错反对称自旋轨道耦合，并联系其重费米子超导起源。\n2. 该模型给出近简并的偶宇称与奇宇称超导态，并在磁场下实现从偶宇称到奇宇称赝自旋三重态的宇称转变，这是其核心物理卖点。\n3. 该结果将场致宇称转变归因于局域杂化与Kondo物理，为CeSiI等其他重费米子体系中探索三重态超导与拓扑性质提供启发。", "summary_source": "deepseek", "authors": [{"name": "Indra Gankhuyag"}, {"name": "Piers Coleman"}], "featured_authors": [{"name": "Indra Gankhuyag"}, {"name": "Piers Coleman"}], "author_count": 2}, {"id": "2610.26859", "category": "cond-mat", "title": "Boundary-Sensitive Quantum Order on Non-Amenable Lattices", "abstract": "We show that quantum systems on non-amenable lattices, whose boundaries constitute an extensive fraction of the system, host novel forms of bulk ordering with no Euclidean counterpart. Combining boundary-retaining iDMRG with an exact symmetry-fixing duality, we investigate $p<5$ state clock models on the coordination-3 infinite Cayley tree. We find that between the ordered and disordered phases lies an emergent intermediate phase with bulk order induced by an arbitrarily weak boundary field rather than by conventional spontaneous symmetry-breaking. This establishes boundary-sensitive order as a distinct quantum ordering mechanism defying Landau's spontaneous symmetry-breaking paradigm. The intermediate phase realizes a bulk-boundary correspondence in which the unpolarized boundary selects a specific ordered bulk state.", "url": "https://arxiv.org/abs/2610.26859", "type": "理论", "summary": "1. 该工作结合保留边界的iDMRG与精确对称固定对偶，在配位数为3的无限Cayley树上研究p<5态钟模型，刻画非顺从格点上的边界敏感量子序。\n2. 其核心在于发现有序与无序相之间存在涌现中间相：任意弱边界场即可诱导体序，而非依赖传统自发对称破缺，并实现未极化边界选择特定体有序态的体-边界对应。\n3. 这确立边界敏感序为超越朗道自发对称破缺范式的独立量子有序机制，并为边界占比显著的非顺从格点体系提供研究启示。", "summary_source": "deepseek", "authors": [{"name": "Xingzhi Wang"}, {"name": "Zohar Nussinov"}, {"name": "Gerardo Ortiz"}], "featured_authors": [{"name": "Xingzhi Wang"}, {"name": "Zohar Nussinov"}, {"name": "Gerardo Ortiz"}], "author_count": 3}, {"id": "2610.26862", "category": "cond-mat", "title": "On Higher-Form Fracton Hydrodynamics with Momentum Conservation", "abstract": "Momentum conservation is common in fluids, yet it may be incompatible with the hydrodynamics of theories with exotic conservation laws (such as fracton hydrodynamics) unless symmetries are spontaneously broken. Using the Martin-Siggia-Rose (MSR) effective field theory formalism, we develop a representation-theoretic framework for the hydrodynamics of translationally invariant systems with exotic conservation laws without spontaneous symmetry breaking. Under mild assumptions on the form of hydrodynamics, we show that such theories must satisfy two representation theoretic consistency conditions and a generalized Gauss's law constraint. Higher-form symmetries satisfy these conditions and we derive their ideal hydrodynamics; in three dimensions, the one-form case produces ideal non-relativistic magnetohydrodynamics. Finally, we prove that no other theories are compatible with momentum conservation in SO(3) nor SO($d$), for sufficiently large odd $d$.", "url": "https://arxiv.org/abs/2610.26862", "type": "理论", "summary": "1. 该文利用MSR有效场论建立表示论框架，研究平移不变、无自发对称破缺且具动量守恒的非常规守恒律流体力学。\n2. 其核心是给出两个表示论一致性条件与广义高斯定律约束，证明高形式对称性满足条件并导出理想流体力学，三维一形式情形对应非相对论理想磁流体力学。\n3. 该框架为含动量守恒的分形子与高形式流体力学提供分类判据，并表明在SO(3)及足够大奇维SO(d)下不存在其他兼容动量守恒的理论。", "summary_source": "deepseek", "authors": [{"name": "Ben Bobell"}, {"name": "Rahul Nandkishore"}, {"name": "Andrew Lucas"}], "featured_authors": [{"name": "Ben Bobell"}, {"name": "Rahul Nandkishore"}, {"name": "Andrew Lucas"}], "author_count": 3}, {"id": "2610.24062", "category": "hep-th", "title": "Light EFT Strings and Asymptotic Accelerated Expansion", "abstract": "We study the interplay among towers of particles, EFT strings, and EFT membranes near perturbative infinite-distance limits of four-dimensional $\\mathcal{N}=1$ theories. We show that the scaling vectors of EFT membranes lie in the lattice generated by those of the EFT strings, as previously found for particle towers, and determine their specific relative scaling in F-theory and Type IIA Calabi-Yau compactifications. We then leverage these objects to assess the viability of asymptotic accelerated expansion in flux compactifications. While our bottom-up analysis does not yield a general obstruction, we rule out two candidate accelerating trajectories in F-theory because an EFT string becomes lighter than the Hubble scale, invalidating the four-dimensional EFT. This closes the loophole found in arXiv:2209.11821 . We also study how recent results on quantum obstructions to $\\mathcal{N}=1$ infinite-distance limits may provide a concrete resolution by changing the asymptotic form of the Kähler potential.", "url": "https://arxiv.org/abs/2610.24062", "type": "理论", "summary": "1. 该文在四维N=1理论的微扰无限距离极限附近，系统研究粒子塔、有效场论弦与膜的标度结构，并用其检验通量紧化中渐近加速膨胀的可行性。\n2. 其核心结果是有效场论膜的标度向量落在由有效场论弦标度向量生成的格中，并在F理论与IIA型卡拉比-丘紧化中确定相对标度，进而发现F理论两条候选加速轨迹因有效场论弦质量低于哈勃标度而使四维有效场论失效。\n3. 这虽未给出自下而上的普遍阻碍，却排除了具体候选轨迹并闭合既有漏洞，同时提示量子阻碍可通过改变渐近凯勒势得到具体化解。", "summary_source": "deepseek", "authors": [{"name": "Veronica Collazuol"}, {"name": "Alessandra Grieco"}, {"name": "Irene Valenzuela"}], "featured_authors": [{"name": "Veronica Collazuol"}, {"name": "Alessandra Grieco"}, {"name": "Irene Valenzuela"}], "author_count": 3}, {"id": "2610.24072", "category": "hep-th", "title": "Angular Momentum Loss at Fourth Post-Minkowskian Order", "abstract": "We calculate the total loss of angular momentum for a gravitational scattering of two non-spinning point-like objects at $\\mathcal{O}(G^4)$. Our methodology combines use of both amplitudes and worldline-based methods. We derive the integrand from two copies of the gravitational waveform with cuts on massive lines arising naturally from the worldline. We then glue these two copies and evaluate the resulting phase-space integrals using reverse unitarity, in the amplitudes spirit. We obtain separately the radiated angular momentum and the static contribution that, at this order, is entirely determined by the initial shear and the linear memory. Combining these two terms, we derive relativistic expressions for the angular momentum loss and for the infrared-finite component of the mass dipole loss, which in the low-velocity limit match results available in the literature. We also use this result to derive the conservative deflection angle at $\\mathcal{O}(G^5)$ and first self-force order.", "url": "https://arxiv.org/abs/2610.24072", "type": "理论", "summary": "1. 该工作计算了两个无自旋点状物体引力散射在O(G^4)阶的总角动量损失，并结合辐射角动量与静态贡献给出相对论表达式及质量偶极损失的红外有限部分。\n2. 其技术卖点在于将振幅方法与世界线方法结合，由两份引力波形的乘积构造被积函数，并利用逆幺正性计算相空间积分，从而在第四后闵可夫斯基阶分离出辐射项与由初始剪切、线性记忆决定的静态项。\n3. 该结果在低速极限下与已有文献一致，并可进一步导出O(G^5)及一阶自作用力阶的保守偏转角，为高阶引力散射和辐射反作用研究提供了可检验的输入。", "summary_source": "deepseek", "authors": [{"name": "Alessandro Georgoudis"}, {"name": "Carlo Heissenberg"}, {"name": "Gustav Mogull"}, {"name": "Rodolfo Russo"}], "featured_authors": [{"name": "Alessandro Georgoudis"}, {"name": "Carlo Heissenberg"}, {"name": "Gustav Mogull"}, {"name": "Rodolfo Russo"}], "author_count": 4}, {"id": "2610.24073", "category": "hep-th", "title": "On the Positivity of de Sitter Group Averaging", "abstract": "Perturbative quantum gravity about a global de Sitter (dS$_d$) background involves constraints that restrict the state of the linearized theory but which appear only at higher orders in perturbation theory. In particular, for familiar gravitational theories with $d>2$ these constraints require all charges defined by continuous de Sitter isometries to vanish in the linearized state. While standard Fock spaces have the property that the only normalizable state satisfying these constraints is the vacuum, Higuchi suggested that this lack of allowed states should be remedied by instead using the so-called group-averaging inner product. This inner product satisfies important uniqueness conditions, but its positivity has to date remained an open question. For $d > 2$, we establish this positivity here for all such states with $N$ particles (including particles of arbitrary spin) in standard global dS${}_d$ modes where the particle-weights $\\Delta_i$ satisfy the condition ${\\rm Re} \\, \\sum_{i=1}^N \\Delta_i > d-1$, which is the criterion for group averaging to converge absolutely for arbitrary finite linear combinations of such states. We also treat the case of bosonic and fermionic (integer and half-integer spin) particles in dS$_2$ as a toy model for the more general case. However, we can identify certain classes of states for which group averaging continues to converge absolutely for smaller weights. Interestingly, in some cases these smaller-weight states turn out to have {\\it negative} group-averaging norms. We thus also discuss the implications of this observation for perturbative de Sitter quantum gravity.", "url": "https://arxiv.org/abs/2610.24073", "type": "理论", "summary": "1. 该工作证明：在 \\(d>2\\) 的全局 de Sitter 模式中，对于任意粒子数 \\(N\\)、任意自旋以及满足 \\(\\mathrm{Re}\\sum_{i=1}^N\\Delta_i>d-1\\) 的权重，群平均内积为正。\n2. 其核心在于把群平均的绝对收敛判据与该权重条件对应起来，并以 \\(dS_2\\) 中玻色子和费米子作为玩具模型，同时发现某些更小权重的绝对收敛态可具有负的群平均范数。\n3. 这确立了群平均方案在微扰 de Sitter 量子引力中适用于一大类态，而负范数例子则提示需重新审视小权重态及该方案的适用边界。", "summary_source": "deepseek", "authors": [{"name": "Donald Marolf"}, {"name": "Xuyang Yu"}], "featured_authors": [{"name": "Donald Marolf"}, {"name": "Xuyang Yu"}], "author_count": 2}, {"id": "2610.24084", "category": "hep-th", "title": "Wrapping M5-branes on a non-spin manifold: Spin$^h$ structures and AdS$_7$ black holes", "abstract": "We construct a solution of seven-dimensional maximal gauged supergravity of the form AdS$_2\\times M_5$, where $M_5$ is the five-dimensional Wu manifold $SU(3)/SO(3)$. The solution is supersymmetric, despite the fact that the Wu manifold admits neither a spin structure nor a spin$^c$ structure. Rather, it admits a spin$^h$ structure, wherein the ill-definedness of ordinary spinors due to a minus sign in their holonomy is compensated by a further minus sign arising through the spinors carrying $SO(3)$ Yang-Mills charge, in a half-integer isospin representation of the $SU(2)$ double cover of the $SO(3)$. We show how the configuration can be lifted to a solution of $D=11$ supergravity of the form AdS$_2\\times M_9$, where $M_9$ is the unit tangent bundle of the Wu manifold. We discuss the geometry and topology of $M_9$, and study the supersymmetry from the eleven-dimensional standpoint. We extend the seven-dimensional solution to a black hole, and discuss some aspects of its holographic interpretation and the UV to IR flow. We revisit a previously-known AdS$_2\\times H^3\\times H^2$ solution, and its UV to IR flow, showing that the flow equations in fact admit of an exact solution. Additionally, we give a detailed discussion of the lift of the AdS$_2\\times S^5$ solution to $D=11$, exhibiting similarities and differences between the properties of its internal space $M_9$ (the unit tangent bundle of $S^5$) and the Wu manifold example of our main discussion. We also construct the non-compact dual of the Wu manifold solution, where $M_5$ is taken to be $SL(3,\\mathbb R)/SO(3)$.", "url": "https://arxiv.org/abs/2610.24084", "type": "理论", "summary": "1. 该文在七维最大规范超引力中构造了AdS2×M5解，其中M5为Wu流形SU(3)/SO(3)，并给出其十一维AdS2×M9提升及黑洞推广。\n2. 核心在于该流形无spin与spin^c结构，而超对称通过spin^h结构实现：SO(3)规范荷在半整数同位旋表示中产生的额外负号补偿了普通旋量完整群中的负号。\n3. 这为研究非spin内空间上的超对称紧化、AdS2全息与UV-IR流提供了明确的几何拓扑范例，并可用于比较S5切丛及非紧对偶SL(3,R)/SO(3)的情形。", "summary_source": "deepseek", "authors": [{"name": "Okan Günel"}, {"name": "Cameron Gibson"}, {"name": "C.N. Pope"}], "featured_authors": [{"name": "Okan Günel"}, {"name": "Cameron Gibson"}, {"name": "C.N. Pope"}], "author_count": 3}, {"id": "2610.24111", "category": "hep-th", "title": "Topological deformations of local gauge theories: a presymplectic BV-AKSZ approach", "abstract": "The same local degrees of freedom can be described by systems with different gauge structure and field content. Standard examples are the duality between the scalar field and the 2-form gauge field in four dimensions, and unimodular gravity, where the cosmological constant becomes a global degree of freedom. In a precise sense, the spaces of gauge-inequivalent formal solutions of such systems differ by a finite-dimensional sector. Moreover, because their gauge sectors are different, their consistent interactions and their sensitivity to the global structure of spacetime may differ substantially. We show that such systems are naturally related by what we call topological deformations: gauging a symmetry of generic degree couples the system to a BF-type sector without introducing new local degrees of freedom. The construction is carried out systematically within the presymplectic BV-AKSZ approach, where it amounts to a modification of the underlying presymplectic gauge PDE. Gauging degree-0 symmetries identifies solutions related by global symmetries, which reproduces the scalar--2-form and principal chiral model--Freedman--Townsend dualities. Gauging degree-1 symmetries, i.e. deformations, gives rise to new global degrees of freedom, such as the cosmological constant in unimodular gravity.", "url": "https://arxiv.org/abs/2610.24111", "type": "理论", "summary": "1. 该文引入“拓扑形变”概念并在预辛BV-AKSZ框架内系统构造，用以联系规范结构与场内容不同但定域自由度相同的规范理论，并指出其规范不等价形式解空间仅相差有限维扇区。\n2. 核心机制是对给定阶数的对称性做规范化：系统耦合一个BF型扇区而不新增定域自由度，在预辛规范PDE层面表现为底层结构的修改；零阶规范化重现标量—2形式对偶与主手征模型—Freedman—Townsend对偶，一阶规范化则给出幺模引力中宇宙学常数一类的新整体自由度。\n3. 这表明此类理论的一致相互作用及其对时空整体结构的敏感性可被系统比较，为对偶性与形变理论的构造和判别提供统一出发点。", "summary_source": "deepseek", "authors": [{"name": "Ivan Dneprov"}, {"name": "Alexey Donchenko"}, {"name": "Maxim Grigoriev"}], "featured_authors": [{"name": "Ivan Dneprov"}, {"name": "Alexey Donchenko"}, {"name": "Maxim Grigoriev"}], "author_count": 3}, {"id": "2610.24127", "category": "hep-th", "title": "Gravitational Cheshire effect from Yang-Mills instantons", "abstract": "We show that the dimensional reduction of four-dimensional Yang-Mills instantons naturally gives rise to nontrivial matter configurations in three dimensions exhibiting an unusual mechanism of gravitational screening. Starting from Euclidean Yang-Mills theory, we reduce (anti-)self-dual gauge configurations along a compact direction generated by a $U(1)$ isometry of the instanton background. Under this reduction, the gauge connection decomposes into a three-dimensional Yang-Mills field and an adjoint Higgs field, while the metric gives rise, as usual, to a dilaton and an Abelian gauge connection. For instantons on the Taub-NUT background, the reduced fields organize themselves into two mutually screening pairs: the backreaction of the Abelian sector cancels internally, and the same occurs independently in the non-Abelian sector. As a result, the full matter content supports a composite stealth configuration on flat three-dimensional space. By contrast, the dimensional reduction of instantons on the Eguchi-Hanson background yields a non-Abelian matter sector whose gravitational backreaction cancels, while the Abelian sector remains gravitationally active and therefore deforms the three-dimensional background geometry. These examples reveal a direct connection between four-dimensional (anti-)self-duality and three-dimensional BPS-type relations, and illustrate how instantonic sectors that are gravitationally invisible in four dimensions can descend into either fully composite stealth configurations or partially stealth matter configurations after dimensional reduction.", "url": "https://arxiv.org/abs/2610.24127", "type": "理论", "summary": "1. 该文将四维杨-米尔斯瞬子沿由背景U(1)等距生成的紧致方向做维数约化，构造出具有引力屏蔽的三维物质组态。\n2. 核心结果是规范场约化为三维杨-米尔斯场与伴随希格斯场、度规约化为伸缩子与阿贝尔规范场后，Taub-NUT瞬子给出阿贝尔与非阿贝尔扇区各自内部抵消的复合隐身组态，而Eguchi-Hanson瞬子仅非阿贝尔物质反作用抵消、阿贝尔扇区仍使三维背景变形。\n3. 该对应揭示了四维(反)自对偶性与三维BPS型关系之间的联系，并提示四维引力不可见瞬子扇区约化后可落为完全或部分隐身物质，为设计屏蔽引力反作用的多场构型提供思路。", "summary_source": "deepseek", "authors": [{"name": "Borja Diez"}], "featured_authors": [{"name": "Borja Diez"}], "author_count": 1}, {"id": "2610.24176", "category": "hep-th", "title": "Landscape of Higgs vacua in 5d $\\mathcal{N}=1$", "abstract": "Strongly coupled 5d $\\mathcal{N}=1$ gauge theories have a Higgs branch of their moduli space of vacua, identified by 1/2-BPS operators and their algebraic relations. For $SU(N_c)_k$ theories, we map the moduli space across different phases and we establish how the Chern-Simons level $k$ deforms the chiral ring relations among mesons, baryons, and instantons, while determining specific patterns of symmetry enhancement. For $SO(N_c)$ theories, we construct the corresponding chiral ring constraints at infinite coupling. Finally, we identify the Higgs branch as a classical integrable system, through the expansion of the chiral ring in terms of action variables.", "url": "https://arxiv.org/abs/2610.24176", "type": "理论", "summary": "1. 该文系统研究了强耦合五维 N=1 规范理论的 Higgs 真空模空间，利用 1/2-BPS 算符及其代数关系刻画 Higgs 分支，并映射 SU(N_c)_k 理论不同相区的模空间结构。\n2. 其核心在于揭示 Chern-Simons 能级 k 如何形变介子、重子与瞬子间的手征环关系，并给出对称性增强模式，同时在无限耦合下构造 SO(N_c) 理论的手征环约束。\n3. 作者进一步将 Higgs 分支识别为经典可积系统，通过手征环按作用量变量展开，为相关真空结构与可积描述建立直接联系。", "summary_source": "deepseek", "authors": [{"name": "Amihay Hanany"}, {"name": "Elias Van den Driessche"}], "featured_authors": [{"name": "Amihay Hanany"}, {"name": "Elias Van den Driessche"}], "author_count": 2}, {"id": "2610.24227", "category": "hep-th", "title": "Covariant One-Loop Corrections from a Non-Covariant Expansion: The Scalar Field Case", "abstract": "We compute the one-loop correction to the non-minimal coupling of a scalar field theory to gravity, induced by a quartic self-interaction. We adopt the non-covariant framework of linearized gravity and explicitly compute the corresponding Feynman diagram, including both the divergent and the finite parts. The corresponding contribution to the one-loop effective action is obtained by the requirement of covariance and compared with the known results obtained by the heat kernel technique. We study the running of the non-minimal coupling, its UV and IR limit and verify the validity of the decoupling theorem in the momentum subtraction scheme of renormalization. The linearized gravity approach is also used for deriving the effective potential for the scalar field and its covariant version is stated. The agreement with results derived using strictly covariant methods is verified and highlights the versatility of the linearized gravity approach.", "url": "https://arxiv.org/abs/2610.24227", "type": "理论", "summary": "1. 该工作在线性化引力的非协变框架下，显式计算了由标量场四次自相互作用诱导的、对标量场与引力非最小耦合的一阶单圈修正，并包含发散与有限部分。\n2. 其技术关键是由协变性要求重构单圈有效作用量的相应贡献，与热核方法结果对照，进而分析非最小耦合的跑动、紫外与红外极限，并在动量减除方案中检验退耦定理。\n3. 该线性化引力途径还被用于推导标量场有效势并给出其协变形式，与严格协变方法的一致性表明其可作为一种通用且可检验的单圈计算策略。", "summary_source": "deepseek", "authors": [{"name": "Lucas Ducastelo de C. C. Lima"}, {"name": "Riccardo Fecchio"}], "featured_authors": [{"name": "Lucas Ducastelo de C. C. Lima"}, {"name": "Riccardo Fecchio"}], "author_count": 2}, {"id": "2610.24272", "category": "hep-th", "title": "Bosonization for the Schwinger effect at small fermion mass: analytic formula for the 1+1D current in an arbitrary time-dependent, inhomogeneous electric field", "abstract": "We derive an analytic formula for the expectation value of the current due to Schwinger pair-production in an arbitrary time-dependent, spatially inhomogeneous external electric field in 1+1 dimensions, as a perturbative expansion in the fermion mass $m$. We work to order $m^2$, finding contributions at order $m^0$, $m^2 \\log m$ and $m^2$; there is no contribution at $O(m)$. The calculation is enabled by a new ``hybrid method'' using bosonization, where part of the calculation is performed on the fermion side and part is performed on the boson side. The fermion side allows us to define the vacuum using the free theory in the infinite past, while the boson side allows us to compute the current without regularization, since the current operator is linear in the boson field. In the special case of a spatially homogeneous background field, we also perform the calculation purely on the fermion side using adiabatic regularization. The detailed agreement of the results provides a highly non-trivial check of the duality.", "url": "https://arxiv.org/abs/2610.24272", "type": "理论", "summary": "1. 该工作在一维一加一维中，针对任意时间依赖且空间非均匀的外电场，按小费米子质量微扰展开推导了Schwinger对产生电流期望值的解析公式，并计算至m²阶。\n2. 其核心是新的混合玻色化方法：在费米子侧用无穷远过去的自由理论定义真空，在玻色子侧利用电流算符线性于玻色场而无需正则化；均匀场下与绝热正则化结果的一致提供了强非平凡检验。\n3. 该结果给出了非均匀时变场中Schwinger效应的解析基准，并展示了玻色化对偶在小质量展开下的可检验性，可启发后续解析与数值研究。", "summary_source": "deepseek", "authors": [{"name": "Samuel E. Gralla"}, {"name": "Morifumi Mizuno"}], "featured_authors": [{"name": "Samuel E. Gralla"}, {"name": "Morifumi Mizuno"}], "author_count": 2}, {"id": "2610.24496", "category": "hep-th", "title": "Gravity as Large Scale Structure: Families of CFTs and the Higher-Spin Gap", "abstract": "We observe an apparently universal behavior in large $N$ conformal field theory (CFT) in $d\\geq 2$ dimensions: the single-trace, higher-spin gap obeys the parametric bound $\\Delta_{\\rm gap} \\lesssim (\\delta c)^{1/d}$, where $\\delta c$ is the central charge increment between successive theories. The origin of this bound is explained heuristically, using a generalized notion of branes that interpolate between conformal points in theory space. Seeking a more precise framework for this picture leads to the central concept of families of CFTs, which tacitly underlies various features and puzzles of AdS/CFT. We develop a working definition of families, with inspiration from families of $L$-functions in number theory, and formulate a family-level version of the gap bound. Interpreted holographically for families of AdS$_{d+1}$ vacua, this bound, when applicable, rules out Planckian scale separation, constrains the size and number of extra dimensions, and explains simple scaling patterns in string/M-theory. It also accounts for why all known large $N$ vector models have a bounded gap.", "url": "https://arxiv.org/abs/2610.24496", "type": "理论", "summary": "1. 该工作在 \\(d\\ge2\\) 的大 \\(N\\) 共形场论中观察到单迹高自旋能隙满足 \\(\\Delta_{\\rm gap}\\lesssim(\\delta c)^{1/d}\\) 的普适标度界，并引入受数论 \\(L\\)-函数族启发的 CFT 族概念及族级能隙界。\n2. 其核心卖点是把相邻共形点间中心荷增量 \\(\\delta c\\) 与高自旋能隙联系起来的族级框架，并借助广义膜插值给出启发式解释，使该界在全息 AdS\\(_{d+1}\\) 真空族中可直接约束普朗克尺度分离与额外维尺寸和数目。\n3. 这一图景可解释弦/M 理论中的简单标度规律及已知大 \\(N\\) 矢量模型能隙有界，并为系统整理 AdS/CFT 中的族结构与真空约束提供可检验的出发点。", "summary_source": "deepseek", "authors": [{"name": "Eric Perlmutter"}], "featured_authors": [{"name": "Eric Perlmutter"}], "author_count": 1}, {"id": "2610.24594", "category": "hep-th", "title": "Strong generation of the chiral algebra of $\\mathcal N=4$~$SU(N)$ super Yang--Mills theory", "abstract": "The Schur sector of four-dimensional $\\mathcal N=4$ super Yang--Mills theory contains infinitely many protected operators, while the invariant polynomials of a single adjoint scalar are organized by finitely many Casimir degrees. I prove that the small $\\mathcal N=4$ short multiplets built from these invariants strongly generate the associated chiral algebra, thereby establishing the $SU(N)$ case of the strong-generation conjecture of Beem et al. For every $N\\ge2$, all field components associated with degrees $2,\\ldots,N$ suffice, in every conformal weight and every degree of the standard relative quantum BRST cohomology. The proof brings together cyclic trace cohomology, quantum lifting, and an arbitrary-degree quartic--odd transport identity. Exact field relations and a finite-rank Newton obstruction exclude every additional lowest space, including non-scalar flavor representations; the required normal-ordering corrections and BRST primitives are derived explicitly. The resulting completeness theorem explains how a finite family of supersymmetric multiplets organizes an unbounded quantum spectrum. Every Schur class is a normal polynomial in their components and derivatives, even when its gauge-theory representative involves fermions and arbitrarily many derivatives. This supplies a uniform set of local inputs for meromorphic operator products, bounds protected state multiplicities before cancellations in an index, and gives an algebraic account of the finite-rank reorganization of protected trace operators.", "url": "https://arxiv.org/abs/2610.24594", "type": "理论", "summary": "1. 该文证明Beem等强生成猜想在N=4 SU(N)超杨-米尔斯中成立：由次数2至N的卡西米尔不变量构成的小N=4短多重态强生成舒尔手征代数。\n2. 证明结合循环迹上同调、量子提升与任意次四次-奇传输恒等式，并用精确场关系和有限秩牛顿障碍排除额外最低空间（含非标量味表示），显式给出正规序修正与BRST原语。\n3. 完备性定理表明有限多重态可组织无界量子谱，每个舒尔类是其分量与导数的正规多项式，为亚纯算符乘积提供统一局域输入，并在指标抵消前约束受保护态重数。", "summary_source": "deepseek", "authors": [{"name": "Yifan He"}], "featured_authors": [{"name": "Yifan He"}], "author_count": 1}, {"id": "2610.24698", "category": "hep-th", "title": "Holomorphic extremal surfaces for pseudoentropy in dS/CFT", "abstract": "We formulate the extremization problem for codimension-two hypersurfaces in de Sitter space in holomorphic coordinates, with real anchoring conditions at future infinity. The resulting equation ($K^I=0$) describes complex bulk realizations extending the usual piecewise Hartle--Hawking construction. We compute holographic pseudoentropy for harmonic deformations of spherical regions of arbitrary size and dimension, confirming its universal expansion through second order in the deformation parameter. The result is independent of the integration contour within each homology class on the complexified extremal surface. Inequivalent classes, labeled by an integer associated with a discrete global-coordinate isometry, differ by a sign of the universal term in odd boundary dimensions and by real finite shifts in even dimensions. For conical defects in dS$_3$ parametrized by a Schwarzschild-dS mass, we also verify the first law of pseudoentropy and the persistence of contour degeneracy within each homology class.", "url": "https://arxiv.org/abs/2610.24698", "type": "理论", "summary": "1. 该工作在全纯坐标中构造dS时空中余二维超曲面的极值问题，并在未来无穷远施加实锚定条件，得到复体实现所满足的\\(K^I=0\\)方程，从而推广分段Hartle–Hawking构造。\n2. 其技术要点在于对任意大小和维度的球面区域作调和形变并计算全息赝熵，验证到形变参数二阶的普适展开，且结果在同一复化极值面同调类内与积分围道无关，不同同调类由离散整体坐标等距整数标记，在奇/偶边界维分别表现为普适项符号差与实有限平移。\n3. 对以Schwarzschild–dS质量参数化的dS\\(_3\\)锥形缺陷，作者进一步检验赝熵第一定律及同调类内围道简并的持续性，这为dS/CFT中复极值面与赝熵的普适结构提供了可检验的启发。", "summary_source": "deepseek", "authors": [{"name": "Giorgos Anastasiou"}, {"name": "Ignacio J. Araya"}, {"name": "Avijit Das"}, {"name": "Javier Moreno"}], "featured_authors": [{"name": "Giorgos Anastasiou"}, {"name": "Ignacio J. Araya"}, {"name": "Avijit Das"}, {"name": "Javier Moreno"}], "author_count": 4}, {"id": "2610.24754", "category": "hep-th", "title": "Bootstrapping Fermionic Veneziano Amplitudes from Regge Zeros", "abstract": "We extend the Regge-zero bootstrap of the Veneziano amplitude to tree-level scattering with external fermions. We consider the colour-ordered four-point amplitude of a massless scalar and a massless spin-$\\frac12$ fermion, in which fermionic resonances appear in the $s$-channel and bosonic resonances in the $t$-channel. Factoring out a spinor structure that carries the little-group weight of the amplitude, we bootstrap the resulting reduced amplitude, whose residues in each channel vanish at Regge zeros controlled by the trajectory of the opposite channel. Assuming ultrasoft Regge behaviour and that the residues have no zeros other than Regge zeros, we show that both Regge trajectories are linear and that the maximal spins grow with the level as $J_F=n+\\frac12$ and $J_B=m+1$. Duality between the fermionic- and bosonic-pole expansions then fixes the reduced amplitude to a Beta function, up to its normalisation and the ratio of the two Regge slopes. Requiring the fermionic and bosonic spectra to be degenerate equates the slopes, and the resulting amplitude coincides with the open superstring amplitude.", "url": "https://arxiv.org/abs/2610.24754", "type": "理论", "summary": "1. 该工作将Veneziano振幅的Regge零点自举推广到含外部费米子的树级散射，针对无质量标量与无质量自旋1/2费米子的色序四点振幅，在剥离小群自旋结构后对约化振幅实施自举。\n2. 其关键在于利用各道留数在由对道轨迹控制的Regge零点处消失、假定超软Regge行为且无非Regge零点，导出两条Regge轨迹线性及最大自旋J_F=n+1/2、J_B=m+1，并由费米—玻色极点展开对偶将约化振幅固定为Beta函数（至归一化和斜率比）。\n3. 进一步要求费米与玻色谱简并可使两斜率相等，所得振幅与开超弦振幅一致，表明Regge零点自举可为含费米子弦振幅及谱简并提供约束性判据。", "summary_source": "deepseek", "authors": [{"name": "Pongwit Srisangyingcharoen"}], "featured_authors": [{"name": "Pongwit Srisangyingcharoen"}], "author_count": 1}, {"id": "2610.24978", "category": "hep-th", "title": "Complex spinodals and supercritical crossovers in Kerr-Newman-AdS$_4$ black holes", "abstract": "We study supercritical crossovers in four-dimensional Kerr-Newman-AdS black holes at fixed angular momentum and charge. From the exact enthalpy, we prove uniqueness of the physical critical point and positivity of the quartic Landau coefficient throughout the charge-rotation family, treating the uncharged Kerr-AdS endpoint in separate scaling variables. An exact quartic reduction determines the coexistence entropies and latent heat throughout the subcritical regime. Above criticality, the two physical spinodals continue as a complex conjugate pair. Their real temperature projection defines a Widom-type line, and varying the charge-rotation ratio assembles these lines into a crossover surface. The Landau cusp fixes the imaginary entropy and temperature to scale with the square root and three-halves powers of the pressure displacement from criticality. The projected fold and the local heat capacity ridge share a critical tangent. We derive their leading quadratic temperature separation and prove that the ridge lies at a higher temperature near criticality. Exact endpoint solutions and numerical continuation check these predictions. The cusp exponents are common to the family, while the crossover temperature depends on the thermodynamic criterion used to define it.", "url": "https://arxiv.org/abs/2610.24978", "type": "理论", "summary": "1. 该工作在固定角动量和电荷下研究四维Kerr-Newman-AdS黑洞的超临界交叉，基于精确焓证明物理临界点唯一与四阶Landau系数正性，并用精确四阶约化给出亚临界共存熵和潜热。\n2. 其核心是把临界点上方两个物理旋节线延拓为复共轭对，以实温度投影定义Widom型线并随电荷-旋转比组成交叉面，并由Landau尖点确定虚熵、虚温度随压力偏离的1/2与3/2标度。\n3. 该结果揭示投影折点与局域热容脊共享临界切线且近临界时热容脊温度更高，为辨析不同热力学判据下的交叉温度及推广带电旋转AdS黑洞相图提供依据。", "summary_source": "deepseek", "authors": [{"name": "Bum-Hoon Lee"}, {"name": "Hocheol Lee"}, {"name": "Somyadip Thakur"}], "featured_authors": [{"name": "Bum-Hoon Lee"}, {"name": "Hocheol Lee"}, {"name": "Somyadip Thakur"}], "author_count": 3}, {"id": "2610.25439", "category": "hep-th", "title": "The Anyon Atlas", "abstract": "We classify possible topological quantum field theories in 2+1 dimensions with up to 22 anyons in the bosonic case and up to 26 in the fermionic case, through the modular data of modular and supermodular tensor categories. We construct such data via congruence representations of $\\mathrm{SL}(2,\\mathbb{Z})$ using a numerical optimization algorithm that scales to high rank. We chart the relations between the resulting theories, including anyon condensations and Chern-Simons realizations. We find examples of modular data that do not appear to arise from any Chern-Simons theory by any sequence of condensations of anyons or gaugings of ordinary global symmetries. These examples give qualitatively new topological quantum field theories, which go beyond any notion of gauge theory. For examples in this class with 11 and 12 anyon types, we solve the pentagon and hexagon equations explicitly, showing that these modular data are realized by full unitary topological quantum field theories. We also introduce this https URL , an online resource for exploring the data.", "url": "https://arxiv.org/abs/2610.25439", "type": "理论", "summary": "1. 该工作通过模与超模张量范畴的模数据，对2+1维玻色情形至多22个任意子、费米情形至多26个任意子的拓扑量子场论进行分类。\n2. 卖点在于以SL(2,ℤ)同余表示和可扩展至高阶的数值优化构造模数据，绘制任意子凝聚与Chern-Simons实现关系，并发现无法由Chern-Simons经任意子凝聚或普通全局对称性规范化得到的模数据。\n3. 对含11和12个任意子类型的例子显式求解五边形与六边形方程，表明这些模数据可由完整幺正拓扑量子场论实现，为超越规范理论的新拓扑相提供具体候选。", "summary_source": "deepseek", "authors": [{"name": "Jonah Berean-Dutcher"}, {"name": "Clay Cordova"}, {"name": "Julio Parra-Martinez"}, {"name": "Richard Tuddenham"}], "featured_authors": [{"name": "Jonah Berean-Dutcher"}, {"name": "Clay Cordova"}, {"name": "Julio Parra-Martinez"}, {"name": "Richard Tuddenham"}], "author_count": 4}, {"id": "2610.25567", "category": "hep-th", "title": "Remarks on the Parameter Dependence of QCD$_{2A}$", "abstract": "Recently it was shown that there are only a few operators that contribute to the (very weak) $N_c$ dependence of the spectrum of two-dimensional adjoint QCD. We provide numerical evidence that none of these operators is dominant. In other words, all operators are necessary to guarantee the faithful representation of the Hamiltonian, resulting in, for instance, exact degeneracies of certain multi-particle state masses. We provide a complete list of interactions between single- and multi-trace states, which differ by trace-number block, as expected from the Kutasov-Schwimmer universality. The completed list allows for a targeted deformation of the theory to render some masses $N_c$-invariant. Nonetheless, we argue that a small amount of $N_c$ dependence of the theory is unavoidable. We also investigate the large constituent mass regime $m^2/g^2_{\\rm YM}N_c\\gg 1$ of the theory at large $N_c$ in the eLCQ approach. We find, among other things, that as the constituent mass grows, eigenstates get purer in parton number, in line with expectations.", "url": "https://arxiv.org/abs/2610.25567", "type": "理论", "summary": "1. 该工作针对二维伴随QCD，数值检验谱的Nc依赖所涉算符，并在eLCQ框架下考察大组分质量极限，同时整理单迹与多迹态之间的完整相互作用表。\n2. 其卖点在于给出没有单一算符主导微弱Nc依赖的证据，说明所有算符均为忠实表示哈密顿量所必需，从而保证特定多粒子态质量的精确简并，并与Kutasov-Schwimmer普适性预期的按迹数分块结构相符。\n3. 这允许利用完整相互作用表对理论作定向形变以使部分质量Nc无关，但少量Nc依赖仍不可避免；大组分质量下本征态趋于更纯的部分子数，为相关谱结构提供了可检验启示。", "summary_source": "deepseek", "authors": [{"name": "Uwe Trittmann"}], "featured_authors": [{"name": "Uwe Trittmann"}], "author_count": 1}, {"id": "2610.25669", "category": "hep-th", "title": "Non-Riemannian Holography: Long Strings and Soft Hair", "abstract": "We propose an $\\mathbf{O}(D,D)$-covariant holographic dictionary for two bulk completions of the Gomis--Ooguri boundary data: Riemannian $AdS_3$ supported by pure NS--NS flux and an everywhere non-Riemannian string Newton--Cartan geometry. An $\\mathbf{O}(D,D)$-covariant Codazzi identity yields the boundary conservation law. Both branches share diagonal generalized-metric one-point functions, but only the non-Riemannian branch carries independent normalizable soft hair that couples to long strings without contributing to surface charges or the renormalized on-shell action. Supersymmetric non-Riemannian saddles admit arbitrary chiral Killing-spinor profiles, realizing \"supersupersymmetry.\"", "url": "https://arxiv.org/abs/2610.25669", "type": "理论", "summary": "1. 该文提出一个O(D,D)协变的全息字典，用于Gomis–Ooguri边界数据的两种体实现：纯NS–NS通量支撑的黎曼型AdS₃与处处非黎曼型的弦Newton–Cartan几何。\n2. 其核心卖点是由O(D,D)协变Codazzi恒等式导出边界守恒律，并表明只有非黎曼型分支携带独立可归一化软毛，软毛与长弦耦合却不贡献表面荷或重整化在壳作用量。\n3. 超对称非黎曼型鞍点允许任意手征Killing旋量分布并实现“超超对称”，这为长弦软毛及非黎曼型全息对应提供了可进一步检验的结构性启示。", "summary_source": "deepseek", "authors": [{"name": "Shaun D. Hampton"}, {"name": "Hyun-Cheol Kim"}, {"name": "Jae-Hyuk Oh"}, {"name": "Jeong-Hyuck Park"}], "featured_authors": [{"name": "Shaun D. Hampton"}, {"name": "Hyun-Cheol Kim"}, {"name": "Jae-Hyuk Oh"}, {"name": "Jeong-Hyuck Park"}], "author_count": 4}, {"id": "2610.25685", "category": "hep-th", "title": "Subsystem quantum Rényi-Bhattacharyya distance in 2D CFTs and its holographic applications", "abstract": "We develop a systematic method to compute the subsystem fidelity and Rényi fidelity in two-dimensional conformal field theories (CFTs) from the operator product expansion of twist operators, and apply it to the subsystem quantum Bhattacharyya distance (BD) and Rényi-Bhattacharyya distance (RBD). We validate the method against exact results in the free massless fermion and boson theories, and then use it to compute the BD and RBD in holographic CFTs between two heavy primary states, between two thermal states, and between a heavy primary state and a thermal state. When the two states differ in their classical, order-$c$ data, the distances are of order $c$, and the states are distinguishable already at the level of classical gravity; when the leading data coincide, the distances are of order $1/c$ at every order of the short interval expansion, so that the distinguishability becomes a perturbative quantum gravity effect. For a heavy primary state and its thermal counterpart, the leading contribution to the BD appears at order $\\ell^8$ and is of order $c^0$, whereas the RBD is generically of order $c$, in line with the earlier finding that a heavy primary state and a thermal state share the same order-$c$ entanglement entropy but have different order-$c$ Rényi entropies in the short interval expansion.", "url": "https://arxiv.org/abs/2610.25685", "type": "理论", "summary": "1. 该工作基于扭结算符的算符乘积展开建立了在二维共形场论中系统计算子系统保真度与雷尼保真度的方法，并用于巴塔查里亚距离及雷尼-巴塔查里亚距离。\n2. 其卖点是以自由无质量费米子与玻色子的精确结果校验方法，并在全息共形场论中区分经典引力可分辨的c量级距离与领头数据重合时各阶短区间展开均为1/c量级的微扰量子引力效应，同时发现重初态与热态间巴塔查里亚距离首个贡献在ℓ^8阶为c^0量级而雷尼-巴塔查里亚距离一般为c量级。\n3. 这为用子系统保真度类量探测全息对偶中的经典与量子引力贡献、并区分纠缠熵相同而雷尼熵不同的态提供了可计算判据。", "summary_source": "deepseek", "authors": [{"name": "Yihao Wang"}, {"name": "Jiaju Zhang"}], "featured_authors": [{"name": "Yihao Wang"}, {"name": "Jiaju Zhang"}], "author_count": 2}, {"id": "2610.25940", "category": "hep-th", "title": "The long-range Ising CFT: perturbative and nonperturbative approaches", "abstract": "The long-range Ising model is the prototype of criticality with power-law interactions. In each dimension its interacting critical points form a one-parameter family of nonlocal conformal field theories, weakly coupled at both ends but not in between. We study this family in one, two and three dimensions from several independent directions. We extend the expansion about the generalized free field from three to eight loops and expand about the short-range end. We show that Hamiltonian truncation applies to this nonlocal theory once a truncation artifact is corrected. Where they can be compared, the resummed expansions, Hamiltonian truncation, the numerical renormalization group and Monte Carlo simulations agree on the dimension of the leading $\\mathbb{Z}_2$-even scalar at the sub-percent level, as universality requires.", "url": "https://arxiv.org/abs/2610.25940", "type": "理论", "summary": "1. 该工作系统研究了1、2、3维长程Ising模型临界点所构成的一参数非局域共形场论族，联合使用广义自由场与短程端微扰展开、哈密顿量截断、数值重正化群和蒙特卡洛方法。\n2. 其核心卖点在于将广义自由场展开推进到八圈、修正截断伪影后使哈密顿量截断适用于非局域理论，并证明多方法给出的领头Z2偶标量维数在亚百分之一水平一致。\n3. 这为中间耦合区非局域CFT谱与长程普适性提供了可检验基准，并启示可将该截断方案推广到其他强长程相互作用临界体系。", "summary_source": "deepseek", "authors": [{"name": "Zechuan Zheng"}], "featured_authors": [{"name": "Zechuan Zheng"}], "author_count": 1}, {"id": "2610.25969", "category": "hep-th", "title": "Higher-Dimensional Test of the Holographic Dual of Entanglement Cohomology", "abstract": "We extend the holographic test of entanglement cohomology from $d=2$ to higher-dimensional conformal field theories. For a $d$-dimensional CFT with a spherical entangling region $A$, the vacuum modular Hamiltonian is known explicitly, and the boundary relative entropy of a primary-operator perturbation can be computed via conformal Ward identities. On the bulk side, the perturbation is dual to a scalar field in AdS$_{d+1}$, and the bulk canonical energy is computed using the JLMS relation. We carry out the computation explicitly for $d=3$ and $d=4$ and find that the boundary and bulk results agree at first order in the perturbation, with identical coefficients $\\kappa_d \\Delta^2 / C_T$, where $\\kappa_3 = \\pi^2/12$ and $\\kappa_4 = 3\\pi^3/16$. The result extends the quantitative verification of the holographic dual of entanglement cohomology beyond the $d=2$ case treated in the companion paper and confirms that the modular Hamiltonian perturbation is the correct holographic image of the first entanglement cohomology class. We discuss the role of the conformal anomaly, the shape of the entanglement wedge, and an outlook on TsT-deformed backgrounds. \\keywords{Entanglement entropy \\and Cyclic cohomology \\and von Neumann algebras \\and Holography \\and Modular Hamiltonian}", "url": "https://arxiv.org/abs/2610.25969", "type": "理论", "summary": "1. 该文将纠缠上同调的全息检验从二维推广到更高维共形场论，并针对球形纠缠区域的一阶原初算符微扰，在d=3与d=4情形显式比较边界相对熵与体正则能量。\n2. 其技术要点是用共形Ward恒等式计算边界量、用JLMS关系计算AdS_{d+1}中标量场的体正则能量，并发现两者在一阶微扰下给出相同系数κ_d Δ²/C_T，其中κ_3=π²/12、κ_4=3π³/16。\n3. 这一定量吻合确认模哈密顿量微扰正是第一纠缠上同调类的全息像，并为讨论共形反常、纠缠楔形状及TsT形变背景提供了出发点。", "summary_source": "deepseek", "authors": [{"name": "R.C.Rashkov"}], "featured_authors": [{"name": "R.C.Rashkov"}], "author_count": 1}, {"id": "2610.25972", "category": "hep-th", "title": "One-loop unifying relations between Yang-Mills theory and the nonlinear sigma model from Berends-Giele currents", "abstract": "We study unifying relations between Yang-Mills theory and the nonlinear sigma model. We extend tree-level amplitude relations expressed through differential operators to off-shell multiparticle currents and obtain one-loop integrand relations by sewing two off-shell legs. This off-shell approach may also apply to higher-loop integrands.", "url": "https://arxiv.org/abs/2610.25972", "type": "理论", "summary": "1. 该工作系统研究Yang-Mills理论与非线性sigma模型之间的统一关系，将树级振幅中由微分算子表述的关系推广到离壳多粒子流，并缝合两条离壳腿得到单圈被积函数关系。\n2. 其核心卖点是借助离壳多粒子流把树级振幅关系直接提升到单圈被积函数层面，为处理壳外自由度与圈图拼接提供了统一框架。\n3. 该离壳策略原则上可推广至更高圈被积函数，提示两类理论间的统一关系可通过多粒子流在圈图层面系统延拓。", "summary_source": "deepseek", "authors": [{"name": "Zhenhua Guo"}, {"name": "Xin Yan"}], "featured_authors": [{"name": "Zhenhua Guo"}, {"name": "Xin Yan"}], "author_count": 2}, {"id": "2610.26014", "category": "hep-th", "title": "Hubble Susceptibility: Beyond Effective-Mass Spectroscopy in the Cosmological Collider", "abstract": "In this note, we introduce the Hubble susceptibility of cosmological-collider masses, encoded in the scale dependence of the squeezed-limit oscillation. Heavy fields generically receive Hubble-induced mass corrections during inflation, and we show that the local oscillation frequency and its drift can disentangle such corrections from an intrinsic mass contribution at leading slow-roll and adiabatic order.", "url": "https://arxiv.org/abs/2610.26014", "type": "理论", "summary": "1. 该文在宇宙学对撞机框架中提出“哈勃敏感度”这一观测量，用挤压极限振荡的尺度依赖来刻画重场质量在暴胀期间所受的哈勃诱导修正。\n2. 其技术要点在于利用局域振荡频率及其漂移，在领头慢滚与绝热阶把哈勃诱导质量修正与本征质量贡献区分开，从而超越仅测量有效质量的谱学。\n3. 这为将挤压极限振荡作为区分有效质量与哈勃诱导修正的探针提供了框架，并启发在宇宙学对撞机中系统刻画重场质量的起源。", "summary_source": "deepseek", "authors": [{"name": "Shuntaro Aoki"}, {"name": "Masahide Yamaguchi"}], "featured_authors": [{"name": "Shuntaro Aoki"}, {"name": "Masahide Yamaguchi"}], "author_count": 2}, {"id": "2610.26092", "category": "hep-th", "title": "Millicharged particles and the degree-3 Prouhet-Tarry-Escott problem", "abstract": "We use geometry to solve a problem in arithmetic relevant for physics. Namely, for any $m$ we find all integer solutions to the equations $\\sum_{i=1}^m x_i^k = \\sum_{i=1}^m y_i^k$, where $k \\in \\{1,2,3\\}$; this seems to be new for $m \\geq 5$. In physics, these are the anomaly cancellation conditions for models with $m$ fermions which can be naturally light and carry small electric charges (a.k.a. millicharged or minicharged particles). The small charges arise by kinetic mixing of the Standard Model $U(1)$ gauge symmetry with an unbroken non-chiral (a.k.a. vector-like) $U(1)$ and the masses are suppressed by a spontaneously-broken chiral $U(1)$.", "url": "https://arxiv.org/abs/2610.26092", "type": "理论", "summary": "1. 该工作借助几何方法完整求出任意m下∑x_i^k=∑y_i^k（k=1,2,3）的所有整数解，并指出m≥5情形此前未见。\n2. 其卖点是把这些解直接解释为m个可自然很轻、带微小电荷费米子的反常抵消条件，其中小电荷源于标准模型U(1)与未破缺矢量U(1)的动力学混合，质量由自发破缺手征U(1)压低。\n3. 这为系统构造与检验毫电荷粒子模型提供了完整的算术分类和几何视角，并可启发针对相应参数空间的实验搜索。", "summary_source": "deepseek", "authors": [{"name": "Ben Gripaios"}], "featured_authors": [{"name": "Ben Gripaios"}], "author_count": 1}, {"id": "2610.26177", "category": "hep-th", "title": "Quantum Noise from Massive Lorentz--Violating Gravitons: Interferometer Signatures in Very Special Linear Gravity", "abstract": "In this work we analyse under the Very Special Linear Gravity framework, which introduces a gauge invariant massive graviton with two polarizations, possible signatures of gravitons in a classical gravitational detector. Following the Vernon approach we found dissipative terms consistent with other works and extra terms of order of the graviton mass squared. The model also presents a characteristic feature when a squeezed state is considered. In such case, a contribution that distinguishes the sign of the squeezing phase is present.", "url": "https://arxiv.org/abs/2610.26177", "type": "理论", "summary": "1. 该工作在Very Special Linear Gravity框架下，分析具有两种极化的规范不变有质量引力子在经典引力探测器（干涉仪）中可能留下的量子噪声印记。\n2. 其核心结果是按Vernon方法得到与既有工作一致的耗散项及正比于引力子质量平方的额外贡献，并在压缩态下出现可区分压缩相位正负的特征项。\n3. 这为利用干涉仪探测有质量、洛伦兹破坏的引力子信号提供了可检验的噪声通道，并提示压缩光相位可作为甄别此类新物理的判据。", "summary_source": "deepseek", "authors": [{"name": "Jorge Alfaro"}, {"name": "Alex Soto"}, {"name": "Alessandro Santoni"}], "featured_authors": [{"name": "Jorge Alfaro"}, {"name": "Alex Soto"}, {"name": "Alessandro Santoni"}], "author_count": 3}, {"id": "2610.26197", "category": "hep-th", "title": "Quantum Relaxation Dynamics of Vacuum Energy from Pre-Geometric Gravity", "abstract": "We investigate a quantum relaxation mechanism for the vacuum energy density arising from the spontaneous symmetry breaking (SSB) $SO(1,4)\\to SO(1,3)$, driven by a Higgs field $\\Phi$ in a MacDowell--Mansouri pre-geometric gravity framework. The theory predicts a countably infinite set of vacua, corresponding to distinct topological sectors, for a periodic Higgs potential with intervening barriers. This structure gives rise to a series of dualities and see-saw relations connecting fundamental scales---the Planck mass and the Cosmological Constant---to topological parameters such as the Gauss-Bonnet coupling and the $\\theta$-term, all of which emerge only after SSB. A striking consequence is the quantization of the vacuum energy into discrete levels. Starting from a vacuum expectation value $\\langle \\Phi\\rangle = v_1$ associated with a large vacuum energy, the system evolves via quantum tunneling through the infinite landscape of minima. Crucially, we demonstrate that the transition probability is maximized for the ordered sequence $ \\Lambda_1 > \\cdots > \\Lambda_k > \\cdots$, where the Cosmological Constant decreases monotonically toward the asymptotic attractor $\\Lambda_\\infty = 0$.", "url": "https://arxiv.org/abs/2610.26197", "type": "理论", "summary": "1. 该文在麦克道尔–曼苏里预几何引力框架下，研究希格斯场驱动SO(1,4)→SO(1,3)自发破缺所引发的真空能量子弛豫动力学。\n2. 其卖点在于周期希格斯势给出可数无限个拓扑真空，破缺后浮现普朗克质量、宇宙学常数与高斯–博内耦合及θ项之间的对偶和跷跷板关系，使真空能量子化为离散能级，且沿Λ单调递减序列的隧穿概率最大并趋近Λ∞=0。\n3. 这为宇宙学常数弛豫提供了由拓扑真空量子隧穿逐步逼近零真空能的机制，并提示高斯–博内耦合与θ项等拓扑参数可能在早期真空演化中留下印记。", "summary_source": "deepseek", "authors": [{"name": "Andrea Addazi"}], "featured_authors": [{"name": "Andrea Addazi"}], "author_count": 1}, {"id": "2610.26218", "category": "hep-th", "title": "Boundary preparation of strong Mpemba states in holography", "abstract": "Finite boundary drives ending at the same charge density can select different relaxation channels. We demonstrate this in a probe Abelian--Higgs model on a fixed AdS black brane with a stable normal endpoint. Charge exchange during preparation modifies scalar propagation and source coupling. Density history and radial Maxwell feedback during and after the drive leave a cubic slow amplitude even after linear slow-mode cancellation. For the tested protocols at $\\rho_f=3$, the density-history term interferes constructively with the net radial feedback; its modulus is 85--89\\% of that of the total cubic coefficient. Calculated from the low-order equations alone, this total coefficient predicts the compensating pulse. Full nonlinear evolution confirms the reduction from $O(\\epsilon^3)$ to $O(\\epsilon^5)$ in the source amplitude $\\epsilon$, with approximately 600-fold suppression for the representative protocol at $\\epsilon=0.05$. Compensation extends the window of fast-channel relaxation without changing the final quasinormal-mode spectrum; early distance crossing already arises from linear interference. Fully tuned two- and three-pulse preparations suppress one and two slow modes, respectively, within numerical resolution. Local analysis establishes finite-pulse reachability of strong Mpemba states with vanishing selected asymptotic slow-mode coefficients. Charge-neutral controls retain a total-time advantage from a common input when the full subsequent control duration is included.", "url": "https://arxiv.org/abs/2610.26218", "type": "理论", "summary": "1. 该工作在固定AdS黑膜上的探针阿贝尔-希格斯模型中，利用有限边界驱动制备强Mpemba态，并考察相同末态电荷密度下密度历史对弛豫通道的选择。\n2. 其卖点是把残留慢模归因于密度历史与径向麦克斯韦反馈形成的立方振幅：ρ_f=3时两者相长，历史项模量为总系数的85–89%，低阶方程即可预测补偿脉冲，完整非线性演化将源幅度ε的慢模残留从O(ε^3)降至O(ε^5)，ε=0.05时约600倍抑制。\n3. 局部分析证实有限脉冲可达强Mpemba态并消去选定慢模系数，双/三脉冲分别抑制一/二个慢模，补偿延长快通道窗口而不改变最终准正规模谱，为全息边界控制提供启发。", "summary_source": "deepseek", "authors": [{"name": "Yu Shi"}, {"name": "Xinwu Liu"}, {"name": "Liping Li"}, {"name": "Chikun Ding"}, {"name": "Yuebing Zhou"}, {"name": "Changqing Liu"}, {"name": "Sheng Long"}], "featured_authors": [{"name": "Yu Shi"}, {"name": "Xinwu Liu"}, {"name": "Liping Li"}, {"name": "Yuebing Zhou"}, {"name": "Changqing Liu"}, {"name": "Sheng Long"}], "author_count": 7}, {"id": "2610.26281", "category": "hep-th", "title": "Dispersion of three-dimensional oscillons: a standing-wave perspective", "abstract": "A spherically symmetric standing wave confined within a finite-radius ball, with weak radiative exchange between its core and boundary, provides a model for an intermediate stage in the adiabatic evolution of the $\\phi^4$ oscillon. We employ a multiscale variational framework to derive an approximate description of these standing waves and their energy-frequency relation. The resulting dispersion curve is compared with that obtained from numerical solutions of the boundary value problem for the $\\phi^4$ equation on a two dimensional (time and radius) domain. The agreement between the numerical and variational results is excellent near the endpoint of the continuous spectrum but deteriorates as $\\omega$ is reduced below $0.85 \\omega_0$. We attribute this discrepancy to the growth of the radiation wing, which is neglected in the variational ansatz.", "url": "https://arxiv.org/abs/2610.26281", "type": "理论", "summary": "1. 该文将三维φ⁴振荡子绝热演化的中间阶段建模为有限半径球内球对称驻波，并用多尺度变分框架导出其能量—频率色散关系，与二维（时间—半径）边值问题数值解对照。\n2. 其技术卖点在于驻波—边界弱辐射交换图像给出的色散曲线在连续谱端点附近与数值结果高度吻合，并明确指出ω降至0.85ω₀以下时偏差源于变分拟设忽略的辐射翼增长。\n3. 这提示可将驻波与辐射翼的耦合作为描述振荡子慢演化和改进变分近似的关键自由度，并为后续定量检验辐射修正提供明确方向。", "summary_source": "deepseek", "authors": [{"name": "I. V. Barashenkov"}, {"name": "R. De Sousa"}, {"name": "N. V. Alexeeva"}, {"name": "A. Dika"}, {"name": "E. V. Zemlyanaya"}], "featured_authors": [{"name": "I. V. Barashenkov"}, {"name": "R. De Sousa"}, {"name": "N. V. Alexeeva"}, {"name": "A. Dika"}, {"name": "E. V. Zemlyanaya"}], "author_count": 5}, {"id": "2610.26515", "category": "hep-th", "title": "U(1) Current Diffusion in Gauss-Bonnet Holography", "abstract": "We study holographic $U(1)$ charge transport using a probe Maxwell field in a five-dimensional Gauss-Bonnet-AdS black-brane background. Within the all-order linearised fluid/gravity framework, we derive the off-shell constitutive relation and determine the diffusion function and electric and magnetic conductivities analytically in the hydrodynamic regime and numerically at generic frequency and momentum. To first order in the Gauss-Bonnet coupling, the leading diffusion constant remains unchanged in our normalization, while its frequency dependence and the electric conductivity receive nontrivial corrections. The deformation also generates a nonvanishing leading magnetic conductivity. Beyond the hydrodynamic regime, it modifies the transport profiles while preserving the damped behaviour of the diffusion function. The corresponding memory kernel vanishes at negative times, supporting a retarded constitutive response.", "url": "https://arxiv.org/abs/2610.26515", "type": "理论", "summary": "1. 该文在五维Gauss-Bonnet-AdS黑膜中用探针Maxwell场研究全息U(1)电荷输运，并在全阶线性流体/引力框架下导出非壳本构关系、扩散函数及电/磁导率。\n2. 其要点是首阶Gauss-Bonnet耦合在所用归一化下不改变领头扩散常数，却修正其频率依赖与电导，并产生非零领头磁导率，同时保持扩散函数的阻尼行为。\n3. 负时记忆核消失支持延迟本构响应，为检验高阶曲率修正下强耦合电荷输运的因果性与耗散结构提供了可操作基准。", "summary_source": "deepseek", "authors": [{"name": "A. Naveena Kumara"}, {"name": "Shreyas Punacha"}, {"name": "Kartheek Hegde"}], "featured_authors": [{"name": "A. Naveena Kumara"}, {"name": "Shreyas Punacha"}, {"name": "Kartheek Hegde"}], "author_count": 3}, {"id": "2610.26610", "category": "hep-th", "title": "The $A_3$ Narain family over $\\mathbb{Z}_4$", "abstract": "The code $\\{000,220,202,022\\}\\subset\\mathbb{Z}_4^3$ realizes the split $A_3$ root-weight gluing construction as ordinary Construction A, preserving the Lorentzian pairing and the positive energy form. For two hyperbolic pairs of $A_3$ blocks, the twenty-two even self-dual gluing codes form seven block-monomial classes. Explicit metric and $B$-field representatives and theta series distinguish exactly seven T-duality classes in this family at central charge six; the one-pair family has two classes at central charge three. For arbitrary $d$, the chiral root system on either side is $A_1^{3m}$, where $m$ counts the words $(2e_i,2e_i)$ in the gluing code. Exactly one two-pair class has no zero-$B$ T-duality frame. Intersections of gluing codes determine finite shift orbifolds between the backgrounds, with the target code specifying the twisted-sector projections.", "url": "https://arxiv.org/abs/2610.26610", "type": "理论", "summary": "1. 该文在Z4上构造A3 Narain族，将分裂A3根权粘合实现为普通Construction A，并枚举两对双曲A3块的22个偶自对偶粘合码之七类块单项等价类。\n2. 其技术卖点在于以显式度规、B场与theta级数在中心荷6区分出七个T对偶类（单对时中心荷3为两类），并给出任意d下两侧手征根系统A1^{3m}及唯一无零B框架的两对类。\n3. 粘合码交集决定背景间的有限平移orbifold，目标码指定扭曲扇区投影，为码构造Narain紧化中的T对偶分类与orbifold对应提供可操作框架。", "summary_source": "deepseek", "authors": [{"name": "Rajae Sammani"}, {"name": "Abdellah Sebbar"}], "featured_authors": [{"name": "Rajae Sammani"}, {"name": "Abdellah Sebbar"}], "author_count": 2}, {"id": "2610.26672", "category": "hep-th", "title": "On Integrable Deformations of CFTs and Integrable Two-Dimensional Sigma Models", "abstract": "In this paper, we analyze the systems of screening charges corresponding to $\\eta$-deformed $O(N)$ and $OSp(N|2m)$ sigma models. These sigma models can be represented as integrable deformations of certain conformal field theories. Based on the case of $O(N)$ sigma models, which were conjectured in previous works by A.V. Litvinov and co-authors to be an integrable deformation of the conformal field theory corresponding to the algebras $W(D(n+1|n))$ and $W(D(n|n))$ for the cases $N=2n+2$ and $N=2n+1$ at $n \\geq 1$, respectively, we formulate a hypothesis on how to write down the system of screening charges for the conformal field theory whose integrable deformation defines the $\\eta$-deformed $OSp(N|2m)$ sigma model for the case of odd $N=2n+1$, asymptotically free models with $N-2m-2>0$ and $n \\geq 2$, $m \\geq 1$. This hypothesis is explicitly verified for the cases of $OSp(5|2)$, $OSp(7|2)$, and $OSp(7|4)$, which were separately investigated in the work of M.N. Alfimov and co-authors.", "url": "https://arxiv.org/abs/2610.26672", "type": "理论", "summary": "1. 该文系统分析η形变O(N)与OSp(N|2m) sigma模型对应的筛选荷体系，并把这些模型表述为若干共形场论的可积形变。\n2. 其关键在于沿用O(N)情形中W(D(n+1|n))与W(D(n|n))的猜想，提出奇数N=2n+1、渐近自由条件N-2m-2>0且n≥2,m≥1时OSp(N|2m)所对应CFT筛选荷的构造假设，并在OSp(5|2)、OSp(7|2)、OSp(7|4)上显式验证。\n3. 该结果为η形变超对称sigma模型与W代数CFT之间的可积形变对应提供了可检验的构造线索，并提示可将筛选荷方法推广到更广泛的模型。", "summary_source": "deepseek", "authors": [{"name": "Mikhail Alfimov"}], "featured_authors": [{"name": "Mikhail Alfimov"}], "author_count": 1}, {"id": "2610.26704", "category": "hep-th", "title": "An explicit product for the on-shell higher-spin algebra in $AdS_d$-space", "abstract": "For $d>3$ we construct the product of the bosonic on-shell higher-spin algebra directly on the AdS-traceless representatives. We find the traceless projector in closed form, determine all linear relations among the trace-producing operators, and prove that every class modulo the $\\mathfrak{sp}(2)$ ideal has a unique traceless representative. The resulting product is an explicit differential operator, which we test on the $\\mathfrak{so}(d-1,2)$ generators. A toy model shows how the factorisation lifts from bilinear products to trilinear ones in minimal $A_\\infty$-algebras.", "url": "https://arxiv.org/abs/2610.26704", "type": "理论", "summary": "1. 该文针对 d>3 的 AdS_d 空间，在 AdS 无迹代表元上直接构造了玻色在壳高自旋代数的乘积。\n2. 其技术要点是给出闭式无迹投影子、确定所有产生迹算符间的线性关系，并证明模 sp(2) 理想的每一类具有唯一无迹代表，使乘积成为显式微分算符且在 so(d-1,2) 生成元上得到检验。\n3. 该构造为高自旋代数以及最小 A∞ 代数中乘法从双线性到三线性的分解提升提供了明确途径。", "summary_source": "deepseek", "authors": [{"name": "M. A. Povarnin"}], "featured_authors": [{"name": "M. A. Povarnin"}], "author_count": 1}, {"id": "2610.26735", "category": "hep-th", "title": "Large-Level Limit of Doubled Chern-Simons Theory Part I: Regular Sector, Boundaries and Interfaces", "abstract": "We study three-dimensional $BF$ theory as the large-level limit of the doubled Chern--Simons theory $G_k\\times G_{-k}$ for simply connected, compact, simple $G$, a limit that connects the symmetry topological field theories of finite and continuous symmetries. Lines whose two highest weights grow linearly with $k$ at fixed difference become $BF$ lines, with magnetic flux set by their average and electric charge equal to their difference. Representing level-$k$ torus states as normalized flux--charge wave packets, we prove that every fixed modular transformation of any fixed normalizable state with regular flux converges in the strong-$*$ topology to its $BF$ counterpart. The Dehn twist gives each line exactly its Aharonov--Bohm phase at every level, while $S$ converges to a Fourier transform exchanging flux and charge, without escaping to singular holonomies or large charges. States that approach singular fluxes at large $k$ are not covered. The natural boundary 2d theory is speculated to be a decompactified boson in the abelian case $G=U(1)$, and $\\dim G$ non-compact free scalars for general $G$. For $SU(2)$, we discuss the gapped interfaces between adjacent levels, which must shift some flux or charge by a finite amount. In the $k\\rightarrow\\infty$ limit the interface is conjectured to be the $c=1$ Runkel--Watts theory.", "url": "https://arxiv.org/abs/2610.26735", "type": "理论", "summary": "1. 该工作把三维BF理论视为单连通紧致单群G的双重Chern-Simons理论G_k×G_{-k}的大k极限，研究其正则扇区、边界与界面，以衔接有限与连续对称性的对称拓扑场论。\n2. 其核心是把level-k环面态表示为归一化通量-电荷波包，证明任意固定可归一化正则通量态的固定模变换在强*拓扑下收敛到BF对应：Dehn twist精确给出Aharonov-Bohm相位，S收敛为交换通量与电荷的傅里叶变换，且不逃向奇异完整或大电荷。\n3. 由此推测阿贝尔边界为去紧致化玻色子、一般G为dim G个非紧致自由标量；SU(2)相邻能级的有能隙界面须有限移动通量或电荷，k→∞时猜想为c=1 Runkel-Watts理论。", "summary_source": "deepseek", "authors": [{"name": "Shengyi Guan"}, {"name": "Qiang Jia"}, {"name": "Jiahua Tian"}, {"name": "Yi-Nan Wang"}], "featured_authors": [{"name": "Shengyi Guan"}, {"name": "Qiang Jia"}, {"name": "Jiahua Tian"}, {"name": "Yi-Nan Wang"}], "author_count": 4}, {"id": "2610.26814", "category": "hep-th", "title": "Rényi Multi-entropy for Stabilizer States: A Finite Field Gauss Sum Problem", "abstract": "Rényi multi-entropy probes multi-partite structure beyond bipartite spectra, but its behavior in general quantum states and the entanglement structure it captures remain poorly understood. We develop a finite field Gauss sum framework for calculating it in stabilizer states. Within this framework, the replica contraction reduces to a quadratic Gauss sum if and only if the state is locally unitarily equivalent to a stabilizer state. We obtain analytic expressions for the Rényi multi-entropy of all tree graph states and large families of loop graph states. In contrast to their flat bipartite Rényi spectra, stabilizer states generically have nonflat Rényi multi-entropy spectra.", "url": "https://arxiv.org/abs/2610.26814", "type": "理论", "summary": "1. 该工作为 stabilizer 态的 Rényi 多熵建立了有限域高斯和框架，将 replica 收缩转化为有限域上的二次高斯和计算，并给出所有树图态及大族环图态的多熵解析表达式。\n2. 其核心在于：replica 收缩可约化为二次高斯和，当且仅当该态局部幺正等价于 stabilizer 态；这既提供计算途径，也给出该等价性的代数判据。\n3. 与二分 Rényi 谱的平坦性相反，stabilizer 态的多熵谱一般非平坦，表明多熵可分辨二分谱无法区分的多体纠缠结构，并为 Clifford 资源下多体纠缠的解析刻画提供可推广路径。", "summary_source": "deepseek", "authors": [{"name": "Bartlomiej Czech"}, {"name": "Yichen Feng"}, {"name": "Jonathan Harper"}, {"name": "Xin-Xiang Ju"}, {"name": "Yang Zhao"}], "featured_authors": [{"name": "Bartlomiej Czech"}, {"name": "Yichen Feng"}, {"name": "Jonathan Harper"}, {"name": "Xin-Xiang Ju"}, {"name": "Yang Zhao"}], "author_count": 5}, {"id": "2610.26822", "category": "hep-th", "title": "Mechanical angular momentum loss at $\\mathcal{O}(G^4)$ from static and radiative gravitons", "abstract": "We determine the loss of mechanical angular momentum $L^{\\mu}_{\\rm loss}$ of two gravitationally scattering bodies at $\\mathcal{O}(G^4)$ using worldline quantum field theory (WQFT). The gravitational memory effect, a phenomenon of the early- and late-time behaviour of the gravitational field, leads to static contributions to $L^{\\mu}_{\\rm loss}$. We illuminate how these arise: the linear memory contributes through so-called static correlators, while the nonlinear memory vanishes at this order due to symmetry considerations. The computation of the remaining, dynamical part resembles that of the $\\mathcal{O}(G^4)$ impulse. We generate its integrand using a reformulation of the WQFT Feynman rules that conserves four-momentum at every vertex and plainly exhibits the classical loops. The three-loop integrals are reduced to master integrals, whose differential equations and boundary matching in the post-Newtonian limit we describe in some detail. In contrast to conservative effects at this order, only polylogarithms appear. While individual contributions to the dynamical part are divergent, these cancel in $L^{\\mu}_{\\rm loss}$. The quadratic-in-radiation part of our result reproduces earlier results, while the complete result agrees with existing post-Newtonian results.", "url": "https://arxiv.org/abs/2610.26822", "type": "理论", "summary": "1. 该工作利用世界线量子场论计算了两个引力散射体在 \\(\\mathcal{O}(G^4)\\) 的机械角动量损失。\n2. 其关键在于用引力记忆效应分离静态贡献：线性记忆通过静态关联子体现，非线性记忆因对称性在该阶消失，并以逐顶点守恒四动量的重写费曼规则生成被积函数，将三圈积分约化为主积分后借助微分方程与后牛顿边界匹配求解，最终仅出现多重对数函数且发散相消。\n3. 结果中辐射平方项复现先前计算且完整表达式与既有后牛顿结果一致，为引力散射角动量损失及记忆效应的跨方法检验提供了高阶基准。", "summary_source": "deepseek", "authors": [{"name": "Lara Bohnenblust"}, {"name": "Carl Jordan Eriksen"}, {"name": "Gustav Uhre Jakobsen"}, {"name": "Kathrin Stoldt"}, {"name": "Andrii Yanovets"}], "featured_authors": [{"name": "Lara Bohnenblust"}, {"name": "Carl Jordan Eriksen"}, {"name": "Gustav Uhre Jakobsen"}, {"name": "Kathrin Stoldt"}, {"name": "Andrii Yanovets"}], "author_count": 5}, {"id": "2610.26838", "category": "hep-th", "title": "Field theory guides Monte Carlo in the one-dimensional long-range Ising model", "abstract": "The statistical long-range Ising (LRI) model in one dimension provides a family of some of the simplest non-exactly solvable critical points. These critical points are described by long-range conformal field theories (CFTs) that are well understood analytically with perturbative expansions and some exact results. Guided by this, we revisit the Monte Carlo (MC) approach to the corresponding lattice model which has many favorable features compared to other systems studied with MC methods. In particular, with very modest computational cost, we are able to estimate scaling dimensions of leading and subleading operators as well as the associated three-point functions, and even certain four-point functions. These results help highlight the fact that 1d LRI CFTs are a phenomenal playground to more generally test non-perturbative methods and ideas for strongly coupled CFTs.", "url": "https://arxiv.org/abs/2610.26838", "type": "理论", "summary": "1. 该工作以长程共形场论的解析结果为引导，重新审视一维长程伊辛晶格模型的蒙特卡罗方法，并系统提取临界谱与多点关联函数。\n2. 其技术优势在于借助场论指导，以很小的计算代价估计领头与次领头算符的标度维数、三点函数乃至部分四点函数，显示该模型特别适合蒙特卡罗。\n3. 这突出一维长程伊辛共形场论可作为检验强耦合共形场论非微扰方法与思想的理想平台，并为相关数值与解析研究提供可复用的基准。", "summary_source": "deepseek", "authors": [{"name": "António Antunes"}, {"name": "José Matos"}], "featured_authors": [{"name": "António Antunes"}, {"name": "José Matos"}], "author_count": 2}, {"id": "2610.24180", "category": "math-ph", "title": "T-embeddings as stationary measures on T-graphs", "abstract": "In this paper, we investigate the relation between t-embeddings and T-graphs associated with the same weighted planar bipartite graph. We prove that, given such a T-graph, the corresponding t-embeddings are classified by positive stationary measures on this T-graph and describe a reconstruction procedure of the t-embedding given such a measure. As an application, we develop an approach for constructing t-embeddings of arbitrary sufficiently non-degenerate planar bipartite graphs.", "url": "https://arxiv.org/abs/2610.24180", "type": "理论", "summary": "1. 该文研究了同一加权平面二部图所关联的 t-嵌入与 T-图之间的关系，并证明给定 T-图时相应的 t-嵌入可由其上的正平稳测度分类。\n2. 其核心卖点是给出了从正平稳测度重构 t-嵌入的程序，从而把 t-嵌入的构造等价地转化为 T-图上的平稳测度问题。\n3. 作为应用，该框架为构造任意充分非退化平面二部图的 t-嵌入提供了系统途径，并提示可在平面图概率与离散复分析之间建立进一步联系。", "summary_source": "deepseek", "authors": [{"name": "Mikhail Basok"}, {"name": "Benoit Laslier"}, {"name": "Marianna Russkikh"}], "featured_authors": [{"name": "Mikhail Basok"}, {"name": "Benoit Laslier"}, {"name": "Marianna Russkikh"}], "author_count": 3}, {"id": "2610.24805", "category": "math-ph", "title": "An Accurate Zeroth-Order Perturbation Theory for Solving Power-Law Potentials within the Framework of the Asymptotic Iteration Method", "abstract": "Spherically symmetric singular potentials have a wide range of applications, such as molecular and atomic physics. In this work, we present a zeroth-order perturbation theory for solving the Schrödinger equation within the framework of the asymptotic iteration method (AIM). We rely on exponential and hyperbolic potential ansatz substitutions, where the difference between the original and new potential is treated as a small perturbation. Each potential ansatz has a free parameter chosen small enough to give an accurate zeroth-order perturbative wave equation solution. This method avoids the oscillatory behavior observed in the asymptotic iteration solutions when applying the AIM to such problems. Finally, we illustrate our approach by solving a few problems, particularly potentials with quartic and sextic singularities. We compare our results with those obtained via other methods and find good agreement.", "url": "https://arxiv.org/abs/2610.24805", "type": "理论", "summary": "1. 该工作将零阶微扰理论嵌入渐近迭代法（AIM）框架，用于求解球对称奇异幂律势下的薛定谔方程。\n2. 其核心是引入指数型和双曲型势试探替换，将原势与新势之差视为小扰动，并通过选取足够小的自由参数获得精确的零阶微扰波方程解，从而抑制AIM直接求解时的振荡行为。\n3. 对四阶和六阶奇异势的算例与其他方法吻合良好，表明该方案对奇异幂律势具有实用精度，并可为AIM处理相关原子分子问题提供稳定化思路。", "summary_source": "deepseek", "authors": [{"name": "A. J. Sous"}, {"name": "Ibsal Assi"}, {"name": "Nasser Saad"}], "featured_authors": [{"name": "A. J. Sous"}, {"name": "Ibsal Assi"}, {"name": "Nasser Saad"}], "author_count": 3}, {"id": "2610.24980", "category": "math-ph", "title": "Eynard-Orantin Topological Recursion, Moduli-Space Virasoro Constraints, and Semisimple CohFTs", "abstract": "We use Virasoro constraints to prove Eynard's intersection-number formula for Eynard-Orantin topological recursion with several simple ramification points. The key construction couples the higher Weil-Petersson partition functions associated with the individual ramification points through a quadratic differential operator determined by the Bergman kernel. We identify this operator with the quadratic part of Givental's quantized $R$-matrix, thereby obtaining a Virasoro-theoretic proof of the DOSS identification of topological recursion with Givental's formula for semisimple cohomological field theories. Furthermore, while the DOSS identification fixes the distinguished $y$-function, we keep the Bergman kernel/$R$-matrix fixed and allow $y$ to vary, showing that this amounts to shifting the evaluation point of the corresponding ancestor potential.", "url": "https://arxiv.org/abs/2610.24980", "type": "理论", "summary": "1. 该文利用Virasoro约束证明了带多个简单分支点的Eynard-Orantin拓扑递归所满足的Eynard交点公式，并据此给出拓扑递归与Givental半单CohFT公式之间DOSS对应的Virasoro理论证明。\n2. 其核心构造是用Bergman核决定的二次微分算子耦合各分支点对应的高Weil-Petersson配分函数，并将该算子识别为Givental量子化R-矩阵的二次部分。\n3. 在保持Bergman核/R矩阵固定而允许y函数变化时，该文表明这等价于平移相应祖先势的评估点，从而为理解半单CohFT中y函数与R-矩阵的分工提供了明确启示。", "summary_source": "deepseek", "authors": [{"name": "Dingkang Xiong"}, {"name": "Jian Zhou"}], "featured_authors": [{"name": "Dingkang Xiong"}, {"name": "Jian Zhou"}], "author_count": 2}, {"id": "2610.24985", "category": "math-ph", "title": "Spectral Curves for Semisimple Conformal Frobenius Manifolds", "abstract": "We construct connected spectral curves for semisimple conformal Frobenius manifolds with flat unit, using the periods of the second structure equation. Eynard-Orantin topological recursion on these curves reproduces the stable ancestor correlators of Givental-Teleman reconstruction. The spectral curves are defined on simply connected domains in the complex plane. We apply the construction to the quantum cohomology of $\\mathbb P^n$ for $n\\ge2$ at a point, obtaining explicit spectral curve data in terms of Hecke triangle groups and hypergeometric functions. Finally, for $\\mathbb P^2$ and $\\mathbb P^3$, we express the complete spectral curve data, including the bidifferentials, in classical modular and quasimodular forms.", "url": "https://arxiv.org/abs/2610.24985", "type": "理论", "summary": "1. 该工作利用第二结构方程的周期，为具有平坦单位元的半单共形Frobenius流形构造了连通的谱曲线。\n2. 其关键在于这些谱曲线上的Eynard-Orantin拓扑递归可重现Givental-Teleman重构的稳定祖先关联子，并在单连通复区域上给出显式曲线数据。\n3. 应用于复射影空间量子上同调后，该框架以Hecke三角群和超几何函数表达谱曲线，并在复射影平面与三维复射影空间上给出含双微分的经典模与准模形式数据，为相关重构提供可计算范例。", "summary_source": "deepseek", "authors": [{"name": "Dingkang Xiong"}, {"name": "Jian Zhou"}], "featured_authors": [{"name": "Dingkang Xiong"}, {"name": "Jian Zhou"}], "author_count": 2}, {"id": "2610.25010", "category": "math-ph", "title": "Thoughts on Quantum Events, Quantizing Gravity and von Neumann Algebras", "abstract": "This short document presents no new results. It is a collection of related ideas that may lead to a way of quantizing gravity. To achieve this it may be relevant to use my recent new approach to quantum theory, which is based on quantum events. Given that most standard quantum texts do not define a mathematical object which corresponds to a physical event, the definition of a quantum event is motivated and discussed in detail. This in turn leads to the idea that the mathematical object that contains enough quantum events for describing a quantum system is a von Neumann algebra. The next idea is that the kinematics of special relativity (as embodied in flat Minkowski space) should be quantized as a first step in the program of the quantization of general relativity, that is, quantizing Einstein's equation. It must be emphasized that the events of special relativity are viewed as part of the kinematics, rather than of the dynamics of that theory. The same holds for general relativity. Similarly, I am viewing quantum events as part of the kinematics of quantum theory, even though some find this to be counterintuitive. An Appendix shows how ``collapse'' is easily understood in this new approach to quantum theory.", "url": "https://arxiv.org/abs/2610.25010", "type": "理论", "summary": "1. 该短文明确不报告新结果，而是汇总一组可能通向引力量子化的关联思路，并借助以量子事件为基础的新量子理论路径展开定义与讨论。\n2. 其关键主张是把量子事件纳入运动学，以冯·诺依曼代数作为容纳足够量子事件、从而描述量子系统的数学对象，并建议先量子化狭义相对论的平直闵可夫斯基运动学，再走向爱因斯坦方程的量子化。\n3. 这一视角把事件置于基础地位，或可为统一理解引力量子化与“坍缩”提供启发，但因不报告新结果，后续仍需形式化与检验。", "summary_source": "deepseek", "authors": [{"name": "Stephen Bruce Sontz"}], "featured_authors": [{"name": "Stephen Bruce Sontz"}], "author_count": 1}, {"id": "2610.25218", "category": "math-ph", "title": "Complementary Cauchy Elasticity", "abstract": "We develop a nonlinear theory of complementary Cauchy elasticity in which the right Cauchy-Green strain is prescribed as a function of the second Piola-Kirchhoff stress, without assuming constitutive invertibility or the existence of a complementary strain-energy function. We introduce the complementary stress-work 1-form and characterize the obstruction to complementary hyperelasticity through the failure of major symmetry of the tangent compliance tensor. For general implicit elasticity, we show that the simultaneous closure of the stress-work and complementary stress-work 1-forms is characterized by the Lagrangian structure of the constitutive manifold. Using the Darboux classification, we obtain local canonical representations of anisotropic and isotropic complementary Cauchy elastic solids, including explicit non-h
