routes for manipulating magnetic materials beyond conventional thermal this http URL metallic systems, photoexcited electronic distributions rapidly evolve toward quasi-thermal states through efficient electron-electron and electron-phonon scattering, making long-lived modification of spin-dependent interactions difficult to achieve. Here, we investigate coherent magnetization precession in an amorphous GdFeCo thin film driven by simultaneous excitation with two femtosecond laser this http URL a symmetric dual-pump geometry that continuously evolves from single-pulse to spatially periodic excitation, we separate effects associated with the excitation pattern from those arising from simultaneous dual-pump excitation. We identify a narrow excitation window in which the lifetime of the ferromagnetic-resonance-like mode increases strongly while its frequency exhibits a small but reproducible this http URL -window analysis shows that the enhanced lifetime persists for several hundred picoseconds, substantially longer than transient magnetostatic effects associated with the periodic excitation this http URL combined frequency and decay time changes cannot be explained by spatially structured heating alone and instead point to a long-lived nonequilibrium spin-dependent electronic configuration. Within a phenomenological Elliott-Yafet framework, the simultaneous increase in FMR decay time and frequency is consistent with a transient reduction of the effective spin-mixing parameter governing spin-flip scattering. Our results demonstrate that the excitation pathway, rather than excitation energy alone, can serve as a control parameter for spin relaxation and provide access to nonequilibrium spin states that are not readily reached by conventional single-pulse excitation.", "url": "https://arxiv.org/abs/2610.25236", "type": "理论", "summary": "1. 该工作在非晶GdFeCo薄膜中采用对称双泵浦飞秒激光激发，通过从单脉冲连续过渡到空间周期激发的构型，将激发图样效应与双脉冲同时激发效应分离，系统研究了相干磁化进动。\n2. 其关键在于识别出一个狭窄激发窗口：类铁磁共振模式的寿命显著延长、频率出现微小而可复现的移动，该增强持续数百皮秒，无法仅用空间结构化加热解释，并在Elliott-Yafet框架下与自旋混合参数的瞬态减小相符。\n3. 这表明激发路径而非激发能量本身可作为调控自旋弛豫的参数，为获得单脉冲激发难以达到的非平衡自旋态提供了可行途径。", "summary_source": "deepseek", "authors": [{"name": "Sergii Parchenko"}, {"name": "Arata Tsukamoto"}, {"name": "Andreas Scherz"}], "featured_authors": [{"name": "Sergii Parchenko"}, {"name": "Arata Tsukamoto"}, {"name": "Andreas Scherz"}], "author_count": 3}, {"id": "2610.25243", "category": "cond-mat", "title": "Enhancement of liquid-liquid phase transition under shear flow", "abstract": "In a liquid--liquid transition (LLT), a single-component liquid transforms into another liquid with different density and viscosity. Flow therefore couples to the transition, but the effect of shear flow is not understood. Here we investigate the LLT under shear with a two-order-parameter hydrodynamic model in which the viscosity depends on the non-conserved structural order parameter. Under shear, a fluctuation of the order parameter drives a compressional flow through the viscosity, and the resulting density change enhances the order parameter fluctuation. In a linear analysis, this feedback destabilizes the metastable liquid above a critical shear rate $\\dot{\\gamma}_{\\rm c}$ for wavevectors in particular directions. Because the flow rotates the wavevector, a fluctuation grows only for a finite time duration, and its amplification is determined by the dimensionless shear rate $\\dot{\\gamma}/\\dot{\\gamma}_{\\rm c}$ and the second dimensionless number $\\Lambda$, the ratio of the thermodynamic relaxation rate of the order parameter to $\\dot{\\gamma}_{\\rm c}$. In hydrodynamic simulations, shear above about $\\dot{\\gamma}_{\\rm c}$ induces the transition in the metastable region when $\\Lambda\\gtrsim1$. The transition proceeds by nucleation of domains whose morphology becomes anisotropic. The incubation time decreases and the onset of the viscosity increase is accelerated as $\\dot{\\gamma}$ and $\\Lambda$ increase. These results imply that the shear rate is a control variable of LLT in addition to temperature and pressure, selecting whether and how a metastable liquid transforms.", "url": "https://arxiv.org/abs/2610.25243", "type": "理论+数值", "summary": "1. 该文用包含非守恒结构序参量且黏度依赖该序参量的双序参量流体力学模型，研究剪切流下单元液体的液-液相变。\n2. 其核心机制是序参量涨落经黏度驱动压缩流并反馈密度变化，从而在线性分析中于临界剪切率以上沿特定波矢方向失稳，且波矢旋转使增长仅持续有限时间，放大由无量纲剪切率与Λ共同控制。\n3. 水动力模拟表明剪切可诱发亚稳区成核并令畴形态各向异性、缩短孕育期并加速黏度上升，提示剪切率可作为温度与压力之外调控液-液相变是否及如何发生的控制变量。", "summary_source": "deepseek", "authors": [{"name": "Kyohei Takae"}], "featured_authors": [{"name": "Kyohei Takae"}], "author_count": 1}, {"id": "2610.25270", "category": "cond-mat", "title": "Tensor network Monte Carlo study of the J1-J2 Ising model on the square lattice", "abstract": "The frustrated square-lattice J1-J2 Ising model exhibits rich magnetic phases, yet its phase transitions remain difficult to characterize due to critical slowing down in conventional Monte Carlo and truncation errors inherent to tensor renormalization group this http URL develop a tensor-network Monte Carlo (TNMC) algorithm for this frustrated model, which supports both open and periodic boundary conditions. For periodic lattices, we use a sweeping block-update strategy that updates spin blocks while fixing surrounding this http URL boost efficiency, we couple our sampler with histogram reweighting, and test each technique standalone to validate these independent this http URL perform extensive finite-size scaling analyses at g=0.55 and g=1.0, extracting apparent critical temperatures and effective thermal exponents from Binder-cumulant this http URL method offers an efficient, nearly bias-free path for large-scale simulations of J1-J2-type frustrated magnets under periodic boundaries and generalizes readily to other frustrated spin lattices.", "url": "https://arxiv.org/abs/2610.25270", "type": "理论+数值", "summary": "1. 该工作提出了适用于方格子J1-J2 Ising阻挫模型的张量网络蒙特卡洛算法，并支持开放与周期边界条件。\n2. 其技术要点是周期格子上采用扫描式块更新、固定周围自旋以更新自旋块，并结合直方图重加权，且分别独立验证各组件，在g=0.55与1.0处通过有限尺寸标度和Binder累积量提取表观临界温度与有效热指数。\n3. 该方法为周期边界下J1-J2类阻挫磁体的大尺度模拟提供了高效且近乎无偏的途径，并可推广到其他阻挫自旋格子。", "summary_source": "deepseek", "authors": [{"name": "Wanying Zheng"}, {"name": "Tao Chen"}, {"name": "Youjin Deng"}, {"name": "Wanzhou Zhang"}], "featured_authors": [{"name": "Wanying Zheng"}, {"name": "Tao Chen"}, {"name": "Youjin Deng"}, {"name": "Wanzhou Zhang"}], "author_count": 4}, {"id": "2610.25295", "category": "cond-mat", "title": "Instability-driven segregation of V group transition metals on HEB$_2$ grain boundaries influencing enhanced mechanical properties", "abstract": "Five metals share a common sublattice in the (Hf,Ta,Ti,Nb,Zr)B$_2$ (HEB$_2$). Most high-entropy materials are produced as polycrystalline materials in the form of sintered ceramics. The question of which metal species are located at grain boundaries is still unknown. Here, we calculated the grain-boundary energy $\\gamma_{GB}$ of four types of boundaries in five binary diborides and HEB$_2$ using density functional theory (DFT). We analyzed the bonding at these boundaries using COHP and sampled cation segregation at six boundaries of HEB$_2$, ordered and general, using Monte Carlo / molecular dynamics with a MACE potential that was fine-tuned for this system. According to our results $\\gamma_{GB}$ splits by group: the group V diborides NbB$_2$ and TaB$_2$ form boundaries with about half the energy of the group IV at three of the four types of GBs, ranging from 0.8 to 2.7 compared to 2.5--4.8~J/m$^2$. COHP shows a significant difference at the Fermi level, namely the Me--B bonds of NbB$_2$ and TaB$_2$ are antibonding at Fermi energy ($E_F$) in the bulk but bonding at the GB, while their integrated strength hardly changes. In HEB$_2$ the segregation follows a similar pattern: Nb and Ta are enriched at five of the six grain boundaries, including general boundaries, up to 23--35~at.\\% at 2000~K, although the size of the atoms would favor Zr and Hf in the expanded sites. A segregated $\\Sigma 193$ grain boundary can withstand 26 against 20~GPa for a random boundary in tension at 300~K. The grain boundaries of HEB$_2$ are composed of group V metals, as suggested by the boundary energies of binaries compounds and their bonding at the Fermi level. Grain boundaries of the (Hf,Ta,Ti,Nb,Zr)B$_2$ preferentially include Nb and Ta. This lowers the grain boundary energy and strengthens the boundaries. This consists of the lower boundary energy and changes Fermi level bonding in NbB$_2$ and TaB$_2$.", "url": "https://arxiv.org/abs/2610.25295", "type": "理论+数值", "summary": "1. 该工作用DFT、COHP及微调MACE势的蒙特卡洛/分子动力学，计算二元二硼化物与(Hf,Ta,Ti,Nb,Zr)B2四类晶界能，并采样六种晶界的阳离子偏析。\n2. 其卖点是第V族NbB2/TaB2晶界能仅为第IV族约一半，Me–B键在费米能处由体相反键转为晶界成键；HEB2中Nb/Ta在2000 K下于五类晶界富集至23–35 at.%，300 K拉伸下Σ193晶界达26 GPa、随机晶界20 GPa。\n3. 这揭示晶界能分组差异与费米能级键合变化共同驱动第V族元素优先偏析，为以晶界化学同时降低界面能并强化HEB2提供设计依据。", "summary_source": "deepseek", "authors": [{"name": "Daniil Alekseev"}, {"name": "Viktor S. Baidyshev"}, {"name": "Alexander G. Kvashnin"}], "featured_authors": [{"name": "Daniil Alekseev"}, {"name": "Viktor S. Baidyshev"}, {"name": "Alexander G. Kvashnin"}], "author_count": 3}, {"id": "2610.25383", "category": "cond-mat", "title": "Dependence of the acoustic propulsion of nano- and microcones on their orientation and aspect ratio", "abstract": "Recent research revealed the orientation-dependent propulsion of a cone-shaped colloidal particle that is exposed to a planar traveling ultrasound wave. Here, we extend the previous research by considering nano- and microcones with different aspect ratios and studying how the propulsion of a particle depends on its orientation and aspect ratio. We also study how the orientation-averaged propulsion of a cone-shaped particle, which corresponds to an isotropic ultrasound field, depends on its aspect ratio and identify an aspect ratio of 1/2 where the orientation-averaged propulsion is particularly strong. To make our simulation results easier reusable for follow-up research, we provide a corresponding simple analytic representation.", "url": "https://arxiv.org/abs/2610.25383", "type": "数值", "summary": "1. 该工作通过数值模拟研究不同长径比的纳米与微米锥在平面行波超声中的推进，系统考察粒子取向和长径比对声推进的影响。\n2. 其核心在于给出取向平均推进随长径比的变化，发现长径比为1/2时取向平均推进显著增强，并提供便于后续研究复用的简单解析表示。\n3. 这为各向同性超声场下锥形胶体的几何设计与取向调控提供了定量依据，并便于相关实验和理论工作直接调用其解析结果。", "summary_source": "deepseek", "authors": [{"name": "Johannes Voß"}, {"name": "Raphael Wittkowski"}], "featured_authors": [{"name": "Johannes Voß"}, {"name": "Raphael Wittkowski"}], "author_count": 2}, {"id": "2610.25412", "category": "cond-mat", "title": "Near self-duality and spatial reorganization of anyon vortex lattices", "abstract": "Contact attraction drives the self-generated vortex lattice of a trapped anyon gas towards self-duality, but integrated energies do not reveal where the remaining departure from it is located. We address this question in the almost-bosonic Chern--Simons--Schrödinger average-field model using a positive, gauge-invariant local defect that measures the covariant kinetic energy in excess of the magnetic bound. Numerically computed low-energy states at three statistical fluxes show that, as the stability line is approached, the integrated defect falls by about two orders of magnitude while the density modulation grows, so that magnetic saturation and density uniformity separate. The residual defect concentrates in a vortex-free outer shell that carries unscreened statistical flux. There it reduces to a smooth radial mismatch between the statistical flow and the density decay, which the interior lattice cannot cancel, whereas the covariant kinetic and amplitude-gradient energies show no comparable enrichment. The effect is robust to grid and box refinement, while its magnitude depends on flux and on the low-energy branch. Exact dilation and contact-response identities relate the squared energy to the density shape and provide consistency checks. Repulsion produces the opposite trend: a smoother density with a larger defect.", "url": "https://arxiv.org/abs/2610.25412", "type": "理论+数值", "summary": "1. 该工作在近玻色陈–西蒙斯–薛定谔平均场模型中引入规范不变的正定局域缺陷，数值研究囚禁任意子气体自生涡旋晶格趋近自对偶时剩余偏离的空间分布。\n2. 其关键结果是：趋近稳定性线时积分缺陷下降约两个数量级而密度调制增强，剩余缺陷集中于携带未屏蔽统计磁通的无涡外壳，并化为统计流与密度衰减间的平滑径向失配。\n3. 该局域判据将磁饱和与密度均匀性分离，并借助精确伸缩与接触响应恒等式提供一致性检验，为甄别吸引与排斥下任意子涡旋晶格重组及后续实验与理论研究给出可检验启示。", "summary_source": "deepseek", "authors": [{"name": "Bao-Duy Le"}], "featured_authors": [{"name": "Bao-Duy Le"}], "author_count": 1}, {"id": "2610.25477", "category": "cond-mat", "title": "NEP-kappa 2.0: A unified framework for phonon transport and nonequilibrium thermalization with machine-learning interatomic potentials", "abstract": "We present NEP-kappa 2.0, a unified framework that integrates density-functional theory, material-specific machine-learning interatomic potentials, and pretrained force models for advanced phonon calculations. A common workflow enables harmonic lattice dynamics, quasi-harmonic and stochastic self-consistent phonon treatments, three- and four-phonon transport, Wigner population--coherence transport, and time-dependent phonon dynamics. Applications to 3C-SiC, BAs, and Cs$_2$AgInCl$_6$ demonstrate consistent force-model comparisons, finite-temperature renormalization, higher-order scattering, and intermode coherence. Beyond steady-state transport, mode-resolved simulations of selectively excited 3C-SiC reveal that half of the injected optical-phonon energy reaches acoustic modes within approximately 3.75 ps, primarily through one-optical--two-acoustic scattering. Acoustic branches exhibit response times differing by a factor of five, with competing scattering channels producing a transient energy overshoot. Channel-resolved entropy production and persistent nonthermal occupations distinguish interbranch energy redistribution from intrabranch thermalization. The framework connects equilibrium phonon transport with microscopic nonequilibrium energy dynamics.", "url": "https://arxiv.org/abs/2610.25477", "type": "理论+数值", "summary": "1. 该工作提出 NEP-kappa 2.0 统一框架，将密度泛函理论、材料专用机器学习原子间势和预训练力模型整合到同一套声子计算流程，覆盖谐/准谐与随机自洽声子、三/四声子输运、Wigner 布居-相干输运及含时声子动力学。\n2. 其卖点是在 3C-SiC、BAs、Cs2AgInCl6 上统一比较力模型并处理有限温重整化、高阶散射与模间相干；模式分辨模拟显示约 3.75 ps 内一半注入光学声子能量经单光学-双声学散射转入声学支，声学支响应时间相差五倍。\n3. 该框架将平衡态声子输运与微观非平衡能量动力学相连，并借通道分辨熵产生和持续非热占据区分支间能量重分配与支内热化。", "summary_source": "deepseek", "authors": [{"name": "Shixian Liu"}, {"name": "Bin Liu"}, {"name": "Fei Yin"}, {"name": "Gang Wang"}, {"name": "Yiming Dong"}, {"name": "Yangjun Qin"}, {"name": "Alexandra V. Kosyakova"}, {"name": "Qiang Xian"}, {"name": "Alexander A. Barinov"}, {"name": "Ke Xu"}, {"name": "Gang Zhang"}], "featured_authors": [{"name": "Shixian Liu"}, {"name": "Bin Liu"}, {"name": "Fei Yin"}, {"name": "Alexander A. Barinov"}, {"name": "Ke Xu"}, {"name": "Gang Zhang"}], "author_count": 11}, {"id": "2610.25487", "category": "cond-mat", "title": "Generation of $N$-particle kappa-distributed velocities via superstatistical Gibbs sampling", "abstract": "The \\emph{kappa} distribution is widely used to model heavy-tailed, non-equilibrium velocity distributions in space and laboratory plasmas. Its correct use in particle-in-cell (PIC) simulations requires more than sampling the single-particle marginal: the $N$-particle \\emph{kappa} distribution predicts non-trivial correlations between the kinetic energies of particles. Building on the superstatistical structure, we implement a Gibbs sampler whose stationary distribution is the joint distribution of the velocities and $\\beta$, so that the sampled velocities follow the $N$-particle \\emph{kappa} distribution and reproduce these correlations by construction.", "url": "https://arxiv.org/abs/2610.25487", "type": "理论+数值", "summary": "1. 该工作利用kappa分布的超统计结构，构建了一个以速度与β的联合分布为平稳分布的Gibbs采样器，用以生成服从N粒子kappa分布的速度样本。\n2. 其技术卖点在于避免仅采样单粒子边缘分布，而是通过联合平稳分布按构造复现N粒子kappa分布预言的粒子动能间非平凡关联，满足PIC模拟对正确N粒子统计的要求。\n3. 这为空间与实验室等离子体中需要准确N粒子速度统计的数值研究提供了可操作的采样方案，并提示忽略粒子间能量关联可能影响模拟结果。", "summary_source": "deepseek", "authors": [{"name": "Leonardo Herrera_Fuenzalida"}, {"name": "Sergio Davis"}], "featured_authors": [{"name": "Leonardo Herrera_Fuenzalida"}, {"name": "Sergio Davis"}], "author_count": 2}, {"id": "2610.25489", "category": "cond-mat", "title": "Microscopic Compensation of Circular Optical Response in Altermagnets", "abstract": "A weak or vanishing circular optical signal need not imply weak helicity-sensitive transitions: it can be the residual of much larger opposing microscopic contributions. We resolve the finite-frequency interband Kubo response before summing over transitions and momentum, separating cancellation among transitions at fixed momentum from cancellation across the Brillouin zone. An exactly compensated $d$-wave model establishes the symmetry benchmark. In MnTe, first-principles Wannier calculations reveal a symmetry-dark Néel orientation with an extended sign-changing circular kernel whose bulk integral vanishes. Reorienting the Néel vector removes this extinction, yet the allowed response remains a small imbalance between large positive- and negative-momentum sectors; the imbalance reverses with photon energy and flips the macroscopic sign. Thus magnetic symmetry decides whether circular response is allowed, whereas microscopic compensation determines how much survives and with what sign. This distinction provides a general framework for interpreting weak, vanishing, and sign-changing magneto-optical signals in compensated magnets.", "url": "https://arxiv.org/abs/2610.25489", "type": "理论+数值", "summary": "1. 该工作通过分解有限频率带间Kubo响应，将同一动量下跃迁间的抵消与布里渊区跨动量的抵消分开，并以精确补偿的d波模型为对称性基准，在MnTe的第一性原理Wannier计算中识别出圆光响应被对称性禁戒的奈尔矢量取向及其积分消失的变号圆核。\n2. 其关键卖点在于指出微弱或消失的圆光信号未必意味着弱螺旋性敏感跃迁，而可能是更大相反微观贡献的残余；磁对称性决定响应是否允许，微观补偿决定剩余幅度与符号。\n3. 这为补偿磁体中微弱、消失及变号磁光信号的统一解读提供框架，并提示需在跃迁与动量分辨层面而非仅看宏观积分来判断圆光响应。", "summary_source": "deepseek", "authors": [{"name": "Meysam Bagheri Tagani"}, {"name": "Carmine Autieri"}, {"name": "Sahar Izadi Vishkayi"}], "featured_authors": [{"name": "Meysam Bagheri Tagani"}, {"name": "Carmine Autieri"}, {"name": "Sahar Izadi Vishkayi"}], "author_count": 3}, {"id": "2610.25537", "category": "cond-mat", "title": "Emergent Chirality Reversal in Magnetically Driven Rotor Clusters", "abstract": "Does a collection of magnetically driven rotors necessarily rotate in the same direction as its individual members? We show that rotors driven by a rotating magnetic field self-assemble into clusters whose collective rotation can oppose the self-rotation of every rotor within them. The reversal arises from competition between rotation-translation coupling and dipolar interactions, which favor opposite directions of collective rotation. Their balance varies with system size and driving frequency, producing a transition between the two handed states, while hydrodynamic interactions shift the transition boundary. Collective handedness can thus emerge opposite to the field-imposed single-rotor rotation without reversing the external field, and can be tuned through system size and driving frequency.", "url": "https://arxiv.org/abs/2610.25537", "type": "理论", "summary": "1. 该工作展示旋转磁场驱动的转子会自组装成团簇，其集体旋转方向可与团簇内每个转子的自转方向相反。\n2. 其核心机制是旋转—平动耦合与偶极相互作用分别偏好相反的集体手性，二者平衡随系统尺寸和驱动频率变化并驱动两种手性态转变，流体力学相互作用会移动该转变边界。\n3. 这意味着无需反转外场即可获得与单转子受迫旋转相反的集体手性，并可通过尺寸和频率调控，为主动手性物质的可调集体运动提供启示。", "summary_source": "deepseek", "authors": [{"name": "Xinzhi Li"}, {"name": "Ke Zhong"}, {"name": "Mohammad F. Islam"}, {"name": "Shiladitya Banerjee"}], "featured_authors": [{"name": "Xinzhi Li"}, {"name": "Ke Zhong"}, {"name": "Mohammad F. Islam"}, {"name": "Shiladitya Banerjee"}], "author_count": 4}, {"id": "2610.25555", "category": "cond-mat", "title": "Chiral symmetry and the orbital susceptibility of disordered honeycomb flakes", "abstract": "The orbital susceptibility of a small disordered grain is dominated by rare samples in which an occupied and an empty level nearly touch. In a chaotic grain such near-degeneracies are suppressed by level repulsion and must also coincide with the chemical potential, so the mean susceptibility stays finite. In a neutral honeycomb flake, chiral (sublattice) symmetry removes the second condition: It places the chemical potential in the middle of the smallest gap, in every disorder realization. Here we show that the mean orbital susceptibility then grows as $\\ln(1/T)$ at low temperature $T$ if disorder can close this gap while a magnetic field still mixes the two levels, and that the hopping geometry decides whether it can: Positive nearest-neighbor hopping on a compact hexagonal flake keeps the gap open, third-neighbor hopping allows it to close. In a chiral random-matrix model with $n$ level pairs the coefficient of the logarithm is $C_n=\\sqrt{2/n}\\,\\Gamma[(n+1)/2]/\\Gamma(n/2)$, close to unity, and a detuned chemical potential cuts the logarithm off.", "url": "https://arxiv.org/abs/2610.25555", "type": "理论", "summary": "1. 该工作研究无序蜂窝状薄片的轨道磁化率，分析手征对称性、无序与跃迁几何如何共同决定中性薄片在低温下的平均响应。\n2. 其核心在于：手征对称性使化学势始终位于最小能隙中心，若无序能闭合该能隙且磁场仍混合两能级，则平均轨道磁化率按ln(1/T)增长；最近邻正跃迁保持能隙，第三近邻跃迁可使其闭合，手征随机矩阵模型给出接近1的对数系数。\n3. 这将轨道响应与薄片跃迁几何及手征对称性直接关联，并指出化学势失谐可截断对数增长，为无序蜂窝体系的实验判据和理论基准提供了明确启示。", "summary_source": "deepseek", "authors": [{"name": "B. Murzaliev"}], "featured_authors": [{"name": "B. Murzaliev"}], "author_count": 1}, {"id": "2610.25557", "category": "cond-mat", "title": "Signatures of slow particle transport in the interacting Aubry-André chain", "abstract": "Slow delocalization in strongly disordered many-body quantum chains can originate from two distinct mechanisms: rare resonances and avalanches, rooted in the energy statistics, or an energy-independent combinatorial path-entropy obstruction in operator space. Quasiperiodic potentials eliminate rare regions with similar potentials that are thought to be responsible for avalanche instabilities and modify the statistics of resonances, thus allowing us to delineate the two mechanisms. To do so, we numerically study the entanglement entropy $S(t)$, number entropy $S_N(t)$, and Hartley number entropy $S_H(t)$ following a quantum quench in the interacting Aubry-André chain with disorder strength $D$. We find $S(t)\\sim\\mu\\ln t$, $S_N(t)\\sim\\nu\\ln\\ln t$ with growth rates $\\mu\\sim\\nu\\sim D^{-\\gamma}$ and $\\gamma\\approx 3$, the same behavior that was previously found in the case of quenched disorder. Furthermore, the saturation values $S_H(t\\to\\infty)$ continue to grow with system size $L$ as $\\ln L$, a growth that persists for $D\\gtrsim 8$ where MBL was argued to be stable. The similarity of the quasi-periodic and quenched disorder cases points to a common origin of the slow particle transport that does not rely on rare-region avalanches and persists despite strongly modified resonance statistics.", "url": "https://arxiv.org/abs/2610.25557", "type": "理论+数值", "summary": "1. 该工作数值研究相互作用 Aubry-André 链在量子淬火后的纠缠熵、数熵与 Hartley 数熵，并与淬火无序情形对照，以区分慢离域化的不同机制。\n2. 其关键在于准周期势虽消除稀有区域并改变共振统计，仍得到 S(t)∼μln t、S_N(t)∼νln ln t，且 μ∼ν∼D^{-γ}、γ≈3，与淬火无序一致；Hartley 熵饱和值随 L 按 ln L 增长并在 D≳8 持续。\n3. 这表明慢粒子输运可能源于不依赖稀有区域雪崩的共同机制，并提示需在强准周期无序下重新审视 MBL 稳定性与算子空间路径熵图像。", "summary_source": "deepseek", "authors": [{"name": "S. Sharifan"}, {"name": "M. Kiefer-Emmanouilidis"}, {"name": "J. Sirker"}], "featured_authors": [{"name": "S. Sharifan"}, {"name": "M. Kiefer-Emmanouilidis"}, {"name": "J. Sirker"}], "author_count": 3}, {"id": "2610.25713", "category": "cond-mat", "title": "Categorical classification of non-Fermi liquids in 2+1 dimensions", "abstract": "A defining feature of non-Fermi liquids is a lack of the quasiparticle peak on the Fermi surface in the spectral function, which is usually realized by coupling a finite density of fermions with critical collective fluctuations. However, these features of the two- and three-point vertex functions are qualitatively the same across many non-Fermi liquids, which has made it difficult to classify them beyond the definition by negation. We point out that the four-point function in the pairing channel contains rich information that positively differentiates distinct types of non-Fermi liquids. Using the generalized notion of fixed points that captures scale-dependent universal pairing interaction, we provide a non-perturbative classification of 2+1-dimensional non-Fermi liquids. In the large Fermi momentum limit with fixed dimensionless couplings, metals coupled with long-wavelength critical fluctuations are classified into seven superuniversality classes. Each of them exhibits a unique phase diagram in the space of temperature and bare four-fermion coupling. The present work generalizes the earlier perturbative classification to strongly interacting non-Fermi liquids by leveraging kinematic constraints.", "url": "https://arxiv.org/abs/2610.25713", "type": "理论+数值", "summary": "1. 该工作利用配对通道四点函数对2+1维非费米液体进行非微扰分类，并在大费米动量、固定无量纲耦合下将耦合长波临界涨落的金属划分为七类超普适类。\n2. 其关键在于指出二、三点顶点函数定性相似，而配对通道四点函数能正面区分不同非费米液体，并以尺度依赖的普适配对相互作用固定点作为分类依据。\n3. 由此给出的各类独特温度—裸四费米耦合相图表明，借助运动学约束可把先前微扰分类推广到强相互作用情形，为相关模型与实验识别提供可检验框架。", "summary_source": "deepseek", "authors": [{"name": "Shubham Kukreja"}, {"name": "Dawson M. Willerton"}, {"name": "Sung-Sik Lee"}], "featured_authors": [{"name": "Shubham Kukreja"}, {"name": "Dawson M. Willerton"}, {"name": "Sung-Sik Lee"}], "author_count": 3}, {"id": "2610.25775", "category": "cond-mat", "title": "Crystal Structure Based Graph Neural Network And LLM Multi-Modal Approach for Material Magnetic Ordering Prediction", "abstract": "AI/ML models are useful for the prediction of materials' properties. Recently, there has been great progress in developing Neural Network models to predict the properties of solids, molecules, and crystals, avoiding expensive and time-consuming laboratory testing. This study presents a novel AI/ML-based multi-modal approach to predict material magnetic ordering using material crystal structure information as input to a Graph Neural Network model (GNN) and semantic text descriptions of the material's properties and structure as input to a Large Language Model (LLM), before performing information fusion of the GNN and LLM outputs to predict material magnetic ordering in four classes (Non-magnetic, Ferromagnetic, Antiferromagnetic, Ferrimagnetic). The model is trained, validated, and tested on a dataset which is a combination of Materials Project dataset, Magndata dataset, and a set of uranium compounds with magnetic ordering determined in laboratory testing, with an 80/10/10 (training/validation/testing) data split. The proposed GNN and LLM multi-modal approach achieves better overall accuracy than both the standalone GNN and LLM approaches with three fusion strategies.", "url": "https://arxiv.org/abs/2610.25775", "type": "理论", "summary": "1. 该工作提出一种多模态框架，以晶体结构图为输入的图神经网络与以材料属性及结构语义文本为输入的大语言模型并行建模，用于四类磁有序（非磁、铁磁、反铁磁、亚铁磁）的预测。\n2. 其技术要点在于对 GNN 与 LLM 输出做信息融合，并在 Materials Project、Magndata 与实验测定的铀化合物合并数据集上按 80/10/10 划分训练与评估，三种融合策略下整体准确率均优于任一单模态模型。\n3. 这表明晶体结构的图信息与语义文本描述具有互补性，为数据有限条件下的磁性材料高通量筛选与性质预测提供了可扩展路径。", "summary_source": "deepseek", "authors": [{"name": "Adam Zheng"}, {"name": "April Zheng"}, {"name": "Sheng Ran"}], "featured_authors": [{"name": "Adam Zheng"}, {"name": "April Zheng"}, {"name": "Sheng Ran"}], "author_count": 3}, {"id": "2610.25859", "category": "cond-mat", "title": "Effects of Nonmagnetic Impurities on Nonequilibrium Phase Transitions in Microwave-Driven Superconductors", "abstract": "We investigate the nonequilibrium steady states of a microwave-driven BCS superconductor in the presence of nonmagnetic impurity scattering and energy relaxation. Using the Floquet-Nambu-Keldysh Green's function method together with the self-consistent Born approximation, we self-consistently determine the superconducting order parameter in the microwave-driven steady state. We find that the nonequilibrium phase diagram depends strongly on the impurity-scattering strength. When impurity scattering is absent or weak, the steady-state order parameter is single-valued at each temperature and drive frequency. At intermediate scattering strengths, we find bistability between microwave-enhanced and microwave-suppressed superconducting states. As the impurity-scattering strength increases further, we instead find bistability between the superconducting and normal states. This evolution reflects competition between two effects of microwave driving: Eliashberg-type enhancement through the redistribution of thermally excited quasiparticles and suppression through pair-breaking-induced quasiparticle generation. In contrast to the robustness of equilibrium $s$-wave superconductivity against nonmagnetic impurity scattering, our results demonstrate that nonmagnetic impurity scattering plays a central role in determining the character of nonequilibrium superconducting phase transitions under microwave driving.", "url": "https://arxiv.org/abs/2610.25859", "type": "理论+数值", "summary": "1. 该工作结合周期驱动非平衡格林函数与自洽玻恩近似，研究了非磁性杂质散射和能量弛豫对微波驱动BCS超导体非平衡稳态相变的影响。\n2. 其核心在于自洽确定序参量并发现相图强烈依赖杂质强度：弱散射下序参量单值，中等散射出现微波增强与抑制超导态双稳，强散射转为超导—正常态双稳。\n3. 这揭示了准粒子重分布增强与破对产生准粒子抑制之间的竞争，并与平衡s波超导对非磁性杂质的鲁棒性形成对比，提示杂质工程可调控非平衡超导相变。", "summary_source": "deepseek", "authors": [{"name": "Taira Kawamura"}], "featured_authors": [{"name": "Taira Kawamura"}], "author_count": 1}, {"id": "2610.25884", "category": "cond-mat", "title": "Phase transitions of the antiferromagnetic $J_1$-$J_2$-$J_3$ Ising model on the cubic lattice", "abstract": "Motivated by the conflicting findings in prior studies regarding the nature of the phase transition for the three-dimensional antiferromagnetic $J_1$-$J_2$-$J_3$ Ising model on the cubic lattice with $J_1 = J_2 = J_3 = 1.0$, in this study we conduct a detailed investigation of this model using both Monte Carlo simulations and neural networks (NN). Here $J_1$ and $J_2$ are the intralayer nearest-neighbor and next-nearest-neighbor couplings, respectively, and $J_3$ is the nearest-neighbor interlayer interaction. By investigating the data obtained from much larger lattices than those used in previous studies, we find that the phase transition for $J_1 = J_2 = J_3 = 1.0$ is second order without any ambiguity. Hence we bring a resolution to this debate. Apart from $J_1 = J_2 = J_3 = 1.0$, we study the critical phenomenon associated with $J_2/J_1 = 4/7$ and $J_3 = J_1 = 1.0$ as well. In addition, by employing a dedicated training and testing strategy, our NN computation not only is much more efficient than those utilizing the standard procedures commonly used in the literature, but also requires only a per-mille fraction of the storage capacity needed by a conventional NN calculation when a large linear system size $L$ is considered. The method employed here provides an extremely resource-efficient route for applying NN techniques to study the critical behaviors of higher-dimensional systems.", "url": "https://arxiv.org/abs/2610.25884", "type": "理论+数值", "summary": "1. 该工作结合蒙特卡洛模拟与神经网络，在比以往更大的立方晶格上系统研究了反铁磁 J1-J2-J3 Ising 模型在 J1=J2=J3=1.0 以及 J2/J1=4/7、J3=J1=1.0 情形下的相变与临界现象。\n2. 其核心卖点是用更大尺度数据无歧义地判定 J1=J2=J3=1.0 处相变为二级并终结相关争论，同时专用训练测试策略使神经网络计算显著更高效，在大线性尺寸 L 下仅需常规神经网络计算约千分之一的存储。\n3. 这一极资源高效的神经网络路线为研究更高维系统的临界行为提供了可推广方案，也为复核相关模型争议给出了明确数值基准。", "summary_source": "deepseek", "authors": [{"name": "Kai-Wei Huang"}, {"name": "Chien-Ting Chen"}, {"name": "Shang-Wei Li"}, {"name": "Fu-Jiun Jiang"}], "featured_authors": [{"name": "Kai-Wei Huang"}, {"name": "Chien-Ting Chen"}, {"name": "Shang-Wei Li"}, {"name": "Fu-Jiun Jiang"}], "author_count": 4}, {"id": "2610.25913", "category": "cond-mat", "title": "A Stress-Induced Tetragonal Distortion in K2OsCl6 under Pressure", "abstract": "The structural behaviour of cubic (Fm-3m) K2OsCl6 under compression was investigated to 35.4 GPa using angle-dispersive synchrotron powder X-ray diffraction. Upon increasing pressure, K2OsCl6 undergoes a sequence of structural transformations from the ambient-pressure cubic phase to a tetragonal (P4/mnc) phase above 9.5(3) GPa, followed by a transition to a monoclinic (P21/n) phase beginning at approximately 14.2 GPa. The tetragonal and monoclinic phases coexist over the pressure range 14.2-17.2 GPa, while the monoclinic phase is observed as the sole phase at 17.9 GPa and remains stable up to the maximum pressure investigated. Analysis of the diffraction profiles and unit-cell parameters indicates that the intermediate tetragonal structure is likely associated with stress-induced symmetry lowering rather than a distinct thermodynamic phase. This distortion, which is adequately described by the tetragonal P4/mnc space group, is attributed to non-hydrostatic deviatoric stresses arising from the pressure-transmitting medium. Equation-of-state analysis reveals a pronounced reduction in compressibility across the structural transitions, with the bulk modulus increasing from 26(2) GPa for the cubic phase to 71(3) GPa for the monoclinic phase. The pressure-induced structural sequence is analogous to that reported for related compounds such as K2IrCl6, although the transitions in K2OsCl6 occur at lower pressures. All structural transformations are reversible upon decompression.", "url": "https://arxiv.org/abs/2610.25913", "type": "理论", "summary": "1. 该工作利用角散同步辐射粉末X射线衍射在最高35.4 GPa下研究了立方K2OsCl6的压缩结构演化。\n2. 其主要发现是约9.5 GPa以上出现的四方P4/mnc中间结构很可能由压力介质的非静水偏应力诱导对称性降低所致，而非独立热力学相，随后在约14.2 GPa开始转变为单斜P21/n相，并使体模量由26(2) GPa增至71(3) GPa。\n3. 这一结果提示高压相变判定需区分应力诱导畸变与热力学相变，也为K2OsCl6与K2IrCl6等相关化合物高压结构行为的比较提供了依据。", "summary_source": "deepseek", "authors": [{"name": "Neha Bura"}, {"name": "Peije Zhang"}, {"name": "Ganesh Bera"}, {"name": "Catalin Popescu"}, {"name": "Caleb J. Bennett"}, {"name": "Brendan J. Kennedy"}, {"name": "Daniel Errandonea"}], "featured_authors": [{"name": "Neha Bura"}, {"name": "Peije Zhang"}, {"name": "Ganesh Bera"}, {"name": "Caleb J. Bennett"}, {"name": "Brendan J. Kennedy"}, {"name": "Daniel Errandonea"}], "author_count": 7}, {"id": "2610.25945", "category": "cond-mat", "title": "Effect of chirality on active elastomers and solids in three dimensions", "abstract": "We examine the effect of chiral activity on nematic and polar uniaxial elastomers and solids by constructing the general hydrodynamic equations for these phases. We start with the elastomer, which is not only invariant under rigid rotations but also under an independent rotation of the uniaxial direction, and show that this higher symmetry strongly constrains the effects of chiral activity. We then break the elastomeric symmetry by adding a symmetry-breaking term to the free energy but still retain invariance under rigid rotations. The resulting state has the symmetry of a uniaxial solid, and we show that in a fixed background medium chiral activity generically destabilises it. The force density responsible for this {instability} vanishes as the field that breaks the elastomeric symmetry goes to zero. Further, the presence of the symmetry-breaking field also allows for an additional odd elastic force density that generically destabilises momentum-conserved chiral and uniaxial solids in the inertial regime.", "url": "https://arxiv.org/abs/2610.25945", "type": "理论", "summary": "1. 该工作构建了手性活性向列与极性单轴弹性体及固体的通用流体动力学方程，并系统比较弹性体高对称性与单轴固体破缺对称性对手性活性响应的约束。\n2. 其核心卖点是揭示弹性体独立单轴转动的高对称性会强烈限制手性活性，而引入保持刚体转动、仅破缺弹性体对称性的自由能项后，固定背景中的手性活性普遍导致失稳，且失稳力密度随破缺场趋零而消失。\n3. 该结果进一步表明破缺场可诱导额外奇弹性力密度，并在惯性区使动量守恒的手性与单轴固体失稳，为主动手性固体的稳定性判据与后续实验设计提供了明确依据。", "summary_source": "deepseek", "authors": [{"name": "S. J. Kole"}, {"name": "Gareth P. Alexander"}, {"name": "Ananyo Maitra"}, {"name": "Sriram Ramaswamy"}], "featured_authors": [{"name": "S. J. Kole"}, {"name": "Gareth P. Alexander"}, {"name": "Ananyo Maitra"}, {"name": "Sriram Ramaswamy"}], "author_count": 4}, {"id": "2610.25953", "category": "cond-mat", "title": "Chirality destroys oriented active solids", "abstract": "We construct a hydrodynamic theory of the effect of chiral and active force densities on three-dimensional uniaxial solids. We show that in a fixed background medium active chiral force densities---that arise at lower order in gradients than odd elasticity---generically destabilise the solid state. We further show this active instability also affects isotropic chiral solids in an anisotropic medium, a situation that is relevant for cell clusters moving through the extracellular matrix. Interestingly, the instability is eliminated in a higher-symmetry solid, known as the polar elastomer; indeed, we show that chirality does not affect the leading-order mechanics of such materials. We further demonstrate that momentum-conserving polar active solids have two chiral odd elasticities in contrast to the one discussed for two-dimensional solids. However, we again find that the higher symmetry of polar elastomers eliminates one of these with the remaining one being equivalent to the two-dimensional odd elastic force density. Our results should apply to numerous biological and condensed matter systems.", "url": "https://arxiv.org/abs/2610.25953", "type": "理论", "summary": "1. 该工作构建了描述三维单轴固体中手性与主动力密度的流体力学理论，并证明在固定背景介质中，低于奇弹性阶的手性主动力密度通常会破坏固体态，且该不稳定性也影响各向异性介质中的各向同性手性固体。\n2. 其关键卖点在于指出更高对称性的极性弹性体中手性不影响最低阶力学，并发现动量守恒的极性主动固体在三维有两个手性奇弹性，而极性弹性体对称性会消去其中一个，剩余项等价于二维奇弹力密度。\n3. 这一结果将手性主动不稳定性与细胞簇在细胞外基质中迁移等生物体系以及凝聚态体系联系起来，并为区分三维与二维奇弹性和极性弹性体对称性效应提供明确判据。", "summary_source": "deepseek", "authors": [{"name": "S. J. Kole"}, {"name": "Gareth P. Alexander"}, {"name": "Ananyo Maitra"}, {"name": "Sriram Ramaswamy"}], "featured_authors": [{"name": "S. J. Kole"}, {"name": "Gareth P. Alexander"}, {"name": "Ananyo Maitra"}, {"name": "Sriram Ramaswamy"}], "author_count": 4}, {"id": "2610.26012", "category": "cond-mat", "title": "Methods of density functional theory in one dimension", "abstract": "Density functional theory is formally justified by an existence proof. As such, the need for computational methods to study the theory is a useful route to understanding the full theory. In this paper, we discuss the numerical strategies to efficiently evaluate computations for Kohn-Sham systems in one dimension and also methods for determining exact properties, including time-dependence. An accompanying library is also available for computing one-dimensional density functional theory and publicly available. The expressions used to implement the density functional in one-dimension are surveyed. An alternative justification for a gradient-based technique is also shown that can be applied to time-dependent evolution of the exact Kohn-Sham potential.", "url": "https://arxiv.org/abs/2610.26012", "type": "理论+数值", "summary": "1. 该文系统讨论了在一维Kohn-Sham密度泛函理论中高效开展数值计算的方法，并给出确定含时等精确性质的数值途径以及配套的公开计算库。\n2. 其技术卖点是梳理一维密度泛函实现所需表达式，并为可用于精确Kohn-Sham势含时演化的梯度类技术提供替代性论证。\n3. 这为低维密度泛函算法的落地、精确基准的构建以及含时Kohn-Sham势演化研究提供了可复用的工具与方法启发。", "summary_source": "deepseek", "authors": [{"name": "Thomas E. Baker"}, {"name": "Kasey Chen"}], "featured_authors": [{"name": "Thomas E. Baker"}, {"name": "Kasey Chen"}], "author_count": 2}, {"id": "2610.26053", "category": "cond-mat", "title": "Gini coefficient of scientists and universities", "abstract": "Using the public database of Google Scholar article citations of scientists and universities we apply the algorithm for constructing Lorenz curves to the resulting citation distributions. Using Lorenz and Pareto curves, broadly used for economic analyses of wealth inequality across countries, we show that this approach gives a useful insight of citation distributions of world-leading scientists characterized by the Gini coefficient $G$ obtained from the Lorenz curves. For articles of 15 Nobel laureates (including A. Einstein and R. Feynman) we find the average $G=0.81$ with 50% of articles capturing only 2.7% of all citations and the top 10% (1%) of articles capturing 71% (30%) of all citations. Furthmore, we determine for world-leading universities the Gini coefficient via the citations of affiliated scientists. We show that about 65 percent of all citations belonging to a university (e.g. Princeton, Cambridge) are generated only by 10 percent of their university scientists while 50% of scientists produce only 3% of all university citations. The citation distributions are well described by the concept of Rayleigh-Jeans thermalization and condensation with similarities traced to the world wealth inequality.", "url": "https://arxiv.org/abs/2610.26053", "type": "数值", "summary": "1. 该工作基于谷歌学术的科学家与大学论文引用数据构建洛伦兹曲线和帕累托曲线，用基尼系数刻画引用分布，并分析15位诺奖得主及世界领先大学的引用集中度。\n2. 其方法学卖点是将经济学不平等度量与瑞利-金斯热化/凝聚图像联系，发现诺奖得主平均基尼系数为0.81、前10%论文占71%引用，大学约10%科学家贡献65%引用。\n3. 这为量化科研引用集中、比较机构与个体影响力提供了可迁移框架，并提示引用分布与财富不平等及热化凝聚统计之间可能存在深层类比。", "summary_source": "deepseek", "authors": [{"name": "Klaus M. Frahm"}, {"name": "Dima L. Shepelyansky"}], "featured_authors": [{"name": "Klaus M. Frahm"}, {"name": "Dima L. Shepelyansky"}], "author_count": 2}, {"id": "2610.26057", "category": "cond-mat", "title": "Magnetoelectric Bulk Photovoltaic Effect in Centrosymmetric Solids", "abstract": "It is commonly believed that a bulk photovoltaic current requires broken spatial inversion symmetry. However, in this work, we demonstrate that dc photocurrents can arise in centrosymmetric solids from the bilinear coupling between the electric and magnetic components of light. This magnetoelectric bulk photovoltaic effect (MBPE) has a quantum-geometric origin in the dipole moments of the Zeeman quantum metric and Zeeman Berry curvature. We identify four distinct MBPE mechanisms, including time-reversal-even and time-reversal-odd injection-like and shift-like photocurrents driven by linearly or circularly polarized light. Our symmetry analysis shows that the MBPE is allowed in broad classes of two-dimensional centrosymmetric nonmagnetic and magnetic materials under normally incident light. As representative examples, we predict sizable MBPEs in centrosymmetric monolayer Pt$_2$HgSe$_3$ and altermagnetic RuF$_4$, with current densities on the order of $1~\\mathrm{mA/m}$. Notably, the injection-like photocurrent in RuF$_4$ reverses sign upon switching either the light helicity or the Néel vector. Our results extend the bulk photovoltaic effect to centrosymmetric solids and open new opportunities for electrical readout of altermagnetic order.", "url": "https://arxiv.org/abs/2610.26057", "type": "理论", "summary": "1. 该工作证明中心对称固体中可由光电场与磁场分量的双线性耦合产生直流光电流，即磁电体光伏效应，并识别四种机制。\n2. 其核心卖点在于将电流起源归结为塞曼量子度规与塞曼贝里曲率偶极矩的量子几何，并给出时间反演偶/奇、线/圆偏振驱动的注入型与位移型机制及对称性判据。\n3. 在中心对称单层Pt2HgSe3与交变磁体RuF4中预测mA/m量级电流，且RuF4注入型电流随光螺旋度或奈尔矢量翻转反号，为交变磁序的电学读出提供启发。", "summary_source": "deepseek", "authors": [{"name": "Longjun Xiang"}, {"name": "Fuming Xu"}, {"name": "Lei Zhang"}, {"name": "Jian Wang"}], "featured_authors": [{"name": "Longjun Xiang"}, {"name": "Fuming Xu"}, {"name": "Lei Zhang"}, {"name": "Jian Wang"}], "author_count": 4}, {"id": "2610.26076", "category": "cond-mat", "title": "A project of the thermal triple axis spectrometer at the PIK reactor", "abstract": "A project of the novel thermal triple axis spectrometer IN1 at the PIK reactor is presented. Monte Carlo simulations were used for optimization its main parameters. The optimization of the instrument gives an estimated neutron flux as high as 109 n/cm2/s at the sample position at neutron energy about 36 meV at the designed 100 MW power. The modelling of neutron stages like monochromators, analyzers, virtual source, as well as instrument shielding was fulfilled to obtain the best performance of the spectrometer.", "url": "https://arxiv.org/abs/2610.26076", "type": "理论+数值", "summary": "1. 该工作提出了PIK反应堆上新型热中子三轴谱仪IN1的总体设计方案，并利用蒙特卡罗模拟对其主要参数进行了优化。\n2. 其技术卖点在于设计100 MW功率和约36 meV中子能量下，样品位置估算中子通量可达10⁹ n·cm⁻²·s⁻¹，同时对单色器、分析器、虚拟源和仪器屏蔽等中子环节逐一建模以保证谱仪性能。\n3. 这一结果可为IN1的后续建造、调试与运行提供量化性能预期，并为PIK反应堆上热中子三轴谱学的实验布局提供设计依据。", "summary_source": "deepseek", "authors": [{"name": "Maria Iuzviuk"}, {"name": "Nikita Kovalenko"}, {"name": "Vladislav Tolichev"}, {"name": "Aleksandr Ovsianikov"}, {"name": "Oleg Usmanov"}, {"name": "Anna Matveeva"}, {"name": "Igor Zobkalo"}, {"name": "Vladislav Tarnavich"}], "featured_authors": [{"name": "Maria Iuzviuk"}, {"name": "Nikita Kovalenko"}, {"name": "Vladislav Tolichev"}, {"name": "Anna Matveeva"}, {"name": "Igor Zobkalo"}, {"name": "Vladislav Tarnavich"}], "author_count": 8}, {"id": "2610.26129", "category": "cond-mat", "title": "Generalised Fluctuating Dynamic Density-Functional Theory: Derivation and Applications", "abstract": "Classical density-functional theory is a powerful theoretical framework for studying the equilibrium density distribution of complex many-body systems. The core of the framework is to bridge microscopic and macroscopic descriptions of fluids through a variational principle that minimises the system's free energy. For dynamical settings, dynamic DFT (DDFT) extends the equilibrium framework to capture the time evolution of an order parameter, typically density. However, DDFT is often insufficient for mesoscopic systems far from equilibrium where fluctuations become significant, necessitating a stochastic extension: fluctuating DDFT. Here we derive a generalised FDDFT from first principles starting from the microscopic Hamiltonian dynamics using coarse-graining techniques, including Zwanzig's projection operator method. The resulting FDDFT applies to arbitrary observable fields, where the dynamics are driven by a thermodynamic force expressed in terms of an entropy functional. The dynamics consist of reversible, dissipative, and stochastic contributions, each directly linked to the underlying microscopic dynamics via the Liouville operator, Green-Kubo relations, and the fluctuation-dissipation theorem. To highlight the difference in the level of description between DDFT and FDDFT, we demonstrate how further coarse-graining via averaging leads to a generalised DDFT, valid at the macroscale. To showcase the effectiveness and utility of the generalised FDDFT, we apply it to two prototypical fluid systems: colloidal and simple viscous fluids. In the former case, we utilise the new formalism to re-derive the recently found colloidal FDDFT. In the latter case, we rigorously recover the non-isothermal extension of the Landau-Lifshitz fluctuating Navier-Stokes equations, providing fundamental derivation of this well-known phenomenological model, enabling to clarify its underlying principles.", "url": "https://arxiv.org/abs/2610.26129", "type": "理论+数值", "summary": "1. 该工作从微观哈密顿动力学出发，借Zwanzig投影等粗粒化方法推导出适用于任意可观测量场的广义涨落动态密度泛函理论。\n2. 其关键是将动力学拆为可逆、耗散与随机三部分，并分别用Liouville算符、Green-Kubo关系和涨落耗散定理与微观动力学对应，热力学驱动力由熵泛函给出。\n3. 进一步平均粗粒化可得宏观广义DDFT，并在胶体体系重现胶体FDDFT、在简单黏性流体中严格导出非等温Landau-Lifshitz涨落Navier-Stokes方程，为后者提供基础性推导并厘清原理。", "summary_source": "deepseek", "authors": [{"name": "Toby Kay"}, {"name": "Serafim Kalliadasis"}], "featured_authors": [{"name": "Toby Kay"}, {"name": "Serafim Kalliadasis"}], "author_count": 2}, {"id": "2610.26135", "category": "cond-mat", "title": "Evidence of valence bond solid and quantum paramagnetism in the $J_1$--$J_2$--$J_3$ Heisenberg model from pseudofermion functional renormalization group", "abstract": "Motivated by recent tensor network studies reporting a quantum spin liquid (QSL) within the quantum paramagnetic (QP) regime, we investigate numerically the zero-temperature phase diagram of the $J_1$--$J_2$--$J_3$ Heisenberg model on the square lattice using the pseudofermion functional renormalization group (pf-fRG). Thanks to improved frequency resolution and larger lattice truncations, we are able to explore a significantly larger parameter space than previous pf-fRG work to map out the phase boundary of an extended QP region. We further resolve possible bond order within the QP regime by measuring the dimer response to small deformations in $J_1$, i.e. bond anisotropy that breaks the point-group symmetry of the Hamiltonian. The functional renormalization group flow of the dimer susceptibility suggests that the QP window splits into two: a region where it grows continuously down to the lowest energy scale to signal valence bond solid (VBS) order, and another region where it reaches a peak at a finite scale and is subsequently suppressed to indicate a QSL.", "url": "https://arxiv.org/abs/2610.26135", "type": "理论+数值", "summary": "1. 该工作用赝费米子泛函重整化群（pf-fRG）数值计算正方晶格 J1–J2–J3 海森堡模型零温相图，并重点刻画扩展的量子顺磁区域及其相边界。\n2. 其技术卖点在于提升频率分辨率与晶格截断规模以覆盖更大参数空间，并通过 J1 键各向异性微扰测量二聚化响应，由二聚化磁化率的重整化群流区分连续增长至最低能标的 VBS 与有限能标峰值后被抑制的 QSL。\n3. 该结果提示量子顺磁窗口内部可能存在 VBS 与 QSL 的分裂，为后续张量网络与实验判别键序及自旋液体候选参数区提供可检验方向。", "summary_source": "deepseek", "authors": [{"name": "Gün Günal"}, {"name": "Erhai Zhao"}, {"name": "Ahmet Keleş"}], "featured_authors": [{"name": "Gün Günal"}, {"name": "Erhai Zhao"}, {"name": "Ahmet Keleş"}], "author_count": 3}, {"id": "2610.26149", "category": "cond-mat", "title": "Motility-Induced Phase Separation of Run-and-Tumble Particles under Local Stochastic Resetting", "abstract": "We investigate the non-equilibrium stationary states of a one-dimensional active gas composed of run-and-tumble particles (RTPs) undergoing motility-induced phase separation (MIPS) and subjected to local stochastic resetting at the origin. Unlike global resetting, local resetting maintains a mass-injection flux at the origin while preserving large-scale spatial self-organization. We demonstrate that above a critical resetting rate $r_c$, the active system undergoes a transition toward a stationary two-phase state featuring a dense liquid droplet centered at the origin coexisting with a surrounding gas phase. Using kinetic evolution equations, we derive the exact steady-state density profile expressed in terms of the Lambert function. The size of the droplet has a non-monotonic dependence on the resetting rate $r$, and attains its maximum. Furthermore, we analyze the dynamical stability of the supersaturated gas phase and show that a nucleated droplet relaxes exponentially toward its steady-state size with a relaxation timescale of $1/r$. We extend our framework to model a finite resetting velocity, proving that the stationary droplet size is invariant with respect to the resetting velocity.", "url": "https://arxiv.org/abs/2610.26149", "type": "理论", "summary": "1. 该工作研究一维跑动-翻滚活性气体在原点局域随机重置下的非平衡稳态，并分析运动诱导相分离与局域质量注入通量的耦合。\n2. 其核心卖点在于证明超过临界重置率后系统形成以原点为中心的致密液滴与外围气相共存的定态两相结构，给出用Lambert W函数精确表达的稳态密度分布，并揭示液滴尺寸随重置率非单调变化且存在极大值。\n3. 该框架进一步表明过饱和气相中的成核液滴以1/r时间尺度指数弛豫，且有限重置速度不改变稳态液滴尺寸，为局域重置调控活性相分离提供了可检验启示。", "summary_source": "deepseek", "authors": [{"name": "Pascal Grange"}], "featured_authors": [{"name": "Pascal Grange"}], "author_count": 1}, {"id": "2610.26277", "category": "cond-mat", "title": "Finite-size scaling of spin-wave scattering and enhancement in magnonic Fabry-Pérot nanoresonators", "abstract": "Magnonic neural networks require compact resonant nodes that scatter spin waves efficiently, concentrate spin-wave energy and can be reconfigured. Hybrid magnonic Fabry-Pérot resonators, formed by a ferromagnetic-metal stripe dipolar-coupled to a yttrium iron garnet (YIG) film, provide low-loss and programmable control of spin-wave transmission, but have so far been studied only for stripes that are long compared with the spin-wave wavelength. Here we use micromagnetic simulations to determine how the response of a 200-nm-wide CoFeB stripe on a 55-nm-thick YIG film evolves as the stripe length is reduced from infinity to 640 nm. An infinitely long stripe acts as a one-dimensional cavity that opens a transmission gap at the first-order resonance (1.70 GHz and 1.47 GHz for the parallel and antiparallel magnetic configuration) and enhances the out-of-plane precession amplitude in the YIG film by factors of about 5 and 12, without distorting the transmitted wavefront. For lengths of a few micrometers, backward-volume spin waves emitted from the stripe ends modulate the precession along the stripe and fragment the reflected and transmitted wavefronts. Below about 1.2 micrometer, the resonator scatters incident spin waves over the entire isofrequency contour of the film, with caustic beams that are most pronounced in the antiparallel configuration. In this regime the parallel configuration supports weakly enhanced quantized modes, whereas the antiparallel configuration supports a single mode with an out-of-plane enhancement of about 15. The width, thickness and shape of the stripe tune this mode by 50-100 MHz, and its strong enhancement lowers the onset of nonlinear frequency shift and fold-over to incident amplitudes of a few percent of the saturation magnetization. Sub-micrometer magnonic resonators are therefore promising reconfigurable nonlinear nodes for magnonic networks.", "url": "https://arxiv.org/abs/2610.26277", "type": "数值", "summary": "1. 该文用微磁模拟研究200纳米宽钴铁硼条与55纳米厚钇铁石榴石膜构成的混合磁子法布里–珀罗腔，在条长由无限长减至640纳米时的自旋波散射与增强。\n2. 其关键发现是无限长条形成一维腔，在1.70/1.47吉赫兹（平行/反平行）打开透射隙并将钇铁石榴石面外进动增强约5/12倍；亚微米尺度下散射扩展至整个等频线并出现焦散束，反平行构型支持约15倍增强的单模，几何可调谐50–100兆赫兹且显著降低非线性阈值。\n3. 这为将亚微米磁子谐振腔用作可重构非线性节点、进而构建磁子神经网络提供了明确依据。", "summary_source": "deepseek", "authors": [{"name": "Anton Lutsenko"}, {"name": "Sebastiaan van Dijken"}], "featured_authors": [{"name": "Anton Lutsenko"}, {"name": "Sebastiaan van Dijken"}], "author_count": 2}, {"id": "2610.26301", "category": "cond-mat", "title": "Machine Learning-Assisted Discovery of Carbon-Related Defect Formation Mechanisms in Diamond", "abstract": "Diamond is an important host material for functional defects such as solid-state spin qubits. During the defect creation by irradiation and subsequent thermal annealing, carbon-related defects, including vacancies and interstitials, are generated and can migrate to form new defect complexes. To investigate this kinetically driven process and reveal the formation mechanisms of the di-interstitials and di-vacancies in the neutral charge state, we fine-tuned a universal machine learning interatomic potential using a small dataset generated from density functional theory calculations. We obtained a barrier of 1.84 eV for mono-interstitial migration and found that two initially separated mono-interstitials only need to overcome a lower barrier to form di-interstitial configurations. Beyond the training data, the MLIP also identified the formation pathway for an additional di-interstitial configuration and a stepwise divacancy dissociation mechanism. These results reveal migration-assisted defect complex formation mechanisms and demonstrate how targeted MLIP training can identify reaction pathways.", "url": "https://arxiv.org/abs/2610.26301", "type": "理论+数值", "summary": "1. 该工作用少量DFT数据微调通用机器学习原子间势，研究金刚石中中性碳相关间隙与空位复合物在辐照退火过程中的形成机制。\n2. 其卖点在于给出单间隙迁移势垒1.84 eV，并揭示两个分离单间隙以更低势垒形成双间隙，且模型外推出额外双间隙路径和分步双空位解离机制。\n3. 这表明靶向训练MLIP可识别动力学驱动的缺陷反应路径，为金刚石自旋量子比特等缺陷的可控制备提供机理启发。", "summary_source": "deepseek", "authors": [{"name": "Grace Huang"}, {"name": "Christopher Fivecoat"}, {"name": "Xun Xu"}, {"name": "Mengen Wang"}], "featured_authors": [{"name": "Grace Huang"}, {"name": "Christopher Fivecoat"}, {"name": "Xun Xu"}, {"name": "Mengen Wang"}], "author_count": 4}, {"id": "2610.26316", "category": "cond-mat", "title": "Poisson-shot-noise induced escape dynamics of a passive particle and a dimer", "abstract": "Mean First Passage Time (MFPT) is a crucial quantity that characterizes stochastic processes in various stochastic dynamical systems across different disciplines. The inverse of the MFPT, known as the escape rate, is helpful in the context of Brownian motion and chemical processes. The MFPT dynamics of a passive particle in the presence of active noises presents a fascinating avenue. In this work, we study the dynamics of two different systems: first, a single Brownian particle and second, a dimer (two Brownian particles connected by a spring). In both cases, the systems are kept in contact with a thermal bath and an active bath, and are trapped in a bistable potential. The active bath produces kicks that follow the Poisson distribution. The MFPT of the particle and the dimer is investigated in various scenarios. Analytical results are presented for the small kick variance approximation only. In this approximation, we formulate the MFPT in two scaling regimes: a weak-noise regime characterized by classical Arrhenius scaling for escape rate and a strong-noise regime in which the MFPT scales as a power law in the effective noise strength. For the general case, the problem is solved numerically. Next, under the same approximation, the MFPT of a dimer in the small-bond-strength regime is studied using a sequential-hopping mechanism, and in the large-bond-strength regime, the MFPT is formulated using the adiabatic elimination approach. Motivated by recent studies on speeding up the escape mechanism, the MFPT of the particle and the dimer in the presence of an intermediate barrier is also examined. We deduced from the numerical results that the MFPT can be enhanced and further optimized by selecting a suitable intermediate potential profile.", "url": "https://arxiv.org/abs/2610.26316", "type": "数值", "summary": "1. 该工作研究了热浴与泊松脉冲活性浴共同作用下，双稳势阱中单个布朗粒子及弹簧连接二聚体的平均首次通过时间与逃逸动力学。\n2. 其要点是在小脉冲方差近似下给出弱噪声Arrhenius标度与强噪声幂律标度的解析MFPT，并用序贯跳跃和绝热消去分别处理小二聚体键强与大键强，其余情形数值求解。\n3. 数值结果表明选取合适的中间势垒剖面可增强并进一步优化MFPT，这为活性噪声环境中逃逸速率的调控提供了可检验的设计思路。", "summary_source": "deepseek", "authors": [{"name": "Gemeit Goel"}, {"name": "Rahul Marathe"}], "featured_authors": [{"name": "Gemeit Goel"}, {"name": "Rahul Marathe"}], "author_count": 2}, {"id": "2610.26328", "category": "cond-mat", "title": "High-order resonances and emergent coherent dynamics in interacting Stark chains", "abstract": "A linear potential gradient can strongly suppress quantum dynamics, while interactions can activate resonant many-body processes whose higher-order structure remains largely unexplored. Here we uncover a systematic hierarchy of high-order interaction--tilt resonances in an interacting Stark chain, where the resonance order counts the minimal number of elementary exchange steps involved. These resonances manifest as long-lived coherent oscillations with order-dependent timescales. By isolating individual resonant channels and developing a microscopic effective description, we connect these dynamical timescales to the underlying many-body exchange processes and reveal a pronounced dependence on the initial-state structure. Our results provide crucial insights into high-order many-body resonances and show how commensurate interaction-to-tilt ratios generate a hierarchy of parametrically slow coherent many-body dynamics.", "url": "https://arxiv.org/abs/2610.26328", "type": "理论", "summary": "1. 该工作在一维相互作用斯塔克链中系统揭示了由相互作用与倾斜势之比的有理匹配所支配的高阶共振层级，其阶数对应最小基本交换步数。\n2. 其卖点在于这些高阶通道表现为阶数依赖的长寿命相干振荡，并通过隔离单个共振通道、建立微观有效描述，把动力学时间尺度与多体交换过程及初态结构定量关联。\n3. 这为理解高阶多体共振以及利用共度相互作用-倾斜比产生参数化慢的相干多体动力学提供了可检验的微观框架。", "summary_source": "deepseek", "authors": [{"name": "Jiahe Chang"}, {"name": "Hongzheng Zhao"}], "featured_authors": [{"name": "Jiahe Chang"}, {"name": "Hongzheng Zhao"}], "author_count": 2}, {"id": "2610.26356", "category": "cond-mat", "title": "Origins of Faceted Anomalous Scaling", "abstract": "Fluctuating interfaces are typically characterized by their global, spectral, and local roughness exponents. Faceted anomalous scaling, characterized by $\\alpha_s>1$, $\\alpha_s\\neq\\alpha$, and $\\alpha_{\\mathrm{loc}}=1$, owes its name to the tendency of such interfaces to develop long, nearly linear segments called facets. Its statistical origin, and whether facets are required, have remained unclear. We show that this exponent structure is determined by the spatial statistics of the slope field. Slope increments split into typical fluctuations and rare, larger jumps. This anomalous scaling arises either when the typical slope increment displays genuine system-size-dependent anomalous scaling or when the rare jumps dominate the second moment. The two contributions can coexist, and their competition leads to bifractal scaling of the slopes. We establish this framework analytically in the generalized anharmonic Larkin model and the columnar Kardar--Parisi--Zhang equation, and we derive exactly the global, spectral, and local roughness exponents in both cases. The Larkin model realizes both mechanisms and produces anomalous interfaces with or without facets, whereas columnar KPZ belongs to the jump-dominated case and yields $\\alpha_s=3/2$.", "url": "https://arxiv.org/abs/2610.26356", "type": "理论", "summary": "1. 该工作从斜率场空间统计出发，厘清分面异常标度（α_s>1、α_s≠α、α_loc=1）的统计起源，并在广义非谐Larkin模型与柱状KPZ方程中解析建立框架、精确导出全局、谱与局域粗糙度指数。\n2. 其关键在于把斜率增量分为典型涨落与稀有跳跃，证明异常标度既可源于典型增量随系统尺寸的异常标度，也可由稀有跳跃主导二阶矩产生；二者共存导致斜率双分形，且分面并非必要条件。\n3. 这为区分跳跃主导与典型涨落主导机制、检验柱状KPZ的α_s=3/2预言及设计无分面异常界面提供了可操作判据和理论启发。", "summary_source": "deepseek", "authors": [{"name": "Maximilien Bernard"}, {"name": "José Luis Iguain"}, {"name": "Alejandro Kolton"}, {"name": "Alberto Rosso"}], "featured_authors": [{"name": "Maximilien Bernard"}, {"name": "José Luis Iguain"}, {"name": "Alejandro Kolton"}, {"name": "Alberto Rosso"}], "author_count": 4}, {"id": "2610.26371", "category": "cond-mat", "title": "An infinite sequence of higher order Ehrenfest transitions in a one-dimensional crystal", "abstract": "Higher-order Ehrenfest phase transitions are exceptionally rare and poorly understood. We present an exactly solvable one-dimensional model exhibiting a sequence of Ehrenfest transitions of arbitrary $n\\geq2$ order. These transitions occur without symmetry breaking and even the second-order transition lacks conventional critical behavior, although the density derivative of the correlation length diverges. Our results reveal a distinct class of noncritical phase transitions and help clarify the scope of the Ehrenfest classification.", "url": "https://arxiv.org/abs/2610.26371", "type": "理论", "summary": "1. 针对高阶 Ehrenfest 相变罕见且理解不足的问题，该工作构建了一个可精确求解的一维晶体模型，证明其中存在任意 n≥2 阶的无限序列 Ehrenfest 相变。\n2. 其核心卖点是这些相变无需对称破缺，且二阶相变虽缺乏常规临界行为，关联长度对密度的导数仍发散，从而揭示出一类与常规临界性不同的非临界相变。\n3. 这有助于厘清 Ehrenfest 分类的适用范围，并为在可解晶格模型中系统研究高阶与非临界相变、进而检验其普适性提供了明确范例。", "summary_source": "deepseek", "authors": [{"name": "Sakineh Mizani"}, {"name": "Szabolcs Varga"}, {"name": "Martin Oettel"}, {"name": "Péter Gurin"}], "featured_authors": [{"name": "Sakineh Mizani"}, {"name": "Szabolcs Varga"}, {"name": "Martin Oettel"}, {"name": "Péter Gurin"}], "author_count": 4}, {"id": "2610.26502", "category": "cond-mat", "title": "Atomic-level study of dose-dependent lattice thermal conductivity degradation in irradiated tungsten", "abstract": "Plasma-facing components (PFCs) in future fusion reactors must withstand extreme environments, making tungsten (W) a prime candidate material due to its high thermal conductivity, high melting temperature, low sputtering yield, low tritium absorption. However, neutron irradiation introduces complex nanostructural defects that severely degrade these critical properties. In this work, we use Non-Equilibrium Molecular Dynamics (NEMD) simulations coupled with the Creation Relaxation Algorithm (CRA) to investigate the lattice thermal conductivity (kappa) of W across a wide range of irradiation doses. Systems treated with different doses up to 1.8 canonical displacements per atom (cdpa) were simulated to generate and study diverse defect structures, including vacancies and self-interstitial atom (SIA) clusters. By correlating spatially-resolved temperature gradients with local defect concentrations, we show that even small changes in defect type and distribution significantly affect thermal transport. We employ Machine Learning (ML) models to develop a quantitative relationship between the defect features and the resulting thermal conductivity degradation. The ML analysis identifies vacancy density as the dominant structural factor controlling thermal transport. We found a significant, nonlinear suppression of kappa with increasing defect density. Predictive multi-defect mapping built upon our ML model resolved a step-like degradation transition at a critical vacancy threshold of 0.05 at.%, beyond which phonon scattering completely saturated and capped the maximum relative lattice thermal conductivity degradation at approximately 30 at.%. This integrated simulation and ML approach provides a powerful, predictive framework for quantifying the complex relationship between structure and thermal conductivity in irradiated fusion materials.", "url": "https://arxiv.org/abs/2610.26502", "type": "理论+数值", "summary": "1. 该工作结合非平衡分子动力学与创建—弛豫算法，模拟高达1.8个规范位移每原子辐照剂量下钨中的空位与自间隙原子团簇等缺陷，并考察其晶格热导率退化。\n2. 其卖点是用空间分辨温度梯度与局部缺陷浓度关联，并以机器学习建立多缺陷特征到热导率退化的定量映射，识别空位密度为主导因素并揭示非线性抑制及0.05原子百分比临界空位阈值后的台阶式饱和。\n3. 该框架为辐照聚变材料中结构—热输运关系的预测与剂量依赖评估提供了可迁移的原子尺度建模思路。", "summary_source": "deepseek", "authors": [{"name": "Mary K Chessey"}, {"name": "José Julio Gutiérrez Moreno"}, {"name": "Sajjan Singh Mehta"}, {"name": "Paolo Settembri"}, {"name": "Arda Erbasan"}, {"name": "Dominik Freinberger"}, {"name": "Marina García Romero"}, {"name": "Mervi J Mantsinen"}], "featured_authors": [{"name": "Mary K Chessey"}, {"name": "José Julio Gutiérrez Moreno"}, {"name": "Sajjan Singh Mehta"}, {"name": "Dominik Freinberger"}, {"name": "Marina García Romero"}, {"name": "Mervi J Mantsinen"}], "author_count": 8}, {"id": "2610.26536", "category": "cond-mat", "title": "Exact cost of the Euclidean Maximum Traveling Salesman Problem in one dimension", "abstract": "We study the random Euclidean Maximum Traveling Salesman Problem: finding a Hamiltonian cycle of maximal total cost through any set of $N$ cities on a line, where each edge cost is a function of its Euclidean length. We characterize the maximizing cycles for convex increasing, concave increasing, and convex decreasing cost functions. For points sampled independently and uniformly from the unit interval, we derive explicit expressions for the average maximal cost for arbitrary $N$ and asymptotic expansions with power-law edge costs.", "url": "https://arxiv.org/abs/2610.26536", "type": "理论", "summary": "1. 该文在一维随机欧氏最大旅行商问题中，针对凸增、凹增和凸减三类仅依赖欧氏长度的边代价函数，刻画了使哈密顿回路总代价最大的循环结构。\n2. 对单位区间上独立均匀采样的N个城市，作者给出任意N下平均最大代价的显式表达式，并推导幂律边长代价下的渐近展开。\n3. 这些精确有限N结果与渐近式揭示代价函数形状如何决定最大回路成本，并为最大TSP启发式算法及与最小TSP的对照提供可检验基准。", "summary_source": "deepseek", "authors": [{"name": "Sergio Caracciolo"}, {"name": "Carlo Vanoni"}], "featured_authors": [{"name": "Sergio Caracciolo"}, {"name": "Carlo Vanoni"}], "author_count": 2}, {"id": "2610.26561", "category": "cond-mat", "title": "Coexistence phase of the two-dimensional Vicsek model", "abstract": "The Vicsek model continues to be central in statistical physics studies of active matter, with major recent surprises such as the partial metastability of the famous Toner-Tu flocking phase. Here we report on the diversity of band patterns observed in its coexistence phase --some of them never observed before--, but we also argue that most disappear in the infinite-size limit, leaving nevertheless a different picture than anticipated previously. We finally show that these rather regular, globally ordered band configurations can be destroyed by a localized perturbation: the coexistence phase is also at least partially metastable, and thus must be, asymptotically, a disordered phase made of a variety of chaotically interacting traveling bands.", "url": "https://arxiv.org/abs/2610.26561", "type": "理论", "summary": "1. 该工作系统考察二维Vicsek模型共存相中条带图案的多样性，报道了此前未见的构型，并区分有限尺寸下可见图案与无穷尺寸极限下的行为。\n2. 其关键论点是多数规则条带在热力学极限下消失，而全局有序的条带构型可被局域扰动摧毁，从而揭示共存相至少部分亚稳。\n3. 由此推知渐近共存相应是由混沌相互作用行进条带构成的无序态，这为重新审视群集相图、有限尺寸效应及Toner-Tu相亚稳性提供了基准。", "summary_source": "deepseek", "authors": [{"name": "Yu Duan"}, {"name": "Hugues Chaté"}, {"name": "Benoît Mahault"}, {"name": "Xia-qing Shi"}], "featured_authors": [{"name": "Yu Duan"}, {"name": "Hugues Chaté"}, {"name": "Benoît Mahault"}, {"name": "Xia-qing Shi"}], "author_count": 4}, {"id": "2610.26569", "category": "cond-mat", "title": "Phase Diagram of the Two-Dimensional Vicsek Model", "abstract": "Motivated by gaps in our current knowledge of the Vicsek model, we present a major update of its phase diagram in two space dimensions, summarizing comprehensive numerical simulations at length- and timescales never explored before. Our main conclusions are that multiple phase separation scenarios are at play, not just the simple microphase separation put forward in [Phys. Rev. Lett. 114, 068101 (2015)], and that the coexistence phase is subdivided in two. We also map out the region of metastability of the homogeneous Toner-Tu liquid phase.", "url": "https://arxiv.org/abs/2610.26569", "type": "理论+数值", "summary": "1. 该工作基于覆盖空前空间与时间尺度的二维数值模拟，系统更新了Vicsek模型的相图。\n2. 其核心卖点是发现多种相分离机制并存而非单一微相分离，将共存相细分为两个子区，并标定了均匀Toner-Tu液相的亚稳区域。\n3. 这些结果修正了二维Vicsek相图的既有图像，为活性物质中相分离机制与有序液相稳定性的后续理论与实验检验提供了基准。", "summary_source": "deepseek", "authors": [{"name": "Yu Duan"}, {"name": "Hugues Chaté"}, {"name": "Benoît Mahault"}, {"name": "Xia-qing Shi"}], "featured_authors": [{"name": "Yu Duan"}, {"name": "Hugues Chaté"}, {"name": "Benoît Mahault"}, {"name": "Xia-qing Shi"}], "author_count": 4}, {"id": "2610.26573", "category": "cond-mat", "title": "Avalanches and Aging Driven by Parametric Amplification in Kerr Oscillator Networks", "abstract": "Gain, loss, and nonlinearity shape the phase-space landscape of driven-dissipative systems, such as Kerr parametric oscillator (KPO) networks realized in superconducting, nanomechanical, and photonic arrays. Networks of KPOs exploit the stationary states of this landscape for Ising machines, bosonic error-correcting codes, and sensing. Yet how transients reach these states from a given initial condition remains largely unexplored. Here we show that KPO networks with nonlinear couplings can develop avalanches in their transient dynamics: rapid cascades of amplification between modes reminiscent of the relaxation avalanches of glassy systems. The mechanism is that parametric gain first activates the modes whose detuning it can overcome, and their nonlinear frequency shifts then pull dormant modes into the gain window one at a time. Dormant modes keep decaying while they wait for their turn, so every activation starts from a smaller seed and the intervals between activations grow geometrically. The network thus ages: the longer it has evolved, the slower it changes, and activations accumulate only logarithmically in time. In a 20-mode network, each dwell lasts about twice as long as the previous one. While aging delays the approach to the stationary state, additive noise sets a floor on the seeds and unsticks the network, shortening the longest dwells first while the activation sequence survives to noise several orders of magnitude stronger.", "url": "https://arxiv.org/abs/2610.26573", "type": "理论", "summary": "1. 该工作研究非线性耦合Kerr参量振荡器网络中由参量放大驱动的瞬态雪崩与老化，追踪网络从给定初态向稳态的演化。\n2. 其核心机制是增益先激活失谐可被克服的模式，非线性频移再逐个将休眠模式拉入增益窗口；等待中的模式持续衰减使激活种子变小、间隔几何增长，激活数仅对数累积，20模网络每次驻留约加倍。\n3. 该结果表明加性噪声只设定种子下限并优先缩短最长驻留，而激活序列在强噪声下仍保留，为KPO网络在伊辛机、玻色纠错与传感中的收敛动力学提供启示。", "summary_source": "deepseek", "authors": [{"name": "Alejandro S. Gómez"}, {"name": "Javier del Pino"}], "featured_authors": [{"name": "Alejandro S. Gómez"}, {"name": "Javier del Pino"}], "author_count": 2}, {"id": "2610.26593", "category": "cond-mat", "title": "From particles to continuum theories in effective models of self-propelled rods", "abstract": "Models of colliding self-propelled rods are abstractions of many real systems such as gliding bacteria and biofilaments displaced by molecular motors. They have been studied mostly in two space dimensions and shown to display a wealth of different collective regimes with many parameters involved in the ensuing phase diagrams. Continuum-level theories faithful to this phenomenology are largely lacking since coarse-graining models of explicit rods is notoriously difficult. Here we study collections of particles in which the rods geometry is taken into account effectively, by implementing the nematic alignment of their velocities and two types of repulsion. These Vicsek-style models are simple enough to be starting points for systematic coarse-graining. We thus derive hydrodynamic equations that we show to have solutions qualitatively faithful to their particle-level origin.", "url": "https://arxiv.org/abs/2610.26593", "type": "理论+数值", "summary": "1. 该工作构建了以速度向列排列和两类排斥有效体现棒状几何的Vicsek型自驱动棒粒子模型，并对其进行系统粗粒化以推导流体力学方程。\n2. 其关键在于模型足够简单而可系统粗粒化，同时所得连续介质方程在定性上忠实再现粒子层面的集体行为，缓解了显式棒模型难以粗粒化的瓶颈。\n3. 这为滑行细菌、生物丝等自驱动棒体系提供了从粒子规则到连续理论的可靠桥梁，并可用于检验相图与指导后续理论与实验研究。", "summary_source": "deepseek", "authors": [{"name": "Elia Bronzo"}, {"name": "Hugues Chaté"}, {"name": "Benoît Mahault"}, {"name": "Alexandre Solon"}], "featured_authors": [{"name": "Elia Bronzo"}, {"name": "Hugues Chaté"}, {"name": "Benoît Mahault"}, {"name": "Alexandre Solon"}], "author_count": 4}, {"id": "2610.26617", "category": "cond-mat", "title": "Statistical decision theory in thermodynamics", "abstract": "We introduce statistical decision theory in stochastic thermodynamic systems. Statistical decision theory integrates several statistical tasks, such as estimation, hypothesis testing, and classification. In this study, we consider statistical decision theory in stochastic thermodynamics, which unifies sensing, classification, and uncertainty relations. In particular, we focus on the minimax risk, the smallest achievable expected loss under the worst-case parameter choice, even with an optimal estimator. We derive lower bounds on the minimax risk using Le Cam's two-point method. The derived relationships can be used across a broader range of thermodynamic scenarios. To illustrate these relations, we study classification and distribution estimation problems in a Markov process. We demonstrate that the minimax risk provides lower bounds given by the dynamical activity in these problems. Furthermore, by examining particular dynamics, we establish that the resulting bounds simplify to uncertainty relations involving dynamical activity or entropy production.", "url": "https://arxiv.org/abs/2610.26617", "type": "理论", "summary": "1. 该文将统计决策理论引入随机热力学系统，以极小极大风险为核心，统一处理传感、分类、估计与假设检验，并用 Le Cam 两点法推导其下界。\n2. 其核心卖点是把极小极大风险与热力学动力学活性联系起来，在马尔可夫过程的分类和分布估计中给出由动力学活性控制的下界，并在特定动力学下化为含动力学活性或熵产生的不确定性关系。\n3. 这一框架可推广到更广泛的热力学场景，为把决策风险、热力学代价与不确定性关系统一分析提供了可操作的理论入口。", "summary_source": "deepseek", "authors": [{"name": "Yoshihiko Hasegawa"}], "featured_authors": [{"name": "Yoshihiko Hasegawa"}], "author_count": 1}, {"id": "2610.26638", "category": "cond-mat", "title": "Nucleation-type criticality with infinite number of free-energy minima beyond mean-field theory", "abstract": "We study the phase diagram of a three-dimensional Heisenberg model with Dzyaloshinski--Moriya interaction under the presence of Potts-like anisotropy. The phase transition between the winding phase and the ferromagnetically ordered phase exhibits a critical phase transition with anomalous features such as critical exponents consistent with that of a first-order transition while maintaining continuity of physical quantities. Furthermore, at the critical point, we see a growing number of free energy local minima, supporting the picture of infinitely many discontinuous transitions forming criticality. Our numerical result unify de Gennes' theory of nucleation-type transitions and Dzyaloshinskii's calculation of chiral magnets by demonstrating that such anomalous criticality can be realized in microscopic models beyond mean-field.", "url": "https://arxiv.org/abs/2610.26638", "type": "理论+数值", "summary": "1. 该文数值研究三维含Dzyaloshinskii-Moriya相互作用与Potts型各向异性的Heisenberg模型相图，考察螺旋相与铁磁有序相之间的转变。\n2. 其核心在于发现该转变具有反常临界性：临界指数类似一级转变而物理量保持连续，且临界点处自由能局域极小值数目增长，支持无穷多不连续转变构成临界行为的图像。\n3. 该结果在微观模型中统一了超越平均场的成核型转变图像与手性磁体计算，为理解反常临界性及相关材料相变提供启示。", "summary_source": "deepseek", "authors": [{"name": "Jun Takahashi"}, {"name": "Yoshihiko Nishikawa"}], "featured_authors": [{"name": "Jun Takahashi"}, {"name": "Yoshihiko Nishikawa"}], "author_count": 2}, {"id": "2610.26646", "category": "cond-mat", "title": "Variational Block Correlated Coupled Cluster Monte Carlo", "abstract": "Motivated by the recent success of quantum neural states, we present a variational implementation of the coupled cluster method suitable for quantum Monte Carlo simulations. We introduce a Young tableaux representation of the wave-function coefficients and their derivatives that substantially reduces the computational complexity of the variational optimization. While the algorithm is generic, we illustrate its implementation with an application to the Heisenberg model in one and two dimensions, using the block correlated coupled cluster ansatz (BCCC) with doubles and triples. Convergence is greatly improved by means of importance sampling based on a fictitious temperature. The resulting approach achieves competitive accuracy while providing a scalable framework for variational coupled-cluster calculations.", "url": "https://arxiv.org/abs/2610.26646", "type": "理论+数值", "summary": "1. 该工作提出了适用于量子蒙特卡洛模拟的变分耦合簇实现，引入杨表表示波函数系数及其导数，并在一维和二维海森堡模型上以含双、三激发的块关联耦合簇拟设完成演示。\n2. 其技术卖点是用杨表表示显著降低变分优化的计算复杂度，同时借助基于虚温度的重要性采样明显改善变分收敛。\n3. 该方法在取得有竞争力精度的同时给出可扩展的变分耦合簇蒙特卡洛框架，为更大规模量子多体波函数优化及后续算法推广提供了明确启发。", "summary_source": "deepseek", "authors": [{"name": "Hunter Brodie"}, {"name": "Alexander Shilcusky"}, {"name": "Adrian E. Feiguin"}], "featured_authors": [{"name": "Hunter Brodie"}, {"name": "Alexander Shilcusky"}, {"name": "Adrian E. Feiguin"}], "author_count": 3}, {"id": "2610.26667", "category": "cond-mat", "title": "Vacancy and Helium-Cluster Thermomigration in Tungsten", "abstract": "Strong thermal gradients in tungsten plasma-facing components can bias the migration of irradiation-induced defects and thereby alter their redistribution, interaction, and retention. Here, we extend an atomistic jump-statistics framework previously developed for hydrogen to quantify the thermomigration of a single vacancy and interstitial He$_1$--He$_4$ clusters in body-centered-cubic tungsten. Non-equilibrium molecular-dynamics simulations performed over several thermal gradients are used to determine the directional jump ratio, while geometrically derived projected jump lengths convert the fitted directional-bias coefficient into the heat-of-transport coefficient $Q^*=\\alpha kT^2$, where $k$ is the Boltzmann constant, $T$ the temperature, and $\\alpha$ a constant. All investigated defects exhibit negative values of $\\alpha$, corresponding to net migration toward the hot region. He$_4$ has the largest response, $\\alpha=-2.2457\\times10^{-2}$ K$^{-1}$, followed closely by the vacancy, whereas He$_3$ exhibits the weakest response despite its intermediate cluster size. Independent constant-temperature simulations over 1000--1600 K show that He$_3$ is also the least mobile cluster and has the largest effective migration energy, $E_m^{\\mathrm{eff}}=0.271$ eV. In contrast, He$_4$ is more mobile than He$_3$ and has the smallest effective migration energy, 0.087 eV. Agreement between the He$_3$ concentration profile predicted from the jump statistics and that obtained from a long molecular-dynamics trajectory provides an independent validation of the method. These results show that thermomigration cannot be inferred from cluster size, diffusivity, or migration energy alone and provide defect-specific heat-of-transport parameters for higher-length-scale models of tungsten under fusion-relevant thermal gradients.", "url": "https://arxiv.org/abs/2610.26667", "type": "理论+数值", "summary": "1. 该工作把原子跃迁统计框架从氢推广到体心立方钨，用非平衡分子动力学量化空位及He1–He4团簇在热梯度下的热迁移。\n2. 其技术要点是由方向性跳跃比与投影跳跃长度提取Q*=αkT²：所有缺陷α为负、净向热区迁移，He4响应最强（α=-2.2457×10⁻² K⁻¹）并接近空位，He3最弱；恒温模拟显示He3迁移率最低、有效迁移能最大（0.271 eV），He4最小（0.087 eV），且跃迁统计给出的He3浓度剖面与长时MD吻合。\n3. 这揭示热迁移不能由团簇尺寸、扩散率或迁移能单独推断，并提供缺陷特异的Q*参数供聚变热梯度下钨的更高尺度模型使用。", "summary_source": "deepseek", "authors": [{"name": "Sanad Alturk"}, {"name": "Enrique Martinez"}], "featured_authors": [{"name": "Sanad Alturk"}, {"name": "Enrique Martinez"}], "author_count": 2}, {"id": "2610.26721", "category": "cond-mat", "title": "Collective diffusion of anisotropic hard-particle mixtures", "abstract": "Predicting the dynamics of anisotropic mixtures of different species is a challenging theoretical task. We show that Dynamical Density Functional Theory (DDFT), a theory predicting time evolution of the one-particle-density through a free energy functional, can be simplified to a diffusion equation. To quantify the dynamical relaxation behavior, we d
