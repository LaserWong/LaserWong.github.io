i and Dicke quantum batteries", "abstract": "We investigate open-system charging protocols for Rabi and Dicke quantum batteries under direct incoherent pumping. The charging dynamics follows a Lindblad master equation, while effective non-Hermitian generators describe the conditioned no-jump mechanism. For a single Rabi battery, this pumping suppresses coherent energy backflow, broadens the high-energy charging window, and improves robustness against both timing errors and detuning. At the selected Rabi operating points, pumping also increases ergotropy and the extractable fraction of the stored energy. For finite Dicke batteries, direct incoherent pumping likewise stabilizes the charging dynamics. Across the finite-size scan, the strongest pump considered improves the peak stored energy and ergotropy per cell and near-peak timing robustness relative to the Hermitian reference. The maximum average charging power also increases, although this metric includes pump-assisted jump contributions. Equal-input comparisons show that the relative performance of common-cavity Dicke and independent Rabi batteries varies with the pump-input bound. Taken together, these results show that direct incoherent pumping provides a route to stabilized charging in Rabi and finite Dicke quantum batteries.", "url": "https://arxiv.org/abs/2610.26126", "type": "理论", "summary": "1. 该文基于Lindblad主方程与有效非厄米无跃迁描述，研究直接非相干泵浦下开放Rabi与有限Dicke量子电池的充电协议。\n2. 对单Rabi电池，泵浦抑制相干能量回流、拓宽高能充电窗口并提升对时序误差和失谐的鲁棒性，同时提高可提取功与可提取能量占比；有限Dicke电池中强泵浦也改善峰值储能、单胞可提取功和近峰值时序鲁棒性。\n3. 这些结果表明直接非相干泵浦是稳定Rabi与有限Dicke量子电池充电的可行路线，并为在泵浦输入约束下比较共腔Dicke与独立Rabi构型提供依据。", "summary_source": "deepseek", "authors": [{"name": "A-Long Zhou"}, {"name": "Nuo Xu"}, {"name": "Ya-Wen Xiao"}, {"name": "Li-Li Gao"}, {"name": "Long-Jie Li"}, {"name": "Zi-Min Li"}, {"name": "Chuan-Cun Shu"}], "featured_authors": [{"name": "A-Long Zhou"}, {"name": "Nuo Xu"}, {"name": "Ya-Wen Xiao"}, {"name": "Long-Jie Li"}, {"name": "Zi-Min Li"}, {"name": "Chuan-Cun Shu"}], "author_count": 7}, {"id": "2610.26222", "category": "quant-ph", "title": "A Readout-Aware Theory of Approximate Heisenberg Propagation", "abstract": "Classical methods for computing quantum expectation values often propagate observables in the Heisenberg picture. To remain tractable, these methods rely on approximations that discard operator components during evolution. Yet the magnitude of these components alone does not determine the resulting expectation-value error, which also depends on their subsequent evolution and the input state. We develop \\emph{generalized Pauli propagation}, a common algebraic framework encompassing Pauli propagation, Lie-algebraic simulation, and Krylov subspace methods. Using weighted commutator graphs, we derive exact identities that relate approximation errors to the signed contributions of omitted and discarded operator components. Our central result establishes \\emph{delayed observability}, identifying conditions under which these contributions vanish at low orders in propagation time. We use this structure to develop finite-order error estimates and state-dependent selection rules. We further prove that retaining the symmetry-preserving part of a weak perturbation eliminates first-order expectation-value errors under suitable symmetry conditions. By revealing how approximation errors affect the desired expectation value, our framework provides a basis for more informative error analysis and the development of readout-aware simulation strategies.", "url": "https://arxiv.org/abs/2610.26222", "type": "理论+数值", "summary": "1. 该工作提出“广义Pauli传播”代数框架，将Pauli传播、李代数模拟和Krylov子空间方法统一起来，并用加权对易图建立近似误差与演化中省略或丢弃算符分量符号贡献之间的精确关系。\n2. 其核心卖点是“延迟可观测性”：给出低传播阶下这些贡献消失的条件，进而得到有限阶误差估计与依赖量子态的筛选规则，并证明在合适对称性下保留弱扰动的保对称部分可消除一阶期望值误差。\n3. 这将近似误差直接联系到目标期望值读出，为更具信息量的误差分析和读出感知的模拟策略提供了可操作基础。", "summary_source": "deepseek", "authors": [{"name": "Yubraj Bhandari"}, {"name": "Jakob S. Kottmann"}, {"name": "Adelina Bärligea"}], "featured_authors": [{"name": "Yubraj Bhandari"}, {"name": "Jakob S. Kottmann"}, {"name": "Adelina Bärligea"}], "author_count": 3}, {"id": "2610.26246", "category": "quant-ph", "title": "Universal Quantum Criticality from a Gaussian Variational Manifold", "abstract": "Universal behavior at continuous phase transitions is encoded in long-wavelength fixed-point theories controlled by dimensionality and symmetries. It is a central question for which systems this universal behavior and the underlying long-wavelength description can be captured by a noninteracting theory allowing for analytical and accurate predictions. In this work we provide a systematic procedure for obtaining the best noninteracting fermionic description of a quantum phase transition through fermionic Gaussian states. We demonstrate the performance of our procedure for the interacting long-range transverse-field Ising chain. This formulation reduces the problem to a self-consistent Euler equation that yields a critical line in close agreement with independent numerical benchmarks, while its singular momentum structure provides analytic predictions for continuously varying critical properties. Yet exact diagonalization shows that Gaussian-state fidelity to the exact ground state is poorest, and non-Gaussianity strongest, near the transition. Thus, accurate predictions for critical properties can emerge from the Gaussian variational description even where its microscopic wave-function approximation is weakest.", "url": "https://arxiv.org/abs/2610.26246", "type": "理论+数值", "summary": "1. 该工作提出一套通过费米子高斯态系统获取量子相变最佳无相互作用费米子描述的流程，并在相互作用长程横场Ising链上演示。\n2. 其核心是将问题化为自洽Euler方程，所得临界线贴近独立数值基准，且动量奇异结构可解析给出连续变化的临界性质。\n3. 精确对角化显示高斯态保真度在相变附近最差、非高斯性最强，因此临界性质的准确预测可在微观波函数近似最弱处出现，提示变分流形与临界普适描述并非简单对应。", "summary_source": "deepseek", "authors": [{"name": "Reyhaneh Khasseh"}, {"name": "Fabian Ballar Trigueros"}, {"name": "Markus Heyl"}, {"name": "M. A. Rajabpour"}], "featured_authors": [{"name": "Reyhaneh Khasseh"}, {"name": "Fabian Ballar Trigueros"}, {"name": "Markus Heyl"}, {"name": "M. A. Rajabpour"}], "author_count": 4}, {"id": "2610.26279", "category": "quant-ph", "title": "Physics-anchored residual quantum neural networks for cloud-cover parameterization", "abstract": "Compact quantum neural networks have been explored for cloud-cover parameterization, but their predictive value depends on how physical knowledge is incorporated and which classical models provide the reference. We investigate an offline residual formulation that retains a fitted \\XR\\ cloud-cover estimate and learns a correction to its logit in transformed target space. Using released ICON/DYAMOND-derived data, we compare ten model variants in six- and eight-input settings, with three matched replicates and 10,000 training samples per replicate. All quantum circuits use local Z readout and noiseless exact expectation values. Under a common 30-epoch protocol, residual prediction reduced physical-space test mean squared error relative to direct QNN prediction by 54.3\\% and 38.8\\% for six-input XYZ and ZZXY circuits, and by 49.2\\% and 38.9\\% for their eight-input versions. Residual QNNs also outperformed the selected compact residual multilayer perceptron in every paired replicate. A larger, longer-trained Grundner-Q1 adaptation nevertheless achieved lower error: residual Q1 reached mean MSEs of 0.00778 and 0.00791, compared with 0.01124 and 0.01082 for residual XYZ. The results support residual prediction for compact simulated QNNs within the tested budget and establish a clear boundary set by stronger classical references. They do not establish computational quantum advantage or online climate-model skill.", "url": "https://arxiv.org/abs/2610.26279", "type": "理论", "summary": "1. 该工作提出物理锚定的残差量子神经网络，以拟合XR云量估计为基线，在变换目标空间学习logit修正，并比较多种紧凑电路与残差MLP。\n2. 其卖点是残差logit修正将物理空间测试MSE相对直接QNN降低38.8%–54.3%，并在每个配对重复中优于所选紧凑残差MLP。\n3. 结果支持在测试预算内将残差预测用于紧凑模拟QNN，但更强经典参考设定了明确边界，且未证明量子优势或在线气候模式技巧。", "summary_source": "deepseek", "authors": [{"name": "Zhuo Wang"}, {"name": "Ce Yu"}, {"name": "Bin Yang"}], "featured_authors": [{"name": "Zhuo Wang"}, {"name": "Ce Yu"}, {"name": "Bin Yang"}], "author_count": 3}, {"id": "2610.26435", "category": "quant-ph", "title": "Giant Rydberg Excitons Delineated as Relativistic Bound States", "abstract": "We examined the energy-momentum relationship of the valence band of Cu$_2$O, which has gained interest as an emerging solid host for giant Rydberg states. Our findings reveal a nonparabolic dispersion, described using the rest mass (0.570 times the free electron mass) and rescaled light speed ($1.6\\times 10^5$ m/s), which draws parallels with relativistic theory for high-energy particles. We propose a straightforward expression for the bound-state energies of Rydberg excitons with finite quantum defects, whose energy scheme deviates from the hydrogenic series. This formulation identifies relativistic kinematics as the physical origin of quantum defects, offering a streamlined basis for future studies on complex many-body correlations.", "url": "https://arxiv.org/abs/2610.26435", "type": "理论", "summary": "1. 该文考察了Cu$_2$O价带的能量-动量关系，发现其非抛物色散可由0.570倍自由电子质量和$1.6\\times10^5$ m/s的约化光速描述，并据此提出含有限量子缺陷的Rydberg激子束缚能表达式。\n2. 其核心卖点在于把巨Rydberg激子的量子缺陷归因于相对论性运动学，使偏离氢谱的能级结构获得简洁统一的描述。\n3. 这一框架为Cu$_2$O中复杂多体关联及后续Rydberg激子研究提供了可检验且便于扩展的物理基础。", "summary_source": "deepseek", "authors": [{"name": "Mitsuyoshi Takahata"}, {"name": "Ikuko Akimoto"}, {"name": "Nobuko Naka"}], "featured_authors": [{"name": "Mitsuyoshi Takahata"}, {"name": "Ikuko Akimoto"}, {"name": "Nobuko Naka"}], "author_count": 3}, {"id": "2610.26465", "category": "quant-ph", "title": "The Four-Qubit Hyperbolic Quadric Has Contextuality Degree 315", "abstract": "The contextuality degree of a set of Pauli contexts is the least number of contexts that every noncontextual $\\pm1$ assignment violates. For the four-qubit hyperbolic quadric $\\mathcal{Q}^{+}(7,2)$, with $135$ points and $1575$ lines as contexts, Muller et al. conjectured from heuristic searches that the degree is $315$ and that the violated contexts of every optimal assignment form a dual polar space $DW(5,2)$. We prove both conjectures. The lower bound has a short proof by hand: every doily ($GQ(2,2)$) of the quadric contains ten Peres-Mermin grids covering each of its lines four times, so every assignment violates at least three of its fifteen lines, and averaging over the doilies gives $1575/5=315$. The equality case is local: an assignment is optimal exactly when it violates one ruling of one grid in every doily. Using this as a SAT encoding, we show that there are exactly $240$ optimal violated sets, one orbit of $\\mathrm{O}^+(8,2)$, each isomorphic to $DW(5,2)$. The same argument gives the first lower bounds $\\lceil L/5\\rceil$ for all quadrics with $L$ lines in $N\\ge4$ qubits. The degree theorem is kernel-checked in Lean 4, and the completeness of the enumeration is certified by a DRAT proof checked by the verified checker cake_lpr.", "url": "https://arxiv.org/abs/2610.26465", "type": "理论", "summary": "1. 该文证明四量子比特双曲二次曲面 Q⁺(7,2) 的语境度猜想为 315，并完整刻画达到该下界的最优非语境赋值违背集。\n2. 其核心是用每个 GQ(2,2) 多伊利中十个 Peres–Mermin 网格对十五条线的四重覆盖作平均得到下界，并以局部等号条件构造 SAT 编码，枚举出恰有 240 个最优违背集、构成 O⁺(8,2) 的单一轨道且均同构于 DW(5,2)。\n3. 同一论证给出 N≥4 量子比特、含 L 条线的所有二次曲面的首个 ⌈L/5⌉ 下界，并经 Lean 4 核验与 cake_lpr 检查的 DRAT 证明保证定理和枚举完整性，为语境性度量的可验证组合分析提供范例。", "summary_source": "deepseek", "authors": [{"name": "Zhengyu Li"}, {"name": "Amandeep Gupta"}, {"name": "Vijay Ganesh"}], "featured_authors": [{"name": "Zhengyu Li"}, {"name": "Amandeep Gupta"}, {"name": "Vijay Ganesh"}], "author_count": 3}, {"id": "2610.26483", "category": "quant-ph", "title": "Majorization for superpositions of nonorthogonal states and the existence of golden states", "abstract": "In the resource theory of superposition relative to linearly independent, nonorthogonal reference states, golden states are known for two reference states and for special overlap matrices, and all of them are maximally coherent in the Löwdin basis. We clarify what decides their existence and their Löwdin structure. The robustness and the geometric measure of superposition are maximized by the same states, which overlap equally with every reference state; their maximal values are set by the ground-state energy of a classical $XY$ model on the overlaps of the dual basis. For every overlap matrix, these states, and only these, are golden under the maximal superposition-free operations, but they need not be maximally coherent in the Löwdin basis. For the Kraus-type free operations, we prove a necessary and sufficient criterion, Gram majorization, for converting pure states into targets with nonzero coefficients; it reduces to majorization for orthonormal reference states. It shows that golden states of these operations must be maximally coherent in the Löwdin basis, but that this does not ensure their existence: three reference states that are not orthonormal admit a golden state if and only if their overlaps have a common modulus $s$ and their Bargmann phase $\\Phi$ obeys $s\\geq2\\cos[(\\pi+|\\Phi|)/3]$. Equal-overlap states also yield a complete family of superposition witnesses in the Löwdin basis, which show that white noise on the span of the reference states is a resource unless these states are orthonormal.", "url": "https://arxiv.org/abs/2610.26483", "type": "理论", "summary": "1. 该工作厘清了非正交参考态叠加资源理论中黄金态的存在条件及其在勒夫丁基下的相干结构，并建立了克劳斯型自由操作下纯态转换的格拉姆优序化判据。\n2. 其核心是鲁棒性与几何度量由等重叠态同时最大化，极值由对偶基重叠上经典XY模型基态能决定；三非正交参考态存在黄金态当且仅当重叠模长同为s且巴格曼相位Φ满足s≥2cos[(π+|Φ|)/3]，而克劳斯型操作的黄金态必在勒夫丁基下最大相干却未必存在。\n3. 这些结果与等重叠态给出的叠加见证表明，参考态张成空间上的白噪声在非正交时也是资源，并为实验检验叠加资源提供依据。", "summary_source": "deepseek", "authors": [{"name": "Gökhan Torun"}], "featured_authors": [{"name": "Gökhan Torun"}], "author_count": 1}, {"id": "2610.26603", "category": "quant-ph", "title": "Beyond Fidelity: Resolving Errors in Photonic Seed State Generation", "abstract": "An important aspect of many linear optical quantum computing architectures is probabilistically generating small dual-rail qubit entangled states, or seed states. While many schemes to achieve this have been discovered, attention has been primarily focused on minimizing input resources and maximizing success probability rather than establishing a detailed understanding of linear-optical error performance. In this work, we develop a framework for resolving sensitivities to physically distinct errors in linear optical state generation, allowing us to identify precise ways in which these errors affect the properties of the output state. We use this framework to identify seed state generators in which destructive many-photon interference prevents detector loss and detector noise from causing a falsely successful heralding event. We show that this effect suppresses errors, for example cutting the effective loss on the output of particular Bell state generators in half relative to a standard scheme. We also present a new Bell state generator in which both detector loss and detector noise do not affect the quality of the output Bell state to first order, and a 4GHZ generator with >75% higher success probability than a standard circuit. In addition we provide some useful identities, bounds and invariants for studying linear optical seed state generation.", "url": "https://arxiv.org/abs/2610.26603", "type": "理论", "summary": "1. 该工作针对线性光学种子态生成，提出一个超越保真度的误差解析框架，用于区分并定位物理上不同误差对输出态性质的影响。\n2. 其关键在于利用多光子干涉相消识别出可抑制探测器损耗与噪声导致虚假成功预示的种子态生成器，使特定贝尔态生成器的等效输出损耗减半，并给出对探测损耗和噪声一阶不敏感的新贝尔态方案及成功率较标准电路高逾75%的四GHZ态方案。\n3. 该框架及给出的恒等式、界和不变量为面向真实器件误差的光子种子态生成与资源权衡提供了可复用的设计准则。", "summary_source": "deepseek", "authors": [{"name": "Sara Bartolucci"}, {"name": "Patrick Birchall"}, {"name": "Jacob Bulmer"}, {"name": "Sam Gartenstein"}, {"name": "Mihir Pant"}, {"name": "Terry Rudolph"}, {"name": "Chris Sparrow"}, {"name": "Andrzej Veitia"}], "featured_authors": [{"name": "Sara Bartolucci"}, {"name": "Patrick Birchall"}, {"name": "Jacob Bulmer"}, {"name": "Terry Rudolph"}, {"name": "Chris Sparrow"}, {"name": "Andrzej Veitia"}], "author_count": 8}, {"id": "2610.26620", "category": "quant-ph", "title": "Non-Markovian exceptional points and information backflow: a Heisenberg reaction-coordinate approach", "abstract": "The primary pathway to the investigation of exceptional points (EPs) in open quantum systems has been the use of Markovian master equations. However, recently it has been realised that they can arise in settings that show non-Markovian behaviour. The main approach in this direction has been the use of pseudomodes, which allow the influence of a structured environment to be replaced by new damped auxiliary modes. In this work, we use a Heisenberg-equation approach which relies on the reaction-coordinate formalism to obtain exact analytical dynamics. First, we show how our method considerably simplifies the analysis compared to the use of master equations. Second, we utilise it to discuss non-Markovian revivals in systems with second and higher-order EPs, showing that the notion that EPs demarcate the onset of revivals is not generally true. We then utilise our results to discuss the dynamical effects of higher-order non-Markovian EPs, deriving bounds on the number of revivals and investigating enhanced asymptotic relaxation near higher-order EPs. Finally, we investigate non-Markovian EPs with engineered reservoirs and show how they can be utilised to control the rate of irreversible information loss.", "url": "https://arxiv.org/abs/2610.26620", "type": "理论", "summary": "1. 该工作基于海森堡方程与反应坐标形式，对非马尔可夫例外点及信息回流给出精确解析动力学，并表明其相较主方程方法显著简化分析。\n2. 其核心在于指出例外点并不普遍标志回流起始，给出二阶及高阶非马尔可夫例外点的回流次数上界与增强渐近弛豫，并展示工程化库可调控不可逆信息损失速率。\n3. 这为超越马尔可夫主方程研究开放系统例外点动力学、厘清例外点与回流关系，以及通过库工程调控不可逆信息损失提供了可推广的解析框架与明确启发。", "summary_source": "deepseek", "authors": [{"name": "Daniel Holst"}, {"name": "Gianmichele Blasi"}, {"name": "Shishir Khandelwal"}], "featured_authors": [{"name": "Daniel Holst"}, {"name": "Gianmichele Blasi"}, {"name": "Shishir Khandelwal"}], "author_count": 3}, {"id": "2610.26687", "category": "quant-ph", "title": "Ground-State Sampling Correspondence between Penalty-Based and Constrained Quantum Annealing", "abstract": "Quantum annealing generally samples degenerate ground states with nonuniform probabilities. This unfair sampling depends on how the driver Hamiltonian couples these states near the end of annealing. For combinatorial optimization problems with a cardinality constraint, the penalty method and constrained quantum annealing (CQA) differ in these couplings. The transverse-field driver of the penalty method does not directly couple feasible ground states, whereas the fully connected XY driver of CQA couples pairs of them related by a single spin exchange. We investigate how this difference affects ground-state sampling, using closed-system simulations of random graph bipartitioning instances together with degenerate perturbation theory. For the instances studied, the conditional ground-state distribution of penalty-based quantum annealing approaches that of CQA at sufficiently large penalties and long annealing times. This convergence can be explained by the effective Hamiltonian of penalty-based quantum annealing, in which virtual single-spin flips to infeasible states generate a second-order interaction proportional to the CQA driver projected onto the feasible ground-state manifold, which is the leading term of the effective Hamiltonian of CQA. In the numerical simulations, the Jensen--Shannon divergence between the conditional ground-state distributions of penalty-based quantum annealing and CQA decreases approximately as the inverse square of the penalty-to-objective energy ratio, consistent with the perturbative analysis. This correspondence between the effective Hamiltonians extends to equal-weight fixed-magnetization constraints under the same perturbative conditions, providing a common mechanism for sampling bias in the two implementations.", "url": "https://arxiv.org/abs/2610.26687", "type": "理论+数值", "summary": "1. 该工作结合随机图二分割实例的封闭系统模拟与简并微扰理论，比较罚函数量子退火与约束量子退火在基数约束下的基态采样分布。\n2. 其物理卖点在于指出罚函数方法通过虚自旋翻转至不可行态产生的二阶有效相互作用，在可行基态流形上正比于约束量子退火的XY驱动投影，从而解释二者条件基态分布在大罚项和长退火时间下趋同。\n3. 该对应在相同微扰条件下可推广至等权固定磁化约束，为两类实现的采样偏置提供统一机制；数值上Jensen-Shannon散度随罚项与目标能量比近似平方反比下降。", "summary_source": "deepseek", "authors": [{"name": "Shunta Ide"}, {"name": "Shu Tanaka"}], "featured_authors": [{"name": "Shunta Ide"}, {"name": "Shu Tanaka"}], "author_count": 2}, {"id": "2610.26725", "category": "quant-ph", "title": "Quantum Optimal Control Primer", "abstract": "This is a set of detailed notes that are part of a Ph.D. Course on Quantum Control delivered at the Department of Chemistry of Seoul National University in 2014. Part of this course was also taught in the Department of Chemistry of the Friedrich Schiller University Jena. It focuses on quantum optimal control and quantum optimal control algorithms based on the gradient and extended gradient methods.", "url": "https://arxiv.org/abs/2610.26725", "type": "数值", "summary": "1. 该文将首尔国立大学化学系2014年博士课程及耶拿大学部分授课内容整理成一套详细的量子最优控制讲义，覆盖量子最优控制的基本问题与算法。\n2. 其卖点在于以梯度法和扩展梯度法为主线，系统组织量子最优控制的算法推导、实现思路与教学脉络，便于读者建立统一框架。\n3. 这为化学、物理及量子信息方向的研究生和研究者学习并实现基于梯度的量子最优控制算法提供了紧凑的入门材料与可复用参考。", "summary_source": "deepseek", "authors": [{"name": "Ignacio R. Sola"}], "featured_authors": [{"name": "Ignacio R. Sola"}], "author_count": 1}, {"id": "2610.26753", "category": "quant-ph", "title": "A General Master Equation for Two Accelerated Detectors: Stationary States and Entanglement", "abstract": "We derive a general Gorini-Kossakowski-Lindblad-Sudarshan master equation for two co-located, uniformly accelerated two-level detectors weakly coupled to scalar fields in the Minkowski vacuum, retaining coherent and dissipative contributions for arbitrary orientations, field masses, and spacetime dimensions. For equal orientations, we determine stationary states and their entanglement for two couplings to massless fields in four dimensions: symmetric coupling yields acceleration-dependent concurrence, whereas rotating-wave coupling gives acceleration-independent concurrence.", "url": "https://arxiv.org/abs/2610.26753", "type": "理论", "summary": "1. 该文为两个共位、均匀加速的二能级探测器与闵可夫斯基真空中标量场的弱耦合，推导了保留相干与耗散项的通用Gorini-Kossakowski-Lindblad-Sudarshan主方程。\n2. 其关键点是将任意取向、场质量与时空维度纳入统一开放量子体系框架，并在四维无质量场、等取向情形下求定态，比较对称耦合与旋转波耦合对纠缠的影响。\n3. 结果显示对称耦合的concurrence随加速度变化，而旋转波耦合下与加速度无关，为加速探测器纠缠的耦合方式依赖提供可检验判据。", "summary_source": "deepseek", "authors": [{"name": "Riccardo Acquaviva"}, {"name": "Paolo Facchi"}], "featured_authors": [{"name": "Riccardo Acquaviva"}, {"name": "Paolo Facchi"}], "author_count": 2}, {"id": "2610.26783", "category": "quant-ph", "title": "PPT-assisted capacities of bosonic Gaussian channels", "abstract": "We determine the exact quantum communication and entanglement-distribution capacities of three fundamental bosonic channels, namely thermal loss, thermal amplification and additive Gaussian noise, assisted by operations that completely preserve positive partial transpose (PPT). These operations are more powerful than local operations and classical communication (LOCC), but cannot generate distillable entanglement on their own. For thermal loss, the unconstrained capacity coincides with the Pirandola-Laurenza-Ottaviani-Banchi (PLOB) bound throughout the non-entanglement-breaking regime. The corresponding upper bounds are also attained for thermal amplification and additive noise. We extend these results to energy-constrained communication, establishing exact capacities for all three channels at every prescribed mean input energy. Our results solve a class of bosonic capacity problems under PPT assistance and establish exact benchmarks for determining whether the same communication rates can be achieved via LOCC alone.", "url": "https://arxiv.org/abs/2610.26783", "type": "理论", "summary": "1. 该工作确定了热损耗、热放大与加性高斯噪声三类基本玻色高斯信道在完全保持PPT操作辅助下的量子通信与纠缠分发容量。\n2. 其关键在于利用强于LOCC但不能自身产生可蒸馏纠缠的PPT操作，证明热损耗在非纠缠破坏区的无约束容量与PLOB界一致，并在热放大和加性噪声中达到相应上界，同时推广到给定平均输入能量约束下的精确容量。\n3. 该结果解决了一类PPT辅助下的玻色容量问题，并为判断相同通信速率能否仅由LOCC达成提供了精确基准。", "summary_source": "deepseek", "authors": [{"name": "Matthew Barber"}, {"name": "Stefano Pirandola"}], "featured_authors": [{"name": "Matthew Barber"}, {"name": "Stefano Pirandola"}], "author_count": 2}, {"id": "2610.26784", "category": "quant-ph", "title": "High-Accuracy Propagation-Assisted Local Decoding for Fast Transversal Clifford Circuits", "abstract": "We benchmark the Iterative Redecode Scheme (IRS) on fast transversal Clifford circuits, achieving high-accuracy correlated decoding using local memory-style detectors and decoders. On a deep random Clifford benchmark, IRS yields approximately $4\\times$ lower logical failure rates than the ghost protocol at $d=11$ with matched buffers, and $15\\times$ lower rates than logical observable matching (LOM). In three-block GHZ preparation, IRS achieves $2\\times$ lower logical error rates than reliable logical Pauli-product decoding with matched initialisation, improving to $25\\times$ at $d=19$ with $\\lceil d/2\\rceil$ full initialisation rounds. We place IRS, which builds on Wan et al.'s scheme, within a broader propagation-assisted local (PAL) framework, where local decoders exchange messages rather than decoding a global hypergraph. IRS alternates local minimum-weight perfect matching (MWPM) on memory-equivalent detector error models (DEMs) with Pauli-frame propagation and detector updates across transversal CNOT layers, seeking local error estimates consistent with the global detector record. Prior-informed DEMs account for probabilities of propagated errors missing from the memory-equivalent model, improving initial decoding and reducing logical error rates. Zero-weight physical Pauli mechanisms enable inference and propagation of initially indeterminate stabilizer outcomes. Error rates saturate after a few iterations even for deep, adversarial alternating-tCNOT circuits, allowing iteration caps with negligible loss of accuracy. We find syndrome-extraction buffers of order $\\lfloor d/4\\rfloor$ sufficient for distance-dependent error suppression in the demanding regimes studied. The approach extends to other local decoders and CSS codes; for repeated logical $S$ gates, IRS achieves approximately $4$ to $10\\times$ lower logical error rates than LOM, depending on initialisation.", "url": "https://arxiv.org/abs/2610.26784", "type": "理论", "summary": "1. 该工作在快速横向Clifford电路上对迭代重解码方案（IRS）进行基准测试，用局部内存式探测器与解码器实现高精度关联解码；在深度随机Clifford电路且d=11时，逻辑失败率比ghost协议约低4倍、比LOM低15倍，在三块GHZ制备中，使用⌈d/2⌉轮全初始化且d=19时，比可靠逻辑Pauli乘积解码低25倍。\n2. 其核心是将IRS纳入传播辅助局部（PAL）框架：局部解码器不解析全局超图，而在跨tCNOT层交替执行内存等效DEM上的局部MWPM、Pauli框架传播与探测器更新，并用先验DEM和零权重Pauli机制处理传播误差与初始不确定的稳定子结果。\n3. 误差率经少数迭代即饱和，可设置迭代上限而精度损失可忽略；⌊d/4⌋量级综合征提取缓冲足以获得距离相关抑制，且该方案可推广至其他局部解码器与CSS码。", "summary_source": "deepseek", "authors": [{"name": "Mark Webber"}, {"name": "Simanraj Sadana"}, {"name": "Matthew A. Lane"}, {"name": "Lucy Jade Robson"}, {"name": "Anthony O'Rourke"}], "featured_authors": [{"name": "Mark Webber"}, {"name": "Simanraj Sadana"}, {"name": "Matthew A. Lane"}, {"name": "Lucy Jade Robson"}, {"name": "Anthony O'Rourke"}], "author_count": 5}, {"id": "2610.26785", "category": "quant-ph", "title": "Correlated decoding loses the surface code's effective distance below threshold", "abstract": "Correlated decoding improves matching and clustering surface-code decoders by reweighting one decoding subgraph conditioned on the other's correction. We show that standard reweighting can cause correlated decoders to fail on size-$(d-1)/2$ fault configurations that a distance-$d$ code should correct, reducing error suppression deep below threshold. Under circuit-level noise, a single first-pass edge can discount several correlated edges, even though their joint occurrence requires additional independent faults, so the decoder favors an over-discounted correction. Regularizing the reweighting rule restores the nominal distance scaling and a clear correlated-decoding advantage.", "url": "https://arxiv.org/abs/2610.26785", "type": "理论", "summary": "1. 该工作表明标准关联解码的重加权会使距离为d的表面码在阈值以下无法纠正尺寸为(d−1)/2的故障构型，从而丧失有效距离并削弱误差抑制。\n2. 其关键在于电路级噪声下首轮解码的单条边会过度折扣多条关联边，忽略这些边联合出现需要额外独立故障，使解码器偏向被过度折扣的校正。\n3. 对重加权规则进行正则化可恢复标称距离标度与明确的关联解码优势，这为阈值以下表面码解码器的设计提供了可检验的约束与启发。", "summary_source": "deepseek", "authors": [{"name": "César Hernando de la Fuente"}, {"name": "Joonas Majaniemi"}, {"name": "Evert van Nieuwenburg"}, {"name": "Felix Frohnert"}], "featured_authors": [{"name": "César Hernando de la Fuente"}, {"name": "Joonas Majaniemi"}, {"name": "Evert van Nieuwenburg"}, {"name": "Felix Frohnert"}], "author_count": 4}, {"id": "2610.26786", "category": "quant-ph", "title": "Fast Hubbard-Thouless Pumping with Local Counterdiabatic Driving", "abstract": "Counterdiabatic (CD) driving suppresses the excitations of fast protocols by adding an auxiliary Hamiltonian, but in many-body and topological systems the exact CD term is generally non-local and multi-body. We study this obstruction for Thouless pumping in the Rice-Mele model, first without and then with interactions. For noninteracting fermions, the exact CD term of the pump is non-local, but the variational framework of Sels and Polkovnikov yields accurate nearest-neighbor approximations. For the spinful Rice-Mele chain with onsite and nearest-neighbor repulsion, in the regime where the competition of the two interactions stabilizes quantized pumping, this approach fails: the infinite-temperature variational action only penalizes the CD amplitudes, and the resulting two-parameter nearest-neighbor term does not prevent the pump from breaking down when the cycle time is reduced from $50/t$ to $2/t$. We trace the failure to the structure of the exact many-body gauge potential, whose amplitude for each hop depends on the interaction energy that the hop costs. Resolving the nearest-neighbor currents by this energy, and fixing the coefficients with a ground-state-weighted action, gives a local ansatz with 14 coefficients that keeps the interacting pump quantized for cycle times $T=2/t$ and $T=1/t$, with an accuracy per site that does not degrade between rings of 8 and 12 sites.", "url": "https://arxiv.org/abs/2610.26786", "type": "理论+数值", "summary": "1. 该文在Rice-Mele模型中研究Hubbard-Thouless泵浦的反绝热驱动障碍，先处理无相互作用费米子，再处理具在位与近邻排斥的自旋链。\n2. 其卖点是揭示精确多体规范势的跃迁振幅依赖该跃迁的相互作用能代价：无限温变分作用量只会惩罚反绝热振幅，而按能量分辨近邻流并以基态加权作用量定系数，可得到14系数的局部拟设。\n3. 该拟设在T=2/t和1/t下仍保持相互作用泵浦量子化，且8与12格点环的每格精度不随尺寸退化，为快速拓扑泵浦的局域反绝热控制提供了可检验路径。", "summary_source": "deepseek", "authors": [{"name": "Alexander Chansky"}], "featured_authors": [{"name": "Alexander Chansky"}], "author_count": 1}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>${paper.summary_source === "deepseek" ? "DeepSeek three-sentence PRL summary" : (paper.summary_source === "local-fallback" ? "Local three-sentence fallback" : (paper.summary_source === "translation" ? "Chinese abstract translation" : "Chinese placeholder fallback"))}</span><a href="${safeUrl}" target="_blank" rel="noreferrer">Open arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
</body>
