<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>arXiv 2026-10-20 · Daily ArXiv Selection</title>
  <style>
    :root {
      --bg: #f6f1e8;
      --panel: rgba(255, 252, 246, 0.92);
      --text: #2d241d;
      --muted: #6d5d50;
      --line: rgba(69, 49, 32, 0.14);
      --accent: #8f3d2e;
      --accent-2: #1d5f6b;
      --theory: #7c3a2a;
      --numeric: #255b6a;
      --both: #5d4a99;
      --experimental: #2f6b39;
      --shadow: 0 18px 40px rgba(54, 32, 16, 0.12);
      --radius: 22px;
      --ui-font: "Aptos", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --title-font: "Palatino Linotype", "Noto Serif SC", Georgia, serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--ui-font);
      color: var(--text);
      background: radial-gradient(circle at top left, rgba(255,255,255,0.78), transparent 32%), radial-gradient(circle at 88% 12%, rgba(29,95,107,0.14), transparent 20%), linear-gradient(180deg, #fbf7f0 0%, var(--bg) 42%, #f2e8dc 100%);
      min-height: 100vh;
    }
    .shell { width: min(1220px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 64px; }
    .hero {
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(255,255,255,0.84), rgba(255,248,238,0.72)), linear-gradient(135deg, rgba(143,61,46,0.08), rgba(29,95,107,0.08));
      box-shadow: var(--shadow);
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.82); border: 1px solid var(--line); color: var(--muted); font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase;
    }
    h1 { margin: 18px 0 10px; font-family: var(--title-font); font-size: clamp(32px, 5vw, 54px); line-height: 1.04; letter-spacing: -0.03em; }
    .hero p { max-width: 880px; color: var(--muted); font-size: 16px; line-height: 1.7; margin: 0; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-top: 26px; }
    .stat { padding: 16px 18px; background: rgba(255,255,255,0.76); border: 1px solid var(--line); border-radius: 18px; }
    .stat .label { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
    .stat .value { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
    .controls { position: sticky; top: 12px; z-index: 3; margin-top: 22px; padding: 18px; border: 1px solid var(--line); border-radius: 24px; background: rgba(250,244,236,0.9); backdrop-filter: blur(16px); box-shadow: 0 10px 24px rgba(54,32,16,0.08); }
    .control-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 16px; }
    .field { display: flex; flex-direction: column; gap: 10px; }
    .field label { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
    .search { width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line); background: rgba(255,255,255,0.92); font: inherit; color: var(--text); }
    .chip-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .chip { border: 1px solid var(--line); background: rgba(255,255,255,0.82); color: var(--text); padding: 10px 14px; border-radius: 999px; font: inherit; cursor: pointer; }
    .chip.active { border-color: rgba(143,61,46,0.35); background: rgba(143,61,46,0.12); color: #5b2419; }
    .chip[data-type="数值"].active { border-color: rgba(37,91,106,0.35); background: rgba(37,91,106,0.12); color: #173f49; }
    .chip[data-type="理论+数值"].active { border-color: rgba(93,74,153,0.35); background: rgba(93,74,153,0.12); color: #46337d; }
    .chip[data-type="实验"].active { border-color: rgba(47,107,57,0.35); background: rgba(47,107,57,0.12); color: #214c29; }
    .meta-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 14px; color: var(--muted); font-size: 14px; }
    .paper-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 18px; margin-top: 22px; }
    .paper { display: flex; flex-direction: column; gap: 14px; padding: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 10px 24px rgba(54,32,16,0.06); }
    .paper-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .tag { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid transparent; }
    .tag.category { background: rgba(45,36,29,0.08); color: var(--text); }
    .tag.type-theory { background: rgba(124,58,42,0.1); color: var(--theory); border-color: rgba(124,58,42,0.16); }
    .tag.type-numeric { background: rgba(37,91,106,0.1); color: var(--numeric); border-color: rgba(37,91,106,0.16); }
    .tag.type-both { background: rgba(93,74,153,0.1); color: var(--both); border-color: rgba(93,74,153,0.16); }
    .tag.type-experimental { background: rgba(47,107,57,0.1); color: var(--experimental); border-color: rgba(47,107,57,0.16); }
    .paper h2 { margin: 0; font-family: var(--title-font); font-size: 22px; line-height: 1.25; letter-spacing: -0.02em; }
    .paper h2 a { color: inherit; text-decoration: none; }
    .paper h2 a:hover { color: var(--accent); }
    .paper .id { color: var(--muted); font-size: 13px; }
    .author-block { display: grid; gap: 10px; padding: 14px 16px; border-radius: 18px; background: rgba(255,255,255,0.64); border: 1px solid var(--line); }
    .author-label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .author-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .author-item { display: grid; gap: 4px; }
    .author-item strong { font-size: 14px; }
    .author-item span { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .author-note { color: var(--muted); font-size: 12px; }
    .paper .summary { margin: 0; font-size: 15px; line-height: 1.75; white-space: pre-line; }
    details { border-top: 1px solid var(--line); padding-top: 12px; }
    details summary { cursor: pointer; color: var(--accent-2); font-weight: 700; list-style: none; }
    details summary::-webkit-details-marker { display: none; }
    details p { margin: 10px 0 0; color: var(--muted); line-height: 1.72; font-size: 14px; white-space: pre-line; }
    .paper footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 6px; color: var(--muted); font-size: 13px; }
    .paper footer a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .empty { display: none; margin-top: 24px; padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 22px; background: rgba(255,255,255,0.7); }
    @media (max-width: 980px) { .control-grid { grid-template-columns: 1fr; } .controls { position: static; } }
  </style>
</head>

    const papers = [{"id": "2610.23865", "category": "cond-mat", "title": "Universal electrical resistivity in iron-based high-temperature superconductors", "abstract": "Temperature-dependent electrical resistivity $\\rho(T)$ in cuprate, iron-based, and nickelate superconductors represents one of unresolved problems in modern solid-state physics, because of the high absolute value of $\\rho(T)$, which, in many cases, exceeds the Ioffe-Rigel criterion, and a large difference in the $\\rho(T)$ shape for samples with different doping. Here I show that the nearest neighbors parallel resistivity model (arXiv: 2607.23484 ) can well describe the in-plane resistivity $\\rho_{ab}(T)$ in iron-based superconductors (IBS) of type 11, 111, 122, 1111, 1144 and 42214 in which the spin density wave phase or nematic order is suppressed by doping. The model is based on the postulate that $\\rho_{ab}(T)$ is a sum of two parallel conduction channels, where one channel is described by the Bloch-Grüneisen equation and the other by the Arrhenius hopping equation. Consequently, the variety of $\\rho_{ab}(T)$ in the IBS is explained as a variation of the Debye temperature $\\Theta_D$ and the hopping activation energy $E_a$. The derived Debye temperatures were used to estimate the electron-phonon coupling constant $\\lambda_{e-ph}$in the studied IBS.", "url": "https://arxiv.org/abs/2610.23865", "type": "理论+数值", "summary": "1. 该工作以Bloch-Grüneisen项与Arrhenius跳跃项并联构成的最邻近平行电阻率模型，描述了11、111、122、1111、1144与42214型铁基超导体在自旋密度波或向列序被掺杂抑制后的面内电阻率ρab(T)。\n2. 其卖点在于把各体系ρab(T)形状与量级的显著差异归结为德拜温度ΘD与跳跃激活能Ea的变动，并由ΘD估算电子-声子耦合常数λe-ph。\n3. 该结果对超出Ioffe-Regel判据的高电阻率给出统一而简洁的现象学描述，提示电阻率可作为提取电子-声子耦合的途径，并为理解铜氧化物与镍氧化物的普适输运提供参照。", "summary_source": "deepseek", "authors": [{"name": "E.F. Talantsev"}], "featured_authors": [{"name": "E.F. Talantsev"}], "author_count": 1}, {"id": "2610.23875", "category": "cond-mat", "title": "Resonant suppression of the $π$-type Josephson component in a Kitaev-ladder junction", "abstract": "We investigate Josephson transport through a finite normal segment connecting two Kitaev-ladder superconductors and show that discrete-level detuning controls the sign of the equilibrium Josephson coupling through a branch-selection mechanism. Away from resonance, detuning separates two competing low-energy branches, allowing inter-leg hybridization to clamp the $0$-phase-favoring branch while leaving the $\\pi$-favoring branch dispersive. The resulting negative first harmonic evolves from a branch-switching response at weak coupling into a smooth $\\pi$-junction regime. At resonance the two clamping thresholds coincide, so the finite interval in which only one branch remains dispersive disappears. Once the inter-leg coupling exceeds the resonant clamping threshold, both low-energy branches become independent of the Josephson phase. The remaining finite-energy states then generate a $0$-type Josephson coupling. At $\\phi=\\pi$, the helicity decomposition yields an exact clamping identity for arbitrary finite normal-segment length. Within the controlled sweet-point finite-segment theory, serial propagation fixes the off-resonant fourth-order harmonic to be negative, whereas an isolated resonance leaves a positive residual harmonic within the resonant clamping regime. Numerical calculations demonstrate that the resonance-induced suppression persists away from the solvable phase choice. Thus normal-level resonance does not merely enhance Josephson transmission; it changes which low-energy branches contribute to the Josephson coupling.", "url": "https://arxiv.org/abs/2610.23875", "type": "理论+数值", "summary": "1. 该工作研究有限正常段连接两个Kitaev梯超导体时的约瑟夫森输运，分析离散能级失谐如何经支选择机制控制平衡耦合符号并抑制π型分量。\n2. 核心卖点是共振使两个低能支的钳制阈值重合、消除仅单支色散的可调区间；过阈值后两支对相位不敏感而由有限能态产生0型耦合，并给出φ=π下任意正常段长度成立的精确钳制恒等式及四阶谐波符号判据。\n3. 这表明正常段能级共振并非简单增强透射，而是改变参与耦合的低能支，为Kitaev梯结的π结调控和相位敏感马约拉纳器件提供了可检验的谐波判据。", "summary_source": "deepseek", "authors": [{"name": "Cheng-Rong Xie"}, {"name": "Hiroki Tsuchiura"}, {"name": "Yukio Tanaka"}], "featured_authors": [{"name": "Cheng-Rong Xie"}, {"name": "Hiroki Tsuchiura"}, {"name": "Yukio Tanaka"}], "author_count": 3}, {"id": "2610.24047", "category": "cond-mat", "title": "Multiple propagating modes in random polycrystals", "abstract": "Multiple-scattering theory predicts that the coherent elastic wave in a statistically isotropic polycrystal is not a single wave. Its dispersion equation admits multiple roots of a given polarization, but these extra modes have never been observed. Here, using grain-scale finite-element simulations of three-dimensional polycrystals, we resolve the coherent field in the frequency--wavenumber plane and directly observe the predicted multiplicity for both transverse and longitudinal excitations: a single mode at low frequencies gives way to two in the geometric regime as the wavelength approaches the grain correlation length. The measured modes follow the roots of the dispersion equation, which always carries a third root whose attenuation exceeds that of the others. It is this attenuation hierarchy, not the root count, that dictates how many modes propagate and can be observed. Coherent wave propagation in random media is thus inherently multimodal in the geometric regime, which we reach here for the first time in polycrystals.", "url": "https://arxiv.org/abs/2610.24047", "type": "理论+数值", "summary": "1. 该工作利用三维多晶的晶粒尺度有限元模拟，在频率—波数平面解析相干弹性场，直接检验随机多晶中多重传播模式的理论预言。\n2. 其核心在于对横波与纵波均在几何区观测到低频单模向双模的转变，并表明决定可观测模式数的是色散方程各根的衰减层级而非根的总数。\n3. 这表明随机介质中的相干波传播在几何区本质上是多模的，并为多晶中首次进入该区及后续理论与实验检验提供了明确基准。", "summary_source": "deepseek", "authors": [{"name": "Ming Huang"}, {"name": "Stanislav I. Rokhlin"}, {"name": "Michael J. S. Lowe"}], "featured_authors": [{"name": "Ming Huang"}, {"name": "Stanislav I. Rokhlin"}, {"name": "Michael J. S. Lowe"}], "author_count": 3}, {"id": "2610.24065", "category": "cond-mat", "title": "Two quantum spin liquid states coexisting in the kagome antiferromagnet herbertsmithite", "abstract": "Herbertsmithite (ZnCu$_3$(OH)$_6$Cl$_2$) is one of the most extensively studied quantum spin liquid (QSL) candidates, yet the precise nature of its ground state remains unresolved. Here, we compare the results of high-resolution inelastic neutron scattering on single crystals of herbertsmithite (Zn$_\\mathrm{x}$Cu$_\\mathrm{4-x}$(OD)$_6$Cl$_2$, $x\\simeq 0.85$) with large-scale density-matrix renormalization group (DMRG) and dynamical DMRG simulations to benchmark the spin Hamiltonian and uncover fundamental properties of the ground state. The measured spin correlations determine an energy density for the Heisenberg model that closely matches simulations, an essential verification of the Hamiltonian. In parallel, DMRG simulations reveal two nearly degenerate QSL states. Both preserve translational symmetry, but one retains the lattice point-group symmetries whereas the other develops anisotropic spin correlations that break point-group symmetry. These two QSLs have distinct spin structure factors, and, remarkably, close agreement with the neutron spectra is achieved with an admixture of the two states. Our results establish a quantitative correspondence between neutron scattering and simulations, and suggest that herbertsmithite realizes a regime in which two proximate gapped QSL states coexist.", "url": "https://arxiv.org/abs/2610.24065", "type": "理论+数值", "summary": "1. 该工作将单晶 ZnₓCu₄₋ₓ(OD)₆Cl₂（x≈0.85）的高分辨非弹性中子散射与大尺度 DMRG 及动力学 DMRG 模拟对照，以检验海森堡哈密顿量并揭示基态性质。\n2. 其核心卖点在于由实测自旋关联得到的海森堡模型能量密度与模拟吻合，且 DMRG 发现两个近简并能隙量子自旋液体：二者均保持平移对称，但一个保留点群对称，另一个具破坏点群对称的各向异性关联，混合后与中子谱接近一致。\n3. 这建立了中子散射与数值模拟的定量对应，并暗示该材料处于两个邻近能隙量子自旋液体态共存的区间。", "summary_source": "deepseek", "authors": [{"name": "Arthur C. Campello"}, {"name": "Shengtao Jiang"}, {"name": "Wei He"}, {"name": "Jiajia Wen"}, {"name": "Daniel M. Pajerowski"}, {"name": "Steven A. Kivelson"}, {"name": "Hong-Chen Jiang"}, {"name": "Young S. Lee"}], "featured_authors": [{"name": "Arthur C. Campello"}, {"name": "Shengtao Jiang"}, {"name": "Wei He"}, {"name": "Steven A. Kivelson"}, {"name": "Hong-Chen Jiang"}, {"name": "Young S. Lee"}], "author_count": 8}, {"id": "2610.24101", "category": "cond-mat", "title": "Quantifying the Kinetic and Thermodynamic Origins of the Glass-Forming Ability in Metals", "abstract": "The glass-forming ability (GFA) of a metallic liquid can be quantified by the critical cooling rate $R_c$, below which it crystallizes upon cooling. $R_c$ is determined by the competition between $R$ and the crystallization rate $\\mathcal{K}_{\\rm X}$. Here, we calculate $R_c$ and $\\mathcal{K}_{\\rm X}$ in model pure metals and alloys with BCC/B2 and FCC equilibrium crystal structures. Using classical nucleation theory and independently calculated crystal growth rates, we evaluate $\\mathcal{K}_{\\rm X}=(IU^3)^{1/4}$ at $T=0.8T_m$, where $I$ and $U$ are the nucleation and growth rates and $T_m$ is the melting temperature. We find a strong positive correlation between $\\mathcal{K}_{\\rm X}$ and $R_c$ over eleven orders of magnitude. We decompose $\\mathcal{K}_{\\rm X}$ into a product of a kinetic contribution, involving atomic cluster attachment and diffusion, and a thermodynamic contribution. We show that the thermodynamic contribution to $\\mathcal{K}_{\\rm X}$ dominates the kinetic contribution over the range of cooling rates that we consider. The nucleation barrier $\\Delta G_c \\sim \\tilde\\gamma^3/\\Delta\\tilde\\mu^2$, where $\\tilde\\gamma$ is the reduced effective liquid--crystal interfacial free energy and $\\Delta\\tilde\\mu$ is the reduced bulk driving force, determines the magnitude of the thermodynamic contribution. The relative importance of $\\tilde\\gamma$ and $\\Delta\\tilde\\mu$ depends on the material: a large interfacial free energy can suppress nucleation in some systems, whereas a weak bulk driving force can inhibit crystallization in others. Analyses of the structural and chemical order show that better glass formers have enhanced structural frustration, more icosahedral-like and less crystal-like local environments, and a larger chemical-order mismatch between the supercooled liquid and crystal phases.", "url": "https://arxiv.org/abs/2610.24101", "type": "理论+数值", "summary": "1. 该文针对具有BCC/B2与FCC平衡结构的模型纯金属和合金，基于经典成核理论并独立计算晶体生长速率，求取临界冷却速率R_c与结晶速率K_X，并分解其动力学与热力学来源。\n2. 主要卖点是在十一个数量级范围内发现K_X与R_c强正相关，且K_X的热力学贡献主导动力学贡献，其成核势垒由约化界面自由能与体驱动力共同决定并在不同材料中二者相对重要性不同。\n3. 结构化学序分析表明更优玻璃形成体具有更强结构阻挫、更多二十面体样且更少晶体样局域环境以及更大的液-晶化学序失配，这为理解金属玻璃形成能力提供了可检验的微观判据。", "summary_source": "deepseek", "authors": [{"name": "Weiwei Jin"}, {"name": "Jinpeng Fan"}, {"name": "Mark D. Shattuck"}, {"name": "Corey S. O'Hern"}], "featured_authors": [{"name": "Weiwei Jin"}, {"name": "Jinpeng Fan"}, {"name": "Mark D. Shattuck"}, {"name": "Corey S. O'Hern"}], "author_count": 4}, {"id": "2610.24208", "category": "cond-mat", "title": "Kohler's Rule Holds in the Strange Metallic Hubbard Model", "abstract": "Unconventional magnetotransport violating Kohler's rule has been reported in many strongly correlated strange metals, but the exact origin of these violations is yet unknown. To investigate this question, we use determinant quantum Monte Carlo to compute the magnetoresistance of the hole-doped Hubbard-Hofstadter model. Despite $T$-linear resistivity exceeding the Mott-Ioffe-Regel limit and the nominal absence of well-defined quasiparticles, we find Kohler's rule unexpectedly holds across a wide range of on-site interaction strengths and hole dopings. In particular, Kohler emerges below a crossover temperature $T^\\star\\approx t$ identified from the double occupancy and specific heat, coinciding with the onset of local singlet correlations between lattice sites. We thus propose that Kohler scaling in this regime reflects a more general form of many-body quantum coherence. Our results show that strong correlations and strange metallicity do not themselves generically produce anomalous magnetoresistance.", "url": "https://arxiv.org/abs/2610.24208", "type": "理论+数值", "summary": "1. 该工作用行列式量子蒙特卡罗计算空穴掺杂Hubbard-Hofstadter模型的磁阻，检验奇异金属中Kohler规则是否成立。\n2. 其关键结果是：即便电阻率呈T线性并超过Mott-Ioffe-Regel极限、准粒子图像失效，Kohler标度仍在宽广相互作用与掺杂范围内成立，并在T*≈t以下与双占据、比热交叉及局域单态关联的出现同时发生，作者据此将其解释为更普遍的多体量子相干。\n3. 这表明强关联和奇异金属性本身并不必然导致反常磁阻，暗示实验中的Kohler规则破缺需诉诸其他机制。", "summary_source": "deepseek", "authors": [{"name": "Rebekah M. Jin"}, {"name": "Emily Z. Zhang"}, {"name": "Jixun K. Ding"}, {"name": "Brian Moritz"}, {"name": "Thomas P. Devereaux"}], "featured_authors": [{"name": "Rebekah M. Jin"}, {"name": "Emily Z. Zhang"}, {"name": "Jixun K. Ding"}, {"name": "Brian Moritz"}, {"name": "Thomas P. Devereaux"}], "author_count": 5}, {"id": "2610.24317", "category": "cond-mat", "title": "Encoding Hyperuniformity in Geometric Networks: Structural Signatures and Diffusion Dynamics", "abstract": "Disordered hyperuniformity is a recently discovered exotic state exhibiting anomalously suppressed density fluctuations at long wavelengths, and its generalization to network systems remains an important open question. Here, we show that, across a wide range of systems, geometric networks retain substantially more long-wavelength density information from the underlying point configurations than Delaunay triangulations. Within geometric networks, hyperuniformity manifests as suppressed vertex-to-vertex fluctuations in a range of network structural observables, including closeness centrality, vertex strength, and eigenvector centrality. These measures not only distinguish hyperuniform networks from non-hyperuniform ones, but also separate near-hyperuniform configurations from hyperuniform systems with strong local disorder, solving a central challenge in network hyperuniformity. We connect these structural signatures to network dynamics by introducing a relaxation-time centrality based on diffusion and demonstrate that hyperuniform geometric networks exhibit more homogeneous relaxation behavior than non-hyperuniform geometric networks. These results reveal how the suppression of large-scale density fluctuations manifests in both network structure and diffusion dynamics.", "url": "https://arxiv.org/abs/2610.24317", "type": "理论", "summary": "1. 该工作在几何网络框架下比较其与Delaunay三角剖分对底层点配置长波密度信息的保留能力，并系统考察超均匀性在网络结构涨落与扩散动力学中的表现。\n2. 其核心卖点是几何网络在接近中心性、节点强度和特征向量中心性等结构量上呈现顶点间涨落抑制，可区分超均匀、近超均匀与强局域无序系统，并用基于扩散的弛豫时间中心性连接结构与动力学。\n3. 这些结果表明大尺度密度涨落抑制会同时体现在网络结构和扩散弛豫中，为超均匀网络的识别、设计及后续动力学研究提供了可操作的结构判据与启发。", "summary_source": "deepseek", "authors": [{"name": "Yongyi Wang"}, {"name": "Eli Newby"}, {"name": "Yang Jiao"}, {"name": "Salvatore Torquato"}, {"name": "Réka Albert"}], "featured_authors": [{"name": "Yongyi Wang"}, {"name": "Eli Newby"}, {"name": "Yang Jiao"}, {"name": "Salvatore Torquato"}, {"name": "Réka Albert"}], "author_count": 5}, {"id": "2610.24401", "category": "cond-mat", "title": "Second Chern Number Protected Gapless Vortex Modes in Superconducting Weyl Semimetals", "abstract": "We have studied the vortex bound states of superconducting linear and quadratic Weyl semimetals with time reversal symmetry. For vortex with vorticity $n$ (vortex line along $z$ direction) and Weyl semimetals with Weyl point chirality $\\chi$, there are $\\vert n\\chi \\vert$ gapless vortex modes around the location of each Weyl point in superconducting Weyl semimetals. We show that the appearance of $\\vert n\\chi \\vert$ gapless vortex modes originates from the imbalanced pumping of flux bound states between Chern insulators obtained at $k_{z}$ and $-k_{z}$ in Weyl semimetals. Such a physical picture is verified by numerical calculations on lattice models. Moreover, the gapless modes around each Weyl point can be characterized by the second Chern number defined in a synthetic four-dimensional space based on the effective BdG Hamiltonian. Finally, these gapless vortex modes are found to be robust against rotational symmetry-breaking terms.", "url": "https://arxiv.org/abs/2610.24401", "type": "理论+数值", "summary": "1. 该工作研究了具有时间反演对称性的线性和二次超导外尔半金属的涡旋束缚态，指出在涡旋涡度n与外尔点手征χ给定下，每个外尔点附近存在|nχ|个无能隙涡旋模。\n2. 其核心在于用kz与-kz处陈绝缘体之间通量束缚态的失衡泵浦解释这些模式的产生，并在格点模型上数值验证，同时以合成四维BdG空间中的第二陈数刻画其拓扑保护。\n3. 这些无能隙模对破坏旋转对称性的项保持稳健，为第二陈数保护的超导涡旋态及后续拓扑超导研究提供了明确切入点。", "summary_source": "deepseek", "authors": [{"name": "Zhicheng Zhang"}, {"name": "Jiangping Hu"}], "featured_authors": [{"name": "Zhicheng Zhang"}, {"name": "Jiangping Hu"}], "author_count": 2}, {"id": "2610.24407", "category": "cond-mat", "title": "Atomistic prediction of magnetic behaviour across chemistry, structure and temperature", "abstract": "Controlling magnetic phases and properties through composition and external conditions is central to the development of magnetic materials. Atomistic foundation models offer a route to predicting such behaviour across diverse materials, but magnetic materials remain challenging because their atomic structure and local moments are strongly coupled, while temperature and disorder drive magnetic moments into non-collinear states with evolving orientations and magnitudes. Broadly pretrained atomistic models still sample only limited magnetic diversity, while finite-temperature descriptions of coupled lattice and magnetic fluctuations remain largely material-specific. Here we introduce MagPT, pretrained across 48 elements on 912,492 spin-lattice configurations spanning structural, orientational and longitudinal magnetic fluctuations over 0 $\\sim$ 1,000 K and 0 $\\sim$ 10 GPa. By treating species, atomic positions and vector moments together, MagPT distinguishes magnetic states that share the same atomic structure but differ in spin configuration and energy. It captures magnetic behaviour across composition, temperature and length scales, from Slater-Pauling-type composition-magnetism relations in transition-metal alloys and finite-temperature phase evolution in elemental ferromagnets and magnetic shape-memory Heusler alloys, to emergent long-wavelength non-collinear spin textures in chiral magnets and local chemistry-magnetism coupling in high-entropy alloys. MagPT moves atomistic studies of magnetic materials beyond material-specific approaches, establishing a general framework for exploring and designing magnetic matter across diverse chemistries and conditions.", "url": "https://arxiv.org/abs/2610.24407", "type": "理论", "summary": "1. 该工作构建原子尺度基础模型MagPT，在48种元素、912,492个自旋—晶格构型上预训练，覆盖0–1000 K与0–10 GPa的结构、取向及纵向磁涨落。\n2. 其关键是将元素、原子位置与矢量磁矩联合编码，以区分同结构但自旋构型和能量不同的磁态，并跨成分、温度与尺度重现Slater-Pauling关系、有限温度相变、Heusler合金、手性非共线织构及高熵合金局域耦合。\n3. 这使磁性材料的原子尺度研究不再依赖单一材料定制模型，并为跨化学组成和外部条件探索与设计磁有序物质提供通用框架。", "summary_source": "deepseek", "authors": [{"name": "Ruosong Shi"}, {"name": "Chengbing Chen"}, {"name": "Bicheng Liu"}, {"name": "Daye Zheng"}, {"name": "Duo Zhang"}, {"name": "Zhengtao Huang"}, {"name": "Teng Yang"}, {"name": "Zefeng Cai"}, {"name": "Xingliang Peng"}, {"name": "Xinzijian Liu"}, {"name": "Shenshen Yan"}, {"name": "Xueqing Zhao"}, {"name": "Jianbo Wang"}, {"name": "Bin Liu"}, {"name": "Han Wang"}, {"name": "Ke Wang"}, {"name": "Liuliu Han"}, {"name": "Ben Xu"}], "featured_authors": [{"name": "Ruosong Shi"}, {"name": "Chengbing Chen"}, {"name": "Bicheng Liu"}, {"name": "Ke Wang"}, {"name": "Liuliu Han"}, {"name": "Ben Xu"}], "author_count": 18}, {"id": "2610.24410", "category": "cond-mat", "title": "Calibrated shape-only recovery of membrane viscosities", "abstract": "Nearby relaxation rates make two membrane viscosities difficult to distinguish from a shape transient. We show how calibrated preparation removes this loss of local sensitivity in a linear Kelvin-Voigt sphere with finite area elasticity and intrinsic membrane dissipation. Two independent releases, with a known signed amplitude ratio and calibrated relative gain and timing, yield normal-displacement records whose fixed linear combination separates the shear and dilatational rates. Their common amplitude remains unknown. For fixed sampling, positive-definite weights, bounded positive rates and nonzero excitation, the amplitude-projected sensitivity has a positive lower bound even at rate coincidence. Without relative calibration, the paired sensitivity decreases linearly with the rate gap; the single tangential-release record decreases quadratically. The calibrated bound is compatible with fixed finite initial energy. A positive local bound also persists with independent ratio calibration of fixed positive precision under a Gaussian error model. Supplied elastic coefficients convert the recovered rates into the two surface viscosities. An unbounded spherical Stokes extension quantifies how bulk dissipation changes the modal patterns and provides a sufficient full-Jacobian criterion for retaining local material sensitivity.", "url": "https://arxiv.org/abs/2610.24410", "type": "理论", "summary": "1. 该工作提出一种仅利用形状瞬态的校准反演方案，在有限面积弹性的线性Kelvin-Voigt球面上，用两次独立释放的法向位移记录及其固定线性组合分离剪切与膨胀膜黏度对应的弛豫率。\n2. 其关键在于已知符号振幅比并校准相对增益与时序后，即便两速率接近、共同振幅未知，振幅投影灵敏度仍具正下界；未校准时配对与单切向释放灵敏度分别随速率差线性、二次衰减。\n3. 结合弹性系数可由回收速率得到两种表面黏度，且固定精度高斯误差下正局部界仍成立，并为含体耗散的球面Stokes扩展提供保留材料灵敏度的全雅可比判据。", "summary_source": "deepseek", "authors": [{"name": "Julian Olszewski"}, {"name": "Zijian Liu"}, {"name": "Jie Xu"}], "featured_authors": [{"name": "Julian Olszewski"}, {"name": "Zijian Liu"}, {"name": "Jie Xu"}], "author_count": 3}, {"id": "2610.24418", "category": "cond-mat", "title": "Reticulating Local Dynamics in Three-Dimensional Covalent Organic Frameworks", "abstract": "In covalent organic frameworks (COFs), the geometry of the building units predetermines the structure of the framework, yet comparable design principles relating the COF linkers to the local motions that govern guest adsorption and diffusion as well as mechanical response have remained beyond reach. Here, we combine synchrotron X-ray pair distribution function (PDF) analysis with molecular dynamics (MD) simulations accelerated by machine learning interatomic potentials to resolve and compare the local dynamics of two three-dimensional imine-linked COFs, chosen to differ in the geometry and rigidity of one of their two building units. Both are constructed from the same 4-connected square planar linker, $4,4',4'',4'''$-(pyrene-1,3,6,8-tetrayl)tetraaniline (PyTTA), reticulated with the 12-connected nanographene hexakis{[3,5-bis($p$-formylphenyl)-4,6-dimethoxyphenyl]}hexabenzocoronene to give COF-412, {[(HBC-LA$_{12}$)(PyTTA)$_3$]}$_{\\mathit{imine}}$, and with the 6-connected triptycene 2,3,6,7,14,15-hexakis(4-formylphenyl)triptycene to give COF-564, {[(Trip-CHO)$_2$(PyTTA)$_3$]}$_{\\mathit{imine}}$. The PDF-MD approach resolves the amplitude, the time scale, and the spatial extent of the motion of all COF linkers, separating the limited libration of the fused aromatic cores from the larger reorientational tilts of the pendant aryl rings they carry and from the translation of whole linkers within the net. The simulations further reveal that exchanging the nanographene- for the triptycene-based linker tunes the equilibrium tilt and the positional probability density of PyTTA, raising the tilt amplitude of its linker partner, and, notably, strengthens the coupling between the translations of neighbouring linkers. This approach provides a blueprint for understanding local dynamical properties in COFs, and shows them to be selectable through the choice of building unit and amenable to design.", "url": "https://arxiv.org/abs/2610.24418", "type": "理论+数值", "summary": "1. 该工作结合同步辐射X射线对分布函数分析与机器学习势加速的分子动力学模拟，解析并比较了两种仅一构筑单元几何与刚性不同的三维亚胺连接共价有机框架的局域动力学。\n2. 其核心在于同时分辨所有连接单元的振动幅度、时间尺度与空间范围，区分稠合芳核的受限摆动、侧挂芳环的较大取向倾斜及整体连接单元在网络中的平移，并揭示更换纳米石墨烯/三蝶烯连接单元可调节PyTTA平衡倾斜与位置概率密度、增强相邻连接单元平移耦合。\n3. 这为理解并经由构筑单元选择设计共价有机框架的局域动力学提供了可推广范式。", "summary_source": "deepseek", "authors": [{"name": "Francesco Tavani"}, {"name": "Saber Mirzaei"}, {"name": "M. Saeed Mirzaei"}, {"name": "Jian Yin"}, {"name": "Yen-hsu Lin"}, {"name": "Caden Myers"}, {"name": "Cheng-Hung Lin"}, {"name": "AM Milinda Abeykoon"}, {"name": "Simon J. L. Billinge"}, {"name": "Omar M. Yaghi"}], "featured_authors": [{"name": "Francesco Tavani"}, {"name": "Saber Mirzaei"}, {"name": "M. Saeed Mirzaei"}, {"name": "AM Milinda Abeykoon"}, {"name": "Simon J. L. Billinge"}, {"name": "Omar M. Yaghi"}], "author_count": 10}, {"id": "2610.24432", "category": "cond-mat", "title": "A GRACE Interatomic Potential for W--Ta Systems: Application to Ta Segregation and Pinning of Shear-Coupled Grain-Boundary Migration", "abstract": "Tungsten-tantalum alloys are promising plasma-facing materials for fusion reactors, but simulations of their coupled defect, mechanical, and microstructural evolution require an interatomic potential that remains accurate across diverse atomic environments. We develop a transferable W-Ta potential within the GRaph Atomic Cluster Expansion (GRACE) framework. The primary training dataset was generated automatically by maximizing information entropy in an atomically relevant feature space, avoiding manual enumeration of the structures and processes required for specific downstream applications. Extensive validation demonstrates a consistent description of unary and binary phase stability, elasticity, phonons, high-pressure response, surfaces, point defects, dislocation energetics, transformation pathways, alloy thermodynamics, and melting behavior. As a demonstration, the potential is applied to Ta segregation and shear-coupled migration of a $\\Sigma5(120)$ W GB. Simulations reveal strongly site-selective segregation: Ta preferentially occupies a small subset of crystallographically distinct atomic rows. Under shear, segregated Ta impedes disconnection-mediated grain boundary migration. The de-pinning stress initially increases with Ta concentration but plateaus as the dominant pinning environment becomes saturated, while increasing temperature weakens both segregation and pinning. These results establish a broadly validated W-Ta potential and demonstrate how automated entropy-maximized data generation can produce transferable atomistic models capable of resolving mechanisms not explicitly targeted during training.", "url": "https://arxiv.org/abs/2610.24432", "type": "理论+数值", "summary": "1. 该工作基于GRACE框架构建可迁移的W–Ta原子间势，并将其用于Ta在Σ5(120)钨晶界偏析及剪切耦合迁移钉扎的模拟。\n2. 其核心卖点是用原子相关特征空间的熵最大化自动生成训练集，避免手工枚举结构，并在相稳定性、弹性、声子、高压响应、缺陷、位错、热力学与熔化等性质上给出一致验证。\n3. 模拟揭示Ta呈强位点选择性偏析，偏析Ta阻碍台阶位错介导的晶界迁移，钉扎应力随浓度先升后饱和且随温度升高而减弱；这为钨钽合金耦合演化模拟提供可迁移势，并表明熵最大化自动数据生成可捕获训练未显式针对的机制。", "summary_source": "deepseek", "authors": [{"name": "Omar Hussein"}, {"name": "Laurent Capolungo"}, {"name": "Danny Perez"}], "featured_authors": [{"name": "Omar Hussein"}, {"name": "Laurent Capolungo"}, {"name": "Danny Perez"}], "author_count": 3}, {"id": "2610.24434", "category": "cond-mat", "title": "Beyond low-dissipation regime: general condition for Curzon-Ahlborn efficiency", "abstract": "In recent years, physicists have extensively investigated the universality of Curzon-Ahlborn (CA) efficiency as the efficiency at maximum power of heat engines, which, like Carnot efficiency, is determined only by heat-bath temperatures. While the universality of the CA efficiency to the first order in the temperature difference is established within linear response theory in the inverse operation time, it is generally lost at quadratic order. In the low-dissipation Carnot heat engine model known as the standard framework, the symmetric dissipation condition is necessary. Yet, it is not a necessary condition as the original CA model that adopts endoreversibility does not require such symmetry. In this study, we extend the low-dissipation model to include nonlinear response in the inverse operation time and derive a general condition under which the CA efficiency is recovered in the quadratic order. The generalized symmetric dissipation condition and the CA model with Newton's law of cooling are shown to be special cases of this condition. By applying the obtained condition, we also clarify the condition under which an endoreversible model with a general heat-transfer law exhibits the CA efficiency.", "url": "https://arxiv.org/abs/2610.24434", "type": "理论", "summary": "1. 该工作将低耗散卡诺热机模型推广到逆操作时间的非线性响应区，推导出最大功率下温差二次阶仍恢复Curzon-Ahlborn效率的一般条件。\n2. 其关键推进在于把广义对称耗散条件与服从牛顿冷却定律的CA模型统一为该条件的特例，并据此判定一般传热律下内可逆模型呈现CA效率的判据。\n3. 这一框架明确了CA效率普适性在偏离线性响应后的适用边界，为有限时间热力学中传热律与耗散对称性的作用提供了可检验的理论线索。", "summary_source": "deepseek", "authors": [{"name": "Yuki Izumida"}], "featured_authors": [{"name": "Yuki Izumida"}], "author_count": 1}, {"id": "2610.24450", "category": "cond-mat", "title": "Accurate Atomic Correlation Energies and Virial Trends for Correlation-Consistent Effective Core Potentials III: Quantitative Separation of Fixed-Node Biases and Localization Errors in Cs-Rn", "abstract": "Atomic benchmarks for sixth-period elements (Cs-Rn) are established to sub-millihartree precision under correlation-consistent effective core potentials (ccECPs) using coupled-cluster [up to CCSDT(Q)] and full configuration interaction methods. These references systematically characterize electron correlation, potential-to-kinetic energy partitioning, and combined fixed-node and locality biases ($\\eta$) in fixed-node diffusion Monte Carlo (FNDMC). The valence kinetic-to-total energy ratio ($\\xi$) departs from the non-relativistic all-electron Coulombic virial limit ($\\xi=100\\%$), remaining confined between 25.8$\\%$ and 37.6$\\%$. The Un-pseudizing of semi-core shells decreases $\\xi$ as the attractive potential energy deepens faster than the accompanying kinetic energy escalates. Periodic trends in $\\xi$ reveal a $5d$ plateau near 34$\\%$, with a lanthanide-contraction-driven maximum in Hf, followed by a sharp decline across the $6p$ block. In FNDMC, $\\eta$ escalates rapidly at the onset of group-1/2 and toward the $6p$ closed-shell limit, peaking at 5.42$\\%$ in Rn. Although fixed-node errors dominate $\\eta$ in most sixth-period elements, a locality error inversion occurs in Bi, with Pb exhibiting comparable error magnitudes. Furthermore, core-valence partitioning alters trial wavefunction nodal topology: in Tl, three-dimensional nodal cross-sections reveal isolated toroidal domains that confine walkers. This work completes the periodic-table-wide ccECP database from H to Rn, revealing how pseudopotential choices govern energy partitioning, nodal topology, and the balance between fixed-node and localization errors.", "url": "https://arxiv.org/abs/2610.24450", "type": "数值", "summary": "1. 该工作用CCSDT(Q)与FCI建立了Cs–Rn第六周期原子在ccECP下的亚毫哈特里基准，并系统表征相关能、动能-势能分配及FNDMC中的固定节点与局域化联合偏差η。\n2. 其核心在于定量分离η的固定节点与局域化误差，揭示价层动能占比ξ仅25.8%–37.6%并呈5d约34%、Hf最大、6p骤降的周期趋势，且Bi出现局域化误差反转、Pb量级相当、Tl节点截面呈孤立环面域。\n3. 该工作补全H至Rn的ccECP数据库，表明核-价划分会改变节点拓扑并决定误差平衡，为第六周期重元素的高精度量子蒙特卡洛与基准计算提供可检验依据。", "summary_source": "deepseek", "authors": [{"name": "Omar Madany"}, {"name": "Lubos Mitas"}], "featured_authors": [{"name": "Omar Madany"}, {"name": "Lubos Mitas"}], "author_count": 2}, {"id": "2610.24565", "category": "cond-mat", "title": "Surface corrections and vortex energetics in the Thomas--Fermi limit of a self-bound unitary Fermi superfluid", "abstract": "We study a spin-balanced unitary Fermi superfluid bound by an attractive $1/r$ interaction within an extended Thomas--Fermi density functional. Its large-particle-number limit is the Lane--Emden polytrope of index $3/2$. We prove the leading gradient correction to the ground-state energy and strong convergence of the density amplitude. A rescaled surface problem predicts the next energy correction and the leading integrated density error. Matching a vortex core to the polytropic bulk gives the energetic threshold of a singly quantized central vortex, including the constant beyond the leading logarithm. Linearizing the same surface problem predicts a local energetic threshold for collective surface excitations that, in the natural TF frequency units, decreases more slowly with particle number than the central-vortex threshold. Radial stationary, spherical Bogoliubov--Poisson, and axisymmetric real-time calculations test the predicted energy corrections and vortex matching, and resolve finite-size surface-mode minima whose approach to the continuum surface coefficient is followed to $N\\simeq4\\times10^6$. For the reference gradient coefficient the vortex constant is $c_1=-0.535$, and the surface Landau scale is $1.417\\,\\omega_K(\\hbar_{\\rm eff}^2/2R_{\\rm TF})^{1/6}\\propto N^{-1/9}$; sector energies at $N\\simeq4.6\\times10^5$, computed after the fit, agree with the extrapolated vortex threshold to $10^{-4}$. These results distinguish the accuracy of the Thomas--Fermi bulk from the gradient physics that controls the surface and vortex core, and separate vortex energetics from the open problem of nonlinear vortex entry.", "url": "https://arxiv.org/abs/2610.24565", "type": "理论+数值", "summary": "1. 该工作在扩展托马斯–费米密度泛函中研究受1/r吸引作用束缚的自旋平衡幺正费米超流，证明大粒子数极限为指数3/2的Lane–Emden多方球，并导出基态能量的领头梯度修正与密度振幅强收敛。\n2. 其卖点是用重整化表面问题预测下一阶能量与积分密度误差，并将涡旋核匹配到多方球体，得到含对数外常数c1=-0.535的中心单量子化涡旋阈值及随N^{-1/9}下降的表面朗道尺度。\n3. 这区分了体相托马斯–费米精度与支配表面和涡旋核的梯度物理，并将涡旋能量学与非线性涡旋进入问题分开，为有限尺寸幺正费米超流提供定量基准。", "summary_source": "deepseek", "authors": [{"name": "Bao-Duy Le"}], "featured_authors": [{"name": "Bao-Duy Le"}], "author_count": 1}, {"id": "2610.24629", "category": "cond-mat", "title": "Signed FK percolation in Ising spin glasses", "abstract": "We introduce signed Fortuin-Kasteleyn (FK) percolation for the +/-J random-interaction Ising model to characterize nonzero uniform magnetization density and two-replica overlap within the class of Gibbs distributions whose infinite-volume Edwards-Sokal (ES)/FK representation has at most one infinite FK cluster almost surely. The construction refines ordinary FK connectivity by retaining the parity of coupling products along open paths. Using the infinite-volume ES representation and its DLR equations, we study pairs of companion objects and the compatible spin assignments on them. In one replica, companions are defined by positive-parity FK connections. For extremal states satisfying the infinite-cluster assumption and almost-sure existence of companion densities along the chosen van Hove sequence, nonzero limiting expected magnetization density is equivalent to density distinguishability of the companions of the infinite FK cluster. For two independent replicas, companions are defined by FK connections coherent in parity. For products of extremal one-replica states satisfying the infinite-cluster assumption and almost-sure existence of the companion densities along the chosen sequence, density distinguishability of the companions is equivalent to nonzero limiting expected mutual overlap. For two independent replicas drawn from the same extremal state, this specializes to the Edwards-Anderson self-overlap.", "url": "https://arxiv.org/abs/2610.24629", "type": "理论", "summary": "1. 该工作为±J随机Ising自旋玻璃引入带符号Fortuin-Kasteleyn渗流，在无限体积ES/FK表示至多一个无限FK簇的Gibbs分布类中刻画非零均匀磁化与双副本重叠。\n2. 其卖点是保留开路径耦合乘积宇称以细化普通FK连通性，并用无限体积ES表示与DLR方程定义伴随体，证明伴随体密度可区分性等价于非零磁化或互重叠。\n3. 这为自旋玻璃铁磁序与Edwards-Anderson重叠提供渗流判据，但结论依赖于单一无限FK簇及伴随密度几乎必然存在等前提。", "summary_source": "deepseek", "authors": [{"name": "Alberto Gandolfi"}, {"name": "Charles Newman"}, {"name": "Danile Stein"}], "featured_authors": [{"name": "Alberto Gandolfi"}, {"name": "Charles Newman"}, {"name": "Danile Stein"}], "author_count": 3}, {"id": "2610.24637", "category": "cond-mat", "title": "Turning Number and the Geometry of Disorder-Induced Topology", "abstract": "The geometry of momentum-space Hamiltonian maps derived from the zero-frequency single-particle Green's function provides a route to a refined topological characterization of quantum systems beyond the noninteracting clean limit. The central idea is to complement standard topological invariants by invariants that characterize the geometry of the map itself. As a paradigmatic example, we study the one-dimensional chiral Su-Schrieffer-Heeger model with disorder, where the topological Hamiltonian defines a planar Bloch loop. In addition to its conventional winding number, this loop possesses an integer turning number that characterizes the winding of its tangent vector. We identify turning-number transitions that occur while the topological Hamiltonian remains finite and spectrally gapped, driven solely by a vanishing tangent vector of the Bloch loop, and obtain an extended phase diagram with additional topological structure beyond the winding-number classification. Asymptotic analysis predicts the emergence and disorder dependence of the corresponding transition regime, in agreement with the numerical results. Our findings establish the geometry of momentum-space Hamiltonian maps as an additional source of topological structure beyond conventional classifications.", "url": "https://arxiv.org/abs/2610.24637", "type": "理论+数值", "summary": "1. 该工作以零频单粒子格林函数构造的动量空间哈密顿量映射为出发点，在一维手性SSH模型中引入无序，并用转动数补充绕数分类以获得扩展相图。\n2. 其核心卖点是转动数刻画平面Bloch环切向量的绕转，可识别在拓扑哈密顿量有限且谱有隙时仅由切向量消失驱动的转变，并用渐近分析预测该转变区间的无序依赖。\n3. 这提示动量空间哈密顿量映射的几何本身可作为超越传统绕数分类的拓扑结构来源，为无序量子体系的精细拓扑表征提供启发。", "summary_source": "deepseek", "authors": [{"name": "Lars Emmrich"}, {"name": "Michael Potthoff"}], "featured_authors": [{"name": "Lars Emmrich"}, {"name": "Michael Potthoff"}], "author_count": 2}, {"id": "2610.24799", "category": "cond-mat", "title": "Strain-Tunable High-$T_c$ Superconductivity in Layered R3m B$_2$CN", "abstract": "Using DFPT and Wannier-interpolated matrix elements in EPW, we find that isotropic tensile strain of 0--6\\% narrows the B:2$p$/C:2$p$ bands at the Fermi level while softening the phonon branches most strongly coupled to them, driving the coupling constant $\\lambda$ from 0.967 to 2.620. All four strained configurations remain mechanically and dynamically stable, satisfying the Born--Huang criteria with no imaginary phonon modes at any strain level. The fully anisotropic Migdal--Eliashberg equations give a $T_c$ that rises monotonically from 53.5~K to 84.5~K across the strain series, crossing the liquid-nitrogen boiling point at 6\\% strain. The SISSO-based machine-learning model in EPW agrees with the anisotropic Migdal--Eliashberg $T_c$ values to within 10~K across the strain series.", "url": "https://arxiv.org/abs/2610.24799", "type": "理论+数值", "summary": "1. 该工作用DFPT和EPW的Wannier插值矩阵元，计算层状R3m B2CN在0—6%各向同性拉伸应变下的电子-声子耦合与超导性。\n2. 其卖点是应变同时窄化费米面附近的B:2p/C:2p能带并软化强耦合声子支，使λ由0.967升至2.620，且各应变结构均满足Born–Huang判据、无虚频。\n3. 各向异性Migdal–Eliashberg计算给出Tc从53.5 K单调升至84.5 K并在6%应变越过液氮沸点，EPW中SISSO模型误差在10 K内，表明该体系是应变可调的高Tc超导候选。", "summary_source": "deepseek", "authors": [{"name": "Durjay Dhali"}, {"name": "Arafat Rahman"}, {"name": "Tareq Mahmud"}, {"name": "Alamgir Kabir"}], "featured_authors": [{"name": "Durjay Dhali"}, {"name": "Arafat Rahman"}, {"name": "Tareq Mahmud"}, {"name": "Alamgir Kabir"}], "author_count": 4}, {"id": "2610.24828", "category": "cond-mat", "title": "Multi-property Feynman-Kac Steering of Crystal Diffusion Models", "abstract": "Pretrained diffusion models provide powerful priors for generating new materials, including inorganic crystals, but generating useful materials requires satisfying specific chemical and physical properties, from mechanical stiffness to bandgaps. Existing approaches either retrain models for new target properties or steer only the atom coordinates and lattice during generation, leaving composition unchanged despite its fundamental role in determining physical properties. We present FK-ReMask, an inference-time, gradient-free method that steers both the continuous and discrete channels of a pretrained crystal diffusion model. During generation, FK-ReMask maintains multiple denoising trajectories and replicates promising candidates using Feynman-Kac particle selection. However, selection alone is insufficient: in the atom-type channel, committed elements cannot be revised, so cloning propagates existing compositions and limits the population's ability to explore new ones. We address this with an atom re-masking mechanism, which reopens committed sites during the generation process and allows alternative compositions to emerge. Across four electronic, photovoltaic, and mechanical objectives, our method improves the yield of SUN (stable, unique, novel) and property-on-target materials. We further demonstrate joint steering of three photovoltaic properties, showing that multiple physical objectives can be specified entirely at inference time without retraining.", "url": "https://arxiv.org/abs/2610.24828", "type": "理论", "summary": "1. 该工作提出FK-ReMask，一种在推理阶段、无需梯度、无需重训练即可同时引导预训练晶体扩散模型连续晶格坐标通道与离散原子类型通道的材料生成方法。\n2. 其技术卖点是用Feynman-Kac粒子选择维护多条去噪轨迹并复制有希望候选，同时以原子重掩码重新开放已确定位点，使组分在生成过程中可被探索和改写。\n3. 在电子、光伏与力学目标上，该方法提高了稳定、独特、新颖及性质达标材料的产率，并展示可在推理时联合指定多种光伏性质而不重训练，为多目标材料设计提供可复用启发。", "summary_source": "deepseek", "authors": [{"name": "Oded Mousai"}, {"name": "Sapir Esther Yiflach"}, {"name": "Barak Itzchak Davidovitch"}, {"name": "Yuval Mualem"}, {"name": "Sarit Kraus"}, {"name": "Hannah-Noa Barad"}, {"name": "Karsten Kreis"}, {"name": "Gal Chechik"}], "featured_authors": [{"name": "Oded Mousai"}, {"name": "Sapir Esther Yiflach"}, {"name": "Barak Itzchak Davidovitch"}, {"name": "Hannah-Noa Barad"}, {"name": "Karsten Kreis"}, {"name": "Gal Chechik"}], "author_count": 8}, {"id": "2610.24877", "category": "cond-mat", "title": "Vortexable Chern Bands Sit Exactly on the Topological Floor of Flat-Band Superfluid Stiffness", "abstract": "Vortexable Chern bands host ideal fractional Chern insulators. Paired with time-reversed partners by orbital-diagonal on-site attraction, they are the least stiff flat-band superconductors at fixed Chern number $C$, filling, and pairing amplitude. For uniform pairing and a nondegenerate paired state, the exact $T=0$ stiffness determinant is the topological floor times $1+(\\Torb/2\\pi|C|)^2\\le1+(\\TLVP/2\\pi|C|)^2$, where $\\Torb$ and $\\TLVP$ measure departures from vortexability. Enhancement costs vortexability, and the inequality is strict only if internal components share a site, as in heterostrained bilayers.", "url": "https://arxiv.org/abs/2610.24877", "type": "理论", "summary": "1. 该工作研究由轨道对角格点吸引配对的时间反演陈带对，证明在固定陈数 C、填充和配对振幅下它们是最软的平带超导体，并给出 T=0 超流刚度行列式的精确形式。\n2. 其卖点是将刚度写成拓扑下限乘以 1+(T_orb/2π|C|)^2，用 T_orb 与 T_LVP 量化偏离涡旋可容纳性的程度，表明刚度增强必以牺牲涡旋可容纳性为代价，不等式仅在内部分量共位时严格。\n3. 这为分数陈绝缘体与平带超导中拓扑、配对与刚度的权衡提供判据，并提示异应变双层等共位结构可实现严格刚度增强。", "summary_source": "deepseek", "authors": [{"name": "Zhi-Wei Wang"}, {"name": "Samuel L. Braunstein"}], "featured_authors": [{"name": "Zhi-Wei Wang"}, {"name": "Samuel L. Braunstein"}], "author_count": 2}, {"id": "2610.24923", "category": "cond-mat", "title": "Frustration and topology in the phase behavior of solute-frustrated $q$-clock models", "abstract": "Frustration can enhance fluctuations and create new and interesting phase behavior. When combined with the ability to host topological defects, frustration can increase the complexity of a system's phase diagram through topological and frustrated topological transitions. To understand the interplay of frustration and topology on phase behavior, we introduce and study solute-frustrated $q$-clock (SF$q$C) models, in which solute sites are added to the $q$-clock model, a lattice model where each spin can take one of $q$ orientations. The $q$-clock model can exhibit spontaneous symmetry breaking and topological transitions, and the interaction between the spins and a solute frustrates the system, in essence by creating a fixed lower bound on the concentration of positive topological defects or vortices. We perform Monte Carlo simulations and develop theoretical descriptions of SF$q$C models with $q=4$ and $q=6$ to understand their phase behavior. We find that these systems exhibit rich phase diagrams that depend on the choice of parameters. In particular, SF$q$C models have a wide range of interesting low-temperature phases, including the presence of strongly frustrated domains and the absence of long-range order. We also find topological effects even at low temperatures; for instance, we find that topological defects can drive crystallization. We anticipate these results to guide the development of materials that take advantage of frustration and topology to tune phase behavior and fluctuations.", "url": "https://arxiv.org/abs/2610.24923", "type": "理论+数值", "summary": "1. 该工作提出并研究了溶质阻挫q态时钟模型（SFqC），在q态时钟晶格中引入溶质格点并与自旋耦合，结合蒙特卡洛模拟与理论分析考察q=4和q=6的相行为。\n2. 其核心机制是溶质-自旋相互作用为正向拓扑缺陷或涡旋浓度设定固定下界，使阻挫与拓扑自由度耦合，产生依赖参数的丰富相图、低温强阻挫畴及无长程有序相等多种低温相。\n3. 结果进一步表明拓扑缺陷在低温下可驱动结晶，这为利用阻挫与拓扑协同调控材料相行为和涨落提供了可检验的设计思路。", "summary_source": "deepseek", "authors": [{"name": "Hari Rajesh"}, {"name": "Richard C. Remsing"}], "featured_authors": [{"name": "Hari Rajesh"}, {"name": "Richard C. Remsing"}], "author_count": 2}, {"id": "2610.24942", "category": "cond-mat", "title": "Synchronous and asynchronous Monte Carlo dynamics of mean-field spin glasses with rotationally invariant couplings: what they share and where they differ", "abstract": "We compare two Markov chain Monte Carlo dynamics for Ising spin glasses with rotationally invariant couplings: the synchronous Monte Carlo method (SyncMC), which updates all spins in parallel with the help of Gaussian auxiliary fields, and asynchronous Metropolis-Hastings dynamics, which updates one spin at a time. Using the Guionnet-Maïda formula, we derive the dynamical mean-field theory of both dynamics in terms of the R-transform of the coupling spectrum. The two effective single-spin processes share a retarded self-interaction and a Gaussian noise; SyncMC has, in addition, an instantaneous self-coupling and a noise that depends only on the response function. These additional terms act only on the fastest time scale, so that the equations for slow time scales, including the fluctuation-dissipation ratio and, for the Sherrington-Kirkpatrick model, the Parisi equation, are the same for the two dynamics. Simulations of the random orthogonal and Sherrington-Kirkpatrick models confirm that both dynamics approach the same fluctuation-dissipation relations, differing only in how many updates they need to do so.", "url": "https://arxiv.org/abs/2610.24942", "type": "理论+数值", "summary": "1. 该文比较了旋转不变耦合Ising自旋玻璃的同步与异步Monte Carlo动力学，并利用Guionnet-Maïda公式推导出以耦合谱R变换表述的动态平均场理论。\n2. 其卖点在于阐明同步更新相较逐点Metropolis-Hastings更新多出瞬时自耦合和仅依赖响应函数的噪声项，但这些项只影响最快时间尺度，故慢时间尺度方程、涨落耗散比及Sherrington-Kirkpatrick模型的Parisi方程在两种动力学中相同。\n3. 随机正交与Sherrington-Kirkpatrick模型的模拟验证二者趋于相同涨落耗散关系、仅所需更新次数不同，这提示同步算法可用于慢动力学研究但须区分最快尺度的额外项。", "summary_source": "deepseek", "authors": [{"name": "Yoshiyuki Kabashima"}], "featured_authors": [{"name": "Yoshiyuki Kabashima"}], "author_count": 1}, {"id": "2610.24948", "category": "cond-mat", "title": "Three-body corrections to Brownian hard-sphere viscosity", "abstract": "For Brownian hard spheres without hydrodynamic interactions, we obtain a conditional enclosure between 1.8266948 and 1.8267157 for the third-order zero-shear Brownian viscosity coefficient. It applies when the physical three-body correction coincides with the finite-energy weak solution and the remote remainder in the pair adjoint identity vanishes. Kirkwood superposition gives zero because three nonzero pair contributions cancel exactly. An elementary radial identity exposes this cancellation, and a common contact-stress convention allows direct comparison of closure predictions. Although superposition solves the bulk equation, it leaves a shared-contact flux error. Correcting this error defines a unique weak response with positive Dirichlet energy. Explicit symmetric trials yield a variational lower bound and a residual upper bound using the rotational structure of shear and three-sphere geometry. Exact integration and outward interval evaluation enclose the fixed-trial functionals. Under the stated physical conditions, the resulting interval excludes all closure coefficients compared here and supplies a quantitative benchmark for dilute three-body Brownian stress.", "url": "https://arxiv.org/abs/2610.24948", "type": "理论+数值", "summary": "1. 该工作在无流体力学相互作用的布朗硬球体系中，对三阶零剪切布朗黏度系数给出了条件性区间 [1.8266948, 1.8267157] 的严格包围。\n2. 其关键在于指出Kirkwood叠加虽满足体方程却遗留共享接触通量误差，并通过修正该误差构造正Dirichlet能量的唯一弱响应，结合剪切旋转结构与三球几何的显式对称试探函数给出变分下界和残差上界，经精确积分与外向区间评估完成包围。\n3. 在所述物理条件下，该区间排除了所比较的全部闭合系数，并为稀薄三体布朗应力提供定量基准。", "summary_source": "deepseek", "authors": [{"name": "Julian Olszewski"}, {"name": "Zijian Liu"}, {"name": "Jie Xu"}], "featured_authors": [{"name": "Julian Olszewski"}, {"name": "Zijian Liu"}, {"name": "Jie Xu"}], "author_count": 3}, {"id": "2610.24959", "category": "cond-mat", "title": "Active rheology shapes collective flows in uniaxially compressed 3D spheroids", "abstract": "How compression changes both the magnitude and organization of cell motion remains unclear. Using a three-dimensional active vertex model, we examine how tissue state and active dynamics shape the response of confined spheroids to uniaxial compression. With polarity alignment switched off, compression enhances transverse motion in solid-like spheroids throughout the tested activity range, whereas the fluid-like response reverses from acceleration at low activity to slowing at high activity. Changes in contact persistence organize these responses along a common empirical trend. Passive five-cell calculations reveal how compression reshapes local rearrangement barriers: the response depends on geometry and loading direction, and a high-strain increase in the fluid-like mean coexists with many low-barrier paths. In a separate high-alignment regime, strong compression induces coherent rotation in solid-like spheroids, while fluid-like spheroids show no comparable collective rotation. The rotating solids have a higher contact-persistence index than the fluids and exhibit tangential peripheral cell organization. Controlled perturbations reveal compression-induced softening of a differential-twist mode and slower relaxation with activity. Together, these results identify an activity-dependent reversal of the motility response and compression-induced coherent rotation as two distinct outcomes of loading, linking them to contact persistence, local rearrangement costs, and active coordination.", "url": "https://arxiv.org/abs/2610.24959", "type": "理论+数值", "summary": "1. 该工作采用三维活性顶点模型，考察受限球状体在单轴压缩下组织状态与活性动力学如何共同塑造细胞运动的大小与组织方式。\n2. 主要发现是无极性排列时压缩增强固体样球状体的横向运动，而流体样响应随活性由加速转为减速，二者可由接触持续性统一；高排列下强压缩仅在固体样球状体中诱发相干旋转，并伴随更高接触持续性和周向组织，扰动分析还显示微分扭转模软化和活性相关慢弛豫。\n3. 这揭示活性依赖的运动响应反转与压缩诱导相干旋转是两种不同加载结局，并提示接触持续性、局部重排代价与主动协调是联系组织流变和集体运动的关键量。", "summary_source": "deepseek", "authors": [{"name": "Liyang Wang"}, {"name": "Shabeeb Ameen"}, {"name": "J. M. Schwarz"}, {"name": "Tao Zhang"}], "featured_authors": [{"name": "Liyang Wang"}, {"name": "Shabeeb Ameen"}, {"name": "J. M. Schwarz"}, {"name": "Tao Zhang"}], "author_count": 4}, {"id": "2610.24961", "category": "cond-mat", "title": "Run-and-tumble particles in a harmonic external field: constructing the solution of the Fokker-Planck equation from the equations of motion", "abstract": "A method for integrating the Langevin equations of motion for run-and-tumble particles is introduced to compute the joint distribution of their position and active velocity, with and without a harmonic external force field. The key step is the construction of the moments of the distribution and the correlation functions, conditional on the particles being in a specific state at the final time. For one-dimensional run-and-tumble particles in a harmonic external potential, the exact steady-state distributions for the tumble state, as well as for the run state conditional on a specified velocity direction, are obtained. This enables us to demonstrate their equivalence to the exact solutions of the corresponding Fokker-Planck equations.", "url": "https://arxiv.org/abs/2610.24961", "type": "理论", "summary": "1. 该工作提出一种直接积分跑动-翻转粒子朗之万运动方程的方法，用于在有或无谐振外场时计算位置与活性速度的联合分布。\n2. 其关键在于构建以末时刻粒子所处状态为条件的分布矩与关联函数，并在一维谐振势中给出翻转态及指定速度方向下跑动态的精确稳态分布，证明其与相应 Fokker-Planck 方程的精确解等价。\n3. 这表明从随机轨迹层面构造条件矩可成为求解活性粒子非平衡稳态分布的系统途径，并为更一般外场与高维情形提供可拓展的出发点。", "summary_source": "deepseek", "authors": [{"name": "Aoran Sun"}, {"name": "Fangfu Ye"}, {"name": "Jeff Z. Y. Chen"}], "featured_authors": [{"name": "Aoran Sun"}, {"name": "Fangfu Ye"}, {"name": "Jeff Z. Y. Chen"}], "author_count": 3}, {"id": "2610.24967", "category": "cond-mat", "title": "Topological Splitting of Sondheimer Oscillations in Thin-Film Weyl Semimetals", "abstract": "We discuss topological effects on Sondheimer oscillations in the magnetoresistance of thin-film Weyl semimetals. The Sondheimer oscillations are periodic in magnetic field and originate from the commensurability between the film thickness and the cyclotron-orbit pitch. Using Boltzmann transport theory, we investigate the effects of Berry curvature and orbital magnetic moment on the oscillations. We find that the Sondheimer oscillations split into two branches with different frequencies and that each branch becomes chirped because its frequency depends on magnetic field. These features originate from the orbital-Zeeman-induced deformation of the Fermi surface. The same mechanism also applies to Dirac semimetals.", "url": "https://arxiv.org/abs/2610.24967", "type": "理论", "summary": "1. 该文用玻尔兹曼输运理论研究薄膜外尔半金属磁阻中的Sondheimer振荡，并考察贝里曲率与轨道磁矩对厚度—回旋轨道螺距匹配所生周期振荡的拓扑修正。\n2. 其核心卖点是发现振荡分裂为频率不同的两支，且每支因频率随磁场变化而呈啁啾，并指出这源于轨道-塞曼效应引起的费米面形变。\n3. 同一机制可推广至狄拉克半金属，为在薄膜磁阻中借助Sondheimer振荡甄别拓扑能带与轨道磁矩效应提供了明确启示。", "summary_source": "deepseek", "authors": [{"name": "Toshihito Osada"}], "featured_authors": [{"name": "Toshihito Osada"}], "author_count": 1}, {"id": "2610.24988", "category": "cond-mat", "title": "Strong Thermal Conductivity Suppression in Isotope Purified Single Crystal Diamond with Phonon Scatterings of Color Centers", "abstract": "The thermal conductivity of natural diamond can be further improved by ~50% by eliminating isotope impurity to obtain pure 12C diamond. However, unlike isolated point defects, how color centers scatter phonons and correspondingly limit the thermal conductivity remain poorly understood. Here, we report the thermal conductivities of two isotope-purified diamond with different Nitrogen-vacancy (NV) color center concentrations, confirmed by photoluminescence (PL) and secondary-ion mass spectrometry (SIMS). Results show ~ 3200 W m-1 K-1 and ~ 2100 W m-1 K-1 for two samples of low and high NV concentrations, respectively. Modified Callaway model analyses show that first-principles-derived scattering parameters can reproduce room-temperature thermal conductivity of the high NV concentration sample under a vacancy concentration assumption (~30% of the total Nitrogen concentration), but fail to reproduce its temperature dependence. Compared to PL and SIMS results, which show ~7.1-fold NV concentration and ~92-fold difference in total Nitrogen concentration between two samples, suggesting the assumed 30% vacancy fraction may be greatly overestimated. Taken together, these results suggest that NV-color-center defects may scatter phonons more strongly than models treating Nitrogen and vacancy as independent point defects, providing new insights into color-center-induced phonon-scattering mechanisms.", "url": "https://arxiv.org/abs/2610.24988", "type": "理论", "summary": "1. 该工作测量了两种经同位素纯化、NV色心浓度不同的单晶金刚石热导率，并用光致发光与SIMS确认缺陷浓度。\n2. 在室温热导率分别约3200与2100 W m−1 K−1的基础上，修正Callaway模型表明第一性原理散射参数仅在假定约30%总氮为空位时复现高NV样品室温值却无法复现温变，而浓度表征暗示该空位比例被明显高估。\n3. 这提示NV色心可能以强于“氮与空位独立点缺陷”近似的方式散射声子，为色心主导的声子散射机制及同位素纯化金刚石热管理提供了约束与启发。", "summary_source": "deepseek", "authors": [{"name": "Jinwen Liu"}, {"name": "Junliang Fan"}, {"name": "Zimu Jiang"}, {"name": "Zifeng Huang"}, {"name": "Zhe Cheng"}], "featured_authors": [{"name": "Jinwen Liu"}, {"name": "Junliang Fan"}, {"name": "Zimu Jiang"}, {"name": "Zifeng Huang"}, {"name": "Zhe Cheng"}], "author_count": 5}, {"id": "2610.24994", "category": "cond-mat", "title": "Random spin-3/2 antiferromagnetic Heisenberg chains revisited", "abstract": "We revisit the spin-reduction transition in the random spin-$3/2$ antiferromagnetic Heisenberg chain using the tensor-network strong-disorder renormalization group (tSDRG). The predicted transition separates two random-singlet (RS) phases: one formed by effective spin-$1/2$ moments at weaker disorder and the other by full spin-$3/2$ moments at stronger disorder. Within the Damle--Huse classification, this transition corresponds to an emergent permutation-symmetric $\\mathcal{P}_4$ multicritical point on a $\\mathcal{P}_2$ critical line associated with the RS phases. We first derive the critical exponents governing the disorder-averaged bulk and end-to-end correlation functions in the $\\mathcal{P}_n$ universality classes within the Damle--Huse framework. Using these theoretical predictions, together with a diagnostic constructed from the mean and variance of the energy-gap distribution, we identify the $\\mathcal{P}_4$ transition point and the reentrant behavior of the RS phase.", "url": "https://arxiv.org/abs/2610.24994", "type": "理论+数值", "summary": "1. 该工作利用张量网络强无序重整化群重新审视随机自旋-3/2反铁磁海森堡链中的自旋约化转变。\n2. 其核心在于先在Damle–Huse框架下导出P_n普适类中无序平均体关联与端到端关联的临界指数，并结合能隙分布的均值与方差诊断确定P_4多临界点及RS相的重入行为。\n3. 这为区分由有效自旋-1/2与完整自旋-3/2矩构成的两类随机单态相、检验其普适类及后续数值研究提供了可操作判据。", "summary_source": "deepseek", "authors": [{"name": "Yen-Tung Lin"}, {"name": "Pochung Chen"}, {"name": "Yu-Cheng Lin"}], "featured_authors": [{"name": "Yen-Tung Lin"}, {"name": "Pochung Chen"}, {"name": "Yu-Cheng Lin"}], "author_count": 3}, {"id": "2610.25029", "category": "cond-mat", "title": "Extrinsic Bulk Photovoltaic Effect from Asymmetric Defect Scattering", "abstract": "The extrinsic bulk photovoltaic effect from asymmetric electron-defect scattering can make an important contribution to the total photocurrent and is highly diagnostic of defect type. We present an ab initio Boltzmann framework combining optical excitation with electron-phonon and symmetric and skew electron-defect scattering, and we apply it to monolayer GeS. Because the defects that generate the current also relax the anisotropy that sustains it, the response peaks at a finite defect fraction. Within the scattering-limited model, cooling to $0$~K shifts the peak position toward lower defect fractions and yields a maximum enhancement of more than six orders of magnitude at fixed defect fraction. At selected low-temperature defect fractions, the total extrinsic current can exceed the intrinsic shift current by more than an order of magnitude, so that the defect fraction itself becomes a tunable parameter.", "url": "https://arxiv.org/abs/2610.25029", "type": "理论+数值", "summary": "1. 该工作建立从头算玻尔兹曼框架，将光学激发与电子-声子及对称、斜电子-缺陷散射结合，并应用于单层GeS以研究非对称缺陷散射的外禀体光伏效应。\n2. 其关键在于产生电流的缺陷同时削弱维持电流各向异性的因素，使响应在有限缺陷分数处出现峰值；降温至0 K会将峰值移向更低缺陷分数，并在固定缺陷分数下带来逾六个数量级的最大增强。\n3. 在选定低温缺陷分数下，外禀电流可比本征位移电流高一个数量级以上，表明缺陷分数本身可作为可调参数，并为缺陷工程和低温光伏调控提供依据。", "summary_source": "deepseek", "authors": [{"name": "Zixun Wang"}, {"name": "Andrew M. Rappe"}], "featured_authors": [{"name": "Zixun Wang"}, {"name": "Andrew M. Rappe"}], "author_count": 2}, {"id": "2610.25072", "category": "cond-mat", "title": "Large Deviations in Switching Diffusion: Dynamical Condensation and Diffusivity BBP Transition", "abstract": "We consider a Brownian particle with position $x(t)$ whose diffusivity changes at Poissonian switching times, with each new value drawn independently from a bounded distribution $W(D)$. Assuming $W(D)\\sim C(D_{\\max}-D)^\\nu$ near its upper edge, we study the large-deviation regime $x(t)\\simeq yt$ with $y = O(1)$ at large times, far beyond the typical diffusive scale. In a recent work Guéneau et al., Phys. Rev. Lett. 135, 067102 (2025), the rate function of the displacement was obtained through a renewal approach and it was shown to display several singularities. In this paper, we carry out a detailed study of the corresponding dynamical phase transitions and trajectory condensation. For moderate $y$, the imposed displacement is shared among $O(t)$ displacement increments accumulated during successive intervals between switches. Beyond a first threshold $y_-$, one interval produces an increment of order $t$ carrying a finite fraction of the total displacement, signaling dynamical condensation. For $\\nu>1$, a second threshold $y_+>y_-$ is reached when this macroscopic increment carries asymptotically the entire imposed displacement, whereas for $0<\\nu\\leq1$ the two thresholds merge, $y_-=y_+$. In turn, the moment-generating function of $x(t)$ displays a complementary transition from collective contributions of many diffusivities to selection of states near $D_{\\max}$. We show that this transition is governed by the same edge mechanism as the Baik-Ben Arous-Péché (BBP) transition, indicating that diffusivity selection and trajectory condensation are two manifestations of the same phenomenon. We validate our predictions for the dynamical condensation against numerical results from rare event sampling.", "url": "https://arxiv.org/abs/2610.25072", "type": "理论+数值", "summary": "1. 该文系统研究了泊松切换扩散率、且新扩散率独立取自有界分布 W(D) 的布朗粒子在大偏差尺度 x(t)≃yt 下的动力学相变与轨迹凝聚。\n2. 其核心是刻画阈值 y_- 与 y_+：ν>1 时二者分离，单个区间的宏观增量可承载全部位移，0<ν≤1 时二者合并，并指出矩生成函数的转变与 BBP 边缘机制同源，从而把扩散率选择与轨迹凝聚统一起来。\n3. 作者用稀有事件采样验证了凝聚预测，为理解异质扩散中的大偏差奇异性和凝聚现象提供了可检验的统一框架。", "summary_source": "deepseek", "authors": [{"name": "Mathis Guéneau"}, {"name": "Timo Schorlepp"}, {"name": "Satya N. Majumdar"}, {"name": "Gregory Schehr"}], "featured_authors": [{"name": "Mathis Guéneau"}, {"name": "Timo Schorlepp"}, {"name": "Satya N. Majumdar"}, {"name": "Gregory Schehr"}], "author_count": 4}, {"id": "2610.25082", "category": "cond-mat", "title": "Dzyaloshinskii-Moriya interactions in the SU(2) gauge theory of the Shastry-Sutherland Dirac spin liquids", "abstract": "We classify the fermion bilinears of the SU(2) gauge theory of the Shastry-Sutherland Dirac spin liquids under the spin-orbit-locked space group and treat the Dzyaloshinskii-Moriya (DM) interactions of SrCu$_2$(BO$_3$)$_2$ at leading order in $1/N$ and at one loop. At linear order DM can neither gap the spinons nor destabilize the SO(5) point above a scale $T^*$. Symmetry forbids every local gauge-singlet fermion mass at any order. Among the singlet bilinears, the in-plane couplings induce only a conserved spin current of dimension exactly 2, which sets $T^*=4\\lambda\\simeq0.03$-$0.17$ K, and the out-of-plane coupling only a flavored spin-2 current, irrelevant at a unitary critical point. DM-induced Yukawa couplings start below $2\\%$ of the one that bounds the pseudocritical window. In zero field, measured samples order above $1$ K, at or above $T^*$. Below $T^*$, in a two-dimensional sample at the critical pressure, the Dirac cones reconstruct into a chirally protected $d$-wave quadratic band touching whose only gauge-singlet gap channels are the two valence-bond components and the scalar chirality. A one-loop flow, with the gauge field screened by the band touching, ends at $T^{**}\\sim(0.03$-$0.1)\\lambda$ on a ray containing valence-bond order for the material's exchange and for most random couplings, and otherwise on a gapped chiral $\\mathbb{Z}_2$ spin liquid. The DM bias between the two plaquette patterns is at most of order $10^{-4}$, with a direction not fixed at $O(1/N)$, whereas non-magnetic quenched disorder couples a relevant random field to the plaquette doublet and none to the chirality. A field along $[100]$ induces a $(\\pi,\\pi)$ Néel moment linear in the field; a field along $[001]$ does not. This selection rule also holds in the dimer phase and is testable by $^{11}$B NMR under pressure.", "url": "https://arxiv.org/abs/2610.25082", "type": "理论", "summary": "1. 该工作在自旋轨道锁定空间群下分类Shastry-Sutherland Dirac自旋液体SU(2)规范理论的费米子双线性，并在领头1/N与单圈阶处理SrCu2(BO3)2的DM相互作用。\n2. 其卖点是证明线性DM既不能打开自旋子能隙也不能在T*以上破坏SO(5)点，对称性禁止任意阶局域规范单态质量，而面内耦合只产生维数恰为2的守恒自旋流并给出T*=4λ≈0.03–0.17 K。\n3. 这启示T*以下二维临界压力样品中Dirac锥会重构为手征保护的d波二次能带接触，单圈流导向价键序或手征Z2自旋液体，且[100]与[001]场的奈尔矩选择规则可由压力下11B NMR检验。", "summary_source": "deepseek", "authors": [{"name": "Yasir Iqbal"}], "featured_authors": [{"name": "Yasir Iqbal"}], "author_count": 1}, {"id": "2610.25109", "category": "cond-mat", "title": "Annealing Dynamics of the Two-Dimensional Fully Frustrated Ising Model", "abstract": "We study the dynamical scaling properties of the two-dimensional fully frustrated Ising model by simulated annealing. The model has a highly degenerate, critical ground state with well known equilibrium properties. To study its out-of-equilibrium behavior, we develop an annealing protocol that is convenient for extending the Kibble-Zurek mechanism to the case of an exponentially divergent correlation length in the limit of the temperature $T \\to T_c = 0$. We find excellent agreement with the scaling forms derived, including a dependence on the initial temperature that is not present in the conventional Kibble-Zurek mechanism. The dynamic exponent $z$ is consistent among all quantities studied; fits of its dependence on the initial temperature give $z = 1.99(2)$ (susceptibility), $z = 2.072(8)$ (excess energy), and $z = 2.09(3)$ (Edwards-Anderson order parameter). These values are close to $z=2$, which is consistent with previous studies of relaxation after instantaneous quenches and of time dependent correlations in equilibrium, including the estimate $z = 2.004(9)$ from equilibrium autocorrelation functions.", "url": "https://arxiv.org/abs/2610.25109", "type": "理论", "summary": "1. 该工作用模拟退火研究二维完全阻挫Ising模型的动力学标度，并设计退火协议把Kibble-Zurek机制推广到T_c=0、关联长度指数发散的情形。\n2. 其关键在于所导出的标度形式能刻画传统KZ机制中没有的初始温度依赖，并给出彼此一致且接近2的动力学指数z：磁化率1.99(2)、过剩能量2.072(8)、Edwards-Anderson序参量2.09(3)。\n3. 这些结果将零温临界退火动力学与瞬时淬火后的弛豫及平衡自相关估计联系起来，为检验阻挫体系中的KZ标度和z≈2提供可扩展基准。", "summary_source": "deepseek", "authors": [{"name": "Kai-Hsin Wu"}, {"name": "Anders W. Sandvik"}, {"name": "Ying-Jer Kao"}], "featured_authors": [{"name": "Kai-Hsin Wu"}, {"name": "Anders W. Sandvik"}, {"name": "Ying-Jer Kao"}], "author_count": 3}, {"id": "2610.25153", "category": "cond-mat", "title": "Higher-order disorder correlations control reflected phonon counting statistics", "abstract": "We investigate how structural correlations beyond the power spectrum affect phonon counting in a one-dimensional acoustic stack. An integer-thickness construction cancels the extensive leading backscattering term and leaves a finite-chain reflection amplitude determined by endpoint innovations. For symmetric independent innovations with unit variance and fourth moment $\\mu_4$, the normalized reflected-power second moment tends to $(\\mu_4+5)/4$. With vacuum environmental inputs, a two-phonon Fock input therefore gives an ensemble-averaged reflected factorial correlation $g^{(2)}=(\\mu_4+5)/8$. Two explicitly constructed ensembles with identical mean and complete two-point correlation function yield $g^{(2)}=3/4$ and $9/8$, placing their counting variances on opposite sides of the Poisson value. Conditional tensor averaging also gives a general fourth-order resistance-growth coefficient for arbitrary impedance contrast, including a positive higher-scattering contribution not recovered by shifting the lowest-order spectrum. Exact enumeration confirms the fixed-$N$, small-detuning limit and shows that increasing $N$ at fixed detuning produces a crossover governed by accumulated higher-order bulk scattering rather than convergence to the endpoint formula. Further calculations test bandwidth, thickness error, propagation loss and thermal background. The result concerns disorder-averaged pulse statistics; it neither creates nonclassicality from coherent input nor changes the conditional factorial correlation of an individually resolved passive sample.", "url": "https://arxiv.org/abs/2610.25153", "type": "理论+数值", "summary": "1. 该工作研究一维声学堆叠中超越功率谱的高阶无序关联如何控制反射声子计数，并用整数厚度构造消去主导背散射、将有限链反射振幅归因于端点创新。\n2. 关键卖点在于：对单位方差、四阶矩μ4的对称独立端点创新，归一化反射功率二阶矩趋于(μ4+5)/4，双声子Fock输入下系综平均g^(2)=(μ4+5)/8；相同均值和两点关联的两系综给出3/4与9/8，计数方差分居泊松值两侧。\n3. 这提示计数统计受四阶及更高阶结构关联与任意阻抗对比下的高阶散射增长控制，固定失谐增大N时由累积体散射而非端点公式主导，且系综平均脉冲统计不同于单样本条件统计，不能据此由相干输入产生非经典性。", "summary_source": "deepseek", "authors": [{"name": "Ara Sedrakyan"}], "featured_authors": [{"name": "Ara Sedrakyan"}], "author_count": 1}, {"id": "2610.25190", "category": "cond-mat", "title": "Unconventional spin momentum locking and topological domains in twisted slabs of topological insulator Bi$_2$Te$_3$", "abstract": "The three-dimensional topological insulator Bi$_2$Te$_3$ hosts topological Dirac states on its two-dimensional surfaces. These Dirac states show spin-momentum locking, which usually implies a tangential Rashba-like spin texture. One can alter the properties of the Dirac states by dividing a slab of such a material into two thinner halves, modifying the interface by twisting, shifting, and changing the interlayer distance. Using first-principles calculations, we investigate such modified slabs of Bi$_2$Te$_3$. The twisting degree of freedom deserves special attention. To this end, we follow two approaches. On the one hand, we probe different stacking configurations in order to extract parameters relevant for small twist angle Moiré structures. We find non-trivial topology only for some stackings, leading to topological domains on the Moiré scale. On the other hand, we calculate the properties of commensurate twisted supercells. The latter reveals not only flat bands, which are tunable by external pressure, but also radial spin textures with unconventional spin-momentum locking.", "url": "https://arxiv.org/abs/2610.25190", "type": "理论+数值", "summary": "1. 该工作采用第一性原理计算，研究Bi2Te3拓扑绝缘体薄片经分层、扭转、平移及层间距调节后的电子结构，并从不同堆垛构型与公度扭转超胞两条路径刻画其演化。\n2. 其核心在于：小扭转角莫尔体系中仅特定堆垛呈现非平庸拓扑，从而形成莫尔尺度的拓扑畴；公度扭转超胞则给出可由外压调控的平带和径向自旋织构所导致的非常规自旋-动量锁定。\n3. 这为在扭角拓扑绝缘体中设计拓扑畴、压力调控平带以及探索径向自旋织构提供了第一性原理依据和可检验的候选体系。", "summary_source": "deepseek", "authors": [{"name": "Thomas Naimer"}, {"name": "Jaroslav Fabian"}], "featured_authors": [{"name": "Thomas Naimer"}, {"name": "Jaroslav Fabian"}], "author_count": 2}, {"id": "2610.25222", "category": "cond-mat", "title": "Self-Trapping and Liouvillian Spectral Transitions in a Dissipative Bose-Hubbard Dimer", "abstract": "We study the self-trapping transition in dissipative double wells using mean-field theory and exact diagonalization. We find that, similar to the conventional interaction-driven transition from oscillatory dynamics to self-trapping, dissipation alone can also induce self-trapping-like localization in one well. The resulting state, although transient and decaying, persists for a substantial time. At the mean-field level, the interaction- and dissipation-driven transitions are discontinuous and continuous, respectively. When interaction and dissipation both are present, their interplay produces three dynamical regimes: (i) at weak interaction, increasing dissipation drives a transition from oscillations to self-trapping; (ii) at moderate interaction, self-trapping at weak dissipation, oscillatory dynamics at intermediate dissipation, and re-entrant self-trapping at strong dissipation; and (iii) at strong interaction, self-trapping persists but is weakened by dissipation. We connect the transition with the Liouvillian spectrum. It is observed that purely dissipation-driven transition coincides with an exceptional point in the spectra, and a peak in the Liouvillian gap, marking the onset of the quantum-Zeno regime. In the presence of interactions, however, the onset of the Zeno regime is shifted to dissipation strengths larger than that required for the self-trapping transition.", "url": "https://arxiv.org/abs/2610.25222", "type": "理论+数值", "summary": "1. 该文结合平均场与严格对角化研究耗散双阱Bose-Hubbard二聚体中的自捕获转变，并给出相互作用与耗散共同作用下的三类动力学区制。\n2. 其核心在于发现纯耗散亦可诱导持续时间可观的瞬态局域化，且该转变对应Liouvillian谱中的异常点与谱隙峰值，标志量子Zeno区间的开启；相互作用存在时Zeno起点被推至更强耗散。\n3. 这些结果将开放量子体系的自捕获动力学与Liouvillian谱结构直接联系，为在耗散冷原子平台区分相互作用驱动与耗散驱动的局域化提供可检验判据。", "summary_source": "deepseek", "authors": [{"name": "Subhendu Saha"}, {"name": "Raka Dasgupta"}], "featured_authors": [{"name": "Subhendu Saha"}, {"name": "Raka Dasgupta"}], "author_count": 2}, {"id": "2610.25236", "category": "cond-mat", "title": "Long-lived nonequilibrium spin configuration induced by dual optical excitation", "abstract": "The ability to create and control nonequilibrium spin states is central to understanding ultrafast magnetism and to developing optical
