  <style>
    :root {
      --bg: #f6f1e8;
      --panel: rgba(255, 252, 246, 0.92);
      --text: #2d241d;
      --muted: #6d5d50;
      --line: rgba(69, 49, 32, 0.14);
      --accent: #8f3d2e;
      --accent-2: #1d5f6b;
      --theory: #7c3a2a;
      --numeric: #255b6a;
      --both: #5d4a99;

      --shadow: 0 18px 40px rgba(54, 32, 16, 0.12);

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--ui-font);

      min-height: 100vh;
    }
    .shell { width: min(1220px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 64px; }
    .hero {
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(255,255,255,0.84), rgba(255,248,238,0.72)), linear-gradient(135deg, rgba(143,61,46,0.08), rgba(29,95,107,0.08));
      box-shadow: var(--shadow);
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.82); border: 1px solid var(--line); color: var(--muted); font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase;
    }
    h1 { margin: 18px 0 10px; font-family: var(--title-font); font-size: clamp(32px, 5vw, 54px); line-height: 1.04; letter-spacing: -0.03em; }

    .stat { padding: 16px 18px; background: rgba(255,255,255,0.76); border: 1px solid var(--line); border-radius: 18px; }

    .stat .value { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
    .controls { position: sticky; top: 12px; z-index: 3; margin-top: 22px; padding: 18px; border: 1px solid var(--line); border-radius: 24px; background: rgba(250,244,236,0.9); backdrop-filter: blur(16px); box-shadow: 0 10px 24px rgba(54,32,16,0.08); }
    .control-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 16px; }
    .field { display: flex; flex-direction: column; gap: 10px; }

    .search { width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line); background: rgba(255,255,255,0.92); font: inherit; color: var(--text); }
    .chip-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .chip { border: 1px solid var(--line); background: rgba(255,255,255,0.82); color: var(--text); padding: 10px 14px; border-radius: 999px; font: inherit; cursor: pointer; }

    .chip[data-type="理论+数值"].active { border-color: rgba(93,74,153,0.35); background: rgba(93,74,153,0.12); color: #46337d; }
    .chip[data-type="实验"].active { border-color: rgba(47,107,57,0.35); background: rgba(47,107,57,0.12); color: #214c29; }

    .paper h2 a:hover { color: var(--accent); }
    .paper .id { color: var(--muted); font-size: 13px; }
    .author-block { display: grid; gap: 10px; padding: 14px 16px; border-radius: 18px; background: rgba(255,255,255,0.64); border: 1px solid var(--line); }
    .author-label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .author-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .author-item { display: grid; gap: 4px; }
    .author-item strong { font-size: 14px; }
    .author-item span { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .author-note { color: var(--muted); font-size: 12px; }
    .paper .summary { margin: 0; font-size: 15px; line-height: 1.75; white-space: pre-line; }
    details { border-top: 1px solid var(--line); padding-top: 12px; }
    details summary { cursor: pointer; color: var(--accent-2); font-weight: 700; list-style: none; }
    details summary::-webkit-details-marker { display: none; }
    details p { margin: 10px 0 0; color: var(--muted); line-height: 1.72; font-size: 14px; white-space: pre-line; }
    .paper footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 6px; color: var(--muted); font-size: 13px; }
    .paper footer a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .empty { display: none; margin-top: 24px; padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 22px; background: rgba(255,255,255,0.7); }
    @media (max-width: 980px) { .control-grid { grid-template-columns: 1fr; } .controls { position: static; } }
  </style>

  <script>
    const papers = [{"id": "2607.26151", "category": "cond-mat", "title": "Quantum spin-glass criticality in disordered frustrated dimer magnets", "abstract": "We study quantum phase transitions of Mott insulators between spin-glass and featureless paramagnetic phases. Specifically, we consider a triangular-lattice bilayer Heisenberg model with bond disorder. The clean system has two phases, a dimer quantum paramagnet and a non-collinear antiferromagnet, separated by a quantum critical point. Bond disorder destroys the antiferromagnetic phase via the interference of dipolar textures and results in spin-glass order, such that the system features a quantum phase transition between spin-glass and dimer phases. We study the vicinity of this transition using a variant of bond-operator theory and calculate thermodynamic observables as well as excitation spectra. Bond disorder leads to strong inhomogeneities near the transition which suppresses non-collinearities and leads to anomalously weak glassiness in the near-critical quantum spin glass. We characterize the low-energy excitations which have a strong tendency towards spatial localization, and we track the behavior of the amplitude (i.e. Higgs) mode across the glass phase whose spectral weight we find to be strongly suppressed due to interference effects.", "url": "https://arxiv.org/abs/2607.26151", "type": "理论", "summary": "1. 本文研究三角晶格双层海森堡模型中由键无序诱导的自旋玻璃与二聚体量子顺磁相之间的量子相变。\n2. 利用键算符理论变体揭示近临界区域非共线磁序被偶极纹理干涉抑制，产生异常弱的量子自旋玻璃行为及其低能局域化激发。\n3. 该工作为理解阻挫无序系统中量子自旋玻璃临界性及振幅（Higgs）模的干涉抑制效应提供了微观理论框架。", "summary_source": "deepseek", "authors": [{"name": "Darshan G. Joshi"}, {"name": "Matthias Vojta"}], "featured_authors": [{"name": "Darshan G. Joshi"}, {"name": "Matthias Vojta"}], "author_count": 2}, {"id": "2607.26162", "category": "cond-mat", "title": "Dirac Fermion Scattering and Pseudospin Polarization in Structurally Asymmetric Graphene Wormholes", "abstract": "We study the quantum transport of massless Dirac fermions through two asymptotically flat graphene sheets connected by a structurally asymmetric catenoid wormhole in $(2+1)$-dimensional curved spacetime. Analytic scattering basis functions are derived: Hankel functions of integer order (in the half-flux sector) in the flat sheets and Gauss hypergeometric functions in the curved throat. We construct a transfer matrix via piecewise numerical matching, verifying unitarity up to numerical precision. The transmission probability rises monotonically to unity at high energies. Global transmission exhibits mirror degeneracy under inversion of structural asymmetry, but local observables depend on incidence direction. The manifold's spin connection acts as a Hermitian coupling inducing an $A/B$ sublattice imbalance at the throat. Structural asymmetry induces a local pseudospin imbalance. A larger curvature radius enhances $P_z$ polarization via a larger geometric phase; abrupt incidence suppresses it. Sub-barrier modes exhibit a negative transmission phase time, compatible with Hartman-type wave-packet reshaping.", "url": "https://arxiv.org/abs/2607.26162", "type": "理论+数值", "summary": "1. 该工作通过解析散射基函数与数值传递矩阵，研究了结构不对称悬链线虫洞连接的两片石墨烯中无质量狄拉克费米子的量子输运。\n2. 其核心发现是虫洞喉部的自旋连接作为厄米耦合诱导A/B子晶格失衡与局部赝自旋极化，极化强度受曲率半径和入射方向调制。\n3. 这揭示了弯曲空间几何通过几何相位操控石墨烯赝自旋自由度的机制，并为负透射相位时间在凝聚态模拟中的实现提供了线索。", "summary_source": "deepseek", "authors": [{"name": "Arián Gorza"}, {"name": "Facundo Arreyes"}, {"name": "Juan Sebastián Ardenghi"}], "featured_authors": [{"name": "Arián Gorza"}, {"name": "Facundo Arreyes"}, {"name": "Juan Sebastián Ardenghi"}], "author_count": 3}, {"id": "2607.26263", "category": "cond-mat", "title": "Influence of BaTiO_3 nanoparticles on the anisotropy of the dielectric properties of nematic liquid crystal 5CB", "abstract": "This work is devoted to the mechanisms of dielectric response and electric conductivity of suspensions consisting of the nematic liquid crystal 5CB with different concentrations (from 0 to 10 wt.%) of ferroelectric BaTiO_3 nanoparticles with an average size of 24 nm. We revealed that the incorporation of nanoparticles influences significantly the dielectric permittivity magnitude and anisotropy, as well as dielectric losses of the suspension. A pronounced temperature dependence of the anisotropic dielectric permittivity of the suspensions was found at lower temperatures corresponding to the mesophase state; but it is also present at higher temperatures corresponding to the isophase. The dependence of the mesophase-isophase transition temperature on the concentration of BaTiO_3 nanoparticles appeared nonmonotonic. With increasing temperature, both the capacitance and the electrical resistance of the pure liquid crystal increase, as well as it increases in the suspensions with small concentration of BaTiO_3 nanoparticles. Due to space charge accumulation in the shells of nanoparticles, larger concentrations of BaTiO_3 nanoparticles influence strongly the ionic transport by promoting the formation of ionic-electronic screening. This effect modifies the dielectric properties and conduction mechanisms of the suspension, leading to the nonmonotonic dependence of the mesophase - isophase transition temperature versus the nanoparticle concentration.", "url": "https://arxiv.org/abs/2607.26263", "type": "理论", "summary": "1. 本工作实验研究了不同浓度（0–10 wt.%）的24 nm铁电BaTiO₃纳米颗粒对向列相液晶5CB介电常数各向异性、介电损耗及电导率的影响。\n2. 主要发现在于纳米颗粒壳层空间电荷积累形成离子-电子屏蔽，显著改变离子输运，导致介电各向异性温度依赖性增强及中介-各向同性相转变温度随浓度非单调变化。\n3. 该机制表明通过调控纳米颗粒浓度可有效调节液晶复合体系的介电响应，为设计具有可控各向异性的智能介电材料提供了明确物理途径。", "summary_source": "deepseek", "authors": [{"name": "Juliya M. Gudenko"}, {"name": "Oleksandr S. Pylypchuk"}, {"name": "Victor V. Vainberg"}, {"name": "Denis O. Stetsenko"}, {"name": "Igor A. Gvozdovskyy"}, {"name": "Serhii E. Ivanchenko"}, {"name": "Eugene A. Eliseev"}, {"name": "Vladimir N. Poroshin"}, {"name": "Anna N. Morozovska"}], "featured_authors": [{"name": "Juliya M. Gudenko"}, {"name": "Oleksandr S. Pylypchuk"}, {"name": "Victor V. Vainberg"}, {"name": "Eugene A. Eliseev"}, {"name": "Vladimir N. Poroshin"}, {"name": "Anna N. Morozovska"}], "author_count": 9}, {"id": "2607.26274", "category": "cond-mat", "title": "Dynamic phase-field model for brittle fracture in grounded glaciers", "abstract": "Fracture and calving of glaciers are key contributors to ice-mass loss and sea-level rise, yet predictive modeling remains challenging. Fracture in grounded glaciers is driven by gravitational forces and is typically studied within the framework of quasi-static linear elastic fracture mechanics. In this work, we show that purely quasistatic brittle fracture simulations within the phase field fracture framework under fixed self-weight can become strongly overdriven after crevasse initiation, producing unphysical thickening of the diffusive crack band and diffuse damage patterns. This pathology arises because gravity drives a growing region ahead of the crack tip beyond the strength surface. To resolve this, we show that the post-nucleation propagation is fundamentally a dynamic instability rather than a quasistatic process and propose the use of dynamic formulations of fracture. We demonstrate that accounting for inertia results in sharp, localized cracks that propagate through the ice thickness. As a second objective, this paper introduces a new dynamic formulation of the phase-field fracture model of Kumar et al. (J. Mech. Phys. Solids 2018) in which elastic, inertial, and gravitational contributions are degraded consistently in fractured regions.", "url": "https://arxiv.org/abs/2607.26274", "type": "理论+数值", "summary": "1. 该工作针对接地冰川脆性断裂提出了一个含惯性效应的动态相场模型，克服了准静态框架下重力驱动裂纹过驱动导致的非物理弥散损伤。\n2. 其技术核心在于在断裂区域一致地退化弹性、惯性与重力贡献，揭示了冰川断裂后裂纹扩展本质为动态失稳而非准静态过程。\n3. 这为冰川崩解与冰盖物质损失的精确预测提供了力学基础，并启发将动态断裂力学引入其他重力主导的脆性材料系统。", "summary_source": "deepseek", "authors": [{"name": "Aarosh Dahal"}, {"name": "Umar Khayaz"}, {"name": "Ravindra Duddu"}, {"name": "Aditya Kumar"}], "featured_authors": [{"name": "Aarosh Dahal"}, {"name": "Umar Khayaz"}, {"name": "Ravindra Duddu"}, {"name": "Aditya Kumar"}], "author_count": 4}, {"id": "2607.26282", "category": "cond-mat", "title": "Topological control of local electroneutrality in confined electrolytes", "abstract": "Topology governs finite-size violations of local electroneutrality in confined electrolytes. Within Poisson-Boltzmann theory, we show that this topological control gives rise to a universal hierarchy of deviations in spherical, cylindrical, and planar confinement. We quantify this effect through an electroneutrality deviation ratio that captures the global electrostatic constraints associated with compactness and boundary multiplicity in the three topological classes corresponding to slit, cylindrical, and spherical cavities. Although local electroneutrality is asymptotically restored in the limit of infinite cavity size, finite-size deviations follow a robust topological hierarchy, being strongest in spherical cavities, weaker in cylindrical confinement, and weakest in planar slits. These results prove that topology is the organizing principle underlying confinement-induced charge redistribution and that violations of local electroneutrality constitute a general electrostatic constraint governing overcharging, charge reversal, and long-range charge correlations. More fundamentally, they demonstrate that changing the topology modifies the global electrostatic constraints without altering the local Poisson-Boltzmann equations. As a counterintuitive manifestation of nonlinear confinement in a point-ion model, we report the existence of inside confinement charge reversal (ICCR) in charged hollow cylindrical and spherical nanoparticles. Since physically consistent, more general electrolyte theories must recover the Poisson-Boltzmann description in the appropriate limiting case, the present results establish a benchmark against which topological effects should be assessed beyond the Poisson-Boltzmann description.", "url": "https://arxiv.org/abs/2607.26282", "type": "理论", "summary": "1. 该工作通过泊松-玻尔兹曼理论揭示，拓扑结构控制受限电解质中局部电中性的有限尺寸偏离，并建立球、柱、平面三种构型下的普适层次。\n2. 其核心在于定义电中性偏离比率，量化紧凑性与边界多重性导致的全局静电约束，并首次报道空心球与柱纳米颗粒中的内部受限电荷反转现象。\n3. 这为超越泊松-玻尔兹曼描述时评估拓扑效应确立了基准，表明改变拓扑不改变局部方程却重构全局约束，对过充电、电荷反转及长程关联具有一般性启发。", "summary_source": "deepseek", "authors": [{"name": "Marcelo Lozada-Cassou"}], "featured_authors": [{"name": "Marcelo Lozada-Cassou"}], "author_count": 1}, {"id": "2607.26289", "category": "cond-mat", "title": "Scale-dependent universality class crossover in magnetic skyrmion polymers", "abstract": "Dipolar magnetic skyrmions can assemble into chains with alternating helicity that act as one-dimensional polymers, yet their statistical mechanics violates the universal harmonic scaling observed in actin, DNA, and microtubules. From first principles, we compute the inter-skyrmion pair potential and find a bi-exponential form of competing interactions with two characteristic decay lengths that encode the distinct microscopic mechanisms of repulsion and attraction. Multiscale simulations reveal a power-law temperature dependence with exponent $1$ in the worm-chain limit of a single bond, and exponent $1/2$ in the three-bond limit. We find that the power-law behavior is remarkably independent of magnetic field strength, and the crossover is due to competing radial interactions responsible for the bonds, resulting in a quartic transverse confinement. We show that the precise form of the competing interactions (e.g., Morse or double-Yukawa) does not affect the temperature dependence.", "url": "https://arxiv.org/abs/2607.26289", "type": "数值", "summary": "1. 该工作从第一性原理出发，计算了磁性斯格明子聚合物的键合相互作用，揭示了其统计力学违反通用谐波标度的尺度依赖普适类交叉行为。\n2. 其核心卖点在于发现双指数竞争相互作用导致四次方横向约束，使得幂律温度依赖指数从单键链极限的1交叉至三键极限的1/2，且与磁场强度无关。\n3. 这为理解一维聚合物中竞争相互作用驱动的对称性与标度行为提供了精确机制，并启示了键合相互作用形式（如Morse或双Yukawa）对宏观标度率具有稳健性。", "summary_source": "deepseek", "authors": [{"name": "R. L. Silva"}, {"name": "R. C. Silva"}, {"name": "R. L. Stamps"}], "featured_authors": [{"name": "R. L. Silva"}, {"name": "R. C. Silva"}, {"name": "R. L. Stamps"}], "author_count": 3}, {"id": "2607.26308", "category": "cond-mat", "title": "Hidden symmetry at the diabolical points of a biaxial spin", "abstract": "In a rotated frame the biaxial spin Hamiltonian $k_1S_x^2+k_2S_y^2-\\mathbf{h}\\cdot\\mathbf{S}$ is a finite tight-binding chain whose hopping amplitudes are tuned by the applied field. A chain with no vanishing hopping has a nondegenerate spectrum, so a degeneracy can occur only where the field severs the chain. We show that at every point of the exact diabolical-point lattice found by Kececioglu and Garg the chain is severed twice over, in two different rotated frames and at two bonds that are fixed independently. The two severings are carried by projectors that commute with the Hamiltonian but not with each other. In that form they realize the hidden symmetry anticipated by Garg. A single operator built from them pairs the degenerate levels; its rank gives the multiplicity of every lattice point, replacing an earlier continuity and topological argument. Because the two partners of a doublet occupy disjoint stretches of the chain, an exact and manifestly negative determinant fixes the orientation of every cone. At every degeneracy of the model the lower level therefore carries Chern charge -1 in the convention used here.", "url": "https://arxiv.org/abs/2607.26308", "type": "理论", "summary": "1. 该工作揭示了双轴自旋哈密顿量在魔鬼点处由两个不对易投影算子实现的隐藏对称性。\n2. 其核心在于构造单一算子配对简并能级，以秩确定多重度，并用精确负行列式固定锥取向。\n3. 这为自旋系统简并点拓扑电荷分配的解析描述提供了明确框架。", "summary_source": "deepseek", "authors": [{"name": "Shadan Ghassemi Tabrizi"}], "featured_authors": [{"name": "Shadan Ghassemi Tabrizi"}], "author_count": 1}, {"id": "2607.26406", "category": "cond-mat", "title": "Non-Hermitian Random Matrix Theory of Jamming in Active Disordered Media", "abstract": "We develop a theoretical framework for the mechanics of active jammed systems based on non-Hermitian random matrix theory. Starting from a microscopic model of active particles with non-reciprocal interactions, we formulate the linearized dynamical matrix as a non-Hermitian perturbation of a Wishart ensemble describing the passive contact network. Using Girko's Hermitization together with the self-consistent Born approximation, we derive a self-consistent equation for the low-frequency resolvent based on the full Marchenko--Pastur distribution. We show that active non-reciprocity regularizes the soft-mode divergence at the jamming transition, leading to a scaling law for the mechanical compliance. We further establish a crossover between perturbative and activity-dominated regimes and propose a corresponding scaling form near the active jamming point.", "url": "https://arxiv.org/abs/2607.26406", "type": "理论", "summary": "1. 该工作基于非厄米随机矩阵理论，为主动无序介质中的堵塞力学建立了理论框架。\n2. 其核心在于揭示主动非互易性通过正则化软模发散，导出机械柔量的标度律。\n3. 这为刻画主动堵塞相变中的力学响应和交叉行为提供了系统理论工具。", "summary_source": "deepseek", "authors": [{"name": "Hisao Hayakawa"}], "featured_authors": [{"name": "Hisao Hayakawa"}], "author_count": 1}, {"id": "2607.26422", "category": "cond-mat", "title": "Physics-informed Machine Learning Prediction of Hubbard Interaction Parameters", "abstract": "Accurate determination of Hubbard interaction parameters is essential for beyond-DFT approaches such as DFT+$U$, DFT+DMFT, and DFT+$U$+$V$ in correlated materials. In practice, however, these parameters are often chosen empirically, limiting their transferability across materials. Advanced computational approaches such as the constrained random-phase approximation (cRPA) provide a rigorous route for evaluating Hubbard interactions, but their computational cost remains a bottleneck for large-scale materials screening. Here, we present machine-learning (ML) models for predicting cRPA-derived Hubbard interaction parameters: effective on-site $U_{\\rm eff}$, inter-site $V$, and Hund's coupling $J$ for transition-metal oxides (TMOs). We combine ensemble-learning models with a regression-based brute-force search (BFS) approach to achieve both predictive accuracy and explicit analytical expressions. We construct features that capture electronic, structural, and atomic properties, including the TM-$d$ bandwidth and TM-$d$/O-$p$ band-center separation, as physically motivated descriptors of localization and screening. Our ensemble models achieve RMSEs of 0.148 eV, 0.062 eV, and 0.007 eV for $U_{\\rm eff}$, $V$, and $J$, respectively. The derived analytical forms directly relate $U_{\\rm eff}$ to electron localization and TM-$d$/O-$p$ hybridization, suggest the importance of hybridization and structural compactness in determining $V$, and indicate that $J$ is governed primarily by elemental descriptors of the TM ion. Together, the present study provides an efficient approach for predicting cRPA-derived $U_{\\rm eff}$, $V$, and $J$, while offering physical insight into the factors underlying these Hubbard interactions.", "url": "https://arxiv.org/abs/2607.26422", "type": "理论+数值", "summary": "1. 该工作构建机器学习模型，预测过渡金属氧化物的cRPA导出Hubbard相互作用参数Ueff、V和J。\n2. 其技术卖点在于结合集成学习与回归暴力搜索，引入TM-d带宽及TM-d/O-p带心分离等物理特征，实现高精度预测并给出显式解析表达式。\n3. 模型揭示Ueff由电子局域化和杂化主导，V受杂化与结构紧凑性影响，J主要由TM离子元素描述符决定，为高通量材料筛选提供高效途径。", "summary_source": "deepseek", "authors": [{"name": "Jiyeon Kim"}, {"name": "Indukuru Ramesh Reddy"}, {"name": "Bongjae Kim"}, {"name": "Sooran Kim"}], "featured_authors": [{"name": "Jiyeon Kim"}, {"name": "Indukuru Ramesh Reddy"}, {"name": "Bongjae Kim"}, {"name": "Sooran Kim"}], "author_count": 4}, {"id": "2607.26487", "category": "cond-mat", "title": "Same-spin Andreev reflections in the quantum Hall regime: the role of loss", "abstract": "The interfaces of superconductors and topological materials hold promise for realizing exotic states and excitations. An important example is provided by the chiral Andreev edge states (CAES), which are formed at interfaces between quantum Hall (QH) states and superconductors (SC). CAES combine electron and hole amplitudes which are hybridized via Andreev reflections. This study explores the spin properties of the CAES through selective spin filtering of the QH edge channels. We find robust evidence of spin-flips accompanying the Andreev processes: electrons can be reflected from the superconductor as holes in the same spin channel. We demonstrate that the distribution of the reflection probabilities is exponential and then use random matrix theory to account for this observation. Finally, we observe Andreev reflections in the spin-polarized {\\nu} = 1 case, which is enabled by particle loss. Our findings shed light on the mechanism underlying Andreev reflections of spin-polarized chiral states. They also demonstrate the importance of considering non-Hermiticity when constructing topological superconductors in hybrid materials.", "url": "https://arxiv.org/abs/2607.26487", "type": "理论", "summary": "1. 该工作通过自旋选择性滤波研究了量子霍尔态与超导体界面处手性安德烈夫边缘态的自旋性质。\n2. 发现电子可被反射为同自旋通道的空穴，且反射概率呈指数分布，由随机矩阵理论解释。\n3. 在ν=1极化态中观察到由粒子损耗实现的安德烈夫反射，表明非厄米性对拓扑超导体构建至关重要。", "summary_source": "deepseek", "authors": [{"name": "Chun-Chia Chen"}, {"name": "Jordan T. McCourt"}, {"name": "John Chiles"}, {"name": "Lingfei Zhao"}, {"name": "Kenji Watanabe"}, {"name": "Takashi Taniguchi"}, {"name": "François Amet"}, {"name": "Antonio L. R. Manesco"}, {"name": "Harold U. Baranger"}, {"name": "Gleb Finkelstein"}], "featured_authors": [{"name": "Chun-Chia Chen"}, {"name": "Jordan T. McCourt"}, {"name": "John Chiles"}, {"name": "Antonio L. R. Manesco"}, {"name": "Harold U. Baranger"}, {"name": "Gleb Finkelstein"}], "author_count": 10}, {"id": "2607.26516", "category": "cond-mat", "title": "Quantum Geometry-Driven RKKY: From Flat to Dispersive Bands", "abstract": "In flat-band systems, quantum metric bounds physical observables like superfluid weight and coherence length, suggesting a single geometric scale for spatial correlations. Here, we show that the RKKY exchange in an isolated filled flat band can violate this expectation. With the intraband channel absent, the exchange proceeds via virtual interband transitions across the gap; the kernel becomes the inverse-gap-weighted trace product of the real-space flat-band projector and empty-band projectors. Because the corresponding momentum-space projectors are analytic, the kernel decays exponentially, with a decay length $\\xi_\\text{RKKY}$ set by the closest singularities of the analytically continued projectors in the complex momentum plane. Thus, this length depends on both the flat-band geometry and the band gap. Applying this formalism to Chern flat-band systems, we find that for small gaps, $\\xi_\\text{RKKY}$ depends non-monotonically on the quantum metric length: it first decreases, then increases, revealing that stronger quantum geometry can shorten the magnetic exchange range. Upon restoring dispersion, a nontrivial inversion representation can force the overlap between Bloch states at antipodal Fermi points to vanish under gate tuning, producing a $1/R^3$ RKKY tail instead of the conventional $1/R^2$---a geometric selection effect.", "url": "https://arxiv.org/abs/2607.26516", "type": "理论", "summary": "1. 该工作研究孤立填充平带中RKKY交换作用，揭示其通过虚带间跃迁实现，且交换核呈指数衰减。\n2. 核心在于衰减长度由复动量平面中的投影子奇点决定，既依赖平带量子几何也依赖带隙，且在Chern平带中随量子度量长度非单调变化。\n3. 这为通过调控能带几何与带隙设计磁交换作用范围以及理解色散带中源于几何选择效应的奇异RKKY尾提供了新视角。", "summary_source": "deepseek", "authors": [{"name": "Zhenggang Zhou"}, {"name": "Chuang Li"}, {"name": "Lun-Hui Hu"}], "featured_authors": [{"name": "Zhenggang Zhou"}, {"name": "Chuang Li"}, {"name": "Lun-Hui Hu"}], "author_count": 3}, {"id": "2607.26576", "category": "cond-mat", "title": "Mode-Resolved Light Scattering Recovers Polymer Thermodynamics in Solutions with Trace Large-Mass Scatterers", "abstract": "Light scattering provides direct access to polymer conformations and thermodynamics. However, trace large-mass scatterers such as aggregates and nanobubbles form unavoidably in polymer solutions and dominate the scattered intensity, obscuring the intrinsic polymer signal. We demonstrate that resolving the static scattering intensity by molecular mobility cleanly separates the polymer and large-scatterer contributions. Applying this mode-resolved analysis to aqueous poly(ethylene glycol) solutions, we isolate the polymer scattering even when these scatterers account for more than 90 % of the total intensity. The resolved polymer intensity recovers the universal osmotic equation of state from the dilute to the semidilute regime over 288 to 358 K. This approach establishes a reliable basis for measuring the thermodynamics of interacting macromolecules in solutions where irreproducible large-mass scatterers have precluded quantitative analysis.", "url": "https://arxiv.org/abs/2607.26576", "type": "理论+数值", "summary": "1. 该工作提出模式分辨光散射方法，从含痕量大质量散射体的聚合物溶液中恢复其热力学性质。\n2. 其核心在于利用分子迁移率区分静态散射成分，即使大散射体占据总强度90%以上仍能有效分离聚合物信号。\n3. 这为因不可控大质量散射体而无法定量分析的溶液中相互作用大分子热力学测量建立了可靠基础。", "summary_source": "deepseek", "authors": [{"name": "Noriaki Mizumoto"}, {"name": "Takashi Yasuda"}, {"name": "Xiang Li"}], "featured_authors": [{"name": "Noriaki Mizumoto"}, {"name": "Takashi Yasuda"}, {"name": "Xiang Li"}], "author_count": 3}, {"id": "2607.26586", "category": "cond-mat", "title": "Percolating Multifractal Domains at a Polymorphic Phase Boundary", "abstract": "Giant piezoelectricity in ferroelectrics is commonly associated with phase-boundary instabilities, among which the polymorphic phase boundary (PPB) is a prominent example conventionally attributed to the coexistence of ferroelectric phases. Here, using large-scale molecular dynamics simulations of the lead-free (K,Na)NbO3-(Bi,Na)ZrO3 solid solutions, we show that the PPB hosts a percolating multifractal polar domain which governs the dielectric and piezoelectric responses. By quantifying the global fractal dimension and multifractal spectrum width of this polar network, we identify fractal connectivity and multiscale heterogeneity as microstructural order parameters for the PPB. The maximum reversible piezoelectric response occurs when the fractal-domain volume fraction approaches the three-dimensional percolation threshold, suggesting that near-critical polar connectivity enables giant reversible electromechanical coupling. In this mechanism, the fractal backbone preserves polar memory and provides the restoring force required for reversibility, while the surrounding nonfractal regions supply the polar compliance needed for large polarization rotation and strain. These results establish percolating multifractal polar domains as a microscopic mechanism for PPB-enhanced piezoelectricity and suggest fractal connectivity as a design parameter for high-performance piezoelectrics.", "url": "https://arxiv.org/abs/2607.26586", "type": "理论+数值", "summary": "1. 该工作通过大规模分子动力学模拟，揭示了(K,Na)NbO3-(Bi,Na)ZrO3固溶体中多态相界存在渗流多分形极性畴并主导介电和压电响应。\n2. 核心要点在于定量分形维数与多分形谱宽度作为序参量，发现最大可逆压电响应出现在分形畴体积分数逼近三维渗流阈值时，分形骨架提供记忆与回复力而周围非分形区域贡献柔性。\n3. 这确立了渗流多分形极性畴作为多态相界增强压电性的微观机制，并指明分形连接性可作为设计高性能压电材料的微观参数。", "summary_source": "deepseek", "authors": [{"name": "Yuan-Jinsheng Liu"}, {"name": "Xu Tian"}, {"name": "Jiahui Zhai"}, {"name": "Shi Liu"}], "featured_authors": [{"name": "Yuan-Jinsheng Liu"}, {"name": "Xu Tian"}, {"name": "Jiahui Zhai"}, {"name": "Shi Liu"}], "author_count": 4}, {"id": "2607.26597", "category": "cond-mat", "title": "Transient Detour and Cooperative Oxygen Exchange in the Polarization Switching of Ferroelectric Hf0.5Zr0.5O2", "abstract": "Hafnium zirconium oxide (HZO) has attracted significant attention as a core material for next-generation non-volatile memories due to its excellent ferroelectricity in the ultra-thin film regime and its CMOS process compatibility. However, the exploration of its polarization switching mechanism has predominantly relied on static energy barrier analyses, leaving the transient bond formation and cooperative dynamic mechanisms under actual electric field driving unresolved. In this study, we performed Electric-Field-Induced MD simulations on a defect-free ideal HZO lattice using a fine-tuned machine learning force field (MACEField). As a result, we successfully reproduced the P-E hysteresis loop dynamically and demonstrated that the polarization switching in HZO is driven not by conventional simple displacement models (S:N/S:T models), but by the dynamic mutual exchange of 3-coordinated oxygen (O3c) and 4-coordinated oxygen (O4c). Analysis of the oxygen atom displacement trajectories revealed that this pathway is accompanied by a unique \"detour\" behavior originating from transient cation-oxygen bond formation. Furthermore, we identified an \"internal self-compensation mechanism\" in which the local volumetric expansion and contraction accompanying the coordination number changes are effectively offset within the cell. These findings provide, from a dynamic perspective, a microscopic physical origin of for HZO's exceptional ability to sustain stable polarization switching without macroscopic strain, a property that has long distinguished HZO from conventional perovskite ferroelectrics yet lacked atomistic explanation. These findings suggest that preserving the integrity of cooperative O3c/O4c exchange pathways, rather than minimizing individual atomic displacements, is the key design principle for endurance and scalability in next-generation ferroelectric memories.", "url": "https://arxiv.org/abs/2607.26597", "type": "理论+数值", "summary": "1. 该工作利用机器学习力场进行电场诱导分子动力学模拟，在无缺陷Hf0.5Zr0.5O2理想晶格中动态重现了极化-电场迟滞回线。\n2. 其核心发现是极化开关并非传统的简单位移模型，而是通过三配位氧与四配位氧的动态交换实现，并伴有由瞬态阳离子-氧键形成的绕行行为及胞内体积自补偿机制。\n3. 这为设计下一代铁电存储器提供了关键原则：保持协同氧交换路径的完整性，而非最小化单个原子位移，是兼顾耐久性和可扩展性的核心物理依据。", "summary_source": "deepseek", "authors": [{"name": "Ryotaro Sahashi"}, {"name": "Po-Yen Chen"}, {"name": "Teruyasu Mizoguchi"}], "featured_authors": [{"name": "Ryotaro Sahashi"}, {"name": "Po-Yen Chen"}, {"name": "Teruyasu Mizoguchi"}], "author_count": 3}, {"id": "2607.26620", "category": "cond-mat", "title": "Critical non-thermal fixed point and the dynamical condensation phase transition", "abstract": "Using a non-perturbative quantum kinetic framework, we develop a unified description of the far-from-equilibrium dynamics of three-dimensional Bose gases following cooling quenches across the Bose-Einstein condensation transition. By tracking the spatio-temporal evolution of the momentum distribution, we show that the equilibrium condensation threshold simultaneously acts as a dynamical critical point, separating distinct far-from-equilibrium universality classes governed by different non-equilibrium attractors. While quenches above the transition exhibit a single-timescale relaxation toward a thermal fixed point, quenches below the transition display a crossover from a transient weak-turbulence regime to a coarsening fixed point governed by the diffusive recombination of vortex lines. Quenches directly to the condensation threshold, finally, are controlled by a previously unidentified critical fixed point characterized by the superdiffusive spreading of critical fluctuations and a distinct set of dynamical exponents. Together, these dynamical scaling laws establish a far-from-equilibrium counterpart of the condensation phase transition, in which the equilibrium critical point also organizes the long-time non-equilibrium dynamics.", "url": "https://arxiv.org/abs/2607.26620", "type": "理论", "summary": "1. 该工作利用非微扰量子动能框架，统一描述了三维玻色气体冷却淬火通过BEC相变后动量分布的时空演化。\n2. 其核心发现是平衡凝聚阈值同时作为动力学临界点，分离出超扩散临界涨落、涡线扩散重组等不同非平衡吸引子。\n3. 这建立了凝聚相变的远非平衡对应，为揭示量子相变中非平衡普适类与临界动力学标度提供了系统图像。", "summary_source": "deepseek", "authors": [{"name": "Anne-Solène Bornens"}, {"name": "Elisabeth Gliott"}, {"name": "Nicolas Cherroret"}], "featured_authors": [{"name": "Anne-Solène Bornens"}, {"name": "Elisabeth Gliott"}, {"name": "Nicolas Cherroret"}], "author_count": 3}, {"id": "2607.26660", "category": "cond-mat", "title": "Entanglement signatures of topological phase transitions in a dirty Weyl semimetal", "abstract": "Three-dimensional Weyl semimetals (WSMs) constitute paradigmatic gapless topological phases whose nodal structure is stable against weak perturbations, including disorder. Two distinct ways to destroy the topology of the Weyl nodes are through pairwise annihilation in momentum space or by sufficiently strong disorder that eliminates the quasiparticle pole, driving the system into a non-Fermi-liquid diffusive-metallic state. In this work, we study the evolution of entanglement spectrum and entanglement entropy of a dirty WSM as it undergoes these two topological transitions. In the clean limit, the WSM topology is reflected by a locus of $\\xi=1/2$ eigenvalues of the reduced correlation matrix mirroring the structure of Fermi arcs. We show that disorder broadens this feature into a finite-width distribution, which disappears either through a gradual loss of spectral weight upon node annihilation or by melting into the background at the onset of metallicity. When tuning across the disorder-driven transition, the scaling of the Rényi entropies observed for weak disorder gradually breaks down as the system approaches the critical disorder strength.", "url": "https://arxiv.org/abs/2607.26660", "type": "理论", "summary": "1. 本文通过计算纠缠谱与纠缠熵，研究了无序Weyl半金属在动量空间节点湮灭与无序驱动金属化两种拓扑相变中的特征演化。\n2. 核心在于揭示了干净极限下关联矩阵ξ=1/2本征值（对应费米弧）在无序下展宽，经谱权重丢失或融解于背景而消失，且Rényi熵标度在临界无序附近崩溃。\n3. 这为利用纠缠可观测量区分不同拓扑破坏机制提供了敏感探针，并暗示无序诱导的非费米液体金属态具有独特的纠缠标度行为。", "summary_source": "deepseek", "authors": [{"name": "Vinícius Mohr"}, {"name": "Shunji Tsuchiya"}, {"name": "Andras Szabo"}], "featured_authors": [{"name": "Vinícius Mohr"}, {"name": "Shunji Tsuchiya"}, {"name": "Andras Szabo"}], "author_count": 3}, {"id": "2607.26662", "category": "cond-mat", "title": "Interface evolution in the two-dimensional quantum Ising model", "abstract": "We consider the unitary time evolution of an interface in the regime of spontaneously broken symmetry of the two-dimensional quantum Ising model. The interface is induced by an initial condition interpolating between the two degenerate ground states in one of the spatial dimensions. The interpolation is left generic in order to investigate the dependence of the late time dynamics on the initial condition. Exploiting the basis of asymptotic quasiparticle states of the bulk theory, the order parameter is analytically determined at large times in the rough phase. The mechanism allowing the breakdown of this phase as the distance from criticality increases emerges from the theory.", "url": "https://arxiv.org/abs/2607.26662", "type": "理论", "summary": "1. 该文利用体理论渐近准粒子态基，解析地研究了二维量子Ising模型自发对称性破缺区域中界面的幺正时间演化。\n2. 其关键在于揭示了序参量在大时间下于粗糙相中的解析形式，以及随远离临界点该相崩溃的物理机制。\n3. 这为理解低维量子系统中界面动力学对初始条件的依赖，以及相变临界行为提供了理论支撑。", "summary_source": "deepseek", "authors": [{"name": "Georgios Kampanis"}, {"name": "Marianna Sorba"}, {"name": "Gesualdo Delfino"}], "featured_authors": [{"name": "Georgios Kampanis"}, {"name": "Marianna Sorba"}, {"name": "Gesualdo Delfino"}], "author_count": 3}, {"id": "2607.26667", "category": "cond-mat", "title": "Computational Study of Water Adsorption and Dissociative Mechanisms Impacting g-C3N4's Optical and Electronic Properties", "abstract": "In the quest for sustainable energy solutions, water splitting emerges as a crucial process for generating clean hydrogen a versatile and renewable fuel essential for energy storage, emissions reduction, and achieving sustainability goals. This study employs a comprehensive computational approach, utilizing atomistic simulations to systematically investigate the effects of water absorption on the electronic and optical properties of g-C3N4 nanosheets. Our methodology integrates ab initio computations grounded in density functional theory (DFT), which allows for a detailed characterization of the nanosheet and serves as a benchmark for self-consistent charge density functional tight binding (SCC-DFTB) simulations. This approach provides valuable insights into the behavior of the nanosheet under the influence of absorbed OH and H2O molecules by considering calculated parameters for photocatalytic efficiency. Additionally, we extend our investigation to classical molecular dynamics simulations within the ReaxFF framework, modeling the emission of multiple H2O molecules and assessing the subsequent rate of H2 evolution. A key finding of our study reveals that the dissociation of H2O into HO and O molecules significantly enhances both the optical absorbance and conductance of the nanosheet compared to its pristine state. These results underscore the potential of g-C3N4 nanosheets as effective materials for water splitting applications.", "url": "https://arxiv.org/abs/2607.26667", "type": "理论+数值", "summary": "1. 该工作采用密度泛函理论、自洽电荷密度泛函紧束缚及ReaxFF反应力场分子动力学，系统研究了水分子吸附与解离对g-C3N4纳米片电子结构与光学性质的调控。\n2. 核心发现是H2O解离为HO与O基团后，纳米片的光吸收系数与电导率相较于本征态显著增强，并通过多尺度模拟评估了H2析出速率。\n3. 这为理解g-C3N4的光催化水分解微观机制提供了定量模型，并为通过表面吸附态设计高效光催化剂指明了方向。", "summary_source": "deepseek", "authors": [{"name": "Amil Aligayev"}, {"name": "Ulkar Jabbarli"}, {"name": "F. Javier Domınguez-Gutierrez"}, {"name": "Ulkar Samadova"}, {"name": "Jialin Li"}, {"name": "Stefanos Papanikolaou"}, {"name": "Qing Huang"}], "featured_authors": [{"name": "Amil Aligayev"}, {"name": "Ulkar Jabbarli"}, {"name": "F. Javier Domınguez-Gutierrez"}, {"name": "Jialin Li"}, {"name": "Stefanos Papanikolaou"}, {"name": "Qing Huang"}], "author_count": 7}, {"id": "2607.26676", "category": "cond-mat", "title": "Electronically Inactive Intercalated La$_2$NiO$_4$ Layer in Superconducting La$_5$Ni$_3$O$_{11}$", "abstract": "The recent discovery of superconductivity in La$_5$Ni$_3$O$_{11}$ extends the family of superconducting Ruddlesden--Popper nickelates beyond La$_3$Ni$_2$O$_7$. Unlike conventional members of a single Ruddlesden--Popper series, La$_5$Ni$_3$O$_{11}$ contains an intercalated La$_2$NiO$_4$ layer between La$_3$Ni$_2$O$_7$ blocks, raising the question of whether this additional layer participates in the low-energy electronic structure. Here, we combine density functional theory, Wannier-based tight-binding modeling, and rotationally invariant slave-boson calculations to investigate the electronic role of the intercalated layer. We find that realistic electronic parameters place the La$_2$NiO$_4$ layer in gapped insulating regimes rather than a paramagnetic metallic state. Furthermore, realistic interlayer hybridization fails to generate any appreciable La$_2$NiO$_4$-derived spectral weight at the Fermi level. Our results demonstrate that the low-energy electronic structure of La$_5$Ni$_3$O$_{11}$ is governed primarily by the La$_3$Ni$_2$O$_7$ block, with the intercalated La$_2$NiO$_4$ layer remaining electronically inactive. This establishes a minimal low-energy description of La$_5$Ni$_3$O$_{11}$ and provides a unified framework for understanding superconductivity in intercalated Ruddlesden--Popper nickelates.", "url": "https://arxiv.org/abs/2607.26676", "type": "理论+数值", "summary": "1. 该工作采用密度泛函理论、Wannier基紧束缚模型及旋转不变奴隶玻色子计算，系统研究了超导La$_5$Ni$_3$O$_{11}$中插层La$_2$NiO$_4$层在低能电子结构中的功能角色。\n2. 其实质卖点在于：基于第一性原理的真实电子参数将该层推入带隙绝缘区而非顺磁金属态，且实际层间杂化无法在费米能级产生任何来自La$_2$NiO$_4$的可观测谱权重。\n3. 这证明La$_5$Ni$_3$O$_{11}$的低能电子性质主要由La$_3$Ni$_2$O$_7$块支配，从而为插层Ruddlesden–Popper镍氧化物的超导机制提供了统一的最小低能描述框架。", "summary_source": "deepseek", "authors": [{"name": "Tianyang Xie"}, {"name": "Yuxin Wang"}, {"name": "Zhan Wang"}, {"name": "Kun Jiang"}, {"name": "Jiangping Hu"}], "featured_authors": [{"name": "Tianyang Xie"}, {"name": "Yuxin Wang"}, {"name": "Zhan Wang"}, {"name": "Kun Jiang"}, {"name": "Jiangping Hu"}], "author_count": 5}, {"id": "2607.26678", "category": "cond-mat", "title": "Quantum Brownian transport in a correlated Gaussian force", "abstract": "We study a classical system-bath model in which a system particle is linearly coupled to a bath of harmonic oscillators. In a system subject to white and correlated Gaussian noises, we derive an expression for the joint probability density, and the mean squared values of the system-bath particles are calculated. For white noise, the mean squared values of the system-bath particles exhibit an anomalous time dependence, which is different from that of normal diffusion. In particular, for a correlated Gaussian noise, the mean squared displacement and mean squared velocity of the bath particle show superspreading growths of $t^5$ and $t^3$ in $t{\\ll}{\\tau}$, respectively. When ${\\tau}=0$, the mean squared velocity of a quantum particle under random noise is proportional to $t$, while the mean squared velocity of a bath particle in the presence of correlated Gaussian noise increases in proportion to $t^2$. This anomalous transport phenomenon results from the mixed derivative structure of the master equation, which couples with the transport coordinates in the diffusion dynamics of the relative coordinates. This result shows that the removal of dissipation in the Caldeira-Leggett framework leads to fundamentally different transport mechanisms characterized by non-diffusive quantum diffusion.", "url": "https://arxiv.org/abs/2607.26678", "type": "理论", "summary": "1. 该工作研究了经典系统-浴模型中关联高斯噪声下的量子布朗输运，推导了联合概率密度并计算了系统与浴粒子的均方值。\n2. 主要发现关联高斯噪声导致浴粒子的均方位移和均方速度在短时间尺度上呈现t^5和t^3的超扩散增长，该异常源于主方程的混合导数结构耦合输运坐标。\n3. 这表明在Caldeira-Leggett框架中去除耗散后，系统呈现非扩散量子扩散的新型输运机制，为关联噪声驱动输运研究提供了理论参照。", "summary_source": "deepseek", "authors": [{"name": "Yun Jeong Kang"}, {"name": "Seungsik Min"}, {"name": "Sung Kyu Seo"}, {"name": "Kyungsik Kim"}], "featured_authors": [{"name": "Yun Jeong Kang"}, {"name": "Seungsik Min"}, {"name": "Sung Kyu Seo"}, {"name": "Kyungsik Kim"}], "author_count": 4}, {"id": "2607.26747", "category": "cond-mat", "title": "Fluctuation force induced by quenched random polarizations", "abstract": "We investigate the zero-temperature behavior of the fluctuation force induced by random electric dipoles that are frozen into a material and incapable of fluctuating thermally. Examples of such materials are relaxor ferroelectrics. In terms of the setup and geometry, we focus on a layered system comprising two coplanar semi-infinite slabs separated by a distance $\\ell$ as well as a system comprising a neutral atom in the vacuum located at a distance $\\ell$ above the surface of a semi-infinite slab. For both systems, we consider the cases where the quenched random dipolar disorder occurs inside the bulk as well as on the surface of the slabs. In all of these cases, we find that the bulk (surface) dipolar disorder-induced fluctuation force grows with the mean square quenched electric dipole moment per unit volume (area). The bulk (surface) dipolar disorder-induced fluctuation pressure between two semi-infinite single-layered slabs decays with $\\ell^{-3}$ ($\\ell^{-4}$), whereas the bulk (surface) dipolar disorder-induced fluctuation force on an atom in the vacuum near a slab containing the disorder decays with $\\ell^{-4}$ ($\\ell^{-5}$). We also find that the quenched dipolar disorder-induced fluctuation force between two coplanar slabs can be repulsive and serve to enhance the ``nanolevitation effect\" in a three-layered dielectric system that obeys the Dzyaloshinskii-Lifshitz-Pitaevskii condition.", "url": "https://arxiv.org/abs/2607.26747", "type": "理论", "summary": "1. 该工作计算了由冻结随机电偶极子（如弛豫铁电体中）诱导的零温涨落力，考虑了两共面板及原子-板两种几何构型，无序分布于体或表面。\n2. 其核心物理发现是体/表面无序产生的涨落压力分别随间距ℓ呈ℓ^{-3}/ℓ^{-4}衰减，对原子的力为ℓ^{-4}/ℓ^{-5}；且该力可表现为排斥性，增强满足Dzyaloshinskii-Lifshitz-Pitaevskii条件的三层介电系统的纳米悬浮效应。\n3. 该研究为利用淬火无序控制纳米尺度涨落力提供了新机制，对于设计基于随机极化的自组装或悬浮器件具有启发性。", "summary_source": "deepseek", "authors": [{"name": "Bing-Sui Lu"}], "featured_authors": [{"name": "Bing-Sui Lu"}], "author_count": 1}, {"id": "2607.26793", "category": "cond-mat", "title": "High-dimensional theory of the glass transition revisited: hopping and local defects", "abstract": "The replicated liquid theory provides a microscopic mean-field description of the glass transition by combining the density functional theory of liquids with the replica method originally developed for spin glasses. In the conventional replica liquid theory, a glassy state is described by assuming that particles in different replicas undergo vibrational motion around common centers of mass, thereby forming molecules that contain one particle from every replica. Here we revisit this assumption by allowing each molecule to contain only a subset of replicas. This generalized formulation describes particle-level replica mismatches, which may be associated with non-vibrational motions such as particle hopping. We apply the theory to high-dimensional hard and harmonic spheres, where the mean-field description is expected to become exact. For hard spheres, replica mismatches destabilize the glassy metastable state and shift the dynamical transition to a significantly higher packing fraction, while leaving the leading thermodynamic glass transition unchanged. The resulting transition density agrees, at leading order in high dimensions, with the recent rigorous lower bound for random sphere packings obtained by Campos, Jenssen, Michelen, and Sahasrabudhe by using a discretized version of greedy Random Sequential Absorption, suggesting an algorithmic interpretation of the transition: grandcanonical dynamics is more efficient in high dimensional spaces than canonical one. For harmonic spheres at finite temperature, the glassy state contains a finite replica-mismatch fraction even at the thermodynamic ideal-glass transition, thereby shifting the transition point from that predicted by the conventional replica ansatz.", "url": "https://arxiv.org/abs/2607.26793", "type": "理论+数值", "summary": "1. 该工作通过允许复制分子仅含子集复制，将传统复制液体理论推广至描述粒子级复制不匹配与跳跃运动，并严格求解高维硬球与谐振球玻璃转变。\n2. 其主要发现是：硬球中复制不匹配将动力学转变密度提升至与Campos等人随机球填充严格下界一致的高维领先阶，揭示巨正则动力学的高维效率；谐振球中有限不匹配使理想玻璃转变点显著偏离传统ansatz。\n3. 这建立了玻璃转变与贪婪随机顺序吸附的算法联系，为高维非平衡动力学及平均场理论的严格性提供了新启示。", "summary_source": "deepseek", "authors": [{"name": "Harukuni Ikeda"}, {"name": "Francesco Zamponi"}], "featured_authors": [{"name": "Harukuni Ikeda"}, {"name": "Francesco Zamponi"}], "author_count": 2}, {"id": "2607.26869", "category": "cond-mat", "title": "Microscopic Emergence of Ancilla Lattice Physics in the Emery Model", "abstract": "We derive a controlled low-energy effective theory for the three-band Emery model on the Lieb lattice near (n=2) filling. Starting from the positive charge-transfer regime, a sequence of Schrieffer--Wolff transformations rigorously establishes a direct microscopic mapping onto an ancillary lattice structure. For realistic cuprate-like parameters, this framework naturally reproduces the conventional Fermi-liquid (FL) phase at a filling shifted by one electron per site. Our analysis identifies the precise microscopic conditions required to access the exotic fractionalized Fermi-liquid (FL$^*$) phase. We show that realizing FL$^*$ requires nonstandard cuprate parameter regimes together with additional interactions that stabilize a quantum spin liquid in the background ancilla layer. These results establish a microscopic foundation for ancilla physics in multiorbital materials and clarify the conditions for realizing FL$^*$. We discuss the possibility to replicate ancilla model physics in Lieb lattice cold atom simulations.", "url": "https://arxiv.org/abs/2607.26869", "type": "理论+数值", "summary": "1. 该工作从正电荷转移区出发，通过Schrieffer-Wolff变换为Lieb晶格三带Emery模型建立了可控的低能有效理论，并严格建立了到辅助晶格结构的微观映射。\n2. 其核心在于阐明了实现分数化费米液体FL*相所需的非常规铜氧化物参数条件及额外相互作用，揭示了背景辅助层中量子自旋液体的关键稳定作用。\n3. 这为多轨道材料中辅助晶格物理提供了微观基础，并指明在Lieb晶格冷原子模拟中复现该模型物理的可行路径。", "summary_source": "deepseek", "authors": [{"name": "Mikołaj Walicki"}, {"name": "Johannes Knolle"}, {"name": "Krzysztof Wohlfeld"}], "featured_authors": [{"name": "Mikołaj Walicki"}, {"name": "Johannes Knolle"}, {"name": "Krzysztof Wohlfeld"}], "author_count": 3}, {"id": "2607.26875", "category": "cond-mat", "title": "Squirming motion near corrugated surfaces", "abstract": "Swimming microorganisms often operate in complex confinement, where an interplay of long-ranged hydrodynamic interactions and a short-ranged repulsive interaction can give rise to interesting dynamical behaviors. Here, we theoretically investigate the trajectories of microswimmers - modeled as squirmers - in the presence of periodic boundaries. The latter modify their swimming velocity, leading to behaviors that differ qualitatively from swimming near planar walls. Using a perturbative approach based on bispherical coordinates and the Lorentz reciprocal theorem, we characterize the interaction between a squirmer and a periodic surface in the limit of small surface amplitude and systematically explore its dependence on the boundary corrugation wavelength, squirmer type, orientation, and swimmer-surface distance. Most importantly, our results reveal that pullers become trapped in the valley of the surface corrugations, in contrast to their sliding motion near planar walls. Furthermore, the near-surface dynamics of pushers display oscillations, reflecting the periodicity of the surface structure. A tilt of the swimmer orientation with respect to the surface corrugations results in a wave-length dependent drift that sorts pushers from pullers. These findings highlight the impact of hydrodynamic interactions in shaping microswimmer transport near structured boundaries with potential implications for microbiological phenomena, such as biofilm formation, and technological applications.", "url": "https://arxiv.org/abs/2607.26875", "type": "理论", "summary": "1. 该工作利用基于双球坐标和洛伦兹互易定理的微扰方法，理论研究了周期性波纹表面附近微游泳者的运动轨迹。\n2. 关键卖点是发现pullers被捕获于波纹谷底，而pushers出现与表面周期相关的振荡运动，且取向倾斜导致波长依赖的漂移以分离两者。\n3. 这揭示了结构化边界附近的流体动力学相互作用对微游泳者输运的调控，为理解生物膜形成及相关技术应用提供了新启发。", "summary_source": "deepseek", "authors": [{"name": "Sagnik Garai"}, {"name": "Thomas G. Fai"}, {"name": "Christina Kurzthaler"}], "featured_authors": [{"name": "Sagnik Garai"}, {"name": "Thomas G. Fai"}, {"name": "Christina Kurzthaler"}], "author_count": 3}, {"id": "2607.26881", "category": "cond-mat", "title": "Crystal forming ability of amorphous refractory metals under nanoindentation: a molecular dynamics study", "abstract": "Amorphous refractory metal coatings combine high hardness with chemical inertness, yet their metastability makes them prone to mechanically induced crystallisation (devitrification) under contact loading, and how readily such a glass re-orders to its parent body centred cubic (bcc) crystal is unknown across the refractory series. We prepared amorphous V, Nb, Mo, Ta and W by melt quenching to 300 K, validated each interatomic potential against ab initio liquid radial distribution functions, and probed them by large scale molecular dynamics nanoindentation. Indentation drives a localised amorphous to bcc transformation by bulk nucleation, growth and coalescence. A crystal forming ability (CFA), the maximum slope of the sigmoidal bcc fraction versus depth curve, spans about a factor of four and decreases as V > Mo > Nb > Ta > W; it falls with indenter velocity as CFA $\\propto v^{-m}$ with a mean exponent of 1.08, so CFA$\\cdot v$ is nearly constant and the transformation rate is almost velocity independent. Transforming atoms carry excess non affine displacement and local shear strain, not hydrostatic pressure, marking a shear associated displacive pathway; the bulk driving force is largest for the most resistant element, W, so resistance tracks cohesive bond strength rather than the thermodynamic driving force. Early bcc like order sets the sharpness and depth of the transition, whereas the mechanical work to half transformation sets the persistent nucleus density. A grain population balance links nucleation, growth and coalescence to a terminal microstructure whose completeness does not follow the CFA order.", "url": "https://arxiv.org/abs/2607.26881", "type": "数值", "summary": "1. 该工作通过熔淬制备非晶态V、Nb、Mo、Ta、W并用验证势函数进行大规模分子动力学纳米压痕模拟，研究其力诱导bcc晶化的成核、生长与合并过程。\n2. 物理卖点是晶体形成能力(CFA)按V>Mo>Nb>Ta>W递减约四倍，CFA∝v^{-1.08}使变换速率近乎速度无关；晶化由非仿射位移和局部剪应变路径主导，抗晶化能力与共价键强度而非热力学驱动力正相关。\n3. 早期bcc序参量控制转变深度和陡峭度，机械功决定稳定核密度，晶粒种群平衡联结形核、生长与最终组织，为预测非晶涂层力致晶化行为及高稳定性材料设计提供微观理论依据。", "summary_source": "deepseek", "authors": [{"name": "Prashant Dwivedi"}, {"name": "Alberto Fraile"}, {"name": "Tomas Polcar"}], "featured_authors": [{"name": "Prashant Dwivedi"}, {"name": "Alberto Fraile"}, {"name": "Tomas Polcar"}], "author_count": 3}, {"id": "2607.26920", "category": "cond-mat", "title": "Boundary-Driven Anisotropic Coarsening in Conserved Phase Separation", "abstract": "Universal scaling in phase separation is typically assumed to be isotropic in systems with conserved dynamics. Here we show that boundary forcing alone can break this dynamical scaling symmetry, leading to anisotropic coarsening, with different effective global growth laws observed parallel and perpendicular to the boundary. We consider a ternary mixture with two conserved components and a passive species undergoing surface evaporation, which provides a simple setting to investigate this effect. In this case, evaporation leads to a progressive mass loss and to the formation of macroscopic concentration gradients, which, in turn, drive anisotropic coarsening, with different effective growth laws observed parallel and perpendicular to the boundary. At the same time, bulk regions appear to retain the standard Model B scaling, suggesting that the observed anisotropy is mainly induced by boundary fluxes rather than by changes in the intrinsic dynamics. Our results indicate that boundary conditions can play an important role in breaking scaling symmetry and may offer a way to influence coarsening behavior in nonequilibrium phase separation.", "url": "https://arxiv.org/abs/2607.26920", "type": "理论", "summary": "1. 该工作通过三元混合物表面蒸发模型，证明边界强制可自主打破守恒相分离中动态标度对称性，引发平行与垂直边界方向的各向异性粗化。\n2. 其物理机制在于边界通量诱导宏观浓度梯度，使体相保留标准Model B标度而边界附近生长律偏离各向同性，明确区分了边界与内在动力学对对称性破缺的贡献。\n3. 这为利用边界条件调控非平衡相分离粗化行为提供了原理验证，并启发在更复杂保守体系中将边界通量视为可控序参量场写入标度理论。", "summary_source": "deepseek", "authors": [{"name": "Emilio N.M. Cirillo"}, {"name": "Nicklas Jävergård"}, {"name": "Adrian Muntean"}, {"name": "Stela Andrea Muntean"}], "featured_authors": [{"name": "Emilio N.M. Cirillo"}, {"name": "Nicklas Jävergård"}, {"name": "Adrian Muntean"}, {"name": "Stela Andrea Muntean"}], "author_count": 4}, {"id": "2607.26938", "category": "cond-mat", "title": "Symmetry-Selective Strain Control of Anisotropic Magnetic Response in a Silicon FinFET Double Quantum Dot", "abstract": "Strain naturally develops in three-dimensional quantum-dot structures such as silicon FinFETs during fabrication and cooling. Such strain becomes especially important in a double quantum dot, because the two dots can experience different local strain and therefore acquire different magnetic responses. To understand how this dot-to-dot strain difference affects coupled hole spins, we theoretically study the local \\(g\\) tensors of a silicon FinFET double quantum dot by combining a three-dimensional Poisson--Schrödinger calculation based on a six-band \\(k\\!\\cdot\\!p\\) model with configuration interaction. We find that the effect of strain depends on both its tensor component and its spatial symmetry. For the diagonal components \\(\\epsilon_{yy}\\) and \\(\\epsilon_{zz}\\), strain mainly changes the principal \\(g\\) values, with only a small opening of the maximum-response axes. In contrast, the shear component \\(\\epsilon_{yz}\\) can also change the orientation of the local magnetic response. When the strain profile preserves the transverse mirror symmetry, the shear-induced rotation is strongly suppressed. Breaking this local constraint permits a pronounced off-diagonal response and rotates the principal magnetic axes. The same component- and symmetry-selected trends appear in a Zeeman-only calculation, showing that the valence-band Zeeman coupling is sufficient to generate them, while the full Hamiltonian determines their quantitative expression. Together, these results show how the tensor component and spatial symmetry of strain can be used to control both the magnitude and orientation of the magnetic response in coupled hole-spin qubits.", "url": "https://arxiv.org/abs/2607.26938", "type": "理论+数值", "summary": "1. 该工作结合六带k·p模型与组态相互作用，理论研究了硅FinFET双量子点中应变对局域g张量的各向异性调控。\n2. 其核心卖点在于揭示了应变对角分量主要改变主g值，而剪切分量εyz在破坏镜面对称性时可显著旋转局域磁响应主轴。\n3. 这为通过应变张量分量与空间对称性协同操控耦合空穴自旋量子比特的磁响应幅度与取向提供了明确物理途径。", "summary_source": "deepseek", "authors": [{"name": "Yuze Lu"}, {"name": "Xiaoyan Liu"}, {"name": "Fei Liu"}], "featured_authors": [{"name": "Yuze Lu"}, {"name": "Xiaoyan Liu"}, {"name": "Fei Liu"}], "author_count": 3}, {"id": "2607.26974", "category": "cond-mat", "title": "Two-magnon scattering in the framework of the Lippmann-Schwinger equation", "abstract": "Controlling magnetic losses requires identifying the microscopic origin of extrinsic linewidth broadening. We introduce a Lippmann--Schwinger framework for two-magnon scattering from weak defect potentials, showing that scattering is set by the overlap between the perturbation of the effective field and degenerate spin-wave states. Applied to iron garnet films, YIG/GGG(111) and YIG/GGG(110), we identify crystallographic directions along which these perturbation are elongated. This approach provides a link between the crystallography, effective field on the sample scale and two-magnon scattering.", "url": "https://arxiv.org/abs/2607.26974", "type": "理论", "summary": "1. 该工作基于Lippmann-Schwinger方程建立弱缺陷势下双磁子散射的理论框架，并应用于YIG/GGG(111)与(110)薄膜。\n2. 核心在于证明散射强度由有效场空间扰动与简并自旋波本征态的重叠积分决定，从而识别出扰动伸长的特定晶向。\n3. 该关联晶体学、样品尺度有效场与双磁子散射的框架，为外禀线宽的晶体工程调控提供了定量路径。", "summary_source": "deepseek", "authors": [{"name": "Jorge Marquez Chavez"}, {"name": "Ondřej Wojewoda"}, {"name": "Yixuan Song"}, {"name": "Geoffrey S. D. Beach"}, {"name": "Caroline A. Ross"}], "featured_authors": [{"name": "Jorge Marquez Chavez"}, {"name": "Ondřej Wojewoda"}, {"name": "Yixuan Song"}, {"name": "Geoffrey S. D. Beach"}, {"name": "Caroline A. Ross"}], "author_count": 5}, {"id": "2607.26986", "category": "cond-mat", "title": "Theory of phonon-magnon hybridization and angular momentum in CrI$_3$ and CrBr$_3$", "abstract": "In magnetic materials angular momentum can be mediated by different carriers, including electrons, magnons, and phonons. The magnons can interact with circularly polarized phonons which are close in energy, provided specific symmetry conditions are met. If the interaction is strong enough the phonons and magnons shift in frequency and start to mix to form hybrid magneto-elastic quasi-particles. In this paper, we develop a constrained Hamiltonian framework which incorporates hybrid stiffness matrices and Berry curvatures. We quantify the degree of hybridization between phonons and magnons (up to 8% in CrI$_3$ and 25% in CrBr$_3$) using a decomposition of the total energy, which is a generalization of the norm decomposition for atomic contributions to phonons used in the literature. We also explore how the total angular momentum is conserved but shared between the phononic and magnonic subsystems upon hybridization.", "url": "https://arxiv.org/abs/2607.26986", "type": "理论", "summary": "1. 该工作发展了一个约束哈密顿框架，定量研究CrI₃和CrBr₃中声子与磁子的杂化及其角动量分配。\n2. 其核心在于采用总能量分解方法量化杂化程度（CrI₃中达8%，CrBr₃中达25%），并揭示杂化后总角动量守恒但于两子系统间重新分布。\n3. 这为理解磁性材料中磁弹耦合对角动量传递与准粒子行为的调控提供了理论工具与可检验的预测。", "summary_source": "deepseek", "authors": [{"name": "Maxime Mignolet"}, {"name": "Miquel Royo"}, {"name": "Massimiliano Stengel"}, {"name": "Matthieu J. Verstreate"}], "featured_authors": [{"name": "Maxime Mignolet"}, {"name": "Miquel Royo"}, {"name": "Massimiliano Stengel"}, {"name": "Matthieu J. Verstreate"}], "author_count": 4}, {"id": "2607.26992", "category": "cond-mat", "title": "Generation of representative powder particle packing in 2D/3D: which tool for which application?", "abstract": "Although dense sphere packings serve as the initial state for simulations in powder metallurgy, additive manufacturing and granular physics, the choice of a packing generator is rarely guided by a systematic benchmark. A representative packing must be (i)-(ii) physically admissible (non-overlapping particles in gravitational equilibrium); (iii) faithful to the target particle size distribution (PSD); (iv) representative in relative density Phi; and (v) computationally affordable. Four open-source tools have been benchmarked, meeting (i)-(ii) by construction: the sequential DR (dropping-and-rolling) and its densified variant DR-ME, and the discrete element method (DEM) codes LAMMPS (gravity) and dp3D (isostatic compression). Across four configurations (2D/3D lognormal, 3D bimodal, and a 3D domain-size study), they are compared against an industrial MIM-grade powder, with PSD fidelity measured by the bin-width-independent Hellinger distance and Phi against the feedstock solid loading (phi_exp = 0.62, by Archimedes' method). In 3D, the DEM codes reach the densest packings but run more than three orders of magnitude slower: for approximatively 20 000 particles, DR shows a 9% phi shortfall relative to dp3D while running 1800x faster. These idealised model packings yield application-driven tool-selection guidelines.", "url": "https://arxiv.org/abs/2607.26992", "type": "理论+数值", "summary": "1. 该工作系统比较了四种开源工具在生成二维/三维球形粉末颗粒堆积体时的性能，包括顺序落滚法及其致密化变体与离散元法代码。\n2. 其技术核心在于以工业MIM级粉末为基准，利用与箱宽无关的Hellinger距离和相对密度定量评估了颗粒尺寸分布忠实性与填充效率，并揭示了致密化精度与计算成本之间的显著权衡。\n3. 这为粉末冶金、增材制造及颗粒物理等应用中根据实际需求（如密度精度或计算速度）合理选择堆积生成策略提供了明确的量化指导。", "summary_source": "deepseek", "authors": [{"name": "Antoine Tainturier"}, {"name": "Louis Lemarquis"}, {"name": "Victor Szczepan"}, {"name": "Marc Bernacki"}], "featured_authors": [{"name": "Antoine Tainturier"}, {"name": "Louis Lemarquis"}, {"name": "Victor Szczepan"}, {"name": "Marc Bernacki"}], "author_count": 4}, {"id": "2607.27000", "category": "cond-mat", "title": "On the robustness of noisy solutions in non-convex neural networks", "abstract": "Optimization in non-convex neural network models is strongly influenced by the geometry of the solution space: sparse, isolated, point-like clusters are typically algorithmically inaccessible, whereas wide and flat regions can be found efficiently despite being relatively rare. At zero temperature this picture has been formalized in binary perceptrons through the overlap gap property (OGP), which limits algorithmic access to configurations with zero training error above a critical constraint density $\\alpha_{\\rm OGP}$. Here we extend this description to finite temperature, where a positive training error is allowed and statistically penalized. We first show that the frozen one-step replica-symmetry-breaking solution, dominating the zero temperature equilibrium measure, survives at any finite temperature. We furthermore derive a general criterion, based on the smoothness of the single-pattern Gibbs weight near the decision boundary, that determines when a finite-temperature relaxation of the loss removes freezing. We then extend the OGP construction to finite temperature and show that dense, algorithmically accessible regions of finite-energy configurations persist beyond $\\alpha_{\\rm OGP}$, up to a threshold $\\alpha_{\\rm OGP}(\\epsilon)$ that grows with the allowed training error $\\epsilon$. Finally, in the teacher-student setting, we show that these wide, finite-energy regions still retain good generalization. Using a finite energy message-passing algorithm, we demonstrate numerically that thermal noise enables effective generalization in the regime of constraint densities where both recovering the teacher and finding a zero temperature solution are computationally hard.", "url": "https://arxiv.org/abs/2607.27000", "type": "理论+数值", "summary": "1. 该工作将交叠间隙性质(OGP)与冻结一步复制对称破缺解扩展至有限温度，并给出了基于单样本Gibbs权重在决策边界处光滑性的判据。\n2. 其核心在于揭示热噪声在允许训练误差ε时，算法可访问的有限能量密集解区域远超零温OGP阈值α_OGP，且在teacher-student情境下保持良好泛化。\n3. 这暗示热噪声可突破非凸神经网络中零温计算困难导致的优化瓶颈，为设计利用热涨落实现高效泛化的算法提供了原则性指导。", "summary_source": "deepseek", "authors": [{"name": "Enrico M. Malatesta"}, {"name": "Alessandra Passalacqua"}, {"name": "Riccardo Zecchina"}], "featured_authors": [{"name": "Enrico M. Malatesta"}, {"name": "Alessandra Passalacqua"}, {"name": "Riccardo Zecchina"}], "author_count": 3}, {"id": "2607.27061", "category": "cond-mat", "title": "Neural variational framework for random Young-diagram limit shapes", "abstract": "We develop a structure-preserving neural variational framework for random Young-diagram ensembles, with representations adapted to the structure and scaling of each measure. The method is validated on the Plancherel, uniform, minimal-difference, and fixed-\\(q\\) \\(q\\)-Plancherel ensembles, using known asymptotic profiles only for post-training comparison. We then study a quartically deformed hook-length ensemble without assuming an analytical saddle shape. Large-\\(n\\) neural profiles are compared with finite-size MAP profiles obtained from exact-action searches and with mean profiles obtained from corner-transfer Metropolis--Hastings sampling. Increasing the deformation suppresses the leading rows and broadens the support, while the neural, discrete, and sampled mean profiles agree at the percent level. These results provide numerical evidence for a deformation-dependent macroscopic saddle family.", "url": "https://arxiv.org/abs/2607.27061", "type": "数值", "summary": "1. 该工作发展了随机Young图系综的保结构神经变分框架，其表征适应各测度的结构与标度。\n2. 无需解析鞍点假设，大n神经轮廓与精确MAP轮廓及Metropolis-Hastings采样平均轮廓在百分数级别一致，揭示了形变依赖的宏观鞍族。\n3. 结果为研究复杂系综极限形状及非微扰效应提供了数值证据，并为统计推断与组合概率的交叉领域铺路。", "summary_source": "deepseek", "authors": [{"name": "Qian Chen"}, {"name": "Bo-Xuan Ge"}], "featured_authors": [{"name": "Qian Chen"}, {"name": "Bo-Xuan Ge"}], "author_count": 2}, {"id": "2607.27067", "category": "cond-mat", "title": "A Degenerate Singlet-Triplet Qubit with All-Electrical Orthogonal Control", "abstract": "Singlet-triplet qubits offer an attractive encoding for semiconductor quantum computing, combining ancilla-free readout, reduced sensitivity to common-mode noise, and baseband voltage control. However, the Zeeman energy difference $\\Delta E_\\mathrm{Z}$ is typically fixed by local magnetic field gradients or $g$-factor inhomogeneities, leaving the exchange interaction $J$ as the only dynamically tunable parameter. This always-on $\\Delta E_\\mathrm{Z}$ precludes orthogonal control of the qubit's rotation axes and introduces unwanted state rotations during idling. Here we demonstrate all-electrical orthogonal control of a degenerate singlet-triplet (DST) qubit formed by two hole spins in a germanium double quantum dot. Exploiting the electrically tunable anisotropic $g$-factors of the two spins, we identify a regime where both $\\Delta E_\\mathrm{Z}$ and $J$ vanish, making the $S$ and $T_0$ states degenerate at the idle point. By applying only baseband voltage pulses, we independently control both $J$ and $\\Delta E_\\mathrm{Z}$, enabling fully orthogonal $Z$- and $X$-axis rotations. Randomized benchmarking yields an average physical single-qubit gate fidelity of 99.53\\% for a gate duration of approximately 100 ns. Finally, we electrically tune the degenerate point across a wide range of magnetic field orientations, enabling operation in a regime of enhanced coherence time and offering a route towards multi-qubit scaling under a shared global magnetic field.", "url": "https://arxiv.org/abs/2607.27067", "type": "理论", "summary": "1. 本工作实验实现了一种基于锗双量子点空穴自旋的简并单重态-三重态量子比特，并通过基带电压脉冲实现了全电正交控制。\n2. 其物理核心在于利用空穴自旋电可调的各向异性g因子，在交换作用J与塞曼能差ΔEZ同时为零的简并工作点，独立调控二者以实现正交的Z和X轴旋转。\n3. 随机基准测试显示平均单量子比特门保真度达99.53%（门时长约100 ns），且电调谐简并点可提升相干时间，为在共享全局磁场下实现多量子比特扩展提供了可行路径。", "summary_source": "deepseek", "authors": [{"name": "Phuong X. Nguyen"}, {"name": "Konstantinos Tsoukalas"}, {"name": "Jann H. Ungerer"}, {"name": "Julian Santen"}, {"name": "Valentin John"}, {"name": "Stefan D. Oosterhout"}, {"name": "Lucas Stehouwer"}, {"name": "Stefano Bosco"}, {"name": "Giordano Scappucci"}, {"name": "Menno Veldhorst"}, {"name": "Amir Yacoby"}], "featured_authors": [{"name": "Phuong X. Nguyen"}, {"name": "Konstantinos Tsoukalas"}, {"name": "Jann H. Ungerer"}, {"name": "Giordano Scappucci"}, {"name": "Menno Veldhorst"}, {"name": "Amir Yacoby"}], "author_count": 11}, {"id": "2607.27079", "category": "cond-mat", "title": "Twist-driven helical flattening in nematic elastomer cylinders", "abstract": "Liquid Crystal elastomers (LCEs) deform anisotropically along a prescribed nematic director field, making them promising candidates for programmable shape change. Existing studies have primarily focused on either director patterns on flat sheets or simple patterns on curved geometries, leaving the case of a non-trivial director on a non-trivial geometry still largely unexplored. Many biological systems, however, have both complex geometries and complex helical fiber architectures. To explore the interplay between director and underlying geometry, we use a non-Euclidean plate theory for nematic elastomers with a through-thickness twisted director to develop an effective 2D model. With a fixed twist angle, our model shows an anomalous coupling between mid-surface curvature and director twist. This emergent term arises from the interplay between orientational order and elasticity, and dominates traditional bending contributions. To illustrate the general theory, we study the stability of cylindrical shapes with through-thickness twist. We find that the cylinder is unstable to a long-wavelength helical flattening mode and determine the critical parameter for the onset of instabilities.", "url": "https://arxiv.org/abs/2607.27079", "type": "理论", "summary": "1. 该工作通过非欧几里得板理论构建有效二维模型，研究了液晶弹性体圆柱体在厚度方向扭曲指向矢下的稳定性与形貌转变。\n2. 其核心在于揭示指向矢扭转与中曲面曲率之间的反常弹性耦合项，该耦合源于取向序与弹性的相互作用并主导传统弯曲贡献。\n3. 这为理解生物系统中复杂几何与螺旋纤维结构共同驱动的形状不稳定性提供了理论框架，并启发了可编程形变材料的设计。", "summary_source": "deepseek", "authors": [{"name": "Alexia Chatzitheodorou"}, {"name": "Christian D. Santangelo"}], "featured_authors": [{"name": "Alexia Chatzitheodorou"}, {"name": "Christian D. Santangelo"}], "author_count": 2}, {"id": "2607.27086", "category": "cond-mat", "title": "Angular Momentum Transfer in Magnetic Weyl Semimetal Spheres", "abstract": "In this work, we investigate the problem of electromagnetic angular momentum within the framework of topological materials, described by axion electrodynamics. Specifically, we calculate the electromagnetic angular momentum for a spherical sample of magnetic Weyl semimetal in the presence of a point charge. We then analyze how, by moving the point charge quasi-statically, the angular momentum stored in the electromagnetic field can be converted into mechanical angular momentum of the sphere. Finally, we derive analytical expressions for the resulting angular velocity and angular displacement, demonstrating that the effect is enhanced in the Weyl semimetal compared with a topological insulator.", "url": "https://arxiv.org/abs/2607.27086", "type": "理论", "summary": "1. 该工作基于轴子电动力学框架，计算了磁性Weyl半金属球体在点电荷下的电磁角动量，并解析推导了准静态移动点电荷时球体获得的机械角速度与角位移。\n2. 其核心在于揭示了Weyl半金属中轴子项对电磁角动量向机械角动量转化的增强机制，相较于拓扑绝缘体效应更显著。\n3. 这为利用拓扑材料实现电磁角动量与机械运动的可控转换提供了理论依据，并启发相关实验在Weyl半金属中验证该效应。", "summary_source": "deepseek", "authors": [{"name": "Adriano Biondo"}, {"name": "Francesco M. D. Pellegrino"}], "featured_authors": [{"name": "Adriano Biondo"}, {"name": "Francesco M. D. Pellegrino"}], "author_count": 2}, {"id": "2607.27104", "category": "cond-mat", "title": "Dual Enhancement of Superconductivity in FeSe/SrTiO3 via Orbital and Correlation Synergy", "abstract": "In iron-based superconductors, the dz2 orbital band typically resides far below the Fermi level and has not been considered to participate in Cooper pairing. Here, using monolayer FeSe/SrTiO3 as a model system, we demonstrate that tip-induced tensile strain controllably shifts the dz2 band toward the Fermi level, driving a two-stage enhancement of superconductivity. In-plane lattice expansion first enhances electronic correlation, amplifying superconductivity in the initial stage. As strain further increases, the upward-shifted dz2 band hybridizes with the dxy band, reconstructing the pairing-active d-orbital bands and inducing a secondary, stronger gap enhancement. Collectively, these two stages enlarge the superconducting gap from 17.8 to 23.6 meV. Throughout this process, invariant Fermi wave vectors confirm that the enhancement originates from band renormalization and reconstruction rather than carrier doping. Our work establishes a route to tailor superconducting states via strain-activated electronic correlations and band engineering, and reveals a previously unrecognized orbital-selective pairing mechanism with broad implications for correlated multiband superconductors.", "url": "https://arxiv.org/abs/2607.27104", "type": "理论", "summary": "1. 该工作以单层FeSe/SrTiO3为平台，通过针尖诱导拉伸应变实现面内晶格膨胀，先增强电子关联放大超导性，再使dz2带向费米能级移动并与dxy带杂化重构配对轨道，驱动两阶段超导增强，能隙从17.8扩增至23.6 meV。\n2. 其核心卖点在于不变费米波矢排除载流子掺杂贡献，证实超导增强源自能带重整化与轨道重构，从而揭示出轨道选择性配对这一先前未被认识的机制。\n3. 这为通过应变协同调控电子关联与轨道杂化以定制关联多带超导体的超导态提供了新原理，对理解铁基超导配对机制具有广泛启示。", "summary_source": "deepseek", "authors": [{"name": "Guihao Jia"}, {"name": "Jingming Yan"}, {"name": "Yucong Peng"}, {"name": "Shendong Su"}, {"name": "Pei Ouyang"}, {"name": "Xiaopeng Hu"}, {"name": "Qi-Kun Xue"}, {"name": "Wei Li"}], "featured_authors": [{"name": "Guihao Jia"}, {"name": "Jingming Yan"}, {"name": "Yucong Peng"}, {"name": "Xiaopeng Hu"}, {"name": "Qi-Kun Xue"}, {"name": "Wei Li"}], "author_count": 8}, {"id": "2607.27112", "category": "cond-mat", "title": "Interaction-induced sign reversal of the orbital magnetic susceptibility in Chern insulators", "abstract": "It has been well established that the orbital magnetization of interacting electrons can be simply evaluated by applying the single-particle formula to self-consistent HF bands. However, we show that such procedure fails qualitatively for orbital magnetic susceptibility, especially in topological systems: in a Chern-insulating phase of twisted MoTe$_2$, the interaction-induced correction reverses the sign of the susceptibility. This result follows from an algebraic framework that solves the HF problem at finite magnetic field, where noncommuting canonical momenta obstruct a direct calculation: a \\emph{reverse Peierls substitution} maps every magnetic-translation-invariant operator to a unique bivariate function, converting the finite-field self-consistency into a function equation that can be expanded systematically in $B$. At first order, this yields a linear equation for the field-induced change $\\delta X$ of the Fock potential, leading to an intrinsically interaction-induced susceptibility in addition to a single-particle-like one. The framework reproduces the Středa formula for insulators, and an auxiliary-Hilbert-space construction carries it to periodic and moiré systems. Finite-field HF calculations in a gapped Dirac model and in the twisted-MoTe$_2$ Chern insulator confirm the theory quantitatively.", "url": "https://arxiv.org/abs/2607.27112", "type": "理论+数值", "summary": "1. 该工作揭示陈绝缘体中轨道磁化率符号可由相互作用诱导反转，并建立有限磁场下自洽HF问题的代数框架。\n2. 技术关键在于反向Peierls替换将磁平移不变算符映射成双变量函数，使自洽方程化为B的级数展开，一阶线性方程给出本征相互作用贡献的磁化率。\n3. 该框架统一导出绝缘体Středa公式并推广至周期与moire体系，为拓扑材料中相互作用调制磁响应的理论研究提供新工具。", "summary_source": "deepseek", "authors": [{"name": "Ke Huang"}, {"name": "Xiao Li"}], "featured_authors": [{"name": "Ke Huang"}, {"name": "Xiao Li"}], "author_count": 2}, {"id": "2607.27156", "category": "cond-mat", "title": "Direct minimization versus iterative embedding in the ghost-Gutzwiller method: a comparative study of magnetism in Mott insulators", "abstract": "Accurately describing a hypothetical symmetry-invariant Mott insulator presents a long-standing ing challenge in iterative quantum embedding methods. We address this issue within the ghost- Gutzwiller method, which can be solved either through an iterative embedding scheme, analogous to dynamical mean-field theory, or by directly minimizing its variational energy functional. Across the Mott transition of the single-band Hubbard model, these formally equivalent approaches behave very differently: the iterative scheme is computationally efficient but fragile, necessitating ad-hoc recipes in the Mott phase that fail in a Zeeman field, leading to a discontinuous energy and a spurious fully-polarized
