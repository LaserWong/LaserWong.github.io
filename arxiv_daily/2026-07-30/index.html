insulator. Direct minimization avoids these artifacts, stabilizing a genuinely paramagnetic solution. Conversely, when symmetry breaking is allowed, as in an antiferromagnetic phase, the iterative scheme yields the correct solution, closely aligning with dynamical mean-field theory. Our findings delineate the conditions under which the iterative embedding can be trusted and when direct minimization is instead required.", "url": "https://arxiv.org/abs/2607.27156", "type": "理论+数值", "summary": "1. 该工作比较了鬼-古兹维勒方法中直接最小化与迭代嵌入两种求解方案，针对莫特绝缘体中的磁性行为。\n2. 迭代方案在塞曼场下顺磁莫特相时出现能量不连续和虚假全极化绝缘体，而直接最小化避免了这些伪影。\n3. 这明确了迭代嵌入在对称性破缺时可信，而直接最小化在需要精确顺磁解时必要。", "summary_source": "deepseek", "authors": [{"name": "Antonio Maria Tagliente"}, {"name": "Ivan Pasqua"}, {"name": "Michele Fabrizio"}], "featured_authors": [{"name": "Antonio Maria Tagliente"}, {"name": "Ivan Pasqua"}, {"name": "Michele Fabrizio"}], "author_count": 3}, {"id": "2607.26124", "category": "hep-th", "title": "Gravitational Waves from Multiple Cosmic Superstrings and the Overshoot Problem", "abstract": "Post inflationary string cosmology can feature an initial population of multiple species of cosmic superstrings whose tension is controlled by a modulus rolling over a steep potential toward a late-time minimum. We perform a full analysis of the associated dynamical system, finding that overshooting the minimum is prevented by the friction of a radiation background of gravitational waves produced from the early decay of effective strings arising from NS5- and D3-branes wrapped around internal cycles. On the other hand, fundamental strings survive longer and decay when the modulus is oscillating around the minimum and they have about $1/3$ of the total energy density. The spectrum of gravitational waves generated by the decays of these multiple cosmic superstrings, even if diluted by a late epoch of modulus domination, can still result in a high-frequency, multi-peaked signal, offering an observational signature of generic features of string theory.", "url": "https://arxiv.org/abs/2607.26124", "type": "理论", "summary": "1. 该工作分析了暴胀后多种宇宙超弦（张力由滚动至最小值的模场控制）的完整动力学系统，发现NS5和D3膜包裹内循环产生的有效弦早期衰变所释放的引力波辐射摩擦阻止了模场过冲最小值。\n2. 其物理卖点在于揭示基本弦存活更久并在模场振荡时衰变，贡献约1/3总能量密度，且多弦衰变产生的引力波谱即使经模场主导时期稀释仍呈现高频多峰结构。\n3. 这为弦论的一般特征提供了可观测的高频引力波印记，启发后续对后暴胀弦宇宙学中模场动力学与多弦衰变过程的进一步理论与实验探索。", "summary_source": "deepseek", "authors": [{"name": "Luca Brunelli"}, {"name": "Michele Cicoli"}, {"name": "Muhammad Hassan"}, {"name": "Seyed Ehsan Qoreishi"}, {"name": "Francisco Gil Pedro"}], "featured_authors": [{"name": "Luca Brunelli"}, {"name": "Michele Cicoli"}, {"name": "Muhammad Hassan"}, {"name": "Seyed Ehsan Qoreishi"}, {"name": "Francisco Gil Pedro"}], "author_count": 5}, {"id": "2607.26126", "category": "hep-th", "title": "Iterative Gauging is Deconstruction", "abstract": "A recent construction showed that iteratively gauging symmetries of a quantum field theory can generate an emergent extra spatial dimension. Here we identify the precise mechanism underlying this phenomenon: it is dimensional deconstruction, the procedure by which an extra dimension is encoded in the structure of a quiver gauge theory. We demonstrate this by showing that the standard deconstruction action, upon dualizing the Goldstone fields on the Higgs branch, is exactly equivalent to the action produced by iterative gauging. The dictionary is transparent: quiver nodes correspond to gauge fields, and quiver links correspond to the gauge fields introduced to couple to magnetic symmetries. We further show that starting by gauging the electric rather than the magnetic symmetry produces the deconstructed theory written in the dual variables, with all coupling constants inverted.", "url": "https://arxiv.org/abs/2607.26126", "type": "理论", "summary": "1. 该工作证明迭代规范量子场论对称性等价于维度解构，从而产生额外空间维度。\n2. 其核心机制在于通过对偶化希格斯支上的戈德斯通场，使迭代规范作用量与标准解构作用量完全等价。\n3. 这建立了规范场与解构理论中节点和链接的明确对应，并为基于对称性规范构建额外维度提供了系统框架。", "summary_source": "deepseek", "authors": [{"name": "Sebastian Franco"}, {"name": "Diego Rodriguez-Gomez"}], "featured_authors": [{"name": "Sebastian Franco"}, {"name": "Diego Rodriguez-Gomez"}], "author_count": 2}, {"id": "2607.26140", "category": "hep-th", "title": "CasimirRFM: A Mathematica package for Riemann-flat compactifications with Casimir energies", "abstract": "CasimirRFM is a Mathematica package for the study of compactifications on Riemann-flat manifolds and the computation of one-loop Casimir energies in higher-dimensional field theories and supergravity. It implements an efficient numerical evaluation of lattice sums using Ewald summation, and computes both lower-dimensional Casimir potentials and local higher-dimensional Casimir energy densities, allowing for general massless spectra and twisted boundary conditions. The package provides tools for constructing and analysing the finite groups defining these manifolds, determining invariant metrics and cohomology bases, identifying compatible spin structures, and computing moduli-space metrics. Moreover, it evaluates the traces of holonomy elements in the graviton, $p$-form, spinor, and Rarita-Schwinger representations. We describe the mathematical formulation and numerical implementation of the package, and illustrate its use through a compactification of Type IIB supergravity on $T^6/\\mathbb{Z}_8$, including the computation of the Casimir potential and the visualization of localised Casimir-brane contributions.", "url": "https://arxiv.org/abs/2607.26140", "type": "理论", "summary": "1. 该工作介绍了CasimirRFM，一个用于研究黎曼平坦流形紧致化并计算高维场论与超引力中单圈卡西米尔能量的Mathematica软件包。\n2. 其技术核心在于采用Ewald求和高效数值评估晶格求和，支持一般无质量谱与扭曲边界条件下低维卡西米尔势与局域高维能量密度的计算，并提供流形有限群分析工具。\n3. 这为探索额外维度紧致化中卡西米尔效应及其对有效势的贡献提供了标准化计算平台，可推广至更多超引力与弦紧致化模型。", "summary_source": "deepseek", "authors": [{"name": "Bruno Valeixo Bento"}], "featured_authors": [{"name": "Bruno Valeixo Bento"}], "author_count": 1}, {"id": "2607.26194", "category": "hep-th", "title": "Toward an Observable Algebra for JT-de Sitter Space: Gap Protection and Modular Dressings", "abstract": "We investigate the relation between fundamental complements and regional operator algebras in global de Sitter space. For a finite union of open arcs on the time-symmetric circle of global dS$_2$, we show that the fundamental complement is determined by the largest complementary gap: a gap contributes precisely when its angular length is at least {\\pi}, and at most one gap can do so. In higher-dimensional global de Sitter space, the corresponding criterion is containment of an open hemisphere. We then study the operator-algebraic consequences in an abstract Möbius-covariant chiral conformal net. Each regional algebra is crossed with its vacuum modular flow using a shared auxiliary clock. We derive an exact criterion for inclusions between the resulting continuous cores and show that vacuum correlations obstruct this criterion when the larger region contains an additional spacelike arc. A compatible family can nevertheless be obtained on the finite Boolean algebra generated by a fixed collection of separated arcs by using a split product state. Motivated by the holograms prescription of Bousso and Penington, we introduce a representation-dependent commutant model for regional algebras. When the protected gap overlaps a fixed reference arc, the assigned algebra is a proper von Neumann subalgebra of the reference Type-II$_1$ factor. For an explicit two-arc family, adding an arbitrarily short antipodal component removes the fundamental complement and changes the assigned algebra discontinuously to the full reference algebra.", "url": "https://arxiv.org/abs/2607.26194", "type": "理论", "summary": "1. 本文研究全局de Sitter时空中基本补集与区域算子代数的关系，并构造JT-de Sitter空间的可观察代数方案。\n2. 其核心发现是基本补集由最大互补间隙决定（角长度至少π），间隙保护导致区域代数在添加反对极分量时发生不连续变化。\n3. 这为理解德西特时空的代数全息原理及观察者依赖性提供了关键机制，并启发了模修饰与分裂乘积态的应用。", "summary_source": "deepseek", "authors": [{"name": "Hassan ElSayed"}], "featured_authors": [{"name": "Hassan ElSayed"}], "author_count": 1}, {"id": "2607.26197", "category": "hep-th", "title": "Intersection Bounds for BPS Strings in Six-Dimensional Supergravity", "abstract": "In six-dimensional $\\mathcal{N}=(1,0)$ supergravity, the structure of tensor moduli space is governed by primitive BPS string charges known as BPS generators and their intersection pairing. We derive bounds on the intersection numbers of these generators from a purely effective field theory (EFT) perspective. Although gauge anomaly cancellation constrains intersections between generators supporting gauge algebras, bounds for E-strings intersecting generators with self-intersection numbers $-2$ and $-3$ have previously remained incomplete. We show that the Zariski decomposition, interpreted as the charge lattice counterpart of the attractor mechanism, together with current algebra embeddings on the E-string worldsheet theory, yields strong universal bounds on these intersection numbers. These results establish the finiteness of tensor charge intersection numbers up to duality. The underlying structure was identified through AI-guided investigation and is proven here analytically using EFT arguments.", "url": "https://arxiv.org/abs/2607.26197", "type": "理论", "summary": "1. 从有效场论出发推导了六维N=(1,0)超引力中基本BPS弦荷生成元相交数的一般界限。\n2. 通过将Zariski分解解读为荷格中的吸引子机制，并结合E弦世界sheet流代数嵌入，补全了自交数-2和-3情形的通用约束。\n3. 这些结果确立了张量荷相交数在对偶下的有限性，并展示了AI引导发现与解析EFT证明的协同验证路径。", "summary_source": "deepseek", "authors": [{"name": "Hee-Cheol Kim"}, {"name": "Kai Xu"}], "featured_authors": [{"name": "Hee-Cheol Kim"}, {"name": "Kai Xu"}], "author_count": 2}, {"id": "2607.26319", "category": "hep-th", "title": "Nucleon spectra and wave functions from holographic models with dual Einstein-dilaton and Starobinsky-dilaton gravities", "abstract": "We study the nucleon spectra in two holographic set-ups: Einstein-dilaton and Starobinsky-dilaton gravity models. The Einstein-dilaton holographic model, also known as improved holographic QCD, have been proposed some time ago to describe confinement and glueball spectra. Recently, it has been applied to the case of mesons and nucleons. In this work, we reconsider the Einstein-dilaton holographic model to discuss the nucleon spectra introducing new parameters that allow us to improve the comparison with experimental data. Then, we extend this idea to the context of Starobinsky-dilaton gravity defining another improved holographic model. We use this new holographic model to reanalyse the nucleon spectra and also compare them with soft-wall model and experimental data.", "url": "https://arxiv.org/abs/2607.26319", "type": "理论", "summary": "1. 该工作利用爱因斯坦-膨胀子和Starobinsky-膨胀子两种全息引力模型，重新分析了核子谱与波函数。\n2. 通过引入新参数优化全息模型，实现了对核子激发态谱与实验数据的更精确拟合，并扩展至改进的Starobinsky-膨胀子全息框架。\n3. 这为全息QCD中核子结构的描述提供了可调节的理论工具，并有助于与软墙模型及实验谱学进行系统对比。", "summary_source": "deepseek", "authors": [{"name": "Adão S. da Silva Junior"}, {"name": "Juan M. Z. Pretel"}, {"name": "Henrique Boschi-Filho"}], "featured_authors": [{"name": "Adão S. da Silva Junior"}, {"name": "Juan M. Z. Pretel"}, {"name": "Henrique Boschi-Filho"}], "author_count": 3}, {"id": "2607.26343", "category": "hep-th", "title": "D-branes and nonlinear interactions in the $AdS$ pure spinor string", "abstract": "We develop a coordinate-independent algebraic description of zero-field boundary conditions for the pure spinor string on $AdS_5\\times S^5$ in the closed-string channel. The construction is organized by involutive automorphisms of $\\mathfrak{psu}(2,2|4)$ that exchange the odd sectors of the $\\mathbb Z_4$ grading. Their fixed subalgebras provide candidate half-BPS, Lorentzian D-brane geometries with vanishing background world-volume flux, consistent with the standard $AdS_2$, $AdS_3\\times S^1$, $AdS_4\\times S^2$, and related embeddings. Together, the seven representatives realize the Lorentzian zero-flux D1, D3, D5, and D7 probe sectors considered here. We then construct a local ansatz for the matter and ghost boundary interactions and derive a system of consistency equations for the tangential superconnection, transverse embedding, and four ghost-gluing couplings. The resulting system is a set of Dirac-Born-Infeld-like equations of motion on the brane world-volume.", "url": "https://arxiv.org/abs/2607.26343", "type": "理论", "summary": "1. 该工作基于纯旋量弦的AdS背景闭弦通道，发展了零场边界条件的坐标无关代数描述，通过psu(2,2|4)的对合自同构给出half-BPS洛伦兹D膜候选几何。\n2. 核心创新在于构造物质与鬼边界相互作用的局部ansatz，导出切向超联络、横向嵌入及四个鬼胶合耦合满足的Dirac-Born-Infeld型一致方程组。\n3. 这为AdS/CFT对应中D膜的非线性动力学和边界相互作用提供了代数化分析框架，可推广至带通量背景的边界条件研究。", "summary_source": "deepseek", "authors": [{"name": "Brenno Carlini Vallilo"}], "featured_authors": [{"name": "Brenno Carlini Vallilo"}], "author_count": 1}, {"id": "2607.26415", "category": "hep-th", "title": "Generalized Bergshoeff-de Roo identification in the Supergravity frame", "abstract": "The effective action of string theory has a highly constrained structure due to the numerous symmetries of the underlying theory. Recently, a method known as the Generalized Bergshoeff-de Roo identification was developed, which exploits diffeomorphism, Lorentz and gauge invariance, along with T-duality, to derive higher-derivative couplings in the effective action within the framework of Double Field Theory. This method has been revisited and further refined to generate couplings directly within the standard Supergravity framework.", "url": "https://arxiv.org/abs/2607.26415", "type": "理论", "summary": "1. 该工作将广义Bergshoeff-de Roo等同性方法从双场理论扩展到标准超引力框架，用于直接生成弦理论有效作用量中的高阶导数耦合。\n2. 其技术要点在于联合利用微分同胚、洛伦兹、规范不变性与T对偶对称性，确保导出耦合的结构与底层对称性严格自洽。\n3. 这为在超引力中系统化地构建弦理论高阶修正，以及统一描述对称性约束下的有效作用量提供了直接途径。", "summary_source": "deepseek", "authors": [{"name": "Walter H. Baron"}, {"name": "Fabian A. Portilla"}], "featured_authors": [{"name": "Walter H. Baron"}, {"name": "Fabian A. Portilla"}], "author_count": 2}, {"id": "2607.26532", "category": "hep-th", "title": "Massive and massless particles in Mielke--Baekler geometries", "abstract": "The Mielke--Baekler geometries are three-dimensional reductive homogeneous spacetimes together with a choice of invariant connection which is compatible with a lorentzian metric. The spacetimes generalise Minkowski and (anti)de~Sitter spacetimes in that the invariant metric connection can have torsion, a peculiarity of three dimensions. Using coadjoint orbits and the techniques of nonlinear realisations, we construct worldline actions for massive and massless spinning particles moving in these spacetimes. We pay particular attention to the so-called teleparallel branch, in which the curvature of the invariant connection vanishes. Apart from the trivial Minkowski case, this singles out anti-de~Sitter spacetime, as the only of these lorentzian manifolds admitting an invariant Weitzenböck connection; that is, a flat connection with torsion. The introduction of a Wess--Zumino term describing spin has, as a main consequence, the appearance of dynamical sectors (denoted ``regular'' and ``critical''), with a different number of physical degrees of freedom. In particular, in the massive case, we discuss the formulation of the dynamics in terms of either the Weitzenböck or the Levi-Civita connection, and the emergence of a Papapetrou-type forcing term in the critical sector. For the massless particle we study the Noether symmetries of the action, which, for the spinless case, include the conformal transformations. For nonzero spin, only the Killing subset survives as genuine Noether transformations in the regular sector, while in the critical sector any conformal Killing contribution can be set to zero by a gauge transformation.", "url": "https://arxiv.org/abs/2607.26532", "type": "理论", "summary": "1. 采用coadjoint轨道和非线性实现技术，为Mielke-Baekler几何中有质量与无质量自旋粒子构造了世界线作用量。\n2. 卖点在于自旋的Wess–Zumino项导致正则与临界两个动力学扇区，临界扇区在平坦有挠联络下出现Papapetrou型力项，且无质量粒子的Noether对称性因自旋而从共形缩减为Killing子集。\n3. 这为挠率时空中的粒子动力学与对称性分析提供了统一框架，并揭示了带挠反德西特时空作为唯一容许Weitzenböck联络的非平凡背景。", "summary_source": "deepseek", "authors": [{"name": "Carles Batlle"}, {"name": "Roberto Casalbuoni"}, {"name": "Daniele Dominici"}, {"name": "José Figueroa-O'Farrill"}, {"name": "Joaquim Gomis"}], "featured_authors": [{"name": "Carles Batlle"}, {"name": "Roberto Casalbuoni"}, {"name": "Daniele Dominici"}, {"name": "José Figueroa-O'Farrill"}, {"name": "Joaquim Gomis"}], "author_count": 5}, {"id": "2607.26535", "category": "hep-th", "title": "Static topological dilatonic black hole with multiple horizons and its thermodynamics", "abstract": "We obtain a static topological charged black hole solution within Einstein-dilaton theory with nonlinear electromagnetic field represented by an infinite series over Maxwell field invariant. In contrast with standard Einstein-Maxwell-dilaton (EMD) theory where the black hole might have no more than two horizons, the nonlinear generalization might give rise to a solution with arbitrary number of horizons. We examine energy conditions and show that for the nonlinear electromagnetic field itself all the energy conditions are fulfilled outside of the black hole, whereas for the dilaton field the only condition which is not violated outside is the Null Energy Condition (NEC). We also study thermodynamics of the black hole and show that the thermal behaviour of the solution is considerably richer than for its standard EMD cousin. To have complete description of the thermodynamics we also use the Euclidean method, which allows us to consider the so-called Grand Canonical and Canonical Ensembles. The results obtained by different approaches show their consistency. The Euclidean description naturally allowed us to consider global stability, which is shown to have some common features with standard EMD solution, or even Reissner-Nordström black hole. But there some new peculiarities caused by the nonlinear field, namely we might have additional stable phases and a triple point. To examine near critical behaviour we consider the extended phase space approach, where the cosmological constant is supposed to be a thermodynamic variable. Making use of the extended formalism we also obtain the Smarr relation.", "url": "https://arxiv.org/abs/2607.26535", "type": "理论", "summary": "1. 该工作获得了爱因斯坦-标量-非线性电磁理论中具有任意数目视界的静态拓扑带电黑洞解，并利用欧几里得方法与拓展相空间系统研究了其热力学性质与全局稳定性。\n2. 其物理卖点在于非线性电磁场以麦克斯韦场不变量的无穷级数表征，使黑洞可突破标准EMD理论的两视界限制，且标量场仅满足零能量条件而电磁场满足全部能量条件。\n3. 该解的热力学行为展现出更丰富的相结构，包括额外稳定相、三临界点以及自洽的斯码关系，为非线性电磁引力系统中多视界黑洞的完全热力学描述提供了新范例。", "summary_source": "deepseek", "authors": [{"name": "M. M. Stetsko"}], "featured_authors": [{"name": "M. M. Stetsko"}], "author_count": 1}, {"id": "2607.26868", "category": "hep-th", "title": "World-Line Actions in Weyl Geometry", "abstract": "In this note we construct, from a gauge theory perspective, the world-line action for a particle moving on a time-like curve in Weyl geometry. The action we find is dimensionless, Weyl invariant, additive and, in general, non-local due to an open Wilson line which we have to add in order to account for a general Weyl field. In special cases, this Wilson line can be local, but the geometry becomes integrable. The action can not be used to measure the proper time as it is dimensionless and no mass parameter is allowed in the symmetric phase of the theory. We show that the usual conditions for defining proper time: affine parametrization, dimension of time and additivity supplemented by the requirement of Weyl invariance can not be fulfilled simultaneously and therefore no satisfactory notion of proper time exists in the symmetric phase. Under spontaneous symmetry breaking the particle acquires a mass, the action becomes Riemannian and the proper time can be again defined. We also construct a classically equivalent quadratic action by using an einbein on the world-line and show that the non-locality can be seen to arise from integrating out a constrained field.", "url": "https://arxiv.org/abs/2607.26868", "type": "理论", "summary": "1. 该工作从规范理论视角构造了Weyl几何中粒子沿类时曲线运动的世界线作用量，并分析了其无量纲、Weyl不变、可加及一般非局域等性质。\n2. 其核心卖点在于证明对称相中无法同时满足定义固有时所需的仿射参数化、时间维度、可加性与Weyl不变性，而非局域性源于对约束场的积分。\n3. 这为理解Weyl几何中时间概念的缺失与自发对称破缺后黎曼几何及固有时恢复的机制提供了启发，并关联到规范理论中的Wilson线解释。", "summary_source": "deepseek", "authors": [{"name": "Cezar Condeescu"}, {"name": "Andrei Micu"}], "featured_authors": [{"name": "Cezar Condeescu"}, {"name": "Andrei Micu"}], "author_count": 2}, {"id": "2607.26919", "category": "hep-th", "title": "Quantum Fisher information of the Klein--Gordon, $ϕ^4$, and Dirac vacua", "abstract": "The quantum Fisher information (QFI) of the vacuum of three quantum field theories is evaluated with respect to the mass parameter of each theory. All field theories are considered on a $(d+1)$-dimensional Euclidean spacetime. We consider the Klein-Gordon field, a quartic interaction ($\\phi^4$) field theory, and the free Dirac field. In the case of the quartic interaction theory, the QFI is given perturbatively to first order in the interaction constant. For the free KG case, we find a $m^{d-2}$ dependence of the QFI, and thus no dependence for $d=2$, in agreement with the holographic duality characterizing the theory. The introduction of a quartic interaction is shown to lead to a QFI divergence in $d=3$ and to reduce the available information in the $d=0$ system. The vacuum QFI with respect to the free Dirac field mass is shown to be UV-divergent for $d=2$ and $d=3$, mass-dependent for $d=1$, and zero for $d=0$.", "url": "https://arxiv.org/abs/2607.26919", "type": "理论", "summary": "1. 该工作计算了Klein-Gordon、ϕ⁴和自由Dirac真空关于质量参数的量子Fisher信息（QFI），并考察了时空维度d的影响。\n2. 关键发现包括：自由KG真空QFI呈m^{d-2}依赖且d=2时为零，与全息对偶一致；四次相互作用在d=3引入发散并缩减d=0信息；Dirac真空QFI在d=2,3为紫外发散，d=1质量相关，d=0为零。\n3. 这揭示了场论真空信息度量对维度和相互作用的敏感依赖，为量子信息与量子场论真空结构及全息对偶的交叉提供了量化视角。", "summary_source": "deepseek", "authors": [{"name": "Preslav Asenov"}, {"name": "Alessio Serafini"}], "featured_authors": [{"name": "Preslav Asenov"}, {"name": "Alessio Serafini"}], "author_count": 2}, {"id": "2607.26931", "category": "hep-th", "title": "Extended Phase Space Thermodynamics and Joule-Thomson Expansion of Regular AdS Black Holes in a String Cloud", "abstract": "We investigate the extended phase space thermodynamics of a static, spherically symmetric regular black hole immersed in a string cloud background. By identifying the negative cosmological constant as a thermodynamic pressure, our analysis indicates that the quantum-inspired regularizing core and the string cloud density significantly affect the thermal stability of the black hole. We specifically illustrate a stringent scale invariance linked to the regularizing core, while the dimensionless string cloud parameter substantially alters the universal Van der Waals critical compressibility ratio. The significant geometric inconsistencies result in computed critical exponents that align with those of mean-field theory. We specify the Joule-Thomson expansion to define the isenthalpic heating and cooling regimes, so providing a comprehensive thermodynamic characterization of this non-singular spacetime.", "url": "https://arxiv.org/abs/2607.26931", "type": "理论", "summary": "1. 该工作研究了弦云背景下静态球对称正则黑洞的扩展相空间热力学与焦耳-汤姆逊膨胀过程。\n2. 其主要物理卖点在于揭示了量子正则化核心的严格标度不变性，以及无量纲弦云参数对范德瓦尔斯临界压缩比的显著修正，且临界指数仍与平均场理论一致。\n3. 这为深入理解非奇异时空中的黑洞热力学相变与加热冷却行为提供了定性框架，并启发对引力系统中正则化效应与物质场耦合的进一步探究。", "summary_source": "deepseek", "authors": [{"name": "Y. Elaima"}, {"name": "A. Daassou"}, {"name": "H. Lekbich"}, {"name": "F. Oubbad"}], "featured_authors": [{"name": "Y. Elaima"}, {"name": "A. Daassou"}, {"name": "H. Lekbich"}, {"name": "F. Oubbad"}], "author_count": 4}, {"id": "2607.27133", "category": "hep-th", "title": "Quantum Field Theory Of Cosmological Perturbations Induced By Ultralight Dark Matter", "abstract": "The growth of primordial perturbations during the matter-dominated era is primarily driven by dark matter. Ultralight scalar fields (ULDM) are a promising candidate for this role, conventionally modeled as operating in a classical, high-occupation regime. In this work, we develop a first-principles field-theoretic framework to investigate the impact of ULDM on linear cosmological perturbations during matter domination, explicitly retaining its quantum nature. Deriving a closed equation for the graviton field dynamics, we compute and regularize its source terms for a generic Gaussian initial state of the ULDM field within the adiabatic (WKB) approximation, employing the middle-point working assumption for non-local terms. After gauge-fixing we find that, contrary to previous claims, the classical condensate of ULDM has no influence on gravitational wave propagation. However, the time-dependent graviton effective mass induced by quantum pressure of the squeezed state can drive parametric resonance in specific primordial gravitational wave modes. We demonstrate this growth is negligible for non-relativistic ULDM at matter-radiation equality under the assumption of a power-law squeezing spectrum for masses in the range $m \\sim 10^{-21}{-}10^{-24}$ eV.", "url": "https://arxiv.org/abs/2607.27133", "type": "理论", "summary": "1. 该文建立第一性原理量子场论框架，研究物质主导时期超轻标量暗物质对线性宇宙学扰动的量子效应，推导了引力子场封闭动力学方程并在绝热(WKB)近似下采用非局域项中点假设正则化了任意高斯初态源项。\n2. 与先前经典结论相反，规范固定后暗物质经典凝聚体对引力波传播无直接贡献，但挤压态量子压力诱导的时变引力子有效质量可驱动特定原初引力波模式参量共振，对非相对论性暗物质该共振在辐射-物质相等时可忽略。\n3. 在质量10^{-21}–10^{-24}eV且满足幂律挤压谱假设下，该文给出共振增长可忽略的定量条件，为未来宇宙学观测区分经典与量子暗物质的引力波签名提供了理论基准。", "summary_source": "deepseek", "authors": [{"name": "Tomislav Prokopec"}, {"name": "Marco Vecchioni"}], "featured_authors": [{"name": "Tomislav Prokopec"}, {"name": "Marco Vecchioni"}], "author_count": 2}, {"id": "2607.27190", "category": "hep-th", "title": "Quadratic Axion Couplings in String Theory", "abstract": "Axions and axion-like particles are a compelling candidate for physics beyond the standard model. While many axion searches are focused on the linear coupling to photons $\\theta F \\tilde{F}$, the possibility of a quadratic coupling to the electromagnetic kinetic term, $\\theta^2 F^2$, leads to novel phenomenology and new opportunities for testing axion-like particles. In this work we propose mechanisms for generating this coupling in string theory, which can be broadly classified as classical, perturbative, and non-perturbative. In benchmark examples, we find that both perturbative and non-perturbative quantum contributions such as instantons lead to couplings that are suppressed, $g \\ll 1$ in units of $1/f^2$ where $f$ is axion decay constant, though easily larger than analogous coupling of the QCD axion that is generated through loops of charged pions. These analyses suggest that quadratic axion couplings to gauge fields are ubiquitous in string theory, and should be taken seriously as a probe of the string theory axiverse, both of string theory candidates for dynamical axions, such as dark matter or dark energy, and for spectroscopy of the string theory axiverse.", "url": "https://arxiv.org/abs/2607.27190", "type": "理论", "summary": "1. 该工作提出了弦论中产生轴子与规范场二次耦合的经典、微扰及非微扰机制，并给出基准示例。\n2. 其关键在于发现微扰与非微扰（如瞬子）贡献导致的耦合压制在g≪1（单位1/f²，f为轴子衰变常数），但显著大于QCD轴子通过π介子圈生成的同类耦合。\n3. 这暗示二次耦合在弦论轴子多重宇宙中普遍存在，为通过此类耦合探测弦论候选轴子（如暗物质、暗能量）及轴子谱学提供了新途径。", "summary_source": "deepseek", "authors": [{"name": "Naman Agarwal"}, {"name": "Andrew R. Frey"}, {"name": "Ratul Mahanta"}, {"name": "Evan McDonough"}], "featured_authors": [{"name": "Naman Agarwal"}, {"name": "Andrew R. Frey"}, {"name": "Ratul Mahanta"}, {"name": "Evan McDonough"}], "author_count": 4}, {"id": "2607.26262", "category": "math-ph", "title": "The boundary-driven multispecies harmonic process", "abstract": "We introduce the multispecies version of the harmonic process on a one-dimensional chain in contact with boundary reservoirs. This process is a continuous-time Markov chain where each site can host an unbounded number of colored particles. The symmetric bulk dynamics is put in contact with reservoirs, which inject and remove particles driving the system out-of-equilibrium. The Markov generator of the process is identified with the integrable Hamiltonian of an open rational Heisenberg spin chain of higher rank. We derive the underlying R- and K-matrices in operator form and construct the double-row transfer matrix following Sklyanin. Similar to the monospecies case the R-matrix factorises into two R-operators, each factor corresponding to left and right moving particles. We further define three dual models: an absorbing particle model, a hidden parameter model and a heat conduction model.", "url": "https://arxiv.org/abs/2607.26262", "type": "理论", "summary": "1. 该工作引入一维链上受边界储层驱动的多物种谐和过程，并证明其马尔可夫生成元与高阶有理海森堡自旋链的可积哈密顿量等价。\n2. 核心在于导出算子形式的R与K矩阵，基于Sklyanin方法构造双行转移矩阵，并揭示R矩阵可因子化为对应左行和右行粒子的两个R算子。\n3. 这为多物种非平衡输运提供了可积精确求解框架，同时定义吸收粒子、隐参数及热传导三种对偶模型，启发相关可积边界问题的构造。", "summary_source": "deepseek", "authors": [{"name": "Francesco Casini"}, {"name": "Rouven Frassek"}, {"name": "Cristian Giardinà"}], "featured_authors": [{"name": "Francesco Casini"}, {"name": "Rouven Frassek"}, {"name": "Cristian Giardinà"}], "author_count": 3}, {"id": "2607.26331", "category": "math-ph", "title": "Quantum Turing Patterns", "abstract": "We construct quantum Turing patterns in Lindblad lattice dynamics and establish a rigorous theory of their nonlinear order and quantum fluctuations. For an explicit completely positive family with finite-range couplings, the first-moment equations undergo a supercritical instability at a nonzero wave number and admit analytic site- and bond-centered commensurate stripe branches. These branches are locally asymptotically stable in their reflection-fixed period-cell spaces, and projected coherent states exhibit extensive Bragg order on every bounded time interval in the semiclassical limit. We prove $O(N^{-1/2})$ convergence of microscopic covariances to a nonautonomous Gaussian Lyapunov flow, transferring strict partial-transpose uncertainty violations to sufficiently large $N$. In the homogeneous Gaussian sector, a single dimensionless ratio controls both the Turing stability determinant and the logarithmic negativity of opposite momenta, relating wavelength selection directly to quantum entanglement. Differential transport shifts the strongest opposite-momentum correlations from the infrared to the selected Turing scale. Numerical continuation and two-dimensional simulations display stripe, spot, and labyrinth morphologies whose Fourier modes and fluctuation spectra concentrate at the same selected wave numbers.", "url": "https://arxiv.org/abs/2607.26331", "type": "理论", "summary": "1. 该工作构建了有限程Lindblad晶格动力学中的量子图灵图案家族，并建立了其非线性超临界失稳与量子涨落的严格理论。\n2. 主要技术贡献包括：第一矩方程在非零波数处经历超临界分岔并解析产生晶格与键心条纹分支，具有反射周期胞空间中的局部渐近稳定性；投影相干态在半经典极限下于任意有界时间区间内呈现广延Bragg序；微观协方差矩阵以$O(N^{-1/2})$收敛至非自治高斯Lyapunov流，并由单一无量纲比直接联系图灵稳定性与反对称动量对数负性，使波长选择关联于量子纠缠。\n3. 这为开放量子多体系统中非平衡图案形成、纠缠结构及涨落谱的解析与数值研究提供了严格可处理的理论基础，并可直接推广至其他耗散动力学平台。", "summary_source": "deepseek", "authors": [{"name": "Kazuki Ikeda"}], "featured_authors": [{"name": "Kazuki Ikeda"}], "author_count": 1}, {"id": "2607.26394", "category": "math-ph", "title": "Towards First Quantisation Formalism for AKSZ Theories", "abstract": "\\noindent Given an AKSZ theory $\\mathbb{T}$ on a manifold $M$, with target a graded vector space $Y$, we formulate a 1-dimensional theory $\\mathbb{t}$ on graphs (the ``first quantisation picture for $\\mathbb{T}$''), whose partition functions reproduce the Feynman graphs of $\\mathbb{T}$. More precisely, the theory $\\mathbb{t}$ is itself a 1d AKSZ theory with the target built out of $M$, and involving a coupling to 1d supergravity. It yields a form on the space of metric graphs (with length $T$ of an edge and its de Rham differential $\\mathrm{d} T$ interpreted as the zero-modes of the graviton and gravitino, respectively); its integral yields the sum of Feynman graphs of $\\mathbb{T}$. We study the theory $\\mathbb{t}$ in the BV-BFV formalism; a gauge-fixing of $\\mathbb{T}$ corresponds to a gauge-fixing of $\\mathbb{t}$. At the classical level, $\\mathbb{t}$ assigns to vertices certain Lagrangian submanifolds $L_k$ in Cartesian powers $\\Phi^{\\times k}$ of the phase space $\\Phi$ of $\\mathbb{t}$. These submanifolds can be thought of as defining a cyclic $\\mathrm{L}_\\infty$-algebra in Weinstein's symplectic category (``dequantising'' the cohomological vector field on the target %target AKSZ dg structure of $\\mathbb{T}$). In the path integral construction of $\\mathbb{t}$, Lagrangians $L_k$ determine sewing conditions for fields on the incident edges at a $k$-valent vertex. We give examples of this paradigm, such as when $\\mathbb{t}$ on edges is the Witten-Morse supersymmetric quantum mechanics (which corresponds to a particular type of gauge-fixing for $\\mathbb{T}$ and $\\mathbb{t}$). In the example where $\\mathbb{T}$ is the non-abelian Chern--Simons theory with structure Lie algebra $\\mathfrak{su}(2)$, we describe the vertex Lagrangian $L_{\\mathrm{W}}$ (the ``Wigner Lagrangian'' ).", "url": "https://arxiv.org/abs/2607.26394", "type": "理论", "summary": "1. 该工作针对流形上的AKSZ理论，构造了图上一维AKSZ理论作为其第一量子化图像，其配分函数积分重现原理论的费曼图之和。\n2. 其技术核心将边的长度及微分解释为超引力零模，通过BV-BFV形式统一规范固定，并利用辛范畴中拉格朗日子流形定义循环L∞代数以编码顶点缝补条件。\n3. 这为AKSZ理论的量子化提供了辛几何框架，并启发了非阿贝尔Chern-Simons理论（如Wigner拉格朗日量）与超对称量子力学等例子的具体实现及关联。", "summary_source": "deepseek", "authors": [{"name": "Leon Menger"}, {"name": "Pavel Mnev"}], "featured_authors": [{"name": "Leon Menger"}, {"name": "Pavel Mnev"}], "author_count": 2}, {"id": "2607.26454", "category": "math-ph", "title": "From Quantum-Plane Hamiltonians to Jackson Dynamics: Dilation Representations, Normal Symbols, and Euclidean Limits", "abstract": "Formal $q$-Hamiltonian mechanics on the quantum plane is expressed through noncommuting coordinates and covariant $q$-derivatives, whereas its computable realization is usually written as an ordinary differential system involving Jackson finite differences. In this paper, we formulate the passage between these two levels through a representation--symbol correspondence. The quantum-plane coordinate algebra and its covariant differential calculus are realized by multiplication, dilation, and Jackson operators on a smooth commutative function space. Normal ordering then identifies the coordinate algebra with a polynomial symbol space endowed with an explicit associative star product. Within this framework, the formal $q$-derivatives intertwine exactly with the corresponding Jackson operators, and the formal $q$-Hamiltonian action descends to an exact star-Jackson action on symbols. For the coordinate observables, the star-product corrections vanish, so the computable Jackson coordinate equations are recovered exactly. For general observables, replacing the star product by ordinary multiplication produces a controlled first-order error. We also show that multiplication by the Hamiltonian symbol is the leading commutative approximation of the represented operator Hamiltonian. Finally, we study the resulting Euclidean Jackson vector field and establish first-order convergence of the operator, symbol, vector-field, and finite-time trajectory formulations to classical Hamiltonian dynamics as $q\\to1$. These results provide a rigorous bridge between formal quantum-plane Hamiltonian mechanics and the dynamics used in $q$-deformed Hamiltonian Monte Carlo.", "url": "https://arxiv.org/abs/2607.26454", "type": "理论", "summary": "1. 该工作通过表示-符号对应，将形式量子平面哈密顿力学与基于Jackson有限差分的可计算动力学严格联系起来。\n2. 其核心在于利用膨胀算子和正规序构造星乘，使形式q-导数与Jackson算子精确交缠，且坐标可观测量星乘修正为零。\n3. 这为q-变形哈密顿蒙特卡洛方法的动力学基础提供了严格框架，并建立了q→1时经典哈密顿动力学的收敛性。", "summary_source": "deepseek", "authors": [{"name": "Xiaomei Yang"}, {"name": "Zhiliang Deng"}], "featured_authors": [{"name": "Xiaomei Yang"}, {"name": "Zhiliang Deng"}], "author_count": 2}, {"id": "2607.26675", "category": "math-ph", "title": "Congruence of Dirac operators with applications to generalized MIT bag models", "abstract": "We highlight a simple congruence transform that shifts coupling parameters for Dirac operators with shell interactions. As one of the consequences, this leads to new observations concerning the self-adjointness and the infinite mass interpretation of generalized MIT bag models.", "url": "https://arxiv.org/abs/2607.26675", "type": "理论", "summary": "1. 该工作凸显了一个简单同余变换在移动壳相互作用Dirac算子耦合参数中的核心作用。\n2. 其卖点在于通过该变换获得了广义MIT袋模型自伴性的新判据，并澄清了无穷质量极限的物理诠释。\n3. 这为处理含壳相互作用的Dirac算子谱问题提供了对称性工具，并为袋模型边界条件研究开辟了新视角。", "summary_source": "deepseek", "authors": [{"name": "Joaquim Duran"}, {"name": "Konstantin Pankrashkin"}], "featured_authors": [{"name": "Joaquim Duran"}, {"name": "Konstantin Pankrashkin"}], "author_count": 2}, {"id": "2607.26975", "category": "math-ph", "title": "Lee-Yang Zeros And Particle Fluctuations", "abstract": "We consider classical particles in the continuum in the grand canonical ensemble, with a stable, tempered and lower-regular pair potential and boundary conditions of uniformly bounded density. We prove that if the Lee--Yang zeros of the grand canonical partition function in the complex fugacity plane $z = e^{\\beta\\mu}$ remain bounded away from a real point $z_0 > 0$ for all sufficiently large volumes, then along cubes the thermodynamic limit and differentiation commute at $z_0$: every derivative of the finite-volume pressure in the chemical potential converges, uniformly in a neighborhood of $z_0$, to the corresponding derivative of the limiting pressure. The limiting values of all derivatives are independent of the boundary condition; in particular, the density and the particle-number variance per unit volume converge to $\\beta^{-1}\\partial_\\mu p$ and $\\beta^{-2}\\partial^{2}_{\\mu} p$, respectively. The result extends to the unbounded boundary conditions of Procacci and Yuhjtman for super-stable potentials in addition to Ruelle's tempered boundary conditions.", "url": "https://arxiv.org/abs/2607.26975", "type": "理论", "summary": "1. 该文证明，对于具有稳定、缓变对势的经典连续粒子系综，若巨配分函数的Lee-Yang零点在复逸度平面中始终远离某正实点，则热力学极限与化学势微分可交换，且极限导数独立于边界条件。\n2. 其技术核心在于利用一致有界密度边界条件，严格建立了有限体积压强各阶导数的邻域一致收敛性，导出密度与粒子数方差分别收敛至β⁻¹∂_μp与β⁻²∂²_μp。\n3. 该结果为经典统计力学中粒子数涨落与相变临界行为的严格分析提供了统一框架，并可推广至超稳定势与无界边界条件情形。", "summary_source": "deepseek", "authors": [{"name": "Mohamed El Hedi Bahri"}, {"name": "Ian Jauslin"}, {"name": "Joel L. Lebowitz"}], "featured_authors": [{"name": "Mohamed El Hedi Bahri"}, {"name": "Ian Jauslin"}, {"name": "Joel L. Lebowitz"}], "author_count": 3}, {"id": "2607.26080", "category": "quant-ph", "title": "Quantum mechanics on the line with two origins", "abstract": "We study scalar and spinorial quantum dynamics on the standard line with two origins, \\[ \\Ltwo=(\\R_1\\sqcup\\R_2)/\\!\\sim, \\qquad (x,1)\\sim(x,2)\\quad\\text{for }x\\neq0, \\] equipped with its identity-glued smooth structure and flat metric. We first show that the ordinary scalar theory is insensitive to the doubled origin: every continuous map from \\(\\Ltwo\\) to a Hausdorff space factors through the quotient \\(q:\\Ltwo\\to\\R\\), while, for the natural measure, \\[ C^\\infty(\\Ltwo)\\cong C^\\infty(\\R), \\qquad L^2(\\Ltwo)\\cong L^2(\\R). \\] Accordingly, the natural scalar free Hamiltonian is unitarily equivalent to the free Laplacian on \\(\\R\\). The doubled origin remains visible, however, in the spinor line associated with the nontrivial spin structure. The oriented flat structure on \\(\\Ltwo\\) admits two spin structures, distinguished by the relative transition sign on the two connected components of the chart overlap. For the nontrivial structure, these signs are opposite. This forces every continuous global spinor section to vanish at both origins and every smooth section to vanish there to infinite order. The associated first-order operator \\[ -i\\,\\frac{\\mathrm d}{\\mathrm dx} \\] on compactly supported smooth twisted sections is symmetric but not essentially self-adjoint: its deficiency indices are \\((1,1)\\), and a self-adjoint first-order evolution requires an additional transmission condition at the origin. The natural positive quadratic form associated with the flat twisted structure instead yields the direct sum of two Dirichlet half-line Laplacians and hence perfect reflection. Thus the ordinary scalar theory does not detect the doubled origin, whereas the nontrivially glued spinor line does, although the spin structure alone does not determine a unique unitary transmission law.", "url": "https://arxiv.org/abs/2607.26080", "type": "理论", "summary": "1. 该工作研究了带有两个原点的直线上标量场与旋量场的量子动力学，并分析了其对空间拓扑结构的敏感性差异。\n2. 其核心物理点在于标量场完全等价于标准直线，而非平凡自旋结构迫使旋量截面在原点无限阶消失，导致Dirac算子缺陷指数为(1,1)并需额外传输条件。\n3. 这启示在大范围几何与量子场论中，费米子探测拓扑奇异性需匹配自旋结构的边界条件，而标量场对此类细节不敏感。", "summary_source": "deepseek", "authors": [{"name": "Abhiram Sripat"}], "featured_authors": [{"name": "Abhiram Sripat"}], "author_count": 1}, {"id": "2607.26122", "category": "quant-ph", "title": "Qubit-qubit-qutrit quantum correlations in $H \\to f \\bar f V$", "abstract": "We perform an extensive analysis of the quantum correlations carried by the qubit-qubit-qutrit pure state arising in the decay of a massive scalar into a fermion-antifermion pair and a massive gauge boson, $H \\to f \\bar f V$, specialising to the Higgs boson decay $h \\to \\tau^- \\tau^+ Z$. Working with the exact tree-level spin state and its systematic expansion around the massless-fermion limit, we obtain analytic control over the entire phase space: the bipartite entanglement measures, the genuine $2 \\otimes 2 \\otimes 3$ entanglement structure (the Miyake classification), as well as the Bell-inequality violations and the non-stabiliserness (magic) are all mapped and reproduced by compact formulas. The bipartite measures exhibit a monogamy-like trade-off between the fermion pair and the fermion-boson pairs. The state is genuinely $2 \\otimes 2 \\otimes 3$ entangled over almost the entire phase space, most strongly in the collinear regions. We derive, for the first time, semi-analytical expressions for the tight $4 \\times 4 \\times 2$ Bell inequalities of the $2 \\otimes 2 \\otimes 3$ system, generalising the optimisation previously available only for three qubits, and find that the local-hidden-variable bound is violated over the entire phase space, reaching within a few per cent of the quantum bound at the upper endpoint of the di-tau mass spectrum. We further extend the stabiliser Rényi entropy and the non-local magic to systems with unequal local dimensions, and show that the near-endpoint state carries almost exactly one bit of non-local magic, which peaks at $\\log_2 \\frac{27}{7} \\simeq 1.95$ in the collinear regions. The differential decay rate concentrates precisely in the most nonclassical region of the phase space.", "url": "https://arxiv.org/abs/2607.26122", "type": "理论", "summary": "1. 该工作以树图自旋态解析研究了衰变H→f\\bar f V中量子比特-量子比特-量子三比特纯态的全相空间量子关联，具体应用于h→τ^-τ^+Z过程。\n2. 其核心在于获得贝尔不等式4×4×2紧界面的首次半解析推广及不等维系统非局域魔法(Rényi熵)的定量表达式，并揭示近端点区域态携带恰好约1比特非局域魔法且在共线区峰值达log₂(27/7)≈1.95。\n3. 这为高能对撞中量子纠缠与魔法态的精确验证提供了直接解析工具，其微分衰变率集中于最强非经典相空间区域。", "summary_source": "deepseek", "authors": [{"name": "Michał Banacki"}, {"name": "Misaki Ohta"}, {"name": "Abhyoudai S. Shaleena"}, {"name": "Paweł Caban"}, {"name": "Michał Eckstein"}, {"name": "Kazuki Sakurai"}, {"name": "Michael Spannowsky"}, {"name": "Paweł Horodecki"}], "featured_authors": [{"name": "Michał Banacki"}, {"name": "Misaki Ohta"}, {"name": "Abhyoudai S. Shaleena"}, {"name": "Kazuki Sakurai"}, {"name": "Michael Spannowsky"}, {"name": "Paweł Horodecki"}], "author_count": 8}, {"id": "2607.26123", "category": "quant-ph", "title": "Quantum Information Decoupling Beyond Finite Dimensions", "abstract": "Quantum information decoupling is a pillar of quantum information theory, underlying quantum communication, error correction, and information recovery. However, its existing formulations rely on random unitary operations tied to finite-dimensional assumptions on quantum systems. Here we establish a decoupling framework for arbitrary separable, possibly infinite-dimensional systems. For finite-dimensional inputs and arbitrary separable reference/output systems, we derive error bounds on one-shot decoupling for completely positive maps in terms of sandwiched Rényi conditional entropies. For partial-trace decoupling with finite-dimensional references, the error exponent is optimal up to the known critical rate. To handle infinite-dimensional inputs, we assume finite entropy of the manipulated system. We construct finite-rank projections on independent and identically distributed (IID) states to restrict randomization to a projected finite-dimensional subspace, while ensuring high success probability by including auxiliary components in the discarded subsystem at asymptotically negligible cost. This leads to an infinite-dimensional IID partial-trace decoupling protocol achieving optimal asymptotic dimension rates. As an application, we construct an infinite-dimensional quantum-state-merging protocol, a mother protocol of quantum information theory. Under finite entropy of Alice's marginal, it achieves the same quantum-communication and total-cost rates as in finite dimensions, governed by mutual information and conditional entropy. These results show that the operational interpretation of entropic quantities through these achievable rates constitutes a universal principle beyond finite dimensions. More broadly, our framework provides foundational tools for exploring quantum information regardless of whether we model the physical world using finite- or infinite-dimensional spaces.", "url": "https://arxiv.org/abs/2607.26123", "type": "理论", "summary": "1. 该工作建立了超越有限维假设的量子信息解耦框架，针对任意可分无限维系统导出了基于夹逼Rényi条件熵的一次性解耦误差界。\n2. 其核心在于利用有限熵假设构造有限秩投影，将无限维独立同分布态的部分迹解耦约化为有限维子空间问题，实现了最优渐近维数率且误差指数达到已知临界率。\n3. 这使无限维量子态合并协议在Alice边缘熵有限下取得与有限维相同的通信与总成本率，表明熵量的操作解释是超越维数限制的普遍原理，为任意维量子信息理论提供了基础工具。", "summary_source": "deepseek", "authors": [{"name": "Hayata Yamasaki"}], "featured_authors": [{"name": "Hayata Yamasaki"}], "author_count": 1}, {"id": "2607.26139", "category": "quant-ph", "title": "Linear Algebra of Generalized Contextuality in All Prepare-Transform-Measure Scenarios", "abstract": "Generalized contextuality is a canonical distinguishing property of nonclassical generalized probabilistic theories, in particular quantum mechanics. Methods for certification and characterization of generalized contextuality of a given generalized probabilistic theory are well developed for prepare-measure and single-stage prepare-transform-measure scenarios. In a recent work [ arXiv:2512.10000 ], a bottom-up, statistics-first linear-algebraic framework for contextuality in prepare-measure scenarios was introduced. We extend this approach to operational scenarios with sequential transformations with an arbitrary number of stages. We give a full decision procedure for contextuality of such scenarios within operational theories and analyze its computational complexity. In particular, our decision procedure has a complexity linearly exponential in the minimum generalized probabilistic theory (GPT) dimension, and polynomial in the number of procedures. We demonstrate our framework and approach through multiple examples, including Spekkens' toy theory and the 8-state single-qubit stabilizer theory. In particular, we construct an operational theory in which contextuality manifests itself only in the sequential structure of the transformations. Our findings thus shed new light on the significant role of compositional structures in the phenomenon of generalized contextuality.", "url": "https://arxiv.org/abs/2607.26139", "type": "理论", "summary": "1. 该工作将广义语境性的线性代数框架从制备-测量场景推广至包含任意阶段顺序变换的制备-变换-测量场景，并给出完整判定程序。\n2. 其核心卖点在于判定复杂度在最小广义概率论维度上为线性指数、在过程数目上为多项式，且构造出语境性仅源于变换顺序结构的操作理论实例。\n3. 这为理解组合结构在广义语境性现象中的关键作用提供了新视角，并对相关非经典性的实验检验与理论分类具有启发意义。", "summary_source": "deepseek", "authors": [{"name": "Theodoros Yianni"}, {"name": "Nyan Raess"}, {"name": "Farid Shahandeh"}], "featured_authors": [{"name": "Theodoros Yianni"}, {"name": "Nyan Raess"}, {"name": "Farid Shahandeh"}], "author_count": 3}, {"id": "2607.26145", "category": "quant-ph", "title": "Contextual advantage implies limited distinguishability in any physical theory", "abstract": "A central question in quantum information is whether a given set of states can provide an advantage in some information-processing task. We establish a universal connection between two such questions: how well a set of states can be discriminated, and whether it can power tasks whose advantage stems from generalized contextuality. Working in the framework of generalized probabilistic theories (GPTs), which includes quantum and classical systems as special cases, we show that any set of states able to provide a nonclassical advantage in a contextuality-powered task must obey nontrivial upper bounds on the success probability of every state discrimination task using the full set. Contextual advantage therefore implies limited distinguishability, exposing a trade-off between two basic operational resources. Importantly, this is more than a statement about the idealized limit: perfect distinguishability is not needed to preclude contextuality. Our thresholds lie strictly below unity, so any set whose discrimination performance exceeds them while still imperfectly distinguishable is already guaranteed to admit a noncontextual explanation. The bounds follow from a simple geometric property, linear dependence of the state set, take a closed analytical form, and depend only on the prior of the task and the convex geometry of the states. As an illustration, we apply them to generalized parity-oblivious multiplexing, where sufficiently high success in the task implies that at least one sub-ensemble of the codebook cannot power any contextual advantage.", "url": "https://arxiv.org/abs/2607.26145", "type": "理论", "summary": "1. 该工作建立了一个在任意物理理论中，状态集能否提供基于上下文的非经典优势与其可区分性之间的普遍联系。\n2. 核心卖点是发现任何具有上下文优势的状态集，在完整集合上的任何区分任务成功概率必受严格小于1的上界约束，该界限源自状态集的线性相关性和凸几何，形式闭合解析。\n3. 这揭示了上下文性与可区分性之间的基本操作资源权衡，为量子信息处理中辨别非经典资源与设计实验验证提供了明确的理论准则。", "summary_source": "deepseek", "authors": [{"name": "Roberto D. Baldijão"}, {"name": "Felipe A. Barretto"}, {"name": "Jarosław K. Korbicz"}], "featured_authors": [{"name": "Roberto D. Baldijão"}, {"name": "Felipe A. Barretto"}, {"name": "Jarosław K. Korbicz"}], "author_count": 3}, {"id": "2607.26146", "category": "quant-ph", "title": "Lindbladian quantization of mechanical systems with nonholonomic constraints", "abstract": "Nonholonomic mechanics describes systems subject to non-integrable velocity constraints, such as rolling bodies and skating motion. These systems generally lack a canonical Hamiltonian formulation, obstructing standard quantization methods. Here we quantize nonholonomic systems as Markovian open quantum systems, with the nonholonomic constraint appearing in a large-dissipation limit. We find explicit Lindblad superoperators that reproduce the classical dynamics of the Chaplygin sleigh and the Suslov problem in the semiclassical limit. The master equation is numerically simulated, and the covariance is shown to satisfy a relation predicted by the theory of metastability in open quantum systems.", "url": "https://arxiv.org/abs/2607.26146", "type": "理论+数值", "summary": "1. 该工作将非完整约束力学系统量子化为马尔可夫开放量子系统，在大耗散极限下实现约束的量子化处理。\n2. 通过构造显式林德布拉德超算符，在半经典极限下精确重现恰普雷金雪橇和苏斯洛夫问题的经典动力学。\n3. 这一方法揭示了开放量子系统亚稳态理论中协方差关系的普适性，为非完整系统的量子化提供了新范式。", "summary_source": "deepseek", "authors": [{"name": "Daniel Schubring"}, {"name": "Sriram Ganeshan"}], "featured_authors": [{"name": "Daniel Schubring"}, {"name": "Sriram Ganeshan"}], "author_count": 2}, {"id": "2607.26214", "category": "quant-ph", "title": "Minimal Counterexamples of the MacWilliams Extension Theorem for Stabilizer Codes", "abstract": "The MacWilliams extension theorem fails for module alphabets with non-cyclic socle, and the label alphabet of qudit stabilizer codes, $\\F_{q^2}$ over $\\F_q$, is such an alphabet. Quantum error correction, however, only ever sees \\emph{self-orthogonal} additive codes, and whether that rigidity rescues the theorem---equivalently, whether every weight-preserving isomorphism of stabilizer groups is implemented by local Cliffords and a qudit permutation---was asked by Gluesing-Luerssen and Pllaha and answered negatively by Pllaha for particular qubit codes. We develop the negative answer systematically and at the smallest possible scales. For every prime power $q$ we construct a pair of $[[q+1,q-1]]_q$ stabilizer codes and a weight-preserving isomorphism between them extending to no monomial transformation; the codespaces are inequivalent even under arbitrary local unitaries combined with permutations, though they share Shor--Laflamme enumerators. Self-orthogonality is automatic here, by two elementary lemmas which also show that Dyshko's threshold-length counterexamples were already self-orthogonal, unremarked. For qubits we prove by exhaustive search that length $3$ is minimal and the counterexample essentially unique. Dropping the ``idle qudit'' invariant that detects these, we find the minimal full-support lengths: $4$ for a non-extendable isometry, $5$ for a weight-isometric pair that is not monomially equivalent, realized by explicit $[[5,2]]$ codes; at length $6$ all nontrivial stabilizer elements can have weight $\\ge 4$. Whether these codespaces are locally unitarily equivalent is posed as an open problem, connecting the extension problem to the LU--LC circle of questions.", "url": "https://arxiv.org/abs/2607.26214", "type": "理论", "summary": "1. 该工作系统构造了稳定子码中MacWilliams扩展定理的最小反例，针对所有素数幂q给出[[q+1,q-1]]_q码对。\n2. 其技术核心在于证明自正交性在该框架中自动满足，且通过穷举搜索确认qubit长度3为最小反例尺度。\n3. 这提出了权重保持同构是否蕴含局部酉等价这一开放问题，连接了扩展定理与LU-LC问题循环。", "summary_source": "deepseek", "authors": [{"name": "Ali Assem Mahmoud"}], "featured_authors": [{"name": "Ali Assem Mahmoud"}], "author_count": 1}, {"id": "2607.26225", "category": "quant-ph", "title": "Supermartingales in Quantum Resources Theories: Where do quantum resources go when you're watching?", "abstract": "We establish a connection between quantum resource theory and probability theory, under repeated application of free operations. We show that strong monotonicity of a resource measure implies that the resource is a supermartingale. We then use the optional stopping and martingale convergence theorems to derive bounds on the efficiency of post-selection, and other free adaptive strategies. We also describe the asymptotic dynamics of the conditional state, where resource fluctuations are necessarily absent, showing one of two distinct phenomena occurs: resource vanishing or resource freezing.", "url": "https://arxiv.org/abs/2607.26225", "type": "理论", "summary": "1. 该工作将量子资源理论与概率论相联系，在重复自由操作下证明了资源测度的强单调性等价于资源量构成超鞅。\n2. 利用可选停止定理与鞅收敛定理，推导了后选择及其他自由自适应策略效率的通用上界。\n3. 揭示了条件状态渐近动力学中资源波动必然消失的两种可能：资源完全消失或资源完全冻结。", "summary_source": "deepseek", "authors": [{"name": "Katarzyna Macieszczak"}, {"name": "Robert L. Jack"}], "featured_authors": [{"name": "Katarzyna Macieszczak"}, {"name": "Robert L. Jack"}], "author_count": 2}, {"id": "2607.26351", "category": "quant-ph", "title": "On $R$-parastatistics I: Foundation", "abstract": "Parastatistics is an exotic type of exchange statistics beyond fermions and bosons. Paraparticles transform in higher dimensional representations of the exchange symmetry group, analogous to non-Abelian anyons, yet consistently defined in any dimension. Although paraparticles have long been proposed, they were widely believed to be physically equivalent to fermions or bosons. Nevertheless, a recent paper proposed a different theory, called $R$-parastatistics, and demonstrated that nontrivial $R$-paraparticles can emerge as quasiparticles in condensed matter systems, and are observably distinct from both fermions and bosons. This paper develops the theoretical foundation and several extensions of $R$-parastatistics, with particular emphasis on its observable consequences. Central to this paper is a general theory of local observables extending the basic family introduced before. First, we define local observables that distinguish particle types. Second, we formulate local observables at special point defects that probe the internal indices of $R$-paraparticles, crucial for observing $R$-parastatistics and for the proposed applications in quantum information. Third, we introduce local observables that create or annihilate particle-antiparticle pairs, important for building a relativistic quantum field theory for $R$-paraparticles. We further introduce generalized hidden symmetries that act on internal indices of $R$-paraparticles while preserving the local observable algebra, providing a basis for proving local indistinguishability and for connecting to a categorical description of $R$-paraparticles. This work sets a solid theoretical foundation for understanding the fundamental physical properties of $R$-paraparticles and pave the way for finding them in nature.", "url": "https://arxiv.org/abs/2607.26351", "type": "理论", "summary": "1. 该工作建立了R-parastatistics的理论基础，重点发展了区分粒子类型的局域可观测量、探测内禀指标的缺陷可观测量以及产生湮灭粒子对的可观测量。\n2. 技术核心在于引入广义隐藏对称性作用于R-paraparticles的内禀指标并保持局域可观测量代数，为证明局域不可区分性及范畴描述提供依据。\n3. 这为在凝聚态系统中观测非平凡R-paraparticles、实现量子信息应用以及构建其相对论性量子场论奠定了坚实理论基础。", "summary_source": "deepseek", "authors": [{"name": "Zhiyuan Wang"}, {"name": "Kaden R. A. Hazzard"}], "featured_authors": [{"name": "Zhiyuan Wang"}, {"name": "Kaden R. A. Hazzard"}], "author_count": 2}, {"id": "2607.26431", "category": "quant-ph", "title": "The Klein-Gordon-Fock theory as a one-particle relativistic quantum mechanics", "abstract": "The Klein-Gordon-Fock (KGF) theory with scalar and vector potentials is presented as a one particle relativistic quantum mechanics (QM). First, the KGF equation is written in a Hamiltonian form, in spinor space; unlike the Feshbach-Villars approach, the Hamiltonian here is strictly Hermitian. Then this equation is rewritten for a one-component wave function. Expressions for the Hamiltonian and other observables' operators acting in the space of one-component wave functions are presented. The nonrelativistic and ultrarelativistic limits of these expressions are considered. A general solution to the KGF equation describing a free particle is presented.", "url": "https://arxiv.org/abs/2607.26431", "type": "理论", "summary": "1. 该工作将带有标量和矢量势的克莱因-戈登-福克理论重新表述为单粒子相对论量子力学，在旋量空间中构建了严格厄密的哈密顿形式，并导出单分量波函数下哈密顿量、动量、位置等可观测量算符的显式形式，同时给出了自由粒子的一般解。\n2. 其技术卖点在于哈密顿量严格厄密，克服了费什巴赫-维拉尔斯方法中的非厄密问题，并系统分析了非相对论与超相对论极限下各算符的渐近行为，保证了理论内部的数学自洽性。\n3. 这一自洽的单粒子框架为研究强场相对论束缚态与散射问题提供了清晰的理论基础，也为理解量子力学与量子场论之间的过渡与联系给出了重要启示。", "summary_source": "deepseek", "authors": [{"name": "N. L. Chuprikov"}], "featured_authors": [{"name": "N. L. Chuprikov"}], "author_count": 1}, {"id": "2607.26438", "category": "quant-ph", "title": "Quantum Optical Reinforcement Learning via Spectrum-Resolved Hong-Ou-Mandel Interference", "abstract": "Hong-Ou-Mandel (HOM) interference-based optical neural networks can offer complexity advantages on benchmark learning tasks, but conventional readout compresses the coincidence spectrum into a single scalar, limiting its use in complex settings such as continuous-action reinforcement learning. Here we introduce a spectrum-resolved HOM (SR-HOM) architecture that promotes the photons' spectral degrees of freedom to a trainable computational resource and use it to construct a compact optical actor-critic agent. Diagonal spectral responses generate continuous actions, while higher-order spectral correlations provide nonlinear state-action features for value estimation. Across five continuous-control benchmarks, SR-HOM outperforms parameter-matched multilayer-perceptron baselines, including a \\(4.4\\times\\) improvement in sample efficiency and a \\(74.0\\%\\) increase in best 100-episode moving-average return for LunarLanderContinuous-v3. Applied to online calibration of drifted tunable-coupler CZ and iSWAP gates for transmon qubits, simulations show it restores fidelities to \\(0.9917\\) and \\(0.9952\\) respectively, exceeding \\(99.8\\%\\) of their drift-free calibrated values.", "url": "https://arxiv.org/abs/2607.26438", "type": "数值", "summary": "1. 该工作提出基于光谱分辨HOM干涉的光学强化学习架构，将光子光谱自由度用作可训练计算资源。\n2. 其卖点在于利用对角光谱响应生成连续动作，并通过高阶光谱相关性提供非线性状态-动作特征用于价值估计。\n3. 这为光学神经网络在连续控制任务及量子门在线校准中的高效应用提供了明确路径，性能显著优于经典基线。", "summary_source": "deepseek", "authors": [{"name": "Shaojun Wu"}, {"name": "Jiahua Xu"}, {"name": "Shan Jin"}, {"name": "Zhen Yang"}, {"name": "Yifang Xu"}, {"name": "Chenglong You"}, {"name": "Guangwei Deng"}, {"name": "Luyan Sun"}, {"name": "Chang-Ling Zou"}, {"name": "Xiaoting Wang"}], "featured_authors": [{"name": "Shaojun Wu"}, {"name": "Jiahua Xu"}, {"name": "Shan Jin"}, {"name": "Luyan Sun"}, {"name": "Chang-Ling Zou"}, {"name": "Xiaoting Wang"}], "author_count": 10}, {"id": "2607.26445", "category": "quant-ph", "title": "Lattice Quantum Chromodynamics for Quantum Simulations", "abstract": "We develop a framework for quantum simulations of lattice SU($N_c$) gauge theory with quarks. Staggered and Wilson lattice fermions are considered in two and three spatial dimensions and a theta angle is included in three dimensions. The physical, gauge-invariant Hilbert space is formulated in a representation basis, where gauge and fermionic degrees of freedom are encoded by irreducible representations of SU($N_c$) that tensor at each lattice site to contain a singlet. We discuss algorithms for simulating time evolution on quantum computers and carry out noiseless simulations of lattice quantum chromodynamics ($N_c=3$) on small lattices with up to 32 qubits, showcasing theta angle effects, hadronic states, string dynamics, and a baryon chemical potential for the first time in three spatial dimensions.", "url": "https://arxiv.org/abs/2607.26445", "type": "理论+数值", "summary": "1. 该工作针对含夸克的格点SU(N_c)规范理论，建立了适用于交错和Wilson费米子（二维与三维空间，三维含θ角）的量子模拟完备框架。\n2. 其技术关键在于以SU(N_c)不可约表示基编码规范与费米子自由度，通过格点处张量积单态约束构建物理希尔伯特空间，并设计了基于量子计算机的规范不变时间演化算法。\n3. 该框架在多达32量子比特的小格点上首次实现了三维空间中θ角效应、强子态、弦动力学及重子化学势的无噪声模拟，为格点QCD的量子计算研究奠定了坚实基础并开辟了新途径。", "summary_source": "deepseek", "authors": [{"name": "Luis Hidalgo"}, {"name": "Patrick Draper"}], "featured_authors": [{"name": "Luis Hidalgo"}, {"name": "Patrick Draper"}], "author_count": 2}, {"id": "2607.26477", "category": "quant-ph", "title": "Finding diagonal logical gates in CSS codes and circuits", "abstract": "Finding efficient schemes for non-Clifford logic or magic state preparation is one of the central challenges on the way to fault-tolerant quantum computation. Many of the proposed schemes rely on diagonal non-Clifford logical gates acting on CSS codes in space or decorating CSS-type syndrome-extraction circuits in spacetime. Here we propose and implement efficient algorithms to find all (spacetime) logical gates of a given CSS code (circuit) composed from a prescribed set of ansatz gates. Depending on the choice of ansatz gates, this means finding transversal gates, more general locality-preserving logical circuits, folding gates, or similar. While we focus on qubit diagonal gates in the Clifford hierarchy, we also discuss the generalization to arbitrary diagonal non-hierarchy gates, certain non-diagonal gates, as well as prime and composite-dimensional qudits. Our method works by rephrasing code-space preserving gates as the kernel of the ``pullback'' of the $X$ check matrix onto phase functions, which maps between finite abelian 2-groups. We implement a fast ``filtration'' method to find this kernel. The runtime for finding fault-tolerant logical gates in a qLDPC code with $O(n)$ qubits or a circuit with $O(n)$ gates in a naive dense implementation is $O(n^3)$, with potential for improvement making use of sparsity.", "url": "https://arxiv.org/abs/2607.26477", "type": "理论+数值", "summary": "1. 该工作提出并实现了高效算法，用以找出给定CSS码或电路中由预设门集合构成的所有（时空）对角逻辑门。\n2. 其核心在于将码空间保持门重述为X校验矩阵“拉回”到相位函数的核，映射在有限阿贝尔2-群间，并通过过滤方法快速求解。\n3. 这为系统化搜寻量子低密度奇偶校验码中的非克利福德门及容错量子计算方案提供了工具，并可推广至非对角门与高维qudit情形。", "summary_source": "deepseek", "authors": [{"name": "Andreas Bauer"}], "featured_authors": [{"name": "Andreas Bauer"}], "author_count": 1}, {"id": "2607.26478", "category": "quant-ph", "title": "Explicit Separations for One-Query Unitary Synthesis", "abstract": "The unitary synthesis problem (Aaronson-Kuperberg, CCC 2007) asks whether every $n$-qubit unitary $U$ is computable by efficient quantum circuits relative to some classical oracle $f = f_U$ depending on $U$. Recently, Lombardi-Ma-Wright (STOC 2024) proved that Haar-random unitaries cannot be efficiently synthesized by algorithms that make 1 query (or poly$(n)$ parallel queries) to an arbitrary classical oracle. In this work, we prove several results about the hardness (and easiness!) of variants of unitary synthesis. Our results include: (1) 1-query vs. 2-query unitary synthesis: we prove 1-query lower bounds for synthesizing random permutation unitaries $P\\lvert x\\rangle = \\lvert \\pi(x)\\rangle$, as well as random alternating-basis phase unitaries $F_2 \\cdot H^{\\otimes n} \\cdot F_1$. This gives 1-query lower bounds for \"explicit\" families of unitaries that have efficient (even 2-query) synthesis algorithms. (2) Upper bound for complex phase unitaries: we also consider complex phase unitaries $\\lvert x\\rangle\\mapsto \\alpha_x \\lvert x\\rangle$, which have a clean 2-query synthesis algorithm with no obvious 1-query algorithm. In this case, we prove an upper bound: there are 1-query algorithms (relative to binary phase oracles) that constant-approximate these unitaries in diamond distance. In order to prove our lower bounds, we introduce and analyze two new cryptographic games: the oracle state search game and the oracle Choi state game. Compared to prior work, our framework is mathematically simple, more flexible in what it can prove, and more accurately captures the hardness of synthesizing unitaries that are not \"fully random\". Finally, we also use the search game to prove a new hardness-of-approximation result for quantum programs (synthesizing unitaries relative to quantum advice) for phase unitaries, giving a sharper separation between 1-query unitary synthesis and quantum programs.", "url": "https://arxiv.org/abs/2607.26478", "type": "理论+数值", "summary": "1. 该工作针对单查询酉合成问题，证明了随机置换酉与随机交替基相位酉的1-查询下界，以及复杂相位酉的常数近似上界。\n2. 其技术核心在于引入状态搜索游戏和Choi状态游戏，以简洁通用的框架刻画非完全随机酉的合成困难性。\n3. 这为单查询酉合成与量子程序间的硬度分离提供了更锐利的界限，并启发对量子计算复杂性更精细的刻画。", "summary_source": "deepseek", "authors": [{"name": "Fangqi Dong"}, {"name": "Alex Lombardi"}, {"name": "Fermi Ma"}], "featured_authors": [{"name": "Fangqi Dong"}, {"name": "Alex Lombardi"}, {"name": "Fermi Ma"}], "author_count": 3}, {"id": "2607.26669", "category": "quant-ph", "title": "Quantum model reduction based on Oja's flow", "abstract": "We propose a novel approach to numerically derive approximate reduced dynamical models for Markovian quantum open systems without perturbative iterations, projecting the evolution to the subspace associated to their slowest degrees of freedom. The two algorithms we develop are based on Oja's continuous-time principal component flow: the first returns the optimal reduction to the slowest decaying operator-subspace, and is extended to time-dependent dynamics, while the second one is designed to reduce the dynamics on a subspace of the system's Hilbert space, and thus preserve conditional complete positivity. The methods represent a non-perturbative alternative to well-established Adiabatic Elimination (AE) methods, and the second can be used to find noise-protected subspace codes for quantum information processing. Both are tested on a paradigmatic central spin model.", "url": "https://arxiv.org/abs/2607.26669", "type": "理论+数值", "summary": "1. 该工作基于Oja连续时间主成分流，为马尔可夫量子开放系统提出两种非微扰数值约化动力学模型构建算法。\n2. 其一实现最慢衰减算子子空间的最优约化并可扩展至时变动力学，其二保持条件完全正性并适用于希尔伯特空间子空间动力学约化。\n3. 该方法为绝热消除提供非微扰替代，且可用于寻找量子信息处理的噪声保护子空间码，并在中心自旋模型中验证。", "summary_source": "deepseek", "authors": [{"name": "Miguel Casanova"}, {"name": "Kentaro Ohki"}, {"name": "Francesco Ticozzi"}], "featured_authors": [{"name": "Miguel Casanova"}, {"name": "Kentaro Ohki"}, {"name": "Francesco Ticozzi"}], "author_count": 3}, {"id": "2607.26672", "category": "quant-ph", "title": "Relational Quantum Causal Processes: Exact Models, Continuum Limits, and the Boundary of Emergent Gravity", "abstract": "Relational quantum causal processes formulate finite operational contexts as normal positive functionals on local completely positive maps. Response differences generate an influence algebra, and its central projections define jointly readable Boolean events. We develop this starting point through a sequence of exact and controlled models. Fresh-environment unitary collision circuits produce dephasing-exchange kinetics with an exact charge-center fixed algebra, a uniform finite-step limit at fixed response order, and graph-controlled metastable Markov dynamics. An absorbing-state model exhibits a sharp transition between non-Abelian quantum memory and Boolean records. A reversal-covariant defect dynamics generates a locally finite partial order on a restricted graph family without assuming a Lyapunov time. Conditional on a certified order, a positive additive record measure, compactness, and identifiability, we prove subsequential convergence to a Lorentzian metric-measure space, finite reconstruction bounds, and uniqueness of admissible smooth limits. Complementary finite regulators provide controlled tests of modular-to-boost response, null tomography, same-update variational identities, induced quadratic gravity, and compatible common-refinement limits. These results are exact or controlled within their stated models, but they do not yet constitute a single background-independent microscopic law that jointly generates adjacency, time, volume normalization, dimension, signature, nonlinear Einstein constraints, and quantum matter. We therefore present RQCP-QG as a theorem-indexed framework that separates established mechanisms, conditional compositions, and open assumptions.", "url": "https://arxiv.org/abs/2607.26672", "type": "理论+数值", "summary": "1. 该论文以关系量子因果过程为框架，通过新鲜环境幺正碰撞电路、吸收态模型和反转协变缺陷动力学等精确可解模型，系统分析了有限操作语境中因果结构的涌现及其与涌现引力边界的联系。\n2. 核心卖点在于揭示退相交换动力学中的电荷中心固定代数与均匀有限步极限、吸收态模型中非阿贝尔量子记忆到布尔记录的尖锐相变，以及条件收敛到洛伦兹度量–测度空间的子序列极限与有限重建界。\n3. 虽未实现同时生成邻接、时间、维度、签名、非线性爱因斯坦约束和量子物质的统一背景独立微观理论，但定理索引框架分离了已确立机制与开放假设，互补有限调节器为模块到响应、零断层扫描和诱导二次引力提供了受控检验平台。", "summary_source": "deepseek", "authors": [{"name": "Yipeng Xu"}], "featured_authors": [{"name": "Yipeng Xu"}], "author_count": 1}, {"id": "2607.26707", "category": "quant-ph", "title": "Microscopic study of topological phase transitions: Percolation point of view", "abstract": "We investigate microscopic mechanisms underlying decoherence-induced transitions between topologically ordered states. As a first case study, we analyze the color code using topological entanglement negativity (TEN) and a disorder parameter associated with 1-form symmetry. We interpret these quantities as first- and zeroth-dimensional simplicial homological objects, respectively, and show that the transition can be understood in terms of decoherence percolation. To resolve its local structure, we introduce quasi-local TEN (QLTEN), which visualizes the spatial distribution of local topological properties and the growth of decohered regions. We further introduce explosive percolation (EP), corresponding here to biased decoherence that suppresses the formation of large decohered clusters. As a second case study, we consider the toric code on a triangular lattice under external-field-type decoherence. Numerical results show that QLTEN faithfully captures the emergence of Higgs regions and the survival of logical qubits. Although global TEN, QLTEN clusters, and string operators are strongly correlated in both models, the color code and toric code respond differently to EP patterns. This difference indicates that a universal microscopic description of decoherence-induced topological phase transitions remains challenging even for closely related systems.", "url": "https://arxiv.org/abs/2607.26707", "type": "理论+数值", "summary": "1. 该工作从渗流视角出发，微观研究了色码和三角晶格环面码中退相干诱导的拓扑相变。\n2. 核心卖点在于引入准局域拓扑纠缠负性（QLTEN）可视化局部拓扑性质空间分布与退相干区域增长，并以爆炸渗流（EP）刻画有偏退相干抑制大团簇形成。\n3. 尽管两种模型在全局TEN、QLTEN团簇与弦算符上强关联，但EP模式差异暗示即便对邻近系统，构建退相干拓扑相变的普适微观描述仍具挑战。", "summary_source": "deepseek", "authors": [{"name": "Keisuke Kataoka"}, {"name": "Ikuo Ichinose"}], "featured_authors": [{"name": "Keisuke Kataoka"}, {"name": "Ikuo Ichinose"}], "author_count": 2}, {"id": "2607.26716", "category": "quant-ph", "title": "Coherent electric field manipulation of nuclear spin qudit", "abstract": "Spins in condensed matter, especially well-isolated nuclear spins, offer attractive quantum degrees of freedom for computing, sensing, and networking because of their long coherence times. The possibility of electric-field control is an important feature for practical scalable quantum technologies, but, typically, nuclear spins couple only weakly to electric fields in conventional semiconductor hosts, limiting operation efficiency. Here we show that a choice of a highly polarizable oxide host can overcome this bottleneck. In Mn2+ doped ZnO, electric-field modulation of the spin Hamiltonian is amplified by hyperfine-coupled electron spins, and offers efficient electric-field manipulation of an I = 5/2 nuclear spin qudit, in a manner analogous to the hyperfine enhancement of conventional nuclear magnetic resonance. We demonstrate both resonant and non-resonant coherent manipulation using a single uniaxial electric field applied along the crystalline c-axis, the polarization axis of ZnO. This approach allows universal single-qudit gate operations with efficiencies comparable to or exceeding those of conventional magnetic-field driving. These results support the deployment of doped oxides as active host materials for electrically controllable spin qubits, highlighting the importance of materials design in developing scalable quantum technologies.", "url": "https://arxiv.org/abs/2607.26716", "type": "理论", "summary": "1. 该工作实验演示了在Mn2+掺杂ZnO中利用单轴电场对核自旋五能级系统进行相干操控。\n2. 其核心卖点在于通过超精细耦合放大电场对自旋哈密顿量的调制，实现媲美甚至优于传统磁驱动的单量子门操作效率。\n3. 这揭示了掺杂氧化物作为有源宿主材料在可扩展电控自旋量子技术中的重要材料设计价值。", "summary_source": "deepseek", "authors": [{"name": "Sumin Lim"}, {"name": "Mikhail V. Vaganov"}, {"name": "Niccolo Fontana"}, {"name": "Junjie Liu"}, {"name": "Arzhang Ardavan"}], "featured_authors": [{"name": "Sumin Lim"}, {"name": "Mikhail V. Vaganov"}, {"name": "Niccolo Fontana"}, {"name": "Junjie Liu"}, {"name": "Arzhang Ardavan"}], "author_count": 5}, {"id": "2607.26745", "category": "quant-ph", "title": "High-fidelity multiqubit gates with Rydberg atoms via level-crossing-free Rapid adiabatic passage", "abstract": "We propose a rapid adiabatic passage (RAP) scheme based on level-crossing-free pulses for deterministic generation of multiqubit entangled states in Rydberg atom systems. Unlike conventional RAP protocols that rely on level crossings, our approach uses an antisymmetric Rabi frequency and an even-symmetric detuning, enabling robust population transfer without passing through any level crossing. By exploiting the Rydberg blockade effect, the protocol prepares entangled states directly from an initial product state. Specifically, two sequential RAP pulses separated by a pi_g pulse generate two-qubit Bell states, three-qubit W states, four-qubit GHZ states, and six-qubit honeycomb W states. Numerical simulations show that the fidelities exceed 0.9997 for the Bell and three-qubit W states, reach 0.997 for the four-qubit GHZ state, and surpass 0.9995 for the six-qubit honeycomb W state. The scheme demonstrates excellent robustness against pulse parameter fluctuations, with fidelities remaining above 0.99 under +/-5% parameter variations. This work provides a simple, efficient, and robust method for entangled-state preparation in neutral-atom quantum information processing.", "url": "https://arxiv.org/abs/2607.26745", "type": "理论+数值", "summary": "1. 该工作提出了基于无能级交叉快速绝热通道的里德伯原子多量子比特纠缠态制备方案。\n2. 其卖点在于采用反对称拉比频率与偶对称失谐避免能级交叉，结合里德伯阻塞效应，实现保真度超0.9997的贝尔态与W态以及0.997的四比特GHZ态。\n3. 该方案在±5%参数涨落下保真度仍高于0.99，为中性原子量子信息处理提供了简单、高效且鲁棒的纠缠态制备方法。", "summary_source": "deepseek", "authors": [{"name": "Yichi Zhang"}, {"name": "Ximo Wang"}, {"name": "Zhenqi Bai"}, {"name": "Xu Zhao"}, {"name": "Tiecheng Wang"}], "featured_authors": [{"name": "Yichi Zhang"}, {"name": "Ximo Wang"}, {"name": "Zhenqi Bai"}, {"name": "Xu Zhao"}, {"name": "Tiecheng Wang"}], "author_count": 5}, {"id": "2607.26756", "category": "quant-ph", "title": "Label and Recover Coherent Errors: Randomized Compiling Does Not Destroy Coherent-Error Information", "abstract": "Randomized compiling (RC) is the standard technique for converting coherent (systematic) gate errors into stochastic noise. The prevailing view is that the twirl destroys coherent-error information. An exact Fisher-information conservation law shows the opposite: the coherent-error information RC removes from the averaged output is preserved in full in the twirl labels -- the per-shot random gate choices that standard RC discards. Retaining the labels and forming a label-outcome correlation recovers the coherent error parameters at the quantum Fisher-information limit, unbiased under all standard incoherent channels, at zero additional circuit cost. Two theorems are proved, the conservation law is verified to machine precision across 12 circuit families, and recovery is confirmed on a 127-qubit IBM Quantum processor (ibm_marrakesh). The labeled estimator recovers injected coherent phases to within 0.0063 rad of the true value across all depths tested, while the standard marginal estimator returns near-zero signal at every depth.", "url": "https://arxiv.org/abs/2607.26756", "type": "理论", "summary": "1. 该工作证明了随机编译（RC）过程中的扭转标签保留了相干误差的全部Fisher信息，通过保留这些标签并关联测量结果即可恢复相干误差参数。\n2. 核心卖点在于发现了精确的Fisher信息守恒定律，使得恢复达到量子Fisher信息极限且零额外电路开销，并在127量子比特处理器上验证了恢复精度达0.0063 rad。\n3. 这推翻了RC销毁相干误差信息的传统观点，为量子门误差的表征与抑制提供了无偏高效的标签估计方法，可直接应用于当前量子处理器。", "summary_source": "deepseek", "authors": [{"name": "Kushagra Vyas"}], "featured_authors": [{"name": "Kushagra Vyas"}], "author_count": 1}, {"id": "2607.26761", "category": "quant-ph", "title": "PhD thesis: Modes, States, and Symmetries in quantum Optics for quantum Information and Metrology", "abstract": "This thesis explores the role of modes, states, and symmetries in quantum optics, within the context of quantum information and quantum metrology. It proposes a unified framework to analyze how the modal structure of photonic fields, the statistical nature of states, and their symmetry properties determine the physical resources that can be exploited for quantum information processing and quantum parameter estimation. A first line of investigation develops a description of time-frequency degrees of freedom as continuous quantum variables, highlighting their richness for encoding and manipulating information. A second axis studies entanglement and collective variables, clarifying the link between physical resources and metrological gains, particularly in reaching ultimate precision limits. Interferometric scenarios of the Hong-Ou-Mandel type are then analyzed, and a general formalism centered on the notion of symmetry is developed. This framework enables the analysis of a broad range of situations and leads to several generalizations. Finally, the thesis examines the symmetries imposed by optical superselection rules and their consequences for the structure of quantum states and their operational performance, with the aim of providing a deeper understanding of the foundations of quantum optics.", "url": "https://arxiv.org/abs/2607.26761", "type": "理论", "summary": "1. 该论文统一分析了量子光学中模式、态和对称性对量子信息与计量资源的决定作用。\n2. 其卖点在于将时间-频率自由度视为连续变量，并发展了对称性形式处理Hong-Ou-Mandel干涉与超选择规则。\n3. 这为量子信息处理与精密测量中资源优化及基础理解提供了统一框架与明确指导。", "summary_source": "deepseek", "authors": [{"name": "Éloi Descamps"}], "featured_authors": [{"name": "Éloi Descamps"}], "author_count": 1}, {"id": "2607.26771", "category": "quant-ph", "title": "Hybrid quantum-classical end-to-end pipeline for solving MILPs: a vehicle routing case study", "abstract": "We demonstrate an end-to-end hybrid quantum-classical optimisation framework based on Benders decomposition, capable of solving mixed-integer linear programming (MILP) problems. The framework builds on a
