 previously presented hybrid quantum-classical end-to-end pipeline based on Multiple Cuts via Multiple Solutions (MCMS) Benders decomposition where the cut selection step was performed on quantum annealing hardware. We extend this with gate-based QAOA implementations for both tensor network emulators and superconducting quantum hardware. The Vehicle Routing Problem (VRP) is used as a representative case study and we run the pipeline end-to-end on 10 permutations of a standardised benchmarking instance (20 customers and 4 vehicles from QOptLib) with a classical solver performing the cut selection step. We find that for our instances, only a small fraction of the compute in classical MCMS Benders decomposition is spent on the cut selection step. For a full hybrid end-to-end assessment, we run the pipeline for a toy problem with MPS-JuliQAOA, a powerful tensor network emulator, to execute QAOA. Here, the majority of the time is spent on the cut selection step, deeming quantum advantage of this framework unlikely at problems of this size. This highlights the need for more large-scale benchmarking research when more powerful (QPU) QUBO solvers are available.", "url": "https://arxiv.org/abs/2607.26771", "type": "数值", "summary": "1. 该工作实现了基于Benders分解的混合量子经典端到端流水线，求解混合整数线性规划问题，并以车辆路径问题为案例进行验证。\n2. 其技术卖点是将切割选择步骤从量子退火扩展到门式QAOA（张量网络模拟器与超导硬件），并发现当前规模下计算瓶颈在切割选择，量子优势可能性低。\n3. 这强调了在更强QPU QUBO求解器可用时，需进行更大规模基准测试以评估混合框架的实际潜力。", "summary_source": "deepseek", "authors": [{"name": "Camille de Valk"}, {"name": "Koen Reerink"}, {"name": "Siert Sebus"}, {"name": "Sébastian de Bon"}], "featured_authors": [{"name": "Camille de Valk"}, {"name": "Koen Reerink"}, {"name": "Siert Sebus"}, {"name": "Sébastian de Bon"}], "author_count": 4}, {"id": "2607.26856", "category": "quant-ph", "title": "Enhancing the security of coherent one-way quantum key distribution using CHSH correlations", "abstract": "The coherent one-way (COW) protocol is a quantum key distribution scheme that has attracted significant attention, leading to the development and commercialization of practical implementations. Despite this progress, the security of the COW protocol has remained a fundamental challenge since its introduction. Numerous studies have investigated its security, and several security proofs have been proposed over the years. More recently, a number of works have questioned the security of this protocol. In particular, one of the latest studies introduced an attack that severely limits the security of COW-QKD and reported a maximum secure distance of less than 20km. In this work, we introduce minimal alteration to the COW protocol that can enhance its security. Specifically, instead of monitoring the coherence between successive pulses, we propose to monitor quantum correlations through the violation of Bell inequalities. This approach enables the detection of a broader class of potential attacks. Our simulation results indicate that, by employing this method, the maximum secure distance of the protocol can be extended to approximately 259km.", "url": "https://arxiv.org/abs/2607.26856", "type": "理论+数值", "summary": "1. 该工作对相干单向量子密钥分发协议引入最小修改，通过监测CHSH贝尔不等式违背以增强安全性。\n2. 其核心卖点在于以量子关联监测替代传统相干性监测，可检测更广类攻击，并将安全距离从不足20公里扩展至约259公里。\n3. 这为实际QKD系统提供了可行且显著更安全的设计方案，并启发了基于非局域性保障安全性的研究方向。", "summary_source": "deepseek", "authors": [{"name": "Mahdi Shaban"}, {"name": "Farnaz Farman"}, {"name": "Alireza Bahrampour"}], "featured_authors": [{"name": "Mahdi Shaban"}, {"name": "Farnaz Farman"}, {"name": "Alireza Bahrampour"}], "author_count": 3}, {"id": "2607.26999", "category": "quant-ph", "title": "Two-state generator extraction: property currents and a two-layer arrow of time in pre- and post-selected quantum dynamics", "abstract": "Conditioning on both past and future assigns intermediate-time properties a causal observer does not; these time-symmetric assignments obey exact symmetry theorems and are measurable from trajectories. We use two-state generator extended dynamic mode decomposition (gEDMD): because weak values obey $dA_w/dt=i\\langle[H,A]\\rangle_w$ exactly, generator extraction, with an exact-derivative baseline, applies unchanged to them. First, a reflection involution on the pre-/post-selected ensemble splits every window-fitted friction uniquely as $\\gamma_{fwd}=\\gamma_A+\\gamma_S$: $\\gamma_A$, antisymmetric about the midpoint, carries the modes' boundary-condition physics; $\\gamma_S$, symmetric, comes from the differencing scheme; both follow from the same data as $(\\gamma_{fwd}\\pm\\gamma_{bwd})/2$. At a fixed inference resolution the arrow of time has two layers: the coherent-mode arrow reverses at the midpoint, the fluctuation-level one does not, $\\gamma_S$ dominating $\\gamma_A$ at every size and class. The difference is one of degree: $\\gamma_S$ is 34 times larger there than at the mode layer, and with the exact derivative both layers reverse: immunity belongs to the inference, not the ensemble. Second, in a lattice interferometer conditioned only at its ports, the quantum Cheshire-cat structure emerges unimposed: particle and polarization obey separate continuity equations, and a local field in the polarization-carrying arm rotates that phase alone, at exactly twice the field strength, entering the generator as a rigid imaginary shift, while the particle's weak density stays invariant to machine precision. We verify the sample-level identity and the two layers from $2^8$ to $2^{20}$ dimensions: $|\\gamma_A|/\\gamma_S=0.09$ to $0.27$ across five classes; self-averaging makes it insensitive to class among those sharing a boundary modulation, removing the $2^{-N/2}$ overlap obstruction for $N$ qubits.", "url": "https://arxiv.org/abs/2607.26999", "type": "理论", "summary": "1. 该工作发展了两态生成器扩展动态模式分解，用于从预选与后选量子动力学中提取性质流和时间对称分配。\n2. 其核心是通过反射对合将窗口摩擦唯一分解为反对称模式边界项与对称差分项，从而揭示相干模态箭头在中点反转而波动层次不反转的双层时间箭头结构。\n3. 这为理解时间边界条件对箭头方向的控制、量子柴郡猫的自发涌现以及自平均效应消除比特数障碍提供了统一的生成器推断框架。", "summary_source": "deepseek", "authors": [{"name": "Seiki Saito"}], "featured_authors": [{"name": "Seiki Saito"}], "author_count": 1}, {"id": "2607.27013", "category": "quant-ph", "title": "Finite size scaling of bitstring probability distributions for Rydberg arrays", "abstract": "We calculate the probabilities $p_{\\{n\\}}$ of the measured bitstrings $\\{n\\}$ for the vacuum of Rydberg ladders with $N_q$ atoms. As $N_q$ increases, the $p_{\\{n\\}}$ decrease but become more dense in the low $p$ region raising the possibility that their smallness could be compensated by their large number. The importance of the low probability states can be estimated from the cumulative probability distribution $\\Sigma(p_{\\Lambda},N_q)$, which is the probability to observe any state having a probability $p\\leq p_{\\Lambda}$. For not too large values of $p_{\\Lambda}$, it is possible to approximately collapse the $\\Sigma(p_{\\Lambda},N_q)$ for successive $N_q$ into a function resembling the Fermi function when plotted as a function of $-\\ln(p_{\\Lambda})$. We show that the number of shots necessary to reduce $\\Sigma(p_{\\Lambda},N_q)$ to some low enough value grows exponentially with $N_q$. We discuss the implications for calculating observables associated with the vacuum.", "url": "https://arxiv.org/abs/2607.27013", "type": "理论", "summary": "1. 该工作计算了Rydberg梯子阵列真空态测量位串概率的有限尺度标度行为。\n2. 其核心在于发现累积概率分布随原子数增加呈类似费米函数的标度塌缩，且低概率态贡献随系统尺寸指数增长。\n3. 这为量子模拟中获取真空态可观测量所需的采样次数提供了指数级增长的定量估计。", "summary_source": "deepseek", "authors": [{"name": "Zane Ozzello"}, {"name": "Avi Kaufman"}, {"name": "Yannick Meurice"}], "featured_authors": [{"name": "Zane Ozzello"}, {"name": "Avi Kaufman"}, {"name": "Yannick Meurice"}], "author_count": 3}, {"id": "2607.27015", "category": "quant-ph", "title": "Reliability Functions of Quantum Soft Covering and Privacy Amplification via a Mixed-Order Rényi Divergence", "abstract": "In this paper, we introduce a novel mixed-order Rényi divergence and investigate its fundamental properties. Using this divergence, we define a family of mixed-order order-two Rényi mutual information and Rényi conditional entropy. We derive exact reliability functions of quantum soft covering and privacy amplification under the sandwiched Rényi divergence with order $\\alpha\\in[2,\\infty)$. The former is jointly characterized by the sandwiched and mixed-order order-two Rényi mutual information quantities, while the latter is characterized by the corresponding conditional entropies. These results provide operational interpretations of the proposed mixed-order Rényi divergence. To the best of our knowledge, this is the first exact characterization of the reliability function for quantum soft covering.", "url": "https://arxiv.org/abs/2607.27015", "type": "理论", "summary": "1. 该工作引入一种新型混合阶Rényi散度，并据此定义混合阶二阶Rényi互信息和条件熵，导出了量子软覆盖和隐私放大在sandwiched Rényi散度下α∈[2,∞)的精确可靠性函数。\n2. 关键在于量子软覆盖可靠性由sandwiched与混合阶二阶Rényi互信息联合表征，隐私放大由对应条件熵表征，首次实现这类可靠性函数的精确刻画。\n3. 这为量子信道模拟和密码协议的错误指数提供了操作解释，并有望推广至其他量子信息处理任务的渐近分析。", "summary_source": "deepseek", "authors": [{"name": "Shi-Bing Li"}, {"name": "Hongsen Qiu"}, {"name": "Xinyu Zhang"}], "featured_authors": [{"name": "Shi-Bing Li"}, {"name": "Hongsen Qiu"}, {"name": "Xinyu Zhang"}], "author_count": 3}, {"id": "2607.27060", "category": "quant-ph", "title": "Optimising Trotter-Suzuki Simulations of Markovian Open Quantum Systems via Classical Search", "abstract": "Simulating an open quantum system on a digital quantum computer often involves the use of Trotter-Suzuki (TS) Product Formulas (PF) to approximate the system's time evolution. Precise estimates for the required number of Trotter steps (and hence the overall gate count) can be crucial for minimising the computational cost of these methods. Building on established theoretical guarantees, we derive analytic bounds for the First- and Second-Order Deterministic and Randomised TS-PF, directly relating the number of Trotter steps to the model parameters, evolution time and precision. These bounds enable concrete resource estimation for each method. We then present a computationally efficient classical algorithm that uses diamond norm estimates of individual Liouvillian terms and a binary search to significantly reduce the Trotter steps required for a target precision. Our numerical results on two prototypical models - an XX-Spin Chain with boundary driving and local dephasing, and a Transverse-Field Ising Model - show that the theoretical (analytic) bounds are often overly conservative, whereas the empirical (optimised) bounds yield a significantly smaller number of Trotter steps for the same precision. Among the methods investigated, the Second-Order Randomised TS-PF typically achieves the lowest resource demands, especially for larger systems. These findings emphasise the significance of empirical bounding strategies in achieving more resource-efficient simulations of Markovian open quantum systems.", "url": "https://arxiv.org/abs/2607.27060", "type": "理论+数值", "summary": "1. 该工作通过经典搜索算法优化了马尔可夫开放量子系统在数字量子计算机上的Trotter-Suzuki模拟，将所需的Trotter步数降至理论保守界限以下。\n2. 其技术核心在于利用Liouvillian项的范数估计和二分搜索，为确定性与随机化的Trotter格式提供经验性的紧致界，从而实现资源高效模拟。\n3. 此方法揭示了随机化Trotter格式在大系统规模下具有最低资源消耗，为容错量子计算中开放系统演化的高效数字模拟开辟了实用路径。", "summary_source": "deepseek", "authors": [{"name": "S. M. Pillay"}, {"name": "I.J. David"}, {"name": "I. Sinayskiy"}, {"name": "F. Petruccione"}], "featured_authors": [{"name": "S. M. Pillay"}, {"name": "I.J. David"}, {"name": "I. Sinayskiy"}, {"name": "F. Petruccione"}], "author_count": 4}, {"id": "2607.27075", "category": "quant-ph", "title": "Adaptive Multi-Backend Simulation of Near-Clifford Quantum Circuits via Spatial Stabilizer-Frame Partitioning", "abstract": "We present an exact amplitude simulator for Clifford+T quantum circuits that combines a Feynman path sum across a balanced qubit bipartition with stabilizer-frame simulation on each half. The construction extends prior stabilizer-based Schrödinger-Feynman methods in three directions: recursive multilevel bipartition into a binary tree, automatic fallback to dense state-vector simulation when a leaf's stabilizer frame would exceed its memory ceiling, and a cost-model-driven partition selector that replaces the standard cut-count minimization heuristic. We show cut-count minimization is an unreliable proxy in practice: a globally cleaner partition can reduce cross-cut count yet increase wall-clock time, because it imbalances T-gate density across halves and inflates per-half stabilizer-frame size. Our cost model substitutes the stabilizer-frame bound 2w for the dense 2n ceiling per side and explicitly models per-amplitude readout cost; isolating that term uncovered a quadratic-asymptotic inefficiency in the leaf simulator's end-of-path amplitude extraction, fixed by replacing it with an existing O(F * s * n) single-amplitude inner product. On a structured hierarchical n=16 benchmark the recursive simulator beats monolithic stabilizer-frame simulation by 92x to 17,645x, wins by 79x per path against a dense half-state-vector baseline under an identical cut, and beats a production state-vector simulator end to end by up to 47.9x (median ~5x). On adversarial random Clifford+T circuits the dense state vector wins past a crossover near n/2 cross-cut gates -- the regime the cost model identifies. The dominant cost, the cross-cut Feynman sum, is embarrassingly parallel with constant inter-worker communication, unlike recent matrix-product-state stabilizer-tensor methods whose inner contraction loop is sequential.", "url": "https://arxiv.org/abs/2607.27075", "type": "理论+数值", "summary": "1. 该工作提出一种精确幅度模拟器，通过空间稳定子框架划分和递归多级二叉费曼路径求和，模拟近克利福德量子电路。\n2. 其技术卖点是用成本模型驱动分区选择器替代不可靠的切割计数最小化，以稳定子帧界2w替代稠密界2n，并替换叶模拟器的内积提取消除二次渐近低效。\n3. 该方法在层次化基准上比单一稳定子框架模拟快17645倍，跨切割费曼求和常量通信且完全并行，为中等规模近克利福德电路的高效模拟提供了可扩展框架。", "summary_source": "deepseek", "authors": [{"name": "Héctor J. García"}], "featured_authors": [{"name": "Héctor J. García"}], "author_count": 1}, {"id": "2607.27111", "category": "quant-ph", "title": "Effective Hamiltonians for Predictive Quantum Control", "abstract": "High-fidelity quantum control relies on accurate models of driven dynamics. We examine this re- quirement for single-qubit gates in superconducting transmons by comparing control pulses derived from the standard Duffing approximation and from a Hamiltonian constructed by diagonalizing the transmon eigenbasis. Using the same correction-pulse construction for both models, we show that correction fields derived from the Duffing approximation can substantially reduce the gate error pre- dicted by that model while remaining less effective when combined with an independently calibrated baseline pulse in the diagonalized-transmon model. In the fast-gate regime, such transferred correc- tions can even fail to improve over the uncorrected diagonalized-transmon baseline. We show that small model-dependent differences in both the energy spectrum and the representation of the drive operator can compound during driven evolution, resulting in different predicted error generators and correction pulses. A mismatch in the accumulated AC Stark phase provides one illustrative di- agnostic of this dynamical model dependence. We further demonstrate that the model Hamiltonian informs the choice of control framework: Omitting relevant leakage pathways or higher-order error channels can lead to an overly restricted correction strategy. Including these channels motivates an extended correction framework that improves the gate performance using the same physical control resources.", "url": "https://arxiv.org/abs/2607.27111", "type": "理论", "summary": "1. 该工作对比了超导transmon中基于Duffing近似与对角化哈密顿量导出的单量子比特门控制脉冲，揭示了模型差异对保真度预测的影响。\n2. 能谱与驱动算符表示的小尺度模型依赖差异在动力学演化中累积，导致误差生成器与修正脉冲不同，AC Stark相位失配成为关键诊断。\n3. 这指明忽略相关泄漏通道会导致过度约束的修正策略，扩展包含高阶误差的框架可提升相同物理资源下的门性能。", "summary_source": "deepseek", "authors": [{"name": "Razvan Stanescu"}, {"name": "Hugo Ribeiro"}], "featured_authors": [{"name": "Razvan Stanescu"}, {"name": "Hugo Ribeiro"}], "author_count": 2}, {"id": "2607.27116", "category": "quant-ph", "title": "Ky Fan majorization for binary tensor products", "abstract": "We provide a short proof of a Ky Fan-type majorization relation for the singular values of a sum of binary tensor products of matrices. This generalizes Alhejji's result ( arXiv:2410.18254 ) from two summands to arbitrary sums and from positive matrices to arbitrary matrices. As an application, we show a majorization relation between the singular values of a completely positive map and those of its Kraus operators.", "url": "https://arxiv.org/abs/2607.27116", "type": "理论", "summary": "1. 该工作给出了二元张量积矩阵和的奇异值满足Ky Fan型主化关系的简短证明。\n2. 其技术卖点在于将前人的结果从两项和与正矩阵推广至任意项和与任意复矩阵。\n3. 这为完全正映射的奇异值与其Kraus算子之间建立了明确的主化关系，潜在启发量子信息理论中的谱分析。", "summary_source": "deepseek", "authors": [{"name": "Michael M. Wolf"}, {"name": "Yuanheng Zhou"}], "featured_authors": [{"name": "Michael M. Wolf"}, {"name": "Yuanheng Zhou"}], "author_count": 2}, {"id": "2607.27117", "category": "quant-ph", "title": "The Keyl-Werner algorithm is not optimal for spectrum estimation", "abstract": "We give an algorithm which, given $n = O(d^2 \\cdot (\\log\\log(d)/\\log(d))^2)$ copies of $\\rho$, estimates the eigenvalues of $\\rho$ to constant error in total variation distance. Thus, we can learn the eigenvalues of a quantum state with fewer copies than the $\\Theta(d^2)$ needed to run full state tomography. This is the first improvement to spectrum estimation over the influential Keyl-Werner algorithm, which uses $n = \\Theta(d^2)$ copies, thereby resolving a question raised by Keyl and Werner in 2001 and refuting a 2016 conjecture of Wright. Our main technical tool is a new tomography guarantee, where the error of tomography in a particular direction $|w\\rangle$ scales with $\\langle w | \\rho |w\\rangle$ for all directions simultaneously. From this stronger \"relative-error\" bound, we recover better algorithms for principal component analysis in Bures distance and tomography in $\\chi^2$-divergence as corollaries.", "url": "https://arxiv.org/abs/2607.27117", "type": "理论+数值", "summary": "1. 该工作给出一个算法，用O(d² (log log d/log d)²)份拷贝以常数误差估计量子态特征值，优于Keyl-Werner算法。\n2. 其核心是一个方向依赖的相对误差断层扫描保证，任意|w⟩上的误差按⟨w|ρ|w⟩缩放。\n3. 这否定了Wright的猜想，并作为推论改进了Bures距离下的主成分分析和χ²散度下的断层扫描。", "summary_source": "deepseek", "authors": [{"name": "Angelos Pelecanos"}, {"name": "Jack Spilecki"}, {"name": "Ewin Tang"}, {"name": "John Wright"}], "featured_authors": [{"name": "Angelos Pelecanos"}, {"name": "Jack Spilecki"}, {"name": "Ewin Tang"}, {"name": "John Wright"}], "author_count": 4}, {"id": "2607.27144", "category": "quant-ph", "title": "Parity-Based Time-Bin Encoding Enabling SWAP Between Polarization and Time-Bin Qubits", "abstract": "Multi-degree-of-freedom photonic quantum processing requires routing between degree-of-freedom (DOF) qubit encodings on a single photon. A SWAP between polarization and time-bin qubits is Multi-degree-of-freedom photonic quantum processing requires routing between degree-of-freedom (DOF) qubit encodings on a single photon. A SWAP between polarization and time-bin qubits is an advantageous primitive for such architectures, however conventional early/late time-bin encoding does not support bidirectional logical time-bin flips from late to early which limits the ability to implement certain quantum operations. We introduce a parity-based time-bin encoding in which logical $\\vert 0 \\rangle_T$ and $\\vert 1 \\rangle_T$ correspond to even and odd multiples of a spacing $\\Delta t$, so that a physical delay of $\\Delta t$ implements $\\vert 0 \\rangle_T \\leftrightarrow \\vert 1 \\rangle_T$. This encoding is the enabling ingredient that makes a polarization-controlled delay line implement $\\mathrm{CNOT}_{P \\rightarrow T}$ and aligns naturally with periodic refractive index modulation for $\\mathrm{CNOT}_{T \\rightarrow P}$. Composing three such CNOT operations sequentially results in a deterministic SWAP between polarization and time-bin degrees of freedom. We analyze field-based modulation polarization-rotation error probability and timing-resolution constraints set by both EOM drive electronics and photon detection.", "url": "https://arxiv.org/abs/2607.27144", "type": "理论", "summary": "1. 该工作引入基于奇偶性的时间-bin编码，通过三个级联CNOT门实现了偏振与时间-bin量子比特间的确定性SWAP操作。\n2. 其核心在于奇偶性编码使物理延迟Δt直接实现逻辑时间-bin翻转，克服了传统早/晚编码无法双向翻转的限制，并自然适配于偏振控制延迟线与周期折射率调制构成CNOT门。\n3. 这为光子多自由度量子信息处理提供了高效路由原语，并明确了基于电光调制与探测时序误差的工程实现约束。", "summary_source": "deepseek", "authors": [{"name": "Adam Sultan"}, {"name": "Connor Kupchak"}], "featured_authors": [{"name": "Adam Sultan"}, {"name": "Connor Kupchak"}], "author_count": 2}, {"id": "2607.27153", "category": "quant-ph", "title": "Improved Methods for Determining Quantum Error Correcting Code Performance and Fault Tolerance", "abstract": "One of the central challenges in quantum error correction is determining the performance of a code in the low-error regimes needed to implement utility-scale computations. While performance at these error rates is not amenable to direct Monte Carlo simulation, it can be extrapolated from simulations at higher logical error rates, assuming the logical error rate scales predictably with increasing distance or decreasing physical error rate. However, the expected scaling depends sensitively on the minimum weight of uncorrectable error patterns. In many cases, the minimum weight is unknown since it depends not only on the theoretical code distance, but also on details of the implementation. Markov chain Monte Carlo (MCMC) methods, as adapted to quantum error correction by Bravyi and Vargo, provide a way to estimate logical failure rates in these low-error regimes via simulation. While offering significant gains over Monte Carlo, the described Metropolis algorithm makes small changes to the current logical failure patterns which results in slow convergence. In this paper, we argue that typical failure patterns include a large number of easily correctable errors that coexist alongside a malignant core. This observation motivates two new approaches to better evaluate code performance. First, we describe a pruning algorithm designed to obviate these correctable errors and focus on the problematic low-weight core. Second, we develop a novel family of Metropolis-Hastings algorithms, referred to as subregion MCMC. This technique is parameterized by the fraction of the error pattern that is resampled at each step, effectively interpolating between Monte Carlo and single step MCMC. We show that a judicious choice of this parameter results in far faster convergence than prior work.", "url": "https://arxiv.org/abs/2607.27153", "type": "理论+数值", "summary": "1. 该工作针对低错误率下量子纠错码性能难以直接模拟的问题，提出了剪枝算法与子区域MCMC两种改进评估方法。\n2. 其核心创新在于利用典型错误模式中可纠错误与恶性核心共存的观测，通过剪枝去除可纠部分并设计参数化子区域重采样策略，大幅加速了Metropolis-Hastings收敛。\n3. 这为精确推断实用规模量子计算所需极低逻辑错误率下的编码表现提供了高效数值工具，并推动了容错阈值理论的验证。", "summary_source": "deepseek", "authors": [{"name": "Michael Mullan"}, {"name": "Matthew Weippert"}, {"name": "Winton Brown"}], "featured_authors": [{"name": "Michael Mullan"}, {"name": "Matthew Weippert"}, {"name": "Winton Brown"}], "author_count": 3}, {"id": "2607.27171", "category": "quant-ph", "title": "OQRAM: Oblivious Quantum Random Access Memory for Securing Delegated Quantum Queries", "abstract": "Quantum query is a basic subroutine in many quantum algorithms, and Quantum Random Access Memory (QRAM) provides a natural way to realize such coherent query access. In delegated settings, however, a standard QRAM query interface can expose sensitive information to the server. This paper introduces oblivious QRAM, a cryptographic abstraction for privacy-preserving delegated coherent query access. The protocol consists of an offline refresh phase and an online protected query phase. The database is stored in an encrypted and shuffled layout, and each query is protected by coherent address masking using either a quantum-secure pseudorandom permutation (qPRP) based method or a quantum one-time pad (qOTP) based method. In the adopted client model, the online protection adds only modest quantum overhead beyond the query register, avoiding the exponential quantum resources that would otherwise be required by an equivalent local QRAM construction. The qPRP-based variant also supports multi-query use by distributing database refresh across multiple queries to reduce classical communication. To address malicious servers, decoy checks are further incorporated to strengthen privacy protection and enable probabilistic tampering detection. Compared with fully blind quantum computing, this framework provides a lighter abstraction tailored to private delegated QRAM access, significantly reducing quantum resource requirements on both the client and server sides and achieving an exponential reduction in quantum communication.", "url": "https://arxiv.org/abs/2607.27171", "type": "理论+数值", "summary": "1. 本工作提出不经意量子随机存取存储器(OQRAM)协议，用于在委托量子查询场景中保护数据库与查询隐私。\n2. 其核心是通过加密洗牌布局与相干地址掩蔽（基于qPRP或qOTP）实现指数级量子资源节省，并支持多查询刷新与恶意服务器的诱饵检测。\n3. 该框架为隐私保护委托量子访问提供了比全盲量子计算更轻量的抽象，有望大幅降低实际部署中的量子通信与计算开销。", "summary_source": "deepseek", "authors": [{"name": "Shifan Xu"}, {"name": "Yizhuo Tan"}, {"name": "Yongshan Ding"}, {"name": "Jakub Szefer"}], "featured_authors": [{"name": "Shifan Xu"}, {"name": "Yizhuo Tan"}, {"name": "Yongshan Ding"}, {"name": "Jakub Szefer"}], "author_count": 4}, {"id": "2607.27173", "category": "quant-ph", "title": "Classical and Quantum MacWilliams Transforms as Spin Kinematics", "abstract": "Spin is the hidden engine behind the zoo of MacWilliams transforms in weight enumerator theories - not only for qubits and qudits, but even for classical codes. From nothing more than a split into trivial and nontrivial errors, we kinematically derive the MacWilliams transform as a Wigner-$D$ rotation between two canonical bases. Within each classical and quantum theory, changing the length $n$ leaves the rotation untouched: the same element simply reappears at spin $n/2$. And at fixed $n$, changing the rotation axis simply moves between the various classical and quantum theories.", "url": "https://arxiv.org/abs/2607.27173", "type": "理论", "summary": "1. 该工作将经典与量子权重枚举器理论中的MacWilliams变换统一阐释为自旋运动学框架下的Wigner-D旋转过程。\n2. 其核心技术是从平凡与非平凡错误的二分出发，运动学推导出变换即为两规范基间的旋转，且长度n仅改变自旋量子数，旋转轴选择则对应经典与量子理论间的切换。\n3. 这为编码理论、量子纠错及权重枚举研究提供了基于角动量的统一几何语言，有望促进跨领域对称性分析与新编码方案设计。", "summary_source": "deepseek", "authors": [{"name": "Eric Kubischta"}, {"name": "Ian Teixeira"}], "featured_authors": [{"name": "Eric Kubischta"}, {"name": "Ian Teixeira"}], "author_count": 2}, {"id": "2607.27185", "category": "quant-ph", "title": "Sharp Bounds on Ground State Energy of the SYK Model", "abstract": "We study the Sachdev-Ye-Kitaev (SYK) Hamiltonian $H_{\\operatorname{SYK}}$ on $n$ Majorana modes with $k$-body interactions, and prove that $\\mathbb{E}\\|H_{\\operatorname{SYK}}\\|_{\\operatorname{op}} = (1 - o(1))\\cdot\\sqrt{2n}/k$ for super-constant $k\\leq o(\\sqrt{n})$, where the expectation is over the disorder variables in the Hamiltonian. This confirms the predictions due to Garcia-Garcia, Jia and Verbaarschot'18 and answers a question posed in Feng, Tian and Wei'19. Our results extend to the sparse SYK Hamiltonian. As a corollary, we obtain that the dissipative quantum algorithm of Basso, Chen and Dalzell'24 provably computes the ground state energy of the SYK Hamiltonian up to an $O(1)$-multiplicative factor for all $k < \\sqrt{n}/4$. Our key technical idea is identifying an explicit, deterministic linear operator $\\mathsf{x}$ such that a fixed quadratic form of $\\mathsf{x}^{2\\ell}$ exactly equals the expected trace moments of the SYK Hamiltonian for every $n$ and $k$. This linear operator can be naturally viewed as a \\emph{twisted} model of bosons on the space of hyperedges of a hypergraph. The problem thus reduces to identifying the spectral edge of $\\mathsf{x}$, which we show is dominated by the spectrum of a natural ${n \\choose k}$-dimensional matrix from the \\emph{Johnson} scheme and is straightforward to compute using known results. To show that our bound is sharp, we construct a witness state with a large quadratic form on $\\mathsf{x}$ and transform it into a certificate of a lower bound on the largest quadratic form on $H_{\\operatorname{SYK}}$.", "url": "https://arxiv.org/abs/2607.27185", "type": "理论+数值", "summary": "1. 该工作严格证明了SYK模型哈密顿量算符范数的期望在超常数k下达到(1-o(1))·√(2n)/k，并扩展到稀疏情形。\n2. 关键技巧是将期望迹矩精确映射为确定性线性算符的二次型，该算符构成超边空间上的扭曲玻色子模型，其谱由Johnson方案的矩阵主导。\n3. 这一结果提供了SYK基态能量的O(1)乘法近似严格界，并启发了耗散量子算法的可证明计算能力与随机多体系统组合结构之间的深层联系。", "summary_source": "deepseek", "authors": [{"name": "Arpon Basu"}, {"name": "Pravesh K. Kothari"}, {"name": "Siddhant Midha"}], "featured_authors": [{"name": "Arpon Basu"}, {"name": "Pravesh K. Kothari"}, {"name": "Siddhant Midha"}], "author_count": 3}, {"id": "2607.27195", "category": "quant-ph", "title": "Very Strong Irreversibility of Quantum Entanglement", "abstract": "The manipulation of quantum entanglement is fundamentally irreversible: some mixed entangled states require pure entanglement for their preparation, although no pure entanglement can be recovered from them by local operations and classical communication. This irreversibility is known to persist even under the maximal class of operations that do not generate entanglement, revealing a fundamental distinction between entanglement theory and thermodynamics. We construct cases for which any attempt to restore reversibility necessarily incurs an error that increases exponentially with the number of copies. Technically, we demonstrate a strict separation between the exponential strong-converse distillable entanglement and the exponential strong-converse entanglement cost. Our result resolves a conjecture posed by Lami and Regula (Nat. Phys. 19, 184-189 (2023)) and strengthens it by showing that the irreversibility of entanglement persists even at the level of polynomially (in the number of copies) growing error. We further derive a semidefinite-programming lower bound on the exponential strong-converse cost under non-entangling operations. Finally, for the class of completely PPT-preserving operations, we construct analytically solvable families of antisymmetric states exhibiting the exponential strong-converse irreversibility. Remarkably, to our knowledge, no analogous separation between exponential strong converse cost and the analogous distillable entanglement is currently known even under the more restrictive class of LOCC operations.", "url": "https://arxiv.org/abs/2607.27195", "type": "理论", "summary": "1. 该工作构造了纠缠态例子，表明任何恢复可逆性的尝试都会导致随拷贝数指数增长的误差，并严格分离了指数强反演可蒸馏纠缠与指数强反演纠缠成本。\n2. 其技术卖点在于证明了即使在多项式误差水平下纠缠的不可逆性依然存在，并基于半定规划给出了指数强反演成本的下界，同时构造了反演态的解析族。\n3. 这解决了纠缠不可逆性的猜想并将其强化，为理解纠缠理论与热力学的根本差异以及更严格约束下（如LOCC）的类似分离提供了明确启发。", "summary_source": "deepseek", "authors": [{"name": "Tulja Varun Kondra"}, {"name": "Raphael Brinster"}, {"name": "Hermann Kampermann"}, {"name": "Dagmar Bruß"}, {"name": "Nikolai Wyderka"}], "featured_authors": [{"name": "Tulja Varun Kondra"}, {"name": "Raphael Brinster"}, {"name": "Hermann Kampermann"}, {"name": "Dagmar Bruß"}, {"name": "Nikolai Wyderka"}], "author_count": 5}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>${paper.summary_source === "deepseek" ? "DeepSeek three-sentence PRL summary" : (paper.summary_source === "local-fallback" ? "Local three-sentence fallback" : (paper.summary_source === "translation" ? "Chinese abstract translation" : "Chinese placeholder fallback"))}</span><a href="${safeUrl}" target="_blank" rel="noreferrer">Open arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
</body>
