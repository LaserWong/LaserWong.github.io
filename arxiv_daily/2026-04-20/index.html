source": "deepseek", "authors": [{"name": "Lorenzo Toni"}], "featured_authors": [{"name": "Lorenzo Toni"}], "author_count": 1}, {"id": "2604.15600", "category": "hep-th", "title": "Secondary invariants and non-perturbative states", "abstract": "At finite $N$ the ring of gauge invariant operators is not freely generated. For problems of interest in physics, these rings are Cohen--Macaulay and admit a Hironaka decomposition, in which the full invariant ring is a free module over a polynomial ring generated by the primary invariants. The module basis is given by finitely many secondary invariants. This motivates a physical picture in which the primary invariants are regarded as perturbative degrees of freedom while the secondary invariants are associated with distinguished non-perturbative states or sectors. The purpose of this study is to show that a concrete algebraic version of this picture is visible in simple zero-dimensional matrix integrals.", "url": "https://arxiv.org/abs/2604.15600", "type": "理论", "summary": "1. 该工作通过零维矩阵积分具体展示了规范不变算子环的Hironaka分解结构及其物理对应。\n2. 其核心在于将代数分解中的次级不变量明确对应于非微扰态，从而为微扰/非微扰对偶提供了可操作的代数几何图像。\n3. 这一框架有望推广至高维规范理论或弦论背景，为系统识别与分类非微扰自由度开辟了代数途径。", "summary_source": "deepseek", "authors": [{"name": "Robert de Mello Koch"}, {"name": "João P. Rodrigues"}], "featured_authors": [{"name": "Robert de Mello Koch"}, {"name": "João P. Rodrigues"}], "author_count": 2}, {"id": "2604.15720", "category": "hep-th", "title": "Geometric entropy and time-like entanglement entropy on a rotating BTZ black hole", "abstract": "In this paper, we analyze the double Wick rotation of a rotating BTZ black hole and the entanglement entropy. We derive the transition matrix dual to the double Wick-rotated BTZ black hole, which has the usual shape at an imaginary chemical potential. In the dual gravity side, the double Wick rotated BTZ black hole, which is obtained as a quotient, is equal to a rotating BTZ black hole after the coordinate transformation and the identification of periodicity. The geometric entropy and time-like entanglement entropy are reproduced by the identification. New Lorentzian entanglement growth is defined by the coefficient of linear growth of time-like entanglement entropy.", "url": "https://arxiv.org/abs/2604.15720", "type": "理论", "summary": "1. 该工作通过分析旋转BTZ黑洞的双Wick旋转，推导了对偶于该几何的转移矩阵（在虚化学势下呈标准形式），并关联了几何熵与时间类纠缠熵的计算。\n2. 其核心物理贡献在于通过商构造和坐标变换，将双Wick旋转黑洞等同于原旋转黑洞，从而在引力对偶中精确再现了这些熵的表达式。\n3. 通过基于时间类纠缠熵线性增长系数定义新的洛伦兹纠缠增长，这为探索黑洞热力学、量子信息及时空量子结构提供了明确的理论方向。", "summary_source": "deepseek", "authors": [{"name": "Huayu Dai"}, {"name": "Xi-Hao Fang"}, {"name": "Mitsutoshi Fujita"}, {"name": "Song He"}], "featured_authors": [{"name": "Huayu Dai"}, {"name": "Xi-Hao Fang"}, {"name": "Mitsutoshi Fujita"}, {"name": "Song He"}], "author_count": 4}, {"id": "2604.15730", "category": "hep-th", "title": "Stringy Effects on Holographic Complexity: The Complete Volume in Dynamical Spacetimes", "abstract": "We investigate the stringy effects on holographic complexity in $(d+1)$-dimensional Gauss-Bonnet gravity using the ``complete volume'' proposal for higher-curvature theories. Our analysis covers unperturbed eternal black holes, as well as the one-sided and two-sided Vaidya spacetimes. The one-sided geometry describes a null shell collapsing into the empty AdS vacuum to form a black hole, while the two-sided geometry represents a null shell injected into an eternal black hole background with arbitrary energy. For unperturbed backgrounds, higher-curvature terms introduce explicit corrections to the standard CV proposal, giving rise to a ``competition effect'' absent in the uncorrected framework. In the dynamical settings, we demonstrate that despite novel jumps in the canonical velocities across the null shell, the complexity growth rate remains universally governed by the conserved momentum, just as in Einstein gravity. Furthermore, our two-sided shock wave analysis reveals that Gauss-Bonnet corrections prolong the critical time, preserving the universal logarithmic dependence for the scrambling time.", "url": "https://arxiv.org/abs/2604.15730", "type": "理论", "summary": "1. 该研究在(d+1)维Gauss-Bonnet引力中，采用完整体积方案系统考察了弦效应对全息复杂度在静态永恒黑洞与单双侧Vaidya动力时空中的影响。\n2. 核心发现表明：尽管高阶曲率项在零壳层处引发正则速度的新奇跃变，复杂度增长率仍由守恒动量普遍支配，此特性与爱因斯坦引力情形一致。\n3. 双侧重力波分析揭示Gauss-Bonnet修正会延迟临界时间，同时维持了 scrambling time 对边界条件的普适对数依赖关系，这为探索高阶曲率理论与量子混沌关联提供了新视角。", "summary_source": "deepseek", "authors": [{"name": "Qi Yang"}, {"name": "Yu-Xiao Liu"}], "featured_authors": [{"name": "Qi Yang"}, {"name": "Yu-Xiao Liu"}], "author_count": 2}, {"id": "2604.15745", "category": "hep-th", "title": "Dirac-Bergmann analysis of SW-mapped non-commutative $U(1)$ electrodynamics with external currents", "abstract": "Non-commutative electrodynamics obtained through the Seiberg-Witten map ceases to have equivalent action-level and equation-level realizations once fixed external currents are introduced, and in the action-level construction associated with the Banerjee current map the canonical location of this source-induced obstruction has remained unclear. Working in the full phase space and treating the current as prescribed and non-dynamical, we apply the Dirac-Bergmann algorithm without imposing current conservation as an external condition. The preservation of the Gauss-type secondary constraint produces a third-stage candidate whose phase-space expression is shown to be algebraically identical, at first order in the non-commutativity parameter and for purely space-space non-commutativity, to the canonical pullback of the divergence of the mapped Euler-Lagrange equations. This identity locates the source-compatibility obstruction directly within the Dirac chain. For generic inhomogeneous sources, the next consistency step feeds this object back into the primary multiplier through a source-dependent kernel, so the chain closes by multiplier fixing rather than by the generic appearance of a quaternary constraint. Reduced-phase-space results, including the gauge generator, Dirac brackets and degree-of-freedom count, are obtained only in a restricted sufficient first-class subcase; no broader claim is made for arbitrary source profiles.", "url": "https://arxiv.org/abs/2604.15745", "type": "理论", "summary": "1. 本工作对引入固定外流的Seiberg-Witten映射非对易U(1)电动力学，在完整相空间中应用了不预设流守恒的Dirac-Bergmann约束分析算法。\n2. 核心发现是：高斯型次级约束的保持条件所产生的三阶候选式，在空间非对易性一阶近似下，代数等同于映射欧拉-拉格朗日方程散度的正则拉回，从而将源相容性障碍精确定位在Dirac约束链中。\n3. 这为理解非对易规范理论中外部源与约束体系的一致性条件提供了清晰的相空间表述框架，并指明了在一般非齐次源情形下需通过乘子固定而非产生新约束来闭合约束链的机制。", "summary_source": "deepseek", "authors": [{"name": "J. Manuel Cabrera"}, {"name": "A. G. Andarcia Caballero"}, {"name": "J. M. Paulin Fuentes"}], "featured_authors": [{"name": "J. Manuel Cabrera"}, {"name": "A. G. Andarcia Caballero"}, {"name": "J. M. Paulin Fuentes"}], "author_count": 3}, {"id": "2604.15790", "category": "hep-th", "title": "Holographic Stirling engines and the route to Carnot efficiency", "abstract": "We compute the efficiency of the reversible Stirling engine, with and without regeneration, for a broad class of working substances including Van der Waals fluids, quantum ideal gases (Bose and Fermi), Bose-Einstein condensates, thermal conformal field theories (CFTs), and holographic CFTs. Regeneration acts as an internal heat recycling mechanism that enhances efficiency by reducing the net heat exchange with external reservoirs. For regenerative Stirling cycles, a central role is played by the intrinsic heat mismatch between the two isochoric branches, which controls the deviation of the efficiency from the Carnot bound and quantifies the extent to which internally exchanged heat can be perfectly recycled. We identify a general sufficient condition for attaining Carnot efficiency, namely that the fixed-volume heat capacity is independent of the volume, ensuring that the isochoric heat mismatch vanishes. While this condition is satisfied for classical ideal gases and Van der Waals fluids, it is violated for quantum ideal gases and CFT working substances. For thermal CFT states dual to AdS-Schwarzschild and AdS-Reissner-Nordström black holes we obtain exact expressions for the Stirling efficiency. In the fixed-potential ensemble, we show that the Stirling efficiency asymptotes to the Carnot value in the large-potential limit, with a faster approach in the presence of regeneration.", "url": "https://arxiv.org/abs/2604.15790", "type": "理论", "summary": "1. 该工作计算了包含范德瓦尔斯流体、量子理想气体、玻色-爱因斯坦凝聚态、热共形场论及全息共形场论在内多种工质在可逆斯特林循环（含再生与不含再生情形）的效率。\n2. 研究揭示了实现卡诺效率的一个普适充分条件：定容热容与体积无关，该条件使等容分支的热失配为零；而再生机制通过内部热循环减少外热源净热交换，能加速趋近卡诺极限。\n3. 对于对偶于AdS-Schwarzschild与AdS-Reissner-Nordström黑洞的热共形场态，研究给出了斯特林效率的精确表达式，并证明在固定势系综中大势极限下效率渐近于卡诺值，且再生机制可加速这一趋近过程。", "summary_source": "deepseek", "authors": [{"name": "Nikesh Lilani"}, {"name": "Manus R. Visser"}], "featured_authors": [{"name": "Nikesh Lilani"}, {"name": "Manus R. Visser"}], "author_count": 2}, {"id": "2604.15926", "category": "hep-th", "title": "Exact expectation values in a boost-invariant fluid of Dirac fermions with finite spin density", "abstract": "We study a boost-invariant, out-of-equilibrium fluid of non-interacting Dirac fermions with a finite canonical spin potential. After solving the Dirac equation in Milne coordinates, we exactly diagonalize the non-equilibrium density operator and compute the partition function and expectation values of relevant observables, including spin polarization, energy density, longitudinal and transverse pressures, spin density, and \\emph{spin torque}, i.e. the source of spin non-conservation. We find an analytic expression for the partition function at finite spin potential, and show numerically that thermodynamic relations connecting it to thermodynamic functions hold in the system under consideration. We show that, in a boost-invariant system, both shear-induced polarization and the spin Hall effect are absent, and that a non-vanishing polarization can only arise from a finite spin potential in a free theory. We obtain an analytic expression for the spin polarization as a function of the spin potential in some particular cases, and otherwise compute numerically its exact expectation value at finite spin potential. Our results are discussed in the context of relativistic spin hydrodynamics and quark--gluon plasma phenomenology.", "url": "https://arxiv.org/abs/2604.15926", "type": "理论", "summary": "1. 该工作研究了具有有限正则自旋势的非平衡、无相互作用狄拉克费米子助推不变流体，通过在米尔纳坐标中求解狄拉克方程并精确对角化非平衡密度算符，计算了配分函数及自旋极化等可观测量。\n2. 研究揭示在助推不变系统中，剪切诱导极化和自旋霍尔效应均不存在，自由理论中非零极化仅能由有限自旋势产生，并给出了自旋极化随自旋势变化的解析表达式与数值精确期望值。\n3. 结果为相对论性自旋流体动力学提供了非平衡态下的精确基准，对夸克-胶子等离子体唯象学中自旋极化的微观机制研究具有明确启示。", "summary_source": "deepseek", "authors": [{"name": "Andrea Palermo"}, {"name": "Daniele Roselli"}], "featured_authors": [{"name": "Andrea Palermo"}, {"name": "Daniele Roselli"}], "author_count": 2}, {"id": "2604.15988", "category": "hep-th", "title": "Testing Scalar Field Self-Dualities in d=2 using a Variational Method", "abstract": "Recently, self-dualities based on saddle-point expansions have been proposed as a means to obtain qualitative non-perturbative information in scalar field theories. In this work, we test this proposition quantitatively by studying the phase transition for critical scalar $\\phi^4$ field theory in 1+1 dimensions using a variational method. We find that saddle-point methods obtain quantitative agreement for the free energy, but differ on the order of 25 percent for the peak location of the correlation length.", "url": "https://arxiv.org/abs/2604.15988", "type": "理论", "summary": "1. 该工作通过变分方法研究了1+1维临界标量φ⁴场理论的相变，定量检验了基于鞍点展开的自对偶性命题。\n2. 研究发现鞍点方法在自由能上可获得定量吻合，但关联长度峰值位置存在约25%的系统偏差。\n3. 这一结果明确了现有自对偶性方法的精度边界，为改进非微扰计算方案提供了定量基准。", "summary_source": "deepseek", "authors": [{"name": "Paul Romatschke"}, {"name": "Ulrike Romatschke"}], "featured_authors": [{"name": "Paul Romatschke"}, {"name": "Ulrike Romatschke"}], "author_count": 2}, {"id": "2604.16035", "category": "hep-th", "title": "Coulomb Potential in Podolsky-Carroll-Field-Jackiw Electrodynamics", "abstract": "Podolsky electrodynamics, a higher-derivative extension of Maxwell's theory characterized by the Podolsky parameter $\\lambda=1/m$, which modifies the photon dispersion relation and regularizes short-distance divergences, is investigated. This framework is then coupled to the Carroll-Field-Jackiw (CFJ) model, in which a Lorentz-violating background four-vector is introduced. Within this extended electrodynamics, the photon propagator is obtained in the combined Podolsky-CFJ framework and subsequently applied to Möller scattering. It is shown that the CFJ contribution can reintroduce the short-distance divergence suppressed by Podolsky's term. In the nonrelativistic limit, both the spatial component--which introduces a preferred direction in space and thus breaks isotropy--and the timelike component--which directly affects the dispersion relation--contribute nontrivially to the interaction potential.", "url": "https://arxiv.org/abs/2604.16035", "type": "理论", "summary": "1. 该工作将正则化短程发散的高阶导数Podolsky电动力学与破坏洛伦兹对称性的Carroll-Field-Jackiw模型结合，计算了该混合框架下的光子传播子并将其应用于Møller散射过程。\n2. 研究发现，CFJ项的引入能够抵消Podolsky参数对紫外发散的压制效应，且在非相对论极限下，其类空分量通过打破空间各向同性、类时分量通过改变色散关系，均对相互作用势产生实质性修正。\n3. 此结果为探讨洛伦兹对称性破缺与紫外正则化机制之间的竞争关系，以及由此产生的非平庸静态势效应，提供了具体的理论范例与量化分析途径。", "summary_source": "deepseek", "authors": [{"name": "D. S. Cabral"}, {"name": "L. A. S. Evangelista"}, {"name": "A. F. Santos"}], "featured_authors": [{"name": "D. S. Cabral"}, {"name": "L. A. S. Evangelista"}, {"name": "A. F. Santos"}], "author_count": 3}, {"id": "2604.16109", "category": "hep-th", "title": "Constrained Padé Ensembles for Thermal $\\mathcal{N}{=}4$ SYM with the Exact $\\mathcal O(λ^{5/2})$ Coefficient", "abstract": "We revisit the constrained log-subtracted two-point Padé (LSTP) ensemble for thermal $\\mathcal{N}=4$ supersymmetric Yang--Mills (SYM) thermodynamics in four spacetime dimensions after upgrading the weak-coupling truncation from $\\mathcal{O}(\\lambda^2)$ to the exact $\\mathcal{O}(\\lambda^{5/2})$ coefficient. We keep the interpolation ansatz unchanged and shift the weak-side matching points to the regime where the new term is numerically significant. The admissible set collapses from $9$ nominal survivors ($3$ distinct curves) to a single distinct curve, the crossover range shrinks to a unique value, and the pointwise band width drops to zero within numerical resolution. The Hermite-Padé (HP) central curve does not coincide with the unique LSTP survivor, so the exact weak-coupling coefficient removes the LSTP scan uncertainty but not the difference between the two routes. The next step is to compute the unknown $\\mathcal{O}(\\lambda^{-3})$ strong-coupling coefficient.", "url": "https://arxiv.org/abs/2604.16109", "type": "理论", "summary": "1. 本工作将热四维N=4超对称Yang-Mills理论的弱耦合展开截断从O(λ²)升级至精确的O(λ^{5/2})系数，并在此框架下重新审视了约束对数减除两点Padé (LSTP) 系综。\n2. 引入精确高阶项后，弱侧匹配点被调整至新项显著的区域，导致容许集从9个候选解急剧坍缩至一条唯一曲线，交叉区域收缩为单值，且点态误差带在数值分辨率内降至零。\n3. 这为通过计算未知的强耦合区O(λ^{-3})系数以进一步解决LSTP与Hermite-Padé路径间的剩余差异，提供了明确且紧迫的研究方向。", "summary_source": "deepseek", "authors": [{"name": "Ubaid Tantary"}, {"name": "Qianqian Du"}], "featured_authors": [{"name": "Ubaid Tantary"}, {"name": "Qianqian Du"}], "author_count": 2}, {"id": "2604.16225", "category": "hep-th", "title": "Batalin-Vilkovisky quantization with an angular twist", "abstract": "We construct cubic scalar field theory on $\\lambda$-Minkowski space by combining the Batalin-Vilkovisky formalism with harmonic analysis, and produce two inequivalent noncommutative quantum field theories. The braided theory is based on a braided $L_\\infty$-algebra whereby covariance dictates a spectral decomposition into cylindrical Bessel functions that diagonalise the angular Drinfel'd twist; in this theory we find the usual logarithmic ultraviolet divergences and confirm the absence of UV/IR mixing. The standard noncommutative theory is based on a classical $L_\\infty$-algebra; in this theory we relate the spectral decompositions into plane wave and cylindrical harmonic eigenmodes of the Klein-Gordan operator, we verify the planar equivalence theorem, and we demonstrate a periodic form of UV/IR mixing in which non-planar correlators are generically ultraviolet finite but become non-analytic on an infinite lattice of exceptional momenta.", "url": "https://arxiv.org/abs/2604.16225", "type": "理论", "summary": "1. 本研究结合Batalin-Vilkovisky形式体系与调和分析，在λ-Minkowski空间上构造了三次标量场论，并得到了两种不等价的非对易量子场论。\n2. 辫子理论基于辫子L_∞-代数，其协变性要求谱分解为柱面贝塞尔函数，消除了紫外/红外混合；标准理论则呈现周期性紫外/红外混合，非平面关联函数在特殊动量格点上出现非解析性。\n3. 该工作对特殊动量格点结构的揭示，以及辫子形变在消除紫外/红外混合方面的有效性，为未来非对易量子场论的正则化方案和对称性研究提供了新方向。", "summary_source": "deepseek", "authors": [{"name": "Djordje Bogdanović"}, {"name": "Marija Dimitrijević Ćirić"}, {"name": "Richard J. Szabo"}], "featured_authors": [{"name": "Djordje Bogdanović"}, {"name": "Marija Dimitrijević Ćirić"}, {"name": "Richard J. Szabo"}], "author_count": 3}, {"id": "2604.16281", "category": "hep-th", "title": "Recent progress on inflation and dark energy from string theory", "abstract": "We review recent progress in string model building in both early and late time cosmology. We describe the main theoretical and phenomenological features of an entire class of inflationary models where inflation is driven by a type IIB Kaehler modulus which enjoys an effective and approximate shift symmetry. We illustrate how reheating can occur via the perturbative decay of the modulus into visible and hidden sector degrees of freedom, paying particular attention to the associated production of axionic dark radiation. We quickly discuss the status of de Sitter vacua versus quintessence model building in string theory, analysing the level of control of these constructions and the main challenges faced by models of dynamical dark energy. We finally present a working model of axion hilltop quintessence in string theory, stressing the importance of initial conditions.", "url": "https://arxiv.org/abs/2604.16281", "type": "理论", "summary": "1. 该综述系统梳理了弦论在早期和晚期宇宙学中的模型构建进展，重点分析了由IIB型卡勒模驱动的暴胀机制及其再加热过程。\n2. 核心创新在于利用该模的有效近似平移对称性构建暴胀模型，并通过对模衰变产生轴子暗辐射的精细计算，揭示了动力学暗能量模型构造中的可控性与挑战。\n3. 文中提出的弦论框架下山顶轴子精粹模型，为深入探究暗能量本质及早期宇宙初始条件问题提供了新的理论切入点。", "summary_source": "deepseek", "authors": [{"name": "Michele Cicoli"}], "featured_authors": [{"name": "Michele Cicoli"}], "author_count": 1}, {"id": "2604.15355", "category": "math-ph", "title": "Characteristic polynomials of non-Hermitian random band matrices near the threshold", "abstract": "The paper arXiv:2510.04255 shows that the asymptotic behavior of the second correlation function of characteristic polynomials of the $N\\times N$ non-Hermitian random band matrices with a bandwidth $W$ exhibits the transition at $W\\sim \\sqrt{N}$, as $W,N\\to \\infty$: it coincides with those for Ginibre ensemble for $W\\gg \\sqrt{N}$, and factorized as $1\\ll W\\ll \\sqrt{N}$. In this work we extend the techniques of arXiv:2510.04255 to study the critical regime when the bandwidth $W$ is proportional to the threshold $\\sqrt{N}$.", "url": "https://arxiv.org/abs/2604.15355", "type": "理论", "summary": "1. 本研究将arXiv:2510.04255的技术扩展至临界区，探究了带宽W与阈值√N成比例时，非厄米随机带矩阵特征多项式的渐近行为。\n2. 通过精确推导临界区内第二关联函数的显式表达式，揭示了该函数从因子化形式向Ginibre系综结果光滑过渡的解析结构。\n3. 这确认了W∝√N临界标度下的普适类，并为研究该区域其他谱统计性质提供了严格分析基础。", "summary_source": "deepseek", "authors": [{"name": "Mariya Shcherbina"}, {"name": "Tatyana Shcherbina"}], "featured_authors": [{"name": "Mariya Shcherbina"}, {"name": "Tatyana Shcherbina"}], "author_count": 2}, {"id": "2604.16050", "category": "math-ph", "title": "Embedding formulae for diffraction problems on square lattices", "abstract": "We develop embedding formulae for all possible diffraction problems with Dirichlet scatterers on square lattices using the Wiener--Hopf perspective. The embedding formula expresses solutions for arbitrary plane-wave incidence in terms of a finite set of auxiliary problems, eliminating the need to re-solve boundary value problems for each incidence angle. First we derive explicit embedding formulae for canonical geometries including the half-plane, finite strip, and right-angled wedge. We then generalize the method through an operator-based approach, obtaining embedding formula for arbitrary configurations of obstacles on lattices. This general embedding formula is a key difference from the continuous setting where this is currently not possible. To validate the theory, we perform numerical experiments, confirming agreement with the results derived using the embedding formula. The results highlight the efficiency and generality of the Wiener--Hopf approach in discrete diffraction theory, with potential applications in inverse problems and other areas of physics and mathematics.", "url": "https://arxiv.org/abs/2604.16050", "type": "理论", "summary": "1. 本文针对正方形晶格上的狄利克雷散射体衍射问题，发展了一套基于维纳-霍普夫观点的嵌入公式体系。\n2. 该公式的核心优势在于将任意平面波入射的解表示为有限个辅助问题的组合，从而避免了为每个入射角重复求解边值问题。\n3. 这项离散衍射理论中的普适性成果，为逆问题及其他物理数学领域的相关研究提供了新的理论工具。", "summary_source": "deepseek", "authors": [{"name": "A. I. Korolkov"}, {"name": "A. V. Kisil"}], "featured_authors": [{"name": "A. I. Korolkov"}, {"name": "A. V. Kisil"}], "author_count": 2}, {"id": "2604.16072", "category": "math-ph", "title": "Identification of optimal history variables and corresponding hereditary laws in linear viscoelasticity", "abstract": "We develop an operator-theoretic formulation of hereditary constitutive models and characterize optimal finite-rank internal-variable approximations in the sense of Kolmogorov $N$-widths. The history operator is shown to be compact under natural assumptions on the relaxation kernel, thereby admitting optimal low-rank approximations. The resulting reduced models inherit thermodynamic consistency, stability, and provable approximation bounds. An analysis clarifies the structural relation between hereditary representations and internal-variable theories and provides a rigorous basis for reduced-order modeling in computational mechanics. Selected numerical examples showcase optimal convergence of approximations with respect to rank and sampling.", "url": "https://arxiv.org/abs/2604.16072", "type": "理论", "summary": "1. 该工作建立了线性粘弹性遗传本构模型的算子理论框架，并基于Kolmogorov N-宽度理论识别了最优的有限秩内部变量近似。\n2. 关键贡献在于证明了在松弛核满足自然假设下历史算子的紧致性，从而保证了具有热力学一致性、稳定性及可证明逼近界的最优低秩简化模型的存在性。\n3. 该分析为遗传表示与内部变量理论间的结构关系提供了严格阐明，并为计算力学中的模型降阶奠定了数学基础。", "summary_source": "deepseek", "authors": [{"name": "Ignacio Romero"}, {"name": "Michael Ortiz"}], "featured_authors": [{"name": "Ignacio Romero"}, {"name": "Michael Ortiz"}], "author_count": 2}, {"id": "2604.16252", "category": "math-ph", "title": "Universal dualities for Wilson loops in lattice Yang-Mills", "abstract": "We identify a universal finite-$N$ structure underlying Wilson loop expectations in lattice Yang-Mills, in any dimension $d\\geq 2$, for gauge group $\\mathrm{U}(N)$, and for arbitrary smooth central plaquette actions. The starting point is a state-sum expansion in plaquette labels by irreducible representations, in which each term factorizes into an action-dependent spectral weight and an action-independent topological coefficient. We then analyze these coefficients in three exact ways: as a gauge/string expansion over decorated spanning surfaces, as a local spin-foam/channel model on the dual incidence graph, and as a universal finite-$N$ master loop equation that closes on the coefficient side. As a consequence, several recent Wilson-action results are recovered as specializations of our broader action-agnostic framework.", "url": "https://arxiv.org/abs/2604.16252", "type": "理论", "summary": "1. 该工作构建了任意光滑中心作用量下晶格杨-米尔斯理论威尔逊圈期望值的通用有限N分析框架。\n2. 核心在于提出了三种精确解析方法：装饰跨越曲面规范/弦展开、对偶图自旋泡沫模型，以及闭合于系数侧的通用主方程。\n3. 此框架为超越特定作用量的晶格规范理论非微扰研究提供了系统性基础。", "summary_source": "deepseek", "authors": [{"name": "Thibaut Lemoine"}], "featured_authors": [{"name": "Thibaut Lemoine"}], "author_count": 1}, {"id": "2604.15389", "category": "quant-ph", "title": "A Unified Hardware-to-Decoder Architecture for Hybrid Continuous-Variable and Discrete-Variable Quantum Error Correction in LiDMaS+", "abstract": "We present an architecture-level hardware-to-logical-to-decoder execution stack for hybrid continuous-variable and discrete-variable quantum error correction in LiDMaS+. Provider-native records are normalized into a single decoder IO contract and replayed under fixed controls across MWPM, UF, BP, and neural-MWPM. In a Xanadu case study using fixture inputs and sampled public datasets, replay integrity was complete: 108/108 fixture and 4000/4000 real-slice request-response lines, with zero request-parse errors, zero response-parse errors, and zero decoder-name mismatches. Under matched inputs, decoder behavior is clearly regime-dependent. For weighted fixture summaries, average flip count was 1.296 (MWPM), 1.296 (UF), 0.667 (BP), and 1.296 (neural-MWPM). For weighted real-data summaries, average flip count was 0.641 (MWPM), 0.741 (UF), 0.318 (BP), and 0.641 (neural-MWPM); corresponding nonempty-flip rates were 0.490, 0.490, 0.318, and 0.490. Across fixture data, BP reduced weighted correction volume by 48.6\\% versus MWPM; across real slices, BP reduced weighted correction volume by 50.4\\% versus MWPM and 57.1\\% versus UF. Quality controls show the central interpretability tradeoff: BP is intervention-conservative but leaves higher residual burden, while MWPM-family decoders intervene more aggressively and clear more syndrome. Warning-no-syndrome rates remained decoder-invariant and dataset-driven (fixture weighted 0.259; real weighted 0.510), confirming preserved sparsity semantics from hardware input to logical correction. Re-running analysis stages reproduced identical SHA-256 artifacts, enabling deterministic study iteration. These results establish a practical benchmarking foundation for photonic GKP-oriented hardware programs where decoder policy must be selected as a function of operating regime.", "url": "https://arxiv.org/abs/2604.15389", "type": "理论", "summary": "1. 该研究为LiDMaS+混合连续-离散变量量子纠错提出了一个涵盖硬件至解码器的统一架构与执行堆栈。\n2. 通过将硬件数据归一化为单一解码器接口契约，该框架实现了对MWPM、UF、BP及神经-MWPM四种解码器在匹配输入下的确定性、可复现性能基准测试，并揭示出BP解码器在降低加权纠错体积方面显著更优（相比MWPM降低约50%）。\n3. 这为面向光子GKP硬件的纠错方案建立了一个实用的基准测试基础，明确了解码器策略需依据操作区域特性进行选择，并揭示了不同解码器在干预强度与残余错误负担之间的内在权衡。", "summary_source": "deepseek", "authors": [{"name": "Dennis Delali Kwesi Wayo"}, {"name": "Chinonso Onah"}, {"name": "Leonardo Goliatt"}, {"name": "Sven Groppe"}], "featured_authors": [{"name": "Dennis Delali Kwesi Wayo"}, {"name": "Chinonso Onah"}, {"name": "Leonardo Goliatt"}, {"name": "Sven Groppe"}], "author_count": 4}, {"id": "2604.15405", "category": "quant-ph", "title": "Optimal algorithms for materializing stabilizer states and Clifford gates from compact descriptions", "abstract": "Stabilizer states admit compact classical descriptions, but many downstream tasks still require their full amplitude vectors. Since the output itself has size $2^n$, the main algorithmic question is whether one can materialize an $n$-qubit stabilizer state vector in optimal $O(2^n)$ time, rather than paying an additional polynomial overhead. We answer this question in the affirmative. Starting from the standard quadratic-form representation of stabilizer states, we give an algorithm that runs in $O(2^n)$ time and $O(2^n)$ space. The idea is to maintain a cached parity word that records all future off-diagonal quadratic phase increments simultaneously. As consequences, we obtain an optimal procedure for materializing a stabilizer state vector from a standard check-matrix description, and an optimal algorithm for expanding a Clifford tableau into its full dense matrix. These results close the asymptotic gap for dense stabilizer and Clifford materialization.", "url": "https://arxiv.org/abs/2604.15405", "type": "数值", "summary": "1. 该论文针对稳定子态与克利福德门的紧凑描述，证明了将其物化为完整振幅向量或稠密矩阵的算法可实现最优渐近复杂度。\n2. 其技术核心在于引入缓存奇偶字，同步追踪未来所有非对角二次相位增量，从而以O(2^n)时间与空间实现标准二次型表示到态向量的高效转换。\n3. 这一结果填补了稠密稳定子与克利福德表示物化算法的渐近性能缺口，为量子计算模拟、验证协议及后续算法设计提供了严格的理论基础。", "summary_source": "deepseek", "authors": [{"name": "Hyunho Cha"}, {"name": "Jungwoo Lee"}], "featured_authors": [{"name": "Hyunho Cha"}, {"name": "Jungwoo Lee"}], "author_count": 2}, {"id": "2604.15412", "category": "quant-ph", "title": "Renormalization and Non-perturbative Dynamics in Conformal Quantum Mechanics", "abstract": "We study conformal quantum mechanics by first considering the perturbative $S$-matrix in various dimensions. The model has two couplings and we study perturbatively the degree of ultraviolet divergences arising in the interplay between the two couplings. We then focus on the inverse square potential in one spatial dimension and compute the beta function to arbitrarily perturbative and non-perturbative orders. This we do in both the bound state sector and scattering sector. We provide explicit, exact and infinite series results of the first few non-perturbative orders.", "url": "https://arxiv.org/abs/2604.15412", "type": "理论", "summary": "1. 本文研究了共形量子力学，通过微扰S矩阵分析不同维度下两个耦合常数导致的紫外发散，并在一维逆平方势模型中计算了束缚态与散射态中任意阶微扰与非微扰的β函数。\n2. 核心突破在于实现了对β函数至任意微扰及非微扰阶次的全阶计算，并给出了前几个非微扰阶的显式精确解与无穷级数结果。\n3. 所提供的精确非微扰结果为理解共形量子力学中的非微扰动力学及关联量子场论模型的非微扰研究建立了可扩展的解析基准。", "summary_source": "deepseek", "authors": [{"name": "Jacob Hafjall"}, {"name": "Thomas A. Ryttov"}], "featured_authors": [{"name": "Jacob Hafjall"}, {"name": "Thomas A. Ryttov"}], "author_count": 2}, {"id": "2604.15435", "category": "quant-ph", "title": "Quantum Search without Global Diffusion", "abstract": "Quantum search is among the most important algorithms in quantum computing. At its core is quantum amplitude amplification, a technique that achieves a quadratic speedup over classical search by combining two global reflections: the oracle, which marks the target, and the diffusion operator, which reflects about the initial state. We show that this speedup can be preserved when the oracle is the only global operator, with all other operations acting locally on non-overlapping partitions of the search register. We present a recursive construction that, when the initial and target states both decompose as tensor products over these chosen partitions, admits an exact closed-form solution for the algorithm's dynamics. This is enabled by an intriguing degeneracy in the principal angles between successive reflections, which collapse to just two distinct values governed by a single recursively defined angle. Applied to unstructured search, a problem that naturally satisfies the tensor decomposition, the approach retains the $O(\\sqrt{N})$ oracle complexity of Grover search when each partition contains at least $\\log_2(\\log_2 N)$ qubits. On an 18-qubit search problem, partitioning into two stages reduces the non-oracle circuit depth by as much as 51%-96% relative to Grover, requiring up to 9% additional oracle calls. For larger problem sizes this oracle overhead rapidly diminishes, and valuable depth reductions persist when the oracle circuit is substantially deeper than the diffusion operator. More broadly, these results show that a global diffusion operator is not necessary to achieve the quadratic speedup in quantum search, offering a new perspective on this foundational algorithm. Moreover, the scalar reduction at the heart of our analysis inspires and motivates new directions and innovations in quantum algorithm design and evaluation.", "url": "https://arxiv.org/abs/2604.15435", "type": "数值", "summary": "1. 本研究证明了在量子搜索算法中，仅需标记目标的预言机（oracle）为全局操作，其余运算可局限于搜索寄存器的非重叠局部分区，仍能保持相对于经典算法的二次加速。\n2. 核心在于提出了一种递归构造，当初始态与目标态均按选定分区呈现张量积分解时，算法动力学存在精确闭式解，这源于连续反射间的主角度简并为仅由单个递归角度支配的两个不同值。\n3. 该成果从根本上动摇了全局扩散算符对实现二次加速的必要性，为量子算法设计与评估提供了新的理论视角和创新方向。", "summary_source": "deepseek", "authors": [{"name": "John Burke"}, {"name": "Ciaran McGoldrick"}], "featured_authors": [{"name": "John Burke"}, {"name": "Ciaran McGoldrick"}], "author_count": 2}, {"id": "2604.15441", "category": "quant-ph", "title": "Quantum computation at the edge of chaos", "abstract": "A key challenge in classical machine learning is to mitigate overparameterization by selecting sparse solutions. We translate this concept to the quantum domain, introducing quantum sparsity as a principle based on minimizing quantum information shared across multiple parties. This allows us to address fundamental issues in quantum data processing and convergence issues such as the barren plateau problem in Variational Quantum Algorithm (VQA). We propose a practical implementation of this principle using the topological Entanglement Entropy (TEE) as a cost function regularizer. A non-negative TEE is associated with states with a sparse structure in a suitable basis, while a negative TEE signals untrainable chaos. The regularizer, therefore, guides the optimization along the critical edge of chaos that separates these regimes. We link the TEE to structural complexity by analyzing quantum states encoding functions of tunable smoothness, deriving a quantum Nyquist-Shannon sampling theorem that bounds the resource requirements and error propagation in VQA. Numerically, our TEE regularizer demonstrates significantly improved convergence and precision for complex data encoding and ground-state search tasks. This work establishes quantum sparsity as a design principle for robust and efficient VQAs.", "url": "https://arxiv.org/abs/2604.15441", "type": "理论+数值", "summary": "1. 该工作将经典机器学习中的稀疏性概念推广至量子领域，提出基于最小化多方量子信息共享的量子稀疏性原则，并设计以拓扑纠缠熵为正则化器的优化框架以解决变分量子算法中的贫瘠高原等收敛问题。\n2. 其核心创新在于利用拓扑纠缠熵关联量子状态的结构复杂性：非负熵值对应稀疏可训练状态，负熵值标志混沌不可训练性，从而引导优化沿混沌临界边缘进行，并通过分析编码函数平滑性推导出量子奈奎斯特-香农采样定理以界定资源需求与误差传播。\n3. 这为设计抗过参数化、高效收敛的变分量子算法提供了理论基础，为复杂数据编码和基态搜索任务的资源估计与优化控制开辟了新途径，并启发了后续量子计算与机器学习交叉领域的研究。", "summary_source": "deepseek", "authors": [{"name": "Tomohiro Hashizume"}, {"name": "Zhengjun Wang"}, {"name": "Frank Schlawin"}, {"name": "Dieter Jaksch"}], "featured_authors": [{"name": "Tomohiro Hashizume"}, {"name": "Zhengjun Wang"}, {"name": "Frank Schlawin"}, {"name": "Dieter Jaksch"}], "author_count": 4}, {"id": "2604.15540", "category": "quant-ph", "title": "Accessible Quantum Correlations Under Complexity Constraints", "abstract": "Quantum systems may contain underlying correlations which are inaccessible to computationally bounded observers. We capture this distinction through a framework that analyses bipartite states only using efficiently implementable quantum channels. This leads to a complexity-constrained max-divergence and a corresponding computational min-entropy. The latter quantity recovers the standard operational meaning of the conditional min-entropy: in the fully quantum case, it quantifies the largest overlap with a maximally entangled state attainable via efficient operations on the conditional subsystem. For classical-quantum states, it further reduces to the optimal guessing probability of a computationally bounded observer with access to side information. Lastly, in the absence of side information, the computational min-entropy simplifies to a computational notion of the operator norm. We then establish strong separations between the information-theoretic and complexity-constrained notions of min-entropy. For pure states, there exist highly entangled families of states with extremal min-entropy whose efficiently accessible entanglement in terms of computational min-entropy is exponentially suppressed. For mixed states, the separation is even sharper: the information-theoretic conditional min-entropy can be highly negative while the complexity-constrained quantity remains nearly maximal. Overall, our results demonstrate that computational constraints can fundamentally limit the quantum correlations that are observable in practice.", "url": "https://arxiv.org/abs/2604.15540", "type": "理论", "summary": "1. 该工作提出了一个分析计算受限观测者所能获取的量子关联的理论框架，定义了复杂度约束下的最大散度和相应的计算最小熵。\n2. 该框架的核心在于计算最小熵在完全量子情形下恢复了条件最小熵的标准操作意义，在经典-量子情形下则退化为有侧信息时的最优猜测概率。\n3. 这强有力地揭示了计算约束如何从根本上限制可观测的量子关联：对于纯态，高效可提取的纠缠可被指数压制；对于混态，信息论最小熵可为负值而计算量仍近乎最大。", "summary_source": "deepseek", "authors": [{"name": "Álvaro Yángüez"}, {"name": "Noam Avidan"}, {"name": "Jan Kochanowski"}, {"name": "Thomas A. Hahn"}], "featured_authors": [{"name": "Álvaro Yángüez"}, {"name": "Noam Avidan"}, {"name": "Jan Kochanowski"}, {"name": "Thomas A. Hahn"}], "author_count": 4}, {"id": "2604.15552", "category": "quant-ph", "title": "Feature-level analysis and adversarial transfer in rotationally equivariant quantum machine learning", "abstract": "Group-equivariant quantum models are designed to exploit symmetry and can improve trainability, but it remains unclear how symmetry constraints shape their adversarial robustness. We study this question through a feature-level analysis of equivariant quantum models in a transfer-attack setting. Under equivariance with an invariant readout, predictions depend only on the group-twirled input, which identifies the symmetry-invariant information accessible to the model together with a complementary uninformative subspace. Specializing this framework to a rotationally equivariant quantum model, we derive an explicit characterization of the accessible information in terms of rotation-invariant image statistics distributed across distinct symmetry sectors. Using targeted input transformations, we determine which of these statistics are actually relied upon for classification across several datasets. We find that equivariance alone does not guarantee transfer robustness: even within the restricted invariant feature space, the model can rely on brittle statistics, particularly ring-averaged intensities in the rotationally equivariant model, that remain vulnerable to classical transfer attacks. Guided by this analysis, we show that suppressing the symmetry sector associated with the brittle feature substantially improves robustness. These results establish a systematic mechanism to exploit symmetry-dependent features for adversarial robustness in future quantum machine learning models.", "url": "https://arxiv.org/abs/2604.15552", "type": "理论+数值", "summary": "1. 本研究通过特征级分析，系统探究了群等变量子模型在转移攻击设置下对称性约束对对抗鲁棒性的塑造作用，特别以旋转等变量子模型为例。\n2. 在等变性和不变读出框架下，推导出模型仅依赖群扭转输入，从而识别出可访问的对称不变信息及无信息子空间；针对旋转等变模型，明确表征了旋转不变图像统计量在对称扇区中的分布，并发现模型可能依赖脆弱的环平均强度统计量，导致对抗攻击易受性，而抑制相关对称扇区能实质改善鲁棒性。\n3. 这为未来量子机器学习模型建立了一种系统机制，以利用对称性相关特征来增强对抗鲁棒性，对模型设计、安全应用及相关理论研究具有明确启发。", "summary_source": "deepseek", "authors": [{"name": "Maureen Krumtünger"}, {"name": "Martin Sevior"}, {"name": "Muhammad Usman"}], "featured_authors": [{"name": "Maureen Krumtünger"}, {"name": "Martin Sevior"}, {"name": "Muhammad Usman"}], "author_count": 3}, {"id": "2604.15603", "category": "quant-ph", "title": "A Game Theoretic Approach for Optimizing Quantum Error Budget Distribution", "abstract": "Current fault-tolerant quantum compilers allocate error budgets uniformly during resource estimation, causing suboptimal physical resource overhead. We optimize this allocation using a potential game formulation, where Nash Equilibrium yields a Pareto-optimal distribution across logical operations, T-state distillation, and rotation synthesis. An iterated best response (IBR) algorithm converges to this equilibrium through monotonic descent of the shared cost function. Evaluation across 433 MQT benchmarks demonstrates an average reduction of 30.22\\% in physical resource requirements relative to uniform baselines, with peak improvements of 97.81\\% for specific circuit instances. This establishes a game-theoretic foundation for strategic error budget optimization in fault-tolerant quantum design automation.", "url": "https://arxiv.org/abs/2604.15603", "type": "数值", "summary": "1. 该工作提出一种基于势博弈理论的优化框架，用于分配容错量子编译中的误差预算。\n2. 其核心在于通过纳什均衡实现逻辑操作、T态蒸馏与旋转合成间的帕累托最优分配，并采用迭代最优响应算法使共享成本函数单调下降至均衡。\n3. 这在433个MQT基准测试中平均降低30.22%的物理资源需求，为容错量子设计自动化建立了战略优化的理论基础。", "summary_source": "deepseek", "authors": [{"name": "Asif Akhtab Ronggon"}, {"name": "Tasnuva Farheen"}], "featured_authors": [{"name": "Asif Akhtab Ronggon"}, {"name": "Tasnuva Farheen"}], "author_count": 2}, {"id": "2604.15604", "category": "quant-ph", "title": "Many-Body Amplified Nonclassical Photon Emission in Cavity-Coupled Atomic Arrays", "abstract": "The generation of high-performance nonclassical light remains a cornerstone of quantum technologies, yet faces a fundamental trade-off between emission purity and brightness. Here, we demonstrate that cavity-mediated many-body spin-exchange interactions provide a route to overcome this constraint by collectively amplifying spectral anharmonicity. In a cavity-coupled atomic array with a programmable relative phase $\\phi$, the resulting interference-interaction mechanism reshapes the dressed-state manifold and enables deterministic switching between distinct quantum emission regimes. For $\\phi=0$, constructive interference yields high-purity single-photon emission with antibunching improved by four orders of magnitude while preserving strong photon flux. Conversely, for $\\phi=\\pi$, destructive interference creates a dark single-photon manifold, resonantly activating two-photon processes to produce bright and pure photon-pair bundles. Our work establishes interference-engineered many-body interactions as a scalable mechanism for on-demand quantum light generation and open a new avenue for harnessing collective many-body physics in quantum photonics.", "url": "https://arxiv.org/abs/2604.15604", "type": "理论", "summary": "1. 本研究在腔耦合原子阵列中演示了通过干涉工程多体相互作用实现可调控量子光发射。\n2. 其核心在于利用可编程相对相位集体放大谱非谐性，从而在单一平台实现高纯度单光子发射与亮纯光子对束的可切换生成。\n3. 这为按需量子光源的规模化制备以及量子光子学中集体多体物理的深入利用开辟了新途径。", "summary_source": "deepseek", "authors": [{"name": "Tang Jing"}, {"name": "Yuangang Deng"}], "featured_authors": [{"name": "Tang Jing"}, {"name": "Yuangang Deng"}], "author_count": 2}, {"id": "2604.15616", "category": "quant-ph", "title": "Overcoming the Lamb Shift in System-Bath Models via KMS Detailed Balance: High-Accuracy Thermalization with Time-Bounded Interactions", "abstract": "We investigate quantum thermal state preparation algorithms based on system-bath interactions and uncover a surprising phenomenon in the weak-coupling regime. We rigorously prove that, if the system-bath interaction is engineered so that the transition part of the approximate Lindbladian generator satisfies the KMS detailed balance condition, then the unique fixed point of the dynamics can be made arbitrarily close to the Gibbs state in the weak-coupling limit, regardless of the structure of the Lamb shift term. Importantly, this remains true even when the approximate Lindbladian differs substantially from the ideal Davies generator and the Lamb shift term does not commute with the thermal state. Our result shows that the role of the KMS detailed balance condition extends well beyond standard Lindbladian dynamics, serving as a general principle for a broader class of dissipative systems. Furthermore, by combining this with a general perturbation framework, we bound the mixing time of the dynamics and establish an end-to-end complexity of $O(\\varepsilon^{-1})$ for Gibbs state preparation. These guarantees apply to any Hamiltonian for which the corresponding KMS-detailed-balance Lindbladian is known to mix rapidly.", "url": "https://arxiv.org/abs/2604.15616", "type": "理论+数值", "summary": "1. 本文研究了基于系统-浴耦合的量子热态制备算法，证明了在弱耦合极限下，若近似Lindbladian生成元的跃迁部分满足KMS细致平衡条件，则动力学的唯一不动点可任意逼近Gibbs态。\n2. 其核心在于揭示了KMS细致平衡条件可普遍确保热态精度，即使近似Lindbladian显著偏离理想Davies生成元且兰姆位移项不与热态对易。\n3. 该结果结合微扰框架给出了动力学混合时间的上界，为任意满足快速混合的KMS细致平衡Lindbladian所对应的哈密顿量，提供了Gibbs态制备的端到端复杂度O(ε⁻¹)保证。", "summary_source": "deepseek", "authors": [{"name": "Hongrui Chen"}, {"name": "Zhiyan Ding"}, {"name": "Ruizhe Zhang"}], "featured_authors": [{"name": "Hongrui Chen"}, {"name": "Zhiyan Ding"}, {"name": "Ruizhe Zhang"}], "author_count": 3}, {"id": "2604.15765", "category": "quant-ph", "title": "Orkan: Cache-friendly simulation of quantum operations on hermitian operators", "abstract": "Classical simulation of quantum operations is essential for algorithm design, noise characterisation, and benchmarking of quantum hardware. The most general physically realisable operation can be described by a positive linear map acting on a hermitian operator, representing either a density matrix or an observable. Established simulators vectorise the density matrix on an $n$-qubit Hilbert space and reuse state-vector kernels, storing all $2^{2n}$ elements and forgoing the benefits of hermitian symmetry. In this work, I introduce \\emph{Orkan}, a simulation library that uses a tiled memory layout storing only the lower triangle of the hermitian matrix at tile granularity, roughly halving both the memory footprint and the wall time to simulate the evolution of quantum states under generic quantum operations. The implementation treats any hermitian operator uniformly and is agnostic to whether the Schrödinger or Heisenberg picture is used. Dedicated $k$-local conjugation algorithms update all entries of the hermitian matrix in a single pass. Benchmarks against Qiskit Aer, QuEST, and Qulacs show consistent wall-clock speedups of $2$-$4{\\times}$ partly attributable to the reduced memory footprint.", "url": "https://arxiv.org/abs/2604.15765", "type": "理论+数值", "summary": "1. 该工作提出了名为Orkan的量子操作模拟库，采用分块内存布局仅存储厄米矩阵的下三角部分，显著降低了内存需求与计算耗时。\n2. 其核心创新在于通过分块粒度存储与单次遍历的k局域共轭算法，实现对任意厄米算子的统一处理，且不依赖薛定谔绘景或海森堡绘景的选择。\n3. 这为大规模量子系统的噪声表征、算法验证及硬件基准测试提供了高效工具，并启示了通过内存布局优化进一步提升经典模拟性能的路径。", "summary_source": "deepseek", "authors": [{"name": "Timo Ziegler"}], "featured_authors": [{"name": "Timo Ziegler"}], "author_count": 1}, {"id": "2604.15799", "category": "quant-ph", "title": "Spectral design principles for local-excitation retention in impurity-assisted atomic arrays", "abstract": "Enhanced local-excitation retention in atomic arrays allows to exploit cooperative radiative effects to suppress emission and prolong excited-state lifetimes. We consider an impurity-assisted setting involving a single storage atom being initially excited and study the survival of local excitation under neither write nor retrieval fields. Because the corresponding dynamics can involve multiple interfering collective modes, the survival dynamics cannot determined from the smallest collective decay rate alone. Thus, using a biorthogonal eigenmode decomposition of an effective non-Hermitian Hamiltonian, we show that the survival dynamics are jointly governed by the decay rates of the eigenmodes and their overlaps with the initial excitation. Large oscillations occur when multiple long-lived modes have comparable weights. Accordingly, we introduce a physically motivated spectral surrogate objective that favors both small weighted decay rates and an initial-state weight concentrated on a single subradiant mode. As a proof of principle of this spectral design, we apply the surrogate to constrained atom-position optimization under minimum-distance constraints and obtain nontrivial aperiodic configurations with enhanced local-excitation retention. Our findings unveil spectral design principles for local-excitation retention in impurity-assisted atomic arrays and provide a proof of principle for their inverse design.", "url": "https://arxiv.org/abs/2604.15799", "type": "理论+数值", "summary": "1. 该工作研究了单个存储原子初始激发的杂质辅助原子阵列中，在没有写入与检索场时局部激发的存活动力学，并提出了增强其保留的光谱设计原则。\n2. 通过有效非厄米哈密顿量的双正交本征模分解，揭示了存活由本征模衰减率及其与初始态的重叠共同调控，并构建了同时偏好小加权衰减率与初始态权重集中于单一亚辐射模的光谱代理目标。\n3. 这为在最小距离约束下逆向设计非周期原子阵列以增强局部激发保留提供了原理验证，为基于光谱准则优化量子存储等光子学器件性能指明了方向。", "summary_source": "deepseek", "authors": [{"name": "Junpei Oba"}], "featured_authors": [{"name": "Junpei Oba"}], "author_count": 1}, {"id": "2604.15836", "category": "quant-ph", "title": "A Practical Semi-Quantum Signature Protocol with Improved Eavesdropping Detection", "abstract": "Semi-quantum signature (SQS) schemes aim to enable quantum signature functionality in scenarios where only a subset of participants possess full quantum capabilities, thereby improving practical deployability while preserving quantum security advantages. Within this framework, we present a practical SQS protocol based on Bell states. The protocol is designed so that only the signer requires full quantum capability, significantly alleviating the quantum burden on the remaining participants. To strengthen security in semi-quantum environments, we incorporate an improved eavesdropping-detection mechanism that more effectively detects tampering. Compared with many existing schemes, which do not explicitly consider tampering of already generated signatures in their unforgeability analyses, the proposed protocol is designed to remain secure in the presence of such tampering.", "url": "https://arxiv.org/abs/2604.15836", "type": "理论", "summary": "1. 该工作基于贝尔态提出了一种实用的半量子签名协议，其中仅签名者需具备完整量子能力。\n2. 协议的核心在于引入了改进的窃听检测机制，能更有效地探测篡改行为，并在不可伪造性分析中明确考虑了已生成签名被篡改的情形。\n3. 这为未来在半量子环境中设计抗篡改的密码协议提供了具体方案，并推动了相关安全性模型的完善。", "summary_source": "deepseek", "authors": [{"name": "Zengyu Pang"}, {"name": "Hua Xiang"}], "featured_authors": [{"name": "Zengyu Pang"}, {"name": "Hua Xiang"}], "author_count": 2}, {"id": "2604.15886", "category": "quant-ph", "title": "Asymptotic optimality of Grover-Radhakrishnan-Korepin algorithm", "abstract": "Grover's algorithm is a cornerstone of quantum algorithms and is strictly optimal in oracle-query complexity. While the full search problem admits no further improvement, one may trade accuracy for speed in the partial search problem, where the task is to identify only the block containing the target item. The best known quantum algorithm for the partial search problem is the Grover-Radhakrishnan-Korepin (GRK) algorithm, whose optimality has long been conjectured but not proved. In this work, we prove the optimality of GRK in the large-block limit. We formulate partial search as a time-optimal control problem and apply the Pontryagin maximum principle to derive the switching-function dynamics, establish the bang-bang structure of regular extremals, and exclude non-optimal switching patterns. As a result, we show that the optimal regular extremal has the global-local-global form, which yields a control-theoretic proof of the asymptotic optimality of the GRK algorithm in oracle-query complexity.", "url": "https://arxiv.org/abs/2604.15886", "type": "理论+数值", "summary": "1. 该工作证明了Grover-Radhakrishnan-Korepin算法在部分搜索问题中的渐近最优性，通过建立时间最优控制框架并应用Pontryagin极大值原理，解决了长期未决的猜想。\n2. 其技术核心在于将部分搜索建模为时间最优控制问题，推导开关函数动力学以确立正则极值的bang-bang结构，排除非最优切换模式，最终揭示最优解呈现global-local-global形式。\n3. 这一控制论证明为GRK算法的oracle-query复杂度最优性提供了严格基础，不仅巩固了量子搜索理论，还为量子算法设计与控制理论的交叉研究开辟了新方向。", "summary_source": "deepseek", "authors": [{"name": "Kun Zhang"}, {"name": "Kang-Yuan Chen"}, {"name": "Xiao-Hui Wang"}, {"name": "Vladimir Korepin"}], "featured_authors": [{"name": "Kun Zhang"}, {"name": "Kang-Yuan Chen"}, {"name": "Xiao-Hui Wang"}, {"name": "Vladimir Korepin"}], "author_count": 4}, {"id": "2604.16023", "category": "quant-ph", "title": "MacWilliams Identities for Intrinsic Quantum Codes", "abstract": "We develop an intrinsic enumerator framework for quantum error correction in unitary representations of symmetry groups. An intrinsic quantum code is a subspace of a representation $V$ of a group $G$, and errors are organized by the decomposition of the conjugation representation on $\\mathcal{L}(V)$ into isotypic subspaces. Associated with any orthogonal decomposition of $\\mathcal{L}(V)$ we introduce two families of quadratic enumerators, called projector and twirl enumerators, which satisfy positivity, normalization, and Knill--Laflamme type inequalities. When the conjugation representation is multiplicity--free, these enumerators are related by a linear transform that we interpret as an intrinsic MacWilliams identity. For $G=\\mathrm{SU}(2)$, we compute this transform explicitly in terms of Wigner $6j$-symbols. Applied to symmetric-power representations, this gives linear programming bounds for permutation-invariant qubit and qudit codes, including extremality results for the four-qubit, seven-qubit, and three-qutrit examples treated here. We also develop the general equivariant theory in the presence of multiplicities, where the enumerators become matrix-valued, the MacWilliams transform becomes block unitary, and the resulting feasibility problem becomes semidefinite; we illustrate this theory in a first non-multiplicity-free $\\mathrm{SU}(3)$ example.", "url": "https://arxiv.org/abs/2604.16023", "type": "理论", "summary": "1. 本文为对称群表示中的内禀量子纠错码发展了枚举子框架，引入了满足正定性、归一化及Knill-Laflamme型不等式的投影子与旋转二次枚举子。\n2. 关键创新在于推导了多重性自由情形下枚举子间的内禀麦克威廉姆斯恒等式，并以SU(2)群的维格纳6j符号显式计算该变换，进而应用于对称幂表示得到置换不变量子比特与qudit码的线性规划界限及四量子比特、七量子比特、三qutrit等极值结果。\n3. 该理论可推广至含多重性的一般等变场景，此时枚举子变为矩阵值、麦克威廉姆斯变换成为分块酉矩阵，从而将可行性问题转化为半定规划，为更广泛对称性量子码的优化提供了新途径。", "summary_source": "deepseek", "authors": [{"name": "Eric Kubischta"}, {"name": "Ian Teixeira"}], "featured_authors": [{"name": "Eric Kubischta"}, {"name": "Ian Teixeira"}], "author_count": 2}, {"id": "2604.16051", "category": "quant-ph", "title": "Comment on \"A General Framework for Constructing Local Hidden-state Models to Determine the Steerability\"", "abstract": "We point out that the method presented in a recent arXiv article by Jia et al. ( arXiv:2512.21848 ) for constructing local hidden-state models closely follows the framework we developed in N. von Selzam & F. Marquardt (PRX Quantum, 2025) for constructing local hidden-variable models. While Jia et al. cite our work, the extent of the methodological overlap and the degree of textual similarity are not adequately reflected by the attribution given. We document this overlap in detail.", "url": "https://arxiv.org/abs/2604.16051", "type": "理论", "summary": "1. 该评论文章指出，贾等人近期一篇预印本中构建局域隐态模型的方法与本团队先前在PRX Quantum中构建局域隐变量模型的框架高度重合。\n2. 其核心论据在于，尽管对方引用了前期工作，但方法论的实质性重叠与文本相似程度未在致谢中得到充分反映，本文对此进行了详细比对与记录。\n3. 这凸显了在快速发展领域中明确区分继承性工作与原创性贡献的重要性，并对相关学术规范提出了更具体的实践要求。", "summary_source": "deepseek", "authors": [{"name": "Nick von Selzam"}, {"name": "Florian Marquardt"}], "featured_authors": [{"name": "Nick von Selzam"}, {"name": "Florian Marquardt"}], "author_count": 2}, {"id": "2604.16144", "category": "quant-ph", "title": "Gravitationally induced wave-function collapse from dynamical bifurcation", "abstract": "We propose an effective non-relativistic framework in which wave-function collapse emerges as a deterministic dynamical instability induced by gravitational self-interaction and regulated by short-distance repulsion. The dynamics is described by a nonlinear Schrödinger equation supplemented by a phenomenological repulsive sector ensuring regularity at high densities. Using a variational Gaussian ansatz, we derive an explicit effective energy functional and show that extended quantum states lose stability beyond a critical mass scale. This loss of stability is associated with a bifurcation in the reduced dynamical system governing the wave-function width, leading to the emergence of stable localized configurations. Within this picture, collapse corresponds to the dynamical selection of one of these localized attractors, driven by infinitesimal asymmetries in the initial state and occurring without stochastic noise or environmental coupling. The mechanism provides a controlled and quantitative realization of gravity-induced localization, extending Schrödinger--Newton-type models while avoiding their pathological short-distance behavior. Possible implications for mesoscopic systems probing the quantum-to-classical transition are briefly discussed.", "url": "https://arxiv.org/abs/2604.16144", "type": "理论+数值", "summary": "1. 该工作提出了一种有效的非相对论框架，其中波函数坍缩作为引力自相互作用诱发、并由短程斥力调控的确定性动力学不稳定性而出现。\n2. 其核心物理机制在于，通过变分高斯拟设导出的有效能量泛函表明，超越临界质量尺度后，扩展量子态会失稳，并伴随波函数宽度动力学系统的分岔，从而驱动系统选择局域化的吸引子。\n3. 这一机制为在探索量子-经典过渡的介观系统中实现受控的、定量的引力诱导局域化提供了明确的理论图景和潜在的实验检验途径。", "summary_source": "deepseek", "authors": [{"name": "C. A. S. Almeida"}], "featured_authors": [{"name": "C. A. S. Almeida"}], "author_count": 1}, {"id": "2604.16190", "category": "quant-ph", "title": "Coherence dynamics in Simon's quantum algorithm", "abstract": "Quantum coherence plays a pivotal role in quantum algorithms. We study the coherence dynamics of the evolved states in Simon's quantum algorithm based on Tsallis relative $\\alpha$ entropy and $l_{1,p}$ norm. We prove that the coherences of the first register and the second register both rely on the dimension $N$ of the state spaces of the $n$ qubit systems, and increase with the increase of $N$. We show that the oracle operator $O$ does not change the coherence. Moreover, we study the coherence dynamics in the Simon's quantum algorithm and prove that in overall the coherence is in production when $N>4$ and in depletion when $N<4$.", "url": "https://arxiv.org/abs/2604.16190", "type": "理论+数值", "summary": "1. 该论文采用Tsallis相对α熵和l_{1,p}范数，系统研究了Simon量子算法演化中量子相干性的动力学行为及其与系统参数的依赖关系。\n2. 研究通过严格证明揭示了两寄存器相干性均随n量子比特系统的状态空间维度N单调增加，且预言算子O不改变相干性，并首次确定了整体相干性在N>4时净产生、N<4时净耗散的临界现象。\n3. 这一结果为量子算法中相干性的资源理论提供了定量案例，有助于深化对相干性在量子计算中作用机制的理解，并对未来研究类似算法的相干动力学具有启发意义。", "summary_source": "deepseek", "authors": [{"name": "Linlin Ye"}, {"name": "Zhaoqi Wu"}, {"name": "Shao-Ming Fei"}], "featured_authors": [{"name": "Linlin Ye"}, {"name": "Zhaoqi Wu"}, {"name": "Shao-Ming Fei"}], "author_count": 3}, {"id": "2604.16209", "category": "quant-ph", "title": "Towards Ultra-High-Rate Quantum Error Correction with Reconfigurable Atom Arrays", "abstract": "Quantum error correction is widely believed to be essential for large-scale quantum computation, but the required qubit overhead remains a central challenge. Quantum low-density parity-check codes can substantially reduce this overhead through high-rate encodings, yet finite-size instances with practical logical error rates often achieve encoding rates only around or below $1/10$. Here, building on a recent ultra-high-rate construction by Kasai, we identify new structural conditions on the underlying affine permutation matrices that make encoding rates exceeding $1/2$ compatible with efficient implementation on reconfigurable neutral atom arrays. These conditions define a co-designed family of ultra-high-rate quantum codes that supports efficient syndrome extraction and atom rearrangement under realistic parallel control constraints. Using a hierarchical decoder with high accuracy and good throughput, we study the performance under a circuit-level noise model with $p=0.1\\%$, achieving per-logical-per-round error rates of $1.3_{-0.9}^{+3.0} \\times 10^{-13}$ with a $[[2304,1156,\\leq 14]]$ code and $2.9_{-1.5}^{+3.1} \\times 10^{-11}$ with a $[[1152,580,\\leq 12]]$ code. These results approach the teraquop regime, highlighting the promise of this code family for practical ultra-high-rate quantum error correction.", "url": "https://arxiv.org/abs/2604.16209", "type": "理论", "summary": "1. 本研究基于Kasai的超高率构造，设计并评估了一类与可重构中性原子阵列协同设计的超高率量子纠错码。\n2. 其核心在于发现了底层仿射置换矩阵的新结构条件，使得超过1/2的编码率能够与现实的并行控制约束下的高效综合征提取和原子重排相兼容。\n3. 模拟结果显示，在电路级噪声下，编码性能已接近teraquop范围，这为实际实现超高率量子纠错指明了可行的技术路径。", "summary_source": "deepseek", "authors": [{"name": "Chen Zhao"}, {"name": "Casey Duckering"}, {"name": "Andi Gu"}, {"name": "Nishad Maskara"}, {"name": "Hengyun Zhou"}], "featured_authors": [{"name": "Chen Zhao"}, {"name": "Casey Duckering"}, {"name": "Andi Gu"}, {"name": "Nishad Maskara"}, {"name": "Hengyun Zhou"}], "author_count": 5}, {"id": "2604.16210", "category": "quant-ph", "title": "Preparation and detection of quasiparticles for quantum simulations of scattering", "abstract": "We introduce a method for the selective preparation and detection of quasiparticle wave packets, based on creation operators that generate dressed, localized excitations on top of interacting vacua of (quasi-)one-dimensional quantum lattice theories. This method exploits maximally localized Wannier functions (MLWFs) constructed from quasiparticle bands at intermediate system sizes, enabling the construction of unitary local dressed creation operators. The algorithm allows for species-resolved wave-packet preparation and detection, enabling the separation of known quasiparticle contributions from unknown resonances. We test this approach with matrix product states (MPS) on pure hardcore Hamiltonian QCD on a ladder lattice, detecting scattering outputs and mass resonances.", "url": "https://arxiv.org/abs/2604.16210", "type": "理论+数值", "summary": "1. 该工作提出了一种基于修饰创建算符的选择性制备和检测准粒子波包的方法，用于量子模拟散射。\n2. 其卖点在于利用最大局域Wannier函数构造单位的局部修饰创建算符，实现物种分辨检测并分离已知准粒子贡献与未知共振。\n3. 在梯子晶格硬核Hamiltonian QCD上使用矩阵乘积态测试，成功检测散射输出和质量共振，为相关量子模拟与散射研究提供了有效工具。", "summary_source": "deepseek", "authors": [{"name": "Mattia Morgavi"}, {"name": "Peter Majcen"}, {"name": "Marco Rigobello"}, {"name": "Simone Montangero"}, {"name": "Pietro Silvi"}], "featured_authors": [{"name": "Mattia Morgavi"}, {"name": "Peter Majcen"}, {"name": "Marco Rigobello"}, {"name": "Simone Montangero"}, {"name": "Pietro Silvi"}], "author_count": 5}, {"id": "2604.16276", "category": "quant-ph", "title": "Aziz and Howl's Gravity-Induced Entanglement Channel is Essentially Classical Mechanics", "abstract": "Aziz and Howl argued that a classical gravitational field can generate quantum entanglement through a quantum-field-theoretic channel mediated by virtual matter propagation. However, their claimed channel is more naturally and accurately understood as semiclassical wavepacket motion in an external gravitational field, rather than as a distinctively quantum-field-theoretic entangling effect. Moreover, the result of their perturbative computation is incorrectly magnified: they selected a discontinuous wavefunction with infinite kinetic energy as the initial state and simultaneously treated it as stationary. Once a correct treatment using Gaussian wavepacket is adapted, the resulting effect will be negligibly small.", "url": "https://arxiv.org/abs/2604.16276", "type": "理论", "summary": "1. 该工作批判性地分析了Aziz与Howl关于经典引力场可通过量子场论通道产生纠缠的主张，指出其效应应重新理解为半经典波包在外部引力场中的运动。\n2. 其核心技术论据在于，原论证错误地放大了微扰计算结果：他们选取了具有无限大动能的非连续波函数作为初始态并视其为稳态，而采用正确的高斯波包处理后该效应将变得微乎其微。\n3. 这表明所讨论的纠缠通道本质上未超出半经典描述范畴，对探寻区别于传统物质的、由引力介导的新型量子纠缠通道提出了根本性质疑。", "summary_source": "deepseek", "authors": [{"name": "Hanyu Xue"}, {"name": "Ziqian Tang"}, {"name": "Chen Yang"}, {"name": "Zizhao Han"}, {"name": "Zikuan Kan"}, {"name": "Yulong Liu"}], "featured_authors": [{"name": "Hanyu Xue"}, {"name": "Ziqian Tang"}, {"name": "Chen Yang"}, {"name": "Zizhao Han"}, {"name": "Zikuan Kan"}, {"name": "Yulong Liu"}], "author_count": 6}, {"id": "2604.16285", "category": "quant-ph", "title": "How to unitarily map between any two pure states with a single closed-form exponential", "abstract": "It is well-known that any two pure quantum states (in the same Hilbert space) can be mapped to any other using unitary transformations. However, previous approaches to this problem required two explicit bases for the Hilbert space, one each for the initial and target states, and thus their complexity necessarily scales with the dimension of the Hilbert space. In this Letter, we show how to utilize novel algebraic methods to construct a closed-form exponential unitary transformation which achieves this in general, using only a single unitary generator. This construction is independent of any bases and agnostic to the dimension of the Hilbert space. We highlight the usefulness of this tool for studying relationships between systems of pure states in quantum information theory, as well in elementary analyses of quantum circuits and unitary operators.", "url": "https://arxiv.org/abs/2604.16285", "type": "理论", "summary": "1. 该工作构造了连接任意两个纯量子态的封闭形式指数型酉变换。\n2. 其核心在于基于单一生成元、与基及希尔伯特空间维数无关的构造方法。\n3. 这为量子信息论中纯态关系研究及量子线路分析提供了通用解析工具。", "summary_source": "deepseek", "authors": [{"name": "Peter T. J. Bradshaw"}, {"name": "Marcus Gouveia"}, {"name": "Jonte R. Hance"}], "featured_authors": [{"name": "Peter T. J. Bradshaw"}, {"name": "Marcus Gouveia"}, {"name": "Jonte R. Hance"}], "author_count": 3}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>${paper.summary_source === "deepseek" ? "DeepSeek three-sentence PRL summary" : (paper.summary_source === "local-fallback" ? "Local three-sentence fallback" : (paper.summary_source === "translation" ? "Chinese abstract translation" : "Chinese placeholder fallback"))}</span><a href="${safeUrl}" target="_blank" rel="noreferrer">Open arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
</body>
