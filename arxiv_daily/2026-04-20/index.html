<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>arXiv 2026-04-20 · Daily ArXiv Selection</title>
  <style>
    :root {
      --bg: #f6f1e8;
      --panel: rgba(255, 252, 246, 0.92);
      --text: #2d241d;
      --muted: #6d5d50;
      --line: rgba(69, 49, 32, 0.14);
      --accent: #8f3d2e;
      --accent-2: #1d5f6b;
      --theory: #7c3a2a;
      --numeric: #255b6a;
      --both: #5d4a99;
      --experimental: #2f6b39;
      --shadow: 0 18px 40px rgba(54, 32, 16, 0.12);
      --radius: 22px;
      --ui-font: "Aptos", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --title-font: "Palatino Linotype", "Noto Serif SC", Georgia, serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--ui-font);
      color: var(--text);
      background: radial-gradient(circle at top left, rgba(255,255,255,0.78), transparent 32%), radial-gradient(circle at 88% 12%, rgba(29,95,107,0.14), transparent 20%), linear-gradient(180deg, #fbf7f0 0%, var(--bg) 42%, #f2e8dc 100%);
      min-height: 100vh;
    }
    .shell { width: min(1220px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 64px; }
    .hero {
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(255,255,255,0.84), rgba(255,248,238,0.72)), linear-gradient(135deg, rgba(143,61,46,0.08), rgba(29,95,107,0.08));
      box-shadow: var(--shadow);
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.82); border: 1px solid var(--line); color: var(--muted); font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase;
    }
    h1 { margin: 18px 0 10px; font-family: var(--title-font); font-size: clamp(32px, 5vw, 54px); line-height: 1.04; letter-spacing: -0.03em; }
    .hero p { max-width: 880px; color: var(--muted); font-size: 16px; line-height: 1.7; margin: 0; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-top: 26px; }
    .stat { padding: 16px 18px; background: rgba(255,255,255,0.76); border: 1px solid var(--line); border-radius: 18px; }
    .stat .label { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
    .stat .value { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
    .controls { position: sticky; top: 12px; z-index: 3; margin-top: 22px; padding: 18px; border: 1px solid var(--line); border-radius: 24px; background: rgba(250,244,236,0.9); backdrop-filter: blur(16px); box-shadow: 0 10px 24px rgba(54,32,16,0.08); }
    .control-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 16px; }
    .field { display: flex; flex-direction: column; gap: 10px; }
    .field label { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
    .search { width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line); background: rgba(255,255,255,0.92); font: inherit; color: var(--text); }
    .chip-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .chip { border: 1px solid var(--line); background: rgba(255,255,255,0.82); color: var(--text); padding: 10px 14px; border-radius: 999px; font: inherit; cursor: pointer; }
    .chip.active { border-color: rgba(143,61,46,0.35); background: rgba(143,61,46,0.12); color: #5b2419; }
    .chip[data-type="数值"].active { border-color: rgba(37,91,106,0.35); background: rgba(37,91,106,0.12); color: #173f49; }
    .chip[data-type="理论+数值"].active { border-color: rgba(93,74,153,0.35); background: rgba(93,74,153,0.12); color: #46337d; }
    .chip[data-type="实验"].active { border-color: rgba(47,107,57,0.35); background: rgba(47,107,57,0.12); color: #214c29; }
    .meta-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 14px; color: var(--muted); font-size: 14px; }
    .paper-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 18px; margin-top: 22px; }
    .paper { display: flex; flex-direction: column; gap: 14px; padding: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 10px 24px rgba(54,32,16,0.06); }
    .paper-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .tag { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid transparent; }
    .tag.category { background: rgba(45,36,29,0.08); color: var(--text); }
    .tag.type-theory { background: rgba(124,58,42,0.1); color: var(--theory); border-color: rgba(124,58,42,0.16); }
    .tag.type-numeric { background: rgba(37,91,106,0.1); color: var(--numeric); border-color: rgba(37,91,106,0.16); }
    .tag.type-both { background: rgba(93,74,153,0.1); color: var(--both); border-color: rgba(93,74,153,0.16); }
    .tag.type-experimental { background: rgba(47,107,57,0.1); color: var(--experimental); border-color: rgba(47,107,57,0.16); }
    .paper h2 { margin: 0; font-family: var(--title-font); font-size: 22px; line-height: 1.25; letter-spacing: -0.02em; }
    .paper h2 a { color: inherit; text-decoration: none; }
    .paper h2 a:hover { color: var(--accent); }
    .paper .id { color: var(--muted); font-size: 13px; }
    .author-block { display: grid; gap: 10px; padding: 14px 16px; border-radius: 18px; background: rgba(255,255,255,0.64); border: 1px solid var(--line); }
    .author-label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .author-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .author-item { display: grid; gap: 4px; }
    .author-item strong { font-size: 14px; }
    .author-item span { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .author-note { color: var(--muted); font-size: 12px; }
    .paper .summary { margin: 0; font-size: 15px; line-height: 1.75; white-space: pre-line; }
    details { border-top: 1px solid var(--line); padding-top: 12px; }
    details summary { cursor: pointer; color: var(--accent-2); font-weight: 700; list-style: none; }
    details summary::-webkit-details-marker { display: none; }
    details p { margin: 10px 0 0; color: var(--muted); line-height: 1.72; font-size: 14px; white-space: pre-line; }
    .paper footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 6px; color: var(--muted); font-size: 13px; }
    .paper footer a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .empty { display: none; margin-top: 24px; padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 22px; background: rgba(255,255,255,0.7); }
    @media (max-width: 980px) { .control-grid { grid-template-columns: 1fr; } .controls { position: static; } }
  </style>
</head>

      <h1>Daily ArXiv Selection</h1>

        页面主体优先展示 DeepSeek reasoner 生成的三句话中文总结；若 API 不可用或返回异常，则回退为基于中文翻译抽取的本地三句话总结；下拉可以查看英文原版摘要。

  <script>
    const papers = [{"id": "2604.15380", "category": "cond-mat", "title": "Exascale Multi-Task Graph Foundation Models for Imbalanced, Multi-Fidelity Atomistic Data", "abstract": "We present an exascale workflow for materials discovery using atomistic graph foundation models built on HydraGNN. We jointly train on 16 open first-principles datasets (544+ million structures covering 85+ elements) using a multi-task architecture with per-dataset heads and a scalable ADIOS2/DDStore data pipeline. On Frontier, we execute six large-scale DeepHyper hyperparameter optimization campaigns in FP64 and promote the top-performing message-passing models to sustained 2,048-node training, yielding a PaiNN-based lead model. The resulting model enables billion-scale screening, evaluating 1.1 billion atomistic structures in 50 seconds, compressing a workload that would require years of first-principles computation, and supports data-scarce fine-tuning across diverse downstream tasks. We quantify precision-performance tradeoffs (BF16/FP32/FP64), demonstrate transfer across twelve chemically diverse downstream tasks, and establish seamless strong- and weak-scaling across Frontier, Aurora, and Perlmutter. This work allows fast and reliable exploration of vast chemical design spaces that are otherwise inaccessible to first-principles methods.", "url": "https://arxiv.org/abs/2604.15380", "type": "理论+数值", "summary": "1. 该工作提出了一个基于exascale计算的多任务图基础模型工作流，利用HydraGNN联合训练16个开放第一性原理数据集（覆盖85种元素、5.44亿结构），以处理不平衡、多保真度的原子数据并加速材料发现。\n2. 其技术优势在于采用可扩展ADIOS2/DDStore数据管道和高效DeepHyper超参数优化，实现了高性能PaiNN基础模型，支持在50秒内评估11亿原子结构，并量化了BF16/FP32/FP64精度-性能权衡及跨12种下游任务的迁移能力。\n3. 这使得快速可靠地探索传统第一性原理方法无法访问的广阔化学设计空间成为可能，并为数据稀缺任务的微调及跨Frontier、Aurora、Perlmutter平台的强-弱缩放提供了新途径。", "summary_source": "deepseek", "authors": [{"name": "Massimiliano Lupo Pasini"}, {"name": "Jong Youl Choi"}, {"name": "Kshitij Mehta"}, {"name": "Richard Messerly"}, {"name": "Rylie Weaver"}, {"name": "Linda Ungerboeck"}, {"name": "Isaac Lyngaas"}, {"name": "Benajmin Stump"}, {"name": "Ashwin M. Aji"}, {"name": "Karl W. Schulz"}, {"name": "Jorda Polo"}], "featured_authors": [{"name": "Massimiliano Lupo Pasini"}, {"name": "Jong Youl Choi"}, {"name": "Kshitij Mehta"}, {"name": "Ashwin M. Aji"}, {"name": "Karl W. Schulz"}, {"name": "Jorda Polo"}], "author_count": 11}, {"id": "2604.15417", "category": "cond-mat", "title": "Ultrastrong Coupling Signatures in Photon Statistics from Terahertz Higgs-Polaritons", "abstract": "The ultrastrong coupling regime of cavity photons and quantum materials has emerged as a pathway to modify materials properties, however definitive signatures of ultrastrong coupling remain elusive. Focusing on the quantum photon statistics of light transmitted through a cavity-embedded superconductor, we show that a two-photon Higgs polariton at strong coupling realizes a photonic nonlinearity at the single terahertz photon level. We find that as light-matter coupling increases, the photon statistics show pronounced changes due to the formation of a hybrid photon-matter dark-cavity state with finite photon occupancy, producing testable signatures of ultrastrong coupling. We derive a non-Markovian input output relation and study the cavity-embedded superconductor 2H-NbSe2 as it approaches ultrastrong light-matter coupling. Our results reveal a diagnostic for ultrastrong coupling in the two-photon coincidence statistics that is absent in total counts.", "url": "https://arxiv.org/abs/2604.15417", "type": "理论", "summary": "1. 该工作通过分析腔嵌入式超导体2H-NbSe2的太赫兹希格斯极化激元的光子统计，揭示了超强耦合的签名。\n2. 其卖点在于双光子希格斯极化激元在强耦合下实现了单太赫兹光子级别的光子非线性，并发现光子统计因混合光子-物质暗腔态的形成而显著变化。\n3. 这为通过双光子符合统计检测超强耦合提供了新诊断工具，弥补了总计数方法的不足。", "summary_source": "deepseek", "authors": [{"name": "Spenser Talkington"}, {"name": "Benjamin Kass"}, {"name": "Martin Claassen"}], "featured_authors": [{"name": "Spenser Talkington"}, {"name": "Benjamin Kass"}, {"name": "Martin Claassen"}], "author_count": 3}, {"id": "2604.15433", "category": "cond-mat", "title": "The Phase Transitions in a $p$ spin Glass Model: A Numerical Study", "abstract": "We investigate the balanced $M=4$, $p=4$ spin-glass model for a one-dimensional long-range proxy for the finite dimensional short-range $p$-spin glass model to examine the nature of the glass transition beyond mean-field theory. We perform large-scale Monte Carlo equilibrated simulations for both fully connected and power-law diluted versions of the model. The critical temperatures extracted from the finite-size scaling (FSS) analysis of spin-glass susceptibility are in good agreement with theoretical predictions for $\\sigma = 0, 0.25$, and 0.55. For these values of the long-range exponent $\\sigma$ (which is the power of the decrease of the interactions between the spins with their separation), one might have expected that mean-field theory would provide a good description of the system. However, the spin-overlap distribution and the value of the $\\lambda$-parameter do not provide numerical evidence for a one-step replica symmetry breaking (1RSB) phase transition. Instead, our results indicate a direct transition from the paramagnetic state to a full replica symmetry broken phase, with a renormalized value of $\\lambda\\equiv \\omega_2/\\omega_1 < 1$ suggesting a continuous FRSB transition, despite this ratio being equal to 2 at mean-field level. A value of $\\lambda > 1$ is required for the discontinuous 1RSB transition. We argue that strong finite-size effects and closely spaced transition temperatures remove the expected 1RSB transition for the system sizes which we can study. For values of the exponent $\\sigma = 0.85$, which roughly corresponds to a three dimensional system, we find that the renormalized value of $\\lambda$ is again less than 1, with no signs of either the 1RSB transition or the continuous FRSB transition, suggesting that the Kauzmann temperature $T_K$ in three dimensions might be zero and the complete absence of phase transitions in structural glasses.", "url": "https://arxiv.org/abs/2604.15433", "type": "理论+数值", "summary": "1. 本研究通过大规模蒙特卡洛平衡模拟，研究了作为有限维短程p-自旋玻璃模型代理的一维长程M=4、p=4平衡自旋玻璃模型，分析了完全连接和幂律稀释版本。\n2. 核心发现是，对于长程指数σ=0、0.25和0.55，尽管自旋玻璃磁化率的有限尺寸标度分析与理论预测一致，但自旋交叠分布和λ参数值未能提供一阶副本对称破缺转变的证据，反而指向顺磁态到连续全副本对称破缺相的直接转变。\n3. 结果暗示，在对应三维系统的σ=0.85情况下，λ的重整化值小于1且无明确相变迹象，这支持三维结构玻璃的Kauzmann温度可能为零，即不存在热力学相变。", "summary_source": "deepseek", "authors": [{"name": "Prerak Gupta"}, {"name": "Auditya Sharma"}, {"name": "Bharadwaj Vedula"}, {"name": "J. Yeo"}, {"name": "M.A. Moore"}], "featured_authors": [{"name": "Prerak Gupta"}, {"name": "Auditya Sharma"}, {"name": "Bharadwaj Vedula"}, {"name": "J. Yeo"}, {"name": "M.A. Moore"}], "author_count": 5}, {"id": "2604.15454", "category": "cond-mat", "title": "Simulating altermagnets using mumax+", "abstract": "In this paper, we demonstrate how altermagnets can be simulated in the recently released micromagnetic simulation package mumax+. We have added a new magnet class for d-wave altermagnets and demonstrate how mumax+ is able to reproduce the analytical solutions for line profiles of the Néel vector and net magnetization for a Bloch domain wall. Next, we show simulation results of the magnon dispersion relation and its dependence on the anisotropic nature of the exchange interaction. Finally, we study the motion of a Néel skyrmion by applying a spin transfer torque. This new feature was implemented by extending the pre-existing code base for antiferromagnetic simulations. The object-oriented design of mumax+ allows for a correct calculation of the magnetostatic field in multi-sublattice systems, a feature that many other micromagnetic simulators lack.", "url": "https://arxiv.org/abs/2604.15454", "type": "数值", "summary": "1. 该工作通过在微磁模拟软件mumax+中新增d波交替磁体类别，实现了对交替磁体的微磁学模拟。\n2. 其技术优势在于利用面向对象的设计正确计算了多亚晶格系统中的静磁场，并再现了布洛赫畴壁的解析解及自旋转移力矩驱动的奈尔斯格明子运动。\n3. 这为在交替磁体中系统研究磁振子色散、拓扑激发动力学及相关自旋电子学效应提供了可靠的模拟平台。", "summary_source": "deepseek", "authors": [{"name": "Lars Moreels"}, {"name": "Nicolai Bechler"}, {"name": "Bartel Van Waeyenberge"}, {"name": "Jonathan Leliaert"}, {"name": "Jan Masell"}], "featured_authors": [{"name": "Lars Moreels"}, {"name": "Nicolai Bechler"}, {"name": "Bartel Van Waeyenberge"}, {"name": "Jonathan Leliaert"}, {"name": "Jan Masell"}], "author_count": 5}, {"id": "2604.15481", "category": "cond-mat", "title": "Divergence of detachment forces in the finite Voronoi model", "abstract": "Detachment and fracture are central to many tissue-level processes, but they are challenging to simulate with Voronoi-type models that typically assume a confluent tissue. Here we analyze the finite Voronoi model, a nonconfluent extension of conventional Voronoi models, in which cell boundaries are composed of straight Voronoi edges and circular arcs of fixed radius $\\ell$. When the line tension on cell-medium interfaces exceeds the tension on cell-cell contacts, we find that the model exhibits a strong time-step dependence in the fracture timescale of initially intact active clusters: decreasing $\\Delta t$ can unphysically suppress cluster rupture events. We trace this behavior to a divergence of detachment forces in the finite Voronoi model and introduce a simple regularization. Finally, we calibrate the near-detachment mechanics against a deformable polygon model and examine how key physical parameters control the tissue fracture timescale under two different calibration strategies. Our results show that, for studies focused on fracture or intercellular adhesion in nonconfluent monolayers, a physically motivated calibration of near-detachment mechanics in the finite Voronoi model is essential.", "url": "https://arxiv.org/abs/2604.15481", "type": "理论", "summary": "1. 该工作分析了有限维诺模型中的细胞脱离过程，揭示了其力学行为的数值敏感性，并引入了正则化方案。\n2. 核心发现是脱离力在接触点发散，导致团簇破裂时间对模拟时间步长产生非物理依赖，正则化方法消除了该发散。\n3. 这强调了对非汇合单层组织破裂研究，必须采用基于近脱离力学物理动机的模型标定策略。", "summary_source": "deepseek", "authors": [{"name": "Wei Wang"}, {"name": "Brian A. Camley"}], "featured_authors": [{"name": "Wei Wang"}, {"name": "Brian A. Camley"}], "author_count": 2}, {"id": "2604.15587", "category": "cond-mat", "title": "Control of turn-to-turn contact resistivity in resistively insulated REBCO coils", "abstract": "Resistively insulated (RI) REBCO magnets feature short ramp times and low ramp losses while maintaining the advantages of no-insulation coils with high engineering current density and tolerance for defects in the REBCO conductor. Control of the turn-to-turn contact resistivity Rc is key to RI technology. Rc must be sufficiently high to prevent a large transient current, which could result in high mechanical stress during magnet quenches. Meanwhile it must be lower than the quench propagation limit to avoid conductor burn-out during a quench. Therefore, it is critical to control Rc within a suitable range of values which is usually coil specific. Previously, we discovered that Rc between two REBCO tapes with a stainless steel interlayer decreases dramatically with contact pressure cycling by up to three orders of magnitude. This drastic change made it impossible to design a suitable Rc value for a stainless steel co-wound RI magnet. In this work, we first present methods for mitigating Rc pressure cycling sensitivity. We found that by adding conductive fillers, such as conductive paste or epoxy, the Rc load cycling sensitivity is largely mitigated. For dry-wound coils, Rc load cycling sensitivity is mitigated by coating REBCO tape with a layer of 2- 3 um of PbSn solder. In addition, Rc can be controlled by oxidizing the stainless steel co-wind tape by heating stainless steel tapes at different temperatures in air. Using above methods, short sample tests showed that Rc was controlled to prescribed values of 1000 and 5000 uOhm-cm2 and was not sensitive to contact pressure cycling up to 30,000 cycles at 4.2 K. The new Rc control method was applied to a 6 double-pancake test coil which was tested at 4.2 K. The Rc in this test coil was comparable with the short sample results. This demonstrated the ability of this new method to control Rc in large coils.", "url": "https://arxiv.org/abs/2604.15587", "type": "理论", "summary": "1. 本研究针对电阻绝缘REBCO线圈中层间接触电阻的控制难题，提出了通过添加导电填料、焊料涂层或不锈钢带氧化处理来抑制其压力循环敏感性的方法。\n2. 其核心物理机制在于利用导电介质填充电接触微观空隙或形成稳定界面层，使接触电阻在4.2K下经历三万次压力循环后仍能稳定维持在预设值（如1000/5000微欧·平方厘米）。\n3. 这为大型电阻绝缘超导磁体的工程化设计提供了可重复的接触电阻调控方案，显著提升了其在极端电磁-机械载荷下的运行可靠性。", "summary_source": "deepseek", "authors": [{"name": "Jun Lu"}, {"name": "Kwangmin Kim"}, {"name": "Iain Dixon"}, {"name": "Justin Deterding"}, {"name": "Emsley Marks"}, {"name": "Brent Jarvis"}, {"name": "Denis Markiewicz"}, {"name": "Hongyu Bai"}, {"name": "Mark Bird"}], "featured_authors": [{"name": "Jun Lu"}, {"name": "Kwangmin Kim"}, {"name": "Iain Dixon"}, {"name": "Denis Markiewicz"}, {"name": "Hongyu Bai"}, {"name": "Mark Bird"}], "author_count": 9}, {"id": "2604.15595", "category": "cond-mat", "title": "Exact Analysis of a One-Dimensional Yang-Gaudin Model with Two-Body Loss", "abstract": "We show that the one-dimensional Yang-Gaudin model with two-body loss remains exactly solvable irrespective of whether constituent particles are bosons or fermions. By relating the Liouvillian spectrum to the right eigenvalues of a non-Hermitian effective Hamiltonian obtained by complexifying the interaction strength, we derive a general expression for the initial particle-loss rate. We then solve the two-body problem exactly and show that, in the bosonic singlet sector, the effective Hamiltonian has real right eigenvalues and the master equation admits steady-state solutions. For many-body systems with three or more particles, we further show that dissipation reverses which spin configurations are most stable: in bosonic systems it favors antiferromagnetic-like configurations over ferromagnetic-like ones, whereas in fermionic systems it favors ferromagnetic-like configurations over antiferromagnetic-like ones.", "url": "https://arxiv.org/abs/2604.15595", "type": "理论", "summary": "1. 该工作证明了具有二体损耗的一维Yang-Gaudin模型无论粒子是玻色子还是费米子均保持精确可解性，并导出了初始粒子损耗率的通用表达式。\n2. 通过将Lindblad算符谱与非厄米等效哈密顿量右本征值关联，精确求解了两体问题，并发现玻色单态下等效哈密顿量具有实右本征值且主方程存在稳态解。\n3. 研究揭示了耗散在多体系统中会逆转自旋构型的稳定性顺序：玻色系统倾向于反铁磁构型而费米系统倾向于铁磁构型，这为耗散调控量子多体态提供了新视角。", "summary_source": "deepseek", "authors": [{"name": "Ryutaro Katsuta"}, {"name": "Shun Uchino"}], "featured_authors": [{"name": "Ryutaro Katsuta"}, {"name": "Shun Uchino"}], "author_count": 2}, {"id": "2604.15635", "category": "cond-mat", "title": "Inductance Meets Memory in the Quantum Magnet Mn3Si2Te6", "abstract": "Orbital degrees of freedom offer a largely untapped route to emergent dynamical phenomena in correlated quantum materials. However, it remains unclear whether collective orbital states can intrinsically generate both reactive and memory functionalities in a bulk system. Here we show that in the ferrimagnet Mn3Si2Te6, nonequilibrium reconfiguration of chiral orbital currents produces both emergent inductance and nonvolatile memristance as intrinsic properties of a single crystal. At low frequency and under a magnetic field along the c axis, coherent orbital-current domains generate robust clockwise inductive I-V loops. At higher frequency and low field, current-driven first-order reconfiguration leads to incomplete reversal and metastable trapping, producing an intrinsic electromotive force and a finite remanent voltage at zero current. These results establish orbital currents as a class of quantum state variables that encode both reactive and memory functionalities, opening routes toward intrinsically reconfigurable and energy-efficient electronic systems.", "url": "https://arxiv.org/abs/2604.15635", "type": "理论", "summary": "1. 该工作通过在铁磁体Mn3Si2Te6单晶中实现非平衡手性轨道电流重构，同时演示了涌现电感和非易失性忆阻这两种本征电子现象。\n2. 其物理关键在于，低频下相干轨道流畴产生稳健的感性I-V回线，而高频下电流驱动的一级相变重构导致不完全反转与亚稳态俘获，从而在零电流时产生剩余电压。\n3. 这确立了轨道电流可作为一类同时编码电抗与记忆功能的量子态变量，为开发本征可重构、高能效的电子系统开辟了新路径。", "summary_source": "deepseek", "authors": [{"name": "Tristan R. Cao"}, {"name": "Gabriel Schebel"}, {"name": "Arabella Quane"}, {"name": "Hengdi Zhao"}, {"name": "Yu Zhang"}, {"name": "Feng Ye"}, {"name": "Longji Cui"}, {"name": "Gang Cao"}], "featured_authors": [{"name": "Tristan R. Cao"}, {"name": "Gabriel Schebel"}, {"name": "Arabella Quane"}, {"name": "Feng Ye"}, {"name": "Longji Cui"}, {"name": "Gang Cao"}], "author_count": 8}, {"id": "2604.15640", "category": "cond-mat", "title": "Fully compensated and uncompensated ferrimagnetic ferrovalley semiconductors", "abstract": "Altermagnets (AMs) and fully compensated ferrimagnets (FC-FIMs) are emerging classes of magnetic materials that combine the advantages of antiferromagnets and ferromagnets. Here, we elucidate the mechanism behind the uniaxial strain-driven transformation from AM to FC-FIM and find that the accompanying non-relativistic valley polarization is positively correlated with the net magnetic moment between magnetic atoms in opposite spin sublattices. We then propose an uncompensated ferrimagnetic monolayer VCrSeTeO to achieve large intrinsic valley polarization. Spin-orbit coupling (SOC) is shown to further increase the valley polarization to over 400 meV under uniaxial strains and the reason is explained in terms of SOC perturbation theorem. Furthermore, we reveal a distinctive anomalous valley Hall effect in which the valley Hall voltage is reversed within the same valley in ferrimagnet VCrSeTeO. This work proposes a strategy for realizing giant valley polarization and provides theoretical guidance for the application of ferrimagnetic ferrovalley semiconductors derived from altermagnets in valleytronics.", "url": "https://arxiv.org/abs/2604.15640", "type": "理论", "summary": "1. 该研究阐明了单轴应变驱动反铁磁向完全补偿铁磁转变的机制，并提出了非补偿铁磁单层VCrSeTeO以实现本征谷极化。\n2. 研究指出自旋轨道耦合可将谷极化提升至400 meV以上，并在铁磁材料中揭示了一种同一谷内能翻转霍尔电压的独特反常谷霍尔效应。\n3. 这项工作为实现巨大谷极化提供了策略，并为基于反铁磁衍生的铁磁性谷半导体在谷电子学中的应用提供了理论指导。", "summary_source": "deepseek", "authors": [{"name": "Weifeng Xie"}, {"name": "Libo Wang"}, {"name": "Yunliang Yue"}, {"name": "Xiong Xu"}, {"name": "Huayan Xia"}, {"name": "Hui Wang"}], "featured_authors": [{"name": "Weifeng Xie"}, {"name": "Libo Wang"}, {"name": "Yunliang Yue"}, {"name": "Xiong Xu"}, {"name": "Huayan Xia"}, {"name": "Hui Wang"}], "author_count": 6}, {"id": "2604.15692", "category": "cond-mat", "title": "Current-Induced Dynamics and Instability Pathways of Skyrmioniums in Chiral Magnets", "abstract": "We present a comprehensive study of current-driven dynamics, transformations, and instabilities of skyrmioniums in chiral magnetic films, considering both isolated objects and collective states forming skyrmionium-based meta-matter. Using micromagnetic simulations combined with an analytical description based on the generalized Thiele equation, we clarify how the internal structure of skyrmioniums governs their nonequilibrium response to electric currents. Despite having zero total topological charge, skyrmioniums exhibit a finite transverse velocity under applied currents. We show that this skyrmionium Hall effect originates from an imbalance between positive and negative topological contributions of the inner skyrmion and surrounding ring, which typically occupy different areas. Current-induced deformations further enhance this imbalance, yielding Hall angles comparable to those of skyrmions. At higher current densities, skyrmioniums undergo distinct instabilities depending on magnetic field and uniaxial anisotropy, including elongation, collapse into a skyrmion, transformation into a topologically trivial droplet, and expansion into stripe textures. We map these regimes in current--field and current--anisotropy phase diagrams and resolve their microscopic pathways via the evolution of topological charge and local rotational measures. Beyond isolated textures, mixed skyrmion--skyrmionium lattices display rich collective dynamics, including elastic transport, polymorphic transitions, soliton exchange, and stripe formation. Pulsed currents provide additional control, enabling access to regimes beyond continuous driving. Our results establish skyrmioniums and their meta-matter as tunable nonequilibrium systems probing the topological energy landscape far from equilibrium.", "url": "https://arxiv.org/abs/2604.15692", "type": "理论+数值", "summary": "1. 本工作通过微磁模拟与推广的Thiele方程解析相结合，系统研究了手性磁体中单个及集体斯格明子元的电流驱动动力学、转变与失稳过程。\n2. 研究揭示了斯格明子元虽净拓扑荷为零，但其霍尔效应源于内层斯格明子与外层环的正负拓扑贡献因占据面积不同而产生的不平衡，且电流致形变会放大该效应。\n3. 该结果为在电流驱动下调控此类非平衡拓扑体系、探索拓扑能量景观及设计基于斯格明子元的超材料动力学提供了清晰的路线图。", "summary_source": "deepseek", "authors": [{"name": "Kaito Nakamura"}, {"name": "Yuka Kotorii"}, {"name": "Andrey O. Leonov"}], "featured_authors": [{"name": "Kaito Nakamura"}, {"name": "Yuka Kotorii"}, {"name": "Andrey O. Leonov"}], "author_count": 3}, {"id": "2604.15700", "category": "cond-mat", "title": "Amplitudes of Hall field-induced resistance oscillations with a two-harmonic density of states", "abstract": "We derive explicit strong-field asymptotics for the normalized differential resistance in Hall field-induced resistance oscillations (HIRO) within the Vavilov-Aleiner-Glazman kinetic framework. For a single-harmonic density of states, the leading oscillation amplitude is set by the full backscattering rate $1/\\tau(\\pi)$. Extending the theory to a two-harmonic density of states, we show that the off-diagonal mixed kernel $\\gamma_{12}$ admits an exact single-integral representation, from which the strong-field asymptotics follow directly. The resulting odd harmonics, notably $m=1$ and $m=3$, have coefficients determined by combinations of $1/\\tau(0)$ and $1/\\tau(\\pi)$, while the leading $m=2$ amplitude remains unchanged. On exact-kernel mock data generated and fit within the same model, with $\\tau_{\\rm tr}$ and $\\tau_{\\rm in}$ held fixed, the resulting extraction protocol recovers $\\tau_q$, $\\tau(\\pi)$, and -- when the $m=1,3$ harmonics are resolved -- $\\tau(0)$ to sub-percent accuracy, with $\\tau(0)$ providing a consistency check on the disorder description.", "url": "https://arxiv.org/abs/2604.15700", "type": "理论+数值", "summary": "1. 该工作在Vavilov-Aleiner-Glazman动理论框架内，推导了双谐波态密度下霍尔场诱导电阻振荡归一化微分电阻的显式强场渐近表达式。\n2. 其核心在于为双谐波态密度下的非对角混合核γ₁₂建立了精确单积分表示，从而直接导出渐近行为并解析出奇次谐波系数由1/τ(0)和1/τ(π)组合决定，而主导的m=2振幅保持不变。\n3. 基于同一模型生成的精确核模拟数据，参数提取协议能以亚百分比精度恢复τ_q、τ(π)及可分辨时的τ(0)，其中τ(0)为无序描述提供了自洽检验。", "summary_source": "deepseek", "authors": [{"name": "Miguel Tierz"}], "featured_authors": [{"name": "Miguel Tierz"}], "author_count": 1}, {"id": "2604.15749", "category": "cond-mat", "title": "Extracting conformal data from finite-size tensor-network flow in critical two-dimensional classical models", "abstract": "We present a general framework for extracting conformal data from critical two-dimensional classical lattice models using finite-size tensor-network flow. The central idea is to identify, from transfer-matrix spectra, a self-consistent finite-size window together with a crossover scale that separates the finite-size-scaling regime from the finite-entanglement-scaling regime induced by bond-dimension truncation. Within this window, the central charge, scaling dimensions, and conformal spins can be estimated without requiring a unique critical fixed-point tensor or detailed prior knowledge of the underlying conformal field theory. We benchmark the framework using three tensor-network renormalization schemes for the critical two-dimensional Ising and three-state clock models. Across schemes, we find robust universal behavior below the crossover scale, enabling accurate extraction of conformal data up to relatively high conformal levels. The analysis also yields a natural operational definition of entanglement scaling for classical tensor-network calculations and, in turn, a complementary estimator of the central charge.", "url": "https://arxiv.org/abs/2604.15749", "type": "理论+数值", "summary": "1. 本研究提出了一种从临界二维经典格点模型的有限尺寸张量网络流中提取共形数据的通用框架。\n2. 其核心在于通过转移矩阵谱识别出自洽的有限尺寸窗口及交叉尺度，从而区分有限尺寸标度区与截断引发的有限纠缠标度区，并在不同重正化方案中均观测到交叉尺度下的普适行为。\n3. 该方法无需依赖唯一的临界固定点张量或事先已知共形场论细节，为更广泛临界模型的张量网络研究提供了系统途径，并给出了经典计算中纠缠标度的操作性定义。", "summary_source": "deepseek", "authors": [{"name": "Sing-Hong Chan"}, {"name": "Pochung Chen"}], "featured_authors": [{"name": "Sing-Hong Chan"}, {"name": "Pochung Chen"}], "author_count": 2}, {"id": "2604.15773", "category": "cond-mat", "title": "Phase Transitions as the Breakdown of Statistical Indistinguishability", "abstract": "We introduce a novel characterization of phase transitions based on hypothesis testing. In our formulation, a phase transition is defined as the breakdown of statistical indistinguishability under vanishing parameter perturbations in the thermodynamic limit. This perspective provides a general, order-parameter-free framework that does not rely on model-specific insights or learning procedures. We show that conventional approaches, such as those based on the Binder parameter, can be reinterpreted as special cases within this framework. As a concrete realization, we employ a distribution-free two-sample run test and demonstrate that the critical point of the two-dimensional Ising model is accurately identified without prior knowledge of the order parameter.", "url": "https://arxiv.org/abs/2604.15773", "type": "理论", "summary": "1. 该工作基于假设检验提出了相变的一种新表征，将相变定义为热力学极限下微扰导致统计不可区分性的破坏。\n2. 其核心在于建立了一个不依赖于序参量或模型先验知识的普适框架，并将传统方法纳入其中作为特例。\n3. 通过二维伊辛模型的示例，展示了该框架无需序参量先验知识即可准确确定临界点，为相变研究提供了新范式。", "summary_source": "deepseek", "authors": [{"name": "Taiyo Narita"}, {"name": "Hideyuki Miyahara"}], "featured_authors": [{"name": "Taiyo Narita"}, {"name": "Hideyuki Miyahara"}], "author_count": 2}, {"id": "2604.15826", "category": "cond-mat", "title": "General perturbative framework for kinetics of rare transitions in 1-dimensional active particle systems", "abstract": "We present a theoretical framework that enables investigating rare transitions in a general model of an active particle in an external potential, with the thermal Active Ornstein-Uhlenbeck Particle (AOUP) appearing as a special case. Using a projection-operator formalism, we compute transition rates perturbatively in two distinct asymptotic regimes. In the regime of small persistence times-where the activity evolves much faster than the particle's position-integrating out the activity reproduces the rates previously reported in the literature. In the opposite regime of large persistence times, we instead integrate out the position and obtain the corresponding rates analytically. Together, these asymptotic expansions uniquely specify a rational approximation that remains accurate across intermediate persistence times. As a result, we obtain an analytic expression for the rate valid across all persistence times and activity strengths in the rare-event limit, which are in excellent agreement with numerical simulations. The presented framework applies to rare transitions in a broad class of driven systems.", "url": "https://arxiv.org/abs/2604.15826", "type": "理论+数值", "summary": "1. 本文提出了一个研究一维活性粒子系统中稀有跃迁动力学的普遍微扰理论框架。\n2. 其核心在于利用投影算符方法，分别在持久时间短和长的渐近区域内计算跃迁速率，并通过有理近似统一了中间区域的描述。\n3. 该框架为广泛驱动系统中的稀有事件分析提供了普适性工具，并可拓展至更高维或更复杂的活性模型研究。", "summary_source": "deepseek", "authors": [{"name": "Vito Seinen"}, {"name": "Peter G. Bolhuis"}, {"name": "Daan Crommelin"}, {"name": "Sara Jabbari Farouji"}, {"name": "Michel Mandjes"}], "featured_authors": [{"name": "Vito Seinen"}, {"name": "Peter G. Bolhuis"}, {"name": "Daan Crommelin"}, {"name": "Sara Jabbari Farouji"}, {"name": "Michel Mandjes"}], "author_count": 5}, {"id": "2604.15852", "category": "cond-mat", "title": "Voids in liquids: peculiarities of molecular dynamics simulation of fluid systems", "abstract": "Molecular dynamics is a powerful tool to investigate the properties of fluid systems. However, a correct interpretation of the results of simulations is required. In particular, some simulations show appearance of large voids in liquids, which contradicts our common sense on what is liquid. In the present paper we discuss the origin of large cavities liquids in molecular dynamics simulations. We demonstrate that the cavities appear either if the temperature of the system is above the critical temperature of liquid-gas transition or if the system is in two-phase liquid-gas region. These conclusions are illustrated by several examples from literature and our own simulations.", "url": "https://arxiv.org/abs/2604.15852", "type": "理论+数值", "summary": "1. 本文通过分析文献及自身模拟数据，系统研究了液体分子动力学模拟中出现大尺度空洞现象的物理起源。\n2. 其核心发现是，这些空洞仅当系统温度高于液-气相变临界温度或处于两相共存区时才会出现，从而解释了与常识相悖的模拟结果。\n3. 这一认识为准确理解和解释流体模拟结果、避免对亚稳态或相界附近体系性质的误判提供了重要准则。", "summary_source": "deepseek", "authors": [{"name": "Yu. D. Fomin"}], "featured_authors": [{"name": "Yu. D. Fomin"}], "author_count": 1}, {"id": "2604.15888", "category": "cond-mat", "title": "Enhancing Neural-Network Variational Monte Carlo through Basis Transformation", "abstract": "Neural-network variational Monte Carlo (NNVMC) has emerged as a powerful tool for solving quantum many-body problems, yet systematic pathways for improving its accuracy remain largely heuristic. Here, we introduce a physically motivated basis transformation for NNVMC that enhances variational expressivity without increasing the complexity of the neural-network ansatz itself. By formulating the many-body wave function in a Gaussian basis, we introduce a single learnable locality parameter, $\\alpha$, that reshapes the target ground state into a more learnable representation. This approach introduces minimal computational overhead and can be readily combined with existing neural-network architectures. Using the three-dimensional homogeneous electron gas as a benchmark, we show that the optimized basis transformation consistently lowers the variational energy for both FermiNet and message-passing neural-network architectures. Notably, for the latter, it enables a more precise determination of the Fermi liquid to Wigner crystal phase transition. More broadly, our results highlight basis transformation as a new route to improving NNVMC in continuous space, showing that accuracy can be enhanced not only by refining the ansatz but also by making the target ground state easier to represent.", "url": "https://arxiv.org/abs/2604.15888", "type": "理论+数值", "summary": "1. 该工作为神经变分蒙特卡洛方法引入了一种高斯基变换，在不增加网络架构复杂度的前提下提升了其求解三维均匀电子气基态问题的精度。\n2. 方法的核心是通过一个可学习的局域性参数α对目标波函数进行重塑，使其更易于神经网络表示，从而以极小的计算开销显著降低了变分能量。\n3. 这一成果不仅为连续空间量子多体模拟提供了优化目标表示的新方向，也为精确探测费米液体-维格纳晶体相变等物理过程提供了更有效的数值工具。", "summary_source": "deepseek", "authors": [{"name": "Zhixuan Liu"}, {"name": "Dongheng Qian"}, {"name": "Jing Wang"}], "featured_authors": [{"name": "Zhixuan Liu"}, {"name": "Dongheng Qian"}, {"name": "Jing Wang"}], "author_count": 3}, {"id": "2604.15908", "category": "cond-mat", "title": "On the role of the slowest observable in one-dimensional Markov processes to construct quasi-exactly-solvable generators with $N=2$ explicit levels", "abstract": "The construction of Quasi-Exactly-Solvable quantum Hamiltonians where only the two first eigenstates $\\Phi_0(x)$ and $\\Phi_1(x)$ of energies $E_0$ and $E_1$ are explicit is revisited from the point of view of one-dimensional Markov processes satisfying detailed-balance, whose generators are related to quantum Hamiltonians via similarity transformations. Here the lowest energy vanishes $E_0=0$ and is associated the conservation of probability and to the steady state $P_*(x)$, while $E_1>0$ is the rate that governs the exponential relaxation towards the steady-state, and is associated to the slowest observable $L_1(x)$ that corresponds to the ratio $ \\frac{\\Phi_1(x) }{\\Phi_0(x)}$ of the two quantum eigenstates. Our main conclusion is that the Markov perspective leads to interesting re-interpretations and that the construction of quasi-exactly-solvable models with $N=2$ explicit levels is more intuitive and technically simpler if one takes the slowest observable $L_1(x)$ as the central object from which all the other properties can be reconstructed. This general approach is then applied to Fokker-Planck generators in continuous space and to Markov jump generators on the lattice.", "url": "https://arxiv.org/abs/2604.15908", "type": "理论", "summary": "1. 该工作从满足细致平衡的一维马尔可夫过程视角，重新审视了仅前两个本征态和本征值显式的准精确可解量子哈密顿量的构造问题。\n2. 其核心在于将以最慢可观测量 $L_1(x) = \\Phi_1(x)/\\Phi_0(x)$ 为中心对象的构建方法，这使构造过程更直观且技术更简洁。\n3. 此通用框架随后被应用于连续空间的福克-普朗克生成元和离散格点上的马尔可夫跳跃过程，展示了方法的广泛适用性。", "summary_source": "deepseek", "authors": [{"name": "Cecile Monthus"}], "featured_authors": [{"name": "Cecile Monthus"}], "author_count": 1}, {"id": "2604.15935", "category": "cond-mat", "title": "Antiferromagnetic Dimers in the Parent Phase of a Correlated Kagome Superconductor", "abstract": "Kagome metals are prone to charge-density wave (CDW), magnetic, and superconducting phases, with their flat electronic band conducive for correlated physics. In contrast to the weakly correlated $A$V$_3$Sb$_5$ ($A$ = K, Rb, Cs) kagome metals with a $2\\times2$ CDW, CsCr$_3$Sb$_5$ is a correlated metal with a flat band close to the Fermi level, and exhibits a $4\\times1$ CDW intertwined with magnetic order. Under pressure, the intertwined orders are suppressed and give way to a dome of superconductivity that emerges from a non-Fermi liquid normal state. Here, we solve the crystal structure of the $4\\times 1$ CDW state in CsCr$_3$Sb$_5$, and show it consists of Cr dimers separated by Cr chains. First-principles calculations show the dominant exchange interaction is antiferromagnetic within the dimers, while the intra-chain and dimer-chain couplings are much weaker. The CDW transition of CsCr$_3$Sb$_5$ is found to be more strongly first-order than those in $A$V$_3$Sb$_5$, without significant soft phonons or diffuse scattering above the CDW transition temperature. These findings suggest that fluctuating antiferromagnetic dimers may play a major role in the electron pairing of superconducting CsCr$_3$Sb$_5$.", "url": "https://arxiv.org/abs/2604.15935", "type": "数值", "summary": "1. 该工作解析了关联Kagome超导体CsCr₃Sb₅中4×1电荷密度波（CDW）态的晶体结构，揭示了其由铬二聚体与铬链交替组成的构型，并通过第一性原理计算确定了其中的主导磁交换作用。\n2. 核心发现表明，二聚体内的反铁磁交换相互作用占主导，而链内及二聚体-链间耦合显著更弱；且该CDW转变为强一级相变，在转变温度以上未观测到显著的软声子或漫散射信号。\n3. 这暗示涨落的反铁磁二聚体可能在CsCr₃Sb₅的超导电子配对中起关键作用，为理解关联Kagome金属中纠缠序与超导的微观机制提供了新的物理视角。", "summary_source": "deepseek", "authors": [{"name": "Yifan Wang"}, {"name": "Chenchao Xu"}, {"name": "Yi Liu"}, {"name": "Jinke Bao"}, {"name": "Jiayu Guo"}, {"name": "Xiaoran Yang"}, {"name": "Yuiga Nakamura"}, {"name": "Hiroshi Fukui"}, {"name": "Taishun Manjo"}, {"name": "Daisuke Ishikawa"}, {"name": "Alfred Q. R. Baron"}, {"name": "Saizheng Cao"}, {"name": "Rui Li"}, {"name": "Zilong Li"}, {"name": "Yanan Zhang"}, {"name": "Ruihan Chen"}, {"name": "Ming Shi"}, {"name": "Huiqiu Yuan"}, {"name": "Guanghan Cao"}, {"name": "Chao Cao"}, {"name": "Yu Song"}], "featured_authors": [{"name": "Yifan Wang"}, {"name": "Chenchao Xu"}, {"name": "Yi Liu"}, {"name": "Guanghan Cao"}, {"name": "Chao Cao"}, {"name": "Yu Song"}], "author_count": 21}, {"id": "2604.15942", "category": "cond-mat", "title": "Extension of the iterated perturbation theory at arbitrary fillings to nonequilibrium steady states", "abstract": "We extend the Kajueter-Kotliar [Phys. Rev. Lett. 77, 131 (1996)] iterated perturbation theory (KK-IPT) away from half filling to nonequilibrium steady states. We benchmark the resulting nonequilibrium KK-IPT approach against the auxiliary master equation approach (AMEA), whose accuracy is controlled in and out of equilibrium. As expected, in equilibrium, KK-IPT reproduces the AMEA results for different fillings with high accuracy at the level of both spectral properties and electron densities. Out of equilibrium, we study quantum transport across a correlated impurity and compute the differential conductance and spectral functions. We find very good agreement between nonequilibrium KK-IPT and AMEA in the parameter regime where the latter is reliable, in particular at moderate temperatures and biases. These results support nonequilibrium KK-IPT as an approximate description of nonequilibrium steady states away from half filling. Although a controlled benchmark is not available in the low-temperature, low-bias regime, where AMEA becomes less reliable, nonequilibrium KK-IPT remains numerically stable in those regions, suggesting that it may provide a useful alternative for nonequilibrium calculations in this regime.", "url": "https://arxiv.org/abs/2604.15942", "type": "理论+数值", "summary": "1. 该工作将Kajueter-Kotliar迭代微扰论从半满填充推广至非平衡稳态，并用于研究量子输运问题。\n2. 其通过对比受控的辅助主方程方法，验证了非平衡KK-IPT在中等温度与偏压下对谱函数和电导的可靠描述。\n3. 该方法在AMEA难以适用的低温低偏压区域仍保持数值稳定，为此类参数区域的非平衡计算提供了一个有价值的替代方案。", "summary_source": "deepseek", "authors": [{"name": "Tommaso Maria Mazzocchi"}, {"name": "Enrico Arrigoni"}], "featured_authors": [{"name": "Tommaso Maria Mazzocchi"}, {"name": "Enrico Arrigoni"}], "author_count": 2}, {"id": "2604.15952", "category": "cond-mat", "title": "Ergodic properties of functionals of Gaussian processes", "abstract": "We derive the first two moments of generic positive stochastic functionals in terms of the one- and two-time probability density functions of the underlying random walk, and we prove ergodicity of observables in stationary random walks. These general results are applied to the half-occupation time and the occupation time in an interval of a Gaussian random walk, for which we obtain exact analytic expressions for the first two moments. We then extend the analysis to scaled Brownian motion and fractional Brownian motion, computing the ergodicity breaking parameter and establishing a simple scaling form for the probability densities of occupation times. Within the framework of infinite ergodic theory, we further identify universal properties of positive observables. All analytical predictions are fully confirmed by numerical simulations.", "url": "https://arxiv.org/abs/2604.15952", "type": "理论+数值", "summary": "1. 该工作推导了正随机泛函的前两阶矩与基础随机游走概率密度的关系，证明了平稳随机游走中观测量的遍历性，并将结果应用于高斯随机游走、标度布朗运动及分数布朗运动的占据时间分析。\n2. 其技术核心在于通过单时与双时概率密度函数解析获得了占据时间矩的精确表达式，并借助无限遍历理论框架揭示了正观测量的普适标度形式与遍历破缺参数。\n3. 这为连续时间随机过程与非平衡统计力学中占据时间统计的系统研究建立了严格解析基准，并为涉及长程关联或反常扩散系统的动力学分析提供了理论工具。", "summary_source": "deepseek", "authors": [{"name": "Vicenç Méndez"}, {"name": "Carlos Hervás"}, {"name": "Rosa Flaquer-Galmés"}], "featured_authors": [{"name": "Vicenç Méndez"}, {"name": "Carlos Hervás"}, {"name": "Rosa Flaquer-Galmés"}], "author_count": 3}, {"id": "2604.15983", "category": "cond-mat", "title": "Observation of ring states in a delicate topological insulator", "abstract": "Topological insulators are typically characterized by particularly stable properties, such as global invariants, and can be identified by probing their robust surface states. A recently discovered novel form of band topology, delicate topology, challenges this paradigm: its defining property, multicellularity, can be removed by introducing a coupling to local orbitals anywhere in the spectrum, even far above the relevant band gap. This makes it hard to diagnose delicate topology with conventional probes that access only low-energy degrees of freedom. Here, we introduce strong local impurities as a spectroscopic probe of a delicate topological insulator which we realize in a phononic metamaterial. By tuning the impurity strength and performing orbital-resolved readout, we observe recently proposed indicators of topology: ring states, in-gap bound states whose frequencies remain pinned in the strong-impurity limit while their real-space profiles form a pronounced ring around the impurity site. We find that these ring states persist even when the multicellularity in our system is removed by a weakly hybridizing additional orbital. Our results establish impurity-induced ring states as probes of complex multiband physics, including delicate topological phases.", "url": "https://arxiv.org/abs/2604.15983", "type": "理论+数值", "summary": "1. 本工作在一个声子超材料实现的细致拓扑绝缘体中引入强局域杂质作为谱学探针，通过调节杂质强度并实施轨道分辨读取，实验观测到了理论预言的环态拓扑指示器。\n2. 其核心物理在于环态在强杂质极限下频率保持钉扎且空间轮廓形成环绕杂质点的环形结构，即使当系统的多胞性因弱杂化额外轨道耦合被移除时仍持续存在。\n3. 这确立了杂质诱导环态作为探测包括细致拓扑相在内的复杂多带物理系统的可靠谱学手段，为超越传统低能探针的拓扑诊断提供了新途径。", "summary_source": "deepseek", "authors": [{"name": "Caroline Tornow"}, {"name": "Julia Rupprecht"}, {"name": "Pascal Engeler"}, {"name": "Ute Drechsler"}, {"name": "Kukka-Emilia Huhtinen"}, {"name": "Chiara Devescovi"}, {"name": "Sebastian D. Huber"}], "featured_authors": [{"name": "Caroline Tornow"}, {"name": "Julia Rupprecht"}, {"name": "Pascal Engeler"}, {"name": "Kukka-Emilia Huhtinen"}, {"name": "Chiara Devescovi"}, {"name": "Sebastian D. Huber"}], "author_count": 7}, {"id": "2604.16026", "category": "cond-mat", "title": "Mircomechanical insights into unconstrained grain boundary sliding", "abstract": "Grain boundary sliding (GBS) is a key deformation mechanism at high homologous temperatures in polycrystalline materials, however, its intrinsic behavior is often obscured by additional strain accommodation processes. In this study, dislocation-mediated unconstrained GBS was investigated using Ni bicrystal micropillars containing a single high-angle grain boundary. Micropillar compression tests were conducted over a temperature range from room temperature to $600\\,^{\\circ}\\mathrm{C}$ and strain rates between $5\\times10^{-4}$ and $10^{-1}\\,\\mathrm{s}^{-1}$. By comparing bicrystal and single-crystal responses, the intrinsic contribution of GBS was isolated. The strain-rate sensitivity remained low (SRS $\\approx 0.034 \\pm 0.017$), comparable to room temperature values, indicating the absence of diffusion-controlled accommodation mechanisms. The activation energy for GBS was determined to be $234\\,\\mathrm{kJ\\,mol^{-1}}$, consistent with grain boundary diffusion-assisted glide of grain boundary dislocations. These results demonstrate that the high strain-rate sensitivity commonly associated with GBS in polycrystals originates primarily from accommodation processes rather than the intrinsic sliding mechanism.", "url": "https://arxiv.org/abs/2604.16026", "type": "理论", "summary": "1. 本研究通过镍双晶微柱压缩实验，在室温至600°C温度范围和5×10⁻⁴至10⁻¹ s⁻¹应变速率范围内，分离出无约束晶界滑移的本征贡献。\n2. 实验发现应变速率敏感性保持较低水平（SRS≈0.034±0.017），表明不存在扩散控制的协调机制，并测得晶界滑移激活能为234 kJ·mol⁻¹，符合晶界扩散辅助的晶界位错滑移机制。\n3. 这些结果证明多晶材料中通常与晶界滑移相关的高应变速率敏感性主要源于协调过程，而非本征滑动机制，这为理解高温变形行为提供了微观力学基础。", "summary_source": "deepseek", "authors": [{"name": "Divya Sri Bandla"}, {"name": "Subin Lee"}, {"name": "Christoph Kirchlechner"}], "featured_authors": [{"name": "Divya Sri Bandla"}, {"name": "Subin Lee"}, {"name": "Christoph Kirchlechner"}], "author_count": 3}, {"id": "2604.16063", "category": "cond-mat", "title": "Spinon shift current in a noncentrosymmetric quantum spin chain", "abstract": "We theoretically study direct current generation in a quantum spin chain induced by spinon excitations by light irradiation. We consider a s=1/2 1D antiferromagnetic XXZ model with magnetoelectric coupling that describes multiferroics with broken inversion symmetry. We perform the real-time simulation using infinite time-evolving block decimation (iTEBD), and demonstrate the direct current generation under light irradiation. By comparing the second order nonlinear conductivity and the two-spinon excitation spectra of 1D XXZ model, we confirm that the spinon excitations are the origin for the direct current generation in the quantum spin chain. We find that the bulk photovoltaic effect is driven by electric polarization carried by the spinons through the shift current mechanism, and thus is regarded as ``the spinon shift current''.", "url": "https://arxiv.org/abs/2604.16063", "type": "理论+数值", "summary": "1. 该工作通过无限时间演化块十化(iTEBD)数值模拟，研究了光照射下非中心对称量子自旋链中的自旋子激发诱导直流电流生成。\n2. 通过比对二阶非线性电导率与二维XXZ模型的双自旋子激发谱，确立了自旋子通过位移电流机制携带电极化并驱动体光伏效应的物理图像。\n3. 这一发现为探索更多非中心对称磁电耦合体系及受挫自旋系统中的新奇光致电流效应提供了新的理论框架和研究方向。", "summary_source": "deepseek", "authors": [{"name": "Ryosuke Yamashita"}, {"name": "Shintaro Takayoshi"}, {"name": "Takahiro Morimoto"}], "featured_authors": [{"name": "Ryosuke Yamashita"}, {"name": "Shintaro Takayoshi"}, {"name": "Takahiro Morimoto"}], "author_count": 3}, {"id": "2604.16102", "category": "cond-mat", "title": "Exact Steady State of a One-end Driven XXZ Spin Chain with Boundary Field", "abstract": "We find an exact nonequilibrium steady state of an open dissipatively driven XXZ spin-1/2 chain with source or sink spin bath at one end and an arbitrary boundary field at the other end.", "url": "https://arxiv.org/abs/2604.16102", "type": "理论", "summary": "1. 该工作精确求解了单端自旋浴驱动、另一端含任意边界场的开放耗散XXZ自旋链的非平衡稳态。\n2. 其核心突破在于通过构型精确对角化方法，首次得到该非均匀边界条件下可积系统严格稳态的解析表达。\n3. 这为深入研究边界驱动与磁场共同调控的非平衡量子磁性行为提供了可扩展的理论框架。", "summary_source": "deepseek", "authors": [{"name": "V. Popkov"}, {"name": "T. Prosen"}], "featured_authors": [{"name": "V. Popkov"}, {"name": "T. Prosen"}], "author_count": 2}, {"id": "2604.16152", "category": "cond-mat", "title": "Hopping-Mediated Charge Transport in Graphene Beyond the Ballistic Regime", "abstract": "We present a trajectory-resolved framework for charge transport in graphene and related two-dimensional carbon systems beyond the ideal ballistic and fully coherent limits. Transport is described by kinetic Monte Carlo hopping on a predefined atomic lattice, allowing the combined treatment of disorder, thermal activation, and external fields. Current and effective transmittance are extracted directly from stochastic carrier trajectories, without phenomenological transport coefficients. We apply the method to graphene under bias voltage (0-0.10 V), temperature (300-900 K), magnetic field (0-10 T), in-plane strain (2-10%, uniaxial and biaxial), and vacancy concentration (0-10%). Pristine graphene shows an almost ohmic response, with currents of about 7-8 uA, effective transmittance near 0.98-1.00, and conductance of about (5.8-7.8) x 10^-5 S at 0.10 V, depending on direction. Vacancies strongly suppress transport, reducing transmittance to about 0.45-0.75 at 10% vacancy. Higher temperature accelerates hopping and partly restores transport, but cannot overcome severe connectivity loss. Magnetic fields further reduce transport, especially in disordered networks. The framework provides a unified computational scheme for realistic two-dimensional carbon materials and also yields diffusion coefficients and effective mobilities from carrier displacements and transit times.", "url": "https://arxiv.org/abs/2604.16152", "type": "数值", "summary": "1. 该工作提出了一个轨迹解析的框架，用于研究超越理想弹性和完全相干极限的石墨烯等二维碳系统中的电荷输运。\n2. 其技术优势在于，通过预设原子晶格上的动力学蒙特卡洛跳跃模拟，可直接从随机载流子轨迹中提取电流与有效透射率，无需唯象输运系数，并能统一处理无序、热激活及外场。\n3. 这为模拟真实二维碳材料在偏压、温度、磁场、应变及空位等多种条件下的输运行为提供了一个统一的计算方案，并可进一步获得扩散系数与有效迁移率。", "summary_source": "deepseek", "authors": [{"name": "J. P. Dadario Pereira"}, {"name": "Raphael Tromer"}, {"name": "Luiz A. Ribeiro Junior"}, {"name": "Douglas S. Galvao"}], "featured_authors": [{"name": "J. P. Dadario Pereira"}, {"name": "Raphael Tromer"}, {"name": "Luiz A. Ribeiro Junior"}, {"name": "Douglas S. Galvao"}], "author_count": 4}, {"id": "2604.16163", "category": "cond-mat", "title": "Spinning Living Crystals of Run-and-Tumble Particles with Environmental Feedback", "abstract": "Collective rotations are common in active matter, enhancing cohesion, transport, and mixing. They are typically attributed to chiral non-reciprocal dynamics due to intrinsic particle chirality, torque-generating interactions among units, or geometric confinement. Here, we uncover a different mechanism for rotational order in active matter where a dynamic environment coordinates the self-organization of non-chiral active particles into living crystals exhibiting sustained collective solid-like rotations. At intermediate densities, feedback from a fluctuating landscape of passive Brownian particles stabilizes large living crystals of obstacle-avoiding run-and-tumble agents. Strikingly, this environmental feedback also produces living crystals with qualitatively distinct dynamics: collective solid-like spinning emerges for particles with long persistence times approaching ballistic motion, rather than for particles moving by conventional enhanced diffusion. Beyond revealing a new route to collective rotational order in active matter, these findings highlight the integral role of a dynamic environment in self-organization and suggest environment-mediated design principles for active materials with unconventional dynamical responses.", "url": "https://arxiv.org/abs/2604.16163", "type": "理论", "summary": "1. 该研究发现了非手性自驱动粒子通过动态环境反馈自组织形成具有持续集体固体转动的活性晶体。\n2. 关键机制在于被动布朗粒子构成的涨落环境反馈稳定了障碍规避型跑动-翻转粒子形成的活性晶体，并使具有长持续时间的近弹道运动粒子产生集体固体自旋。\n3. 这为理解活性物质自组织提供了新视角，并启示通过环境介导设计具有非常规动力学响应的活性材料。", "summary_source": "deepseek", "authors": [{"name": "Maks Pečnik Bambič"}, {"name": "Nuno A. M. Araújo"}, {"name": "Giorgio Volpe"}], "featured_authors": [{"name": "Maks Pečnik Bambič"}, {"name": "Nuno A. M. Araújo"}, {"name": "Giorgio Volpe"}], "author_count": 3}, {"id": "2604.16246", "category": "cond-mat", "title": "Bridging Atomistic and Continuum Descriptions of Nanoscale Dislocation Loops in Tungsten", "abstract": "In order to predict the long-term effects of irradiation on the material properties of tungsten, a continuum approach to simulating the interactions of dislocation loops, which arise from radiation damage, is proposed. Continuum models of the displacement, strain and stress fields produced by dislocation loops exhibit unphysical singularities near the defect core, but are thought to accurately capture atomistic displacements in the far-field. A linear elastic model of nanoscale dislocation loops in tungsten is developed, and the model is verified using atomistic simulations to ensure that the model is informed by lower-length scale phenomena such that the physics of the problem is correctly captured. We discuss the model and its advantages, and show that predictions produced by atomistic simulations do indeed agree well with the far-field behaviour of the continuum model when dislocation loops are far from material boundaries. In particular, we robustly demonstrate that the decay rate of atomistic results and continuum results coincide with one another, and show that the results converge as the size of the atomistic simulations approach the far-field limit.", "url": "https://arxiv.org/abs/2604.16246", "type": "理论+数值", "summary": "1. 本研究针对钨中纳米尺度位错环，建立了一个连接原子尺度与连续介质描述的线性弹性模型。\n2. 模型的关键在于通过原子模拟校正，消除了缺陷核附近的非物理奇异性，同时保证了远场位移与应力场的精确描述。\n3. 该工作为准确预测辐射损伤的长期效应及发展跨尺度的材料模拟方法提供了可靠的理论基础。", "summary_source": "deepseek", "authors": [{"name": "Joseph Duque Lopez"}, {"name": "Sergei Dudarev"}, {"name": "James Kermode"}, {"name": "Thomas Hudson"}], "featured_authors": [{"name": "Joseph Duque Lopez"}, {"name": "Sergei Dudarev"}, {"name": "James Kermode"}, {"name": "Thomas Hudson"}], "author_count": 4}, {"id": "2604.16257", "category": "cond-mat", "title": "MF-toolkit: A High-Performance Python Library for Multifractal Analysis with Automated Crossover Detection, Source Identification and Application to Gravitational Waves Data", "abstract": "Multifractal Detrended Fluctuation Analysis (MFDFA) is a powerful and widely used technique for characterizing the scaling properties and long-range correlations of complex time series. However, its application often involves significant practical challenges, such as the subjective identification of scaling regions (crossovers) and the disambiguation of the physical origins of multifractality. We introduce MF-toolkit, a high-performance, parallelized Python library designed to address these challenges. It integrates three key innovations: (1) fully automatic crossover detection algorithms (CDV-A and SPIC), which remove operator bias and enhance reproducibility; (2) a built-in implementation of the Iterative Amplitude Adjusted Fourier Transform (IAAFT) for generating surrogate data, enabling the robust identification of the source of multifractality; and (3) a comprehensive suite for generating synthetic time series for rigorous validation. We demonstrate the rigor and utility of MF-toolkit through its application to characterize the multifractal properties of non-stationary noise in gravitational wave (LIGO) data. The MF-toolkit library offers a robust, efficient, and user-friendly tool for advanced time series analysis, facilitating more rigorous and reproducible research across physics and other data-intensive fields.", "url": "https://arxiv.org/abs/2604.16257", "type": "数值", "summary": "1. 本文提出了一个名为MF-toolkit的高性能Python库，旨在实现对复杂时间序列的多重分形去趋势波动分析（MFDFA），并将其应用于引力波（LIGO）数据的非平稳噪声表征。\n2. 该工具的核心创新在于集成了全自动交叉检测算法，以及通过迭代幅度调整傅里叶变换生成替代数据，从而客观地识别标度区域并辨析多重分形性的物理来源。\n3. 这为物理学及其他数据密集型领域中更严谨、可重复的时序分析提供了标准化工具，并可直接推动对引力波探测器噪声等复杂信号特性的深入研究。", "summary_source": "deepseek", "authors": [{"name": "Nahuel Mendez"}, {"name": "Maria Cristina Mariani Maria Pia Beccar-Varela"}, {"name": "Osei Tweneboah"}, {"name": "Sebastian Jaroszewicz"}], "featured_authors": [{"name": "Nahuel Mendez"}, {"name": "Maria Cristina Mariani Maria Pia Beccar-Varela"}, {"name": "Osei Tweneboah"}, {"name": "Sebastian Jaroszewicz"}], "author_count": 4}, {"id": "2604.16261", "category": "cond-mat", "title": "Atomistic Mechanisms of Stress-Dependent Molten Salt Corrosion in NiCr Alloys", "abstract": "Ni-based structural alloys in molten salt environments often experience simultaneous mechanical loading and corrosive attack, yet the mechanisms governing stress-corrosion interactions remain unclear. Prior studies largely emphasize tensile stress, while the role of compressive stress has received limited attention. Here, reactive molecular dynamics simulations are used to investigate the coupled effects of applied strain and corrosion in Ni$_{0.75}$Cr$_{0.25}$ exposed to molten FLiNaK at 800$^\\circ$C. A $\\Sigma5(210)$ grain boundary model is subjected to tensile (+4%) to compressive (-4%) uniaxial strains, and corrosion behavior is evaluated through fluorine adsorption, charge redistribution, and grain boundary evolution. Tensile strain accelerates intergranular corrosion by reducing local atomic packing through elastic dilation and increasing excess free volume at the grain boundary, which enhances atomic mobility and salt infiltration. In contrast, compressive strain suppresses corrosion by promoting the formation of a ridge-like surface layer along the grain boundary, limiting salt access to the underlying alloy. These results provide atomistic insight into how stress states influence grain boundary corrosion in molten salts.", "url": "https://arxiv.org/abs/2604.16261", "type": "理论+数值", "summary": "1. 本文通过反应分子动力学模拟，研究了Ni$_{0.75}$Cr$_{0.25}$合金在800℃熔融FLiNaK盐中、承受-4%至+4%单轴应变时的晶界腐蚀行为。\n2. 研究发现，拉应变通过弹性膨胀降低局部原子堆积密度并增加晶界过剩自由体积，从而加速沿晶腐蚀；而压应变则通过促进沿晶界形成脊状表层来抑制盐渗入。\n3. 这一结果从原子尺度揭示了应力状态调控熔盐腐蚀的微观机制，为设计耐腐蚀合金结构提供了关键理论依据。", "summary_source": "deepseek", "authors": [{"name": "Hamdy Arkoub"}, {"name": "Jia-Hong Ke"}, {"name": "Miaomiao Jin"}], "featured_authors": [{"name": "Hamdy Arkoub"}, {"name": "Jia-Hong Ke"}, {"name": "Miaomiao Jin"}], "author_count": 3}, {"id": "2604.16267", "category": "cond-mat", "title": "Improved Desalination by Polymer Grafting", "abstract": "Freshwater scarcity demands desalination technologies that are efficient, scalable, and sustainable. Capacitive deionisation (CDI) is promising but remains limited by inefficient ion adsorption and poor charge utilisation. Here, we show that suitably chosen polyampholytic block copolymer grafting can substantially enhance CDI performance, via a combination of dipolar response and steric effects. Using mean-field classical density functional theory and grand-canonical Monte Carlo simulations, we demonstrate that such polymer grafted electrodes enable strongly improved desalination performance, without altering the pore architecture. Even an electrode grafting by simple neutral polymers can generate an improvement, although a suitably designed block polymer architecture offers an additional performance gain. These results establish interfacial block copolymer grafting as a powerful route toward high-performance, membrane-free desalination.", "url": "https://arxiv.org/abs/2604.16267", "type": "理论+数值", "summary": "1. 该工作通过平均场经典密度泛函理论和巨正则蒙特卡洛模拟，证明了在电容去离子（CDI）电极上接枝聚两性嵌段共聚物能显著提升海水淡化性能。\n2. 其核心物理机制在于接枝聚合物的偶极响应和空间位阻效应的协同作用，该设计可在不改变电极孔隙结构的前提下，实现离子吸附效率和电荷利用率的双重优化。\n3. 这为开发无需膜组件的高性能海水淡化技术，特别是通过界面聚合物工程精细调控电极-电解质相互作用，提供了明确的理论依据和材料设计思路。", "summary_source": "deepseek", "authors": [{"name": "Mamta Yadav"}, {"name": "Clifford E. Woodward"}, {"name": "Jan Forsman"}], "featured_authors": [{"name": "Mamta Yadav"}, {"name": "Clifford E. Woodward"}, {"name": "Jan Forsman"}], "author_count": 3}, {"id": "2604.16290", "category": "cond-mat", "title": "Renormalised thermodynamics for Bose gases from low to critical temperatures", "abstract": "We compute thermodynamic properties of dilute Bose gases using non-perturbative approximations of the two-particle irreducible (2PI) effective action. It is shown how to systematically renormalise the self-consistent descriptions beyond conventional Gaussian approximations such as Hartree-Fock-Bogoliubov theory. This allows us to determine the condensate depletion from low to high temperatures, including its critical behaviour at the phase transition. While the universal anomalous dimension at criticality is vanishing for Gaussian approximations, we determine its non-zero value at next-to-leading order of a self-consistent expansion in the number of field components.", "url": "https://arxiv.org/abs/2604.16290", "type": "理论+数值", "summary": "1. 该工作利用两粒子不可约有效作用的非微扰近似，计算了稀薄玻色气体从低温到临界温度的热力学性质。\n2. 其核心在于提出了超越传统高斯近似的系统化重整化方案，并在场分量数自洽展开的次领头阶得到了相变点处非零的普适反常维数。\n3. 这为研究弱相互作用玻色气体临界现象提供了严格的理论框架，并可推广至其他具有连续对称性的量子系统。", "summary_source": "deepseek", "authors": [{"name": "Michael H. Heinrich"}, {"name": "Alexander Wowchik"}, {"name": "Jürgen Berges"}], "featured_authors": [{"name": "Michael H. Heinrich"}, {"name": "Alexander Wowchik"}, {"name": "Jürgen Berges"}], "author_count": 3}, {"id": "2604.16293", "category": "cond-mat", "title": "Fluctuating Pair Density Wave in Finite-temperature Phase Diagram of the $t$-$t^\\prime$ Hubbard Model", "abstract": "The Hubbard model and its extensions are canonical theoretical frameworks for understanding correlated electronic states, including those in high-$T_c$ cuprates. Here, we use state-of-the-art thermal tensor network method to map out the temperature-doping phase diagram of the $t$-$t^\\prime$ Hubbard model. On the electron-doped side, we find a $d$-wave superconducting (dSC) regime, supporting the scenario of high-$T_c$ superconductivity. In contrast, on the hole-doped side, no robust dSC phase is detected. Instead, a finite-temperature regime dominated by strong pair-density-wave (PDW) fluctuations emerges, which may eventually give way to charge density wave order upon further cooling. The PDW state exhibits inter-arc pairing with net momentum near $(0, \\pi)$, distinct from the zero-momentum pairing in conventional dSC. Furthermore, these fluctuating PDW states occupy the lower portion of the pseudogap regime on the hole-doped side. We provide a comprehensive finite-temperature perspective consistent with previous ground-state studies, shedding new light on pairing instabilities and exotic electronic states in high-$T_c$ superconductors.", "url": "https://arxiv.org/abs/2604.16293", "type": "理论+数值", "summary": "1. 该工作采用先进的热张量网络方法，系统绘制了$t$-$t^\\prime$ Hubbard模型的温度-掺杂相图，揭示了电子掺杂侧存在$d$波超导区域而空穴掺杂侧缺乏稳健超导相。\n2. 其主要物理发现是空穴掺杂侧在有限温度下出现强烈的对密度波（PDW）波动主导区，该态具有净动量近$(0, \\pi)$的弧间配对特征，且占据赝隙区下部，与常规零动量超导形成鲜明对比。\n3. 这一研究为理解高温超导体中配对不稳定性、赝隙现象及电子态演化提供了连贯的有限温度视角，对相关理论模型与实验探索具有明确启示。", "summary_source": "deepseek", "authors": [{"name": "Qiaoyi Li"}, {"name": "Yang Qi"}, {"name": "Wei Li"}], "featured_authors": [{"name": "Qiaoyi Li"}, {"name": "Yang Qi"}, {"name": "Wei Li"}], "author_count": 3}, {"id": "2604.15420", "category": "hep-th", "title": "Local CFTs extremise $F$", "abstract": "Many CFTs can be extended to lines of nonlocal CFTs parametrised by the scaling dimension $\\Delta$ of the fundamental field appearing in the action. $\\Delta=\\frac{d}{2}-\\zeta$ is set by the exponent of the kinetic term $(-\\partial^2)^{\\zeta}$, which is nonlocal for noninteger $\\zeta$. If $\\Delta$ is tuned to $\\Delta_\\mathrm{local}$, the scaling dimension of the fundamental field in the local CFT, arXiv:1703.05325 showed that we recover the conformal data of that CFT (plus a decoupled sector). One natural question is: how is the local point special on this line of nonlocal CFTs? We prove that these local CFTs lie at the extrema of the (universal part of the) sphere free energy $\\tilde{F}(\\Delta)=\\sin(\\frac{\\pi d}{2}) \\log Z_{S^d}$ of the long-range CFTs: $d\\tilde{F}/d\\Delta|_{\\Delta=\\Delta_\\mathrm{local}}=0$; and for unitary CFTs they locally maximise it. The simple proof uses the fact that the derivative of $\\tilde{F}$ with respect to $\\Delta$ receives contributions only from the nonlocal terms in the action. The nonlocal terms must be absent in the limit $\\Delta \\to \\Delta_\\mathrm{local}$, and hence the derivative is zero. Demonstrating maximisation then requires a proof of the generalised $F$-theorem in conformal perturbation theory to subleading order. We check our result with the O$(N)$ $\\phi^4$ and cubic CFTs in the $\\epsilon$ expansion and the large-$N$ limit. This result provides a minimal encoding of the scaling dimension of the fundamental field in many CFTs, and also explains the curious derivative structure of the large-$N$ expansion of $\\Delta_\\phi$ in the O$(N)$ model. Finally, this nonlocal $F$-extremisation can be viewed as a non-supersymmetric version of the known $c,F,a$-extremisation mechanisms.", "url": "https://arxiv.org/abs/2604.15420", "type": "理论", "summary": "1. 该研究探讨了标度维数Δ参数化的非局域共形场论（CFT）线，证明了当Δ调整至局域CFT的Δ_local时，这些局域CFT点恰好位于长程CFT的球面自由能（其普适部分）的极值处。\n2. 其核心物理在于，自由能对Δ的导数仅由作用量中的非局域项贡献，而Δ→Δ_local时非局域项必须消失，因此导数为零；对幺正CFT，该点局部极大化自由能。\n3. 该结果为许多CFT中基本场标度维数提供了一种极简编码，解释了O(N)模型中Δ_φ的大N展开导数结构，并可视作已知c、F、a极值化机制的非超对称版本。", "summary_source": "deepseek", "authors": [{"name": "Ludo Fraser-Taliente"}], "featured_authors": [{"name": "Ludo Fraser-Taliente"}], "author_count": 1}, {"id": "2604.15422", "category": "hep-th", "title": "Semiclassics at the cusp", "abstract": "We study cusped Wilson line operators in the Abelian Higgs model in $ d = 4 - \\epsilon $ at large external charges. Using a double-scaling limit $ Q \\to \\infty $, $ \\epsilon \\to 0 $ with $ Q\\epsilon $ fixed, we develop a semiclassical framework that provides analytic control beyond fixed-order perturbation theory. We compute the cusp anomalous dimension for arbitrary charges up to next-to-next-to-leading order in the gauge coupling, while resumming scalar self-interactions to all orders. Our results interpolate between perturbative and large-charge regimes, accessing domains that are invisible in fixed-order perturbation theory. As an application, we provide new predictions for various defect CFT observables, including the Mandelstam-Schwinger-dressed two-point function characterizing the superconducting phase transition.", "url": "https://arxiv.org/abs/2604.15422", "type": "理论", "summary": "1. 该研究在d=4-ε维阿贝尔希格斯模型中，针对大外电荷下的尖点威尔逊线算符，通过设定双重标度极限Q→∞、ε→0且Qε固定，构建了一个半经典分析框架。\n2. 此框架实现了对规范耦合次次领头阶尖点反常维度的解析计算，并全阶重求了标量自相互作用，从而衔接了微扰与大电荷区域，揭示了固定阶微扰论无法触及的物理领域。\n3. 基于此，工作为缺陷共形场论的可观测量（如描述超导相变的Mandelstam-Schwinger修饰两点函数）提供了新理论预测，为相关量子场论与相变研究开辟了途径。", "summary_source": "deepseek", "authors": [{"name": "Jahmall Bersini"}, {"name": "Domenico Orlando"}, {"name": "Susanne Reffert"}, {"name": "Jesse Woods"}], "featured_authors": [{"name": "Jahmall Bersini"}, {"name": "Domenico Orlando"}, {"name": "Susanne Reffert"}, {"name": "Jesse Woods"}], "author_count": 4}, {"id": "2604.15423", "category": "hep-th", "title": "On the Inverse Problem in Effective Field Theory", "abstract": "We show that the tree-level spectrum of heavy particles can be directly extracted from the Wilson coefficients of the corresponding effective field theory at low energies. This procedure is exact when the number of resonances is finite, and otherwise approximate. Our results are derived from a new class of analytic dispersion relations that depend nonlinearly on the scattering amplitude and apply to an exceedingly broad class of theories and kinematics.", "url": "https://arxiv.org/abs/2604.15423", "type": "理论", "summary": "1. 该工作证明了可通过低能有效场论的威尔逊系数直接提取出重粒子的树级能谱。\n2. 该方法在共振数目有限时是精确的，并基于一类依赖于散射振幅的非线性解析色散关系，适用于广泛的场论与运动学。\n3. 该框架为从低能可观测量系统性地反演高能物理信息提供了理论基础，具有广泛的应用前景。", "summary_source": "deepseek", "authors": [{"name": "Francesco Calisto"}, {"name": "Clifford Cheung"}, {"name": "Grant N. Remmen"}, {"name": "Francesco Sciotti"}, {"name": "Michele Tarquini"}], "featured_authors": [{"name": "Francesco Calisto"}, {"name": "Clifford Cheung"}, {"name": "Grant N. Remmen"}, {"name": "Francesco Sciotti"}, {"name": "Michele Tarquini"}], "author_count": 5}, {"id": "2604.15424", "category": "hep-th", "title": "SymTFT in Superspace", "abstract": "We propose a manifestly supersymmetric formulation of the Symmetry Topological Field Theory (SuSymTFT) for theories with supersymmetry. The SymTFT is a framework that helps organizing symmetries and anomalies of a QFT. Albeit a lot of activity in the field has been devoted to the construction of the SymTFT for the bosonic symmetry structure, the fermionic case has not been analyzed in detail. Here, we consider the most prominent example of theories exhibiting fermionic symmetries, that is supersymmetric models. These are most naturally formulated on supermanifolds, where the supergeometry approach allows for a manifest organization of the symmetries according to their fermionic grading. We provide the general construction of the SuSymTFT as a super-BF theory living in a (n|m)-dimensional supermanifold and check our proposal in two particular examples, the compact and the chiral super-bosons in two dimensions.", "url": "https://arxiv.org/abs/2604.15424", "type": "理论", "summary": "1. 该工作提出了在超空间中对具有超对称性的理论构建显式超对称的对称拓扑场论（SuSymTFT）的框架。\n2. 其核心创新在于利用超流形上的超几何方法，自然地依据费米子分级组织对称性，并将SuSymTFT构建为生活在(n|m)维超流形中的超BF理论。\n3. 通过在二维紧凑与手征超玻色子等具体模型中的验证，该框架为系统研究更广泛超对称场论的对称性与反常问题提供了新的理论基础。", "summary_source": "deepseek", "authors": [{"name": "Federico Ambrosino"}, {"name": "Alessandro Duci"}, {"name": "Pietro Antonio Grassi"}, {"name": "Silvia Penati"}], "featured_authors": [{"name": "Federico Ambrosino"}, {"name": "Alessandro Duci"}, {"name": "Pietro Antonio Grassi"}, {"name": "Silvia Penati"}], "author_count": 4}, {"id": "2604.15429", "category": "hep-th", "title": "Systematic Analytic Regularization in $φ^4$ and Yukawa Theories", "abstract": "We introduce a novel regularization scheme: Systematic Analytic Regularization (SAR). SAR regularizes a theory at the level of the action by analytically continuing the power of the kinetic operator, ensuring that the theory is formally finite before any terms in the Dyson series are evaluated. We demonstrate that SAR fully and self-consistently regularizes $\\varphi^4$ and Yukawa theories at NLO.", "url": "https://arxiv.org/abs/2604.15429", "type": "理论", "summary": "1. 本文提出了系统解析正规化（SAR）这一新方案，并证明其在次领头阶完全自洽地正规化了φ⁴和Yukawa理论。\n2. 该方案通过在作用量层面解析延移动力算符的幂次，确保理论在戴森级数项计算前形式有限，是核心技术创新点。\n3. 这为量子场论中的正规化问题提供了新范式，可能促进更高效微扰计算并扩展至其他场论模型。", "summary_source": "deepseek", "authors": [{"name": "Jarryd Bath"}, {"name": "W. A. Horowitz"}], "featured_authors": [{"name": "Jarryd Bath"}, {"name": "W. A. Horowitz"}], "author_count": 2}, {"id": "2604.15471", "category": "hep-th", "title": "Exact solution of two-dimensional Palatini Gauss-Bonnet theory on a strip", "abstract": "We analyze the two-dimensional Palatini Gauss-Bonnet theory on an infinite strip (product of a finite interval with the infinite line, corresponding to ``time\"). The theory has only boundary degrees of freedom. Its phase space is the cotangent bundle to the group manifold of $SL(2,\\mathbf{R})$, subject to a (first-class) constraint quadratic in the momenta. With the simplest choice of boundary Hamiltonian, namely $H = 0$, the theory is shown to describe geodesics on the group manifold of $SL(2,\\mathbf{R})$, with a ``mass\" determined by the Palatini Gauss-Bonnet coupling constant. Other choices of boundary Hamiltonians compatible with gauge invariance are also possible. The symmetry group contains (left and right) group translations on $SL(2,\\mathbf{R})$. These are ``boundary symmetries\" from the bulk point of view, one copy acting on one end of the interval, the other copy acting on the other end. Comments on the quantum theory are also given.", "url": "https://arxiv.org/abs/2604.15471", "type": "理论", "summary": "1. 该工作精确求解了二维Palatini Gauss-Bonnet理论在无限条形时空（有限区间与无限直线的乘积）上的经典动力学，证明该系统仅包含边界自由度。\n2. 其技术核心在于将相空间构造为SL(2,R)群流形的余切丛并受动量二次型约束，从而在零边界哈密顿量下将动力学简化为该群流形上的测地线运动，其中质量由Gauss-Bonnet耦合常数表征。\n3. 这为理解从体观点出发的边界对称性（左右群平移分别作用于区间两端）、探索其他规范不变边界哈密顿量以及发展量子理论提供了重要启示。", "summary_source": "deepseek", "authors": [{"name": "Máximo Bañados"}, {"name": "Marc Henneaux"}], "featured_authors": [{"name": "Máximo Bañados"}, {"name": "Marc Henneaux"}], "author_count": 2}, {"id": "2604.15496", "category": "hep-th", "title": "Covariant Fracton Electrodynamics in Six Dimensions", "abstract": "We formulate a covariant version of Maxwell-like fracton electrodynamics in six dimensions using a symmetric tensor gauge field with scalar gauge symmetry $\\delta A_{\\mu\\nu}=\\partial_\\mu\\partial_\\nu\\Lambda$. This provides a relativistic setting in which the characteristic fractonic restriction on mobility follows directly from gauge invariance and the allowed coupling to matter. We construct the stress--energy tensor and show that its trace has a universal dimension-dependent structure that becomes a total derivative in $d=6$. In the presence of sources, the theory enforces conservation of charge and dipole moment, capturing the immobility of isolated charges and the mobility of dipolar bound states. This structure can also be viewed as a higher-moment form of generalized global symmetry.", "url": "https://arxiv.org/abs/2604.15496", "type": "理论", "summary": "1. 该工作在六维时空中利用具有标量规范对称性的对称张量规范场，构建了协变的类麦克斯韦分形子电动力学理论。\n2. 理论的关键在于，规范不变性及其与物质的耦合方式直接导致了孤立电荷的不可动性与偶极束缚态的可动性，并给出了应力-能量张量迹的普适维度依赖结构。\n3. 这一框架为将分形子物理理解为广义整体对称性的高阶矩形式，以及探索其与更高形式规范理论的联系提供了明确途径。", "summary_source": "deepseek", "authors": [{"name": "Nicola Maggiore"}], "featured_authors": [{"name": "Nicola Maggiore"}], "author_count": 1}, {"id": "2604.15566", "category": "hep-th", "title": "One-loop effect in the charged 2D black hole near extremality", "abstract": "We study the one-loop correction to the near-extremal quantum entropy of the charged two-dimensional black hole introduced in \\cite{McGuigan:1992}. In target space this background can be understood as arising from the dimensional reduction of a three-dimensional solution of the low-energy string effective action. On the other hand, its worldsheet description is provided by the dimensionally reduced $\\frac{SL(2, \\mathbb{R}) \\times U(1)}{U(1)}$ WZW model. Using the latter formulation, we extract the temperature dependence of the one-loop correction to the near-extremal quantum entropy from the corresponding torus partition function. Based on the nearly-$AdS_2$ structure of the near-extremal near-horizon geometry of this black hole, one might naively expect to recover the usual logarithmic correction associated with the universal Schwarzian sector. Remarkably, the final result deviates from this expectation. In the general case, the one-loop correction we obtain is exponentially suppressed in the low-temperature limit. However, upon fine-tuning the microscopic parameters of the theory, specifically the level of the $\\mathfrak{sl}_k(2,\\mathbb{R)}$ current algebra and the worldsheet coupling constant between $SL(2,\\mathbb{R)}$ and the $U(1)$ boson, the correction scales as $\\sqrt{\\beta}$. In this limit, the target-space partition function is divergent in the extremal regime. We argue that this result provides a worldsheet realization of the black hole/string transition.", "url": "https://arxiv.org/abs/2604.15566", "type": "理论", "summary": "1. 本研究计算了带电二维黑洞在近极值情形下的单圈量子熵修正。\n2. 关键发现是修正项偏离预期的对数形式，在低温下呈指数压低，或在精细调节参数时呈现√β标度。\n3. 该结果为从世界面角度理解黑洞/弦相变提供了具体实现方案。", "summary_
