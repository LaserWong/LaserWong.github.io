he predicted $\\varepsilon^{2}$ rate is confirmed over eight decades, and moderate regularisation eliminates step rejections and reduces constraint drift by more than an order of magnitude at unchanged final fidelity.", "url": "https://arxiv.org/abs/2604.26625", "type": "理论", "summary": "1. 该工作针对等式约束双线性量子控制问题，提出了基于Tikhonov正则化的投影梯度流方法，消除了对启发式步长保护的依赖。\n2. 核心在于用正则化Gram矩阵Γ_ε=Γ+ε²I替换原矩阵，严格证明了连续时间目标单调性、约束漂移O(ε²)界及前向欧拉格式的CFL单调性准则。\n3. 这为条件数高达10⁹–10¹¹的病态量子控制问题提供了可严格保证收敛的数值框架，并在全光贝尔态制备中验证了正则化对约束漂移的显著抑制。", "summary_source": "deepseek", "authors": [{"name": "Tanveer Ahmad"}], "featured_authors": [{"name": "Tanveer Ahmad"}], "author_count": 1}, {"id": "2604.26638", "category": "quant-ph", "title": "Emergence of $π$ from Equatorial Quantum Localization", "abstract": "We present a genuinely non-radial quantum-mechanical route by which $\\pi$ emerges from equatorial localization on the sphere. For the highest-weight branch of spherical harmonics, this localization is captured by a natural geometric rigidity index, whose exact finite-quantum-number value is a Wallis partial product. The mechanism is realized in two settings: the standard rigid rotor and the surface sector of a thin spherical shell, where radial freezing reduces the dynamics to the same angular problem. In the large-quantum-number limit, the probability cloud collapses toward the equator, the rigidity index approaches its classical value, and the Wallis formula is recovered through the correspondence principle. The result shows that Wallis-type structures in quantum mechanics can arise as exact signatures of semiclassical localization encoded by a simple geometric observable.", "url": "https://arxiv.org/abs/2604.26638", "type": "理论", "summary": "1. 该工作提出一种非径向量子力学途径，通过球面赤道局域化使π自然涌现。\n2. 其核心在于定义几何刚性指数精确描述球谐函数最高权重分支的局域化，其有限量子数值为Wallis部分积。\n3. 这揭示了Wallis型结构可作为半经典局域化的精确量子签名，为对应原理与几何可观测量提供了新视角。", "summary_source": "deepseek", "authors": [{"name": "Bin Ye"}, {"name": "Ruitao Chen"}, {"name": "Lei Yin"}], "featured_authors": [{"name": "Bin Ye"}, {"name": "Ruitao Chen"}, {"name": "Lei Yin"}], "author_count": 3}, {"id": "2604.26639", "category": "quant-ph", "title": "The temperature dependent geometric phase", "abstract": "There exists a geometric phase for a quantum state during the adiabatic evolution of the system. If the adiabatic procedure happens between the system and the environment interacting with it similar to Born-Oppenheimer (BO) approximation, we can introduce a temperature into the environment, which can be regarded as in an equilibrium state. Then a temperature-dependent geometric phase can be obtained for the system, which originates from the Abelian gauge potential induced by the BO approximation. This gauge potential contributes to the effective potential of the system, which is temperature dependent, too. Finally, we demonstrate them using an example of H_2^+ ion system.", "url": "https://arxiv.org/abs/2604.26639", "type": "理论", "summary": "1. 该工作研究了系统与环境绝热相互作用下温度依赖的几何相位，源于玻恩-奥本海默近似。\n2. 其核心在于环境平衡态温度引入系统，通过阿贝尔规范势产生温度依赖的几何相位与有效势。\n3. 这为理解热环境中量子系统的几何效应提供了理论框架，并以H₂⁺离子体系示例验证。", "summary_source": "deepseek", "authors": [{"name": "Zheng-Chuan Wang"}], "featured_authors": [{"name": "Zheng-Chuan Wang"}], "author_count": 1}, {"id": "2604.26642", "category": "quant-ph", "title": "Least constraint approach to non-relativistic quantum mechanics", "abstract": "We formulate a variational principle for non-relativistic quantum mechanics inspired by Gauss's principle of least constraint. We define a quantum constraint functional as the probability-weighted square deviation between the actual motion and the unconstrained motion that would arise from external forces alone. In this functional, the quantum potential plays the role of an intrinsic constraint that modifies the acceleration. Minimizing this quantum constraint functional with respect to the acceleration field yields the quantum Euler equations, which together with the continuity equation are equivalent to the Schrödinger equation. The principle is instantaneous and provides a differential characterization of quantum evolution. We demonstrate that this formulation is not a mere rewriting of existing dynamics: it provides a unified and technically economical treatment of geometric constraints and velocity-dependent dissipative forces, neither of which admits a straightforward global variational formulation. Potential applications to a broad range of quantum phenomena are also indicated.", "url": "https://arxiv.org/abs/2604.26642", "type": "理论+数值", "summary": "1. 该工作基于高斯最小约束原理，为量子力学建立了一个瞬时变分原理，通过最小化概率加权加速度偏离泛函导出量子欧拉方程。\n2. 其核心在于将量子势作为内禀约束的机制，从而统一且经济地处理几何约束与速度依赖耗散力，这些均无法直接纳入全局变分框架。\n3. 该微分形式的变分原理为涉及非完整约束或耗散的量子系统提供了清晰的理论路径，并有望推广至更多量子现象。", "summary_source": "deepseek", "authors": [{"name": "Ning Liu"}], "featured_authors": [{"name": "Ning Liu"}], "author_count": 1}, {"id": "2604.26792", "category": "quant-ph", "title": "Fault-Tolerant Resource Comparison of Qudit and Qubit Encodings for Diagonal Quadratic Operators", "abstract": "Finite local Hilbert-space truncations arise naturally in quantum simulations of lattice field theories and motivate qudit encodings, but their fault-tolerant advantage over qubit encodings remains unclear. We compare the non-Clifford cost of implementing quadratic diagonal evolutions, exemplified by $U=e^{-it\\phi_x^2}$ in a uniform field-amplitude discretization of a real scalar field, using either one logical $d$-level qudit or $n_b=\\lceil \\log_2 d\\rceil$ logical qubits. We analyze two standard settings: product-formula simulation and LCU/block encoding, taking the resource metric to be the number of non-Clifford gates after synthesis into a discrete logical gate set. Because tight synthesis bounds for general single-qudit rotations are not known, we express the qudit constructions in terms of embedded two-level $SU(2)$ rotations and derive explicit finite-$d$ break-even conditions for their synthesis cost; these serve as compiler targets for when qudit encodings can outperform the qubit baseline. Within the constructive models studied here, product-formula implementations would require an exponentially stronger per-primitive synthesis advantage for qudits to win asymptotically, while in the LCU setting the qubit encoding is asymptotically cheaper in $d$. Nevertheless, the finite-$d$ threshold analysis identifies low dimensional regions in which qudits can yield meaningful constant-factor savings, particularly for LCU-based implementations. As a secondary analysis of the LCU construction, we use an idealized negligible-overhead qubit-qudit code-switching model to give an absolute $T$-count comparison, and reinterpret the savings as an allowable per-switch overhead budget.", "url": "https://arxiv.org/abs/2604.26792", "type": "理论+数值", "summary": "1. 该工作比较了qudit与qubit编码在容错实现二次对角演化时的非Clifford门资源消耗。\n2. 其技术要点在于导出有限维量子门合成的盈亏平衡条件，揭示LCU设置下qubit渐近更优且qudit仅在低维区域有常数因子节省。\n3. 这为编译器和实验设计提供了当采用qudit可节省非Clifford资源的参数区及允许码切换开销的定量参考。", "summary_source": "deepseek", "authors": [{"name": "Samuel Godwood"}, {"name": "Doğa Murat Kürkçüoğlu"}, {"name": "Gabriel N. Perdue"}, {"name": "Marina Maneyro"}, {"name": "Alessandro Roggero"}], "featured_authors": [{"name": "Samuel Godwood"}, {"name": "Doğa Murat Kürkçüoğlu"}, {"name": "Gabriel N. Perdue"}, {"name": "Marina Maneyro"}, {"name": "Alessandro Roggero"}], "author_count": 5}, {"id": "2604.26834", "category": "quant-ph", "title": "Quantum Feature Selection with Higher-Order Binary Optimization on Trapped-Ion Hardware", "abstract": "We present a quantum feature-selection framework based on a higher-order unconstrained binary optimization (HUBO) formulation that explicitly incorporates multivariate dependencies beyond standard quadratic encodings. In contrast to QUBO-based approaches, the proposed model includes one-, two-, and three-body interaction terms derived from mutual-information measures, enabling the objective function to capture feature relevance, pairwise redundancy, and higher-order statistical structure within a unified energy model. To suppress trivial all-selected solutions, we further include structured linear penalties that promote sparsity while preserving informative variables. The resulting HUBO instances are optimized with digitized counterdiabatic quantum optimization on IonQ Forte and compared against noiseless quantum simulation as well as two classical dimensionality-reduction baselines: SelectKBest based on mutual information and principal component analysis (PCA). We evaluate the proposed workflow on two benchmark classification datasets, namely the Gallstone dataset and the Spambase dataset, and analyze both predictive performance and selected-subset structure. The results show good qualitative agreement between hardware executions and noiseless simulations, supporting the feasibility of implementing higher-order feature-selection Hamiltonians on current trapped-ion processors. In addition, the quantum approach yields competitive classification performance while producing compact and informative feature subsets, highlighting the potential of higher-order quantum optimization for machine-learning preprocessing tasks.", "url": "https://arxiv.org/abs/2604.26834", "type": "理论+数值", "summary": "1. 该工作提出了基于高阶无约束二元优化（HUBO）的量子特征选择框架，并在IonQ Forte离子阱硬件上采用数字化反绝热量子优化求解，与无噪声模拟及经典降维方法对比，在Gallstone和Spambase两套基准数据集上评估。\n2. 其核心卖点在于通过一、二、三体互信息项构建包含特征相关性、冗余及高阶统计结构的统一能量模型，并引入线性惩罚抑制全选解，硬件执行结果与无噪声模拟定性一致，分类性能优于SelectKBest与主成分分析等经典基线。\n3. 这验证了在现有离子阱处理器上实现高阶特征选择哈密顿量的可行性，并凸显了高阶量子优化在机器学习预处理中获取紧凑且高信息量特征子集的潜力。", "summary_source": "deepseek", "authors": [{"name": "Carlos Flores-Garrigós"}, {"name": "Anton Simen"}, {"name": "Qi Zhang"}, {"name": "Enrique Solano"}, {"name": "Narendra N. Hegade"}, {"name": "Sayonee Ray"}, {"name": "Claudio Girotto"}, {"name": "Jason Iaconis"}, {"name": "Martin Roetteler"}], "featured_authors": [{"name": "Carlos Flores-Garrigós"}, {"name": "Anton Simen"}, {"name": "Qi Zhang"}, {"name": "Claudio Girotto"}, {"name": "Jason Iaconis"}, {"name": "Martin Roetteler"}], "author_count": 9}, {"id": "2604.26861", "category": "quant-ph", "title": "Protein folding on a 64 qubit trapped-ion hardware via counterdiabatic quantum optimization", "abstract": "We report the largest trapped-ion hardware demonstration of lattice protein-folding optimization to date, using bias-field digitized counterdiabatic quantum optimization (BF-DCQO) on a fully connected 64-qubit Barium development system similar to the forthcoming IonQ Tempo line. Six peptide sequences with 14-16 amino-acid residues are encoded using a coarse-grained tetrahedral lattice model, yielding higher-order spin-glass Hamiltonians with long-range interactions involving up to five-body terms and mapped to 46-61 qubits. The resulting instances are demanding for near-term quantum hardware because low-energy configurations must satisfy backbone-geometry constraints while optimizing dense residue-contact interactions. BF-DCQO uses a non-variational bias-feedback mechanism, where low-energy samples from each round define longitudinal fields that guide subsequent quantum evolutions. Across the studied instances, BF-DCQO shifts raw sampled energy distributions toward lower energies than uniform random sampling, with the strongest improvements appearing in residue-contact variables. To preserve this signal, we introduce a consensus-based post-processing pipeline that combines quantum-learned contact information with feasible backbone geometries. The resulting hybrid workflow reaches the classical reference energy in multiple instances and improves over the corresponding random-seeded pipeline. These results show that BF-DCQO can generate structured samples for dense protein-folding Hamiltonians at previously unexplored trapped-ion scales.", "url": "https://arxiv.org/abs/2604.26861", "type": "理论+数值", "summary": "1. 该工作利用64量子比特陷阱离子硬件上的偏置场数字化反绝热量子优化，实现了迄今最大规模的晶格蛋白质折叠优化演示。\n2. 其技术核心在于非变分的偏置反馈机制与一致性后处理管线相结合，从量子采样中提取接触信息并重构可行主链构型。\n3. 这为在近中期量子处理器上处理含多体相互作用的高阶自旋玻璃哈密顿量提供了可行的混合计算范式。", "summary_source": "deepseek", "authors": [{"name": "Alejandro Gomez Cadavid"}, {"name": "Pavle Nikačević"}, {"name": "Pranav Chandarana"}, {"name": "Sebastián V. Romero"}, {"name": "Enrique Solano"}, {"name": "Narendra N. Hegade"}, {"name": "Miguel Angel Lopez-Ruiz"}, {"name": "Claudio Girotto"}, {"name": "Hanna Linn"}, {"name": "Hakan Doga"}, {"name": "Evgeny Epifanovsky"}, {"name": "Panagiotis Kl. Barkoutsos"}, {"name": "Ananth Kaushik"}, {"name": "Martin Roetteler"}], "featured_authors": [{"name": "Alejandro Gomez Cadavid"}, {"name": "Pavle Nikačević"}, {"name": "Pranav Chandarana"}, {"name": "Panagiotis Kl. Barkoutsos"}, {"name": "Ananth Kaushik"}, {"name": "Martin Roetteler"}], "author_count": 14}, {"id": "2604.26878", "category": "quant-ph", "title": "A Gaussian asymmetry measure", "abstract": "The study of Entanglement Asymmetry has emerged in recent years as a powerful tool to characterise the symmetry properties of quantum states in relation to a given charge operator through the lens of entanglement. While extremely powerful and general, the standard definition of asymmetry introduces significant non-Gaussian features in free-fermionic systems, leading to certain analytical limitations. In this work, we introduce an asymmetry measure that remains strictly within the Gaussian manifold and analyse its properties. In particular, we show that it quantifies the minimal distance between a Gaussian state and the manifold of symmetric Gaussian states. We further demonstrate that this measure captures the established dynamical signatures of entanglement asymmetry, such as the Mpemba effect, symmetry restoration, and the lack thereof. The Gaussian structure allows these novel asymmetry measures to be computed exactly using correlation matrix techniques, and to be described asymptotically through the quasiparticle picture. We also comment on the possibility of using charge fluctuations to characterise the asymmetry of a Gaussian state.", "url": "https://arxiv.org/abs/2604.26878", "type": "理论+数值", "summary": "1. 该工作引入一种严格定义于高斯流形内的不对称性度量，以规避标准纠缠不对称性在自由费米子系统中的非高斯缺陷。\n2. 其卖点在于该度量可通过关联矩阵精确计算，并借助准粒子图像进行渐近描述，且能捕获Mpemba效应等动力学特征。\n3. 这为自由费米系统中对称性破缺动力学的可解析研究提供了框架，并暗示了利用电荷涨落表征高斯态不对称性的新途径。", "summary_source": "deepseek", "authors": [{"name": "Riccardo Travaglino"}, {"name": "Pasquale Calabrese"}], "featured_authors": [{"name": "Riccardo Travaglino"}, {"name": "Pasquale Calabrese"}], "author_count": 2}, {"id": "2604.26900", "category": "quant-ph", "title": "Strict Hierarchy for Quantum Channel Certification to Unitary", "abstract": "We consider the problem of quantum channel certification to unitary, where one is given access to an unknown $d$-dimensional channel $\\mathcal{E}$, and wants to test whether $\\mathcal{E}$ is equal to a target unitary channel or is $\\varepsilon$-far from it in the diamond norm. We present optimal quantum algorithms for this problem, settling the query complexities in three access models with increasing power. Specifically, we show that: (i) $\\Theta(d/\\varepsilon^2)$ queries suffice for incoherent access model, matching the lower bound due to Fawzi, Flammarion, Garivier, and Oufkir (COLT 2023). (ii) $\\Theta(d/\\varepsilon)$ queries suffice for coherent access model, matching the lower bound due to Regev and Schiff (ICALP 2008). (iii) $\\Theta(\\sqrt{d}/\\varepsilon)$ queries suffice for source-code access model, matching the lower bound due to Jeon and Oh (npj Quantum Inf. 2026). This demonstrates a strict hierarchy of complexities for quantum channel certification to unitary across various access models.", "url": "https://arxiv.org/abs/2604.26900", "type": "理论+数值", "summary": "1. 该工作针对量子信道认证至酉信道问题，在非相干、相干和源编码三种访问模型下分别给出了最优量子算法并严格确定了查询复杂度层级。\n2. 主要技术贡献在于证明了查询复杂度从Θ(d/ε²)到Θ(d/ε)再到Θ(√d/ε)的递降层级，且每个复杂度均匹配已知下界，揭示了访问能力增强带来的根本性提升。\n3. 这一结果为设计不同实验条件下的量子设备认证协议提供了理论最优基准，并启发了对量子信道测试中信息获取与资源权衡的深入理解。", "summary_source": "deepseek", "authors": [{"name": "Kean Chen"}, {"name": "Qisheng Wang"}, {"name": "Zhicheng Zhang"}], "featured_authors": [{"name": "Kean Chen"}, {"name": "Qisheng Wang"}, {"name": "Zhicheng Zhang"}], "author_count": 3}, {"id": "2604.26921", "category": "quant-ph", "title": "En Route to a Standard QMA1 vs. QCMA Oracle Separation", "abstract": "We study the power of quantum witnesses under perfect completeness. We construct a classical oracle relative to which a language lies in $\\mathsf{QMA}_1$ but not in $\\mathsf{QCMA}$ when the $\\mathsf{QCMA}$ verifier is only allowed polynomially many adaptive rounds and exponentially many parallel queries per round. Additionally, we derandomize the permutation-oracle separation of Fefferman and Kimmel, obtaining an in-place oracle separation between $\\mathsf{QMA}_1$ and $\\mathsf{QCMA}$. Furthermore, we focus on $\\mathsf{QCMA}$ and $\\mathsf{QMA}$ with an exponentially small gap, where we show a separation assuming the gap is fixed, but not when it may be arbitrarily small. Finally, we derive consequences for approximate ground-state preparation from sparse Hamiltonian oracle access, including a bounded-adaptivity frustration-free variant.", "url": "https://arxiv.org/abs/2604.26921", "type": "理论", "summary": "1. 该工作通过构造经典预言机，在完美完备性下实现了语言类QMA₁与受限自适应QCMA的分离，并去随机化得到原位预言机分离。\n2. 其核心卖点在于揭示多项式自适应轮次与并行查询限制下量子验证能力的本质差异，以及固定间隙临界分离而任意小间隙不分离的精细结构。\n3. 这为量子证人复杂度谱系分类与稀疏哈密顿量近似基态制备的复杂度下界提供了严谨约束，尤其指向有界自适应无挫败变体的新范式。", "summary_source": "deepseek", "authors": [{"name": "David Miloschewsky"}, {"name": "Supartha Podder"}, {"name": "Dorian Rudolph"}], "featured_authors": [{"name": "David Miloschewsky"}, {"name": "Supartha Podder"}, {"name": "Dorian Rudolph"}], "author_count": 3}, {"id": "2604.26927", "category": "quant-ph", "title": "The most discriminable quantum states in the multicopy regime", "abstract": "This work investigates which sets of quantum states give rise to the highest achievable success probability in minimum-error state discrimination if multiple copies of the unknown state are given. Specifically, we consider uniformly distributed ensembles of the form $\\left\\{\\frac{1}{N},\\rho_i^{\\otimes k}\\right\\}_{i=1}^N$, where $N$ states in dimension $d$ are provided in $k$ identical copies, and derive universal limits in this scenario. For pure state ensembles, we prove that whenever $N$ is large enough to support a state $k$-design, these designs will exactly give rise to the maximally discriminable sets. We further show that when $N$ exceeds the size required for a $k$-design, mixed states can outperform all pure state ensembles. We also analyse the analogue classical discrimination problems, in which states are replaced by probability distributions. We recognise that the problem of most discriminable classical states in the multi-copy regime is in one-to-one correspondence to the concept of the multiplicative Bayes capacity of independent uses of classical channels, a concept that emerges naturally in the context of classical information leakage. This connection allows us to completely solve the classical analogue of our problem when $N\\geq \\binom{d + k - 1}{k}$, and to prove that quantum systems offer a quadratic advantage (in number of copies $k$) over classical ones. Curiously, we also show that this quantum advantage is strongly reduced when one is restricted to real quantum states. Finally, we introduce computational techniques to find sets of most discriminable ensembles, and to obtain rigorous universal upper bounds on the maximal success probability for multi-copy state discrimination in cases that are analytically intractable.", "url": "https://arxiv.org/abs/2604.26927", "type": "理论", "summary": "1. 该工作研究了在多副本情形下，哪些均匀分布量子态集合能实现最小错误态区分的最高成功概率。\n2. 核心发现是纯态系综中态k-设计恰为最大可区分集合，混合态在N超过设计所需时超越纯态，且量子系统在副本数上呈现二次经典优势，而实量子态下此优势大幅减弱。\n3. 通过建立与经典乘法贝叶斯容量的一一对应，完全求解了经典类比问题，为多副本态区分提供了通用上界与新计算框架。", "summary_source": "deepseek", "authors": [{"name": "Maria Kvashchuk"}, {"name": "Polina Chernyshova"}, {"name": "Lucas E. A. Porto"}, {"name": "Ties-A. Ohst"}, {"name": "Lucas B. Vieira"}, {"name": "Marco Túlio Quintino"}], "featured_authors": [{"name": "Maria Kvashchuk"}, {"name": "Polina Chernyshova"}, {"name": "Lucas E. A. Porto"}, {"name": "Ties-A. Ohst"}, {"name": "Lucas B. Vieira"}, {"name": "Marco Túlio Quintino"}], "author_count": 6}, {"id": "2604.26945", "category": "quant-ph", "title": "Simulating dynamics of RLC circuits with a quantum differential-algebraic equations solver", "abstract": "We introduce a quantum algorithm for simulating the dynamics of electrical circuits consisting of resistors, inductors and capacitors (aka RLC circuits) along with power sources. Given oracle access to the connectivity of the circuit and values of the electrical elements, our algorithm prepares a quantum state that encodes voltages and current values either at a specified time or the history of their evolution over a time-interval. For an RLC circuit with $N$ components, our algorithm runs in time $\\textsf{polylog}(N)$ under mild assumptions on the connectivity of the circuit and values of its components. This provides an exponential speed-up over classical algorithms that take $\\textsf{poly}(N)$ time in the worst-case. Our algorithm can be used to estimate energy across a set of components or dissipated power in $\\textsf{polylog}(N)$ time, a problem that we prove is BQP-hard and therefore unlikely to be efficiently solved by classical algorithms. The main challenge in simulating the dynamics of RLC circuits is that they are governed by differential-algebraic equations (DAEs), a coupled system of differential equations with hidden algebraic constraints. Consequentially, existing quantum algorithms for ordinary differential equations cannot be directly utilized. We therefore develop a quantum DAE solver for simulating the time-evolution of linear DAEs. For RLC circuits, we employ modified nodal analysis to create a system of DAEs compatible with our quantum algorithm. We establish BQP-hardness by demonstrating that any network of classical harmonic oscillators, for which an energy-estimation problem is known to be BQP-hard, is a special case of an LC circuit. Our work gives theoretical evidence of quantum advantage in simulating RLC circuits and we expect that our quantum DAE solver will find broader use in the simulation of dynamical systems.", "url": "https://arxiv.org/abs/2604.26945", "type": "理论+数值", "summary": "1. 该工作提出一种量子算法，通过微分代数方程求解器模拟RLC电路（电阻、电感、电容）的动态演化，在polylog(N)时间内实现电压电流状态的编码与能量估计。\n2. 其核心卖点在于采用改进节点分析将电路方程转化为量子DAE系统，克服了传统量子ODE方法无法处理隐藏代数约束的困难，并证明能量估计问题为BQP-hard。\n3. 这为电路模拟的量子优势提供了严格理论证据，且所发展的量子DAE求解器有望推广至更广泛的线性动力学系统模拟。", "summary_source": "deepseek", "authors": [{"name": "Arkopal Dutt"}, {"name": "Anirban Chowdhury"}, {"name": "Kristan Temme"}, {"name": "Hari Krovi"}], "featured_authors": [{"name": "Arkopal Dutt"}, {"name": "Anirban Chowdhury"}, {"name": "Kristan Temme"}, {"name": "Hari Krovi"}], "author_count": 4}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>${paper.summary_source === "deepseek" ? "DeepSeek three-sentence PRL summary" : (paper.summary_source === "local-fallback" ? "Local three-sentence fallback" : (paper.summary_source === "translation" ? "Chinese abstract translation" : "Chinese placeholder fallback"))}</span><a href="${safeUrl}" target="_blank" rel="noreferrer">Open arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
</body>
</html>
