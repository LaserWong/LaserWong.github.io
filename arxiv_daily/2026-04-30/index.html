论中正交与辛规范群基本角构型的超对称quarter-indices，并给出Y型结的精确闭式表达式。\n2. 通过Gustafson型积分公式与Higgsing方法，证明了偶构型间quarter-indices的相等，为角构型S-对偶性提供证据。\n3. 特殊极限下指数可解释为BCD型W-代数与李超代数osp(1|2N)的真空特征，揭示了角顶点算子代数结构。", "summary_source": "deepseek", "authors": [{"name": "Yasuyuki Hatsuda"}, {"name": "Tadashi Okazaki"}], "featured_authors": [{"name": "Yasuyuki Hatsuda"}, {"name": "Tadashi Okazaki"}], "author_count": 2}, {"id": "2604.26421", "category": "hep-th", "title": "On the simplicity of de Sitter correlators", "abstract": "Motivated by recent evidence that equal-time correlators can be simpler than the corresponding wavefunction coefficients, we study de Sitter correlators in conformally coupled $\\phi^3$ theory directly. By inverting the momentum-space dressing rules, we derive a time integral representation for generic graphs and show that its natural building blocks are flat space correlators of fields and conjugate momenta. Among other things, this representation gives two useful recursive structures, one obtained by collapsing leaves and one by fusing lower-point graphs. In this representation several simplifications also become immediate. Graphs with an odd number of conjugate momentum insertions vanish, explaining the weight drop of odd-point correlators, melonic insertions collapse to lower complexity graphs and the leading behavior near total and partial-energy singularities is manifest, closely paralleling the flat space story. We then take a first step beyond the integrand and study integrated answers. For tree level families, in particular chains and stars, we find that the symbol alphabet of the correlator is smaller than that of the corresponding wavefunction, with the missing letters admitting a natural interpretation in terms of tubing data. These results support a correlator-first viewpoint for de Sitter observables: part of their simplicity appears to be intrinsic to the correlator itself, rather than inherited indirectly from the wavefunction.", "url": "https://arxiv.org/abs/2604.26421", "type": "理论", "summary": "1. 该工作通过逆转动量空间配位规则，直接研究共形耦合ϕ³理论中的德西特等时关联函数，建立了其时间积分表示。\n2. 其技术亮点在于揭示关联函数的基本构建单元为平空间场与共轭动量的关联函数，并由此导出两种递归结构，以及奇点行为与平空间情形的显式平行对应。\n3. 这支持德西特观测量中关联器优先的观点，部分简单性内禀于关联函数本身，而非继承自波函数，为后续解析与数值研究提供了明确启发。", "summary_source": "deepseek", "authors": [{"name": "Chandramouli Chowdhury"}, {"name": "Song He"}, {"name": "Yong-Xiang Su"}, {"name": "Dongyu Yang"}], "featured_authors": [{"name": "Chandramouli Chowdhury"}, {"name": "Song He"}, {"name": "Yong-Xiang Su"}, {"name": "Dongyu Yang"}], "author_count": 4}, {"id": "2604.26452", "category": "hep-th", "title": "Integrable Deformations of the Breitenlohner-Maison Model from 4d Chern-Simons Theory", "abstract": "We derive integrable deformations of the 2d Breitenlohner-Maison (BM) sigma model that describes the stationary, axisymmetric sector of 4d general relativity, as well as higher-rank generalisations thereof, using the framework of 4d Chern-Simons theory. In particular, we consider deformations of the boundary conditions and action of the 4d Cole-Weck model, which lead to deformations of the BM model associated with solutions to the homogeneous and inhomogeneous classical Yang-Baxter equations respectively.", "url": "https://arxiv.org/abs/2604.26452", "type": "理论", "summary": "1. 该文利用四维Chern-Simons理论框架，导出了描述四维广义相对论稳态轴对称扇区的二维Breitenlohner-Maison sigma模型及其高秩推广的可积变形。\n2. 其技术核心在于通过修改四维Cole-Weck模型的边界条件与作用量，分别获得与齐次及非齐次经典Yang-Baxter方程解对应的可积变形构造。\n3. 这为系统生成广义相对论中可积子系统的变形族提供了统一场论方案，并可启发其他维度下类似对称性驱动的可积构造。", "summary_source": "deepseek", "authors": [{"name": "Meer Ashwinkumar"}, {"name": "Matthias Blau"}], "featured_authors": [{"name": "Meer Ashwinkumar"}, {"name": "Matthias Blau"}], "author_count": 2}, {"id": "2604.26493", "category": "hep-th", "title": "Monodromy, Logarithmic Sectors, and Two-Point Functions in Critical Topologically Massive Gravity", "abstract": "We investigate the structure of logarithmic modes in critical topologically massive gravity (CTMG) at the chiral point $\\mu \\ell=1$ from the perspective of analytic continuation and monodromy. Starting from the degeneration of massive and left-moving graviton modes, we construct the logarithmic mode as a derivative in parameter space and show that it acquires a natural multivalued structure upon complexification of the radial coordinate. We demonstrate that this multivaluedness induces a nontrivial monodromy action on the space of linearized solutions, under which the left-moving and logarithmic modes form an indecomposable (Jordan block) representation. This monodromy is unipotent and provides a bulk realization of the logarithmic structure typically associated with logarithmic conformal field theories. We further show that the monodromy representation alone is sufficiently constraining to determine the characteristic logarithmic form and mixing structure of two-point functions, up to normalization, without assuming logarithmic conformal field theory data a priori. These results suggest a geometric interpretation in which logarithmic modes act as sources of branchlike behavior in the bulk, analogous to twist fields that generate monodromy. While this perspective is compatible with proposed connections to branched coverings, Hurwitz theory, and integrable hierarchies, establishing a precise correspondence is left for future work.", "url": "https://arxiv.org/abs/2604.26493", "type": "理论", "summary": "1. 该工作从解析延拓与单值性视角出发，研究了临界拓扑质量引力在手性点μℓ=1处有质量模与左行模的退化，构造了对数模的多值结构并证明其与左行模形成不可分解若尔当块表示。\n2. 其核心卖点在于揭示仅凭该幂单值性表示即可确定两点函数的特征对数形式和混合结构，且无需先验假设对数共形场论数据即可唯一得到。\n3. 这为对数模在体中的分支状行为提供了几何解释，将其类比为产生单值性的扭场，并暗示与分支覆盖、可积层次等的联系，为建立精确体边对应关系提供方向。", "summary_source": "deepseek", "authors": [{"name": "Yannick Mvondo-She"}], "featured_authors": [{"name": "Yannick Mvondo-She"}], "author_count": 1}, {"id": "2604.26538", "category": "hep-th", "title": "Fractional Cosmic String Loops In Expanding Universe", "abstract": "We study the dynamics of circular cosmic string loops in a spatially flat Friedmann Lemaître Robertson Walker universe within a fractional Polyakov framework that incorporates nonlocal memory effects. Allowing both the loop radius and polar angle to evolve, we obtain a coupled non-autonomous system governed by string tension, cosmological expansion, and an emergent centrifugal contribution. We show that angular dynamics plays a crucial role in determining the loop evolution. In contrast to standard scenarios where loops collapse, we identify a class of solutions exhibiting sustained expansion driven by dynamically generated angular motion. The system also displays nonlinear behavior with signatures of chaos, with the onset of chaotic dynamics closely correlated with expanding solutions. Our results demonstrate that fractional memory effects and angular degrees of freedom qualitatively modify cosmic string loop dynamics, providing new mechanisms for stability in cosmological backgrounds.", "url": "https://arxiv.org/abs/2604.26538", "type": "理论", "summary": "1. 该文在分数阶Polyakov框架下研究膨胀宇宙中圆形宇宙弦环的动力学，考虑半径与极角耦合演化的非自治系统。\n2. 其核心发现是角动力学驱动弦环持续膨胀而非坍缩，且分数阶记忆效应与非线性效应可导致混沌行为。\n3. 这揭示了非局域记忆和角自由度对宇宙弦稳定性的关键作用，为宇宙学背景下的弦动力学提供了新机制。", "summary_source": "deepseek", "authors": [{"name": "Pankaj Chaturvedi"}, {"name": "Bikram Nath"}], "featured_authors": [{"name": "Pankaj Chaturvedi"}, {"name": "Bikram Nath"}], "author_count": 2}, {"id": "2604.26544", "category": "hep-th", "title": "On the integrability of root-Kerr probe dynamics", "abstract": "In the background of a Kerr-Newman black hole, the motion of a scalar particle is integrable by virtue of an extra conserved charge known as Carter charge. When the particle is endowed with spin, it is known that another conserved charge, the Rüdiger charge, maintains the integrability at least at low orders in the spin magnitude. We explore the extent of this integrability in a simpler model where both the source and the probe are root-Kerr particles, the non-gravitating limit of the Kerr-Newman black hole. At the leading order in the probe charge, the integrability holds to all orders in the spin magnitude if the interaction vertices of the probe are dictated by the Newman-Janis shift. At the second order in the probe charge, the integrability can be extended to the spin-squared order but begins to fail at the spin-cubic order. An argument based on asymptotic conservation suggests that it is impossible to restore the conservation at the spin-cubic order by a further deformation of the probe action. We compare our results with related observations for Kerr black holes with gravitational interactions.", "url": "https://arxiv.org/abs/2604.26544", "type": "理论", "summary": "1. 该工作探索了在Kerr-Newman背景中，由Newman-Janis平移描述的root-Kerr粒子探针动力学的可积性，涉及自旋高阶效应。\n2. 发现探针相互作用顶点由Newman-Janis平移决定时，可积性能在探针荷一阶下保持至所有自旋阶，但在二阶下于自旋立方阶破坏，且无法通过变形恢复。\n3. 这为理解自旋粒子在弯曲时空中的可积性机制提供了严格约束，并暗示与Kerr黑洞引力相互作用中相关观察的深层联系。", "summary_source": "deepseek", "authors": [{"name": "Sungsoo Kim"}, {"name": "Sangmin Lee"}], "featured_authors": [{"name": "Sungsoo Kim"}, {"name": "Sangmin Lee"}], "author_count": 2}, {"id": "2604.26600", "category": "hep-th", "title": "Entanglement Revivals and Scrambling for Evaporating Black Holes", "abstract": "We investigate the spreading of entanglement, and entanglement memory effects, in two dimensional conformal field theory (CFT) propagating on evaporating black hole backgrounds. Memory effects leading to late-time spikes in mutual information for widely separated intervals are well known in CFTs admitting a quasiparticle description. In this work we examine the effect of black hole scrambling on late time mutual information spikes for disjoint intervals in free fermion CFT prepared in a thermofield double state. Late-time entanglement revival is driven by island-induced purification of modes in the union of the intervals. We show across two distinct 2d gravity models, Jackiw-Teitelboim (JT) gravity and the Russo-Susskind-Thorlacius (RST) model, that parametrically dialing up black hole scrambling time smooths out and suppresses entanglement spikes until they disappear at a critical scale, interpolating between free quasiparticle and maximal scrambling pictures. At the critical point, the interval lengths are exponential in black hole scrambling time. We further find a very closely related effect manifest as an entanglement dip for a single interval in a single-sided evaporating RST black hole.", "url": "https://arxiv.org/abs/2604.26600", "type": "理论", "summary": "1. 该工作研究了蒸发黑洞背景上二维共形场论中纠缠复兴与黑洞scrambling的相互作用。\n2. 其卖点在于揭示通过参数化调节黑洞scrambling时间可平滑并抑制纠缠尖峰，直至在临界尺度消失，该尺度正比于scrambling时间的指数。\n3. 这为统一自由准粒子与最大scrambling图像下的纠缠动力学提供了桥梁，并暗示了岛致纯化在纠缠记忆效应中的关键作用。", "summary_source": "deepseek", "authors": [{"name": "Levy B. N. Batista"}, {"name": "Nicolò Bragagnolo"}, {"name": "Rhys Holmes"}, {"name": "S. Prem Kumar"}], "featured_authors": [{"name": "Levy B. N. Batista"}, {"name": "Nicolò Bragagnolo"}, {"name": "Rhys Holmes"}, {"name": "S. Prem Kumar"}], "author_count": 4}, {"id": "2604.26662", "category": "hep-th", "title": "Complex Geodesics in the Nariai Geometry", "abstract": "We study two-point correlation functions of heavy scalar fields in the Nariai geometry. Utilizing the heat kernel formalism, we obtain this result from a geodesic approximation to the two-point function on a product of spheres. By analytically continuing one of the spheres, we obtain the correlation function in the Nariai geometry. This result involves a sum over complex geodesics, extending previous results in pure de Sitter space. We emphasize the important role of the phase of each geodesic contribution, which needs to be taken into account to avoid spurious singularities in the correlator.", "url": "https://arxiv.org/abs/2604.26662", "type": "理论", "summary": "1. 该工作利用热核形式与测地线近似，研究Nariai几何中重标量场的两点关联函数，并通过球面的解析延拓得出结果。\n2. 其技术核心在于关联函数需表示为复测地线贡献之和，且必须精确计入每条测地线的相位，以消除关联函数中的假奇异点。\n3. 这为弯曲时空中关联函数的计算提供了复几何方法，并启示相位信息在避免奇异性中的关键作用，可推广至其他双曲或稳态时空。", "summary_source": "deepseek", "authors": [{"name": "Lars Aalsma"}, {"name": "Mir Mehedi Faruk"}], "featured_authors": [{"name": "Lars Aalsma"}, {"name": "Mir Mehedi Faruk"}], "author_count": 2}, {"id": "2604.26755", "category": "hep-th", "title": "Scale-separated vacua with extended supersymmetry", "abstract": "We propose the first examples of scale-separated vacua with extended supersymmetry. They arise as circle compactifications of four-dimensional vacua of massive type IIA supergravity with scale separation, upon introducing additional fluxes and sources. We provide both the ten-dimensional solutions and the three-dimensional effective descriptions in terms of Kähler potential and superpotential. The conformal dimensions of the putative dual two-dimensional field theory appear not to be integers. The superpotential for the additional fluxes of one of our models was guessed by ChatGPT and, to the best of our knowledge, it does not appear in existing literature. Should these vacua be solutions of string theory, they would allow to address the open problem of scale separation from the vantage point of extended supersymmetry.", "url": "https://arxiv.org/abs/2604.26755", "type": "理论", "summary": "1. 本文首次提出具有扩展超对称的尺度分离真空，源于带额外通量与源的大质量IIA型超引力四维真空的圆紧化。\n2. 卖点在于同时给出十维解及三维Kähler势与超势有效描述，其中一类模型的超势由ChatGPT首次猜测。\n3. 若这些真空确为弦论解，将为从扩展超对称视角解决尺度分离问题提供新途径。", "summary_source": "deepseek", "authors": [{"name": "Niccolò Cribiori"}, {"name": "Fotis Farakos"}, {"name": "Alexandros Zarafonitis"}], "featured_authors": [{"name": "Niccolò Cribiori"}, {"name": "Fotis Farakos"}, {"name": "Alexandros Zarafonitis"}], "author_count": 3}, {"id": "2604.26786", "category": "hep-th", "title": "Probing black holes with equivariant localization", "abstract": "We introduce equivariant localization as a method for computing the action of probe branes in supergravity backgrounds. We apply it to supersymmetric probe D3-branes in type IIB supersymmetric spacetimes obtained by uplifting the Kerr-Newman-AdS$_5$ black hole on a toric Sasaki-Einstein space. Depending on the cycles they wrap, such branes represent non-perturbative corrections to or defect operator insertions in the superconformal index of a large family of four-dimensional $\\mathcal{N}=1$ quiver superconformal field theories. The resulting action reduces to equivariant integrals and can be evaluated entirely from toric data.", "url": "https://arxiv.org/abs/2604.26786", "type": "理论", "summary": "1. 该工作引入等变定位方法计算超引力背景中探针膜的作用量，并应用于Kerr-Newman-AdS₅黑洞提升的IIB超对称时空。\n2. 其核心在于通过toric Sasaki-Einstein空间数据将作用量简化为等变积分，从而解析描述D3膜的非微扰修正或缺陷算符插入。\n3. 这为利用黑洞几何直接计算超共形指数及其缺陷关联函数提供了精确的几何工具。", "summary_source": "deepseek", "authors": [{"name": "Pietro Benetti Genolini"}, {"name": "Christopher Couzens"}, {"name": "Alice Lüscher"}], "featured_authors": [{"name": "Pietro Benetti Genolini"}, {"name": "Christopher Couzens"}, {"name": "Alice Lüscher"}], "author_count": 3}, {"id": "2604.26795", "category": "hep-th", "title": "A positive definite formulation of vacuum decay with reduced symmetry", "abstract": "The Euclidean bounce for vacuum decay enjoys an $O(4)$ symmetry that is lost in the presence of impurities than can catalyze the decay. We present a formulation for the calculation of the tunneling decay action, that is explicitly positive definite, for impurities whose effects are spherically symmetric so that the bounce symmetry is reduced to $O(3)$. The action constructed can be regarded as a generalization of the tunneling potential method, which implicitly assumed $O(4)$ symmetry. We show that the action obtained reduces to the tunneling potential for $O(4)$-symmetric cases and provide analytic examples with $O(3)$ symmetry and arbitrary wall thickness.", "url": "https://arxiv.org/abs/2604.26795", "type": "理论", "summary": "1. 该工作针对杂质催化真空衰变中bounce对称性从O(4)降至O(3)的情形，提出一个显式正定的隧穿作用公式。\n2. 其技术核心在于将隧穿势方法推广至球对称杂质体系，并给出具有O(3)对称性和任意壁厚的解析解。\n3. 这为研究对称性破缺环境下的真空衰变动力学提供了可推广的理论框架。", "summary_source": "deepseek", "authors": [{"name": "José R. Espinosa"}, {"name": "Ryusuke Jinno"}, {"name": "Thomas Konstandin"}, {"name": "Shogo Matake"}, {"name": "Taiga Miyachi"}], "featured_authors": [{"name": "José R. Espinosa"}, {"name": "Ryusuke Jinno"}, {"name": "Thomas Konstandin"}, {"name": "Shogo Matake"}, {"name": "Taiga Miyachi"}], "author_count": 5}, {"id": "2604.26854", "category": "hep-th", "title": "Deforming ${\\rm AdS}_3\\times S^3\\times T^4$ in Type IIB Supergravity", "abstract": "We discuss some new results on the construction of supersymmetric solutions of Type IIB supergravity of the form ${\\rm WAdS}_3\\times{\\rm WS}^3\\times T^4$, ${\\rm WAdS}_3$ and ${\\rm WS}^3$ denoting \\emph{warped} anti-de Sitter spacetime and sphere, respectively. The distinctive feature of these backgrounds is that, in spite of them being supersymmetric, the warpings of the two factors are described by independent parameters. We illustrate how some of these geometries, characterised by a lightlike warping of the anti-de Sitter factor, arise in the near-horizon limit of a regular, asymptotically locally flat configuration of D-branes and fluxes. Central to the construction of the latter solutions is the use of two independent TsT transformations. We also give a new class of supersymmetric solutions of the general form ${\\rm WAdS}_3\\times{\\rm WS}^3\\times T^4$, which has not been published yet. They feature warpings of the anti-de Sitter factor of the lightlike, spacelike and timelike types. We discuss their properties.", "url": "https://arxiv.org/abs/2604.26854", "type": "理论", "summary": "1. 该工作在IIB型超引力中构造了形如WAdS₃×WS₃×T⁴的超对称背景解，其特征是AdS因子与球面因子的翘曲由独立参数刻画。\n2. 技术核心在于运用两次独立的TsT变换，从正则渐近局部平坦的D膜与通量构型出发，导出近极端极限下的类光翘曲AdS因子解，并给出包含光型、类空和类时翘曲的新解族。\n3. 这为构建具有独立翘曲参数的超对称背景提供了系统方法，并暗示了全息对偶中更丰富的几何结构及低维超对称性实现的可能。", "summary_source": "deepseek", "authors": [{"name": "Stefano Maurelli"}, {"name": "Ruggero Noris"}, {"name": "Marcelo Oyarzo"}, {"name": "Mario Trigiante"}], "featured_authors": [{"name": "Stefano Maurelli"}, {"name": "Ruggero Noris"}, {"name": "Marcelo Oyarzo"}, {"name": "Mario Trigiante"}], "author_count": 4}, {"id": "2604.26941", "category": "hep-th", "title": "Schwinger-Keldysh Path Integral for Gauge theories", "abstract": "We develop the Schwinger-Keldysh path-integral formalism for open non-Abelian gauge theories that are gauge-fixed via the BRST method in covariant gauges. We focus on generic initial states, pure and mixed, specified at finite times suitable for non-equilibrium processes. We pay particular attention to the handling of the indefinite Hilbert space, the construction of BRST-invariant Schrodinger picture wavefunctionals, density matrices and inner product, the implementation of the Hata-Kugo prescription, and the role of boundary terms at both the initial and final times. We highlight the advantages of the Nakanishi-Lautrup field representation in dealing with initial/final conditions. The resulting Schwinger-Keldysh path integral is manifestly invariant under a diagonal (retarded) BRST symmetry for arbitrary physical initial states, whether pure or mixed. From this, we obtain the corresponding Ward-Takahashi-Slavnov-Taylor identities, valid perturbatively. Non-perturbatively the Gribov ambiguity is expected to break or modify the BRST symmetry. The naive advanced BRST symmetry is shown to be explicitly violated by the in-in boundary conditions. We show that the Feynman-Vernon influence functional derived by integrating out charged matter and/or hard gluon modes remains (perturbatively) BRST invariant. When the Open EFT action is expanded to second order in advanced fields it exhibits an exact symmetry under a contraction of the original BRST symmetry. This Keldysh BRST symmetry is equivalent to the BRST associated with the retarded gauge transformations together with a linearly realized BRST transformation of the advanced fields. These govern the structure of the leading terms in an Open EFT. We illustrate this with the explicit example of Hard Thermal Loop Effective Theory, and construct the general form of the Open EFT in a Higgs phase when all gauge symmetries are spontaneously broken.", "url": "https://arxiv.org/abs/2604.26941", "type": "理论", "summary": "1. 该工作通过BRST方法建立了开非阿贝尔规范理论在协变规范下的Schwinger-Keldysh路径积分形式，严谨处理了不定Hilbert空间、初始态及边界条件。\n2. 其关键进展在于证明物理初始态下对角BRST对称性的保持，并揭示Keldysh BRST对称性作为开有效场论结构的基础约束。\n3. 该形式为非平衡规范理论中Feynman-Vernon影响泛函的BRST不变性及硬热圈有效理论等开放系统量子场论应用提供了严格框架。", "summary_source": "deepseek", "authors": [{"name": "Greg Kaplanek"}, {"name": "Maria Mylova"}, {"name": "Andrew J. Tolley"}], "featured_authors": [{"name": "Greg Kaplanek"}, {"name": "Maria Mylova"}, {"name": "Andrew J. Tolley"}], "author_count": 3}, {"id": "2604.26949", "category": "hep-th", "title": "Anomalous Transport and Explicit Symmetry Breaking in Holography", "abstract": "We consider a holographic Einstein-Maxwell model in five dimensions with pure gauge and mixed gauge-gravitational Chern-Simons terms to study anomaly-induced transport in the presence of explicit symmetry breaking. We include the full backreaction of the scalar field and gauge fields on the metric and compute the anomalous transport coefficients using Kubo formulae involving charge and energy current correlators. Our findings reveal that, in the presence of explicit symmetry breaking, anomaly-induced transport phenomena can extend beyond anomalous currents and affect the non-anomalous sector as well. The transport coefficients exhibit a clear dependence on the symmetry-breaking mass parameter, highlighting the interplay between quantum anomalies and explicit symmetry breaking in holographic systems.", "url": "https://arxiv.org/abs/2604.26949", "type": "理论", "summary": "1. 该工作构建了含纯规范与混合规范-引力Chern-Simons项的五维全息Einstein-Maxwell模型，并利用Kubo公式计算了显式对称性破缺下的反常输运系数。\n2. 其关键发现是显式对称性破缺不仅影响反常流，还使反常诱导输运扩展至非反常通道，且输运系数对对称性破缺质量参数具有明确依赖性。\n3. 这揭示了量子反常与显式对称性破缺在全息系统中的相互作用机制，为理解凝聚态体系中的反常输运行为提供了理论框架。", "summary_source": "deepseek", "authors": [{"name": "Ashis Tamang"}, {"name": "Nishal Rai"}, {"name": "Karl Landsteiner"}, {"name": "Eugenio Megias"}], "featured_authors": [{"name": "Ashis Tamang"}, {"name": "Nishal Rai"}, {"name": "Karl Landsteiner"}, {"name": "Eugenio Megias"}], "author_count": 4}, {"id": "2604.26122", "category": "math-ph", "title": "The dynamical algebra of the generic superintegrable model on the two-sphere", "abstract": "The rank two Jacobi algebra $\\mathfrak{J}_2$ is identified as the dynamical algebra of the generic quadratic superintegrable model on the two-sphere. The physical representation of this algebra is obtained from its embedding in $\\mathfrak{su}(1,1)^{\\otimes 3}$. The exact solution of the model is derived algebraically from this representation. The wavefunctions are found to be expressed in terms of two-variable Jacobi polynomials whose characterization is a by-product of the algebraic treatment of the model.", "url": "https://arxiv.org/abs/2604.26122", "type": "理论", "summary": "1. 该工作将秩-2 Jacobi 代数𝔍₂认定为二维球面上通用二次超可积模型的动力学代数。\n2. 其物理表示通过嵌入𝔰𝔲(1,1)⊗³实现，由此代数地导出了模型的精确解。\n3. 波函数以双变量Jacobi多项式表示，凸显了代数方法在可积系统求解中的系统性与推广潜力。", "summary_source": "deepseek", "authors": [{"name": "Nicolas Crampé"}, {"name": "Quentin Labriet"}, {"name": "Lucia Morey"}, {"name": "Satoshi Tsujimoto"}, {"name": "Luc Vinet"}, {"name": "Alexei Zhedanov"}], "featured_authors": [{"name": "Nicolas Crampé"}, {"name": "Quentin Labriet"}, {"name": "Lucia Morey"}, {"name": "Satoshi Tsujimoto"}, {"name": "Luc Vinet"}, {"name": "Alexei Zhedanov"}], "author_count": 6}, {"id": "2604.26322", "category": "math-ph", "title": "Rigged Liouville space formulation for quasi-Hermitian Liouville operators", "abstract": "We discuss a super bra-ket formalism for quasi-Hermitian Liouvillian operators within the framework of rigged Hilbert spaces (RHS). An RHS in terms of the Liouville space, referred to as a rigged Liouville space (RLS), is reconstructed by exploiting the mathematical fact that the space of Hilbert-Schmidt operators is unitarily equivalent to the tensor product of Hilbert spaces. The obtained RLS endows a rigorous foundation of the construction for the super bra-ket and for the spectral decompositions of both Hermitian and quasi-Hermitian Liouville operators, which are characterized by the generalized eigenvectors in the dual spaces. Furthermore, within this framework, the non-Hermitian Liouvillian operator and its adjoint can be constructed symmetrically, with their symmetric structure preserved. As an application of our RLS methodology, we examine the Liouville operators corresponding to Hermitian and non-Hermitian harmonic oscillators and elucidate the differences between their spectral decomposition forms.", "url": "https://arxiv.org/abs/2604.26322", "type": "理论", "summary": "1. 该工作利用Hilbert-Schmidt算子空间与张量积空间的酉等价，构建了rigged Liouville空间，为quasi-Hermitian Liouville算子建立了严格的超bra-ket形式体系。\n2. 其核心在于通过该框架对称构造非厄米Liouville算子及其伴随，并采用双空间广义本征向量实现谱分解，统一处理厄米与非厄米情形。\n3. 这为开放量子系统及非厄米量子力学中Liouville算子的谱理论提供了严格数学基础，并可推广至耗散及增益系统的动力学分析。", "summary_source": "deepseek", "authors": [{"name": "Shousuke Ohmori"}, {"name": "Junichi Takahashi"}], "featured_authors": [{"name": "Shousuke Ohmori"}, {"name": "Junichi Takahashi"}], "author_count": 2}, {"id": "2604.26323", "category": "math-ph", "title": "Combinatorics and asymptotic behavior for double Hurwitz numbers", "abstract": "Polynomial-in-time algorithms for computing classical Hurwitz numbers were given in [4] based on the Pandharipande equation. The paritition function of double Hurwitz numbers was proved [21] to satisfy the 2-Toda hierarchy. In this paper, similar to [21] we derive Pandharipande-type equations for double Hurwitz numbers from 2-Toda hierarchy. Based on these equations and a method from [4], we study large genus as well as large degree asymptotics of double Hurwitz numbers.", "url": "https://arxiv.org/abs/2604.26323", "type": "理论", "summary": "1. 该工作从2-Toda可积层次导出双Hurwitz数的Pandharipande型方程，并借助多项式时间算法研究其组合计数。\n2. 其技术核心在于利用层次结构推导出递归约束，进而解析求解大亏格与大度数情形下的精确渐近行为。\n3. 这为可积系统与拓扑弦论中双Hurwitz数的普适标度行为提供了组合基础与计算框架。", "summary_source": "deepseek", "authors": [{"name": "Xiang Li"}], "featured_authors": [{"name": "Xiang Li"}], "author_count": 1}, {"id": "2604.26354", "category": "math-ph", "title": "On enumeration of $b$-angulations of surfaces from an integrability perspective", "abstract": "In this paper, we study generating series enumerating polygonal angulations of closed oriented surfaces of fixed genus, focusing on $b$-angulations with $b = 3$ or $b = 2\\nu$, $\\nu \\geq 2$. Based on Toda integrability, we establish new structural results in the cases $b = 3$ and $b = 4$. Furthermore, via the Hodge--GUE correspondence, we derive a fine structure in the $b = 2\\nu$ case, which implies a conjectural statement of Gharakhloo--Latimer.", "url": "https://arxiv.org/abs/2604.26354", "type": "理论", "summary": "1. 该工作从可积性视角研究闭定向曲面上b角剖分的计数生成函数，聚焦b=3或b=2ν情形。\n2. 基于Toda可积性，在b=3,4情形建立新结构结果；通过Hodge–GUE对应，导出b=2ν情形的精细结构。\n3. 这为曲面剖分计数与可积系统及Hodge理论的深度关联提供确凿支持，并证实了Gharakhloo–Latimer猜测。", "summary_source": "deepseek", "authors": [{"name": "Elba Garcia-Failde"}, {"name": "Jianghao Xu"}, {"name": "Di Yang"}, {"name": "Don Zagier"}], "featured_authors": [{"name": "Elba Garcia-Failde"}, {"name": "Jianghao Xu"}, {"name": "Di Yang"}, {"name": "Don Zagier"}], "author_count": 4}, {"id": "2604.25950", "category": "quant-ph", "title": "A Complex-Valued Continuous-Variable Quantum Approximation Optimization Algorithm (CCV-QAOA)", "abstract": "Continuous-variable (CV) quantum systems offer a natural framework for continuous optimization through their infinite-dimensional Hilbert spaces. In this paper, we propose the Complex Continuous-Variable Quantum Approximate Optimization Algorithm (CCV-QAOA), a variational framework operating in the complex domain that optimizes over complex decision variables. The method efficiently solves real and complex multivariate optimization problems. To demonstrate its versatility, we apply CCV-QAOA across a broad suite of optimization use cases, including convex quadratic minimization, scaling studies with circuit depth and cutoff dimension, constrained quadratic programs using penalty constructions, and non-convex benchmarks such as the Styblinski-Tang function and complex quartic landscapes.", "url": "https://arxiv.org/abs/2604.25950", "type": "数值", "summary": "1. 该工作提出了一个复值连续变量量子近似优化算法(CCV-QAOA)，在复域中通过变分框架处理复决策变量的多变量优化问题。\n2. 其卖点在于利用连续变量无限维希尔伯特空间自然适合连续优化的特性，并展示了在凸二次规划、非凸如Styblinski-Tang函数及复四次势等广泛基准问题上的适用性。\n3. 这为连续变量量子计算在复杂优化场景中提供了一种新框架，尤其对处理复值约束和非凸问题的量子优势具有启发意义。", "summary_source": "deepseek", "authors": [{"name": "Raneem Madani"}, {"name": "Abdel Lisser"}, {"name": "Zeno Toffano"}], "featured_authors": [{"name": "Raneem Madani"}, {"name": "Abdel Lisser"}, {"name": "Zeno Toffano"}], "author_count": 3}, {"id": "2604.25962", "category": "quant-ph", "title": "Coherent Rollout Oracles for Finite-Horizon Sequential Decision Problems", "abstract": "Coherent quantum rollout for sequential decision problems requires a unitary simulator: randomness must live in explicit quantum registers, and basis-state selectors must be mapped to actions reversibly. With branch-dependent valid actions, this mapping is totalized coherent rank-select over an entangled $N$-bit validity mask: return the position of the $r$-th valid bit, or a sentinel if $r$ is out of range. We give the first reversible-circuit complexity analysis of this primitive. For selector width $w = \\lceil \\log_2(N+1) \\rceil$, rank-select admits an $O(Nw)$-gate low-ancilla bounded-span scan, proved gate-optimal in its model, and an $O(N\\log w)$-gate low-ancilla blocked construction when long-range gates are available; across all bounded-fan-in layouts, the unconditional gate lower bound is $\\Omega(N)$. Composing rank-select with reversible transition and predicate-evaluation circuits gives an explicit polynomial-size coherent rollout oracle for finite-horizon planning problems satisfying these primitive assumptions. The resulting oracle satisfies the access model of the best-arm pipeline of Wang et al., yielding $\\widetilde{O}(\\sqrt{k}/\\varepsilon)$ coherent oracle calls against the standard classical $\\Omega(k/\\varepsilon^2)$ arm-pull lower bound. We give a bounded-influence lifting theorem that extends this lower-bound construction from a base configuration to an exponential family of configurations. We instantiate the construction on SIR epidemic intervention, with a stochastic placement-game sanity check, and machine-check the main results in Lean 4. Code and proofs: this https URL .", "url": "https://arxiv.org/abs/2604.25962", "type": "理论", "summary": "1. 该工作首次对相干序贯决策问题中的秩选择原语进行了可逆电路复杂性分析，并构造了多项式大小的相干rollout oracle。\n2. 其技术核心在于给出了秩选择器的两种低辅助量子比特构造（O(Nw)扫描和O(N log w)分块）及其门复杂度下界Ω(N)，并建立了将下界从基位形扩展到指数族位形的有界影响提升定理。\n3. 所构造的oracle满足最佳臂流水线的访问模型，实现了对经典Ω(k/ε²)臂拉下界的量子加速，并在SIR流行病干预等实例中验证，相关证明已用Lean 4机械检查。", "summary_source": "deepseek", "authors": [{"name": "Nishant Shukla"}], "featured_authors": [{"name": "Nishant Shukla"}], "author_count": 1}, {"id": "2604.25971", "category": "quant-ph", "title": "A Lie-algebraic Criterion for the Universality of Exponentiated Quantum Gates", "abstract": "We present a criterion that serves as the basis for a polynomial-time algorithm to decide whether a finite set of qudit gates exponentiated by some Hamiltonians is universal. Our approach formulates universality in Lie algebraic terms and applies Borel--de Siebenthal theory with a diagonal generator having incommensurate spectrum. In this framework, nonuniversality is detected by invariant subspaces, equivalently by a graph-connectivity obstruction, while universality is repaired by adding generators that couple disconnected components. We further prove that two generators are sufficient for universal control. Our work reveals a profound link between qudit universality and irreducibility of Lie algebra representations.", "url": "https://arxiv.org/abs/2604.25971", "type": "理论+数值", "summary": "1. 该工作提出了基于李代数的多项式时间判据，判断有限组哈密顿量指数化量子门的通用性。\n2. 其技术核心应用Borel-de Siebenthal理论及不可公度谱对角生成元，通过不变子空间或图连通性障碍检测非通用性。\n3. 这揭示了qudit通用性与李代数表示不可约性的深刻联系，并证明仅需两个生成元即可实现通用控制。", "summary_source": "deepseek", "authors": [{"name": "Yinuo Xue"}, {"name": "Qian Chen"}, {"name": "Jing-Song Huang"}], "featured_authors": [{"name": "Yinuo Xue"}, {"name": "Qian Chen"}, {"name": "Jing-Song Huang"}], "author_count": 3}, {"id": "2604.25976", "category": "quant-ph", "title": "No Tile Left Behind: Multiprogramming for Surface-Code Architectures", "abstract": "Fault-tolerant quantum computing (FTQC) is emerging as the architectural regime in which practical large-scale quantum workloads will execute. In this setting, however, multiprogramming is no longer a matter of partitioning a flat pool of qubits. Quantum error correction exposes a structured floorplan of data tiles, ancilla tiles, and magic-state service resources, so concurrent execution must account for compact placement, connectivity, routing headroom, and shared support infrastructure. This makes FTQC multiprogramming fundamentally harder than its NISQ counterpart: admission decisions can fragment the remaining floorplan, conservative reservations can waste ancilla, and dynamic contention across data, ancilla, and magic-state resources can degrade both throughput and quality of service. In this work, we develop a formal framework for FTQC multiprogramming that captures these structural constraints and their runtime implications. We formulate the baseline static allocation problem, extend it to limited-resource and online settings through hierarchy-aware scheduling policies, and further generalize it to cultivation-enabled architectures with dynamic magic-state generation. Through simulation on synthetic Clifford+T workloads, the proposed scheduler achieves a normalized system speedup of 3.1x, improving over prior FTQC multiprogramming baselines by ~29% while maintaining low mean slowdown.", "url": "https://arxiv.org/abs/2604.25976", "type": "理论+数值", "summary": "1. 该工作针对表面码架构的容错量子计算系统，建立了考虑数据块、辅助块与魔法态资源结构约束的多程序编程形式化框架。\n2. 其核心突破在于提出了层次感知调度策略，将静态分配问题扩展到有限资源与在线设置，并推广至动态魔法态生成的培育型架构。\n3. 仿真表明该调度器在合成Clifford+T负载下实现3.1倍系统加速且较先前基线提升约29%，为实用化容错量子多任务执行提供了优化范式。", "summary_source": "deepseek", "authors": [{"name": "Archisman Ghosh"}, {"name": "Avimita Chatterjee"}, {"name": "Swaroop Ghosh"}], "featured_authors": [{"name": "Archisman Ghosh"}, {"name": "Avimita Chatterjee"}, {"name": "Swaroop Ghosh"}], "author_count": 3}, {"id": "2604.25983", "category": "quant-ph", "title": "Characterization of Thermalization Behaviour in a Generalized Aubry-André Model", "abstract": "Although random matrix theory provides a fundamental framework for characterizing quantum chaos, encompassing both ergodic and localized phases, a comprehensive understanding of the universal features governing the critical transition remains elusive in many disordered and quasi-random systems. In this study, we explore the ergodic-to-many-body localization transition in the generalized Aubry-André model with interacting spinless fermions. Using the concept of Frobenius norm of an adiabatic gauge potential, we construct a phase diagram that captures the sensitivity of the eigenspectrum to infinitesimal adiabatic gauge deformations. To examine the stability of the critical disordered strength with respect to system size, we perform an unbiased finite-size scaling analysis via cost-function minimization techniques. Additionally, by analyzing the adjacent gap ratio and spectral form factor, we determine the scaling behavior of the Thouless time as a function of the disorder strength.", "url": "https://arxiv.org/abs/2604.25983", "type": "理论+数值", "summary": "1. 该工作利用绝热规范势的Frobenius范数刻画广义Aubry-André模型中自旋less费米子的遍历-多体局域化转变相图。\n2. 其技术卖点在于通过无偏有限尺寸标度分析确定临界无序强度对系统尺寸的稳定性，并分析相邻能隙比与谱形状因子提取Thouless时间的标度行为。\n3. 这为理解准随机系统中临界转变的普适特征提供了明确启发，并拓展了绝热规范势在量子混沌研究中的应用。", "summary_source": "deepseek", "authors": [{"name": "S. Mal"}, {"name": "D. K. Nandy"}, {"name": "B. K. Sahoo"}], "featured_authors": [{"name": "S. Mal"}, {"name": "D. K. Nandy"}, {"name": "B. K. Sahoo"}], "author_count": 3}, {"id": "2604.25987", "category": "quant-ph", "title": "High-fidelity entangling gates and nonlocal circuits with neutral atoms", "abstract": "Creation and manipulation of entanglement with low error is essential in quantum information systems. In practice, two-qubit entangling gates constitute a dominant error source, limiting circuit depths and performance in fault-tolerant architectures. Using a neutral-atom quantum processor, we realize entangling CZ gates with a high Rabi frequency smooth-amplitude pulse, employing state-selective readout and qubit reuse for fast calibration, and achieve state-of-the-art fidelities of 99.854(4)% which improve to 99.941(3)% upon loss postselection, with stable performance for 10 hours. We then use these low-error gates in quantum circuits with coherent atom rearrangement. We first benchmark performance by creating and disentangling cluster states, and subsequently implement scrambling circuits featuring longer-range connectivity to study non-locally entangled states generated through chaotic dynamics. These results pave the way towards deep-circuit, efficient fault-tolerant quantum computation.", "url": "https://arxiv.org/abs/2604.25987", "type": "理论", "summary": "1. 该工作在中性原子量子处理器上实验实现了高保真纠缠CZ门，并利用原子相干重排构建了包含非局域连接的量子电路。\n2. 技术卖点在于采用高拉比频率平滑振幅脉冲，结合态选择读出与量子比特重用实现快速校准，测得CZ门保真度达99.854(4)%，经损失后选择提升至99.941(3)%且稳定运行10小时。\n3. 这一低错误门与可重排原子阵列表明，该平台可支持深电路与高效容错量子计算，并为研究混沌动力学产生的非局域纠缠态提供了实验途径。", "summary_source": "deepseek", "authors": [{"name": "Simon J. Evered"}, {"name": "Muqing Xu"}, {"name": "Sophie H. Li"}, {"name": "Alexandra A. Geim"}, {"name": "J. Pablo Bonilla Ataides"}, {"name": "Marcin Kalinowski"}, {"name": "Dolev Bluvstein"}, {"name": "Nishad Maskara"}, {"name": "Christian Kokail"}, {"name": "Markus Greiner"}, {"name": "Vladan Vuletić"}, {"name": "Mikhail D. Lukin"}], "featured_authors": [{"name": "Simon J. Evered"}, {"name": "Muqing Xu"}, {"name": "Sophie H. Li"}, {"name": "Markus Greiner"}, {"name": "Vladan Vuletić"}, {"name": "Mikhail D. Lukin"}], "author_count": 12}, {"id": "2604.26008", "category": "quant-ph", "title": "Continuous Noise Model for Quantum Circuits", "abstract": "Quantum noise is a central challenge in quantum computing across many applications. Extensive work has examined how qubits couple to their environment, leading to decoherence and relaxation, which is irreversible. Current studies focus on coherent gate errors caused by control misalignment, which accumulate with circuit depth but can, in principle, be corrected. This work studies a continuous coherent noise model for quantum circuits and compares it with a discrete Pauli model. The focus is on small coherent gate errors that build up across circuit depth. These errors are modeled as random rotations on the Bloch sphere using a von Mises-Fisher distribution. In the small-angle limit, the model reduces to an isotropic Gaussian distribution. We test the model on quantum error-correction circuits based on the [[5,1,3]] and [[7,1,3]] codes. A variant of Grover's search circuit with different qubit counts is also examined. To enable fair comparison, we introduce a model-independent matching scheme. Pauli and continuous noise channels are aligned using the binary entropy at readout. This isolates the effect of noise structure at fixed uncertainty. An approximate analytical method for coherent error propagation is also developed. The method tracks error distributions through Clifford circuits without full Monte Carlo sampling. It reduces simulation cost while preserving accuracy for circuit-level error estimates. The approximation is validated against brute-force simulations, identifying its regime of validity with Clifford circuits and limits under error correction. Our results show that continuous coherent noise can degrade logical performance more strongly than Pauli noise. They also clarify when simplified propagation models succeed and when they break down.", "url": "https://arxiv.org/abs/2604.26008", "type": "理论+数值", "summary": "1. 该工作提出并分析了量子电路中的连续相干噪声模型，将其与离散泡利噪声模型进行了系统性比较。\n2. 核心在于采用von Mises-Fisher分布模拟小角度随机旋转，并引入基于二进制熵的模型无关匹配方案，实现了噪声结构的公平对比。\n3. 结果表明连续相干噪声对逻辑错误性能的损害强于泡利噪声，为量子纠错码和搜索电路的噪声评估与传播近似方法提供了关键适用范围。", "summary_source": "deepseek", "authors": [{"name": "Yunos El Kaderi"}, {"name": "Andreas Honecker"}, {"name": "Iryna Andriyanova"}], "featured_authors": [{"name": "Yunos El Kaderi"}, {"name": "Andreas Honecker"}, {"name": "Iryna Andriyanova"}], "author_count": 3}, {"id": "2604.26040", "category": "quant-ph", "title": "QAOA Parameter Transfer for Hypergraphs", "abstract": "Variational Quantum Algorithms, including the Quantum Approximate Optimization Algorithm (QAOA), have shown promise in solving optimization problems but rely on costly variational loops that can themselves be hard optimization problems. Many methods have been proposed to mitigate this variational cost, with one of the most common being parameter transfer and concentration where variational parameters for one problem instance or for an average over problem instances can be used as a good set of parameters for another instance. Methods exist for reweighting these parameters based off graph degree and edge weights, but there has been little work on how to do this reweighting to handle higher locality problems where the graph structure turns into a hypergraph structure. In this paper, we analytically derive parameter reweighting rules to transfer parameters between different locality hypergraphs, resulting in a reweighting for the mixing terms in the Hamiltonian which have previously not been considered. These analytics rely on three cycle-free and low-circuit-depth assumptions, but numerics indicate that the results can be used even when these assumptions are not satisfied. The numerics obtain high quality results across a diverse set of hypergraphs with locality less than or equal to five, improving on previous relations that do not reweight the mixing terms.", "url": "https://arxiv.org/abs/2604.26040", "type": "理论+数值", "summary": "1. 该工作解析推导了超图间QAOA参数迁移的重加权规则，首次将混合项纳入迁移框架。\n2. 其卖点在于基于无环和低电路深度假设的解析结果，即使在假设不满足时仍广泛有效，对局域性≤5的超图显著优于未重加权混合项的已有方法。\n3. 这为降低变分量子算法优化成本提供了有效途径，并启发了超图结构优化问题中的高效参数转移策略。", "summary_source": "deepseek", "authors": [{"name": "Lucas T. Braydwood"}, {"name": "Phillip C. Lotshaw"}], "featured_authors": [{"name": "Lucas T. Braydwood"}, {"name": "Phillip C. Lotshaw"}], "author_count": 2}, {"id": "2604.26047", "category": "quant-ph", "title": "Iterative warm-start optimization with quantum imaginary time evolution", "abstract": "Approximate combinatorial optimization is a promising use case for quantum computers. The quantum optimization algorithms often employ a fixed ansatz that evolves an unbiased initial state towards states with better values of the optimand, then samples the states to determine an approximately optimal solution. However, promising alternative approaches have considered ``warm-start\" and sampling-based methods that instead begin from the best known solution, which can be directly optimized with the quantum computer and updated as new information becomes available, potentially outperforming the fixed ansätze. Here we use these ideas to design a nonvariational quantum algorithm for combinatorial optimization. At each step the algorithm begins with a state superposed around the best known solution, then drives it to lower energy using quantum imaginary time evolution. These nonvariational, initial-state-dependent circuits are determined using analytic equations that are evaluated using only a conventional computer. After implementing the circuits, the state is sampled, potentially obtaining a new best-known solution to use as the initial state at the next iteration. Using simulations of the algorithm solving MaxCut on 3-regular graphs with 30 or fewer vertices and a shot budget of 100 total shots, the approach obtains median solutions within 95\\% of the global optimum and finds optimal solutions in 11\\% or more of cases, significantly outperforming random and simplified classical search procedures. We discuss several future directions.", "url": "https://arxiv.org/abs/2604.26047", "type": "理论+数值", "summary": "1. 该工作提出一种非变分量子组合优化算法，在每次迭代中以当前最佳解为中心构造初态，通过量子虚时演化驱动其向低能态移动。\n2. 其技术核心在于利用经典计算机解析求解非变分、依赖初态的量子线路参数，无需变分优化，从而在MaxCut问题（30顶点以内3正则图、总采样100次）中实现中位解达全局最优的95%以上并11%以上找到最优解。\n3. 该工作展示了经典预计算与量子虚时演化结合的迭代策略在有限采样下超越随机和经典搜索的潜力，为近期量子器件上的组合优化提供了非变分路径的明确启发。", "summary_source": "deepseek", "authors": [{"name": "Phillip C. Lotshaw"}, {"name": "Titus Morris"}, {"name": "Stuart Hadfield"}, {"name": "Ryan Bennink"}], "featured_authors": [{"name": "Phillip C. Lotshaw"}, {"name": "Titus Morris"}, {"name": "Stuart Hadfield"}, {"name": "Ryan Bennink"}], "author_count": 4}, {"id": "2604.26099", "category": "quant-ph", "title": "Mathematical Foundation for Quantum Computing of Electromagnetic Wave Propagation in Dielectric Media", "abstract": "Can quantum computers effectively simulate the propagation and scattering of electromagnetic waves in a classical plasma? This chapter introduces some of the basic concepts in mathematics and physics essential to answering that question. The numerical simulations of Maxwell equations for wave propagation in dielectrics are constrained by technological limitations of the present-day computers. In contrast, there has been ample fanfare around quantum computers and their potential to far exceed the performance of traditional computers. Whether the enhanced capabilities of a quantum computer can be put to use for simulating topics in classical physics is a source of intrigue and curiosity.", "url": "https://arxiv.org/abs/2604.26099", "type": "理论+数值", "summary": "1. 该工作为在量子计算机上模拟电磁波在电介质中传播与散射奠定了数学与物理基础。\n2. 要点在于构建了从经典麦克斯韦方程组到量子计算算法的形式理论，揭示了量子优越性在此类经典问题中的潜在实现路径。\n3. 这为利用量子计算能力突破传统数值模拟瓶颈、探索经典物理问题的量子模拟提供了理论启发和框架支撑。", "summary_source": "deepseek", "authors": [{"name": "Abhay K. Ram"}, {"name": "Efstratios Koukoutsis"}, {"name": "George Vahala"}, {"name": "Kyriakos Hizanidis"}], "featured_authors": [{"name": "Abhay K. Ram"}, {"name": "Efstratios Koukoutsis"}, {"name": "George Vahala"}, {"name": "Kyriakos Hizanidis"}], "author_count": 4}, {"id": "2604.26117", "category": "quant-ph", "title": "One knob to tune them all: Phase-controlled photon statistics and linewidth in partially pumped atomic ensembles", "abstract": "We study a minimal model of collective light emission from an incoherently driven ensemble of atoms where incoherent drive is applied only to a part of atoms and show that both the linewidth and the photon statistics can be controlled within a single framework. In this setting, collective dissipation induces correlations between the pumped and unpumped parts of the system, leading to interference between their emission contributions. By introducing a relative phase between these contributions and tuning the pump rate, we demonstrate that the properties of the emitted light can be varied over a broad range. In particular, the linewidth can be made either independent of system size or scale extensively with it, while the photon statistics can be tuned from antibunched or quantum to bunched. We further show that the role of the relative phase in controlling the interference can alternatively be played by the coherent interaction. By tuning the interaction strength together with the pump rate, one can access the same regimes as in the dissipation-only model. In addition, coherent interactions stabilize regimes of coherent emission with narrow linewidth, reminiscent of superradiant lasing. Our results illustrate how interference in partially driven collective systems provides a flexible mechanism for tailoring both spectral and statistical properties of light.", "url": "https://arxiv.org/abs/2604.26117", "type": "理论", "summary": "1. 该工作研究了部分非相干驱动原子系综中集体光发射的最小模型，通过单一框架同时调控发射光的线宽和光子统计特性。\n2. 其核心在于利用泵浦与未泵浦原子发射之间的相对相位干涉，实现从反聚束到聚束的连续调谐以及线宽从尺寸无关到与系统尺寸线性扩展的转变。\n3. 这揭示了部分驱动集体系统中的干涉机制为灵活定制光谱与统计性质提供了新途径，相干相互作用可稳定窄线宽相干发射。", "summary_source": "deepseek", "authors": [{"name": "Oksana Chelpanova"}, {"name": "Martino Stefanini"}, {"name": "Dusan Sarenac"}, {"name": "Tim Thomay"}, {"name": "Jamir Marino"}], "featured_authors": [{"name": "Oksana Chelpanova"}, {"name": "Martino Stefanini"}, {"name": "Dusan Sarenac"}, {"name": "Tim Thomay"}, {"name": "Jamir Marino"}], "author_count": 5}, {"id": "2604.26141", "category": "quant-ph", "title": "Typical entanglement entropy with charge conservation", "abstract": "We consider a many-body Hilbert space with a fixed global charge and show that the typical entanglement entropy of a subsystem, at the leading and subleading order in the thermodynamic limit, can be expressed in terms of a single quantity which represents the local thermal entropy at fixed charge density. We find a general formula which applies both to abelian U(1) symmetry and non-abelian SU(2) symmetry, including the case of a local Hilbert space which transforms under a general reducible representation of the symmetry group. We illustrate the general formula with model systems and discuss the relevance of the results as a probe of quantum chaos for physical Hamiltonians.", "url": "https://arxiv.org/abs/2604.26141", "type": "理论", "summary": "1. 本文针对固定全局电荷的多体希尔伯特空间，证明子系统典型纠缠熵在热力学极限下的领头和次领头阶可统一由局域热熵（固定电荷密度下）表示。\n2. 其核心是导出一个通用公式，同时适用于阿贝尔U(1)和非阿贝尔SU(2)对称性及一般可约表示，并通过模型系统验证其作为量子混沌探针的潜力。\n3. 该工作为对称性约束下纠缠熵的普适结构提供了简洁框架，并为利用典型纠缠熵诊断物理哈密顿量的量子混沌行为开辟了新途径。", "summary_source": "deepseek", "authors": [{"name": "Eugenio Bianchi"}, {"name": "Pietro Donà"}, {"name": "Erick Muiño"}], "featured_authors": [{"name": "Eugenio Bianchi"}, {"name": "Pietro Donà"}, {"name": "Erick Muiño"}], "author_count": 3}, {"id": "2604.26146", "category": "quant-ph", "title": "Minimal action shortcut to adiabaticity in a driven Kitaev chain: competing gaps in a topological transition at finite-time", "abstract": "One of the main difficulties in preparing many-body ground states is achieving the target state through simple counterdiabatic controls. For critical systems crossing a transition to a topological phase, this task becomes even more challenging due to the closing of the gaps in multiple symmetry sectors. This is the case of the Kitaev chain, whose transition between the trivial and topological phases involves states belonging to different symmetry sectors. In this work, we apply the recently introduced minimal action shortcut to adiabaticity (MA-STA) to a Kitaev chain and propose a multi-step strategy to obtain the optimal control protocol to drive the system across its different phases. Our results show that high fidelities can be achieved through the adapted MA-STA at time scales much shorter than those of linear ramp protocols. We also compare the performance of both controls in suppressing work fluctuations. These findings may guide the design of STA protocols in many-body systems where competing energy scales and symmetries shape the global dynamics.", "url": "https://arxiv.org/abs/2604.26146", "type": "理论", "summary": "1. 该工作将最小作用捷径绝热协议应用于驱动Kitaev链，提出多步控制策略以驱动系统跨越平庸与拓扑相之间的量子相变。\n2. 其核心卖点在于通过竞争能隙的多对称扇区调控，在远短于线性斜坡的时间尺度上实现高保真度并抑制功涨落。\n3. 这为多体系统中涉及竞争能标与对称性的非绝热控制协议设计提供了通用启发。", "summary_source": "deepseek", "authors": [{"name": "Rafael Bentes de Sales"}, {"name": "Krissia Zawadzki"}], "featured_authors": [{"name": "Rafael Bentes de Sales"}, {"name": "Krissia Zawadzki"}], "author_count": 2}, {"id": "2604.26267", "category": "quant-ph", "title": "Algebraic quantum kinematics and SR-selection", "abstract": "We develop, as the first of a six-paper series, an operator-algebraic framework relating non-relativistic quantum mechanics and special relativity. Three structural facts organize the framework. (i)~The photon sector of free QED is a transparent realization: classical Fourier--Maxwell theory supplies a complex Hilbert-space scaffold (inner product, symplectic form, Schrödinger-form mode equation, polarization $\\mathbb{C}^2$) with no quantum input, and a single canonical commutator with scale $\\hbar$ on the mode amplitudes promotes it to single-photon QED, with photon indivisibility, the Planck relation $E=\\hbar\\omega$, and the spin spectrum $\\pm\\hbar$ as theorems. (ii)~The constants $c$ and $\\hbar$ play non-interchangeable roles: $c$ is intrinsic to each Fourier-conjugate space, while $\\hbar$ acts \\emph{between} them, converting kinematic phase rates into dynamical observables. (iii)~Lifting the framework to a Haag--Kastler net with sharper-than-equal-time microcausality and positive-energy spectrum is structurally obstructed in the Galilean case; we state this as the SR-selection conjecture and identify three strands of evidence (Hegerfeldt spreading; absence of a known Galilean multi-particle resolution; Reeh--Schlieder failure on Galilean Haag--Kastler nets), the third established as a precise no-go theorem in the second paper of the series. The framework's modular content (Tomita--Takesaki, Bisognano--Wichmann, Unruh as KMS, type-$\\mathrm{III}_1$ universality) is collected as the algebraic substrate on which the curved-background, dynamical-metric, and crossed-product extensions of the third through sixth papers operate.", "url": "https://arxiv.org/abs/2604.26267", "type": "理论", "summary": "1. 该工作建立了算子代数框架，作为六篇系列的首篇，统一非相对论量子力学与狭义相对论。\n2. 核心卖点是自由QED光子扇区的经典Fourier-Maxwell实现：c内禀于对偶空间，ħ作用于其间将相位率转为动力学可观测量，从而导出光子不可分性、Planck关系及自旋谱±ħ等定理。\n3. 框架提出的SR-selection猜想（基于Hegerfeldt扩散、Galilean多粒子分辨率缺失及Reeh-Schlieder失败）为后续弯曲时空、动态度规及交叉积扩展奠定代数基础，并限制非相对论性Haag-Kastler网。", "summary_source": "deepseek", "authors": [{"name": "Leonardo A. Pachon"}], "featured_authors": [{"name": "Leonardo A. Pachon"}], "author_count": 1}, {"id": "2604.26271", "category": "quant-ph", "title": "Galilean Reeh--Schlieder Obstruction", "abstract": "We prove that the standard Galilean Haag--Kastler axioms, augmented by Bargmann mass superselection, are inconsistent with the Reeh--Schlieder property: no such net admits a vacuum that is cyclic and separating for every local field algebra. Two ingredients combine: Galilean Schrödinger fields annihilate the Fock vacuum, and Bargmann mass superselection forbids the Hermitian-combination evasion that keeps relativistic axioms consistent. The result extends beyond the Fock-representation hypothesis: any Galilean Haag--Kastler net whose canonical fields carry definite Bargmann mass charges and admit time-zero restrictions on a field-algebra-stable common dense domain is incompatible with Reeh--Schlieder. The bounded-below mass spectrum and the vacuum-at-spectral-minimum, usually imposed as separate axioms, are derived consequences -- of positive-energy boost positivity and a Bose-CCR algebraic descent, respectively. The Tomita--Takesaki modular flow is consequently unavailable on Galilean local field algebras. We identify the Reeh--Schlieder property as the precise structural ingredient distinguishing relativistic from Galilean algebraic quantum field theory: relativistic AQFT has it as a theorem, Galilean AQFT cannot.", "url": "https://arxiv.org/abs/2604.26271", "type": "理论", "summary": "1. 该工作证明标准伽利略Haag-Kastler公理结合Bargmann质量超选择与Reeh-Schlieder性质不相容，揭示了相对论与非相对论代数量子场论的结构性差异。\n2. 核心机制在于伽利略薛定谔场湮灭Fock真空，且Bargmann质量超选择禁止了相对论中通过厄米组合规避矛盾的可能，结论推广至非Fock表示。\n3. 这明确将Reeh-Schlieder性质定位为相对论性代数量子场论独有的定理性特征，并为非相对论系统中Tomita-Takesaki模流的缺失提供了根本解释。", "summary_source": "deepseek", "authors": [{"name": "Leonardo A. Pachon"}], "featured_authors": [{"name": "Leonardo A. Pachon"}], "author_count": 1}, {"id": "2604.26287", "category": "quant-ph", "title": "Newton-Cartan limit of Klein-Gordon AQFT and the collapse of Galilean modular structure", "abstract": "We extend the established Galilean/relativistic structural divider in algebraic quantum field theory, namely, the absence of Reeh-Schlieder and of Tomita-Takesaki modular flow on local algebras of any Galilean Haag-Kastler net satisfying a natural axiom set augmented by the Bargmann-charge hypotheses (G7$^*$)(a) and (G7$^*$)(d) to curved backgrounds via the Newton-Cartan ($c\\to\\infty$) limit. We show, for the free Klein-Gordon field on Minkowski and on static globally hyperbolic spacetimes admitting a Post-Newtonian expansion, that a position-independent rest-energy rescaling produces in the limit a Galilean Haag-Kastler net satisfying the axioms of Ref. [1] in flat-space form (Minkowski) or in a curved-space modification (Killing-flow invariance and uniqueness of the vacuum replacing full translation invariance) appropriate to the static case. The Bargmann central charge equals the Klein--Gordon mass~$m$; the gravitational potential $V(x)$ enters the limiting Schrödinger Hamiltonian but not the algebraic structure obstructed by the Galilean Reeh-Schlieder no-go theorem. The strengthened obstruction theorem of Ref. [1] extends to the modified curved-space setting on Fock representations, and the limiting net carries no modular flow on local algebras. Schwarzschild is treated as a worked example: the Killing horizon shrinks to a point, the Hartle-Hawking thermal state has no $c\\to\\infty$ limit, and the Boulware vacuum limits to the gravitational hydrogenic ground state. The Reissner-Nordström metric is included as a sanity check confirming that leading Post-Newtonian misses the electromagnetic content of the background. We discuss how Newton's constant~$G$ enters the present (background-metric) framework only at the level of the limiting Hamiltonian, and indicate where dynamical-metric extensions would require $G$ to play a structural role.", "url": "https://arxiv.org/abs/2604.26287", "type": "理论", "summary": "1. 该工作通过牛顿-卡坦极限将自由Klein-Gordon场的代数量子场论从闵氏时空扩展到静态全局双曲弯曲背景，并验证了伽利略Reeh-Schlieder禁戒定理的成立。\n2. 其技术核心是位置无关的静能重标度使极限网满足带有Bargmann中心荷的伽利略Haag-Kastler公理，且引力势仅进入薛定谔哈密顿量而不改变局部代数的模流缺失结构。\n3. 这揭示了牛顿常数在背景度规框架中仅影响哈密顿量，并为动态度规扩展中G的结构性角色及黑洞热态经典极限的失效提供了明确启示。", "summary_source": "deepseek", "authors": [{"name": "Leonardo A. Pachon"}], "featured_authors": [{"name": "Leonardo A. Pachon"}], "author_count": 1}, {"id": "2604.26314", "category": "quant-ph", "title": "Amplitude Encoding of Slater-Type Orbitals via Matrix Product States: Efficient State Preparation and Integral Evaluation on Quantum Hardware", "abstract": "Slater-type orbitals (STOs) provide the physically correct description of atomic wavefunctions but have been largely replaced by Gaussian-type orbitals in computational chemistry due to the lack of closed-form multi-center integrals. We present a systematic study of amplitude encoding of STOs on quantum computers using matrix product states (MPS). For one-dimensional orbital functions of the form $p_d(x) e^{-\\zeta x}$, we derive analytical MPS constructions with constant bond dimension $\\chi = d + 1$, requiring $O(n)$ classical and quantum resources for $n$-qubit registers with no grid sampling. We demonstrate a complete one-electron integral pipeline -- overlap, kinetic energy, and nuclear attraction -- in one dimension, validating the overlap and kinetic energy on IBM Heron processors at 5~qubits with 0.67\\% hardware-induced error using Zero-Noise Extrapolation. In three dimensions, we compute multi-center overlap integrals between 1s and 2s orbitals in Cartesian coordinates with 0.02\\% discretization error at 18~qubits. A systematic entanglement analysis reveals that the MPS bond dimension of three-dimensional STOs in Cartesian coordinates saturates with increasing grid resolution -- reaching $\\sim$138 for the hydrogen 1s orbital at 12~qubits per coordinate -- establishing bounded encoding complexity rather than the exponential scaling initially expected. The SVD truncation threshold provides a practical resource parameter, reducing the bond dimension to 39 at threshold $10^{-6}$ with negligible accuracy loss. These results map the entanglement landscape for amplitude encoding of atomic orbitals and establish MPS-based state preparation as a viable path toward exact STO basis sets on quantum computers.", "url": "https://arxiv.org/abs/2604.26314", "type": "理论", "summary": "1. 该工作利用矩阵乘积态在量子计算机上实现了Slater型轨道的幅度编码，并完成了高效态制备与一维和三维积分评估。\n2. 其技术核心在于解析构造了恒定键维度的MPS表示，通过SVD截断将三维轨道编码复杂度控制在有限值而非指数增长，并验证了单电子积分的硬件精度。\n3. 这为在量子硬件上精确使用Slater型轨道基组提供了可行路径，其位姿复杂度分析为更大尺度分子量子化学模拟奠定了理论资源基础。", "summary_source": "deepseek", "authors": [{"name": "Sorin Bolos"}], "featured_authors": [{"name": "Sorin Bolos"}], "author_count": 1}, {"id": "2604.26380", "category": "quant-ph", "title": "Genuine tripartite entanglement in Bhabha scattering with an entangled spectator particle", "abstract": "From the perspective of quantum information science, we investigate tree-level Bhabha scattering between an incident electron $A$ and a positron B, where $B$ is initially entangled with a spectator electron $C$, which does not participate in the scattering this http URL find that the quantum electrodynamics (QED) scattering between $A$ and $B$ can drive the global $ABC$ system into a genuine tripartite entangled (GTE) state. Using four canonical tripartite entanglement metrics, we systematically characterize and quantify the GTE of the composite system, and demonstrate that the scattering momentum of the $A$-$B$ pair and the initial $B$-$C$ entanglement are the key resources governing GTE this http URL further analyze the monogamy of quantum correlations, which imposes fundamental constraints on the shareability of quantum resources in multipartite systems. Specifically, we systematically study the monogamy relations for the squared entanglement of formation and squared quantum discord in our scattering model, and find that monogamy constraints are markedly relaxed in the non-relativistic regime, enabling enhanced shareability of quantum correlations across the three particles. This work uncovers novel quantum correlation properties of fundamental QED scattering processes, and provides direct theoretical guidance for the development of QED-based quantum information processing protocols.", "url": "https://arxiv.org/abs/2604.26380", "type": "理论", "summary": "1. 本工作从量子信息视角研究了伴随纠缠旁观电子的Bhabha散射过程，发现树图级QED散射可使电子-正电子-旁观电子体系产生真三体纠缠态。\n2. 核心在于利用四种典型度量系统表征三体纠缠，并揭示出散射动量与初始纠缠是关键资源，且在非相对论区单配性约束显著松弛。\n3. 该发现揭示了基本QED散射过程中多体量子关联的新性质，为发展基于QED的量子信息处理协议提供了直接理论指导。", "summary_source": "deepseek", "authors": [{"name": "Zan Cao"}, {"name": "Meng-Long Song"}, {"name": "Xue-Ke Song"}, {"name": "Liu Ye"}, {"name": "Dong Wang"}], "featured_authors": [{"name": "Zan Cao"}, {"name": "Meng-Long Song"}, {"name": "Xue-Ke Song"}, {"name": "Liu Ye"}, {"name": "Dong Wang"}], "author_count": 5}, {"id": "2604.26430", "category": "quant-ph", "title": "A Multi-Level Integrity Evaluation Framework for Quantum Circuits under Controlled Anomaly Injection", "abstract": "Ensuring the integrity of quantum circuits is a significant challenge in the Noisy Intermediate-Scale Quantum (NISQ) era, where circuits are subject to compilation transformations, hardware constraints, and potential adversarial modifications. Existing validation approaches typically rely on either structural analysis or behavioral evaluation, leading to incomplete assessment of circuit correctness. In this work, we investigate the relationship between structural, interaction-level, and behavioral perspectives of circuit integrity, demonstrating that a single aspect of integrity is insufficient to guarantee circuit integrity; structural similarity alone does not ensure behavioral equivalence. To address this problem, we use a three-layer metric framework that combines the Structural Integrity Score (SIS), the Operational Integrity Score (OIS), and the Interaction Graph Semantic-Logical Score (IGS). SIS captures global structural properties, OIS quantifies behavioral divergence using Jensen-Shannon distance, and IGS models interaction patterns and dependencies in a pre-execution setting. Through controlled anomaly injection on benchmark quantum circuits, we demonstrate that each metric captures a different aspect of circuit deviation. In particular, structural blind-spot cases (SIS >= 0.95) reveal a clear limitation of structural analysis, where OIS detects anomalies in 93.85% of instances, while IGS detects 72.58%. These results highlight that the metrics provide complementary insights and that a single metric is insufficient for reliable circuit validation.", "url": "https://arxiv.org/abs/2604.26430", "type": "理论", "summary": "1. 该工作提出了一个面向量子电路完整性的三层评估框架，融合结构完整性分数、操作完整性分数与交互图语义逻辑分数。\n2. 其技术核心在于通过受控异常注入揭示结构盲区：结构相似性无法保证行为等价，操作指标可检测93.85%的异常而结构指标漏检。\n3. 这为NISQ时代量子电路验证提供了多指标互补的必要性启发，表明单一维度评估不可靠。", "summary_source": "deepseek", "authors": [{"name": "Ejaz Ahmed"}, {"name": "Boshuai Ye"}, {"name": "Syed Hamza Shah"}, {"name": "Muhammad Azeem Akbar"}, {"name": "Arif Ali Khan"}], "featured_authors": [{"name": "Ejaz Ahmed"}, {"name": "Boshuai Ye"}, {"name": "Syed Hamza Shah"}, {"name": "Muhammad Azeem Akbar"}, {"name": "Arif Ali Khan"}], "author_count": 5}, {"id": "2604.26466", "category": "quant-ph", "title": "The Fock-Darwin-Darboux system: eigenstates, information entropies and dispersion-like measures", "abstract": "The Fock-Darwin (FD) quantum system describes the motion on the plane of a charged particle under the action of an isotropic oscillator potential together with a perpendicular constant magnetic field. When the isotropic oscillator is suppressed, the FD system leads to the Landau Hamiltonian with infinitely degenerate Landau levels. The Fock-Darwin-Darboux (FDD) system is the generalisation of the FD system to a particle moving on the Darboux III space, which is a conformally flat surface with non-constant negative curvature. We present a systematic study of some information-theoretic entropy and dispersion-like measures for these quantum systems. Since both systems are exactly solvable, analytical expressions for Shannon, Rényi and Tsallis entropies, among others, can be obtained. We show that for the FD system, its information-theoretic measures are formally the same as the ones for the harmonic oscillator, provided a modified effective frequency depending on the magnetic field is introduced. In the FDD case, the nonlinear nature of the underlying manifold precludes the existence of a simple closed form for the wave-function on momentum space, which is numerically analysed. We compare the numerical behaviour of the different entropy measures and we analyse the interplay arising in the FDD system between the curvature parameter and the magnetic field. In particular, it is shown that the Landau system on the Darboux III space has no infinitely degenerate Landau levels.", "url": "https://arxiv.org/abs/2604.26466", "type": "理论+数值", "summary": "1. 该工作系统研究了Fock-Darwin-Darboux(FDD)量子系统中带电粒子在Darboux III负曲率流形上的本征态、信息熵及色散类度量。\n2. 其核心发现在于：Fock-Darwin系统的信息熵等价于谐振子形式但需引入磁场依赖的有效频率，而FDD系统因流形非线性导致动量空间波函数无闭式解，且曲率参数完全消除了Landau能级的无限简并性。\n3. 这为探索弯曲空间量子系统信息论性质与曲率-磁场耦合的物理机制提供了可精确分析的数值框架。", "summary_source": "deepseek", "authors": [{"name": "Ignacio Baena-Jimenez"}, {"name": "Angel Ballesteros"}, {"name": "Ivan Gutierrez-Sagredo"}], "featured_authors": [{"name": "Ignacio Baena-Jimenez"}, {"name": "Angel Ballesteros"}, {"name": "Ivan Gutierrez-Sagredo"}], "author_count": 3}, {"id": "2604.26477", "category": "quant-ph", "title": "Multi-Objective Optimization by Quantum-Annealing-Inspired Algorithms", "abstract": "Combinatorial optimization is widely regarded as a primary application for near-term quantum processors, although a definitive demonstration of the practical quantum advantage remains elusive. Recent studies have reported that both gate-based quantum circuits and quantum annealers can outperform state-of-the-art classical heuristics on multi-objective optimization (MO-MaxCut) problems. However, these studies did not fully account for the substantial pre- and post-processing overheads intrinsic to quantum solvers, leading to incomplete comparisons between quantum and classical approaches. In this work, we re-examine the same benchmark suite using GPU-based quantum-annealing-inspired algorithms (QAIAs), which, analogously to quantum processors, generate probabilistic samples and thus serve as formidable classical contenders. Our results show that QAIAs can sample candidate solutions approximately two orders of magnitude faster than previously studied quantum processors. In terms of end-to-end runtime, QAIAs also surpass industry-leading classical solvers, thereby establishing themselves as the superior performers among the quantum and classical solvers evaluated thus far for the MO-MaxCut instances.", "url": "https://arxiv.org/abs/2604.26477", "type": "理论+数值", "summary": "1. 使用GPU上的量子退火启发算法重新评估了多目标优化（MO-MaxCut）基准测试，并比较了端到端运行时间。\n2. 其卖点在于量子退火启发算法比先前研究的量子处理器采样速度快约两个数量级，且端到端性能优于业界领先的经典求解器。\n3. 这提示在评估量子优势时必须充分考虑预处理与后处理开销，并为多目标优化问题的经典解法建立了新的性能基准。", "summary_source": "deepseek", "authors": [{"name": "Xian-Zhe Tao"}, {"name": "Pavel Mosharev"}, {"name": "Man-Hong Yung"}], "featured_authors": [{"name": "Xian-Zhe Tao"}, {"name": "Pavel Mosharev"}, {"name": "Man-Hong Yung"}], "author_count": 3}, {"id": "2604.26524", "category": "quant-ph", "title": "Over forty years of research towards the understanding of Quantum Brownian Motion -- the contributions of A. O. Caldeira", "abstract": "This article presents a brief account of Amir O. Caldeira's contributions to the theory of quantum Brownian motion. Motivated by its importance, we outline the description of Brownian motion in the quantum regime following Caldeira's first works. In this context, we particularly highlight the effect of dissipation on the tunneling rate out of a metastable state. We then journey along the alternative ways to approach quantum Brownian motion developed by Caldeira during his career, which go beyond the so-called Caldeira-Leggett model. We conclude by summarizing some of Caldeira's contributions to contemporary fields such as the theory of quantum decoherence and quantum thermodynamics, that were strongly inspired by his eponymous approach to quantum Brownian motion.", "url": "https://arxiv.org/abs/2604.26524", "type": "理论", "summary": "1. 该文回顾了Caldeira在量子布朗运动理论领域的开创性贡献，特别聚焦于耗散对亚稳态隧穿率的影响。\n2. 其核心卖点在于系统阐述了超越Caldeira-Leggett模型的替代途径，揭示了量子耗散与隧穿耦合的物理机制。\n3. 这为量子退相干和量子热力学等当代领域提供了源自量子布朗运动的深层理论启发。", "summary_source": "deepseek", "authors": [{"name": "Marcus V. S. Bonança"}, {"name": "Sebastian Deffner"}, {"name": "Gert-Ludwig Ingold"}], "featured_authors": [{"name": "Marcus V. S. Bonança"}, {"name": "Sebastian Deffner"}, {"name": "Gert-Ludwig Ingold"}], "author_count": 3}, {"id": "2604.26534", "category": "quant-ph", "title": "Neural and Tensor Networks in the Study of Quantum Annealing Processors", "abstract": "Quantum annealing targets low-energy solutions of Ising/QUBO problems, but reliable assessment requires more than best-energy comparisons. This dissertation develops a benchmarking framework for D-Wave quantum annealers that combines strong classical baselines, sampling and diversity metrics, and thermodynamic cost. Its first contribution, this http URL , is a topology-aware tensor-network heuristic for optimization and sampling on Pegasus/Zephyr-like graphs. It maps Ising instances to local Potts clusters, represents the partition function with PEPS, and performs branch-and-bound search in probability space. Benchmarks show that it is a physically interpretable reference solver, though approximate contractions limit its competitiveness on the largest instances. The second contribution treats quantum annealers as effective thermal machines, relating success probability and solution quality to dissipation, entropy production, and effective temperature. Carefully placed pauses can improve performance while reducing thermodynamic cost, although longitudinal fields may become harmful in paused schedules. The thesis also introduces reinforcement-learning post-processing to improve returned samples and exact small-system simulations to probe annealing dynamics. Overall, it argues for quantum-annealing benchmarks that jointly measure algorithmic performance and physical expenditure.", "url": "https://arxiv.org/abs/2604.26534", "type": "理论+数值", "summary": "1. 该工作为D-Wave量子退火处理器构建了一个融合经典基线、采样多样性指标与热力学成本的基准测试框架。\n2. 其核心卖点包括拓扑感知的张量网络启发式优化与采样方法，以及将退火器视为有效热机并关联成功概率与耗散、熵产生的热力学分析。\n3. 这启示未来量子退火评估应同时度量算法性能和物理消耗，且合理布置停顿可改善结果并降低热力学成本。", "summary_source": "deepseek", "authors": [{"name": "Tomasz Śmierzchalski"}], "featured_authors": [{"name": "Tomasz Śmierzchalski"}], "author_count": 1}, {"id": "2604.26562", "category": "quant-ph", "title": "Reservoir-mediated spin entanglement in the mean-force Gibbs state", "abstract": "Two qubits strongly coupled to a common bosonic reservoir can become entangled with each other, despite having no direct interaction. In equilibrium, such coupling-induced coherences can be described by the mean-force Gibbs state. Here we derive approximate, analytic expressions for the two-qubit mean-force Gibbs state, and use these to characterize equilibrium qubit-qubit entanglement mediated by a thermal reservoir. Entanglement, which is highest at lowest temperatures, is a non-monotonic function of the system-reservoir coupling strength. Moreover, we find that broadening the reservoir spectral density beyond a single mode, as is realistic for typical baths, can enhance the qubit entanglement. Our results provide a comprehensive understanding of reservoir-mediated two-qubit entanglement in thermal equilibrium and provide a benchmark to compare with numerical methods, as well as demonstrating the utility of strong system-reservoir coupling as a resource.", "url": "https://arxiv.org/abs/2604.26562", "type": "理论+数值", "summary": "1. 该工作推导了两量子比特平均力吉布斯态的近似解析表达式，系统表征了热平衡下由共同玻色子库介导的自旋纠缠。\n2. 其卖点在于揭示了纠缠随系统-库耦合强度非单调变化，且展宽库谱密度可增强纠缠，表明强耦合可作为纠缠资源。\n3. 这为理解无直接相互作用量子比特的热纠缠提供了基准，并启发利用库工程设计多体量子关联。", "summary_source": "deepseek", "authors": [{"name": "L. A. Williamson"}, {"name": "W. McEniery"}, {"name": "F. Cerisola"}, {"name": "J. Anders"}], "featured_authors": [{"name": "L. A. Williamson"}, {"name": "W. McEniery"}, {"name": "F. Cerisola"}, {"name": "J. Anders"}], "author_count": 4}, {"id": "2604.26605", "category": "quant-ph", "title": "All pure entangled states can lead to fully nonlocal correlations", "abstract": "It is a well-established fact that some quantum correlations can be nonlocal, meaning that they cannot be described by a local hidden variable model. Certain quantum correlations have a form of nonlocality so strong that they cannot be reproduced even by models having an arbitrarily small local hidden variable component. These correlations are called fully nonlocal and lead to Bell inequalities in which the maximum quantum value saturates the non-signaling bound. A well-known example of this effect, which is also referred to as quantum pseudo-telepathy or all-versus-nothing proofs of nonlocality, is the quantum distribution fulfilling the Peres-Mermin square, in which the underlying state is a $4\\times4$ dimensional maximally entangled state. Other examples of full nonlocality are known but, so far, all of them are for maximally entangled states and it is an open question whether maximal entanglement is necessary for full nonlocality. In this work, we first establish a link between full nonlocality and the concept of antidistinguishability of quantum states. We use this connection to show that in every bipartite $d\\times d$ Hilbert space, with $d\\geq3$, there are non-maximally entangled states that are fully nonlocal. In fact, we derive simple sufficient conditions for full nonlocality that are only based on the smallest and largest Schmidt coefficients. We also show that in every dimension there exist pure entangled states that do not exhibit full nonlocality. Finally, we show that all pure entangled states can be activated to show full nonlocality in the many-copy scenario.", "url": "https://arxiv.org/abs/2604.26605", "type": "理论", "summary": "1. 该工作建立了全非局域关联与量子态反可区分性之间的理论联系，证明在d≥3的双粒子d×d系统中，非最大纠缠纯态也可呈现全非局域性。\n2. 核心卖点在于导出了仅基于最大与最小Schmidt系数的简单充分条件，并证明了所有纯纠缠态均可在多拷贝场景下被激活为全非局域关联。\n3. 这为理解非局域性的资源需求提供了新视角，并启发利用反可区分性等量子信息概念构造更一般的非局域性证明方案。", "summary_source": "deepseek", "authors": [{"name": "Martin J. Renner"}, {"name": "Edwin Peter Lobo"}, {"name": "Arturo Konderak"}, {"name": "Remigiusz Augusiak"}, {"name": "Antonio Acín"}], "featured_authors": [{"name": "Martin J. Renner"}, {"name": "Edwin Peter Lobo"}, {"name": "Arturo Konderak"}, {"name": "Remigiusz Augusiak"}, {"name": "Antonio Acín"}], "author_count": 5}, {"id": "2604.26609", "category": "quant-ph", "title": "Probabilistic Condition, Decision and Path Coverage of Circuit-based Quantum Programs", "abstract": "Coverage criteria play a central role in assessing test adequacy in classical software, yet their effectiveness for quantum programs remains poorly understood and largely unexplored. In this paper, we propose six quantum-tailored criteria - condition, decision, and path coverage, and their probabilistic variants - adapted from their classical counterparts. We present QaCoCo, a tool that computes these criteria for circuit-based quantum programs. We empirically evaluate these criteria on a large and diverse set of 540 circuits and analyze the coverage achieved. Our results show that while circuits frequently achieve high condition and decision coverage (97.56% and 97.63%, on average), path coverage remains limited (71.84%), particularly in the presence of multi-controlled gates, which induce extreme path explosion and coverage imbalance. Moreover, to account for the probabilistic nature of quantum circuits, we introduce probabilistic coverage, which augments structural coverage with a confidence measure (88.87%, 88.65%, and 37.18% for condition, decision, and path coverage, respectively, on average). Finally, through mutation testing, we find weak or no correlation between fault detection and structural coverage, consistent with observations in classical computing.", "url": "https://arxiv.org/abs/2604.26609", "type": "数值", "summary": "1. 该工作针对电路量子程序，提出了六项量子化覆盖准则（条件、决策、路径覆盖及其概率变体），并实现QaCoCo工具在540条电路上评估其测试充分性。\n2. 其核心在于引入概率覆盖度量，将结构覆盖与置信度结合，揭示了多控制门引发的路径爆炸与覆盖失衡（路径覆盖率仅71.84%，概率路径覆盖降至37.18%）。\n3. 通过变异测试发现故障检测与结构覆盖弱相关，表明经典覆盖思想在量子程序测试中的根本局限，亟待设计量子特有测试准则。", "summary_source": "deepseek", "authors": [{"name": "Daniel Fortunato"}, {"name": "José Campos"}, {"name": "Rui Abreu"}], "featured_authors": [{"name": "Daniel Fortunato"}, {"name": "José Campos"}, {"name": "Rui Abreu"}], "author_count": 3}, {"id": "2604.26625", "category": "quant-ph", "title": "Tikhonov-regularised projected gradient flow for equality-constrained bilinear quantum control", "abstract": "We study a projection-type gradient flow for equality-constrained maximisation of a smooth bilinear control objective on $\\mathcal{H}=L^2(0,T;\\mathbb{R})$, eliminating Lagrange multipliers through an $(M{+}1)\\times(M{+}1)$ moving Gram matrix $\\Gamma(s)_{\\ell\\ell'}=\\int_0^T S(t)\\,c_\\ell(s,t)\\,c_{\\ell'}(s,t)\\,\\mathrm{d}t$. The flow generates monotonic ascent in continuous time but becomes unstable on discretisation; existing implementations rely on heuristic step-size safeguards lacking rigorous justification. We close this gap by replacing $\\Gamma$ with $\\Gamma_{\\varepsilon}:=\\Gamma+\\varepsilon^{2}I$ and prove: (i) an exact spectral identity giving $\\kappa(\\Gamma_{\\varepsilon})=(\\sigma_{\\max}^{2}+\\varepsilon^{2})/(\\sigma_{\\min}^{2}+\\varepsilon^{2})$; (ii) objective monotonicity $\\mathrm{d}J/\\mathrm{d}s\\ge 0$ for all $\\varepsilon\\ge 0$; (iii) constraint drift $|h_{m}-C_{m}|=\\mathcal{O}(\\varepsilon^{2})$ with a computable prefactor; (iv) convergence of the regularised trajectory to the unregularised one in $L^{2}(0,T)$ at rate $\\mathcal{O}(\\varepsilon^{2})$ under uniform invertibility of $\\Gamma$; and (v) a discrete CFL criterion $\\Delta s\\,G\\,\\|\\Gamma_{\\varepsilon}^{-1}\\|\\le\\alpha<2$ guaranteeing objective monotonicity of the forward-Euler scheme up to $\\mathcal{O}(\\Delta s^{2})$ local truncation error. The theory is validated on a three-level bilinear benchmark for all-optical Bell-state preparation, where $\\kappa(\\Gamma)\\in[10^{9},10^{11}]$, t
