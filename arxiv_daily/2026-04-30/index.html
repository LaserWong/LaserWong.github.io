  <title>arXiv 2026-04-30 · Daily ArXiv Selection</title>
  <style>
    :root {
      --bg: #f6f1e8;
      --panel: rgba(255, 252, 246, 0.92);
      --text: #2d241d;
      --muted: #6d5d50;
      --line: rgba(69, 49, 32, 0.14);
      --accent: #8f3d2e;
      --accent-2: #1d5f6b;
      --theory: #7c3a2a;
      --numeric: #255b6a;
      --both: #5d4a99;
      --experimental: #2f6b39;
      --shadow: 0 18px 40px rgba(54, 32, 16, 0.12);
      --radius: 22px;
      --ui-font: "Aptos", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --title-font: "Palatino Linotype", "Noto Serif SC", Georgia, serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--ui-font);
      color: var(--text);
      background: radial-gradient(circle at top left, rgba(255,255,255,0.78), transparent 32%), radial-gradient(circle at 88% 12%, rgba(29,95,107,0.14), transparent 20%), linear-gradient(180deg, #fbf7f0 0%, var(--bg) 42%, #f2e8dc 100%);
      min-height: 100vh;
    }
    .shell { width: min(1220px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 64px; }
    .hero {
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(255,255,255,0.84), rgba(255,248,238,0.72)), linear-gradient(135deg, rgba(143,61,46,0.08), rgba(29,95,107,0.08));
      box-shadow: var(--shadow);
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.82); border: 1px solid var(--line); color: var(--muted); font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase;
    }
    h1 { margin: 18px 0 10px; font-family: var(--title-font); font-size: clamp(32px, 5vw, 54px); line-height: 1.04; letter-spacing: -0.03em; }
    .hero p { max-width: 880px; color: var(--muted); font-size: 16px; line-height: 1.7; margin: 0; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-top: 26px; }
    .stat { padding: 16px 18px; background: rgba(255,255,255,0.76); border: 1px solid var(--line); border-radius: 18px; }
    .stat .label { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
    .stat .value { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
    .controls { position: sticky; top: 12px; z-index: 3; margin-top: 22px; padding: 18px; border: 1px solid var(--line); border-radius: 24px; background: rgba(250,244,236,0.9); backdrop-filter: blur(16px); box-shadow: 0 10px 24px rgba(54,32,16,0.08); }
    .control-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 16px; }
    .field { display: flex; flex-direction: column; gap: 10px; }
    .field label { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
    .search { width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line); background: rgba(255,255,255,0.92); font: inherit; color: var(--text); }
    .chip-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .chip { border: 1px solid var(--line); background: rgba(255,255,255,0.82); color: var(--text); padding: 10px 14px; border-radius: 999px; font: inherit; cursor: pointer; }
    .chip.active { border-color: rgba(143,61,46,0.35); background: rgba(143,61,46,0.12); color: #5b2419; }
    .chip[data-type="数值"].active { border-color: rgba(37,91,106,0.35); background: rgba(37,91,106,0.12); color: #173f49; }
    .chip[data-type="理论+数值"].active { border-color: rgba(93,74,153,0.35); background: rgba(93,74,153,0.12); color: #46337d; }
    .chip[data-type="实验"].active { border-color: rgba(47,107,57,0.35); background: rgba(47,107,57,0.12); color: #214c29; }
    .meta-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 14px; color: var(--muted); font-size: 14px; }
    .paper-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 18px; margin-top: 22px; }
    .paper { display: flex; flex-direction: column; gap: 14px; padding: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 10px 24px rgba(54,32,16,0.06); }
    .paper-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .tag { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid transparent; }
    .tag.category { background: rgba(45,36,29,0.08); color: var(--text); }
    .tag.type-theory { background: rgba(124,58,42,0.1); color: var(--theory); border-color: rgba(124,58,42,0.16); }
    .tag.type-numeric { background: rgba(37,91,106,0.1); color: var(--numeric); border-color: rgba(37,91,106,0.16); }
    .tag.type-both { background: rgba(93,74,153,0.1); color: var(--both); border-color: rgba(93,74,153,0.16); }
    .tag.type-experimental { background: rgba(47,107,57,0.1); color: var(--experimental); border-color: rgba(47,107,57,0.16); }
    .paper h2 { margin: 0; font-family: var(--title-font); font-size: 22px; line-height: 1.25; letter-spacing: -0.02em; }
    .paper h2 a { color: inherit; text-decoration: none; }
    .paper h2 a:hover { color: var(--accent); }
    .paper .id { color: var(--muted); font-size: 13px; }
    .author-block { display: grid; gap: 10px; padding: 14px 16px; border-radius: 18px; background: rgba(255,255,255,0.64); border: 1px solid var(--line); }
    .author-label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .author-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .author-item { display: grid; gap: 4px; }
    .author-item strong { font-size: 14px; }
    .author-item span { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .author-note { color: var(--muted); font-size: 12px; }
    .paper .summary { margin: 0; font-size: 15px; line-height: 1.75; white-space: pre-line; }
    details { border-top: 1px solid var(--line); padding-top: 12px; }
    details summary { cursor: pointer; color: var(--accent-2); font-weight: 700; list-style: none; }
    details summary::-webkit-details-marker { display: none; }
    details p { margin: 10px 0 0; color: var(--muted); line-height: 1.72; font-size: 14px; white-space: pre-line; }
    .paper footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 6px; color: var(--muted); font-size: 13px; }
    .paper footer a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .empty { display: none; margin-top: 24px; padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 22px; background: rgba(255,255,255,0.7); }
    @media (max-width: 980px) { .control-grid { grid-template-columns: 1fr; } .controls { position: static; } }
  </style>

  <script>
    const papers = [{"id": "2604.25992", "category": "cond-mat", "title": "Towards a microscopic model for an electronic quantum charge liquid", "abstract": "We provide a route to constructing an electronic quantum charge liquid (QCL), a state made up of fermions at fractional filling of a lattice that does not break translation. Starting with spinless fermions at filling $\\nu=3/2$ we pair them to get bosons at filling $\\nu=3/4$ per unit cell. The tetramer model, a generalization of the dimer model, on the square lattice is evaluated as a candidate bosonic QCL at filling $\\nu = 3/4$. It is shown that these models exhibit a local $\\mathbb{Z}_4$ symmetry. Upon numerical study of a family of tetramer wavefunctions it is found that while one is gapless due to $\\mathrm{U}(1)^3$ symmetry at least one other can be definitively shown to be gapped. The gapped nature of this state, along with its $\\mathbb{Z}_4$ symmetry, leads us to propose that it is an example of the elusive bosonic QCL displaying the minimal $\\mathbb{Z}_4$ topological order. We conclude by discussing possible extensions to other lattice geometries, electronic QCLs, and to Rydberg atoms.", "url": "https://arxiv.org/abs/2604.25992", "type": "理论+数值", "summary": "1. 该工作构建了电子量子电荷液体的微观模型路径，通过将填充ν=3/2的自旋less费米子配对为ν=3/4的玻色子，并在正方格子上引入四方体模型作为候选。\n2. 核心卖点在于四方体模型具有局域Z4对称性，且数值研究表明其中存在有能隙态，展现出最小Z4拓扑序，区别于U(1)^3对称的无能隙态。\n3. 这为拓展至其他晶格几何、实现电子量子电荷液体及里德伯原子体系中的类似拓扑态提供了明确理论指导。", "summary_source": "deepseek", "authors": [{"name": "Jacob R. Taylor"}, {"name": "Sankar Das Sarma"}, {"name": "Seth Musser"}], "featured_authors": [{"name": "Jacob R. Taylor"}, {"name": "Sankar Das Sarma"}, {"name": "Seth Musser"}], "author_count": 3}, {"id": "2604.26014", "category": "cond-mat", "title": "Quantum Hall Liquids Coupled to Dynamical Electromagnetism", "abstract": "We investigate the effect on a Quantum Hall (QH) liquid of its coupling to 3+1 dimensional dynamical electromagnetism, which renders the system gapless. We calculate both the Hall and longitudinal resistances, $\\rho_H$ and $\\rho_L$, in the context of a minimal model of the electromagnetic environment, with a small three dimensional conductivity ${\\tilde{\\sigma}}$, that allows for a counter-flow current. In the thermodynamic limit, we show that $\\rho_H$ is quantized, while $\\rho_L$ approaches a non-zero limit, $\\rho_L \\sim \\alpha\\, R_K$, where $\\alpha$ and $R_K=2\\pi /e^2$ are the fine structure and the Klitzing constant. In contrast, the QH conductance, $\\sigma_H$, is smaller than the expected quantized value by a correction $\\sim \\alpha^2/R_K$. The electromagnetic interaction also generates corrections of order $\\alpha^2$ to the quasiparticle charges and statistics, in a way that is consistent with general arguments based on gauge invariance. In addition, we present an intuitive argument that relates the flux attachment associated with the composite boson representation of the electron liquid to the empirically observed %persistence of approximate quantization of $\\rho_H$, even in circumstances in which $\\rho_L$, and the deviation of $\\sigma_H$ from its quantized value, are substantial.", "url": "https://arxiv.org/abs/2604.26014", "type": "理论", "summary": "1. 该工作研究了量子霍尔液体与三维动态电磁场耦合所导致的系统无能隙行为，并计算了霍尔与纵向电阻。\n2. 其核心发现在于热力学极限下霍尔电阻精确量子化，而纵向电阻趋向非零值αR_K，且霍尔电导及准粒子荷与统计获α^2量级修正。\n3. 这为理解电磁环境如何维持量子霍尔电阻的近似量子化（即使纵向耗散显著）提供了基于复合玻色子膜通附着的直观机制。", "summary_source": "deepseek", "authors": [{"name": "T. H. Hansson"}, {"name": "Qing-Dong Jiang"}, {"name": "S. A. Kivelson"}, {"name": "Thomas Klein Kvorning"}], "featured_authors": [{"name": "T. H. Hansson"}, {"name": "Qing-Dong Jiang"}, {"name": "S. A. Kivelson"}, {"name": "Thomas Klein Kvorning"}], "author_count": 4}, {"id": "2604.26018", "category": "cond-mat", "title": "QERNEL: a Scalable Large Electron Model", "abstract": "We introduce QERNEL, a foundational neural wavefunction that variationally solves families of parameterized many-electron Hamiltonians and captures their ground states throughout parameter space within a single model. QERNEL combines FiLM-based parameter conditioning with scale-efficient architectural elements -- mixture of experts and grouped-query attention, substantially improving expressivity at low computational cost. We apply QERNEL to interacting electrons in semiconductor moiré heterobilayers, training a single weight-shared model for systems of up to 150 electrons. By solving the many-electron Schrödinger equation conditioned on moiré potential depth, QERNEL captures both quantum liquid and crystal states and discovers the sharp phase transition between them, marked by abrupt changes in interaction energy and charge density. Our work establishes a foundation model for moiré quantum materials and a scalable architecture toward a Large Electron Model for solids.", "url": "https://arxiv.org/abs/2604.26018", "type": "理论+数值", "summary": "1. 该工作提出QERNEL，一种可扩展的神经波函数模型，变分求解参数化多电子薛定谔方程族，单一模型捕获整个参数空间的基态。\n2. 其核心卖点是结合FiLM参数条件化与混合专家、分组查询注意力等高效架构，以低计算成本实现高表达能力，并应用于多达150个电子的半导体莫尔异质双层。\n3. 这为莫尔量子材料建立了基础模型，并为发展面向固体的可扩展大电子模型提供了架构启发。", "summary_source": "deepseek", "authors": [{"name": "Khachatur Nazaryan"}, {"name": "Liang Fu"}], "featured_authors": [{"name": "Khachatur Nazaryan"}, {"name": "Liang Fu"}], "author_count": 2}, {"id": "2604.26087", "category": "cond-mat", "title": "Kinetics of segregation of topologically-modified ring polymers in cylindrical confinement", "abstract": "In Escherichia coli (E. coli), entropic repulsion between the two daughter DNA ring polymers under cylindrical confinement is believed to be an important factor governing chromosomal segregation. The repulsion can be enhanced by topological modifications, i.e., by the introduction of internal loops at certain locations along the contour of the circular DNA. However, the effect of topological modifications on the rate of segregation of ring polymers remains unclear. Therefore, we systematically varied the number and the contour length of loops introduced at selected locations by crosslinking monomers. The appropriate crosslinking was motivated by observations that extruded loops are located mainly near the origin of replication (ori-proximal) region of the E. coli chromosome. This resulted in the chains becoming intrinsically anisotropic. Using Langevin dynamics simulations of these topologically modified bead-spring polymers, we calculated the time required for segregation under cylinder confinement. With certain caveats, we found that increasing the number of loops resulted in a decrease in the time of segregation. In line with past work, we propose that this is due to the increase in the entropic repulsion between the polymers upon increasing the number of loops. In addition to the number of loops, the contour length of the loops and the mutual orientation of the (anisotropic) chains in the initial configurations played a role in determining the time of segregation.", "url": "https://arxiv.org/abs/2604.26087", "type": "理论+数值", "summary": "1. 该工作通过Langevin动力学模拟，系统研究了圆柱限制下拓扑修饰环形聚合物的偏析动力学，并考察了内部环的数量、轮廓长度及链初始取向的影响。\n2. 其核心发现是增加环数量可增强熵排斥效应而缩短偏析时间，且环的轮廓长度与链的各向异性初始构型对偏析速率有显著调控作用。\n3. 这为理解大肠杆菌染色体分离机制中拓扑修饰的作用提供了直接数值依据，并对设计受控环状聚合物体系具有启示意义。", "summary_source": "deepseek", "authors": [{"name": "Harsh Doshi"}, {"name": "Shreerang Pande"}, {"name": "Sathish K. Sukumaran"}, {"name": "Apratim Chatterji"}], "featured_authors": [{"name": "Harsh Doshi"}, {"name": "Shreerang Pande"}, {"name": "Sathish K. Sukumaran"}, {"name": "Apratim Chatterji"}], "author_count": 4}, {"id": "2604.26100", "category": "cond-mat", "title": "Hidden Crossover and Relaxor-Like Response from Emerging Polar Skyrmion Correlations in Ferroelectric Superlattices", "abstract": "Polar skyrmions in ferroelectric superlattices are nanoscale topological polarization textures typically regarded as weakly coupled objects confined to individual layers, with a role secondary to that of the underlying symmetry-breaking order parameter. Here using large-scale phase-field simulations of ferroelectric superlattices, we uncover a hidden thermal crossover deep inside the ferroelectric phase, where polar skyrmions evolve from an uncorrelated, layer-resolved state into an interlayer-correlated ensemble. This crossover occurs without additional symmetry breaking or a new order parameter, but produces a pronounced broad peak in the dielectric susceptibility. The anomaly originates from the competition between correlation-enhanced response, associated with the growth of interlayer skyrmion correlations, and polarization-induced stiffness, which suppresses dielectric fluctuations at low temperature. Under AC driving, the peak shifts with frequency, resembling relaxor ferroelectrics despite the absence of quenched disorder or polar nanoregions. Our results establish a disorder-free route to relaxor-like dielectric response and identify topological defect correlations as an organizing principle for thermodynamic anomalies, providing a mechanism distinct from conventional critical behavior associated with symmetry breaking and divergent order-parameter fluctuations.", "url": "https://arxiv.org/abs/2604.26100", "type": "理论+数值", "summary": "1. 通过大规模相场模拟，该工作在铁电超晶格中发现极性斯格明子从层内无关联态到层间关联整体的隐藏热交叉。\n2. 交叉不伴随对称性破缺，却因斯格明子层间关联增强的介电响应与极化刚度之间的竞争产生介电峰，AC驱动下峰频移呈弛豫型特征。\n3. 此发现建立了无需无序而实现弛豫型介电响应路径，揭示拓扑缺陷关联可作为热力学异常的组织原则。", "summary_source": "deepseek", "authors": [{"name": "Zhiyang Wang"}, {"name": "Fei Yang"}, {"name": "Long-Qing Chen"}], "featured_authors": [{"name": "Zhiyang Wang"}, {"name": "Fei Yang"}, {"name": "Long-Qing Chen"}], "author_count": 3}, {"id": "2604.26125", "category": "cond-mat", "title": "Topological transitions in spin-ice induced by geometrical constraints", "abstract": "We study the nearest-neighbor spin-ice model subjected to a magnetic field applied along the global [111] and [110] directions, focusing on the role of sample geometry in stabilizing topological phase transitions. While no Kasteleyn transition is expected for this field orientations in the thermodynamic limit, we show that constraining the transverse dimensions of the system qualitatively changes the behavior. For samples elongated along the field direction with finite transverse area, the divergence-free constraint quantizes the number of string excitations that can span the system. As a result, the magnetization evolves through a cascade of discrete transitions corresponding to the successive entry of individual strings. Using Monte Carlo simulations, we demonstrate that each transition is marked by sharp magnetization steps and peaks in the specific heat and susceptibility, whose amplitudes scale linearly with the system length. We complement the numerical results with an analytical treatment based on the entropy - energy balance on a system with reduced dimensionality, deriving the critical fields associated with each topological sector. In the isotropic limit these transitions merge into a smooth crossover, but for anisotropic samples they remain sharply resolved, illustrating an unconventional mechanism by which finite geometry stabilizes topological phase transitions in frustrated magnets.", "url": "https://arxiv.org/abs/2604.26125", "type": "理论+数值", "summary": "1. 本文研究近邻自旋冰模型在[111]和[110]方向磁场下，有限横向几何约束导致的拓扑相变。\n2. 其核心在于横向尺寸的约束使无散条件量子化跨越系统的弦激发数目，从而通过尖锐磁化台阶和比热峰实现离散拓扑跃迁。\n3. 这为在受限几何中通过各向异性稳定拓扑相变提供了明确机制，可推广至其他阻挫磁体体系。", "summary_source": "deepseek", "authors": [{"name": "R. A. Borzi"}, {"name": "E. S. Loscar"}, {"name": "S. A. Grigera"}], "featured_authors": [{"name": "R. A. Borzi"}, {"name": "E. S. Loscar"}, {"name": "S. A. Grigera"}], "author_count": 3}, {"id": "2604.26149", "category": "cond-mat", "title": "First-Principles Study of Structural, Electronic, Thermal, and Optical Properties of Quasi-2D C2 N2 O Using GGA and HSE06", "abstract": "DFT and AIMD are used to investigate the structural, stability, electronic, thermal, and optical properties of the quasi-2D C2N2O structure. The structure exhibits thermal and energy stability, signifying robustness under ambient conditions, however less dynamical stability is observed. The electronic structure investigation reveals that C2N2O displays semiconducting properties with a moderate indirect band gap resulting from the hybridisation of p-orbitals of N, C, and O atoms, with band gap values of 2.3 eV (GGA) and 3.9 eV (HSE06). The optical properties, including the dielectric function, optical conductivity, and refractive index, are thoroughly analyzed to clarify the electronic transitions. The material exhibits considerable optical absorption in the visible and ultraviolet spectrum, with notable anisotropy between in-plane and out-of-plane polarizations. Furthermore, plasmon resonance occurs at around 3.8 eV, relating to the collective oscillations of charge carriers. The thermal properties indicate a heat capacity of around 382 J/mol.K at 300 K, which is close to and slightly above the standard Dulong-Petit limit for this structure, indicating near-complete excitation of lattice vibrational modes at room temperature. The lattice thermal conductivity is extremely low, reaching approximately 0.017 W/m.K at 300 K, primarily attributed to significant phonon scattering, evidenced by a scattering rate of roughly 3.2 1/ps in the phonon frequency ranges. The findings demonstrate that the C2N2O structure maintains structural stability while allowing for tunable electronic, optical, and thermal properties, making it a promising candidate for nanoscale optoelectronic and thermal control applications.", "url": "https://arxiv.org/abs/2604.26149", "type": "数值", "summary": "1. 该工作利用DFT和AIMD方法结合GGA与HSE06泛函，系统计算了准二维C2N2O的结构稳定性、电子能带（间接带隙2.3–3.9 eV）、光学介电函数及热容（300 K下382 J/mol·K）和晶格热导率。\n2. 核心发现是室温下该半导体晶格热导率极低（约0.017 W/m·K），源于强声子散射（散射率~3.2 1/ps），且光学响应在面内外方向呈现显著各向异性，等离子共振位于3.8 eV。\n3. 这为将准二维C2N2O应用于需可调电子结构和各向异性光吸收的纳米光电子器件，以及作为超低热导率热管理材料提供了理论依据，并启示需进一步研究其动力学稳定性的提升。", "summary_source": "deepseek", "authors": [{"name": "Hemn. G. H"}, {"name": "Nzar. R. Abdullah"}, {"name": "Vidar Gudmundsson"}], "featured_authors": [{"name": "Hemn. G. H"}, {"name": "Nzar. R. Abdullah"}, {"name": "Vidar Gudmundsson"}], "author_count": 3}, {"id": "2604.26168", "category": "cond-mat", "title": "Negative magnetoresistance in strained $α$-Sn and $α$-SnGe films in an in-plane magnetic field", "abstract": "To test the hypothesis that the chiral anomaly is responsible for negative magnetoresitance (MR) in \\atn{}, we have studied magnetotransport in strained, epitaxial films of pure \\aSn{} and the alloy \\aSnGe{} that are in the Dirac semimetal and 3D topological insulator state, respectively. We have observed for both states a negative MR with current either parallel or transverse to the in-plane magnetic field, but with a different dependence of MR on $\\vec{B}$ strength. Our results are inconsistent with the chiral anomaly and suggest that other mechanisms may be responsible for negative MR in the Dirac/Weyl semimetal phase of \\aSn{}. We also discuss several factors in sample design and material quality that may be contributing to the incongruous observations of MR reported in studies of strained \\atn{} films.", "url": "https://arxiv.org/abs/2604.26168", "type": "理论", "summary": "1. 该工作通过系统测量纯α-Sn及其与Ge的合金应变外延薄膜在面内磁场配置下的磁输运性能，对狄拉克半金属相与三维拓扑绝缘体相中负磁电阻现象的手征反常起源进行了直接的实验检验。\n2. 其关键物理发现与卖点在于：两种量子态中均呈现出明确的负磁电阻，但其对电流方向与磁场方向平行或垂直的取向依赖性及随磁场强度变化的响应关系，与基于手征反常的理论预言表现出显著且系统的偏离。\n3. 这一结果有力地否定了手征反常作为该体系负磁电阻主要物理机制的观点，同时揭示出样品设计参数、外延应变均匀性与材料缺陷等因素在解释不同研究组关于应变α-Sn薄膜的磁电阻观测分歧中的核心作用。", "summary_source": "deepseek", "authors": [{"name": "Sunny Phan"}, {"name": "Andrei Kogan"}, {"name": "Jesse Thompson"}, {"name": "Trent Johnson"}, {"name": "Alexander Khaetskii"}, {"name": "Arnold Kiefer"}], "featured_authors": [{"name": "Sunny Phan"}, {"name": "Andrei Kogan"}, {"name": "Jesse Thompson"}, {"name": "Trent Johnson"}, {"name": "Alexander Khaetskii"}, {"name": "Arnold Kiefer"}], "author_count": 6}, {"id": "2604.26215", "category": "cond-mat", "title": "Complex first-passage transport in ring networks with long-range jumps and stochastic resetting", "abstract": "The transport properties of discrete-time random walks on ring networks with deterministic shortcuts are investigated through analytical and numerical methods. The network consists of a periodic chain where each node is connected to its nearest neighbors and to nodes located at a fixed distance $r$. Using the spectral properties of the transition matrix, we derive explicit expressions for the occupation probabilities and mean first-passage times (MFPTs). Contrary to the common expectation that shortcuts monotonically enhance transport, we find that the MFPT between distant nodes develops a highly non-monotonic dependence on the shortcut length. Beyond a threshold value, the MFPT landscape exhibits a hierarchy of maxima and minima organized in a self-similar pattern associated with commensurability relations between the shortcut length and the system size. The scaling behavior of these extrema reveals regimes where transport efficiency is either strongly enhanced or suppressed. We further analyze the mean squared displacement and the influence of stochastic resetting, showing that resetting amplifies the oscillatory MFPT structure and induces strongly nonuniform stationary distributions. These results demonstrate that the spatial organization of long-range connections plays a crucial role in determining transport efficiency in networks.", "url": "https://arxiv.org/abs/2604.26215", "type": "理论+数值", "summary": "1. 该工作通过转移矩阵谱分析与数值模拟，针对环状网络上含固定距离捷径的离散时间随机游走，解析获得了平均首次通过时间与占据概率显式表达式，并考察了随机重置效应。\n2. 核心突破在于揭示平均首次通过时间随捷径长度呈非单调变化，超过阈值后形成与系统尺寸可公度性紧密关联的自相似极大极小层次，其标度行为标志传输效率的增强与抑制区间，而重置放大振荡并诱导非均匀稳态分布。\n3. 这些发现系统阐明长程连接空间组织是调控网络输运效率的关键，为通过连接布局与重置策略优化首过过程提供了设计原理，并对理解生物与物理网络中类似动力学过程具有指导意义。", "summary_source": "deepseek", "authors": [{"name": "Oscar Ivan Torres Mena"}, {"name": "Francisco J Sevilla"}], "featured_authors": [{"name": "Oscar Ivan Torres Mena"}, {"name": "Francisco J Sevilla"}], "author_count": 2}, {"id": "2604.26257", "category": "cond-mat", "title": "Influence of strain on the anomalous Hall and Nernst effects in Fe thin films", "abstract": "The anomalous Hall effect (AHE) and anomalous Nernst effect (ANE) are the transverse transport phenomena in magnetic materials, which reflect the Berry curvature arising from the electronic structure near the Fermi level. Lattice strain provides a direct means to tune these effects by modifying the electronic structure; however, disentangling the strain-induced effect through the Berry curvature modulations in multicomponent materials is challenging due to complexities arising from extrinsic contributions by impurities and disorder, as well as difficulties in simple direct comparison with first-principles calculations. In this study, we focus on Fe, a prototypical single element ferromagnet with a well-established electronic structure, and tune the sign and magnitude of the strain in epitaxial thin films of by varying the substrates and deposition conditions to investigate the strain effect on the AHE and ANE. Scaling law analysis revealed that the intrinsic anomalous Hall conductivity (AHC) exhibits a clear tetragonal distortion (c/a) dependence, in good agreement with theoretical calculations based on Berry curvature modification. In contrast, the anomalous Nernst conductivity (ANC) shows a pronounced deviation from the theoretical values and markedly different c/a dependence. These results demonstrate a crucial difference in the physical origin between the AHC and the ANC in the Fe films; the AHC is predominantly governed by intrinsic mechanisms, whereas the ANC is strongly influenced by the extrinsic contribution.", "url": "https://arxiv.org/abs/2604.26257", "type": "数值", "summary": "1. 该工作以单质铁外延薄膜为模型体系，系统研究了晶格应变对反常霍尔效应和反常能斯特效应的调控行为。\n2. 通过标度律分析发现，反常霍尔电导率随四方畸变的变化与基于贝里曲率的理论计算高度吻合，而反常能斯特电导率则显著偏离理论值。\n3. 这揭示了反常霍尔电导率主要由本征机制主导，反常能斯特电导率则受外禀贡献强烈影响，为区分两者的物理起源提供了关键实验证据。", "summary_source": "deepseek", "authors": [{"name": "Ao Nakagawa"}, {"name": "Ryo Toyama"}, {"name": "Keisuke Masuda"}, {"name": "Weinan Zhou"}, {"name": "Hirofumi Suto"}, {"name": "Kodchakorn Simalaotao"}, {"name": "Yoshio Miura"}, {"name": "Yuya Sakuraba"}, {"name": "Tetsunori Koda"}], "featured_authors": [{"name": "Ao Nakagawa"}, {"name": "Ryo Toyama"}, {"name": "Keisuke Masuda"}, {"name": "Yoshio Miura"}, {"name": "Yuya Sakuraba"}, {"name": "Tetsunori Koda"}], "author_count": 9}, {"id": "2604.26300", "category": "cond-mat", "title": "Strain and Twist Engineering of Interfacial Thermal Transport in Homo- and Hetero-Interfaces of Graphene and Hexagonal Boron Nitride", "abstract": "A dramatic difference between the vertical thermal conductance response of homogeneous and heterogeneous graphene/h-BN interfaces to external mechanical perturbations, is predicted. Homogeneous graphene and h-BN interfaces exhibit strong conductance reduction for both in-plane strain and interfacial twist. Conversely, the vertical thermal conductance of the heterogeneous graphene/h-BN junction is insensitive to twist deformations but shows significant increase or decrease under compressive or tensile strains, respectively. Our atomistic simulations predictions are rationalized by Fermi's golden rule and density of phonon modes analyses, indicating that vertical phonons and local stacking configurations have a central role in the interlayer heat transport behavior. A simple phenomenological model, based on local interlayer distance and stacking, captures well the dependence of vertical heat conductance on strain and twist deformations.", "url": "https://arxiv.org/abs/2604.26300", "type": "理论+数值", "summary": "1. 该工作通过原子尺度模拟预测了同质与异质石墨烯/六方氮化硼界面在面内应变与面外扭转下垂直热导响应的显著差异，其中同质界面热导均强烈下降，异质界面则对扭转不敏感而对应变呈非单调变化。\n2. 物理要点在于揭示垂直声子模与局部堆垛构型对层间热输运的决定性作用，基于费米黄金法则与声子态密度分析阐释差异机制，并构建依赖局域层间距与堆垛的唯象模型准确再现热导随形变的演化。\n3. 这一发现为通过应变与扭转工程灵活调控二维材料异质结的界面热传导提供了明确物理图像，对发展可变形热管理器件具有重要指导意义。", "summary_source": "deepseek", "authors": [{"name": "Wenwu Jiang"}, {"name": "Huasong Qin"}, {"name": "Yilun Liu"}, {"name": "Wengen Ouyang"}, {"name": "Oded Hod"}, {"name": "Michael Urbakh"}], "featured_authors": [{"name": "Wenwu Jiang"}, {"name": "Huasong Qin"}, {"name": "Yilun Liu"}, {"name": "Wengen Ouyang"}, {"name": "Oded Hod"}, {"name": "Michael Urbakh"}], "author_count": 6}, {"id": "2604.26346", "category": "cond-mat", "title": "Coexistence of patterned phases in chemically active multicomponent mixtures", "abstract": "Chemically active mixtures exhibit complex patterns that emerge from the interplay of physical interactions and reactions among components. Individually, these two processes are well-understood: Physical interactions can give rise to phase separation, whereas reactions can form reaction-diffusion patterns. To understand the combination of both processes, we identify a Lyapunov functional for a class of chemical reactions. By minimizing this functional, we identify a generalized Gibbs phase rule that governs the number of coexisting patterns, and we demonstrate that complex patterns can be created by the modular combination of independent phases. Our theory unveils complex stationary patterns in chemically active mixtures and provides a framework for analyzing more complex systems.", "url": "https://arxiv.org/abs/2604.26346", "type": "理论", "summary": "1. 该工作通过构建化学反应体系的Lyapunov泛函，揭示了化学活性多组分混合物中物理相分离与反应-扩散图案共存的机制。\n2. 其核心在于极小化该泛函导出一个广义吉布斯相律，预言共存图案数目由独立相的模块化组合控制。\n3. 这为理解活性混合物中复杂稳态图案的形成提供了统一理论框架，并可推广至更一般化学反应体系。", "summary_source": "deepseek", "authors": [{"name": "Chengjie Luo"}, {"name": "Yicheng Qiang"}, {"name": "Guido L. A. Kusters"}, {"name": "David Zwicker"}], "featured_authors": [{"name": "Chengjie Luo"}, {"name": "Yicheng Qiang"}, {"name": "Guido L. A. Kusters"}, {"name": "David Zwicker"}], "author_count": 4}, {"id": "2604.26428", "category": "cond-mat", "title": "A Theoretical Investigation of the Thermal and Photochemical Mechanisms of Ethylbenzene Dehydrogenation on Rutile TiO$_{2}$(110)", "abstract": "This master's thesis investigates the thermal and photochemical dehydrogenation of ethylbenzene (EB) to styrene on the rutile TiO$_{2}$(110) surface. A dual-methodological quantum chemical approach is used for this investigation. While industrial styrene production is energy-intensive, photocatalysis on semiconductor materials offers a promising alternative under significantly milder conditions. To elucidate the underlying mechanisms, this study employs density functional theory (DFT-PBE-D3) for geometry optimization and high-level multi-reference methods (SA-CASSCF) to accurately describe the electronic complexity of excited states and radical intermediates. The investigation reveals that, on the stoichiometric surface, both thermal and photochemical pathways are dominated by proton-coupled electron transfer (PCET). The wavelength dependence observed in the literature is explained by how the system navigates electronic manifolds. 343 nm irradiation leads to rapid relaxation into the ground state, where high kinetic barriers persist. In contrast, 257 nm excitation enables the system to persist in higher excited states (S1/T2). This allows the reaction to bypass the rate-determining ground-state barrier. Furthermore, the study demonstrates that surface oxidation causes a fundamental mechanistic shift. On oxidized surfaces, pre-adsorbed oxygen radicals (O$_{Ti}$) enable direct hydrogen atom transfer (HAT), which is more efficient than PCET on reduced surfaces. This \"hydrogen scavenger\" effect explains the significant increase in styrene yield. This work underscores the necessity of multi-reference treatments for complex surface reactions and provides a fundamental understanding of how surface stoichiometry and photon energy govern photocatalytic efficiency.", "url": "https://arxiv.org/abs/2604.26428", "type": "理论+数值", "summary": "1. 本工作采用DFT与多参考方法相结合的理论手段，研究了乙苯在金红石TiO₂(110)表面上热与光化学脱氢生成苯乙烯的机理。\n2. 其核心发现是揭示了从化学计量表面的质子耦合电子转移（PCET）到氧化表面的直接氢原子转移（HAT）的机制转变，并阐明了343 nm与257 nm激发波长差异源于不同电子态弛豫路径绕过的势垒。\n3. 这为理解表面化学计量和光子能量如何调控光催化效率提供了微观基础，并强调了多参考方法在复杂表面反应研究中的必要性。", "summary_source": "deepseek", "authors": [{"name": "Nico Yannik Merkt"}], "featured_authors": [{"name": "Nico Yannik Merkt"}], "author_count": 1}, {"id": "2604.26445", "category": "cond-mat", "title": "Geometry-Based Neural-Network Prediction of Electron Localization Function Topology in Dense Hydrogen", "abstract": "We develop a machine-learning framework to predict the electron localization function (ELF) of pure, dense hydrogen directly from atomic geometry, bypassing explicit electronic-structure calculations. Trained on first-principles data spanning multiple pressure regimes in dense fluid hydrogen, the model achieves high accuracy ($R^2 > 0.99$) and faithfully reproduces the global distribution of the ELF. A combined real- and reciprocal-space analysis reveals that the residual error is dominated by smooth, long-wavelength components with correlation lengths exceeding typical H--H bonding scales, and that the magnitude of these components increases systematically with pressure. Despite being trained exclusively on dense fluid hydrogen networks, the model transfers robustly to crystalline hydrogen configurations, preserving key features of ELF topology, including critical points and hydrogen-network connectivity. Taken together, these results suggest a viable route toward geometry-based, high-throughput evaluation of hydrogen-networking characteristics in both fluid and crystalline hydrogen.", "url": "https://arxiv.org/abs/2604.26445", "type": "理论+数值", "summary": "1. 该工作发展了基于原子几何直接预测致密氢电子局域化函数(ELF)拓扑的机器学习框架，无需显式电子结构计算。\n2. 跨压力区间的第一性原理训练达成高精度（R²>0.99），残差由超过H-H关联尺度的长波成分主导且随压力增强，模型从流体氢鲁棒迁移至晶体氢，保留ELF临界点与网络连通性。\n3. 这为实现基于几何、高通量评估流体与晶态氢网络特性及电子拓扑演化提供了可行途径。", "summary_source": "deepseek", "authors": [{"name": "Xiaoyu Wang"}, {"name": "Miriam Marqués"}, {"name": "Sergio Gómez"}, {"name": "Francesc Serratosa"}, {"name": "Eva Zurek"}, {"name": "Julia Contreras-García"}], "featured_authors": [{"name": "Xiaoyu Wang"}, {"name": "Miriam Marqués"}, {"name": "Sergio Gómez"}, {"name": "Francesc Serratosa"}, {"name": "Eva Zurek"}, {"name": "Julia Contreras-García"}], "author_count": 6}, {"id": "2604.26510", "category": "cond-mat", "title": "Influence of a graphene substrate on the stabilization of molecular systems with hydrogen bonds", "abstract": "Numerical simulation of the dynamics of planar two- and three-layer molecular structures formed by $\\beta$-sheets of polyglycine peptide chains and systems of parallel Kevlar (para-aramid) molecules placed on a graphene sheet has been performed. It is shown that in these structures the $\\beta$-sheets retain their shape, due to the presence of parallel chains of hydrogen bonds, up to a temperature of $T=800$K. An even higher stability is exhibited by the system of parallel Kevlar molecules. Here, the parallel chains of hydrogen bonds between peptide groups of neighboring molecules are preserved even at higher temperatures. The performed modeling allows us to conclude that the addition of graphene to Kevlar fibers can significantly increase their thermal stability.", "url": "https://arxiv.org/abs/2604.26510", "type": "理论+数值", "summary": "1. 该工作利用分子动力学模拟，系统研究了置于石墨烯基底上的聚甘氨酸β-折叠片（两层及三层平面结构）与平行凯夫拉分子体系中氢键网络的热稳定性行为。\n2. 模拟的核心发现是石墨烯基底能显著强化这些结构中的并行氢键链：β-折叠片在800K下仍保持其形状，而凯夫拉分子间的氢键链在更高温度下仍稳定存在，展示了更强的热耐受性。\n3. 这一结果明确支持了将石墨烯掺入凯夫拉纤维以提升其热稳定性的策略，为设计耐高温聚合物复合材料提供了重要的理论指导与微观机制理解。", "summary_source": "deepseek", "authors": [{"name": "Alexander V. Savin"}], "featured_authors": [{"name": "Alexander V. Savin"}], "author_count": 1}, {"id": "2604.26528", "category": "cond-mat", "title": "Phases and dynamics of an impurity immersed in one-dimensional quantum droplets", "abstract": "We explore the ground-state properties of a single impurity immersed in a one-dimensional quantum droplet medium formed by a two-component Bose mixture. Relying on ab-initio simulations, we demonstrate that tuning the impurity-droplet interactions allows to controllably reshape the droplets density profiles and associated correlation patterns. For attractive impurity-medium couplings, the impurity becomes localized within the droplet which exhibits a density hump at the vicinity of the impurity, while repulsive interactions facilitate their phase-separation. Comparing our many-body results to the appropriate extended Gross-Pitaevskii description, we find adequate agreement for the droplet density profiles, with the effective field approach systematically overestimating impurity localization. Following a release of the external trap, we unveil that the sign and magnitude of the interactions between the impurity and the droplet hosts dictate the response of the three-component setting which experiences expansion unless strongly attractive intercomponent couplings are present. These results corroborate the role and presence of correlations in impurity-droplet mixtures and inspire future investigations on impurity physics for probing droplet configurations.", "url": "https://arxiv.org/abs/2604.26528", "type": "数值", "summary": "1. 该工作通过从头算模拟研究了一组杂质浸入两组分玻色混合物形成的一维量子液滴中的基态性质与动力学。\n2. 主要物理亮点在于揭示杂质-液滴相互作用的吸引或排斥可分别诱导杂质局域化导致液滴密度凸起或相分离，且多体效应使扩展Gross-Pitaevskii描述系统高估杂质局域化。\n3. 这证实了关联在杂质-液滴混合物中的关键作用，并为利用杂质作为探针诊断量子液滴内部构型及研究多组分超冷原子混合物的膨胀响应提供了启发。", "summary_source": "deepseek", "authors": [{"name": "Dimitrios Diplaris"}, {"name": "Ilias A. Englezos"}, {"name": "Friethjof Theel"}, {"name": "Peter Schmelcher"}, {"name": "Simeon I. Mistakidis"}], "featured_authors": [{"name": "Dimitrios Diplaris"}, {"name": "Ilias A. Englezos"}, {"name": "Friethjof Theel"}, {"name": "Peter Schmelcher"}, {"name": "Simeon I. Mistakidis"}], "author_count": 5}, {"id": "2604.26560", "category": "cond-mat", "title": "Unraveling the symmetry of Al5C3N", "abstract": "The high-temperature ceramic compound Al5C3N with promising application usage belongs to the scarcely studied Al-C-N system. It was originally reported as an ordered compound in the non-centrosymmetric space group P63mc and described as a nanolaminate with an -Al2C-AlN-Al2C2- stacking sequence. The recently reported structural disorder in the related compound Al4SiC4 led us to question this proposed structure for Al5C3N and investigate the possibility of a disordered structure in the centrosymmetric space group P63/mmc. In the present work, we employed different synthesis routes to maximize the yield and quality of the desired phase, and applied a variety of techniques to probe the Al5C3N crystal structure. Our single-crystal X-ray diffraction analysis clearly indicates that the non-centrosymmetric space group P63mc must be rejected. From a joint refinement of single-crystal X-ray and powder neutron diffraction data, the occupancies of C and N were refined at two sites in P63/mmc resulting in the stacking sequence -Al2C-Al(C/N)-Al2(C/N)2-. Furthermore, DFT calculations show that a centrosymmetric disordered structure described in a supercell has the lowest energy, 0.2 eV per formula unit, relative to the previously reported P63mc structure. The calculated band structure shows both direct and indirect band gaps which lead to implications for the physical properties. Finally, STEM analysis provides additional evidence that the crystal structure of Al5C3N is better described in the centrosymmetric space group P63/mmc.", "url": "https://arxiv.org/abs/2604.26560", "type": "理论+数值", "summary": "1. 本工作通过单晶X射线衍射、粉末中子衍射联合精修及DFT计算，否定了Al5C3N原报的非中心对称P63mc空间群，确定其结构为中心对称P63/mmc，堆叠序列为-Al2C-Al(C/N)-Al2(C/N)2-。\n2. 核心证据来自三方面：单晶衍射明确排除P63mc；联合精修给出C/N在P63/mmc中两个位点的占据数；超胞DFT计算显示中心对称无序结构比原结构每分子式低0.2 eV。\n3. 该修正为Al-C-N体系的结构理解提供了准确基础，并暗示其能带中同时存在直接与间接带隙，对高温陶瓷应用中的物理性质调控具有指导意义。", "summary_source": "deepseek", "authors": [{"name": "Vitalii Shtender"}, {"name": "Chin Shen Ong"}, {"name": "Pedro Berastegui"}, {"name": "Olivier Donzel-Gargand"}, {"name": "Johan Cedervall"}, {"name": "Charles Hervoches"}, {"name": "Premek Beran"}, {"name": "Olle Eriksson"}, {"name": "Ulf Jansson"}], "featured_authors": [{"name": "Vitalii Shtender"}, {"name": "Chin Shen Ong"}, {"name": "Pedro Berastegui"}, {"name": "Premek Beran"}, {"name": "Olle Eriksson"}, {"name": "Ulf Jansson"}], "author_count": 9}, {"id": "2604.26599", "category": "cond-mat", "title": "Effective length scales, dispersion relations, and discrete densities of states for Laplacian eigenvectors on complex networks", "abstract": "To construct dispersion relations for diffusion or oscillation processes on random networks, it is necessary to obtain effective length scales for the eigenvectors of a graph Laplacian matrix, whose eigenvalues represent inverse time scales. For this purpose, we adapt a method originally introduced in condensed-matter physics to estimate correlation lengths for disordered materials as the ratio of volume to interface area [P. Debye, H.R. Anderson and H. Brumberger, J. Appl. Phys. 28, 679 (1957)]. In a graph setting of vertices connected by edges, we interpret this as the ratio of twice the total number of edges to the number of edges connecting vertices bearing values of different sign on the particular eigenvector. After describing the method and the necessary concepts in pedagogical detail, we apply it to nine different graphs representing natural and artificial networks, including two tree graphs without and with random shortcuts, the nervous system of a roundworm, a food web, a social network of dolphins, an electrical power grid, and a model porous material. The results identify both distributed and localized eigenvectors. They are given in graphical format showing example eigenvectors, dispersion relations, and discrete densities of states, as well as tables summarizing the main numerical results.", "url": "https://arxiv.org/abs/2604.26599", "type": "理论+数值", "summary": "1. 该工作将凝聚态物理中基于体积与界面面积之比的关联长度估计方法改编至复杂网络，用于定义图拉普拉斯特征向量的有效长度尺度，进而构建扩散与振荡过程的色散关系和离散态密度。\n2. 其技术核心在于将有效长度表述为图拓扑量——两倍总边数与连接异号顶点边数之比，从而从特征向量符号分布提取空间尺度，该方法在树图、神经网络、食物网、电网等九种网络中得到验证。\n3. 这一方法为网络系统中的波矢与频率对应关系提供了类似连续介质的描述，有望推广至网络输运、振动局域化及随机动力学等问题的定量分析。", "summary_source": "deepseek", "authors": [{"name": "Per Arne Rikvold"}], "featured_authors": [{"name": "Per Arne Rikvold"}], "author_count": 1}, {"id": "2604.26627", "category": "cond-mat", "title": "Electronic structure, quasiparticle renormalizations, and magnetic correlations in the alternating single-layer bilayer nickelate La$_5$Ni$_3$O$_{11}$", "abstract": "Using DFT+DMFT we study the normal-state electronic structure and magnetic correlations of the recently discovered alternating single-layer bilayer Raddlesden-Popper nickelate La$_5$Ni$_3$O$_{11}$ (1212-LNO). Our results exhibit qualitative differences for the structurally distinct single-layer and bilayer Ni ions, implying the importance of confinement and orbital-dependent correlations. The Ni $e_g$ electronic states originating from the bilayer Ni ions form strongly renormalized quasiparticle bands with a large enhancement factor $m^*/m \\sim 3.5$ and 4.2 for the Ni $x^2-y^2$ and $3z^2-r^2$ orbitals, respectively. Moreover, the $e_g$ states of the single-layer Ni ions exhibit an orbital-selective Mott insulating state, with a narrow energy gap for the Ni $3z^2-r^2$ states and metallic, strongly incoherent (non-Fermi-liquid) Ni $x^2-y^2$ ones. Our analysis of magnetic correlations suggests the formation of intertwined spin and charge density wave stripes in the bilayer NiO$_6$ slab, in close similarity to the double-layer material. We refine two major instabilities, a leading one is associated with a wave vector ${\\bf Q}=(\\frac{1}{3},\\frac{1}{3})$ (``up-down-0\" spin pattern), competing with the bicollinear $(\\frac{1}{4},\\frac{1}{4})$ (``up-up-down-down\") stripe state. The single-layer Ni $3d$ electrons exhibit instability towards the Néel-type magnetic state. Under pressure, 1212-LNO undergoes an orbital-selective Mott insulator-to-metal phase transition, associated with metallization of the single-layer Ni $e_g$ states. As a result, the single-layer Ni $e_g$ bands exhibit non-Fermi-liquid (bad metal) behavior with strongly incoherent spectral weights near $E_F$. We note that correlation effects result in a reconstruction of magnetic correlations as compared to that obtained within DFT. In fact, we observe a crossover from single-layer to double-layer dominated magnetic correlations.", "url": "https://arxiv.org/abs/2604.26627", "type": "理论+数值", "summary": "1. 该工作运用DFT+DMFT方法系统研究了交替单层-双层Ruddlesden-Popper镍氧化物La5Ni3O11的常态电子结构、准粒子重整化及磁关联。\n2. 核心物理发现包括：双层Ni的e_g轨道形成强重整化准粒子带（有效质量增强因子约3.5–4.2）；单层Ni呈现轨道选择性莫特绝缘态（3z²–r²窄能隙与x²–y²强非费米液体行为）；磁关联分析揭示双层NiO6层中竞争的自旋电荷密度波条纹（主导波矢(1/3,1/3)与(1/4,1/4)），且单层Ni倾向于奈尔型磁序。\n3. 该工作阐明了限域效应与轨道自由度对关联电子行为的决定性作用，为理解交替层状镍氧化物中的量子相变及压力诱导轨道选择性金属化提供了理论框架，并指出磁关联可从单层向双层主导进行交叉。", "summary_source": "deepseek", "authors": [{"name": "I. V. Leonov"}], "featured_authors": [{"name": "I. V. Leonov"}], "author_count": 1}, {"id": "2604.26636", "category": "cond-mat", "title": "Revealing magnetism in the distorted kagome $R$Ti$_3$Bi$_4$ ($R$ = Nd, Sm, Gd) via ARPES and XMCD", "abstract": "Kagome materials are known for hosting emergent quantum phenomena driven by the interaction between different lattice, charge and spin orders. Here, we present a detailed angle resolved photoemission (ARPES), density functional theory (DFT) and x-ray magnetic circular dichroism (XMCD) study of the electronic and magnetic structure of $R$Ti$_3$Bi$_4$ ($R$ = Nd, Sm, Gd). ARPES and DFT demonstrate that the bulk electronic band structure is dominated by the hybridization of the Ti bands, and the weak electron-like pocket at $\\Gamma$ is identified as a surface state. The isotropic XAS profile of the $M_{4,5}$-edge of the rare earth is consistent with the presence of $R^{3+}$ oxidation state. Using the XMCD sum rules, backed by the atomic multiplet theory calculations, we obtain the spin and orbital magnetic moments. The Ti $L_{2,3}$-edge XMCD reveals the presence of a small magnetic moment in GdTi$_3$Bi$_4$, presumably driven by the proximity of the {Ti} kagome layers to the $zigzag$ chains of Gd, while the total magnetic moment of Gd is shared by the $f$ and $d$ electrons. Our combined XMCD, ARPES and DFT study brings an important piece of information to understand the spin flip transitions and anomalous Hall effect observed in the $R$Ti$_3$Bi$_4$ kagome metals.", "url": "https://arxiv.org/abs/2604.26636", "type": "理论+数值", "summary": "1. 该工作联合ARPES、XMCD和DFT，系统研究了扭曲kagome金属RTi₃Bi₄ (R=Nd,Sm,Gd)的电子结构与磁性。\n2. 通过XMCD求和规则与原子多重态计算定量提取稀土与Ti位的自旋和轨道磁矩，发现GdTi₃Bi₄中Ti层因近邻Gd锯齿链诱导出微弱磁矩。\n3. 这为理解该类kagome金属中自旋翻转跃迁与反常霍尔效应的微观起源提供了关键的电子与磁结构信息。", "summary_source": "deepseek", "authors": [{"name": "C. Lim"}, {"name": "F. Ballester"}, {"name": "A. Kar"}, {"name": "M. Alkorta"}, {"name": "D. Subires"}, {"name": "J. Dai"}, {"name": "M. Tallarida"}, {"name": "E. Vescovo"}, {"name": "T. K. Kim"}, {"name": "C. Cacho"}, {"name": "C. Yi"}, {"name": "S. Roychowdhury"}, {"name": "A. Kumar Sharma"}, {"name": "Y. Choi"}, {"name": "G. Fabbris"}, {"name": "J. Strempfer"}, {"name": "P. Gargiani"}, {"name": "C. Shekhar"}, {"name": "C. Felser"}, {"name": "I. Errea"}, {"name": "M. G. Vergniory"}, {"name": "S. Blanco-Canosa"}], "featured_authors": [{"name": "C. Lim"}, {"name": "F. Ballester"}, {"name": "A. Kar"}, {"name": "I. Errea"}, {"name": "M. G. Vergniory"}, {"name": "S. Blanco-Canosa"}], "author_count": 22}, {"id": "2604.26697", "category": "cond-mat", "title": "Predicting massive helium-3 release from metal tritides using simple mechanical modeling", "abstract": "This letter is presenting a simple but effective mechanism that explains why ,during tritium aging, metal tritides retain most helium-3 for years and then suddenly release massive amount. The mechanism is based on the hypothesis that dislocations blocking could explain the sudden change of behavior. The modeling of this phenomenon combine a mechanical and microstructural approach. The calculations made with this mechanism fit all the aging data acquired on aged palladium tritide", "url": "https://arxiv.org/abs/2604.26697", "type": "理论+数值", "summary": "1. 该工作基于位错阻塞假说，提出一个结合力学与微观结构的简单模型，用以预测金属氚化物在氚老化过程中突然大量释放氦-3的行为。\n2. 其卖点在于揭示位错阻塞机制导致氦-3长期保留后瞬间释放的物理图像，且模型计算精确拟合钯氚化物所有老化数据。\n3. 这为理解金属氚化物中氦行为的突变提供了可定量描述的机制，对未来氚储存材料的设计和老化评估具有明确指导意义。", "summary_source": "deepseek", "authors": [{"name": "Berengere Evin"}, {"name": "Dorian Gaboriau"}, {"name": "Mathieu Segard"}, {"name": "Sylvain Challet"}, {"name": "Arnaud Fabre"}, {"name": "Stephanie Thiebaut"}], "featured_authors": [{"name": "Berengere Evin"}, {"name": "Dorian Gaboriau"}, {"name": "Mathieu Segard"}, {"name": "Sylvain Challet"}, {"name": "Arnaud Fabre"}, {"name": "Stephanie Thiebaut"}], "author_count": 6}, {"id": "2604.26698", "category": "cond-mat", "title": "Metalization of topological insulators", "abstract": "In modern condensed matter theory, phases of electronic matter--such as metals and insulators-are fundamentally distinguished by the presence or absence of charge-carrying quasiparticles or excitations near the Fermi surface at low temperatures. Here, we show that this criterion breaks down in Berry-curvature-dominated systems, where transport is governed by interband coherence across the entire Fermi sea. We develop a microscopic theory of quantum transport in bulk topological insulators with a vanishing density of states at the Fermi energy, for which the conventional Drude contribution is absent. We demonstrate that impurity-scattering-induced coherence decay generates a distinct longitudinal transport channel even in the topologically trivial regime, with edge contributions rigorously excluded. This mechanism yields a finite longitudinal conductivity even in the absence of carriers at the Fermi level and exhibits an unconventional scaling linear in impurity density in the dilute limit, in stark contrast to Drude behaviour. Importantly, this decoherence-induced conductance is inversely proportional to temperature, reminiscent of strange-metal behaviour, most prominently observed in cuprate superconductors above their critical temperature. Our findings reveal quantum decoherence as a fundamental origin of longitudinal transport beyond the Drude paradigm, challenging the traditional distinction between metals and insulators.", "url": "https://arxiv.org/abs/2604.26698", "type": "理论", "summary": "1. 该工作指出传统基于费米面载流子的金属-绝缘体判据在贝里曲率主导系统中失效，并发展了费米能处态密度为零的拓扑绝缘体中的量子输运微观理论。\n2. 其核心在于揭示杂质散射导致的量子退相干效应产生纵向输运通道，电导率在稀极限下与杂质密度线性相关且与温度成反比，呈现类似奇异金属行为。\n3. 这为超越Drude图景的输运机制提供了新范例，挑战了金属与绝缘体的传统区分，并启发对退相干在拓扑材料中作用的进一步研究。", "summary_source": "deepseek", "authors": [{"name": "Xian-Peng Zhang"}, {"name": "Yan-Qing Feng"}, {"name": "Ji-Feng Shao"}, {"name": "Haiwen Liu"}, {"name": "Yugui Yao"}], "featured_authors": [{"name": "Xian-Peng Zhang"}, {"name": "Yan-Qing Feng"}, {"name": "Ji-Feng Shao"}, {"name": "Haiwen Liu"}, {"name": "Yugui Yao"}], "author_count": 5}, {"id": "2604.26739", "category": "cond-mat", "title": "Universal magnetotunnel conductance at a Weyl semimetal-layered Chern insulator junction", "abstract": "We investigate electronic transport across a junction between a Weyl semimetal (WSM) and a layered Chern insulator (LCI) in the presence of a magnetic field perpendicular to the interface. The topological mismatch between the gapless Weyl semimetal and the momentum-resolved chiral edge modes of the layered Chern insulator leads to interface Fermi-arc states with a qualitatively distinct connectivity: unlike WSM-WSM junctions, the interface Fermi arcs are forced to reconnect through the Brillouin-zone boundary rather than terminating at the projections of the Weyl nodes. We analyze the spectrum and compute the magneto tunnel conductance mediated by the interface-localized states. We find that the conductance increases linearly with magnetic field at low fields and saturates beyond a critical field to a constant value that is independent of microscopic details such as interface coupling, arc geometry, and lattice-scale parameters. This universal saturation reflects a transport mechanism governed by the topological charge pumping associated with the Chern layers, rather than magnetic breakdown between Fermi arcs. We further show that, under specific conditions, a junction between two distinct Weyl semimetals can exhibit a similar saturation behavior, thereby clarifying the topological origin of the observed universality.", "url": "https://arxiv.org/abs/2604.26739", "type": "理论+数值", "summary": "1. 该工作研究了垂直磁场下Weyl半金属与分层陈绝缘体结的电子输运，揭示了拓扑失配导致的界面费米弧通过布里渊区边界重构。\n2. 其核心发现是磁隧穿电导在低场线性增长、高场饱和至与界面耦合及弧几何无关的普适常数，该饱和源于陈层拓扑电荷泵浦而非磁击穿。\n3. 这建立了拓扑电荷泵浦主导输运的普适机制，为异质结界面输运和不同Weyl半金属结的类似行为提供了理论基准。", "summary_source": "deepseek", "authors": [{"name": "Nirnoy Basak"}, {"name": "Sumathi Rao"}, {"name": "Faruk Abdulla"}], "featured_authors": [{"name": "Nirnoy Basak"}, {"name": "Sumathi Rao"}, {"name": "Faruk Abdulla"}], "author_count": 3}, {"id": "2604.26767", "category": "cond-mat", "title": "Kondo transport in an anisotropic two-dimensional electron gas with quadratic momentum-dependent spin splitting", "abstract": "We investigate the transport properties of an anisotropic two-dimensional electron gas with a quadratic spin texture, described by a low-energy effective $ k\\cdot p$ model, in the presence of $S=1/2$ Kondo impurities. We develop a Green's function framework that captures the interplay between the spin texture and the Kondo scattering for calculating transport properties in such systems. Using this framework, we evaluate the longitudinal resistivity corrections $\\Delta\\rho^{xx}/\\rho^{xx}_0$ and $\\Delta\\rho^{yy}/\\rho^{yy}_0$ to third order in the $s$-$d$ exchange coupling and analyze their temperature dependence. We further determine the Kondo temperature $T_K$ and show that it is strongly suppressed with increasing quadratic spin-splitting coupling $\\alpha$. In particular, we identify a critical coupling $\\alpha_{cr}$ marking the onset of a Kondo collapse, at which $T_K$ is reduced by approximately 37\\% relative to that of the conventional two-dimensional electron gas.", "url": "https://arxiv.org/abs/2604.26767", "type": "理论+数值", "summary": "1. 本文基于低能有效k·p哈密顿量描述具有二次动量依赖自旋劈裂的各向异性二维电子气，并利用格林函数方法研究了S=1/2近藤杂质存在下的输运性质。\n2. 技术关键在于发展了同时捕获各向异性自旋纹理与近藤散射相互作用的格林函数框架，计算了沿[100]和[010]方向的纵向电阻率修正至三阶s-d耦合，并详细分析了修正量的温度依赖关系。\n3. 核心结果是近藤温度T_K随二次自旋劈裂耦合α增大而强烈抑制，在临界耦合α_cr处发生近藤塌缩，T_K较常规二维电子气降低约37%，该行为揭示了自旋纹理对近藤屏蔽的竞争性调控，为探索各向异性体系中的关联电子态提供了理论指导。", "summary_source": "deepseek", "authors": [{"name": "M. R. Parymuda"}], "featured_authors": [{"name": "M. R. Parymuda"}], "author_count": 1}, {"id": "2604.26800", "category": "cond-mat", "title": "Transport characteristics of bulk and edge states in an off-diagonal Aubry--André--Harper chain", "abstract": "We investigate quantum transport in an off-diagonal Aubry--André--Harper chain. The periodic hopping modulation generates effective internal boundaries that strongly influence the transmission characteristics. We show that edge, in-band bulk, and band-edge bulk states can be clearly distinguished through their transport signatures. In particular, bulk states near the band edges exhibit behavior similar to edge states, with weak dependence on system size, whereas in-band bulk states display pronounced size-dependent oscillations. We further demonstrate that the chain--electrode coupling strength controls the broadening of transmission resonances and drives a crossover from tunneling-dominated to nearly ballistic transport. In addition, dephasing introduces distinct sensitivity across different state classes, depending on their degree of spatial localization. These results highlight the key role of internal boundaries and quantum coherence in governing transport in modulated one-dimensional systems.", "url": "https://arxiv.org/abs/2604.26800", "type": "理论", "summary": "1. 该工作研究了非对角Aubry–André–Harper链中体态与边缘态的量子输运特性。\n2. 卖点在于发现周期性跳跃调制产生的有效内部边界使带边体态呈现类似边缘态的弱尺寸依赖性，而带内体态则表现显著的尺寸振荡，且链-电极耦合控制传输从隧穿到近弹道输运的转变。\n3. 这揭示了内部边界与量子相干在调制一维系统输运中的关键作用，为通过输运指纹区分不同态类提供了明确启发。", "summary_source": "deepseek", "authors": [{"name": "Moumita Patra"}], "featured_authors": [{"name": "Moumita Patra"}], "author_count": 1}, {"id": "2604.26827", "category": "cond-mat", "title": "Finite-Temperature Ferromagnetic Correlations of the Kagome Lattice Hubbard Model", "abstract": "The Kagome lattice Fermi-Hubbard model is one of the most physically rich, and at the same time most challenging, models to study in strongly-correlated physics. Among its special features are geometric frustration and a flat energy band that create conditions favorable to ferromagnetism near the band insulating limit. Here, we utilize two exact finite-temperature methods, the numerical linked-cluster expansion and the determinant quantum Monte Carlo, to study the extent as well as doping and interaction dependence of ferromagnetic correlations and other thermodynamic properties of the model. We find that repulsive interactions enhance ferromagnetic correlations at high electron densities and that increasing the interaction strength, extends the region with strong ferromagnetic correlations towards half filling, smoothly connecting it to Nagaoka ferromagnetism near the Mott insulating region. We also use the charge compressibility to obtain an accurate estimate for the critical interaction strength for the metal-insulator transition at half filling. These results improve our understanding of the magnetic tendencies of the model away from half filling and pave the way for further studies, including with ultracold atoms in optical lattices.", "url": "https://arxiv.org/abs/2604.26827", "type": "理论+数值", "summary": "1. 该工作采用数值链接簇展开与行列式量子蒙特卡罗两种精确有限温度方法，系统研究了Kagome晶格Hubbard模型中铁磁关联随掺杂及相互作用强度的演化。\n2. 其核心物理发现是排斥相互作用在高电子密度下增强铁磁关联，且增大互作用使强关联区从高掺杂向半填充平滑扩展，与Mott绝缘区附近的Nagaoka铁磁连接；同时利用电荷压缩性精确确定了半填充金属-绝缘体转变的临界相互作用。\n3. 这些结果深化了对几何阻挫平带系统磁性趋势的理解，为超冷原子光晶格模拟及关联电子理论在远离半填充区域的应用提供了明确基准。", "summary_source": "deepseek", "authors": [{"name": "Francisco Correia"}, {"name": "Kyle Corbett"}, {"name": "Ehsan Khatami"}], "featured_authors": [{"name": "Francisco Correia"}, {"name": "Kyle Corbett"}, {"name": "Ehsan Khatami"}], "author_count": 3}, {"id": "2604.26852", "category": "cond-mat", "title": "Largest eigenvalue and top eigenvector statistics of large Euclidean random matrices", "abstract": "Euclidean random matrices arise in a wide range of physical systems where interactions are determined by spatial configurations, including disordered media and cooperative phenomena in atomic ensembles. Unlike classical random matrix ensembles, their entries are strongly correlated through the geometry of the underlying random points, making their analytical treatment challenging. While global spectral properties such as the spectral density are relatively well understood, much less is known about extremal eigenvalues and the associated eigenvectors, despite their central role in applications. Here we address the problem of characterising the largest eigenvalue and the corresponding top eigenvector of large Euclidean random matrices with a quadratic kernel. For vectors in any dimension $d \\geq 1$ drawn independently from a common distribution, we show that both quantities can be computed within a unified replica-based framework, leading to a set of self-consistent equations involving a small number of parameters. This approach yields an explicit expression for the average largest eigenvalue, fully determined by low-order moments of the underlying distribution, and an analytical characterisation of the distribution of top eigenvector's components in the large-$N$ limit. We find that the top eigenvector exhibits a non-trivial geometric structure, with components concentrating on a hypersurface determined by the same parameters controlling the largest eigenvalue. We further perform extensive numerical simulations that confirm these predictions. More broadly, our work provides a general framework to access extremal spectral properties of Euclidean random matrices.", "url": "https://arxiv.org/abs/2604.26852", "type": "理论+数值", "summary": "1. 该工作利用基于复本的自洽方程框架，系统计算了具有二次核的大欧几里得随机矩阵的最大特征值与顶部特征向量统计。\n2. 其核心在于导出平均最大特征值仅由底层分布低阶矩决定的显式表达式，并解析揭示顶部特征向量分量在大N极限下集中于特定超曲面的非平凡几何结构。\n3. 这为无序介质及原子系综等受空间构型调控的物理体系中极端谱性质的解析与数值研究提供了可推广的理论工具。", "summary_source": "deepseek", "authors": [{"name": "Pasquale Casaburi"}, {"name": "Pierpaolo Vivo"}], "featured_authors": [{"name": "Pasquale Casaburi"}, {"name": "Pierpaolo Vivo"}], "author_count": 2}, {"id": "2604.26895", "category": "cond-mat", "title": "Quantum scattering of droplets by wells and barriers in one-dimensional Bose-Bose mixtures", "abstract": "We investigate, both analytically and numerically, the scattering of quasi-one-dimensional quantum droplets from Pöschl-Teller potential wells and barriers. For attractive wells, we find a sharp transition between complete reflection and transmission at a critical incident velocity for both small and large flat-top droplets. The scattering interactions differ: small, soliton-like droplets form a spatially symmetric trapped mode at the critical velocity, showing their compressibility and coherence characteristics, while large droplets develop a spatially asymmetric trapped state, revealing incompressibility and internal structure. The critical velocity depends non-monotonically on atom number: it rises in the small, compressible-droplet regime, falls in the incompressible, flat-top regime, and turns at the crossover point. We also show that the reflectionless well generates a $\\pi$-phase shift, strongly altering droplet-droplet collisions relative to free space. The persistence of a confined mode after collisions between trapped and incident droplets depends sensitively on their relative phase. For the repulsive barrier, we identify regimes of complete reflection, partial return, and full transmission, depending on incident velocity, barrier height, and particle number. Our predictions match direct numerical simulations in all cases.", "url": "https://arxiv.org/abs/2604.26895", "type": "理论+数值", "summary": "1. 该工作解析与数值研究了准一维玻色-玻色混合量子液滴在Pöschl-Teller势阱与势垒上的散射行为。\n2. 其核心发现在于，势阱中液滴在临界入射速度下呈现完全的反射-透射转变，小液滴形成对称束缚模显示可压缩性与相干性，而大液滴形成非对称束缚态揭示不可压缩性与内部结构，且临界速度随原子数非单调变化。\n3. 这为通过势场精确操控液滴碰撞动力学、设计量子信息处理中的相位门以及探索液滴内禀相干特性提供了可检验的理论基础。", "summary_source": "deepseek", "authors": [{"name": "Sherzod R. Otajonov"}, {"name": "Uktambek R. Eshimbetov"}, {"name": "Bakhram A. Umarov"}, {"name": "Fatkhulla Kh. Abdullaev"}], "featured_authors": [{"name": "Sherzod R. Otajonov"}, {"name": "Uktambek R. Eshimbetov"}, {"name": "Bakhram A. Umarov"}, {"name": "Fatkhulla Kh. Abdullaev"}], "author_count": 4}, {"id": "2604.25988", "category": "hep-th", "title": "On Quantum Obstructions in Type IIA Orientifolds", "abstract": "Quantum corrections can severely modify or even remove classical infinite distance limits in four-dimensional gravity theories with minimal N=1 supersymmetry. In this note we study this effect for infinite distance directions in the classical Kähler moduli sector of Type IIA orientifolds at fixed four-dimensional dilaton. We present several independent arguments why such infinite distance directions are absent at the quantum level. These involve the worldsheet theory of EFT strings and the putative asymptotically massless tower of particles. Key insights are provided by the uplift to M-theory on G2 manifolds, which allows for a unified treatment of quantum obstructions of seemingly different origin in the dual Type IIB/F-theory frame. Our results apply also to the Type IIA dual of infinite distance limits for which no quantum obstruction could be detected in the Type IIB frame in previous work. In conclusion, infinite distance limits in the part of the orientifold moduli space descending from a 4d N=2 vector multiplet sector are only possible at the quantum level if also some of the remaining moduli are taken to infinity.", "url": "https://arxiv.org/abs/2604.25988", "type": "理论", "summary": "1. 该工作基于世界面理论和有效场论弦的渐近质量塔论证，系统证明IIA定向折中Kähler模量经典无限距离极限在量子水平上被彻底阻碍。\n2. 其核心在于通过提升至G2流形上的M理论统一处理对偶框架内不同起源的量子阻碍，并指出此前IIB框架中无法检测的阻碍在IIA对偶中依然存在。\n3. 这揭示了量子模空间的结构性约束：只有当部分剩余模量同步趋于无穷时，源自N=2矢量多重态的无限距离极限才可能实现。", "summary_source": "deepseek", "authors": [{"name": "Lukas Kaufmann"}, {"name": "Timo Weigand"}, {"name": "Max Wiesner"}], "featured_authors": [{"name": "Lukas Kaufmann"}, {"name": "Timo Weigand"}, {"name": "Max Wiesner"}], "author_count": 3}, {"id": "2604.25999", "category": "hep-th", "title": "Lattice Topological Defects in Non-Unitary Conformal Field Theories", "abstract": "Topological defects play a fundamental role in the investigation of symmetries in quantum field theories. For conformal field theories in two space-time dimensions, it is possible to construct these defects using lattice models allowing ab-initio analytical and numerical computations of their characteristics. In this work, topological defects are investigated in non-unitary conformal field theories using appropriate variations of the restricted solid-on-solid models. The relevant impurity models and the corresponding defect operators are constructed for the lattice system. Numerical computations are performed for the energy spectrum, eigenvalues of the defect operators as well as thermodynamic characteristics and compared with analytical predictions. Finally, renormalization group flows between the different fixed points are analyzed using numerical methods.", "url": "https://arxiv.org/abs/2604.25999", "type": "理论", "summary": "1. 该工作利用受限固体-on-solid模型的变体，在非酉共形场论中构造晶格拓扑缺陷及相关杂质模型和缺陷算子。\n2. 通过数值计算能谱、算子本征值与热力学量并与解析预测比较，展示晶格实现非酉共形场论中拓扑缺陷的可行性。\n3. 这为非酉共形场论中缺陷与重整化群流的晶格研究提供了方法，拓展了对广义对称性和临界行为的理解。", "summary_source": "deepseek", "authors": [{"name": "Madhav Sinha"}, {"name": "Thiago Silva Tavares"}, {"name": "Hubert Saleur"}, {"name": "Ananda Roy"}], "featured_authors": [{"name": "Madhav Sinha"}, {"name": "Thiago Silva Tavares"}, {"name": "Hubert Saleur"}, {"name": "Ananda Roy"}], "author_count": 4}, {"id": "2604.26007", "category": "hep-th", "title": "Quantum mechanical bootstrap without inequalities: SYK bilinear spectrum", "abstract": "We study a quantum mechanical system whose spectrum coincides with that of bilinear operators of the Sachdev-Ye-Kitaev model. The standard positivity-based quantum mechanical bootstrap is degenerate with respect to the boundary data: it does not distinguish the boundary conditions that select the SYK spectrum, and hence is insufficient to determine the eigenvalues. Instead, by considering fractional powers of operators, we obtain constraint equations that determine the spectrum without imposing positivity. The resulting roots converge to exact eigenvalues as the truncation order increases. We call this the direct bootstrap.", "url": "https://arxiv.org/abs/2604.26007", "type": "理论", "summary": "1. 该工作针对谱与SYK模型双线性算符谱一致的量子力学系统，提出了一种无需正性不等式约束的量子力学引导方法。\n2. 其核心在于引入算符分数幂的约束方程，取代传统正性条件，从而克服标准引导因边界数据简并无法确定本征值的困难。\n3. 这为处理正性条件失效的量子系统谱问题提供了直接求解途径，有望推广至其他强关联或非厄米模型。", "summary_source": "deepseek", "authors": [{"name": "Kok Hong Thong"}, {"name": "David Vegh"}], "featured_authors": [{"name": "Kok Hong Thong"}, {"name": "David Vegh"}], "author_count": 2}, {"id": "2604.26016", "category": "hep-th", "title": "The Schrodinger Equation as a Gauge Theory", "abstract": "In this paper, we reformulate the Schrodinger equation in gauge-theoretic terms. Starting from the Madelung representation, we rewrite the conserved probability-current using gauge fields, namely a one-form gauge field in the $(2+1)$-dimensional theory and a two-form gauge field in the $(3+1)$-dimensional theory. This gives a local equivalence between the Schrodinger equation, quantum hydrodynamics, and a gauge formulation, while the global information is carried by the quantization of phase winding around zeros of the wavefunction. We then explore how this correspondence organizes structures on both sides of the duality. On the gauge side, BF couplings to additional one-forms describe electromagnetic coupling, Berry connections, spinor dynamics, projected non-abelian adiabatic connections, and intrinsic holonomy, while Chern--Simons term generate Hopf functionals, charge-flux attachment, and anyonic sectors. In the presence of boundaries, the topological terms produce edge degrees of freedom and boundary charge algebras. Finally, in the nonlinear regime with a Bogoliubov sound mode, the dual two-form description relates acoustic memory, large gauge transformations and the corresponding soft theorem, organizing them into an infrared triangle.", "url": "https://arxiv.org/abs/2604.26016", "type": "理论", "summary": "1. 该工作从Madelung表示出发，将薛定谔方程重写为含一形式或二形式规范场的规范理论形式。\n2. 其核心在于建立薛定谔方程、量子流体力学与规范表述的局部等价，并通过相位卷曲量子化承载全局信息，利用BF耦合与Chern-Simons项统一描述电磁耦合、贝里连接、任意子及边界电荷代数。\n3. 这一对偶在非线性Bogoliubov声模下，将声学记忆、大规范变换与软定理组织为红外三角形，为量子流体与规范理论的深层联系提供了统一框架。", "summary_source": "deepseek", "authors": [{"name": "Dmitry S. Ageev"}, {"name": "Vladimir A. Bykov"}], "featured_authors": [{"name": "Dmitry S. Ageev"}, {"name": "Vladimir A. Bykov"}], "author_count": 2}, {"id": "2604.26032", "category": "hep-th", "title": "$\\mathcal{H}$olographic $\\mathcal{N}$aturalness and Pre-Geometric Gravity", "abstract": "The cosmological constant (CC, $\\Lambda$) problem represents a remarkable discrepancy of about 120 orders of magnitude between the observed dark energy and its natural expectation from quantum field theory. This paper synthesizes two paradigms - holographic naturalness ($\\mathcal{HN}$) and pre-geometric gravity (PGG) - to propose a unified resolution. The $\\mathcal{HN}$ framework posits that CC stability is not a matter of radiative corrections but of quantum information and entropy. The large entropy $S_\\text{dS}\\sim M_\\text{P}^2/\\Lambda$ of the de Sitter (dS) vacuum acts as an entropic barrier, exponentially suppressing destabilizing quantum transitions. This explains why the universe remains in a high-entropy, low-CC state. We embed this within PGG, where spacetime geometry and the Einstein-Hilbert action emerge dynamically from the spontaneous symmetry breaking SO($1,4$)$\\rightarrow$SO($1,3$), driven by a Higgs-like field $\\phi^A$. Both $M_\\text{P}$ and $\\Lambda$ are generated from more fundamental parameters. Crucially, we establish a direct correspondence between the VEV $v$ of the pre-geometric Higgs field and the de Sitter entropy: $S_\\text{dS}\\sim v$ (or $v^3$). Thus, the field generating spacetime also encodes its information content. The smallness of $\\Lambda$ follows directly from the largeness of $S_\\text{dS}$, a manifestation of a large $v$. The CC is stable because a large-entropy state's decay is exponentially suppressed. Our study shows new semi-classical quantum gravity effects dynamically generate \"hairons\", particles whose mass is tied to the CC. The instability of the dS space, driven by a condensate evolution, points to a dynamical origin for dark energy. This framework inextricably links the emergence of geometry, the hierarchy of scales and the quantum-information structure of spacetime, providing a novel path toward solving the CC problem.", "url": "https://arxiv.org/abs/2604.26032", "type": "理论", "summary": "1. 该工作整合全息自然性与前几何引力框架，提出宇宙常数问题的统一解决方案。\n2. 关键卖点在于利用德西特真空的巨大熵作为熵屏障，并通过SO(1,4)→SO(1,3)自发对称破缺，将宇宙常数的小与大熵及前几何希格斯场真空期望值直接对应。\n3. 这为从量子信息与几何涌现角度理解暗能量的动力学起源，以及半经典量子引力中的毛粒子效应提供了新路径。", "summary_source": "deepseek", "authors": [{"name": "Andrea Addazi"}, {"name": "Salvatore Capozziello"}, {"name": "Giuseppe Meluccio"}], "featured_authors": [{"name": "Andrea Addazi"}, {"name": "Salvatore Capozziello"}, {"name": "Giuseppe Meluccio"}], "author_count": 3}, {"id": "2604.26038", "category": "hep-th", "title": "The Super Virasoro Minimal String from 3d Supergravity", "abstract": "The super Virasoro minimal string is defined by coupling spacelike and timelike super Liouville theories on the worldsheet. There are four different theories 0A$^\\pm$ and 0B$^\\pm$ depending on discrete choices on the worldsheet. We show that these theories arise naturally from quantization of 3d supergravity, and the amplitudes compute the dimension ($+$) or superdimension ($-$) of the space of $\\mathcal{N}=1$ superconformal blocks modulo crossing symmetry. Both 0A$^+$ and 0B$^+$ are perturbatively dual to the same matrix integral as the bosonic Virasoro minimal string, while 0B$^-$ is dual to a matrix integral with an inverse square root singularity. We show that all non-trivial perturbative amplitudes of the 0A$^-$ theory vanish.", "url": "https://arxiv.org/abs/2604.26038", "type": "理论", "summary": "1. 该工作从三维超引力出发，通过耦合类空间与类时间超Liouville理论构造了四种超Virasoro最小弦(0A^±,0B^±)，并揭示了它们与矩阵积分的对偶关系。\n2. 其核心物理卖点是将弦振幅精确对应至N=1超共形块空间(维数或超维数)模交叉对称性的计算结果，并指出0A^+与0B^+微扰对偶于玻色Virasoro最小弦的矩阵积分，0B^-对偶于带有反平方根奇点的矩阵积分，而0A^-所有非平凡微扰振幅严格为零。\n3. 该工作为超弦理论中离散对称性的角色及超引力与矩阵模型对偶提供了有力约束，并为后续研究非微扰效应和更高维对偶奠定了基础。", "summary_source": "deepseek", "authors": [{"name": "Lorenz Eberhardt"}], "featured_authors": [{"name": "Lorenz Eberhardt"}], "author_count": 1}, {"id": "2604.26045", "category": "hep-th", "title": "Euclidean volume fluctuations in de Sitter quantum gravity", "abstract": "The Euclidean formulation of quantum gravity can be interpreted in terms of a probability distribution over Riemannian manifolds. In the context of de Sitter gravity, the statistics of the total volume according to this distribution is encoded in the dependence of the partition function on the cosmological constant. We use this observation to obtain a probability distribution for the volume from known results and proposals for the de Sitter partition function, in several levels of approximation: saddle point, one loop, an all-loop and a non-perturbative proposal in 3 dimensions, and an exact result in 2 dimensions, in the context of Liouville theory. In all cases we find a reasonable behavior: in the classical limit the distribution concentrates around the classical volume, and it spreads as quantum effects are turned on. We also find as a common trend that, as quantum effects are increased, the probability distribution favors increasingly smaller universes.", "url": "https://arxiv.org/abs/2604.26045", "type": "理论", "summary": "1. 该工作利用德西特量子引力配分函数对宇宙常数的依赖关系，从鞍点、单圈、全圈、非微扰及精确解等多层次近似中提取了欧几里得体积的概率分布。\n2. 其核心发现在于量子效应增强时体积分布逐渐展宽并向更小体积偏移，且在经典极限下集中于经典体积值。\n3. 这为理解量子引力中宇宙学体积的统计涨落机制提供了明确的理论框架与可检验的数值趋势。", "summary_source": "deepseek", "authors": [{"name": "David Blanco"}, {"name": "Guillem Pérez-Nadal"}, {"name": "Bruno Sivilotti"}], "featured_authors": [{"name": "David Blanco"}, {"name": "Guillem Pérez-Nadal"}, {"name": "Bruno Sivilotti"}], "author_count": 3}, {"id": "2604.26159", "category": "hep-th", "title": "Quantum Flat Connections, KZ equations, and Integrability", "abstract": "N=2 supyersymmetric Yang-Mills theories are described in terms of a Hitchin system over a Riemann surface C. Focusing on strongly coupled Argyres-Douglas theories, we show that the corresponding flat bundle over C can be quantized such that the resulting quantum flat connection is integrable. For $sl_2$, the quantum connection takes values in $gl_2$(A) where A is an associative algebra which we explicitly describe for the cases of Painlevé I, II and IV. Moreover, we find that the quantum connection is equivalent to irregular versions of Knizhnik-Zamolodchikov (KZ) connections. Utilizing a suitable gauge transformation, one can show that the corresponding KZ equations give rise to BPZ equations.", "url": "https://arxiv.org/abs/2604.26159", "type": "理论", "summary": "1. 该工作基于Hitchin系统对强耦合Argyres-Douglas理论中的平坦丛进行量子化，构造了可积的量子平坦联络。\n2. 其核心在于sl_2情形下量子联络取值于Painlevé I、II、IV对应的结合代数A，并证明其等价于不规则KZ联络，经规范变换导出BPZ方程。\n3. 这为超对称规范理论强耦合区域的可积结构与共形场论之间建立了明确对应，提供了研究可积系统的新技术路径。", "summary_source": "deepseek", "authors": [{"name": "Sibasish Banerjee"}, {"name": "Babak Haghighat"}, {"name": "Anouchah Latifi"}], "featured_authors": [{"name": "Sibasish Banerjee"}, {"name": "Babak Haghighat"}, {"name": "Anouchah Latifi"}], "author_count": 3}, {"id": "2604.26207", "category": "hep-th", "title": "Functional Dimensional Regularization for O(N) Models", "abstract": "The novel functional dimensional regularization (FDR) scheme has proven capable of yielding results that are competitive with the state-of-the-art in the computation of critical exponents in $d=3$, while also reproducing those from the $\\varepsilon$-expansion for the Ising and other universality classes. In this work, we show that this is not a mere coincidence: by applying the scheme to the $O(N)$ universality class, we explicitly derive the flow equations and obtain critical exponents that are comparable to those obtained with higher-order non-perturbative approaches. In this case, FDR retains the features already highlighted in previous works -- namely, its efficiency and rapid convergence.", "url": "https://arxiv.org/abs/2604.26207", "type": "理论", "summary": "1. 该工作将泛函维度正规化方案应用于O(N)普适类，明确推导了重整化群流方程并计算了临界指数。\n2. 其技术卖点在于所得临界指数与高阶非微扰方法相当，同时保留了方案的高效性与快速收敛特性。\n3. 这为运用此方案高效精确地研究其他普适类及更复杂的场论模型提供了坚实依据。", "summary_source": "deepseek", "authors": [{"name": "P. Beretta"}, {"name": "A. Codello"}], "featured_authors": [{"name": "P. Beretta"}, {"name": "A. Codello"}], "author_count": 2}, {"id": "2604.26418", "category": "hep-th", "title": "Quarter-indices for basic ortho-symplectic corners", "abstract": "We study supersymmetric quarter-indices for corner configurations in 4d $\\mathcal{N}=4$ super Yang-Mills theory with orthogonal and symplectic gauge groups. For the basic Y-junctions, we obtain exact closed-form expressions for the indices by making use of the Gustafson type integral formula and the Higgsing method. We demonstrate the equality of the quarter-indices between dual configurations, providing evidence for S-duality of the corner configurations. In the special fugacity limit, the indices admit an interpretation in terms of the vacuum characters of the W-algebras of type BCD, and the Lie superalgebra $\\mathfrak{osp}(1|2N)$ as the corner vertex operator algebras.", "url": "https://arxiv.org/abs/2604.26418", "type": "理论", "summary": "1. 该工作研究了4d N=4超杨-米尔斯理
