<html lang="zh-CN">
<head>
  <meta charset="utf-8">

  <title>arXiv 2026-04-17 · Daily ArXiv Selection</title>
  <style>
    :root {
      --bg: #f6f1e8;
      --panel: rgba(255, 252, 246, 0.92);
      --text: #2d241d;
      --muted: #6d5d50;
      --line: rgba(69, 49, 32, 0.14);
      --accent: #8f3d2e;
      --accent-2: #1d5f6b;
      --theory: #7c3a2a;
      --numeric: #255b6a;
      --both: #5d4a99;
      --experimental: #2f6b39;
      --shadow: 0 18px 40px rgba(54, 32, 16, 0.12);
      --radius: 22px;
      --ui-font: "Aptos", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --title-font: "Palatino Linotype", "Noto Serif SC", Georgia, serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--ui-font);
      color: var(--text);
      background: radial-gradient(circle at top left, rgba(255,255,255,0.78), transparent 32%), radial-gradient(circle at 88% 12%, rgba(29,95,107,0.14), transparent 20%), linear-gradient(180deg, #fbf7f0 0%, var(--bg) 42%, #f2e8dc 100%);
      min-height: 100vh;
    }
    .shell { width: min(1220px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 64px; }
    .hero {
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(255,255,255,0.84), rgba(255,248,238,0.72)), linear-gradient(135deg, rgba(143,61,46,0.08), rgba(29,95,107,0.08));
      box-shadow: var(--shadow);
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.82); border: 1px solid var(--line); color: var(--muted); font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase;
    }
    h1 { margin: 18px 0 10px; font-family: var(--title-font); font-size: clamp(32px, 5vw, 54px); line-height: 1.04; letter-spacing: -0.03em; }
    .hero p { max-width: 880px; color: var(--muted); font-size: 16px; line-height: 1.7; margin: 0; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-top: 26px; }
    .stat { padding: 16px 18px; background: rgba(255,255,255,0.76); border: 1px solid var(--line); border-radius: 18px; }
    .stat .label { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
    .stat .value { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
    .controls { position: sticky; top: 12px; z-index: 3; margin-top: 22px; padding: 18px; border: 1px solid var(--line); border-radius: 24px; background: rgba(250,244,236,0.9); backdrop-filter: blur(16px); box-shadow: 0 10px 24px rgba(54,32,16,0.08); }
    .control-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 16px; }
    .field { display: flex; flex-direction: column; gap: 10px; }
    .field label { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
    .search { width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line); background: rgba(255,255,255,0.92); font: inherit; color: var(--text); }
    .chip-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .chip { border: 1px solid var(--line); background: rgba(255,255,255,0.82); color: var(--text); padding: 10px 14px; border-radius: 999px; font: inherit; cursor: pointer; }
    .chip.active { border-color: rgba(143,61,46,0.35); background: rgba(143,61,46,0.12); color: #5b2419; }
    .chip[data-type="数值"].active { border-color: rgba(37,91,106,0.35); background: rgba(37,91,106,0.12); color: #173f49; }
    .chip[data-type="理论+数值"].active { border-color: rgba(93,74,153,0.35); background: rgba(93,74,153,0.12); color: #46337d; }
    .chip[data-type="实验"].active { border-color: rgba(47,107,57,0.35); background: rgba(47,107,57,0.12); color: #214c29; }
    .meta-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 14px; color: var(--muted); font-size: 14px; }
    .paper-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 18px; margin-top: 22px; }
    .paper { display: flex; flex-direction: column; gap: 14px; padding: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 10px 24px rgba(54,32,16,0.06); }
    .paper-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .tag { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid transparent; }
    .tag.category { background: rgba(45,36,29,0.08); color: var(--text); }
    .tag.type-theory { background: rgba(124,58,42,0.1); color: var(--theory); border-color: rgba(124,58,42,0.16); }
    .tag.type-numeric { background: rgba(37,91,106,0.1); color: var(--numeric); border-color: rgba(37,91,106,0.16); }
    .tag.type-both { background: rgba(93,74,153,0.1); color: var(--both); border-color: rgba(93,74,153,0.16); }
    .tag.type-experimental { background: rgba(47,107,57,0.1); color: var(--experimental); border-color: rgba(47,107,57,0.16); }
    .paper h2 { margin: 0; font-family: var(--title-font); font-size: 22px; line-height: 1.25; letter-spacing: -0.02em; }
    .paper h2 a { color: inherit; text-decoration: none; }
    .paper h2 a:hover { color: var(--accent); }
    .paper .id { color: var(--muted); font-size: 13px; }
    .author-block { display: grid; gap: 10px; padding: 14px 16px; border-radius: 18px; background: rgba(255,255,255,0.64); border: 1px solid var(--line); }
    .author-label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .author-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .author-item { display: grid; gap: 4px; }
    .author-item strong { font-size: 14px; }
    .author-item span { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .author-note { color: var(--muted); font-size: 12px; }
    .paper .summary { margin: 0; font-size: 15px; line-height: 1.75; white-space: pre-line; }
    details { border-top: 1px solid var(--line); padding-top: 12px; }
    details summary { cursor: pointer; color: var(--accent-2); font-weight: 700; list-style: none; }
    details summary::-webkit-details-marker { display: none; }
    details p { margin: 10px 0 0; color: var(--muted); line-height: 1.72; font-size: 14px; white-space: pre-line; }
    .paper footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 6px; color: var(--muted); font-size: 13px; }
    .paper footer a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .empty { display: none; margin-top: 24px; padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 22px; background: rgba(255,255,255,0.7); }
    @media (max-width: 980px) { .control-grid { grid-template-columns: 1fr; } .controls { position: static; } }
  </style>

  <script>
    const papers = [{"id": "2604.14278", "category": "cond-mat", "title": "Controlled Loop Expansion for the Topological Heavy Fermion Model", "abstract": "We develop a controlled theoretical framework for the topological heavy fermion model relevant to magic-angle twisted bilayer graphene, where low density conduction electrons hybridize with a lattice of strongly interacting f-sites. By tracing out the localized electrons, we derive an effective action for the conduction electrons with long-range in time effective interactions, built from correlators of the single f-site problem. We identify a small hybridization-phase-space parameter resulting in a controlled loop expansion, enabling the derivation of nonperturbative results in either the interaction or the hybridization strength. To tree-level, the results are equivalent to the Hubbard I approximation. At higher loop order, we derive two key results applicable to temperatures above the flavor ordering temperature and below the on-site charging energy: 1) the quasi-particle lifetime, 2) the flavor susceptibility of the system. Remarkably, despite being strongly interacting, we find the susceptibility to accurately obey a Curie-Weiss law parametrically close to the Curie temperature.", "url": "https://arxiv.org/abs/2604.14278", "type": "理论", "summary": "1. 该工作为魔角扭曲双层石墨烯相关的拓扑重费米子模型发展了一个受控的理论框架，其中通过积分掉局域电子得到传导电子的有效作用量。\n2. 其核心在于识别了一个小的杂化相空间参数，从而实现了可控的圈图展开，可在相互作用或杂化强度任意大的情况下导出非微扰结果。\n3. 这为在高于味有序温度但低于在位库仑能的温区，精确计算准粒子寿命和系统磁化率等物理量提供了系统方法，并揭示了强关联系统中 Curie-Weiss 定律的普适性。", "summary_source": "deepseek", "authors": [{"name": "Yaar Vituri"}, {"name": "Erez Berg"}], "featured_authors": [{"name": "Yaar Vituri"}, {"name": "Erez Berg"}], "author_count": 2}, {"id": "2604.14286", "category": "cond-mat", "title": "Divergent spin conductivity on the verge of ferromagnetic quantum criticality", "abstract": "We show that the spin conductivity of a metal approaching a ferromagnetic quantum critical point exhibits divergent fluctuation corrections. This effect arises from critical spin fluctuations and constitutes a spin analog of the Aslamazov-Larkin theory of paraconductivity in superconductors. The spin current is derived in linear response within a Gaussian-level treatment of the effective action for a system with easy-plane magnetic anisotropy. We demonstrate the consistency of our spin transport theory by showing that it (i) fulfills the Ward identity and (ii) yields vanishing spin stiffness in the normal state. The critical enhancement of the spin conductivity is interpreted as incipient spin superfluidity in the quantum critical region. This is further supported by an intuitive picture based on the current-loop representation of the easy-plane ferromagnet.", "url": "https://arxiv.org/abs/2604.14286", "type": "理论", "summary": "1. 该工作研究了易面磁各向异性金属在趋近铁磁量子临界点时自旋电导率的发散涨落修正。\n2. 其核心在于建立了与超导体顺电导Aslamazov-Larkin理论对应的自旋输运理论，并通过满足Ward恒等式与正常态零自旋刚度证明了自洽性。\n3. 这一临界增强效应可解释为量子临界区域内涌现的萌芽自旋超流态，为理解强关联电子体系中的输运奇异性提供了新视角。", "summary_source": "deepseek", "authors": [{"name": "Sondre Duna Lundemo"}, {"name": "Asle Sudbø"}], "featured_authors": [{"name": "Sondre Duna Lundemo"}, {"name": "Asle Sudbø"}], "author_count": 2}, {"id": "2604.14289", "category": "cond-mat", "title": "Quantum Charge-4e Superconductivity and Deconfined Pseudocriticality in the Attractive SU(4) Hubbard Model", "abstract": "Unlike conventional charge-2e superconductors, a charge-4e superconductor exhibits long-range coherence of electron quartets rather than Cooper pairs. Clear zero-temperature realizations of charge-4e superconductivity remain rare. Here, we investigate the zero-temperature phase diagram of the attractive SU(4) Hubbard model with numerically exact, large-scale quantum Monte Carlo (QMC) simulations overcoming major technical hurdles. We identify both charge-2e and charge-4e superconducting phases. Upon increasing interaction, charge-2e correlations are suppressed and eventually vanish, while the charge-4e correlations remain robust and converge with system size, signaling the onset of a quartet-condensed phase. Interestingly, across the charge-2e--charge-4e transition, single electrons remain gapped, while charge-2e correlations exhibit a scaling behavior inconsistent with a conventional Landau description. These features are naturally captured by a fractionalized framework in which the physical charge-2e order parameter is a composite field coupled to an emergent non-Abelian gauge structure. We formulate an Sp(4) gauge-Higgs theory that realizes deconfined quantum pseudocriticality between the Higgs (charge-2e) phase and the confined (charge-4e) phase. The Sp(4) gauge-Higgs theory yields pseudocriticality through a fixed-point collision, and its one-loop collision-point exponents quantitatively track the QMC results. Our results establish charge-4e superconductivity as a bona fide zero-temperature phase, provide a simple model for future studies in a numerically exact framework, and reveal an unconventional route to superconducting criticality.", "url": "https://arxiv.org/abs/2604.14289", "type": "理论+数值", "summary": "1. 该工作通过克服关键数值障碍的大规模量子蒙特卡罗模拟，研究了吸引SU(4)哈伯德模型的零温相图，识别了电荷-2e和电荷-4e超导相。\n2. 其核心在于揭示了从电荷-2e到电荷-4e的相变伴随非常规标度行为，并通过构建Sp(4)规范-希格斯理论，以定点碰撞机制实现了对量子赝临界性的定量描述。\n3. 这为电荷-4e超导作为严格零温相提供了确证，并为研究超越朗道范式的超导临界现象提供了可精确计算的简单模型框架。", "summary_source": "deepseek", "authors": [{"name": "Zhou-Quan Wan"}, {"name": "Huan Jiang"}, {"name": "Xuan Zou"}, {"name": "Shiwei Zhang"}, {"name": "Shao-Kai Jian"}], "featured_authors": [{"name": "Zhou-Quan Wan"}, {"name": "Huan Jiang"}, {"name": "Xuan Zou"}, {"name": "Shiwei Zhang"}, {"name": "Shao-Kai Jian"}], "author_count": 5}, {"id": "2604.14293", "category": "cond-mat", "title": "Limits of validity for Migdal-Eliashberg theory: role of polarons/bi-polarons", "abstract": "It is widely believed that in an adiabatic limit a Fermi liquid state of an electron-phonon system described by Migdal-Eliashberg theory remains stable before a dressed phonon softens. Using Holstein model as a prototypical example and variational/analytic considerations we demonstrate that in a wide range of fillings both in 3D and 2D, a polaronic/bi-polaronic state emerges before phonon softening; at small filling in 3D this happens already at weak coupling. We show that a polaronic/bi-polaronic state emerges, upon increasing coupling, via an intermediate pseudogap-type mixed state, in which some fermions regain Fermi liquid behavior, yet Luttinger theorem is broken. At even larger couplings the density of states gradually approaches its form in the atomic limit.", "url": "https://arxiv.org/abs/2604.14293", "type": "理论+数值", "summary": "1. 该工作以Holstein模型为原型，结合变分与解析方法，质疑并修正了Migdal-Eliashberg理论关于绝热极限下费米液体态稳定性的普遍认知。\n2. 其核心发现是，在三维与二维广填充范围内，极化子/双极化子态会先于声子软化出现，且弱耦合下即可发生，并揭示其通过中间伪能隙混合态演变的机制。\n3. 这为重新评估Migdal-Eliashberg理论的有效范围提供了关键判据，并对理解强耦合电子-声子系统中非费米液体行为的起源具有重要启示。", "summary_source": "deepseek", "authors": [{"name": "Nikolay Prokof'ev"}, {"name": "Ilya Esterlis"}, {"name": "Artem Abanov"}, {"name": "Andrey Chubukov"}], "featured_authors": [{"name": "Nikolay Prokof'ev"}, {"name": "Ilya Esterlis"}, {"name": "Artem Abanov"}, {"name": "Andrey Chubukov"}], "author_count": 4}, {"id": "2604.14294", "category": "cond-mat", "title": "Breakdown of the Migdal-Eliashberg theory for electron-phonon systems. Role of polarons/bi-polarons", "abstract": "The Migdal-Eliashberg theory (MET) describes electrons interacting with phonons in the adiabatic limit when the phonon Debye frequency is much smaller than the Fermi energy. A conventional belief is that MET holds even at strong coupling, when electron self-energy is large, and breaks down only near the point where the dressed phonon spectrum softens to near zero. We analyze numerically and analytically a different option -- collapse to a polaronic/bipolaronic ground state. The last scenario has never been analyzed in precise quantitative terms for a generic electron density. Using variational considerations, we establish rigorous upper bounds on the coupling $\\lambda$, at which a FL state transforms into the bipolaron/polaron state. We show that at small and near-maximum densities, this happens well before a dressed phonon softens. This is true both in 2D and 3D systems; in the latter the upper bound on $\\lambda$ tends to zero in the limit of small or near-full density. We present analytical reasoning for this behavior based on hints extracted from exact diagrammatic treatment of the on-site Holstein model for the spin polarized case and argue that polarons are produced by fermions with energies comparable to the bandwidth; i.e., polaron formation is outside the realm of MET. Closer to half-filling, the leading instability upon increasing $\\lambda$ is towards a charge-density-wave state (CDW), and there exists a strong coupling regime of MET near this instability, while the polaron/bipolaron state develops at larger $\\lambda$ out of a CDW-ordered state and inherits a CDW order over some range of coupling.", "url": "https://arxiv.org/abs/2604.14294", "type": "理论+数值", "summary": "1. 该工作通过变分方法确立了电子-声子系统中费米液体态转变为极化子/双极化子基态时耦合强度λ的严格上界。\n2. 研究揭示在低密度和近满填充情况下，这一转变远在缀饰声子谱软化之前发生，且转变边界随密度呈现非平庸依赖关系。\n3. 这丰富了强耦合区相图的理解，并为超越MET描述的极化子物理建立了定量基准。", "summary_source": "deepseek", "authors": [{"name": "Andrey Chubukov"}, {"name": "Ilya Esterlis"}, {"name": "Artem Abanov"}, {"name": "Nikolay Prokof'ev"}], "featured_authors": [{"name": "Andrey Chubukov"}, {"name": "Ilya Esterlis"}, {"name": "Artem Abanov"}, {"name": "Nikolay Prokof'ev"}], "author_count": 4}, {"id": "2604.14295", "category": "cond-mat", "title": "Topologically non-trivial gap function and topology-induced time-reversal symmetry breaking in a superconductor with singular dynamical interaction", "abstract": "In many strongly correlated electron systems, non-Fermi liquid behavior and unconventional superconductivity can be viewed as emerging from an effective 4-fermion interaction with a singular frequency dependence. A pairing instability in such a system is qualitatively different from that in a Fermi liquid and generally gives rise to multiple pairing states with topologically distinct gap functions. However, in the systems studied so far, a topologically trivial solution has the lowest energy. Here we show that a repulsive Hubbard-type interaction with a finite cutoff added to a model with a singular dynamical interaction selects, in some parameter range, the theretofore subleading, topologically nontrivial solution. We consider a minimal model that displays this behavior and show that the transformation between the topologically trivial and nontrivial gap functions necessarily occurs via an intermediate phase with topology-induced breaking of time-reversal symmetry.", "url": "https://arxiv.org/abs/2604.14295", "type": "理论", "summary": "1. 本工作通过引入具有有限截断的排斥性哈伯德型相互作用，证明了在奇异动力学相互作用模型中，特定参数范围内拓扑非平凡的能隙函数可成为能量最低的配对态。\n2. 核心物理在于揭示了从拓扑平凡到非平凡能隙函数的转变必然通过一个中间相实现，该中间相具有由拓扑诱导的时间反演对称性破缺特征。\n3. 这为理解强关联电子体系中奇异动力学相互作用所催生的非费米液体行为与非常规超导电性之间的竞争，以及探索其中可能存在的拓扑相变路径提供了新的理论视角。", "summary_source": "deepseek", "authors": [{"name": "Yue Yu"}, {"name": "Andrey V. Chubukov"}], "featured_authors": [{"name": "Yue Yu"}, {"name": "Andrey V. Chubukov"}], "author_count": 2}, {"id": "2604.14304", "category": "cond-mat", "title": "Self-contact in a buckled elastica", "abstract": "We explore the mechanics of a terminally loaded buckled elastica under frictionless self-contact. With the aid of two integrals associated with the elastica, we propose a scale-invariant condition necessary for the onset of contact. The condition is independent of the boundary conditions, does not involve the position vectors of the material points, and delivers the value of the compressive load at which self-contact initiates. Furthermore, we show that one of the two integrals, namely the \\emph{Hamiltonian}, persists after contact. We compute post-contact configurations of modes three through ten for a pinned-pinned buckled elastica. At a given value of the compressive load, we report multiple post-contact configurations for modes eight and nine. Finally, we show that an infinite force is required to transition from a point contact to a line contact in symmetric post-contact configurations of odd modes.", "url": "https://arxiv.org/abs/2604.14304", "type": "理论", "summary": "1. 本研究系统分析了终端加载屈曲弹性杆在无摩擦自接触下的力学行为，利用弹性杆的两个积分推导出接触起始的尺度不变条件，并对钉扎-钉扎边界条件下模式三至十的接触后构型进行了数值计算。\n2. 其核心创新在于该条件独立于边界条件且不依赖位置矢量，可直接确定自接触的压缩载荷，同时证明哈密顿量在接触后持续，揭示了模式八和九的多构型现象以及奇数模式对称构型中点接触向线接触过渡需无穷大力。\n3. 这为屈曲结构自接触的临界载荷预测、后接触非线性行为分析以及弹性力学模型的深化研究提供了理论框架，并启发了相关多稳态系统设计与实验探索。", "summary_source": "deepseek", "authors": [{"name": "Krishnan Suryanarayanan"}, {"name": "Parth Patel"}, {"name": "Anup Kumar Pathak"}, {"name": "Harmeet Singh"}], "featured_authors": [{"name": "Krishnan Suryanarayanan"}, {"name": "Parth Patel"}, {"name": "Anup Kumar Pathak"}, {"name": "Harmeet Singh"}], "author_count": 4}, {"id": "2604.14307", "category": "cond-mat", "title": "Simulating hydrodynamic interactions in colloidal suspensions using multiparticle collision dynamics with rigid-body constraints", "abstract": "We develop a method for simulating colloidal suspensions using multiparticle collision dynamics (MPCD) with a discrete particle model represented as a rigid body. The key steps for incorporating the rigid-body constraints are to thermalize the velocities of the discrete sites before they participate in the MPCD collision step, then transfer momentum from the sites to the rigid body. We demonstrate that the rigid-body model produces the expected statistics for a single spherical particle and the same transport properties for a hard-sphere colloidal suspension as an equivalent model using harmonic bonds to maintain the site geometry. Importantly, the rigid-body model has less computational overhead and permits a larger simulation timestep than the harmonic-bond model, leading to a nearly order of magnitude speedup in benchmark simulations of hard-sphere colloidal suspensions. Our method is compatible with arbitrary discretization, so it enables more efficient MPCD simulations of suspensions of colloidal particles with complex shapes.", "url": "https://arxiv.org/abs/2604.14307", "type": "理论+数值", "summary": "1. 本研究将刚体约束引入多粒子碰撞动力学，发展了一种模拟胶体悬浮液的新方法。\n2. 该方法通过离散位点在碰撞步骤前的热化及向刚体的动量传递，在保证统计与输运性质准确的前提下，相比谐势键约束模型实现了近一个数量级的计算加速。\n3. 此工作为高效模拟具有复杂形状的胶体颗粒悬浮液提供了普适性框架，有望拓展至更广泛的软物质体系研究。", "summary_source": "deepseek", "authors": [{"name": "Michaela Bush"}, {"name": "Jeremy C. Palmer"}, {"name": "Michael P. Howard"}], "featured_authors": [{"name": "Michaela Bush"}, {"name": "Jeremy C. Palmer"}, {"name": "Michael P. Howard"}], "author_count": 3}, {"id": "2604.14367", "category": "cond-mat", "title": "A Generalized Coherent State Framework for Many-Body Density of States", "abstract": "We develop a general framework to calculate the many-body density of states (DOS) of isolated and interacting quantum systems. Based on the generalized coherent state formalism and the Simon-Lieb bounds for a quantum partition function, our method provides a general method of calculation for the DOS in high-dimensional irreducible sectors. This framework further provides rigorous bounds for the ground state energy in each sector and enables the calculation of microcanonical observables across the entire spectrum. Using the Lipkin-Meshkov-Glick (LMG) model as a test bed, we validate our framework by successfully identifying quantum phase transitions (QPTs) and excited-state quantum phase transitions (ESQPTs) across spin sectors. Unlike existing model-specific numerical or analytical techniques, our formalism relies on general underlying symmetries, making it broadly applicable. Applying our method to the ferromagnetic transverse field Ising chain with power law interactions, we demonstrate that its highest-spin-sector DOS is qualitatively identical to that of LMG-type Hamiltonians. Our work establishes a versatile and computationally efficient bridge between algebraic structure and many-body thermodynamics.", "url": "https://arxiv.org/abs/2604.14367", "type": "理论+数值", "summary": "1. 本文发展了一个基于广义相干态形式与Simon-Lieb边界的通用框架，用于计算具有对称性的相互作用量子系统的多体态密度，并在LMG模型及长程伊辛链中验证了其有效性。\n2. 该框架的核心优势在于其普适性，它不依赖于具体模型细节，而是基于系统内在的代数对称性来高效计算各不可约子空间的态密度与基态能量界限。\n3. 这项工作在系统的代数结构与多体热力学之间建立了直接联系，为研究一大类具有明确对称性的量子模型中的基态与激发态相变提供了强有力的新工具。", "summary_source": "deepseek", "authors": [{"name": "Deniz Coskun"}, {"name": "R. Chitra"}], "featured_authors": [{"name": "Deniz Coskun"}, {"name": "R. Chitra"}], "author_count": 2}, {"id": "2604.14377", "category": "cond-mat", "title": "Configuration-dependent electronic and optical properties of 2D Mo$_{1-x}$W$_x$S$_2$ alloys across the full composition range", "abstract": "Here we analyze multiple symmetry-inequivalent atomic configurations across the entire composition range of the isovalent and isostructural Mo$_x$W$_{1-x}$S$_2$ alloy using density-functional theory and Monte Carlo simulations. Our results show that although structural stability and energetics are largely composition-driven, the electronic and optical properties exhibit configuration dependence, with local atomic arrangements critically shaping band-edge splitting, valley structure, effective-mass anisotropy, and optical selection rules. In contrast to the pristine monolayers, even in the absence of spin-orbit coupling (SOC), splitting of the band edges at the $K$ point is observed across the entire composition range. In particular, while the valence-band maximum (VBM) remains largely robust, the conduction-band minimum (CBM) shows strong configuration-dependent splitting from few meV up to hundredths of meV. This behaviour leads to a non-trivial dependence of the valley energetics. Configurations with well-separated conduction bands support additional optically active transitions beyond the conventional A and B excitons in MoS$_2$ and WS$_2$ monolayers, whereas nearly degenerate cases exhibit a reduced number of allowed transitions, observed for specific configurations at $x = 1/3$ and $x = 2/3$. These results demonstrate that the number and character of optically active transitions are governed not only by composition, but also by the microscopic arrangement of atoms. Moreover, we found the hole effective masses at the VBM show configuration-dependent anisotropy, reflecting sensitivity to local symmetry breaking and implying direction-dependent transport.", "url": "https://arxiv.org/abs/2604.14377", "type": "理论+数值", "summary": "1. 本研究结合密度泛函理论与蒙特卡洛模拟，系统分析了MoₓW₁₋ₓS₂合金在全组分范围内多种不等价原子构型的电子与光学性质。\n2. 核心发现是电子结构与光学跃迁不仅受组分调控，更显著依赖于局部原子排布，具体表现为导带底在K点出现无自旋轨道耦合参与的构型依赖劈裂，并衍生出超越常规A、B激子的额外光学跃迁通道。\n3. 这为二维合金的能谷调控和光电器件设计提供了新维度，表明通过微观构型工程可实现对载流子有效质量各向异性和光学选择定则的精细操控。", "summary_source": "deepseek", "authors": [{"name": "M. Szyszko"}, {"name": "M. Birowska"}], "featured_authors": [{"name": "M. Szyszko"}, {"name": "M. Birowska"}], "author_count": 2}, {"id": "2604.14390", "category": "cond-mat", "title": "Long-range spin-polarized Josephson effect in ballistic S/F/S junctions with precessing magnetization", "abstract": "We present a theory of ballistic N/F/S and S/F/S junctions with a uniformly precessing magnetization, which generates long-range equal-spin superconducting correlations [Takahashi et al., Phys. Rev. Lett. 99, 057003 (2007), Houzet, Phys. Rev. Lett. 101, 057009 (2008)]. The non-equilibrium distribution of Andreev bound states leads to a strongly non-sinusoidal current-phase relationship for large precession angles. We derive detailed results for ballistic junctions involving partially and fully polarized ferromagnets. In the fully polarized half-metal limit, the magnetization precession switches the junction from an \"off\" state with vanishing subgap current to an \"on\" state with finite Andreev conductance and finite Josephson current.", "url": "https://arxiv.org/abs/2604.14390", "type": "理论", "summary": "1. 该工作建立了具有均匀进动磁化的弹道N/F/S和S/F/S结的理论模型，其中磁化进动诱导出长程等自旋超导关联。\n2. 理论揭示非平衡安德烈耶夫束缚态分布导致在大进动角下产生强烈的非正弦电流-相位关系，并在完全极化的半金属极限下实现了从零亚能隙电流到有限安德列耶夫电导与约瑟夫森电流的开关转变。\n3. 这一机理为基于自旋动力学的超导自旋电子学器件（如可切换约瑟夫森结）的设计与实现提供了明确的理论基础。", "summary_source": "deepseek", "authors": [{"name": "E. S. Andriyakhina"}, {"name": "M. Mansouri"}, {"name": "M. Breitkreiz"}, {"name": "P. W. Brouwer"}], "featured_authors": [{"name": "E. S. Andriyakhina"}, {"name": "M. Mansouri"}, {"name": "M. Breitkreiz"}, {"name": "P. W. Brouwer"}], "author_count": 4}, {"id": "2604.14470", "category": "cond-mat", "title": "Environment-dependent tight-binding models from ab initio pseudo-atomic orbital Hamiltonians", "abstract": "\\textit{Ab initio} pseudo-atomic orbital (PAO) Hamiltonians express the electronic structure of a solid in a compact, localized basis that spans the same Hilbert space as a conventional Slater--Koster tight-binding model, thereby providing an exact \\textit{ab initio} representation without any loss of accuracy. Building on this correspondence, we develop an environment-dependent tight-binding (EDTB) framework in which Slater--Koster hopping integrals are augmented with bond-screening functions that capture the local coordination environment. All parameters are determined by fitting to the PAO eigenvalue spectrum across multiple atomic configurations simultaneously, which breaks the degeneracy between screening and hopping parameters and yields physically meaningful, transferable models capable of generating Hamiltonians for large systems with \\textit{ab initio} precision. We demonstrate the efficiency and accuracy of the approach on four prototypical systems: bulk platinum, silicon surfaces, Si/Ge~[001] superlattices, and twisted bilayer graphene with up to $4{,}324$ atoms. The method is implemented in the \\paoflow{} code and integrates seamlessly with its full post-processing suite, enabling the evaluation of a broad range of electronic, optical, and transport properties.", "url": "https://arxiv.org/abs/2604.14470", "type": "理论+数值", "summary": "1. 本研究基于第一性原理赝原子轨道哈密顿量，开发了一种环境依赖的紧束缚（EDTB）建模框架。\n2. 其关键在于通过键屏蔽函数描述局域配位环境，并同时拟合多构型本征谱以打破参数简并，从而获得可转移的高精度模型。\n3. 该方法与PAOFLOW代码集成，为高效计算数千原子体系的电子、光学及输运性质提供了第一性原理精度的工具。", "summary_source": "deepseek", "authors": [{"name": "Marco Buongiorno Nardelli"}], "featured_authors": [{"name": "Marco Buongiorno Nardelli"}], "author_count": 1}, {"id": "2604.14521", "category": "cond-mat", "title": "Josephson phase shift and diode effect due to the inverse spin Hall effect", "abstract": "We theoretically study the direct and inverse spin Hall effects in a superconductor-normal metal-superconductor junction induced by a spin-orbit interaction that is invariant under spatial inversion. We show that a supercurrent induces a spin Hall effect, leading to a static spin accumulation with opposite polarizations at the two edges, analogous to that in normal conductors. For the inverse effect, we consider a spatially inhomogeneous static magnetic field and show that it induces an anomalous phase shift, which, in the presence of higher harmonics, results in a diode effect. Unlike Rashba systems, the present mechanism does not require broken structural inversion symmetry.", "url": "https://arxiv.org/abs/2604.14521", "type": "理论", "summary": "1. 本文理论上研究了空间反演对称自旋轨道耦合作用下超导-正常金属-超导结中的直接与逆自旋霍尔效应。\n2. 关键发现在于：空间非均匀静磁场通过逆效应会引发反常相位移动，并结合高次谐波产生二极管效应，该机制无需破坏结构反演对称性。\n3. 这为利用自旋轨道耦合与磁场空间调制实现非互易超导器件提供了新思路，并可拓展至其他保持空间反演对称的系统中。", "summary_source": "deepseek", "authors": [{"name": "Gen Tatara"}, {"name": "Yositake Takane"}, {"name": "Aurelien Manchon"}], "featured_authors": [{"name": "Gen Tatara"}, {"name": "Yositake Takane"}, {"name": "Aurelien Manchon"}], "author_count": 3}, {"id": "2604.14529", "category": "cond-mat", "title": "Solitonic Solutions of the One-Dimensional Harmonically Trapped Repulsive Bose-Einstein Condensate via Neural Network Quantum States", "abstract": "We demonstrate the existence of bright solitons in a repulsively interacting, harmonically trapped quasi-one-dimensional Bose-Einstein condensate described by the Gross-Pitaevskii equation. Using a neural-network quantum state (NNQS) approach, we parametrize the initial wavefunction and optimize it to find solutions that recur after one trap period, effectively balancing repulsion with trap-induced attraction. Aside from the bright solitonic solution, we also report double bright and dark soliton states. Perturbing the initial state with multiplicative phase and amplitude noise confirms that these periodic orbits are orbitally stable. Our results indicate that NNQS provides a powerful framework for uncovering coherent structures in nonlinear wave systems.", "url": "https://arxiv.org/abs/2604.14529", "type": "理论+数值", "summary": "1. 该工作通过神经网络量子态方法，在一维谐振势阱中排斥相互作用的玻色-爱因斯坦凝聚体里发现了亮孤子解及其周期轨道。\n2. 其核心在于利用神经网络参数化波函数并优化，使排斥相互作用与势阱诱导的有效吸引达到动态平衡，从而稳定存在单/双亮孤子及暗孤子态。\n3. 这不仅证实了周期轨道的轨道稳定性，更表明神经网络量子态为非线性波系统中相干结构的系统性探索提供了强有力新框架。", "summary_source": "deepseek", "authors": [{"name": "Gaoqing Meng"}, {"name": "Mingshu Zhao"}], "featured_authors": [{"name": "Gaoqing Meng"}, {"name": "Mingshu Zhao"}], "author_count": 2}, {"id": "2604.14533", "category": "cond-mat", "title": "The Two Orbital, Interacting Hatano-Nelson Model", "abstract": "The single orbital, one-dimensional, Hatano-Nelson Hamiltonian provides deep insight into the physics of non-Hermiticity, resulting from asymmetric left/right hopping, and its connections to localization. In the absence of disorder, its single particle eigenvalues $E_{\\alpha}$ lie on an ellipse in the complex plane whose extent in the imaginary direction is controlled by the degree of asymmetry. When randomness is introduced, two sets of real eigenvalues emerge at the extremes of the largest and smallest real part of $E_{\\alpha}$. These real eigenvalues are associated with localized eigenvectors. For spinless fermions, increasing near-neighbor interactions first cause a transition to a charge density wave phase, and ultimately, on finite lattices, a collapse of all eigenvalues to the real axis. In this paper, we explore the presence of real eigenvalues in the interacting, two-particle sector for the spinful case (Hubbard model) in a two-chain (two-band) geometry with a Hermitian interchain hopping. Our key results are to obtain the ``phase\" diagrams for the existence of a purely real spectrum, as a function of the interaction strength, degree of non-Hermiticity, and interchain hopping. We study the sensitivity to boundary conditions of the spectral properties of our two-chain model with winding number analysis and explore the relationship between PBC doublon states and OBC skin modes. To address the question of stability in such non-equilibrium systems, we solve the dynamics at low filling according to Lindbladian evolution and find that the non-Hermitian description is able to qualitatively describe such systems.", "url": "https://arxiv.org/abs/2604.14533", "type": "理论", "summary": "1. 本研究将非厄米哈塔诺-尼尔森模型扩展至自旋满的两链哈伯德几何结构，在相互作用双粒子子空间中系统探究了实能谱的出现条件。\n2. 通过构建相互作用强度、非厄米参数与链间跃迁的三维相图，结合边界条件敏感性分析与缠绕数计算，揭示了周期边界双粒子态与开放边界趋肤模的对应关系。\n3. 基于低占据态的林德布拉德动力学模拟，为这类非平衡系统中非厄米描述的稳定性提供了定量依据，为开放量子多体系统的有效建模开辟了新途径。", "summary_source": "deepseek", "authors": [{"name": "Jonah Huang"}, {"name": "Rubem Mondaini"}, {"name": "Nancy Aggarwal"}, {"name": "Richard Scalettar"}], "featured_authors": [{"name": "Jonah Huang"}, {"name": "Rubem Mondaini"}, {"name": "Nancy Aggarwal"}, {"name": "Richard Scalettar"}], "author_count": 4}, {"id": "2604.14554", "category": "cond-mat", "title": "First-principles study of infrared, Raman, piezoelectric and elastic properties of Mg-IV-N\\textsubscript{2} (IV = Ge, Si, Sn)", "abstract": "Mg-IV-N\\textsubscript{2} compounds with IV=Si, Ge, Sn are ultra-wide band gap semiconductors with various potential electronic and optoelectronic applications. They share the \\textit{Pna}2\\textsubscript{1} space group crystal structure. Here we present Density Function Perturbation Theory (DFPT) calculations of the vibrational modes of these materials. We focus on the vibrational modes at the zone center to establish the relation between vibrational modes and their corresponding point-group symmetries, which determine the Raman and infrared spectra but also report the full Brillouin zone phonon dispersions and density of states. We also determine the piezoelectric tensor and the elastic compliance tensor.", "url": "https://arxiv.org/abs/2604.14554", "type": "理论+数值", "summary": "1. 该工作基于密度泛函微扰理论，系统计算了Mg-IV-N₂ (IV = Ge, Si, Sn) 系列超宽带隙半导体的晶格振动、压电张量与弹性柔顺张量。\n2. 其核心在于通过第一性原理计算获得了完整的布里渊区声子色散与态密度，并基于Γ点声子模的对称性分析确立了红外与拉曼光谱的关联。\n3. 此套系统的物性数据为评估这些材料在光电子或压电器件中的应用潜力提供了关键的理论参考与设计依据。", "summary_source": "deepseek", "authors": [{"name": "Sarker Md. Sadman"}, {"name": "Walter R. L. Lambrecht"}], "featured_authors": [{"name": "Sarker Md. Sadman"}, {"name": "Walter R. L. Lambrecht"}], "author_count": 2}, {"id": "2604.14559", "category": "cond-mat", "title": "Persistent Free Volume Governs (Anti-)plasticization in Chitosan-Water Mixtures", "abstract": "Chitosan is a highly versatile and sustainable polymer with a broad range of potential biological and materials engineering applications. Despite its versatility, the native brittleness of chitosan limits its broader utilization. This limitation can be addressed by blending chitosan with small-molecule additives to modulate its thermomechanical properties. We employ molecular dynamics (MD) simulations to investigate the mechanism underlying antiplasticization followed by plasticization at increasing water content. Decomposition of the elastic moduli reveals a competition between weakened polymer-polymer interactions and enhanced polymer-water interactions, with their relative strengths governing the resulting properties. We introduce a simple model incorporating dynamically accessible free volume regions as a key driver of polymer mobility, effectively capturing the (anti-)plasticization of elastic properties. We show that accessibility of free volume regions is enabled by connectivity of additive-accessible volume regions. This study provides new insights into the molecular interactions that dictate the properties of chitosan-water mixtures and may inform the rational design of chitosan-based materials and other hydrated biopolymers.", "url": "https://arxiv.org/abs/2604.14559", "type": "理论+数值", "summary": "1. 该研究通过分子动力学模拟揭示了壳聚糖-水混合物中随含水量增加出现的反塑化与塑化转变机制。\n2. 其核心在于建立了以动态可及自由体积区域连通性为关键驱动因素的简化模型，成功描述了弹性性质的转变。\n3. 这为基于分子相互作用的壳聚糖及其他水合生物聚合物材料的理性设计提供了明确的物理指导。", "summary_source": "deepseek", "authors": [{"name": "Baris E. Ugur"}, {"name": "Michael A. Webb"}], "featured_authors": [{"name": "Baris E. Ugur"}, {"name": "Michael A. Webb"}], "author_count": 2}, {"id": "2604.14695", "category": "cond-mat", "title": "Level statistics of the disordered Haldane-Shastry model with $1/r^α$ interaction", "abstract": "Understanding how the interaction range and various types of disorder affect the level statistics of many-body quantum systems and lead to the emergence of many-body localization (MBL) is a challenging open frontier. We study the level statistics of a variant of the spin-$1/2$ Haldane-Shastry model with $1/r^{\\alpha}$ interactions, where $\\alpha{\\geq}0$ parametrizes the range of the interactions, in the presence of position disorder and/or random magnetic fields. We find that neither position disorder nor random magnetic fields alone yields pristine Poisson statistics in this long-range interacting system; however, Poisson statistics emerge in their combined presence, suggesting the emergence of MBL when both types of disorder coexist. Interestingly, once random magnetic fields break the $SU(2)$ symmetry, the strength of the position disorder, $\\delta$, appears to play an important role, as evidenced by an approximate scaling collapse of the disorder-averaged gap ratios that is parametrized in terms of a single parameter, $\\alpha \\delta$.", "url": "https://arxiv.org/abs/2604.14695", "type": "理论", "summary": "1. 该工作通过系统数值模拟，研究了具有 $1/r^α$ 相互作用的无序 Haldane-Shastry 自旋-$1/2$ 模型在位置无序和随机磁场下的能级统计特性。\n2. 核心物理结果是：单一类型无序无法产生纯净泊松统计，而两者共存时泊松统计显现，暗示多体局域化；且当随机磁场破坏 $SU(2)$ 对称性后，能隙比的无序平均以 $αδ$ 为单一参数实现标度坍缩，凸显了相互作用范围与无序强度的耦合。\n3. 这为理解长程相互作用量子系统中多体局域化的涌现条件提供了关键见解，并启发了基于 $αδ$ 标度关系的后续理论与实验探索。", "summary_source": "deepseek", "authors": [{"name": "Vengatesan Ganapathy"}, {"name": "Pranay Patil"}, {"name": "Ajit C. Balram"}], "featured_authors": [{"name": "Vengatesan Ganapathy"}, {"name": "Pranay Patil"}, {"name": "Ajit C. Balram"}], "author_count": 3}, {"id": "2604.14750", "category": "cond-mat", "title": "Morphological Transition: From Meanders to Mound Structures", "abstract": "Mound formation on flat and miscut crystal surfaces exhibits distinct growth behaviors. While mound structures are the predominant feature on flat surfaces, miscut surfaces display a smooth transition from meandered patterns to three-dimensional mounds, depending on both internal and external conditions. We investigate this morphological evolution-from meander-like surface patterns to faceted pyramidal structures-using a vicinal Cellular Automata modeling framework. The transition is shown to be governed by the competition between the Ehrlich-Schwoebel barrier and adatom mobility on terraces. Under moderate barrier strengths and sufficiently high terrace diffusivity, the system demonstrates a reversible transition from mounded configurations to regular step meandered patterns. This reveals a complex interplay between kinetic barriers and mass transport. Our simulations cover a wide range of growth conditions, including variations in deposition flux, surface diffusion rates, temperature, and miscut angle. By applying the height-height correlation function, we calculate the correlation lengths along and across the steps and analyze their scaling behavior. These results offer insight into the continuum pathways that connect distinct classes of surface structures and provide a unified framework for describing pattern evolution across different crystal growth regimes.", "url": "https://arxiv.org/abs/2604.14750", "type": "理论+数值", "summary": "1. 该工作基于近邻细胞自动机模型，系统研究了倾斜晶体表面从蜿蜒图案到三维丘状结构的形态演化，模拟涵盖了沉积通量、扩散率、温度和倾斜角等多种生长条件。\n2. 其核心在于揭示了埃利希-施沃贝尔势垒与台阶上吸附原子迁移率的竞争主导了可逆转变，并通过高度-高度关联函数量化了沿步骤和跨步骤的相关长度标度行为。\n3. 这为连接不同表面结构的连续体演化路径提供了物理见解，并为跨晶体生长制度的图案演变描述建立了一个统一框架。", "summary_source": "deepseek", "authors": [{"name": "Marta A. Chabowska"}, {"name": "Hristina Popova"}, {"name": "Magdalena A. Załuska-Kotur"}], "featured_authors": [{"name": "Marta A. Chabowska"}, {"name": "Hristina Popova"}, {"name": "Magdalena A. Załuska-Kotur"}], "author_count": 3}, {"id": "2604.14767", "category": "cond-mat", "title": "Nontrivial three-sublattice magnetization in the easy-axis spin-1/2 XXZ antiferromagnet on the triangular lattice", "abstract": "We investigate the ground-state magnetic structure of the spin-$1/2$ XXZ antiferromagnet on the triangular lattice in the easy-axis regime using the density-matrix renormalization group. By applying spiral boundary conditions, we exactly map finite $L\\times L$ clusters onto one-dimensional chains while avoiding the spatial anisotropy inherent in cylindrical geometries. From symmetry-broken local magnetization profiles, we extract the three-sublattice moments and track their evolution with anisotropy. At the isotropic point, we obtain a positive sublattice moment of $0.21671$, consistent with previous numerical estimates. In the easy-axis regime, the ordered moments remain close to a zero-magnetization three-sublattice structure of the form $(2m,-m,-m)$ over a broad range of $\\Delta$. Extrapolation in $1/\\Delta$ shows that the positive sublattice moment stays well below the classical saturation value $1/2$, approaching $0.41873$ as $\\Delta\\to\\infty$, while the magnitude of the negative sublattice moment approaches $0.20832$. We further compare the energies of the Y state and the up-down-down state and find that the Y state is favored at zero field. Independent thermodynamic-limit energy calculations, performed without assuming any particular ordered pattern, yield an energy consistent with the Y-state solution. These results show that the easy-axis ground state does not simply cross over to a trivially saturated collinear Ising state, but instead remains a nontrivial three-sublattice ordered state selected from the macroscopically degenerate Ising manifold by quantum fluctuations.", "url": "https://arxiv.org/abs/2604.14767", "type": "理论+数值", "summary": "1. 本研究采用密度矩阵重整化群方法，结合螺旋边界条件，系统地探究了三角晶格上自旋-1/2易轴XXZ反铁磁体的基态磁结构及其随各向异性参数Δ的演化。\n2. 通过精确映射有限尺寸簇并分析对称破缺的局域磁化分布，研究发现即使在Δ→∞的极限下，系统仍保持接近(2m,-m,-m)形式的非平庸三子晶格有序，而非简并的经典伊辛饱和态。\n3. 这表明量子涨落能够在宏观简并的伊辛流形中稳定选择出特定的有序态，为理解易轴区域中量子涨落与经典简并竞争的微观机制提供了明确依据。", "summary_source": "deepseek", "authors": [{"name": "Masahiro Kadosawa"}, {"name": "Masaaki Nakamura"}, {"name": "Yukinori Ohta"}, {"name": "Satoshi Nishimoto"}], "featured_authors": [{"name": "Masahiro Kadosawa"}, {"name": "Masaaki Nakamura"}, {"name": "Yukinori Ohta"}, {"name": "Satoshi Nishimoto"}], "author_count": 4}, {"id": "2604.14848", "category": "cond-mat", "title": "Emergence of Open Chemical Reaction Network Thermodynamics within Closed Systems", "abstract": "We address a fundamental question: under which conditions do the dynamics and thermodynamics of open chemical reaction networks (CRNs), grounded on the notion of idealized chemostats that exchange selected species, emerge from underlying closed CRNs? While open CRNs provide the standard framework to describe out-of-equilibrium chemical systems, real systems are finite and ultimately relax to equilibrium, leaving the status of this description conceptually unresolved. Here we show that open-CRN behavior arises as an asymptotic regime of closed CRNs when two minimal and physically transparent conditions are met: a time-scale separation, whereby fast reactions effectively act as exchange mechanisms, and an abundance separation, whereby a subset of species behaves as chemostats with diverging chemical capacity. In this regime, both the stochastic dynamics and the thermodynamic structure \\ -- including local detailed balance, entropy production, and free-energy balance \\ -- emerge to leading order from the underlying closed CRN. Our results apply to arbitrary stoichiometries. They show that chemostats need not be introduced as external idealizations, but instead arise as emergent thermodynamic structures within closed systems, providing a unified and physically grounded foundation for the nonequilibrium thermodynamics of CRNs.", "url": "https://arxiv.org/abs/2604.14848", "type": "数值", "summary": "1. 该工作通过渐近分析揭示了封闭化学反应网络中开放网络热力学行为涌现的充分条件。\n2. 其核心在于建立了时间尺度分离与物种丰度分离这两个物理可实现的判据作为涌现机制。\n3. 这为化学反应网络的非平衡热力学提供了基于封闭系统自然极限的统一物理基础。", "summary_source": "deepseek", "authors": [{"name": "Benedikt Remlein"}, {"name": "Massimiliano Esposito"}, {"name": "Francesco Avanzini"}], "featured_authors": [{"name": "Benedikt Remlein"}, {"name": "Massimiliano Esposito"}, {"name": "Francesco Avanzini"}], "author_count": 3}, {"id": "2604.14873", "category": "cond-mat", "title": "Highly coarse-grained polarisable water models for mesoscopic simulations", "abstract": "Modelling micro- and meso-scopic scale thermodynamic and transport properties of soft condensed matter hinges upon its representation. This is especially relevant for polar solvents such as water, since these require effective representation of their dielectric nature as driven by molecular charge distributions and molecular network structuring. The dielectric nature of a medium leads to complex phenomena such as local polarisability response and restructuring near interfaces in reaction to changes in local charge distributions. Inclusion of such phenomena when using larger-than-atomistic techniques such as coarse-grained molecular dynamics (CG-MD) and dissipative particle dynamics (DPD) is still an open question, to which we provide a novel way to consider and justify the necessary and suitable coarse-graining level, enabling us to compare new polar CG models' performance against that of an underlying atomistic model. We polarise our previous non-polar nDPD water model to prepare it for use in simulations of liquid electrolytes as well as solvated organic membranes and measure its fitness to serve as a dielectric medium by comparing its properties to those of the TIP3P water model, while simultaneously observing changes to properties already represented well by the non-polar model.", "url": "https://arxiv.org/abs/2604.14873", "type": "理论+数值", "summary": "1. 该工作通过极化先前非极化的 nDPD 水模型，开发了适用于介观模拟的可极化粗粒化水模型。\n2. 其核心在于提出了一种确定必要且合适的粗粒化水平的新方法，使得模型能有效表征介电响应及界面处的极化重排现象。\n3. 这为在介观尺度上研究液态电解质及溶剂化有机膜等复杂极性溶剂体系提供了更为可靠的理论模拟工具。", "summary_source": "deepseek", "authors": [{"name": "Michael A. Seaton"}, {"name": "Benjamin T. Speake"}, {"name": "Ilian T. Todorov"}], "featured_authors": [{"name": "Michael A. Seaton"}, {"name": "Benjamin T. Speake"}, {"name": "Ilian T. Todorov"}], "author_count": 3}, {"id": "2604.14894", "category": "cond-mat", "title": "Reversable phase transitions in ferroic two-dimensional Nb2O2I4 through optically excited coherent phonons", "abstract": "We investigate optically induced phase transitions in the two-dimensional (2D) ferroelectric (FE) material Nb2O2I4 using real-time time-dependent density functional theory (rt-TDDFT). Our results demonstrate that tailored laser pulses can activate specific coherent phonon modes. Specifically, the anharmonic atomic distortions of the A1-1 and A1-2 modes at the {\\Gamma}-point facilitate the reversal of in-plane polarization. By fine-tuning laser parameters, additional phonon modes at both the Y and {\\Gamma} points are excited. The resulting nonequilibrium atomic dynamics enable the formation of previously unreported ferroic phases, including three antiferroelectric (AFE) phases and one ferrielectric (FiE) phase. Notably, these optically induced phases can be reverted to the initial FE state using appropriate techniques. This controllable reversibility among multiple ferroic phases positions 2D Nb2O2I4 as a highly promising candidate for next-generation electronic storage applications.", "url": "https://arxiv.org/abs/2604.14894", "type": "理论+数值", "summary": "1. 该工作使用实时含时密度泛函理论研究了二维铁电材料 Nb2O2I4 中光学激发相干声子诱导的可逆相变。\n2. 其核心在于定制激光脉冲可激发特定相干声子模式，实现面内极化反转并诱导出新的反铁电和铁电相等铁性相。\n3. 这为基于可控可逆多铁相材料的下一代电子存储应用提供了明确理论启示。", "summary_source": "deepseek", "authors": [{"name": "Chuanlin Liu"}, {"name": "Dan Liu"}, {"name": "Jie Guan"}, {"name": "Chao Lian"}], "featured_authors": [{"name": "Chuanlin Liu"}, {"name": "Dan Liu"}, {"name": "Jie Guan"}, {"name": "Chao Lian"}], "author_count": 4}, {"id": "2604.14962", "category": "cond-mat", "title": "Coarse Graining Reveals a Fluctuation-theorem-like Asymmetry in Financial Markets", "abstract": "Fluctuation theorems show how coarse graining transforms microscopic symmetry into observable irreversibility. Here we ask whether an analogous symmetrybased diagnostic can be constructed for financial markets. At the microscopic level, each transaction pairs a buyer and a seller, whereas trading decisions are typically made from coarse-grained price histories. Using symmetric takeprofit and stop-loss rules, we compare the holding-time distributions of long and short trading ensembles generated from the same price series. Across equityindices, individual stocks and cryptocurrencies, the log-ratio of the two distributions shows a robust crossover. It remains nearly constant at short durations but becomes linear in the tail, implying an exponential directional asymmetry. The tail slope defines an effective market temperature, an operational measure of fluctuation intensity on the chosen observation scale. A Bachelier first-passage benchmark captures the exponential tails but not the asymmetry, because long and short positions share the same leading decay rate. By contrast, short-time correlations between overlapping positions provide a minimal mechanism for the asymmetry by generating direction-dependent subleading relaxation spectra in a coarse-grained Markov description. Together, these results establish a fluctuation-theorem-like diagnostic of irreversibility in financial markets and, more broadly, in complex systems accessible only through coarse-grained observables.", "url": "https://arxiv.org/abs/2604.14962", "type": "理论", "summary": "1. 该工作将粗粒化波动定理的思想引入金融市场，构建了一个基于对称性的诊断工具来揭示交易决策中的方向不对称性。\n2. 其技术关键在于采用对称的止盈止损规则比较持仓时间分布，发现对数比在短时近乎恒定、尾部呈线性，定义了表征粗粒化尺度下波动强度的有效市场温度。\n3. 这为仅通过粗粒化观测量研究金融市场及其他复杂系统的不可逆性提供了操作化诊断方法，并为相关模型的构建与实验设计提供了明确启发。", "summary_source": "deepseek", "authors": [{"name": "Jian Gao"}, {"name": "Lufeng Zhang"}, {"name": "Ping Fang"}, {"name": "Pu Ke"}, {"name": "Jin Wu"}, {"name": "Yue Liu"}, {"name": "Haijun Zhou"}], "featured_authors": [{"name": "Jian Gao"}, {"name": "Lufeng Zhang"}, {"name": "Ping Fang"}, {"name": "Jin Wu"}, {"name": "Yue Liu"}, {"name": "Haijun Zhou"}], "author_count": 7}, {"id": "2604.15000", "category": "cond-mat", "title": "Thermodynamic Geometry of Relaxation", "abstract": "While the geometry of equilibrium states and driven non-equilibrium processes is clearly understood, a geometric description for relaxation towards equilibrium is still lacking. Here, we propose a thermo-geometric measure based on the Rayleigh quotient, reformulating relaxation as a fundamental competition between entropic stiffness and frictional dissipation. Taking a van der Waals gas with two dissipation channels as an example, we explicitly demonstrate its relaxation landscape. Particularly, we find that upon approaching the critical temperature $T_c$, the slow-mode relaxation rate vanishes linearly as $\\lambda_s \\propto (T-T_c)/T_c$, indicating critical slowing down. This study completes the thermodynamic geometry framework, providing a general tool for characterizing the relaxation dynamics of complex systems.", "url": "https://arxiv.org/abs/2604.15000", "type": "理论", "summary": "1. 该研究建立了弛豫过程的热力学几何描述，提出了基于瑞利商的几何度量，并以具有双耗散通道的范德瓦尔斯气体为例展示了弛豫景观。\n2. 其核心在于将弛豫重新表述为熵刚度与摩擦耗散之间的基本竞争，并发现接近临界温度时慢模弛豫率呈线性消失规律，即 λ_s ∝ (T−T_c)/T_c。\n3. 这完善了热力学几何框架，为表征复杂系统的弛豫动力学提供了一个普适工具。", "summary_source": "deepseek", "authors": [{"name": "Hao Wang"}, {"name": "Li Zhao"}, {"name": "Shuai Deng"}, {"name": "Yu-Han Ma"}], "featured_authors": [{"name": "Hao Wang"}, {"name": "Li Zhao"}, {"name": "Shuai Deng"}, {"name": "Yu-Han Ma"}], "author_count": 4}, {"id": "2604.15019", "category": "cond-mat", "title": "Controllable highly oriented skyrmion track array in Fe3GaTe2", "abstract": "Magnetic skyrmions are emerging as promising candidates for next-generation information technologies, while the realization of scalable skyrmion lattices with tailored configurations is essential for advancing fundamental skyrmion physics and developing future applications. Here we achieved the controllable generation and regulation of a large-area, highly oriented skyrmion track array (STA) in ferromagnetic Fe3GaTe2 using a vector magnetic field manipulation technique. The orientation and ordering of STA, along with the types and density of skyrmions, are precisely controlled by modulating parameters during the manipulation. The critical roles of in-plane magnetic fields and Dzyaloshinskii-Moriya interaction in STA generation is further confirmed by micromagnetic simulation. Our findings develop a strategy for engineering large-area and highly-oriented skyrmion configurations, offering a new pathway for the future application of next-generation spintronic and information technologies.", "url": "https://arxiv.org/abs/2604.15019", "type": "理论+数值", "summary": "1. 本研究通过矢量磁场操控技术，在铁磁材料Fe3GaTe2中实现了大面积、高度取向的斯格明子轨迹阵列的可控制备与动态调控。\n2. 其技术核心在于通过精细调节操控参数，精确控制了阵列的取向、有序性以及斯格明子的类型和密度，并借助微磁模拟揭示了面内磁场与Dzyaloshinskii-Moriya相互作用的关键生成机制。\n3. 这一成果为工程化大规模、可定制斯格明子结构提供了有效策略，对发展高性能自旋电子器件和推动下一代信息技术应用具有重要启发。", "summary_source": "deepseek", "authors": [{"name": "Yunhao Wang"}, {"name": "Shiyu Zhu"}, {"name": "Chensong Hua"}, {"name": "Guojing Hu"}, {"name": "Linxuan Li"}, {"name": "Senhao Lv"}, {"name": "Jianfeng Guo"}, {"name": "Jiawei Hu"}, {"name": "Runnong Zhou"}, {"name": "Zizhao Gong"}, {"name": "Chengmin Shen"}, {"name": "Zhihai Cheng"}, {"name": "Jinan Shi"}, {"name": "Wu Zhou"}, {"name": "Haitao Yang"}, {"name": "Weichao Yu"}, {"name": "Jiang Xiao"}, {"name": "Hong-Jun Gao"}], "featured_authors": [{"name": "Yunhao Wang"}, {"name": "Shiyu Zhu"}, {"name": "Chensong Hua"}, {"name": "Weichao Yu"}, {"name": "Jiang Xiao"}, {"name": "Hong-Jun Gao"}], "author_count": 18}, {"id": "2604.15054", "category": "cond-mat", "title": "Type II Lifshitz invariant and optically active Higgs mode in time-reversal symmetry broken superconductors", "abstract": "Lifshitz invariant is a symmetry-allowed term in the Ginzburg-Landau free energy of an ordered phase, involving the order parameters and a single spatial derivative, which serves as a source of unusual optical responses. Here we introduce a ``type II\" Lifshitz invariant for superconductors, which changes its sign under the particle-hole transformation and can be distinguished from the ordinary particle-hole even ``type I\" Lifshitz invariant. We show that the type II Lifshitz invariant appears only in superconductors that break time-reversal symmetry and allows the Higgs mode to be visible in the optical conductivity spectrum. We provide a classification of all pairs of irreducible corepresentations of order parameters in the magnetic point groups that admit a type II Lifshitz invariant. We also numerically calculate the optical conductivity for various models of time-reversal symmetry broken multiband superconductors, finding agreement with the group-theoretical analysis. Our results establish a universal class of time-reversal symmetry broken superconductors hosting an optically active Higgs mode.", "url": "https://arxiv.org/abs/2604.15054", "type": "理论+数值", "summary": "1. 本文为时间反演对称破缺超导体引入了一类粒子-荷变换下变号的第二类Lifshitz不变量，并证明其允许Higgs模在光学电导谱中显现。\n2. 该工作的核心在于建立了第二类Lifshitz不变量与磁点群中不可约协表示对的系统分类，并通过多带超导模型计算验证了其与光学响应的关联。\n3. 这一理论框架为在时间反演破缺超导体中普适性地寻找光学活性的Higgs模提供了明确的群论判据和分类依据。", "summary_source": "deepseek", "authors": [{"name": "Raigo Nagashima"}, {"name": "Chihiro Mamiya"}, {"name": "Naoto Tsuji"}], "featured_authors": [{"name": "Raigo Nagashima"}, {"name": "Chihiro Mamiya"}, {"name": "Naoto Tsuji"}], "author_count": 3}, {"id": "2604.15062", "category": "cond-mat", "title": "Heat flux deflection induced by hydrodynamic electron transport in a homogeneous Corbino disk under magnetic field", "abstract": "Hydrodynamic electron transport, namely, the electric behaviors in solid materials at the macroscopic level are similar to the fluid hydrodynamics when the momentum-conserving electron-electron scattering plays the leading role, has got much attention in the past ten years. However, most of previous studies mainly focus on the electric properties. In this work, the thermal behaviors of hydrodynamic electron transport in a homogeneous 2D Corbino disk geometry is studied by the electron Boltzmann transport equation (eBTE) coupled with the Poisson equation under the magnetic field perpendicular to disk plane. Results show that in the electron hydrodynamic regime, the heat flux deflection phenomenon appears under the radial electric field or temperature gradient, namely, the heat flux no longer flows only along the radial direction and there is heat flux in the tangential direction of the radius. Heat flux deflection phenomenon is suppressed by momentum-relaxing scattering process and promoted by momentum-conserving scattering process. When an electric potential gradient or temperature gradient in the same direction is applied separately, the direction of heat flux is reversed in the electron hydrodynamic regime.", "url": "https://arxiv.org/abs/2604.15062", "type": "理论", "summary": "1. 该工作通过求解耦合泊松方程的电子玻尔兹曼输运方程，研究了垂直于盘面磁场下均匀二维Corbino盘中电子流体力学区域的热输运行为，揭示了径向电场或温度梯度会导致热流发生偏转。\n2. 其核心物理在于，热流不再仅沿径向流动而出现切向分量，该偏转现象受动量弛豫散射抑制、受动量守恒散射增强，且单独施加同向电势梯度或温度梯度时，流体力学区域内的热流方向相反。\n3. 这一发现明确了电子流体力学特性对热输运路径的独特调控能力，为利用电子流体效应设计新型热管理器件及在更广泛材料体系中探索类似现象提供了理论基础。", "summary_source": "deepseek", "authors": [{"name": "Chuang Zhang"}, {"name": "Meng Lian"}, {"name": "Hong Liang"}, {"name": "Xiaokang Li"}, {"name": "Zhaoli Guo"}, {"name": "JingTao Lü"}], "featured_authors": [{"name": "Chuang Zhang"}, {"name": "Meng Lian"}, {"name": "Hong Liang"}, {"name": "Xiaokang Li"}, {"name": "Zhaoli Guo"}, {"name": "JingTao Lü"}], "author_count": 6}, {"id": "2604.15084", "category": "cond-mat", "title": "Static heterogeneity generates apparent universality in first-passage bursty dynamics", "abstract": "Processes involving bursts of activity separated by quiescent periods occur across diverse systems and scales. In human dynamics, these phenomena have been described by power-law inter-event time distributions, $P(t)\\sim t^{-\\alpha}$, with putative universality classes $\\alpha=1$ and $\\alpha=\\frac{3}{2}$ having been proposed. Whether the observed $\\alpha = 1$ scaling reflects intrinsic scale-free dynamics or instead emerges from heterogeneous underlying rates has been debated at length. We address this question in a canonical physical system for first-passage dynamics: two-dimensional molecular diffusion detected by the tip of a scanning tunnelling microscope. The resulting inter-pulse time distributions exhibit the same apparent truncated power-law form reported for human activities such as email communication, web browsing, and library loans. Maximum-likelihood estimation and model comparison decisively favor a Kohlrausch-Williams-Watts--tempered power law, $P(t)\\propto t^{-\\alpha}\\exp\\left(-(t/t_c)^\\beta\\right)$, with $\\alpha \\sim 1$. Kinetic Monte Carlo simulations reproduce this behavior, showing that the apparent $\\alpha \\sim 1$ scaling is confined to a finite time window and arises from tip-induced spatial heterogeneity, not scale invariance.", "url": "https://arxiv.org/abs/2604.15084", "type": "理论+数值", "summary": "1. 该工作结合扫描隧道显微镜尖端探测二维分子扩散的首达动力学实验与动力学蒙特卡洛模拟，研究了静态异质性在爆发性动力学中的作用。\n2. 通过最大似然估计与模型比较，发现观测到的截断幂律分布（α∼1）可由科赫劳施-威廉姆斯-瓦茨缓变幂律描述，并明确揭示这一标度行为源于尖端诱导的空间异质性，而非内在的无标度动力学。\n3. 这一结果为重新审视人类动力学等领域中观测到的普适性标度类提供了物理机制依据，表明表观幂律可能普遍来源于异质速率环境的有限时间窗口效应。", "summary_source": "deepseek", "authors": [{"name": "Morten Møller"}, {"name": "Philipp Rahe"}, {"name": "Sadegh Ghaderzadeh"}, {"name": "Elena Besley"}, {"name": "Philip Moriarty"}], "featured_authors": [{"name": "Morten Møller"}, {"name": "Philipp Rahe"}, {"name": "Sadegh Ghaderzadeh"}, {"name": "Elena Besley"}, {"name": "Philip Moriarty"}], "author_count": 5}, {"id": "2604.15105", "category": "cond-mat", "title": "Passivity-Driven Order--Disorder Transitions in Self-Aligning Active Matter", "abstract": "We study dense mixtures of passive and active self-aligning disks with isotropic or anisotropic mobility. We find that the passive fraction controls an order-disorder transition that is continuous in the isotropic case and discontinuous in the anisotropic one. A mean-field equation derived from the microscopic heading dynamics captures this dichotomy. Near the transition, both ordered regimes can exhibit multiple metastable oscillating or rotating states, depending on the spatial arrangement of passive particles and lattice defects, but with different transient dynamics: Systems with isotropic mobility visit multiple long-lived attractors during each simulation while systems with anisotropic mobility are trapped by a single attractor. Our results reveal the passive fraction as a physically relevant control parameter in active systems, leading to rich self-organizing dynamics.", "url": "https://arxiv.org/abs/2604.15105", "type": "理论+数值", "summary": "1. 该工作研究了具有各向同性与各向异性迁移率的被动-主动自对准圆盘稠密混合物中的序-无序相变。\n2. 理论核心在于推导出能从微观朝向动力学捕获相变连续-间断二分性的平均场方程，并揭示了被动组分占比作为物理相关控制参数的关键作用。\n3. 这为通过调控被动成分占比与空间排布来设计具有丰富自组织动力学（如多稳态振荡态）的活性材料提供了新思路。", "summary_source": "deepseek", "authors": [{"name": "Weizhen Tang"}, {"name": "Amir Shee"}, {"name": "Zhangang Han"}, {"name": "Pawel Romanczuk"}, {"name": "Yating Zheng"}, {"name": "Cristián Huepe"}], "featured_authors": [{"name": "Weizhen Tang"}, {"name": "Amir Shee"}, {"name": "Zhangang Han"}, {"name": "Pawel Romanczuk"}, {"name": "Yating Zheng"}, {"name": "Cristián Huepe"}], "author_count": 6}, {"id": "2604.15175", "category": "cond-mat", "title": "Optimal spin-qubit hallmarks of sulfur-vacancy defects in 4H-SiC: Design from first principles", "abstract": "By applying our methodology, we propose a defect in 4H-SiC which combines a Si vacancy and a C atom substituted with S (VSiSC) to have a spin-triplet ground state with the spin qubit functionality. Our calculations confirm that all configurations of the defect have a dynamically and thermodynamically stable triplet ground state and higher energy singlet states, essential for the spin-qubit polarization cycle. From GW calculations, we found that the electronic states associated with the defect form sharp and isolated peaks within the band gap for both triplet and singlet states. Further Bethe-Salpeter-equation calculations show that all considered configurations have intense optical excitations in the near infrared spectrum range. Analysis of the excitation energies and rates indicate that the VSiSC defect can be an excellent optically controlled spin qubit. Crucially, the host elements and the dopant have high-abundance isotopes with zero nuclear spin ensuring high spin-coherence time of the qubit.", "url": "https://arxiv.org/abs/2604.15175", "type": "理论+数值", "summary": "1. 该研究通过第一性原理计算，在4H-SiC中设计并表征了硅空位与硫替代碳结合的缺陷（VSiSC），证实其具有动态和热力学稳定的自旋三重态基态及更高能单重态，支持自旋量子比特的极化循环。\n2. 技术核心在于GW计算显示缺陷电子态在带隙内形成尖锐孤立峰，Bethe-Salpeter方程计算预测近红外强光学激发，且高丰度零核自旋同位素确保了长自旋相干时间。\n3. 这使VSiSC缺陷成为光学控制自旋量子比特的优异候选体系，为基于碳化硅的固态量子信息处理平台提供了缺陷工程新策略。", "summary_source": "deepseek", "authors": [{"name": "Marisol Alcántara Ortigoza"}, {"name": "Sergey Stolbov"}], "featured_authors": [{"name": "Marisol Alcántara Ortigoza"}, {"name": "Sergey Stolbov"}], "author_count": 2}, {"id": "2604.14271", "category": "hep-th", "title": "Magic and Non-Clifford Gates in Topological Quantum Field Theory", "abstract": "Non-Clifford gates, used to generate quantum magic, are essential for universal quantum computation. We show that non-Clifford gates arise naturally from path integrals in topological quantum field theories, where their magic-generating properties are determined by the algebraic data of the theory. In Chern-Simons theory, we construct the Ising interaction gate, whose generator is prepared by path integration over simple three-boundary manifolds, and show that it produces non-local magic away from discrete Clifford points. We show that the Toffoli gate is obstructed in $SU(2)_1$ by the $\\mathbb{Z}_2$ fusion structure, while $SU(2)_3$ is the minimal theory supporting the required conditional logic, given the density of the mapping class group in the projective unitary group on the manifold boundary. Finally, we demonstrate that the T gate arises as a path integral in Dijkgraaf-Witten theory, with gauge group $\\mathbb{Z}_4$, where a single Dehn twist on the boundary torus produces the gate without approximation. These results show that topological path integrals construct gates in multiple levels of the Clifford hierarchy, and across distinct classes of field theories, with implications for topological quantum computing.", "url": "https://arxiv.org/abs/2604.14271", "type": "理论", "summary": "1. 该工作通过拓扑量子场论的路径积分构造了非克利福德量子门。\n2. 其技术亮点在于门的魔术性质由理论代数数据决定，并在特定流形上实现精确无近似实现。\n3. 这为在不同拓扑场论中设计多层级克利福德门及拓扑量子计算提供了理论框架。", "summary_source": "deepseek", "authors": [{"name": "William Munizzi"}, {"name": "Howard J. Schnitzer"}], "featured_authors": [{"name": "William Munizzi"}, {"name": "Howard J. Schnitzer"}], "author_count": 2}, {"id": "2604.14275", "category": "hep-th", "title": "Generalized Complexity Distances and Non-Invertible Symmetries", "abstract": "Non-invertible symmetries of a quantum field theory (QFT) are a natural generalization of unitary symmetries, but in which the product of operators does not satisfy a group multiplication law. We show that such symmetry operations on states define a collection of quantum gates for a parallel quantum computation scheme that includes post-selection / projection as a gate. Structures such as gate complexity and more geometric complexity measures generalize to this setting. We provide a class of distance / distinguishability measures that extend the standard notion of distance for Lie groups to both continuous and discrete non-invertible symmetries, as well as more general linear combinations of unitary quantum gates. We illustrate these considerations by computing the distance between non-invertible symmetries in some 4D and 2D QFTs. We find that the simple objects of a symmetry category can be highly complex computationally.", "url": "https://arxiv.org/abs/2604.14275", "type": "理论", "summary": "1. 该工作表明量子场论中的非可逆对称性操作定义了包含后选择门的并行量子计算方案，并推广了门复杂度与几何复杂度度量。\n2. 其核心贡献是提出了一类广义距离/可区分性度量，将李群的标准距离概念扩展至连续与离散非可逆对称性及更一般的量子门线性组合。\n3. 通过计算四维和二维量子场论中非可逆对称性的距离，发现对称性范畴的简单对象可能具有高计算复杂度，这为相关理论模型与量子信息研究提供了新视角。", "summary_source": "deepseek", "authors": [{"name": "Jonathan J. Heckman"}, {"name": "Rebecca J. Hicks"}, {"name": "Chitraang Murdia"}], "featured_authors": [{"name": "Jonathan J. Heckman"}, {"name": "Rebecca J. Hicks"}, {"name": "Chitraang Murdia"}], "author_count": 3}, {"id": "2604.14279", "category": "hep-th", "title": "Beyond the Dilute Instanton Gas: Resurgence with Exact Saddles in the Double Well", "abstract": "The path-integral approach to the double well has long been limited by the dilute instanton gas approximation. We show that if the finite Euclidean-time structure is taken seriously by using exact saddles, the dilute gas can be sidestepped, allowing the partition function and energy levels to be computed systematically. At each instanton order, the full resurgent structure -- which saddles contribute, what asymptotic growth is expected and how ambiguities cancel -- is encoded in a finite-dimensional Picard--Lefschetz contour integral over the quasi-zero modes with a clear geometric interpretation. Working at finite $T$ is essential: the dilute instanton gas can only access the ground-state splitting, whereas the exact finite-$T$ computation systematically produces the non-perturbative energy splittings for all excited states, including their full dependence on the level number. The key ingredients -- Weierstrass elliptic functions for the saddles, Lamé operators for the fluctuations and Picard--Fuchs equations for the periods -- form a coherent mathematical framework that both overlaps and complements that of Exact WKB.", "url": "https://arxiv.org/abs/2604.14279", "type": "理论", "summary": "1. 该工作通过采用精确的有限虚时鞍点代替稀薄瞬子气体近似，系统计算了双势阱的配分函数与能级。\n2. 其核心在于构建了具有几何解释的有限维皮卡-莱夫谢茨围道积分，将每个瞬子阶数的完整回归结构（鞍点贡献、渐近增长与模糊性消除）编码其中。\n3. 这为精确WKB方法提供了互补的数学框架，并为有限温度非微扰计算与激发态能谱研究开辟了新途径。", "summary_source": "deepseek", "authors": [{"name": "Aurélien Dersy"}, {"name": "Matthew D. Schwartz"}], "featured_authors": [{"name": "Aurélien Dersy"}, {"name": "Matthew D. Schwartz"}], "author_count": 2}, {"id": "2604.14283", "category": "hep-th", "title": "Quantum correction to the diffusion term in stochastic inflation from composite-operator matching in Soft de Sitter Effective Theory", "abstract": "In the framework of Soft de Sitter Effective Theory (SdSET), the Fokker-Planck equation for the late-time dynamics of the massless minimally coupled scalar field and its extension to the Kramers-Moyal equation are obtained from operator mixing of composite operators of the effective superhorizon field. We construct the formalism for composite-operator renormalisation, mixing and matching in dimensional regularisation, allowing for computations beyond the leading order. The general formalism is illustrated in free SdSET, which already features non-trivial structures including the well-known diffusion coefficient for stochastic inflation. As explicit examples in the interacting theory, we renormalise the one-loop bispectrum and the two-loop one-point function of the composite operator $\\varphi_+^2$, and match them onto their full-theory counterparts. These results allow us to determine the next-to-leading order (two-loop) correction to the diffusion term of the Fokker-Planck equation of stochastic inflation for the first time.", "url": "https://arxiv.org/abs/2604.14283", "type": "理论", "summary": "1. 该研究在软德西特有效场论框架下，首次推导了暴胀随机动力学Fokker-Planck方程中扩散项的二阶量子修正。\n2. 通过建立复合算符重整化、混合与匹配的系统形式，实现了超越领头阶的计算，并以此重归一化了一环三点函数与二环单点函数。\n3. 该方法为在更真实的慢滚暴胀模型乃至原初黑洞形成等复杂场景中进行高阶统计量计算提供了可行的技术路径。", "summary_source": "deepseek", "authors": [{"name": "Martin Beneke"}, {"name": "Patrick Hager"}, {"name": "Andrea F. Sanfilippo"}], "featured_authors": [{"name": "Martin Beneke"}, {"name": "Patrick Hager"}, {"name": "Andrea F. Sanfilippo"}], "author_count": 3}, {"id": "2604.14288", "category": "hep-th", "title": "Exact Toda Black Holes of Rank-2 Lie Groups", "abstract": "We consider Einstein gravity coupled to two Maxwell fields and one dilatonic scalar, and construct spherically-symmetric and static black holes that are charged under both Maxwell fields in general $D$ dimensions. We find that for suitable dilaton couplings, the equations of motion can be cast into one-dimensional Toda equations of all rank-2 Lie groups. We devise a brute-force approach to obtain the most general but remarkably elegant solutions to the Toda equations. This allows us to construct exact black holes associated with all the rank-2 Lie groups. The $B_2$ and $G_2$ Toda black holes are new. We study their thermodynamics and verify explicitly an earlier claim in the literature that all these thermodynamic quantities can be derived without having to solve for these black hole solutions.", "url": "https://arxiv.org/abs/2604.14288", "type": "理论", "summary": "1. 本文在任意维度的 Einstein-Maxwell-伸缩子引力框架下，构造了与所有秩-2李群相关的一类带电黑洞精确解。\n2. 关键突破在于发展了一种“蛮力”方法，系统地求解了运动方程所化成的所有秩-2李群一维 Toda 方程，从而获得了形式优美的通解。\n3. 这不仅给出了新的 B_2 和 G_2 Toda 黑洞解，并通过对热力学的研究，明确验证了此类黑洞的热力学量无需具体解形式便可导出的理论预言。", "summary_source": "deepseek", "authors": [{"name": "H. Lu"}, {"name": "Peng-Yu Wu"}, {"name": "Ze-Hua Wu"}, {"name": "Weicheng Zhao"}], "featured_authors": [{"name": "H. Lu"}, {"name": "Peng-Yu Wu"}, {"name": "Ze-Hua Wu"}, {"name": "Weicheng Zhao"}], "author_count": 4}, {"id": "2604.14301", "category": "hep-th", "title": "Carroll fermions, expansions and the lightcone", "abstract": "We investigate fermions on Carrollian manifolds. We complement previous intrinsic analysis by deriving Carrollian fermion actions from a relativistic Dirac theory via a systematic expansion in the speed of light ($c$). We then study relativistic fermions in light-cone coordinates and their connection to Carrollian fermions in one lower dimension. This follows from the recent observation that the Poincaré algebra, written in lightcone coordinates contains (two) co-dimension one Carroll sub-algebras. Our results establish a clear bridge between intrinsic Carrollian constructions, small $c$-expansion and light-cone dynamics. In the process, we understand why Carrollian fermions in $D$-dimensions have features that relate them to relativistic fermions in both $D$ and $(D+1)$ dimensions.", "url": "https://arxiv.org/abs/2604.14301", "type": "理论", "summary": "1. 该工作从相对论狄拉克理论出发，通过系统光速展开推导Carrollian费米子作用量，并研究光锥坐标中费米子与低一维Carrollian费米子的联系，从而补充了先前内在分析。\n2. 其物理卖点在于基于光锥坐标中庞加莱代数的Carroll子代数，建立了内在构造、小c展开和光锥动力学之间的清晰桥梁，阐明Carrollian费米子特征与D维及(D+1)维相对论费米子的关系。\n3. 这为Carrollian物理提供了理论统一性，为电磁极限、维度约化及高维理论的相关研究开辟了新途径，激励后续实验与理论探索。", "summary_source": "deepseek", "authors": [{"name": "Arjun Bagchi"}, {"name": "Saikat Mondal"}], "featured_authors": [{"name": "Arjun Bagchi"}, {"name": "Saikat Mondal"}], "author_count": 2}, {"id": "2604.14335", "category": "hep-th", "title": "Hofstadter's Butterfly in AdS$_3$ Black Holes", "abstract": "We derive the reduced Dirac Hamiltonian on the non-rotating BTZ background and use its redshift structure to construct a gauge-covariant single-band lattice model on the constant-time BTZ cylinder. In equal-area coordinates the AdS radius $L$ fixes the local Gaussian curvature, while the horizon radius $r_h$ fixes the throat size and the strength of the near-horizon redshift. The lattice model therefore has a direct geometric interpretation and is not presented as an unshown reduction of the two-component Dirac lattice. Its angular Fourier transform yields an exact curved Harper equation with BTZ-dependent hopping amplitudes and a consistent dimensionless angular quasi-momentum. We then supplement global parameter scans with state-resolved diagnostics: spectra color-coded by mean radius, local density of states, direct flux-response versus radius correlations, and Aharonov--Bohm spectral flow and persistent current on the BTZ cycle. These results show that weaker curvature sharpens the butterfly-like fragmentation, whereas larger horizons suppress both magnetic and Aharonov--Bohm response by creating weakly dispersing near-horizon states.", "url": "https://arxiv.org/abs/2604.14335", "type": "理论", "summary": "1. 该研究在非旋转BTZ黑洞背景下推导了约化狄拉克哈密顿量，并利用其红移结构在恒定时间BTZ柱面上构建了具有规范协变性的单能带晶格模型。\n2. 模型的关键在于其晶格具有直接的几何诠释，并导出了精确的弯曲Harper方程，其中跳跃振幅与BTZ几何参数直接关联，角向准动量保持无量纲一致性。\n3. 这为研究弯曲时空中量子混沌与几何参数的关联提供了新途径，并可推广至旋转黑洞或更高维AdS时空中的拓扑物态研究。", "summary_source": "deepseek", "authors": [{"name": "Kazuki Ikeda"}, {"name": "Yaron Oz"}], "featured_authors": [{"name": "Kazuki Ikeda"}, {"name": "Yaron Oz"}], "author_count": 2}, {"id": "2604.14340", "category": "hep-th", "title": "One-Loop Quantum Corrections to the Casimir Effect for Rough Plates in the Low-Temperature Regime", "abstract": "We present a theoretical analysis of the one-loop effective potential of a self-interacting real scalar field in the presence of two parallel conducting plates with geometric roughness. Using WKB methods to evaluate the spectral density of the modified Laplace-Beltrami operator, together with contour integration within a $\\zeta$-function regularization scheme, we derive analytical expressions for the quantum corrections to the effective potential induced by perturbative boundary roughness and finite temperature. Furthermore, we compute explicit contributions to the Casimir energy and to the topological mass generation associated with the geometry.", "url": "https://arxiv.org/abs/2604.14340", "type": "理论", "summary": "1. 该工作通过理论分析计算了具有几何粗糙度的平行导体板间自相互作用实标量场的一圈有效势。\n2. 其技术核心在于结合WKB方法与ζ函数正规化，解析导出了微扰边界粗糙度与有限温度共同诱导的量子修正项。\n3. 所得粗糙板卡西米尔能及几何关联拓扑质量生成的显式结果为微结构表面量子效应研究提供了定量理论基础。", "summary_source": "deepseek", "authors": [{"name": "Claudio Bórquez"}, {"name": "Byron Droguett"}], "featured_authors": [{"name": "Claudio Bórquez"}, {"name": "Byron Droguett"}], "author_count": 2}, {"id": "2604.14387", "category": "hep-th", "title": "Emergent States and Algebras from the Double-Scaling limit of Pure States in SYK", "abstract": "Recent work has emphasized a subtlety of large- $N$ limits in AdS/CFT: a sequence of pure states in the microscopic theory need not remain pure with respect to the emergent algebra of observables. We study this phenomenon for Kourkoulou-Maldacena (KM) states in the double-scaling limit of the SYK model, and show that their ensemble-averaged algebraic description depends crucially on which observables survive the limit. For fermionic operators of size $N^{1/2}$, generic operators converge to the usual chord operators of double-scaled SYK. The resulting von Neumann algebra is the standard Type II$_1$ factor, and the KM pure states at infinite temperature converge to the tracial state, so generic probes lose access to microscopic purity. We then identify a class of operators adapted to the KM state that also survives the double-scaling limit. Since the KM state may be viewed as a projection inside the tracial state, these become dressed chord creation and annihilation operators. Once included, the limiting algebra becomes Type I$_\\infty$ and the limiting state becomes pure. This gives a concrete example in which adding a sufficiently state-adapted operator to the emergent algebra restores access to the purity of the underlying state. We further show t
