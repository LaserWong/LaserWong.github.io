uadratic improvement in both $\\lVert\\alpha\\rVert_1$ and $\\varepsilon$. We prove a matching lower bound of $\\Omega(\\lVert\\alpha\\rVert_1/\\varepsilon)$, establishing query-optimality of our approach up to logarithmic factors. Beyond query complexity, we also analyze how these improvements translate into gate costs and show that the query-optimal strategy is not always optimal in practice from the perspective of gate complexity. Our results provide both a query-optimal algorithm and a practically optimal choice of strategy depending on hardware capabilities, along with a complete landscape of intermediate methods to guide practitioners. All algorithms require only amplitude estimation as a subroutine and are thus natural candidates for early-fault-tolerant implementations.", "url": "https://arxiv.org/abs/2604.15214", "type": "理论+数值", "summary": "1. 该工作系统分析了量子核方法中推断过程的查询复杂度，并提出了一种最优算法。\n2. 通过将推断求和编码为单个可观测量期望值并结合量子振幅估计，实现了与样本数无关的O(‖α‖₁/ε)查询复杂度。\n3. 这为早期容错量子计算提供了实用的算法选择策略，并为不同硬件条件下的最优方案部署建立了完整方法论图谱。", "summary_source": "deepseek", "authors": [{"name": "Elies Gil-fuster"}, {"name": "Seongwook Shin"}, {"name": "Sofiene Jerbi"}, {"name": "Jens Eisert"}, {"name": "Maximilian J. Kramer"}], "featured_authors": [{"name": "Elies Gil-fuster"}, {"name": "Seongwook Shin"}, {"name": "Sofiene Jerbi"}, {"name": "Jens Eisert"}, {"name": "Maximilian J. Kramer"}], "author_count": 5}, {"id": "2604.15248", "category": "quant-ph", "title": "IQP circuits for 2-Forrelation", "abstract": "The 2-Forrelation problem provides an optimal separation between classical and quantum query complexity and is also the problem used for separating $\\mathsf{BQP}$ and $\\mathsf{PH}$ relative to an oracle. A natural question is therefore to ask what are the minimal quantum resources needed to solve this problem. We show that 2-Forrelation can be solved using Instantaneous Quantum Polynomial-time ($\\mathsf{IQP}$) circuits, a restricted model of quantum computation in which all gates commute. Concretely, two $\\mathsf{IQP}$ circuits with two quantum queries and efficient classical processing suffice. For the signed variant of 2-Forrelation, even a single $\\mathsf{IQP}$ circuit and query suffices. This answers a recent open question of Girish ( arXiv:2510.06385 ) on the power of commuting quantum computations. We use this to show that $(\\mathsf{BPP}^{\\mathsf{IQP}})^O \\not\\subseteq \\mathsf{PH}^O$ relative to an oracle $O$, strengthening the result of Raz and Tal (STOC 2019). Our results show that $\\mathsf{IQP}$ circuits can be used for classically hard decision problems, thus providing a new route for showing quantum advantage with $\\mathsf{IQP}$ circuits, avoiding the verification difficulties associated with sampling tasks. We also prove Fourier growth bounds for $\\mathsf{IQP}$ circuits in terms of the size of their accepting set. The key ingredient is an algebraic identity of the quadratic function $Q(x) = \\sum_{i < j} x_ix_j$ that allows extracting inner-product phases within an $\\mathsf{IQP}$ circuit.", "url": "https://arxiv.org/abs/2604.15248", "type": "理论+数值", "summary": "1. 该研究证明2-Forrelation问题可由瞬时量子多项式时间(IQP)电路求解，仅需两个查询与高效经典处理，其中带符号变体甚至仅需单次IQP查询。\n2. 关键技术在于利用二次函数Q(x)=∑_{i<j}x_ix_j的代数恒等式，实现在对易门电路框架内提取内积相位信息。\n3. 这不仅强化了Raz-Tal关于(BPP^IQP)^O⊈PH^O的预言分离结果，更为基于IQP电路的经典困难决策问题提供了避免采样验证难题的新型量子优势路径。", "summary_source": "deepseek", "authors": [{"name": "Quentin Buzet"}, {"name": "André Chailloux"}], "featured_authors": [{"name": "Quentin Buzet"}, {"name": "André Chailloux"}], "author_count": 2}, {"id": "2604.15263", "category": "quant-ph", "title": "Computing the free energy of quantum Coulomb gases and molecules via quantum Gibbs sampling", "abstract": "We develop a quantum algorithm for estimating the free energy as well as the total Gibbs state of interacting quantum Coulomb gases and molecular systems in dimensions $d \\in \\{2,3\\}$ at finite temperature. These systems lie beyond the reach of existing methods due to their singular interactions and infinite-dimensional Hilbert space structure. First, we show that the free energy of the full many-body Hamiltonian can be approximated by that of the same Hamiltonian with a finite-rank low-energy truncation of the interaction, with an explicit error bound polynomial in the particle number. This reduces the problem to a controlled finite-rank perturbation problem. Second, we introduce a quantum Gibbs sampling scheme tailored to this truncated system, based on a class of quantum Markov semigroups. Our main analytical result establishes that the associated generator has a strictly positive spectral gap for every truncation, implying exponential convergence to the target Gibbs state. This provides, to our knowledge, the first rigorous mixing-time guarantee for Gibbs sampling in a Coulomb interacting continuous-variable quantum system. Finally, we give an explicit quantum circuit implementation of the dynamics and derive an end-to-end complexity bound for approximating the free energy and the Gibbs state itself. Our results provide a mathematically rigorous route to quantum algorithms for free energy estimation in interacting quantum systems, without relying on classical approximations such as the Born-Oppenheimer reduction.", "url": "https://arxiv.org/abs/2604.15263", "type": "理论+数值", "summary": "1. 该工作开发了一种量子算法，用于估算有限温度下二维和三维量子库仑气体及分子系统的自由能与总吉布斯态。\n2. 其技术核心在于通过有限秩低能截断将奇异相互作用问题转化为可控扰动，并为量子吉布斯采样提供了首个严格的光谱间隙与指数收敛保证。\n3. 这为相互作用量子系统的自由能估计奠定了数学严格的量子算法基础，避免了Born-Oppenheimer等经典近似，启发了连续变量量子模拟的新途径。", "summary_source": "deepseek", "authors": [{"name": "Simon Becker"}, {"name": "Cambyse Rouzé"}, {"name": "Robert Salzmann"}], "featured_authors": [{"name": "Simon Becker"}, {"name": "Cambyse Rouzé"}, {"name": "Robert Salzmann"}], "author_count": 3}, {"id": "2604.15269", "category": "quant-ph", "title": "Cloning is as Hard as Learning for Stabilizer States", "abstract": "The impossibility of simultaneously cloning non-orthogonal states lies at the foundations of quantum theory. Even when allowing for approximation errors, cloning an arbitrary unknown pure state requires as many initial copies as needed to fully learn the state. Rather than arbitrary unknown states, modern quantum learning theory often considers structured classes of states and exploits such structure to develop learning algorithms that outperform general-state tomography. This raises the question: How do the sample complexities of learning and cloning relate for such structured classes? We answer this question for an important class of states. Namely, for $n$-qubit stabilizer states, we show that the optimal sample complexity of cloning is $\\Theta(n)$. Thus, also for this structured class of states, cloning is as hard as learning. To prove these results, we use representation-theoretic tools in the recently proposed Abelian State Hidden Subgroup framework and a new structured version of the recently introduced random purification channel to relate stabilizer state cloning to a variant of the sample amplification problem for probability distributions that was recently introduced in classical learning theory. This allows us to obtain our cloning lower bounds by proving new sample amplification lower bounds for classes of distributions with an underlying linear structure. Our results provide a more fine-grained perspective on No-Cloning theorems, opening up connections from foundations to quantum learning theory and quantum cryptography.", "url": "https://arxiv.org/abs/2604.15269", "type": "理论+数值", "summary": "1. 该工作研究了n量子比特稳定子态克隆与态学习的样本复杂度关系，证明两者均需Θ(n)个样本。\n2. 其技术关键在于利用阿贝尔态隐藏子群框架的表示论工具，并将量子克隆问题与经典学习理论中的样本放大下界相关联。\n3. 这为更精细理解不可克隆定理提供了新视角，建立了量子基础、学习理论与密码学之间的新联系。", "summary_source": "deepseek", "authors": [{"name": "Nikhil Bansal"}, {"name": "Matthias C. Caro"}, {"name": "Gaurav Mahajan"}], "featured_authors": [{"name": "Nikhil Bansal"}, {"name": "Matthias C. Caro"}, {"name": "Gaurav Mahajan"}], "author_count": 3}, {"id": "2604.15298", "category": "quant-ph", "title": "Super-Constant Weight Dicke States in Constant Depth Without Fanout", "abstract": "An $n$-qubit Dicke state of weight $k$, is the uniform superposition over all $n$-bit strings of Hamming weight $k$. Dicke states are an entanglement resource with important practical applications in the NISQ era and, for instance, play a central role in Decoded Quantum Interferometry (DQI). Furthermore, any symmetric state can be expressed as a superposition of Dicke states. First, we give explicit constant-depth circuits that prepare $n$-qubit Dicke states for all $k \\leq \\text{polylog}(n)$, using only multi-qubit Toffoli gates and single-qubit unitaries. This gives the first $\\text{QAC}^0$ construction of super-constant weight Dicke states. Previous constant-depth constructions for any super-constant $k$ required the FANOUT$_n$ gate, while $\\text{QAC}^0$ is only known to implement FANOUT$_k$ for $k$ up to $\\text{polylog}(n)$. Moreover, we show that any weight-$k$ Dicke state can be constructed with access to FANOUT$_{\\min(k,n-k)}$, rather than FANOUT$_n$. Combined with recent hardness results, this yields a tight characterization: for $k \\leq n/2$, weight-$k$ Dicke states can be prepared in $\\text{QAC}^0$ if and only if FANOUT$_k \\in \\text{QAC}^0$. We further extend our techniques to show that, in fact, \\emph{any} superposition of $n$-qubit Dicke states of weight at most $k$ can be prepared in $\\text{QAC}^0$ with access to FANOUT$_k$. Taking $k = n$, we obtain the first $O(1)$-depth unitary construction for arbitrary symmetric states. In particular, any symmetric state can be prepared in constant depth on quantum hardware architectures that support FANOUT$_n$, such as trapped ions with native global entangling operations.", "url": "https://arxiv.org/abs/2604.15298", "type": "理论", "summary": "1. 该工作提出了制备权重k ≤ polylog(n)的n量子比特Dicke态的恒定深度量子电路，仅使用多量子比特Toffoli门和单量子比特酉操作。\n2. 其关键技术突破在于无需FANOUT_n门即可实现超常数权重Dicke态，首次在QAC^0复杂度类中完成此类构造，并证明仅需FANOUT_min(k,n-k)门即可制备权重k的Dicke态。\n3. 这为任意对称态的恒定深度制备提供了通用方案，特别适用于支持全局纠缠操作的量子硬件架构，同时建立了Dicke态可制备性与FANOUT_k门属于QAC^0的严格等价关系。", "summary_source": "deepseek", "authors": [{"name": "Lucas Gretta"}, {"name": "Meghal Gupta"}, {"name": "Malvika Raj Joshi"}], "featured_authors": [{"name": "Lucas Gretta"}, {"name": "Meghal Gupta"}, {"name": "Malvika Raj Joshi"}], "author_count": 3}, {"id": "2604.15300", "category": "quant-ph", "title": "Ensembles of random quantum states tunable from volume law to area law", "abstract": "A standard approach to generate random pure quantum states relies on sampling from the Haar measure. However, the entanglement properties of such states present a fundamental challenge for their general applicability. Here, we introduce the $\\sigma$-ensembles $\\unicode{x2013}$ a family of random quantum states with only a single control parameter. Crucially, these states are designed such that they can be tuned between volume-law and area-law behavior, which has been a major obstacle thus far. We construct representatives of this ensemble by imposing a probability distribution on the eigenvalues of the successive subsystems, and subsequently reconstructing a compatible global state using the matrix product state (MPS) formalism. Due to their area-law entanglement, our approach circumvents the intractability of Haar-random pure states in classical simulations of quantum systems and is more representative of typical Hamiltonian ground states.", "url": "https://arxiv.org/abs/2604.15300", "type": "理论+数值", "summary": "1. 该工作提出了一个单参数可控的随机量子态系综，即σ-系综。\n2. 其核心在于通过控制子系统特征值的概率分布，并利用矩阵乘积态形式重建全局态，实现从体积律到面积律的可调谐纠缠行为。\n3. 这为量子系统的经典模拟提供了可处理的方法，并更准确地代表了典型哈密顿量基态的纠缠特性。", "summary_source": "deepseek", "authors": [{"name": "Héloïse Albot"}, {"name": "Sebastian Paeckel"}], "featured_authors": [{"name": "Héloïse Albot"}, {"name": "Sebastian Paeckel"}], "author_count": 2}, {"id": "2604.15307", "category": "quant-ph", "title": "Heuristic Search for Minimum-Distance Upper-Bound Witnesses in Quantum APM-LDPC Codes", "abstract": "This paper investigates certified upper bounds on the minimum distance of an explicit family of Calderbank-Shor-Steane quantum LDPC codes constructed from affine permutation matrices. All codes considered here have active Tanner graphs of girth eight. Rather than attempting to prove a general lower bound for the full code distance, we focus on constructing low-weight non-stabilizer logical representatives, which yield valid upper bounds once they are verified to lie in the opposite parity-check kernel and outside the stabilizer row space. We develop a unified framework for such witnesses arising from latent row relations, restricted-lift subspaces including block-compressed, selected-fiber, and CRT-stripe constructions, cycle- 8 elementary trapping-set structures, and decoder-failure residuals. In every case, search is used only to generate candidates; the reported bounds begin only after explicit kernel and row-space exclusion tests have been passed. For the latent part, we also identify a block-compression criterion under which the certification becomes exact. Applying these methods to representative APM-LDPC codes sharpens previously reported upper bounds and provides concrete certified values across the explored parameter range.", "url": "https://arxiv.org/abs/2604.15307", "type": "理论", "summary": "1. 该工作通过启发式搜索为基于仿射置换矩阵的量子LDPC码构造最小距离的上界见证。\n2. 其技术核心在于建立从潜在行关系到限制提升子空间等多元见证的统一框架，并依赖显式核与行空间排除测试确保证书。\n3. 所得认证上界锐化了先前结果，为APM-LDPC码的参数范围提供了具体参考值。", "summary_source": "deepseek", "authors": [{"name": "Kenta Kasai"}], "featured_authors": [{"name": "Kenta Kasai"}], "author_count": 1}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>${paper.summary_source === "deepseek" ? "DeepSeek three-sentence PRL summary" : (paper.summary_source === "local-fallback" ? "Local three-sentence fallback" : (paper.summary_source === "translation" ? "Chinese abstract translation" : "Chinese placeholder fallback"))}</span><a href="${safeUrl}" target="_blank" rel="noreferrer">Open arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
