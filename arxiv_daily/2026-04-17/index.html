hat correlators of the dressed operators admit exact modified chord-diagram rules, derive analytic expressions for uncrossed $2n$-point and crossed four-point functions, analyze their finite-temperature semiclassical and Schwarzian limits, study a deformation of the chord Hamiltonian that produces bound states and extends the correspondence with JT gravity plus an EOW brane to general brane tension, and identify an emergent $U(1)$ symmetry together with its finite-$N$ violation. Finally, we discuss analogies with boundary algebras proposed for black hole interiors and closed universes, and suggest lessons from our construction for both.", "url": "https://arxiv.org/abs/2604.14387", "type": "理论", "summary": "1. 该工作研究了双标度极限下SYK模型中Kourkoulou-Maldacena纯态的涌现代数结构及其对观测算符选择的高度依赖性。\n2. 通过引入适配于该纯态的算符，极限代数从标准的Type II₁因子转变为Type I∞因子，从而在涌现层面恢复了底层微观态的纯度。\n3. 这一具体构造为黑洞内部与封闭宇宙边界代数的相关理论探讨提供了可精确计算的范例与启示。", "summary_source": "deepseek", "authors": [{"name": "Harshit Rajgadia"}, {"name": "Jiuci Xu"}], "featured_authors": [{"name": "Harshit Rajgadia"}, {"name": "Jiuci Xu"}], "author_count": 2}, {"id": "2604.14436", "category": "hep-th", "title": "Half-BPS Impurity Backgrounds and Supersymmetry", "abstract": "We develop a rigid $\\mathscr{N} =(1,1)$ superspace framework for spatially inhomogeneous impurity deformations in $D=1+1$ dimensions by embedding the impurity profile into a real background superfield (spurion). This spurionic completion provides a manifestly supersymmetric description at the level of the action and offers a systematic route to identify which inhomogeneous backgrounds preserve a nontrivial subset of supercharges. Focusing on static interface-type configurations, we determine the half-BPS condition on the spurion background and the corresponding supersymmetry projector. In the resulting half-BPS sector we derive the associated first-order BPS equation for static bosonic matter configurations and establish an exact Bogomol'nyi completion of the static energy, yielding a sharp bound saturated by BPS solutions. We further comment on how explicit coordinate dependence and derivative-dependent impurity couplings can obstruct the Bogomol'nyi structure, thereby motivating spurionic extensions that retain supersymmetric control over inhomogeneous deformations.", "url": "https://arxiv.org/abs/2604.14436", "type": "理论", "summary": "1. 该工作发展了一套刚性 $\\mathscr{N}=(1,1)$ 超空间框架，用于描述一维空间非均匀杂质形变，并将杂质分布嵌入背景超场（spurion）中。\n2. 其核心在于通过spurionic完成，在作用量层面实现了超对称的显式描述，系统识别了保留部分超荷的非均匀背景，并针对静态界面构型导出了半BPS条件、超对称投影算符以及与之关联的一阶BPS方程。\n3. 这为处理显式坐标依赖性和导数型杂质耦合提供了受超对称控制的系统性方法，避免了其对Bogomol'nyi结构的破坏，从而拓展了非均匀可积形变的理论研究途径。", "summary_source": "deepseek", "authors": [{"name": "D. Bazeia"}, {"name": "A. C. Lehum"}], "featured_authors": [{"name": "D. Bazeia"}, {"name": "A. C. Lehum"}], "author_count": 2}, {"id": "2604.14453", "category": "hep-th", "title": "Thermality Breakdown in Null-Shifted Rindler Wedges", "abstract": "We investigate the behaviour of quantum fields in null-shifted Rindler wedges and analyse the particle spectra perceived by accelerated observers associated with these null deformations. Unlike the standard Unruh effect, our analysis compares two accelerated frames connected by a null displacement. We consider both massive scalar and Dirac fields, constructing their corresponding mode solutions in Rindler coordinates. Using normalised field expansions, we compute the Bogoliubov transformations between modes defined in the two null-shifted wedges. Our results demonstrate a fundamental breakdown of thermality: the presence of mass modifies the mode structure, rendering the characteristic exponential mixing of frequencies absent. This suggests that the massive field remains unexcited on this background, leading to a manifestly nonthermal response. These findings highlight that thermality in accelerated frames depends sensitively on the conformal symmetry of the field, which is broken by the introduction of a mass term.", "url": "https://arxiv.org/abs/2604.14453", "type": "理论", "summary": "1. 该工作研究了零移Rindler楔形中量子场的粒子谱，分析了标量与狄拉克场在具有零位移的加速观者下的行为。\n2. 核心发现是质量项破坏了共形对称性，导致模态结构改变，使得频率间的特征指数混合消失，呈现非热响应。\n3. 这揭示了加速观者的热性质严格依赖于场的共形对称性，为研究对称性破缺与观测者依赖效应提供了新视角。", "summary_source": "deepseek", "authors": [{"name": "Rakesh K Jha"}], "featured_authors": [{"name": "Rakesh K Jha"}], "author_count": 1}, {"id": "2604.14492", "category": "hep-th", "title": "Spinning States and Unitarity in 3D Gravity", "abstract": "We revisit the proposal to cure the negative density of states in the three-dimensional gravitational path integral by adding spinning states whose spin scales with the central charge. We show that sub-extremal and extremal spinning states below the black hole threshold can cancel the known negativities, and interpret these states as bulk spinning defects. Additionally, certain overspinning states above the black hole threshold can cure these negativities while preserving the spectral gap. Previously interpreted as classical spinning strings, we instead identify these overspinning states with overspinning BTZ geometries, which are smooth pure gravity quotients of AdS$_3$ with no fixed points. All of these spinning geometries exhibit causal pathologies in their Lorentzian continuations. Moreover, the overspinning geometries arise from mixed elliptic-hyperbolic identifications and contain a right-moving temperature and quasinormal modes. We also generalize the computation of scalar correlators to the extremal and overspinning backgrounds.", "url": "https://arxiv.org/abs/2604.14492", "type": "理论", "summary": "1. 该工作通过引入自旋与中心荷标度相关的自旋态，重新审视了三维引力路径积分中负态密度问题的解决方案。\n2. 研究指出亚极值/极值自旋缺陷可消除黑洞阈值以下的负性，而超自旋BTZ几何则能在维持能隙的同时解决阈值以上的负性问题。\n3. 这些具有因果病理性的几何的发现，以及标量关联函数计算向极值与超自旋背景的推广，为理解三维量子引力的幺正性提供了新视角。", "summary_source": "deepseek", "authors": [{"name": "Ziyi Li"}], "featured_authors": [{"name": "Ziyi Li"}], "author_count": 1}, {"id": "2604.14508", "category": "hep-th", "title": "Fermionic modes of D-instanton wormholes from broken local supersymmetry", "abstract": "In low-energy supergravity treatment of type IIB superstring on general D-instanton wormhole profiles in the bulk, we obtain non-vanishing scalar two-point functions in addition to the vanishing $\\langle \\tau^* \\tau^* \\rangle$ that corresponds to the BPS amplitude detected by two D-instantons at their respective boundaries. This is exploited to show that the modes of broken local supersymmetry in the bulk deliver the fermionic (diagonal) modes on the boundaries through the deformation by the form of current-current two point functions propagating on the tree level cylinder geometry. Our treatment is generalizable to multi D-instanton cases and general Euclidean branes.", "url": "https://arxiv.org/abs/2604.14508", "type": "理论", "summary": "1. 本文在低能超引力框架下研究了IIB型超弦中一般D-瞬子虫洞构型，并计算了标量两点函数。\n2. 其核心发现是，体中的局域超对称性破缺模式通过柱面几何上的流-流关联变形，传递至边界并产生费米性（对角）模式。\n3. 该处理方法可推广至多D-瞬子情形及一般欧几里得膜，为研究虫洞背景下超对称破缺的微观机制提供了普适框架。", "summary_source": "deepseek", "authors": [{"name": "H. Itoyama"}, {"name": "Hikaru Kawai"}, {"name": "Shoichi Kawamoto"}], "featured_authors": [{"name": "H. Itoyama"}, {"name": "Hikaru Kawai"}, {"name": "Shoichi Kawamoto"}], "author_count": 3}, {"id": "2604.14522", "category": "hep-th", "title": "Double-scaled bosonic and fermionic embedded ensembles, complex SYK, and the dual Hilbert space", "abstract": "We derive the density of states along with the $2$- and $4$-point functions of embedded ensembles for both fermions and bosons in the double-scaled limit. It is shown the models are equivalent to the double-scaled Sachdev-Ye-Kitaev model, expanding the double-scaled universality class to include both fermionic and bosonic systems. The models can be solved by introducing the Wick product of non-commuting Gaussian random variables. We show that deriving the Wick product is sufficient for computing the density of states, and properties of the Wick product can be used to compute $n$-point functions directly in the energy basis. In this context, the Wick product is equivalent to normal ordering of $q$-oscillators, which leads to the duality between moments of double-scaled models and expectation values in the chord Hilbert space. By considering operator probes as a second set of oscillators, we extend the duality to compute $n$-point functions. Embedded ensembles are equivalent to complex SYK at fixed charge, and we show working directly with embedded ensembles streamlines the derivations.", "url": "https://arxiv.org/abs/2604.14522", "type": "理论", "summary": "1. 该工作推导了双标度极限下费米子与玻色子嵌入系综的态密度及2点、4点函数，并证明其与双标度SYK模型等价。\n2. 核心在于引入非对易高斯随机变量的维克积，该运算等价于q振子的正规序，从而建立了双标度模型矩与弦希尔伯特空间期望值间的对偶性。\n3. 这拓展了双标度普适类至玻色系统，且基于嵌入系综的框架为处理固定电荷下的复杂SYK模型提供了更简明的推导途径。", "summary_source": "deepseek", "authors": [{"name": "Jarod Tall"}, {"name": "Steven Tomsovic"}], "featured_authors": [{"name": "Jarod Tall"}, {"name": "Steven Tomsovic"}], "author_count": 2}, {"id": "2604.14549", "category": "hep-th", "title": "Loop integrals in de Sitter spacetime: The parity-split IBP system and $\\di\\log$-form differential equations", "abstract": "We develop integration-by-parts (IBP) reduction and differential equations for massive loop integrals of cosmological correlators in de Sitter (dS) spacetime, demonstrating the feasibility of this approach. We identify a structural property of the dS IBP system: for an \\(n\\)-propagator family, it splits into \\(2^n\\) closed subsystems classified by the parity of the propagator indices. We further formulate a Baikov representation for loop integrals in dS space and derive the corresponding dimensional recurrence relations. In flat spacetime, intersection theory shows that \\(\\di\\log\\)-form master integrands lead to \\(\\di\\log\\)-form differential equations. Motivated by fibration intersection theory, we conjecture that this construction extends to dS integrands involving Hankel functions. We verify this conjecture in the one-loop bubble family and determine the associated alphabet.", "url": "https://arxiv.org/abs/2604.14549", "type": "理论", "summary": "1. 本文为de Sitter时空中宇宙学关联函数的圈图计算建立了积分分部（IBP）约化与微分方程框架。\n2. 关键结构特性在于，dS时空的IBP系统会根据传播子指标的宇称，分裂为2^n个封闭子系统。\n3. 基于纤维化相交理论的猜想将dilogarithm形式微分方程推广至dS积分，为一圈以上更复杂拓扑的计算指明了方向。", "summary_source": "deepseek", "authors": [{"name": "Jiaqi Chen"}, {"name": "Bo Feng"}, {"name": "Zhehan Qin"}, {"name": "Yi-Xiao Tao"}], "featured_authors": [{"name": "Jiaqi Chen"}, {"name": "Bo Feng"}, {"name": "Zhehan Qin"}, {"name": "Yi-Xiao Tao"}], "author_count": 4}, {"id": "2604.14741", "category": "hep-th", "title": "The OPE Approach to Renormalization: Operator Mixing", "abstract": "We extend the OPE-based renormalization algorithm to composite operators with operator mixing, focusing on scalar operators in $\\phi^4$ and $\\phi^3$ models. Using the OPE of operators with a fundamental field, we show that the $Z$-factors of these composite operators are determined by OPE coefficients of lower-dimensional traceless symmetric tensor operators, and establish a recursive renormalization framework. We report the five-loop anomalous dimensions for operators with $\\Delta\\le5$ in the $\\phi^4$ model and the two-loop anomalous dimensions for operators with $\\Delta\\le10$ in the $\\phi^3$ model. These results further demonstrate the versatility and efficiency of the OPE-based algorithm.", "url": "https://arxiv.org/abs/2604.14741", "type": "理论", "summary": "1. 该工作将基于算符乘积展开的重整化算法推广至存在算符混合的复合算符，聚焦于 $\\phi^4$ 和 $\\phi^3$ 模型中的标量算符。\n2. 其核心在于利用算符与基本场的 OPE 系数，递归地确定复合算符的重整化因子，从而建立了系统的重整化框架。\n3. 该递归框架的效能通过高圈反常维度计算得以验证，为研究更广泛量子场论中的算符重正化提供了有力工具。", "summary_source": "deepseek", "authors": [{"name": "Jinpeng Zhang"}, {"name": "Qingjun Jin"}], "featured_authors": [{"name": "Jinpeng Zhang"}, {"name": "Qingjun Jin"}], "author_count": 2}, {"id": "2604.14824", "category": "hep-th", "title": "Decrease of the entanglement entropy of the Hawking radiation induced by backreaction in the Bose-Einstein condensate", "abstract": "We analytically study the effect of backreaction from analog Hawking radiation on its entanglement entropy in the Bose-Einstein condensate (BEC). The backreaction is expected to play an essential role in the decrease of the entanglement entropy and in realizing the Page curve. Since the BEC theory has microscopic Hamiltonian and thus exhibits unitarity, it is desirable to reproduce the Page curve explicitly by using the Hamiltonian. In order to analyze this in a concrete example, we study the BEC with a step-like configuration that has been extensively studied in the literature. By using the microscopic theory, we derive an explicit form of backreaction from analog Hawking radiation. Combining it with the known results of the Bogoliubov coefficients, we analytically compute the entanglement entropy of the Hawking radiation, and show that it decreases as expected due to the backreaction for sufficiently low energy modes over a wide range of the parameter characterizing the step-like configuration.", "url": "https://arxiv.org/abs/2604.14824", "type": "理论", "summary": "1. 该工作通过微观哈密顿量解析研究了玻色-爱因斯坦凝聚体台阶构型中模拟霍金辐射的反作用效应。\n2. 研究利用微观理论显式推导了反作用形式，并结合波戈留波夫系数解析证明了低能模下纠缠熵的减少。\n3. 这为在幺正性框架内通过具体模型重现佩奇曲线提供了明确的理论范例。", "summary_source": "deepseek", "authors": [{"name": "Tsunehide Kuroki"}], "featured_authors": [{"name": "Tsunehide Kuroki"}], "author_count": 1}, {"id": "2604.14899", "category": "hep-th", "title": "The ODE/IM Correspondence between $C (2)^{(2)}$-type Linear Problems and 2d $\\mathcal{N} = 1$ SCFT", "abstract": "We study the ODE/IM correspondence between the linear problem associated with the supersymmetric affine Toda field equation for the twisted affine Lie superalgebra $C (2)^{(2)} = \\mathfrak{osp} (2 | 2)^{(2)}$ and two-dimensional $\\mathcal{N} = 1$ superconformal field theories (SCFTs). On the ODE side, we introduce a boundary condition more suitable for the conformal limit and the subsequent WKB analysis and diagonalize the resulting Lax operator. This leads to a WKB expansion from which we extract the WKB periods and non-local conserved quantities up to tenth order. On the IM side, we compute the eigenvalues of the local integrals of motion on the cylinder in both the Neveu-Schwarz and Ramond sectors of 2d $\\mathcal{N} = 1$ SCFTs. We then compare the two sides and verify, up to sixth order, that the WKB periods coincide with the eigenvalues of the local integrals of motion for highest-weight states in the Neveu-Schwarz sector.", "url": "https://arxiv.org/abs/2604.14899", "type": "理论", "summary": "1. 该工作系统研究了与扭曲仿射李超代数$C (2)^{(2)}$相关的超对称仿射Toda场方程线性问题，同二维$\\mathcal{N} = 1$超共形场论之间的ODE/IM对应关系。\n2. 其技术关键在于引入适用于共形极限的边界条件，对角化Lax算子并提取WKB周期及非局部守恒量至十阶，同时在SCFT的Neveu-Schwarz与Ramond扇区计算局部运动积分特征值，并于Neveu-Schwarz扇区最高权重态验证两者一致性至六阶。\n3. 这一对应关系的精确验证为ODE/IM框架在超对称可积系统中的应用提供了新范例，并为深入探究扭曲仿射超代数与二维超共形场论的结构关联奠定了理论基础。", "summary_source": "deepseek", "authors": [{"name": "Naozumi Tanabe"}], "featured_authors": [{"name": "Naozumi Tanabe"}], "author_count": 1}, {"id": "2604.14939", "category": "hep-th", "title": "Correlators in $T\\bar{T}$ and Root-$T\\bar{T}$ Deformed CFTs", "abstract": "Quasi-primary correlators in two-dimensional conformal field theories deformed simultaneously by $T\\bar T$ and root-$T\\bar T$ are studied. A path-integral formulation motivated by the geometric realization of the combined deformation is used to develop a geometric framework for evaluating the deformed correlators. Within this framework, the two-point function is obtained to all orders in the $T\\bar T$ coupling and to leading order in the root-$T\\bar T$ coupling, while the leading correction to the three-point function is computed. It is further shown that the deformed two-point correlator admits a kernel representation as a weighted average of undeformed CFT correlators over conformal dimensions. This representation is derived explicitly for both the pure $T\\bar T$ deformation and the combined flow. In this way, the mixed $T\\bar T$/root-$T\\bar T$ deformation is incorporated into the geometric description of irrelevant deformations, and the structure of local correlators beyond the pure $T\\bar T$ case is characterized more explicitly.", "url": "https://arxiv.org/abs/2604.14939", "type": "理论", "summary": "1. 该工作研究同时受$T\\bar T$与根号$T\\bar T$变形的二维共形场论中准原初关联函数，建立了基于几何实现的路径积分框架。\n2. 技术亮点在于导出了变形两点函数在$T\\bar T$耦合任意阶、根号$T\\bar T$耦合领头阶的显式解，并给出了其作为未变形CFT关联函数按共形维度加权平均的核表示。\n3. 这首次将混合$T\\bar T$/根号$T\\bar T$流纳入无关变形的几何描述框架，为研究超越纯$T\\bar T$变形的局域关联函数结构提供了具体范式。", "summary_source": "deepseek", "authors": [{"name": "Bo-Rui Li"}, {"name": "Song He"}, {"name": "Yu-Xiao Liu"}], "featured_authors": [{"name": "Bo-Rui Li"}, {"name": "Song He"}, {"name": "Yu-Xiao Liu"}], "author_count": 3}, {"id": "2604.15018", "category": "hep-th", "title": "Boundary lines and Askey-Wilson type moments", "abstract": "The Wilson line defect half-indices for 3d $\\mathcal{N}=2$ gauge theories with boundary confining phases admit a formulation in terms of the Askey-Wilson type moments. In the dual Landau-Ginzburg description the dual line operators can be realized as vortex line defects which induce singular behavior of chiral multiplets associated with the minimal monopole operators, together with additional one-dimensional degrees of freedom. By incorporating such a singular structure as an effective spin shift into the index computation, we obtain exact closed-form expressions for the line defect half-indices which are Askey-Wilson type moments.", "url": "https://arxiv.org/abs/2604.15018", "type": "理论", "summary": "1. 该论文针对三维N=2规范理论中边界约束相下的威尔逊线缺陷半指数，推导出了以Askey-Wilson型矩表达的精确闭式解析公式。\n2. 其核心物理创新在于，在对偶朗道-金兹堡描述中，将涡旋线缺陷诱导的最小磁单极子相关手性多重态奇异行为及附加一维自由度作为有效自旋移动整合进指标计算。\n3. 这为线缺陷在规范理论中的精确研究、对偶性框架的拓展以及特殊函数论于量子场论的应用提供了关键理论工具和明确探索方向。", "summary_source": "deepseek", "authors": [{"name": "Tadashi Okazaki"}, {"name": "Douglas J. Smith"}], "featured_authors": [{"name": "Tadashi Okazaki"}, {"name": "Douglas J. Smith"}], "author_count": 2}, {"id": "2604.15117", "category": "hep-th", "title": "Monodromy Defects for Electric-Magnetic Duality, Hyperbolic Space, and Lines", "abstract": "In this note we explore monodromy defects for non-invertible symmetries in Maxwell theory, exploiting the conformal mapping to $AdS_{3} \\times S^{1}$. With this approach we recover the spectrum of the defect conformal primaries. We also dedicate some time discussing the behaviour of Wilson/'t Hooft lines in the presence of such a monodromy defect, and highlight the following aspects of their behaviour: i) the lines can terminate on the defect, ii) lines of the unit electric (magnetic) charge may seize to be indecomposable, and can be represented as integer powers of some more elementary lines, and iii) they behave as topological objects when brought close to the defect, and this behaviour is governed by a Chern-Simons theory.", "url": "https://arxiv.org/abs/2604.15117", "type": "理论", "summary": "1. 该研究通过将麦克斯韦理论映射至AdS₃×S¹，系统探讨了非可逆对称性的单值缺陷及其与威尔逊/'t Hooft线算符的相互作用。\n2. 核心发现揭示了线算符在缺陷处可终止、基本荷量子可分解，且其近缺陷拓扑行为由三维陈-西蒙斯理论描述。\n3. 这为理解高维规范理论中的扩展算子分类及其在全息对偶中的实现提供了新范式。", "summary_source": "deepseek", "authors": [{"name": "Vladimir Bashmakov"}], "featured_authors": [{"name": "Vladimir Bashmakov"}], "author_count": 1}, {"id": "2604.15187", "category": "hep-th", "title": "Extraordinary Surface Criticalities for Interacting Fermions", "abstract": "Interacting fermions exhibit a rich landscape of surface defects and associated critical phenomena. We investigate novel surface critical behavior in the three-dimensional Gross-Neveu-Yukawa model. For a class of defect renormalization group flows, we obtain exact infrared solutions and show how fermionic anomalies are encoded in the resulting surface dynamics. We further uncover emergent topological and geometric structures in the defect coupling space, and comment on their relation to a defect analogue of the CFT distance conjecture.", "url": "https://arxiv.org/abs/2604.15187", "type": "理论", "summary": "1. 该研究考察了三维Gross-Neveu-Yukawa模型中相互作用费米子的新奇表面临界行为，针对一类缺陷重整化群流获得了精确红外解。\n2. 其核心在于揭示了费米子反常如何被编码在最终的表面动力学中，并在缺陷耦合空间中揭示了涌现的拓扑与几何结构。\n3. 这些发现深化了对缺陷量子场论的理解，并与CFT距离猜想的一个缺陷类比相联系，为探索边界条件与普适类的关系提供了明确方向。", "summary_source": "deepseek", "authors": [{"name": "Oleksandr Diatlyk"}, {"name": "Zimo Sun"}, {"name": "Yifan Wang"}], "featured_authors": [{"name": "Oleksandr Diatlyk"}, {"name": "Zimo Sun"}, {"name": "Yifan Wang"}], "author_count": 3}, {"id": "2604.15235", "category": "hep-th", "title": "Sampling the Graviton Pole and Deprojecting the Swampland", "abstract": "We develop a primal bootstrap framework for effective field theories in the presence of a graviton pole, based on finite-resolution sampling rather than smearing, while also allowing direct control over the number of subtractions. We show that this approach reproduces the known projective bounds obtained from smearing in $D{\\ge}6$, while yielding slightly stronger bounds in $D{=}5$. This method also makes it straightforward to impose linearized unitarity directly and provides an access to the extremal spectra. Applying the method to crossing-symmetric dispersion relations, we derive new non-projective bounds that fix the overall scale of the EFT couplings. In $D{=}5$, for example, we find that $\\frac{M}{M_{\\rm P}}{\\lesssim}7.8$, showing that the EFT cutoff cannot be taken parametrically larger than the Planck scale. At the extremal values of the couplings, the spectra exhibit a surprising structure: for projective bounds, they exhibit peaks around quadratic Regge-like trajectories, while for the non-projective bounds they form sharp quadratic bands. In the latter case, the leading coefficients further display an inverse-quadratic dependence on the band number.", "url": "https://arxiv.org/abs/2604.15235", "type": "理论", "summary": "1. 该工作为包含引力子极点的有效场论建立了基于有限分辨率采样（而非抹除）的原始自举框架，并应用于交叉对称的色散关系。\n2. 该方法在D≥6维度重现了已知投影界限，在D=5中给出了更强约束，并首次导出了可固定EFT耦合整体尺度的非投影界限。\n3. 由此获得M/MP≲7.8等显式截止标度约束，且极值谱呈现二次雷杰轨迹峰值或锐利二次能带结构，为研究沼泽地与非微扰引力关联提供了新途径。", "summary_source": "deepseek", "authors": [{"name": "Guangzhuo Peng"}, {"name": "Laurentiu Rodina"}, {"name": "Anna Tokareva"}, {"name": "Yongjun Xu"}], "featured_authors": [{"name": "Guangzhuo Peng"}, {"name": "Laurentiu Rodina"}, {"name": "Anna Tokareva"}, {"name": "Yongjun Xu"}], "author_count": 4}, {"id": "2604.15251", "category": "hep-th", "title": "Kontorovich-Lebedev-Fourier Space for de Sitter Correlators", "abstract": "In this work, we build a novel frequency-momentum space for $(d+1)$-dimensional de Sitter (dS) correlators from first principles. This construction follows directly from the decomposition into unitary irreducible representations (UIRs) of the spacetime isometry group $\\mathrm{SO}(1,d+1)$. While the spatial momentum space is given by the standard $d$-dimensional Fourier transform, the frequency space arises from diagonalising the quadratic Casimir operator, leading to the $(d+1)$-dimensional Kontorovich-Lebedev-Fourier (KLF) transform. We show that square-integrable functions decompose only along the principal series, whereas more general functions can receive discrete contributions from other UIRs. Applying this framework to the bulk CFT two-point function reproduces its Källén-Lehmann representation. Using the path integral formulation, we derive the Feynman rules for in-in perturbation theory in KLF space, leading to the introduction of KLF-space correlators, which are simply related to late-time correlation functions through a reduction formula. Furthermore, the KLF-space formulation sheds light on the simple mathematical structure of perturbative computations. In particular, the propagators take the form of simple rational functions, and tree-level diagrams can be written as spectral integrals over known meromorphic functions, as demonstrated in the example of the single-exchange four-point function. At the loop level, we show, through the example of the self-energy correction to the scalar propagator, that the group-theoretical nature of the construction allows the momentum integral to be recast as an orthogonality relation among $\\mathrm{SO}(1,d+1)$ Clebsch-Gordan coefficients.", "url": "https://arxiv.org/abs/2604.15251", "type": "理论", "summary": "1. 该工作从时空等距群的幺正不可约表示分解出发，构建了(d+1)维德西特时空关联子的新型频率-动量空间，即Kontorovich-Lebedev-Fourier空间。\n2. 其核心在于通过二次Casimir算符对角化导出KLF变换，使得传播子成为有理函数形式，树图可表为已知亚纯函数的谱积分，从而揭示了微扰计算的简洁数学结构。\n3. 该框架的群论本质将动量积分重述为SO(1,d+1)克莱布什-戈丹系数的正交关系，为系统处理德西特时空中的圈图计算提供了新的理论工具。", "summary_source": "deepseek", "authors": [{"name": "Nathan Belrhali"}, {"name": "Arthur Poisson"}, {"name": "Sébastien Renaux-Petel"}, {"name": "Denis Werth"}], "featured_authors": [{"name": "Nathan Belrhali"}, {"name": "Arthur Poisson"}, {"name": "Sébastien Renaux-Petel"}, {"name": "Denis Werth"}], "author_count": 4}, {"id": "2604.14412", "category": "math-ph", "title": "On the inverse scattering transform for the KdV equation with summable initial data", "abstract": "We consider the Cauchy problem for the Korteweg--de Vries equation with real initial data $q$ that is both $L^1$ and $L^2$ summable and supported on (0,\\infty). Using the left reflection coefficient and Hankel operators on the Hardy space $H^2$, we derive a trace-type representation for the corresponding solution. The proof is based on approximation by compactly supported potentials, uniform convergence of the associated reflection coefficients away from the origin, and continuity properties of the resulting Hankel operators. This yields a rigorous inverse scattering construction for a class of summable half-line supported initial data beyond the standard short-range setting.", "url": "https://arxiv.org/abs/2604.14412", "type": "理论", "summary": "1. 本工作研究了KdV方程在实初始数据q满足L^1与L^2可求和且支集于正半直线(0,∞)的柯西问题，建立了基于逆散射变换的解决方案。\n2. 其技术核心在于通过左反射系数和Hardy空间H^2上的Hankel算子推导出解的迹型表示，并借助紧支撑势逼近、反射系数在原点外的一致收敛性及算子连续性实现严格构造。\n3. 这为超越标准短程条件的可求和半直线支持初始数据类提供了严谨逆散射框架，对可积系统与散射理论的拓展具有明确启发。", "summary_source": "deepseek", "authors": [{"name": "Alexei Rybkin"}], "featured_authors": [{"name": "Alexei Rybkin"}], "author_count": 1}, {"id": "2604.14542", "category": "math-ph", "title": "The $n$-Point Function of $t$-Core Partitions and Topological Vertex", "abstract": "In this paper, we study the $n$-point function of $t$-core partitions. The main tool is the topological vertex, originally developed to study the topological string theory for toric Calabi--Yau 3-folds. By virtue of the topological vertex, we introduce the $q$-deformed $n$-point function that generalizes both the ordinary $n$-point function of all integer partitions studied by Bloch--Okounkov and $t$-core partition case treated here. As a consequence, we provide a closed formula for the $n$-point function of $t$-core partitions in terms of theta functions, and prove that the corresponding correlation functions are quasimodular forms.", "url": "https://arxiv.org/abs/2604.14542", "type": "理论", "summary": "1. 该工作应用拓扑顶点方法研究了t-核分割的n点函数。\n2. 其卖点在于引入了q变形的n点函数，给出了闭式theta函数表达式并证明相关函数为拟模形式。\n3. 这为拓扑弦理论、整数分割及模形式理论的交叉研究提供了新视角。", "summary_source": "deepseek", "authors": [{"name": "Chenglang Yang"}], "featured_authors": [{"name": "Chenglang Yang"}], "author_count": 1}, {"id": "2604.14681", "category": "math-ph", "title": "An inversion formula for the 2-body interaction given the correlation functions", "abstract": "Given a classical gas described by the truncated correlation functions of all orders, we prove convergence of an expansion of the pair interaction part of the (unknown) potential in terms of the truncated correlation functions of all orders, at infinite volume.", "url": "https://arxiv.org/abs/2604.14681", "type": "理论", "summary": "1. 该研究针对由全阶截断关联函数描述的经典气体，证明了在无穷体积极限下，未知势能的二体相互作用部分可按关联函数展开的收敛性。\n2. 其核心突破在于从所有关联函数中严格重构二体相互作用的反演公式，这为从观测数据推断微观相互作用提供了理论基础。\n3. 这一严格结果将推动基于关联测量的逆问题研究，并可能拓展至量子系统或非平衡态中相互作用的重构。", "summary_source": "deepseek", "authors": [{"name": "Fabio Frommer"}, {"name": "Tobias Kuna"}, {"name": "Dimitrios Tsagkarogiannis"}], "featured_authors": [{"name": "Fabio Frommer"}, {"name": "Tobias Kuna"}, {"name": "Dimitrios Tsagkarogiannis"}], "author_count": 3}, {"id": "2604.14835", "category": "math-ph", "title": "Hamiltonian Monodromy in a Tavis-Cummings System with an $A_2$ Singularity", "abstract": "Singular Lagrangian fibrations arising from three-degree-of-freedom integrable Hamiltonian systems remain largely unexplored. While several results describe the global structure of large classes of systems with two degrees of freedom, only a few examples are understood in higher dimensions. We present a three-degree-of-freedom system derived from the two-spin Tavis-Cummings model whose singular Lagrangian fibration exhibits a topology that has not been observed in other physical models. We show that the most degenerate singular fiber is homeomorphic to $\\mathbf{S}^2\\times\\mathbf{S}^1$ with a singularity of $A_2$ type. We further describe the bifurcation diagram and the global topology of the fibration, and we compute its Hamiltonian monodromy.", "url": "https://arxiv.org/abs/2604.14835", "type": "理论", "summary": "1. 本文构建并分析了源自双自旋Tavis-Cummings模型的三自由度可积系统的奇异拉格朗日纤维化。\n2. 核心发现是揭示了一种具有A₂型奇点的S²×S¹拓扑结构，并计算了其哈密顿单值性。\n3. 这项工作为理解高维可积系统的全局拓扑结构及分类提供了新的具体范例。", "summary_source": "deepseek", "authors": [{"name": "Konstantinos Efstathiou"}, {"name": "Gabriela Jocelyn Gutierrez-Guillen"}, {"name": "Pavao Mardešić"}, {"name": "Dominique Sugny"}], "featured_authors": [{"name": "Konstantinos Efstathiou"}, {"name": "Gabriela Jocelyn Gutierrez-Guillen"}, {"name": "Pavao Mardešić"}, {"name": "Dominique Sugny"}], "author_count": 4}, {"id": "2604.15246", "category": "math-ph", "title": "Blocking of 2D bistable reaction-diffusion fronts by obstacles", "abstract": "We investigate numerically the blocking of two-dimensional bistable reaction diffusion fronts by geometric obstacles. Our goal is to derive quantitative criteria for front propagation in the presence of spatial heterogeneities. Using a conservation law approach, we show that the integral of the reaction term acts as an effective driving force for the front. Combining this insight with the exact one-dimensional traveling wave solution, we construct a reduced analytical model that predicts blocking thresholds. In particular, we obtain explicit conditions for front propagation in a waveguide connected to a conical region of angle theta, valid for widths w less than 4. The model captures the influence of both geometry and nonlinearity, and shows good agreement with numerical simulations. Finally, we extend the analysis to more complex geometries, including checkerboard-like obstacles, and derive simple heuristic rules governing front propagation. ~", "url": "https://arxiv.org/abs/2604.15246", "type": "理论", "summary": "1. 该工作通过数值模拟系统研究了二维双稳态反应扩散锋面在几何障碍物中的阻塞行为，旨在建立空间异质性环境中锋面传播的定量预测准则。\n2. 物理上的关键创新在于基于守恒律阐明了反应项积分作为锋面有效驱动力的机制，并通过结合一维精确行波解构建了能准确预测阻塞阈值的简化解析模型，例如针对锥形波导推导出宽度w<4时的显式传播条件。\n3. 此模型进一步应用于棋盘状等复杂障碍几何，所获启发式规则与模拟结果吻合，为异质介质中非线性波传播动力学的理论与数值研究提供了新途径。", "summary_source": "deepseek", "authors": [{"name": "J.-G. Caputo"}, {"name": "G. Cruz-Pacheco"}, {"name": "J. Gatlik"}, {"name": "B. Sarels"}], "featured_authors": [{"name": "J.-G. Caputo"}, {"name": "G. Cruz-Pacheco"}, {"name": "J. Gatlik"}, {"name": "B. Sarels"}], "author_count": 4}, {"id": "2604.14224", "category": "quant-ph", "title": "Scrambling of Entanglement from Integrability to Chaos: Bootstrapped Time-Integrated Spread Complexity", "abstract": "A time-integrated measure of complexity is proposed for diagnosing the degree of quantum ergodicity. The scrambling dynamics of maximally entangled states within the ensemble of unitary evolutions are quantified by applying numerical bootstrapped realizations of an ensemble of Hamiltonians, probing different unitary paths. Using Rosenzweig-Porter ensembles, we show that the integrated spread complexity provides a fine-grained resolution across different ergodic regimes. This approach offers a robust method for diagnosing quantum chaos from early to late times.", "url": "https://arxiv.org/abs/2604.14224", "type": "理论+数值", "summary": "1. 该工作提出了基于时间积分铺展复杂度的新诊断方案，用于量化最大纠缠态在哈密顿量系综下的酉演化信息置乱动力学。\n2. 其核心技术在于采用数值自举方法实现哈密顿量系综采样，并利用Rosenzweig-Porter模型展示了该方法对遍历性区间的精细分辨能力。\n3. 这为从早期到晚期全面诊断量子混沌提供了鲁棒工具，并可推广至其他具有遍历性转变的随机矩阵模型研究。", "summary_source": "deepseek", "authors": [{"name": "M. Süzen"}], "featured_authors": [{"name": "M. Süzen"}], "author_count": 1}, {"id": "2604.14234", "category": "quant-ph", "title": "Consciousness, Quantum Mechanics, and the Limits of Scientific Objectivism", "abstract": "Consciousness and quantum mechanics are among the most puzzling phenomena studied in the sciences. Some scholars suggest they are related, though others think this claim commits a \"minimization of mystery\" fallacy. The aim of this programmatic paper is to draw attention to a less widely discussed parallel between consciousness and quantum mechanics: both challenge the classical objectivist worldview of science. Under certain assumptions, they are each in tension with a package of metaphysical theses -- \"non-relationalism\", \"non-fragmentation\", and \"one world\" -- that jointly make up that worldview. This points to three distinct non-objectivist responses: the \"relationalist\", \"fragmentalist\", and \"many-subjective-worlds\" ones. We will map out their pros and cons.", "url": "https://arxiv.org/abs/2604.14234", "type": "理论", "summary": "1. 该纲领性论文系统阐述了意识与量子力学如何共同挑战经典科学客观主义世界观，并剖析了三种非客观主义哲学回应的利弊。\n2. 核心论点是二者均与构成客观主义世界观的“非关系性”、“非片段性”和“单一世界”这组形而上学命题存在张力。\n3. 这一分析为未来在科学与哲学交叉领域发展连贯的非客观主义理论框架提供了清晰的比较图谱和概念基础。", "summary_source": "deepseek", "authors": [{"name": "John B. DeBrota"}, {"name": "Christian List"}], "featured_authors": [{"name": "John B. DeBrota"}, {"name": "Christian List"}], "author_count": 2}, {"id": "2604.14277", "category": "quant-ph", "title": "Entanglement and circuit complexity in finite-depth random linear optical networks", "abstract": "We study the growth of entanglement and circuit complexity in random passive linear optical networks as a function of the circuit depth. For entanglement dynamics, we start with an initial Gaussian state with all $n$ modes squeezed. For random brickwall circuits, we show that entanglement, as measured by the Rényi-2 entropy, grows at most diffusively as a function of the depth. In the other direction, for arbitrary circuit geometries we prove bounds on depths which ensure the average subsystem entanglement reaches within a constant factor of the maximum value in all subsystems, and bounds which ensure closeness of the random linear optical unitary to a Haar random unitary in $L^2$ Wasserstein distance. We also consider robust circuit complexity for random one-dimensional brickwall circuits, as measured by the minimum number of gates required in any circuit that approximately implements the linear optical unitary. Viewing this as a function of the number of modes and the circuit depth, we show the robust circuit complexity for random one-dimensional brickwall circuits scales at most diffusively in the depth with high probability. The corresponding Gaussian unitary $\\tilde{\\mathcal U}$ for the approximate implementation retains high output fidelity $|\\langle\\psi|\\mathcal U^\\dagger \\tilde{\\mathcal U}|\\psi\\rangle|^2$ for pure states $|\\psi\\rangle$ with constrained expected photon-number.", "url": "https://arxiv.org/abs/2604.14277", "type": "理论", "summary": "1. 该工作系统研究了随机被动线性光学网络中纠缠熵（以Rényi-2熵度量）和鲁棒电路复杂性作为电路深度函数的演化，初始态为全模式压缩高斯态。\n2. 其核心卖点在于证明了随机砖墙电路中纠缠增长最多为扩散性，并为任意电路几何建立了深度边界，以确保平均子系统纠缠接近最大值且随机酉算子在L^2 Wasserstein距离下近似Haar随机。\n3. 这为有限深度随机光学网络的复杂度分析、受约束预期光子数纯态的高保真近似实现以及量子信息处理中的资源优化提供了理论依据。", "summary_source": "deepseek", "authors": [{"name": "Laura Shou"}, {"name": "Joseph T. Iosue"}, {"name": "Yu-Xin Wang"}, {"name": "Victor Galitski"}, {"name": "Alexey V. Gorshkov"}], "featured_authors": [{"name": "Laura Shou"}, {"name": "Joseph T. Iosue"}, {"name": "Yu-Xin Wang"}, {"name": "Victor Galitski"}, {"name": "Alexey V. Gorshkov"}], "author_count": 5}, {"id": "2604.14291", "category": "quant-ph", "title": "Operator Space Transport and the Emergence of Boundary Time Crystals", "abstract": "Boundary time crystals (BTCs) are prominent examples of continuous time crystals in collective spin systems governed by Lindbladian evolution. To date, their analysis has mostly relied on semiclassical and numerical approaches. Here, we develop a fully quantum-compatible framework to classify collective spin dynamics and show that BTC behavior emerges from the absence of non-trivial weak symmetries of the Liouvillian. To this end, we introduce an irreducible tensor representation of operator space, in which the Lindbladian dynamics maps onto a non-Hermitian hopping problem. Within this picture, the dynamics corresponds to the transport of operator weight across tensor sectors. This mapping allows an identification of distinct dynamical regimes, including collective precession, pure relaxation, and the BTC phase, within a single unified framework. We show that BTCs arise from non-reciprocal transport in operator space, which delocalizes Liouvillian eigenmodes across multiple tensor sectors. This non-reciprocal transport provides a microscopic mechanism for the insensitivity to initial conditions of BTC oscillations. More broadly, our results establish operator space transport as a perspective for understanding dissipative many-body dynamics and highlights connections to non-Hermitian phenomena.", "url": "https://arxiv.org/abs/2604.14291", "type": "理论+数值", "summary": "1. 该工作发展了一个全量子兼容的框架，用以分类集体自旋动力学并阐明边界时间晶体（BTC）的涌现机制。\n2. 其核心在于将算符空间的不可约张量表示映射为非厄米跳跃问题，揭示了BTC相源于算符空间中的非互易输运，这为振荡对初值不敏感提供了微观解释。\n3. 这为从算符输运视角统一理解耗散多体动力学开辟了新途径，并建立了与非厄米物理现象的深刻联系。", "summary_source": "deepseek", "authors": [{"name": "Dominik Nemeth"}, {"name": "Ahsan Nazir"}, {"name": "Robert-Jan Slager"}, {"name": "Alessandro Principi"}], "featured_authors": [{"name": "Dominik Nemeth"}, {"name": "Ahsan Nazir"}, {"name": "Robert-Jan Slager"}, {"name": "Alessandro Principi"}], "author_count": 4}, {"id": "2604.14381", "category": "quant-ph", "title": "Learning Cut Distributions with Quantum Optimization", "abstract": "Many combinatorial optimization problems admit a maximin fairness variant, where the aim is to find a distribution over possible solutions which maximizes an expected worst-case outcome. However, the support for an optimal distribution may be exponential, which can be intractable to represent in the worst case. To this end, we propose a quantum based approach to solving distribution optimization problems. Expanding on work analyzing the Dynamical Lie Algebras of the Quantum Approximate Optimization Algorithm (QAOA), we show that with a finite number of layers, a QAOA ansatz can be constructed to capture any distribution over bitstrings. We show that the resulting circuit is able to effectively solve the Fair Cut Cover, a fair interpretation of the classical Fractional Cut Cover Problem. In addition, we show that our algorithm is provably better than classical approximations on certain graph structures and empirically outperforms these classical algorithms on tested instances.", "url": "https://arxiv.org/abs/2604.14381", "type": "理论+数值", "summary": "1. 该工作提出了一种基于量子近似优化算法（QAOA）的量子方法，用于求解最大化极小公平性的分布优化问题，并以公平割覆盖——经典分数割覆盖问题的公平变体——作为具体应用实例。\n2. 通过扩展对QAOA动力学李代数的理论分析，证明了有限层数的QAOA拟设能够精确表示任意比特串分布，从而构建出可有效求解公平割覆盖的量子电路。\n3. 此算法在特定图结构上被理论证明优于经典近似方法，并在测试实例中实证表现更佳，为量子优化处理组合问题的公平变体提供了新框架，并启发了后续实验与理论探索。", "summary_source": "deepseek", "authors": [{"name": "Bao Bach"}, {"name": "Cameron Ibrahim"}, {"name": "Reuben Tate"}, {"name": "Jad Salem"}, {"name": "Stephan Eidenbenz"}, {"name": "Ilya Safro"}], "featured_authors": [{"name": "Bao Bach"}, {"name": "Cameron Ibrahim"}, {"name": "Reuben Tate"}, {"name": "Jad Salem"}, {"name": "Stephan Eidenbenz"}, {"name": "Ilya Safro"}], "author_count": 6}, {"id": "2604.14382", "category": "quant-ph", "title": "Revealing the physical structure of the general quantum master equation", "abstract": "The Lindblad (GKLS) master equation, which represents the mathematical form for the general evolution of a density matrix, is a versatile and widely-used tool in open quantum systems. In contrast with the typical approach of imposing additional conditions on the system, such as weak coupling or energy conservation, we explore the structure of the equation with no assumptions. We demonstrate that general quantum dynamics can be expressed through a combination of free evolution, exchanges of some physical quantities (generalised charges), not necessarily commuting with the Hamiltonian, between the system and the bath, and pure dephasing. This result comprises a novel perspective on quantum master equations, employing physical processes as elemental parts. We use it to explore the dynamics and stationary states of a two-level system and show that strong coupling, particle exchange, and non-Abelian effects all share the same physical origin. Moreover, we demonstrate that the generalised Gibbs state for all three cases contains a non-commutation term, which has not been previously considered.", "url": "https://arxiv.org/abs/2604.14382", "type": "理论", "summary": "1. 该工作在不引入任何额外假设的条件下，重构了广义林德布拉德主方程的物理结构，将一般量子动力学表达为自由演化、系统与环境间广义电荷交换及纯退相干的组合。\n2. 其核心在于将主方程分解为可物理诠释的基本过程，揭示了强耦合、粒子交换与非阿贝尔效应皆源于广义电荷交换这一共同物理本质。\n3. 由此发现三类情形下的广义吉布斯态均包含以往未被考虑的非对易修正项，为深入研究非平衡稳态的普适结构提供了新方向。", "summary_source": "deepseek", "authors": [{"name": "Eugenia Pyurbeeva"}, {"name": "Ronnie Kosloff"}], "featured_authors": [{"name": "Eugenia Pyurbeeva"}, {"name": "Ronnie Kosloff"}], "author_count": 2}, {"id": "2604.14435", "category": "quant-ph", "title": "Distributed Variational Quantum Linear Solver", "abstract": "The Variational Quantum Linear Solver (VQLS), a hybrid quantum-classical algorithm for solving linear systems, faces a practical scalability bottleneck: the Linear Combination of Unitaries (LCU) decomposition requires O(L^2) circuit evaluations per optimizer iteration, where $L$ can grow as 4^n for n-qubit systems for the worst case scenario. We address this computational bottleneck through two complementary strategies. First, we present a distributed VQLS (D-VQLS) framework, built on NVIDIA CUDA-Q, that enables asynchronous, scalable distribution of the O(L^2) cost-function evaluations. Second, a fast Walsh--Hadamard transform (FWHT)-based Pauli decomposition with 1% coefficient thresholding curbs the exponential growth of LCU terms, reducing L from O}(2^n) to O(1) for n > 6 qubits and compressing the per-iteration circuit complexity from O(n * 4^n) to O(n) for sparse, structured matrices. For a 10-qubit tridiagonal Toeplitz system, this yields a 256x reduction, from 23 million to 90,112 circuits per iteration, while preserving over $99.99\\%$ solution fidelity. Additionally, to inform feasibility on early fault-tolerant QPUs, the paper provides resource estimates -- gate counts, qubit requirements, and circuit evaluations per iteration -- for VQLS applied to arbitrary matrices. The D-VQLS framework is validated on the NERSC Perlmutter supercomputer using multi-node, multi-GPU ideal state-vector simulations, achieving over 99.99% fidelity against classical solutions on tridiagonal Toeplitz and Hele--Shaw flow benchmarks, with near-ideal strong scaling up to 24 GPUs and 95.3% weak scaling efficiency at 96 GPUs processing 360,448 circuits per iteration for a 10-qubit system. Systematic profiling identifies the optimal resource allocation for distributed quantum circuit workloads, yielding a 2.52x speedup for the configurations studied.", "url": "https://arxiv.org/abs/2604.14435", "type": "理论+数值", "summary": "1. 该工作通过分布式变分量子线性求解器（D-VQLS）框架与基于快速沃尔什-哈达玛变换（FWHT）的系数阈值化方法，解决了VQLS算法中线性组合酉算（LCU）分解导致的电路评估数指数增长问题。\n2. 技术核心在于将每迭代的电路评估复杂度从O(n*4ⁿ)降至O(n)，并对10量子位三对角Toeplitz系统实现256倍压缩，同时利用多节点多GPU分布式计算在Perlmutter超算上验证了近理想的强扩展性。\n3. 这为早期容错量子处理器上线性系统求解的资源分配提供了系统化性能剖析依据，并为大规模分布式量子-经典混合计算任务的最优资源配置奠定了方法论基础。", "summary_source": "deepseek", "authors": [{"name": "Chao Lu"}, {"name": "Pooja Rao"}, {"name": "Muralikrishnan Gopalakrishnan Meena"}, {"name": "Kalyana Chakaravarthi Gottiparthi"}], "featured_authors": [{"name": "Chao Lu"}, {"name": "Pooja Rao"}, {"name": "Muralikrishnan Gopalakrishnan Meena"}, {"name": "Kalyana Chakaravarthi Gottiparthi"}], "author_count": 4}, {"id": "2604.14617", "category": "quant-ph", "title": "Optimal Quantum Logarithmic Trace Inequality", "abstract": "We establish a sharp logarithmic trace inequality that strengthens recent bounds of Cheng et al.( arXiv:2507.07961 ) by replacing their prefactor $c_s/s$ with the strictly smaller constant $G_s$. The constant $G_s$ is defined via the scalar inequality $\\log(1+r)\\le G_s r^s$ and admits a closed-form expression in terms of the Lambert $W$ function. Our approach introduces an iterative integration-by-parts procedure that lifts optimal scalar bounds to the operator level without loss. We prove that $G_s$ is the optimal universal constant, in the sense that no smaller constant satisfies the inequality for all positive operators. For density matrices, this optimality persists up to $s\\le \\frac{1}{2\\log(2)}$, while beyond this threshold the commuting case exhibits a strictly smaller optimal constant and the noncommuting case remains open. In the regime $s\\to0$, our result improves the prefactor $c_s/s$ of Cheng et al. by a factor of $1/e$. These sharper inequalities enhance key primitives in quantum information theory, including decoupling, convex-splitting, and covering lemmas, leading to tighter finite-resource bounds.", "url": "https://arxiv.org/abs/2604.14617", "type": "理论", "summary": "1. 该工作确立了最优量子对数迹不等式，通过引入严格更小的常数G_s取代Cheng等人近期结果中的前置因子c_s/s，强化了对数迹界限。\n2. 技术核心在于采用迭代分部积分程序，将基于Lambert W函数的标量最优界无损推广至算子水平，并证明G_s是所有正算子的全局最优普适常数。\n3. 对于密度矩阵，该不等式在s≤1/(2log2)范围内保持最优，超越后交换情形有更小常数而非交换情形开放；这提升了去耦合、凸分裂等量子信息原语的效率，为有限资源分析提供了更紧界限。", "summary_source": "deepseek", "authors": [{"name": "Gilad Gour"}], "featured_authors": [{"name": "Gilad Gour"}], "author_count": 1}, {"id": "2604.14721", "category": "quant-ph", "title": "Spectroscopic measurement of the Casimir-Polder force in the intermediate regime", "abstract": "The Casimir-Polder (CP) effect -- the force between a neutral atom and an uncharged conducting plate in empty space -- is an intriguing consequence of quantum vacuum fluctuations. The typically attractive CP potential crosses over from a scaling of $z^{-3}$ at short separations to $z^{-4}$ at long distances, where retardation effects due to the finite speed of light become important. At intermediate distances, where the atom--surface separation is of the order of the wavelength of the dominant atomic transition, experiments have so far relied on indirect methods, such as diffraction or quantum reflection, to observe the CP effect. Here, we directly reveal the CP force between strontium atoms and a dielectric surface via the induced shifts in the atomic energy levels in the intermediate regime. We spectroscopically probe the CP-induced kHz-frequency shift of ultracold atoms confined by a magic-wavelength optical lattice at 189(2)~nm from the surface -- on the scale of the dominant 461-nm transition. Our measurements agree well with QED calculations and differ from the short-range approximation, while excluding the long-distance one. This paves the way for studying the CP effect across various surface properties and geometries, as well as exploring the tensor nature of the atom-surface potential -- all important for the development of hybrid atomic optical-magnetic quantum devices.", "url": "https://arxiv.org/abs/2604.14721", "type": "实验", "summary": "1. 本工作通过光谱方法直接测量了锶原子与介质表面在中间距离下的卡西米尔-玻尔德力引起的原子能级移动。\n2. 其技术核心在于利用魔幻波长光晶格在距表面189纳米处囚禁超冷原子，并探测由461纳米主跃迁波长尺度上的相互作用导致的千赫兹频移。\n3. 该实验为研究不同表面特性和几何构型中的卡西米尔-玻尔德效应，以及探索原子-表面势的张量性质开辟了道路，这对发展混合原子光磁量子器件具有重要意义。", "summary_source": "deepseek", "authors": [{"name": "K. Ton"}, {"name": "G. Kestler"}, {"name": "D. A. Steck"}, {"name": "J. T. Barreiro"}], "featured_authors": [{"name": "K. Ton"}, {"name": "G. Kestler"}, {"name": "D. A. Steck"}, {"name": "J. T. Barreiro"}], "author_count": 4}, {"id": "2604.14801", "category": "quant-ph", "title": "Coherence dynamics in quantum algorithm for linear systems of equations", "abstract": "Quantum coherence is a fundamental issue in quantum mechanics and quantum information processing. We explore the coherence dynamics of the evolved states in HHL quantum algorithm for solving the linear system of equation $A\\overrightarrow{x}=\\overrightarrow{b}$. By using the Tsallis relative $\\alpha$ entropy of coherence and the $l_{1,p}$ norm of coherence, we show that the operator coherence of the phase estimation $P$ relies on the coefficients $\\beta_{i}$ obtained by decomposing $|b\\rangle$ in the eigenbasis of $A$. We prove that the operator coherence of the inverse phase estimation $\\widetilde{P}$ relies on the coefficients $\\beta_{i}$, eigenvalues of $A$ and the success probability $P_{s}$, and it decreases with the increase of the probability when $\\alpha\\in(1,2]$. Moreover, the variations of coherence deplete with the increase of the success probability and rely on the eigenvalues of $A$ as well as the success probability.", "url": "https://arxiv.org/abs/2604.14801", "type": "理论+数值", "summary": "1. 该工作通过Tsallis相对α熵和l1,p范数量化分析了HHL量子算法求解线性方程组时演化态的相干性动力学。\n2. 研究揭示了相位估计算子P的相干性取决于本征基展开系数βi，而逆相位估计算子P̃的相干性则额外依赖于矩阵A的本征值及成功概率Ps，并在α∈(1,2]时随概率增大而减小。\n3. 该结果为优化量子算法中的相干资源分配、控制退相干效应以及评估算法实际性能提供了定量理论依据。", "summary_source": "deepseek", "authors": [{"name": "Linlin Ye"}, {"name": "Zhaoqi Wu"}, {"name": "Shao-Ming Fei"}], "featured_authors": [{"name": "Linlin Ye"}, {"name": "Zhaoqi Wu"}, {"name": "Shao-Ming Fei"}], "author_count": 3}, {"id": "2604.14812", "category": "quant-ph", "title": "Time-Dependent Logarithmic Perturbation Theory for Quantum Dynamics: Formulation and Applications", "abstract": "We present a time-dependent extension of logarithmic perturbation theory for nonrelativistic quantum dynamics governed by the Schrödinger equation, in which the logarithm of the wave function is expanded in powers of a coupling constant. The resulting hierarchy of equations defining the perturbative corrections is governed by a gauge-rotated Hamiltonian of the unperturbed system and leads to closed-integral expressions for the time-dependent corrections based on Duhamel's formula. This closed-integral structure of corrections is a hallmark of time-independent logarithmic perturbation theory and is preserved in the present extension. This structure, in particular, provides a computable expression for the instantaneous energy shift. Furthermore, dynamic energy shifts arise naturally within this framework in the form of time-averaged expectation values of pseudopotentials and can be related, for example, to AC Stark shifts and electric polarizabilities. As an illustration, we apply the method to the harmonic oscillator and the hydrogen atom, both driven by a time-dependent laser field. The harmonic oscillator provides a proof of principle for which the exact solution is recovered, while the hydrogen atom illustrates the method applied to atomic systems. Supported by numerical simulations, we demonstrate the applicability to obtain relevant physical observables with high accuracy. The present approach offers a promising alternative for analytical studies of time-dependent multi-photon processes in the perturbative regime.", "url": "https://arxiv.org/abs/2604.14812", "type": "理论+数值", "summary": "1. 本文提出了量子动力学中时间依赖对数微扰理论的扩展形式，并将其应用于激光场驱动下的谐振子与氢原子体系，以获取高精度的物理观测量。\n2. 其核心在于通过规范旋转的未微扰哈密顿量，得到了基于Duhamel公式的、具有闭积分结构的微扰修正层级方程，从而提供了瞬时能量移动的可计算表达式。\n3. 该框架为微扰区时间依赖多光子过程的分析研究提供了一种有前景的替代方法，并可自然地描述动态能量移动（如AC斯塔克移动）与电极化率等物理量。", "summary_source": "deepseek", "authors": [{"name": "Juan Carlos del Valle"}, {"name": "Paul Bergold"}, {"name": "Karolina Kropielnicka"}], "featured_authors": [{"name": "Juan Carlos del Valle"}, {"name": "Paul Bergold"}, {"name": "Karolina Kropielnicka"}], "author_count": 3}, {"id": "2604.14855", "category": "quant-ph", "title": "Quantum Thermometry of External Phonon Reservoirs in Driven Open Quantum Systems", "abstract": "We investigate the non-monotonic temperature sensitivity of a coherently driven two-level quantum system coupled to an Ohmic phonon environment. By employing a unitary polaron transformation, we account for phonon-induced renormalization effects that go beyond the standard weak-coupling approximations. Our analysis reveals that the Quantum Fisher Information (QFI) exhibits a prominent peak at an intermediate system-environment coupling strength, identifying an optimal regime for thermal sensing. This behavior emerges from a fundamental competition between environment-induced dissipation enhancement and the exponential suppression of system parameters due to phonon dressing. We demonstrate that while thermometric precision vanishes in both the ultra-weak and strong coupling limits, a properly tuned nonequilibrium steady state can significantly enhance sensitivity. These results suggest that environmental interactions, often viewed as detrimental decoherence sources, can be engineered as a resource to optimize the performance of solid-state quantum thermometers.", "url": "https://arxiv.org/abs/2604.14855", "type": "理论+数值", "summary": "1. 该工作研究了相干驱动的二能级量子系统与欧姆型声子环境耦合时的非单调温度敏感特性。\n2. 通过极化子变换超越弱耦合近似，揭示了量子Fisher信息在中等耦合强度出现峰值的机制，源于环境耗散增强与声子修饰导致参数指数抑制的竞争。\n3. 这为通过调控非平衡稳态及工程化环境相互作用来优化固态量子温度计的灵敏度提供了明确路径。", "summary_source": "deepseek", "authors": [{"name": "Yildiz Berk Ates"}], "featured_authors": [{"name": "Yildiz Berk Ates"}], "author_count": 1}, {"id": "2604.14921", "category": "quant-ph", "title": "Split-Evolution Quantum Phase Estimation for Particle-Conserving Hamiltonians", "abstract": "We present a hardware demonstration and resource analysis of split-evolution quantum phase estimation (SE-QPE) on a Quantinuum System Model H2 quantum computer. SE-QPE is a modification to canonical QPE for particle-conserving Hamiltonians in which controlled time evolution is replaced by CSWAP-based interference between a target register and a reference register. For factorizations of time evolution with a shared eigenbasis, SE-QPE preserves the phase-register outcome distribution of canonical QPE and, unlike with compute--uncompute substitutions, it remains compatible with non-exact eigenstates. The substitution removes controlled-simulation overhead and enables parallel evolution on two registers, reducing the depth of each phase-kickback block. Resource analysis for Trotterized double-factorized chemistry Hamiltonians shows that the substitution becomes increasingly favorable at higher phase powers, as such combining QPE and SE-QPE implementations can be a useful option. Over a range of FeMoco active spaces, SE-QPE reduces time evolution resources, with asymptotic reductions of about 33% in CX count, 25% in $T$ count, and an asymptotic depth ratio of $3/N$ for CX layers. On Quantinuum H2-2, a four-qubit model ethylene demonstration with explicit inverse QFT and repeated phase-kickback steps up to 6 phase bits yields distinct energies and shows the auxiliary registers provide useful error detection filters.", "url": "https://arxiv.org/abs/2604.14921", "type": "理论+数值", "summary": "1. 该工作在Quantinuum H2量子计算机上实现了针对粒子数守恒哈密顿量的分割演化量子相位估计（SE-QPE）的硬件演示，并进行了详细的资源分析。\n2. 其技术核心在于用基于CSWAP的寄存器间干涉替代受控时间演化，避免了受控模拟开销，允许并行演化，从而显著降低了相位反冲模块的电路深度与资源需求。\n3. 对Trotter化双因子化学哈密顿量的分析表明，该方案在较高相位幂次下优势显著，为结合标准QPE与SE-QPE的混合实现提供了实用路径，并能利用辅助寄存器实现有效的错误检测。", "summary_source": "deepseek", "authors": [{"name": "Megan Cerys Rowe"}, {"name": "Carlo A. Gaggioli"}, {"name": "Ludmila Szulakowska"}, {"name": "David Muñoz Ramo"}, {"name": "David Zsolt Manrique"}], "featured_authors": [{"name": "Megan Cerys Rowe"}, {"name": "Carlo A. Gaggioli"}, {"name": "Ludmila Szulakowska"}, {"name": "David Muñoz Ramo"}, {"name": "David Zsolt Manrique"}], "author_count": 5}, {"id": "2604.14931", "category": "quant-ph", "title": "Learning to Concatenate Quantum Codes", "abstract": "Concatenating quantum error correction codes scales error correction capability by driving logical error rates down double-exponentially across levels. However, the noise structure shifts under concatenation, making it hard to choose an optimal code sequence. We automate this choice by estimating the effective noise channel after each level and selecting the next code accordingly. In particular, we use learning-based methods to tailor small, non-additive encoders when the noise exhibits sufficient structure, then switch to standard codes once the noise is nearly uniform. In simulations, this level-wise adaptation achieves a target logical error rate with far fewer qubits than concatenating stabilizer codes alone--reducing qubit counts by up to two orders of magnitude for strongly structured noise. Therefore, this hybrid, learning-based strategy offers a promising tool for early fault-tolerant quantum computing.", "url": "https://arxiv.org/abs/2604.14931", "type": "数值", "summary": "1. 该研究提出了一种基于学习的自适应策略，用于优化量子纠错码的级联序列选择。\n2. 其核心创新在于利用机器学习为结构化噪声定制非加性编码器，并在噪声均匀化后切换至标准码，从而显著提升纠错效率。\n3. 这一混合方法将实现目标逻辑错误率所需量子比特数降低达两个数量级，为早期容错量子计算提供了高效的资源优化路径。", "summary_source": "deepseek", "authors": [{"name": "Nico Meyer"}, {"name": "Christopher Mutschler"}, {"name": "Dominik Seuß"}, {"name": "Andreas Maier"}, {"name": "Daniel D. Scherer"}], "featured_authors": [{"name": "Nico Meyer"}, {"name": "Christopher Mutschler"}, {"name": "Dominik Seuß"}, {"name": "Andreas Maier"}, {"name": "Daniel D. Scherer"}], "author_count": 5}, {"id": "2604.14946", "category": "quant-ph", "title": "Floquet dynamical quantum phase transitions in periodically flux-quenched systems", "abstract": "Floquet dynamical quantum phase transitions (FDQPTs) reveal many nonequilibrium critical phenomena in periodically driven quantum systems, and their underlying mechanisms have attracted deep attention in recent years. In this paper, we consider an extended XY spin chain under a periodic flux-quench protocol, and demonstrate the effect of the flux difference within each micromotion period on the emergence of FDQPTs, by analyzing physical quantities such as the Loschmidt echo, rate function, and dynamical topological order parameter (DTOP), etc. We also generalize the concept of quench fidelity to periodically driven systems, i.e., Floquet quench fidelity, and discuss the necessary and sufficient conditions for FDQPTs. In contrast to conventional single-quench scenarios, the occurrence of FDQPTs is determined by the requirement of Floquet fidelity condition and segment duration. Our framework may be applied generally to arbitrary periodically driven parameters, providing fundamental insights into how periodic protocols control nonequilibrium phase transitions in quantum many-body systems.", "url": "https://arxiv.org/abs/2604.14946", "type": "理论", "summary": "1. 该工作通过研究周期性通量淬火下扩展XY自旋链，分析了Loschmidt回波、速率函数及动力学拓扑序参量等物理量，揭示了Floquet动力学量子相变（FDQPT）的出现条件。\n2. 其核心在于将淬火保真度概念推广至周期驱动系统，建立了FDQPT发生的充要条件，即Floquet保真度条件与淬火段持续时间共同决定非平衡临界行为。\n3. 该理论框架可推广至任意周期驱动参数体系，为理解量子多体系统中周期协议如何调控非平衡相变提供了普适性见解。", "summary_source": "deepseek", "authors": [{"name": "Wen-Hui Nie"}, {"name": "Mei-Yu Zhang"}, {"name": "Lin-Cheng Wang"}, {"name": "Chong Li"}], "featured_authors": [{"name": "Wen-Hui Nie"}, {"name": "Mei-Yu Zhang"}, {"name": "Lin-Cheng Wang"}, {"name": "Chong Li"}], "author_count": 4}, {"id": "2604.14995", "category": "quant-ph", "title": "Recurrence Time for Finite Quantum Systems", "abstract": "We study the time it takes for all states of a finite quantum system to return simultaneously to their original configuration. In particular, we define the recurrence time for a quantum system to be the time at which all time-evolved states are close to their initial configuration, and at least one state has deviated significantly during this interval. Considering finite-dimensional quantum systems evolving unitarily, we find bounds on this notion of recurrence time, for continuous time and discrete time, by using Dirichlet's approximation theorem. We show how the problem of finding a bound on recurrence time can be related to approximating the difference of real numbers by rationals. We present a mathematical result on the latter, which we then use to obtain tighter bounds on recurrence time.", "url": "https://arxiv.org/abs/2604.14995", "type": "理论", "summary": "1. 该工作定义了有限量子系统中所有态同时回归初态的复发时间，并利用狄利克雷逼近定理给出了连续与离散时间下的界。\n2. 其技术核心在于将复发时间上界的求解问题转化为实数差的有理数逼近问题，并提供了更紧致的数学结果。\n3. 这为有限维量子系统动力学的严格时间尺度分析提供了数学基础，有助于深入理解量子复发行为。", "summary_source": "deepseek", "authors": [{"name": "Chaitanya Gupta"}, {"name": "Anthony J. Short"}], "featured_authors": [{"name": "Chaitanya Gupta"}, {"name": "Anthony J. Short"}], "author_count": 2}, {"id": "2604.15014", "category": "quant-ph", "title": "Runtime-efficient zero-noise extrapolation from mixed physical and logical data", "abstract": "Partial quantum error correction and quantum error mitigation are expected to coexist in the pre-fault-tolerant regime, yet the resource advantage of combining them remains insufficiently quantified. We study zero-noise extrapolation constructed from mixed datasets that contain a small number of error-corrected data points together with data obtained without error correction. The low-noise logical points anchor the extrapolation, while the higher-noise physical points enlarge the noise baseline at a much smaller runtime cost. Under a simple model in which error correction suppresses the effective gate error rate from p to $\\gamma$p, we derive the variance of the zero-noise estimator and compare the physical runtime required to reach a target precision. For Richardson extrapolation, the mixed-data strategy reduces variance amplification and can lower the required physical runtime by several orders of magnitude when $\\gamma \\leq 0.1$. As a proof of principle, we apply the method to digital quantum simulation of a six-spin transverse-field Ising model and find that mixed physical/logical datasets yield lower-variance zero-noise estimates and outperform extrapolation based only on error-corrected data in the parameter regime studied here. These results identify hybrid error correction and error mitigation as a practical route to resource-efficient quantum computation before full fault tolerance.", "url": "https://arxiv.org/abs/2604.15014", "type": "理论+数值", "summary": "1. 该研究提出并量化了在预容错量子计算中，结合部分纠错与误差缓解的混合数据集零噪声外推方法。\n2. 该方法利用少量低噪声逻辑数据点锚定外推，辅以低成本高噪声物理数据点拓宽噪声基线，在纠错系数γ≤0.1时，可将Richardson外推所需的物理运行时间降低数个数量级。\n3. 这为全容错实现前，通过混合纠错与误差缓解策略实现资源高效的量子计算指明了一条切实可行的技术路径。", "summary_source": "deepseek", "authors": [{"name": "D. V. Babukhin"}, {"name": "W. V. Pogosov"}], "featured_authors": [{"name": "D. V. Babukhin"}, {"name": "W. V. Pogosov"}], "author_count": 2}, {"id": "2604.15025", "category": "quant-ph", "title": "Hidden Quantum Advantage near the Decoding Threshold of Decoded Quantum Interferometry", "abstract": "Where is the true boundary of the quantum advantage region of decoded quantum interferometry (DQI)? The best existing answer is provided by Theorem 10.1 of Jordan et al., yet we show that this answer systematically underestimates the extent of quantum advantage. On the standard partial-win LDPC benchmark instance, there exist 26 consecutive parameter points (l in [642, 667]) at which Jordan's analysis declares no quantum advantage (<s>/m < 0.5), while quantum advantage is in fact present with an approximation ratio reaching 0.66. The root cause is that Jordan's bound penalizes the entire system with the worst-case Hamming-layer decoding failure rate epsilon = max_k epsilon_k, discarding the spectral structure of the DQI tridiagonal matrix. Exploiting the concentration of the Perron eigenvector, we replace the uniform penalty with the weighted average epsilon_bar = sum_k epsilon_k w_k^2 and establish a unified lower bound (Master Theorem) valid over arbitrary finite fields F_q, proving that it strictly improves upon the original bound from three independent sources.", "url": "https://arxiv.org/abs/2604.15025", "type": "理论", "summary": "1. 该工作揭示了解码量子干涉仪量子优势边界被系统低估，并在解码阈值附近发现了隐藏的量子优势区域。\n2. 其技术核心是利用Perron特征向量的集中性，以加权平均解码失败率替代最坏情况惩罚，从而建立更严格统一下界。\n3. 这为任意有限域上的量子优势分析提供了改进的Master定理，为相关算法设计与实验验证奠定了新理论基础。", "summary_source": "deepseek", "authors": [{"name": "Maoxin Gao"}, {"name": "Yan Chang"}], "featured_authors": [{"name": "Maoxin Gao"}, {"name": "Yan Chang"}], "author_count": 2}, {"id": "2604.15091", "category": "quant-ph", "title": "Quantum instanton approach to metastable collective spins", "abstract": "Collective spin systems -- spin ensembles coupled to a common reservoir and effectively described by a single macrospin -- play an important role in both atomic and solid-state physics. Their intrinsic nonlinearity gives rise to multiple long-lived metastable states that ultimately relax to a unique most probable state. This dominant state can change with a control parameter, leading to first-order phase transitions. We develop a real-time instanton approach based on quantum quasiprobability dynamics that captures the stationary state in the large-spin limit and the asymptotic scaling of relaxation rates. We further show that these features are not accurately described by the previously applied semiclassical Wigner approach due to its neglect of non-Gaussian fluctuations.", "url": "https://arxiv.org/abs/2604.15091", "type": "理论", "summary": "1. 本文针对集体自旋系统中的亚稳态动力学，发展了一种基于量子拟概率演化的实时瞬子方法。\n2. 该方法在大量子数极限下精确描述了稳态性质与弛豫速率渐近标度，并揭示了半经典Wigner方法因忽略非高斯涨落而导致的不准确性。\n3. 这为研究集体自旋系统及其他非线性耗散量子系统中的弛豫动力学与一级相变机制提供了新的理论工具。", "summary_source": "deepseek", "authors": [{"name": "Krzysztof Ptaszynski"}, {"name": "Maciej Chudak"}, {"name": "Massimiliano Esposito"}], "featured_authors": [{"name": "Krzysztof Ptaszynski"}, {"name": "Maciej Chudak"}, {"name": "Massimiliano Esposito"}], "author_count": 3}, {"id": "2604.15099", "category": "quant-ph", "title": "O3LS: Optimizing Lattice Surgery via Automatic Layout Searching and Loose Scheduling", "abstract": "Toward the large-scale, practical realization of quantum computing, quantum error correction is essential. Among various quantum error-correcting codes, the surface code stands out as a leading candidate, and lattice surgery based on surface codes has emerged as a promising technique for fault-tolerant quantum computation (FTQC). However, implementing quantum algorithms using lattice surgery introduces both resource and time overhead. Existing approaches typically focus on large layout designs, with compiler passes aimed primarily at optimizing time overhead. This often overlooks the trade-off between rotation bottlenecks and movement distance, which leads to inefficient resource utilization and prevents further reduction of the quantum computation failure rate. To address these challenges, we introduce O3LS, a framework for optimizing lattice surgery through automatic layout search and loose scheduling. O3LS achieves an optimal balance by automatically generating squeezed data layouts to reduce space requirements and employing loose scheduling algorithms combined with circuit synthesis techniques to reduce time overhead, thereby effectively minimizing overall logical error rates. Numerical results indicate that O3LS can reduce space overhead by 28.0% over standard layouts and 46.7% over sparse layouts without increasing the number of time steps, leading to suppression of logical error rates by up to 16% relative to larger data layout designs. O3LS can also achieve time overhead reductions of 36.07% and 24.76% in compact and standard data layout designs, respectively. It suppresses logical error rates by up to an order of magnitude compared to prior compilers that focus primarily on maximizing parallelism.", "url": "https://arxiv.org/abs/2604.15099", "type": "理论+数值", "summary": "1. 该工作提出了O3LS框架，通过自动布局搜索与松调度来优化基于表面码的晶格手术，以降低容错量子计算中的资源与时间开销。\n2. 其核心在于自动生成紧凑数据布局以减少空间需求，并结合松调度与电路综合技术优化时间开销，从而在空间与时间开销间取得最优平衡，有效抑制逻辑错误率。\n3. 数值结果显示，该框架在空间开销上相比标准与稀疏布局分别降低28.0%与46.7%，时间开销最高降低36.07%，并将逻辑错误率抑制至多一个数量级，为实用化大规模容错量子计算提供了高效的编译优化路径。", "summary_source": "deepseek", "authors": [{"name": "Chenghong Zhu"}, {"name": "Xian Wu"}, {"name": "Jiahan Chen"}, {"name": "Keming He"}, {"name": "Junjie Wu"}, {"name": "Xin Wang"}, {"name": "Lingling Lao"}], "featured_authors": [{"name": "Chenghong Zhu"}, {"name": "Xian Wu"}, {"name": "Jiahan Chen"}, {"name": "Junjie Wu"}, {"name": "Xin Wang"}, {"name": "Lingling Lao"}], "author_count": 7}, {"id": "2604.15102", "category": "quant-ph", "title": "Low-rank geometry of two-qubit gates", "abstract": "We present a framework based on the determinantal geometry of two-qubit gates. Combining the Weyl chamber representation with operator Schmidt theory, we interpret gate synthesis as a distance problem to determinantal varieties. This gives an operational geometry to the Weyl chamber, quantifying nonlocal complexity. We show that the square root iSWAP gate is the closest perfect entangler to the variety of local operations, and that no perfect entangler can be approximated by a local gate with average gate fidelity above 79.8%. The three different determinantal costs form a synthesis-adapted coordinate system that encodes nonlocal complexity and generally reconstructs the Weyl chamber.", "url": "https://arxiv.org/abs/2604.15102", "type": "理论", "summary": "1. 该工作提出了一个基于两量子比特门行列式几何的理论框架，结合Weyl室表示与算子Schmidt理论，将门合成问题转化为行列式簇的距离优化。\n2. 其核心在于为Weyl室赋予操作几何意义以量化非局部复杂性，证明平方根iSWAP是距离局部操作簇最近的完美纠缠门，且完美纠缠门的局部近似平均保真度上限为79.8%。\n3. 这通过合成适应的行列式成本坐标系编码了非局部复杂性，为量子门合成的几何分析与设计提供了明确工具，可能促进量子信息处理中的优化研究。", "summary_source": "deepseek", "authors": [{"name": "Llorenç Balada Gaggioli"}], "featured_authors": [{"name": "Llorenç Balada Gaggioli"}], "author_count": 1}, {"id": "2604.15110", "category": "quant-ph", "title": "General Static Solutions of the SU(2) Yang-Mills Equations from a Spin Vector Potential", "abstract": "We present a systematic study of static solutions to the source-free SU(2) Yang-Mills equations, in which the gauge potential explicitly depends on spin operators. By employing the \\emph{vector potential extraction approach} (VPEA) -- which requires the total angular momentum operator (orbital plus spin) to satisfy the standard angular momentum algebra -- we derive the most general form of the spin vector potential. This leads to the static ansatz $\\{ \\vec{A} = [k_1(\\hat{r}\\times\\vec{\\Gamma}) + k_2\\vec{\\Gamma} + k_3(\\vec{\\Gamma}\\cdot\\hat{r})\\hat{r}]/r, \\varphi = f_1(r)\\,(\\vec{\\Gamma}\\cdot\\hat{r}) + f_2(r)\\}$, parametrized by three constants $\\{k_1, k_2, k_3\\}$ and two radial functions $\\{f_1(r), f_2(r)\\}$. Substituting this ansatz into the Yang-Mills equations and imposing the angular momentum constraints from the VPEA yields a set of consistency equations. Solving these equations provides a complete classification of static solutions, including both real and complex families. Known simple SU(2) static solutions are recovered as special cases. Our classification reveals new static configurations that could be valuable for non-perturbative studies and for models where spin degrees of freedom couple to non-Abelian gauge fields.", "url": "https://arxiv.org/abs/2604.15110", "type": "理论", "summary": "1. 该工作系统研究了无源SU(2)杨-米尔斯方程的静态解，其中规范势显式依赖于自旋算符。\n2. 通过矢量势提取方法施加总角动量代数约束，导出了由三个常数和两个径向函数参数化的最一般静态形式，并由此完成了解的分类。\n3. 该分类揭示了新的静态构型，为涉及自旋自由度耦合的非阿贝尔规范场非微扰研究提供了新基础。", "summary_source": "deepseek", "authors": [{"name": "Yu-Xuan Zhang"}, {"name": "Jing-Ling Chen"}], "featured_authors": [{"name": "Yu-Xuan Zhang"}, {"name": "Jing-Ling Chen"}], "author_count": 2}, {"id": "2604.15111", "category": "quant-ph", "title": "Constraints on phantom codes from automorphism group bounds", "abstract": "Executing a logical quantum circuit fault-tolerantly incurs a large spacetime overhead. Recent work has proposed and investigated phantom codes, defined by the property that every in-block logical $\\mathrm{CNOT}$ circuit can be implemented with a physical permutation, a property that has the potential to greatly reduce the depth of compiled circuits. Here we show that phantomness comes at the cost of low encoding rate. Specifically, we prove that any binary phantom code encoding $k$ logical qubits into $n$ physical qubits with distance $d\\geq 2$ obeys the bound $k\\leq \\log_2(n+1)$ for all $k\\neq 4$. For $k=4$ we explicitly construct a nonstabiliser $(\\!(8, 2^4, 2)\\!)$ phantom code that violates the bound and has a transversal non-Clifford gate. We further show that, within the class of nontrivial CSS phantom codes with $k\\neq 4$, there is a unique family of codes saturating this bound. In addition, we prove that this logarithmic ceiling cannot be circumvented by permitting additional local unitary gates, or by making use of subsystem codes: any subspace or subsystem code admitting a $\\mathrm{SWAP}$-transversal implementation of every logical $\\mathrm{CNOT}$ circuit is constrained to satisfy the same bound. These bounds follow from a general theorem relating the length of a quantum code to the structure of its automorphism group, a result which may find applications beyond phantom codes.", "url": "https://arxiv.org/abs/2604.15111", "type": "理论", "summary": "1. 该研究严格证明了二进制幻影码的编码率受限于对数上界，并构造了k=4时违反该界的非稳定子码特例。\n2. 核心结论揭示了幻影性质（全块逻辑CNOT电路可由物理置换实现）与低编码率之间的内在权衡，且该界在子系统和局域酉扩展下依然成立。\n3. 所得关于码长与自同构群结构的普适定理，为超越幻影码的量子纠错码设计提供了新的约束视角与理论工具。", "summary_source": "deepseek", "authors": [{"name": "Arthur S. Morris"}, {"name": "Daniel Malz"}], "featured_authors": [{"name": "Arthur S. Morris"}, {"name": "Daniel Malz"}], "author_count": 2}, {"id": "2604.15162", "category": "quant-ph", "title": "Coherent control of optomechanical entanglement and steering via dual parametric amplification", "abstract": "We propose a coherent-control scheme for engineering quantum correlations in a cavity optomechanical (COM) system consisting of a driven optical cavity with an embedded nonlinear medium and a membrane, assisted by a coherent feedback loop. The nonlinear medium and the membrane are pumped to implement optical and mechanical parametric amplifications with controllable modulation frequencies and pump amplitudes. Through the combined modulation of the two parametric amplifications and the coherent feedback loop, we engineer the effective cavity decay rate and the distribution of quantum fluctuations, thereby strengthening quantum correlations and improving their robustness against thermal noise. Our scheme provides an efficient route to realizing highly tunable, strong, thermally robust quantum correlations in COM systems, which is promising for the protection of fragile quantum resources.", "url": "https://arxiv.org/abs/2604.15162", "type": "理论", "summary": "1. 本研究提出了一种基于相干反馈回路和双参量放大的方案，用以调控腔光力学系统中的量子关联。\n2. 其核心是通过组合调制光学与力学参量放大，有效调控腔衰减率和量子涨落分布，从而增强量子关联并提升其抗热噪声鲁棒性。\n3. 该方案为实现高度可调、强健且热稳定的量子关联提供了有效途径，对保护脆弱的量子资源具有积极意义。", "summary_source": "deepseek", "authors": [{"name": "Jinhao Jia"}, {"name": "Yingru Li"}, {"name": "Ran Liang"}, {"name": "Mei Zhang"}], "featured_authors": [{"name": "Jinhao Jia"}, {"name": "Yingru Li"}, {"name": "Ran Liang"}, {"name": "Mei Zhang"}], "author_count": 4}, {"id": "2604.15179", "category": "quant-ph", "title": "Quantum Metropolis-Hastings via Penalised Qubitized Walks: Spectral Filtering and Circuit Implementation", "abstract": "The Metropolis-Hastings algorithm is a cornerstone of Markov Chain Monte Carlo methods, underpinning a wide range of applications in computational physics, Bayesian inference, and machine learning. Quantum variants of Metropolis-Hastings promise accelerated mixing through quantum walks, but their practical realisation remains challenging. In this work, we construct and simulate an explicit circuit level implementation of a quantum Metropolis-Hastings algorithm based on the framework introduced by Claudon \\emph{et al.} ( arXiv:2506.11576 ). We present the full quantum workflow required to prepare a stationary distribution, including a number of modifications required to make the algorithm implementable in a realistic quantum circuit model. Our results demonstrate that these modifications are essential to recover the correct stationary behaviour and highlight both the potential and current limitations of quantum Metropolis-Hastings algorithms, which are expected to become practically relevant in the fault tolerant quantum computing regime.", "url": "https://arxiv.org/abs/2604.15179", "type": "理论+数值", "summary": "1. 该研究构建并模拟了基于惩罚量子化行走框架的量子Metropolis-Hastings算法的显式电路级实现。\n2. 其技术核心在于引入了光谱滤波与电路模型适应性修改，从而确保了稳态分布的正确制备与算法可行性。\n3. 这项工作明确了量子Metropolis-Hastings在容错量子计算时代具备实用潜力的技术路径与当前局限。", "summary_source": "deepseek", "authors": [{"name": "Miguel Carrasco-Arango"}, {"name": "Rosa M. Badia"}, {"name": "Artur Garcia-Saez"}], "featured_authors": [{"name": "Miguel Carrasco-Arango"}, {"name": "Rosa M. Badia"}, {"name": "Artur Garcia-Saez"}], "author_count": 3}, {"id": "2604.15209", "category": "quant-ph", "title": "Variational quantum state preparation within an entangle-rotate circuit framework for quantum-enhanced metrology in noisy systems", "abstract": "We investigate the generation of quantum states for precision metrology in noisy two-level systems. These states are obtained by optimizing a variational quantum circuit to maximize the quantum Fisher information (QFI) of the output state for a given decoherence rate and interaction Hamiltonian. The circuit architecture, inspired by twist-and-turn schemes, features a sequence of $n$ entangling layers, each consisting of entangling gates followed by a global rotation. We observe notable improvements in the QFI as the circuit layer depth increases, even for appreciable noise rates, demonstrating that our entangle-rotate architecture expands the accessible state space under realistic noise conditions. Our approach thus provides a general and efficient framework for generating quantum-enhanced sensing states. Our analysis extends to systems of power-law interactions spanning from all-to-all to nearest-neighbor interactions. We also analyze the capabilities of our circuit to prepare states for system sizes greater than $8$ qubits.", "url": "https://arxiv.org/abs/2604.15209", "type": "理论+数值", "summary": "1. 该工作通过优化变分量子电路，在给定退相干速率和相互作用哈密顿量下，制备了用于噪声系统中量子精密测量的量子态。\n2. 其核心在于设计了纠缠-旋转层叠电路架构，即使在显著噪声下，增加电路深度仍能有效提升量子Fisher信息，拓展了实际噪声条件下可制备的态空间。\n3. 这为在具有幂律相互作用的大规模量子比特系统中，制备用于量子增强传感的态提供了一个通用且可扩展的框架。", "summary_source": "deepseek", "authors": [{"name": "Juan C. Zuñiga Castro"}, {"name": "Jeffrey Larson"}, {"name": "Matt Menickelly"}, {"name": "Sri Hari Krishna Narayanan"}, {"name": "Yicheng Zhang"}, {"name": "Michael A. Perlin"}, {"name": "Robert J. Lewis-Swan"}], "featured_authors": [{"name": "Juan C. Zuñiga Castro"}, {"name": "Jeffrey Larson"}, {"name": "Matt Menickelly"}, {"name": "Yicheng Zhang"}, {"name": "Michael A. Perlin"}, {"name": "Robert J. Lewis-Swan"}], "author_count": 7}, {"id": "2604.15214", "category": "quant-ph", "title": "Optimal algorithmic complexity of inference in quantum kernel methods", "abstract": "Quantum kernel methods are among the leading candidates for achieving quantum advantage in supervised learning. A key bottleneck is the cost of inference: evaluating a trained model on new data requires estimating a weighted sum $\\sum_{i=1}^N \\alpha_i k(x,x_i)$ of $N$ kernel values to additive precision $\\varepsilon$, where $\\alpha$ is the vector of trained coefficients. The standard approach estimates each term independently via sampling, yielding a query complexity of $O(N\\lVert\\alpha\\rVert_2^2/\\varepsilon^2)$. In this work, we identify two independent axes for improvement: (1) How individual kernel values are estimated (sampling versus quantum amplitude estimation), and (2) how the sum is approximated (term-by-term versus via a single observable), and systematically analyze all combinations thereof. The query-optimal combination, encoding the full inference sum as the expectation value of a single observable and applying quantum amplitude estimation, achieves a query complexity of $O(\\lVert\\alpha\\rVert_1/\\varepsilon)$, removing the dependence on $N$ from the query count and yielding a q
