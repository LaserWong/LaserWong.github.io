method operates directly on a uniform real-space grid, requires no explicit Green's function integration or quadrature rules, and is formulated entirely in terms of minimising a scalar energy function. Extension to two-dimensional rough surfaces is direct, as both the Fourier elastic energy and the spectral preconditioner depend only on the wave-number magnitude.", "url": "https://arxiv.org/abs/2607.04288", "type": "理论+数值", "summary": "1. 该工作针对弹性接触力学中物理信息神经网络的谱刚度不平衡问题，提出一种傅里叶空间质量加权预处理策略。\n2. 其核心在于通过质量加权函数放大低波数位移分量并内置低通滤波抑制亚网格噪声，使粘附线接触问题在400步Adam迭代内达到机器零残差损失。\n3. 该方法直接在均匀实空间网格上操作并完全由标量能量函数表述，可扩展至二维粗糙表面接触的高效数值求解。", "summary_source": "deepseek", "authors": [{"name": "Yunong Zhou"}, {"name": "Kaifeng Huang"}, {"name": "Chaofan Du"}, {"name": "Yang Xu"}, {"name": "Hengxu Song"}], "featured_authors": [{"name": "Yunong Zhou"}, {"name": "Kaifeng Huang"}, {"name": "Chaofan Du"}, {"name": "Yang Xu"}, {"name": "Hengxu Song"}], "author_count": 5}, {"id": "2607.04589", "category": "cond-mat", "title": "Synchro-nematic and -antinematic ordering of spheroidal circle swimmers", "abstract": "Chirality gives a microswimmer something a straight-line swimmer lacks: a phase. This variable both modulates, and is affected by, the hydrodynamic interactions between microswimmers. Here we ask what collective order emerges when many such chiral swimmers are free to move, and how the shape and actuation anisotropies of an individual swimmer dictate the outcome. Using a kinetic theory for hydrodynamically interacting circle swimmers, we show that the interplay between intrinsic rotation, stresslet flows, and Jeffery-like reorientation generates effective phase-locking interactions. Asymmetries in the actuation are encoded through a non-axisymmetric stresslet tensor. At the pair level, pusher swimmers select one of two synchronized states depending on particle shape and actuation asymmetry: in-phase/anti-phase locking, or quarter-shifted locking. Extending the analysis to many-body systems, we find that these pair-level synchronization mechanisms drive emergent collective phases. The swimmers develop global \\textit{synchro-nematic} order when the hydrodynamic coupling favors parallel or anti-parallel phase locking, and \\textit{synchro-antinematic} local order where quarter-shifted locking prevails. A coarse-grained field theory predicts the onset of nematic order through a hydrodynamic instability criterion. In addition, we find that the collective states exhibit crystalline or disordered hyperuniform structure arising from period-averaged hydrodynamic interactions that are effectively repulsive between swimmers. Lattice Boltzmann simulations of chiral oblate squirmers, resolving finite-size and near-field flows, recover the synchro-nematic ordering. Together, these results show how a swimmer's geometric and actuation anisotropies can be leveraged to program synchronization and spatiotemporal order in chiral active matter.", "url": "https://arxiv.org/abs/2607.04589", "type": "理论+数值", "summary": "1. 该工作通过动力学理论和Lattice Boltzmann模拟，研究了椭球圆形游泳者因手性与流体力学相互作用涌现的同步向列或反同步向列有序相。\n2. 其核心卖点在于揭示非轴对称应力张量导致的相位锁定机制（同相/反相或四分之一相位锁定）如何驱动全局同步向列序或局域同步反向列序。\n3. 这为利用个体几何与驱动各向异性编程手性活性物质的同步与时空有序，以及设计具有超均匀结构的新颖活性材料提供了理论指导。", "summary_source": "deepseek", "authors": [{"name": "Anson G. Thambi"}, {"name": "Alexander N. Dodge"}, {"name": "William E. Uspal"}], "featured_authors": [{"name": "Anson G. Thambi"}, {"name": "Alexander N. Dodge"}, {"name": "William E. Uspal"}], "author_count": 3}, {"id": "2607.04621", "category": "cond-mat", "title": "Orbital-Selective Mott and Antiferromagnetic Phases in Diagonally Compressed Kagome Lattice", "abstract": "We perform determinant quantum Monte Carlo simulations of the half-filled Hubbard model on a diagonally compressed kagome lattice, introducing exponential decay long-range hopping $t(r) = t_0 \\exp\\bigl(-r / r_0\\bigr)$ to account for the evolving bond length. By varying the lattice angle $\\theta$ and the on-site interaction $U$, double occupancy, charge compressibility, and spin-spin correlation functions of the whole system and each sub-lattice are measured. We find that geometric compression induces a clear sublattice differentiation: for $\\theta\\gtrsim52^\\circ$, the A sublattice establishes long-range hoppings, which in turn suppresses the metallic behavior of the $B/C$ sublattice and drives a selective Mott transition; for $\\theta\\lesssim52^\\circ$, the $B$-$C$ chains develop long-range antiferromagnetic correlations within the finite-size simulations, which in turn suppresses the metallic behavior of the $A$ sublattice and drives a selective Mott transition. The critical interaction $U^c_A$ for the $A$ sites decreases sharply near the onset of $B$-$C$ antiferromagnetic correlations, while $U^c_{B/C}$ increases. These competing orders give rise to an orbital-selective Mott phase and a rich $U$-$\\theta$ phase diagram featuring paramagnetic-metal, paramagnetic-Mott, antiferromagnetic-metal, and antiferromagnetic-Mott states. Our results highlight the complex interplay between lattice geometry, magnetic frustration, and strong correlations in frustrated two-dimensional systems.", "url": "https://arxiv.org/abs/2607.04621", "type": "理论+数值", "summary": "1. 该工作利用行列式量子蒙特卡洛方法模拟对角线压缩Kagome晶格半填充Hubbard模型，通过变角度和相互作用绘制U-θ相图。\n2. 其卖点在于揭示几何压缩导致的子格分化：长程跳跃或反铁磁关联分别驱动A与B/C子格的选择性Mott相变，且临界相互作用呈现非单调演化。\n3. 这为理解阻挫二维系统中晶格几何、磁序与强关联的竞争耦合提供了明确相图框架，启发对轨道选择性现象的进一步实验探索。", "summary_source": "deepseek", "authors": [{"name": "Jiewei Ding"}, {"name": "Ho-Kin Tang"}, {"name": "Wing Chi Yu"}], "featured_authors": [{"name": "Jiewei Ding"}, {"name": "Ho-Kin Tang"}, {"name": "Wing Chi Yu"}], "author_count": 3}, {"id": "2607.04628", "category": "cond-mat", "title": "Superconductivity on the verge of metal-insulator transition in Cu$_{1-x}$Zn$_x$Ir$_2$S$_4$ probed by $μ$SR", "abstract": "The thiospinel CuIr$_2$S$_4$ undergoes a metal-insulator transition below $\\approx$230 K, which is suppressed by substitution of Cu with Zn (Cu$_{1-x}$Zn$_x$Ir$_2$S$_4$) to induce superconductivity for $0.2\\lesssim x\\lesssim0.8$. We show that the temperature/field dependence of superfluid density in samples with $x = 0.3$ and 0.4 ($T_{\\rm c} \\approx 3$ K and 2.5 K) investigated by muon spin rotation and relaxation ($\\mu$SR) is consistent with a fully gapped $s$-wave pairing. Meanwhile, the relatively high resistivity (10$^{-3}$-10$^{-2}$ $\\Omega\\:$cm) in their normal state suggests that the superconductivity is in the \"dirty limit\" where the mean free path is much shorter than the coherence length ($\\ell \\ll \\xi_0$). This indicates that the potential anisotropy associated with unconventional pairing mechanisms expected under the strong electron correlations is smeared out by the electron scattering. Based on these observations, we discuss potential link between the Zn substitution-induced superconductivity and that recently discovered in CuIr$_2$S$_4$ under high pressure ($>18$ GPa) where the existence of strong electron scattering is also suggested.", "url": "https://arxiv.org/abs/2607.04628", "type": "理论", "summary": "1. 通过μSR测量Cu_{1-x}Zn_xIr_2S_4超流密度，确定其超导配对为完全能隙s波。\n2. 关键卖点是正常态高电阻率证实脏极限（ℓ≪ξ₀），各向异性被电子散射抹平。\n3. 这暗示Zn替代超导与高压超导共享强散射机制，为理解关联体系中无序诱导超导提供线索。", "summary_source": "deepseek", "authors": [{"name": "K. M. Kojima"}, {"name": "M. Miyazaki"}, {"name": "M. Hiraishi"}, {"name": "A. Koda"}, {"name": "R. Kadono"}, {"name": "C. Baines"}, {"name": "Y. Tsuchiya"}, {"name": "H. S. Suzuki"}, {"name": "H. Kitazawa"}], "featured_authors": [{"name": "K. M. Kojima"}, {"name": "M. Miyazaki"}, {"name": "M. Hiraishi"}, {"name": "Y. Tsuchiya"}, {"name": "H. S. Suzuki"}, {"name": "H. Kitazawa"}], "author_count": 9}, {"id": "2607.04651", "category": "cond-mat", "title": "Topological Electronic States and Phonon Mediated Superconductivity in Ru Based Ternary Pnictides: ZrRuAs and HfRuP", "abstract": "This study investigates the structural, electronic, mechanical, optical, thermodynamic, and superconducting properties of ZrRuAs and HfRuP. Electronic band structure calculations reveal topological semimetallic behavior in both compounds with several bands crossing the Fermi level. The inclusion of spin orbit coupling lifts band degeneracies in both compounds. The Fermi surface shows both electron and hole segments. The estimated Pugh ratio, Poisson ratio and machinability index indicate that both compounds are ductile in nature and exhibit excellent machinability. Optical results show metallic reflectivity and notable absorption in the ultraviolet region. Thermodynamic analysis indicates stable behavior. The estimated superconducting transition temperatures are 9.75 K for ZrRuAs and 9.03 K for HfRuP that indicates strong coupling conventional superconductivity. The results provide a detailed view of the physical and superconducting properties of ZrRuAs and HfRuP and help to close the existing research gaps in these topological superconducting materials.", "url": "https://arxiv.org/abs/2607.04651", "type": "理论+数值", "summary": "1. 该工作系统研究了ZrRuAs和HfRuP的结构、电子、力学、光学、热力学及超导性质，确认其为拓扑半金属且呈现声子介导的强耦合常规超导电性。\n2. 其核心在于自旋轨道耦合解除能带简并并形成电子-空穴费米面，结合延展性与可加工性，为拓扑超导材料提供了完整物性图景。\n3. 这为填补此类三元钌基磷族化合物在拓扑超导领域的研究空白提供了明确依据，并启发后续探索类似体系的超导机制与潜在应用。", "summary_source": "deepseek", "authors": [{"name": "Jubair Hossan Abir"}, {"name": "Tanvir Khan"}, {"name": "Tauhidur Rahman"}, {"name": "Md. Kamrul Hassan"}, {"name": "Sraboni Saha Moly"}, {"name": "Mst. Maskura Khatun"}, {"name": "Raihana Shams Islam"}, {"name": "Saleh Hasan Naqib"}], "featured_authors": [{"name": "Jubair Hossan Abir"}, {"name": "Tanvir Khan"}, {"name": "Tauhidur Rahman"}, {"name": "Mst. Maskura Khatun"}, {"name": "Raihana Shams Islam"}, {"name": "Saleh Hasan Naqib"}], "author_count": 8}, {"id": "2607.04805", "category": "cond-mat", "title": "Nonlocal Kondo-exchange-driven intrinsic anomalous Hall effect in localized-$4f$ antiferromagnetic metals", "abstract": "The anomalous Hall effect in antiferromagnetic metals has attracted considerable attention. Most known realizations involve itinerant $d$ electrons that simultaneously mediate charge transport and magnetic order. Here, we focus on $f$-electron materials, where localized magnetic moments and conduction electrons are hosted in different orbitals. We develop a theoretical framework to describe the impact of localized antiferromagnetic order on itinerant electrons. Applying this approach to the recently discovered $4f$ antiferromagnetic metal $\\mathrm{Ce}_{2}\\mathrm{Cu}\\mathrm{Ge}_{6}$, we identify the origin of both the intrinsic anomalous Hall conductivity and the spin splitting of the energy bands as spin-dependent intersite hopping induced by nonlocal Kondo exchange coupling, rather than a Zeeman-type effective field acting locally on the conduction electrons.", "url": "https://arxiv.org/abs/2607.04805", "type": "理论", "summary": "1. 该工作针对局域4f反铁磁金属中磁矩与传导电子空间分离的特性，发展了一个描述局域反铁磁序通过非局域Kondo交换耦合影响巡游电子的理论框架，并将之应用于新近发现的Ce2CuGe6。\n2. 核心物理发现是：内禀反常霍尔电导与能带自旋分裂并非由局域Zeeman型有效场产生，而是源于非局域Kondo交换耦合所驱动的自旋相关格点间跳跃，这一机制在d电子体系的反常霍尔效应中并不常见。\n3. 此结果揭示了f电子反铁磁金属中反常霍尔效应的一种新起源，为探索其他具有局域磁矩与传导电子分离特征的强关联体系中的拓扑输运现象提供了理论指引。", "summary_source": "deepseek", "authors": [{"name": "Akimitsu Kirikoshi"}, {"name": "Junya Otsuki"}], "featured_authors": [{"name": "Akimitsu Kirikoshi"}, {"name": "Junya Otsuki"}], "author_count": 2}, {"id": "2607.04840", "category": "cond-mat", "title": "Disentangling Electronic and Lattice Contributions to Transient Absorption in Metal Halide Perovskites: A First-Principles Study of CH3NH3PbBr3", "abstract": "Soft lattices combined with strong electron-phonon coupling in metal halide perovskites result in a complex interplay between electronic and lattice degrees of freedom. This interplay complicates the interpretation of time-resolved excitation spectra like pump-probe spectra. Here, we develop a first-principles approach that combines a nonequilibrium extension of the Bethe-Salpeter equation with \\textit{ab initio} molecular dynamics to resolve the origin of transient absorption. This approach can quantitatively disentangle electronic and thermal lattice contributions across femtosecond-to-picosecond timescales. Exemplified with \\ce{CH3NH3PbBr3}, we find that on the femtosecond scale, both X-ray and optical transient absorption spectra are dominated by electronic contributions: Photoinduced Coulomb screening weakens the effective electron-hole interaction and blueshifts the excitonic resonances, whereas Pauli blocking is negligible. On the picosecond scale, thermal lattice contributions become essential, with distinct mechanisms dominating different spectral regions: Lattice vibrations lead to spectral redistribution in the X-ray transient absorption spectrum, whereas lattice expansion blueshifts the optical transient absorption spectrum.", "url": "https://arxiv.org/abs/2607.04840", "type": "理论+数值", "summary": "1. 本工作结合非平衡Bethe-Salpeter方程与第一性原理分子动力学，从头计算以区分CH3NH3PbBr3中电子与晶格对瞬态吸收的贡献。\n2. 该方法定量分离飞秒至皮秒尺度电子与热晶格效应，揭示飞秒时光生库仑屏蔽弱化激子相互作用致蓝移，皮秒时晶格振动与膨胀分别主导X射线和光学谱响应。\n3. 为解析软晶格体系中电子-晶格耦合动力学提供第一性原理框架，指导时间分辨谱学实验设计与激子物理研究。", "summary_source": "deepseek", "authors": [{"name": "Lu Qiao"}, {"name": "Ronaldo Rodrigues Pela"}, {"name": "Claudia Draxl"}], "featured_authors": [{"name": "Lu Qiao"}, {"name": "Ronaldo Rodrigues Pela"}, {"name": "Claudia Draxl"}], "author_count": 3}, {"id": "2607.04861", "category": "cond-mat", "title": "Different dielectric, magnetic, and magnetodielectric mechanisms in M-type BaFe12O19 hexaferrite regulated by doping Ga3+ and In3+ cations", "abstract": "We systematically investigated the magnetic, dielectric, and MD properties of BaFe12-xMexO19 ceramics prepared by a solid-state reaction method. The Ga3+ cations with a smaller radius preferentially substitute the Fe3+ ions in FeO6 octahedra while the In3+ cations with a larger radius tend to replace the Fe3+ ions in FeO5 bipyramids of R blocks, inducing different physical characteristics. The pure BaFe12O19 and Ga-doped samples show ferrimagnetism in the temperature range from 10 K to 300 K. The In-doped samples exhibit a transition from non-collinear magnetism to collinear ferrimagnetism. The dielectric decrease of pure BaFe12O19 at around 10-175 K is attributed to the quantum paraelectric state, and the shoulder peaks of loss at about 140-200 K are from electron hopping. The dipole glass state is responsible for the dielectric peak of Ga-doped samples at around 20-40 K. The dielectric increase and plateau of In-doped samples are mainly ascribed to the electron hopping at low temperatures. Their dielectric properties at high temperatures are all attributed to the interfacial polarization caused by the Maxwell-Wagner effect. The MD effect also has different origins for the various samples at low temperatures. For the pure BaFe12O19, the negative MD effect at extremely low temperatures and the positive MD effect after warming are ascribed to spin-phonon coupling and field-dependent electron hopping, respectively. The positive MD effect in Ga-doped hexaferrites results from the field-dependent electric dipoles inside FeO5 bipyramids. For the In-doped samples, the negative MD effect and subsequent transformation to the positive MD effect originate from the field-dependent non-collinear spin ordering and electron hopping, respectively. The MD effect at high temperatures is attributed to the combination of magnetoresistance and Maxwell-Wagner effects.", "url": "https://arxiv.org/abs/2607.04861", "type": "理论", "summary": "1. 该工作系统研究了Ga³⁺和In³⁺掺杂对M型BaFe₁₂O₁₉六方铁氧体介电、磁性及磁介电特性的调控机制。\n2. 不同半径离子选择性取代FeO₆八面体与FeO₅双锥体位点，分别诱发量子顺电态、偶极玻璃态、电子跳跃及自旋-声子耦合等差异化物理过程。\n3. 这为通过离子取代精细设计六方铁氧体的多铁性与磁电耦合效应提供了明确的实验依据与物理图像。", "summary_source": "deepseek", "authors": [{"name": "Yang Yang"}, {"name": "Run-Yu Lei"}, {"name": "Jian-Ping Zhou"}, {"name": "Xiao-Ming Chen"}], "featured_authors": [{"name": "Yang Yang"}, {"name": "Run-Yu Lei"}, {"name": "Jian-Ping Zhou"}, {"name": "Xiao-Ming Chen"}], "author_count": 4}, {"id": "2607.04863", "category": "cond-mat", "title": "Uniform distributions in nonuniform systems: Wall potentials generating constant density profiles in classical density functional theory", "abstract": "We study the inverse problem of classical density functional theory for inhomogeneous fluids: finding the wall potential that produces a constant equilibrium density profile, i.e., a perfectly flat density distribution in the accessible region adjacent to a substrate. Within Rosenfeld's fundamental measure theory, we solve this problem for a one-component fluid in planar, spherical, and cylindrical geometries, considering both a hard-sphere fluid and a fluid with an additional truncated Lennard-Jones attraction treated at the mean-field level. Explicit analytical expressions are obtained for planar walls, while spherical walls also admit an analytical treatment in a more cumbersome form. The cylindrical case is treated numerically. The construction provides an explicit microscopic realization of structure-cancelling wall fields, related to flat-profile conditions that occur under special matching conditions in interfacial theories of wetting and drying. The theory also yields a compact collection of formulae for weighted densities and one-body direct correlation functions in the three fundamental geometries, providing useful reference expressions for density-functional implementations. The resulting analytic wall potentials are validated in independent density functional calculations, which confirm that the prescribed flat profiles are recovered within numerical accuracy.", "url": "https://arxiv.org/abs/2607.04863", "type": "理论+数值", "summary": "1. 该工作求解经典密度泛函理论的反问题，在Rosenfeld基本度量理论框架下，针对平面、球和圆柱几何构造出能产生恒定密度分布的壁势。\n2. 核心在于对硬球及含截断Lennard-Jones吸引的流体，获得平面及球形的显式解析解与圆柱的数值解，并给出加权密度与直接关联函数的紧凑公式集合。\n3. 这些结构消去壁势为界面理论中湿干匹配下的平坦剖面条件提供了微观实现，其解析表达式可直接用于检验和校准密度泛函数值实现。", "summary_source": "deepseek", "authors": [{"name": "Jiří Janek"}, {"name": "Alexandr Malijevský"}], "featured_authors": [{"name": "Jiří Janek"}, {"name": "Alexandr Malijevský"}], "author_count": 2}, {"id": "2607.04870", "category": "cond-mat", "title": "Unveiling Structural Bottlenecks of Dynamic Disorder in a Density-Tunable Glass Former: From Strong to Fragile Regimes", "abstract": "Fragility characterizes how rapidly a glass-forming liquid slows down upon supercooling, but whether strong and fragile behaviors arise from the same microscopic relaxation mechanism remains unclear. Here, we address this question using a density-tunable soft-repulsive binary mixture spanning distinct fragility regimes and analyze particle jump dynamics within the framework of dynamic disorder. Across these regimes, we show that increasing fragility leads to progressively broader cage-lifetime distributions and increasingly non-exponential survival probabilities, revealing non-Poisson cage-to-jump statistics governed by fluctuating jump rates and slowly evolving structural variables. To characterize their structural origin, we first identify the neighbor ranks most strongly coupled to jump motion using Kullback-Leibler divergence and Pearson correlation analyses. We then introduce a structural slowness parameter that combines these neighbor-distance fluctuations into a reduced slow coordinate for constructing the slow-fluctuation survival probability. A comparison with the actual survival probability shows that localized neighbor-distance fluctuations control the jump rate in the strong regime, whereas extended neighbor rearrangements become relevant in the intermediate and fragile regimes, increasing the effective dimensionality of the slow-variable space. In the fragile regime, distance-based descriptors alone become insufficient at the lowest temperature, where the Voronoi free volume captures additional cage-volume fluctuations in the rate-controlling slow variable. Point-to-set correlations grow with fragility, but the spatial extent of the slow variables exceeds the point-to-set length. These results show that fragility changes the structural bottleneck for microscopic rate fluctuations, linking dynamic disorder and multidimensional slow variables.", "url": "https://arxiv.org/abs/2607.04870", "type": "理论", "summary": "1. 该工作利用密度可调软排斥二元混合物跨越强至脆性玻璃形成区域，通过粒子跳跃动力学分析动态无序的结构瓶颈。\n2. 其核心在于识别与跳跃运动强耦合的邻居序次，引入结构慢度参数与Voronoi自由体积，揭示从强至脆性区域控制跳跃率的结构瓶颈维度递增。\n3. 这表明脆性改变微观弛豫速率涨落的结构瓶颈，为理解动态无序与多维慢变量关联提供启发。", "summary_source": "deepseek", "authors": [{"name": "Shubham Kumar"}, {"name": "Shinji Saito"}], "featured_authors": [{"name": "Shubham Kumar"}, {"name": "Shinji Saito"}], "author_count": 2}, {"id": "2607.04897", "category": "cond-mat", "title": "Size Effect of Monovalent Ions on Polyelectrolyte Brushes", "abstract": "The conformation of polyelectrolyte (PE) brushes is highly sensitive to external conditions, particularly salt concentration and ion-specific effects. As salt concentration increases, PE brushes transition from an osmotic brush regime at low salt ($H \\propto c_\\mathrm{s}^{0}$) to a salted brush regime at high salt ($H \\propto c_\\mathrm{s}^{-1/3}$). However, deviations from this ideal scaling behavior are frequently observed in molecular simulations. In this work, we employ coarse-grained molecular dynamics simulations to systematically investigate how the sizes of counterions and co-ions affect the structural evolution and scaling behavior of PE brushes over a broad range of salt concentrations. Our results show that counterion size plays a dominant role in regulating ion penetration and coordination with PE monomers. At low salt concentration, smaller counterions penetrate more easily into the brush, leading to enhanced local charge compensation and stronger brush collapse. At high salt concentration, however, the brush height becomes largely insensitive to counterion size, while deviations from the classical scaling relation emerge. On the other hand, co-ion size mainly affects the system indirectly by modifying ion distributions and the local electrostatic environment. Smaller co-ions weaken local charge compensation and suppress brush collapse, with this effect becoming more pronounced at high salt concentration. When the sizes of counterions and co-ions are reduced simultaneously, the system exhibits a coupled response. Collectively, this work provides a microscopic understanding of how ion size and salt concentration jointly govern the structural response of PE brushes and the emergence of non-classical scaling behavior in realistic solution environments.", "url": "https://arxiv.org/abs/2607.04897", "type": "数值", "summary": "1. 该工作通过粗粒化分子动力学模拟，系统研究了单价离子大小对聚电解质刷结构演化和标度行为的影响。\n2. 其卖点在于揭示了反离子大小在低盐浓度下主导离子渗透与局部电荷补偿，进而调控刷子塌缩，而高盐浓度下偏离经典标度关系。\n3. 这为理解真实溶液中离子大小与盐浓度共同支配聚电解质刷的非经典标度行为提供了微观机制与理论启发。", "summary_source": "deepseek", "authors": [{"name": "Xianggui Zhou"}, {"name": "Nengjie Cao"}, {"name": "Xiang-Meng Jia"}, {"name": "Jinyuan Mao"}, {"name": "Jiajia Zhou"}], "featured_authors": [{"name": "Xianggui Zhou"}, {"name": "Nengjie Cao"}, {"name": "Xiang-Meng Jia"}, {"name": "Jinyuan Mao"}, {"name": "Jiajia Zhou"}], "author_count": 5}, {"id": "2607.04975", "category": "cond-mat", "title": "Optical switching of antiferromagnetic domains by nonreciprocal heat current", "abstract": "What distinguishes front from back? In physics, such directionality emerges only when an underlying symmetry is broken. Antiferromagnets that inherently break both space-inversion and time-reversal symmetries provide a striking example, exhibiting nonreciprocal optical responses that depend on the direction of light propagation. Beyond distinguishing antiferromagnetic domains, we show that this nonreciprocity can deterministically create them. Using mid-infrared light, we demonstrate deterministic switching of antiferromagnetic domains in the magnetoelectric antiferromagnet LiFePO4, where illumination from opposite sides selectively stabilizes opposite domain states. Remarkably, the switching persists over a broad wavelength range rather than being confined to a narrow transition-specific spectral region, overcoming the spectral and material constraints of resonance-based optical switching schemes. The broadband switching originates from the material's intrinsic nonreciprocity through optically generated heat currents. Our results establish nonreciprocity as a general principle for deterministically controlling symmetry-broken phases with light.", "url": "https://arxiv.org/abs/2607.04975", "type": "理论", "summary": "1. 该工作利用中红外光在磁电反铁磁体LiFePO4中，通过非互易热流实现了反铁磁畴的确定性光学切换。\n2. 其核心机制在于材料本征非互易性产生的光生热流，使切换在宽波长范围内有效，突破了共振方案的光谱与材料限制。\n3. 这确立了非互易性作为光控对称性破缺相通用原理的地位，可推广至其他具有类似对称性破缺的材料体系。", "summary_source": "deepseek", "authors": [{"name": "Takeshi Hayashida"}, {"name": "Shunsuke Izumikawa"}, {"name": "Kenta Kimura"}, {"name": "Carl S. Davies"}, {"name": "Andrei Kirilyuk"}], "featured_authors": [{"name": "Takeshi Hayashida"}, {"name": "Shunsuke Izumikawa"}, {"name": "Kenta Kimura"}, {"name": "Carl S. Davies"}, {"name": "Andrei Kirilyuk"}], "author_count": 5}, {"id": "2607.04997", "category": "cond-mat", "title": "Inhomogeneous thinning of dielectric membranes under uniaxial tension and electric fields", "abstract": "Dielectric elastomers exhibit rich electromechanical instabilities arising from the coupling between mechanical deformations and electric fields. A widely used approach for analyzing instabilities in dielectric elastomers is the Hessian stability criterion proposed by Zhao and Suo (2007), which identifies the onset of instability of a homogeneous deformation but does not determine how the deformation develops beyond the instability threshold. To address this problem, we investigate dielectric membranes subjected to uniaxial tension and an electric field. Starting from a three-dimensional nonlinear electroelastic formulation, we derive asymptotically consistent reduced models, including a membrane model and a plate model, using the variational--asymptotic method. A linear bifurcation analysis first shows that the Hessian stability criterion is equivalent to a zero-wavenumber bifurcation condition, thereby establishing a direct connection between energy-based stability analysis and bifurcation theory. A subsequent weakly nonlinear analysis demonstrates that the zero-wavenumber bifurcation gives rise to localized necking, manifested as inhomogeneous thinning of the membrane. Furthermore, for the plane-stress configuration considered here, the membrane model accurately captures both the onset of instability and the associated localization behavior, while bending effects remain small. These results provide a physical interpretation of the Hessian instability and offer a framework for analyzing instabilities in dielectric membranes.", "url": "https://arxiv.org/abs/2607.04997", "type": "理论+数值", "summary": "1. 该工作针对单轴拉伸与电场下介电弹性膜的非均匀变薄问题，从三维非线性电弹性公式出发，利用变分渐近法推导了渐近一致的膜模型与板模型。\n2. 主要技术卖点是证明了Hessian稳定性准则等价于零波数分岔条件，并通过弱非线性分析揭示了零波数分岔导致局部颈缩，从而建立了能量稳定性分析与分岔理论的直接联系。\n3. 膜模型无需弯曲效应即可精确捕捉失稳起始与局部化行为，这为理解介电弹性膜失稳的物理机制提供了框架，并可推广至其他电机械耦合系统的后屈曲分析。", "summary_source": "deepseek", "authors": [{"name": "Xiang Yu"}, {"name": "Yibin Fu"}], "featured_authors": [{"name": "Xiang Yu"}, {"name": "Yibin Fu"}], "author_count": 2}, {"id": "2607.05014", "category": "cond-mat", "title": "Geometric Characteristics of Subproblems in Ising-Machine-Assisted Large Neighborhood Search", "abstract": "Large-scale quadratic unconstrained binary optimization (QUBO) formulations of constrained combinatorial optimization problems often exceed the input-size limit of present Ising machines or suffer from degraded solution quality as the number of binary variables increases. Large neighborhood search (LNS) mitigates this difficulty by sequentially optimizing restricted subproblems, but the structural factors that distinguish subproblems beyond the number of binary variables remain insufficiently characterized. In this study, we examine vehicle routing problems and compare a construction based on the vehicle routes of the current solution, denoted by LNS-K, with a construction based on QUBO variables and constraint relations, denoted by LNS-Q, while controlling the number of binary variables in the subproblems. Under the tested conditions, LNS-K obtained shorter total distances than LNS-Q in the matched-size comparisons, and the position variance, a measure of the spatial spread of the selected customers, decreased during the iterations in LNS-K. These observations suggest that subproblem design for sequential optimization with Ising machines should consider not only subproblem size but also semantic and geometric structures inherited from the current solution.", "url": "https://arxiv.org/abs/2607.05014", "type": "数值", "summary": "1. 该工作研究了Ising机辅助大规模邻域搜索中车辆路径问题的子问题几何特征，比较了基于当前解路径的LNS-K与基于QUBO约束的LNS-Q两种构造方法。\n2. 其卖点在于发现LNS-K在等变量数下获得更短总距离，且其位置方差在迭代中降低，揭示了子问题的语义与几何结构对优化性能的决定性作用。\n3. 这为Ising机顺序优化中的子问题设计提供了明确启发，即需超越变量数量而考虑当前解的空间分布与结构信息。", "summary_source": "deepseek", "authors": [{"name": "Masashi Yamashita"}, {"name": "Shu Tanaka"}], "featured_authors": [{"name": "Masashi Yamashita"}, {"name": "Shu Tanaka"}], "author_count": 2}, {"id": "2607.05039", "category": "cond-mat", "title": "Coexisting Charge Density Wave and Superconducting Order in Quantizing Magnetic Fields", "abstract": "Charge density wave (CDW) and superconductivity are both common in strongly interacting electron systems. While CDW order is ubiquitous in both quantum Hall systems and unconventional superconductors, superconductivity is generally suppressed by the strong magnetic fields required for Landau quantization. Here we investigate the intertwined CDW and superconducting phases of rhombohedral hexalayer graphene (R6G) in a large displacement field, which generates tunable flat band edges, and a strong magnetic field, which generates a manifold of nearly degenerate Landau levels. CDW order is accompanied by pronounced thermal hysteresis as expected for first-order melting transitions. Surprisingly, we find a series of strong integer quantum Hall effects at magnetic fields above ~2T with Hall conductance quantum numbers that deviate strongly from nearby integer filling factors, an observation that can be explained only by CDW order that mixes many Landau levels. We also find a nearby superconducting phase that is stabilized by perpendicular magnetic fields and persists deep within the quantum Hall regime. The CDW and superconducting phases develop on comparable temperature scales and emerge from the same manifold of strongly mixed Landau levels. These observations provide new insight into the interplay between superconductivity and CDW order in R6G at zero magnetic field.", "url": "https://arxiv.org/abs/2607.05039", "type": "理论", "summary": "1. 该工作实验研究了菱方六层石墨烯在大位移场和量子化磁场中电荷密度波与超导序的共存现象。\n2. 其核心发现是CDW序通过混合大量朗道能级导致整数量子霍尔效应中霍尔电导量子数偏离填充因子，且超导相被垂直磁场稳定在量子霍尔区深处。\n3. 这为零磁场下强关联体系中CDW与超导的耦合机制提供了基于可调朗道能级流形的新实验约束。", "summary_source": "deepseek", "authors": [{"name": "Ron Q. Nguyen"}, {"name": "Peiyu Qin"}, {"name": "Hai-Tian Wu"}, {"name": "Sparsh Mishra"}, {"name": "Tobias Wolf"}, {"name": "Joseph Roll"}, {"name": "Erin Morissette"}, {"name": "Naiyuan J. Zhang"}, {"name": "Sarah Alkidim"}, {"name": "Kenji Watanabe"}, {"name": "Takashi Taniguchi"}, {"name": "Aaron W. Hui"}, {"name": "Dima E. Feldman"}, {"name": "Allan MacDonald"}, {"name": "J.I.A. Li"}], "featured_authors": [{"name": "Ron Q. Nguyen"}, {"name": "Peiyu Qin"}, {"name": "Hai-Tian Wu"}, {"name": "Dima E. Feldman"}, {"name": "Allan MacDonald"}, {"name": "J.I.A. Li"}], "author_count": 15}, {"id": "2607.05066", "category": "cond-mat", "title": "Finite-frequency magnetic common baths in ferromagnetic planar cavities", "abstract": "We formulate the finite-frequency magnetic common bath of two spin probes in a ferromagnetic planar cavity. The probes couple to the retarded magnetic Green tensor of the cavity, whose imaginary and real parts determine the collective decay kernel \\(\\gamma_{12}\\) and the Lamb-shift kernel \\(\\Omega_{12}\\). We evaluate these kernels for a finite-thickness scalar TE channel formed by a ferromagnetic film on a nonmagnetic conducting substrate, using the transverse diagonal Polder permeability \\(\\mu_\\perp(\\omega,B)\\) as the magnetic input. The normalization is fixed by the free-space magnetic-dipole decay rate. In the \\(\\omega\\to0\\) limit, the constant-reflection benchmark reproduces the static image-series reference, while the finite slab retains the corresponding static TE reflection amplitude. For a \\(t=200\\,\\mathrm{nm}\\) film described by a representative Ni-like parameter set in a micron-scale mid-gap cavity, the GHz probe transition samples the positive-frequency response of the body-assisted magnetic reservoir at millikelvin temperature. On resonance, the off-diagonal linewidth splitting reaches about two thirds of the single-spin scattering linewidth at \\(\\rho=3\\,\\mu\\mathrm m\\). The resulting linewidth splitting and collective Lamb shift provide finite-frequency counterparts of the static TE coupling-frequency shift.", "url": "https://arxiv.org/abs/2607.05066", "type": "数值", "summary": "1. 该工作构建了铁磁平面腔中两自旋探针的有限频率磁性共同浴，基于推迟磁格林函数提取集体衰变核与兰姆位移核。\n2. 核心在于利用纵向对角Polder磁导率计算有限厚度标量TE通道，在共振时非对角展宽分裂达单自旋散射展宽的三分之二。\n3. 这为GHz探针在毫开温度下体辅助磁共振的耗散与频移提供了有限频率描述，可推广至磁光腔量子电动力学。", "summary_source": "deepseek", "authors": [{"name": "O. J. Kwon"}], "featured_authors": [{"name": "O. J. Kwon"}], "author_count": 1}, {"id": "2607.05081", "category": "cond-mat", "title": "Structural crossovers of quasi-one-dimensional patchy hard superellipses", "abstract": "We study a quasi-one-dimensional associating fluid composed of hard superellipses carrying two patches interacting through a directional Kern--Frenkel potential. Using the Transfer Operator Method, we show that the selective patch--patch association promotes horizontal alignment and chain formation at low-to-intermediate densities, whereas hard-core interaction favours vertical alignment without bonds at high densities. The competition between these two mechanisms drives a structural crossover upon compression from a horizontally aligned bonded chain structure to a completely unbonded, vertically aligned structure. While patchy ellipses undergo a tilted-to-vertical realignment, patchy rectangle-like superellipses exhibit a horizontal-to-vertical change. These structural changes manifest as a plateau in the equation of state. To capture these properties, we generalise Wertheim's first-order thermodynamic perturbation theory by introducing an orientation-dependent fraction of sites not in a bond. When combined with the Parsons--Lee hard-body theory, the orientationally resolved perturbation theory provides quantitatively reliable results for the structural properties and phase behaviour. Therefore, the generalised Wertheim theory together with Parsons-Lee theory can be suitable in higher dimensions, too.", "url": "https://arxiv.org/abs/2607.05081", "type": "理论+数值", "summary": "1. 该工作利用转移算子方法研究了准一维补丁硬超椭球关联流体的结构交叉行为。\n2. 其关键发现是补丁-补丁吸引促进水平成链与硬核排斥驱动垂直排列的竞争机制，并通过引入取向依赖的非成键位点分数推广了Wertheim一阶热力学微扰理论。\n3. 推广后的取向分辨微扰理论结合Parsons-Lee硬体理论可定量描述结构性质与相行为，并有望推广至更高维度系统。", "summary_source": "deepseek", "authors": [{"name": "Sakineh Mizani"}, {"name": "Martin Oettel"}, {"name": "Péter Gurin"}, {"name": "Szabolcs Varga"}], "featured_authors": [{"name": "Sakineh Mizani"}, {"name": "Martin Oettel"}, {"name": "Péter Gurin"}, {"name": "Szabolcs Varga"}], "author_count": 4}, {"id": "2607.05130", "category": "cond-mat", "title": "Critical behavior of the driven Curie-Weiss model", "abstract": "We complete the phase diagram of the macroscopic Curie-Weiss magnet in a time-periodic external field, as a function of temperature and driving parameters. There is a regime (large enough driving amplitude and frequency, at low temperatures) where stable paramagnetic and ferromagnetic phases coexist. In particular, we present a new detailed analysis of the (nonequilibrium) specific heat, diverging at the same critical inverse temperature $\\beta_c$ as the magnetic susceptibility. The new Curie temperature decreases with the driving, and we find critical exponent $\\alpha=1$ for $\\beta\\downarrow \\beta_c$, and $\\alpha\\simeq 0.86$ for $\\beta\\uparrow \\beta_c$, even for small driving. A Floquet analysis shows the nature of the criticality, which is dynamical, with implications that remain unseen and are mostly impossible when the system is in thermal equilibrium.", "url": "https://arxiv.org/abs/2607.05130", "type": "理论+数值", "summary": "1. 该工作完成了时间周期外场驱动下宏观Curie-Weiss磁体的完整相图，揭示了低温大驱动幅值与频率区间内顺磁相与铁磁相的稳定共存。\n2. 核心贡献在于对非平衡比热发散的精细分析，发现临界指数α在β↓βc时为1、β↑βc时约为0.86，并利用Floquet分析阐明了临界性的动力学本质。\n3. 这一结果为研究非平衡驱动系统的热力学与临界现象提供了新范例，特别是揭示了平衡态下无法观测的临界行为与普适类特征。", "summary_source": "deepseek", "authors": [{"name": "Ruohan Xu"}, {"name": "Faezeh Khodabandehlou"}, {"name": "Christian Maes"}], "featured_authors": [{"name": "Ruohan Xu"}, {"name": "Faezeh Khodabandehlou"}, {"name": "Christian Maes"}], "author_count": 3}, {"id": "2607.05151", "category": "cond-mat", "title": "On data-driven parameterizations of multidimensional generalized Langevin dynamics in the presence of a quadratic potential", "abstract": "We propose a numerical algorithm to construct a Markov model with an extended list of variables to parameterize the equation of motion of a multidimensional coarse-grained physical system in an external potential, when memory effects are relevant. Our method uses autocorrelation data of the stationary velocities, but it avoids the inverse problem of finding the corresponding memory kernel from these data in a first step. Rather, the data are used to construct a Prony series approximation of the autocorrelation function, and the parameters of this Prony series provide the corresponding Markov model. Numerical results for molecular dynamics data show a good match for parameterized models with five auxiliary variables for a one-dimensional, and twelve auxiliary variables for a two-dimensional system.", "url": "https://arxiv.org/abs/2607.05151", "type": "理论+数值", "summary": "1. 该工作提出一种数据驱动算法，利用扩展变量列表构建马尔可夫模型，用于参数化二次势存在下多维粗粒化系统的运动方程。\n2. 其技术关键在于直接通过速度自相关数据的Prony级数近似构造马尔可夫模型，避免了传统方法中求解记忆核的反问题。\n3. 这为处理复杂粗粒化系统中的记忆效应提供了可行方案，并有望推广至更高维或非谐势情形下的模拟应用。", "summary_source": "deepseek", "authors": [{"name": "Maximilian Braun"}, {"name": "Martin Hanke"}, {"name": "Niklas Wolf"}], "featured_authors": [{"name": "Maximilian Braun"}, {"name": "Martin Hanke"}, {"name": "Niklas Wolf"}], "author_count": 3}, {"id": "2607.05169", "category": "cond-mat", "title": "Ising-Machine-Assisted Large Neighborhood Search with Flexibly Tunable Subproblem Size", "abstract": "Ising machines are heuristic solvers for combinatorial optimization, but their solution quality can degrade when large-scale constrained problems are solved directly. Ising-machine-assisted large neighborhood search (LNS) instead repeatedly updates a feasible current solution by solving smaller subproblems. An existing feasibility-preserving method for the vehicle routing problem (VRP) re-optimizes the entire routes of selected vehicles and thus cannot adjust the subproblem size finely. We propose LNS-VT, which introduces the number of consecutive steps re-optimized per vehicle as a parameter to control the subproblem size finely while preserving feasibility. For a 300-site, 5-vehicle VRP, its best setting reduced the objective value by approximately 10\\% relative to the existing method after 100 iterations, and the appropriate setting changed with the current solution quality. Applying the same principle to the quadratic multiple knapsack problem, we confirmed that an appropriate subproblem size also exists, indicating that subproblem-size control is important in Ising-machine-assisted LNS.", "url": "https://arxiv.org/abs/2607.05169", "type": "数值", "summary": "1. 该工作提出Ising机器辅助大邻域搜索方法LNS-VT，通过引入每辆车重新优化步数参数精细控制子问题规模。\n2. 其技术优势在于在保持可行性前提下实现子问题大小的连续可调，在300站点5车辆VRP上100次迭代后目标值较现有方法降低约10%。\n3. 这表明子问题规模控制对Ising机器辅助LNS至关重要，且最优规模随当前解质量动态变化，为其他组合优化问题提供了通用设计原则。", "summary_source": "deepseek", "authors": [{"name": "Koshiro Fujimoto"}, {"name": "Masashi Yamashita"}, {"name": "Shu Tanaka"}], "featured_authors": [{"name": "Koshiro Fujimoto"}, {"name": "Masashi Yamashita"}, {"name": "Shu Tanaka"}], "author_count": 3}, {"id": "2607.05173", "category": "cond-mat", "title": "Semi-Markovian switching in a fluctuating harmonic trap: An age-structured formulation", "abstract": "We study a Brownian particle in a harmonic trap whose stiffness switches between two values with arbitrary waiting-time statistics, generating semi-Markovian dynamics. To treat the resulting temporal memory, we formulate the problem in an enlarged age-structured state space, restoring Markovianity and yielding a local Fokker--Planck description. Within this framework, we derive exact steady-state integral equations for the spatial and birth distributions and obtain exact expressions for stationary moments, injected power, and potential energy. In the second part of the paper, we analyze the stochastic-resetting limit, corresponding to a particle alternately released and trapped. By representing the stationary spatial distribution as a superposition of Gaussian states with fluctuating variance, the problem can be reformulated as a switching process in variance space. This yields exact integral equations for the variance distributions and leads to a simplified description amenable to direct analytical treatment.", "url": "https://arxiv.org/abs/2607.05173", "type": "理论", "summary": "1. 该工作针对谐波陷阱刚度服从任意等待时间统计的半马尔可夫切换，通过引入年龄变量扩展状态空间恢复马尔可夫性，建立了局域福克-普朗克描述。\n2. 其核心卖点在于从年龄结构化框架导出稳态空间与出生分布的精确积分方程，并得到矩、注入功率和势能等物理量的解析表达式。\n3. 该研究为处理非指数分布切换过程的记忆效应提供了可解析操作的范式，并启示随机重置极限可映射为方差空间中的简化切换问题。", "summary_source": "deepseek", "authors": [{"name": "Derek Frydel"}], "featured_authors": [{"name": "Derek Frydel"}], "author_count": 1}, {"id": "2607.05194", "category": "cond-mat", "title": "Nucleation and time-reversal symmetry breaking in nonconserved scalar field theories", "abstract": "Classical nucleation theory (CNT) describes the formation of a stable phase from a metastable one in terms of a single reaction coordinate that corresponds to the radius of a nucleating droplet. In this work, we provide a full account of nonequilibrium nucleation theory (NNT), which generalizes CNT to non-equilibrium field theories with non-conserved order parameter. We present two equivalent derivations of the dynamics of the droplet radius: a stochastic route, based on a direct projection of the stochastic field equation onto the radial reaction coordinate, and a route based on the minimization of the Freidlin-Wentzell action. Crucially, the quasipotential barrier predicted by NNT differs from the one found when assuming the instanton to be the time-reversal of the relaxation dynamics. Whereas the interfacial density profile differs from that on the relaxation path, an analytical derivation of NNT remains possible using a careful definition of the reaction coordinate. This leverages the perturbative structure that (in common with CNT) emerges in the limit of large critical radius. We further derive with similar techniques the dynamics of capillary waves, whose stability is required for the CNT/NNT precept of a near-spherical droplet to prevail. After deriving our theory for generic non-conserved field-theories, we address two explicit examples: a non-equilibrium generalization of Model A (Active Model A), and a population dynamics model (with two choices of noise that each break time-reversal symmetry). In both cases, we validate our analytical NNT against numerical results obtained by action minimization, with excellent agreement. NNT provide a systematic framework for constructing nucleation theories in a broad class of non-equilibrium systems from active matter, reaction-diffusion systems and population dynamics.", "url": "https://arxiv.org/abs/2607.05194", "type": "理论+数值", "summary": "1. 本文通过随机投影与Freidlin-Wentzell作用量最小化两种等效途径，将经典成核理论推广至非守恒序参量的非平衡标量场论，建立了非平衡成核理论(NNT)。\n2. 核心在于揭示准势垒不同于时间反演松弛路径的间隙子预测，并借助反应坐标和大临界半径极限的微扰结构实现解析推导，同时导出了毛细波动力学以保证近球形液滴稳定性。\n3. 该理论在活性模型A和具有时间反演对称破缺噪声的群体动力学模型中经数值作用量最小化验证，为活性物质、反应-扩散系统及群体动力学等非平衡体系提供了系统的成核理论框架。", "summary_source": "deepseek", "authors": [{"name": "Noah Ziethen"}, {"name": "Michalis Chatzittofi"}, {"name": "Michael E. Cates"}, {"name": "Cesare Nardini"}], "featured_authors": [{"name": "Noah Ziethen"}, {"name": "Michalis Chatzittofi"}, {"name": "Michael E. Cates"}, {"name": "Cesare Nardini"}], "author_count": 4}, {"id": "2607.05269", "category": "cond-mat", "title": "Excitation spectra and rank tomography of linear matrix product tangent spaces", "abstract": "We formulate a tangent-space method for algebraic varieties of matrix product states (MPS) to study excitation spectra of non-uniform quantum many-body systems with open boundary conditions. We further introduce a rank tomography of the MPS tangent space, which characterizes its expressivity in terms of particle-sector rank profiles of the underlying MPS variety. Using the Bose--Hubbard model as a benchmark, we illustrate that the method reproduces low-lying excitations and captures finite-size precursors of the Mott-insulator to superfluid transition.", "url": "https://arxiv.org/abs/2607.05269", "type": "理论", "summary": "1. 该工作提出了一个用于非均匀开边界量子多体系统的矩阵乘积态切空间代数几何方法，以研究其激发谱并引入秩层析成像。\n2. 其核心卖点在于通过对切空间秩分布的层析成像表征MPS簇的表达能力，且Bose-Hubbard模型基准测试显示其可重现低能激发并捕捉莫特绝缘体-超流转变的有限尺寸前驱。\n3. 这为非均匀量子多体系统的精确谱分析及有限尺寸相变前驱信号的刻画提供了系统性的理论工具与数值框架。", "summary_source": "deepseek", "authors": [{"name": "Otto T.P. Schmidt"}, {"name": "Iacopo Carusotto"}], "featured_authors": [{"name": "Otto T.P. Schmidt"}, {"name": "Iacopo Carusotto"}], "author_count": 2}, {"id": "2607.05308", "category": "cond-mat", "title": "A universal emulator for planar Ising lattices", "abstract": "We introduce the notion of an Ising emulator for two-dimensional Ising models: flat, unit-edge-length lattices can be represented as site- or bond-diluted supercells of a single host lattice, for which the Feynman--Vdovichenko/Kac--Ward solution is fixed once and for all. We construct explicit square and triangular emulators and show that a single transition matrix, supplemented by lattice-specific binary masks, gives all the thermodynamic quantities of interest for both ferro- and antiferromagnetic couplings. We apply the framework to all eleven Archimedean lattices, to all twenty $2$-uniform lattices -- whose thermodynamics is obtained here for the first time -- and to several pentagonal lattices, and show that the same construction extends directly to fractal and disordered Ising models, with no modification to the underlying machinery.", "url": "https://arxiv.org/abs/2607.05308", "type": "理论", "summary": "1. 该工作引入平面Ising格子的通用模拟器概念，将多种晶格统一为单个宿主格子的稀释超胞，并固定了其Feynman-Vdovichenko/Kac-Ward解的形式。\n2. 其核心卖点在于仅用单一转移矩阵配合晶格特异性二进制掩模，即可计算所有11种阿基米德、20种2-均匀及若干五边形格子在铁磁与反铁磁耦合下的全部热力学量，其中2-均匀格子系首次求解。\n3. 该框架无需修改即可直接推广至分形及无序Ising模型，为复杂晶格和随机系统的研究提供了高效统一方案，并启发将此类模拟器应用于更广泛统计物理模型。", "summary_source": "deepseek", "authors": [{"name": "Riccardo Ben Alì Zinati"}, {"name": "Alessandro Codello"}], "featured_authors": [{"name": "Riccardo Ben Alì Zinati"}, {"name": "Alessandro Codello"}], "author_count": 2}, {"id": "2607.05328", "category": "cond-mat", "title": "Mass-imbalanced SU(N) Fermi gases", "abstract": "We report a fully analytical description of zero-temperature itinerant ferromagnetism in repulsive SU(N) Fermi gases with arbitrary mass imbalance among components. Using perturbation theory in the gas parameter x = kFa0, with kF the Fermi momentum and a0 the s-wave scattering length, we derive the second-order energy for arbitrary spin polarization and arbitrary mass ratio. Our main result is a closed analytic expression for the beyond-mean-field correction in mixtures with unequal masses. This analytical result extends the theory of dilute Fermi gases beyond the mass-balanced case and provides a compact equation of state for multicomponent mixtures. We show that mass imbalance breaks the paramagnetic symmetry already in the non-interacting limit, favors the occu pation of heavier components, and lowers the interaction strength required to reach a fully polarized state. For S = 1/2, the system evolves continuously from a mass-induced partially polarized state to full ferromagnetism. For larger spins, distinct mass distributions generate qualitatively differ ent polarization paths, including smooth and discontinuous sequences. Our results identify mass imbalance as a powerful control tool for magnetic ordering in ultracold Fermi mixtures.", "url": "https://arxiv.org/abs/2607.05328", "type": "理论", "summary": "1. 该工作对零温下任意质量不平衡SU(N)费米气体中的游荡铁磁性给出完全解析描述，基于气体参数微扰展开导出了包含第二阶修正的状态方程。\n2. 其核心结果是导出任意质量比和自旋极化下超越平均场修正的闭合解析表达式，揭示质量不平衡在无相互作用极限即破坏顺磁对称性、优先填充重分量并降低铁磁转变相互作用强度。\n3. 这显示质量不平衡可产生连续或分步极化路径，为超冷费米混合物中利用质量差异精确调控磁有序和多组分量子气体磁相工程提供了理论工具。", "summary_source": "deepseek", "authors": [{"name": "Jordi Pera"}, {"name": "Joaquim Casulleras"}, {"name": "Jordi Boronat"}], "featured_authors": [{"name": "Jordi Pera"}, {"name": "Joaquim Casulleras"}, {"name": "Jordi Boronat"}], "author_count": 3}, {"id": "2607.02648", "category": "hep-th", "title": "Time-Dependent Integrability from Gauge Theory, I", "abstract": "Solvable time-dependent systems provide important settings for studying non-equilibrium physics, where exact results are rare. They are also useful for benchmarking quantum simulations, which can directly probe real-time dynamics beyond the reach of conventional numerical approaches. In this paper, we show that the four-dimensional Chern-Simons theory offers a natural and unifying framework for constructing such systems. Focusing on classically integrable field theories, we consider a generalization of the four-dimensional Chern-Simons theory in which the usual holomorphic one-form is replaced by a more general, spacetime-dependent one-form. This yields a systematic procedure for generating time-dependent integrable field theories and establishes a universal relation: for every theory obtained in this way, the allowed time dependence coincides with the one-loop renormalization group flow. Despite the explicit time dependence, these theories retain Lax integrability and remain solvable by inverse scattering methods. Our construction applies to both ultralocal and non-ultralocal theories and extends previously known time-dependent sigma models to a much broader class of integrable systems. It also admits rewriting as dilaton gravity coupled to matter, producing a large family of classically integrable dilaton gravity theories in two dimensions. We also comment on connections to time-dependent integrable models studied recently in condensed matter physics and non-autonomous integrable systems arising from dimensionally-reduced Einstein gravity.", "url": "https://arxiv.org/abs/2607.02648", "type": "理论", "summary": "1. 该工作通过将四维Chern-Simons理论中的全纯一形式推广为依赖于时空的一般形式，系统构造了含时经典可积场论的统一框架。\n2. 其核心在于证明此类理论允许的时间依赖性恰好与单圈重整化群流一致，且尽管显式含时，仍保持Lax可积性与反散射可解性，并适用于非超局部理论。\n3. 这为含时非平衡精确解提供了新途径，并建立了与二维膨胀引力及凝聚态含时可积模型的深层联系，可望用于量子模拟基准检验。", "summary_source": "deepseek", "authors": [{"name": "Shota Komatsu"}, {"name": "Jun-ichi Sakamoto"}, {"name": "Anders Wallberg"}, {"name": "Masahito Yamazaki"}], "featured_authors": [{"name": "Shota Komatsu"}, {"name": "Jun-ichi Sakamoto"}, {"name": "Anders Wallberg"}, {"name": "Masahito Yamazaki"}], "author_count": 4}, {"id": "2607.02658", "category": "hep-th", "title": "The giant graviton expansion in AdS$_5\\times$SE$_5$", "abstract": "We study giant graviton-like D3-branes as probe configurations in type IIB supergravity backgrounds AdS$_5\\times$SE$_5$, with emphasis on the structure of the five-dimensional Sasaki-Einstein manifolds SE$_5$. These configurations wrap supersymmetric three-cycles in SE$_5$ and rotate at the speed of light along the Reeb direction. We formulate the general problem in terms of the transverse Kähler potential and show that configurations carrying maximal angular momentum can be described by loci where the transverse Kähler potential diverges in suitably chosen coordinates. We quantize a particular set of excitations, similar to those considered in the AdS$_5\\times S^5$ case, and show that they are governed by a Fock-Darwin problem with a conical deficit, which generalizes the Landau problem obtained for $S^5$. Succinctly, the information about the geometry of SE$_5$ is encoded in the form of the external potential and the conical deficit. We compute a protected contribution to the superconformal index arising from quantized fluctuations of supersymmetric giant graviton configurations. For the explicit case of AdS$_5\\times T^{1,1}$, we recover the finite-N protected index of the dual quiver ${\\cal N}=1$ superconformal field theory in the sector captured by a non-Abelian generalization of the quantized degrees of freedom.", "url": "https://arxiv.org/abs/2607.02658", "type": "理论", "summary": "1. 该工作将AdS$_5\\times$SE$_5$背景中巨引力子D3-brane的探测构型问题，推广至一般Sasaki-Einstein流形，并量化了其涨落。\n2. 其技术核心在于将SE$_5$几何信息编码为Fock-Darwin问题中的外势与锥形亏损，从而推广了S$^5$的Landau问题并计算了超共形指数的受保护贡献。\n3. 这为从巨引力子视角理解更一般AdS/CFT对偶中有限N效应提供了统一框架，并明确了对偶场论扇区中非阿贝尔量化自由度的几何来源。", "summary_source": "deepseek", "authors": [{"name": "Alfredo González Lezcano"}, {"name": "Leopoldo A. Pando Zayas"}, {"name": "Augniva Ray"}], "featured_authors": [{"name": "Alfredo González Lezcano"}, {"name": "Leopoldo A. Pando Zayas"}, {"name": "Augniva Ray"}], "author_count": 3}, {"id": "2607.02861", "category": "hep-th", "title": "Holographic Learning from Fermionic Spectra: Application to Strange Metal Phenomenology", "abstract": "We develop a data-driven framework based on Neural ODEs that learns the bulk metric functions and the $U(1)$ gauge potential of a static, planar-symmetric black hole from boundary fermionic spectral functions. After validating the framework on the Einstein--Maxwell and Gubser--Rocha models with high accuracy, we apply it to the strange metal phase of the cuprate $\\mathrm{(Pb,Bi)_2Sr_{2-x}La_xCuO_{6+\\delta}}$ within a semi-holographic setting, taking as input the spectral data generated from the extended power-law liquid (PLL) model calibrated by angle-resolved photoemission measurements. At low temperatures and near-optimal doping, we show that the normalized extended PLL model can be well described by an effective representative of a conformal class near $\\mathrm{AdS}_{2}\\times\\mathbb{R}^{2}$ black holes with a nearly vanishing gauge potential ($qA_t\\sim10^{-4}\\,\\mathrm{eV}$). A key structural observation is that our probe fermion is massless and therefore insensitive to the conformal factor $\\Omega(z)$. This further implies that fixing the macroscopic thermodynamics such as the electronic specific heat would require independent input beyond the fermionic spectra. We also delineate the applicability boundaries of our framework: the learned effective model remains viable across doping at low temperatures, with the loss increasing mildly as the samples move away from the marginal Fermi liquid point toward the overdoped side; the principal limitation is temperature, where both the loss and $qA_t$ grow substantially.", "url": "https://arxiv.org/abs/2607.02861", "type": "理论", "summary": "1. 该工作基于神经ODE从边界费米子谱函数学习静态平面对称黑洞的度量函数与U(1)规范势，并通过类AdS₂×ℝ²有效模型描述铜氧化物奇异金属中近最佳掺杂下的扩展幂律液体谱。\n2. 其技术卖点在于揭示探针费米子为无质量且对共形因子不敏感，从而在黑盒学习中发现规范势几乎为零（qA_t~10⁻⁴ eV）的结构特征。\n3. 这为强关联电子系统的全息数据驱动建模提供了框架，但明确指出仅凭费米子谱无法固定宏观热力学（如电子比热），需额外约束，且随掺杂偏离边缘费米液体或温度升高时框架的适用性下降。", "summary_source": "deepseek", "authors": [{"name": "Hong-Zhi Xiao"}, {"name": "Zhan-Zhi He"}, {"name": "Zhuo-Yu Xian"}, {"name": "Shao-Feng Wu"}], "featured_authors": [{"name": "Hong-Zhi Xiao"}, {"name": "Zhan-Zhi He"}, {"name": "Zhuo-Yu Xian"}, {"name": "Shao-Feng Wu"}], "author_count": 4}, {"id": "2607.02905", "category": "hep-th", "title": "Pre-Strings Lectures on Artificial Intelligence", "abstract": "These notes are based on six lectures given over three days at the Pre-Strings 2026 school in Shanghai. Day 1 develops neural network essentials, organized around the expressivity, statistics, and dynamics of neural networks, presented with a field-theoretic lens. Day 2 develops a neural network approach to field theory (NN-FT), in which a field theory is defined by a network architecture and a density on its parameters, and surveys recent results. Examples include a universality theorem, a neural network realization of Liouville theory, famous string amplitudes, topological sectors and the Kosterlitz-Thouless transition, Ward identities and anomalies, and a new derivation of the critical dimension of the bosonic string. Day 3 turns the lens around and covers applied AI for string theory: agentic workflows that are changing how the other techniques are implemented, physics-informed neural networks and Calabi-Yau metrics, reinforcement learning and search in the string landscape and in knot theory, and interpretable supervised learning with an eye towards conjecture generation.", "url": "https://arxiv.org/abs/2607.02905", "type": "理论", "summary": "1. 该工作基于Pre-Strings 2026学校的六场讲座，系统阐述了神经网络在场论和弦论中的双向应用框架。\n2. 其核心在于提出了神经网络场论（NN-FT）定义，并展示了包括玻色弦临界维度推导、KT转变与反常等在场论和弦论中的具体实现。\n3. 这为利用神经网络重构场论基础、驱动弦景观搜索及猜想生成等方向提供了明确的方法论启示。", "summary_source": "deepseek", "authors": [{"name": "James Halverson"}], "featured_authors": [{"name": "James Halverson"}], "author_count": 1}, {"id": "2607.02970", "category": "hep-th", "title": "Null-strings Gauged, Reloaded and Quantized, I: Canonical Quantization in the Light-Cone Gauge", "abstract": "We study the light-cone quantization of null-strings in $D$ dimensional flat target-space. Incorporating the essential new gauge symmetry and the associated constraint structure of the null-string, allows one to solve for one more degree of freedom (DoF) compared to the standard light-cone gauge, reducing the physical phase space to $(D-3)$ propagating DoF. Quantization is formulated directly in the Schrödinger representation, leading to a Hilbert space of wavefunctions on the reduced configuration space. The space of physical states is built on a reduced phase space associated with the corrected gauge structure. We discuss the ground-state wavefunction and a generic class of excited states. As a direct consequence of the overlooked Carroll-Weyl gauge symmetry of the null-strings, we find the remarkable and perhaps unexpected result that null-strings exhibit a discrete spectrum. Our analysis indicate that there is no critical dimension for null-strings, and $D$ can be arbitrary.", "url": "https://arxiv.org/abs/2607.02970", "type": "理论", "summary": "1. 该工作对D维平坦靶时空中零弦(nul-strings)进行了包含Carroll-Weyl规范对称性的光锥规范量子化。\n2. 其核心在于利用被忽略的规范对称性正确消除约束，将物理相空间缩减至D-3个传播自由度，并发现零弦能谱为离散且无临界维度限制。\n3. 这为探索零弦量子态结构与相关膜理论及弦论推广提供了直接的理论框架与启发。", "summary_source": "deepseek", "authors": [{"name": "Ida M. Rasulian"}, {"name": "M.M. Sheikh-Jabbari"}, {"name": "H. Yavartanoo"}], "featured_authors": [{"name": "Ida M. Rasulian"}, {"name": "M.M. Sheikh-Jabbari"}, {"name": "H. Yavartanoo"}], "author_count": 3}, {"id": "2607.03109", "category": "hep-th", "title": "Graph Neural Networks for the Graphical Bootstrap", "abstract": "We study a graph classification problem involving over 20 million graphs, arising from high-order perturbative computations of correlators in planar $\\mathcal{N}=4$ super-Yang--Mills, a model closely related to the theory of the strong nuclear force. We benchmark graph neural networks, including graph transformers, achieving robust generalization to larger graphs with up to $99.996\\%$ ROC AUC. Then, we analyze how the models can be used to gain a computational speedup compared to the traditional graphical bootstrap algorithm, through shrinking the redundant data by up to $85.5\\%$ at the level of denominator graphs. Finally, we study the embeddings of the models to investigate their interpretability.", "url": "https://arxiv.org/abs/2607.03109", "type": "理论", "summary": "1. 该工作应用图神经网络对平面N=4超杨-米尔斯理论中逾两千万个高阶微扰图进行分类，实现了至99.996%的ROC AUC并稳健泛化至更大图。\n2. 其核心优势在于利用图变换器将图形自举算法的冗余分母图压缩85.5%，从而获得显著计算加速。\n3. 这为量子场论高阶微扰计算中的图数据缩减和模型可解释性研究提供了明确借鉴。", "summary_source": "deepseek", "authors": [{"name": "Rigers Aliaj"}, {"name": "Gabriele Dian"}, {"name": "Reza Doobary"}, {"name": "Paul Heslop"}], "featured_authors": [{"name": "Rigers Aliaj"}, {"name": "Gabriele Dian"}, {"name": "Reza Doobary"}, {"name": "Paul Heslop"}], "author_count": 4}, {"id": "2607.03120", "category": "hep-th", "title": "Exact Schwarzian Metric Factor and Holographic Wilson-Loop Screening", "abstract": "We evaluate exactly the radial metric factor $h(\\zeta)$ generated by Schwarzian averaging in the AdS$_2$ throat of an extremal Reissner--Nordström AdS$_5$ black brane. The result is a Gaussian integral against $\\coth(\\pi y)$, valid at all radial depths, which Mordell's identity turns into an exact Appell--Lerch $q/q^\\ast$-series representation. The dual series identifies the nonperturbative scale $e^{-\\pi^2 C/\\zeta}$ missed by any finite near-boundary truncation. The third parametric derivative required by the evaluation generates the quasimodular Eisenstein series $E_2$, absent from the classical Mordell identity. From the integral representation we prove that $\\mathcal{G}_0(\\zeta):=h(\\zeta)/\\zeta^2$ is completely monotone and hence has no interior minimum, so any confining minimum produced by a finite near-boundary truncation is an artifact. We also compute the exact relative variance of the Schwarzian kernel, which makes the averaged-metric approximation error quantitative and shows that the absence of a confining minimum is robust across moment-based effective geometries. Applied to the temporal rectangular Wilson loop, the exact throat gives algebraic screening, $E(L)\\sim -\\kappa_{\\rm IR}/L^2$, the Wilson-loop diagnostic of the semi-local quantum-liquid IR of the extremal RN brane. A numerical check in a simple matched geometry confirms that the screened saddle is the dominant string configuration, and an exact-versus-truncated force comparison shows that the apparent constant-force regime of the fourth-order truncation is not a feature of the exact geometry.", "url": "https://arxiv.org/abs/2607.03120", "type": "理论", "summary": "1. 该工作精确求解了极端Reissner-Nordström AdS₅黑膜AdS₂喉部中Schwarzian平均的径向度规因子，获得了全径向深度有效的精确积分表示及基于Mordell恒等式的Appell-Lerch级数展开。\n2. 其核心卖点在于揭示了非微扰尺度e^{-π² C/ζ}并证明G₀(ζ)完全单调，从而表明有限近边界截断产生的任何禁闭最小值均为伪像，同时给出Wilson环代数屏蔽E(L)∼-κ_IR/L²这一半局域量子液体红外标志。\n3. 这为极端黑膜红外几何中精确非微扰效应及其对Wilson环屏蔽行为的定量影响提供了严格框架，并对全息近似方案（如高阶截断）的有效性提出了明确检验基准。", "summary_source": "deepseek", "authors": [{"name": "Miguel Tierz"}], "featured_authors": [{"name": "Miguel Tierz"}], "author_count": 1}, {"id": "2607.03199", "category": "hep-th", "title": "Singularities, Entropy and the Arrow of Time, {\\it or} Is CRT a Gauge Symmetry in Quantum Gravity?", "abstract": "We examine the question of whether the discrete transformation CRT is a gauge symmetry of ``Quantum Gravity\". Since the phrase in quotes is not yet completely well defined, we first try to define specific frameworks in which one might ask the question. We find that the general answer is NO. In asymptotically flat and AdS spaces, CRT is an asymptotic gauge symmetry in the same sense that the continuous parts of the Poincare/AdS isometry groups and scalar internal symmetries are. In eternal dS space it can be considered a spontaneously broken gauge symmetry if a certain ``Alice String\" configuration is allowed in the Thermofield double Hilbert space. This requires an extension of the conventional Chern-Simons rewriting of $2 + 1$ dimensional gravity. This interpretation only makes sense if we consider the underlying quantum mechanics to be time independent. General quantum measurement and semi-classical gravitational restrictions on measuring devices put {\\it a priori} limits on the existence of detectors with clocks that can actually measure proper time along a classical dS geodesic.", "url": "https://arxiv.org/abs/2607.03199", "type": "理论", "summary": "1. 该工作系统考察了离散变换CRT在量子引力中的规范对称性问题，通过定义不同时空框架进行探讨。\n2. 其核心卖点在于发现渐近平坦与AdS空间中CRT为渐近规范对称性，而在永恒dS空间中需引入Alice String构型并扩展Chern-Simons理论才能视为自发破缺规范对称性。\n3. 这为量子引力中离散对称性的背景依赖性提供启示，并指出半经典测量装置对固有时间测定的限制，进而关联到时间箭头与熵的起源。", "summary_source": "deepseek", "authors": [{"name": "T. Banks"}], "featured_authors": [{"name": "T. Banks"}], "author_count": 1}, {"id": "2607.03344", "category": "hep-th", "title": "Falling through the horizon of a quantum black hole", "abstract": "We study quantum-gravitational effects on the response of an infalling detector as it crosses the horizon of a near-extremal black hole in the framework of quantum JT gravity. These effects are incorporated via the gravitational dressing needed to define both the infalling trajectory and the local observables probed by the detector in a diffeomorphism-invariant way. In the black hole exterior, a preferred choice of dressing to the Schwarzian mode of JT gravity can be motivated in connection to geometric modular flow. We show how to extend this dressing to the black hole interior, defining local observables that are gravitationally dressed to both boundaries in the thermofield double state. The gravitational dressing connects the near-horizon region to the IR sector of the Schwarzian theory, leading to measurable effects as the horizon is approached. We find that the infalling detector is able to locally determine the location of the horizon and its temperature, violating the equivalence principle, but without encountering a firewall.", "url": "https://arxiv.org/abs/2607.03344", "type": "理论", "summary": "1. 在量子JT引力框架下，研究了引力修饰对穿越近极端黑洞视界的下落探测器响应的影响。\n2. 通过将探测器及其局部可观测量以微分同胚不变方式修饰至Schwarzian模，并延拓至黑洞内部，实现了对近视界区域与红外区的非局域关联。\n3. 该效应使探测器可局域判定视界位置与温度，虽违反等效原理，但未出现火墙，为量子黑洞内部信息问题提供了新约束。", "summary_source": "deepseek", "authors": [{"name": "Victor Franken"}, {"name": "Thomas G. Mertens"}, {"name": "Bruno de S. L. Torres"}], "featured_authors": [{"name": "Victor Franken"}, {"name": "Thomas G. Mertens"}, {"name": "Bruno de S. L. Torres"}], "author_count": 3}, {"id": "2607.03434", "category": "hep-th", "title": "Berry Picking: Random Wave Chaos Hierarchy for BPS Microstate Geometries", "abstract": "We estimate the strength of chaos of probe waves and probe geodesics in different smooth supergravity backgrounds of decreasing supersymmetry and/or increasing length of the AdS throat in the interior (LLM geometry, supertubes, superstrata). We find that the wave chaos becomes stronger and stronger with less supersymetry and longer throats; in other words, chaos becomes stronger as we approach black hole solutions. Geodesic motion shows the opposite trend, becoming more and more regular. Testing the wave chaos by its compliance with the Berry random wave hypothesis and the geodesic chaos by computing Poincare sections, we explain the dichotomy between wave and geodesic motion by the existence of stable periodic orbits inside long throats while the overall measure of KAM tori decreases. Computing the Renyi entropies for the dual CFT states in the weak coupling regime, we show that they do not have such universal trends and the complexity depends on the specifics of the state rather than just the amount of supersymmetry and throat length. We conclude that the hierarchy of BPS chaos works differently in the bulk and in field theory, and in either case cannot be simply extrapolated to black holes.", "url": "https://arxiv.org/abs/2607.03434", "type": "理论", "summary": "1. 该工作研究了不同超对称性和AdS喉长超引力背景中探针波与测地线的混沌行为，发现波混沌随超对称减少和喉长增加而增强，而测地线混沌则趋于规则。\n2. 其卖点在于通过Berry随机波假设和庞加莱截面分析，将波-测地线混沌差异归因于长喉内稳定周期轨道与KAM环面度量的竞争。\n3. 这揭示BPS混沌在体和边界场论中层级不同且依赖态的具体性质，无法简单外推至黑洞，为微态几何与黑洞混沌的本质差异提供了启发。", "summary_source": "deepseek", "authors": [{"name": "Vladan Djukić"}, {"name": "Milica Stepanović"}, {"name": "Mihailo Čubrović"}], "featured_authors": [{"name": "Vladan Djukić"}, {"name": "Milica Stepanović"}, {"name": "Mihailo Čubrović"}], "author_count": 3}, {"id": "2607.03439", "category": "hep-th", "title": "Finite path integral limits work in cases where the perturbative series is not Borel summable", "abstract": "The perturbative expansion in powers of the coupling of observables in quantum field theory and quantum mechanics is known to yield an asymptotic series. If the original physical system is well-behaved and a finite observable is expected, this can often be calculated via a Borel resummation of the asymptotic series. However, there are cases where a system is well-behaved and the series is not Borel summable. This typically occurs when the physical system has a non-trivial vacuum structure. It has recently been shown that if the perturbative series is carried out under finite path integral limits, one can obtain a convergent series that yields observables even at strong coupling. This was recently used to obtain the energy at strong coupling for the anharmonic oscillator. This is a Borel summable case so the question is whether finite path integral limits work when the series is not Borel summable. To begin answering this question we consider a simple non-Borel summable case: the series stemming from a basic integral where the function has a double-well shape and hence two minima. The integral has an exact analytical expression that the series can be compared to. Under finite integral limits that run from $-L$ to $L$, where $L$ is finite, positive and real, we develop two perturbative series in powers of the coupling: one by expanding the integral about the local maximum at the origin and the other by expanding it about one of the minima. In both cases, we obtain an absolutely convergent series and the series sums to the exact analytical expression of the original integral in the infinite $L$ limit. It is significant that a perturbative expansion about one of the minima reproduces the exact analytical expression because this implies that it captures the full effect of both minima.", "url": "https://arxiv.org/abs/2607.03439", "type": "理论", "summary": "1. 该工作通过双阱势积分实例检验了有限积分限微扰展开在非Borel可和情形下的有效性。\n2. 其核心在于分别关于原点和单极小展开均得到绝对收敛级数，且后者在无限限下复现双极小精确解。\n3. 这提示有限路径积分方法有望推广至具有非平凡真空结构的非Borel可和量子场论问题。", "summary_source": "deepseek", "authors": [{"name": "Ariel Edery"}], "featured_authors": [{"name": "Ariel Edery"}], "author_count": 1}, {"id": "2607.03452", "category": "hep-th", "title": "Quantum nucleation of black hole mimickers via chaos dominated tunneling", "abstract": "Black hole mimickers, ultracompact horizonless objects, have been proposed as alternatives to black holes in a variety of settings, including extensions of general relativity and scenarios involving matter sectors beyond the Standard Model. Their formation in gravitational collapse of matter requires quantum mechanical tunneling to occur on a length scale of the order of the Schwarzschild radius of the corresponding black hole. We propose a mechanism, based on multichannel enhancement catalyzed by quantum chaotic dynamics, that can dramatically amplify the quantum mechanical transmission across a tunneling barrier. We explore, in particular, how the nucleation of a string theoretic black shell is enhanced via this mechanism. We anticipate similar results to hold for other proposed black hole mimickers.", "url": "https://arxiv.org/abs/2607.03452", "type": "理论", "summary": "1. 该工作提出了一种基于混沌主导隧穿的多通道增强机制，用于黑洞模拟物的量子成核。\n2. 其核心在于利用量子混沌动力学大幅提升穿过隧穿势垒的透射概率，使超致密无奇点天体在Schwarzschild半径尺度上成核。\n3. 该机制显著增强了弦论黑壳的成核，并预示可推广至其他黑洞模拟物，为引力坍缩中的量子隧穿过程提供了新途径。", "summary_source": "deepseek", "authors": [{"name": "Ulf Danielsson"}, {"name": "Suvendu Giri"}, {"name": "Vyshnav Mohan"}, {"name": "Larus Thorlacius"}], "featured_authors": [{"name": "Ulf Danielsson"}, {"name": "Suvendu Giri"}, {"name": "Vyshnav Mohan"}, {"name": "Larus Thorlacius"}], "author_count": 4}, {"id": "2607.03526", "category": "hep-th", "title": "Entanglement and geometric transitions in topological string theory", "abstract": "How do we define a bulk subsystem in quantum gravity? In \\cite{Wong:2025kpz}, we argued that such a subsystem must support local holographic degrees of freedom. These are gravitational edge modes, whose entanglement creates a backreaction that fuses together subregions of spacetime. In this work we give a realization of these ideas in topological string theory, building upon \\cite{Donnelly:2020teo,Jiang:2020cqo}. In this theory, a subsystem for closed strings consists of open strings ending on entanglement branes, which play the role of a dynamical entangling surface. Local holography is implemented by the geometric transition of these branes. We define a subregion open string algebra and develop a diagrammatics for open string modular flow for arbitrary states and subregion. We check that the entanglement entropy of these open strings reproduces the gravitational entropy of the associated closed string background. Finally, we relate these local transitions to defect holography.", "url": "https://arxiv.org/abs/2607.03526", "type": "理论", "summary": "1. 该工作基于拓扑弦论，通过引入带有纠缠膜的开弦构造闭弦体子系统，实现局域全息自由度。\n2. 其核心物理在于纠缠膜的几何转变融合子区域时空，并导出与闭弦背景引力熵一致的开弦纠缠熵。\n3. 这为在量子引力中定义子系统熵以及延伸至缺陷全息提供了可计算的明确途径。", "summary_source": "deepseek", "authors": [{"name": "Gabriel Wong"}], "featured_authors": [{"name": "Gabriel Wong"}], "author_count": 1}, {"id": "2607.03605", "category": "hep-th", "title": "Minimal Proper Time and Deterministic Microstates: Emergent Quantum Fields and Relativistic Spacetime", "abstract": "We develop a top-down counterpart of the minimal proper-time formulation of quantum field theory previously introduced as an effective bottom-up framework. Starting from a deterministic pre-geometric substrate of causally ordered events, we show how coarse-graining over microscopic histories leads, at low energies, to an effective Nambu-like quantum dynamics. The elementary deterministic update is identified with the minimal proper-time step, while the growth of coarse-grained equivalence classes controls both the ultraviolet dissipative correction and the scale dependence of the effective quantization strength, encoded in a running Planck constant. In this way, the proper-time cutoff kernel of the bottom-up formulation acquires a microscopic interpretation as the inverse growth of unresolved deterministic histories. In the infrared limit, the dissipative term vanishes and standard unitary quantum field theory is recovered. The same coarse-grained structure also provides a natural setting for an emergent relativistic spacetime geometry, compatible in the macroscopic limit with Einstein gravity. The resulting picture suggests a common deterministic origin for minimal-scale structure, quantum behavior, and relativistic spacetime.", "url": "https://arxiv.org/abs/2607.03605", "type": "理论", "summary": "1. 该工作从确定性前几何事件基质出发，通过粗粒化微观历史，展示了量子场论与相对论时空如何作为低能涌现产物。\n2. 其卖点在于将最小固有时间步长辨识为基本确定性更新，并揭示粗粒化等价类增长如何同时控制紫外耗散和有效量子化强度（运行普朗克常数）的尺度依赖。\n3. 这暗示了普朗克尺度结构、量子幺正性和引力时空可统一于共同的确定性微观动力学，为量子引力与时空涌现研究提供了新视角。", "summary_source": "deepseek", "authors": [{"name": "Alessio Maiezza"}], "featured_authors": [{"name": "Alessio Maiezza"}], "author_count": 1}, {"id": "2607.03617", "category": "hep-th", "title": "Quiver BPS Indices from Crystal Profiles", "abstract": "We derive new exact formulae for elliptic genera in two spacetime dimensions with $\\mathcal{N}\\ge 2$ supercharges, as well as their one- and zero-dimensional counterparts (for Witten indices and matrix-model partition functions). Our results are written as a discrete sum over geometric/combinatorial structures of crystals introduced previously by the authors. The contribution from each crystal may be expressed in terms of the boundary data of a finite substructure of the crystal called the molecules. Our results provide vast generalisations of the celebrated Nekrasov partition function enumerated by the Young diagrams, and uncover new combinatorics underlying the crystal melting. We also analyse the thermodynamic limit of crystals arising from two-dimensional $\\mathcal{N}=(0,2)$ theories associated with toric Calabi-Yau fourfolds, where a projection of the Calabi-Yau geometry emerges in the limit.", "url": "https://arxiv.org/abs/2607.03617", "type": "理论", "summary": "1. 该工作通过晶体轮廓的离散求和，推导了二维N≥2超对称椭球亏格及其低维类比（Witten指标与矩阵模型配分函数）的精确表达式。\n2. 其核心卖点在于将晶体的有限子结构（分子）边界数据与配分函数直接关联，从而在组合层面统一并极大推广了经典的Nekrasov配分函数和年轻图枚举。\n3. 这为深入理解晶体熔化中的新型组合学及其热力学极限（如环Calabi-Yau四折叠的几何投影）提供了关键框架，并有望推动高维超对称指标和拓扑弦理论的研究。", "summary_source": "deepseek", "authors": [{"name": "Jiakang Bao"}, {"name": "Masahito Yamazaki"}], "featured_authors": [{"name": "Jiakang Bao"}, {"name": "Masahito Yamazaki"}], "author_count": 2}, {"id": "2607.03679", "category": "hep-th", "title": "Conformal Renormalisation of 8D Einstein Gravity", "abstract": "We show that Holographic Renormalisation (HR) in eight dimensions is encoded in the unique conformal gravity theory that admits an Einstein sector with constant negative curvature. We explicitly relate HR to Topological Regularisation (TR), where the latter prescribes to add the Euler term to the Einstein-Hilbert Lagrangian density, with a precise coefficient so as to ensure that the resulting density is polynomial in the anti de Sitter (AdS) curvature. The polynomial is still asymptotically divergent. We find that the aforementioned, unique conformal gravity action in 8D, reproduces the polynomial, together with extra boundary terms that cancel the divergent terms in the action. We conjecture that, in arbitrary even dimension, HR is equivalent to conformally completing the Einstein-Hilbert action with negative cosmological constant, plus the Euler term with fixed coupling prescribed by TR.", "url": "https://arxiv.org/abs/2607.03679", "type": "理论", "summary": "1. 该工作证明八维全息重整化由唯一允许负常曲率爱因斯坦扇区的共形引力理论编码，并明确了其与拓扑正则化的关联。\n2. 其核心在于指出拓扑正则化以精确系数添加欧拉项，所得多项式在反德西特曲率下仍发散，而八维共形引力作用量恰好通过额外边界项抵消发散。\n3. 这启发在任意偶数维中，全息重整化等价于对带负宇宙学常数的爱因斯坦-希尔伯特作用量进行共形完备化，并配合拓扑正则化固定的欧拉项耦合。", "summary_source": "deepseek", "authors": [{"name": "Giorgos Anastasiou"}, {"name": "Ignacio J. Araya"}, {"name": "Nicolas Boulanger"}, {"name": "Rodrigo Olea"}, {"name": "Davide Rovere"}], "featured_authors": [{"name": "Giorgos Anastasiou"}, {"name": "Ignacio J. Araya"}, {"name": "Nicolas Boulanger"}, {"name": "Rodrigo Olea"}, {"name": "Davide Rovere"}], "author_count": 5}, {"id": "2607.03735", "category": "hep-th", "title": "Equal-charge projection of the $\\mathcal{N}=4$ index: exact large-$N$ formula and finite-rank $U(3)$ coefficients", "abstract": "The equal-charge branch of supersymmetric rotating AdS$_5$ black holes has $Q_1=Q_2=Q_3$. The corresponding microcanonical sector of the $\\mathcal{N}=4$ superconformal index is obtained by projecting to equal charges, or equivalently by extracting the constant term in the two charge-difference fugacities. We prove that for the large-$N$ multigraviton sector the projected index factorizes exactly as \\[ \\mathcal{I}^{\\rm eqQ}_\\infty(x,p) =\\prod_{k\\ge1}(1-p^kx^{3k})(1-p^{-k}x^{3k}) \\sum_{n\\ge0}\\mathsf{p}(n)^3x^{6n}, \\] where $\\mathsf{p}(n)$ is the partition function. This factorization gives, for every spin sector, an explicit onset energy below which the large-$N$ coefficient is zero. Exact $U(3)$ computations show that finite-rank coefficients can nevertheless appear at energies where the large-$N$ coefficient vanishes, including beyond the classical $U(3)$ black-hole bound. We also determine the full line $j=6J_R+6$. In particular, with $j^*(J_R)$ denoting this large-$N$ onset energy, \\[ d_3^{\\rm eqQ}(87,\\tfrac{27}{2})=1, \\qquad j^*(\\tfrac{27}{2})-87=1554, \\] and the first giant-graviton sector already contributes one unit at this point. All coefficients are coefficients of the $(-1)^F$-graded index, not positive degeneracies. The main conclusion is that the high-spin tail survives the exact equal-charge projection.", "url": "https://arxiv.org/abs/2607.03735", "type": "理论", "summary": "1. 该工作通过提取两个电荷差逸度的常数项实现等电荷投影，在大N多重引力子扇区导出指标精确因子化公式，其包含自旋贡献乘积与配分函数立方求和。\n2. 因子化公式揭示每个自旋扇区大N系数非零的激发能下限，而有限秩U(3)计算显示系数可在此下限以下及经典黑洞界限外出现，同时给出j=6JR+6整线系数，其中d3(87,27/2)=1且j*与
