87差1554，第一巨引力子扇区已贡献一个单位。\n3. 该结果证明等电荷投影后高自旋尾仍存续，为理解有限N修正与大N极限的关联提供了严格框架，并深化了对超对称旋转黑洞指标微观结构的认识。", "summary_source": "deepseek", "authors": [{"name": "Miguel Tierz"}], "featured_authors": [{"name": "Miguel Tierz"}], "author_count": 1}, {"id": "2607.03749", "category": "hep-th", "title": "Holographic heat engines for Schwarzschild black holes", "abstract": "We construct reversible black hole heat engines in asymptotically flat spacetime using quasi-local gravitational thermodynamics. We enclose a Schwarzschild black hole in a finite spherical cavity and identify the working substance with the dual thermal system on the cavity boundary. The surface pressure and boundary area define a thermodynamic pressure-volume pair in the dual system, while all coupling constants of the gravitational theory remain fixed. We derive exact efficiencies for the Carnot, Otto, Diesel, Brayton, and Stirling engines and compare them numerically. These efficiencies probe the quasi-local equations of state of the black hole. The regenerated Stirling efficiency remains remarkably close to the Carnot bound and approaches it in the high-temperature limit.", "url": "https://arxiv.org/abs/2607.03749", "type": "理论", "summary": "1. 该工作利用准局域引力热力学在渐近平直时空中构造可逆施瓦西黑洞热机，将腔边界对偶热系统作为工作物质。\n2. 其技术核心在于表面压力与边界面积定义热力学压力-体积对，导出卡诺、奥托、狄塞尔、布雷顿及斯特林循环的精确效率。\n3. 再生式斯特林效率在高温极限下趋近卡诺界，该方案为探测黑洞准局域状态方程及推广至其他引力理论提供框架。", "summary_source": "deepseek", "authors": [{"name": "Ripunjay Dwivedi"}, {"name": "Manus R. Visser"}], "featured_authors": [{"name": "Ripunjay Dwivedi"}, {"name": "Manus R. Visser"}], "author_count": 2}, {"id": "2607.03750", "category": "hep-th", "title": "ERG Kernels on Multiply Connected Configuration Spaces", "abstract": "In the functional-integral formulation of Euclidean field theory, exact renormalization group (ERG) transformations are realized by functional-integral kernels. Unlike the ERG flow equations that describe infinitesimal ERG transformations, these ERG kernels explicitly depend on the global topology of the configuration space. This paper explores this topology dependence for multiply connected configuration spaces. We show that the ERG kernel is in general given by a weighted sum of kernels on its universal covering space, where the weight factors are determined by a one-dimensional representation of the fundamental group. These weight factors are shown never to be renormalized under the ERG. We also show that these factors can be interpreted as Aharonov-Bohm phases with respect to a background magnetic flux penetrating the infinite-dimensional configuration space. From this viewpoint, a normalization condition for ERG transformations corresponds to a flux-quantization condition, which is equivalent to the level-quantization condition for Wess-Zumino-Witten terms in nonlinear sigma models. Finally, we present an alternative gauge-equivalent form of the ERG flow equation that incorporates this topological information locally.", "url": "https://arxiv.org/abs/2607.03750", "type": "理论", "summary": "1. 该工作研究了多重连通位形空间上精确重整化群（ERG）核的全局拓扑依赖性。\n2. 发现ERG核由覆盖空间上核的加权和给出，权重由基本群的一维表示决定且不重整化，可解释为无限维位形空间中背景磁通导致的阿哈罗诺夫-玻姆相位。\n3. 这指出ERG变换的归一化条件等价于通量量子化条件及非线性sigma模型中WZW项的能级量子化条件，并给出了局部包含拓扑信息的规范等价流方程。", "summary_source": "deepseek", "authors": [{"name": "Satoshi Ohya"}, {"name": "Taichi Tanaka"}], "featured_authors": [{"name": "Satoshi Ohya"}, {"name": "Taichi Tanaka"}], "author_count": 2}, {"id": "2607.03800", "category": "hep-th", "title": "A Smoothness Principle for Branch Selection Across Black-Hole Horizons", "abstract": "Many black-hole wave equations reduce to radial ordinary differential equations with regular singular points at horizons, where local solutions split into distinct branches. We propose a simple branch-selection principle to isolate the physically distinguished branch: removing the leading horizon behavior and imposing \\(C^{\\infty }\\) smoothness on the residual field. Using an exactly solvable scalar field in \\(JT/AdS_{2}\\), we demonstrate that this single principle successfully organizes three seemingly distinct structures: smooth continuation across the black-hole horizon, the ambiguity of the boundary retarded Green function (pole-skipping), and the lowest-weight structure of an \\(SL(2,\\mathbb{R})\\) representation. Rather than treating these phenomena as isolated boundary or horizon properties, our results unify them into a cohesive bulk-to-boundary dictionary, proving that the boundary pole-skipping ambiguity is the precise holographic manifestation of horizon-residual smoothness. Furthermore, the group-theoretic identification reveals that this physical branch selection is not a mere mathematical artifact, but is fundamentally governed by the underlying spacetime symmetries. Finally, we apply this framework as a diagnostic tool to a static holographic superconductor model, revealing that a genuine pole-skipping point requires both simultaneous residual smoothness and strict linear independence of the boundary branches to prevent deceptive branch-collapse artifacts.", "url": "https://arxiv.org/abs/2607.03800", "type": "理论", "summary": "1. 该工作提出一个基于\\(C^\\infty\\)光滑性的分支选择原理，用于从黑洞视界正则奇点处的局域解中筛选物理分支。\n2. 其卖点在于在\\(JT/AdS_2\\)标量场中统一了视界光滑延拓、边界极点跳跃与\\(SL(2,\\mathbb{R})\\)最低权重结构，证明前者是全息对应中后者的根源。\n3. 这为全息超导等模型诊断极点跳跃真伪提供判据，并提示时空对称性本质上支配着物理分支的选择。", "summary_source": "deepseek", "authors": [{"name": "Yoon-Seok Choun"}, {"name": "Ki-Seok Kim"}], "featured_authors": [{"name": "Yoon-Seok Choun"}, {"name": "Ki-Seok Kim"}], "author_count": 2}, {"id": "2607.03969", "category": "hep-th", "title": "From OPE Associativity to Gravitational Wave Signatures: Critical Dimensions and AdS/dS Transition", "abstract": "We present a framework connecting the algebraic consistency of the Operator Product Expansion (OPE) in Conformal Field Theories to observable signatures in the stochastic gravitational wave background (SGWB). By interpreting the conformal 6j symbols as crossing kernels, we extract the anomalous dimensions $\\gamma_{n,J}$ of double-trace operators from the singularities of the crossing equation. Through the AdS/CFT correspondence, these algebraic shifts are holographically reinterpreted as effective mass shifts in the Anti-de Sitter bulk. We identify a critical anomalous dimension, $\\gamma_c$, which marks the threshold where the effective mass violates the Breitenlohner-Freedman bound. Upon analytic continuation to de Sitter space ($L_{\\text{AdS}} \\to iL_{\\text{dS}}$), we demonstrate that crossing this threshold ($\\gamma < \\gamma_c$) forces the dual scaling dimensions into the complex principal series, $\\Delta_{\\text{dS}} = d/2 \\pm i\\mu$. This complex dimensionality induces characteristic logarithmic oscillations in the four-point correlators. In the cosmological context, these oscillations manifest as a log-periodic modulation in the SGWB, characterized by a specific spacing $\\Delta \\ln f = 2\\pi/\\mu$. Detecting this log-periodic structure with next-generation interferometers such as LISA would directly measure the parameter $\\mu$, closing the loop between abstract OPE associativity and observational cosmology.", "url": "https://arxiv.org/abs/2607.03969", "type": "理论", "summary": "1. 该工作构建了一个将共形场论中算符乘积展开(OPE)的结合性代数一致性关联至随机引力波背景(SGWB)可观测特征的框架。\n2. 通过将共形6j符号解释为交叉核，从交叉方程的奇点提取双迹算子的反常维度γ_{n,J}，识别出临界反常维度γ_c，并证明在解析延拓到德西特空间后，越过该阈值迫使标度维度进入复数主级数，引发四点关联函数的对数周期振荡。\n3. 该振荡在SGWB中表现为特征间隔Δln f =2π/μ的对数周期调制，下一代干涉仪如LISA若探测到该结构将直接测量参数μ，从而建立OPE结合性与观测宇宙学之间的闭环联系。", "summary_source": "deepseek", "authors": [{"name": "Tetiana Obikhod"}], "featured_authors": [{"name": "Tetiana Obikhod"}], "author_count": 1}, {"id": "2607.04065", "category": "hep-th", "title": "The Normalised Wigner Negativity Rate as a Second-Moment Probe of Infall in AdS$_3$", "abstract": "In spread complexity, the average position of an operator along its Krylov chain, recovers the right radial momentum of an infalling particle in AdS, yet it is a measure of the first moment, irrespective of the spread of the wavepacket away from its classical trajectory. The rate of a normalized Krylov-Wigner negativity can be proposed as a diagnostic of the second moment of the boundary state that captures this spreading. Starting with the \\emph{seed-normalized} Krylov-Wigner distribution -- that is, the Wigner transform of the descendant cloud, with the decaying return amplitude divided out -- we obtain an analytic Bessel form in the macroscopic limit and compute its total negativity explicitly. Retaining the Bessel variable all the way through, we find that the negativity goes as $\\sinh^{4\\Delta}(\\pi t/\\beta)$, while the raw, seed-normalized state negativity saturates, as dictated by the $O(\\sqrt{D})$ bound. Using the exact negative binomial statistics of the Krylov chain and the momentum dictionary of Caputa et al.~\\cite{Caputa:2024}, the rate of the negativity scales as the growth rate of the Krylov variance at late time asymptotics \\emph{if and only if} $\\Delta=1$, the Breitenlohner-Freedman saturating dimension in $AdS_3$. This dimensionality is special in that the negativity rate is the product of the proper radial position and momentum, $\\mathcal{R} \\propto \\mathcal{C} P_\\rho$, i.e., the rate of the tidal stretch of nearby geodesic falling into the horizon. We comment on the direction for future research, in particular the interpretation of the transverse string size operator in terms of the Krylov number operator through the common $SU(1,1)$ discrete series.", "url": "https://arxiv.org/abs/2607.04065", "type": "理论", "summary": "1. 该工作从种子归一化的Krylov-Wigner分布出发，在宏观极限下导出解析Bessel形式并显式计算总负性，从而建立归一化Wigner负性率作为边界态第二矩的诊断手段，用于探测AdS₃中下落粒子的波包扩散。\n2. 其关键发现是负性率仅当标度维数Δ=1时精确等于Krylov方差的晚期增长率，此时该率正比于径向位置与动量的乘积，即邻近测地线落入视界时的潮汐拉伸速率。\n3. 这揭示了通过SU(1,1)离散序列将Krylov数算子对应于横向弦尺寸算子的可能途径，为全息复杂性中量子涨落与经典几何的关联提供了新的模型视角。", "summary_source": "deepseek", "authors": [{"name": "Ritam Basu"}], "featured_authors": [{"name": "Ritam Basu"}], "author_count": 1}, {"id": "2607.04115", "category": "hep-th", "title": "Infrared Divergences as Itinerant Vacua", "abstract": "Infrared divergences (IRDs) are usually treated as pathologies to be cancelled, regularized, or hidden in dressed asymptotic states. This paper develops a complementary and constructive viewpoint: an IRD is the signature of an \\emph{itinerant vacuum} -- a quantum vacuum that wanders continuously through a family of inequivalent states as a classical order parameter evolves. Each value of the order parameter carries its own coherent vacuum, so moving the order parameter means traversing a succession of orthogonal vacua. The IRD is the field-theoretic cost of this wandering, and the $1/f$ noise, gravitational memory, and non-Gaussian fluctuations that emerge from it are its observable classical remnants. The technical core is an exact separation in the real-time closed-time-path (CTP) effective action. The infrared-divergent imaginary part of the influence functional must not be left as a divergent coefficient in a deterministic equation of motion; it is instead converted, by a Hubbard--Stratonovich identity, into a classical stochastic source. This step is an algebraic identity of the generating functional and requires no prior coarse graining or decoherence assumption: the retarded kernel encodes the memory of past vacuum transitions, while the noise kernel encodes the quantum uncertainty of the next one. We apply this construction to four parallel arenas -- soft QED, scalar fields in de Sitter space, soft gravitons, and non-equilibrium phase transitions -- and show that the same itinerant-vacuum mechanism underlies $1/f$ current noise, the primordial power spectrum, gravitational memory, and order-parameter dynamics. A geometric formulation in terms of a Hilbert-space bundle over the vacuum manifold is outlined as an outlook.", "url": "https://arxiv.org/abs/2607.04115", "type": "理论", "summary": "1. 本文提出红外发散是“漫游真空”的构造性标志，即经典序参量演化驱动量子真空连续穿过一族正交真空的场论代价。\n2. 技术核心在于对实时CTP有效作用量进行精确分离，将红外发散影响泛函虚部经Hubbard-Stratonovich变换转为经典随机源，无需粗粒化或退相干假设。\n3. 该机制统一解释了软QED的1/f噪声、de Sitter原初功率谱、引力记忆及非平衡相变序参量动力学，并为真空流形上的希尔伯特空间束几何表述奠定了基础。", "summary_source": "deepseek", "authors": [{"name": "Masahiro Morikawa"}], "featured_authors": [{"name": "Masahiro Morikawa"}], "author_count": 1}, {"id": "2607.04143", "category": "hep-th", "title": "Finite-$N$ Operator Algebras and the Hilbert Space of Bilocal Holography", "abstract": "We give an operator-algebraic and representation-theoretic description of the Hilbert spaces finite-$N$ bilocal holography. This work is a sequel to the finite-$N$ Hilbert space construction of arXiv:2602.20788 [hep-th]. The central result is the establishment of an invariant dual-pair operator algebra: before imposing the singlet constraint the Fock space carries commuting actions of the color group and of a bilocal Lie algebra, while the projection to the singlet sector selects a single irreducible representation of the invariant Lie algebra, which we call a master algebra. The finite-$N$ trace relations, beginning with the quadratic identities studied here, are shown to become representation-theoretic identities of the selected irreducible representation. We summarize the orthogonal, symplectic and unitary cases, identify the corresponding finite-$N$ constraints, compute the singlet Casimirs, and explain how finite traces and partition functions are obtained through characters of the resulting irreducible representations. This provides a novel, previously unknown mathematical description of the singlet space.", "url": "https://arxiv.org/abs/2607.04143", "type": "理论", "summary": "1. 作为有限N希尔伯特空间构造的续篇，该工作采用操作代数与表示论严格描述双局域全息术的希尔伯特空间，涵盖正交、辛与幺正三种对称群情形。\n2. 核心在于建立不变对偶对操作代数：Fock空间上色群与双局域李代数交换作用，单态投影选出主代数特定不可约表示，使有限N迹关系（如二次恒等式）转化为该表示的表示论恒等式，并计算对应单态卡西米尔算子。\n3. 此框架通过不可约表示特征直接导出有限迹与配分函数，为有限N全息对偶中单态约束动力学提供严格代数语言，有助于深入理解双局域全息结构的非微扰本质。", "summary_source": "deepseek", "authors": [{"name": "Byoungjoon Ahn"}, {"name": "Robert de Mello Koch"}, {"name": "Vatsal Garg"}, {"name": "Antal Jevicki"}, {"name": "Junggi Yoon"}], "featured_authors": [{"name": "Byoungjoon Ahn"}, {"name": "Robert de Mello Koch"}, {"name": "Vatsal Garg"}, {"name": "Antal Jevicki"}, {"name": "Junggi Yoon"}], "author_count": 5}, {"id": "2607.04203", "category": "hep-th", "title": "Solving for the integrable boundary states of the ABJM spin chain from $KT$-relations", "abstract": "We study integrable boundary states of the alternating SU(4) spin chain arising in ABJM theory. Starting from the $KT$-relation, we directly solve the integrability constraints for states with $n$-site translational invariance. For odd and even $n$, these constraints are reduced respectively to state equations and operator equations for the elementary $n$-site block and the matrix $K(u)$. We analyze chiral and achiral cases for $n\\leq4$. In the 1-site case we allow general operator-valued integrable pairs with an internal space, while in the remaining cases we focus on $c$-number solutions.", "url": "https://arxiv.org/abs/2607.04203", "type": "理论", "summary": "1. 该工作从KT关系出发，直接求解了ABJM理论中交替SU(4)自旋链的可积边界态，要求边界态具有n位平移不变性，并分别处理了奇偶n的不同情形。\n2. 其核心在于将可积性约束对奇数n简化为状态方程、对偶数n简化为算子方程，并系统解析了n≤4的手性与非手性情况，其中1-site情形允许内禀空间中的一般算子值可积对，其余情形得到显式c数解，从而全面刻画了边界态结构。\n3. 该直接代数求解方法为其他可积系统边界态的构建提供了明确框架，并有望促进边界可积性与体可积性以及AdS/CFT对偶中边界动力学的深入理解。", "summary_source": "deepseek", "authors": [{"name": "Nan Bai"}, {"name": "Hui Yang"}, {"name": "Mao-Zhong Shao"}], "featured_authors": [{"name": "Nan Bai"}, {"name": "Hui Yang"}, {"name": "Mao-Zhong Shao"}], "author_count": 3}, {"id": "2607.04246", "category": "hep-th", "title": "Electromagnetic Scoot for Dyons Revisited", "abstract": "In the scattering of two electric charges, the particles acquire a shift in their net boost-like angular momentum, balanced by an opposite field contribution. This electromagnetic scoot effect appears at first order in post-Minkowskian expansion (1PM) order when conservation laws are evaluated on constant-time slices, but disappears at this order on hyperboloidal slices. Here, we extend this analysis to scattering involving both electric and magnetic charges and compare the results with the purely electric case in the context of multiparticle state representations.", "url": "https://arxiv.org/abs/2607.04246", "type": "理论", "summary": "1. 该工作将电磁scoot效应从纯电荷散射推广至双荷子散射，在1PM阶对比了恒定时间与双曲切片上的守恒律差异。\n2. 其核心在于揭示电-磁荷体系中净提升角动量偏移与场贡献的平衡机制，并验证其在多粒子态表示下的普适性。\n3. 这为理解包含磁荷的散射过程中角动量守恒的几何依赖性提供了新视角，并可能启发高阶后闵氏展开中的类似分析。", "summary_source": "deepseek", "authors": [{"name": "Rasim Yılmaz"}, {"name": "Onur Ayberk Çakmak"}], "featured_authors": [{"name": "Rasim Yılmaz"}, {"name": "Onur Ayberk Çakmak"}], "author_count": 2}, {"id": "2607.04268", "category": "hep-th", "title": "Entanglement of excited states after measurements in conformal field theory", "abstract": "We study the entanglement of low-energy excited states after a fixed-outcome projective measurement on a spatial interval in a (1+1)-dimensional conformal field theory (CFT). The post-selected measurement outcome is represented by a slit carrying a conformal boundary condition, while excited states are introduced by operator insertions in the Euclidean path integral. After mapping the replicated slit geometry to a disk, the excited-state contribution to the post-measurement Rényi entropy is expressed as a normalized boundary-CFT correlation function. We apply this framework to the compact free boson CFT. For the chiral current excitation, the relevant ratios are given by current hafnians. We also study coherent superpositions of $J$ and $\\bar J$, and of conjugate compact vertex operators. In the conjugate-vertex case, the ordinary-cylinder second Rényi ratio is independent of the relative phase, whereas the finite-slit post-measurement ratio contains phase-sensitive interference terms. Finally, we describe free-fermion and multi-Slater determinant methods for testing these predictions in the critical XX chain.", "url": "https://arxiv.org/abs/2607.04268", "type": "理论", "summary": "1. 该工作通过边界共形场论方法，研究了(1+1)维CFT中低能激发态在空间区间上固定结果投影测量后的纠缠熵。\n2. 技术关键在于将后选择测量结果映射为带共形边界条件的狭缝，并将激发态对Rényi熵的贡献表示为归一化边界关联函数，从而揭示共轭顶点算符下有限狭缝测量熵的相位敏感干涉项。\n3. 此框架为一般CFT及可积模型中的测量后纠缠结构提供了统一描述，并可通过自由费米子或多Slater行列式在临界XX链中直接检验。", "summary_source": "deepseek", "authors": [{"name": "Hui-Huang Chen"}], "featured_authors": [{"name": "Hui-Huang Chen"}], "author_count": 1}, {"id": "2607.04413", "category": "hep-th", "title": "Stress stability criterion of the isospinning $\\mathbb{C}P^2$ solitons", "abstract": "We study the energy-momentum tensor of stationary rotating topological solitons in a (2 + 1)-dimensional $\\mathbb{C}P^2$ nonlinear sigma model with a stabilizing potential term. We evaluate the distributions of the corresponding shear forces and pressure and study the stability criteria for these solutions. Our results suggest that these solitons become classically unstable for some range of values of the parameters of the system.", "url": "https://arxiv.org/abs/2607.04413", "type": "理论", "summary": "1. 该工作对(2+1)维$\\mathbb{C}P^2$非线性sigma模型中带稳定势项的等自旋拓扑孤子稳态旋转解，导出了其能量-动量张量表达式，并详细分析了孤子内部的剪切力与压力分布。\n2. 其主要卖点是提出了基于这些应力分布的经典稳定性判据，该判据表明当系统参数落在某些范围内时，该孤子构型会因应力分布失衡而失稳。\n3. 这一判据为确定此类旋转孤子的稳定存在区域、边界参数以及触发不稳定性的物理机制提供了定量工具，对非线性拓扑场论中孤子稳定性的研究具有参考意义。", "summary_source": "deepseek", "authors": [{"name": "Sergei Antsipovich"}, {"name": "Yakov Shnir"}], "featured_authors": [{"name": "Sergei Antsipovich"}, {"name": "Yakov Shnir"}], "author_count": 2}, {"id": "2607.04417", "category": "hep-th", "title": "Neumann scalars in AdS: partition functions and phases", "abstract": "We present an analysis of one-loop partition functions for scalars in AdS$_{d+1}$ obeying the Neumann boundary condition and explore phases of scalar field theories in several dimensions at zero and finite temperature. The partition function computation involves an analytic continuation from $\\Delta_+$ corresponding to the Dirichlet boundary condition to $\\Delta_-$ corresponding to Neumann boundary condition. We show that this can be implemented by deformations of the contour for integral over eigenvalue ($\\lambda$) of the Laplace operator as compared to the integral over ${\\mathbb R}$ in [ arXiv:2201.09043 ] for the Dirichlet boundary condition. We further contrast these phases with those appearing for the case of scalars obeying the Dirichlet boundary condition and corroborate the occurrence of these phases by studying the long range behaviour of correlators.", "url": "https://arxiv.org/abs/2607.04417", "type": "理论", "summary": "1. 该工作系统计算了AdS_{d+1}中服从Neumann边界条件标量场的一圈配分函数，并分析了零温与有限温下不同维度的相结构。\n2. 技术核心是通过将拉普拉斯算符本征值积分轮廓从实轴变形至复平面，实现从Dirichlet边界条件标度维数Δ_+到Neumann的Δ_-的解析延拓，从而揭示异于Dirichlet情况的相，并由关联函数长程行为佐证。\n3. 这为AdS/CFT对偶中非标准边界条件对应的场论热力学与相变提供了统一解析方法，预期可推广至更高自旋或相互作用系统，深化对全息边界条件效应的理解。", "summary_source": "deepseek", "authors": [{"name": "Biki Bishwakarma"}, {"name": "Astha Kakkar"}, {"name": "Swarnendu Sarkar"}], "featured_authors": [{"name": "Biki Bishwakarma"}, {"name": "Astha Kakkar"}, {"name": "Swarnendu Sarkar"}], "author_count": 3}, {"id": "2607.04483", "category": "hep-th", "title": "Topological effects in the polarization of the Fulling-Rindler vacuum", "abstract": "We investigate how the compactification of some spatial dimensions in Rindler spacetime affects the vacuum expectation values (VEVs) of the field squared and the energy-momentum tensor for a charged scalar field prepared in the Fulling-Rindler vacuum state. A toral compactification is considered with quasi-periodicity conditions on the field operator along the compact dimensions. The phases of these conditions are interpreted in terms of the magnetic flux enclosed by the compact dimensions. For a general number of spatial dimensions, the components of the VEVs are explicitly separated, corresponding to the expectation values in the Minkowski vacuum. As a limiting case, the VEVs are retrieved in Rindler spacetime with trivial topology. We demonstrate that, for non-zero phases in the periodicity conditions, the vacuum energy-momentum tensor exhibits off-diagonal components with indices in the compact subspace. Near the Rindler horizon, the leading terms in the asymptotic expansions of the field squared and the diagonal components of the energy-momentum tensor coincide with the corresponding VEVs in Rindler spacetime with trivial topology. The off-diagonal components of the energy-momentum tensor vanish on the Rindler horizon. For small accelerations, the difference between the VEVs in the Fulling-Rindler and Minkowski vacua is exponentially small. The exception to this is a massless field with zero phases in the periodicity conditions. In this special case, the difference decays according to a power law as a function of acceleration. As an application, we consider the VEVs near the horizon of cylindrical black holes and topological black holes with toroidal horizons.", "url": "https://arxiv.org/abs/2607.04483", "type": "理论", "summary": "1. 该工作研究了Rindler时空中空间维度环面紧致化对标量场Fulling-Rindler真空的场平方与能动张量真空期望值的拓扑效应。\n2. 卖点在于准周期条件相位所对应的磁通诱导了能流非对角分量，并给出小加速下真空差为指数小、但无质量零相位时呈幂律衰减的标度律。\n3. 这为圆柱黑洞与环形视界拓扑黑洞附近量子真空极化计算提供了可直接应用的渐近形式，并启发人们关注拓扑诱导的真空能量流。", "summary_source": "deepseek", "authors": [{"name": "A. A. Saharian"}, {"name": "G. V. Mirzoyan"}, {"name": "V. S. Torosyan"}], "featured_authors": [{"name": "A. A. Saharian"}, {"name": "G. V. Mirzoyan"}, {"name": "V. S. Torosyan"}], "author_count": 3}, {"id": "2607.04522", "category": "hep-th", "title": "Symmetries and Conservation Laws in Lie-Poisson Electrodynamics", "abstract": "Lie-Poisson electrodynamics (LPE) is a non-Abelian and nonlinear deformation of usual electrodynamics, where the gauge algebra is defined through a Lie-algebra-type Poisson bracket on space-time. We focus on the geometric approach to LPE in the absence of charged matter. We establish a non-trivial field redefinition which, under mild technical assumptions, maps the LPE dynamics to that of Maxwell theory. Using this map, for any symmetry of the Maxwell action, we construct generators of LPE symmetries and the corresponding conserved currents. In particular, we obtain deformed Poincaré transformations. We also outline a natural quantization prescription for LPE based on our field redefinition.", "url": "https://arxiv.org/abs/2607.04522", "type": "理论", "summary": "1. 该工作通过非平凡场重定义将无源Lie-Poisson电动力学严格映射至麦克斯韦理论，并据此构造了其对称性生成元与守恒流。\n2. 核心卖点在于揭示LPE的动力学等价于线性麦克斯韦理论，从而可从后者的庞加莱对称性导出前者的变形庞加莱变换及守恒律。\n3. 这为LPE提供了自然的正则量子化方案，并启发将类似场重定义方法推广至其他非线性规范理论中以简化对称性分析与量子化。", "summary_source": "deepseek", "authors": [{"name": "M. A. Kurkov"}], "featured_authors": [{"name": "M. A. Kurkov"}], "author_count": 1}, {"id": "2607.04602", "category": "hep-th", "title": "Kaluza-Klein tower thresholds and scheme dependence of the species scale", "abstract": "We revisit the species scale in quantum gravity from the viewpoint of effective field theory (EFT). Two characterizations are commonly used: one defines it as the energy at which the perturbative description of quantum gravity breaks down, as inferred from the one-loop correction to the graviton propagator; the other identifies it with the suppression scale of higher-derivative operators in the gravitational effective action. We clarify the relation between these characterizations by analyzing the cutoff-scheme dependence of the one-loop tower contribution. For a large number of species, the leading tower-enhanced local correction is regulator dependent and should be interpreted as EFT matching data, while the subleading logarithmic contribution is universal within the class of proper-time cutoff profiles considered here. As a concrete application, we compute the full four-derivative one-loop corrections from Kaluza-Klein towers. Our results separate regulator-stable logarithmic data from scheme-dependent local threshold contributions, providing a controlled EFT interpretation of the relation between perturbative-breakdown and higher-derivative definitions of the species scale and explaining why their coefficient-level identification is not regulator independent.", "url": "https://arxiv.org/abs/2607.04602", "type": "理论", "summary": "1. 该工作从有效场论视角重新审视量子引力中的物种尺度，澄清了其作为微扰崩溃能量与高阶导数算符压制标度两种定义的关联。\n2. 通过分析单圈Kaluza-Klein塔贡献的截断方案依赖性，分离出方案依赖的局域阈值与普适对数项，并给出四导数修正的完整计算。\n3. 这为物种系数能标在有效场论中的匹配解释提供了可控框架，并指出其系数级标识并非方案无关的。", "summary_source": "deepseek", "authors": [{"name": "Yuri Michinobu"}], "featured_authors": [{"name": "Yuri Michinobu"}], "author_count": 1}, {"id": "2607.04611", "category": "hep-th", "title": "Multi-Particle Contributions to the Celestial Algebra in the ${\\cal N}=8$ Supergravity", "abstract": "Recently, Calkins and Pate calculated the multi-particle operator product expansions (OPEs) of single-particle celestial operators with two-particle celestial operators in pure Einstein gravity. We apply their construction to the graviton, gravitinos, graviphotons, graviphotinos and scalars in ${\\cal N}=8$ supergravity. By performing various contour integrals on these multi-particle OPEs, we obtain ninety-five (anti)commutators for the single-particle contributions from the celestial soft current algebra (derived from the single-particle OPEs) in a two-dimensional boundary. Moreover, these ninety-five multi-particle OPEs provide nontrivial relations between the corresponding celestial amplitudes. The triple-collinear limits between these bosonic and fermionic particles from the four-dimensional bulk are also described as a double check. Finally, we implicitly propose both the multi-particle OPEs of single-particle celestial operators with $(N-1)$-particle celestial operators and the corresponding (anti)commutators for the modes of celestial operators that have linear terms (or single-particle exchange terms due to the sum of $N$-particle factorization channels from amplitudes) on the right-hand sides.", "url": "https://arxiv.org/abs/2607.04611", "type": "理论", "summary": "1. 该工作将多粒子算子乘积展开构造推广至𝒩=8超引力，系统计算了引力子、引力微子、引力光子等五类粒子的单粒子与双粒子OPE。\n2. 核心在于通过对多粒子OPE进行围道积分，导出95个单粒子贡献的(反)对易子，并利用四维体三共线极限实现双重校验。\n3. 这为构建包含线性项的多粒子OPE与对应模式代数提供了隐式框架，有望深化对超引力天体软电流代数的理解。", "summary_source": "deepseek", "authors": [{"name": "Changhyun Ahn"}], "featured_authors": [{"name": "Changhyun Ahn"}], "author_count": 1}, {"id": "2607.04706", "category": "hep-th", "title": "New insights on mutual information in the island approach to the Page curve", "abstract": "In this article, we have presented one of the very important observations, regarding the behavior of mutual information of two different sets of subsystems in the after Page time scenario. This provides us with some deep insights about the conservation of geometrical entanglement. In our earlier works, we have shown how the saturation of mutual information between two specific subsystems plays a vital role in obtaining the correct Page curve for the eternal black hole. In those works, we have shown that the mutual information between $B_+$ and $B_-$, that is, $I(B_{+}: B_{-})$, vanishes at scrambling time, which leads to the correct Page curve. That means that at scrambling time, there is no correlation between $B_+$ and $B_-$. Remarkably, it is observed that at this particular value of observer's time, the mutual information between $\\mathcal{I}$ and $R$, that is, $I(\\mathcal{I}:R)$, becomes infinity. This indicates that the regions $\\mathcal{I}$ and $R$ become maximally entangled. This provides us with a notion of conservation of geometric correlation between different regions on the Cauchy slice. In this work, we have also provided a way to calculate the tripartite mutual information of regions $\\mathcal{I}$,$R_+$ and $R_-$, that is, $I(\\mathcal{I}:R_+:R_-)$ on the Cauchy slice using the earlier results involving the bipartite regions. This is a new result which was missing in the earlier literature.", "url": "https://arxiv.org/abs/2607.04706", "type": "理论", "summary": "1. 该工作基于岛方法研究了永恒黑洞Page时间后子系统B_+与B_-、I与R的互信息行为，揭示了几何纠缠在柯西面上的守恒规律。\n2. 卖点在于发现scrambling time时刻I(B_+:B_-)消失而I(I:R)发散，体现了纠缠的完全转移，并首次利用二分互信息构造了三部互信息I(I:R_+:R_-)的表达式。\n3. 这为理解黑洞信息悖论中纠缠动态平衡提供了关键约束，并启发将岛方法推广至多区域量子关联的诊断与计算。", "summary_source": "deepseek", "authors": [{"name": "Anirban Roy Chowdhury"}, {"name": "Souvik Paul"}, {"name": "Sunandan Gangopadhyay"}], "featured_authors": [{"name": "Anirban Roy Chowdhury"}, {"name": "Souvik Paul"}, {"name": "Sunandan Gangopadhyay"}], "author_count": 3}, {"id": "2607.04905", "category": "hep-th", "title": "Entropy bounds, Geroch process, and the sign of deformation parameter", "abstract": "Based on Geroch's process of dropping a system into a black hole from the vicinity of the horizon, we investigate in this paper the influence of deformation on the Bekenstein entropy bound both for (3+1) and (2+1) dimensions in the context of a generalized uncertainty principle (GUP). While providing a coherent framework for providing an upper limit on the entropy across dimensions we show, in the framework of a semiclassical treatment, that while a negative GUP deformation yields a universal relaxation of the bound, a positive deformation tightens it. Our results may be interpreted as a response to Planck-scale modifications of the near-horizon redshift.", "url": "https://arxiv.org/abs/2607.04905", "type": "理论", "summary": "1. 该工作基于Geroch过程，在广义不确定原理框架下研究了(3+1)维与(2+1)维形变参数对Bekenstein熵界的修正。\n2. 其核心发现是负形变参数普遍放宽熵界，正形变参数则收紧熵界，该效应源于近事件视界红移的普朗克尺度修正。\n3. 这一结果为熵界对量子引力效应符号的敏感性提供了半经典判据，有助于约束GUP模型的参数空间及黑洞热力学的自洽性。", "summary_source": "deepseek", "authors": [{"name": "Bijan Bagchi"}, {"name": "Akshat Pandey"}, {"name": "Parmest Roy"}, {"name": "Sauvik Sen"}], "featured_authors": [{"name": "Bijan Bagchi"}, {"name": "Akshat Pandey"}, {"name": "Parmest Roy"}, {"name": "Sauvik Sen"}], "author_count": 4}, {"id": "2607.04929", "category": "hep-th", "title": "Revisiting the Wess-Zumino-Witten Term in Nuclear and Quark Matter under Magnetic Fields and Rotation", "abstract": "We study anomalous Wess-Zumino-Witten terms associated with the chiral anomaly in dense QCD matter under magnetic fields and rotation. By introducing electromagnetic, baryon number, and isospin background gauge fields, we write down the topological couplings of neutral mesons for the $N_f=2$ and $N_f=3$ cases. The resulting terms contain characteristic contributions proportional to $\\vec{B} \\cdot \\vec{\\nabla} \\phi$ and $\\vec{\\Omega} \\cdot \\vec{\\nabla} \\phi$, where $\\phi$ denotes $\\pi^0$, $\\eta$, or $\\eta'$. These results are relevant to chiral soliton lattices in dense rotating matter.", "url": "https://arxiv.org/abs/2607.04929", "type": "理论", "summary": "1. 该工作重新考察了强磁场与旋转条件下核与夸克物质中手征反常相关的Wess-Zumino-Witten拓扑项。\n2. 其核心在于导出了中性介子（π⁰、η、η′）与磁场及旋转的梯度耦合项，形式为B·∇φ和Ω·∇φ。\n3. 这为致密旋转系统中手征孤子晶格等相的结构分析提供了理论框架。", "summary_source": "deepseek", "authors": [{"name": "Markus A. G. Amano"}, {"name": "Minoru Eto"}, {"name": "Muneto Nitta"}, {"name": "Shin Sasaki"}], "featured_authors": [{"name": "Markus A. G. Amano"}, {"name": "Minoru Eto"}, {"name": "Muneto Nitta"}, {"name": "Shin Sasaki"}], "author_count": 4}, {"id": "2607.04980", "category": "hep-th", "title": "The causal set reduction formula", "abstract": "We derive a reduction formula for matrix elements on a causal set background. We derive an infinite tower of relations between correlators, akin to the Schwinger-Dyson equations of the continuum. Combining these two results we are able to express matrix elements in three different forms: as a path integral and as two distinct sums of correlators. We sketch the form that our method - which circumvents explicit use of differential equation of motion operators - takes in flat continuum spacetime where it provides an alternative expression for the standard LSZ result.", "url": "https://arxiv.org/abs/2607.04980", "type": "理论", "summary": "1. 该工作推导了因果集背景下的矩阵元约化公式及其无限塔形关联子关系，类比连续量子场论中的Schwinger-Dyson方程。\n2. 核心卖点是绕过微分运动方程算符的显式使用，将矩阵元等价表达为路径积分与两类关联子求和，并在平坦连续时空中给出标准LSZ公式的替代形式。\n3. 这为因果集量子引力中的散射振幅计算和非微扰场论方法提供了新的代数框架与具体实现途径。", "summary_source": "deepseek", "authors": [{"name": "Stav Zalel"}], "featured_authors": [{"name": "Stav Zalel"}], "author_count": 1}, {"id": "2607.05115", "category": "hep-th", "title": "From Galilei to Euclidean Carroll and the Alice Particle: The Times They Are a-Changin'", "abstract": "In generalized, also known as $p$-brane Galilei limits, the speed of light $c$ becomes infinite in the directions transverse to a $(p+1)$-dimensional Lorentzian worldvolume. In this paper, we explain that allowing the worldvolume to be Euclidean, and thus time to be transversal, $p$-brane Galilei limits turn into Carrollian ones, that we refer to as \"Euclidean $p$-brane Carroll limits\", in which $c$ goes to zero in the $p+1$ worldvolume directions. This leads to a unified approach to taking Galilean and Carrollian limits, whose consequences we explore for $p=0$. We show that the spacetime symmetries that arise from the Euclidean 0-brane Carroll limit can be centrally extended to what we will call the Alice algebra, similar to how the Bargmann algebra centrally extends the Galilei symmetries. This gives rise to the novel notion of an Alice particle, and we obtain the Bargmann and Alice particle actions from a unified limit of the action of a relativistic massive particle or tachyon, suitably coupled to a one-form gauge potential. In the presence of a cosmological constant, we find that the Bargmann and Alice particles undergo stable motion for negative and positive cosmological constant, respectively. Finally, we show that the Bargmann and Alice particle actions can be obtained from null reduction of a massless particle action in a relativistic spacetime with one and two times. Our results indicate that in 10 dimensions, the Alice particle is a decoupling limit of a D$0{}^*$-brane in Hull's type IIA${}^*$ theory, similar to how the Bargmann particle is related to a D$0$-brane in type IIA string theory.", "url": "https://arxiv.org/abs/2607.05115", "type": "理论", "summary": "1. 该工作提出统一处理p-膜伽利略极限与欧几里得卡罗尔极限的框架，并引入Alice粒子这一新概念。\n2. 其核心在于将世界体积设为欧几里得时空，使横向时间方向上的光速趋于零，从而实现伽利略向卡罗尔极限的转化，并导出中心扩展的Alice代数。\n3. 这为从零约化统一获得Bargmann与Alice粒子作用量提供路径，并暗示十维中Alice粒子对应IIA*理论D0*膜的退耦极限。", "summary_source": "deepseek", "authors": [{"name": "Eric A. Bergshoeff"}, {"name": "Luca Romano"}, {"name": "Jan Rosseel"}, {"name": "Elena Simón Félix"}, {"name": "Sara Zeko"}], "featured_authors": [{"name": "Eric A. Bergshoeff"}, {"name": "Luca Romano"}, {"name": "Jan Rosseel"}, {"name": "Elena Simón Félix"}, {"name": "Sara Zeko"}], "author_count": 5}, {"id": "2607.05136", "category": "hep-th", "title": "Chern Character for Discrete Spectrum Partition Function", "abstract": "We establish a rigorous geometric correspondence between thermal partition functions of discrete-spectrum quantum systems with bounded ground energy and the Chern character of \"virtual physical sheaf\" over spacetime. By interpreting Hamiltonian dynamics as a $U(1)$-equivariant flow on the quantum phase space $\\mathbb{CP}^n$ and pushforward to spacetime, we show that the finite-temperature partition function emerges as the integral of the Chern character of \"virtual physical sheaf\" over spacetime. The construction extends naturally to infinite dimensions through trace class guaranteed by Weyl's aspmtotic law. Using the Grothendieck-Riemann-Roch formalism, we prove pushforward invariance of the Chern character under thermal compactification on arbitrary manifolds, providing a topological foundation for thermal traces in quantum field theory. This framework unifies spectral theory with characteristic class theory, offering a geometric interpretation of partition functions based on operator-algebraic approach.", "url": "https://arxiv.org/abs/2607.05136", "type": "理论", "summary": "1. 该工作建立了离散谱量子系统热配分函数与时空上“虚拟物理层”陈特征之间的严格几何对应。\n2. 其技术核心在于将哈密顿动力学解释为量子相空间上U(1)等变流并推前到时空，从而将有限温度配分函数表示为陈特征的积分。\n3. 这为量子场论中热迹的拓扑基础提供了统一框架，并借助Weyl渐近律自然推广至无限维系统。", "summary_source": "deepseek", "authors": [{"name": "Shunrui Li"}, {"name": "Yang Liu"}], "featured_authors": [{"name": "Shunrui Li"}, {"name": "Yang Liu"}], "author_count": 2}, {"id": "2607.05143", "category": "hep-th", "title": "Effective Field Theory of Noncritical M-theory from Bosonization", "abstract": "We extend the coadjoint orbit approach to bosonization systematized by Delacretaz-Du-Mehta-Son to double-scaled non-relativistic Fermi liquids with central inverted harmonic oscillator potential. In 1+1d, this reproduces the Das-Jevicki collective field theory describing quasiparticle excitations of the $c=1$ matrix model. In 2+1d, this yields an effective field theory for noncritical M-theory, namely the 2+1d Fermi liquid proposed by Hořava and Keeler as a unified framework for characterizing noncritical string vacua. With a suitable gauge choice this theory reduces to a continuous family of 1+1d chiral bosons resembling Das-Jevicki collective fields coupled by additional interactions. Utilizing the underlying integrability of noncritical M-theory, we compute select fermion density correlation functions order-by-order in perturbation theory, and provide evidence that they agree with their Fermi liquid counterparts in a suitable semiclassical limit. This represents a step toward an effective spacetime gravity description of noncritical M-theory, which we expect to shed light on both the landscape of 2d noncritical strings and 3d quantum gravity in general.", "url": "https://arxiv.org/abs/2607.05143", "type": "理论", "summary": "1. 该工作通过共伴随轨迹玻色化方法将双标度非相对论费米液体扩展到2+1维，导出了非临界M理论的有效场论。\n2. 其核心在于合适规范选取下将理论约化为连续族1+1维手征玻色子，并利用可积性微扰计算费米子密度关联函数到指定阶数。\n3. 这为从有效时空引力描述理解非临界弦景观及三维量子引力提供了可验证的微扰框架。", "summary_source": "deepseek", "authors": [{"name": "Patrick Jefferson"}, {"name": "Tokiro Numasawa"}], "featured_authors": [{"name": "Patrick Jefferson"}, {"name": "Tokiro Numasawa"}], "author_count": 2}, {"id": "2607.05225", "category": "hep-th", "title": "A Century of Group Theory in Particle Physics and Beyond", "abstract": "The development of Group Theory in Mathematics as well as its impact in Physics has been spectacular during the twentieth century, and more particularly these last fifty years. If its contribution to Particle Physics deserves a special consideration, its usefulness cannot be neglected in other domains like Statistical Physics for example, and might also be of interest in Theoretical Biology. Some of these aspects will be examined.", "url": "https://arxiv.org/abs/2607.05225", "type": "理论", "summary": "1. 该工作回顾了20世纪群论在粒子物理中的核心贡献及其向统计物理、理论生物学等领域的拓展历程。\n2. 其卖点在于系统梳理了群论从数学工具到跨学科统一语言的历史脉络，并突出其在粒子物理标准模型构建中的关键作用。\n3. 这为理解对称性在基础科学中的普适性提供了历史纵深，并启发群论在复杂系统与交叉学科中的进一步应用。", "summary_source": "deepseek", "authors": [{"name": "Paul Sorba"}], "featured_authors": [{"name": "Paul Sorba"}], "author_count": 1}, {"id": "2607.05258", "category": "hep-th", "title": "Thermal two-point functions in SYK and complex-time singularities", "abstract": "We analyze the finite-temperature two-point function of the large-$N$ SYK model at intermediate couplings away from the infrared fixed point. Specifically, we examine its analytic structure in the complex time plane, tracking the complex-time singularities over a range of temperatures. The location of the leading singularity lies on the imaginary axis. It controls the short-time dynamics of operator complexity, defining an `effective temperature' for the correlator. The next-to-leading singularity lies outside the thermal strip set by the above effective temperature. It has been argued that this could be interpreted in terms of bouncing null geodesics in the emergent black hole geometry. Both these singularities persist all the way down to zero temperature. We discuss our observations and motivate the related emergent geometry using a kinematic space perspective.", "url": "https://arxiv.org/abs/2607.05258", "type": "理论", "summary": "1. 该工作系统分析了SYK模型在有限温度下两点函数于复时间平面上的解析结构，追踪了主导与次主导奇点随温度演化的行为。\n2. 其核心发现是主导奇点位于虚轴并定义关联子的有效温度，且次主导奇点处于该有效温度设定的热条之外，后者可被解释为涌现黑洞几何中反弹零测地线的信号。\n3. 这一奇点结构自高温持续至零温，为从运动学空间视角理解算子复杂度的短时动力学及全息对偶中的涌现时空提供了直接约束。", "summary_source": "deepseek", "authors": [{"name": "Ilija Burić"}, {"name": "Chi-Ming Chang"}, {"name": "Ivan Gusev"}, {"name": "Elizabeth Helfenberger"}, {"name": "Andrei Parnachev"}, {"name": "Mukund Rangamani"}], "featured_authors": [{"name": "Ilija Burić"}, {"name": "Chi-Ming Chang"}, {"name": "Ivan Gusev"}, {"name": "Elizabeth Helfenberger"}, {"name": "Andrei Parnachev"}, {"name": "Mukund Rangamani"}], "author_count": 6}, {"id": "2607.05294", "category": "hep-th", "title": "Polynomial Initial-State Jumps and Christoffel Transforms in Krylov Complexity", "abstract": "State Krylov, or spread, complexity is a property of a pair $(H,\\ket{K_0})$ rather than of the Hamiltonian alone. Thus, changing the initial state at fixed $H$ generally changes the Lanczos coefficients and the ordered Krylov basis. We solve this relative initial-state problem for normalized polynomial filters, $\\ket{\\psi_Q}=Q(H)\\ket{K_0}/\\sqrt{N_Q}$ with $N_Q=\\langle K_0|Q(H)^\\dagger Q(H)|K_0\\rangle$. The filtered spectral measure is the positive polynomial modification $|Q(E)|^2\\mathrm d\\mu(E)/N_Q$, and orthogonality turns this measure change into a finite-band transfer from reference Fourier-orthogonal-polynomial moments to shifted Krylov amplitudes. We derive exact finite sums for individual amplitudes and projected Christoffel-Darboux kernels for cumulative probabilities and spread complexity. The formulae cover confluent roots, complex seed coefficients, support loss, and terminal quotients in finite dimensions. We evaluate the construction in three canonical Jacobi families, the Heisenberg--Weyl/Charlier oscillator, the compact $SU(2)$/Krawtchouk spin, and the constant-coefficient tight-binding/Chebyshev chain, with a Hermite central-limit scaling of Charlier as a continuous-spectrum check of this Christoffel jump machinery. Finite seed families are organized by a matrix-valued parent measure whose scalar compressions recover the individual shifted problems. The fixed-inner-product construction carries over to operator Krylov complexity after the replacement \\(H\\mapsto\\mathcal L\\) and \\(\\ket{K_0}\\mapsto O\\); polynomial seeds then become nested-commutator descendants \\(Q(\\mathcal L)O\\). The result is an exact relative calculus in which a solved cyclic problem generates a family of polynomially related initial-state dynamics without repeating Lanczos in the original Hilbert space.", "url": "https://arxiv.org/abs/2607.05294", "type": "理论", "summary": "1. 该工作针对归一化多项式滤波器初态，推导了固定哈密顿量下Krylov复杂度的精确有限和公式，解决了相对初态问题。\n2. 其核心在于通过谱测度的正多项式修正与正交性将初态变化映射为有限带转移，导出振幅与累积分概率的闭合形式，覆盖重根、复系数与有限维终止，并在Heisenberg-Weyl/Charlier、SU(2)/Krawtchouk及紧束缚/Chebyshev三个Jacobi族中验证了Hermite标度极限，建立了矩阵值父测度标量压缩的统一描述。\n3. 该精确相对计算框架避免了重复Lanczos迭代，且固定内积构造可直接推广至算子Krylov复杂度，为系统研究多项式关联初态族动力学提供了新途径。", "summary_source": "deepseek", "authors": [{"name": "Abhishek Chowdhury"}, {"name": "Ajit Prasad Mahapatra"}], "featured_authors": [{"name": "Abhishek Chowdhury"}, {"name": "Ajit Prasad Mahapatra"}], "author_count": 2}, {"id": "2607.05327", "category": "hep-th", "title": "Cosmological Correlators in KLF and the Double-Exchange", "abstract": "In this work, we present the procedure to find series representations of tree-level cosmological correlators using the Kontorovich-Lebedev-Fourier (KLF) space formalism. This framework allows us to trade the in-in nested time integrals for frequency integrals over rational propagators and vertex functions, which encode interactions among quantum fields on a de Sitter background. Because these functions are the key objects to understand in order to perform a diagrammatic computation, we derive their relevant analytic properties by using both their integral representation and series representation in terms of Lauricella functions. For a vertex involving any number of fields, we obtain the location of singularities, the corresponding residues and the large-frequency asymptotic behaviour. Gathering these properties at each frequency integration allows us to compute a tree-level correlator directly, without relying on the differential equations it satisfies. To illustrate this procedure, we provide a complete treatment of the double-exchange diagram. The computation naturally distinguishes the different physical contributions, whether to the background or to the cosmological collider signal. The newly derived result is expressed at most in terms of a double series over hypergeometric functions, which simplifies the analytical expression of the correlator.", "url": "https://arxiv.org/abs/2607.05327", "type": "理论", "summary": "1. 该工作基于Kontorovich-Lebedev-Fourier空间形式，提出了树级宇宙学关联函数级数表示的系统化构建方法。\n2. 关键卖点是将in-in嵌套时间积分转化为频率积分，并通过Lauricella函数导出有理传播子与顶点函数的奇点、留数及大频率渐近行为。\n3. 这一解析框架绕开微分方程直接计算树级图，对双交换图给出了至多双超几何级数的简洁结果，并可清晰分离背景与宇宙学碰撞信号贡献。", "summary_source": "deepseek", "authors": [{"name": "Nathan Belrhali"}, {"name": "Arthur Poisson"}, {"name": "Sébastien Renaux-Petel"}], "featured_authors": [{"name": "Nathan Belrhali"}, {"name": "Arthur Poisson"}, {"name": "Sébastien Renaux-Petel"}], "author_count": 3}, {"id": "2607.05338", "category": "hep-th", "title": "Does QFT make sense in non-integer dimensions?", "abstract": "We revisit the old problem of analytically continuing QFTs to fractional dimension $d\\in\\mathbb C$. We observe that common theories like QCD and QED have branch cuts in the complex $d$ plane. In particular, many operators in their low-energy CFT have OPEs and scaling dimensions that jump as a function of $d$.", "url": "https://arxiv.org/abs/2607.05338", "type": "理论", "summary": "1. 该工作重新审视了将量子场论解析延拓至分数维度的经典问题，重点考察了d∈C时理论的行为。\n2. 其核心发现是，QCD和QED等常见理论在复数维度平面上存在分支割线，导致低能CFT中算符的OPE和标度维度随d发生不连续跳跃。\n3. 这一结果对在非整数维度中构建自洽QFT的可行性提出了质疑，并为严格解析延拓方案的研究提供了关键约束。", "summary_source": "deepseek", "authors": [{"name": "Diego Delmastro"}, {"name": "Yan-Yan Li"}, {"name": "Dikshant Rathore"}], "featured_authors": [{"name": "Diego Delmastro"}, {"name": "Yan-Yan Li"}, {"name": "Dikshant Rathore"}], "author_count": 3}, {"id": "2607.05385", "category": "hep-th", "title": "Charge-Sector Construction of the Type-IIB Axion--Dilaton Wormhole Partition Function", "abstract": "I construct the Type-IIB axion--dilaton wormhole partition function from charge-sector data. In a chosen axion charge, equivalently form-field flux sector, the long-distance saddle calculation supplies a two-end operator term with coefficient matrix \\(C^{ij}_\\nu\\). The labels \\(i,j\\) label end-insertion operators; the labels \\(A,B\\) label parent universes. Reduction data \\(b\\) convert this matrix into scalar coefficients \\(W_\\nu[b]\\). The wormhole partition function in the theta variable is \\(Z_{\\rm wh}(\\theta;b)=\\sum_\\nu W_\\nu[b]\\e^{i\\nu\\theta}\\). I analyze properties and constraints this coefficients satisfy: discrete-symmetry covariance, phase, absolute bounds, moment positivity, Cauchy--Schwarz inequalities for the unreduced coefficient matrix, complex-\\(\\theta\\) domains, charge-lattice tails, and the dilute Bessel/Skellam limit. The \\(\\theta\\)-dependence of the wormhole partition function is the Fourier transform of the charge-sector scalar coefficients.", "url": "https://arxiv.org/abs/2607.05385", "type": "理论", "summary": "1. 该工作从荷扇数据构建了IIB型轴子-膨胀子虫洞配分函数，通过长距离鞍点计算得到双端算符系数矩阵并约化为标量系数。\n2. 其卖点在于揭示了配分函数的θ依赖性是荷扇标量系数的傅里叶变换，并系统分析其离散对称协变性、矩正定性、Cauchy-Schwarz不等式及复θ域等约束。\n3. 这为弦论紧致化中虫洞效应的非微扰路径积分研究提供了精确的荷扇构造框架与可检验的数学约束条件。", "summary_source": "deepseek", "authors": [{"name": "Soo-Jong Rey"}], "featured_authors": [{"name": "Soo-Jong Rey"}], "author_count": 1}, {"id": "2607.05395", "category": "hep-th", "title": "Liénard--Wiechert fields in AdS and flat-space antipodal matching from geodesic-centered Coulombic data", "abstract": "We give a geometric derivation of Li'enard--Wiechert fields in flat space and in global AdS, emphasizing the origin of antipodal matching. In flat space, the field of a uniformly moving charge is obtained by using coordinates centered on the source timelike geodesic, where the charge is at rest and the solution is the ordinary Coulomb field. The nontrivial angular dependence of the leading data at null infinity arises only after rewriting this static solution in a non-centered frame, making the antipodal matching condition transparent. We extend the same construction to global AdS, where uniform motion is replaced by motion along a timelike geodesic. Starting from the static Maxwell solution at the AdS center, we use geodesic-adapted coordinates and embedding-space invariants to reconstruct the field in arbitrary global coordinates. This yields a closed-form AdS analogue of the Coulombic Li'enard--Wiechert field, including the gauge-invariant component $F_{\\rho\\tau}$. We show that the bulk field satisfies exact antipodal covariance, and that its null-fringe limit reproduces the standard flat-space antipodal matching relation between the Coulombic data at $\\mathscr I^+*-$ and $\\mathscr I^-*+$. We also describe an image-charge interpretation of the Coulomb seed, giving a unified picture of Coulombic fields, antipodal matching, and the AdS-to-flat-space limit.", "url": "https://arxiv.org/abs/2607.05395", "type": "理论", "summary": "1. 该工作从测地线中心的库仑静场出发，几何推导了平直时空与全局AdS时空中的Liénard–Wiechert场，明确揭示了反足匹配的几何起源。\n2. 技术核心在于借助测地线适配坐标和嵌入空间不变量，在AdS中构造出含规范不变分量F_{ρτ}的闭合形式类库仑场，并严格证明体场满足精确反足协变性，其零边缘极限自动再现平直时空的标准反足匹配关系。\n3. 该研究将库仑场、反足匹配及AdS到平直时空极限统一于测地线中心化图像，为理解类光无穷远数据间的对应提供几何基础，并可能启发AdS/CFT中类似反足条件的深入探讨。", "summary_source": "deepseek", "authors": [{"name": "Sarthak Duary"}], "featured_authors": [{"name": "Sarthak Duary"}], "author_count": 1}, {"id": "2607.02700", "category": "math-ph", "title": "Van Vleck spectra of high-order Heun operators:\\ finite-band universality and exterior asymptotics", "abstract": "We study high-order analogues of the classical Heun operator of Fuchs index one, \\[ \\dq=\\sum_{i=1}^k Q_i(z)\\frac{d^i}{dz^i}, \\qquad °Q_i\\le i+1, \\qquad °Q_k=k+1. \\] For a fixed degree $n$ we consider the linear Van Vleck polynomials $V$ for which $\\dq+V$ has a polynomial solution of degree $n$, and we form the spectral polynomial $Sp_n$ whose zeros are the zeros of these Van Vleck polynomials. The main result is a finite-band determinant representation and the resulting universality theorem: after normalization, all fixed power sums of the zeros of $Sp_n$ have limits given by explicit constant-term formulae depending only on the leading coefficient $Q_k$. The lower coefficients of $\\dq$ enter only lower order correction terms. Combining this with the localization theorem for Van Vleck roots, we strengthen the usual germ-at-infinity conclusion to locally uniform convergence of the normalized Cauchy transforms and logarithmic potentials on the whole exterior of the convex hull of the zeros of $Q_k$. We also prove a determinacy criterion: if the spectral roots are asymptotically confined to a compact set with empty interior and connected complement, then the finite-band moments determine the actual weak limit. In particular, when the zeros of $Q_k$ are collinear the root-counting measures of $Sp_n$ converge weakly to a probability measure supported on the corresponding segment; this limit is independent of all lower coefficients of $\\dq$. Finally, we prove holonomicity of the exterior Cauchy transform and derive Picard--Fuchs equations for the WKB periods, with an explicit third-order equation in the first non-classical case $k=3$. The paper ends with a precise mother-body conjecture for the genuinely complex case, clearly separated from the unconditional results.", "url": "https://arxiv.org/abs/2607.02700", "type": "理论", "summary": "1. 该工作研究了高阶Heun算子的Van Vleck谱，建立了谱多项式的有限带行列式表示。\n2. 核心结果是谱多项式零点幂和的极限普适性，仅依赖于首项系数，低阶项仅贡献纠正。\n3. 这为确定谱根的弱收敛极限及WKB周期P-F方程提供了明确理论启发。", "summary_source": "deepseek", "authors": [{"name": "Boris Shapiro"}], "featured_authors": [{"name": "Boris Shapiro"}], "author_count": 1}, {"id": "2607.02737", "category": "math-ph", "title": "Transition-Set Morphometry for Inter-Scale Contacts in Digital Sandstones", "abstract": "This paper introduces a transition-set morphometry for quantifying inter-scale contacts in digital sandstones. Pore volume, a medial pore-throat subsystem, and fracture porosity are treated as distinct geometric subsystems. Their finite-neighborhood contacts are represented by transition sets such as $T_{VL}$, $T_{VF}$, and, when a residual skeleton is resolved, $T_{LF}$. The method measures the density, finite-scale dimension, and weighted contact measures of these sets. A matrix-mode test was performed on 21 digital sandstone samples from the Imperial College micro-CT collection and Digital Porous Media Portal dataset DRP-317. Permeability, expressed as $\\log_{10}K$, served as an external response for assessing how much structural information the descriptors carry. The transition dimension $d_{VL}$ alone produced little independent predictive gain, whereas contact measures combining transition-set density with local pore radius were more informative. The adaptive measure $\\widehat C_{VL}^{(d+1)}=\\mu_{VL}(\\overline D_{VL}/D_*)^{d_{VL}+1}$ increased leave-one-out $R^2$ from 0.752 to 0.881 in the combined sample and from 0.287 to 0.807 within DRP-317. Fractured datasets DRP-5, DRP-31, and DRP-285 were then used to test the transfer of the same transition-set construction to fracture-related contacts. The results support transition sets as reproducible morphometric descriptors of inter-scale contact.", "url": "https://arxiv.org/abs/2607.02737", "type": "理论", "summary": "1. 该工作引入过渡集形态测量法，将数字砂岩的孔隙体、孔喉子系统和裂缝视为独立几何子系统，通过有限邻域接触定义过渡集以量化跨尺度结构。\n2. 技术核心是测量过渡集密度、有限尺度维数与加权接触测度，发现结合局部孔径的自适应指标 \\(\\widehat C_{VL}^{(d+1)}\\) 将渗透率 \\(\\log_{10}K\\) 预测留一法 \\(R^2\\) 从0.752提升至0.881。\n3. 该方法在裂缝数据集上的迁移验证表明其可重复性，为多孔介质中裂缝-孔隙耦合传输性质的定量形态描述提供了可推广的框架。", "summary_source": "deepseek", "authors": [{"name": "O. M. Kiselev"}], "featured_authors": [{"name": "O. M. Kiselev"}], "author_count": 1}, {"id": "2607.02849", "category": "math-ph", "title": "A new PBW basis for the alternating central extension of the $q$-Onsager algebra", "abstract": "We establish a new PBW basis for $\\mathcal A_q$, the alternating central extension of the $q$-Onsager algebra. Terwilliger showed that the alternating generators form a PBW basis in the block order $\\mathcal G<\\mathcal W^-<\\mathcal W^+<\\widetilde{\\mathcal G}$. We prove that they also form a PBW basis in the different block order $\\mathcal W^-<\\mathcal G<\\widetilde{\\mathcal G}<\\mathcal W^+$. Consequently, multiplication induces a vector-space isomorphism \\[ \\mathcal W^-\\otimes\\mathcal G\\otimes\\widetilde{\\mathcal G}\\otimes\\mathcal W^+ \\longrightarrow \\mathcal A_q, \\] thereby confirming a conjecture of Terwilliger.", "url": "https://arxiv.org/abs/2607.02849", "type": "理论", "summary": "1. 该工作为$q$-Onsager代数的交替中心扩张$\\mathcal A_q$建立了一个新的PBW基。\n2. 核心在于证明了生成元在块顺序$\\mathcal W^-<\\mathcal G<\\widetilde{\\mathcal G}<\\mathcal W^+$下同样构成PBW基，从而验证了Terwilliger的猜想。\n3. 这一代数结构结果为理解$q$-Onsager代数的表示理论及其在可积系统中的应用提供了新途径。", "summary_source": "deepseek", "authors": [{"name": "Haoran Zhu"}], "featured_authors": [{"name": "Haoran Zhu"}], "author_count": 1}, {"id": "2607.03507", "category": "math-ph", "title": "The Oracle Theorem for Matrix-Valued Jacobi Operators", "abstract": "This paper develops the matrix-valued analogue of the reflectionless and oracle framework for Jacobi operators. Starting from matrix-valued Weyl--Titchmarsh $m$-functions on the Siegel upper half-space, we study the distance-decreasing action of transfer matrices, matrix-valued harmonic measures and value distribution convergence. These ingredients are then used to establish the reflectionless property of the $\\omega$-limit set and to prove an Oracle Theorem for matrix-valued Jacobi operators with absolutely continuous spectrum of full multiplicity.", "url": "https://arxiv.org/abs/2607.03507", "type": "理论", "summary": "1. 该工作将无反射与预言机框架推广至矩阵值Jacobi算子，建立其矩阵值Weyl–Titchmarsh m函数理论。\n2. 技术核心在于利用传输矩阵在Siegel上半空间上的距离递减作用与矩阵值调和测度，证明ω极限集的无反射性质。\n3. 由此获得的Oracle定理为具全重绝对连续谱的矩阵值Jacobi算子谱问题提供了关键约束，启发了相关逆散射理论的进一步拓展。", "summary_source": "deepseek", "authors": [{"name": "Silas L. Carvalho"}, {"name": "Douglas C. P. Freitas"}], "featured_authors": [{"name": "Silas L. Carvalho"}, {"name": "Douglas C. P. Freitas"}], "author_count": 2}, {"id": "2607.03546", "category": "math-ph", "title": "Anomalous rate of eigenstate thermalisation at singularities of the density of states", "abstract": "We prove the Eigenstate Thermalisation Hypothesis (ETH), also known as Quantum Unique Ergodicity (QUE), for large $N\\times N$ mean-field random matrices with general correlation structure. We identify the microcanonical ensemble and establish the optimal fluctuation scale of eigenvector overlaps around it. Our results invalidate the prediction by Feingold and Peres [Phys. Rev. A 34, 591 (1986)] in the physics literature of quantum chaos, based upon popular semiclassical theory, and uncover the genuine mechanism which relies on multi-resolvent local laws. Although fluctuations are expected to increase as the density of states vanishes, and indeed scale as $N^{-1/2}$ in the special cusp regime, rather than $N^{-1}$ in the bulk, we find, unexpectedly, that the same $N^{-1}$ rate persists at regular spectral edges. Hence, generically, in the absence of cusps, the entire eigenbasis fluctuates on the same scale as a Haar unitary. This anomaly stems from delicate cancellations in the solution of the underlying matrix Dyson equation, which form the core of our analysis.", "url": "https://arxiv.org/abs/2607.03546", "type": "理论", "summary": "1. 该文证明了一般关联结构的平均场随机矩阵的本征态热化假设，指出能态密度奇异点处本征态投影涨落标度出现反常。\n2. 其核心在于发现常规谱边缘涨落率保持为N⁻¹（与Haar酉矩阵同标度），而非Feingold–Peres半经典理论预言的尖点处N⁻¹/²，此异常源于矩阵Dyson方程解的精细对消。\n3. 这揭示了多分辨率局域律在量子混沌本征态热化中的主导机制，为随机矩阵理论在奇异能态密度区域的精确行为提供了新视角。", "summary_source": "deepseek", "authors": [{"name": "László Erdős"}, {"name": "Joscha Henheik"}, {"name": "Volodymyr Riabov"}], "featured_authors": [{"name": "László Erdős"}, {"name": "Joscha Henheik"}, {"name": "Volodymyr Riabov"}], "author_count": 3}, {"id": "2607.04349", "category": "math-ph", "title": "The Dirichlet Laplacian with a point interaction on unbounded Lipschitz domains", "abstract": "We study one-centre point interactions for the Dirichlet Laplacian on unbounded domains in dimensions two and three, with emphasis on exterior domains and special Lipschitz domains. These operators are singular perturbations constructed as self-adjoint extensions of the Dirichlet Laplacian restricted to functions vanishing at the interaction centre, and their resolvents are given by an explicit Kre\\uın formula with a single extension parameter $\\alpha$. The negative spectrum is completely characterized by a scalar equation and the critical coupling $\\alpha$ separating binding from non-binding is the threshold limit of the Weyl function appearing in the Kre\\uın formula. We establish domain monotonicity of the Weyl function, of the critical coupling, and of the unique negative eigenvalue when existing, and we derive sharp near-boundary asymptotics of the critical coupling in uniformly $C^{1,1}$ geometries. These estimates imply that, for every fixed coupling, nonpositive spectrum disappears when the interaction centre approaches the Dirichlet boundary. We also prove limiting absorption principles and purely absolutely continuous positive spectrum for a point-interaction in exterior domains case and in classes of special Lipschitz domains. We also analyze in depth several threshold phenomena. We show that the critical coupling is governed by the far-field behavior of the zero-energy Green function: exterior domains give threshold resonances, domains contained in a three-dimensional half-space give threshold eigenvalues, the half-plane gives a $p$-wave resonance, and planar wedges exhibit types of threshold states that are aperture-dependent. Finally, low-energy resolvent expansions are computed in the model cases and persistence or disappearance of eigenvalues at threshold are studied. The present paper seems to be the first systematic work on the subject.", "url": "https://arxiv.org/abs/2607.04349", "type": "理论", "summary": "1. 该工作系统研究了二维和三维无界Lipschitz域上Dirichlet Laplacian的单中心点相互作用，通过Kreĭn公式构造自伴延拓并给出预解式显式表达。\n2. 主要技术贡献在于完全表征负谱与临界耦合α，建立Weyl函数和临界耦合的域单调性及一致C^{1,1}几何下近边界渐近，并揭示零能Green函数远场行为决定阈值态类型（外域共振、半空间特征值、半平面p波共振、楔形孔径依赖态）。\n3. 该文为首篇系统工作，为奇异微扰理论中边界效应与阈值现象提供定量框架，并对低能展开及推广至其他几何具有明确启发。", "summary_source": "deepseek", "authors": [{"name": "Diego Noja"}, {"name": "Francesco Raso Stoia"}], "featured_authors": [{"name": "Diego Noja"}, {"name": "Francesco Raso Stoia"}], "author_count": 2}, {"id": "2607.04521", "category": "math-ph", "title": "Hyperbolic Completion of Newton's Off-Center Orbit Problem: $SO(2,1)$ Symmetry, Inversion Duality, and Magnetic Classification", "abstract": "We resolve the hyperbolic off-center-orbit problem for the singular potential \\[ V(r)=-\\frac{\\alpha}{(R^2-r^2)^2},\\qquad \\alpha>0. \\] At zero energy, the Jacobi metric has constant negative curvature on both components separated by $r=R$. The interior Jacobi metric is a constant multiple of the Poincaré disk metric, while circular inversion maps the exterior isometrically to the punctured disk. We classify all zero-energy trajectories: nonradial orbits are arcs of Euclidean circles orthogonal to $r=R$, radial trajectories lie on lines through the origin, and the force center lies outside every nonradial supporting circle. An explicit Runge--Lenz-type moment map closes into $\\mathfrak{so}(2,1)$, whose Casimir is the hyperbolic geodesic Hamiltonian. The canonical cotangent lift of inversion preserves the symmetry generators and maps the zero-energy flow to itself up to positive time reparametrization. The singular circle is reached in finite Newtonian time but lies at infinite Jacobi distance. Quantum mechanically, we distinguish the Stäckel coupling transform from a genuine unitary equivalence, whose Euclidean representative is a divergence-form operator rather than the naive flat Schrödinger operator. The bottom of the hyperbolic continuum maps to the Hardy/oscillation threshold of the inverse-square boundary model. Finally, the symmetry-preserving radial magnetic field becomes a constant intrinsic field on the hyperbolic plane. Its shifted Casimir classifies the trajectories as closed magnetic circles, horocycles, or open hypercycles, with zero-field geodesics as the limiting case and a transition at $Q^2=8m\\alpha R^2$. Numerical integrations confirm the orbit equations and conserved quantities.", "url": "https://arxiv.org/abs/2607.04521", "type": "理论", "summary": "1. 本文解析了奇异势V(r)=-α/(R^2-r^2)^2在零能量下的双曲偏心轨道问题，完整分类了所有轨迹并揭示了SO(2,1)对称性。\n2. 核心在于将内部Jacobi度规等同于庞加莱圆盘度规，并通过圆形反演建立外部区域的等度规对应，同时构造了闭合于so(2,1)代数的Runge-Lenz型矩映射。\n3. 该工作为理解双曲几何中的经典轨道分类、对称性保持磁场的轨道形态转变以及量子连续谱阈值映射提供了严格框架。", "summary_source": "deepseek", "authors": [{"name": "Dipesh Bhandari"}], "featured_authors": [{"name": "Dipesh Bhandari"}], "author_count": 1}, {"id": "2607.04971", "category": "math-ph", "title": "Long-range interactions and Anderson localisation for one-dimensional high-contrast resonator chain", "abstract": "Spectral and transport properties of high-contrast resonator systems can be described in the subwavelength regime in terms of the so-called capacitance operator. In this paper, we consider an infinitely periodic chain of high-contrast resonators in three dimensions. The first result is a precise estimate of the off-diagonal decay rate of the capacitance operator $C$. Importantly, we demonstrate that the decay rate is long-range and critical: as $|n-m|\\to\\infty$, \\begin{equation*} C(n,m)\\sim \\frac{1}{|n-m|\\log^2|n-m|}, \\end{equation*} which is $\\ell^1$ summable but slower than quadratic. This borderline decay of the off-diagonal entries makes the present proof of Anderson localisation with arbitrary disorder, which is observed numerically in this paper, out of reach; we hope that this physical example of classical wave systems with critical long-range interactions provides new insight in the field of Anderson localisation. As the second main result, based on the off-diagonal decay estimate, we prove a strong convergence of the finite capacitance operator, which corresponds to a truncated chain, to the capacitance operator as the size of the truncated chain grows to infinity. Using this strong convergence, we improve the results of [Ammari et al., SIAM J. Math. Anal., 2023 and Bull. London Math Soc., 2025] by presenting a rigorous estimate of the convergence rate of the spectrum.", "url": "https://arxiv.org/abs/2607.04971", "type": "理论", "summary": "1. 该工作研究三维无限周期高对比度谐振子链的亚波长谱与输运性质，精确刻画了电容算子的远距离非对角衰减率。\n2. 其核心在于揭示衰减率为临界长程：随距离按|n-m|^{-1}log^{-2}|n-m|衰减，该ℓ^1可和但慢于二次的衰减使任意无序下安德森局域化的严格证明目前不可及。\n3. 这为经典波系统中临界长程相互作用的局域化现象提供了新视角，并基于截断链电容算子的强收敛显著改进了谱收敛速率的已有估计。", "summary_source": "deepseek", "authors": [{"name": "Habib Ammari"}, {"name": "Silvo Barandun"}, {"name": "Jiayu Qiu"}, {"name": "Alexander Uhlmann"}], "featured_authors": [{"name": "Habib Ammari"}, {"name": "Silvo Barandun"}, {"name": "Jiayu Qiu"}, {"name": "Alexander Uhlmann"}], "author_count": 4}, {"id": "2607.05254", "category": "math-ph", "title": "Collision geometry of relativistic spinning particles", "abstract": "We investigate elastic binary collisions of relativistic spinning particles in special relativity. The spin of each particle is represented by an antisymmetric second order tensor. Assuming the conservation of total four momentum and total spin tensor, together with the mass shell and spin constraints, we formulate the collision problem in a fully Lorentz covariant setting. We show that the relativistic collision problem admits a simple geometric formulation, reducing the original system of conservation laws to the solution of a quadratic equation on a circle. This reduction yields a complete classification of the postcollisional states together with explicit reconstruction formulas for all postcollisional variables from the conserved quantities. In particular, there are generically only finitely many postcollisional states, with the maximal number equal to eight.", "url": "https://arxiv.org/abs/2607.05254", "type": "理论", "summary": "1. 该工作系统研究了狭义相对论中自旋粒子的弹性二体碰撞问题，将自旋用反对称二阶张量描述。\n2. 通过总四动量与总自旋张量守恒及质壳约束，将控制方程简化为圆上的二次方程，实现末态完全分类与显式重构。\n3. 揭示了相对论自旋碰撞具有最多八个离散末态的几何本质，为高能粒子散射与自旋动力学提供了协变分析工具。", "summary_source": "deepseek", "authors": [{"name": "Simone Calogero"}], "featured_authors": [{"name": "Simone Calogero"}], "author_count": 1}, {"id": "2607.05286", "category": "math-ph", "title": "Lower bound on the energy-momentum relation of the polaron", "abstract": "For a class of polaron-type models, we establish a lower bound on the energy-momentum relation in terms of the vacuum overlap and the spectral gap of the total momentum zero Hamiltonian. We show convergence of the rescaled mean square displacement of the associated path measure to the inverse of the effective mass. We derive a probabilistic criterion for the absence of ground states at large total momentum.", "url": "https://arxiv.org/abs/2607.05286", "type": "理论", "summary": "1. 该工作针对一类极化子模型，建立了能量-动量关系在真空重叠与总动量零哈密顿量谱隙下的下界。\n2. 技术关键在于证明了关联路径测度的重标均方位移收敛于有效质量的倒数，并给出了大总动量下基态缺失的概率判据。\n3. 这为理解极化子在大动量区的行为及有效质量的定义提供了严格基础，并可推广至其他耦合量子系统。", "summary_source": "deepseek", "authors": [{"name": "Steffen Polzer"}], "featured_authors": [{"name": "Steffen Polzer"}], "author_count": 1}, {"id": "2607.02616", "category": "quant-ph", "title": "MLIR for Quantum Beyond Gate Cancellation: Quantum Circuit Mapping Reimagined", "abstract": "The Multi-Level Intermediate Representation (MLIR) framework has become a cornerstone for building extensible, domain-specific compilers, with the quantum computing community already leveraging it to model quantum programs and implement basic optimizations. However, computationally intensive tasks in the quantum compilation pipeline, such as quantum circuit mapping, remain underexplored within the MLIR ecosystem. This paper proposes an MLIR-native blueprint for these non-local, quantum-specific optimization routines by reimplementing a well-established, state-of-the-art mapping A* search algorithm for qubit routing and SWAP insertion. Our evaluation demonstrates that this approach not only integrates seamlessly into an MLIR-based quantum compiler collection but also surpasses previous non-MLIR solutions in both solution quality and runtime. The implementation is open-source and publicly available at this https URL .", "url": "https://arxiv.org/abs/2607.02616", "type": "理论+数值", "summary": "1. 该工作基于MLIR框架提出了一个原生量子线路映射方案，重新实现了用于量子位路由与SWAP插入的A*搜索算法。\n2. 其卖点在于将计算密集的映射任务无缝集成至MLIR编译器生态，在解质量和运行时上均超越现有非MLIR方案。\n3. 这为量子编译器在MLIR内高效实现可扩展、领域特定的优化例程提供了可复现的蓝图。", "summary_source": "deepseek", "authors": [{"name": "Matthias Reumann"}, {"name": "Yannick Stade"}, {"name": "Robert Wille"}, {"name": "Lukas Burgholzer"}], "featured_authors": [{"name": "Matthias Reumann"}, {"name": "Yannick Stade"}, {"name": "Robert Wille"}, {"name": "Lukas Burgholzer"}], "author_count": 4}, {"id": "2607.02622", "category": "quant-ph", "title": "COMET: Combinatorial Optimization for Multiplex Editing Targets Via Constraint-Preserving QAOA", "abstract": "Multiplex CRISPR-Cas9 gene editing requires selecting one guide RNA per target gene subject to cross-gene interactions: a constrained combinatorial problem that can be formulated as a Quadratic Unconstrained Binary Optimization (QUBO) and solved via the Quantum Approximate Optimization Algorithm (QAOA). The one-hot per-gene constraint is conventionally enforced by adding quadratic penalty terms to the cost Hamiltonian, but penalty coefficient selection is heuristic and penalties amplify hardware noise. An alternative is to enforce the constraint structurally via the XY-mixer, which preserves feasibility by construction. We present COMET, a systematic comparison of penalty-based and XY-mixer QAOA on a three-gene, twelve-qubit multiplex editing instance targeting the immune-checkpoint genes PDCD1, LAG3, and HAVCR2. In simulation, the XY-mixer exceeds 95% probability of the optimum by QAOA depth p=3, while three penalty variants spanning an order of magnitude in penalty coefficient remain below 6% at every depth. On IBM's ibm_kingston (Heron r2) processor, the XY-mixer's simulator-hardware energy gap stays within |0.8| across all depths, while the worst-tuned penalty variant's gap reaches +53.9. We provide an honest account of where the structural guarantee partially breaks under gate-level noise. The twelve-qubit instance is classically trivial; our contribution is a methodological comparison of constraint-enforcement strategies in a biologically motivated domain, with real-hardware validation.", "url": "https://arxiv.org/abs/2607.02622", "type": "理论+数值", "summary": "1. 该工作比较了基于惩罚项与XY-mixer两种QAOA约束策略在多重CRISPR编辑靶点选择问题上的表现。\n2. 技术卖点在于XY-mixer通过结构保证约束可行性，在12量子比特三基因实例上模拟深度p=3时获得超过95%最优概率，显著优于惩罚项变体。\n3. 该比较虽基于经典可解实例，但为量子在生物信息学中的约束优化应用提供了硬件验证与策略启发。", "summary_source": "deepseek", "authors": [{"name": "Priyansh Singhal"}, {"name": "Sumit Maheshwari"}, {"name": "Piyush Joshi"}], "featured_authors": [{"name": "Priyansh Singhal"}, {"name": "Sumit Maheshwari"}, {"name": "Piyush Joshi"}], "author_count": 3}, {"id": "2607.02626", "category": "quant-ph", "title": "Krylov-Lie Algebras for Variational Quantum Algorithms: Geometric, Depth-Aware Insights into Expressivity and Trainability", "abstract": "Variational quantum algorithms (VQAs) are a leading approach to near-term quantum computation, but their utility is limited by barren plateaus and other pathologies in their loss landscapes. Existing landscape theories based on dynamical Lie algebras, Jordan-algebraic Wishart systems, approximate t-designs, and Haar-random circuits are foundational, but they often neglect the finite-depth geometry of realistic ansätze and are therefore poorly suited to the shallow-depth regime, where VQAs are poor approximators of 2-designs and trainability is most feasible. This thesis introduces Krylov algebras, algebraic structures induced by the Krylov span of a finite generator set acting on one or more seed vectors, as a framework for VQA landscape theory. We show that VQA reachable manifolds can be approximated in a numerically robust, geometrically faithful way by Krylov-Lie algebras and groups, and that these structures induce canonical invariant measures for computing expectation values and variances under general sampling measures. In particular, we derive weighted non-Haar variance formulas that recover the usual Lie-algebraic Haar formulas as a special case while isolating non-Haar effects into explicit correction terms. We also show that the common heuristic that sufficiently deep circuit ensembles must converge to Haar fails in general without additional hypotheses, identify concrete obstructions to naive Haar convergence, and recover convergence under natural necessary and sufficient ergodic conditions. Lastly, our formulas further imply that non-Haar contributions may mitigate barren plateaus by reweighting the visible sectors of the loss landscape, suggesting that VQAs may be more trainable than recent literature has posited.", "url": "https://arxiv.org/abs/2607.02626", "type": "理论+数值", "summary": "1. 该工作将Krylov-Lie代数引入变分量子算法的景观理论，以有限深几何精确刻画可达流形与可训练性。\n2. 其核心在于从生成元集与种子向量的Krylov张成导出加权非Haar方差公式，明确分离非Haar修正项并揭示深度依赖的表达性边界。\n3. 这为理解浅层电路中非Haar分量可能抑制贫瘠高原提供了代数依据，推动设计更可训练的变分量子算法。", "summary_source": "deepseek", "authors": [{"name": "Anžej Margeta-Cacace"}], "featured_authors": [{"name": "Anžej Margeta-Cacace"}], "author_count": 1}, {"id": "2607.02696", "category": "quant-ph", "title": "Parametrized-circuit-free quantum regression with variance regularization", "abstract": "Quantum regression tasks for predicting properties of quantum states are commonly addressed using variational quantum algorithms. While variational quantum circuits are highly expressive and allow to achieve reasonable accuracy, training these circuits may demand a considerable amount of time and resources. In this work, we propose an approach of constructing problem-specific quantum regression models with encoding relevant symmetries and regularizing the variance. The proposed method is based on finding the coefficients of the linear combination of suitably chosen observables. Although it requires the knowledge of the symmetries of the problem in question, the method does not involve parameterized quantum circuits, and the training is done efficiently once the observables are measured. We demonstrate this method on two examples: Prediction of the transverse field strength in the Ising model, and quantification of entanglement in bipartite qubit systems. Our approach is accurate and less resource-intensive than conventional variational methods.", "url": "https://arxiv.org/abs/2607.02696", "type": "理论+数值", "summary": "1. 该工作提出一种无参数化电路的量子回归方法，通过编码问题对称性并正则化方差来构建模型。\n2. 其核心在于直接从适宜光可观测量线性组合中解析求解回归系数，避免了变分量子电路迭代训练的资源开销。\n3. 这为已知对称性系统的量子回归任务提供了一种准确且资源高效的替代方案，尤其适用于快速预测与纠缠度量。", "summary_source": "deepseek", "authors": [{"name": "Yerassyl Balkybek"}, {"name": "Andrey Kardashin"}, {"name": "Vladimir V. Palyulin"}, {"name": "Konstantin Antipin"}], "featured_authors": [{"name": "Yerassyl Balkybek"}, {"name": "Andrey Kardashin"}, {"name": "Vladimir V. Palyulin"}, {"name": "Konstantin Antipin"}], "author_count": 4}, {"id": "2607.02736", "category": "quant-ph", "title": "Encoding matroids into quantum states", "abstract": "Efficient representations of multipartite quantum states play a fundamental role in quantum information theory, providing both conceptual insight and practical tools for characterizing entanglement. Motivated by the axiomatic framework for graph states [Phys. Rev. A 85, 062313 (2012)] and its subsequent extension to hypergraph states [Phys. Rev. A 87, 022311 (2013)], we introduce an axiomatic construction of \\emph{matroid states}, a new family of multipartite quantum states associated with matroids. Our constructions are based on a set of axioms analogous to those that define graph and hypergraph states, yielding a consistent quantum representation of arbitrary matroids. Two ways of constructing matroid states are proposed: the first is defined in terms of circuits, and the second in terms of independent sets. In both approaches, we establish the existence of universal global operators that satisfy desirable properties such as locality, symmetry, commutativity, and are associated with the combinatorial structure of matroids. Furthermore, we establish a hierarchy connecting graph, matroid, and hypergraph states within a unified framework. Additionally, we show how to obtain an arbitrary graph state by applying suitable families of matroid states, whose corresponding operators are the generators of the stabilizer subgroup of the graph state. These results identify matroid theory as a natural combinatorial language for the efficient description of multipartite quantum states and open new perspectives for the investigation of quantum entanglement and related combinatorial structures.", "url": "https://arxiv.org/abs/2607.02736", "type": "理论", "summary": "1. 该工作基于图态与超图态的公理化框架，引入拟阵态作为多体量子态的新家族，实现将任意拟阵编码为量子态。\n2. 其核心卖点在于通过电路和独立集两种方式构造拟阵态，并证明存在满足局域性、对称性与交换性等性质的通用全局算子，建立图态、拟阵态和超图态间的层次关联。\n3. 这为利用拟阵理论高效描述多体量子态提供了自然组合语言，并启发量子纠缠与组合结构关联的深入研究。", "summary_source": "deepseek", "authors": [{"name": "Nathan Ferreira"}, {"name": "Alison A. Silva"}, {"name": "Giuliano G. La Guardia"}, {"name": "Fabiano M. Andrade"}], "featured_authors": [{"name": "Nathan Ferreira"}, {"name": "Alison A. Silva"}, {"name": "Giuliano G. La Guardia"}, {"name": "Fabiano M. Andrade"}], "author_count": 4}, {"id": "2607.02810", "category": "quant-ph", "title": "Locally Passive, Globally Charged Quantum Batteries: Coherence-Controlled Work and the Robustness of the Stored Charge", "abstract": "A solvable charger--battery model is introduced in which quantum coherence controls both where a quantum battery's charge is stored and how robustly it survives noise. Charg
