<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>arXiv 2026-07-07 · Daily ArXiv Selection</title>
  <style>
    :root {
      --bg: #f6f1e8;
      --panel: rgba(255, 252, 246, 0.92);
      --text: #2d241d;
      --muted: #6d5d50;
      --line: rgba(69, 49, 32, 0.14);
      --accent: #8f3d2e;
      --accent-2: #1d5f6b;
      --theory: #7c3a2a;
      --numeric: #255b6a;
      --both: #5d4a99;
      --experimental: #2f6b39;
      --shadow: 0 18px 40px rgba(54, 32, 16, 0.12);
      --radius: 22px;
      --ui-font: "Aptos", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --title-font: "Palatino Linotype", "Noto Serif SC", Georgia, serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--ui-font);
      color: var(--text);
      background: radial-gradient(circle at top left, rgba(255,255,255,0.78), transparent 32%), radial-gradient(circle at 88% 12%, rgba(29,95,107,0.14), transparent 20%), linear-gradient(180deg, #fbf7f0 0%, var(--bg) 42%, #f2e8dc 100%);
      min-height: 100vh;
    }
    .shell { width: min(1220px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 64px; }
    .hero {
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(255,255,255,0.84), rgba(255,248,238,0.72)), linear-gradient(135deg, rgba(143,61,46,0.08), rgba(29,95,107,0.08));
      box-shadow: var(--shadow);
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.82); border: 1px solid var(--line); color: var(--muted); font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase;
    }
    h1 { margin: 18px 0 10px; font-family: var(--title-font); font-size: clamp(32px, 5vw, 54px); line-height: 1.04; letter-spacing: -0.03em; }
    .hero p { max-width: 880px; color: var(--muted); font-size: 16px; line-height: 1.7; margin: 0; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-top: 26px; }
    .stat { padding: 16px 18px; background: rgba(255,255,255,0.76); border: 1px solid var(--line); border-radius: 18px; }
    .stat .label { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
    .stat .value { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
    .controls { position: sticky; top: 12px; z-index: 3; margin-top: 22px; padding: 18px; border: 1px solid var(--line); border-radius: 24px; background: rgba(250,244,236,0.9); backdrop-filter: blur(16px); box-shadow: 0 10px 24px rgba(54,32,16,0.08); }
    .control-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 16px; }
    .field { display: flex; flex-direction: column; gap: 10px; }
    .field label { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
    .search { width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line); background: rgba(255,255,255,0.92); font: inherit; color: var(--text); }
    .chip-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .chip { border: 1px solid var(--line); background: rgba(255,255,255,0.82); color: var(--text); padding: 10px 14px; border-radius: 999px; font: inherit; cursor: pointer; }
    .chip.active { border-color: rgba(143,61,46,0.35); background: rgba(143,61,46,0.12); color: #5b2419; }
    .chip[data-type="数值"].active { border-color: rgba(37,91,106,0.35); background: rgba(37,91,106,0.12); color: #173f49; }
    .chip[data-type="理论+数值"].active { border-color: rgba(93,74,153,0.35); background: rgba(93,74,153,0.12); color: #46337d; }
    .chip[data-type="实验"].active { border-color: rgba(47,107,57,0.35); background: rgba(47,107,57,0.12); color: #214c29; }
    .meta-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 14px; color: var(--muted); font-size: 14px; }
    .paper-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 18px; margin-top: 22px; }
    .paper { display: flex; flex-direction: column; gap: 14px; padding: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 10px 24px rgba(54,32,16,0.06); }
    .paper-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .tag { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid transparent; }
    .tag.category { background: rgba(45,36,29,0.08); color: var(--text); }
    .tag.type-theory { background: rgba(124,58,42,0.1); color: var(--theory); border-color: rgba(124,58,42,0.16); }
    .tag.type-numeric { background: rgba(37,91,106,0.1); color: var(--numeric); border-color: rgba(37,91,106,0.16); }
    .tag.type-both { background: rgba(93,74,153,0.1); color: var(--both); border-color: rgba(93,74,153,0.16); }
    .tag.type-experimental { background: rgba(47,107,57,0.1); color: var(--experimental); border-color: rgba(47,107,57,0.16); }
    .paper h2 { margin: 0; font-family: var(--title-font); font-size: 22px; line-height: 1.25; letter-spacing: -0.02em; }
    .paper h2 a { color: inherit; text-decoration: none; }
    .paper h2 a:hover { color: var(--accent); }
    .paper .id { color: var(--muted); font-size: 13px; }
    .author-block { display: grid; gap: 10px; padding: 14px 16px; border-radius: 18px; background: rgba(255,255,255,0.64); border: 1px solid var(--line); }
    .author-label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .author-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .author-item { display: grid; gap: 4px; }
    .author-item strong { font-size: 14px; }
    .author-item span { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .author-note { color: var(--muted); font-size: 12px; }
    .paper .summary { margin: 0; font-size: 15px; line-height: 1.75; white-space: pre-line; }
    details { border-top: 1px solid var(--line); padding-top: 12px; }
    details summary { cursor: pointer; color: var(--accent-2); font-weight: 700; list-style: none; }
    details summary::-webkit-details-marker { display: none; }
    details p { margin: 10px 0 0; color: var(--muted); line-height: 1.72; font-size: 14px; white-space: pre-line; }
    .paper footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 6px; color: var(--muted); font-size: 13px; }
    .paper footer a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .empty { display: none; margin-top: 24px; padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 22px; background: rgba(255,255,255,0.7); }
    @media (max-width: 980px) { .control-grid { grid-template-columns: 1fr; } .controls { position: static; } }
  </style>
</head>
<body>
  <div class="shell">
    <section class="hero">
      <div class="eyebrow">arXiv Daily Digest · 2026-07-07</div>
      <h1>Daily ArXiv Selection</h1>
      <p>
        数据来自 arXiv 当天的 <code>cond-mat</code>、<code>hep-th</code>、<code>math-ph</code>、<code>quant-ph</code> 四个分类页，口径限定为 <code>New submissions</code>。
        页面主体优先展示 DeepSeek reasoner 生成的三句话中文总结；若 API 不可用或返回异常，则回退为基于中文翻译抽取的本地三句话总结；下拉可以查看英文原版摘要。
      </p>
      <div class="stats" id="stats"></div>

    <section class="controls">
      <div class="control-grid">
        <div class="field">
          <label for="search">搜索</label>

        <div class="field">
          <label>分类</label>
          <div class="chip-row" id="category-filters"></div>
        </div>
        <div class="field">
          <label>类型</label>
          <div class="chip-row" id="type-filters"></div>

      <div class="meta-row">

        <div><a href="../index.html">返回归档</a></div>
      </div>

    <section class="paper-grid" id="paper-grid"></section>
    <section class="empty" id="empty-state">没有匹配到结果，试试清空搜索词或恢复筛选。</section>

  <script>
    const papers = [{"id": "2607.02661", "category": "cond-mat", "title": "Non-equilibrium coupling to a diffusing density breaks Ising universality", "abstract": "The Ising universality class is remarkably robust to non-equilibrium perturbations, which generically flow to zero under renormalization. We show that this robustness fails when an order parameter is coupled nonreciprocally to a conserved diffusive density. Below $d_c=4$, the renormalization group flows to a fast-diffusion fixed point at which the density acts as a long-range multiplicative noise, producing a novel universality class. The non-equilibrium nature of the fixed point is manifest in the large-scale violation of the fluctuation-dissipation relations, reflected in a splitting of the scaling exponents of the two-point correlation and response functions--a measurable hallmark of non-equilibrium critical fluctuations. A two-loop calculation establishes the stability of this fixed point but yields a small correction-to-scaling exponent $\\omega\\approx0.020$ in $d=3$, implying strong finite-size corrections. An all-orders modified Harris criterion $\\nu>2/(d+z-2)$ confirms that the BIM fixed point governs criticality in $d=3$, with Ising universality recovered only at $d=2$.", "url": "https://arxiv.org/abs/2607.02661", "type": "理论+数值", "summary": "1. 该工作通过重正化群分析，证明序参量与非互易耦合的守恒扩散密度相互作用可在d<4时破坏伊辛普适类，并导致新的非平衡普适类。\n2. 其核心在于发现快扩散不动点使密度充当长程乘性噪声，通过两圈计算和修正的Harris判据确认该不动点稳定，且波动耗散定理的破缺导致关联与响应函数标度指数分离。\n3. 这为在三维系统中观测非平衡临界涨落的可测量特征提供了明确指引，并指出有限尺寸修正（标度修正指数ω≈0.020）对数值模拟精度构成显著挑战。", "summary_source": "deepseek", "authors": [{"name": "Mattia Scandolo"}, {"name": "Johannes Pausch"}, {"name": "Michael E. Cates"}, {"name": "Luca Di Carlo"}], "featured_authors": [{"name": "Mattia Scandolo"}, {"name": "Johannes Pausch"}, {"name": "Michael E. Cates"}, {"name": "Luca Di Carlo"}], "author_count": 4}, {"id": "2607.02747", "category": "cond-mat", "title": "Anisotropic magnetoresistance of 2D Rashba films with in-plane Zeeman field and short-range disorder", "abstract": "We study the dc conductivity of a continuum two-dimensional Rashba film with an in-plane Zeeman field and delta-correlated scalar disorder. Although the field deforms the two helicity Fermi contours and rotates the spin texture, it does not produce anisotropic magnetoresistance in the leading quasiclassical conductivity. The mechanism is geometric. A density Ward identity fixes the spin-vector part of the Born self-energy to the derivative of the total particle density with respect to the field. This derivative vanishes, because the total area enclosed by the two Rashba-Zeeman sheets is independent of the in-plane field. The Born self-energy is therefore scalar and field independent, and the quasiparticle lifetime stays isotropic. The same area invariance controls transport: once the leading impurity ladder reduces the current vertex to the parabolic velocity, the diagonal intraband Kubo conductivity collapses onto the two-sheet occupied area and is field independent as well. The result settles the short-range-disorder quasiclassical problem: point-like nonmagnetic impurities do not produce AMR in this model. A nonzero AMR requires physics beyond this quasiclassical short-range-disorder mechanism.", "url": "https://arxiv.org/abs/2607.02747", "type": "理论", "summary": "1. 该工作解析计算了二维Rashba薄膜在面内塞曼场与短程标量无序下的直流电导率，发现主导半经典电导不产生各向异性磁电阻（AMR）。\n2. 其核心物理卖点是：总费米面面积在面内场下不变，通过密度Ward恒等式锁定Born自能为标量且与场无关，从而准粒子寿命保持各向同性，致使Kubo电导仅由能带占据面积决定。\n3. 这明确了短程无序半经典问题的闭合解，并指出非零AMR需依赖超出该机制的物理，如各向异性散射或关联无序。", "summary_source": "deepseek", "authors": [{"name": "Igor Gornyi"}, {"name": "Alexander Khaetskii"}], "featured_authors": [{"name": "Igor Gornyi"}, {"name": "Alexander Khaetskii"}], "author_count": 2}, {"id": "2607.02762", "category": "cond-mat", "title": "Shear and crystallization in deformable granular packings: why don't auxetics order?", "abstract": "Shear of three-dimensional, highly compressed granular packings is simulated using a bonded particle approach that explicitly resolves elastic deformation. Varying Poisson's ratio $\\nu$ produces significant changes in rheology, packing structure, and grain morphology. During flow, conventional systems ($\\nu > 0$) readily crystallize while auxetics ($\\nu < 0$) resist ordering. This duality reflects the fact that conventional grains develop polyhedral-like facets but conserve volume while auxetics behave oppositely, demonstrating an unexpected interaction between elasticity, geometry, and crystallization.", "url": "https://arxiv.org/abs/2607.02762", "type": "理论", "summary": "1. 该工作利用粘结颗粒方法模拟三维可变形颗粒堆积的剪切过程，系统研究了泊松比变化对结晶行为的影响。\n2. 其核心发现是常规材料（ν>0）因颗粒形成多面体刻面且体积守恒而易于结晶，而拉胀材料（ν<0）因相反行为抵抗有序化。\n3. 这揭示了弹性、几何与结晶之间的非预期耦合，为设计抗结晶颗粒材料及理解变形诱导相变提供了新视角。", "summary_source": "deepseek", "authors": [{"name": "Joel T. Clemmer"}, {"name": "Nicholas W. Hackney"}, {"name": "Gary S. Grest"}], "featured_authors": [{"name": "Joel T. Clemmer"}, {"name": "Nicholas W. Hackney"}, {"name": "Gary S. Grest"}], "author_count": 3}, {"id": "2607.02812", "category": "cond-mat", "title": "Theoretical investigation of power absorbed by superconductors with Rashba spin-orbit coupling in the presence external time-dependent perturbation", "abstract": "The absorbed power in superconductors driven by a time-dependent external perturbation is investigated through transitions between Bogoliubov quasiparticle states. The transition matrix element contains the superconducting coherence factor, which determines the role of the gap, excitation spectrum, and external frequency in the absorption process. The formulation is applied to a Hubbard-model superconductor including correlated hopping and Rashba spin-orbit coupling. In this model, numerical calculations are used to obtain the quasiparticle energies, density of states, chemical potential, and temperature-dependent superconducting gap. The normalized absorbed power is then evaluated for different values of temperature, interaction strength, correlated hopping parameter, and spin-orbit coupling strength. The results show that the absorption response is strongly affected by the superconducting gap and by changes in the quasiparticle spectrum. Rashba spin-orbit coupling changes the density of states and therefore modifies the absorption. These results show that hopping processes, interaction strength, and spin-orbit coupling play important roles in the ultrasonic and electromagnetic absorption of superconducting systems.", "url": "https://arxiv.org/abs/2607.02812", "type": "理论+数值", "summary": "1. 该工作基于Bogoliubov准粒子态间跃迁理论，研究了含Rashba自旋轨道耦合的Hubbard模型超导体在外界时间依赖扰动下的功率吸收。\n2. 其核心在于通过超导相干因子及自洽数值计算，揭示了Rashba自旋轨道耦合改变态密度和准粒子谱进而显著调控归一化吸收功率的内在机制。\n3. 这为理解超导体中超声与电磁吸收过程中跳跃、相互作用及自旋轨道耦合的协同作用提供了理论框架与参数依赖图景。", "summary_source": "deepseek", "authors": [{"name": "Reza Afzali"}, {"name": "Bahman Takrim"}, {"name": "Amir Hossein Asghari"}], "featured_authors": [{"name": "Reza Afzali"}, {"name": "Bahman Takrim"}, {"name": "Amir Hossein Asghari"}], "author_count": 3}, {"id": "2607.02848", "category": "cond-mat", "title": "Crystal structure and basic properties of dirhenate quantum materials", "abstract": "The anhydrous divalent 3d-metal dirhenate quantum materials, M(ReO$_4$)$_2$,were synthesized using solid-state methods for M = Mn through Zn. Previously unreported Mg(ReO4)2 is also described. Their layered crystal structures, which feature an in-plane triangular lattice of M$^{2+}$, were refined using single crystal X-ray diffraction, and their optical absorption and several other physical properties were characterized. Their magnetism and heat capacity reveal long-range magnetic order at low temperatures in many of the M(ReO$_4$)$_2$ phases. Notably, many of these ordered states are sensitive to applied magnetic fields and can be readily suppressed by relatively small fields, suggesting competing magnetic interactions in a low-dimensional framework, which appear worthy of further study.", "url": "https://arxiv.org/abs/2607.02848", "type": "理论", "summary": "1. 该工作合成了系列无水二价3d金属双铼酸盐M(ReO₄)₂（M=Mn至Zn及未报道的Mg），利用单晶X射线衍射精修其层状结构并表征光学吸收等基本性质。\n2. 其物理要点在于M²⁺形成面内三角晶格，低维框架内竞争磁相互作用导致低温长程磁有序对小磁场敏感并可被显著抑制。\n3. 这为探索低维量子磁性中的场致相变与竞争序提供了值得深入研究的候选模型材料体系。", "summary_source": "deepseek", "authors": [{"name": "Danrui Ni"}, {"name": "Xianghan Xu"}, {"name": "Stephen Zhang"}, {"name": "N.P. Ong"}, {"name": "Sanfeng Wu"}, {"name": "R. J. Cava"}], "featured_authors": [{"name": "Danrui Ni"}, {"name": "Xianghan Xu"}, {"name": "Stephen Zhang"}, {"name": "N.P. Ong"}, {"name": "Sanfeng Wu"}, {"name": "R. J. Cava"}], "author_count": 6}, {"id": "2607.02953", "category": "cond-mat", "title": "Hall Shift Current and Nonlinear Anomalous Hall Effect in Gapped Dirac Fermion Systems", "abstract": "We discuss a new mechanism for the nonlinear anomalous Hall effect in tilted two-dimensional gapped Dirac fermion systems. This mechanism originates from a side-jump displacement associated with Landau-Zener tunneling across the mass gap. In lightly doped tilted Dirac systems with a small gap, this interband mechanism can contribute to the nonlinear anomalous Hall effect in addition to the conventional intraband mechanism arising from the Berry curvature dipole. It provides a possible explanation for the nonlinear Hall effect accompanied by nonlinear longitudinal transport observed in the organic Dirac fermion system {\\alpha}-(ET)2I3 with an extremely small gap.", "url": "https://arxiv.org/abs/2607.02953", "type": "理论", "summary": "1. 该工作提出倾斜二维有隙狄拉克费米子系统中非线性反常霍尔效应的一种新机制，源于跨越能隙的朗道-齐纳隧穿伴随的侧跳位移。\n2. 其核心卖点在于揭示该带间机制作为贝里曲率偶极子带内机制的补充，在小间隙弱掺杂体系中可主导非线性反常霍尔响应。\n3. 这为理解极窄能隙有机狄拉克费米子体系α-(ET)2I3中非线性霍尔效应与纵向输运的共存现象提供了关键物理解释。", "summary_source": "deepseek", "authors": [{"name": "Toshihito Osada"}], "featured_authors": [{"name": "Toshihito Osada"}], "author_count": 1}, {"id": "2607.03022", "category": "cond-mat", "title": "When Repulsion Creates Pairing: A New Perspective on Unconventional Superconductivity", "abstract": "Despite the repulsive Coulomb law and the Pauli statistics that do not favor bound states, attraction between electrons or holes is nevertheless possible in the context of many body interaction and of valley potential landscapes, reminiscent of exotic superconducting materials. In particular, in 1965, Kohn and Luttinger published a note revealing that the dynamical screening of the repulsive Coulomb interaction leads, under certain conditions, to an effective attraction necessary for the formation of Cooper pairs. We propose such a formalism adapted to the cuprates, where the screening arises from the superexchange dynamics of virtual holes in the oxygen orbitals of the $Cu O_2$ plane. Inspired from the Bardeen-Copper-Schrieffer (BCS) theory, we can derive some predictions for the temperature-doping phase diagram (pseudo-gap, strange metal, antiferromagnetism, superconducting, and normal states) in semi-quantitative agreement with observations.", "url": "https://arxiv.org/abs/2607.03022", "type": "理论+数值", "summary": "1. 该工作提出一个基于库仑排斥动态屏蔽产生有效吸引的理论框架，专门用于描述铜氧化物超导体中的配对机制。\n2. 其核心卖点在于将超交换动力学引入屏蔽过程，从而从BCS理论半定量导出温掺相图（赝能隙、奇异金属、反铁磁等）的关键特征。\n3. 这为理解非常规超导的排斥诱导配对提供了新的微观图像，并可能推广至其他强关联电子体系。", "summary_source": "deepseek", "authors": [{"name": "Patrick Navez"}], "featured_authors": [{"name": "Patrick Navez"}], "author_count": 1}, {"id": "2607.03032", "category": "cond-mat", "title": "Entropy density functional universality: Correlation, response, and entropic Ornstein-Zernike structure", "abstract": "We give a comprehensive account of the recent entropy density functional theory for the equilibrium statistical mechanics of classical many-body systems ( arXiv:2606.28240 ). The approach is formally exact and based on a joint grand potential minimization principle for the one-body density and the global pair distance distribution. These variational fields depend respectively on position and on scalar distance, which retains the low computational complexity of standard density functional theory. Correlations effects are contained in a unique excess entropy functional, which is universal across all systems with pairwise interparticle potentials. Functional differentiation yields entropic direct correlation functionals that generate entropic response and fluctuation correlation functions via coupled Ornstein-Zernike equations. Two alternative proofs are given for the existence and uniqueness of the underlying metadensity functional map, based on generalizations of either Levy's constrained search method or Mermin-Evans proof by contradiction. Simple excess entropy approximations yield the standard mean-field and second-virial excess free energy density functionals. We describe exact entropic functional line integrals, make connections to the recent one-body fluctuation profiles, and generalize the entropy approach beyond pairwise interparticle potentials.", "url": "https://arxiv.org/abs/2607.03032", "type": "理论+数值", "summary": "1. 该工作基于严格的联合巨势最小化原理，系统建立了经典多体系统平衡统计力学的熵密度泛函理论，自洽确定单体密度与全局对距离分布，兼具形式精确性与标准密度泛函的低计算复杂度。\n2. 其核心卖点在于超额熵泛函及其泛函导数的系统间普适性：对任意成对相互作用势，泛函微分生成熵直接相关泛函，并通过耦合Ornstein-Zernike方程统一生成熵响应函数与涨落关联函数。\n3. 该理论提供了Levy约束搜索与Mermin-Evans反证法等价的元密度映射存在唯一性证明，能与单体涨落分布理论衔接并构建精确泛函线积分，简单近似可严格恢复平均场与第二维里结果，且可推广至非成对相互作用势系统，为精确自由能泛函构建奠基。", "summary_source": "deepseek", "authors": [{"name": "Matthias Schmidt"}], "featured_authors": [{"name": "Matthias Schmidt"}], "author_count": 1}, {"id": "2607.03102", "category": "cond-mat", "title": "Winding charge density wave: intertwining of structural chirality and phase topology of electronic order", "abstract": "We propose a class of chiral charge density waves (CDWs), dubbed winding CDWs, that exhibit macroscopic chirality despite a single ordering wavevector. In screw-symmetric chiral crystals, chiral phonons drive a Peierls instability that selects a definite crystal angular momentum channel, thereby endowing the CDW with an integer azimuthal phase winding dictated by the selection rule governing electron-phonon coupling. We further extend this framework to achiral crystals with discrete rotational symmetry and demonstrate that spontaneous symmetry breaking stabilizes a winding CDW with either handedness, realizing an achiral-to-chiral phase transition. Our results reveal a fundamental link between the geometry of chiral structures and the phase topology of electronic orders.", "url": "https://arxiv.org/abs/2607.03102", "type": "理论", "summary": "1. 本工作提出了一类称为缠绕电荷密度波的手性电子序，其以单一阶波矢实现宏观手性。\n2. 技术核心在于手性声子驱动的Peierls不稳定性选择特定晶体角动量通道，从而赋予序参量整数方位角相位缠绕，并在非手性晶体中通过自发对称性破缺实现任意手性。\n3. 该发现揭示了手性几何结构与电子序相位拓扑之间的基本联系，为探索手性转变与拓扑物态提供了新途径。", "summary_source": "deepseek", "authors": [{"name": "Shun Asano"}, {"name": "Youichi Yanase"}], "featured_authors": [{"name": "Shun Asano"}, {"name": "Youichi Yanase"}], "author_count": 2}, {"id": "2607.03172", "category": "cond-mat", "title": "Martensitic Transformation in Crystal-Amorphous Superlattices of NiTi Shape Memory Alloy", "abstract": "Shape memory alloys (SMAs) exhibit unique thermo-mechanical properties arising from reversible martensitic transformation. Tailoring these properties through coherent second phases is effective but is often limited by the difficulty of identifying thermodynamically compatible phases. Crystal-amorphous superlattices (CAS), in which the second phase is derived from the base material itself, provide an attractive alternative. However, the influence of partial amorphization on martensitic transformation and thermo-mechanical behavior remains largely unexplored. Here, large-scale molecular dynamics simulations are used to investigate temperature- and stress-induced martensitic transformations in CAS-NiTi with different crystalline phase fractions. Partial amorphization fundamentally modifies the transformation pathway, introducing an initial continuous (second-order-like) transformation before the conventional first-order martensitic transformation. The amorphous phase also enhances transformation reversibility, reducing the thermal hysteresis from 275 K in fully crystalline NiTi to 95-110 K in CAS-NiTi. Simultaneously, the elastic modulus and the critical stress for stress-induced martensitic transformation increase by approximately 60-90 percent, depending on the crystalline fraction. These improvements originate from heterogeneous nucleation at crystal-amorphous interfaces, retained austenite that promotes the reverse transformation, and mechanical constraint imposed by the amorphous phase. These findings establish crystal-amorphous superlattices as a promising microstructural design strategy for tailoring the thermo-mechanical performance of shape memory alloys.", "url": "https://arxiv.org/abs/2607.03172", "type": "理论+数值", "summary": "1. 该工作利用大规模分子动力学模拟，研究了NiTi形状记忆合金中晶态-非晶超晶格在不同晶态分数下的温度及应力诱导马氏体相变。\n2. 部分非晶化引入先连续（类二级）后一阶的相变路径，将热滞从275K降至95-110K，并提升弹性模量和临界应力约60-90%，源于界面异质形核与奥氏体及非晶相的约束。\n3. 这为通过晶态-非晶超晶格微结构设计来系统调控形状记忆合金热力学性能提供了新思路。", "summary_source": "deepseek", "authors": [{"name": "Bhavna Singh"}, {"name": "Shivam Tripathi"}], "featured_authors": [{"name": "Bhavna Singh"}, {"name": "Shivam Tripathi"}], "author_count": 2}, {"id": "2607.03208", "category": "cond-mat", "title": "Data-driven multi-objective optimization for alloy recycling using factorization machines and quantum annealing", "abstract": "Quantum annealing has the potential to provide practical quantum advantage for complex optimization tasks. Here, we present a systematic assessment of an integrated factorization-machine and quantum-annealing workflow (FM+QA) for a technologically relevant application: multi-objective Pareto optimization in metal up-cycling through alloy design. To address the non-convex nature of the Pareto front, we employ the recently proposed data-driven Tchebycheff scalarization (DDTS) scheme. Our results show that FM+QA extends the applicability of QUBO-based optimization to data-driven materials discovery problems with multiple competing objectives. In particular, we analyze the scaling behavior of the approach and compare quantum annealing with classical simulated annealing using both regular binary encoding and one-hot encoding. Finally, we provide a critical perspective on the problem sizes and encoding strategies for which quantum-annealing-based optimization may become practically beneficial in the near future.", "url": "https://arxiv.org/abs/2607.03208", "type": "理论+数值", "summary": "1. 该工作系统评估了集成因子分解机与量子退火（FM+QA）的工作流，用于合金升级回收中多目标Pareto优化这一实用场景。\n2. 其核心在于采用数据驱动Tchebycheff标量化（DDTS）应对非凸Pareto前沿，并通过与经典模拟退火对比，分析了QUBO优化在数据驱动材料发现中的扩展性。\n3. 这为近期基于量子退火的优化在问题规模与编码策略上可能带来的实际优势提供了关键参考。", "summary_source": "deepseek", "authors": [{"name": "Thomas Plehn"}, {"name": "Katrin Bugelnig"}, {"name": "Silvana Tumminello"}, {"name": "Daniel Barragan-Yani"}, {"name": "David Melching"}], "featured_authors": [{"name": "Thomas Plehn"}, {"name": "Katrin Bugelnig"}, {"name": "Silvana Tumminello"}, {"name": "Daniel Barragan-Yani"}, {"name": "David Melching"}], "author_count": 5}, {"id": "2607.03300", "category": "cond-mat", "title": "Variance of the $SIS$ Epidemic on Networks: A Diffusion Approximation", "abstract": "Functional laws of large numbers (FLLNs) describe the mean-field trajectory of epidemics on networks, but say nothing about the fluctuations around it. These fluctuations are governed by moments of the degree distribution not relevant at the level of the mean. A rigorous functional central limit theorem (FCLT) exists for the susceptible--infected ($SI$) process on configuration-model graphs, but no analogue exists for $SIS$, where recovery reintroduces vertices into the susceptible pool with partially known neighborhoods, breaking the clean neighborhood distribution the $SI$ derivation relies on. We develop a tractable variance approximation for Markovian $SIS$ on configuration-model graphs, combining Gleeson's approximate master equation (AME) framework with a van Kampen system-size expansion in the spirit of the $SI$ FCLT. We derive a closed drift and diffusion matrix for a reduced susceptible/$SI$-edge/$SS$-edge count vector and obtain the time-dependent covariance via the associated Langevin/Lyapunov equation. Validation against Gillespie simulation across Poisson, regular, and power-law networks shows close agreement, with deviations near the epidemic threshold and in strongly heterogeneous networks.", "url": "https://arxiv.org/abs/2607.03300", "type": "理论+数值", "summary": "1. 该工作针对配置模型网络上SIS流行病的随机波动，提出了一种结合近似主方程与系统大小展开的方差近似方法。\n2. 其技术核心在于推导出约化计数向量的封闭漂移与扩散矩阵，并利用Langevin/Lyapunov方程获得时变协方差。\n3. 该近似在阈值附近及强异质网络中的偏差为后续发展更普适的波动理论提供了明确改进方向。", "summary_source": "deepseek", "authors": [{"name": "Lucija Nora Farkaš"}, {"name": "Sebastian Morel Balbi"}, {"name": "Hrvoje Štefančić"}, {"name": "István Zoltán Kiss"}, {"name": "Vinko Zlatić"}], "featured_authors": [{"name": "Lucija Nora Farkaš"}, {"name": "Sebastian Morel Balbi"}, {"name": "Hrvoje Štefančić"}, {"name": "István Zoltán Kiss"}, {"name": "Vinko Zlatić"}], "author_count": 5}, {"id": "2607.03357", "category": "cond-mat", "title": "Stability and equilibria of a compressible elastic membrane in Stokes flow", "abstract": "We formulate a continuum model for a compressible lipid-bilayer membrane immersed in Stokes flow, replacing exact local area inextensibility by conservation of an areal phospholipid density. The membrane free energy combines Helfrich bending, spontaneous curvature, and a finite area-compression penalty, so that membrane tension becomes a constitutive response to lipid-density variation rather than a Lagrange multiplier enforcing local area conservation. The resulting interfacial stress includes normal elastic forces and tangential Marangoni stresses generated by lipid redistribution; these stresses arise from membrane compressibility and can produce an effective negative tension when the local lipid density exceeds its preferred value. We further derive the linear stability of circular membranes in two dimensions and spherical membranes in three dimensions under full Stokes hydrodynamic coupling. In both cases, bending stabilizes the base shape, while excess lipid density destabilizes it by favoring increased membrane area. The first instability occurs in the lowest nontrivial shape mode, m = 2 in two dimensions and j = 2 in three dimensions. Energy expansions near onset show that the two-dimensional instability is a pitchfork bifurcation, whereas the three-dimensional instability is generically transcritical because prolate and oblate perturbations are geometrically distinct. These results provide a controlled compressible extension of classical vesicle mechanics and directly connect lipid-density variation, membrane tension, hydrodynamic coupling, and shape instability.", "url": "https://arxiv.org/abs/2607.03357", "type": "理论", "summary": "1. 该工作建立了可压缩弹性膜在斯托克斯流中的连续介质模型，用磷脂面密度守恒取代局部面积不可伸缩约束。\n2. 关键卖点是膜可压缩性使张力成为密度的本构响应，产生有效负张力与Marangoni应力，且二维音叉分岔与三维跨临界分岔在稳定性上本质不同。\n3. 这为囊泡力学的可压缩推广奠定基础，并直接链接脂质密度、膜张力、水动力学耦合与形状失稳。", "summary_source": "deepseek", "authors": [{"name": "Sho Kawakami"}, {"name": "Han Zhou"}, {"name": "Po-Chun Kuo"}, {"name": "Yoichiro Mori"}, {"name": "Yuan-Nan Young"}], "featured_authors": [{"name": "Sho Kawakami"}, {"name": "Han Zhou"}, {"name": "Po-Chun Kuo"}, {"name": "Yoichiro Mori"}, {"name": "Yuan-Nan Young"}], "author_count": 5}, {"id": "2607.03363", "category": "cond-mat", "title": "Pressure-Driven Structural Transitions without a Displacive Charge-Density Wave in La$_2$SmNi$_2$O$_7$", "abstract": "We investigated the structural properties of bilayer nickelate La$_2$SmNi$_2$O$_7$ as a function of pressure and temperature. At ambient conditions, we show that the material crystallizes as a monoclinic superstructure distinct from the one previously reported and close to the pseudo-orthorhombic structure of pristine La$_3$Ni$_2$O$_7$. No signatures of satellite reflections associated with charge density wave (CDW) ordering are detected at low temperature. Upon compression, a sequence of pressure-induced structural transitions from monoclinic to orthorhombic 15 GPa and then tetragonal 21 GPa symmetry is observed. Within the superconducting dome, the quality of the X-ray diffraction data enables structural refinements enabling theoretical models to understand the emergence of superconductivity.", "url": "https://arxiv.org/abs/2607.03363", "type": "理论", "summary": "1. 该工作通过高压X射线衍射研究了双层镍酸盐La₂SmNi₂O₇在压力与温度下的结构性质，发现常压室温下材料结晶为区别于此前报道、接近原始La₃Ni₂O₇伪正交结构的单斜超结构，且低温未检测到电荷密度波序的卫星反射。\n2. 核心卖点是揭示了压力诱导的单斜→正交(15 GPa)→四方(21 GPa)结构转变序列，并在超导穹顶内借助高质量衍射数据的结构精修，为理论模型提供了不含位移型电荷密度波的实验约束。\n3. 这为在非电荷密度波框架下理解双层镍酸盐中超导的涌现机制提供了关键结构信息，并指导未来理论从头计算与实验观测其电子关联效应。", "summary_source": "deepseek", "authors": [{"name": "J. Huang"}, {"name": "Sitaram Ramakrishnan"}, {"name": "P. Rodière"}, {"name": "P. Toulemonde"}, {"name": "Z. Rahmany"}, {"name": "V. Balédent"}, {"name": "B. Vignolle"}, {"name": "Sourav Marik"}, {"name": "P. Fertey"}, {"name": "P. Foury-Leylekian"}], "featured_authors": [{"name": "J. Huang"}, {"name": "Sitaram Ramakrishnan"}, {"name": "P. Rodière"}, {"name": "Sourav Marik"}, {"name": "P. Fertey"}, {"name": "P. Foury-Leylekian"}], "author_count": 10}, {"id": "2607.03378", "category": "cond-mat", "title": "Quantum Destabilization of Skyrmions in Centrosymmetric Frustrated Magnets", "abstract": "We investigate the role of the spin quantum number $s$ on the stability of skyrmions in a $J_1-J_2-J_3$ centrosymmetric quantum Heisenberg model on a square lattice using the neural network quantum states method. Our results reveal that the skyrmion stability $Q$ is severely degraded when transitioning from the semiclassical regime to the extreme quantum limit ($s=1/2$), where it ultimately vanishes. We demonstrate that this destabilization is driven by quantum longitudinal fluctuations, with $Q$ exhibiting a power-law decay as a function of the reciprocal spin moment $1/s$. Notably, the extreme quantum limit ($s=1/2$) deviates drastically from this scaling behavior, exhibiting distinct physics compared to larger spin moments. Furthermore, we reveal the microscopic origin of this decay by establishing a quantitative correspondence between skyrmion stability, entanglement, and local spin magnitude: as the local second Rényi entropy (an indicator of entanglement) increases and the local spin magnitude is suppressed, the skyrmion stability vanishes linearly. This regime marks a quantum state where the skyrmion number $C$ remains as remanent geometric feature of the spin orientations, yet the skyrmion stability $Q$ vanishes due to the longitudinal suppression of the local spin magnitude. Our findings suggest that classically robust skyrmion phases in frustrated lattices are fundamentally restricted to high-spin materials, indicating that a spin moment must of at least $s = 3/2$ is required for the realization of stable, atomic-scale topological textures.", "url": "https://arxiv.org/abs/2607.03378", "type": "理论", "summary": "1. 该工作利用神经网络量子态方法，研究了自旋量子数s对中心对称J₁-J₂-J₃正方晶格量子海森伯模型中斯格明子稳定性的影响。\n2. 核心发现是量子纵向涨落驱动斯格明子稳定性Q随1/s呈幂律衰减，且s=1/2极端量子极限彻底偏离该标度行为，展现出迥异的物理。\n3. 这一结果为阻挫晶格中经典鲁棒斯格明子相仅限于高自旋材料提供了定量依据，暗示实现稳定原子尺度拓扑纹理至少需要s=3/2的自旋矩。", "summary_source": "deepseek", "authors": [{"name": "Amit Kumar"}, {"name": "Kalpataru Pradhan"}], "featured_authors": [{"name": "Amit Kumar"}, {"name": "Kalpataru Pradhan"}], "author_count": 2}, {"id": "2607.03401", "category": "cond-mat", "title": "Emergent $\\mathbb{Z}$-type topology in a quasi-one-dimensional extended QWZ model", "abstract": "We investigate the emergence of zero-dimensional topological end states in nanoribbons described by the Qi-Wu-Zhang (QWZ) model and its extensions with longer-range couplings. While dimensional reduction from two to one dimension is often assumed to preserve the symmetry classification of the parent system, here an additional symmetry can emerge originating from the real-space geometry of the ribbon. This symmetry acts as a chiral symmetry, combining orbital and spatial transformations, and promotes the effective one-dimensional system from symmetry class D to class BDI. We demonstrate that the existence of such a symmetry depends both on the long and end termination of the ribbon and exhibits an even-odd effect with respect to ribbon width, revealing that the commonly studied rectangular ribbons constitute a special high-symmetry case. For the conventional QWZ model, we derive analytic expressions for the topological phase boundaries of finite-width nanoribbons and characterize the resulting hybridization-gap phases through ($\\mathbb{Z}_2 $) and winding-number invariants. We further show that extended QWZ models with longer-range couplings support phases with multiple topological end states and higher winding numbers. These phases arise through distinct mechanisms, including the hybridization of multiple edge modes inherited from higher-Chern-number bulk phases. Our results demonstrate that both long and end termination can fundamentally alter the topological classification of confined Chern insulators, highlighting the interplay between crystalline geometry, emergent symmetries, and dimensional reduction.", "url": "https://arxiv.org/abs/2607.03401", "type": "理论", "summary": "1. 该工作研究了准一维扩展QWZ模型中由纳米带实空间几何诱导的额外手征对称性，并证明了该对称性将有效一维系统从D类提升至BDI类，从而产生零维拓扑端态。\n2. 其核心发现在于晶格几何和端部终止共同决定手征对称性的存在，导致拓扑相边界和端态数目出现奇偶宽度效应，并通过解析和拓扑数刻画了杂化能隙相。\n3. 这揭示了受限Chern绝缘体中几何与对称性的内在关联，为通过调控纳米带宽度和终止方式设计多拓扑端态系统提供了明确路径。", "summary_source": "deepseek", "authors": [{"name": "Zebedeus F. Osseweijer"}, {"name": "Lumen Eek"}, {"name": "Cristiane Morais Smith"}], "featured_authors": [{"name": "Zebedeus F. Osseweijer"}, {"name": "Lumen Eek"}, {"name": "Cristiane Morais Smith"}], "author_count": 3}, {"id": "2607.03433", "category": "cond-mat", "title": "Dyna-Mat: End-to-end benchmarking of foundation machine learning interatomic potentials in finite-temperature ensembles", "abstract": "Foundation machine learning interatomic potentials (MLIPs) are increasingly being used as drop-in replacements for first-principles calculations, enabling simulations of materials at length and time scales that were previously inaccessible. However, due to lack of ground truth data, their accuracy on structural and dynamical observables in finite thermodynamic ensembles is yet to be established. Here, we introduce Dyna-Mat-v1.0, a benchmark dataset of condensed-phase first-principles molecular dynamics trajectories designed to test foundation MLIPs at realistic finite-temperature conditions. Using this dataset, we evaluate 15 foundation MLIPs across four model tiers by comparing both single-point energy and force errors on first-principles configurations and observables generated from MLIP-driven trajectories. We find that \"on average\" models with lower single-point force errors also yield lower errors for structural and dynamical observables. However, there are individual systems for which low force errors lead to qualitative failures in the predicted structure. Pressure remains poorly described across most models, pointing to limitations in the density functional theory stress labels available in current large-scale training datasets. Finally, we construct an accuracy-cost Pareto frontier to identify the best trade-offs for molecular dynamics with foundation MLIPs, finding that the latest generation of cross-trained models is close to Pareto-optimal according to the accuracy metrics considered here. Overall, Dyna-Mat-v1.0 shows that end-to-end finite-temperature validation is essential for quantifying the predictive behaviour of foundation MLIPs, and provides a simple, scalable route for assessing them beyond static and harmonic benchmarks relevant to materials design.", "url": "https://arxiv.org/abs/2607.03433", "type": "理论+数值", "summary": "1. 该工作构建了Dyna-Mat-v1.0基准数据集，通过第一性原理分子动力学轨迹系统评估15种基础机器学习原子间势在有限温度系综中的结构动力学观测准确性。\n2. 其主要物理发现是单点力误差较低的模型平均上能更好预测系综观测量，但存在力误差低却导致结构预测定性失效的个例，且压力误差普遍显著。\n3. 这揭示了当前基础势模型在有限温度验证中的关键局限，为后续改进应力标签质量和建立端到端评估标准提供了可扩展的基准框架。", "summary_source": "deepseek", "authors": [{"name": "Mikołaj J. Gawkowski"}, {"name": "Nongnuch Artrith"}, {"name": "Silvia Bonfanti"}, {"name": "Abhijeet Sadashiv Gangan"}, {"name": "Hendrik H. Heenen"}, {"name": "Joseph Kioseoglou"}, {"name": "Ivor Lončarić"}, {"name": "Hemanadhan Myneni"}, {"name": "Janosh Riebesell"}, {"name": "Mariana Rossi"}, {"name": "Matthias Rupp"}, {"name": "Jonathan Schmidt"}, {"name": "Shubham Sharma"}, {"name": "Benjamin X. Shi"}, {"name": "Antoni Wadowski"}, {"name": "Lukas Hörmann"}, {"name": "Venkat Kapil"}], "featured_authors": [{"name": "Mikołaj J. Gawkowski"}, {"name": "Nongnuch Artrith"}, {"name": "Silvia Bonfanti"}, {"name": "Antoni Wadowski"}, {"name": "Lukas Hörmann"}, {"name": "Venkat Kapil"}], "author_count": 17}, {"id": "2607.03534", "category": "cond-mat", "title": "Fixed-point tensor network for compactified boson conformal field theory", "abstract": "Fixed-point (FP) tensor networks provide a discrete spacetime representation of conformal field theories (CFTs), offering a new route toward understanding holographic duality, generalized symmetries, and even quantum gravity. In this work, we construct FP tensors for the 2D compactified boson theory at a generic compactification radius, an archetypal irrational CFT, using boundary (open-string) data with conformal boundary conditions. We show that the resulting tensors reproduce the closed-string spectrum with high accuracy and generate stable renormalization-group (RG) flows under the tensor complex renormalization algorithm. Moreover, we identify a controllable exactly marginal deformation at the level of a single tensor, enabling flows that move continuously along the $c=1$ moduli space. This framework establishes a concrete lattice-level route toward describing a broad class of 2D irrational CFTs.", "url": "https://arxiv.org/abs/2607.03534", "type": "理论+数值", "summary": "1. 该工作利用边界共形数据，为一般紧致化半径下的二维紧致化玻色子理论构建了固定点张量网络表示。\n2. 其核心在于单个张量层面实现可控的恰好边缘形变，从而高精度再现闭弦谱并驱动连续重整化群流。\n3. 这为在格点层次系统描述二维非有理共形场论及探索全息对偶与广义对称性提供了具体途径。", "summary_source": "deepseek", "authors": [{"name": "Gong Cheng"}, {"name": "Dong-Yu Bao"}, {"name": "Zheng-Cheng Gu"}], "featured_authors": [{"name": "Gong Cheng"}, {"name": "Dong-Yu Bao"}, {"name": "Zheng-Cheng Gu"}], "author_count": 3}, {"id": "2607.03706", "category": "cond-mat", "title": "Correlated-Electron Theory of Triplet-Triplet Multiexciton States in Polypentacene", "abstract": "We present correlated-electron calculations of optical spin-singlet and triplet-triplet multiexciton states in three- and four-unit pentacene oligomers as microscopic models for polypentacene. The calculations use the Pariser-Parr-Pople Hamiltonian, multiple-reference singles and doubles configuration interaction, and a molecular exciton basis that resolves Frenkel, charge-transfer, and triplet-pair (T1T1) configurations in real space. We find that the complete set of 1(T1T1) eigenstates lies in a narrow, nearly degenerate energy window near the lowest optical exciton and that no eigenstate can be identified with a single localized triplet-pair configuration. Instead, each triplet-pair eigenstate is a quantum superposition of configurations containing all accessible intertriplet separations. This electronic structure explains the perceived absence of intramolecular triplet diffusion in pentacene oligomers, polypentacene, and polytetracene solutions, while leaving open the possibility of intermolecular singlet fission in films with appreciable interchain interactions.", "url": "https://arxiv.org/abs/2607.03706", "type": "理论+数值", "summary": "1. 该工作通过Parisier-Parr-Pople哈密顿量与多参考组态相互作用计算，解析了多并五苯低聚物中三线态-三线态多激子态的光学自旋单态与三重态对态。\n2. 其核心发现是1(T1T1)本征态为非局域量子叠加态，包含全部可能的分子间三线态间距构型，且位于最低光学激子附近的窄简并能窗内。\n3. 这解释了并五苯低聚物及多并五苯溶液中分子内三线态扩散缺失的电子结构根源，并为薄膜中分子间单线态裂变可能性提供了理论依据。", "summary_source": "deepseek", "authors": [{"name": "Rupali Jindal"}, {"name": "Alok Shukla"}, {"name": "Sumit Mazumdar"}], "featured_authors": [{"name": "Rupali Jindal"}, {"name": "Alok Shukla"}, {"name": "Sumit Mazumdar"}], "author_count": 3}, {"id": "2607.03737", "category": "cond-mat", "title": "Intermittency Signatures in the Deformation of a Passive Droplet in Active Turbulence", "abstract": "We use fully resolved nematohydrodynamic simulations to study deformation statistics of a passive nematic droplet in two-dimensional extensile active-nematic turbulence. We find that the droplet aspect ratio serves as a scalar probe of the active bath. Its increments show heavy-tailed distributions with dependence on the time lag, scale-free burst statistics and multiscaling structure functions which establish temporal intermittency. While the mean deformation increases with activity, normalized intermittency is strongest at lower activity. This suggests slower and more coherent bath forcing. When compared with translational and forcing-side fluctuations, it reveals a hierarchy of intermittency: shape is more weakly intermittent than translation and active-stress fluctuations, consistent with filtering by interfacial restoring forces. Power spectra show an extended near-$1/\\omega$ regime for the maximal normal interface velocity, distinct from the steeper, approximately $1/\\omega^{2}$ spectrum of the interfacial active stress. Soft inclusions thus reveal how interfacial restoring forces convert active forcing into bursty, scale-rich deformation dynamics.", "url": "https://arxiv.org/abs/2607.03737", "type": "数值", "summary": "1. 该工作利用全分辨向列流体动力学模拟，系统研究了二维伸展活性向列湍流中被动向列液滴的变形统计。\n2. 其核心发现是液滴纵横比作为标量探针，平均变形随活性增加，但增量呈现时滞依赖的重尾分布、无标度爆发统计及多标度结构函数，证实时间间歇性，且归一化间歇性在低活性时最强，揭示更慢更连贯的浴强迫与界面恢复力导致的间歇性层级——形状弱于平动和活性应力涨落。\n3. 这为软夹杂物作为活性湍流探针提供了理论依据，其中界面法向速度的近1/ω功率谱区别于活性应力的1/ω²谱，启发实验通过液滴变形动力学探测活性系统的内禀间歇性与多尺度耦合。", "summary_source": "deepseek", "authors": [{"name": "Sudeep Halder"}, {"name": "Abhishek Chaudhuri"}], "featured_authors": [{"name": "Sudeep Halder"}, {"name": "Abhishek Chaudhuri"}], "author_count": 2}, {"id": "2607.03762", "category": "cond-mat", "title": "Pauli Spectrum and Stabilizer Rényi Entropy in Gapless Symmetry-Protected Topological Phases", "abstract": "Quantum entanglement is widely used as a diagnostic of topological phases of matter. Beyond entanglement, non-stabilizerness captures a distinct aspect of quantum many-body states by quantifying their distance from the manifold of stabilizer states. In this work, we study the stabilizer Rényi entropy in symmetry protected topological (SPT) phases, including both gapped SPT, non-intrinsically gapless SPT, and intrinsically gapless SPT phases. Under symmetry preserving perturbations, we find numerically that the stabilizer Rényi entropy exhibits an extremum near the phase transition. However, the stabilizer Rényi entropy alone cannot distinguish different SPT phases. In contrast, the Pauli spectrum reveals a characteristic crossing structure at the transition point. This crossing reflects the exchange of dominant Pauli-string correlations associated with the non-local string order parameters of the two topological distinct phases. For gapped SPT and non-intrinsically gapless SPT phases, the crossing structure can be understood from a local-unitary duality that maps the Pauli spectrum between the two phases. For intrinsically gapless SPT phases, such a local-unitary mapping is absent. Instead, we find that the Pauli spectrum mapping is generated by a non-invertible duality transformation. These results show that although the stabilizer Rényi entropy provides only a coarse diagnostic of phase transitions, the Pauli spectrum contains finer information about the exchange of string order sectors. Our findings demonstrate that quantum magic offers a complementary perspective for characterizing both gapped and gapless SPT phases.", "url": "https://arxiv.org/abs/2607.03762", "type": "理论+数值", "summary": "1. 该工作通过计算稳定子Rényi熵与Pauli谱，系统表征了有隙、非本征无隙及本征无隙对称保护拓扑相中的量子非稳定子性质。\n2. 核心发现是稳定子Rényi熵仅在相变点附近呈现极值，无法区分不同拓扑相；而Pauli谱在相变处呈现特征交叉结构，反映拓扑相间非局域弦序参量主导Pauli弦关联的交换，其成因在有隙/非本征无隙相中为局域幺正对偶，在本征无隙相中则为非可逆对偶变换。\n3. 该工作揭示了Pauli谱相较稳定子Rényi熵包含更精细的相变信息，为利用量子魔术诊断对称保护拓扑相（尤其无隙情形）提供了互补性视角。", "summary_source": "deepseek", "authors": [{"name": "Ying-Lin Li"}, {"name": "Po-Yao Chang"}], "featured_authors": [{"name": "Ying-Lin Li"}, {"name": "Po-Yao Chang"}], "author_count": 2}, {"id": "2607.03823", "category": "cond-mat", "title": "Janus MgAlB_2 MBene: a dipole-engineered anode for ultrafast Li-ion transport and exceptional lithium storage", "abstract": "In this work, we propose a group II/IIIA-based Janus MBene, MgAlB_2, and investigate its electrochemical properties using first-principles calculations. The substitution of one Mg layer in Mg_2B_2 MBene by an Al layer breaks the structural symmetry and generates a permanent out-of-plane polarization, giving rise to a distinct electronic environment compared with the parent Mg_2B_2 and Al_2B_2 monolayers. Electronic-structure analysis reveals enhanced orbital hybridization among B, Mg, and Al states near the Fermi level, resulting in improved electronic delocalization across the monolayer. The Janus MgAlB_2 monolayer is found to possess excellent dynamical, mechanical, and thermal stability. Owing to its polarization-modified energy landscape, Li ions migrate with an exceptionally low diffusion barrier of 17.1 meV, corresponding to a room-temperature diffusion coefficient of 3.43x10^-10 cm^2/s. Unlike the pristine Mg_2B_2 and Al_2B_2 monolayers, which support only a single stable adsorption layer, MgAlB_2 accommodates two complete Li layers. Detailed analysis shows that the residual polarization retained after first-layer lithiation continues to promote Li adsorption, whereas increasing Li-Li electrostatic interactions eventually limit further storage. As a result, the Janus monolayer delivers a high theoretical specific capacity of 1470.24 mAh/g together with a small volume expansion of only 3.7% during maximum lithiation. The present study demonstrates that intrinsic polarization can be utilized to regulate both the thermodynamics and kinetics of Li storage, providing a design strategy for high-rate and high-capacity two-dimensional electrode materials.", "url": "https://arxiv.org/abs/2607.03823", "type": "理论+数值", "summary": "1. 该工作通过第一性原理计算提出并研究了Janus MgAlB₂单层作为锂离子电池负极的电化学性能。\n2. 其核心在于层间Al替代Mg打破结构对称性产生永久极化，将Li扩散势垒降至17.1 meV并实现双层Li吸附，理论比容量达1470.24 mAh/g，体积膨胀仅3.7%。\n3. 这证明内禀极化可同时调控储锂热力学与动力学，为设计高倍率高容量二维电极材料提供了明确策略。", "summary_source": "deepseek", "authors": [{"name": "Pritam Samanta"}, {"name": "Sashank Kumar Pandey"}, {"name": "Amit Kumar Jana"}, {"name": "Prakash Parida"}], "featured_authors": [{"name": "Pritam Samanta"}, {"name": "Sashank Kumar Pandey"}, {"name": "Amit Kumar Jana"}, {"name": "Prakash Parida"}], "author_count": 4}, {"id": "2607.03841", "category": "cond-mat", "title": "First-principles study of the electronic structure and optical properties of two-dimensional $α$-graphdiyne", "abstract": "The structural, electronic, and optical properties of monolayer $\\alpha$-graphdiyne ($\\alpha$-GDY) are systematically investigated using density-functional theory within the plane-wave pseudopotential formalism. The electronic band structure reveals a gapless Dirac crossing at the K point, demonstrating the Dirac semimetallic character of the monolayer. The calculated total and orbital-projected density of states show that the electronic states near the Fermi level are dominated by the carbon $2p$ orbitals, while the contribution of the $2s$ orbitals is comparatively weak. The optical response exhibits pronounced polarization dependence. The in-plane dielectric function displays a strong Drude-like response and negative values of the real dielectric function at low photon energies, whereas the out-of-plane component remains positive throughout the investigated energy range. Consistently, the absorption coefficient, extinction coefficient, reflectivity, and electron energy-loss spectra reveal a pronounced optical anisotropy. The calculated plasma frequencies are approximately $3.21$~eV for the in-plane polarization and $1.06$~eV for the out-of-plane polarization, indicating substantially stronger collective electronic excitations within the atomic plane. These findings demonstrate that $\\alpha$-GDY combines Dirac-like electronic behavior with highly anisotropic optical properties, highlighting its potential for polarization-sensitive optoelectronic, plasmonic, and nanoelectronic applications.", "url": "https://arxiv.org/abs/2607.03841", "type": "理论", "summary": "1. 利用基于平面波赝势的密度泛函理论系统研究了单层α-石墨二炔的电子结构与光学性质。\n2. 其物理要点在于揭示该单层膜表现为狄拉克半金属，且光学响应呈现强烈偏振依赖的面内负介电函数与等离激元频率各向异性。\n3. 这一狄拉克电子行为与高度各向异性光学特性的共存为偏振敏感情形下的光电子及等离激元器件提供了材料基础。", "summary_source": "deepseek", "authors": [{"name": "Ashkan Shekaari"}], "featured_authors": [{"name": "Ashkan Shekaari"}], "author_count": 1}, {"id": "2607.03845", "category": "cond-mat", "title": "Quantum tunneling Mpemba effect", "abstract": "The quantum tunneling Mpemba effect is investigated within a continuous one-dimensional symmetric double-well potential open to external environmental sinks at the boundaries ($x=\\pm L$). Using a non-Hermitian spectral decomposition of the effective Hamiltonian, we characterize the open-system relaxation dynamics without relying on abstract state-space quenches. We mathematically prove that the non-monotonic behavior of the first non-trivial even-parity spectral coefficient, $a_{2}(T_{i})$, with respect to the initial preparation temperature $T_{i}$ is a universal topological property born from quantum statistical mechanics. Crucially, we demonstrate that this intermediate thermal peak is governed by the Sturm-Liouville oscillation theorem and remains completely invariant with respect to the global system size $L$, contrasting sharply with the boundary-driven classical Mpemba effect. This universal peak arises from the geometric and nodal alignment between highly localized unperturbed states and extended non-Hermitian decay channels. Furthermore, we clarify that while this mechanism is robust, the actual observation of anomalous crossings in the total survival probability trace $S(t,T_{i})$ and the trace distance $\\mathcal{D}(t,T_i)$ demand a strict separation of timescales, requiring the over-barrier escape rate to vastly exceed the decay rate of the deep-well tunneling doublet ($\\Gamma_{2}\\gg \\Gamma_{0}$ and $\\Gamma_2\\gg \\Gamma_1$). Our continuous formulation successfully bridges real-space classical boundary-driven dissipation with open quantum dynamics, providing novel insights for engineering non-equilibrium states via tailored boundary loss.", "url": "https://arxiv.org/abs/2607.03845", "type": "理论", "summary": "1. 该工作利用连续一维对称双势阱中的非厄米谱分解，研究了开放系统弛豫动力学的量子隧穿Mpemba效应。\n2. 其核心在于证明偶宇称谱系数a₂(Tᵢ)的非单调峰是量子统计力学的普适拓扑性质，由Sturm-Liouville振荡定理支配且不受系统尺寸影响。\n3. 这揭示了该机制与经典边界驱动Mpemba效应的本质区别，并指出时间尺度分离是实现反常交叉的必要条件，为工程化边界耗散调控非平衡态提供了新路。", "summary_source": "deepseek", "authors": [{"name": "Hisao Hayakawa"}, {"name": "Satoshi Takada"}], "featured_authors": [{"name": "Hisao Hayakawa"}, {"name": "Satoshi Takada"}], "author_count": 2}, {"id": "2607.03867", "category": "cond-mat", "title": "The Reweighting Principle in Statistical Mechanics", "abstract": "Reweighting of probability measures provides a unifying perspective on conditioning, exponential tilting, and, more generally, ensemble transformations in statistical mechanics. We show that exponential tilting and conditioning arise as the minimum-relative-entropy updates associated with soft and hard constraints, respectively. Their relative entropies naturally inherit complementary thermodynamic structures: exponential tilting gives rise to the Legendre structure of the canonical ensemble and reduces to the Gibbs entropy for a uniform reference measure, while conditioning reduces to the Boltzmann entropy through the surprisal of the constrained macrostate. By introducing an enlarged probability space in which observables are treated as explicit variables, we further show that microcanonical and canonical ensembles arise as conditional and marginal distributions of a common structural prior after exponential reweighting. In the thermodynamic limit, described through large deviation theory, conditioning emerges from exponential tilting by concentration of measure, revealing ensemble equivalence as a consequence of entropy--bias competition. Finally, we outline how the same information-theoretic framework naturally extends to path space, suggesting a unified probabilistic description of equilibrium thermodynamics and conditioned stochastic dynamics.", "url": "https://arxiv.org/abs/2607.03867", "type": "理论", "summary": "1. 该工作提出重加权原理作为统计力学中概率测度变换的统一视角，揭示条件化与指数倾斜分别对应软硬约束下的最小相对熵更新。\n2. 其卖点在于相对熵自然形成互补热力学结构，通过扩大概率空间统一微正则与正则系综，并基于大偏差理论证明系综等价源于熵-偏差竞争。\n3. 该框架可扩展至路径空间，为平衡热力学与条件随机动力学提供统一概率描述，启发统计力学信息论视角的深入。", "summary_source": "deepseek", "authors": [{"name": "Salvatore Romano"}], "featured_authors": [{"name": "Salvatore Romano"}], "author_count": 1}, {"id": "2607.03893", "category": "cond-mat", "title": "Morphology-Property Interplay in Chemo-Mechanics of Ion-Intercalation Active Particles", "abstract": "Morphology, material property, and mechanical constraint jointly govern the chemo-mechanical behavior of ion-intercalation particles, yet their coupled effects remain insufficiently understood. Here we establish a thermodynamically consistent single-particle framework and combine analytical solutions with multiphysics simulations to determine how these factors regulate lithiation and stress generation. We study hollow spherical, cylindrical, and ellipsoidal particles with isotropic or transversely isotropic material properties under fully constrained, inner-free, or unconstrained boundary conditions. We show that the transient lithiation pathway and the associated stress and strain fields are governed not by morphology, property, or constraint alone, but by their coupled interaction: isotropic particles are sensitive to the mechanical constraint, whereas transversely isotropic particles exhibit persistent heterogeneous lithiation dominated by anisotropic diffusivity. Flux decomposition analysis reveals that the mechanical contribution to Li flux is negligible in spheres but dominant in ellipsoids. Correlation analysis further shows that Li concentration and volumetric strain exhibit strong anti-correlation in unconstrained particles but weak correlation under full constraints. Bayesian optimization of hollow ellipsoids identifies Pareto-optimal morphologies that balance lithiation capacity against peak tensile stress. These results provide a unified framework for the morphology-property interplay in intercalation particles and offer morphology design principles for chemo-mechanical stability.", "url": "https://arxiv.org/abs/2607.03893", "type": "理论+数值", "summary": "1. 该工作建立了一个热力学一致的单粒子框架，结合解析解与多物理场模拟，系统研究离子插层颗粒的形貌、材料属性与机械约束对锂化及应力演化的耦合调控。\n2. 核心卖点在于揭示耦合机制：各向同性颗粒对约束敏感，而横向各向同性颗粒因各向异性扩散主导持续异质锂化，且通量分解显示椭球中机械贡献占优。\n3. 这为通过贝叶斯优化设计空心椭球Pareto最优形态以平衡锂化容量与峰值拉应力提供了形貌设计原则，启发插层颗粒的化学-力学稳定性优化。", "summary_source": "deepseek", "authors": [{"name": "Rongyue Lin"}, {"name": "Royal C. Ihuaenyi"}, {"name": "Juner Zhu"}, {"name": "Ruobing Bai"}], "featured_authors": [{"name": "Rongyue Lin"}, {"name": "Royal C. Ihuaenyi"}, {"name": "Juner Zhu"}, {"name": "Ruobing Bai"}], "author_count": 4}, {"id": "2607.03954", "category": "cond-mat", "title": "Reentrant localization transition, quantum butterfly and robust edge modes in aperiodic zig-zag ladder", "abstract": "Low dimensional tight-binding lattices in presence of quasiperiodic disorder generally exhibits localization transition. The system supports diffusive modes upto a limiting strength of disorder and all the eigenstates become localized beyond that critical strength thereby quenching the kinetic signature of the wavepacket. However, moving away from this situation, we demonstrate that with minimal long-range off-diagonal modulation, the eigenspectrum again may offer delocalization of electronic states for some subtle combination of kinetic parameters of the Hamiltonian leading to a second quantum phase change. The localization transitions are associated with the obvious presence of single-particle mobility edges. Multifractal energy landscape also shows quantum butterfly pattern with the in-gap robust edge modes. The re-emerging localization transition is manifested through the evaluation of inverse participation ratio, eigenspectrum and a pertinent quantum dynamical study.", "url": "https://arxiv.org/abs/2607.03954", "type": "理论", "summary": "1. 该工作理论研究了准周期无序锯齿形梯子中的重新进入局域化转变，揭示了单粒子迁移率边及量子蝴蝶图案。\n2. 其核心发现是引入最小长程非对角调制可在强无序区再次诱发退局域化，同时展示带隙内稳健边缘模。\n3. 这为低维无序系统中多体局域化与拓扑相的交叉研究提供了可操控的理论模型与动力学判据。", "summary_source": "deepseek", "authors": [{"name": "Sayan Bhattacharya"}, {"name": "Rhiddha Acharjee"}, {"name": "Atanu Nandy"}], "featured_authors": [{"name": "Sayan Bhattacharya"}, {"name": "Rhiddha Acharjee"}, {"name": "Atanu Nandy"}], "author_count": 3}, {"id": "2607.04097", "category": "cond-mat", "title": "Full Gate-Voltage Control of a Parity-Protected Superconducting Qubit with an Altermagnetic Josephson Junction", "abstract": "Parity-protected superconducting qubits offer intrinsically long coherence, but many current implementations require magnetic-flux biasing, which introduces flux noise, control overhead, and limited scalability. Here we propose a parity-protected qubit based on a gate-tunable superconductor-altermagnet-superconductor Josephson junction. Altermagnets are compensated magnets with momentum-dependent spin splitting and zero net magnetization, providing spin-dependent functionality without external magnetic fields. In the proposed junction, the two spin sectors acquire opposite phase shifts, generating two Josephson channels whose interference is controlled electrically by the chemical potential. At the tuned $0$-$\\pi$ transition, the first Josephson harmonic is strongly suppressed while the second harmonic dominates, yielding a double-well potential with two nearly degenerate states of opposite Cooper-pair parity. For realistic gatemon-compatible parameters, we estimate coherence times of up to tens of milliseconds while maintaining fully gate-controlled qubit operations. These results establish altermagnetic Josephson junctions as a promising route toward protected superconducting qubits with local, scalable, and all-electrical control.", "url": "https://arxiv.org/abs/2607.04097", "type": "理论", "summary": "1. 该工作提出基于栅极可调交磁约瑟夫森结的全电控宇称保护超导量子比特方案。\n2. 其核心在于利用交磁体无净磁化的自旋分裂实现0-π跃迁，第二谐波主导形成宇称保护双阱势。\n3. 这为免于磁通噪声、可实现本地全电控的可扩展超导量子比特提供了现实路径。", "summary_source": "deepseek", "authors": [{"name": "Guo-Liang Guo"}], "featured_authors": [{"name": "Guo-Liang Guo"}], "author_count": 1}, {"id": "2607.04104", "category": "cond-mat", "title": "Vortex-Number-Controlled Josephson Diode Polarity in Corbino Junctions", "abstract": "We demonstrate that the polarity of the Josephson diode effect in Corbino Josephson junctions can be deterministically controlled by the vortex number, which arises as a generic consequence of structured spatial inhomogeneity. By solving the continuum Andreev spectral problem, we identify a mechanism in which the vortex number selectively filters specific spatial Fourier harmonics of the local inhomogeneity. This harmonic selection reshapes the amplitudes and relative phases of higher-order Josephson current harmonics, ultimately reversing the critical-current asymmetry. Numerical simulations of both an effective one-dimensional edge model and full two-dimensional lattice models confirm the robustness of this mechanism. Crucially, our results show that a vortex-parity-dependent reversal of diode polarity is not an exclusive signature of Majorana physics, but can emerge generically from geometric and structural inhomogeneities in Corbino junctions.", "url": "https://arxiv.org/abs/2607.04104", "type": "理论+数值", "summary": "1. 该工作展示在Corbino约瑟夫森结中，涡旋数可确定性调控约瑟夫森二极管的极性方向。\n2. 其物理机制在于涡旋数选择性过滤空间不均匀性的特定傅里叶谐波，从而重塑高阶约瑟夫森电流谐波并反转临界电流不对称性。\n3. 这提示涡旋奇偶性依赖的极性反转并非马约拉纳物理独有，而可能源自几何与结构不均匀性的一般性后果。", "summary_source": "deepseek", "authors": [{"name": "Linghao Huang"}, {"name": "Jing Wang"}], "featured_authors": [{"name": "Linghao Huang"}, {"name": "Jing Wang"}], "author_count": 2}, {"id": "2607.04116", "category": "cond-mat", "title": "Electronic Structure, Optical Response, Thermal and Mechanical Behavior of B6X (X = S, Se) under Pressure: A Comprehensive Ab-initio Exploration", "abstract": "This study presents a comprehensive investigation of the pressure dependent structural, electronic, optical, mechanical, and bonding properties of orthorhombic boron rich chalcogenides B6S and B6Se. Calculations were performed using density functional theory across a wide range of hydrostatic pressures. The computed elastic constants, bulk, Young, shear moduli, and Poisson ratio, revealed mechanical robustness and strong resistance to deformation, even under significant compression. Electronic band structure and density of states analyses indicate that the materials exhibit indirect bandgap semiconducting behavior. Optical results reveal clear pressure induced spectral shifts, particularly in the visible and ultraviolet regions, suggesting modified light matter interaction under compression. Phonon dispersion curves verified the dynamical stability of both materials within the investigated pressure range. Hardness estimations, combined with elastic parameters, and melting temperatures, further indicate that B6S and B6Se possess significant mechanical strength suitable for applications under harsh environments. The thermal properties suggest that both these compounds possess features suitable to be used as excellent thermal barrier coating materials.", "url": "https://arxiv.org/abs/2607.04116", "type": "理论+数值", "summary": "1. 该工作采用密度泛函理论全面研究了正交相B6S与B6Se在高压下的结构、电子、光学、力学及热学性质。\n2. 其技术要点在于通过弹性常数、能带、光学响应和声子色散等计算，揭示了材料在宽压力范围内保持间接带隙半导体行为、力学稳健性和动力学稳定性。\n3. 这为富硼硫族化物在极端环境下用作热障涂层等潜力应用提供了系统的理论依据。", "summary_source": "deepseek", "authors": [{"name": "Sourav Kumar Sutradhar"}, {"name": "Tanvir Khan"}, {"name": "Tauhidur Rahman"}, {"name": "Sraboni Saha Moly"}, {"name": "Mst. Maskura Khatun"}, {"name": "S.H. Naqib"}], "featured_authors": [{"name": "Sourav Kumar Sutradhar"}, {"name": "Tanvir Khan"}, {"name": "Tauhidur Rahman"}, {"name": "Sraboni Saha Moly"}, {"name": "Mst. Maskura Khatun"}, {"name": "S.H. Naqib"}], "author_count": 6}, {"id": "2607.04135", "category": "cond-mat", "title": "Broken Ergodicity and the Violation of the Fluctuation-Dissipation Theorem Lead to Generalization Beyond Overfitting in Machine Learning", "abstract": "The remarkable ability of modern neural networks to generalize improves with increasing network capacity, even when the number of model parameters or effective degrees of freedom exceeds the number of training data points. This phenomenon is all the more surprising given that generalization error diverges when the number of model parameters approaches a critical value from below. Here we use dynamical mean field theory to show that this so-called \"double descent\" behavior is the outcome of a phase transition in the stochastic field theory describing the training process. We calculate the critical exponents and scaling function of the double descent phase transition, and show that it is marked by a breakdown of the fluctuation-dissipation theorem associated with broken ergodicity. The corresponding response function has the same functional form as the simple London model of the superconducting transition, with the rigidity of the wave function corresponding to the neural network's ability to generalize accurately.", "url": "https://arxiv.org/abs/2607.04135", "type": "理论+数值", "summary": "1. 该工作利用动力学平均场理论证明，现代神经网络中随容量增加而改善的泛化能力源于随机场理论描述训练过程的相变。\n2. 其核心卖点在于识别出该相变伴随遍历性破缺和涨落耗散定理破坏，且响应函数与超导London模型形式相同。\n3. 这为从统计物理角度理解过参数化系统的泛化机制提供了定量框架，并启发将相变概念应用于其他学习系统。", "summary_source": "deepseek", "authors": [{"name": "Chan Li"}, {"name": "Nigel Goldenfeld"}], "featured_authors": [{"name": "Chan Li"}, {"name": "Nigel Goldenfeld"}], "author_count": 2}, {"id": "2607.04200", "category": "cond-mat", "title": "Tellurium sublattice instability driven amorphization in the chalcogenide AgSbTe2 under pressure", "abstract": "Pressure provides a powerful thermodynamic route to access hidden structural states in functional materials, yet the microscopic origin of pressure-induced amorphization remains elusive in many complex chalcogenides. Here we report a detailed high-pressure structural study of AgSbTe2,combining synchrotron X-ray diffraction with density functional theory and molecular dynamics calculations up to 60 GPa. We uncover a pressure-driven transformation from the ambient R-3m phase to a fully disordered cubic Im3m phase, through an extended intermediate amorphous state. Enthalpy calculations reveal a near-degeneracy between the R3m and Im3m structures over a broad pressure range, dictating amorphization. Contrary to previously speculated cation vacancies, the amorphization is governed by a pronounced displacement instability of the Te sublattice. Remarkably, the time dependent decompression pathway controls the final structural state, resulting in either amorphous (slow decompression) or fully crystalline (fast decompression) states, indicative of a strong counterintuitive kinetic effect.", "url": "https://arxiv.org/abs/2607.04200", "type": "理论+数值", "summary": "1. 该工作通过同步辐射X射线衍射、密度泛函理论与分子动力学计算，揭示了AgSbTe₂在60 GPa压力下从R-3m相经由中间非晶态向无序立方Im3m相转变的路径。\n2. 其核心物理机制在于碲亚晶格显著的位移不稳定性驱动非晶化，而非先前推测的阳离子空位，且焓计算表明R3m与Im3m结构在宽压力范围近简并。\n3. 这一发现凸显了减压动力学路径对最终结构状态的强烈调控作用，为理解复杂硫属化物中压力诱导非晶化的微观起源及设计可控结构态提供了新思路。", "summary_source": "deepseek", "authors": [{"name": "Baihong Sun"}, {"name": "Zihan Zhang"}, {"name": "Wei Luo"}, {"name": "Sergei Grazhdannikov"}, {"name": "Wenting Lu"}, {"name": "Shiyu Feng"}, {"name": "Haikai Zou"}, {"name": "Chenxin Wei"}, {"name": "Martin Kunz"}, {"name": "Hirokazu Kadobayashi"}, {"name": "Bihang Wang"}, {"name": "Azkar Saeed Ahmad"}, {"name": "Yaron Amouyal"}, {"name": "Rajeev Ahuja"}, {"name": "Elissaios Stavrou"}], "featured_authors": [{"name": "Baihong Sun"}, {"name": "Zihan Zhang"}, {"name": "Wei Luo"}, {"name": "Yaron Amouyal"}, {"name": "Rajeev Ahuja"}, {"name": "Elissaios Stavrou"}], "author_count": 15}, {"id": "2607.04252", "category": "cond-mat", "title": "Universal fluctuations of first discoveries in competitive exploration", "abstract": "Random exploration is usually quantified by how fast new space is found, from the range of a single walker to the territory collectively covered by many walkers. In competitive exploration, first arrival secures an exclusive resource, as when foragers compete for food items or agents capture distributed targets. It is then no longer enough to know which sites have been discovered: one must determine, for each discovered site, which searcher reached it first. We introduce the discovery share $X_n$, the fraction of the first $n$ collective discoveries secured by a tagged searcher. For two identical competitors, exchange symmetry fixes $\\langle X_n\\rangle=1/2$, but the central question is whether this equal split emerges in each long exploration history or only on average, \\emph{i.e.} whether early competitive advantages are erased or persist. Here we show that the answer is controlled by the spectral dimension $d_s$, defined by the large-time decay of the probability that a single searcher is at its starting point after $t$ steps, $p_0(t)\\sim t^{-d_s/2}$. Across ordinary diffusion, long-range superdiffusion and subdiffusion induced by crowding or memory, $d_s$ separates persistent randomness in recurrent exploration $(d_s<2)$, anomalously slow non-Gaussian concentration for $2\\le d_s<3$, and Gaussian concentration, logarithmically corrected at $d_s=3$, for $d_s\\ge3$. For $d_s\\ge2$, we derive exact asymptotic variances, including prefactors, and the discovery scale on which competitive imbalances are erased. Two-point correlations of first-discovery labels identify the memory mechanism behind these regimes. The same phase structure persists under changes in geometry, competitor heterogeneity, number of competitors and memory, revealing a general fluctuation theory of first-arrival inequalities.", "url": "https://arxiv.org/abs/2607.04252", "type": "理论", "summary": "1. 该工作引入发现份额变量以刻画竞争探索中首次发现的涨落，并揭示其波动行为由谱维数d_s普适控制。\n2. 核心卖点在于识别d_s=2与3为临界点，分别对应持久随机性、异常非高斯集中与高斯集中，并推导出精确渐近方差与标度。\n3. 这提供了一个统一的首次到达不平等涨落理论，为理解竞争性搜索、资源分配等多体系统提供了通用框架。", "summary_source": "deepseek", "authors": [{"name": "Arthur Plaud"}, {"name": "P. L. Krapivsky"}, {"name": "S. Redner"}, {"name": "Olivier Bénichou"}], "featured_authors": [{"name": "Arthur Plaud"}, {"name": "P. L. Krapivsky"}, {"name": "S. Redner"}, {"name": "Olivier Bénichou"}], "author_count": 4}, {"id": "2607.04266", "category": "cond-mat", "title": "Phase-Factor-Controlled Interaction and Bonding between a Chiral Bobber and a Skyrmion String in the Conical Phase", "abstract": "Skyrmion interactions govern the formation of skyrmion lattices, clusters, and particle-like growth patterns. In contrast, the interaction between a chiral bobber and a skyrmion string remains largely unexplored, despite the role of bobbers as intermediate states in skyrmion-string formation and annihilation. Here we show that this interaction is intrinsically phase dependent in the conical phase. Using three-dimensional micromagnetic simulations, we compute the locally relaxed constrained energy landscape as a function of the bobber--skyrmion separation $R$ and the surface phase factor $\\phi_0$. We find that changing $\\phi_0$ qualitatively reshapes the interaction, producing repulsive, attractive, and bonding-like regimes that cannot be reduced to a conventional distance-dependent potential. Real-space analysis shows that this behavior originates from phase-dependent reconstruction of nonaxisymmetric outer distortion shells. The phase-controlled interaction persists over a finite field range and follows the expected top--bottom phase relation of surface-sensitive conical textures. These results identify the conical phase direction, often hidden in projected or thickness-averaged descriptions, as a previously underappreciated degree of freedom in the interaction between skyrmion strings and finite-length chiral textures, as demonstrated here for chiral bobbers.", "url": "https://arxiv.org/abs/2607.04266", "type": "理论+数值", "summary": "1. 该工作通过三维微磁模拟研究了锥形相中手性bobber与skyrmion string的相互作用能量景观。\n2. 其卖点在于揭示表面相位因子φ0可定性调控相互作用，产生排斥、吸引及类成键行为，源于非轴对称外壳层的相位依赖重构。\n3. 这为识别锥形相方向作为skyrmion string与有限长手性纹理相互作用中未被充分认识的控制自由度提供了启示。", "summary_source": "deepseek", "authors": [{"name": "Haijun Zhao"}, {"name": "Tingting Yan"}, {"name": "Shuai Dong"}], "featured_authors": [{"name": "Haijun Zhao"}, {"name": "Tingting Yan"}, {"name": "Shuai Dong"}], "author_count": 3}, {"id": "2607.04269", "category": "cond-mat", "title": "First-principles Floquet analysis from real-time propagation", "abstract": "We present a real-time Floquet analysis method for extracting quasi-energies and Floquet states directly from propagated wavefunctions. By reconstructing the one-period evolution operator from overlaps between time-evolved states, the method avoids the explicit construction of the enlarged Floquet Hamiltonian and adds negligible computational overhead to time-dependent simulations. To resolve the ambiguity inherent in the reduced-zone representation, we introduce an unfolding procedure based on the harmonic decomposition of Floquet states, which recovers their underlying equilibrium band character beyond the reduced Floquet Brillouin zone. The reconstructed wavefunctions further provide access to the symmetry properties of individual light-induced sidebands. We demonstrate the applicability and generality of the method in first-principles time-dependent simulations of real materials, ranging from two-dimensional monolayers to a three-dimensional bulk semiconductor, and including finite pulses without strict time periodicity. This framework directly connects real-time simulations with Floquet observables, enabling practical analysis of light-driven electronic structure in materials.", "url": "https://arxiv.org/abs/2607.04269", "type": "理论+数值", "summary": "1. 该工作提出了一种基于实时传播波函数直接提取准能量与Floquet态的第一性原理分析方法。\n2. 其核心卖点在于通过时间演化波函数重叠积分重构单周期演化算符，并利用Floquet态谐波分解的展开步骤消除约化区表示中的能带模糊，从而恢复平衡带结构。\n3. 该框架将实时模拟与Floquet可观测量直接相连，为分析非严格周期脉冲下光驱动材料的电子结构提供了实用途径。", "summary_source": "deepseek", "authors": [{"name": "Ruipeng Li"}, {"name": "Benshu Fan"}, {"name": "Umberto De Giovannini"}, {"name": "Hannes Hübener"}, {"name": "Angel Rubio"}], "featured_authors": [{"name": "Ruipeng Li"}, {"name": "Benshu Fan"}, {"name": "Umberto De Giovannini"}, {"name": "Hannes Hübener"}, {"name": "Angel Rubio"}], "author_count": 5}, {"id": "2607.04288", "category": "cond-mat", "title": "Mass weighting algorithm optimizes Fourier-based physics-informed neural network in adhesive contact mechanics", "abstract": "Physics-informed neural networks (PINNs) for elastic contact mechanics suffer from a spectral stiffness imbalance,that is, the elastic kernel grows linearly with wave number, causing short-wavelength modes to dominate gradient updates and stall convergence of the macroscopic deformation. We introduce a spectral preconditioning strategy that reweights displacement gradients in Fourier space before back-propagation, amplifying low wavenumber components through a mass weighting (MW) function while suppressing sub-grid noise via a built-in low-pass filter. Applied to adhesive line contact problems, the mass weighted PINN reaches machine-zero residual loss within 400 Adam iterations for specified benchmark, whereas the reference benchmark stalls at three orders of magnitude higher loss. The converged displacement and contact stress fields agree quantitatively with Green's function molecular dynamics (GFMD) solutions for both smooth Hertz contact at pressures spanning tension to compression and rough surfaces with roughness covering several decades of wavelength. The
