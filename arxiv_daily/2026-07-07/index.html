 A Hamiltonian-Informed Diagnostic Benchmark for Evaluating Quantum Architecture Search", "abstract": "Quantum Architecture Search (QAS) automates the design of parameterized quantum circuits for variational quantum algorithms, yet existing benchmarks organize instances by molecular identity or qubit count -- criteria agnostic to Hamiltonian structure -- and rely solely on energy accuracy, which cannot detect structural failures such as over-parameterization on near-product ground states. We introduce HamQASBench, a Hamiltonian-informed diagnostic benchmark organizing 11 molecules into five structural tiers via fingerprints derived from the Pauli operator basis, computational basis representation, and ground-state entanglement. A post-hoc critical-structure extraction procedure identifies minimal circuits consistent with each tier's requirements, complementing energy-based evaluation with per-qubit entanglement analysis and pairwise state fidelity. Benchmarking five QAS methods across four paradigms reveals failure modes invisible to conventional metrics: over-parameterization in the minimalism regime, eigenstate commitment under degeneracy, a representation bottleneck in strongly correlated systems, topology-induced routing failure, and circuit search space growth as a scalability bottleneck.", "url": "https://arxiv.org/abs/2607.04845", "type": "理论+数值", "summary": "1. 该工作引入了一个基于哈密顿量信息的诊断基准HamQASBench，用于评估量子架构搜索方法，包含11个分子按泡利算子指纹、计算基与基态纠缠分为五个结构层级。\n2. 其技术核心在于后验关键结构提取程序与每量子比特纠缠分析及成对态保真度，可捕获能量准确性无法揭示的过度参数化、简并特征态锁定及强关联表示瓶颈等失效模式。\n3. 这为量子架构搜索提供了超越传统指标的诊断框架，指明了在简约性、简并、强关联、拓扑路由与搜索空间扩展等场景下的方法瓶颈与优化方向。", "summary_source": "deepseek", "authors": [{"name": "Jiayang Niu"}, {"name": "Akib Karim"}, {"name": "Yan Wang"}, {"name": "Jie Li"}, {"name": "Ke Deng"}, {"name": "Azadeh Alavi"}, {"name": "Muhammad Usman"}, {"name": "Yongli Ren"}], "featured_authors": [{"name": "Jiayang Niu"}, {"name": "Akib Karim"}, {"name": "Yan Wang"}, {"name": "Azadeh Alavi"}, {"name": "Muhammad Usman"}, {"name": "Yongli Ren"}], "author_count": 8}, {"id": "2607.04899", "category": "quant-ph", "title": "Quantum orientation, Noether structure, composition of systems and operations", "abstract": "In this paper we argue that, in addition to the statistical structure of quantum theory, another structure, referred to here as the ``Noether structure,\" is necessary to describe the composition of systems and to define completely positive operations. A Noether structure reflects the dual role of Hermitian operators as observables on the one hand and as generators of symmetry transformations on the other. This idea has been expressed in a similar form in the works of Alfsen and Shultz, who investigated the conditions under which the Jordan product can be extended to an associative product of operator algebras. Our investigations into the Noether structure and the composition of systems are limited to the finite-dimensional case and establish a connection to completely positive operations. In the case of pure operations, the latter can be characterized as orientation-preserving maps.", "url": "https://arxiv.org/abs/2607.04899", "type": "理论", "summary": "1. 本文论证了描述系统组合与正操作需引入Noether结构，该结构反映厄米算符作为可观测量与对称生成元的双重角色。\n2. 在有限维情形下，建立了Noether结构与完全正操作的联系，并将纯操作刻画为保定向映射。\n3. 这为理解量子组合性及操作代数结构提供了新视角，并可能关联Jordan乘积扩充为关联乘积的条件。", "summary_source": "deepseek", "authors": [{"name": "Heinz-Jürgen Schmidt"}], "featured_authors": [{"name": "Heinz-Jürgen Schmidt"}], "author_count": 1}, {"id": "2607.04915", "category": "quant-ph", "title": "How Hard Is Quantum Advantage? A Cloud Microphysics Stress Test for Variational Quantum Models", "abstract": "Quantum machine learning (QML) could have the potential to leverage advantages of quantum over classical computing but still lacks strong evidence of actual improvements and scalability, partly due to phenomena such as barren plateaus. In this paper, we employ a hybrid quantum neural network (QNN) on a dataset on cloud microphysics, containing processes for phase transitions of water in the atmosphere and its related temperature changes, which are highly relevant for accurate climate predictions and projections. To reach optimal performance of our QNNs, we employ a rich and trainable frequency spectrum together with expressivity enhancing classical postprocessing. We find that our QNNs strongly benefit from extensive hyperparameter optimization and thereby demonstrate the feasibility of applying QNNs to complex physical systems. At the same time, the QNNs are outperformed by classical baselines in the form of simple fully-connected neural networks. We discuss identified bottlenecks of this class of quantum models to learn the full complexity of the cloud microphysics dataset to show that there is a need to further understand and improve variational quantum models for machine learning such that they might fill the gap where classical models fail or are inefficient.", "url": "https://arxiv.org/abs/2607.04915", "type": "理论+数值", "summary": "1. 该工作以云微物理学相变数据集作为应力测试，评估变分量子神经网络能否实现量子优势。\n2. 其技术核心在于结合可训练频率谱与增强表达力的经典后处理，并进行了广泛的超参数优化。\n3. 当前量子模型在此任务中仍被简单经典全连接网络超越，揭示了需进一步理解并改进变分量子模型以填补经典模型失效的空白。", "summary_source": "deepseek", "authors": [{"name": "Felix Herbort"}, {"name": "Ellen Sarauer"}, {"name": "Daniel Ohl de Mello"}, {"name": "Paul Christiansen"}, {"name": "Steffen Hien"}, {"name": "Cedric Brügmann"}, {"name": "Dieter Jaksch"}, {"name": "Veronika Eyring"}, {"name": "Martin Kiffner"}, {"name": "Mierk Schwabe"}], "featured_authors": [{"name": "Felix Herbort"}, {"name": "Ellen Sarauer"}, {"name": "Daniel Ohl de Mello"}, {"name": "Veronika Eyring"}, {"name": "Martin Kiffner"}, {"name": "Mierk Schwabe"}], "author_count": 10}, {"id": "2607.04950", "category": "quant-ph", "title": "Contraction and Expansion Values of Quantum Channels", "abstract": "The contraction coefficient of the trace distance is a central tool in quantum information, quantifying how strongly a quantum channel degrades the distinguishability of states. However, being an extremal ratio, it captures only the most optimistic behaviour of the channel and is often trivial, even for very noisy channels. Moreover, a single scalar is poorly suited to describe how contraction accumulates under channel composition. In this work we introduce the \\emph{contraction and expansion values}, two monotone sequences that refine the contraction and expansion coefficients in the same way singular values refine the operator norm. They arise from a min--max variational principle over subspaces of traceless Hermitian operators, admit an operational interpretation in terms of two state-discrimination games, and are shown to coincide with the Gel'fand or Bernstein numbers of the channel restricted to traceless operators. This identification places the sequences within Pietsch's theory of $s$-numbers and yields, in particular, bounds under channel composition that the contraction coefficient alone cannot provide. We establish their main structural properties and compute or estimate them for single-qubit channels, $d$-dimensional amplitude damping channels, and direct-sum channels.", "url": "https://arxiv.org/abs/2607.04950", "type": "理论+数值", "summary": "1. 该工作引入量子信道的收缩值与扩张值，作为两个单调序列细化收缩与扩张系数。\n2. 其卖点在于基于无迹厄米算子子空间上的极小极大变分原理，证明其与Gel'fand或Bernstein数的等价性，从而纳入Pietsch的s-数理论以提供信道复合下的精确界限。\n3. 这为量子信道在态区分协议、噪声放大与资源理论的结合，以及更一般量子映射的谱特征分析，提供了可操作的分析框架。", "summary_source": "deepseek", "authors": [{"name": "Ruben Ibarrondo"}, {"name": "Mikel Sanz"}], "featured_authors": [{"name": "Ruben Ibarrondo"}, {"name": "Mikel Sanz"}], "author_count": 2}, {"id": "2607.04979", "category": "quant-ph", "title": "Extending the Bloch sphere model to an N-qubit system", "abstract": "The Bloch sphere is an elegant tool for representing single-qubit states. However, a widely accepted generalization for multi-qubit systems with entanglement remains absent. We propose a novel geometric model extending the Bloch sphere representation to arbitrary $N$-qubit systems using $2^N-1$ spheres. We demonstrate that any pure 2-qubit state is uniquely described by three spheres: two for individual qubits and a third encapsulating bipartite entanglement. Generalizing this, we establish an $N$-qubit parameterization through the hierarchical application of controlled rotation gates along the $Z$ and $Y$ axes. We formally prove a strict bijection between the standard state vector representation and our model's angular parameters. This framework provides an intuitive visualization of multiple entanglement, offering potential computational advantages for quantum simulators and new analytical perspectives on quantum gates.", "url": "https://arxiv.org/abs/2607.04979", "type": "理论", "summary": "1. 该工作将Bloch球模型推广至任意N-qubit系统，利用2^N-1个球体对纯态进行几何表示。\n2. 通过层级受控旋转门的参数化，建立了与标准态矢表示的严格双射，从而直观刻画多体纠缠结构。\n3. 此框架为量子模拟器潜在的计算优势及量子门分析提供了新的几何视角与解析途径。", "summary_source": "deepseek", "authors": [{"name": "Francisco Piñero"}, {"name": "Cristian Franco"}, {"name": "Hernán I. de la Cruz"}, {"name": "Fernando L. Pelayo"}, {"name": "Vicente Pascual"}, {"name": "Mauro Mezzini"}, {"name": "Jose Javier Paulet"}, {"name": "Fernando Cuartero"}], "featured_authors": [{"name": "Francisco Piñero"}, {"name": "Cristian Franco"}, {"name": "Hernán I. de la Cruz"}, {"name": "Mauro Mezzini"}, {"name": "Jose Javier Paulet"}, {"name": "Fernando Cuartero"}], "author_count": 8}, {"id": "2607.05072", "category": "quant-ph", "title": "Transmon Phase Gates Controlled by Superconducting Soliton DAC", "abstract": "We introduce a superconducting digital-to-analog converter (DAC) that filters control noise, provides native multiplexing, performs quantum gates in nanoseconds, and can be controlled by CMOS. This is achieved by transducing a trapezoidal drive pulse into a superconducting soliton, which is then held in the DAC load loop, applying flux to a mutually-coupled superconducting qubit or gate coupler. The analog flux output by the DAC can be easily controlled by varying the soliton hold time, or with a DC-biased tunable DAC-qubit coupler, allowing the DAC to perform a fixed-time, high-fidelity gate that's robust to fabrication variance or flux offsets in the quantum circuit. Our initial demonstration shows that the DAC can successfully perform 5.6 ns S-gates on transmons. We measure the DAC-induced quantum state excitation probability per gate to be 0.05%, and find that the DAC-induced relaxation rate from the qubit 1 state is below the intrinsic T1 rate limit of the transmon. Quantum simulations show qualitative agreement with the measured data, and predict that the DAC excitation rate can be lowered 10 times further by overdamping the Josephson junction (JJ) in the DAC load loop. may be limited by a Interleaved Randomized Benchmarking (IRB) sequences on an observer qubit reveal that, when scaling to many qubits, the DAC's performance may be limited by a non-local, DAC-induced phase error of 1.6% per gate, appearing in ancilla qubits that are not directly coupled to any of the 30 DACs on the chip. We discuss strategies for future layouts of multi-DAC chips that focus on mitigating the source of these non-local, high-frequency electromagnetic interactions (EMI), and how to incorporate a DC-tunable coupler for phase correction.", "url": "https://arxiv.org/abs/2607.05072", "type": "理论+数值", "summary": "1. 该工作提出一种基于超导孤子数模转换器（DAC）的transmon相位门方案，实现了纳秒级、高保真度的量子门操作。\n2. 其技术核心在于将梯形驱动脉冲转化为超导孤子并存储于DAC负载回路中，通过调控孤子驻留时间实现可调模拟磁通输出，并对制备误差与磁通偏移具有鲁棒性。\n3. 初步演示显示5.6 ns S门诱导的激发概率仅0.05%，弛豫率低于本征T1极限；但多DAC芯片存在1.6%非局域相位误差，未来需通过优化布局抑制高频电磁串扰并引入直流可调耦合器进行相位校正。", "summary_source": "deepseek", "authors": [{"name": "Derek Reitz"}, {"name": "Tony X. Zhou"}, {"name": "Aditya Sharma"}, {"name": "Ryan Bilotta"}, {"name": "John McFarland"}, {"name": "Aref Fouladi"}, {"name": "Jacob Glasby"}, {"name": "Aruna Ramanayaka"}, {"name": "Zachary Stegen"}, {"name": "Aaron Pesetski"}, {"name": "Mark Covington"}, {"name": "Gregory Boyd"}, {"name": "Jeremy Clark"}], "featured_authors": [{"name": "Derek Reitz"}, {"name": "Tony X. Zhou"}, {"name": "Aditya Sharma"}, {"name": "Mark Covington"}, {"name": "Gregory Boyd"}, {"name": "Jeremy Clark"}], "author_count": 13}, {"id": "2607.05094", "category": "quant-ph", "title": "Brownian Motion in Orthogonal and Symplectic Groups", "abstract": "Matrix Brownian motion provides a powerful framework for studying crossover ensembles in quantum chaos and quantum transport, as well as thermalization and information scrambling in many-body dynamics. Here, we develop a unified diagrammatic framework to characterize Brownian ensembles for orthogonal and symplectic random matrices, which describe systems with particle-hole symmetry. We compute polynomial averages up to fourth order and construct an orthogonally invariant interpolation for the disconnected $\\mathrm{SO}^-(q)$ sector of the orthogonal group. We consider applications relating to the fields of quantum information, quantum chaos, and quantum transport.", "url": "https://arxiv.org/abs/2607.05094", "type": "理论", "summary": "1. 该工作发展了一个统一的图解框架，用于描述具有粒子-空穴对称性的正交群和辛群中的布朗运动系综。\n2. 其技术核心在于计算了多项式平均至四阶，并为正交群中非连通SO⁻(q)扇区构建了正交不变插值。\n3. 这为分析量子混沌、量子输运及多体动力学中热化与信息 scrambling 的交叉行为提供了理论工具。", "summary_source": "deepseek", "authors": [{"name": "Zhiyang Tan"}, {"name": "Piet W. Brouwer"}], "featured_authors": [{"name": "Zhiyang Tan"}, {"name": "Piet W. Brouwer"}], "author_count": 2}, {"id": "2607.05107", "category": "quant-ph", "title": "Complementary 3D color codes for transversal quantum logic", "abstract": "Transversal logical gates provide a direct route to fault-tolerant quantum computation, but the Eastin-Knill theorem forbids a universal transversal gate set within a single quantum error-correcting code. We propose a hybrid architecture based on the tetrahedral three-dimensional color code and its Hadamard-transformed counterpart, which we call the H-tetrahedral code. The two encodings support complementary transversal non-Clifford operations. Combined with bitwise Hadamard transformations that switch between the two encodings and a one-way transversal logical CNOT from the tetrahedral code to the H-tetrahedral code, these operations realize an almost-universal transversal logical gate set that enables both the creation of entanglement and logical states with magic. We complete a universal gate set through a pieceably fault-tolerant round-robin construction of a logical controlled-$Z$ gate between two H-tetrahedral codes. This logical entangling gate is interleaved with reduced-overhead Steane-type syndrome extraction using logical two-dimensional color-code auxiliary qubits. Our construction provides a new route toward implementing classically hard-to-simulate quantum algorithms where magic and most entangling operations are transversal while the resource overhead is concentrated in a small number of non-transversal Clifford entangling operations.", "url": "https://arxiv.org/abs/2607.05107", "type": "理论+数值", "summary": "1. 该工作提出基于四面体三维色码及其Hadamard变换码的混合架构，在两种编码间切换并互补地实现横向非Clifford逻辑操作，辅以容错轮转构造，达成近乎通用的横向逻辑门集。\n2. 其核心在于利用按位Hadamard变换和单向横向CNOT衔接两种编码，并将非横向Clifford纠缠操作压缩至逻辑控制-Z门中，同时采用低开销Steane型辅助二维色码提取错误症状。\n3. 这为量子算法中魔态制备与多数纠缠操作横向化、仅将资源开销集中于少数受限操作提供了具体实现路径，进而有望降低容错量子计算的整体硬件代价。", "summary_source": "deepseek", "authors": [{"name": "Friederike Butt"}, {"name": "Luis Colmenarez"}, {"name": "Erik Weilandt"}, {"name": "Tom Peham"}, {"name": "Robert Wille"}, {"name": "Markus Müller"}], "featured_authors": [{"name": "Friederike Butt"}, {"name": "Luis Colmenarez"}, {"name": "Erik Weilandt"}, {"name": "Tom Peham"}, {"name": "Robert Wille"}, {"name": "Markus Müller"}], "author_count": 6}, {"id": "2607.05109", "category": "quant-ph", "title": "Characterisation of a satellite-to-ground channel for continuous variable quantum key distribution protocol", "abstract": "In space based quantum key distribution (QKD) protocols, the quantum channel will be dynamic in nature and the channel loss will change with respect to the zenith angle. In the context of continuous variable (CV)-QKD, this will cause issues with parameter estimation and for a transmitted local oscillator in particular it will also fluctuate the shot noise. Therefore, it is vital to characterise this channel loss and the sources of this loss. In this paper the varying channel loss is characterised under practical assumptions. This is shown for various different scenarios, turbulence strengths, as well as wavelengths. This work shows, for the channel parameters considered, it is possible to generate a positive secret key if restricted Eve security assumptions are made.", "url": "https://arxiv.org/abs/2607.05109", "type": "理论", "summary": "1. 该工作在实际假设下表征了面向连续变量量子密钥分发协议的星地信道动态损耗及其主要来源。\n2. 其卖点在于系统分析了不同天顶角、湍流强度和波长下信道损耗变化及由此导致的本地振荡器散粒噪声波动问题。\n3. 这为在受限Eve安全假设下实现星地CV-QKD正密钥生成提供了可行性依据，并为实际系统参数设计提供指导。", "summary_source": "deepseek", "authors": [{"name": "Emma Tien Hwai Medlock"}, {"name": "Vinod N. Roa"}, {"name": "Timothy Spiller"}, {"name": "Rupesh Kumar"}], "featured_authors": [{"name": "Emma Tien Hwai Medlock"}, {"name": "Vinod N. Roa"}, {"name": "Timothy Spiller"}, {"name": "Rupesh Kumar"}], "author_count": 4}, {"id": "2607.05112", "category": "quant-ph", "title": "Fragile single-cone Dirac quantum walks in two dimensions", "abstract": "It is known that a one-dimensional (1D) quantum walk gives a local space-time discretization of the massless Dirac equation with a single quasi-energy cone (no fermion doubling at low energies), keeping the fundamental symmetries (chiral and time-reversal) of the continuum theory. We show that the analogous 2D construction is fundamentally more fragile. Local two-band quantum walks can have an unpaired Dirac cone, but the protecting symmetries then cease to be ordinary on-site symmetries: they become non-symmorphic, involving half-lattice translations, and are broken by generic spatial inhomogeneities. In particular, we demonstrate that the 2D Dirac quantum walk based on the Ho-Chalker network model can be gapped by potential scattering.", "url": "https://arxiv.org/abs/2607.05112", "type": "理论", "summary": "1. 该工作研究二维局域两带量子行走，证明其无法在一维那种普通对称性下实现无费米子加倍的单狄拉克锥，单锥存在依赖于非对称保护且极易被破坏。\n2. 其关键物理发现是以Ho-Chalker网络为例，保护单锥的对称性必须包含半格平移（非对称操作），而此类对称性会被势散射等空间不均匀性破坏，导致狄拉克点打开能隙。\n3. 这揭示了二维量子行走中狄拉克锥保护的脆弱本质，为在量子模拟平台上实现无加倍相对论费米子设定了严格的对称性约束，并启发未来探索更鲁棒的拓扑设计方案。", "summary_source": "deepseek", "authors": [{"name": "C.W.J. Beenakker"}, {"name": "J. Sánchez Férnan"}, {"name": "J. Tworzydło"}], "featured_authors": [{"name": "C.W.J. Beenakker"}, {"name": "J. Sánchez Férnan"}, {"name": "J. Tworzydło"}], "author_count": 3}, {"id": "2607.05218", "category": "quant-ph", "title": "Quasi-holonomy in non-adiabatic quantum evolution", "abstract": "We develop a framework for quasi-holonomy in non-adiabatic quantum time evolution of subspaces along loops in a complex Grassmannian. By factoring the Schrödinger evolution into dynamical and connection-induced contributions in a moving basis, we obtain an effective geometric generator that depends explicitly on the dynamical propagator. This quasi-connection does not define a genuine connection on the original Grassmann bundle, since its gauge transformation law acquires a history-dependent, nonlocal term. Other ways of factoring the Schrödinger evolution are briefly discussed. All these approaches suffer from the same type of history-dependence, thereby defining transport of subspaces in which geometric and dynamical effects are generally intertwined, just as in the case of the quasi-holonomy. Our work sheds light on the issue of separating quantum evolution of subspaces into holonomic and dynamical parts from an essentially gauge-theoretic perspective.", "url": "https://arxiv.org/abs/2607.05218", "type": "理论", "summary": "1. 该工作构建了非绝热量子演化中沿Grassmannian环路子空间准和乐的理论框架。\n2. 通过分解薛定谔演化为动力学与联络贡献，导出依赖动力学传播子的有效几何生成元，揭示准联络因历史依赖不构成真联络。\n3. 这为从规范理论视角分离子空间量子演化中的和乐与动力学效应提供了洞察，尽管两者在准和乐中本质交织。", "summary_source": "deepseek", "authors": [{"name": "Erik Sjöqvist"}, {"name": "Adam Fredriksson"}], "featured_authors": [{"name": "Erik Sjöqvist"}, {"name": "Adam Fredriksson"}], "author_count": 2}, {"id": "2607.05361", "category": "quant-ph", "title": "Coherent Control of Energy Transport at Room Temperature in a Noisy Bath", "abstract": "Coherent control of energy transport in a non-equilibrium steady-state (NESS) in a reaction-center-connected donor-acceptor pair is proposed. The pigments are considered to be continuously interacting with incoherent radiation and a phonon bath while being driven by phase-controlled coherent fields. Coherent excitation of the donor-acceptor pair is shown to induce interference between excitation pathways, resulting in phase dependent modulation of the flux. As a consequence one can enhance or suppress energy transfer via interference, e.g. an optical energy switch. The persistence of such interference enables coherent control at a NESS in dissipative regime suggests an extension of the operational scope of quantum control from traditional transient domain with low dissiaption to noisy environment NESS at room temperature.", "url": "https://arxiv.org/abs/2607.05361", "type": "理论", "summary": "1. 该工作提出在室温噪声环境中，通过相位控制的相干光场驱动与反应中心相连的给体-受体对，实现非平衡稳态下能量传输的相干控制。\n2. 其核心在于持续存在的激发路径干涉效应使能量通量产生相位依赖调制，从而可增强或抑制能量转移，实现光学能量开关功能。\n3. 这为将量子控制从传统低耗散瞬态领域拓展至室温耗散环境的非平衡稳态提供了实验可行性与物理基础。", "summary_source": "deepseek", "authors": [{"name": "Davinder Singh"}, {"name": "Paul Brumer"}], "featured_authors": [{"name": "Davinder Singh"}, {"name": "Paul Brumer"}], "author_count": 2}];
    const categoryOrder = ["cond-mat", "hep-th", "math-ph", "quant-ph"];
    const typeOrder = ["理论", "数值", "理论+数值", "实验"];
    const state = { search: "", categories: new Set(categoryOrder), types: new Set(typeOrder) };
    const statsEl = document.getElementById("stats");
    const gridEl = document.getElementById("paper-grid");
    const resultCountEl = document.getElementById("result-count");
    const emptyStateEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search");
    function typeClass(type) { if (type === "理论") return "type-theory"; if (type === "数值") return "type-numeric"; if (type === "实验") return "type-experimental"; return "type-both"; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function renderAuthors(paper) {
      const authors = paper.featured_authors || [];
      if (!authors.length) {
        return `<section class="author-block"><div class="author-label">作者</div><div class="author-note">未提取到作者信息。</div></section>`;
      }
      const items = authors.map((author) => `<li class="author-item"><strong>${escapeHtml(author.name)}</strong></li>`).join("");
      const note = paper.author_count > authors.length ? `显示前 3 位与后 3 位作者，共 ${paper.author_count} 位` : `共 ${paper.author_count} 位作者`;
      return `<section class="author-block"><div class="author-label">作者</div><ul class="author-list">${items}</ul><div class="author-note">${note}</div></section>`;
    }
    function statCard(label, value) { return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div></article>`; }
    function renderStats() {
      const categoryCounts = Object.fromEntries(categoryOrder.map((cat) => [cat, 0]));
      const typeCounts = Object.fromEntries(typeOrder.map((type) => [type, 0]));
      papers.forEach((paper) => { categoryCounts[paper.category] += 1; typeCounts[paper.type] += 1; });
      statsEl.innerHTML = [statCard("筛出论文", papers.length), ...categoryOrder.map((cat) => statCard(cat, categoryCounts[cat])), ...typeOrder.map((type) => statCard(type, typeCounts[type]))].join("");
    }
    function renderChips(containerId, values, selectedSet, onToggle, attrName) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map((value) => {
        const extra = attrName ? `${attrName}="${value}"` : "";
        const active = selectedSet.has(value) ? "active" : "";
        return `<button class="chip ${active}" type="button" data-value="${value}" ${extra}>${value}</button>`;
      }).join("");
      container.querySelectorAll(".chip").forEach((button) => button.addEventListener("click", () => onToggle(button.dataset.value)));
    }
    function toggleFromSet(set, value) { if (set.has(value)) { if (set.size > 1) set.delete(value); } else { set.add(value); } }
    function matches(paper) {
      const authorText = (paper.authors || []).map((author) => author.name).join(" ");
      const haystack = [paper.id, paper.category, paper.type, paper.title, paper.abstract, paper.summary, authorText].join(" ").toLowerCase();
      return state.categories.has(paper.category) && state.types.has(paper.type) && haystack.includes(state.search);
    }
    function renderPapers() {
      const filtered = papers.filter(matches);
      resultCountEl.textContent = `当前显示 ${filtered.length} / ${papers.length} 篇`;
      emptyStateEl.style.display = filtered.length ? "none" : "block";
      gridEl.innerHTML = filtered.map((paper) => {
        const safeUrl = escapeHtml(paper.url);
        return `
        <article class="paper">
          <div class="paper-top"><span class="tag category">${escapeHtml(paper.category)}</span><span class="tag ${typeClass(paper.type)}">${escapeHtml(paper.type)}</span></div>
          <div class="id">arXiv:${escapeHtml(paper.id)}</div>
          <h2><a href="${safeUrl}" target="_blank" rel="noreferrer">${escapeHtml(paper.title)}</a></h2>
          ${renderAuthors(paper)}
          <p class="summary">${escapeHtml(paper.summary)}</p>
          <details><summary>查看英文原文摘要</summary><p>${escapeHtml(paper.abstract)}</p></details>
          <footer><span>${paper.summary_source === "deepseek" ? "DeepSeek three-sentence PRL summary" : (paper.summary_source === "local-fallback" ? "Local three-sentence fallback" : (paper.summary_source === "translation" ? "Chinese abstract translation" : "Chinese placeholder fallback"))}</span><a href="${safeUrl}" target="_blank" rel="noreferrer">Open arXiv</a></footer>
        </article>`;
      }).join("");
    }
    function rerenderFilters() {
      renderChips("category-filters", categoryOrder, state.categories, (value) => { toggleFromSet(state.categories, value); rerenderFilters(); renderPapers(); });
      renderChips("type-filters", typeOrder, state.types, (value) => { toggleFromSet(state.types, value); rerenderFilters(); renderPapers(); }, "data-type");
    }
    searchEl.addEventListener("input", (event) => { state.search = event.target.value.trim().toLowerCase(); renderPapers(); });
    renderStats();
    rerenderFilters();
    renderPapers();
  </script>
</body>
</html>
