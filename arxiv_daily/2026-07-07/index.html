ing converts the charger's coherence into charger--battery entanglement and splits the deposited work between a locally extractable part and a correlation-locked part accessible only through joint operations; for a qubit, the split obeys an exact complementarity, and at maximal coherence, the battery is locally passive with the entire charge locked in correlations. Robustness follows local accessibility: the stored energy and locally extractable work are population-based, immune to pure dephasing, and limited only by relaxation, with an energy half-life, whereas the correlation-locked work is fragile to both dephasing and relaxation. Dephasing, global and local depolarization, and amplitude damping are treated through a single gain--loss competition algebra, and the resulting storage lifetimes are made concrete with superconducting-transmon parameters.", "url": "https://arxiv.org/abs/2607.02810", "type": "理论", "summary": "1. 该工作引入了一个可解的充电器-量子电池模型，其中量子相干性同时控制电荷的存储位置及其抵抗噪声的鲁棒性。\n2. 其核心在于充电过程将相干性转化为纠缠，使功分裂为局域可提取部分与关联锁定部分，且对单量子比特满足精确互补关系，最大相干时电池局域被动。\n3. 这揭示了基于布居数的局域可提取功对纯退相免疫而仅受弛豫限制，关联锁定功则对两者脆弱，为设计具有可调鲁棒性的量子电池提供了代数框架与具体实现参数。", "summary_source": "deepseek", "authors": [{"name": "Asad Ali"}, {"name": "Saif Al-kuwari"}, {"name": "James Q. Quach"}], "featured_authors": [{"name": "Asad Ali"}, {"name": "Saif Al-kuwari"}, {"name": "James Q. Quach"}], "author_count": 3}, {"id": "2607.02989", "category": "quant-ph", "title": "Error-tolerant secure key leasing for quantum decryption keys in public-key encryption", "abstract": "We propose the first error-tolerant secure key leasing (SKL) for public-key encryption. As with SKL in prior works, our protocol consists of a lessor and lessee. In the protocol, the lessor encodes its secret key into quantum states and leases the key to the lessee. Then, the lessor can ask the lessee to return the secret key at a later point. The lessor is able to check whether the lessee has returned its key honestly. However, our protocol works even when the leased secret key is subject to noise. The lessee decrypts the ciphertext correctly, and the lessor verifies the return of the secret key correctly when the amount of error is below a certain threshold. Our improved protocol does not change the encoding of the secret key, and thus adds no overhead to the quantum information processing. Our most significant result is a framework to analyze the trade-off between robustness against error and security. We bridge the security of the error-tolerant SKL and that of the error-tolerant certified deletion with shortened codes, which is a relatively less explored concept in coding theory.", "url": "https://arxiv.org/abs/2607.02989", "type": "理论", "summary": "1. 该工作提出了首个容错安全密钥租赁协议，用于公钥加密系统中量子解密密钥的租赁与归还验证。\n2. 其技术核心在于协议在密钥噪声下仍能保证正确解密和诚实归还验证，且不改变密钥编码方式，不引入额外量子处理开销。\n3. 该工作建立了容错性与安全性权衡的分析框架，将容错安全密钥租赁与基于缩短码的容错认证删除的安全相联系，为编码理论和量子密码学提供了新方向。", "summary_source": "deepseek", "authors": [{"name": "Duo Xu"}, {"name": "Yuki Takeuchi"}], "featured_authors": [{"name": "Duo Xu"}, {"name": "Yuki Takeuchi"}], "author_count": 2}, {"id": "2607.02997", "category": "quant-ph", "title": "Symmetry-Resolved Parent Hamiltonians for Entangled Bosonic Cat Resources", "abstract": "We derive parent Hamiltonians in terms of oscillator operators for multimode bosonic cat resource states. The construction separates a universal branch Hamiltonian, which confines each mode to the coherent-state support $ |\\pm\\alpha\\rangle$, and state-dependent constraint Hamiltonians, which select the desired correlations and symmetry sectors inside the resulting branch manifold. This framework progressively removes degeneracies in the low-energy manifold and yields explicit parent Hamiltonians for GHZ-, cluster-, and W-type cat states. In the large-$|\\alpha|$ limit, the bosonic parent Hamiltonians reduce to stabilizer or exchange Hamiltonians acting on an effective logical-qubit basis. The present construction provides a direct bridge between coherent-state bosonic engineering and stabilizer-based quantum information processing.", "url": "https://arxiv.org/abs/2607.02997", "type": "理论+数值", "summary": "1. 该工作针对多模玻色子猫资源态，以振荡器算符形式推导出相应的母哈密顿量。\n2. 其构造将通用分支哈密顿量与态依赖约束哈密顿量分离，并在大|α|极限下退化为作用于有效逻辑量子比特的稳定子或交换哈密顿量。\n3. 这为相干态玻色子工程与基于稳定子的量子信息处理之间提供了直接的理论桥梁。", "summary_source": "deepseek", "authors": [{"name": "Šimon Bräuer"}, {"name": "Klaus Mølmer"}], "featured_authors": [{"name": "Šimon Bräuer"}, {"name": "Klaus Mølmer"}], "author_count": 2}, {"id": "2607.03164", "category": "quant-ph", "title": "Geometric modulation of transition and survival intensities in non-Hermitian systems", "abstract": "The time evolution of non-Hermitian systems is generally nonunitary. Dynamics governed by time-dependent non-Hermitian Hamiltonians lead to a variety of novel phenomena, one of which is state amplification or suppression induced by the complex Berry phase. Here, we extend the framework of geometric modulation to multi-level systems and show that both transition and survival intensities can be modulated. We apply our theory to the non-Hermitian Landau-Zener (LZ) problem. First, we show that, in the half-LZ problem, both the transition and survival probabilities exhibit nonreciprocity due to the complex Berry phase. In the non-Hermitian standard LZ problem, only the survival intensity is known to exhibit nonreciprocity, whereas the transition intensity does not. However, the physical origin of this nonreciprocal behavior remains unclear. In this work, we show that the nonreciprocity originates from the complex Berry phase.", "url": "https://arxiv.org/abs/2607.03164", "type": "理论+数值", "summary": "1. 该工作将几何调制框架推广至多能级非厄米系统，证明了跃迁与存活强度均可被复贝里相位调控。\n2. 其主要技术贡献在于揭示了非厄米标准朗道-齐纳问题中存活强度非互易性的物理根源是复贝里相位，而半朗道-齐纳问题中两者皆呈现非互易性。\n3. 这为利用几何相位主动操控非厄米量子系统的动力学行为及探索相关量子效应提供了明确的理论路径。", "summary_source": "deepseek", "authors": [{"name": "Ryu Frieson"}, {"name": "Takashi Oka"}, {"name": "Hideaki Obuse"}], "featured_authors": [{"name": "Ryu Frieson"}, {"name": "Takashi Oka"}, {"name": "Hideaki Obuse"}], "author_count": 3}, {"id": "2607.03187", "category": "quant-ph", "title": "Quantum Kolmogorov--Arnold representation theorem for continuous unitary-valued maps", "abstract": "The classical Kolmogorov--Arnold representation theorem states that any continuous multivariate function can be exactly decomposed into a finite composition of univariate continuous functions and addition operations. This foundational result has recently inspired the development of Kolmogorov--Arnold Networks (KANs) in classical machine learning, as well as their extensions into the quantum domain (QKANs). In this paper, we establish two quantum analogues of the Kolmogorov--Arnold representation theorem for continuous unitary-valued maps of several variables within an open $1$-neighbourhood of the identity matrix \\(O_1(\\mathbf{I}) \\subset \\mathcal{U}(n)\\). First, we prove a representation theorem that yields an exact additive decomposition inside the matrix exponent of anti-Hermitian-valued maps. Second, due to the non-commutative nature of quantum operators, we derive a factorised version expressing the target unitary map as a finite sequential product of univariate matrix exponentials. Finally, we provide a concrete topological counterexample based on the lifting property of \\(\\mathcal{SU}(2)\\) to demonstrate that these local representation theorems cannot be globally extended to the entire unitary group \\(\\mathcal{U}(n)\\) without encountering fundamental structural obstructions.", "url": "https://arxiv.org/abs/2607.03187", "type": "理论+数值", "summary": "1. 该工作建立了连续酉值映射在单位矩阵邻域内的两种量子Kolmogorov-Arnold表示定理，分别基于反厄密值映射的加性分解与酉算子的因式分解。\n2. 其核心在于通过非交换性导出有限单变量矩阵指数顺序乘积的精确表示，并指出此类局部定理因SU(2)提升障碍不可全局推广至整个酉群。\n3. 这为量子KAN网络的结构性设计提供了数学基础，并提示多变量酉映射表示存在由非对易性导致的根本限制。", "summary_source": "deepseek", "authors": [{"name": "Sviatoslav V. Dzhenzher"}], "featured_authors": [{"name": "Sviatoslav V. Dzhenzher"}], "author_count": 1}, {"id": "2607.03218", "category": "quant-ph", "title": "Quantum Annealing for Dynamic Portfolio Optimization under Realistic Transaction Costs", "abstract": "This paper investigates and compares quantum and classical investment strategies for portfolio construction under realistic trading and allocation constraints. The study considers a multi-period portfolio re-balancing setting in which asset weights are subject to lower and upper bounds, class-level exposure restrictions, and turnover limitations. On the quantum side, the portfolio selection problem is reformulated as a quadratic unconstrained binary optimization (QUBO) model through a finite binary encoding of asset weights, and subsequently embedded into a constrained quadratic model (CQM) solved by a hybrid quantum-classical optimization workflow. On the classical side, benchmark allocation strategies are introduced to provide an economically meaningful reference for performance assessment. The proposed framework jointly evaluates portfolio efficiency from two complementary perspectives: business performance, measured through return, volatility, and a measure of the trade-off between them, the Sharpe ratio; and computational performance, assessed through solver structure, constraint handling, and hardware execution characteristics. The resulting comparison provides a rigorous basis for understanding the practical role of quantum annealing in constrained portfolio optimization, while clarifying both its modeling advantages and its current implementation limitations relative to established classical approaches.", "url": "https://arxiv.org/abs/2607.03218", "type": "理论+数值", "summary": "1. 该工作研究了量子退火在考虑现实交易成本的多周期投资组合优化中的性能，并与经典策略进行了系统性比较。\n2. 其核心在于将资产权重有限二进制编码为二次无约束二元优化模型，通过混合量子经典工作流求解，并从业务与计算性能双重视角联合评估。\n3. 这为理解量子退火在受约束金融优化中的实际优势与当前实现局限提供了严谨的量化基础。", "summary_source": "deepseek", "authors": [{"name": "Escolástico Sánchez-Martínez"}, {"name": "Senaida Hernandez Santana"}, {"name": "Ventura Sarasa Laborda"}, {"name": "Pablo Serrano Molinero"}, {"name": "Guillermo Botella Juan"}, {"name": "Alberto del Barrio García"}], "featured_authors": [{"name": "Escolástico Sánchez-Martínez"}, {"name": "Senaida Hernandez Santana"}, {"name": "Ventura Sarasa Laborda"}, {"name": "Pablo Serrano Molinero"}, {"name": "Guillermo Botella Juan"}, {"name": "Alberto del Barrio García"}], "author_count": 6}, {"id": "2607.03235", "category": "quant-ph", "title": "A Galton-Watson estimate for Dyson series", "abstract": "We consider the question of convergence of particular series of integrals, which are labeled by rooted trees. Necessary and sufficient criteria for convergence are obtained, together with an explicit expression for the sum. The technique used is strongly reminiscent of the generating function approach of Galton and Watson to branching processes. The interest in these series derives from the Dyson series expansion for the perturbation of a free quantum dynamics by a local potential: the convergence of the series imlies that the perturbed dynamics exists and is unitarily equivalent with the free one.", "url": "https://arxiv.org/abs/2607.03235", "type": "理论", "summary": "1. 该工作为以根树标记的积分级数建立了收敛的充要条件，并给出了级数和的显式表达式。\n2. 其技术核心是将Galton–Watson分支过程生成函数方法应用于Dyson级数，从而将级数收敛性与自由动力学的酉等价性直接关联。\n3. 这为判断局部势微扰下量子动力学的存在性与酉等价性提供了基于分支过程理论的严格判据。", "summary_source": "deepseek", "authors": [{"name": "Hans Maassen"}, {"name": "Dmitri Botvich"}], "featured_authors": [{"name": "Hans Maassen"}, {"name": "Dmitri Botvich"}], "author_count": 2}, {"id": "2607.03274", "category": "quant-ph", "title": "False vacuum decay in long-range interacting quantum systems", "abstract": "We formulate false-vacuum decay in a mixed-field Ising chain with $1/r^\\alpha$ interactions as a spatially nonlocal Euclidean $\\phi^4$ theory featuring a fractional spatial kinetic term $\\sim |q|^\\sigma$, where $\\sigma=\\alpha-1$. The nonlocal bounce is anisotropic in space-time and develops algebraic spatial tails, challenging the standard thin-wall picture of a compact droplet. Combining thin-wall arguments with numerical solutions of the full nonlocal saddle, we show that these tails preserve the leading thin-wall exponents, manifesting instead in subleading corrections. For $0<\\sigma<1$, the lifetime exponent scales with the energy bias $h$ of the metastable state as $B\\sim h^{-1/\\sigma}$; for $1<\\sigma<2$, the leading Coleman scaling $B\\sim h^{-1}$ is recovered, while long-range effects are retained in the subdominant term $\\sim h^{\\sigma-2}$. Our results show that tunable long-range interactions fundamentally reshape bubble nucleation and alter false-vacuum decay in quantum simulators.", "url": "https://arxiv.org/abs/2607.03274", "type": "理论+数值", "summary": "1. 该工作将具有长程相互作用（幂律1/r^α）混合场伊辛链中的假真空衰变表述为非局域欧几里得φ⁴理论，并数值求解了空间各向异性的非局域瞬子解。\n2. 其核心发现是非局域瞬子代数尾部的存在改变了标准薄壁图像，使得衰变寿命指数在σ=α-1<1与>1时分别服从B~h^{-1/σ}和恢复Coleman标度B~h^{-1}，但次领头项仍保留长程效应。\n3. 这揭示了可调长程相互作用从根本上重塑气泡成核的机制，为量子模拟器中通过控制相互作用范围调控亚稳态衰变动力学提供了理论指导。", "summary_source": "deepseek", "authors": [{"name": "Valerio Pagni"}, {"name": "Laura Batini"}, {"name": "Nicolò Defenu"}], "featured_authors": [{"name": "Valerio Pagni"}, {"name": "Laura Batini"}, {"name": "Nicolò Defenu"}], "author_count": 3}, {"id": "2607.03278", "category": "quant-ph", "title": "Complexity of Normalized Persistence Problems for Topological Data Analysis and Local Hamiltonians", "abstract": "Topological data analysis (TDA) is a machine learning technique that uses topology to extract patterns from data and has shown the potential to exhibit quantum advantage. A key concept in TDA is persistent homology, which measures the robustness of topological information at different lengthscales. In this paper, we introduce and study the problem of normalized persistence, a practically motivated and easily interpretable version of persistent homology that counts the fraction of holes that persist at different lengthscales. We prove that a variant of normalized persistence is $\\mathsf{DQC}_1$-hard and contained in $\\mathsf{BQP}$, giving evidence of an exponential quantum speedup for TDA under the standard assumption that $\\mathsf{DQC}_1 \\not\\subseteq \\mathsf{BPP}$. These are the first $\\mathsf{DQC}_1$-hardness results that are directly applicable to TDA instances. We also find a close connection between normalized persistence and the complexity of estimating spectral quantities in the low-energy subspace of local Hamiltonians. We study a family of such problems, including a low-energy normalized subtrace and spectral density. We show that these are $\\mathsf{DQC}_1$-hard for $O(1)$-local Hamiltonians, strengthening previous results that required log-local interactions. We also introduce a variant of $\\mathsf{DQC}_1$ with perfect completeness ($\\mathsf{SDQC}_1$) to characterize the hardness of problems normalized by an exact kernel. This includes normalized persistence for $O(1)$-local Hamiltonians, which we show is $\\mathsf{SDQC}_1$-hard.", "url": "https://arxiv.org/abs/2607.03278", "type": "理论+数值", "summary": "1. 该工作引入标准化持续同调问题，即计算各长度尺度下持续空洞的分数，并证明其变体为DQC1-难且包含于BQP。\n2. 关键卖点在于首次为拓扑数据分析实例建立DQC1-难结果并揭示与O(1)-局部哈密顿量低能谱量估计的等价性，同时引入SDQC1类刻画精确核归一化问题时进一步显示O(1)-局部哈密顿量的标准化持续同调为SDQC1-难。\n3. 这为拓扑数据处理的量子加速提供了复杂性理论支撑，并将持续同调、谱计算与局域哈密顿量结构深刻关联，导向新量子算法设计的启发。", "summary_source": "deepseek", "authors": [{"name": "Dominic Lowe"}, {"name": "M.S. Kim"}, {"name": "Roberto Bondesan"}, {"name": "Ryu Hayakawa"}], "featured_authors": [{"name": "Dominic Lowe"}, {"name": "M.S. Kim"}, {"name": "Roberto Bondesan"}, {"name": "Ryu Hayakawa"}], "author_count": 4}, {"id": "2607.03295", "category": "quant-ph", "title": "Quantum Probability and Quantum Information Theory", "abstract": "This is an introductory course on quantum probability and quantum information, based on matrix algebras.", "url": "https://arxiv.org/abs/2607.03295", "type": "理论", "summary": "1. 本课程以矩阵代数（包括C*代数与von Neumann代数）为数学框架，系统阐述量子概率论中非交换概率空间、态与效应的代数表征，涵盖密度矩阵、POVM与完全正映射等核心概念，并由此引出量子信息论中数据压缩、信道容量与纠错码的核心定理。\n2. 其关键技术特色在于运用代数方法（如GNS构造与Stinespring扩张）严格定义量子熵、量子互信息与量子信道容量，并通过代数熵与相对熵揭示经典概率与量子概率的本质差异。\n3. 该代数统一视角为深入研究量子纠缠、量子热力学与量子计算复杂性等前沿问题提供了严谨而简洁的数学语言，也为发展新型量子算法与量子密码协议奠定了理论基础，并启发了经典概率论的非交换推广。", "summary_source": "deepseek", "authors": [{"name": "Hans Maassen"}], "featured_authors": [{"name": "Hans Maassen"}], "author_count": 1}, {"id": "2607.03337", "category": "quant-ph", "title": "An End-to-End Multi-Stage Kill-Chain Attack on Quantum Neural Networks: Demonstration on Trapped-Ion Hardware", "abstract": "We demonstrate an end-to-end, multi-stage attack against a quantum neural network (QNN) model that is executed on a trapped-ion quantum computer. Our chain combines side-channel reconnaissance, crosstalk characterization, adversarial example generation, and a physical crosstalk attack that realizes the adversarial perturbation on the device. We cover the full attack chain on ion traps and report the corresponding superconducting-hardware experiments in the appendix. We discuss implications for QaaS providers and hardware mitigations.", "url": "https://arxiv.org/abs/2607.03337", "type": "实验", "summary": "1. 本工作在囚禁离子量子计算机上演示了一种针对量子神经网络的端到端多阶段杀伤链攻击。\n2. 该攻击链结合侧信道侦察、串扰表征、对抗样本生成与物理串扰攻击，在硬件上实际实现了对抗扰动。\n3. 此工作揭示了量子即服务(QaaS)场景下的安全漏洞，并为硬件级防御策略提供了明确方向。", "summary_source": "deepseek", "authors": [{"name": "Cedric Brügmann"}, {"name": "Daniel Herr"}, {"name": "Daniel Ohl de Mello"}, {"name": "Pascal Debus"}, {"name": "Maximilian Wendlinger"}, {"name": "Kilian Tscharke"}, {"name": "Juris Ulmanis"}, {"name": "Alexander Erhard"}, {"name": "Arthur Schmidt"}, {"name": "Fabian Petsch"}], "featured_authors": [{"name": "Cedric Brügmann"}, {"name": "Daniel Herr"}, {"name": "Daniel Ohl de Mello"}, {"name": "Alexander Erhard"}, {"name": "Arthur Schmidt"}, {"name": "Fabian Petsch"}], "author_count": 10}, {"id": "2607.03361", "category": "quant-ph", "title": "Nested-Loop Trajectory-Informed Variational Quantum Solver for Interior-Point OPF", "abstract": "Optimal power flow (OPF) solved by an interior-point method (IPM) requires repeatedly solving Newton linear systems. When variational quantum linear solvers (VQLS) are used, each IPM iteration involves an additional nested inner variational optimization loop, which can significantly slow the overall quantum-assisted IPM convergence. To address this challenge, this paper proposes a dual-level trainable quantum IPM framework for OPF that leverages early solver-generated trajectories rather than relying on single-point prediction. The key observation is that early IPM iterates provide informative primal-dual, slack, and barrier-variable evolution about the path to optimality, while early VQLS parameter updates provide useful information about the later variational search. At the quantum-solver level, a trainable parameter model uses a short prefix of the VQLS parameter trajectory to project the remaining variational search toward a lower-cost region. At the OPF-solver level, a second trainable model uses early primal-dual IPM iterates to project a later central path state, which is restored to an admissible point before IPM refinement continues. Simulation studies show that the proposed approach reduces the number of variational updates by up to $95\\%$ while maintaining OPF objective values close to the classical IPM reference. A 2-bus demonstration on real quantum hardware is also included to validate the implementation of the proposed workflow.", "url": "https://arxiv.org/abs/2607.03361", "type": "理论+数值", "summary": "1. 该工作针对内点法最优潮流中反复求解牛顿线性系统的瓶颈，提出一个双层次可训练量子框架，利用早期迭代轨迹加速变分量子线性求解器的收敛。\n2. 核心技术在于量子求解器层用VQLS参数轨迹前缀预测后续变分搜索，OPF层用早期原始-对偶轨迹投影中心路径，从而将变分更新次数降低高达95%。\n3. 在保持目标值接近经典参考精度的同时，该方案在2母线真实量子硬件上完成演示，为量子加速电力系统优化提供了可验证的实用路径。", "summary_source": "deepseek", "authors": [{"name": "Farshad Amani"}, {"name": "Amin Kargarian"}], "featured_authors": [{"name": "Farshad Amani"}, {"name": "Amin Kargarian"}], "author_count": 2}, {"id": "2607.03409", "category": "quant-ph", "title": "Symmetry-Protected Quantum Synchronization in Squeezed-Bath-Engineered Superradiance", "abstract": "A squeezed dissipative bath converts the coupling phase of a bipartite unconventional Dicke model into a control parameter that suppresses both static superradiant thresholds, opening a window where only a Hopf instability survives and the two spin ensembles synchronize completely via the shared cavity mode. The squeezed bath preserves a $\\mathbb{Z}_2$ parity symmetry, so conventional broken-symmetry diagnostics vanish identically. We certify the synchronized state instead through parity-even, information-theoretic witnesses: a 30\\% photon-number suppression, a Husimi-$Q$ lobe-count change, a 64\\% suppression of spin--spin mutual information, and a robust discord-to-mutual-information ratio $D/I = 0.50 \\pm 0.05$, confirmed by full quantum master-equation simulations. These results establish parity-even witnesses as a general, entanglement-free route to certifying quantum synchronization in symmetry-protected driven-dissipative systems.", "url": "https://arxiv.org/abs/2607.03409", "type": "理论+数值", "summary": "1. 该工作通过压缩耗散浴将双系综非传统Dicke模型的耦合相位转化为控制参数，抑制静态超辐射阈值并仅保留Hopf不稳定性，实现两自旋系综经由共享腔模的完全量子同步。\n2. 其核心在于利用压缩浴保持的ℤ₂宇称对称性，使得传统破缺序参量失效，转而采用宇称偶信息论证人（光子数抑制30%、Husimi-Q瓣数变化、自旋互信息抑制64%以及D/I=0.50±0.05）可靠地认证同步态。\n3. 这为在对称保护驱动-耗散系统中建立无纠缠的量子同步认证通用框架提供了明确途径，有望推广至其他受对称性保护的远平衡量子多体体系。", "summary_source": "deepseek", "authors": [{"name": "Juan David Álvarez-Cuartas"}, {"name": "Joakim Bergli"}, {"name": "John H. Reina"}], "featured_authors": [{"name": "Juan David Álvarez-Cuartas"}, {"name": "Joakim Bergli"}, {"name": "John H. Reina"}], "author_count": 3}, {"id": "2607.03429", "category": "quant-ph", "title": "Matter-Field Exchange Generates Entanglement, Not Classical Gravity", "abstract": "Aziz and Howl have argued that a hybrid theory with quantum matter and a classical gravitational field can generate entanglement between two massive systems. In their construction, the branch-dependent contribution appears at fourth order through propagators of the quantum matter field in a fixed classical gravitational potential. We analyse this mechanism within the same perturbative QFT framework and show that the effect should not be interpreted as classical gravity mediating entanglement in the sense relevant to BMV-type witnesses. The non-separable term relies on a quantum-matter exchange channel between the two interferometers and is present only when the two systems are modelled as excitations of the same matter field. If distinct, non-interconverting matter fields describe the systems, the corresponding cross-propagator is absent and the Aziz-Howl entangling diagram vanishes. The effect relies on coherent propagation amplitudes of the quantum matter field between the two interferometers, together with postselection onto the original localised branch subspace. Moreover, the inference of entanglement is made after projecting the full QFT evolution onto a restricted final subspace containing the original localised $N$-particle branch states. This projection removes precisely the sectors that would record matter-field contamination, mode deformation, or exchange between the two interferometers. We therefore argue that the Aziz-Howl mechanism is a matter-sector cross-talk effect in a classical background, not entanglement mediated by classical gravitational degrees of freedom. Having identified the channel responsible for the Aziz-Howl contribution, we predict that it can be eliminated by using distinct, non-interconverting matter species in the two interferometers, or by inserting a barrier that suppresses matter-field propagation between them.", "url": "https://arxiv.org/abs/2607.03429", "type": "理论", "summary": "1. 该工作分析了Aziz-Howl机制中量子物质与经典引力场产生纠缠的微扰QFT过程，证明其并非经典引力介导的纠缠。\n2. 卖点在于揭示非可分项源于同一量子物质场在两干涉仪间的相干传播与后选择投影，且当使用不同、非互转物质场时该效应消失。\n3. 这为BMV型纠缠见证实验提供了关键指导：通过采用不同物质物种或插入势垒抑制物质场交换，可排除误导性纠缠来源。", "summary_source": "deepseek", "authors": [{"name": "Nicetu Tibau Vidal"}, {"name": "Aditya Varna Iyer"}], "featured_authors": [{"name": "Nicetu Tibau Vidal"}, {"name": "Aditya Varna Iyer"}], "author_count": 2}, {"id": "2607.03438", "category": "quant-ph", "title": "Dynamical zero modes, boundary dependence, and numerical instability in dynamical quantum phase transitions", "abstract": "Boundary conditions are usually expected to cause only finite-size corrections to bulk quantities, but this expectation can fail for dynamical quantum phase transitions. In this work, we show that such boundary dependence is encoded in dynamical zero modes (DZMs) of the Loschmidt matrix, which are defined as singular vectors whose singular values vanish in the thermodynamic limit. Using the Su-Schrieffer-Heeger (SSH) and extended SSH models as examples, we find that the time interval where the Loschmidt rate functions (LRFs) under periodic and open boundary conditions differ coincides with the emergence of DZMs in the open-boundary Loschmidt matrix. These modes carry the boundary-dependent contribution: removing them from the open-boundary LRF recovers the periodic-boundary result. We further show that these DZMs lead to finite-precision numerical instability, since their finite-size singular values decay exponentially with system size and eventually become unresolved in fixed-precision arithmetic. A reliable small-size branch before this loss of precision can be used to estimate the thermodynamic LRF by linear extrapolation. Our results identify DZMs as both a diagnostic of boundary-dependent LRFs and the origin of the associated numerical instability.", "url": "https://arxiv.org/abs/2607.03438", "type": "理论+数值", "summary": "1. 该工作揭示动力学量子相变中边界条件敏感的Loschmidt率函数源于Loschmidt矩阵的动力学零模式。\n2. 其核心在于动力学零模式携带边界依赖贡献，移除后开放边界结果与周期边界一致，且其奇异值指数衰减导致有限精度数值不稳定。\n3. 这为利用小尺寸分支线性外推可靠估计热力学极限Loschmidt率函数提供了明确途径。", "summary_source": "deepseek", "authors": [{"name": "Siyan Lin"}, {"name": "Xu Feng"}, {"name": "Xiuhua Tian"}, {"name": "Shu Chen"}], "featured_authors": [{"name": "Siyan Lin"}, {"name": "Xu Feng"}, {"name": "Xiuhua Tian"}, {"name": "Shu Chen"}], "author_count": 4}, {"id": "2607.03468", "category": "quant-ph", "title": "Superposed circular motion Unruh effect in (3+1) dimensions", "abstract": "Using a recently-introduced quantum control model for Unruh-DeWitt detectors in superpositions of classical trajectories, we investigate the response of a detector interacting with a massless scalar quantum field in (3+1) dimensions along a superposition of circular trajectories. We present numerical results for the transition probability and effective temperature of such a detector in four distinct geometric scenarios: (a) concentric, vertically-stacked trajectories, (b) planar, horizontally-displaced trajectories, (c) static central point and surrounding circular trajectory, and (d) concentric, planar circular trajectories. For Gaussian switching functions that are much broader than the acceleration timescale, in case (a) we find only minor deviations from the well-known, effectively thermal response of a single circular trajectory, whereas in case (c) we find a significant reduction in the effective temperature and greater variation with energy gap. We conclude with a discussion of a potential analogue implementation in ultracold atom systems.", "url": "https://arxiv.org/abs/2607.03468", "type": "理论+数值", "summary": "1. 该工作利用量子控制模型研究了(3+1)维无质量标量场中沿叠加圆周轨迹运动的Unruh-DeWitt探测器的跃迁概率与有效温度。\n2. 其核心发现在于四种几何场景下有效温度的差异：同心垂直堆叠轨迹与单圆轨迹的响应接近热化，而静态中心点加环绕圆轨迹则显著降低有效温度并增强能隙依赖。\n3. 这为在超冷原子系统中实现叠加轨迹Unruh效应的模拟实验提供了可行方案，并可能揭示量子相干性对非惯性系热化的影响。", "summary_source": "deepseek", "authors": [{"name": "Taylor Cey"}, {"name": "Cisco Gooding"}, {"name": "Robert Mann"}], "featured_authors": [{"name": "Taylor Cey"}, {"name": "Cisco Gooding"}, {"name": "Robert Mann"}], "author_count": 3}, {"id": "2607.03486", "category": "quant-ph", "title": "Semiclassical Langevin dynamics of long-range dissipative time crystals", "abstract": "We develop a semiclassical Langevin approach to study finite-size effects in dissipative time-crystalline spin systems. For a spin-$1/2$ model with power-law Lindblad operators, we find finite-size oscillations exponentially decaying in time, and their decay rate decreases algebraically with system size in the long-range regime. The scaling exponent of this decay time provides a direct diagnostic of the robustness of the time-crystalline, and we find that this robustness extends beyond the range of power-law dissipation exponents where the system dynamics is mean-field in the thermodynamic limit. We also apply our approach to a spin-one model with local dissipation and long-range Hamiltonian interactions, formulating it in terms of Gell-Mann variables. In this case, finite-size stability is quantified through the deviation time from the mean-field behavior and the behavior of the dominant Fourier peak. We find that both quantities scale as a power law with the system size -- marking thereby a time-crystal behavior -- when the exponent of the power-law interaction is below a certain threshold, that turns out to be in agreement with previous cumulant-expansion findings. Our results show that semiclassical Langevin dynamics provides a useful finite-size probe of dissipative time crystals in regimes beyond exact Lindblad simulations.", "url": "https://arxiv.org/abs/2607.03486", "type": "理论+数值", "summary": "1. 本文发展了一个半经典朗之万方法，研究耗散时间晶体自旋体系中有限尺寸效应的动力学行为。\n2. 其核心卖点在于揭示了有限尺寸振荡的指数衰减率与系统尺寸间满足代数标度关系，该标度指数可直接诊断时间晶体的鲁棒性。\n3. 这一方法为在超越精确Lindblad模拟的耗散时间晶体有限尺寸探测中，定量刻画长程相互作用与局域耗散耦合下的时间晶体行为提供了有效工具。", "summary_source": "deepseek", "authors": [{"name": "Reyhaneh Khasseh"}, {"name": "Rosario Fazio"}, {"name": "Angelo Russomanno"}], "featured_authors": [{"name": "Reyhaneh Khasseh"}, {"name": "Rosario Fazio"}, {"name": "Angelo Russomanno"}], "author_count": 3}, {"id": "2607.03493", "category": "quant-ph", "title": "Driving collective RPA modes by a time-dependent Dyson map", "abstract": "We study a time-dependent non-Hermitian generalisation of the Schütte-Da~Providência model describing a bosonic mode coupled to collective particle-hole excitations. Using a time-dependent Dyson map, we construct a Hermitian counterpart and reduce the collective fermionic sector by means of the random phase approximation (RPA). The resulting dynamics is mapped to two time-dependent harmonic-oscillator branches with instantaneous RPA frequencies $W_\\pm(t)$. We determine the corresponding stability regions and compute transition probabilities between instantaneous oscillator states. In first-order instantaneous-basis perturbation theory the leading transition $n\\to n+2$ is proportional to $\\dot W_j/W_j$, showing that it is purely nonadiabatic and absent in the time-independent case. We compare this result with exact Lewis-Riesenfeld transition amplitudes within the RPA approximation. Numerical examples show that different components of the Dyson map provide distinct driving mechanisms: the scaling parameter modulates the effective coupling, while the squeezing parameter acts through a moving-boundary contribution. In both cases the induced collective transitions exhibit parametric-resonance peaks and sideband structures.", "url": "https://arxiv.org/abs/2607.03493", "type": "理论+数值", "summary": "1. 该工作利用时间依赖Dyson映射构造非厄米Schütte-Da Providência模型的厄米对应，将集体RPA动力学约化为两个瞬时谐振子分支。\n2. 其技术核心在于揭示主导非绝热跃迁\\(n\\to n+2\\)正比于瞬时频率变化率\\(\\dot{W}_j/W_j\\)，而Dyson映射中缩放与压缩参数分别通过有效耦合调制和移动边界贡献驱动集体激发。\n3. 该理论框架统一描述了非厄米驱动、RPA集体模与参量共振，为在量子多体系统中利用时间依赖非厄米性调控粒子-空穴激发提供了可解析分析的途径。", "summary_source": "deepseek", "authors": [{"name": "Andreas Fring"}, {"name": "Marta Reboiro"}], "featured_authors": [{"name": "Andreas Fring"}, {"name": "Marta Reboiro"}], "author_count": 2}, {"id": "2607.03535", "category": "quant-ph", "title": "Thermalization hierarchy from irreducible degrees of freedom", "abstract": "The decomposition of the Hilbert space of a quantum many-body system into the irreducible representations of its bond and commutant algebras yields a finer structure of dynamically isolated subspaces than the mere decomposition into symmetry sectors. While it has been recognized that subspaces associated with low bond-irrep dimensions $D_\\lambda$ tend to violate the eigenstate thermalization hypothesis (ETH), here we show that $D_{\\lambda}$ controls thermalization continuously across the full spectrum of dynamical subspaces. Using SU(2)-symmetric spin-1/2 chains as a paradigmatic example, we demonstrate that $\\mathrm{log} \\ D_{\\lambda}$ quantitatively accounts for the average eigenstate entanglement entropy within each sector, establishing a thermalization hierarchy that interpolates from exact quantum many-body scars at $D_{\\lambda}=1$ to volume-law ergodic states at large $D_{\\lambda}$. To make this concrete, we introduce the notion of irreducible degrees of freedom (IDOF), defined as the number of independently-varying spatial coordinates parametrizing a many-body state within a given bond-algebra sector, which provides a microscopic interpretation of $D_{\\lambda}$ and of the resulting thermalization hierarchy. Finally, we show that by selectively breaking symmetries while preserving chosen bond-algebra sectors, one can embed families of nonthermal eigenstates at prescribed entanglement levels into an otherwise ergodic spectrum, generalizing restricted spectrum-generating algebras from towers of individual states to entire dynamical subspaces.", "url": "https://arxiv.org/abs/2607.03535", "type": "理论", "summary": "1. 该工作通过将量子多体系统希尔伯特空间分解为键代数及其交换子代数的不可约表示，揭示出比对称性分解更精细的动态隔离子空间结构。\n2. 其核心在于发现不可约表示维度D_λ的对数定量决定了各子空间内平均特征态纠缠熵，由此建立从精确量子多体疤痕到体积律遍历态的热化层级，并引入不可约自由度数为其提供微观解释。\n3. 这启示了通过选择性破缺对称性保留特定键代数子空间，可将具有预设纠缠水平的非热特征态族嵌入遍历谱，实现从单态塔到整个动态子空间的受限谱生成代数推广。", "summary_source": "deepseek", "authors": [{"name": "Pedro Fittipaldi de Castro"}, {"name": "Wladimir A. Benalcazar"}], "featured_authors": [{"name": "Pedro Fittipaldi de Castro"}, {"name": "Wladimir A. Benalcazar"}], "author_count": 2}, {"id": "2607.03747", "category": "quant-ph", "title": "The influence of the transverse electric field on accelerating vortex state in the axisymmetric electric field", "abstract": "The relativistic vortex states of massive charged particles propagating in non-uniform axisymmetric electric field are studied. Starting from the stationary-state equation after the relativistic Foldy-Wouthuysen (FW) transformation and employing the paraxial approximation, the coupled evolution equations for the beam width, wavefront curvature, and Gouy phase are derived. The equations are solved numerically for a quadratic electrostatic potential, an immersion lens, and an einzel lens. The essential influence of the transverse field on beam evolution is demonstrated. The results provide a relativistic quantum framework for controlling accelerated vortex particle beams using electrostatic fields.", "url": "https://arxiv.org/abs/2607.03747", "type": "理论+数值", "summary": "1. 该工作通过相对论Foldy-Wouthuysen变换及近轴近似，导出了涡旋粒子束在轴对称非均匀电场中的耦合演化方程。\n2. 其核心在于数值求解二次势、浸没透镜和单透镜三种情形，揭示了横向电场对束宽、波前曲率和Gouy相位的调控机制。\n3. 这为利用静电场实现加速涡旋粒子束的相对论量子控制提供了理论框架。", "summary_source": "deepseek", "authors": [{"name": "Ziyang Ding"}, {"name": "Ziqiang Huang"}, {"name": "Qi Meng"}, {"name": "Alexander J. Silenko"}, {"name": "Pengming Zhang"}, {"name": "Liping Zou"}], "featured_authors": [{"name": "Ziyang Ding"}, {"name": "Ziqiang Huang"}, {"name": "Qi Meng"}, {"name": "Alexander J. Silenko"}, {"name": "Pengming Zhang"}, {"name": "Liping Zou"}], "author_count": 6}, {"id": "2607.03757", "category": "quant-ph", "title": "Entanglement-Assisted Timing Optimization for Discriminating Amplitude-Damping Dynamics", "abstract": "We analyze minimum-error discrimination of two qubit dynamical processes generated by phase-covariant amplitude-damping Lindbladians in a single-use scenario. The optimization involves both the input probe, possibly entangled with an isolated ancilla, and the interrogation time. For unassisted probes we obtain a closed expression for the optimal trace-norm distinguishability at fixed time, with distinct interior and boundary branches. For entanglement-assisted probes, the common phase covariance of the two channels reduces the diamond-norm optimization to a one-parameter Schmidt family. The resulting formula gives transparent sufficient conditions for fixed-time entanglement advantage and separates this local advantage from advantage after global optimization over time. We exhibit examples in which the best unassisted strategy is approached only asymptotically, whereas an entangled probe achieves a strictly smaller error probability at finite time.", "url": "https://arxiv.org/abs/2607.03757", "type": "理论+数值", "summary": "1. 本文研究单次使用下两类相位协变振幅阻尼Lindblad动力学的最小错误区分，同时优化输入探针（可能含纠缠辅助）与询问时间。\n2. 其技术核心是将纠缠辅助下的金刚石范数优化简化为单参数Schmidt族，并给出固定时间纠缠优势的透明充分条件，将局部优势与全局时间优化后的优势分离。\n3. 这为量子信道区分中时间资源的优化利用及纠缠实际优势的严格界定提供了可解析处理的模型框架。", "summary_source": "deepseek", "authors": [{"name": "Massimiliano F. Sacchi"}, {"name": "Milajiguli Rexiti"}, {"name": "Stefano Mancini"}], "featured_authors": [{"name": "Massimiliano F. Sacchi"}, {"name": "Milajiguli Rexiti"}, {"name": "Stefano Mancini"}], "author_count": 3}, {"id": "2607.03779", "category": "quant-ph", "title": "Gorini-Kossakowski-Sudarshan-Lindblad equation in different bases: application to driven-dissipative two- and multilevel systems", "abstract": "An open quantum system can be described by a master equation, of which one of the most popular is the Gorini-Kossakowski-Sudarshan-Lindblad (GKSL) equation. We revisit description of driven-dissipative quantum systems focusing on the appropriate choice of the system's basis and the respective transformations. We consider the GKSL equation in different bases and calculate the dynamics for a qubit and for a qudit. An appropriate choice of the basis is a fundamental problem for theoretical consideration of open quantum systems and provides an opportunity to obtain the desired evolution in practice.", "url": "https://arxiv.org/abs/2607.03779", "type": "理论", "summary": "1. 该工作重新审视了驱动耗散量子系统的GKSL主方程描述，聚焦于不同基下的形式及其变换，并计算了量子比特与qudit的动力学。\n2. 其核心在于阐明基的恰当选择是开放量子系统理论分析的基础问题，并由此提供在实验中实现期望演化的可行途径。\n3. 这为理解与调控开放量子系统的非平衡动力学提供了理论指引，并可能推动耗散量子信息处理的实际应用。", "summary_source": "deepseek", "authors": [{"name": "O. A. Ilinskaya"}, {"name": "O. V. Ivakhnenko"}, {"name": "A. I. Ryzhov"}, {"name": "O. Yu. Kitsenko"}, {"name": "S. N. Shevchenko"}], "featured_authors": [{"name": "O. A. Ilinskaya"}, {"name": "O. V. Ivakhnenko"}, {"name": "A. I. Ryzhov"}, {"name": "O. Yu. Kitsenko"}, {"name": "S. N. Shevchenko"}], "author_count": 5}, {"id": "2607.03786", "category": "quant-ph", "title": "Perturbed quantum billiards on the hyperbolic plane", "abstract": "We study the emergence of generic quantum chaos from an arithmetic billiard in the hyperbolic plane. Starting from an arithmetic triangle, we introduce small area-preserving geometric perturbations and compute long consecutive sequences of eigenvalues and eigenstates. The spectral statistics show a perturbation-dependent crossover from Poisson-like arithmetic behaviour to the Gaussian orthogonal ensemble (GOE), with the crossover scale moving to higher wavenumbers as the perturbation decreases. To characterize the nearest-neighbour spacing distribution, we compare the data with Brody and generalized-gamma fits. The generalized-gamma form is used only as a two-parameter diagnostic, allowing the small- and intermediate-spacing structure to vary independently from the large-spacing tail, rather than as a universal crossover law. For the weakest perturbation, we also compare the data with an effective block-GOE model, which diagnoses residual block-like structure deep into the computed spectral range. We complement the spectral analysis with Poincaré-Husimi representations of the eigenstates and quantify phase-space localization using an entropy-based measure. Its distribution is well described by Beta distributions whose width decays as a power law in the wavenumber. Before the spectral crossover, the localization statistics retain memory of the near-arithmetic regime. After the GOE regime is reached, the localization-fluctuation widths collapse onto a common decay law, sigma(Beta) ~ k^{-eta}, with eta approximately 0.37--0.38. These results provide a combined spectral and eigenfunction-level picture of the arithmetic-to-GOE crossover in hyperbolic quantum billiards.", "url": "https://arxiv.org/abs/2607.03786", "type": "理论+数值", "summary": "1. 本文通过引入小面积保持几何扰动，研究了双曲平面上算术台球体系从泊松型算术行为到高斯正交系综（GOE）混沌的谱与本征态过渡。\n2. 技术关键在于使用Brody分布与广义伽马分布拟合最近邻间距分布诊断交叉标度，并结合Poincaré-Husimi表示及熵定位度量分析相位空间局域化，发现GOE区定位涨落宽度服从幂律衰减（指数≈0.37–0.38）。\n3. 这为量子混沌系统中算术—一般混沌过渡的谱与本征函数联合图像提供了定量刻画，启发对双曲几何下非算术台球模型或扰动诱导混沌机制的进一步探索。", "summary_source": "deepseek", "authors": [{"name": "Matic Orel"}], "featured_authors": [{"name": "Matic Orel"}], "author_count": 1}, {"id": "2607.03905", "category": "quant-ph", "title": "On estimating operator norm distance, with optimal trace distance estimation when one state is pure", "abstract": "We investigate the computational complexity of estimating the operator norm distance ${\\rm T}_{\\infty}(\\rho_0,\\rho_1)$, defined via the operator norm $\\|A\\|_{\\infty} = \\sigma_{\\max}(A)$, given ${\\rm poly}(n)$-size state-preparation circuits of $n$-qubit quantum states $\\rho_0$ and $\\rho_1$. We provide efficient quantum estimators for the operator norm distance whose complexity is independent of the rank (and thus the dimension) of the states: 1. When one state is pure, we establish an optimal quantum estimator using $\\Theta(1/\\epsilon)$ queries to the state-preparation circuits. Consequently, for constant additive error, say $\\epsilon=1/5$, our estimator runs in ${\\rm poly}(n)$ time. Since the operator norm distance ${\\rm T}_{\\infty}(|\\psi\\rangle\\!\\langle\\psi|,\\rho)$ is exactly half of the trace distance ${\\rm T}(|\\psi\\rangle\\!\\langle\\psi|,\\rho)$, our result also gives rank-independent query complexity for estimating both quantities, whereas the approaches due to van Apeldoorn, Cornelissen, Gily{é}n, and Nannicini (SODA 2023) and Wang and Zhang (TIT 2024) have query complexity scaling at least linearly with ${\\rm rank}(\\rho)$, which can be $\\exp(n)$ in general. 2. For general quantum states, we also provide a quantum estimator using $\\widetilde{O}(1/\\epsilon^{3/2})$ queries to the state-preparation circuits, which shows that the corresponding promise problem is ${\\sf BQP}$-complete and improves the ${\\sf QMA}$ upper bound sketched by Liu and Wang (ESA 2025). Together with an $\\Omega(1/\\epsilon)$ quantum query complexity lower bound, this leaves only square-root room for improvement. The key intuition behind our estimators is that, when one state is pure, the pure state $|\\psi\\rangle$ has overlap at least $1/2$ with the top unit eigenvector of $|\\psi\\rangle\\!\\langle\\psi|-\\rho$, reflecting a structural feature specific to the operator norm distance.", "url": "https://arxiv.org/abs/2607.03905", "type": "理论", "summary": "1. 该工作针对n-比特量子态间算子范数距离的估计问题，在态制备电路模型下给出了量子算法；特别地，当其中一个态为纯态时实现了查询复杂度Θ(1/ϵ)的最优估计，一般态情形达到Õ(1/ϵ^{3/2})的查询复杂度。\n2. 其关键直觉在于纯态与差矩阵顶部本征向量具有至少1/2的重叠，这一结构特征使估计器的查询复杂度彻底摆脱对态秩的依赖，从而避免了已有迹距离估计方法中至少线性于秩的指数级复杂度。\n3. 这为算子范数距离的承诺问题确立了BQP完全性（原为QMA上界），并为迹距离的秩无关估计提供了明确实现途径，启发在量子态区分与量子信息处理中优先采用算子范数度量。", "summary_source": "deepseek", "authors": [{"name": "Yupan Liu"}, {"name": "Qisheng Wang"}, {"name": "Zhan Yu"}], "featured_authors": [{"name": "Yupan Liu"}, {"name": "Qisheng Wang"}, {"name": "Zhan Yu"}], "author_count": 3}, {"id": "2607.03909", "category": "quant-ph", "title": "Algebra of quantum mechanics \\textit{via} classical phonons. II: Klein-Gordon dynamics, the Heisenberg formalism, the Dirac canonical commutation rule and the Poincaré algebra through the continuous Poisson bracket formalism", "abstract": "In the first part of this series we have shown how the Schrodinger equation for a single particle and the corresponding non relativistic quantum observables can be obtained from a purely classical phonon model through the Newtonian equations of motion. In this work we focus instead on how the classical Hamiltonian formalism applied to the same phonon system allows to recover the feature of relativistic quantum mechanics for a single spinless particle. Using the classical nature of the phonon model, we naturally define continuous Poisson brackets between classical observables, which allows to recover the dynamics of such observables, i.e. the Ehrenfest relations associated to real-valued Klein-Gordon fields. The Poisson brackets also permits to obtain the generic form of constants of motions, thus generalizing the concept of inner products and momentum on Klein-Gordon fields. We then connect the formalism of real-valued classical functionals with that of hermitian operators and complex-valued wave functions. This is done through the introduction of a non-local complex-valued change of variables which allows to rewrite the real-valued Klein-Gordon equation in a form akin to the Schrodinger equation, and the classical observables as quantum expectation values. Then, we show how this change of variables allows to rewrite the classical Poisson brackets as commutators of hermitian operators. This points out the strict equivalence between the Heisenberg formalism and the formalism of classical Poisson bracket. Eventually, we illustrate how the Poisson brackets allows to recover the transformations of Poincaré group in 1+1 dimension together with its algebra. The latter makes the link between the Lorentz invariant inner product of Mostafazadeh and the Casimir invariant associated to the mass of particle.", "url": "https://arxiv.org/abs/2607.03909", "type": "理论", "summary": "1. 本工作基于经典声子模型的哈密顿形式，通过连续泊松括号恢复了单粒子相对论量子力学的核心结构，包括Klein-Gordon动力学、海森堡图像及庞加莱代数。\n2. 其关键卖点在于引入非局域复变量变换，将实值经典泛函与厄米算符严格对应，使经典泊松括号等价于量子对易子，从而统一了经典与海森堡形式论。\n3. 该结果为从经典声子涌现量子力学提供了严格对应框架，有望启发对量子场论基本对易关系和时空对称性的经典起源研究。", "summary_source": "deepseek", "authors": [{"name": "Emmanuel Giner"}], "featured_authors": [{"name": "Emmanuel Giner"}], "author_count": 1}, {"id": "2607.03939", "category": "quant-ph", "title": "Disentangling Haldane Phase by Generalized Clifford Circuits", "abstract": "Disentangling transformations play a central role in the classical simulation of quantum many-body systems, yet their analytic structure and underlying mechanism remain largely unexplored. Here, we study the structure of the disentangler in the Haldane phase of spin-1 systems using generalized Clifford circuits. To this end, we extend the Clifford-circuit-augmented matrix product states (CAMPS)-based density-matrix renormalization group (DMRG) method to spin-1 systems. Within this framework, we find that the local disentanglers optimized for the Haldane phase implement the generalized Kramers--Wannier (KW) transformation, and we analytically verify its optimality for the Affleck--Kennedy--Lieb--Tasaki (AKLT) state. Beyond reducing entanglement, the KW transformation maps the Haldane phase to a phase with spontaneously broken $\\mathbb{Z}_{2}$ symmetry. This mapping is distinct from the Kennedy--Tasaki transformation and provides a new unitary route from symmetry-protected topological order to symmetry breaking.", "url": "https://arxiv.org/abs/2607.03939", "type": "理论+数值", "summary": "1. 该工作利用广义Clifford电路研究了自旋-1系统Haldane相的解纠缠器结构，并扩展了基于Clifford电路增强矩阵乘积态的密度矩阵重正化群方法至自旋-1系统。\n2. 其核心发现是局域解纠缠器实现了广义Kramers –Wannier变换，并解析证明了该变换对AKLT态的最优性；该变换将Haldane相映射至具有自发破缺ℤ₂对称性的相，与Kennedy –Tasaki变换不同。\n3. 这为通过幺正路径从对称保护拓扑序通向对称破缺相提供了新机制，并可能启发对更广泛拓扑相的经典模拟方法。", "summary_source": "deepseek", "authors": [{"name": "Minsoo Kim"}, {"name": "Changhun Oh"}, {"name": "Donghoon Kim"}], "featured_authors": [{"name": "Minsoo Kim"}, {"name": "Changhun Oh"}, {"name": "Donghoon Kim"}], "author_count": 3}, {"id": "2607.03950", "category": "quant-ph", "title": "Orthogonality Edges in Strong-Coupling Quantum Work Statistics", "abstract": "Strong coupling to a reservoir can do more than shift, broaden, or dress the work peaks of a driven quantum system. When the reservoir is infrared singular, a sudden change of a local control parameter can alter the boundary condition seen by infinitely many low-energy modes, converting a quasiparticle-like threshold line into a many-body edge. We demonstrate this mechanism for the inclusive work distribution of the biased spin-boson model under a sudden bias inversion. In the independent-boson limit, the problem is exactly solvable and gives a sharp infrared classification: a super-Ohmic bath can retain a finite elastic threshold weight, whereas Ohmic and sub-Ohmic baths extinguish the elastic line through boundary orthogonality. At the Ohmic fixed point, the same exponent controls both the vanishing elastic residue and the low-work continuum. We then ask how this edge is resolved away from the static-boundary limit. Using displaced-basis exact diagonalization of logarithmically discretized baths, we find that finite tunnelling leaves an edge-like continuum over the accessible energy window, while separating two operational diagnostics of the threshold: the cumulative-continuum exponent extracted from $z$-interleaved spectra lies above the elastic-overlap exponent extracted from $z$-averaged overlaps, $\\theta_C>\\theta_Z$. We interpret this separation as a finite-energy crossover away from the static-boundary fixed point, not as evidence for a new asymptotic fixed point. The separation survives fitting-window variation, oscillator-cutoff checks, spectrum-size checks, and leave-one-$z$-out tests, while time-domain characteristic functions provide a compatible but non-decisive diagnostic. Finally, the same threshold edge controls the sampling cost of Jarzynski-type exponential averages, making rare low-work events increasingly important at low temperature.", "url": "https://arxiv.org/abs/2607.03950", "type": "理论+数值", "summary": "1. 本文通过分析强耦合自旋玻色子模型在偏置突变下的包含功分布，展示了红外奇异储库如何将准粒子阈值线转化为多体正交性边缘，并在独立玻色子极限下给出超欧姆保留弹性权重而欧姆/亚欧姆消灭弹性线的精确红外分类。\n2. 其核心卖点在于利用位移基矢精确对角化对数离散化储库，发现有限隧穿下累积连续谱指数显著大于弹性重叠指数（θ_C>θ_Z），并将该分离稳健地解释为偏离静态边界不动点的有限能量交叉，而非新渐近不动点。\n3. 该阈值边缘效应控制着Jarzynski型指数平均的采样成本，使低温下稀有低功事件变得关键，为强耦合量子热力学中正交性边缘的实验探测与有限能量交叉图像的验证提供了理论依据。", "summary_source": "deepseek", "authors": [{"name": "Atta ur Rahman"}, {"name": "Muhammad Noman"}, {"name": "S. M. Zangi"}, {"name": "Saeed Haddadi"}], "featured_authors": [{"name": "Atta ur Rahman"}, {"name": "Muhammad Noman"}, {"name": "S. M. Zangi"}, {"name": "Saeed Haddadi"}], "author_count": 4}, {"id": "2607.04015", "category": "quant-ph", "title": "The Delayed Stabilizer ZX-Calculus", "abstract": "Many stabilizer quantum error-correcting codes are built from a finite pattern repeated across space or time, such as lattice codes, translation-invariant graph states, and quantum convolutional codes. Ordinary stabilizer ZX-diagrams capture only finite truncations of such systems, obscuring the repeated structure that defines them. We introduce the delayed stabilizer ZX-calculus, a finite graphical language for these infinite, translation-invariant processes. It extends the odd-prime-dimensional stabilizer ZX-calculus with a single new generator, the delay, which feeds data from one time step to the next. We equip the calculus with two semantics. In the first semantics, we interpret the behaviour of a delayed ZX-diagram as an equivalence class of sequences of quantum channels; where two sequences are identified if they have the same information content. We show that the behaviour of a delayed ZX-diagram uniquely determines an infinite stabilizer group. In the second semantics, we interpret the delay as a formal variable, encoding the translation-invariant families of Pauli operators as generating functions. This allows us to represent a delayed ZX-diagram in terms of a tableau of generating functions, from which the infinite stabilizer group can be recovered. Finally, we give a complete axiomatization of the delayed stabilizer ZX-calculus, featuring generalised Euler decomposition and colour change rules. Using generalised forms of local complementation and pivoting, we reduce every diagram to a unique normal form. This establishes soundness, universality, and completeness for the generating tableau semantics.", "url": "https://arxiv.org/abs/2607.04015", "type": "理论", "summary": "1. 该工作引入延迟稳定子ZX-演算，作为无限平移不变稳定子量子过程的有限图形语言。\n2. 其核心在于赋予延迟两种语义：量子信道等价类对应无限稳定子群，以及以形式变量编码生成函数并归约至唯一规范形表格。\n3. 这为无限量子纠错码与稳定子系统的有限表示、推理及完备公理化提供了严格框架。", "summary_source": "deepseek", "authors": [{"name": "Cole Comfort"}, {"name": "Giovanni de Felice"}], "featured_authors": [{"name": "Cole Comfort"}, {"name": "Giovanni de Felice"}], "author_count": 2}, {"id": "2607.04052", "category": "quant-ph", "title": "A Lie-Jordan Geometric Formulation of Lindblad Dynamics", "abstract": "We develop a Lie-Jordan geometric formulation of finite-dimensional open quantum dynamics, building on the algebraic framework introduced in our previous work ( arXiv:2606.26477 ). The Hilbert-Schmidt operator space is endowed with an orthonormal Hermitian basis, in which the commutator and anticommutator are encoded by the structure tensors \\(C_{\\mu\\nu}{}^\\lambda\\) and \\(B_{\\mu\\nu}{}^\\lambda\\). Within this formulation, the von Neumann and Gorini-Kossakowski-Lindblad-Sudarshan equations admit a direct component representation. Our central result is the identification of a basis-independent universal trilinear dissipative map, \\( \\mathcal D(X,Y)Z=XZY-\\frac12\\{YX,Z\\}, \\) whose components define a universal operator-space tensor depending only on the Lie-Jordan structure tensors. The physical dissipator is obtained by contracting this tensor with the expansion coefficients of the Lindblad operators and the Kossakowski matrix, thereby separating the universal algebraic structure from the model-dependent physical information. We further show that the combinations \\((B+C)\\) and \\((B-C)\\) generate internal left and right transports, allowing the elementary dissipative map to be expressed as a left-right bimodule action corrected by an ordered Jordan contribution. The universal map satisfies basis-independent trace and Hermitian-conjugation identities, from which trace preservation, Hermiticity preservation of the complete dissipator, and the reality of its component representation in a Hermitian Hilbert-Schmidt basis follow. We also derive its Hilbert-Schmidt adjoint and illustrate the formalism for a qubit with pure dephasing and amplitude-damping channels. This construction provides a tensorial and affine-geometric interpretation of the universal superoperator structure derived in arXiv:2606.26477 while keeping the algebraic and model-dependent sectors explicitly separated.", "url": "https://arxiv.org/abs/2607.04052", "type": "理论", "summary": "1. 该工作基于Lie-Jordan代数结构，在Hilbert-Schmidt空间正交厄米基下引入对易与反对易结构张量，给出了von Neumann方程和GKLS方程的分量表示。\n2. 核心在于识别出一个基无关的三线性普适耗散映射，其分量仅由Lie-Jordan结构张量决定，通过收缩该映射与Lindblad算符系数及Kossakowski矩阵得到物理耗散子，从而严格分离通用代数结构与模型依赖信息。\n3. 该构造为超算符提供了张量与仿射几何解释，其基无关恒等式保证了迹与厄米保持性，对开放系统量子模拟及噪声过程的结构分类具有启发。", "summary_source": "deepseek", "authors": [{"name": "Leonel Bixano"}, {"name": "Victor Alberto Cruz-Barriguete"}, {"name": "Guillermo López-Alvarez"}, {"name": "V. G. Ibarra-Sierra"}, {"name": "José Luis Cardoso"}, {"name": "Alejandro Kunold"}], "featured_authors": [{"name": "Leonel Bixano"}, {"name": "Victor Alberto Cruz-Barriguete"}, {"name": "Guillermo López-Alvarez"}, {"name": "V. G. Ibarra-Sierra"}, {"name": "José Luis Cardoso"}, {"name": "Alejandro Kunold"}], "author_count": 6}, {"id": "2607.04054", "category": "quant-ph", "title": "Frozen-Tree Sampling Refutes Quantum Advantage of Random Circuit Sampling", "abstract": "Random circuit sampling of bitstrings from a Haar-random quantum state is widely believed to be classically intractable, and has therefore been implemented as a primary benchmark for demonstrating quantum advantage. Here, we challenge this premise by proposing an efficient classical frozen-tree sampling algorithm that exploits the conditional scale invariance of Haar-random quantum states [Oh, arXiv:2602.19448 ]. The frozen-tree sampler draws bitstrings of $n$ qubits in $O(n)$ time per sample. Moreover, its output probability $p_F(x)$ is statistically identical to the probability $p_C(x)$ of a random quantum circuit, since both are independent instances of the same Dirichlet distribution. Consequently, no statistical test acting on samples alone can distinguish the classical frozen-tree sampler from a quantum random circuit. The claimed quantum advantage of random circuit sampling therefore does not withstand scrutiny: its hardness lies not in sampling from the Dirichlet distribution, which is classically efficient, but in identifying a specific circuit realization.", "url": "https://arxiv.org/abs/2607.04054", "type": "理论+数值", "summary": "1. 该工作提出经典冻结树采样算法，证明其能以O(n)时间生成与量子随机电路统计不可区分的比特串，从而反驳随机电路采样的量子优势声称。\n2. 核心卖点在于利用Haar随机量子态的尺度不变性，使经典输出分布与量子电路输出服从相同的狄利克雷分布，任何基于样本的统计检验均无法区分。\n3. 该结果揭示了随机电路采样问题的真正困难不在于从分布中采样，而在于识别具体电路实现，为量子优势实验设计提供了更严格的基准要求。", "summary_source": "deepseek", "authors": [{"name": "Sangchul Oh"}], "featured_authors": [{"name": "Sangchul Oh"}], "author_count": 1}, {"id": "2607.04279", "category": "quant-ph", "title": "Weak ergodicity breaking without nonthermal eigenstates", "abstract": "The typical mechanisms of ergodicity breaking in isolated interacting quantum systems, such as many-body localization and quantum many-body scars, originate from the nonthermal nature of the underlying eigenstates. Here, in the absence of nonthermal eigenstates, we identify a mechanism for collective revivals of multiparticle Wannier states (MWSs) associated with nearly linear bands in a spatially modulated Bose-Hubbard lattice. The MWSs, as superpositions of multiparticle Bloch states within individual energy bands, give rise to band-resolved Wannier-sector fragmentation. The key idea is that spatially periodic modulation folds and separates energy bands of a simple lattice into several sub-bands, among which nearly linear sub-bands inherit the linear segments of the original bands. Although multiparticle Bloch states satisfy the eigenstate thermalization hypothesis (ETH), the MWSs in the nearly linear band still exhibit long-lived collective revivals, due to emergent equally spaced energy levels. Our work provides a route to weak ergodicity breaking in which long-lived revivals arise from spectral phase coherence among ETH-satisfying eigenstates rather than from scar-like nonthermal eigenstates.", "url": "https://arxiv.org/abs/2607.04279", "type": "理论+数值", "summary": "1. 该工作在没有非热本征态的条件下，基于空间调制Bose-Hubbard晶格中近线性子带的多粒子Wannier态，实现弱遍历性破缺。\n2. 其核心在于周期调制使能带折叠分离出近线性子带，其中多粒子Wannier态因能级等间距而呈现长寿命集体复发，尽管组成它的Bloch态满足本征态热化假说。\n3. 这揭示了由满足ETH的本征态间谱相位相干性驱动弱遍历性破缺的新机制，为区分于量子疤痕的遍历性破缺研究提供了方向。", "summary_source": "deepseek", "authors": [{"name": "Boning Huang"}, {"name": "Yongguan Ke"}, {"name": "Li Zhang"}, {"name": "Lin Ling"}, {"name": "Chaohong Lee"}], "featured_authors": [{"name": "Boning Huang"}, {"name": "Yongguan Ke"}, {"name": "Li Zhang"}, {"name": "Lin Ling"}, {"name": "Chaohong Lee"}], "author_count": 5}, {"id": "2607.04289", "category": "quant-ph", "title": "Chromatic Completeness and the Independence of Geometric Obstruction", "abstract": "We establish a strict logical separation between two distinct phenomena in orthogonality hypergraphs: chromatic completeness, the possibility of assigning a single globally consistent nondegenerate spectrum to all contexts, and geometric coordinatizability, the existence of a faithful orthogonal representation by rays. A strong chromatic number larger than the Hilbert-space dimension obstructs only the former. It does not, by itself, obstruct the existence of a faithful orthogonal representation. We make this separation explicit by comparing two three-dimensional examples with the same strong chromatic number. A completed 25-ray version of the Yu-Oh configuration has strong chromatic number four and nevertheless possesses an explicit faithful orthogonal representation in R^3. Conversely, Greechie's G_{32} hypergraph also has strong chromatic number four, and has a separating and unital set of two-valued states, but we give an elementary algebraic proof that it admits no faithful orthogonal representation in C^3. The obstruction in G_{32} is therefore not chromatic but projective-geometric: the incidence relations force two distinct atoms to collapse onto the same ray.", "url": "https://arxiv.org/abs/2607.04289", "type": "理论", "summary": "1. 该工作通过比较两个三维正交超图实例，严格证明了色完备性与几何可坐标化性在正交超图中的逻辑独立性。\n2. 核心发现是强色数大于希尔伯特空间维度仅禁止全局一致非退化谱，但不阻碍忠实正交表示的存在，后者可被射影几何约束单独破坏。\n3. 这为量子关联研究中区分组合与几何阻碍提供了明确判据，并启发在更高维空间中寻找类似结构分离现象。", "summary_source": "deepseek", "authors": [{"name": "Karl Svozil"}], "featured_authors": [{"name": "Karl Svozil"}], "author_count": 1}, {"id": "2607.04320", "category": "quant-ph", "title": "Fundamental limits on state preparation for an open qubit", "abstract": "We analytically determine the ultimate limits of state preparation in two-level open quantum systems driven by coherent control. For a dissipative qubit governed by a GKSL master equation, we give an exact characterization of the reachable set in the Bloch ball. Dissipation excludes a region of states in the Bloch ball which cannot be approached even under arbitrarily strong coherent driving, and we prove that this region has a nontrivial geometry whose boundary is a surface of revolution around the $x$-axis which is analytic except for two conical singularities. We derive a closed-form control protocol for moving on this boundary, and construct an explicit protocol that steers the system arbitrarily close to any prescribed boundary state. These results provide a complete geometric constructive description of reachable qubit states in the standard dissipative environment, establishing fundamental bounds on controllability and state-preparation fidelity for open two-level quantum systems.", "url": "https://arxiv.org/abs/2607.04320", "type": "理论", "summary": "1. 该工作解析确定了受相干控制的耗散两能级量子系统中态制备的终极极限。\n2. 其卖点在于精确刻画布洛赫球内不可达区域的非平凡几何并给出边界闭式控制协议。\n3. 这为开放量子系统可控性与态制备保真度提供了完整的几何构造性基本界限。", "summary_source": "deepseek", "authors": [{"name": "D.A. Abraamian"}, {"name": "L.V. Lokutsievskiy"}, {"name": "A.N. Pechen"}], "featured_authors": [{"name": "D.A. Abraamian"}, {"name": "L.V. Lokutsievskiy"}, {"name": "A.N. Pechen"}], "author_count": 3}, {"id": "2607.04348", "category": "quant-ph", "title": "Supersymmetry and Entanglement in the Generalized Dirac Oscillator", "abstract": "The supersymmetric properties of the generalized Dirac oscillator allow us to determine the entanglement entropy between the spin and the continuous variable in a purely algebraic manner. The entanglement has a relativistic origin and disappears in the nonrelativistic limit. The entanglement entropy attains its maximal value in the limit of infinite energy.", "url": "https://arxiv.org/abs/2607.04348", "type": "理论", "summary": "1. 该工作利用广义Dirac振子的超对称性，纯代数地确定了其自旋与连续变量间的纠缠熵。\n2. 纠缠具有相对论起源，在非相对论极限下消失，且在无限能量极限下达到最大值。\n3. 这为相对论量子信息系统中纠缠的代数刻画提供了框架，并启示了超对称在纠缠研究中的应用。", "summary_source": "deepseek", "authors": [{"name": "H. P. Laba"}, {"name": "V. M. Tkachuk"}], "featured_authors": [{"name": "H. P. Laba"}, {"name": "V. M. Tkachuk"}], "author_count": 2}, {"id": "2607.04462", "category": "quant-ph", "title": "Noise-Aware Synthesis of Quantum LDPC Encoder Circuits via Two-Sided Hamming Descent", "abstract": "Quantum low-density parity-check (LDPC) codes are a promising route to fault-tolerant quantum computation, but their use requires efficient preparation of encoded states. Standard encoder constructions generate circuits through fixed algebraic procedures, yet the resulting circuit can contain substantial redundancy. We formulate LDPC encoder preparation as a circuit-resynthesis problem: given the linear-reversible matrix implemented by the encoder's CNOT block, we seek a lower-cost equivalent circuit that can be routed efficiently on the target hardware and which mitigates noise. We propose a novel optimization approach referred as two-sided Hamming descent and a noise-aware optimization pipeline for this task. Across several families of Calderbank-Shor-Steane (CSS) LDPC encoders, including Bivariate Bicycle, hypergraph-product, and entanglement-assisted codes, the proposed pipeline produces substantially smaller and shallower encoder circuits than the standard constructions and the synthesis baselines considered, cutting gate counts by 53.8% in aggregate across the benchmark and by up to 68% on the Bivariate Bicycle family. The gains remain visible after routing, where the two-qubit depth is reduced by up to 71% and translate into higher-fidelity state preparation under circuit-level noise. On the Bivariate Bicycle family, live-range scheduling further reduces routed preparation failure by up to 13.7% without adding two-qubit gates to the selected circuit. These results indicate that encoder-matrix resynthesis, combined with hardware-calibrated selection and scheduling, is an effective compiler-level tool for preparing quantum LDPC code states.", "url": "https://arxiv.org/abs/2607.04462", "type": "理论+数值", "summary": "1. 本文将量子LDPC编码器的CNOT块线性可逆矩阵重综合作为电路优化问题，提出双面汉明下降法及噪声感知优化流水线。\n2. 该流水线通过硬件校准的电路选择和活区间调度，在多种CSS LDPC码族上削减门数53.8%、两量子比特深度71%，并提升电路级噪声下的态制备保真度。\n3. 结果表明编码器矩阵重综合结合噪声感知优化可成为编译器级制备量子LDPC码态的有效工具，为容错量子计算提供了实用路径。", "summary_source": "deepseek", "authors": [{"name": "Aditya Sodhani"}, {"name": "Keshab K. Parhi"}], "featured_authors": [{"name": "Aditya Sodhani"}, {"name": "Keshab K. Parhi"}], "author_count": 2}, {"id": "2607.04488", "category": "quant-ph", "title": "Trace-to-Hilbert-Schmidt Speed Ratio in Quantum Dynamics: Universal Bounds and Effective Rank", "abstract": "We study the ratio between the trace speed and the Hilbert-Schmidt speed for differentiable finite-dimensional quantum states, $\\mathcal R(\\phi)=\\|\\partial_\\phi\\rho(\\phi)\\|_1/\\|\\partial_\\phi\\rho(\\phi)\\|_2$. Because $\\partial_\\phi\\rho(\\phi)$ is always Hermitian and traceless, this ratio is constrained more strongly than for a generic operator. For any nonzero tangent operator $X=\\partial_\\phi\\rho$ of rank $r$, we prove the sharp bounds $\\sqrt{2}\\le \\|X\\|_1/\\|X\\|_2\\le \\sqrt r$. The lower bound is attained exactly for rank-two tangents, while the upper bound is attained exactly when all nonzero singular values are equal, which in the traceless Hermitian setting requires even rank. At every nonstationary point of a pure-state family, the tangent has rank two, implying $\\mathcal R=\\sqrt2$. For odd Hilbert-space dimension $d$, we further prove the sharp global maximum $\\mathcal R\\le \\sqrt{d-1/d}$, with equality characterized by full-rank spectra whose positive and negative eigenvalues are separately degenerate and have multiplicities differing by one. We identify $\\mathcal R^2$ as the inverse participation ratio of the singular-value distribution of the tangent operator, giving $\\mathcal R$ a natural interpretation as an effective-rank diagnostic for local quantum dynamics. Furthermore, we decompose the effective rank into classical (eigenvalue) and quantum (eigenvector) contributions and prove the bound $r_{\\mathrm{eff}}\\le r_C + r_Q$, with equality guaranteed when either component vanishes. We establish a direct inequality linking the effective rank to the quantum Fisher information (QFI), which forces a large number of active singular modes when the QFI is small relative to the squared trace speed. Finally, we derive a hierarchy of quantum speed limits in which the effective rank controls the tightness of bounds expressed through the Hilbert-Schmidt speed.", "url": "https://arxiv.org/abs/2607.04488", "type": "理论", "summary": "1. 该工作严格界定了可微有限维量子态迹速度与希尔伯特-施密特速度之比，证明其上下限分别由切算子秩与谱对称性决定，并给出纯态族中恒为√2的推论。\n2. 核心卖点在于将该比值解释为切算子奇异值分布的反参与比，实现有效秩诊断，并分解为经典与量子贡献，建立了与量子Fisher信息的直接不等式。\n3. 这为通过有效秩控制量子速度极限的紧致性提供了普适框架，并启发利用该比值刻画局域量子动力学的活跃模数。", "summary_source": "deepseek", "authors": [{"name": "Hossein Rangani Jahromi"}], "featured_authors": [{"name": "Hossein Rangani Jahromi"}], "author_count": 1}, {"id": "2607.04519", "category": "quant-ph", "title": "Schrodinger Oscillator and its Thermal Properties in a Dynamical Noncommutative Space", "abstract": "In this paper, we study the two-dimensional Schrodinger oscillator within a dynamical noncommutative (DNC) space. By leveraging perturbation theory, we derive the energy eigenvalues and eigenvectors and systematically analyze the effects of both dynamical and non-dynamical noncommutative settings. First-order corrections to the eigensystem are obtained, revealing that the energy shift explicitly depends on the DNC parameter tau. Furthermore, we explore the thermal properties of the system by employing the partition function. Numerical results are presented to provide a comprehensive analysis of the system behavior under the considered effects. Notably, in the DNC framework, the commutation relations and the deformation parameter are position-dependent. Using the two-dimensional Bopp-shift, we effectively map the noncommutative problem to its commutative counterpart.", "url": "https://arxiv.org/abs/2607.04519", "type": "理论+数值", "summary": "1. 该工作研究了动态非对易空间中二维薛定谔振子的能量本征值、本征态及热性质。\n2. 其技术核心在于通过微扰论得到本征系统的一阶修正，并利用二维Bopp-shift将位置依赖的非对易问题映射为对易空间问题。\n3. 所得能级偏移与动态非对易参数τ的依赖关系，以及数值解析揭示的热力学行为，可为考察非对易量子系统的统计物理提供参考。", "summary_source": "deepseek", "authors": [{"name": "Ilyas Haouam"}], "featured_authors": [{"name": "Ilyas Haouam"}], "author_count": 1}, {"id": "2607.04586", "category": "quant-ph", "title": "QuTuner: Feature- and Learning-Guided Optimization Pass Tuning for Quantum Compilers", "abstract": "Quantum compilers play a key role in transforming quantum circuits into lower-cost implementations with improved execution fidelity. This process is commonly guided by circuit-level metrics, such as gate counts and circuit depth. Although compiler pass tuning has been widely studied in classical compilation, directly transferring these techniques to quantum compilers is challenging, because quantum programs are expressed as circuits and exhibit optimization behaviors that are shaped by quantum-specific structures. Prior quantum compiler tuning approaches have begun to use circuit features to guide pass selection, but they remain limited in two aspects: they search only a small portion of the optimization-pass space, and they mainly rely on static features that do not explicitly reflect how a circuit reacts to compiler optimizations. We present QuTuner, a feature-guided quantum compiler pass tuning framework that generalizes across compilers and tuning objectives. QuTuner first builds a large optimization dataset. It then characterizes each circuit from two complementary views: static circuit features that describe circuit structure, and optimization-aware pass embeddings that summarize the circuit's responses to individual optimization passes. Using these representations, QuTuner trains two offline models to retrieve and rank candidate pass sequences for unseen circuits, followed by lightweight refinement. We evaluate QuTuner on Qiskit and PyTKET using two benchmark suites. On Qiskit, QuTuner improves the evaluation-metric reduction by up to 84.85% over the strongest baseline while reducing tuning time by 73.59%. On PyTKET, it improves metric reduction by up to 18.68% with a 64.49% reduction in tuning time. These results show that QuTuner provides an effective approach to adaptive pass tuning for quantum compilers.", "url": "https://arxiv.org/abs/2607.04586", "type": "理论+数值", "summary": "1. 该工作提出QuTuner，一个特征与学习引导的量子编译器通行调优框架，通过构建大规模优化数据集并采用静态电路特征与优化感知通行嵌入的双重视图表征，实现跨编译器与目标的泛化。\n2. 其技术卖点是训练离线检索与排序模型，利用电路结构和优化响应联合表征高效筛选候选通行序列，辅以轻量精炼，显著提升指标改进幅度与调优速度。\n3. 实验在Qiskit和PyTKET上分别实现最高84.85%和18.68%的指标改进，同时降低调优时间73.59%和64.49%，为自适应量子编译提供了有效且实用的方案。", "summary_source": "deepseek", "authors": [{"name": "Ming Zhong"}, {"name": "Xiangyu Ren"}, {"name": "Jinglei Cheng"}, {"name": "Shaohua Li"}, {"name": "Zhiding Liang"}], "featured_authors": [{"name": "Ming Zhong"}, {"name": "Xiangyu Ren"}, {"name": "Jinglei Cheng"}, {"name": "Shaohua Li"}, {"name": "Zhiding Liang"}], "author_count": 5}, {"id": "2607.04598", "category": "quant-ph", "title": "Breaking the One-Dimensional Expressibility-Trainability Tradeoff", "abstract": "Expressive parameterized quantum circuits (PQCs) are often designed under a dilemma: the growth of expressibility and entangling power (EP) that improves Hilbert-space coverage is also expected to randomize an ansatz and activate barren-plateau (BP) conditions. We show that this dilemma is not a one-dimensional tradeoff. The usual picture collapses three inequivalent objects -- parameter-ensemble coverage, fixed-circuit entangling response, and local gradient moments -- into one scalar narrative. For a fixed circuit probed by Haar-product inputs, EP is a global two-copy mean of the output-entanglement distribution, whereas entangling-power deviation (EPD) is a global four-copy fluctuation descriptor. Gradient variance, however, is a local two-copy contraction selected by a parameter light cone and a cost observable. This moment hierarchy yields an analytic separation: equal EP need not imply equal trainability, as witnessed by equal-EP circuits with different EPDs and different gradient variances. These separations turn EP and EPD into a two-dial design rule for PQC ansatzes: EP measures how far the circuit has moved along the coverage dial, while EPD monitors whether input-dependent variability remains. We find that ansatz routes can reach high, Haar-like coverage before EPD and gradient variance collapse, showing that coverage and BP activation are distinct crossover events. The EP/EPD framework thus breaks the apparent one-dimensional expressibility-trainability tradeoff into a practical design rule: search for highly expressive PQCs in the window where coverage is high but BP-like homogenization has not yet erased trainable structure.", "url": "https://arxiv.org/abs/2607.04598", "type": "理论", "summary": "1. 该工作通过解析矩层次，打破了参数化量子电路中可表达性与可训练性之间的一维权衡认知。\n2. 其核心在于将全局双拷贝平均的纠缠功率与四拷贝涨落的纠缠功率偏差分离，证明后者独立控制梯度方差，使高希尔伯特空间覆盖与贫瘠高原激活成为不同交叉事件。\n3. 这为设计兼具高表达性和可训练性的量子电路提供了以纠缠功率和纠缠功率偏差为独立旋钮的两参数工程准则。", "summary_source": "deepseek", "authors": [{"name": "Kyoungho Cho"}, {"name": "Yu-Seong Jeon"}, {"name": "Jinhyoung Lee"}, {"name": "Jeongho Bang"}], "featured_authors": [{"name": "Kyoungho Cho"}, {"name": "Yu-Seong Jeon"}, {"name": "Jinhyoung Lee"}, {"name": "Jeongho Bang"}], "author_count": 4}, {"id": "2607.04669", "category": "quant-ph", "title": "Estimation of a sparse multi-qubit Hamiltonian via compressed sensing", "abstract": "Hamiltonian estimation is an effective approach in studying the structure and dynamical evolution of quantum systems. The difficulty in estimating the Hamiltonian is that an $N$-qubit Hamiltonian has $4^N-1$ unknown parameters, requiring exponentially many equations for information extraction. In this paper we develop a method based on compressed sensing to estimate the Hamiltonian of a multi-qubit system. We identify a problem where as $N$ increases, the common sufficient condition (Restricted Isometry Property) for compressed sensing often fails, obstructing the application of compressed sensing in ($N\\geq 3$)-qubit Hamiltonian estimation. To solve this problem, we propose a ``scale transformation\" technique to restore RIP and ensure a compressive estimation of a $k$-sparse Hamiltonian using only $O(k\\log(4^N/k))$ equations. In the numerical examples, we estimate the Hamiltonians of two 6- and 30-qubit systems, demonstrating the effectiveness of the method.", "url": "https://arxiv.org/abs/2607.04669", "type": "理论+数值", "summary": "1. 该工作提出基于压缩感知的多量子比特稀疏哈密顿量估计方法，解决指数级参数爆炸问题。\n2. 其核心在于引入“尺度变换”技术恢复受限等距性质，仅需O(k log(4^N/k))个方程即可实现k-稀疏哈密顿量的高效重建。\n3. 该方法为大规模量子系统（如30比特）的哈密顿量估计提供了可行途径，尤其适用于高维稀疏相互作用体系。", "summary_source": "deepseek", "authors": [{"name": "Juntao Tu"}, {"name": "Yuanlong Wang"}, {"name": "Shuming Cheng"}, {"name": "Shuixin Xiao"}, {"name": "Zhibo Hou"}], "featured_authors": [{"name": "Juntao Tu"}, {"name": "Yuanlong Wang"}, {"name": "Shuming Cheng"}, {"name": "Shuixin Xiao"}, {"name": "Zhibo Hou"}], "author_count": 5}, {"id": "2607.04721", "category": "quant-ph", "title": "Mapping open quantum dynamics onto graphs", "abstract": "Graph-theoretic frameworks have been widely employed in quantum physics to address the high-dimensional complexity of quantum systems. Although open quantum dynamics incorporates system-bath coupling via numerous interacting operators, it has been formulated algebraically with a partial set of jump operators or statistically universal reservoirs, leaving the underlying connectivity structure largely unexplored. Here, we propose a universal graph-theoretic framework for Markovian quantum dynamics. The framework maps open quantum dynamics onto two uniquely defined graphs, where the quantum master equation is rigorously interpreted as the average wave characteristic of operator-valued signals across the graphs. Applying this framework to the open quantum Rabi model, we demonstrate an open-system generalization of Fock-state lattices, characterize graph-topological signatures of dissipation, and classify the weak-to-ultrastrong coupling transition. Building on these representations, graph pruning reveals the backbone of open quantum dynamics, which enables superior graph neural-network learning. Our results bridge graph theory and open quantum dynamics, achieving efficient data-driven analysis of high-dimensional complexity.", "url": "https://arxiv.org/abs/2607.04721", "type": "理论", "summary": "1. 该工作提出了将马尔可夫开放量子动力学映射到两个唯一图上的通用图论框架。\n2. 其核心在于将量子主方程严格解释为算符值信号在图上的平均波特性，并揭示了耗散的图拓扑特征及弱到超强耦合转变。\n3. 这为利用图剪枝提取动力学骨干并借助图神经网络实现高维开放量子系统的数据驱动分析提供了有效途径。", "summary_source": "deepseek", "authors": [{"name": "Kyuho Kim"}, {"name": "Dayeong Lee"}, {"name": "Seungkyun Park"}, {"name": "Xianji Piao"}, {"name": "Namkyoo Park"}, {"name": "Sunkyu Yu"}], "featured_authors": [{"name": "Kyuho Kim"}, {"name": "Dayeong Lee"}, {"name": "Seungkyun Park"}, {"name": "Xianji Piao"}, {"name": "Namkyoo Park"}, {"name": "Sunkyu Yu"}], "author_count": 6}, {"id": "2607.04736", "category": "quant-ph", "title": "Magnetic graphs for cavity quantum electrodynamics", "abstract": "Strengthening light-matter coupling has become a central challenge in cavity quantum electrodynamics (QED), enabling ultrafast gate operations, qubit protection, and deterministic nonlinear optics. As the coupling increases, even the simplest configuration, a two-level atom interacting with a quantized field, requires careful treatment, as exemplified by the gauge-invariant quantum Rabi model (QRM). Here we propose a magnetic graph model for single-atom cavity QED, which enables the interpretation of quantum dynamics across the ultrastrong coupling regime through graph connectivity. We demonstrate that the generalized QRM maps onto a complex bipartite graph of identical sites under Floquet boundary conditions. This framework captures the crossover from weak to deep-strong coupling via a single metric: the cost of disconnecting a nonmagnetic subgraph. We examine the mechanism underlying this connectivity transition, establishing phase frustration induced by subgraph topology as the primary driver. Scalable to many-body systems, this approach bridges graph theory and cavity QED, revealing highly complex-graph dynamics even in the simplest setting.", "url": "https://arxiv.org/abs/2607.04736", "type": "理论", "summary": "1. 该工作提出一个磁性图模型，将单原子腔量子电动力学中的广义量子拉比模型映射为Floquet边界条件下全同格点上的复杂二分图。\n2. 其卖点在于通过图连通性跃迁解释从弱耦合到深强耦合的动力学交叉，以断开非磁性子图的成本作为单一度量，并揭示子图拓扑所致的相位挫折为物理机制。\n3. 这为腔量子电动力学的超强耦合现象提供了图论视角，且框架可扩展至多体系统，即便在最简设定中亦呈现高度复杂的图动力学。", "summary_source": "deepseek", "authors": [{"name": "Sunkyu Yu"}, {"name": "Xianji Piao"}, {"name": "Namkyoo Park"}], "featured_authors": [{"name": "Sunkyu Yu"}, {"name": "Xianji Piao"}, {"name": "Namkyoo Park"}], "author_count": 3}, {"id": "2607.04845", "category": "quant-ph", "title": "HamQASBench:
